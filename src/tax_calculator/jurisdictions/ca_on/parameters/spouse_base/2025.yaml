# Ontario spouse or common-law partner amount, base amount, 2025 tax year (Form ON428, form
# 5006-C): line 11 "Base amount 11,905.00", from which line 13 (line 58120) "Line 11 minus
# line 12 (if negative, enter "0") (maximum $10,823)" takes line 12 "Your spouse's or
# common-law partner's net income from line 23600 of their return". It borrows the credit
# kind because it is claimed whole, as the basic reduction is.
# Line 11 is a dollars-and-cents box, so the amount rounds half-up to the cent, the owner's
# decision, as the form states no rounding rule.
family: ca-on/spouse_base
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-c/5006-c-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "11905.00"
