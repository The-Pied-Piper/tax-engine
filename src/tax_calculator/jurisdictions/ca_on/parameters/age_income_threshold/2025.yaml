# Ontario age amount, income threshold, 2025 tax year (Worksheet ON428, form 5006-D): "Line
# 58080 - Age amount (if you were born in 1960 or earlier)", line 3 "Income threshold
# 46,330.00", from which line 4 "Line 2 minus line 3 (if negative, enter "0")" takes line 2
# "Amount from line 23600 of your return". It borrows the credit kind because it is a
# printed amount taken whole, as the basic reduction is.
# Line 3 is a dollars-and-cents box, so the amount rounds half-up to the cent, the owner's
# decision, as the form states no rounding rule.
family: ca-on/age_income_threshold
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-d/5006-d-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "46330.00"
