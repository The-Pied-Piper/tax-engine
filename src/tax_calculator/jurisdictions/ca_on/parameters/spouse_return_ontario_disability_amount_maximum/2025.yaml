# Largest disability amount transferred from a spouse, 2025 tax year (Worksheet ON428, form
# 5006-D): "Line 58440 - Disability amount for self", "Line 7: Line 1 plus line 6 Enter this amount
# on line 58440 of your Form ON428. (maximum $16,305)", the maximum that Schedule ON(S2) line 3 and
# line 59070 "Enter the amount from line 58440 of their Form ON428." is checked against. An amount
# above it is an input error, not capped. It borrows the credit kind because it is claimed whole,
# as the age maximum is.
# It is a dollars-and-cents box, so the amount rounds half-up to the cent, the owner's decision,
# as the form states no rounding rule.
family: ca-on/spouse_return_ontario_disability_amount_maximum
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-d/5006-d-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "16305.00"
