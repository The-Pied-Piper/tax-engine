# Separate sheet threshold of the Ontario provincial foreign tax credit, 2025 tax year (Form
# T2036, Provincial or Territorial Foreign Tax Credit): "If you paid tax to more than one foreign
# country, and the total of the non-business income taxes that you paid to all foreign countries
# was more than $200, do the calculation on a separate form for each country in Canadian
# dollars." Line 2 "Enter the amount from line 3 of Form T2209, unless you have to pay minimum
# tax.(1)" and note (1), for a resident of Ontario at the end of the year: "If the total
# non-business income taxes you paid to all foreign countries is $200 or less:" line 1 of the
# form over the sum of line 1 and line 8 of Part 4 of Form T691, times the special foreign tax
# credit on line 11; "If the total non-business income taxes you paid to all foreign countries is
# more than $200, you must calculate for each country:". The $200 is taken as printed.
# The form is a PDF with no published .txt, so the dataset cites the PDF.
family: ca-on/provincial_foreign_tax_credit_separate_sheet_threshold
tax_year: 2025
kind: amount
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2036/t2036-25e.pdf
rounding: {increment: "0.01", mode: half_up}
amount: "200"
