# Ontario adoption expenses maximum, 2025 tax year (Form ON428, form 5006-C), line 23 and line
# 58330 "Adoption expenses": the line has no maximum printed on it. Form T2203 (2025), note (5)
# to its Ontario and Manitoba amounts: "If you were a resident of Ontario, you can claim up to
# $15,551 of eligible expenses for each child in the year the adoption is finalized or recognized
# under Ontario law."
# Each child's eligible expenses are capped at this amount, a dollars-and-cents figure on the
# claim, so it rounds half-up to the cent, the owner's decision, as the form states no rounding
# rule.
family: ca-on/adoption_expenses_maximum
tax_year: 2025
kind: amount
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-c/5006-c-25e.txt
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2203/t2203-25e.pdf
rounding: {increment: "0.01", mode: half_up}
amount: "15551"
