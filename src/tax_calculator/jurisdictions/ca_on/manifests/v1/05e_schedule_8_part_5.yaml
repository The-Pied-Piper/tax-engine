# Form Schedule 8 (ca/schedule_8), Parts 3a to 5: see 05c_schedule_8_part_3.yaml.
form:
  name: ca/schedule_8
capabilities:
  # Schedule 8 Part 3 line 2 "Line 2: Enter whichever is less: amount from line D of Part 2 or
  # line 1.": line 1 is the total CPP pensionable earnings from box 26 of all of the T4 slips
  # (the input ca/t4_cpp_pensionable_earnings_outside_quebec, Part 3 line 1 and line 50339), not
  # the employment income. Part 5 line 32 is "Amount from line 2 of Part 3".
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/cpp_additional_maximum_pensionable_earnings
        - ca/t4_cpp_pensionable_earnings_outside_quebec
    produces:
      output: ca/cpp_part_3_line_2
  # Schedule 8 Part 5 line 1 "Line 1: amount from line 12200 of your return plus line 27 of your
  # return" (the pensionable net self-employment earnings, as Part 4 line 1), line 2 and line
  # 50373 "Employment earnings not shown on a T4 slip that you are electing to pay additional CPP
  # contributions on (complete Form CPT20)", line 3 and line 50399 "Employment earnings shown on a
  # T4 slip that you are electing to pay additional CPP contributions on (complete Form CPT20)",
  # and line 4 "Line 4: Add lines 1 to 3. =". No floor is printed, so a loss on line 1 stays
  # negative. Lines 1 to 3 have no step of their own.
  - name: core/sum
    consumes:
      parts:
        - ca/pensionable_net_self_employment_earnings
        - ca/cpt20_earnings
        - ca/cpt20_t4_earnings
    produces:
      output: ca/cpp_part_5_line_4
  # Schedule 8 Part 5 line 6 "Line 6: Enter the amount from line 20 of Part 3 if positive. If not,
  # enter "0".": line 20 of Part 3 less "0", not below zero.
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/cpp_base_and_first_additional_contributions_difference
      less: ca/cpp_zero
    produces:
      output: ca/cpp_part_5_line_6
  # Schedule 8 Part 5 line 5 "Line 5: Total actual base and first additional contributions from
  # line 8 of Part 3" (the T4 box 16 total, copied directly, no step) and line 7 "Line 7: Line 5
  # minus line 6 =".
  - name: core/subtract
    consumes:
      amount: ca/cpp_t4_base_and_first_additional_contributions
      less: ca/cpp_part_5_line_6
    produces:
      output: ca/cpp_part_5_line_7
  # Schedule 8 Part 5 line 8 "Line 8: Enter the amount from line 20 of Part 3 as a positive
  # amount.": "0" less line 20 of Part 3, not below zero (0 when line 20 is not negative).
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/cpp_zero
      less: ca/cpp_base_and_first_additional_contributions_difference
    produces:
      output: ca/cpp_part_5_line_8
  # Schedule 8 Part 5 "If the amount from line 20 of Part 3 is negative and line 23 of Part 3 is
  # positive, complete lines 8 and 9. If not, enter "0" on line 9 and continue at line 10.": counts
  # 1 when line 8 (line 20 as a positive amount) and line 23 of Part 3 are both more than 0.
  - name: ca/count_by_conditions
    params:
      conditions: ca/cpp_part_5_line_20_negative_line_23_positive_conditions
    consumes:
      counts: []
      amounts:
        - ca/cpp_part_5_line_8
        - ca/cpp_second_additional_contributions_difference
    produces:
      output: ca/cpp_part_5_line_20_negative_line_23_positive
  # Schedule 8 Part 5 line 9 "Line 9: Enter whichever is less: amount from line 23 of Part 3 or
  # line 8.": the lesser of the two, a candidate that line 9 takes only when the count applies.
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/cpp_second_additional_contributions_difference
        - ca/cpp_part_5_line_8
    produces:
      output: ca/cpp_part_5_line_9_lesser
  # Schedule 8 Part 5 line 9 "If not, enter "0" on line 9": the lesser when lines 8 and 9 are
  # completed, else "0".
  - name: core/choose_by_count
    consumes:
      count: ca/cpp_part_5_line_20_negative_line_23_positive
      when_none: ca/cpp_zero
      when_any: ca/cpp_part_5_line_9_lesser
    produces:
      output: ca/cpp_part_5_line_9
  # Schedule 8 Part 5 line 10 "Line 10: Line 7 plus line 9 =".
  - name: core/sum
    consumes:
      parts:
        - ca/cpp_part_5_line_7
        - ca/cpp_part_5_line_9
    produces:
      output: ca/cpp_part_5_line_10
  # Schedule 8 Part 5 line 12 "Line 12: Enter the amount from line 23 of Part 3 if positive. If
  # not, enter "0".": line 23 of Part 3 less "0", not below zero.
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/cpp_second_additional_contributions_difference
      less: ca/cpp_zero
    produces:
      output: ca/cpp_part_5_line_12
  # Schedule 8 Part 5 line 11 "Line 11: Total actual second additional contributions from line 21
  # of Part 3" (the T4 box 16A total, copied directly, no step) and line 13 "Line 13: Line 11 minus
  # line 12 =".
  - name: core/subtract
    consumes:
      amount: ca/cpp_t4_second_additional_contributions
      less: ca/cpp_part_5_line_12
    produces:
      output: ca/cpp_part_5_line_13
  # Schedule 8 Part 5 line 14 "Line 14: Enter the amount from line 23 of Part 3 as a positive
  # amount.": "0" less line 23 of Part 3, not below zero (0 when line 23 is not negative).
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/cpp_zero
      less: ca/cpp_second_additional_contributions_difference
    produces:
      output: ca/cpp_part_5_line_14
  # Schedule 8 Part 5 "If the amount from line 20 of Part 3 is positive and line 23 of Part 3 is
  # negative, complete lines 14 and 15. If not, enter "0" on line 15 and continue at line 16.":
  # counts 1 when line 20 of Part 3 and line 14 (line 23 as a positive amount) are both more than 0.
  - name: ca/count_by_conditions
    params:
      conditions: ca/cpp_part_5_line_20_positive_line_23_negative_conditions
    consumes:
      counts: []
      amounts:
        - ca/cpp_base_and_first_additional_contributions_difference
        - ca/cpp_part_5_line_14
    produces:
      output: ca/cpp_part_5_line_20_positive_line_23_negative
  # Schedule 8 Part 5 line 15 "Line 15: Enter whichever is less: amount from line 20 of Part 3 or
  # line 14.": the lesser of the two, a candidate that line 15 takes only when the count applies.
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/cpp_base_and_first_additional_contributions_difference
        - ca/cpp_part_5_line_14
    produces:
      output: ca/cpp_part_5_line_15_lesser
  # Schedule 8 Part 5 line 15 "If not, enter "0" on line 15": the lesser when lines 14 and 15 are
  # completed, else "0".
  - name: core/choose_by_count
    consumes:
      count: ca/cpp_part_5_line_20_positive_line_23_negative
      when_none: ca/cpp_zero
      when_any: ca/cpp_part_5_line_15_lesser
    produces:
      output: ca/cpp_part_5_line_15
  # Schedule 8 Part 5 line 16 "Line 16: Line 13 plus line 15 =".
  - name: core/sum
    consumes:
      parts:
        - ca/cpp_part_5_line_13
        - ca/cpp_part_5_line_15
    produces:
      output: ca/cpp_part_5_line_16
  # Schedule 8 Part 5 line 17 "Line 17: Amount from line B of Part 2" and line 18 "Line 18: Amount
  # from line E of Part 2" (both copied directly, no step), and line 19 "Line 19: Line 17 minus
  # line 18 (if negative, enter "0") (maximum $67,800) =": the maximum pensionable earnings less
  # the basic exemption, not below zero. The form's $67,800 is the full-year maximum.
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/cpp_maximum_pensionable_earnings
      less: ca/cpp_basic_exemption
    produces:
      output: ca/cpp_part_5_line_19
  # Schedule 8 Part 5 line 20 "Line 20: Amount from line 10 multiplied by 16.80672 =": 16.80672 is
  # more than 1, so it is a fraction dataset, not a rate.
  - name: core/apply_fraction
    params:
      fraction: ca/cpp_part_5_line_20_multiplier
    consumes:
      base: ca/cpp_part_5_line_10
    produces:
      output: ca/cpp_part_5_line_20
  # Schedule 8 Part 5 line 21 "Line 21: Line 19 minus line 20 (if negative, enter "0") =".
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/cpp_part_5_line_19
      less: ca/cpp_part_5_line_20
    produces:
      output: ca/cpp_part_5_line_21
  # Schedule 8 Part 5 line 22 "Line 22: Enter whichever is less: amount from line 4 or line 21.".
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/cpp_part_5_line_4
        - ca/cpp_part_5_line_21
    produces:
      output: ca/cpp_part_5_line_22
  # Schedule 8 Part 5 line 25 "Line 25: Line 23 minus line 24 (if negative, enter "0" on lines 25
  # and 29, and continue at line 30) =", with line 23 "Amount from line 18" (the basic exemption,
  # copied directly, no step) and line 24 "Amount from line 1 of Part 3" (the box 26 total, the
  # input ca/t4_cpp_pensionable_earnings_outside_quebec, copied directly, no step). The gate "If
  # the amount from line 1 of Part 3 is less than line 18, complete lines 23 to 29. If not, enter
  # "0" on line 29 and continue at line 30." needs no count here: when the box 26 total is not
  # less than line 18, line 25 is 0 and so is line 29.
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/cpp_basic_exemption
      less: ca/t4_cpp_pensionable_earnings_outside_quebec
    produces:
      output: ca/cpp_part_5_line_25
  # Schedule 8 Part 5 line 28 "Line 28: Line 26 minus line 27 (if negative, enter "0") =", with
  # line 26 "Amount from line 4" and line 27 "Amount from line 19" (both copied directly, no step).
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/cpp_part_5_line_4
      less: ca/cpp_part_5_line_19
    produces:
      output: ca/cpp_part_5_line_28
  # Schedule 8 Part 5 line 29 "Line 29: Line 25 minus line 28 (if negative, enter "0") =". It is 0
  # when line 1 of Part 3 is not less than line 18, because line 25 is then 0 (see line 25 above).
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/cpp_part_5_line_25
      less: ca/cpp_part_5_line_28
    produces:
      output: ca/cpp_part_5_line_29
  # Schedule 8 Part 5 line 30 "Line 30: Self-employment income and other earnings subject to base
  # and first additional contributions: Line 22 minus line 29 (if negative, enter "0") =".
  # Read by line 43 (and line 44).
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/cpp_part_5_line_22
      less: ca/cpp_part_5_line_29
    produces:
      output: ca/cpp_part_5_line_30
  # Schedule 8 Part 5 line 31 "Line 31: Amount from line 4" (copied directly, no step), line 32
  # "Line 32: Amount from line 2 of Part 3" (the Part 3 line 2 amount above) and line 33 "Line 33:
  # Line 31 plus line 32 =".
  - name: core/sum
    consumes:
      parts:
        - ca/cpp_part_5_line_4
        - ca/cpp_part_3_line_2
    produces:
      output: ca/cpp_part_5_line_33
  # Schedule 8 Part 5 "If the amount from line 33 is more than line 17, complete lines 34 to 42. If
  # not, enter "0" on line 42 and continue at line 43.": counts 1 when line 33 is more than line 17.
  - name: ca/count_by_conditions
    params:
      conditions: ca/cpp_part_5_line_33_more_than_line_17_conditions
    consumes:
      counts: []
      amounts:
        - ca/cpp_part_5_line_33
        - ca/cpp_maximum_pensionable_earnings
    produces:
      output: ca/cpp_part_5_line_33_more_than_line_17
  # Schedule 8 Part 5 line 35 "Line 35: Amount from line 16 divided by 4% =".
  - name: ca/divided_by_rate
    params:
      rate: ca/cpp_part_5_line_35_rate
    consumes:
      dividend: ca/cpp_part_5_line_16
    produces:
      output: ca/cpp_part_5_line_35
  # Schedule 8 Part 5 line 34 "Line 34: Amount from line C of Part 2" (copied directly, no step) and
  # line 36 "Line 36: Line 34 minus line 35 =". Signed: the form prints no floor.
  - name: core/subtract
    consumes:
      amount: ca/cpp_second_additional_earnings_maximum
      less: ca/cpp_part_5_line_35
    produces:
      output: ca/cpp_part_5_line_36
  # Schedule 8 Part 5 line 37 "Line 37: Amount from line 4" and line 38 "Line 38: Amount from line
  # 25 (if any)" (both copied directly, no step), and line 39 "Line 39: Line 37 minus line 38 =".
  # Signed: the form prints no floor.
  - name: core/subtract
    consumes:
      amount: ca/cpp_part_5_line_4
      less: ca/cpp_part_5_line_25
    produces:
      output: ca/cpp_part_5_line_39
  # Schedule 8 Part 5 line 40 "Line 40: Amount from line 30" (copied directly, no step) and line 41
  # "Line 41: Line 39 minus line 40 =". Signed: the form prints no floor.
  - name: core/subtract
    consumes:
      amount: ca/cpp_part_5_line_39
      less: ca/cpp_part_5_line_30
    produces:
      output: ca/cpp_part_5_line_41
  # Schedule 8 Part 5 line 42 "Line 42: Enter whichever is less: amount from line 36 or line 41.":
  # the lesser of the two, a candidate that line 42 takes only when the count of line 33 more than
  # line 17 applies.
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/cpp_part_5_line_36
        - ca/cpp_part_5_line_41
    produces:
      output: ca/cpp_part_5_line_42_lesser
  # Schedule 8 Part 5 line 42 "If not, enter "0" on line 42": the lesser when line 33 is more than
  # line 17, else "0". Signed: the form prints no floor, so a negative lesser stays negative. Read
  # by line 45.
  - name: core/choose_by_count
    consumes:
      count: ca/cpp_part_5_line_33_more_than_line_17
      when_none: ca/cpp_zero
      when_any: ca/cpp_part_5_line_42_lesser
    produces:
      output: ca/cpp_part_5_line_42
