# Form T2125 (ca/t2125), the partner checks: see 03b_t2125.yaml for the form's selections and
# exports. The partner answer is a yes or no answer, checked to be 0 or 1 before the choice of
# 03b_t2125.yaml reads it. Run once for each statement.
form:
  name: ca/t2125
capabilities:
  # T2125 Part 5 "Your share of line 9369 or the amount from your T5013 slip, Statement of
  # Partnership Income. 5A": the answer to a yes or no question, a count of 1 or 0, checked before
  # the choice that reads it. A count of 2 or more is refused, not capped.
  - name: ca/yes_or_no_count
    consumes:
      count: ca/business_partner
    produces:
      output: ca/business_partner_checked
