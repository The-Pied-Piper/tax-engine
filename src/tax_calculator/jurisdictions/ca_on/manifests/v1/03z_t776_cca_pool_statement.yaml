# Form T776 (ca/t776), the statement's figures for the CCA limit over all statements: see
# 03e_t776.yaml for the form's selections and exports, and 03z_t776_cca_limit_all_statements.yaml
# for the limit. Guide T4036, "Limits on CCA": "If you own more than one rental property, you have
# to calculate your overall net income or loss for the year from all your rental properties before
# you can claim CCA. If you are a partner, include the net rental income or loss from your T5013
# slip in the calculation." (Guide T4036 p.26, confirmed 2026-10-27 from the PDF; no .txt
# published.) IT-195R4 (docs/cra-forms-2025/web/it195r4-rental-property-cca-restrictions.txt, web
# page) para 10: "A partnership that is subject to the CCA restriction calculates the amount of CCA
# it can claim and allocates the resulting net rental income or loss among the members of the
# partnership. ... The share of partnership rental income or loss allocated to the member will be
# combined with the total rental income or loss after expenses, but before CCA, from the member's
# own rental properties. CCA may be claimed on the member's rental properties (subject to
# prescribed rates) only to the extent of that combined rental income, if any." So every partner
# statement (a partner answer of 1, with a T5013 slip or without) contributes its line 7, amount 7
# ("your share of amount 6, or the amount from your T5013 slip"), alone: the allocated share is
# already the result after the partnership's CCA. An owner or co-owner (a partner answer of 0)
# contributes amount 5. A statement with both answers yes counts as a partner: amount 7 alone,
# without the co-owner's share.
# The CCA claimed on the person's own properties is tested against that limit. IT-195R4
# (docs/cra-forms-2025/web/it195r4-rental-property-cca-restrictions.txt, web page) para 2: "The
# entire CCA claim for all the properties must not exceed the total of the rental income from all
# properties less the total of the rental losses from the properties." A partner statement's own
# line 9936 is the partnership's depreciation allocated to the partner, already inside amount 7,
# not a claim on the partner's own properties; Guide T4036 p.26 (confirmed 2026-10-27
# from the PDF; no .txt published): "If you are a member of a partnership, the amount of CCA you
# can claim has already been determined by the partnership."
form:
  name: ca/t776
capabilities:
  # Guide T4036 "Limits on CCA", the statement's net rental income or loss before CCA: amount 5
  # ("Line 5: Subtotal (amount 4 minus line 9948)") for an owner or co-owner (a partner answer of
  # 0), or for a partner (a count of 1) amount 7 alone: Guide T4036 p.26 "include the net rental
  # income or loss from your T5013 slip"; IT-195R4 (docs/cra-forms-2025/web/
  # it195r4-rental-property-cca-restrictions.txt, web page) para 10, the share "will be combined
  # with the total rental income or loss after expenses, but before CCA"; Regulation
  # 1100(11)(b) and (d) as printed there, "to the extent of the taxpayer's share of such
  # income". Lines 9943 and 9974 are the partner's own and are not part of the share.
  - name: core/choose_by_count
    consumes:
      count: ca/rental_partner_checked
      when_none: ca/rental_net_income_after_terminal_loss
      when_any: ca/rental_partner_amount_7
    produces:
      output: ca/rental_income_before_cca
  # Zero. No dataset or other artifact of the form is a zero (the form prints none; the zero of
  # Schedule 8, `ca/schedule_8_zero`, is that form's printed "0"), so this one is made from the
  # amount ii of Area A: its negation is never above zero, since amount ii is never below zero, and
  # the positive part of a figure not above zero is exactly 0 (`ca/positive_part_of_negation`). It
  # is the claim on the own properties of a partner statement.
  - name: ca/positive_part_of_negation
    consumes:
      amount: ca/rental_cca_table_claim
    produces:
      output: ca/rental_no_cca_claim
  # IT-195R4 (docs/cra-forms-2025/web/it195r4-rental-property-cca-restrictions.txt, web page) para
  # 2: the CCA claim of the person's own properties, line 9936 for an owner or co-owner (a partner
  # answer of 0), or 0 for a partner (a count of 1), whose line 9936 is the partnership's
  # depreciation, already inside amount 7 (para 10 of the same bulletin).
  - name: core/choose_by_count
    consumes:
      count: ca/rental_partner_checked
      when_none: ca/rental_cca_claim
      when_any: ca/rental_no_cca_claim
    produces:
      output: ca/rental_cca_claim_on_own_properties
