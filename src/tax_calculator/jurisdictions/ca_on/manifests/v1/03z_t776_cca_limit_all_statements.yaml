# The CCA limit over all rental statements: one limit for the person across the statements of Form
# T776. Guide T4036, "Limits on CCA": "If you own more than one rental property, you have to
# calculate your overall net income or loss for the year from all your rental properties before you
# can claim CCA. ... Combine the rental income and loss from all your properties, even if they
# belong to different classes. ... You cannot use CCA to create or increase a rental loss." Example:
# net rental income of 1,500, 2,000 and (4,000) is an overall loss of (500), so "he cannot claim any
# CCA on his rental buildings or appliances". No limit applies to one statement alone: this total
# refuses the claims added together above the overall figure.
# The claim is the caller's and stays an input: the check refuses a total above the limit and never
# picks the claim.
capabilities:
  # Guide T4036 "Combine the rental income and loss from all your properties": the total of each
  # statement's net rental income or loss before CCA, over the statements of the form.
  - name: core/record_total
    consumes:
      records: ca/t776.rental_income_before_cca
    produces:
      output: ca/rental_income_before_cca_total
  # Guide T4036 "You cannot use CCA to create or increase a rental loss": the most the CCA of all
  # the statements may be is the overall figure, or 0 when it is negative.
  - name: core/sum_not_below_zero
    consumes:
      parts:
        - ca/rental_income_before_cca_total
    produces:
      output: ca/rental_cca_limit_all_statements
  # T776 "Line 9936: Total CCA claim for the year" on the person's own properties (IT-195R4
  # (docs/cra-forms-2025/web/it195r4-rental-property-cca-restrictions.txt, web page) para 2),
  # over the statements of the form: a partner statement's line 9936 is not in it.
  - name: core/record_total
    consumes:
      records: ca/t776.rental_cca_claim_on_own_properties
    produces:
      output: ca/rental_cca_claims_total
  # The claims of every statement together, refused when above the overall limit, not capped.
  - name: core/at_most
    consumes:
      amount: ca/rental_cca_claims_total
      bound: ca/rental_cca_limit_all_statements
    produces:
      output: ca/rental_cca_total_claim
