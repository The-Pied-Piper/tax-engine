  # the days in 2024 over the days of the fiscal period, rounded to the cent.
  - name: ca/prorated_by_days_in_period
    params:
      rounding: ca/farm_chart_b_row_11_rounding
    consumes:
      amount: ca/farm_chart_b_row_9_mb
      days: ca/farm_days_in_2024
