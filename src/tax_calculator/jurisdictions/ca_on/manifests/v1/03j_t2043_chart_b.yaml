    consumes:
      dividend: ca/farm_chart_b_salaries_sk
      divisor: ca/farm_chart_b_total_salaries
    produces:
      output: ca/farm_chart_b_row_6_sk
  # Form T2043 Chart B row 7 "Total percentage (%) of expenses. Row 3 plus row 6" (Saskatchewan):
