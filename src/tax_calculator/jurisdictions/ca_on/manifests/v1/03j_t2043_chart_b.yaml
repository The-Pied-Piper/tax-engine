  # times the days in 2024 over the days of the fiscal period, rounded to the cent.
  - name: ca/prorated_by_days_in_period
    params:
      rounding: ca/farm_chart_b_row_11_rounding
    consumes:
      amount: ca/farm_chart_b_row_9_sk
      days: ca/farm_days_in_2024
      period_days: ca/farm_fiscal_period_days
    produces:
      output: ca/farm_chart_b_row_11_sk
  # Form T2043 Chart B row 3 "Percentage (%) of gross income allocated to the designated province.
  # Row 1 divided by row 2" (Alberta): row 1 of AB over row 2.
  - name: ca/percentage_of
    params:
      rounding: ca/farm_chart_b_percentage_rounding
    consumes:
      dividend: ca/farm_chart_b_gross_income_ab
      divisor: ca/farm_chart_b_total_gross_income
    produces:
      output: ca/farm_chart_b_row_3_ab
  # Form T2043 Chart B row 6 "Percentage (%) of salaries and wages allocated to the designated
  # province. Row 4 divided by row 5" (Alberta): row 4 of AB over row 5.
  - name: ca/percentage_of
    params:
