      percentage: ca/farm_chart_b_row_8_sk
    produces:
      output: ca/farm_chart_b_row_9_sk
  # Form T2043 Chart B rows 10 and 11 "Total number of days in the fiscal period that fall within
  # the 2024 calendar year divided by the total number of days in the fiscal period" and "Portion of
  # eligible farming expenses of the farming business allocated to the designated province
