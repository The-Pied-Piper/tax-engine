# Condition under which the count of Form T691 Part 1 line 59 filled in by a resident of Ontario is
# refused, 2025 tax year: line 59 is "(Quebec only)", the deduction of the PPIP premiums on line 22300
# of the return, which a resident of Ontario on December 31, 2025 does not have, so a count of 1
# (`ca/amt_ppip_premiums_in_ontario`) is an input error, not a deduction added to line 63. The form
# prints no refusal; it is the guard of this check. The count is 1 when it applies and 0 otherwise.
# The count is a count, not a dollars-and-cents box, so there is no rounding.
family: ca/amt_ppip_premiums_in_ontario_refused
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t691/t691-25e.pdf
rounding: none
count_when_any_applies: "1"
conditions:
  - text: line 59 is Quebec only, but the filer lived in Ontario on December 31, 2025
    parts:
      - tests:
          - {reads: count, position: "1", relation: equal_to, than: "1"}
