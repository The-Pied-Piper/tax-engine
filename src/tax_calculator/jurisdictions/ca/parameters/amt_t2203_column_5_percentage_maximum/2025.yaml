# Largest percentage in Column 5 of line 52220 of Form T2203, 2025 tax year (Form T691): Part 3
# line 3 "If you have to pay tax to multiple jurisdictions, multiply the amount from line 2 by the
# percentage in Column 5 of line 52220 on Form T2203", entered as the form prints a percentage (100
# for 100%). The form prints no maximum on that percentage: the 100% limit, the whole of the amount,
# is a choice, not a form rule (no .txt published; confirmed from the PDF). It borrows the credit
# kind because the figure is used whole, as the basic personal amount is.
# The form states no rounding rule, so the figure rounds half-up to the cent, the owner's
# decision, the repo convention.
family: ca/amt_t2203_column_5_percentage_maximum
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t691/t691-25e.pdf
rounding: {increment: "0.01", mode: half_up}
amount: "100"
