# Maximum for the disability amount transferred from a dependant, 2025 tax year (Federal
# Worksheet, form 5000-D1): "Line 31800 - Disability amount transferred from a dependant",
# line 8 "Line 1 plus line 7 (maximum $16,052)". It is a plain cap on the base plus the
# supplement.
# Line 13 is a dollars-and-cents box, so each dependant's allowable amount rounds half-up to
# the cent, as the form states no rounding rule.
family: ca/disability_transfer_maximum
tax_year: 2025
kind: amount
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-d1/5000-d1-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "16052"
