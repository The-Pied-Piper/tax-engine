# Net capital loss adjustment factor for the inclusion rate, row "After 1989 and before 2000", 2025
# tax year (Form T1436, Capital Gains Worksheet, "Line 25300 - Net capital loss of other years (if
# you have pre-1986 capital loss balance)", "Chart A - Adjustment calculation for carry-forward
# losses"): column (B) "Adjustment factor (for the inclusion rate)", which column (C) "Adjusted
# gross capital losses (column A multiplied by column B)" multiplies by.
# The form prints 0.6667, 2/3 rounded for print; the exact fraction keeps the chart exact (2/3 times
# 3/2 is 1, where 0.6667 times 1.5 is 1.00005).
# Column (C) is a dollars-and-cents box, so the product rounds half-up to the cent, the owner's
# decision, as the form states no rounding rule.
family: ca/net_capital_loss_inclusion_rate_factor_1990_to_1999
tax_year: 2025
kind: fraction
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t1436/t1436-25e.pdf
rounding: {increment: "0.01", mode: half_up}
numerator: "2"
denominator: "3"
