# Largest spouse's disability amount, 2025 tax year (Federal Worksheet 5000-D1 line 7, "Enter this
# amount on line 31600 of your return. (maximum $16,052)"), the most Schedule 2 line 4 "Enter the
# amount from line 31600 of their return. (Note 1)" can carry. It borrows the credit kind because
# the figure is claimed whole, as the basic personal amount is.
# The worksheet states no rounding rule, so the figure rounds half-up to the cent, the owner's
# decision, the repo convention.
family: ca/spouse_return_disability_amount_maximum
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-d1/5000-d1-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "16052"
