# Form T1436 (Capital Gains Worksheet, 2025), "Line 21700 - Allowable business investment loss", line 6
# "For 2001 to 2024: ... x 2 = 6": the amount is multiplied by the printed 2, kept as given (2/1).
# Line 6 is a dollars-and-cents box, so the product rounds half-up to the cent, the owner's decision,
# as the form states no rounding rule.
family: ca/t1436_line_6_multiplier
tax_year: 2025
kind: fraction
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t1436/t1436-25e.pdf
rounding: {increment: "0.01", mode: half_up}
numerator: "2"
denominator: "1"
