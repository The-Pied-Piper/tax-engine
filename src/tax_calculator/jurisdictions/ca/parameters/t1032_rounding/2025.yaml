# Form T1032 E (25), the ratios of Step 2 (line 18, "Divided by Number of months in the tax year (12)
# multiplied by Amount from line 17"), Step 4 (line 29, "Line 27 multiplied by line 28 =") and Step 5
# (line 36, "Amount from line 35 multiplied by Amount from line 22 divided by Amount from line 17").
# Each is a dollars-and-cents box and the form states no rounding rule, so each product rounds
# half-up to the cent, once, the owner's decision, as the rounding_only dataset of Form T1206 does.
family: ca/t1032_rounding
tax_year: 2025
kind: rounding_only
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t1032/t1032-25e.txt
rounding: {increment: "0.01", mode: half_up}
