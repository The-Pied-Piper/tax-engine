# Northern residents deductions, Zone A daily amount, 2025 tax year (Form T2222 Step 2):
# line 1 "Enter the number of days you lived in a prescribed northern zone in 2025.
# multiplied by $11.00 =" and line 2 "Enter the number of days you qualify for the additional
# residency amount in 2025. multiplied by $11.00 =". It is a per-unit amount, applied to
# each count of days.
# Lines 1 and 2 are dollars-and-cents boxes, so the amount rounds half-up to the cent, the
# owner's decision, as the form states no rounding rule.
family: ca/northern_zone_a_daily_amount
tax_year: 2025
kind: amount
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2222/t2222-25e.txt
rounding: {increment: "0.01", mode: half_up}
