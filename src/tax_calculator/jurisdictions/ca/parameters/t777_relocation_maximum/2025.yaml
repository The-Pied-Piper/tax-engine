# Maximum of the labour mobility deduction for one relocation, Form T777 (2025) line 11 chart line
# 39 "Temporary relocation expenses available for deduction in the year ... (maximum $4,000)": the
# printed amount of $4,000 for each copy. The year's total of line 11 and line 41 has its own
# dataset, `ca/t777_line_11_maximum`. The line is a dollars-and-cents box, so the amount rounds
# half-up to the cent, the owner's decision, as the form states no rounding rule.
family: ca/t777_relocation_maximum
tax_year: 2025
kind: amount
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t777/t777-25e.pdf
rounding: {increment: "0.01", mode: half_up}
amount: "4000"
