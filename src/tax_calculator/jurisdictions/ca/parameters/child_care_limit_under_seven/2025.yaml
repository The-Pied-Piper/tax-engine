# Child care expenses limit per eligible child born in 2019 or later, 2025 tax year
# (Form T778): Part B line 1 "Number of eligible children born in 2019 or later whom the
# disability amount cannot be claimed for" "multiplied by $8,000". It is a per-unit
# amount, one part of line 4 "Add lines 1 to 3.".
# Line 1 is a dollars-and-cents box, so the product rounds half-up to the cent, the
# owner's decision, as the form states no rounding rule.
family: ca/child_care_limit_under_seven
tax_year: 2025
kind: amount
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t778/t778-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "8000"
