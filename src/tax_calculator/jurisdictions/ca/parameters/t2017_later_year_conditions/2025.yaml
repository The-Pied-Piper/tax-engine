# Condition for a later year (Year B) of Form T2017 (2025) page 3, "How do you calculate a reserve": "You do
# not have to claim the maximum reserve in a tax year (Year A). However, the amount you claim in a later year
# (Year B) cannot be more than the amount you claimed for that property in the previous year (Year A)." The one
# condition, "a later year (Year B)", reads the years after the disposition: a count of 1 when it is more than 0
# (a year after the year of disposition), and 0 otherwise (the year of disposition itself). The count is a whole
# number, so there is no rounding.
family: ca/t2017_later_year_conditions
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2017/t2017-25e.pdf
rounding: none
count_when_any_applies: "1"
conditions:
  - text: a later year (Year B)
    parts:
      - tests:
          - {reads: count, position: "1", relation: more_than, than: "0"}
