# Condition for T1 line 43700 and line 31400 through Form T1032 (Joint Election to Split Pension
# Income), 2025 tax year, Form T1032 E (25), Step 3, page 2: the form is filed only when a
# split-pension amount is jointly elected ("Line 22: Enter the amount that you and your spouse or
# common-law partner decide to jointly elect"), so no elected amount is no election. The one
# condition, "line 22 is above 0", reads line 22's amount: a count of 1 when it is more than 0, and
# 0 otherwise. The result is a count, not a dollars-and-cents box, so there is no rounding.
family: ca/t1032_election_applies_conditions
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t1032/t1032-25e.txt
rounding: none
count_when_any_applies: "1"
conditions:
  - text: line 22 is above 0
    parts:
      - tests:
          - {reads: amount, position: "1", relation: more_than, than: "0"}
