# Second additional CPP contribution on self-employment income, 2025 tax year (T1-2025
# Schedule 8, form 5000-S8). Part 4 line 6 "Line 4 minus line 5 (if negative, enter "0")";
# line 12 "amount from line 6 multiplied by 8% (maximum $792.00)". Line 6 is at most line C
# of Part 2 (maximum $9,900), so the tier starts at 0 and ends at $9,900, the 12-month
# figure of line C. A self-employed person pays both halves, so 8% is twice the employee's
# 4%; the CRA second additional rate page's 2025 row gives the employee rate.
# Line 13 "Line 11 plus line 12" and line 14 "Line 10 plus line 13 Enter this amount (in
# dollars and cents) on line 42100 of your return." are in dollars and cents, so the tier
# rounds half-up to the cent.
family: ca/cpp_self_employed_second_additional_contribution
tax_year: 2025
kind: contribution_tier
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s8/5000-s8-25e.txt
  - https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/payroll/calculating-deductions/making-deductions/second-additional-cpp-contribution-rates-maximums.html
rounding: {increment: "0.01", mode: half_up}
rate: "0.08"
lower: "0"
upper: "9900"
maximum: "792.00"
