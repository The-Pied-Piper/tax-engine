# Condition for the amount 8 of Alberta on Form T2043 Part 2, 2025 tax year: "Add all farming
# expenses in AB from amount 8 of Chart A." Each statement of Form T2042 names one designated
# province as a code (1 Ontario, 2 Manitoba, 3 Saskatchewan, 4 Alberta, 5 Nova Scotia, 6 Prince
# Edward Island, 7 Newfoundland and Labrador, 8 New Brunswick: the order of Part 2 lines 2A to
# 2H, confirmed from the PDF, no .txt published). The one condition, "the designated province
# is Alberta", reads that code: a count of 1 when it is 4, and 0 otherwise. The result is a
# count, not a dollars-and-cents box, so there is no rounding.
# The second part, "no Chart B is in use" (count 2, ca/farm_chart_b_in_use, which is 0 when no
# total of Chart B rows 1 and 4 is more than 0), makes the condition fail for a statement that
# uses Chart B: that statement's credit is its Chart B credit (Chart C), so the same business
# is not counted twice. All the parts must hold.
family: ca/farm_province_ab_conditions
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2043/t2043-25e.pdf
rounding: none
count_when_any_applies: "1"
conditions:
  - text: the designated province is Alberta and no Chart B is in use
    parts:
      - tests:
          - {reads: count, position: "1", relation: equal_to, than: "4"}
      - tests:
          - {reads: count, position: "2", relation: equal_to, than: "0"}
