# Form T1032 E (25), Step 4 Part B, page 3: "If all of the following conditions apply, calculate line 33
# according to the instructions in note 1: the amount on line 32 is less than $2,000". The $2,000 is
# the figure line 32 is compared with, from the form as printed. The form states no rounding rule, so
# the figure rounds half-up to the cent, the owner's decision, the repo convention. It is a
# dollars-and-cents box claimed whole, so it borrows the credit kind, as the other printed figures
# of the form do.
family: ca/t1032_line_32_figure
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t1032/t1032-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "2000"
