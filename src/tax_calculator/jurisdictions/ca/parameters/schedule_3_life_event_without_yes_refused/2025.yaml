# Condition under which the count of the life event boxes ticked without a "Yes" is refused, 2025
# tax year: a box of line 17906 is asked only after a "Yes" on line 17905, so a box ticked while
# line 17905 is "No" (a count of 1, `ca/schedule_3_life_event_without_yes`) is an input error, not
# a flipped property of 0. The form prints no such rule; the refusal is the guard of this check.
# The count is 1 when it applies and 0 otherwise. The count is a count, not a dollars-and-cents box,
# so there is no rounding.
family: ca/schedule_3_life_event_without_yes_refused
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s3/5000-s3-25e.txt
rounding: none
count_when_any_applies: "1"
conditions:
  - text: a box of line 17906 is ticked without a "Yes" on line 17905
    parts:
      - tests:
          - {reads: count, position: "1", relation: equal_to, than: "1"}
