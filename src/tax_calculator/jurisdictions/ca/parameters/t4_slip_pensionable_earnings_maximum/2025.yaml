# Maximum CPP or QPP pensionable earnings on one T4 slip, 2025 tax year: Schedule 8 (5000-S8) Part 3
# line 1 "Total CPP pensionable earnings from box 26 of all of your T4 slips ... (maximum $81,200
# per slip)" and Form RC381 Part 3 line 2 (same printed maximum). It is the per-slip figure the form
# prints; the total over all slips is bounded by it times the count of slips
# (`core/per_unit_amount`). A dollars-and-cents figure, so it rounds half up to the cent.
family: ca/t4_slip_pensionable_earnings_maximum
tax_year: 2025
kind: amount
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s8/5000-s8-25e.txt
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/rc381/rc381-25e.pdf
rounding: {increment: "0.01", mode: half_up}
amount: "81200.00"
