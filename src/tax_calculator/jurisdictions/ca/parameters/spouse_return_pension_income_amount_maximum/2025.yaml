# Largest spouse's pension income amount, 2025 tax year (T1 line 97 and line 31400, "Pension income
# amount (use Federal Worksheet) (maximum $2,000)"), the most Schedule 2 line 3 "Enter the amount
# from line 31400 of their return." can carry. It borrows the credit kind because the figure is
# claimed whole, as the basic personal amount is.
# The T1 states no rounding rule, so the figure rounds half-up to the cent, the owner's decision,
# the repo convention.
family: ca/spouse_return_pension_income_amount_maximum
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-r/5006-r-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "2000"
