# Form T2091(IND)-WS, Principal Residence Worksheet (2023 edition, the only one CRA publishes),
# Chart 1 line 16 "Multiply line 14 by 1.1." The printed factor is 1.1. Line 16 is a
# dollars-and-cents box, and the worksheet states no rounding rule, so the product rounds half-up
# to the cent, the owner's decision (#143, #135).
family: ca/principal_residence_chart_1_factor
tax_year: 2025
kind: factor
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2091ind-ws/t2091ind-ws-23e.pdf
rounding: {increment: "0.01", mode: half_up}
value: "1.1"
