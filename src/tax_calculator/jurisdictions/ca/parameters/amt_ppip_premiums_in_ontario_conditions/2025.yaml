# Condition under which Form T691 Part 1 line 59 is filled in by a resident of Ontario, 2025 tax year:
# line 59 "Deduction for PPIP premiums on self-employment income from line 22300 of your return
# (Quebec only)". The count is 1 when line 59 is more than 0 and the filer was a resident of Ontario
# on December 31, 2025 (the count ON428 reads for "You were not a resident of Ontario on December 31,
# 2025", `ca-on/not_resident_of_ontario_at_year_end_checked`, is 0), and 0 otherwise. The count is
# not a dollars-and-cents box, so no rounding.
family: ca/amt_ppip_premiums_in_ontario_conditions
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t691/t691-25e.pdf
rounding: none
count_when_any_applies: "1"
conditions:
  - text: >-
      line 59 is more than 0 and the filer lived in Ontario on December 31, 2025
    parts:
      - tests:
          - {reads: amount, position: "1", relation: more_than, than: "0"}
      - tests:
          - {reads: count, position: "1", relation: equal_to, than: "0"}
