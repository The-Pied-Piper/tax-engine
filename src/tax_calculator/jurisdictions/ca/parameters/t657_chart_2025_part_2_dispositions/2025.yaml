# Dispositions that Form T657 Chart 2025 Part 2 takes, 2025 tax year: "do not include any reserves
# claimed on dispositions of QFFP before 2025 or in Period 1 of 2024 that is reported on a 2025
# T5013 slip or in a letter to the partner" (the same for QSBCS). Counts are those of a Form T2017
# reserve record, in order: 1 the years after the disposition (2025 less the year of disposition), 2
# disposed of in Period 1 of 2024 (1 yes, 0 no), 3 reserve reported on a T5013 slip or letter (1
# yes, 0 no), 4 partnership year began before June 25, 2024 (1 yes, 0 no). The count is 1 when the
# condition applies (the disposition is taken) and 0 when it does not. The result is a count, not a
# dollars-and-cents box, so there is no rounding.
family: ca/t657_chart_2025_part_2_dispositions
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t657/t657-25e.pdf
rounding: none
count_when_any_applies: "1"
conditions:
  - text: >-
      Reserves claimed on dispositions in 2025 (none before 2025)
    parts:
      - tests:
          - {reads: count, position: "1", relation: equal_to, than: "0"}
