# Form T2125 (2025), Chart B line 18 "($350*** ÷ 30)" and Chart C line 25 "[($1,100 + GST and PST,
# or $1,100 + HST) × amount 22] ÷ 30 = 25": the printed 30 days, one constant for both charts. It
# borrows the credit kind because it is a printed constant, claimed whole. The quotients that divide
# by it round half-up to the cent, as the form states no rounding rule.
family: ca/business_vehicle_days_divisor
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2125/t2125-25e.pdf
rounding: {increment: "0.01", mode: half_up}
amount: "30"
