# Condition under which the formula used on Form T1139 is refused, 2025 tax year: Part 2 "Use only
# one of the formulas below" and Part 4 "Enter either amount B, C, or 3H based on the formula you
# used above" name three formulas (1 amount B, 2 amount C, 3 amount 3H; the form names no codes, a
# listed check) and none when the business is in Part 5 (0). A number above 3 names no formula, so
# no amount would be entered at amount D. The one condition has a part for each listed number,
# "not equal to" it: every part holds, so the condition applies, only when the number is none of 0
# to 3. The result is a count, not a dollars-and-cents box, so there is no rounding. Confirmed from
# the PDF; no .txt published.
family: ca/t1139_formula_refused
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t1139/t1139-25e.pdf
rounding: none
count_when_any_applies: "1"
conditions:
  - text: the formula number of the business is not 0, 1, 2 or 3
    parts:
      - tests:
          - {reads: count, position: "1", relation: not_equal_to, than: "0"}
      - tests:
          - {reads: count, position: "1", relation: not_equal_to, than: "1"}
      - tests:
          - {reads: count, position: "1", relation: not_equal_to, than: "2"}
      - tests:
          - {reads: count, position: "1", relation: not_equal_to, than: "3"}
