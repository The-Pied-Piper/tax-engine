# Condition under which the count of a T5013 slip answer conflicting with the partner answer or the
# other figures of the statement is refused, Form T776 (2025), 2025 tax year: the slip answer is 1
# and the partner answer is 0, or the slip answer is 1 and a figure other than amount 7 and lines
# 9974 and 9943 (a CCA claim, income, an expense, a recapture, a terminal loss, a land addition or
# disposition, an opening UCC, an addition or a remaining personal part of Area A, an addition of Area B or C) is not 0 (the
# count of `ca/t776_t5013_slip_conflicts`, 1). Such a return is an input error, not a rule the form
# prints, so the count is refused. The refusal is the guard of this check, not a printed rule. The
# count is 1 when it applies and 0 otherwise. The count is a count, not a dollars-and-cents box, so
# there is no rounding.
family: ca/t776_t5013_slip_conflict_refused
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t4036/t4036-25e.pdf
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t776/t776-25e.txt
rounding: none
count_when_any_applies: "1"
conditions:
  - text: the T5013 slip answer conflicts with the partner answer or the figures of the statement
    parts:
      - tests:
          - {reads: count, position: "1", relation: equal_to, than: "1"}
