# Condition for Form T2038(IND) Part D amount 11, 2025 tax year: "If you have to complete Form
# T691, Alternative Minimum Tax and the amount you calculate on line 7 of Part 5 in Form T691 is
# greater than "0", continue at amount 11." If alternative minimum tax (AMT) does not apply to you,
# continue at amount 15. The one condition, "T691 Part 5 line 7 is greater than 0", reads line 7's
# amount (`ca/amt_minimum_tax_after_regular_tax`): a count of 1 when it is more than 0, and 0
# otherwise. The count chooses the limit of the claim, amount I when 0 and amount K when 1. The
# result is a count, not a dollars-and-cents box, so there is no rounding.
family: ca/itc_part_d_amount_11_conditions
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2038-ind/t2038-ind-25e.pdf
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t691/t691-25e.pdf
rounding: none
count_when_any_applies: "1"
conditions:
  - text: T691 Part 5 line 7 is greater than 0
    parts:
      - tests:
          - {reads: amount, position: "1", relation: more_than, than: "0"}
