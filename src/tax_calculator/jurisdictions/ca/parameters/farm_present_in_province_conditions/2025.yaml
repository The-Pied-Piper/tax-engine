# Presence of a Form T2042 statement in one designated province, for Form T2043 box 67062 "Tick
# this box if you have multiple farming businesses with one or more permanent establishments in
# multiple provinces or territories" (2025 tax year), read from the PDF (no .txt is published). A
# statement is present in a province when its Chart A designated province is that province and no
# Chart B is in use (count 1 is 1, `ca/farm_in_province_<province>`), or when its Chart B has a row 1
# or row 4 amount for that province (amount 1, the row 1 total, or amount 2, the row 4 total, is more
# than 0). Each way is a condition, and any of them counts 1. The one dataset serves all eight
# provinces: its counts and amounts are the province's own inputs. The result is a count, not a
# dollars-and-cents box, so there is no rounding.
family: ca/farm_present_in_province_conditions
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2043/t2043-25e.pdf
rounding: none
count_when_any_applies: "1"
conditions:
  - text: >-
      the statement's designated province is this province and no Chart B is in use
    parts:
      - tests:
          - {reads: count, position: "1", relation: equal_to, than: "1"}
  - text: >-
      the statement's Chart B row 1 amount for this province is more than 0
    parts:
      - tests:
          - {reads: amount, position: "1", relation: more_than, than: "0"}
  - text: >-
      the statement's Chart B row 4 amount for this province is more than 0
    parts:
      - tests:
          - {reads: amount, position: "2", relation: more_than, than: "0"}
