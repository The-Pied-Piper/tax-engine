# Entry conditions of the social benefits repayment chart, 2025 tax year (Federal Worksheet,
# form 5000-D1, "Line 23500 - Social benefits repayment"): "Complete the chart below if one or
# both of the following applies:" "You entered an amount on line 11900 of your return and the
# amount on line 23400 is more than $82,125" and "You entered an amount on line 11300 or line
# 14600 of your return and the amount on line 23400 is more than $93,454", and T1 (form 5006-R)
# "Line 55 and line 23500: If not, enter "0" on line 23500." So the count is 1 when either
# condition applies and 0 when neither does. Each condition is two parts that must both hold:
# an amount entered (more than 0) and line 23400 over the printed figure. The caller's amounts
# are read in the order line 11900, line 23400, line 11300, line 14600 (line 23400 is read by
# both conditions and listed once).
# The result is a count, not a dollars-and-cents box, so there is no rounding.
family: ca/social_benefits_repayment_conditions
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-d1/5000-d1-25e.txt
rounding: none
count_when_any_applies: "1"
conditions:
  - text: >-
      You entered an amount on line 11900 of your return and the amount on line 23400 is more
      than $82,125
    parts:
      - tests:
          - {reads: amount, position: "1", relation: more_than, than: "0"}
      - tests:
          - {reads: amount, position: "2", relation: more_than, than: "82125"}
  - text: >-
      You entered an amount on line 11300 or line 14600 of your return and the amount on line
      23400 is more than $93,454
    parts:
      - tests:
          - {reads: amount, position: "3", relation: more_than, than: "0"}
          - {reads: amount, position: "4", relation: more_than, than: "0"}
      - tests:
          - {reads: amount, position: "2", relation: more_than, than: "93454"}
