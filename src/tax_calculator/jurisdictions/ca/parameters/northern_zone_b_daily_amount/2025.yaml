# Northern residents deductions, Zone B daily amount, 2025 tax year (Form T2222 Step 2):
# line 6 "Enter the number of days you lived in an intermediate zone in 2025. multiplied by
# $5.50 =" and line 7 "Enter the number of days you qualify for the additional residency
# amount in 2025. multiplied by $5.50 =". It is a per-unit amount, applied to each count of
# days.
# Lines 6 and 7 are dollars-and-cents boxes, so the amount rounds half-up to the cent, the
# owner's decision, as the form states no rounding rule.
family: ca/northern_zone_b_daily_amount
