# Base amount for the disability amount transferred from a dependant, 2025 tax year
# (Federal Worksheet, form 5000-D1): "Line 31800 - Disability amount transferred from a
# dependant", line 1 "Base amount 10,138.00". It is a plain amount, not a claimed credit:
# line 8 adds the supplement for a dependant under 18, and line 12 combines it with the
# dependant's own figures.
# Line 13 is a dollars-and-cents box, so the allowable amount rounds half-up to the cent
# (with the maximum's rule), as the form states no rounding rule.
family: ca/disability_transfer_base_amount
tax_year: 2025
kind: amount
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-d1/5000-d1-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "10138.00"
