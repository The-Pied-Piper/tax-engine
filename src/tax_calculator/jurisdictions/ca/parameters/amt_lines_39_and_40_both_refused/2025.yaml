# Condition under which the count of Form T691 Part 1 lines 39 and 40 both filled in is refused,
# 2025 tax year: the form says "complete line 39 or 40 depending on your situation", line 39 for a
# filer with no election and line 40 for one who filed an election, so a count of 1
# (`ca/amt_lines_39_and_40_both`) is an input error, not a second claim added to the first. The
# form prints no refusal; it is the guard of this check. The count is 1 when it applies and 0
# otherwise. The count is a count, not a dollars-and-cents box, so there is no rounding.
family: ca/amt_lines_39_and_40_both_refused
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t691/t691-25e.pdf
rounding: none
count_when_any_applies: "1"
conditions:
  - text: line 39 and line 40 are both filled in, but the form says to complete line 39 or 40
    parts:
      - tests:
          - {reads: count, position: "1", relation: equal_to, than: "1"}
