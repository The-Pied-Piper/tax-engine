# Form T2048 (2025), Part 2 line 4 "Inclusion rate × 50%" and line 5 "Line 3 multiplied by the
# percentage from line 4". The form prints no rounding rule, so the repo convention applies: the
# product on line 5 rounds half-up to the cent.
family: ca/qbt_election_inclusion_rate
tax_year: 2025
kind: rate
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2048/t2048-25e.pdf
rounding: {increment: "0.01", mode: half_up}
rate: "0.5"
