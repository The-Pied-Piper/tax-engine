# Canada workers benefit reduction, 2025 tax year (Schedule 6, form 5000-S6), Step 2,
# for a filer with no eligible spouse and no eligible dependant: line 23 "Adjusted
# family net income from line 15"; line 24 "If you had an eligible spouse or an eligible
# dependant, enter $30,639. If not, enter $26,855."; line 25 "Line 23 minus line 24 (if
# negative, enter "0")"; line 26 "Rate 15%"; line 27 "Line 25 multiplied by the
# percentage from line 26".
# Lines 24 to 27 are one tier over the threshold, with no maximum. The chart's "Basic
# CWB: $37,742" limit is not a dataset: it follows from the arithmetic, as 1,633 less
# 15% of (37,742 - 26,855) is below zero.
# Line 27 is a dollars-and-cents box, so the tier rounds half-up to the cent, the
# owner's decision, as the form states no rounding rule; line 25 takes amounts already
# in cents.
family: ca/cwb_reduction
tax_year: 2025
kind: surcharge_tiers
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s6/5000-s6-25e.txt
rounding: {increment: "0.01", mode: half_up}
tiers:
  - {threshold: "26855", rate: "0.15"}
