# Rounding of Form T2043 Chart A amount 8 (2025): "Amount 6 multiplied by amount 7.", where amount
# 7 is "Total number of days in the fiscal period that fall within the 2024 calendar year divided
# by the total number of days in the fiscal period" (confirmed from the PDF; no .txt published).
# Amount 8 is a dollars-and-cents box and the form states no rounding rule, so the product, formed
# as one exact fraction, rounds half-up to the cent once, the owner's decision.
family: ca/farm_chart_a_amount_8_rounding
tax_year: 2025
kind: rounding_only
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2043/t2043-25e.pdf
rounding: {increment: "0.01", mode: half_up}
