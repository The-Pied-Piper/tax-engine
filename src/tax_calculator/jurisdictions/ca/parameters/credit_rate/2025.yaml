# Federal non-refundable tax credit rate, 2025 tax year (T1 line 114): 14.5%, the
# full-year blended lowest bracket rate. It is applied once, to the sum of the credit
# amounts on the return (T1 line 33500). That product (line 33800) is a dollars-and-cents
# box, so it rounds half-up to the cent, the owner's decision, as the form states no
# rounding rule.
family: ca/credit_rate
tax_year: 2025
kind: rate
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-r/5000-r-25e.pdf
  - https://www.canada.ca/en/revenue-agency/services/tax/individuals/topics/about-your-tax-return/tax-return/completing-a-tax-return/whats-new.html
rounding: {increment: "0.01", mode: half_up}
rate: "0.145"
