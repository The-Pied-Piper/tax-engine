# Age amount, income threshold, 2025 tax year (Federal Worksheet, form 5000-D1): "Line 30100 -
# Age amount", line 3 "Income threshold 45,522.00", from which line 4 "Line 2 minus line 3 (if
# negative, enter "0")" takes line 2 "Amount from line 23600 of your return". It borrows the
# credit kind because it is a printed amount taken whole, as the basic reduction is.
# Line 3 is a dollars-and-cents box, so the amount rounds half-up to the cent, the owner's
# decision, as the form states no rounding rule.
family: ca/age_income_threshold
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-d1/5000-d1-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "45522.00"
