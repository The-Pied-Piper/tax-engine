# Schedule 8 Part 5 line 35 "Amount from line 16 divided by 4% =" (form 5000-S8, 2025): the
# printed 4% is the divisor, so the rate is 0.04. Line 35 is a dollars-and-cents box, so the
# quotient rounds half-up to the cent, the owner's decision, as the form states no rounding rule.
family: ca/cpp_part_5_line_35_rate
tax_year: 2025
kind: rate
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s8/5000-s8-25e.txt
rounding: {increment: "0.01", mode: half_up}
rate: "0.04"
