# RESP AIPs lifetime RRSP limit, 2025 tax year (Form T1172, Part A): line 4 "Maximum lifetime RRSP
# contribution limit that can be used to reduce or eliminate the amount of AIPs subject to the
# additional tax $ 50,000.00", from which line 6 "Line 4 minus line 5" is taken. It borrows the
# credit kind because it is a printed amount taken whole. Line 4 is a dollars-and-cents box, so the
# amount rounds half-up to the cent, the owner's decision, as the form states no rounding rule.
family: ca/resp_aips_lifetime_limit
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t1172/t1172-25e.pdf
rounding: {increment: "0.01", mode: half_up}
amount: "50000.00"
