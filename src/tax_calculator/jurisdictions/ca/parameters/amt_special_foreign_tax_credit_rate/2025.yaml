# Special foreign tax credit rate of the alternative minimum tax, 2025 tax year (Form T691 Part 4
# line 7): "Total non-business income tax paid to a foreign country (12)" "× 66.6666%". The
# percentage is printed as 66.6666%, so the rate is 0.666666, as printed and not two thirds. The
# product is a dollars-and-cents line, so it rounds half-up to the cent, the owner's decision, as
# the form states no rounding rule.
family: ca/amt_special_foreign_tax_credit_rate
tax_year: 2025
kind: rate
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t691/t691-25e.pdf
rounding: {increment: "0.01", mode: half_up}
rate: "0.666666"
