# Condition under which the leasing chart of Guide T4044 (2025) "Eligible leasing costs" (the guide
# of Form T777 line 27) is refused, 2025 tax year: the guide's "If this is your situation, you cannot
# use the leasing chart below. Instead, contact the CRA." (a repayment owing, or imputed interest),
# applied to the count of `ca/t777_lease_chart_conflicts`, 1. Neither the form nor the guide prints
# another calculation, so such a return is an input error and the count is refused, never worked
# around. The count is 1 when it applies and 0 otherwise. The count is a count, not a
# dollars-and-cents box, so there is no rounding.
family: ca/t777_lease_chart_conflict_refused
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t4044/t4044-25e.txt
rounding: none
count_when_any_applies: "1"
conditions:
  - text: the leased passenger vehicle has a repayment owing or imputed interest, so the leasing chart cannot be used (contact the CRA)
    parts:
      - tests:
          - {reads: count, position: "1", relation: equal_to, than: "1"}
