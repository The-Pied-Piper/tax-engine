# Entry condition of Schedule 8 Part 3b line 42, 2025 tax year (form 5000-S8, page 6): "Line 42:
# If line 23 and line 40 are both positive, enter whichever is less: amount from line 40 or the
# result of line 23 minus line 35. If not, enter "0"." The count is 1 when line 23 and line 40 are
# each more than 0, and 0 otherwise. Not a dollars-and-cents box, so no rounding.
family: ca/cpp_line_23_and_line_40_positive_conditions
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s8/5000-s8-25e.txt
rounding: none
count_when_any_applies: "1"
conditions:
  - text: >-
      line 23 and line 40 are both positive
    parts:
      - tests:
          - {reads: amount, position: "1", relation: more_than, than: "0"}
      - tests:
          - {reads: amount, position: "2", relation: more_than, than: "0"}
