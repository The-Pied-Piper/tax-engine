# Form T1139 (2025), Part 2 "Use only one of the formulas below" and Part 4 "Enter either amount B,
# C, or 3H based on the formula you used above": the formula used is the number of the filer's
# choice (1 amount B, 2 amount C, 3 amount 3H; the form names no codes, a listed check). The count
# is 1 when the number is 1 and 0 otherwise; a number above 3 is refused first by
# `ca/t1139_formula_refused`. A count, not a dollars-and-cents box, so there is no rounding.
# Confirmed from the PDF; no .txt published.
family: ca/t1139_formula_is_b
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t1139/t1139-25e.pdf
rounding: none
count_when_any_applies: "1"
conditions:
  - text: "Additional business income if your fiscal period ends in 2025"
    parts:
      - tests:
          - {reads: count, position: "1", relation: equal_to, than: "1"}
