# ITC refundable rate, 2025 tax year: Form T2038(IND) Part E, amount 18, "The refundable rate",
# printed as 0.40. Amount O, "Refund of ITC (multiply amount 17 by amount 18)", is the amount 17 the
# filer designates times this rate, the figure on line 45400 of the return.
# The form's line is a dollars-and-cents box, so the product rounds half-up to the cent, the
# owner's decision, as the form states no rounding rule.
family: ca/itc_part_e_refundable_rate
tax_year: 2025
kind: rate
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2038-ind/t2038-ind-25e.pdf
rounding: {increment: "0.01", mode: half_up}
rate: "0.40"
