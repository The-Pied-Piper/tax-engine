# Form T2042 (2025), Area G "Immediate expensing limit allocated to your business: Multiply
# $1.5 million by the percentage assigned to your business in column 3**" (confirmed from the
# PDF; no .txt published). The form prints no figure of its own for the multiplication and no
# rounding rule; amount iv is a dollars-and-cents box, so the product rounds half-up to the
# cent, the owner's decision, the repo convention.
family: ca/farm_immediate_expensing_rounding
tax_year: 2025
kind: rounding_only
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2042/t2042-25e.pdf
rounding: {increment: "0.01", mode: half_up}
