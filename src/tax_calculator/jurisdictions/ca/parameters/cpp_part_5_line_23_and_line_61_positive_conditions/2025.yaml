# Entry condition of Schedule 8 Part 5 line 63, 2025 tax year (form 5000-S8, page 10): "If line 23
# of Part 3 and line 61 are both positive, enter whichever is less: Line 63: amount from line 61 or
# the result of line 23 of Part 3 minus line 56. If not, enter "0"." The count is 1 when line 23 of
# Part 3 and line 61 are both more than 0, and 0 otherwise. Not a dollars-and-cents box, so no
# rounding.
family: ca/cpp_part_5_line_23_and_line_61_positive_conditions
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s8/5000-s8-25e.txt
rounding: none
count_when_any_applies: "1"
conditions:
  - text: >-
      line 23 of Part 3 and line 61 are both positive
    parts:
      - tests:
          - {reads: amount, position: "1", relation: more_than, than: "0"}
      - tests:
          - {reads: amount, position: "2", relation: more_than, than: "0"}
