# Tuition transfer maximum for each student, 2025 tax year (T1 guide 5000-G, line 32400 "Tuition
# amount transferred from a child or grandchild"): "The maximum amount each student can transfer to
# you is $5,000 minus the amount that they used to reduce their own tax payable." The printed
# figure is $5,000, the maximum for each student, multiplied by the number of students
# (`core/per_unit_amount`).
# It is a dollars-and-cents figure, so the amount rounds half-up to the cent, the owner's decision,
# as the guide states no rounding rule.
family: ca/tuition_transfer_maximum_per_student
tax_year: 2025
kind: amount
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pub/5000-g/5000-g-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "5000.00"
