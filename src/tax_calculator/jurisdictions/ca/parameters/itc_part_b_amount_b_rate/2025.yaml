# ITC rate, 2025 tax year: Form T2038(IND) Part B, line 67170 "× 0.15 =" amount B, the mineral
# exploration tax credit. The product is the caller's flow-through mining expenditures times the
# rate the form prints.
# The form's line is a dollars-and-cents box, so the product rounds half-up to the cent, the
# owner's decision, as the form states no rounding rule.
family: ca/itc_part_b_amount_b_rate
tax_year: 2025
kind: rate
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2038-ind/t2038-ind-25e.pdf
rounding: {increment: "0.01", mode: half_up}
rate: "0.15"
