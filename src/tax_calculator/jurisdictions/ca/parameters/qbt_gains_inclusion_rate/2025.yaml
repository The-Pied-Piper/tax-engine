# Form T2048 (2025), Part 3 line 15 "Inclusion rate × 50%" and line 16 "Taxable capital gains for
# the QBT or QCC only: line 14 multiplied by the inclusion rate on line 15". The form prints no
# rounding rule, so the repo convention applies: the product rounds half-up to the cent.
family: ca/qbt_gains_inclusion_rate
tax_year: 2025
kind: rate
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2048/t2048-25e.pdf
rounding: {increment: "0.01", mode: half_up}
rate: "0.5"
