# Form SK428 (Saskatchewan Tax, 2025, CRA 5008-c-25e) line 56 (ca-sk/sk428_credits): "Line 56 and
# 58969: Line 54 plus line 55 =". It sums line 54 (`ca-sk/sk428_donations_credit_at_rate_line_54`)
# and line 55 (`ca-sk/sk428_donations_credit_at_rate_line_55`), each read from its own step and never
# blank (a blank Schedule 9 amount gives 0.00 there). Line 57 reads it. The form names no label for
# the line, so the step has no title.
form:
  name: ca-sk/sk428_credits
capabilities:
  - name: core/sum
    reference: "56"
    unit: ca/cad
    params:
      rounding: ca-sk/cent_rounding
    consumes:
      parts:
        - ca-sk/sk428_donations_credit_at_rate_line_54
        - ca-sk/sk428_donations_credit_at_rate_line_55
    produces:
      output: ca-sk/sk428_donations_credit_line_56
