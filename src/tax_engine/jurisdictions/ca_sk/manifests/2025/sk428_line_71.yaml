# Form SK428 (Saskatchewan Tax, CRA 5008-C) line 71, "Line 71: Line 69 minus line 70 (if negative,
# enter "0") = ^". One core/subtract_not_below_zero step: the Saskatchewan tax (line 69,
# `ca-sk/sk428_tax_line_69`) less the provincial foreign tax credit (line 70,
# `ca-sk/sk428_provincial_foreign_tax_credit_line_70`), not below 0. Line 70 is an optional input
# that a caller without foreign tax leaves out, read as blank and then as 0 by the blank rule. The
# form prints no title for the line, so the step has none. Line 71 is the output
# `ca-sk/sk428_tax_line_71`.
form:
  name: ca-sk/sk428
capabilities:
  - name: core/subtract_not_below_zero
    reference: "71"
    unit: ca/cad
    params:
      rounding: ca-sk/cent_rounding
    consumes:
      amount: ca-sk/sk428_tax_line_69
      less: ca-sk/sk428_provincial_foreign_tax_credit_line_70
    blank:
      less: "0"
    produces:
      output: ca-sk/sk428_tax_line_71
