# Form SK428 (CRA 5008-C) line 10 and line 58080: "Age amount (if you were born in 1960 or earlier) (use Worksheet SK428) (maximum $5,785)". Built as ca-ns/ns428 line 10 and ca-nl/nl428_credits line 17 are: a core/first_record_count step that reads the T1's year of birth (`ca/t1_lines_copied_by_provinces.birth_year`, entered once on the T1; blank passes on), a ca/count_by_conditions step that works out 1 or 0 from that year (a blank year passes on blank, read as 0 by the steps below; shared with line 19; not a line of the form), a core/times_count step of worksheet line 7 by that count (blank read as 0), and a core/at_most step that checks the printed maximum (worksheet line 1) and is line 10. An amount above the maximum is refused, not capped. Worksheet lines 1 to 7 are in the two parts beside this one.
form:
  name: ca-sk/sk428_credits
capabilities:
- name: core/first_record_count
  title: Year of birth
  consumes:
    records: ca/t1_lines_copied_by_provinces.birth_year
  blank:
    records:
      ca/birth_year: pass_on
  produces:
    output: ca-sk/sk428_birth_year
- name: ca/count_by_conditions
  title: Born in 1960 or earlier
  params:
    conditions: ca-sk/born_in_1960_or_earlier_conditions
  consumes:
    counts:
    - ca-sk/sk428_birth_year
    amounts: []
  blank:
    counts: pass_on
  produces:
    output: ca/born_in_1960_or_earlier_checked
- name: core/times_count
  title: Age amount before the printed maximum
  unit: ca/cad
  params:
    rounding: ca-sk/cent_rounding
  consumes:
    amount: ca-sk/worksheet_sk428_age_amount_line_7
    count: ca/born_in_1960_or_earlier_checked
  produces:
    output: ca-sk/sk428_age_amount_claimed_line_10
  blank:
    count: '0'
- name: core/at_most
  title: Age amount
  reference: '10'
  unit: ca/cad
  consumes:
    amount: ca-sk/sk428_age_amount_claimed_line_10
    bound: ca-sk/worksheet_sk428_age_amount_maximum_line_1
  blank:
    amount: pass_on
  produces:
    output: ca-sk/sk428_age_amount_line_10
