# Saskatchewan 2025 take-home manifest: the return's identity and its exports (the refund or balance
# owing, the average income tax rate and the marginal tax rate). The caller gives the gross salary
# and nothing else. Saskatchewan's own forms are in parts beside this one, so a line ticket adds
# only its own part file; the federal forms are imported by name below, their parts in the `ca` package (`ca/forms/<name>/`).
#
# Saskatchewan builds two forms, split so that no form reads another in a loop:
# `ca-sk/sk428_credits` (SK428 lines 1 to 57) and `ca-sk/sk428` (SK428 lines 58 to 82), which
# supplies `ca/provincial_tax.amount` for T1 line 42800. There is no worksheet and no MB479
# equivalent: neither contributes a line for a salary-only filer.
#
# The default form's export is T1 line 167, refund or balance owing (positive is owing, negative
# is a refund). Saskatchewan uses the standard federal CPP and EI (no QPP), so Schedule 8 and T2204
# are imported unchanged. CRA publishes no Saskatchewan Schedule 6, so the federal Schedule 6 is
# imported unchanged.
#
# Saskatchewan is listed in `registrations.JURISDICTIONS`: the all-years test composes every listed
# manifest for every year, and this one is complete, SK428 line 82 supplying
# `ca/provincial_tax.amount` for T1.
jurisdiction: CA-SK
version: 1
valid_from_tax_year: 2025
# The title is the engine's own wording for the default form, not a printed form heading.
title: Return summary
outputs:
  - ca/refund_or_balance_owing
  - ca-sk/average_income_tax_rate
  - ca-sk/marginal_tax_rate
capabilities: []
imports:
  - ca/t1_employment_income
  - ca/t1_taxable_income
  - ca/t1_tax_and_credits
  - ca/t1_lines_copied_by_provinces
  - ca/schedule_6
  - ca/schedule_8
  - ca/schedule_9
  - ca/t2204
  - ca/t691
