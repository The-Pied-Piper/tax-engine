# Form SK428 (Saskatchewan Tax, CRA 5008-C) Part A, line 5. Each of the three columns prints "Line 5:"
# with its rate: "Line 5: Rate 10.5%", "Line 5: Rate 12.5%" and "Line 5: Rate 14.5%". Line 5 is the
# printed rate of the column that line 1 falls in, and a line 1 exactly at a column's upper bound
# falls in the lower column. Line 1 is read from its producing part (sk428_credits_line_1.yaml), so
# this part does not produce it again.
form:
  name: ca-sk/sk428_credits
capabilities:
  - name: core/bracket_column_rate
    title: "Rate"
    reference: "5"
    params:
      schedule: ca-sk/brackets
    consumes:
      base: ca-sk/sk428_taxable_income_line_1
    produces:
      output: ca-sk/sk428_bracket_rate_line_5
