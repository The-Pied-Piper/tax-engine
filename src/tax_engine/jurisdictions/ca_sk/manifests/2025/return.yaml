# The Saskatchewan take-home return: T1 line 167 "Refund or balance owing" (positive is owing, negative
# is a refund). The T1 form exports it, and another form's export is read only as a record list, so
# the first step is core/record_total over the T1 export, totalling the one amount into the return's
# own `ca/refund_or_balance_owing`.
#
# The return's second output is the average income tax rate, which no form prints (so its step has
# no title or reference): T1 line 43500 "Total payable" (for the take-home filer, line 143 plus
# line 147's Saskatchewan tax: the federal and the Saskatchewan income tax) divided by the salary,
# T1 line 10100 (`ca/employment_income`). T1 exports line 43500, so a core/record_total step reads
# it into the return's own `ca/total_payable`, then core/divide divides it by the salary, rounding
# once with `ca-sk/rate_rounding` (half-up to 0.0001); a salary of 0 gives 0.
#
# The third output is the marginal rate, the income tax rate on a further dollar of salary, built
# as the Alberta, Ontario and British Columbia returns build it, without a tax reduction. The
# federal part is read as in those returns: the T1 form exports line 73's bracket column rate and
# line 42900 "Basic federal tax", each totalled into the return's own kind, and
# core/amount_by_band_rate reads line 42900 through the `ca-sk/marginal_rate_gate` dataset (0 where
# the tax is 0.00, 1 from one cent) so that the rate counts only where its own tax is above zero;
# the gate multiplies the rate into `ca/federal_marginal_rate`, exact (`ca-sk/exact_rounding`).
#
# The Saskatchewan bracket rate is printed on SK428 line 5 only: one table of three columns
# ("Rate 10.5%", "Rate 12.5%" and "Rate 14.5%"), of which the column that line 1 falls in prints
# its rate. SK428 exports it, and a core/record_total step totals it into the return's own kind;
# there is a single line, so no core/sum is needed to join lines.
#
# The Saskatchewan gate reads SK428 line 67 "Line 62 minus line 66 (if negative, enter "0")": the
# Saskatchewan tax after the credits that payroll applies (CRA payroll deductions formulas T4127,
# Saskatchewan: K1P, the basic personal amount credit at the lowest rate, and the credits for CPP
# and EI and the other credit amounts, which reach line 66 through line 63), before line 68
# (minimum tax additional), line 70 (foreign tax credit) and lines 73, 79 and 81, which only come
# back when filing and are not payroll terms. Line 62 also holds line 59 (farm and small business
# capital gains tax credit) and line 61 (tax on split income), and line 66 holds line 64 (dividend
# tax credit) and line 65 (minimum tax carryover): none of those four is a payroll term, and all
# four are blank for a salary-only filer, so the gate is exact for that filer. Line 77 (the
# labour-sponsored venture capital credit) is the counterpart of T4127's LCP, which payroll does
# apply, but it needs an investment a salary-only filer does not have. The gate is the counterpart
# of ON428 line 81, AB428 line 68 and BC428 line 80. Gated through `ca-sk/marginal_rate_gate`, it
# multiplies the bracket rate into `ca-sk/saskatchewan_marginal_rate`.
#
# Saskatchewan has no tax reduction, clawback or income-tested basic amount: SK428 and T4127 print
# none (line 9 prints a flat basic personal amount, and the T4127 Saskatchewan section has no S,
# V1 or V2), so nothing raises the rate beyond the bracket rate and the chain has no reduction
# steps. SK428 line 9 prints a flat $19,491, so the gate does not depend on the basic amount that
# the January and July 2025 editions of T4127 print differently. The credit rate is a flat 10.5%,
# so the credits add nothing to the marginal rate either.
#
# The last step adds the federal and the Saskatchewan marginal rate with core/sum into
# `ca-sk/marginal_tax_rate`; it is exact too, is not printed on the form and has no title or line.
#
# The federal part ignores the federal basic personal amount phase-down and the Canada workers
# benefit phase-out, as the Ontario, Alberta and British Columbia returns do.
#
# Only line 167 carries a line reference: the steps below read figures for the rates and are
# engine-internal, so they carry none. Known limit: the rate ignores the tax effect of CPP and EI.
capabilities:
  - name: core/record_total
    title: "Refund or balance owing"
    reference: "167"
    unit: ca/cad
    consumes:
      records: ca/t1_tax_and_credits.refund_or_balance_owing
    produces:
      output: ca/refund_or_balance_owing
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca/t1_tax_and_credits.total_payable
    produces:
      output: ca/total_payable
  - name: core/record_total
    title: "Employment income, T1 line 10100"
    unit: ca/cad
    consumes:
      records: ca/t1_employment_income.employment_income_line_10100
    produces:
      output: ca/return_employment_income
  - name: core/divide
    unit: core/percent
    params:
      rounding: ca-sk/rate_rounding
    consumes:
      dividend: ca/total_payable
      divisor: ca/return_employment_income
    produces:
      output: ca-sk/average_income_tax_rate
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca/t1_tax_and_credits.federal_bracket_column_rate_line_73
    produces:
      output: ca/federal_bracket_rate_return
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca/t1_tax_and_credits.federal_tax_after_credits
    produces:
      output: ca/federal_tax_after_credits_return
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-sk/marginal_rate_gate
    consumes:
      base: ca/federal_tax_after_credits_return
    produces:
      output: ca/federal_rate_gate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-sk/exact_rounding
    consumes:
      base: ca/federal_rate_gate
      rate: ca/federal_bracket_rate_return
    produces:
      output: ca/federal_marginal_rate
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca-sk/sk428_credits.sk428_bracket_rate_line_5
    produces:
      output: ca-sk/saskatchewan_bracket_rate_return
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-sk/sk428.sk428_tax_after_credits_line_67
    produces:
      output: ca-sk/saskatchewan_tax_after_credits_return
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-sk/marginal_rate_gate
    consumes:
      base: ca-sk/saskatchewan_tax_after_credits_return
    produces:
      output: ca-sk/saskatchewan_rate_gate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-sk/exact_rounding
    consumes:
      base: ca-sk/saskatchewan_rate_gate
      rate: ca-sk/saskatchewan_bracket_rate_return
    produces:
      output: ca-sk/saskatchewan_marginal_rate
  - name: core/sum
    unit: core/percent
    params:
      rounding: ca-sk/exact_rounding
    consumes:
      parts:
        - ca/federal_marginal_rate
        - ca-sk/saskatchewan_marginal_rate
    produces:
      output: ca-sk/marginal_tax_rate
