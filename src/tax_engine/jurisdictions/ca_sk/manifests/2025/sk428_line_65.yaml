# Form SK428 (Saskatchewan Tax, 2025, CRA 5008-C) line 65 (ca-sk/sk428). "Saskatchewan minimum tax
# carryover:" / "Line 65: Amount from line 40427 of your return Line 61540 ^ multiplied by 50% = ^".
# The 50% is a printed rate, held in the `ca-sk/minimum_tax_rate` dataset, so box B of line 65 is
# one calculation: 50% of the amount, rounded half-up to the cent. The amount (box A) is the T1's
# line 40427: the T1 owns the input and exports the line (`ca/minimum_tax_carryover_line_40427`), so
# the first step totals that export (a form reads another form's export only as a record list) and
# the second applies the rate.
form:
  name: ca-sk/sk428
capabilities:
  - name: core/record_total
    title: "Amount from line 40427 of your return"
    reference: "65 box A"
    unit: ca/cad
    consumes:
      records: ca/t1_lines_copied_by_provinces.minimum_tax_carryover_line_40427
    produces:
      output: ca-sk/sk428_minimum_tax_carryover_amount_line_65
  - name: core/apply_rate
    title: "Saskatchewan minimum tax carryover"
    reference: "65 box B"
    unit: ca/cad
    params:
      rate: ca-sk/minimum_tax_rate
    consumes:
      base: ca-sk/sk428_minimum_tax_carryover_amount_line_65
    produces:
      output: ca-sk/sk428_minimum_tax_carryover_line_65
