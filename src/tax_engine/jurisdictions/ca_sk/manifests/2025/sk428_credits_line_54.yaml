# Form SK428 (Saskatchewan Tax, 2025, CRA 5008-c-25e) line 54 (ca-sk/sk428_credits): "Line 54 Amount
# from line 13 of your federal Schedule 9 multiplied by 10.5% =". The 10.5% is a printed rate, held
# in the `ca-sk/donations_credit_rate_line_54` dataset, so the step is one calculation: 10.5% of the
# Schedule 9 amount, rounded half-up to the cent. The amount is an optional input
# (sk428_credits_line_54_input.yaml), read as 0 when left out. The line has two boxes: the amount
# (box A, the input) and the multiplied result (box B, this step). The form does not name them; "box
# A" and "box B" are the owner's naming, as on ON428 line 47.
form:
  name: ca-sk/sk428_credits
capabilities:
  - name: core/apply_rate
    reference: "54 box B"
    unit: ca/cad
    params:
      rate: ca-sk/donations_credit_rate_line_54
    consumes:
      base: ca-sk/sk428_donations_amount_line_54
    blank:
      base: "0"
    produces:
      output: ca-sk/sk428_donations_credit_at_rate_line_54
