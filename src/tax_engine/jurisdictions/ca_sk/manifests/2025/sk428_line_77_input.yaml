# SK428 (2025) line 77's input, which a salary-only caller does not give.
# Line 77: "Line 77 and line 63557: Line 75 plus line 76 (maximum $875)" (Form SK428, CRA 5008-c).
# Lines 75 and 76, the labour-sponsored venture capital tax credits from the T2C slips, are not
# built, so a request that leaves the line out is read as blank; the line 77 step
# (sk428_line_77.yaml) checks it against the printed maximum and passes that blank on.
inputs:
  - name: ca-sk/sk428_labour_sponsored_credit_line_77
    title: "Labour-sponsored venture capital tax credit"
    reference: "77"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 77 and line 63557: Line 75 plus line 76 (maximum $875)'
