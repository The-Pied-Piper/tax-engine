# Form SK428 line 22 (58240) "Amount from line 30800 of your return" is a copy; the amount is read from
# Schedule 8 line 25, which arrives as a record list, so the one step is core/record_total over those
# records (same as ca-mb/mb428_credits line 19, mb428_credits_line_19.yaml). Form text read from CRA 5008-C.
form:
  name: ca-sk/sk428_credits
capabilities:
  - name: core/record_total
    title: "CPP or QPP contributions"
    reference: "22"
    unit: ca/cad
    consumes:
      records: ca/schedule_8.schedule_8_cpp_base_contributions_on_return
    produces:
      output: ca-sk/sk428_cpp_contributions_line_22
