# SK428 (2025) line 59's input, which a salary-only caller does not give.
# Line 59: "Line 59 and line 61499: Saskatchewan farm and small business capital gains tax credit
# (complete Form T1237)" (Form SK428, CRA 5008-C).
# Form T1237 is not built, so a request that leaves the line out is read as blank; the step that
# reads line 59 (line 60) reads that blank as 0.
inputs:
  - name: ca-sk/sk428_farm_capital_gains_credit_line_59
    title: "Saskatchewan farm and small business capital gains tax credit"
    reference: "59"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 59 and line 61499: Saskatchewan farm and small business capital gains tax credit (complete Form T1237)'
