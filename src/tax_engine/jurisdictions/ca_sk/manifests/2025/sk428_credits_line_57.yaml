# Form SK428 (CRA 5008-c) line 57: "Line 57 and line 61500: Line 53 plus line 56 Enter this amount
# on line 63. Saskatchewan non-refundable tax credits =". It sums the credits at the printed rate
# (line 53, `ca-sk/sk428_credits_at_rate_line_53`) and the donations credit (line 56,
# `ca-sk/sk428_donations_credit_line_56`). Lines 54 and 55 are not built: line 56 is an input that
# a salary-only caller leaves out, read as blank and then as 0 by the blank rule below. Line 57 is
# the output `ca-sk/sk428_non_refundable_credits_line_57`, which the form exports for line 63.
form:
  name: ca-sk/sk428_credits
capabilities:
  - name: core/sum
    title: "Saskatchewan non-refundable tax credits"
    reference: "57"
    unit: ca/cad
    params:
      rounding: ca-sk/cent_rounding
    consumes:
      parts: [ca-sk/sk428_credits_at_rate_line_53, ca-sk/sk428_donations_credit_line_56]
    blank:
      ca-sk/sk428_donations_credit_line_56: "0"
    produces:
      output: ca-sk/sk428_non_refundable_credits_line_57
