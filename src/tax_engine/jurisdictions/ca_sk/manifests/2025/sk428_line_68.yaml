# Form SK428 (Saskatchewan Tax, 2025, CRA 5008-C) line 68 (ca-sk/sk428). "Saskatchewan additional
# tax for minimum tax purposes:" / "Line 68: Form T691: Line 1 minus Line 2 of Part 7 ^ multiplied
# by 50% = ^". The 50% is a printed rate, held in the `ca-sk/minimum_tax_rate` dataset, so box B of
# line 68 is one calculation: 50% of the amount, rounded half-up to the cent. The amount (box A) is
# the T691's Part 7 line 14: the T691 owns the input and exports the line
# (`ca/t691_additional_taxes_for_minimum_tax_carryover_line_14`), so the first step totals that
# export (a form reads another form's export only as a record list) and the second applies the
# rate. The printed "line 1 minus line 2 of Part 7" is read as T691 Part 7 line 14, the same figure BC and NL print.
form:
  name: ca-sk/sk428
capabilities:
  - name: core/record_total
    title: "Form T691: Line 1 minus Line 2 of Part 7"
    reference: "68 box A"
    unit: ca/cad
    consumes:
      records: ca/t691.t691_additional_taxes_for_minimum_tax_carryover_line_14
    produces:
      output: ca-sk/sk428_minimum_tax_t691_amount_line_68
  - name: core/apply_rate
    title: "Saskatchewan additional tax for minimum tax purposes"
    reference: "68 box B"
    unit: ca/cad
    params:
      rate: ca-sk/minimum_tax_rate
    consumes:
      base: ca-sk/sk428_minimum_tax_t691_amount_line_68
    produces:
      output: ca-sk/sk428_minimum_tax_additional_line_68
