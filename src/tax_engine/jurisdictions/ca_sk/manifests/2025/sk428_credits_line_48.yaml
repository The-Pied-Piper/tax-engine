# SK428 (2025) line 48 (Form SK428, CRA 5008-c-25e): "Line 48: Line 43 minus line 47 (if negative,
# enter "0") =". Line 43 is the amount from T1 line 33099 (sk428_credits_line_43.yaml)
# and line 47 is the lesser of the printed ceiling and line 46 (sk428_credits_line_47.yaml). Line 48
# is one core/subtract_not_below_zero step, rounded half-up to the cent by the dataset's rule. A
# request that leaves line 43 blank has no medical expenses, so a blank line 43 is read as 0 and
# line 48 is 0.00. The form names no label for the line, so the step has no title.
form:
  name: ca-sk/sk428_credits
capabilities:
  - name: core/subtract_not_below_zero
    reference: "48"
    unit: ca/cad
    params:
      rounding: ca-sk/cent_rounding
    consumes:
      amount: ca-sk/sk428_medical_expenses_line_43
      less: ca-sk/sk428_medical_expenses_limited_amount_line_47
    blank:
      amount: "0"
    produces:
      output: ca-sk/sk428_medical_expenses_over_limit_line_48
