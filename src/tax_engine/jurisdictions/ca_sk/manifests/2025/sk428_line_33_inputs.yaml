# SK428 (2025) line 33 input a salary-only caller does not give.
# Line 33 and line 58360: "Line 33 and line 58360: Pension income amount (maximum $1,000)" (Form SK428, CRA 5008-c).
# A salary-only caller has no pension income, so a request that leaves the line out is read as 0,
# not blank.
inputs:
  - name: ca-sk/sk428_pension_income_amount
    title: "Pension income amount"
    reference: "33"
    unit: ca/cad
    required: false
    default: "0"
    basis: 'Line 33 and line 58360: Pension income amount (maximum $1,000)'
