# Saskatchewan \"if you were born in 1960 or earlier\", 2025 tax year: SK428 line 10 \"Age amount (if you were born in 1960 or earlier)\" and line 19 \"Senior supplementary amount (if you were born in 1960 or earlier)\" (CRA 5008-C). The filer gives a birth year; one condition, in the form's wording turned round because the conditions only test \"more than\": the birth year is more than 1960, in which case the count is 0 (not born in 1960 or earlier), else 1. The result is a count, not a dollars-and-cents box, so there is no rounding.
family: ca-sk/born_in_1960_or_earlier_conditions
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5008-c/5008-c-25e.txt
rounding: none
count_when_any_applies: "0"
conditions:
  - text: You were born after 1960
    parts:
      - tests:
          - {reads: count, position: "1", relation: more_than, than: "1960"}
