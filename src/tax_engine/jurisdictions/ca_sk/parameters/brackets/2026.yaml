# Provisional: taken from T4127 (Jan 2026); to be confirmed against the 2026 form text when CRA publishes it.
# Derivation: thresholds 54,532 and 155,805 and rates 10.5%, 12.5%, 14.5% as printed in T4127 (Jan 2026) Table 8.1; tax_at_start derived as the 2025 form does (54,532 x 10.5% = 5,725.86; plus (155,805 - 54,532) x 12.5% = 18,384.985, rounded half-up to 18,384.99) because the 2026 line 7 constants are not yet published.
# Saskatchewan 2026 brackets, Form SK428 (CRA 5008-C) Part A, lines 2 to 8, columns 1 to 3. Column
# headings: "Column 1: Line 1 is $54,532 or less"; "Column 2: Line 1 is more than $54,532 but not
# more than $155,805"; "Column 3: Line 1 is more than $155,805". In every column: line 3 the
# column's lower bound (0.00, 54,532.00, 155,805.00); line 5 the rate (10.5%, 12.5%, 14.5%); line 7
# the printed constant (0.00, 5,725.86, 18,384.99). Lines 3, 5 and 7 are the printed figures; lines
# 2, 4, 6 and 8 are computed.
# Each bracket's `tax_at_start` is the line 7 constant of its column, taken as printed: the
# constants are not recomputed from the rates, and not rounded.
# This dataset has no rounding rule, as the form states none. The take-home build rounds line 6
# half-up to the cent in its own part (ca-sk/cent_rounding).
# There is no `up_to`: column 3 is unbounded ("more than $155,805"), and the form prints one set
# of three columns, so every line 1 falls in a column.
# The 2026 SK428 text is not yet published, so the figure is not yet confirmed against it.
family: ca-sk/brackets
tax_year: 2026
kind: brackets
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pub/t4127-jan/t4127-01-26e.pdf
rounding: none
brackets:
  - {from: "0.00", rate: "0.105", tax_at_start: "0.00"}
  - {from: "54532.00", rate: "0.125", tax_at_start: "5725.86"}
  - {from: "155805.00", rate: "0.145", tax_at_start: "18384.99"}
