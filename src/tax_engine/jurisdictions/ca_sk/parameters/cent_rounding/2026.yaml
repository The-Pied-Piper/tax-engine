# Provisional: taken from the 2025 form text named in sources; to be confirmed against the 2026 form text when CRA publishes it.
# Derivation: carried forward unchanged from the 2025 file; the 2026 form is not yet published.
# Saskatchewan cent rounding, 2026 tax year: the rule for every Saskatchewan form line that is a
# dollars-and-cents box and is read from a "(if negative, enter "0")" or "(cannot be negative)"
# difference, from a sum, or from a product of two lines: Form SK428 (5008-C). The form states no
# rounding rule, so half-up to the cent is the project's choice. A line that needs a different rule
# gets a dataset of its own.
# The 2026 SK428 text is not yet published, so the figure is not yet confirmed against it.
family: ca-sk/cent_rounding
tax_year: 2026
kind: rounding_only
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5008-c/5008-c-25e.txt
rounding: {increment: "0.01", mode: half_up}
