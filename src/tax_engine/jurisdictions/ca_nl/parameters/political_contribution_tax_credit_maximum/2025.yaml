# Form NL428 line 76: political contribution tax credit, maximum, 2025 (CRA 5001-c).
# Line 76 prints "Newfoundland and Labrador political contribution tax credit (use Worksheet NL428)
# (maximum $500)", a figure with no cents, so the amount rounds half-up to the cent, the project's
# choice, as the form states no rounding rule. It is claimed whole: the credit kind, as
# ca-nl/pension_income_amount_maximum is.
family: ca-nl/political_contribution_tax_credit_maximum
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5001-c/5001-c-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "500"
