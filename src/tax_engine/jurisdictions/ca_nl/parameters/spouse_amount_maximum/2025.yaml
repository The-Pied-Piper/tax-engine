# Newfoundland and Labrador spouse or common-law partner amount, maximum, 2025 tax year (Form
# NL428 line 20 and line 58120): "Line 18 minus line 19 (if negative, enter "0") (maximum
# $9,043)". It borrows the credit kind because it is held as a printed figure that line 20 reads
# as an artifact, as the base amount is.
# Line 20 is a dollars-and-cents box, so the amount rounds half-up to the cent, the project's
# choice, as the form states no rounding rule.
family: ca-nl/spouse_amount_maximum
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5001-c/5001-c-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "9043.00"
