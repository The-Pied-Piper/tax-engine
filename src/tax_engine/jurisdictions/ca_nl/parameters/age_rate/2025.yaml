# Age amount reduction rate, 2025 tax year (Worksheet NL428, form 5001-D): "Line 58080 -
# Age amount", line 5 "Applicable rate 15%", by which line 6 "Line 4 multiplied by the
# percentage from line 5" multiplies line 4. The worksheet's "$85,806 or more, enter "0""
# follows from the arithmetic, as 7,064 less 15% of (85,806 - 38,712) is zero, so it is not a
# dataset.
# Line 6 is a dollars-and-cents box, so the product rounds half-up to the cent, the
# project's choice, as the form states no rounding rule.
family: ca-nl/age_rate
tax_year: 2025
kind: rate
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5001-d/5001-d-25e.txt
rounding: {increment: "0.01", mode: half_up}
rate: "0.15"
