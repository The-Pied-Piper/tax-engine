# Condition of the low-income threshold on Form NL428 line 100, 2026 tax year (CRA 5001-C).
family: ca-nl/low_income_threshold_conditions
tax_year: 2026
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5001-c/5001-c-25e.txt
rounding: none
count_when_any_applies: "1"
conditions:
  - text: You claimed an amount on line 96
    parts:
      - tests:
          - {reads: amount, position: "1", relation: more_than, than: "0"}
  - text: You claimed an amount on line 97
    parts:
      - tests:
          - {reads: amount, position: "2", relation: more_than, than: "0"}
