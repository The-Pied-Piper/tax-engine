# Age amount", line 3 "Income threshold 38,712.00", from which line 4 "Line 2 minus line 3 (if
# negative, enter "0")" takes line 2 "Amount from line 23600 of your return". It borrows the
# credit kind because it is a printed amount taken whole, as the basic reduction is.
# Line 3 is a dollars-and-cents box, so the amount rounds half-up to the cent, the
