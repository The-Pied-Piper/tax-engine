# Newfoundland and Labrador low-income tax reduction slope, 2025 tax year (Form NL428 line 102,
# "Applicable rate 16%"): a two-band chart the return summary reads line 103 "Line 101 multiplied by
# the percentage from line 102" through (core/amount_by_band_rate). A base of 0.00 gives 0 and a base
# of one cent or more gives the printed 16%, so the slope of the low-income tax reduction counts in
# the marginal tax rate only where line 103 is above zero (an adjusted family income above the
# line 100 threshold). The rate is the same figure as `ca-nl/low_income_reduction_rate`, which rounds
# half-up to the cent as it feeds a dollars-and-cents box, so this chart carries it with no
# rounding. A base exactly at a row's `over` is in the lower band, so the second row starts above
# 0.005: no cent amount is in the first band but 0.00, and 0.01 is in the second.
family: ca-nl/reduction_slope
tax_year: 2025
kind: amount_by_band
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5001-c/5001-c-25e.txt
rounding: none
rows:
  - {over: "0", amount: "0"}
  - {over: "0.005", minus: "0", rate: "0.16", plus: "0"}
