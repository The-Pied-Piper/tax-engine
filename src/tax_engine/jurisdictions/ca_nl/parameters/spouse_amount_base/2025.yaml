# Newfoundland and Labrador spouse or common-law partner amount, base amount, 2025 tax year
# (Form NL428 line 18): "Base amount 9,948.00", from which line 20 takes line 19, the spouse's
# or partner's net income. It borrows the credit kind because it is claimed whole, as the basic
# personal amount is.
# Line 18 is a dollars-and-cents box, so the amount rounds half-up to the cent, the project's
# choice, as the form states no rounding rule.
family: ca-nl/spouse_amount_base
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5001-c/5001-c-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "9948.00"
