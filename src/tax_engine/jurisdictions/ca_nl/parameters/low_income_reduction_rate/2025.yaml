# Newfoundland and Labrador low income reduction rate, 2025 tax year (Form NL428 line 102):
# "Line 102: Applicable rate 16%". The printed percentage is a rate of 0.16, read by the line 102
# multiplication; the product is a dollars-and-cents line, so it rounds half-up to the cent, the
# project's choice, as the form states no rounding rule.
family: ca-nl/low_income_reduction_rate
tax_year: 2025
kind: rate
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5001-c/5001-c-25e.txt
rounding: {increment: "0.01", mode: half_up}
rate: "0.16"
