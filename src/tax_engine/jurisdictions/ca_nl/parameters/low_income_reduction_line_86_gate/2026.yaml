# Provisional: taken from the 2025 form text named in sources; to be confirmed against the 2026 form text when CRA publishes it.
# Derivation: carried forward unchanged from the 2025 file; the 2026 form is not yet published.
# Line 86 gate, 2026 tax year (Form NL428 line 86, and the instruction under line 87: "If you are
# claiming an amount on line 86, enter the amount from line 87 on line 94, enter "0" on line 104,
# and continue on line 105."). Not a CRA figure and not printed on any form: the rows are a switch
# that gives 1 where line 86 is 0.00, so line 104 stands, and 0 where an amount is claimed on line
# 86, so line 104 is "0" as the form prints. A base of 0.00 gives 1 and a base of one cent or more
# gives 0.
# A base exactly at a row's `over` is in the lower band, so the second row starts above 0.005: no
# cent amount is in the first band but 0.00, and 0.01 is in the second.
family: ca-nl/low_income_reduction_line_86_gate
tax_year: 2026
kind: amount_by_band
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5001-c/5001-c-25e.txt
rounding: none
rows:
  - {over: "0", amount: "1"}
  - {over: "0.005", amount: "0"}
