# Form NL428 (Newfoundland and Labrador Tax, CRA 5001-C) line 97 and line 61890: "Reduction for an
# eligible dependant claimed on line 58160 Claim $557". Line 58160 is line 23 of the other form
# `ca-nl/nl428_credits`, which exports it, so the first step is a core/record_total over that export,
# as line 66 reads line 62. The second step is core/amount_by_band over that figure: the
# `ca-nl/low_income_reduction_dependant_gate` dataset gives the printed 557 where line 23 is above 0
# and 0 where it is 0.00. A request that leaves line 22 blank has no eligible dependant, so line 23
# is blank; the first step reads that blank as 0 (the band step cannot take a blank), so no amount is
# claimed on line 58160 and line 97 is 0.00.
form:
  name: ca-nl/nl428
capabilities:
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-nl/nl428_credits.nl428_eligible_dependant_amount_line_23
    blank:
      records:
        ca-nl/nl428_eligible_dependant_amount_line_23: "0"
    produces:
      output: ca-nl/nl428_eligible_dependant_claimed_line_97
  - name: core/amount_by_band
    title: "Reduction for an eligible dependant claimed on line 58160"
    reference: "97"
    unit: ca/cad
    params:
      table: ca-nl/low_income_reduction_dependant_gate
    consumes:
      base: ca-nl/nl428_eligible_dependant_claimed_line_97
    produces:
      output: ca-nl/nl428_low_income_reduction_dependant_line_97
