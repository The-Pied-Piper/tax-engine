# Worksheet NL428 (CRA 5001-D) 2025, section "Line 58080 - Age amount", lines 1 and 7: "Line 1:
# Maximum amount 7,064.00" and "Line 7: Line 1 minus line 6 (if negative, enter "0") Enter this
# amount on line 58080 of your Form NL428. = ^". The form names no label for either line, so no
# step has a title. Line 7 is the part's final step and carries the number; line 1 is a step toward
# it, so it carries no reference. Line 1 is the printed maximum from the `ca-nl/age_maximum`
# dataset, claimed whole: core/credit_amount. Line 7 is line 1 minus line 6, not below zero,
# rounded half-up to the cent. Neither input is ever blank, so the subtraction has no blank rule.
form:
  name: ca-nl/nl428_worksheet
capabilities:
  - name: core/credit_amount
    unit: ca/cad
    params:
      amount: ca-nl/age_maximum
    produces:
      output: ca-nl/worksheet_nl428_age_amount_maximum_line_1
  - name: core/subtract_not_below_zero
    reference: "7"
    unit: ca/cad
    params:
      rounding: ca-nl/cent_rounding
    consumes:
      amount: ca-nl/worksheet_nl428_age_amount_maximum_line_1
      less: ca-nl/worksheet_nl428_age_amount_line_6
    produces:
      output: ca-nl/worksheet_nl428_age_amount_line_7
