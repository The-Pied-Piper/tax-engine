# NL428 (2025) line 60's input, the amount from the federal Schedule 9. Form NL428 (CRA 5001-C): "Line
# 60: Amount from line 14 of your federal Schedule 9 multiplied by 21.8% =". The line has two boxes:
# the amount (box A, the input here) and the multiplied result (box B, the step in
# nl428_credits_line_60.yaml). The engine does not compute Schedule 9, so the amount is taken as one
# optional input, the way the form takes it. A request that leaves the line out is read as blank;
# the step that multiplies it reads that blank as 0.
form:
  name: ca-nl/nl428_credits
inputs:
  - name: ca-nl/nl428_donations_amount_line_60
    title: "Amount from line 14 of your federal Schedule 9"
    reference: "60 box A"
    unit: ca/cad
    required: false
    default: null
    basis: "Line 60: Amount from line 14 of your federal Schedule 9"
