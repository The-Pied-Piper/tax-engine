# NL428 (2025) line 20, the spouse or common-law partner amount. Form NL428 (CRA 5001-C): "Line 20
# and line 58120: Line 18 minus line 19 (if negative, enter "0") (maximum $9,043) =". Line 18 is a
# printed figure, held in the `ca-nl/spouse_amount_base` dataset (9,948), and the maximum in the
# `ca-nl/spouse_amount_maximum` dataset (9,043); core/credit_amount produces each as an artifact so
# the line can read them. Line 19 is the optional input of its own part.
#
# Line 20 is for a filer with a spouse or common-law partner: a request that leaves line 19 blank
# has none, so the line is blank. The difference, not below 0, passes a blank line 19 on, and the
# lesser of that and the printed maximum passes it on again. The line's number is on the final step
# only.
form:
  name: ca-nl/nl428_credits
capabilities:
  - name: core/credit_amount
    params:
      amount: ca-nl/spouse_amount_base
    produces:
      output: ca-nl/spouse_amount_base
  - name: core/credit_amount
    params:
      amount: ca-nl/spouse_amount_maximum
    produces:
      output: ca-nl/spouse_amount_maximum
  - name: core/subtract_not_below_zero
    unit: ca/cad
    params:
      rounding: ca-nl/cent_rounding
    consumes:
      amount: ca-nl/spouse_amount_base
      less: ca-nl/nl428_spouse_net_income_line_19
    blank:
      less: pass_on
    produces:
      output: ca-nl/nl428_spouse_amount_before_maximum_line_20
  - name: core/lesser_of
    reference: "20"
    unit: ca/cad
    consumes:
      amounts:
        - ca-nl/nl428_spouse_amount_before_maximum_line_20
        - ca-nl/spouse_amount_maximum
    blank:
      amounts: pass_on
    produces:
      output: ca-nl/nl428_spouse_amount_line_20
