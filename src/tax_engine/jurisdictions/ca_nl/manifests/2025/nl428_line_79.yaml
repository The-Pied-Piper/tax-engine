# Form NL428 (Newfoundland and Labrador Tax, CRA 5001-C) line 79 "Line 79: Line 77 minus line 78 (if
# negative, enter "0") =". One core/subtract_not_below_zero step: the tax after the political
# contribution tax credit (line 77, `ca-nl/nl428_tax_line_77`) less the direct equity tax credit
# (line 78, `ca-nl/nl428_direct_equity_tax_credit_line_78`), not below 0. Line 78 is an optional
# input that a salary-only caller leaves blank, read as 0 by the blank rule. The form prints no
# title for the line, so the step has none. The output is `ca-nl/nl428_tax_line_79`, which is not
# exported yet.
form:
  name: ca-nl/nl428
capabilities:
  - name: core/subtract_not_below_zero
    reference: "79"
    unit: ca/cad
    params:
      rounding: ca-nl/cent_rounding
    consumes:
      amount: ca-nl/nl428_tax_line_77
      less: ca-nl/nl428_direct_equity_tax_credit_line_78
    blank:
      less: "0"
    produces:
      output: ca-nl/nl428_tax_line_79
