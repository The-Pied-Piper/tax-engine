# Form NL428 (Newfoundland and Labrador Tax, CRA 5001-C) Part C, line 63 "Line 63: Newfoundland and
# Labrador tax on taxable income from line 8 or 15 ^". Line 8 says "enter the amount from line 8 on
# line 63" and line 15 says "enter the amount from line 15 on line 63". A taxable income is in one
# table only, so the other line is blank; this form reads both exports of `ca-nl/nl428_credits` and
# gives the one that has a figure.
form:
  name: ca-nl/nl428
capabilities:
  - name: ca-nl/tax_on_taxable_income
    title: "Newfoundland and Labrador tax on taxable income from line 8 or 15"
    reference: "63"
    unit: ca/cad
    consumes:
      line_8: ca-nl/nl428_credits.nl428_tax_on_taxable_income_line_8
      line_15: ca-nl/nl428_credits.nl428_tax_on_taxable_income_line_15
    blank:
      line_8:
        ca-nl/nl428_tax_on_taxable_income_line_8: compute
      line_15:
        ca-nl/nl428_tax_on_taxable_income_line_15: compute
    produces:
      output: ca-nl/nl428_newfoundland_and_labrador_tax_on_taxable_income_line_63
