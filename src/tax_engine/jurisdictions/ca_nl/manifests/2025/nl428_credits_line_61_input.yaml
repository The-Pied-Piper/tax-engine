# NL428 (2025) inputs a salary-only caller does not give.
# Line 61: "Line 61 and line 58969: Line 59 plus line 60" (Form NL428, CRA 5001-C). Lines 59 and 60
# (the federal Schedule 9 donation amounts at 8.7% and 21.8%) exist only for a blank optional
# claim, so that block is skipped and the printed sum is taken as one optional input the way the
# form takes it. A request that leaves the line out is read as blank.
form:
  name: ca-nl/nl428_credits
inputs:
  - name: ca-nl/nl428_donations_and_gifts_credit_line_61
    title: "Donations and gifts"
    reference: "61"
    unit: ca/cad
    required: false
    default: null
    basis: "Line 61 and line 58969: Line 59 plus line 60"
