# NL428 (2025) inputs a salary-only caller does not give.
# Line 48: "Line 48 and line 58689: Amount from line 33099 of your return" (Form NL428, CRA 5001-C).
# The engine does not compute medical expenses, so the figure is taken as one optional input the
# way the form takes it, an amount from T1 line 33099. A request that leaves the line out is read
# as blank. Line 53 (a later ticket) reads it.
inputs:
  - name: ca-nl/nl428_medical_expenses_line_48
    title: "Amount from line 33099 of your return"
    reference: "48"
    unit: ca/cad
    required: false
    default: null
    basis: "Line 48 and line 58689: Amount from line 33099 of your return"
