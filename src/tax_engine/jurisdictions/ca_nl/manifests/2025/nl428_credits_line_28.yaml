# Form NL428 (CRA 5001-C) line 28: "Line 28 and line 58280: Amount from line 31000 of your return".
# A copy of T1 line 31000, which the T1 owns and exports
# (`ca/self_employment_cpp_qpp_contributions_line_31000`), so the one step is core/record_total over
# that export (a form reads another form's export only as a record list), as line 27 does. A salary-
# only caller has no such amount, so the total is 0.
form:
  name: ca-nl/nl428_credits
capabilities:
  - name: core/record_total
    title: "Amount from line 31000 of your return"
    reference: "28"
    unit: ca/cad
    consumes:
      records: ca/t1_lines_copied_by_provinces.self_employment_cpp_qpp_contributions_line_31000
    produces:
      output: ca-nl/nl428_qpp_contributions_line_28
