# Form NL428 (Newfoundland and Labrador Tax, CRA 5001-C) Part A, line 6, "Line 6: Line 4 multiplied
# by the percentage from line 5 =": the tax on the taxable income over the column's lower bound.
# Line 6 is line 4 times the printed rate of the column from line 5, rounded half-up to the cent by
# the dataset's rounding rule (the form states no rounding rule). Above 220,910 lines 4 and 5 are
# blank (lines 9 to 15 apply), so line 6 is blank too.
form:
  name: ca-nl/nl428_credits
capabilities:
  - name: core/multiply_by_rate
    reference: "6"
    unit: ca/cad
    params:
      rounding: ca-nl/cent_rounding
    consumes:
      base: ca-nl/nl428_taxable_income_over_lower_bound_line_4
      rate: ca-nl/nl428_bracket_rate_line_5
    blank:
      base: pass_on
      rate: pass_on
    produces:
      output: ca-nl/nl428_tax_on_excess_line_6
