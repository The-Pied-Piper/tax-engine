# Worksheet NL428 (CRA 5001-D) 2025, section "Line 58440 - Disability amount for self", lines 1 and
# 7: "Line 1: Base amount 7,467.00" and "Line 7: Line 1 plus line 6 Enter this amount on line 58440
# of your Form NL428. (maximum $10,981)". The form names no label for either line, so no step has
# a title. Line 7 is the part's final step and carries the number; line 1 is a step toward it, so
# it carries no reference. Line 1 is the printed base amount from the
# `ca-nl/disability_self_base_amount` dataset, claimed whole: core/credit_amount. Line 7 is line 1
# plus line 6, rounded half-up to the cent. The printed "(maximum $10,981)" is line 1 plus line 2
# and line 6 is never above line 2, so it cannot bind and is not a step. Neither input is ever
# blank, so the sum has no blank rule.
form:
  name: ca-nl/nl428_worksheet
capabilities:
  - name: core/credit_amount
    unit: ca/cad
    params:
      amount: ca-nl/disability_self_base_amount
    produces:
      output: ca-nl/worksheet_nl428_disability_self_base_amount_line_1
  - name: core/sum
    reference: "7"
    unit: ca/cad
    params:
      rounding: ca-nl/cent_rounding
    consumes:
      parts:
        - ca-nl/worksheet_nl428_disability_self_base_amount_line_1
        - ca-nl/worksheet_nl428_disability_self_supplement_line_6
    produces:
      output: ca-nl/worksheet_nl428_disability_self_line_7
