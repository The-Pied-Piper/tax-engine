# NL428 (2025) inputs a salary-only caller does not give.
# Line 32: "Line 32 and line 58316: Search and rescue volunteers' amount" (Form NL428, CRA 5001-C).
# The engine does not compute the claim, so the figure is taken as one optional input the way the
# form takes it, a dollar amount entered on the line. A request that leaves the line out is read as
# blank. A later line reads it.
form:
  name: ca-nl/nl428_credits
inputs:
  - name: ca-nl/nl428_search_and_rescue_volunteers_amount_line_32
    title: "Search and rescue volunteers' amount"
    reference: "32"
    unit: ca/cad
    required: false
    default: null
    basis: "Line 32 and line 58316: Search and rescue volunteers' amount"
