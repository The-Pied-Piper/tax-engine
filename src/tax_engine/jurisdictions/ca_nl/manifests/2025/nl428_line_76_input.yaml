# NL428 (2025) inputs a salary-only caller does not give.
# Line 76: "Newfoundland and Labrador political contribution tax credit (use Worksheet NL428)
# (maximum $500)" (Form NL428, CRA 5001-C). The credit is a worksheet result the engine does not
# compute, and line 75 (the contributions made) is not built. A salary-only caller has no political
# contributions, so a request that leaves the line out is read as blank; line 76
# (nl428_line_76.yaml) checks it against the printed maximum and passes that blank on.
form:
  name: ca-nl/nl428
inputs:
  - name: ca-nl/nl428_political_contribution_tax_credit_claimed_line_76
    title: "Newfoundland and Labrador political contribution tax credit"
    reference: "76"
    unit: ca/cad
    required: false
    default: null
    basis: "Line 76: Newfoundland and Labrador political contribution tax credit (use Worksheet NL428) (maximum $500)"
