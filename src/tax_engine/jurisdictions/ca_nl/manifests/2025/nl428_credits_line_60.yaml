# Form NL428 (CRA 5001-C) line 60 (ca-nl/nl428_credits): "Line 60: Amount from line 14 of your federal
# Schedule 9 multiplied by 21.8% =". The 21.8% is a printed rate, held in the
# `ca-nl/donations_credit_rate_line_60` dataset, so the step is one calculation: 21.8% of the Schedule 9
# amount, rounded half-up to the cent. The amount is an optional input
# (nl428_credits_line_60_input.yaml), read as 0 when left out. The line has two boxes: the amount (box
# A, the input) and the multiplied result (box B, this step). The form does not name them; "box A"
# and "box B" are the owner's naming, as on ON428 line 47.
form:
  name: ca-nl/nl428_credits
capabilities:
  - name: core/apply_rate
    reference: "60 box B"
    unit: ca/cad
    params:
      rate: ca-nl/donations_credit_rate_line_60
    consumes:
      base: ca-nl/nl428_donations_amount_line_60
    blank:
      base: "0"
    produces:
      output: ca-nl/nl428_donations_credit_at_rate_line_60
