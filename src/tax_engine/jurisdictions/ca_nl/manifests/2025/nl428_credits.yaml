# Form NL428 Newfoundland and Labrador Tax 2025 (CRA 5001-C), lines 1 to 62. This part names the form
# and its exports; line parts carry capabilities. Exports: line 5 (`ca-nl/nl428_bracket_rate_line_5`)
# and line 12 (`ca-nl/nl428_bracket_rate_line_12`), the bracket rates the return summary reads for
# the Newfoundland and Labrador marginal rate; line 8 (`ca-nl/nl428_tax_on_taxable_income_line_8`)
# and line 15 (`ca-nl/nl428_tax_on_taxable_income_line_15`), which line 63 on the tax form reads;
# and line 62 (`ca-nl/nl428_non_refundable_credits_line_62`), which line 66 on the tax form reads.
form:
  name: ca-nl/nl428_credits
  title: "Form NL428: Newfoundland and Labrador Tax"
  required: true
  exports:
    - ca-nl/nl428_bracket_rate_line_5
    - ca-nl/nl428_tax_on_taxable_income_line_8
    - ca-nl/nl428_bracket_rate_line_12
    - ca-nl/nl428_tax_on_taxable_income_line_15
    - ca-nl/nl428_non_refundable_credits_line_62
capabilities: []
