# NL428 (2025) line 23, the amount for an eligible dependant. Form NL428 (CRA 5001-C): "Line 23
# and line 58160: Line 21 minus line 22 (if negative, enter "0") (maximum $9,043) =". Line 21 is a
# printed figure, held in the `ca-nl/eligible_dependant_amount_base` dataset (9,948), and the
# maximum in the `ca-nl/eligible_dependant_amount_maximum` dataset (9,043); core/credit_amount
# produces each as an artifact so the line can read them. Line 22 is the optional input of its own
# part.
#
# Line 23 is for a filer with an eligible dependant: a request that leaves line 22 blank has none,
# so the line is blank. The difference, not below 0, passes a blank line 22 on, and the lesser of
# that and the printed maximum passes it on again.
#
# The spouse amount and the eligible dependant amount are not both allowed: the form text is silent,
# but NL Income Tax Act, 2000, s. 9(1)(b) gives the eligible dependant amount only to an individual
# who does not claim the spouse amount. So line 23 reads line 20 (same form): core/amount_by_band
# over line 20 is the unprinted most line 23 may be (the printed maximum where line 20 is 0.00, 0
# where an amount is claimed on line 20; a blank line 20 has no spouse and is read as 0), and
# core/at_most is line 23, passing the lesser-of figure on or refusing the return when it is above
# that most (both claimed). A blank lesser-of figure is passed on blank. The line's number is on
# the final step only.
form:
  name: ca-nl/nl428_credits
capabilities:
  - name: core/credit_amount
    params:
      amount: ca-nl/eligible_dependant_amount_base
    produces:
      output: ca-nl/eligible_dependant_amount_base
  - name: core/credit_amount
    params:
      amount: ca-nl/eligible_dependant_amount_maximum
    produces:
      output: ca-nl/eligible_dependant_amount_maximum
  - name: core/subtract_not_below_zero
    unit: ca/cad
    params:
      rounding: ca-nl/cent_rounding
    consumes:
      amount: ca-nl/eligible_dependant_amount_base
      less: ca-nl/nl428_eligible_dependant_net_income_line_22
    blank:
      less: pass_on
    produces:
      output: ca-nl/nl428_eligible_dependant_amount_before_maximum_line_23
  - name: core/lesser_of
    unit: ca/cad
    consumes:
      amounts:
        - ca-nl/nl428_eligible_dependant_amount_before_maximum_line_23
        - ca-nl/eligible_dependant_amount_maximum
    blank:
      amounts: pass_on
    produces:
      output: ca-nl/nl428_eligible_dependant_amount_before_check_line_23
  - name: core/amount_by_band
    unit: ca/cad
    params:
      table: ca-nl/eligible_dependant_spouse_gate
    consumes:
      base: ca-nl/nl428_spouse_amount_line_20
    blank:
      base: "0"
    produces:
      output: ca-nl/nl428_eligible_dependant_amount_most_line_23
  - name: core/at_most
    reference: "23"
    unit: ca/cad
    consumes:
      amount: ca-nl/nl428_eligible_dependant_amount_before_check_line_23
      bound: ca-nl/nl428_eligible_dependant_amount_most_line_23
    blank:
      amount: pass_on
    produces:
      output: ca-nl/nl428_eligible_dependant_amount_line_23
