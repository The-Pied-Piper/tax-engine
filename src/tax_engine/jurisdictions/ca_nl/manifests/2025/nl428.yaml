# Form NL428 Newfoundland and Labrador Tax 2025 (CRA 5001-C), lines 63 to 105 (Part C, tax and the
# low-income tax reduction). Lines 106 to 108 (the unused amount a spouse or common-law partner can
# claim) are deferred. This part names the form and its export; the form is one form, so its lines
# read each other directly. Exports: line 103, the low-income tax reduction clawback
# (`ca-nl/nl428_line_103`), line 104, the low-income tax reduction (`ca-nl/nl428_line_104`), and
# line 105, the Newfoundland and Labrador tax (`ca-nl/nl428_newfoundland_and_labrador_tax_line_105`),
# which line 105 says to enter on line 42800 of the return; the return summary reads lines 103 and
# 104 and line 105 for the marginal tax rate. The form supplies line 105 as
# `ca/provincial_tax.amount`, the name the federal T1 reads.
form:
  name: ca-nl/nl428
  title: "Form NL428: Newfoundland and Labrador Tax"
  required: true
  exports:
    - ca-nl/nl428_line_103
    - ca-nl/nl428_line_104
    - ca-nl/nl428_newfoundland_and_labrador_tax_line_105
  supplies:
    ca/provincial_tax.amount: ca-nl/nl428_newfoundland_and_labrador_tax_line_105
capabilities: []
