# NL428 (2025) line 89's column 2 input, which a salary-only caller does not give.
# Line 89: "Total of the universal child care benefit (UCCB) repayment (line 21300 of the return) and
# the registered disability savings plan (RDSP) income repayment (included on line 23200 of the
# return)" (Form NL428, CRA 5001-C), column 2 (your spouse or common-law partner). Column 1 (you) is
# another ticket's. A salary-only single filer has no spouse or common-law partner, so a request
# that leaves the line out is read as blank.
inputs:
  - name: ca-nl/nl428_spouse_uccb_and_rdsp_repayment_line_89
    title: "Total of the universal child care benefit (UCCB) repayment (line 21300 of the return) and the registered disability savings plan (RDSP) income repayment (included on line 23200 of the return)"
    reference: "89 (column 2)"
    unit: ca/cad
    required: false
    default: null
    basis: "Line 89: Total of the universal child care benefit (UCCB) repayment (line 21300 of the return) and the registered disability savings plan (RDSP) income repayment (included on line 23200 of the return)"
