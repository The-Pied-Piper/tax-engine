# Form NL428 (Newfoundland and Labrador Tax, CRA 5001-C) line 104 "Line 104: Line 98 minus line 103
# (if negative, enter "0")". One core/subtract_not_below_zero step: the low-income tax reduction
# (line 98, `ca-nl/nl428_low_income_reduction_line_98`) less line 103 (`ca-nl/nl428_line_103`), not
# below 0, rounded half-up to the cent by the dataset's rule (the form states no rounding rule).
# Both lines are always present, so the step has no blank rule. The form's own label for the line
# ("Newfoundland and Labrador tax") is not a title the engine takes for a reduction amount, so the
# step has none. The output is `ca-nl/nl428_line_104`, which is not exported yet.
form:
  name: ca-nl/nl428
capabilities:
  - name: core/subtract_not_below_zero
    reference: "104"
    unit: ca/cad
    params:
      rounding: ca-nl/cent_rounding
    consumes:
      amount: ca-nl/nl428_low_income_reduction_line_98
      less: ca-nl/nl428_line_103
    produces:
      output: ca-nl/nl428_line_104
