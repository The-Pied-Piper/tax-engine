# Form NL428 (Newfoundland and Labrador Tax, 2025, 5001-C) Part A, line 5. Each of the four columns
# of lines 2 to 8 prints "Line 5:" with its rate: "Line 5: Rate 8.7%", "Line 5: Rate 14.5%",
# "Line 5: Rate 15.8%" and "Line 5: Rate 17.8%". Line 5 is the printed rate of the column that
# line 1 falls in, and a line 1 exactly at a column's upper bound falls in the lower column. When
# line 1 is above the table's range (220,910) lines 9 to 15 apply and this line is left blank, so
# the schedule gives a blank. Line 1 is read from its producing part (nl428_credits_line_1.yaml), so
# this part does not produce it again.
form:
  name: ca-nl/nl428_credits
capabilities:
  - name: core/bracket_column_rate
    title: "Rate"
    reference: "5"
    params:
      schedule: ca-nl/brackets_lines_2_to_8
    consumes:
      base: ca-nl/nl428_taxable_income_line_1
    produces:
      output: ca-nl/nl428_bracket_rate_line_5
