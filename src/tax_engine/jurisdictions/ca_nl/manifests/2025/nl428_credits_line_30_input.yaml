# NL428 (2025) inputs a salary-only caller does not give.
# Line 30: "Line 30 and line 58305: Amount from line 31217 of your return" (Form NL428, CRA 5001-C).
# The engine does not compute employment insurance premiums, so the figure is taken as one
# optional input the way the form takes it, an amount from T1 line 31217. A request that leaves the
# line out is read as blank. Line 35 (a later ticket) reads it.
inputs:
  - name: ca-nl/nl428_ei_premiums_line_30
    title: "Amount from line 31217 of your return"
    reference: "30"
    unit: ca/cad
    required: false
    default: null
    basis: "Line 30 and line 58305: Amount from line 31217 of your return"
