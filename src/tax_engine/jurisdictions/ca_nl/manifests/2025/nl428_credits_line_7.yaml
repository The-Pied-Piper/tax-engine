# Form NL428 (Newfoundland and Labrador Tax, 2025, 5001-C) Part A, line 7. Each of the four columns
# of lines 2 to 8 prints "Line 7:" with the tax at the column's start: 0.00, 3,844.70, 10,252.25 and
# 21,219.03, under "Column 1: Line 1 is $44,192 or less", "Column 2: Line 1 is more than $44,192
# but not more than $88,382", "Column 3: Line 1 is more than $88,382 but not more than $157,792"
# and "Column 4: Line 1 is more than $157,792 but not more than $220,910". The step takes the
# figure of the column that line 1 falls in, as printed, and does not compute it from the rates.
# When line 1 is above the table's range (220,910) lines 9 to 15 apply and this line is left
# blank, so the schedule gives a blank. The form prints no title for line 7. Line 2 is a copy of
# line 1 and has no step of its own: line 7 reads line 1 directly.
form:
  name: ca-nl/nl428_credits
capabilities:
  - name: core/bracket_column_tax_at_start
    reference: "7"
    unit: ca/cad
    params:
      schedule: ca-nl/brackets_lines_2_to_8
    consumes:
      base: ca-nl/nl428_taxable_income_line_1
    produces:
      output: ca-nl/nl428_bracket_tax_at_start_line_7
