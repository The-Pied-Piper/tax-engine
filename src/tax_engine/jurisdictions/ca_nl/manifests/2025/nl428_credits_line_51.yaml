# NL428 (2025) lines 49 to 51 (Form NL428, CRA 5001-C): "Line 49: Amount from line 23600 of your
# return", "Line 50: Applicable rate 3%" and "Line 51: Line 49 multiplied by the percentage from
# line 50 =". Line 49 is the T1 net income (line 23600, floored), which reaches this form only as a
# record list (`ca/t1_taxable_income.net_income`), so its step is a core/record_total over it, as
# line 1 is. Line 50 is the printed 3%, the `ca-nl/medical_expense_rate` dataset, and has no step of
# its own. Line 51 is that rate applied to line 49, rounded half-up to the cent by the dataset's
# rule. The form names no label for either line, so neither step has a title.
form:
  name: ca-nl/nl428_credits
capabilities:
  - name: core/record_total
    reference: "49"
    unit: ca/cad
    consumes:
      records: ca/t1_taxable_income.net_income
    produces:
      output: ca-nl/nl428_net_income_line_49
  - name: core/apply_rate
    reference: "51"
    unit: ca/cad
    params:
      rate: ca-nl/medical_expense_rate
    consumes:
      base: ca-nl/nl428_net_income_line_49
    produces:
      output: ca-nl/nl428_medical_expenses_rate_amount_line_51
