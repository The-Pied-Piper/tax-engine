# NL428 (2025) inputs a salary-only caller does not give.
# Line 43: "Line 43 and line 58520: Interest paid on your student loans (amount from line 31900 of
# your return)" (Form NL428, CRA 5001-C). The engine does not compute the student loan interest
# claim, so the figure is taken as one optional input the way the form takes it, an amount from T1
# line 31900. A request that leaves the line out is read as blank.
inputs:
  - name: ca-nl/nl428_student_loan_interest_line_43
    title: "Interest paid on your student loans (amount from line 31900 of your return)"
    reference: "43"
    unit: ca/cad
    required: false
    default: null
    basis: "Line 43 and line 58520: Interest paid on your student loans (amount from line 31900 of your return)"
