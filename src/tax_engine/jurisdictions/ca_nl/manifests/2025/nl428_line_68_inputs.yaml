# NL428 (2025) line 68's input, which a salary-only caller does not give.
# Line 68: "Line 68 and line 61540: Amount from line 40427 of your return multiplied by 60% =" (Form
# NL428, CRA 5001-C). The first box takes the amount from line 40427 of the return; the 60% is a
# later ticket. The input carries no title: the heading printed above the line names the line's
# result, not this box.
# A salary-only caller has no minimum tax carryover, so a request that leaves box A out is read as
# blank; the step that reads line 68 reads that blank as 0.
inputs:
  - name: ca-nl/nl428_minimum_tax_carryover_amount_line_68
    reference: "68 box A"
    unit: ca/cad
    required: false
    default: null
    basis: "Line 68 and line 61540: Amount from line 40427 of your return"
