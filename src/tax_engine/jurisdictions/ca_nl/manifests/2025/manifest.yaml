# Newfoundland and Labrador 2025 take-home manifest: the return's identity and its exports (the
# refund or balance owing, the average income tax rate and the marginal tax rate). The caller gives
# the gross salary and nothing else. Newfoundland and Labrador's own forms are in parts beside this
# one, so a line ticket adds only its own part file; the federal forms are imported by name below,
# their parts in the `ca` package (`ca/forms/<name>/`).
#
# Newfoundland and Labrador builds three forms, split so that no form reads another in a loop:
# `ca-nl/nl428_credits` (NL428 lines 1 to 62), `ca-nl/nl428` (NL428 lines 63 to 105), which
# supplies `ca/provincial_tax.amount` for T1 line 42800 (NL428 line 105 is the figure that goes to
# T1 line 42800), and `ca-nl/nl428_worksheet` (Worksheet NL428, built only for the age amount,
# line 58080, and the disability amount for self, line 58440). NL428 lines 106 to 108 ("Unused
# low-income tax reduction that your spouse or common-law partner can claim": the filer's own
# unused amount, which the spouse enters on their line 86) are not built: nothing reads them for a
# single filer, and they are deferred.
#
# Form NL479 is not built: its only credits (physical activity, and research and development) are
# claims that need receipts or Form T1129. Schedules NL(S2) and NL(S11) are not built: they feed
# NL428 line 46 (amounts transferred from a spouse or common-law partner) and line 44 (tuition and
# education amounts), which for this take-home scope (salary only, optional inputs left blank) are
# optional inputs read as 0.
#
# The default form's export is T1 line 167, refund or balance owing (positive is owing, negative
# is a refund). Newfoundland and Labrador uses the standard federal CPP and EI (no QPP), so Schedule
# 8 and T2204 are imported unchanged. No Newfoundland and Labrador Schedule 6 has been found (the
# CRA package listing page read shows NL428, NL479, NL(S2) and NL(S11) only, and a 5001-s6 text file
# was not found: 404 when tried), so the federal Schedule 6 is imported unchanged.
#
# Newfoundland and Labrador is listed in `registrations.JURISDICTIONS`: every listed jurisdiction is
# composed by `tests/application/services/test_every_resolvable_year.py`, and this manifest is
# complete, NL428 line 105 supplying `ca/provincial_tax.amount` for T1.
jurisdiction: CA-NL
version: 1
valid_from_tax_year: 2025
# The title is the engine's own wording for the default form, not a printed form heading.
title: Return summary
outputs:
  - ca/refund_or_balance_owing
  - ca-nl/average_income_tax_rate
  - ca-nl/marginal_tax_rate
capabilities: []
imports:
  - ca/t1_employment_income
  - ca/t1_taxable_income
  - ca/t1_tax_and_credits
  - ca/t1_lines_copied_by_provinces
  - ca/t691
  - ca/schedule_6
  - ca/schedule_8
  - ca/schedule_9
  - ca/t2204
