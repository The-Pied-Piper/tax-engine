# Form NL428 (Newfoundland and Labrador Tax, CRA 5001-C) line 90, column 2 (your spouse or
# common-law partner): "Line 90: Line 88 plus line 89". One core/sum step over line 88 (the spouse's
# net income, `ca-nl/nl428_spouse_net_income_line_88`) and line 89 (the spouse's UCCB and RDSP
# repayments, `ca-nl/nl428_spouse_uccb_and_rdsp_repayment_line_89`). Both are optional inputs that a
# salary-only single filer leaves out. Line 88 passes its blank on, so with no spouse the step and the
# line are blank; line 89 is read as 0 when blank, as in column 1. Line 88 can be negative, so the
# result is signed. The form prints no title for the line, so the step has none.
form:
  name: ca-nl/nl428
capabilities:
  - name: core/sum
    reference: "90 (column 2)"
    unit: ca/cad
    params:
      rounding: ca-nl/cent_rounding
    consumes:
      parts:
        - ca-nl/nl428_spouse_net_income_line_88
        - ca-nl/nl428_spouse_uccb_and_rdsp_repayment_line_89
    blank:
      ca-nl/nl428_spouse_net_income_line_88: pass_on
      ca-nl/nl428_spouse_uccb_and_rdsp_repayment_line_89: "0"
    produces:
      output: ca-nl/nl428_spouse_family_income_line_90
