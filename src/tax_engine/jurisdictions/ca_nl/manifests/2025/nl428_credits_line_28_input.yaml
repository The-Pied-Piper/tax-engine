# NL428 (2025) inputs a salary-only caller does not give.
# Line 28: "Line 28 and line 58280: Amount from line 31000 of your return" (Form NL428, CRA 5001-C).
# The engine does not compute Quebec Pension Plan contributions, so the figure is taken as one
# optional input the way the form takes it, an amount from T1 line 31000. A request that leaves the
# line out is read as blank. Line 31 (a later ticket) reads it.
inputs:
  - name: ca-nl/nl428_qpp_contributions_line_28
    title: "Amount from line 31000 of your return"
    reference: "28"
    unit: ca/cad
    required: false
    default: null
    basis: "Line 28 and line 58280: Amount from line 31000 of your return"
