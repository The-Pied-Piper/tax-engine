# NL428 (2025) line 96's input, which a salary-only caller does not give.
# Line 96: "Line 96 and line 61880: Reduction for spouse or common-law partner Claim $557" (Form NL428,
# CRA 5001-C). The input is the eligibility claim, a count: 1 when the reduction is claimed, 0 or
# blank when not. The couple elects who claims it. A salary-only caller leaves it out, so a request
# that omits it is read as blank.
inputs:
  - name: ca-nl/nl428_reduction_for_spouse_or_common_law_partner_claimed_line_96
    reference: "96"
    required: false
    default: null
    basis: "Line 96 and line 61880: Reduction for spouse or common-law partner Claim $557"
