# NL428 (2025) line 82's input, the venture capital tax credit. Form NL428 (CRA 5001-C): "Line 82 and
# line 61820: Venture capital tax credit from Certificate(s) NL VCTC". The credit comes from the
# certificates the filer holds, which the engine does not compute, so the figure is taken as one
# optional input, the way the form takes it. A request that leaves the line out is read as blank; the
# line 84 step reads that blank as 0. The guide (5001-PC) also says "The lifetime maximum you can
# claim is $75,000." That is a limit over all years, which a single return cannot test, so the
# input takes the amount as given and does not enforce it.
inputs:
  - name: ca-nl/nl428_venture_capital_tax_credit_from_certificates_line_82
    title: "Venture capital tax credit from Certificate(s) NL VCTC"
    reference: "82"
    unit: ca/cad
    required: false
    default: null
    basis: "Line 82 and line 61820: Venture capital tax credit from Certificate(s) NL VCTC"
