# Form NL428 (Newfoundland and Labrador Tax, CRA 5001-C) line 93: "Line 93: Add the amounts from line
# 92 of columns 1 and 2. Enter this amount on line 99. Adjusted family income". One core/sum step
# over line 92 of column 1 (you, `ca-nl/nl428_family_income_less_uccb_rdsp_line_92`) and line 92 of
# column 2 (your spouse or common-law partner,
# `ca-nl/nl428_spouse_family_income_less_uccb_rdsp_line_92`), rounded half-up to the cent by the
# dataset's rule. Column 2 is blank for a salary-only single filer, so the blank rule below reads it
# as 0. The form prints "Adjusted family income" as the line's name. Line 99 is a copy of this line
# and gets no step.
form:
  name: ca-nl/nl428
capabilities:
  - name: core/sum
    title: "Adjusted family income"
    reference: "93"
    unit: ca/cad
    params:
      rounding: ca-nl/cent_rounding
    consumes:
      parts:
        - ca-nl/nl428_family_income_less_uccb_rdsp_line_92
        - ca-nl/nl428_spouse_family_income_less_uccb_rdsp_line_92
    blank:
      ca-nl/nl428_spouse_family_income_less_uccb_rdsp_line_92: "0"
    produces:
      output: ca-nl/nl428_adjusted_family_income_line_93
