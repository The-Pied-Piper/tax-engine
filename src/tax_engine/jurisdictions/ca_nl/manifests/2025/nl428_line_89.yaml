# Form NL428 (CRA 5001-C) line 89. Line 89: "Total of the universal child care benefit (UCCB) repayment (line 21300 of the return) and the registered disability savings plan (RDSP) income repayment (included on line 23200 of the return)", column 1 (you)
# Both parts are T1 lines, so this form does not ask for them: the T1 UCCB and RDSP form owns the
# inputs and exports lines 21300 and 23200 (`ca/t1_uccb_rdsp`). Another form reads an export only as a
# record list, so each part is totalled by core/record_total first (as line 7 reads line 23600 on
# Schedule 6), and the printed total adds the two in line order. A salary-only caller has neither,
# so the total is 0.
form:
  name: ca-nl/nl428
capabilities:
  - name: core/record_total
    title: "Amount from line 21300 of the return (UCCB repayment)"
    unit: ca/cad
    consumes:
      records: ca/t1_uccb_rdsp.uccb_repayment_line_21300
    produces:
      output: ca-nl/nl428_uccb_repayment_line_21300
  - name: core/record_total
    title: "Amount from line 23200 of the return (RDSP income repayment)"
    unit: ca/cad
    consumes:
      records: ca/t1_uccb_rdsp.rdsp_income_repayment_line_23200
    produces:
      output: ca-nl/nl428_rdsp_income_repayment_line_23200
  - name: core/sum
    title: "Total of the universal child care benefit (UCCB) repayment (line 21300 of the return) and the registered disability savings plan (RDSP) income repayment (included on line 23200 of the return)"
    reference: "89"
    unit: ca/cad
    params:
      rounding: ca-nl/cent_rounding
    consumes:
      parts: [ca-nl/nl428_uccb_repayment_line_21300, ca-nl/nl428_rdsp_income_repayment_line_23200]
    produces:
      output: ca-nl/nl428_uccb_rdsp_repayments_line_89
