# Form NL428 (CRA 5001-C) line 48: "Line 48 and line 58689: Amount from line 33099 of your return".
# A copy of T1 line 33099, which the T1 owns and exports (`ca/medical_expenses_line_33099`), so the
# one step is core/record_total over that export (a form reads another form's export only as a
# record list), as line 27 does. A salary-only caller has no such amount, so the total is 0.
form:
  name: ca-nl/nl428_credits
capabilities:
  - name: core/record_total
    title: "Amount from line 33099 of your return"
    reference: "48"
    unit: ca/cad
    consumes:
      records: ca/t1_lines_copied_by_provinces.medical_expenses_line_33099
    produces:
      output: ca-nl/nl428_medical_expenses_line_48
