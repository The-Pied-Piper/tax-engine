# Form NL428 (Newfoundland and Labrador Tax, CRA 5001-C) line 74 "Line 74: Line 72 minus line 73 (if
# negative, enter "0") =". One core/subtract_not_below_zero step: the tax with the additional tax for
# minimum tax purposes (line 72, `ca-nl/nl428_tax_with_minimum_tax_line_72`) less the provincial
# foreign tax credit (line 73, `ca-nl/nl428_provincial_foreign_tax_credit_line_73`), not below 0.
# Line 73 is an optional input that a salary-only caller leaves blank, read as blank and then as 0
# by the blank rule. The form prints no title for the line, so the step has none. The output is
# `ca-nl/nl428_tax_line_74`, which is not exported yet.
form:
  name: ca-nl/nl428
capabilities:
  - name: core/subtract_not_below_zero
    reference: "74"
    unit: ca/cad
    params:
      rounding: ca-nl/cent_rounding
    consumes:
      amount: ca-nl/nl428_tax_with_minimum_tax_line_72
      less: ca-nl/nl428_provincial_foreign_tax_credit_line_73
    blank:
      less: "0"
    produces:
      output: ca-nl/nl428_tax_line_74
