# The Newfoundland and Labrador take-home return: T1 line 167 "Refund or balance owing" (positive is
# owing, negative is a refund). The T1 form exports it, and another form's export is read only as a
# record list, so the step is core/record_total over the T1 export, totalling the one amount into
# the return's own `ca/refund_or_balance_owing`. The provincial tax reaches line 167 through T1
# line 42800, which NL428 line 105 supplies (`ca/provincial_tax.amount`); T1 line 47900
# "Provincial or territorial credits" has no Newfoundland and Labrador source for a salary-only
# filer (Form NL479 is not built: its only credits, physical activity and research and
# development, are claims needing receipts or Form T1129): the T1 form reads it as optional and
# passes it on blank, so it adds nothing to line 167, as in the Saskatchewan and Alberta returns.
#
# The return's second output is the average tax rate on the take-home basis. The federal form
# `ca/take_home_average_rate` works it out once for every province (income tax, CPP and EI over the
# salary), and the return reads its export `ca/average_tax_rate` with one core/record_total.
#
# The marginal rate is the rate on the take-home basis: the change in
# T1 line 43500 plus the CPP, CPP2 and EI per further dollar of salary, with no credit paid on
# filing. The federal half is the shared federal form `ca/take_home_marginal_rates` (imported by
# the manifest), whose four exports are each totalled by core/record_total into this return's own
# figure: the net income rate, the credit-earning contribution rate, the federal marginal rate
# and the contribution rate. This return adds only Newfoundland and Labrador's own part.
#
# The Newfoundland and Labrador bracket rate is printed on NL428 line 5 (table 1, lines 2 to 8,
# taxable income up to 220,910) or on line 12 (table 2, lines 9 to 15, above it); the other is
# blank. NL428 exports both, each is totalled into the return's own kind with a blank read as 0,
# and core/sum adds them. Times the net income rate (T1 line 22215 takes the enhanced CPP off the
# income) it is the bracket rate on a further dollar of salary. The CPP base and EI contributions
# earn the NL428 credit (`ca-nl/credit_rate`, read as it is by core/rate_figure), which takes that
# rate times the credit-earning contribution rate off the tax.
#
# The low-income tax reduction (NL428 lines 95 to 104) is in the rate, because it changes line 105
# and so T1 line 43500: while NL428 line 101 (the income over the low-income threshold) and line
# 104 (the reduction left) are both above zero, a further dollar of net income takes 16%
# (`ca-nl/low_income_reduction_rate`, NL428 line 102 "Applicable rate 16%") off the reduction. The
# two gates are multiplied, the rate follows, and it is multiplied by the net income rate.
#
# The whole provincial part is counted only while NL428 line 105 "Line 94 minus line 104 (if
# negative, enter "0")", the tax that goes to T1 line 42800, is above zero, through the
# `ca-nl/marginal_rate_gate` dataset (0 where the amount is 0.00, 1 from one cent). Newfoundland
# and Labrador has no surtax and no health premium. The rate is the one of a salary-only filer, as
# the take-home calculator takes only the salary: the optional inputs (the age amount, NL428
# line 17, and the medical expenses, lines 49 to 53) are left blank there, so their slopes are not
# built.
#
# The last step adds the federal marginal rate, the Newfoundland and Labrador marginal rate and
# the contribution rate (CPP base, enhanced and second additional, and EI) with core/sum into
# `ca-nl/marginal_tax_rate`. Every step but line 167 is engine-internal, exact
# (`ca-nl/exact_rounding`), printed on no form, and carries no title or line.
capabilities:
  - name: core/record_total
    title: "Refund or balance owing"
    reference: "167"
    unit: ca/cad
    consumes:
      records: ca/t1_tax_and_credits.refund_or_balance_owing
    produces:
      output: ca/refund_or_balance_owing
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca/take_home_average_rate.average_tax_rate
    produces:
      output: ca-nl/average_tax_rate
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca/take_home_marginal_rates.marginal_net_income_rate
    produces:
      output: ca-nl/marginal_net_income_rate
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca/take_home_marginal_rates.marginal_credit_contribution_rate
    produces:
      output: ca-nl/marginal_credit_contribution_rate
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca/take_home_marginal_rates.marginal_federal_rate
    produces:
      output: ca-nl/marginal_federal_rate
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca/take_home_marginal_rates.marginal_contribution_rate
    produces:
      output: ca-nl/marginal_contribution_rate
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca-nl/nl428_credits.nl428_bracket_rate_line_5
    blank:
      records:
        ca-nl/nl428_bracket_rate_line_5: "0"
    produces:
      output: ca-nl/newfoundland_and_labrador_bracket_rate_line_5_return
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca-nl/nl428_credits.nl428_bracket_rate_line_12
    blank:
      records:
        ca-nl/nl428_bracket_rate_line_12: "0"
    produces:
      output: ca-nl/newfoundland_and_labrador_bracket_rate_line_12_return
  - name: core/sum
    unit: core/percent
    params:
      rounding: ca-nl/exact_rounding
    consumes:
      parts:
        - ca-nl/newfoundland_and_labrador_bracket_rate_line_5_return
        - ca-nl/newfoundland_and_labrador_bracket_rate_line_12_return
    produces:
      output: ca-nl/newfoundland_and_labrador_bracket_rate_return
  - name: core/rate_figure
    unit: core/percent
    params:
      rate: ca-nl/credit_rate
    produces:
      output: ca-nl/marginal_newfoundland_and_labrador_credit_rate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-nl/exact_rounding
    consumes:
      base: ca-nl/marginal_credit_contribution_rate
      rate: ca-nl/marginal_newfoundland_and_labrador_credit_rate
    produces:
      output: ca-nl/marginal_newfoundland_and_labrador_contribution_credit_rate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-nl/exact_rounding
    consumes:
      base: ca-nl/newfoundland_and_labrador_bracket_rate_return
      rate: ca-nl/marginal_net_income_rate
    produces:
      output: ca-nl/marginal_newfoundland_and_labrador_bracket_rate
  - name: core/subtract
    unit: core/percent
    params:
      rounding: ca-nl/exact_rounding
    consumes:
      amount: ca-nl/marginal_newfoundland_and_labrador_bracket_rate
      less: ca-nl/marginal_newfoundland_and_labrador_contribution_credit_rate
    produces:
      output: ca-nl/marginal_newfoundland_and_labrador_rate_after_credits
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-nl/nl428.nl428_line_101
    produces:
      output: ca-nl/income_over_low_income_threshold_return
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-nl/nl428.nl428_line_104
    produces:
      output: ca-nl/low_income_tax_reduction_return
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-nl/marginal_rate_gate
    consumes:
      base: ca-nl/income_over_low_income_threshold_return
    produces:
      output: ca-nl/income_over_low_income_threshold_gate
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-nl/marginal_rate_gate
    consumes:
      base: ca-nl/low_income_tax_reduction_return
    produces:
      output: ca-nl/low_income_tax_reduction_gate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-nl/exact_rounding
    consumes:
      base: ca-nl/income_over_low_income_threshold_gate
      rate: ca-nl/low_income_tax_reduction_gate
    produces:
      output: ca-nl/low_income_reduction_phase_out_gate
  - name: core/rate_figure
    unit: core/percent
    params:
      rate: ca-nl/low_income_reduction_rate
    produces:
      output: ca-nl/low_income_reduction_rate_figure
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-nl/exact_rounding
    consumes:
      base: ca-nl/low_income_reduction_phase_out_gate
      rate: ca-nl/low_income_reduction_rate_figure
    produces:
      output: ca-nl/marginal_low_income_reduction_rate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-nl/exact_rounding
    consumes:
      base: ca-nl/marginal_low_income_reduction_rate
      rate: ca-nl/marginal_net_income_rate
    produces:
      output: ca-nl/marginal_low_income_phase_out_rate
  - name: core/sum
    unit: core/percent
    params:
      rounding: ca-nl/exact_rounding
    consumes:
      parts:
        - ca-nl/marginal_newfoundland_and_labrador_rate_after_credits
        - ca-nl/marginal_low_income_phase_out_rate
    produces:
      output: ca-nl/marginal_newfoundland_and_labrador_rate_with_reduction
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-nl/nl428.nl428_newfoundland_and_labrador_tax_line_105
    produces:
      output: ca-nl/newfoundland_and_labrador_tax_return
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-nl/marginal_rate_gate
    consumes:
      base: ca-nl/newfoundland_and_labrador_tax_return
    produces:
      output: ca-nl/newfoundland_and_labrador_rate_gate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-nl/exact_rounding
    consumes:
      base: ca-nl/newfoundland_and_labrador_rate_gate
      rate: ca-nl/marginal_newfoundland_and_labrador_rate_with_reduction
    produces:
      output: ca-nl/newfoundland_and_labrador_marginal_rate
  - name: core/sum
    unit: core/percent
    params:
      rounding: ca-nl/exact_rounding
    consumes:
      parts:
        - ca-nl/marginal_federal_rate
        - ca-nl/newfoundland_and_labrador_marginal_rate
        - ca-nl/marginal_contribution_rate
    produces:
      output: ca-nl/marginal_tax_rate
