# The Newfoundland and Labrador take-home return: T1 line 167 "Refund or balance owing" (positive is
# owing, negative is a refund). The T1 form exports it, and another form's export is read only as a
# record list, so the step is core/record_total over the T1 export, totalling the one amount into
# the return's own `ca/refund_or_balance_owing`. The provincial tax reaches line 167 through T1
# line 42800, which NL428 line 105 supplies (`ca/provincial_tax.amount`); T1 line 47900
# "Provincial or territorial credits" has no Newfoundland and Labrador source for a salary-only
# filer (Form NL479 is not built: its only credits, physical activity and research and
# development, are claims needing receipts or Form T1129): the T1 form reads it as optional and
# passes it on blank, so it adds nothing to line 167, as in the Saskatchewan and Alberta returns.
#
# The average income tax rate, the return's other output, is built by its own ticket in this part.
#
# The marginal rate, the income tax rate on a further dollar of salary, is built as the British
# Columbia return builds it. The federal part is read as there: the T1 form exports line 73's
# bracket column rate and line 42900 "Basic federal tax", each totalled into the return's own kind,
# and core/amount_by_band_rate reads line 42900 through the `ca-nl/marginal_rate_gate` dataset (0
# where the tax is 0.00, 1 from one cent) so that the rate counts only where its own tax is above
# zero; the gate multiplies the rate into `ca/federal_marginal_rate`, exact (`ca-nl/exact_rounding`).
#
# The Newfoundland and Labrador bracket rate is printed on NL428 line 5 (table 1, lines 2 to 8,
# taxable income up to 220,910) or on line 12 (table 2, lines 9 to 15, above it); the other is
# blank. NL428 exports both, each is totalled into the return's own kind with a blank read as 0,
# and core/sum adds them into the Newfoundland and Labrador bracket rate.
#
# The Newfoundland and Labrador gate reads NL428 line 105 "Line 94 minus line 104 (if negative,
# enter "0")": the Newfoundland and Labrador tax after the credits and the low-income tax
# reduction, so a rate counts only while that tax is above zero. Gated through
# `ca-nl/marginal_rate_gate`, it multiplies the bracket rate (with the reduction, below) into
# `ca-nl/newfoundland_and_labrador_marginal_rate`.
#
# The low-income tax reduction (NL428 lines 95 to 104) is 997 at an adjusted family income up to
# 23,928 (40,460 with the spouse or eligible dependant reductions), falls by 16% of the excess
# over that threshold (line 103) and is zero when the excess reaches the reduction. Between those
# two figures it makes the tax rise 16 points faster than the bracket rate alone (the reduction
# raises the marginal rate, it does not lower it): in that range the Newfoundland and Labrador rate
# is the bracket rate plus 16%. The chain is British Columbia's: NL428 line 104 is totalled and
# gated (the reduction is above zero, so the range ends where the reduction reaches zero); NL428
# line 103 "Line 101 multiplied by the percentage from line 102" is read through the
# `ca-nl/reduction_slope` dataset (the printed 16% where line 103 is above zero, so the range starts
# above the line 100 threshold, and 0 where it is not); the two multiply into
# `ca-nl/newfoundland_and_labrador_reduction_phase_out_rate`, exact; and core/sum adds that to the
# bracket rate into `ca-nl/newfoundland_and_labrador_bracket_rate_with_reduction`, before the
# line 105 gate multiplies it, so a reduction that has taken the whole of the tax (line 105 is 0.00)
# adds nothing.
#
# `ca-nl/reduction_slope` is a dataset of its own, apart from `ca-nl/low_income_reduction_rate`
# (NL428 line 102 itself, the same 16%): that one rounds half-up to the cent, as it feeds a
# dollars-and-cents box, and the slope is exact. The slope reads line 103, which is rounded to the
# cent, so it starts at the first cent of line 103, which is within cents of the printed threshold.
#
# The last step adds the federal and the Newfoundland and Labrador marginal rate with core/sum into
# `ca-nl/marginal_tax_rate`; it is exact too, is not printed on the form and has no title or line.
#
# Only line 167 carries a line reference: the steps below read figures for the rates and are
# engine-internal, so they carry none. Known limit: the rate ignores the tax effect of CPP and EI.
capabilities:
  - name: core/record_total
    title: "Refund or balance owing"
    reference: "167"
    unit: ca/cad
    consumes:
      records: ca/t1_tax_and_credits.refund_or_balance_owing
    produces:
      output: ca/refund_or_balance_owing
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca/t1_tax_and_credits.federal_bracket_column_rate_line_73
    produces:
      output: ca/federal_bracket_rate_return
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca/t1_tax_and_credits.federal_tax_after_credits
    produces:
      output: ca/federal_tax_after_credits_return
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-nl/marginal_rate_gate
    consumes:
      base: ca/federal_tax_after_credits_return
    produces:
      output: ca/federal_rate_gate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-nl/exact_rounding
    consumes:
      base: ca/federal_rate_gate
      rate: ca/federal_bracket_rate_return
    produces:
      output: ca/federal_marginal_rate
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca-nl/nl428_credits.nl428_bracket_rate_line_5
    blank:
      records:
        ca-nl/nl428_bracket_rate_line_5: "0"
    produces:
      output: ca-nl/newfoundland_and_labrador_bracket_rate_line_5_return
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca-nl/nl428_credits.nl428_bracket_rate_line_12
    blank:
      records:
        ca-nl/nl428_bracket_rate_line_12: "0"
    produces:
      output: ca-nl/newfoundland_and_labrador_bracket_rate_line_12_return
  - name: core/sum
    unit: core/percent
    params:
      rounding: ca-nl/exact_rounding
    consumes:
      parts:
        - ca-nl/newfoundland_and_labrador_bracket_rate_line_5_return
        - ca-nl/newfoundland_and_labrador_bracket_rate_line_12_return
    produces:
      output: ca-nl/newfoundland_and_labrador_bracket_rate_return
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-nl/nl428.nl428_newfoundland_and_labrador_tax_line_105
    produces:
      output: ca-nl/newfoundland_and_labrador_tax_after_reduction_return
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-nl/marginal_rate_gate
    consumes:
      base: ca-nl/newfoundland_and_labrador_tax_after_reduction_return
    produces:
      output: ca-nl/newfoundland_and_labrador_rate_gate
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-nl/nl428.nl428_line_104
    produces:
      output: ca-nl/newfoundland_and_labrador_low_income_reduction_return
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-nl/marginal_rate_gate
    consumes:
      base: ca-nl/newfoundland_and_labrador_low_income_reduction_return
    produces:
      output: ca-nl/newfoundland_and_labrador_reduction_gate
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-nl/nl428.nl428_line_103
    produces:
      output: ca-nl/newfoundland_and_labrador_reduction_clawback_return
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-nl/reduction_slope
    consumes:
      base: ca-nl/newfoundland_and_labrador_reduction_clawback_return
    produces:
      output: ca-nl/newfoundland_and_labrador_reduction_slope
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-nl/exact_rounding
    consumes:
      base: ca-nl/newfoundland_and_labrador_reduction_gate
      rate: ca-nl/newfoundland_and_labrador_reduction_slope
    produces:
      output: ca-nl/newfoundland_and_labrador_reduction_phase_out_rate
  - name: core/sum
    unit: core/percent
    params:
      rounding: ca-nl/exact_rounding
    consumes:
      parts:
        - ca-nl/newfoundland_and_labrador_bracket_rate_return
        - ca-nl/newfoundland_and_labrador_reduction_phase_out_rate
    produces:
      output: ca-nl/newfoundland_and_labrador_bracket_rate_with_reduction
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-nl/exact_rounding
    consumes:
      base: ca-nl/newfoundland_and_labrador_rate_gate
      rate: ca-nl/newfoundland_and_labrador_bracket_rate_with_reduction
    produces:
      output: ca-nl/newfoundland_and_labrador_marginal_rate
  - name: core/sum
    unit: core/percent
    params:
      rounding: ca-nl/exact_rounding
    consumes:
      parts:
        - ca/federal_marginal_rate
        - ca-nl/newfoundland_and_labrador_marginal_rate
    produces:
      output: ca-nl/marginal_tax_rate
