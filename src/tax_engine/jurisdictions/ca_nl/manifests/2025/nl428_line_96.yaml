# NL428 (2025) line 96, the reduction for a spouse or common-law partner. Form NL428 (CRA 5001-C):
# "Line 96 and line 61880: Reduction for spouse or common-law partner Claim $557".
#
# Step 1 reads the optional claim (1 when the reduction is claimed), a blank read as 0, and refuses a
# count above 1 through ca/yes_or_no_count. Step 2 produces the printed $557 from the
# `ca-nl/low_income_reduction_spouse` dataset through core/credit_amount; it is not a line of the
# form, so it has no title and no reference. Step 3 multiplies that amount by the checked claim, so
# line 96 is $557 when claimed and 0.00 otherwise, as line 40 does for its claim.
form:
  name: ca-nl/nl428
capabilities:
  - name: ca/yes_or_no_count
    consumes:
      count: ca-nl/nl428_reduction_for_spouse_or_common_law_partner_claimed_line_96
    blank:
      count: "0"
    produces:
      output: ca-nl/nl428_reduction_for_spouse_or_common_law_partner_claimed_checked_line_96
  - name: core/credit_amount
    unit: ca/cad
    params:
      amount: ca-nl/low_income_reduction_spouse
    produces:
      output: ca-nl/low_income_reduction_spouse
  - name: core/times_count
    title: "Reduction for spouse or common-law partner"
    reference: "96"
    unit: ca/cad
    params:
      rounding: ca-nl/cent_rounding
    consumes:
      amount: ca-nl/low_income_reduction_spouse
      count: ca-nl/nl428_reduction_for_spouse_or_common_law_partner_claimed_checked_line_96
    produces:
      output: ca-nl/nl428_reduction_for_spouse_or_common_law_partner_line_96
