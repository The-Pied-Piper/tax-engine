# Form NL428 (Newfoundland and Labrador Tax, CRA 5001-C) Part A, line 3. Each of the four columns
# prints "Line 3:" with its lower bound: 0.00, 44,192.00, 88,382.00 and 157,792.00, under "Column 1:
# Line 1 is $44,192 or less", "Column 2: Line 1 is more than $44,192 but not more than $88,382",
# "Column 3: Line 1 is more than $88,382 but not more than $157,792" and "Column 4: Line 1 is more
# than $157,792 but not more than $220,910". Line 3 is the printed lower bound of the column that
# line 1 falls in. Above 220,910 the table does not apply (lines 9 to 15 do), so line 3 is blank.
#
# Line 2 is a copy of line 1 and has no step of its own: line 3 reads line 1 directly.
form:
  name: ca-nl/nl428_credits
capabilities:
  - name: core/bracket_column_lower_bound
    reference: "3"
    unit: ca/cad
    params:
      schedule: ca-nl/brackets_lines_2_to_8
    consumes:
      base: ca-nl/nl428_taxable_income_line_1
    produces:
      output: ca-nl/nl428_bracket_lower_bound_line_3
