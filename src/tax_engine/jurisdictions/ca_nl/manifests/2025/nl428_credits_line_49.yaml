# NL428 (2025) line 49 (Form NL428, CRA 5001-C): "Line 49: Amount from line 23600 of your return".
# It is the T1 net income (line 23600, floored), which reaches this form only as a record list
# (`ca/t1_taxable_income.net_income`), so its step is a core/record_total over it, as line 1 is.
# The form prints no label for the line, so the step has no title.
form:
  name: ca-nl/nl428_credits
capabilities:
  - name: core/record_total
    reference: "49"
    unit: ca/cad
    consumes:
      records: ca/t1_taxable_income.net_income
    produces:
      output: ca-nl/nl428_net_income_line_49
