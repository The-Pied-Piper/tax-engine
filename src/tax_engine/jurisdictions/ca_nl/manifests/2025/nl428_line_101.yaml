# Form NL428 (Newfoundland and Labrador Tax, CRA 5001-C) line 101 "Line 101: Line 99 minus line 100
# (if negative, enter "0") =". One core/subtract_not_below_zero step: line 99, a copy of line 93
# (the line 92 figure of column 1, `ca-nl/nl428_family_income_less_uccb_rdsp_line_92`; the form's
# column 2 for a spouse is not modelled, so line 93 is line 92 and has no step of its own), less
# line 100 (`ca-nl/nl428_low_income_threshold_line_100`), not below 0. Neither figure is blank, so
# the step has no blank rule. The form prints no title for the line, so the step has none. The
# output is `ca-nl/nl428_line_101`, which is not exported yet.
form:
  name: ca-nl/nl428
capabilities:
  - name: core/subtract_not_below_zero
    reference: "101"
    unit: ca/cad
    params:
      rounding: ca-nl/cent_rounding
    consumes:
      amount: ca-nl/nl428_family_income_less_uccb_rdsp_line_92
      less: ca-nl/nl428_low_income_threshold_line_100
    produces:
      output: ca-nl/nl428_line_101
