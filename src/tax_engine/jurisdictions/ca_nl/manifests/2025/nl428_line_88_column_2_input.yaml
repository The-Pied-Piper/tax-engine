# NL428 (2025) line 88's column 2 input, which a salary-only caller does not give.
# Line 88: 'Net income from line 23600 of the return (or the amount you would have entered if the
# instructions on line 23600 said "if negative, show in brackets")' (Form NL428, CRA 5001-C),
# column 2 (your spouse or common-law partner). Column 1 (you) is a copy of line 23600 of the return
# and has no step. A salary-only single filer has no spouse or common-law partner, so a request that
# leaves the line out is read as blank. The figure is signed: the line takes the amount as if a
# negative were shown in brackets.
inputs:
  - name: ca-nl/nl428_spouse_net_income_line_88
    title: 'Net income from line 23600 of the return (or the amount you would have entered if the instructions on line 23600 said "if negative, show in brackets")'
    reference: "88 (column 2)"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 88: Net income from line 23600 of the return (or the amount you would have entered if the instructions on line 23600 said "if negative, show in brackets")'
