# NL428 (2025) line 73's input, which a salary-only caller does not give.
# Line 73: "Line 73: Provincial foreign tax credit (complete Form T2036)" (Form NL428, CRA 5001-C).
# Form T2036 is not built, so the line is taken as one optional input, as the form takes it. A
# request that leaves the line out is read as blank; the step that reads line 73 reads that blank
# as 0.
form:
  name: ca-nl/nl428
inputs:
  - name: ca-nl/nl428_provincial_foreign_tax_credit_line_73
    title: "Provincial foreign tax credit"
    reference: "73"
    unit: ca/cad
    required: false
    default: null
    basis: "Line 73: Provincial foreign tax credit (complete Form T2036)"
