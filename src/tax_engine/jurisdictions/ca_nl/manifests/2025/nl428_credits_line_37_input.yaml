# NL428 (2025) inputs a salary-only caller does not give.
# Line 37: "Line 37 and line 58360: Pension income amount (maximum $1,000)" (Form NL428, CRA 5001-C).
# A salary-only caller has no pension income amount, so a request that leaves the line out is read
# as blank; line 37 (nl428_credits_line_37.yaml) checks it against the printed maximum and passes
# that blank on.
inputs:
  - name: ca-nl/nl428_pension_income_amount_claimed_line_37
    title: "Pension income amount"
    reference: "37"
    unit: ca/cad
    required: false
    default: null
    basis: "Line 37 and line 58360: Pension income amount (maximum $1,000)"
