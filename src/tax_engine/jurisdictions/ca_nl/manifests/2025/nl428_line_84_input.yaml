# NL428 (2025) line 84's input, which a salary-only caller does not give.
# Line 84: "Line 84: Line 82 plus line 83" (Form NL428, CRA 5001-C). Lines 82 (the venture capital
# tax credit from Certificate(s) NL VCTC) and 83 (the unused venture capital tax credit from the
# most recent notice of assessment or reassessment) exist only for blank optional claims, so they
# are skipped and the printed sum that collects them is taken as one optional input. A request that
# leaves the line out is read as blank. The form prints no title for the line, so the input has
# none.
inputs:
  - name: ca-nl/nl428_venture_capital_tax_credit_line_84
    reference: "84"
    unit: ca/cad
    required: false
    default: null
    basis: "Line 84: Line 82 plus line 83"
