# NL428 (2025) inputs a salary-only caller does not give.
# Line 44: "Line 44 and line 58560: Your tuition and education amounts (attach Schedule NL(S11))"
# (Form NL428, CRA 5001-C). Schedule NL(S11) is not built, so its result is taken as one optional
# input the way the form takes it. A request that leaves the line out is read as blank. Line 47
# (a later ticket) reads it; the form prints no sum of lines 43 to 46 alone.
inputs:
  - name: ca-nl/nl428_tuition_and_education_amounts_line_44
    title: "Your tuition and education amounts (attach Schedule NL(S11))"
    reference: "44"
    unit: ca/cad
    required: false
    default: null
    basis: "Line 44 and line 58560: Your tuition and education amounts (attach Schedule NL(S11))"
