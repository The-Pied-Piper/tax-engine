# NL428 (2025) inputs a salary-only caller does not give.
# Line 54: "Line 54 and line 58729: Allowable amount of medical expenses for other dependants (use
# Worksheet NL428)" (Form NL428, CRA 5001-C). The Worksheet NL428 section behind this line exists
# only to compute a claim a salary-only caller leaves empty, so that block is skipped and the line
# is taken as one optional input. A request that leaves the line out is read as blank.
form:
  name: ca-nl/nl428_credits
inputs:
  - name: ca-nl/nl428_allowable_medical_expenses_for_other_dependants_line_54
    title: "Allowable amount of medical expenses for other dependants (use Worksheet NL428)"
    reference: "54"
    unit: ca/cad
    required: false
    default: null
    basis: "Line 54 and line 58729: Allowable amount of medical expenses for other dependants (use Worksheet NL428)"
