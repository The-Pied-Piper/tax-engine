# Form NB428 (CRA 5004-C) line 62: "Line 62: Line 60 plus line 61". Lines 60 (the dividend tax
# credit) and 61 (the minimum tax carryover) are optional inputs a salary-only caller leaves out, so
# the blank rule below reads each as 0. The form prints no title for the line, so the step is
# untitled.
form:
  name: ca-nb/nb428
capabilities:
  - name: core/sum
    reference: "62"
    unit: ca/cad
    params:
      rounding: ca-nb/cent_rounding
    consumes:
      parts:
        - ca-nb/nb428_dividend_tax_credit_line_60
        - ca-nb/nb428_minimum_tax_carryover_line_61
    blank:
      ca-nb/nb428_dividend_tax_credit_line_60: "0"
      ca-nb/nb428_minimum_tax_carryover_line_61: "0"
    produces:
      output: ca-nb/nb428_dividend_credit_and_carryover_line_62
