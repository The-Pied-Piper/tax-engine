# Form NB428 (CRA 5004-C) line 51 (ca-nb/nb428): "Line 51: Amount from line 14 of your federal
# Schedule 9 multiplied by 17.95% =". The 17.95% is a printed rate, held in the `ca-
# nb/donations_credit_rate_line_51` dataset, so the step is one calculation: 17.95% of the
# Schedule 9 amount, rounded half-up to the cent. The amount (box A) is read from the Schedule 9
# export: the first step totals it (a form reads another form's export only as a record list). The
# line has two boxes: the amount (box A, the first step) and the multiplied result (box B, this
# step). The form does not name them; "box A" and "box B" are the owner's naming, as on ON428 line
# 47. Same as ca-sk/sk428_credits line 55 (sk428_credits_line_55.yaml).
form:
  name: ca-nb/nb428
capabilities:
  - name: core/record_total
    title: "Amount from line 14 of your federal Schedule 9"
    reference: "51 box A"
    unit: ca/cad
    consumes:
      records: ca/schedule_9.donations_and_gifts_line_14
    produces:
      output: ca-nb/nb428_donations_amount_line_51
  - name: core/apply_rate
    reference: "51 box B"
    unit: ca/cad
    params:
      rate: ca-nb/donations_credit_rate_line_51
    consumes:
      base: ca-nb/nb428_donations_amount_line_51
    blank:
      base: "0"
    produces:
      output: ca-nb/nb428_donations_credit_at_rate_line_51
