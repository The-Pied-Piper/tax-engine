# Form NB428 (CRA 5004-C) line 18, the sum of lines 9, 10, 13, 16 and 17. "Line 18: Add lines 9, 10,
# 13, 16, and 17." The take-home scope is a salary-only single filer, so only line 9 (basic personal
# amount, ca-nb/basic_personal_amount) contributes; lines 10, 13, 16 and 17 (age, spouse, eligible
# dependant, infirm dependants) are blank claims outside that scope and are not built. A single
# part is still a sum, so the step is built (same as ca-sk/sk428_credits line 20,
# sk428_credits_line_20.yaml). The form prints no label for line 18, so the step has no title.
form:
  name: ca-nb/nb428_credits
capabilities:
  - name: core/sum
    reference: "18"
    unit: ca/cad
    params:
      rounding: ca-nb/cent_rounding
    consumes:
      parts: [ca-nb/basic_personal_amount]
    produces:
      output: ca-nb/nb428_credits_subtotal_line_18
