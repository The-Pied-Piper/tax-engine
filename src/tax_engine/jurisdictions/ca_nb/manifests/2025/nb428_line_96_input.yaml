# NB428 (2025) line 96's input, which a salary-only caller does not give.
# "Line 96: Small business investor tax credit (complete Form T1258) (maximum $125,000)"
# (Form NB428, CRA 5004-C). Form T1258 is not built. A salary-only filer has no such claim, so the line is taken
# as one optional input, as the form takes it. A request that leaves the line out is read as blank;
# the step that reads line 96 reads that blank as 0.
form:
  name: ca-nb/nb428
inputs:
  - name: ca-nb/nb428_small_business_investor_credit_line_96
    title: "Small business investor tax credit"
    reference: "96"
    unit: ca/cad
    required: false
    default: null
    basis: "Line 96: Small business investor tax credit (complete Form T1258) (maximum $125,000)"
