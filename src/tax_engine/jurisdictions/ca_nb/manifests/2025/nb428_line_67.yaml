# Form NB428 (CRA 5004-C) line 67: "Line 66: Provincial foreign tax credit (complete Form T2036).
# Line 67: Line 65 minus line 66 (if negative, enter "0")". One core/subtract_not_below_zero step:
# line 65 less line 66, not below 0. Line 66 is an optional input a salary-only caller leaves out,
# read as blank and then as 0 by the blank rule. The form prints no title for the line, so the step
# is untitled. Line 87 reads the output (lines 68 and 69 are not modelled, see line 87).
form:
  name: ca-nb/nb428
capabilities:
  - name: core/subtract_not_below_zero
    reference: "67"
    unit: ca/cad
    params:
      rounding: ca-nb/cent_rounding
    consumes:
      amount: ca-nb/nb428_tax_with_minimum_tax_line_65
      less: ca-nb/nb428_provincial_foreign_tax_credit_line_66
    blank:
      less: "0"
    produces:
      output: ca-nb/nb428_tax_line_67
