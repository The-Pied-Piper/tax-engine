# Form NB428 (CRA 5004-C) line 9 and line 58040, the basic personal amount. "Basic personal amount
# Claim $13,396". The $13,396 is the `ca-nb/basic_personal_amount` dataset, claimed whole through
# core/credit_amount, so it is the same at every salary (same as ca-sk/sk428_credits line 9,
# sk428_credits_line_9.yaml, and ca-nl/nl428_credits line 16).
form:
  name: ca-nb/nb428
capabilities:
  - name: core/credit_amount
    title: "Basic personal amount"
    reference: "9"
    unit: ca/cad
    params:
      amount: ca-nb/basic_personal_amount
    produces:
      output: ca-nb/basic_personal_amount
