# NB428 (2025) line 64's input, which a salary-only caller does not give.
# "Line 64: Form T691: line 1 minus line 2 of Part 7 multiplied by 57%" (Form NB428, CRA 5004-C). Form T691 is not built (it is $0 for a salary-only filer), so the
# line is taken as one optional input, as the form takes it. A request that leaves the line out is
# read as blank; the step that reads line 64 reads that blank as 0.
form:
  name: ca-nb/nb428
inputs:
  - name: ca-nb/nb428_additional_tax_minimum_tax_line_64
    title: "Form T691: line 1 minus line 2 of Part 7 multiplied by 57%"
    reference: "64"
    unit: ca/cad
    required: false
    default: null
    basis: "Line 64: Form T691: line 1 minus line 2 of Part 7 multiplied by 57%"
