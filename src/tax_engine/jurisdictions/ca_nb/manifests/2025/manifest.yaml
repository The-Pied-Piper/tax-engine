# New Brunswick 2025 take-home manifest: the return's identity and the federal forms it imports. The
# caller gives the gross salary and nothing else. New Brunswick's own forms are parts beside this
# one, so a line ticket adds only its own part file; the federal forms are imported by name below,
# their parts in the `ca` package (`ca/forms/<name>/`).
#
# New Brunswick builds Form NB428 (CRA 5004-C). No New Brunswick NB479, T1 edition or Schedule 6
# was found (the 5004-tc, 5004-r and 5004-s6 text files are 404 on CRA, tried 2026-11-26), so the
# federal forms apply unchanged. Schedule 8 and T2204 carry the standard federal CPP and EI (no
# QPP). NB428 line 97 supplies `ca/provincial_tax.amount`, so the T1 forms are imported below with
# Schedule 6 and T691, and the two rate forms; Schedule 9 is imported for NB428 lines 50 and 51.
#
# The default form's export is T1 line 167, refund or balance owing (positive is owing, negative is
# a refund), and the return's own parts are in `return.yaml`; the `take_home` block names the figures
# the take-home answer reads, among them the average and marginal tax rates. New Brunswick is listed
# in `registrations.JURISDICTIONS`: every listed jurisdiction is composed by
# `tests/application/services/test_every_resolvable_year.py`, and this manifest is complete, NB428
# line 97 supplying `ca/provincial_tax.amount` for T1.
jurisdiction: CA-NB
version: 1
valid_from_tax_year: 2025
# The title is the engine's own wording for the default form, not a printed form heading.
title: Return summary
outputs:
  - ca/refund_or_balance_owing
  - ca-nb/average_tax_rate
  - ca-nb/marginal_tax_rate
capabilities: []
# Where the take-home answer reads its figures (the caller gives the salary and nothing else): the
# income tax is T1 line 43500, CPP and EI come from their own forms, and the rates are this return's.
take_home:
  salary: ca/employment_income
  income_tax: {form: ca/t1_tax_and_credits, kind: ca/total_payable}
  deductions:
    cpp_base: {form: ca/schedule_8, kind: ca/schedule_8_cpp_base_contributions_on_return}
    cpp_enhanced: {form: ca/schedule_8, kind: ca/cpp_part_3_line_12}
    cpp2: {form: ca/schedule_8, kind: ca/cpp_part_3_line_22}
    ei: {form: ca/t2204, kind: ca/t2204_line_16}
  average_tax_rate: {form: ca-nb/return, kind: ca-nb/average_tax_rate}
  marginal_tax_rate: {form: ca-nb/return, kind: ca-nb/marginal_tax_rate}
imports:
  - ca/t1_employment_income
  - ca/t1_taxable_income
  - ca/t1_tax_and_credits
  - ca/t1_lines_copied_by_provinces
  - ca/schedule_6
  - ca/schedule_8
  - ca/schedule_9
  - ca/t2204
  - ca/take_home_average_rate
  - ca/t691
  - ca/take_home_marginal_rates
