# NB428 (2025) line 60's input, which a salary-only caller does not give.
# "Line 60 and line 61520: New Brunswick dividend tax credit (use Worksheet NB428)" (Form NB428, CRA 5004-C). Worksheet NB428 is not built (it is $0 for a salary-only filer), so the
# line is taken as one optional input, as the form takes it. A request that leaves the line out is
# read as blank; the step that reads line 60 reads that blank as 0.
form:
  name: ca-nb/nb428
inputs:
  - name: ca-nb/nb428_dividend_tax_credit_line_60
    title: "New Brunswick dividend tax credit (use Worksheet NB428)"
    reference: "60"
    unit: ca/cad
    required: false
    default: null
    basis: "Line 60 and line 61520: New Brunswick dividend tax credit (use Worksheet NB428)"
