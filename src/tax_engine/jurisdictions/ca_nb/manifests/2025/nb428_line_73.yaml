# Form NB428 (CRA 5004-C) line 73, column 1 (you): "UCCB income (line 11700) and RDSP income (line
# 12500)". Both parts are T1 lines, so this form does not ask for them: the T1 taxable income form
# owns the inputs and exports lines 11700 and 12500 (`ca/t1_taxable_income`). Another form reads an
# export only as a record list, so each part is totalled by core/record_total first (as NL428 line
# 91 is), and the printed total adds the two in line order. A salary-only caller has neither, so
# the total is 0.
form:
  name: ca-nb/nb428
capabilities:
  - name: core/record_total
    title: "Amount from line 11700 of the return (UCCB income)"
    unit: ca/cad
    consumes:
      records: ca/t1_taxable_income.uccb_income_line_11700
    produces:
      output: ca-nb/nb428_uccb_income_line_11700
  - name: core/record_total
    title: "Amount from line 12500 of the return (RDSP income)"
    unit: ca/cad
    consumes:
      records: ca/t1_taxable_income.rdsp_income_line_12500
    produces:
      output: ca-nb/nb428_rdsp_income_line_12500
  - name: core/sum
    title: "UCCB income (line 11700) and RDSP income (line 12500)"
    reference: "73"
    unit: ca/cad
    params:
      rounding: ca-nb/cent_rounding
    consumes:
      parts: [ca-nb/nb428_uccb_income_line_11700, ca-nb/nb428_rdsp_income_line_12500]
    produces:
      output: ca-nb/nb428_uccb_rdsp_income_line_73
