# Form NB428 (CRA 5004-C) line 10 and line 58080: "Age amount (if you were born in 1960 or earlier) (use Worksheet NB428) (maximum $6,037)". Built as ca-nl/nl428_credits line 17 and ca-pe/pe428 line 10 are: a ca/count_by_conditions step that works out 1 or 0 from the year of birth (a blank year passes on blank, read as 0 by the steps below; not a line of the form), a core/times_count step of worksheet line 7 by that count (blank read as 0), and a core/at_most step that checks the printed maximum (worksheet line 1) and is line 10. An amount above the maximum is refused, not capped. Worksheet lines 1 to 7 are in the two parts beside this one.
form:
  name: ca-nb/nb428
capabilities:
- name: core/first_record_count
  title: Year of birth
  consumes:
    records: ca/t1_lines_copied_by_provinces.birth_year
  blank:
    records:
      ca/birth_year: pass_on
  produces:
    output: ca-nb/nb428_birth_year
- name: ca/count_by_conditions
  title: Born in 1960 or earlier
  params:
    conditions: ca-nb/born_in_1960_or_earlier_conditions
  consumes:
    counts:
    - ca-nb/nb428_birth_year
    amounts: []
  blank:
    counts: pass_on
  produces:
    output: ca/born_in_1960_or_earlier_checked
- name: core/times_count
  title: Age amount before the printed maximum
  unit: ca/cad
  params:
    rounding: ca-nb/cent_rounding
  consumes:
    amount: ca-nb/worksheet_nb428_age_amount_line_7
    count: ca/born_in_1960_or_earlier_checked
  produces:
    output: ca-nb/nb428_age_amount_claimed_line_10
  blank:
    count: '0'
- name: core/at_most
  title: Age amount
  reference: '10'
  unit: ca/cad
  consumes:
    amount: ca-nb/nb428_age_amount_claimed_line_10
    bound: ca-nb/worksheet_nb428_age_amount_maximum_line_1
  blank:
    amount: pass_on
  produces:
    output: ca-nb/nb428_age_amount_line_10
