# NB428 (2025) line 92, the political contribution tax credit. Form NB428 (CRA 5004-C): "Line 92: New Brunswick political contribution tax credit (use Worksheet NB428) (maximum $500)".
# No arithmetic is printed, so line 92 is an entry line in two steps. The first,
# core/credit_amount, supplies the printed maximum from the `ca-nb/political_contribution_credit_maximum` dataset; it
# is not a line of the form, so it has no title and no reference. The second, core/at_most, is line
# 92: the entered amount (nb428_line_92_input.yaml) passed on unchanged, titled "New Brunswick political contribution tax credit". An
# entry above the printed maximum is refused, not capped. A blank entry passes on as blank.
form:
  name: ca-nb/nb428
capabilities:
  - name: core/credit_amount
    unit: ca/cad
    params:
      amount: ca-nb/political_contribution_credit_maximum
    produces:
      output: ca-nb/nb428_political_contribution_credit_maximum
  - name: core/at_most
    title: "New Brunswick political contribution tax credit"
    reference: "92"
    unit: ca/cad
    consumes:
      amount: ca-nb/nb428_political_contribution_credit_line_92
      bound: ca-nb/nb428_political_contribution_credit_maximum
    blank:
      amount: pass_on
    produces:
      output: ca-nb/nb428_political_contribution_credit_checked_line_92
