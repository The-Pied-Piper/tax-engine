# Form NB428 line 19 (58240) "Amount from line 30800 of your return" is a copy; the amount is read
# from Schedule 8 line 25, which arrives as a record list, so the one step is core/record_total over
# those records (same as ca-sk/sk428_credits line 22, sk428_credits_line_22.yaml, and
# ca-nl/nl428_credits line 27). Form text read from CRA 5004-C.
form:
  name: ca-nb/nb428
capabilities:
  - name: core/record_total
    title: "CPP or QPP contributions"
    reference: "19"
    unit: ca/cad
    consumes:
      records: ca/schedule_8.schedule_8_cpp_base_contributions_on_return
    produces:
      output: ca-nb/nb428_cpp_contributions_line_19
