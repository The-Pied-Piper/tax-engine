# Worksheet NB428 (CRA 5004-D) section "Line 58080 - Age amount", lines 1 to 3: "Line 1: Maximum amount 6,037.00", "Line 2: Amount from line 23600 of your return", "Line 3: Income threshold 44,945.00". One step per worksheet line; the worksheet is built inside form ca-nb/nb428 (Umar, 27 Nov 2026: "sure. add it"), so its steps carry plain-words titles and no reference (the numbers 1 to 3 are also NB428 line numbers). Line 2 reads the T1 net income record list; lines 1 and 3 are printed dataset figures.
form:
  name: ca-nb/nb428
capabilities:
- name: core/credit_amount
  title: 'Worksheet NB428 age amount line 1: maximum amount'
  unit: ca/cad
  params:
    amount: ca-nb/age_maximum
  produces:
    output: ca-nb/worksheet_nb428_age_amount_maximum_line_1
- name: core/record_total
  title: 'Worksheet NB428 age amount line 2: amount from line 23600'
  unit: ca/cad
  consumes:
    records: ca/t1_taxable_income.net_income
  produces:
    output: ca-nb/worksheet_nb428_age_amount_net_income_line_2
- name: core/credit_amount
  title: 'Worksheet NB428 age amount line 3: income threshold'
  unit: ca/cad
  params:
    amount: ca-nb/age_income_threshold
  produces:
    output: ca-nb/worksheet_nb428_age_amount_income_threshold_line_3
