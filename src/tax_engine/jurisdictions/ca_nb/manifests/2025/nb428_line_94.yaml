# NB428 (2025) line 94, the labour-sponsored venture capital fund tax credit. Form NB428 (CRA 5004-C): "Line 94 and line 61670: Labour-sponsored venture capital fund tax credit from NB-LSVC-1 certificate(s) (maximum $2,000)".
# No arithmetic is printed, so line 94 is an entry line in two steps. The first,
# core/credit_amount, supplies the printed maximum from the `ca-nb/labour_sponsored_credit_maximum` dataset; it
# is not a line of the form, so it has no title and no reference. The second, core/at_most, is line
# 94: the entered amount (nb428_line_94_input.yaml) passed on unchanged, titled "Labour-sponsored venture capital fund tax credit". An
# entry above the printed maximum is refused, not capped. A blank entry passes on as blank.
form:
  name: ca-nb/nb428
capabilities:
  - name: core/credit_amount
    unit: ca/cad
    params:
      amount: ca-nb/labour_sponsored_credit_maximum
    produces:
      output: ca-nb/nb428_labour_sponsored_credit_maximum
  - name: core/at_most
    title: "Labour-sponsored venture capital fund tax credit"
    reference: "94"
    unit: ca/cad
    consumes:
      amount: ca-nb/nb428_labour_sponsored_credit_line_94
      bound: ca-nb/nb428_labour_sponsored_credit_maximum
    blank:
      amount: pass_on
    produces:
      output: ca-nb/nb428_labour_sponsored_credit_checked_line_94
