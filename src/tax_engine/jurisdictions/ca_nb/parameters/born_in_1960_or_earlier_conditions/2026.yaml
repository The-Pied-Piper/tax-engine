# Provisional: taken from the 2025 form text named in sources; to be confirmed against the 2026 form text when CRA publishes it.
# Derivation: carried forward unchanged from the 2025 file; the 2026 NB428 is not yet published, so the year 1960 is unconfirmed for 2026 (CRA moves it each year).
# New Brunswick "if you were born in 1960 or earlier", 2026 tax year: NB428 line 10 "Age amount (if you were born in 1960 or earlier)" (CRA 5004-C). The filer gives a birth year; one condition, in the form's wording turned round because the conditions only test "more than": the birth year is more than 1960, in which case the count is 0 (not born in 1960 or earlier), else 1. The result is a count, not a dollars-and-cents box, so there is no rounding.
family: ca-nb/born_in_1960_or_earlier_conditions
tax_year: 2026
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5004-c/5004-c-25e.txt
rounding: none
count_when_any_applies: "0"
conditions:
  - text: You were born after 1960
    parts:
      - tests:
          - {reads: count, position: "1", relation: more_than, than: "1960"}
