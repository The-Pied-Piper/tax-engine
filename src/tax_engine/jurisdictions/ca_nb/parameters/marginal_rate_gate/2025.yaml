# Marginal rate gate, 2025 tax year. Not a CRA figure and not printed on any form: the rows are a
# switch the New Brunswick return summary uses so that a rate counts only where its own amount is
# above zero. A base of 0.00 gives the rate 0 and a base of one cent or more gives the rate 1; the
# summary reads NB428 line 83, line 86 and line 97 "Line 95 minus line 96 (if negative, enter "0")"
# through it, so that the low-income tax reduction slope and the provincial part count only where
# their own amounts are above zero. The form is listed as a source only because the gated figures,
# NB428 lines 83, 86 and 97, are on it; the rows are not from it.
# A base exactly at a row's `over` is in the lower band, so the second row starts above 0.005: no
# cent amount is in the first band but 0.00, and 0.01 is in the second.
family: ca-nb/marginal_rate_gate
tax_year: 2025
kind: amount_by_band
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5004-c/5004-c-25e.txt
rounding: none
rows:
  - {over: "0", amount: "0"}
  - {over: "0.005", minus: "0", rate: "1", plus: "0"}
