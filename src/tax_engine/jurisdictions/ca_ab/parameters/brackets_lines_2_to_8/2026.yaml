# Provisional: taken from T4127 (Jan 2026); to be confirmed against the 2026 form text when CRA publishes it.
# Derivation: thresholds and rates as printed in T4127 Table 8.1; tax_at_start calculated as the cumulative tax on the earlier brackets, rounded half-up to the cent (reproduces the 2025 printed constants).
# Alberta income tax brackets, 2026 tax year, Form AB428 (CRA 5009-c) Part A, lines 2 to 8, from T4127 (Jan 2026), Table 8.1.
# The 2026 AB428 is not yet published, so these figures are not yet confirmed against it.
# Each bracket's `tax_at_start` is the cumulative tax on the earlier brackets: exact, every
# value comes out to the cent, so nothing is rounded (kept with `rounding: none`).
# `up_to`: the table covers line 1 of 185,111.00 or less. Above it lines 9 to 15 apply and this
# line is blank. The split between the two files moves from 181,481 (2025) to 185,111, which is
# this file's `up_to` and the first lower bound of the lines 9 to 15 file.
family: ca-ab/brackets_lines_2_to_8
tax_year: 2026
kind: brackets
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pub/t4127-jan/t4127-01-26e.pdf
rounding: none
up_to: "185111.00"
brackets:
  - {from: "0.00", rate: "0.08", tax_at_start: "0.00"}
  - {from: "61200.00", rate: "0.10", tax_at_start: "4896.00"}
  - {from: "154259.00", rate: "0.12", tax_at_start: "14201.90"}
