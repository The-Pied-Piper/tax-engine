# Alberta 2026 brackets, Form AB428 (Alberta Tax and Credits, CRA 5009-c) Part A, lines 2 to 8.
# The 2026 AB428 form text (CRA 5009-c) is not yet published. The source is T4127 Table 8.1
# (Alberta), to be re-checked against the printed form once it is out.
# Thresholds and rates are from T4127 Table 8.1, confirmed by alberta.ca: lower bounds 0.00,
# 61,200.00, 154,259.00; rates 8%, 10%, 12%. Each bracket's `tax_at_start` is derived as the
# cumulative tax on the earlier brackets, exact and not rounded (each comes out to the cent):
# 0.00, 4,896.00, 14,201.90. It is kept with `rounding: none`, as for 2025.
# `up_to`: the table covers line 1 of 185,111.00 or less. Above it lines 9 to 15 apply and this
# line is blank. The split between the two files moves from 181,481 (2025) to 185,111, which is
# this file's `up_to` and the first lower bound of the lines 9 to 15 file.
family: ca-ab/brackets_lines_2_to_8
tax_year: 2026
kind: brackets
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pub/t4127-jan/t4127-01-26e.pdf
rounding: none
up_to: "185111.00"
brackets:
  - {from: "0.00", rate: "0.08", tax_at_start: "0.00"}
  - {from: "61200.00", rate: "0.10", tax_at_start: "4896.00"}
  - {from: "154259.00", rate: "0.12", tax_at_start: "14201.90"}
