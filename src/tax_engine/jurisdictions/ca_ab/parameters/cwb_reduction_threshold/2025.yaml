# Alberta Schedule 6 (5009-S6, 2025 edition) line 24, for a filer with no eligible spouse and no
# eligible dependant: "If you had an eligible spouse or an eligible dependant, enter $32,772. If
# not, enter $26,159." The $26,159 is the printed figure for the "If not" branch, claimed whole
# through core/credit_amount, so no salary reaches this line. It replaces
# `ca/cwb_reduction_threshold` in the Alberta manifest's import of Schedule 6. A dollars-and-cents
# figure, so it rounds half-up to the cent, which changes nothing.
family: ca-ab/cwb_reduction_threshold
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5009-s6/5009-s6-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "26159"
