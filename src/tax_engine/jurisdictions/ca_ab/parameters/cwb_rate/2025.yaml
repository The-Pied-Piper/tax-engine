# Alberta Schedule 6 (5009-S6, 2025 edition) line 19, "Rate 21%": the percentage that line 20 ("Line
# 18 multiplied by the percentage from line 19") applies to line 18. The 21% is a printed figure,
# held here as a rate of 0.21, so line 19 has no step of its own. It replaces `ca/cwb_rate` in the
# Alberta manifest's import of Schedule 6. Line 20 is a dollars-and-cents figure, so the product
# rounds half-up to the cent on this dataset.
family: ca-ab/cwb_rate
tax_year: 2025
kind: rate
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5009-s6/5009-s6-25e.txt
rounding: {increment: "0.01", mode: half_up}
rate: "0.21"
