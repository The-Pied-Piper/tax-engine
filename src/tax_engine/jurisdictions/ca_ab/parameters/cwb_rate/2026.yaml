# Provisional: taken from the 2025 form text named in sources; to be confirmed against the 2026 form text when CRA publishes it.
# Derivation: carried forward unchanged from the 2025 file; the 2026 form is not yet published.
# Alberta Schedule 6, 2026 tax year, line 19, "Rate 21%" (2025 text): the percentage that line 20
# ("Line 18 multiplied by the percentage from line 19") applies to line 18. Held as a rate of
# 0.21, so line 19 has no step of its own. It replaces `ca/cwb_rate` in the Alberta manifest's
# import of Schedule 6. The product rounds half-up to the cent on this dataset.
# The 2026 Alberta Schedule 6 is not yet published; the figure is not confirmed against it.
# Doubt: carried forward because rate 21% has been stable since 2019; whether it is indexed is
# unconfirmed.
# MUST BE REPLACED from the printed figures when CRA posts the 2026 Alberta Schedule 6 (expected January or February).
family: ca-ab/cwb_rate
tax_year: 2026
kind: rate
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5009-s6/5009-s6-25e.txt
rounding: {increment: "0.01", mode: half_up}
rate: "0.21"
