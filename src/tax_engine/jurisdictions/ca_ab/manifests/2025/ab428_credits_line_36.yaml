# Form AB428 (CRA 5009-c) line 36: "Line 36: Add lines 33 to 35. = ^". Line 35 is "Caregiver amount (use
# Worksheet AB428)", which is not built, so core/sum adds line 33 and line 34, the pension income
# amount, an optional input read as 0 when the filer has none (ab428_line_34_inputs.yaml), as ON428
# line 28 adds its line 25 and line 27.
form:
  name: ca-ab/ab428_credits
capabilities:
  - name: core/sum
    reference: "36"
    unit: ca/cad
    params:
      rounding: ca-ab/cent_rounding
    consumes:
      parts:
        - ca-ab/ab428_credits_subtotal_line_33
        - ca-ab/ab428_pension_income_amount
    produces:
      output: ca-ab/ab428_credits_subtotal_line_36
