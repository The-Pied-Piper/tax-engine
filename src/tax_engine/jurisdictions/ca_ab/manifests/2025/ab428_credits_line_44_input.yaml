# AB428 (2025) inputs a salary-only caller does not give.
# Line 44: "Line 44 and line 58689: Amount from line 33099 of your return" (Form AB428, CRA 5009-c).
# The engine does not compute medical expenses, so the figure is taken as one optional input the
# way the form takes it, an amount from T1 line 33099. A request that leaves the line out is read
# as blank; line 49 reads that blank as 0.
inputs:
  - name: ca-ab/ab428_medical_expenses_line_44
    title: "Amount from line 33099 of your return"
    reference: "44"
    unit: ca/cad
    required: false
    default: null
    basis: "Line 44 and line 58689: Amount from line 33099 of your return"
