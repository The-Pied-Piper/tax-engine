# Form AB428 (CRA 5009-c-25e) line 56 (ca-ab/ab428_credits): "Line 56: Amount from line 14 of your
# federal Schedule 9 multiplied by 21% =". The 21% is a printed rate, held in the
# `ca-ab/donations_credit_rate_line_56` dataset, so the step is one calculation: 21% of the Schedule 9
# amount, rounded half-up to the cent. The amount is an optional input
# (ab428_credits_line_56_input.yaml), read as 0 when left out. The line has two boxes: the amount
# (box A, the input) and the multiplied result (box B, this step). The form does not name them;
# "box A" and "box B" are the owner's naming, as on ON428 line 47.
form:
  name: ca-ab/ab428_credits
capabilities:
  - name: core/apply_rate
    reference: "56 box B"
    unit: ca/cad
    params:
      rate: ca-ab/donations_credit_rate_line_56
    consumes:
      base: ca-ab/ab428_donations_amount_line_56
    blank:
      base: "0"
    produces:
      output: ca-ab/ab428_donations_credit_at_second_rate_line_56
