# AB428 (2025) line 63's input, which a salary-only caller does not give.
# Line 63: "Line 63 and line 61520: Alberta dividend tax credit (use Worksheet AB428)". A salary-only
# caller has no dividend income, so a request that leaves the line out is read as blank.
inputs:
  - name: ca-ab/ab428_dividend_tax_credit_line_63
    title: "Alberta dividend tax credit"
    reference: "63"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 63 and line 61520: Alberta dividend tax credit (use Worksheet AB428)'
