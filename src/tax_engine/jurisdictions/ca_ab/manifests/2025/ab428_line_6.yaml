# Form AB428 (Alberta Tax and Credits, 2025, 5009-c-25e) line 6, "Line 6: Line 4 multiplied by the
# percentage from line 5 =": the tax on the part of the taxable income over the column's lower
# bound. It is blank when line 4 or line 5 is blank.
form:
  name: ca-ab/ab428_credits
capabilities:
  - name: core/multiply_by_rate
    reference: "6"
    unit: ca/cad
    params:
      rounding: ca-ab/cent_rounding
    consumes:
      base: ca-ab/ab428_taxable_income_over_lower_bound_line_4
      rate: ca-ab/ab428_bracket_rate_line_5
    blank:
      base: pass_on
      rate: pass_on
    produces:
      output: ca-ab/ab428_tax_on_excess_line_6
