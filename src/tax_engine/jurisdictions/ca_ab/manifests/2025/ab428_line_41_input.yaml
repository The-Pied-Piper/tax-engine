# AB428 (2025) inputs a salary-only caller does not give.
# Line 41: "Line 41 and line 58560: Your unused tuition and education amounts (attach Schedule
# AB(S11))". The figure comes from Schedule AB(S11), which the engine does not compute. A salary-only
# caller has none, so a request that leaves the line out is read as blank, and the consumers (line 43
# and line 2 of Worksheet AB428) read that blank as 0.
inputs:
  - name: ca-ab/ab428_unused_tuition_line_41
    title: "Your unused tuition and education amounts"
    reference: "41"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 41 and line 58560: Your unused tuition and education amounts'
