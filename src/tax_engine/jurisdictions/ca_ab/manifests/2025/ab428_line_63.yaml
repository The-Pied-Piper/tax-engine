# AB428 (2025) line 63 "Alberta dividend tax credit", from the printed Worksheet AB428 (5009-D,
# "Line 61520 - Alberta dividend tax credit") in six steps: "Line A: Amount from line 12000 of your
# return", "Line 1: Amount from line 12010 of your return Line B multiplied by 2.18% =", "Line 2:
# Amount A minus amount B Line C = multiplied by 8.12% =" and the sum of line 1 and line 2, which is
# line 63 of the form. The two amounts are the T1's lines 12000 and 12010: the T1 taxable income form owns the inputs and
# exports the lines, so the first two steps total those exports (a form reads another form's export
# only as a record list). Each printed rate is held in its own dataset and each product rounds
# half-up to the cent. A caller who gives neither line has a credit of 0.00.
form:
  name: ca-ab/ab428
capabilities:
  - name: core/record_total
    title: "Amount from line 12000 of your return"
    reference: "63 worksheet line A"
    unit: ca/cad
    consumes:
      records: ca/t1_taxable_income.taxable_dividends_line_12000
    produces:
      output: ca-ab/ab428_dividend_tax_credit_worksheet_line_a
  - name: core/record_total
    title: "Amount from line 12010 of your return"
    reference: "63 worksheet line B"
    unit: ca/cad
    consumes:
      records: ca/t1_taxable_income.taxable_dividends_other_than_eligible_line_12010
    produces:
      output: ca-ab/ab428_dividend_tax_credit_worksheet_line_b
  - name: core/apply_rate
    reference: "63 worksheet line 1"
    unit: ca/cad
    params:
      rate: ca-ab/dividend_tax_credit_worksheet_rate_line_1
    consumes:
      base: ca-ab/ab428_dividend_tax_credit_worksheet_line_b
    produces:
      output: ca-ab/ab428_dividend_tax_credit_worksheet_line_1
  - name: core/subtract
    title: "Amount A minus amount B"
    reference: "63 worksheet line C"
    unit: ca/cad
    params:
      rounding: ca-ab/cent_rounding
    consumes:
      amount: ca-ab/ab428_dividend_tax_credit_worksheet_line_a
      less: ca-ab/ab428_dividend_tax_credit_worksheet_line_b
    produces:
      output: ca-ab/ab428_dividend_tax_credit_worksheet_line_c
  - name: core/apply_rate
    reference: "63 worksheet line 2"
    unit: ca/cad
    params:
      rate: ca-ab/dividend_tax_credit_worksheet_rate_line_2
    consumes:
      base: ca-ab/ab428_dividend_tax_credit_worksheet_line_c
    produces:
      output: ca-ab/ab428_dividend_tax_credit_worksheet_line_2
  - name: core/sum
    title: "Alberta dividend tax credit"
    reference: "63"
    unit: ca/cad
    params:
      rounding: ca-ab/cent_rounding
    consumes:
      parts: [ca-ab/ab428_dividend_tax_credit_worksheet_line_1, ca-ab/ab428_dividend_tax_credit_worksheet_line_2]
    produces:
      output: ca-ab/ab428_dividend_tax_credit_line_63
