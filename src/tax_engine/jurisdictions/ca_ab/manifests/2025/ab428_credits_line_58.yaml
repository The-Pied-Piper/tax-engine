# Form AB428 (CRA 5009-c) line 58: "Line 58 and line 61500: Line 54 plus line 57 Enter this amount
# on line 62. Alberta non-refundable tax credits". It sums the credits at the printed rate (line 54,
# `ca-ab/ab428_credits_at_rate_line_54`) and the donations credit (line 57,
# `ca-ab/ab428_donations_credit_line_57`). Lines 55 and 56 are not built: line 57 is an input that
# a salary-only caller leaves out, read as blank and then as 0 by the blank rule below. Line 58 is
# the output `ca-ab/ab428_non_refundable_credits_line_58`, which the form exports for line 62.
form:
  name: ca-ab/ab428_credits
capabilities:
  - name: core/sum
    title: "Alberta non-refundable tax credits"
    reference: "58"
    unit: ca/cad
    params:
      rounding: ca-ab/cent_rounding
    consumes:
      parts: [ca-ab/ab428_credits_at_rate_line_54, ca-ab/ab428_donations_credit_line_57]
    blank:
      ca-ab/ab428_donations_credit_line_57: "0"
    produces:
      output: ca-ab/ab428_non_refundable_credits_line_58
