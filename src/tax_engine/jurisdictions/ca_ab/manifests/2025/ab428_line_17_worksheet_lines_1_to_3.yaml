# Worksheet AB428 (CRA 5009-D) section "Line 58080 - Age amount", lines 1 to 3: "Line 1: Maximum amount 6,221.00", "Line 2: Amount from line 23600 of your return", "Line 3: Income threshold 46,308.00". One step per worksheet line; the worksheet is built inside form ca-ab/ab428_credits (Umar, 27 Nov 2026: build every age worksheet the way Nova Scotia's is), so its steps carry plain-words titles and no reference (the numbers 1 to 3 are also AB428 line numbers). Line 2 reads the T1 net income record list; lines 1 and 3 are printed dataset figures.
form:
  name: ca-ab/ab428_credits
capabilities:
- name: core/credit_amount
  title: 'Worksheet AB428 age amount line 1: maximum amount'
  unit: ca/cad
  params:
    amount: ca-ab/age_maximum
  produces:
    output: ca-ab/worksheet_ab428_age_amount_maximum_line_1
- name: core/record_total
  title: 'Worksheet AB428 age amount line 2: amount from line 23600'
  unit: ca/cad
  consumes:
    records: ca/t1_taxable_income.net_income
  produces:
    output: ca-ab/worksheet_ab428_age_amount_net_income_line_2
- name: core/credit_amount
  title: 'Worksheet AB428 age amount line 3: income threshold'
  unit: ca/cad
  params:
    amount: ca-ab/age_income_threshold
  produces:
    output: ca-ab/worksheet_ab428_age_amount_income_threshold_line_3
