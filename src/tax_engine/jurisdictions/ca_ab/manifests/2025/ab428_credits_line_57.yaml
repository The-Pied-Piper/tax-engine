# Form AB428 (CRA 5009-c) line 57: "Line 57 and line 58969: Line 55 plus line 56 =". It sums line 55
# (`ca-ab/ab428_donations_credit_at_first_rate_line_55`) and line 56
# (`ca-ab/ab428_donations_credit_at_second_rate_line_56`), each read from its own step and never
# blank (a blank Schedule 9 amount gives 0.00 there). The form prints the block heading "Donations
# and gifts:", which is the step's title. Line 58 reads it.
form:
  name: ca-ab/ab428_credits
capabilities:
  - name: core/sum
    title: "Donations and gifts"
    reference: "57"
    unit: ca/cad
    params:
      rounding: ca-ab/cent_rounding
    consumes:
      parts:
        - ca-ab/ab428_donations_credit_at_first_rate_line_55
        - ca-ab/ab428_donations_credit_at_second_rate_line_56
    produces:
      output: ca-ab/ab428_donations_credit_line_57
