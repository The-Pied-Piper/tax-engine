# AB428 (2025) line 34 maximum. Form AB428 (CRA 5009-c-25e): "Line 34 and line 58360: Pension income
# amount (maximum $1,719)". The $1,719 is the `ca-ab/pension_income_amount_maximum` dataset, produced
# whole through core/credit_amount; line 34 checks the claim against it.
form:
  name: ca-ab/ab428_credits
capabilities:
  - name: core/credit_amount
    title: "Pension income amount maximum"
    unit: ca/cad
    params:
      amount: ca-ab/pension_income_amount_maximum
    produces:
      output: ca-ab/pension_income_amount_maximum
