# AB428 (2025) inputs a salary-only caller does not give.
# Line 50: "Line 50 and line 58729: Allowable amount of medical expenses for other dependants (use
# Worksheet AB428)" (Form AB428, CRA 5009-c). The Worksheet AB428 section behind this line exists
# only to compute a claim a salary-only caller leaves empty, so that block is skipped and the line
# is taken as one optional input. A request that leaves the line out is read as blank; line 51 reads
# that blank as 0.
inputs:
  - name: ca-ab/ab428_allowable_medical_expenses_for_other_dependants_line_50
    title: "Allowable amount of medical expenses for other dependants (use Worksheet AB428)"
    reference: "50"
    unit: ca/cad
    required: false
    default: null
    basis: "Line 50 and line 58729: Allowable amount of medical expenses for other dependants (use Worksheet AB428)"
