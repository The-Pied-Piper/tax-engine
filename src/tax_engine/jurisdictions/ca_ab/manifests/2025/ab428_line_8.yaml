# Form AB428 (Alberta Tax and Credits, 2025, 5009-c-25e) line 8, "Line 8: Line 6 plus line 7 Alberta
# tax on taxable income =": the Alberta tax on taxable income for the column that line 1 falls in.
# It sums line 6 (`ca-ab/ab428_tax_on_excess_line_6`) and line 7
# (`ca-ab/ab428_bracket_tax_at_start_line_7`). Line 8 is blank when lines 6 and 7 are blank.
form:
  name: ca-ab/ab428_credits
capabilities:
  - name: core/sum
    title: "Alberta tax on taxable income"
    reference: "8"
    unit: ca/cad
    params:
      rounding: ca-ab/cent_rounding
    consumes:
      parts:
        [ca-ab/ab428_tax_on_excess_line_6, ca-ab/ab428_bracket_tax_at_start_line_7]
    blank:
      ca-ab/ab428_tax_on_excess_line_6: pass_on
      ca-ab/ab428_bracket_tax_at_start_line_7: pass_on
    produces:
      output: ca-ab/ab428_tax_on_taxable_income_line_8
