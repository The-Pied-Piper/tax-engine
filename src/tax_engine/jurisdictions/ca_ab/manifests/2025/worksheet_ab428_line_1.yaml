# Worksheet AB428 (2025, CRA 5009-D) line 1: "Line 1: Amount from line 58800 of your Form AB428".
# Line 58800 is AB428 line 52, exported by ca-ab/ab428_credits as
# `ca-ab/ab428_credits_total_line_52`, and another form reads an export only as a record list, so
# the one step is core/record_total over those records (as ca-on/on428 line 1 is, in
# on428_line_3.yaml). Line 52 is always computed, so there is no blank rule.
form:
  name: ca-ab/worksheet_ab428
capabilities:
  - name: core/record_total
    reference: "1"
    unit: ca/cad
    consumes:
      records: ca-ab/ab428_credits.ab428_credits_total_line_52
    produces:
      output: ca-ab/worksheet_ab428_line_1
