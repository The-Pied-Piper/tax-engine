# Form AB428 (CRA 5009-c-25e) line 55 (ca-ab/ab428_credits): "Line 55: Amount from line 13 of your
# federal Schedule 9 multiplied by 60% =". The 60% is a printed rate, held in the
# `ca-ab/donations_credit_rate_line_55` dataset, so the step is one calculation: 60% of the Schedule 9
# amount, rounded half-up to the cent. The amount (box A) is Schedule 9 line 13, totalled and rounded to the cent by ab428_credits_line_55_box_a.yaml. The line has two boxes: the amount
# (box A, the box_a part) and the multiplied result (box B, this step). The form does not name them;
# "box A" and "box B" are the owner's naming, as on ON428 line 47.
form:
  name: ca-ab/ab428_credits
capabilities:
  - name: core/apply_rate
    reference: "55 box B"
    unit: ca/cad
    params:
      rate: ca-ab/donations_credit_rate_line_55
    consumes:
      base: ca-ab/ab428_donations_amount_rounded_line_55
    produces:
      output: ca-ab/ab428_donations_credit_at_first_rate_line_55
