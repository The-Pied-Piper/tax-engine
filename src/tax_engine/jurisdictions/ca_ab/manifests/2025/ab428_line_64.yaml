# Form AB428 (Alberta Tax and Credits, 2025, 5009-c-25e) line 64 (ca-ab/ab428): "Line 64 and line
# 61540: Amount from line 40427 of your return ^ multiplied by 35% = ^". The 35% is a printed rate,
# held in the `ca-ab/minimum_tax_rate` dataset, so line 64 is one calculation: 35% of the amount,
# rounded half-up to the cent. The amount (box A) is the T1's line 40427: the T1 owns the input and
# exports the line (`ca/minimum_tax_carryover_line_40427`), so the first step totals that export (a
# form reads another form's export only as a record list) and the second applies the rate.
form:
  name: ca-ab/ab428
capabilities:
  - name: core/record_total
    title: "Amount from line 40427 of your return"
    reference: "64 box A"
    unit: ca/cad
    consumes:
      records: ca/t1_lines_copied_by_provinces.minimum_tax_carryover_line_40427
    produces:
      output: ca-ab/ab428_minimum_tax_carryover_amount_line_64
  - name: core/apply_rate
    title: "Alberta minimum tax carryover"
    reference: "64 box B"
    unit: ca/cad
    params:
      rate: ca-ab/minimum_tax_rate
    consumes:
      base: ca-ab/ab428_minimum_tax_carryover_amount_line_64
    produces:
      output: ca-ab/ab428_minimum_tax_carryover_line_64
