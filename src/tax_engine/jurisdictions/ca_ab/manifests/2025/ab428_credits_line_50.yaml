# AB428 (2025) line 50, rounded to the cent. Form AB428 (CRA 5009-c): "Line 50 and line 58729: Allowable amount of medical expenses for other dependants". The line is an optional input
# (`ca-ab/ab428_allowable_medical_expenses_for_other_dependants_line_50`), blank for a salary-only filer. One core/sum step over the input alone, as line 41 is
# (ab428_credits_line_41.yaml), reads the blank as 0 and rounds to the cent, because a line written on
# the form is a whole-cent figure: `ca-ab/ab428_allowable_medical_expenses_for_other_dependants_rounded_line_50`.
form:
  name: ca-ab/ab428_credits
capabilities:
  - name: core/sum
    reference: "50"
    unit: ca/cad
    params:
      rounding: ca-ab/cent_rounding
    consumes:
      parts: [ca-ab/ab428_allowable_medical_expenses_for_other_dependants_line_50]
    blank:
      ca-ab/ab428_allowable_medical_expenses_for_other_dependants_line_50: "0"
    produces:
      output: ca-ab/ab428_allowable_medical_expenses_for_other_dependants_rounded_line_50
