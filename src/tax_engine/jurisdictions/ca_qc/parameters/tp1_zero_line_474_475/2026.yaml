# Provisional: taken from the 2025 form text named in sources; to be confirmed against the 2026 form text when Revenu Quebec publishes it.
# Derivation: carried forward unchanged from the 2025 file; the 2026 form is not yet published.
# The "0" of TP-1 lines 474 and 475 (2025 tax year, Revenu Quebec TP-1.D-V (2025-12), page 5): line
# 474 is "Amount from line 470, if it is negative" and line 475 is "Amount from line 470, if it is
# positive", so each takes its half of the signed line 470 and is 0 on the other side. The form
# prints no zero; it is the other side of the sign, and a dollars-and-cents box, so the amount is
# "0" to the cent, which the rounding of the dataset keeps. No capability returns the positive or
# negative part of a signed amount, so line 475 is the greater of line 470 and this zero, and line
# 474 is this zero less line 470, not below zero (owner decision, 19 Nov 2026).
# The 2026 form is not yet published, so the figure is not yet confirmed against it.
family: ca-qc/tp1_zero_line_474_475
tax_year: 2026
kind: credit
sources:
  - Revenu Quebec TP-1.D-V (2025-12), page 5
rounding: {increment: "0.01", mode: half_up}
amount: "0"
