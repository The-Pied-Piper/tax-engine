# Provisional: derived from the published 2026-27 premium-year maximum, not printed on a 2026 form; to be confirmed against the 2026 form text when Revenu Quebec publishes it.
# Derivation: 789 / 12 = 65.75, the 2025 form's own method (766 / 12 = 63.83 for July to December 2025); 789 is RAMQ's maximum annual premium from 1 July 2026 (RAMQ release of 30 June 2026).
# Revenu Quebec TP-1.D.K-V (2025-12), Schedule K, Part C, line 88: "Number of months entered in box
# 61 x $63.83". The 2025 form prints 63.83, the amount for each month of box 61. Half-up to the
# cent changes nothing.
# The 2026 form is not yet published, so the figure is not yet confirmed against it.
family: ca-qc/schedule_k_monthly_amount_box_61
tax_year: 2026
kind: credit
sources:
  - Revenu Quebec TP-1.D.K-V (2025-12), Schedule K, Part C
  - Regie de l'assurance maladie du Quebec, release of 30 June 2026 (annual premium maximums 766 and 789)
rounding: {increment: "0.01", mode: half_up}
amount: "65.75"
