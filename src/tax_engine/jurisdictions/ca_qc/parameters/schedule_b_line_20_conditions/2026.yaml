# Provisional: taken from the 2025 form text named in sources; to be confirmed against the 2026 form text when Revenu Quebec publishes it.
# Derivation: carried forward unchanged from the 2025 file; the 2026 form is not yet published.
# Condition of Schedule B line 20 (Revenu Quebec TP-1.D.B-V (2025-12), Schedule B, Part A): "You are
# not entitled to any of these amounts if you did not have a spouse on December 31, 2025, and the
# amount on line 18 is more than $64,699." This dataset copies that one condition in the form's
# wording; the count is 0 when the condition applies and 1 when it does not. The other printed
# condition (a spouse on December 31, 2025, and an amount on line 18 more than $90,027) is not read
# in the take-home, which has no spouse. The result is a count, not a dollars-and-cents box, so there
# is no rounding.
# The 2026 form is not yet published, so the figure is not yet confirmed against it.
family: ca-qc/schedule_b_line_20_conditions
tax_year: 2026
kind: conditions
sources:
  - Revenu Quebec TP-1.D.B-V (2025-12), Schedule B, Part A
rounding: none
count_when_any_applies: "0"
conditions:
  - text: You did not have a spouse on December 31, 2025, and the amount on line 18 is more than $64,699
    parts:
      - tests:
          - {reads: amount, position: "1", relation: more_than, than: "64699"}
