# Provisional: derived from the published 2026-27 premium-year maximum, not printed on a 2026 form; to be confirmed against the 2026 form text when Revenu Quebec publishes it.
# Derivation: 789 is RAMQ's maximum annual premium from 1 July 2026 (RAMQ release of 30 June 2026); the 2025 form's line 83 maximum, 766, is the maximum of the premium year that began in July 2025, so the 2026 line 83 maximum is the one that begins in July 2026.
# Revenu Quebec TP-1.D.K-V (2025-12), Schedule K, Part C, line 83 "Add lines 81 and 82 (maximum
# $766)": the 2025 form prints the maximum of line 83 as a constant, which is the cap applied
# inside line 83 (the form's "is more than $14,669, enter $766 on line 84" is the same figure);
# half-up to the cent gives the scale of a dollars-and-cents box and changes nothing.
# The 2026 form is not yet published, so the figure is not yet confirmed against it.
family: ca-qc/schedule_k_line_83_maximum
tax_year: 2026
kind: amount
title: "maximum premium"
unit: ca/cad
sources:
  - Revenu Quebec TP-1.D.K-V (2025-12), Schedule K, Part C
  - Regie de l'assurance maladie du Quebec, release of 30 June 2026 (annual premium maximums 766 and 789)
rounding: {increment: "0.01", mode: half_up}
amount: "789"
