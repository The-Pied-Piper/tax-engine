# Provisional: no 2026 figure is published yet (the 2026 forms are not out), so the 2025 figure is
# carried. To be replaced when Revenu Quebec and CRA publish the 2026 forms. The comment below is
# the 2025 derivation.
# Quebec Schedule 6 (5005-S6, 2025 edition) line 26: Line 26: Rate 20%
# The filer takes the "If not" branch (no eligible spouse, no eligible dependant): the printed 20%, held as a rate of 0.20, so line
# 26 has no step of its own; line 27 ("Line 25 multiplied by the percentage from line 26") applies it to line 25. It replaces `ca/cwb_reduction_rate` in the Quebec manifest's import of
# Schedule 6. A dollars-and-cents figure, so it rounds half-up to the cent.
family: ca-qc/cwb_reduction_rate
tax_year: 2026
kind: rate
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5005-s6/5005-s6-25e.txt
rounding: {increment: "0.01", mode: half_up}
rate: "0.20"
