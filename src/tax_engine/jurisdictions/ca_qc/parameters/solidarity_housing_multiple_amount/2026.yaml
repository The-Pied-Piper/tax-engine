# Provisional: taken from Quebec Finance, Parameters of the Personal Income Tax System for 2026 (Nov 2025), Table 4; to be confirmed against the 2026 form text when Revenu Quebec publishes it.
# Derivation: figure as printed in Table 4 of the Quebec Finance parameters for 2026, amount for a couple (housing), July 2026 to June 2027; no rounding applied here.
# Quebec solidarity tax credit, housing amount for multiple owners or tenants, for the payment
# period July 2026 to June 2027 (the credit of the 2025 return): "montant de base pour frais de
# logement 906", Table C.9 of the Quebec Ministry of Finance fiche 110201 (Dépenses fiscales 2025),
# a web page, so the figure is a listed check until a printed source is found. Claimed whole. A
# dollars-and-cents figure, so it rounds half-up to the cent, the project's choice, which changes
# nothing.
# The 2026 form is not yet published, so the figure is not yet confirmed against it.
family: ca-qc/solidarity_housing_multiple_amount
tax_year: 2026
kind: credit
sources:
  - https://www.revenuquebec.ca/en/citizens/tax-credits/solidarity-tax-credit/calculation-of-the-credit/
  - Quebec Ministere des Finances, Parameters of the Personal Income Tax System for 2026 (Nov 2025) (cra-docs revenu-quebec-2025/AUTEN_IncomeTax2026.pdf)
