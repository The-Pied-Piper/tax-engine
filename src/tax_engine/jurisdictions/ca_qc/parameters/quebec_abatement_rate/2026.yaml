# Provisional: no 2026 figure is published yet (the 2026 forms are not out), so the 2025 figure is
# carried. To be replaced when Revenu Quebec and CRA publish the 2026 forms. The comment below is
# the 2025 derivation.
# CRA 5005-R (2025), Step 6, line 156: "Refundable Quebec abatement: Line 156 and line 44000: Amount from
# Line 42900 multiplied by 16.5% =". The printed rate, 16.5%, is a rate of 0.165, taken as printed. The
# product is a dollars-and-cents line, so it rounds half-up to the cent, the project's choice, as the
# form states no rounding rule.
family: ca-qc/quebec_abatement_rate
tax_year: 2026
kind: rate
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5005-r/5005-r-25e.txt
rounding: {increment: "0.01", mode: half_up}
rate: "0.165"
