# Provisional: derived from the published 2025-26 and 2026-27 premium-year maximums, not printed on a 2026 form; to be confirmed against the 2026 form text when Revenu Quebec publishes it.
# Derivation: (766 + 789) / 2 = 777.50, the same averaging that gives the printed 2025 figure 755 = (744 + 766) / 2. 766 and 789 are RAMQ's maximum annual premium for 1 July 2025 to 30 June 2026 and from 1 July 2026 (RAMQ release of 30 June 2026, "Ajustement des tarifs pour les personnes couvertes par le regime public d'assurance medicaments").
# The 2025 form prints line 87 as "Maximum premium for 2025 ... 87 755 00" (Revenu Quebec TP-1.D.K-V (2025-12), Schedule K, Part C). The 2026 form is not yet published, so the figure is not yet confirmed against it.
