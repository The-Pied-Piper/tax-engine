# Provisional: taken from the 2025 form text named in sources; to be confirmed against the 2026 form text when Revenu Quebec publishes it.
# Derivation: carried forward unchanged from the 2025 file; the 2026 form is not yet published. Check against the data: (12,808 - 2,400) x 11.6% = 1,207.33, the 2026 general work premium maximum for a person living alone in Table 3 of the Quebec Finance parameters for 2026, so the carried rate and exempt amount reproduce the published maximum.
# Revenu Quebec TP-1.D-V (2025-12), Schedule P (TP-1.D.P-V), Part E, section 2 "Individual without a
# spouse on December 31, 2025", column 1 "Work premium", line 74: "If you designated a child on line 50,
# enter 30%. Otherwise, enter 11.6%." The take-home designates no child (line 50 is a dependant line,
# left out), so the printed 11.6% applies. Line 76 is a dollars-and-cents line, so the product
# rounds half-up to the cent, the project's choice, as the form states no rounding rule.
# The 2026 form is not yet published, so the figure is not yet confirmed against it.
family: ca-qc/work_premium_rate
