# Provisional: taken from the 2025 form text named in sources; to be confirmed against the 2026 form text when Revenu Quebec publishes it.
# Derivation: the 2025 form prints "born before January 1, 1961", which is 65 years of age on 31 December 2025 (the age condition of the amount); for 2026 the same age is born before January 1, 1962, so the year moves from 1960 to 1961. The 2026 form is not yet published.
# Condition of Schedule B line 22, 2026 tax year: "If you were born before January 1, 1962, enter ..." (2025 wording: "born before January 1, 1961"). The filer gives a birth year; one condition, turned round because the conditions only test "more than": the birth year is more than 1961, in which case the count is 0, else 1. The result is a count, so there is no rounding.
family: ca-qc/schedule_b_line_22_conditions
tax_year: 2026
kind: conditions
sources:
  - Revenu Quebec TP-1.D.B-V (2025-12), Schedule B, Part B
rounding: none
count_when_any_applies: "0"
conditions:
  - text: You were born after 1961
    parts:
      - tests:
          - {reads: count, position: "1", relation: more_than, than: "1961"}
