# Condition of Schedule B line 22 (Revenu Quebec TP-1.D.B-V (2025-12), Schedule B, Part B): "If you were born before January 1, 1961, enter $3,906." The filer gives a birth year; one condition, in the form's wording turned round because the conditions only test "more than": the birth year is more than 1960 (born after 1960, not before January 1, 1961), in which case the count is 0, else 1. The result is a count, not a dollars-and-cents box, so there is no rounding.
family: ca-qc/schedule_b_line_22_conditions
tax_year: 2025
kind: conditions
sources:
  - Revenu Quebec TP-1.D.B-V (2025-12), Schedule B, Part B
rounding: none
count_when_any_applies: "0"
conditions:
  - text: You were born after 1960
    parts:
      - tests:
          - {reads: count, position: "1", relation: more_than, than: "1960"}
