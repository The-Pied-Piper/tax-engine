# "Deduction for workers"), line 9: "Carry the result to line 201 of your return (maximum $1,420)."
# Line 9 is a dollars-and-cents box, so the capped amount rounds half-up to the cent, the project's
# choice, as the form states no rounding rule.
family: ca-qc/work_chart_201_maximum
