# Provisional: no 2026 figure is published yet (the 2026 forms are not out), so the 2025 figure is
# carried. To be replaced when Revenu Quebec and CRA publish the 2026 forms. The comment below is
# the 2025 derivation.
# Quebec Schedule 6 (5005-S6, 2025 edition) line 21: Line 21: If you did not have an eligible spouse or an eligible dependant, enter $3,812.06. If you had an eligible spouse but did not have an eligible dependant, enter $5,943.38. ...
# The filer takes the "If not" branch (no eligible spouse, no eligible dependant): the printed $3,812.06 for a filer with no eligible spouse and no eligible dependant, claimed whole, so line
# 21 has no step of its own; line 22 takes the lesser of line 20 and it. It replaces `ca/cwb_maximum` in the Quebec manifest's import of
# Schedule 6. A dollars-and-cents figure, so it rounds half-up to the cent, which changes nothing.
family: ca-qc/cwb_maximum
tax_year: 2026
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5005-s6/5005-s6-25e.txt
