# Provisional: derived from the published 2025-26 premium-year maximum, not printed on a 2026 form; to be confirmed against the 2026 form text when Revenu Quebec publishes it.
# Derivation: 766 / 12 = 63.83, the 2025 form's own method (744 / 12 = 62.00 for January to June 2025); 766 is RAMQ's maximum annual premium for 1 July 2025 to 30 June 2026 (RAMQ release of 30 June 2026).
# Revenu Quebec TP-1.D.K-V (2025-12), Schedule K, Part C, line 88: "Number of months entered in box
