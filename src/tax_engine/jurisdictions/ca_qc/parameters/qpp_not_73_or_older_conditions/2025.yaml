# Schedule 8 (5005-S8) Part 1 line A, 2025, condition c): "You were 73 years of age or older at the end of 2025 (or if the individual died in 2025 but would have been 73 years of age by the end of 2025), enter "0" on line A". A filer born in 1952 or earlier was 73 or older at the end of 2025 (born in 1953 was 72). The death wording stays typed in. In the form wording turned round: the year is more than 1952, the count is 1 (QPP months kept), else 0.
family: ca-qc/qpp_not_73_or_older_conditions
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5005-s8/5005-s8-25e.txt
rounding: none
count_when_any_applies: "1"
conditions:
  - text: You were born after 1952
    parts:
      - tests:
          - {reads: count, position: "1", relation: more_than, than: "1952"}
