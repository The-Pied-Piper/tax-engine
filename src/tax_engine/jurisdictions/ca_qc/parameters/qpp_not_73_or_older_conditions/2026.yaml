# Provisional: moved on by one year from 2025; to be confirmed against the 2026 form text when CRA publishes it.
# Derivation: the same age test applied to 2026 (73 or older at the end of 2026 is born in 1953 or earlier); the 2026 Schedule 8 (5005-S8) is not yet published, so it is unconfirmed.
# Schedule 8 (5005-S8) Part 1 line A, 2026, condition c): 73 or older at the end of 2026, born in 1953 or earlier. The year is more than 1953, the count is 1, else 0.
family: ca-qc/qpp_not_73_or_older_conditions
tax_year: 2026
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5005-s8/5005-s8-25e.txt
rounding: none
count_when_any_applies: "1"
conditions:
  - text: You were born after 1953
    parts:
      - tests:
          - {reads: count, position: "1", relation: more_than, than: "1953"}
