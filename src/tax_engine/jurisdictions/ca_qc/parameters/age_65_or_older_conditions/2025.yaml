# Aged 65 or older on 31 December 2025, the test of the Quebec age lines: 5005-R line 79 and line 30100 "Age amount (if you were born in 1960 or earlier)" (CRA 5005-R) and Schedule B line 22 "If you were born before January 1, 1961, enter $3,906" (Revenu Quebec TP-1.D.B-V (2025-12)). The Quebec return does not use the federal T1 forms, so Quebec works the test out from its own year of birth (Umar, 27 Nov 2026). The filer gives a birth year; one condition, in the form's wording turned round because the conditions only test "more than": the birth year is more than 1960, in which case the count is 0, else 1. The result is a count, so there is no rounding.
family: ca-qc/age_65_or_older_conditions
tax_year: 2025
kind: conditions
sources:
  - Revenu Quebec TP-1.D.B-V (2025-12), Schedule B, Part B
  - CRA 5005-R (2025), page 5, line 79 and line 30100
rounding: none
count_when_any_applies: "0"
conditions:
  - text: You were born after 1960
    parts:
      - tests:
          - {reads: count, position: "1", relation: more_than, than: "1960"}
