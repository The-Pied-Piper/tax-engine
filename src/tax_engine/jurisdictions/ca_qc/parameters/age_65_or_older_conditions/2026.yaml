# Provisional: moved on from 2025; to be confirmed against the 2026 form text when Revenu Quebec and CRA publish it.
# Derivation: the cutoff is age 65 on 31 December of the tax year, so the 2025 year 1960 moves to 1961 for 2026 (a filer born in 1961 turns 65 in 2026); the 2026 forms are not yet published, so it is unconfirmed.
# Aged 65 or older on 31 December 2026, the test of the Quebec age lines (5005-R line 79 and line 30100; Schedule B line 22). The filer gives a birth year; one condition, turned round because the conditions only test "more than": the birth year is more than 1961, in which case the count is 0, else 1. The result is a count, so there is no rounding.
family: ca-qc/age_65_or_older_conditions
tax_year: 2026
kind: conditions
sources:
  - Revenu Quebec TP-1.D.B-V (2025-12), Schedule B, Part B
  - CRA 5005-R (2025), page 5, line 79 and line 30100
rounding: none
count_when_any_applies: "0"
conditions:
  - text: You were born after 1961
    parts:
      - tests:
          - {reads: count, position: "1", relation: more_than, than: "1961"}
