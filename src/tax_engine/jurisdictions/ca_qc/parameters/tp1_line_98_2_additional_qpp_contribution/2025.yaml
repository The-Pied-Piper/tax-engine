# Revenu Quebec TP-1.D-V (2025-12), page 2, line 98.2: "Additional contribution to the QPP. RL-1,
# box B.B". The form prints no rate or ceiling for the slip box. A salary-only caller has no RL-1
# slip, so the figure is the employee's second additional QPP contribution from the Revenu Quebec
# page "Maximum Pensionable Earnings and Quebec Pension Plan Contribution Rate" (a web page: a
# listed check): 4% of the earnings from the $71,300 maximum pensionable earnings to the $81,200
# additional maximum pensionable earnings, at most $396.00 (4% of $9,900, exactly). Dollars and
# cents, half-up to the cent.
# The tier is read on Schedule 8 line 4 (the earnings above the maximum pensionable earnings, prorated
# by the months of line A), so it starts at 0 and its upper bound is line 4's maximum ($9,900: the
# additional maximum less the maximum); a filer with no QPP months has a line 4 of 0.
family: ca-qc/tp1_line_98_2_additional_qpp_contribution
tax_year: 2025
kind: contribution_tier
sources:
  - Revenu Quebec TP-1.D-V (2025-12)
  - Revenu Quebec, Maximum Pensionable Earnings and Quebec Pension Plan Contribution Rate (web page)
rounding: {increment: "0.01", mode: half_up}
rate: "0.04"
lower: "0"
upper: "9900"
maximum: "396.00"
