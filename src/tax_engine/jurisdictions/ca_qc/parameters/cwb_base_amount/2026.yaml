# Provisional: no 2026 figure is published yet (the 2026 forms are not out), so the 2025 figure is
# carried. To be replaced when Revenu Quebec and CRA publish the 2026 forms. The comment below is
# the 2025 derivation.
# Quebec Schedule 6 (5005-S6, 2025 edition) line 17: Line 17: If you had an eligible spouse or you had both an eligible spouse and an eligible dependant, enter $3,600. If not, enter $2,400.
# The filer takes the "If not" branch (no eligible spouse, no eligible dependant): the printed $2,400 for a filer with no eligible spouse and no eligible dependant, claimed whole, so line
# 17 has no step of its own; line 18 subtracts it from line 16. It replaces `ca/cwb_base_amount` in the Quebec manifest's import of
# Schedule 6. A dollars-and-cents figure, so it rounds half-up to the cent, which changes nothing.
family: ca-qc/cwb_base_amount
tax_year: 2026
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5005-s6/5005-s6-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "2400"
