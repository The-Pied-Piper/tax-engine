# Provisional: taken from T4127 (Jan 2026); to be confirmed against the 2026 form text when Revenu Quebec publishes it.
# Derivation: figure as printed in T4127 (Jan 2026): QPP: rate 6.30% from 3,500 to 74,600, maximum 4,479.30; no rounding applied here.
# Revenu Quebec TP-1.D-V (2025-12), page 2, line 98: "QPP contribution. RL-1 slip, box B.A". The
# form prints no rate or ceiling for the slip box. A salary-only caller has no RL-1 slip, so the
# figure is the employee's base QPP contribution from the Revenu Quebec page "Maximum Pensionable
# Earnings and Quebec Pension Plan Contribution Rate" (a web page: a listed check): 6.40% of the
# earnings from the $3,500 basic exemption to the $71,300 maximum pensionable earnings, at most
# $4,339.20 (6.40% of $67,800, exactly). Dollars and cents, half-up to the cent.
# The description above is of the 2025 form line; the figures of this file are 2026. The 2026 form is not yet published, so they are not yet confirmed against it.
# The tier is read on Schedule 8 line 7 (the earnings above the basic exemption, up to the maximum
# pensionable earnings, prorated by the months of line A), so it starts at 0 and its upper bound is
# line 7's maximum ($71,100), the finite top the tier needs; a filer with no QPP months has a line 7 of 0.
family: ca-qc/tp1_line_98_qpp_contribution
tax_year: 2026
kind: contribution_tier
sources:
  - Revenu Quebec TP-1.D-V (2025-12)
  - Revenu Quebec, Maximum Pensionable Earnings and Quebec Pension Plan Contribution Rate (web page)
  - Revenu Quebec, Maximum Pensionable Earnings and Quebec Pension Plan Contribution Rate (web page, 2026 row; CRA T4127 (Jan 2026) Tables 8.3 to 8.6, QPP rows)
rounding: {increment: "0.01", mode: half_up}
rate: "0.063"
lower: "0"
upper: "71100"
maximum: "4479.30"
