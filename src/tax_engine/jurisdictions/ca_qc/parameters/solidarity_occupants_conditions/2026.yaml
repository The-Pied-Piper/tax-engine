# Provisional: no 2026 figure is published yet (the 2026 forms are not out), so the 2025 figure is
# carried. To be replaced when Revenu Quebec and CRA publish the 2026 forms. The comment below is
# the 2025 derivation.
# Condition of the solidarity tax credit's basic housing amount, for the payment period July 2026
# to June 2027 (the credit of the 2025 return): the basic housing amount is 746 for one owner or
# tenant and 906 shared among them for more than one (Table C.9 of the Quebec Ministry of Finance
# fiche 110201, Dépenses fiscales 2025, a web page, so the figures are a listed check until a
# printed source is found). The condition is the number of owners or tenants (Schedule D line 33
# or 36), the first count, more than 1. The count is 1 when it applies and 0 when it does not. The
# result is a count, not a dollars-and-cents box, so there is no rounding.
family: ca-qc/solidarity_occupants_conditions
tax_year: 2026
kind: conditions
sources:
  - https://www.revenuquebec.ca/en/citizens/tax-credits/solidarity-tax-credit/calculation-of-the-credit/
rounding: none
count_when_any_applies: "1"
conditions:
  - text: More than one owner or tenant
    parts:
      - tests:
          - {reads: count, position: "1", relation: more_than, than: "1"}
