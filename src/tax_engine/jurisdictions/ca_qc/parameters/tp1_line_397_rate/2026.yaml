# Provisional: no 2026 figure is published yet (the 2026 forms are not out), so the 2025 figure is
# carried. To be replaced when Revenu Quebec and CRA publish the 2026 forms. The comment below is
# the 2025 derivation.
# Revenu Quebec TP-1.D-V (2025-12), page 4, Non-refundable tax credits, line 397: "Multiply line
# 397.1 by 10%". The printed 10% is a rate of 0.10, taken as printed. The product is a
# dollars-and-cents line, so it rounds half-up to the cent, the project's choice, as the form states
# no rounding rule.
family: ca-qc/tp1_line_397_rate
tax_year: 2026
kind: rate
sources:
  - Revenu Quebec TP-1.D-V (2025-12), page 4, Non-refundable tax credits
rounding: {increment: "0.01", mode: half_up}
rate: "0.10"
