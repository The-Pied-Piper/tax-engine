# Provisional: taken from T4127 (Jan 2026); to be confirmed against the 2026 form text when CRA publishes it.
# Derivation: figure as printed in T4127 (Jan 2026): Quebec EI: rate 1.30%, maximum insurable earnings 68,900, maximum 895.70; no rounding applied here.
# the figures of this file replace its 2025 figures.
# EI premium on employment income for Quebec residents, 2025 tax year (the 2025 T1 return, form
# 5005-R). Form T2204, "Required premiums: Residents of Quebec: Amount from line 1 x 1.31% =
# (maximum $860.67)", line 11, and line 12 "Enter the amount from line 10 or line 11, whichever
# applies". 5005-R line 89 (line 31200) "through employment (maximum $860.67)". 5005-S10 (Schedule
# 10), Part C: "Line 18: ... (maximum $65,700)", "Line 19: EI rate on self-employment and other
# earnings 1.31%", "Line 20: Line 18 multiplied by the percentage on line 19 (maximum $860.67)". So
# the tier is 1.31% of the earnings from 0 to the $65,700 maximum insurable earnings, with no
# exemption. The shared T2204 has one required-premium step (its line 10), which line 12 copies; the
# Quebec manifest swaps this dataset in for it, so the step holds what the paper form prints on
# line 11, and the same dataset gives a blank line 4. T2204 line 16 is 5005-R line 89. Premiums are in dollars and cents, and 1.31% of
# 65,700 is exactly the printed $860.67, so the tier rounds half-up to the cent.
# The description above is of the 2025 form line; the figures of this file are 2026. The 2026 form is not yet published, so they are not yet confirmed against it.
family: ca-qc/ei_premium
tax_year: 2026
kind: contribution_tier
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2204/t2204-25e.pdf
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5005-r/5005-r-25e.txt
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5005-s10/5005-s10-25e.txt
  - CRA T4127, 122nd Edition (Jan 2026), Table 8.7, row QC (cra-docs cra-forms-2026/ei-01-26e.csv)
rounding: {increment: "0.01", mode: half_up}
rate: "0.013"
lower: "0"
upper: "68900"
maximum: "895.70"
