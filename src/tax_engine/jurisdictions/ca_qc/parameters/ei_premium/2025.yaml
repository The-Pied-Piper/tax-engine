# EI premium on employment income for Quebec residents, 2025 tax year (the 2025 T1 return, form
# 5005-R). 5005-R line 89 (line 31200) "through employment (maximum $860.67)". 5005-S10 (Schedule 10),
# Part C: "Line 18: ... (maximum $65,700)", "Line 19: EI rate on self-employment and other earnings
# 1.31%", "Line 20: Line 18 multiplied by the percentage on line 19 (maximum $860.67)". So the tier
# is 1.31% of the earnings from 0 to the $65,700 maximum insurable earnings, with no exemption; the
# shared T2204 reads it at line 4 (blank) and at line 10 through a dataset swap in the Quebec
# manifest, and its line 16 is 5005-R line 89. Premiums are in dollars and cents, and 1.31% of
# 65,700 is exactly the printed $860.67, so the tier rounds half-up to the cent.
family: ca-qc/ei_premium
tax_year: 2025
kind: contribution_tier
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5005-r/5005-r-25e.txt
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5005-s10/5005-s10-25e.txt
rounding: {increment: "0.01", mode: half_up}
rate: "0.0131"
lower: "0"
upper: "65700"
maximum: "860.67"
