# 5005-R (2025), page 6: "Line 91 and line 31205: Provincial parental insurance plan (PPIP) premiums
# paid (box 55 of all T4 slips) (maximum $484.12)": the printed maximum of line 91, taken whole and
# never recomputed from the `ca-qc/ppip_premium` tier. A premium given above it is refused, not
# capped; half-up to the cent gives the scale of a dollars-and-cents box and changes nothing.
family: ca-qc/ppip_premium_maximum
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5005-r/5005-r-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "484.12"
