# Provisional: taken from T4127 (Jan 2026); to be confirmed against the 2026 form text when Revenu Quebec publishes it.
# Derivation: figure as printed in T4127 (Jan 2026): QPIP: employee rate 0.430%, maximum insurable earnings 103,000, maximum 442.90; no rounding applied here.
# 5005-R (2025), page 6: "Line 91 and line 31205: Provincial parental insurance plan (PPIP) premiums
# paid (box 55 of all T4 slips) (maximum $484.12)": the 2025 form prints the maximum of line 91 as a
# constant; the figure of this file is the 2026 maximum. A premium given above it is refused, not
# capped; half-up to the cent gives the scale of a dollars-and-cents box and changes nothing.
# The 2026 form is not yet published, so the figure is not yet confirmed against it.
family: ca-qc/ppip_premium_maximum
tax_year: 2026
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5005-r/5005-r-25e.txt
  - Revenu Quebec, Maximum Insurable Earnings and the Quebec Parental Insurance Plan Premium Rate (web page, 2026 row)
rounding: {increment: "0.01", mode: half_up}
amount: "442.90"
