# Schedule P (TP-1.D.P-V, 2025-12) Part E, section 2 "Individual without a spouse on December 31,
# 2025", column 1 "Work premium", line 66: the printed figure 12,620. It is a dataset figure, so step 1
# claims it whole through core/credit_amount. The form prints no label for the line, so the step is
# untitled. Line 64 is "Amount from line 29", a copy with no step.
form:
  name: ca-qc/schedule_p
capabilities:
  - name: core/credit_amount
    reference: "66"
    unit: ca/cad
    params:
      amount: ca-qc/work_premium_income_ceiling
    produces:
      output: ca-qc/schedule_p_work_premium_income_ceiling_line_66
