# Schedule K (2025) lines 42 and 44: printed as alternatives, "Add line 41 and, as applicable, line
# 42 or line 44" (Revenu Quebec TP-1.D.K-V (2025-12), Part A), the dependent child amounts. They are
# left out of the take-home with the spouse and dependant lines (owner ruling, 19 Nov 2026), so they
# are one optional input, the amount of whichever line applies. A salary-only caller does not give
# it; the line 46 part (tp1_schedule_k_line_46.yaml) reads the blank as 0.
form:
  name: ca-qc/tp1_schedule_k
inputs:
  - name: ca-qc/schedule_k_dependent_child_amount_line_42_or_44
    reference: "42 or 44"
    unit: ca/cad
    required: false
    default: null
    basis: "Add line 41 and, as applicable, line 42 or line 44."
