# 5005-R (2025) lines 153 and 154, the two lines that line 155 subtracts ("Line 155 and line 43850:
# Line 153 minus line 154 =", page 8): line 43700 (total income tax deducted) and line 43800 (tax
# transfer for residents of Quebec). Each is an optional input, left blank by a salary-only caller (no
# T4 slip, so tax deducted is 0) and read as 0 by line 155. Declared here, with the step that consumes
# them (`t1_tax_and_credits_line_43850.yaml`).
form:
  name: ca-qc/t1_tax_and_credits
inputs:
  - name: ca-qc/t1_line_43700
    reference: "43700"
    unit: ca/cad
    required: false
    default: null
    basis: "Line 153 and line 43700: Total income tax deducted"
  - name: ca-qc/t1_line_43800
    reference: "43800"
    unit: ca/cad
    required: false
    default: null
    basis: "Line 154 and line 43800: Tax transfer for residents of Quebec"
