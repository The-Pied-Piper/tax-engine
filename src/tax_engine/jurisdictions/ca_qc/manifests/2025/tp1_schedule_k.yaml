# Schedule K (2025), Premium Payable Under the Québec Prescription Drug Insurance Plan (Revenu
# Quebec TP-1.D.K-V (2025-12)). This part names the form and its export; the input and line parts
# carry the capabilities. The form is one form, so its lines read each other directly. The exports are
# box 62 (`ca-qc/schedule_k_months_total_box_62`), the months checked in the year; line 48
# (`ca-qc/schedule_k_premium_income_line_48`), the income used to calculate the premium, which
# Part C reads; line 83 (`ca-qc/schedule_k_column_premium_line_83`), the premium from Part C
# capped at the printed maximum, which the lines after it read (line 84 is a pure copy of it, so
# it has no step); and line 98 (`ca-qc/schedule_k_premium_payable_line_98`), the premium payable,
# which TP-1 line 447 carries.
form:
  name: ca-qc/tp1_schedule_k
  title: "Schedule K: Premium Payable Under the Québec Prescription Drug Insurance Plan"
  required: true
  exports:
    - ca-qc/schedule_k_months_total_box_62
    - ca-qc/schedule_k_premium_income_line_48
    - ca-qc/schedule_k_column_premium_line_83
    - ca-qc/schedule_k_premium_payable_line_98
capabilities: []
