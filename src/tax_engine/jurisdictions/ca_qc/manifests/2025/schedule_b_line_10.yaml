# Schedule B (TP-1.D.B-V, 2025-12) Part A line 10: "Amount from line 275 of your return". Line 275
# is the net income of the TP-1 net income form, which exports it; another form reads an export only
# as a record list (`ca-qc/tp1_net_income.tp1_net_income_line_275`), so core/record_total totals it,
# as Schedule P line 10 reads line 101 and AB428 line 62 reads line 58. Line 275 is always computed,
# so there is no blank rule. The form prints no label for the line, so the step is untitled.
form:
  name: ca-qc/schedule_b
capabilities:
  - name: core/record_total
    reference: "10"
    unit: ca/cad
    consumes:
      records: ca-qc/tp1_net_income.tp1_net_income_line_275
    produces:
      output: ca-qc/schedule_b_line_10
