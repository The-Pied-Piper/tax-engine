# Schedule U (Revenu Quebec TP-1.D.U-V, 2025-12), Part B, line 11: "Multiply line 10 by 0.156250."
# Line 10 is the QPP contribution of TP-1 line 98, read by its own step
# (`ca-qc/schedule_u_line_10`). The printed rate 0.156250 is the `ca-qc/schedule_u_line_11_rate`
# dataset figure; the product is rounded half-up to the cent. The form prints no label for the line,
# so the step is untitled.
form:
  name: ca-qc/tp1_schedule_u
capabilities:
  - name: core/apply_rate
    reference: "11"
    unit: ca/cad
    params:
      rate: ca-qc/schedule_u_line_11_rate
    consumes:
      base: ca-qc/schedule_u_line_10
    produces:
      output: ca-qc/schedule_u_line_11
