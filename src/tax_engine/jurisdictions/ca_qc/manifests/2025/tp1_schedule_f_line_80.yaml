# Schedule F (2025) Part B, line 80: "Multiply line 78 by 1%", the row "x 1%" read as the column's
# printed rate. Blank when line 78 or the rate is blank, which is for a line 76 of $18,130 or less.
form:
  name: ca-qc/tp1_schedule_f
capabilities:
  - name: core/multiply_by_rate
    reference: "80"
    unit: ca/cad
    params:
      rounding: ca-qc/cent_rounding
    consumes:
      base: ca-qc/tp1_schedule_f_income_over_lower_bound_line_78
      rate: ca-qc/tp1_schedule_f_column_rate
    blank:
      base: pass_on
      rate: pass_on
    produces:
      output: ca-qc/tp1_schedule_f_contribution_on_excess_line_80
