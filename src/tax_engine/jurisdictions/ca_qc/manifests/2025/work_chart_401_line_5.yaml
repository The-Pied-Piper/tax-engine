# Work Chart 401 (TP-1.D.GR-V 2025-12), line 5: "x 5" prints 14% in column A, 19% in column B, 24% in
# column C and 25.75% in column D. Line 5 is the printed rate of the column that line 1 falls in; line
# 2 is a copy of line 1 and has no step of its own, so line 5 reads line 1 directly.
form:
  name: ca-qc/work_chart_401
capabilities:
  - name: core/bracket_column_rate
    reference: "5"
    unit: ca/cad
    params:
      schedule: ca-qc/work_chart_401_brackets
    consumes:
      base: ca-qc/work_chart_401_taxable_income_line_1
    produces:
      output: ca-qc/work_chart_401_column_rate_line_5
