# Schedule U (Revenu Quebec TP-1.D.U-V, 2025-12), Part B, line 12 reads "line 98.1 of your return",
# the pensionable salary or wages (QPP). TP-1 income is its own form, so line 98.1 arrives as that
# form's export, a record list of one amount; this step is `core/record_total` over it, and the
# line 12 part (`tp1_schedule_u_line_12.yaml`) caps it at the printed maximum. It prints no line of
# its own, so it has no reference and a plain-words title.
form:
  name: ca-qc/tp1_schedule_u
capabilities:
  - name: core/record_total
    title: "Pensionable salary or wages (QPP)"
    unit: ca/cad
    consumes:
      records: ca-qc/tp1_income.tp1_pensionable_salary_line_98_1
    produces:
      output: ca-qc/schedule_u_line_98_1_for_line_12
