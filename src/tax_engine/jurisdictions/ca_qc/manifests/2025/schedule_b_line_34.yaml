# Schedule B (TP-1.D.B-V, 2025-12) Part B line 34: "Subtract line 33 from line 32. Carry the result
# to line 361 of your return. Age amount, amount for a person living alone and amount for retirement
# income". One step, core/subtract; the form prints no floor, so the result is not floored. Line 33
# is an optional input (a spouse line); a blank is read as 0. Rounded half-up to the cent through
# ca-qc/cent_rounding. The title is the printed label. The form exports the line for TP-1 line 361.
form:
  name: ca-qc/schedule_b
capabilities:
  - name: core/subtract
    title: "Age amount, amount for a person living alone and amount for retirement income"
    reference: "34"
    unit: ca/cad
    params:
      rounding: ca-qc/cent_rounding
    consumes:
      amount: ca-qc/schedule_b_line_32
      less: ca-qc/schedule_b_line_33
    blank:
      less: "0"
    produces:
      output: ca-qc/schedule_b_line_34
