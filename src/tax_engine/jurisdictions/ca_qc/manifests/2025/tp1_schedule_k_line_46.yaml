# Schedule K (2025) line 46: "Add line 41 and, as applicable, line 42 or line 44." (Revenu Quebec
# TP-1.D.K-V (2025-12), Part A). One step: core/sum of line 41 and line 44 (line 42 is for a filer
# with a spouse and has no step), rounded half-up to the cent (`ca-qc/cent_rounding`). The form
# prints no label for the line, so the step is untitled.
form:
  name: ca-qc/tp1_schedule_k
capabilities:
  - name: core/sum
    reference: "46"
    unit: ca/cad
    params:
      rounding: ca-qc/cent_rounding
    consumes:
      parts:
        - ca-qc/schedule_k_amount_line_41
        - ca-qc/schedule_k_amount_line_44
    produces:
      output: ca-qc/schedule_k_total_line_46
