# Schedule K (2025) Part C, line 88, the printed $63.83 of the row "Number of months entered in box
# 61 x $63.83". One core/credit_amount: the amount for each month, from
# `ca-qc/schedule_k_monthly_amount_box_61` (a printed rate is a dataset figure, taken as printed).
# It is not a line of the form, so it has no reference and no title; the box 61 row reads it.
form:
  name: ca-qc/tp1_schedule_k
capabilities:
  - name: core/credit_amount
    unit: ca/cad
    params:
      amount: ca-qc/schedule_k_monthly_amount_box_61
    produces:
      output: ca-qc/schedule_k_monthly_amount_box_61
