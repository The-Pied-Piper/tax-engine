# 5005-R (2025) line 56 and line 23500 input a salary-only caller does not give.
# Line 56 and line 23500: "Line 56 and line 23500: If not, enter "0" on line 23500." (page 4). The chart
# applies only with EI and other benefits (line 11900), OAS pension (line 11300) or net federal
# supplements (line 14600), which a salary-only filer lacks, so the form fixes line 23500 at 0. A request
# that leaves the line out is read as 0. The name stays `ca/social_benefits_repayment`: the shared
# forms that read the repayment read that name.
form:
  name: ca-qc/t1_taxable_income
inputs:
  - name: ca/social_benefits_repayment
    title: "Social benefits repayment"
    reference: "23500"
    unit: ca/cad
    required: false
    default: "0"
    basis: 'Line 56 and line 23500: If not, enter "0" on line 23500.'
