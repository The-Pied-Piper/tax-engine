# Work Chart 201 (TP-1.D.GR-V 2025-12), line 1: "Eligible work income (lines 101, 107 and, if
# positive, 105, minus the amount from box 211 of your RL-1 slip)". Two steps for the one printed
# line, as NL428 line 98 has a sum before its capped step. Line 101 is the salary
# (TP-1 line 101, the TP-1 income form's export); lines 107 and 105 and box 211 are optional inputs
# of the TP-1 income
# form, which takes and exports them, so each is read as that form's export (a record list of one,
# totalled by core/record_total, a blank read as 0), ahead of the two steps.
# Line 105 is "if positive": the owner decided on the ticket (19 Nov 2026) that the test is moot,
# so line 105 is an input that refuses a negative and the step has no test for it. The form prints no floor on the subtraction, so the result is signed (core/subtract, as
# T1 line 23400) and is rounded half-up to the cent (`ca-qc/cent_rounding`).
form:
  name: ca-qc/work_chart_201
capabilities:
  - name: core/record_total
    title: "TP-1 line 101"
    unit: ca/cad
    consumes:
      records: ca-qc/tp1_income.tp1_employment_income_line_101
    produces:
      output: ca-qc/work_chart_201_tp1_line_101
  - name: core/record_total
    title: "TP-1 line 107"
    unit: ca/cad
    consumes:
      records: ca-qc/tp1_income.tp1_line_107
    blank:
      records:
        ca-qc/tp1_line_107: "0"
    produces:
      output: ca-qc/work_chart_201_tp1_line_107
  - name: core/record_total
    title: "TP-1 line 105"
    unit: ca/cad
    consumes:
      records: ca-qc/tp1_income.tp1_line_105
    blank:
      records:
        ca-qc/tp1_line_105: "0"
    produces:
      output: ca-qc/work_chart_201_tp1_line_105
  - name: core/record_total
    title: "RL-1 slip, box 211"
    unit: ca/cad
    consumes:
      records: ca-qc/tp1_income.rl1_slip_box_211
    blank:
      records:
        ca-qc/rl1_slip_box_211: "0"
    produces:
      output: ca-qc/work_chart_201_rl1_slip_box_211
  - name: core/sum
    title: "Work income before box 211"
    unit: ca/cad
    params:
      rounding: ca-qc/cent_rounding
    consumes:
      parts:
        [ca-qc/work_chart_201_tp1_line_101, ca-qc/work_chart_201_tp1_line_107, ca-qc/work_chart_201_tp1_line_105]
    produces:
      output: ca-qc/work_chart_201_eligible_work_income_before_box_211
  - name: core/subtract
    title: "Eligible work income"
    reference: "1"
    unit: ca/cad
    params:
      rounding: ca-qc/cent_rounding
    consumes:
      amount: ca-qc/work_chart_201_eligible_work_income_before_box_211
      less: ca-qc/work_chart_201_rl1_slip_box_211
    produces:
      output: ca-qc/work_chart_201_eligible_work_income_line_1
