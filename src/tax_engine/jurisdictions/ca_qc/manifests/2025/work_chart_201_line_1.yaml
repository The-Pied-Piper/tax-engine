# Work Chart 201 (TP-1.D.GR-V 2025-12), line 1: "Eligible work income (lines 101, 107 and, if
# positive, 105, minus the amount from box 211 of your RL-1 slip)". Two steps for the one printed
# line, as NL428 line 98 has a sum before its capped step. Line 101 is the salary
# (`ca/employment_income`); lines 107 and 105 and box 211 are optional inputs, read as 0 when blank.
# Line 105 is "if positive": it is an input that cannot be negative, so the test never changes it.
# The result is not below zero and is rounded half-up to the cent (`ca-qc/cent_rounding`).
form:
  name: ca-qc/work_chart_201
capabilities:
  - name: core/sum
    unit: ca/cad
    params:
      rounding: ca-qc/cent_rounding
    consumes:
      parts: [ca/employment_income, ca-qc/tp1_line_107, ca-qc/tp1_line_105]
    blank:
      ca-qc/tp1_line_107: "0"
      ca-qc/tp1_line_105: "0"
    produces:
      output: ca-qc/work_chart_201_eligible_work_income_before_box_211
  - name: core/subtract_not_below_zero
    title: "Eligible work income"
    reference: "1"
    unit: ca/cad
    params:
      rounding: ca-qc/cent_rounding
    consumes:
      amount: ca-qc/work_chart_201_eligible_work_income_before_box_211
      less: ca-qc/rl1_slip_box_211
    blank:
      less: "0"
    produces:
      output: ca-qc/work_chart_201_eligible_work_income_line_1
