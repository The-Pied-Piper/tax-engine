# 5005-R (2025) line 150 input a salary-only caller does not give.
# Line 150 and line 42800: "Provincial or territorial tax (from Form T2203, if applicable)" (page 7). A salary-only filer has no such amount, so it is an
# optional input left blank; the sum or difference that reads it takes a blank as 0.
form:
  name: ca-qc/t1_tax_and_credits
inputs:
  - name: ca-qc/provincial_tax_line_150
    title: "Provincial or territorial tax"
    reference: "42800"
    unit: ca/cad
    required: false
    default: null
    basis: "Provincial or territorial tax (from Form T2203, if applicable)"
