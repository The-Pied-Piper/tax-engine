# Schedule F (2025) line 25: "Subtract line 24 from line 23." (Revenu Quebec TP-1.D.F-V (2025-12),
# Part A, dividends from taxable Canadian corporations: line 23 the taxable amount, line 24 the actual
# amount). Line 23 copies TP-1 line 128 and line 24 is an input. One core/subtract, rounded half-up to the cent. A blank line is read as 0. No floor is
# printed, so the result is signed. The form prints no label for the line, so the step is untitled.
form:
  name: ca-qc/tp1_schedule_f
capabilities:
  - name: core/subtract
    reference: "25"
    unit: ca/cad
    params:
      rounding: ca-qc/cent_rounding
    consumes:
      amount: ca-qc/tp1_schedule_f_line_23
      less: ca-qc/tp1_schedule_f_line_24
    blank:
      amount: "0"
      less: "0"
    produces:
      output: ca-qc/tp1_schedule_f_line_25
