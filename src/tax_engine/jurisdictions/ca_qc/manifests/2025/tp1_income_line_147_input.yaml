# TP-1 (2025) line 147, "Social assistance payments, RL-5 slip, box A, and similar financial assistance, RL-5 slip, box B": an optional input a salary-only caller does not give. It is a
# line of the TP-1 income form, so this form takes it once; the line 199 part
# (tp1_income_line_199.yaml) adds it to the salary and reads a blank as 0.
form:
  name: ca-qc/tp1_income
inputs:
  - name: ca-qc/tp1_line_147
    title: "Social assistance payments, RL-5 slip, box A, and similar financial assistance, RL-5 slip, box B"
    reference: "147"
    unit: ca/cad
    required: false
    default: null
    basis: 'Social assistance payments, RL-5 slip, box A, and similar financial assistance, RL-5 slip, box B'
