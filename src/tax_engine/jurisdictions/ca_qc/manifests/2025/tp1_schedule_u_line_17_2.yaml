# Schedule U (Revenu Quebec TP-1.D.U-V, 2025-12), Part B, line 17.2: "Multiply line 17.1 by 6.4%."
# Line 17.1 is "Amount from line 14.4", a copy of `ca-qc/schedule_u_line_14_4` with no step of its
# own. The printed 6.4% is the `ca-qc/schedule_u_line_17_2_rate` dataset figure; the product is
# rounded half-up to the cent. The form prints no label for the line, so the step is untitled.
form:
  name: ca-qc/tp1_schedule_u
capabilities:
  - name: core/apply_rate
    reference: "17.2"
    unit: ca/cad
    params:
      rate: ca-qc/schedule_u_line_17_2_rate
    consumes:
      base: ca-qc/schedule_u_line_14_4
    produces:
      output: ca-qc/schedule_u_line_17_2
