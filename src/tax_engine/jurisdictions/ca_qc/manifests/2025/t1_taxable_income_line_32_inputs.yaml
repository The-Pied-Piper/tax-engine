# 5005-R (2025) lines 29 to 31, the lines that line 32 adds ("Line 32 and line 14700: Add lines 29 to
# 31 (see line 25000 in Step 4).", page 3): workers' compensation benefits (line 14400), social
# assistance payments (line 14500) and net federal supplements paid (line 14600). Each is an optional
# input, left blank by a salary-only caller and read as 0 by line 32 (`t1_taxable_income_line_32.yaml`).
form:
  name: ca-qc/t1_taxable_income
inputs:
  - name: ca-qc/t1_line_14400
    title: "Workers' compensation benefits"
    reference: "14400"
    unit: ca/cad
    required: false
    default: null
    basis: "Line 29 and line 14400: Workers' compensation benefits (box 10 of the T5007 slip)"
  - name: ca-qc/t1_line_14500
    title: "Social assistance payments"
    reference: "14500"
    unit: ca/cad
    required: false
    default: null
    basis: "Line 30 and line 14500: Social assistance payments"
  - name: ca-qc/t1_line_14600
    title: "Net federal supplements paid"
    reference: "14600"
    unit: ca/cad
    required: false
    default: null
    basis: "Line 31 and line 14600: Net federal supplements paid (box 21 of the T4A(OAS) slip)"
