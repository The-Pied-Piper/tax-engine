# Schedule F (2025) line 58: "Business investment loss (line 234)", a copy of TP-1 line 234.
# Line 234 is an input of the TP-1 net income form only, which takes it once and exports it; this line
# reads that export as a record list of one, so the one step is `core/record_total` (as line 22
# reads line 114). A blank line 234 is read as 0.
form:
  name: ca-qc/tp1_schedule_f
capabilities:
  - name: core/record_total
    title: "Business investment loss"
    reference: "58"
    unit: ca/cad
    consumes:
      records: ca-qc/tp1_net_income.tp1_line_234
    blank:
      records:
        ca-qc/tp1_line_234: "0"
    produces:
      output: ca-qc/tp1_schedule_f_line_58
