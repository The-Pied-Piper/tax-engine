# TP-1 (2025) line 298: "Add lines 287 through 297. Total deductions". Lines 287 to 297 are blank
# for a salary-only filer, so the printed sum that collects them is one optional input read as 0
# (the owner's "Optional lines" decision of 19 Nov 2026); the skipped lines have no step. As the T1
# line 25700 part does, the default is "0", so line 299 reads the figure directly.
form:
  name: ca-qc/tp1_net_income
inputs:
  - name: ca-qc/tp1_total_deductions_line_298
    reference: "298"
    unit: ca/cad
    required: false
    default: "0"
    basis: 'Add lines 287 through 297. Total deductions'
