# 5005-R (2025) line 135 input a salary-only caller does not give.
# Line 135: "Recapture of investment tax credit (complete Form T2038(IND))" (page 7). A salary-only filer has no such amount, so it is an
# optional input left blank; the sum or difference that reads it takes a blank as 0.
form:
  name: ca-qc/t1_tax_and_credits
inputs:
  - name: ca-qc/investment_tax_credit_recapture_line_135
    title: "Recapture of investment tax credit"
    reference: "135"
    unit: ca/cad
    required: false
    default: null
    basis: "Recapture of investment tax credit (complete Form T2038(IND))"
