# Revenu Quebec TP-1.D-V (2025-12), page 2, line 199: "Add lines 101 and 105 through 164. Total
# income". Line 101 is the salary (`ca/employment_income`), which has no step of its own. Lines 105
# to 164 are one optional input, read as 0 when the caller has none, so a salary-only filer's total
# income is the salary. The sum is rounded half-up to the cent (`ca-qc/cent_rounding`).
form:
  name: ca-qc/tp1_income
capabilities:
  - name: core/sum
    title: "Total income"
    reference: "199"
    unit: ca/cad
    params:
      rounding: ca-qc/cent_rounding
    consumes:
      parts: [ca/employment_income, ca-qc/tp1_other_income_lines_105_to_164]
    blank:
      ca-qc/tp1_other_income_lines_105_to_164: "0"
    produces:
      output: ca-qc/tp1_total_income_line_199
