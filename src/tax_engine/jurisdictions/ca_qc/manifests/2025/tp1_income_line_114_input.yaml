# TP-1 (2025) line 114, "Old Age Security pension, T4A(OAS) slip": an optional input a salary-only caller does not give. It is a
# line of the TP-1 income form, so this form takes it once and exports it; the line 199 part
# (tp1_income_line_199.yaml) adds it to the salary and reads a blank as 0, and Schedule F line 22
# reads the export.
form:
  name: ca-qc/tp1_income
inputs:
  - name: ca-qc/tp1_line_114
    title: "Old Age Security pension, T4A(OAS) slip"
    reference: "114"
    unit: ca/cad
    required: false
    default: null
    basis: 'Old Age Security pension, T4A(OAS) slip'
