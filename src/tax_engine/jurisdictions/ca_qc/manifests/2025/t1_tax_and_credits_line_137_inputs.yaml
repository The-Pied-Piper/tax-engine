# 5005-R (2025) line 137 input a salary-only caller does not give.
# Line 137: "Federal logging tax credit" (page 7). A salary-only filer has no such amount, so it is an
# optional input left blank; the sum or difference that reads it takes a blank as 0.
form:
  name: ca-qc/t1_tax_and_credits
inputs:
  - name: ca-qc/federal_logging_tax_credit_line_137
    title: "Federal logging tax credit"
    reference: "137"
    unit: ca/cad
    required: false
    default: null
    basis: "Federal logging tax credit"
