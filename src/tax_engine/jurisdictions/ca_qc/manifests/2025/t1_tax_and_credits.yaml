# 5005-R (2025), the T1 return for Quebec residents, from Step 5 (non-refundable credits) onward. This
# part names the form and its exports; each line's capability goes in a part of its own with the
# same `form.name`. The form carries the printed title of the return, as `ca-qc/t1_taxable_income`
# does. Exports:
#   - The credit amounts of line 85 (`ca-qc/credit_amounts_line_85`, lines 78 to 84) and of line 100
#     (`ca-qc/credits_line_100`, lines 87 to 99), which the sums on line 102 add. Line 78 (the basic
#     personal amount) is read inside the form and need not be exported. Later tickets of Step 5 to
#     Step 9 add the exports the return summary reads.
form:
  name: ca-qc/t1_tax_and_credits
  title: "T1 Income Tax and Benefit Return"
  required: true
  exports:
    - ca-qc/credit_amounts_line_85
    - ca-qc/credits_line_100
capabilities: []
