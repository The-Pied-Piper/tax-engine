# 5005-R (2025), the T1 return for Quebec residents, from Step 5 (non-refundable credits) onward. This
# part names the form and its exports; each line's capability goes in a part of its own with the
# same `form.name`. The form carries the printed title of the return, as `ca-qc/t1_taxable_income`
# does. Exports:
#   - Basic personal amount (`ca-qc/basic_personal_amount`, line 78 and line 30000) is the first
#     figure of the credit sums; it is exported while the form has no other export, because a form
#     that is `required` must export something. Later tickets of Step 5 to Step 9 add the exports
#     the return summary reads, and the credit sums that read line 78 inside the form need not
#     export it.
form:
  name: ca-qc/t1_tax_and_credits
  title: "T1 Income Tax and Benefit Return"
  required: true
  exports:
    - ca-qc/basic_personal_amount
capabilities: []
