# 5005-R (2025), the T1 return for Quebec residents, from Step 5 (non-refundable credits) onward. This
# part names the form and its exports; each line's capability goes in a part of its own with the
# same `form.name`. The form carries the printed title of the return, as `ca-qc/t1_taxable_income`
# does. Exports:
#   - The credit amounts of line 85 (`ca-qc/credit_amounts_line_85`, lines 78 to 84) and of line 100
#     (`ca-qc/credits_line_100`, lines 87 to 99), which the sums on line 102 add. Line 78 (the basic
#     personal amount) is read inside the form and need not be exported.
#   - The total federal non-refundable tax credits of line 122 (`ca-qc/non_refundable_tax_credits_line_122`),
#     which Part C line 126 copies.
#   - Part C: the basic federal tax of line 130 and line 42900 (`ca-qc/basic_federal_tax_line_130`),
#     which the Quebec abatement on line 156 reads, and the federal tax of line 138 and line 40600
#     (`ca-qc/federal_tax_line_138`), which line 143 reads. Lines 123 and 126 are copies and have no
#     step.
#   - Step 6: the total payable of line 151 and line 43500 (`ca-qc/total_payable_line_151`), the
#     federal figure the return summary reads. Line 147 is a copy and has no step.
#   - Step 6, page 2: the refundable Quebec abatement of line 156 (`ca-qc/refundable_quebec_abatement_line_156`),
#     the net EI overpayment of line 159 (`ca-qc/net_ei_overpayment_line_159`), the refundable medical
#     expense supplement of line 160 (`ca-qc/refundable_medical_expense_supplement_line_160`), the
#     Canada workers benefit of line 161 (`ca-qc/cwb_line_161`) and the refund or balance owing of
#     line 172 (`ca-qc/refund_or_balance_owing_line_172`), which the return summary reads. Lines 159
#     to 161 are the benefits of the line 171 sum that a caller can list. Lines 152 and
#     158 are copies and have no step. Later tickets of Step 5 to Step 9 add the exports the return
#     summary reads.
#   - The federal bracket rate of line 74 (`ca-qc/federal_bracket_column_rate_line_74`), which the
#     shared take-home marginal rate form reads as the T1 line 73 rate through the neutral name below.
form:
  name: ca-qc/t1_tax_and_credits
  title: "T1 Income Tax and Benefit Return"
  required: true
  exports:
    - ca-qc/credit_amounts_line_85
    - ca-qc/credits_line_100
    - ca-qc/non_refundable_tax_credits_line_122
    - ca-qc/basic_federal_tax_line_130
    - ca-qc/federal_tax_line_138
    - ca-qc/total_payable_line_151
    - ca-qc/refundable_quebec_abatement_line_156
    - ca-qc/net_ei_overpayment_line_159
    - ca-qc/refundable_medical_expense_supplement_line_160
    - ca-qc/cwb_line_161
    - ca-qc/refund_or_balance_owing_line_172
    - ca-qc/federal_bracket_column_rate_line_74
  supplies:
    ca/t1_tax_and_credits.federal_bracket_column_rate_line_73: ca-qc/federal_bracket_column_rate_line_74
    ca/t1_tax_and_credits.federal_tax_after_credits: ca-qc/basic_federal_tax_line_130
capabilities: []
