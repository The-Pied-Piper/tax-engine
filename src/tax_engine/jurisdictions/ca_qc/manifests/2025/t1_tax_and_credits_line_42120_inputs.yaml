# 5005-R (2025) line 148 input a salary-only caller does not give.
# Line 148 and line 42120: "Employment insurance premiums payable on self-employment and other eligible earnings (complete Schedule 13)" (page 7). A salary-only filer has no such amount, so it is an
# optional input left blank; the sum or difference that reads it takes a blank as 0.
form:
  name: ca-qc/t1_tax_and_credits
inputs:
  - name: ca-qc/ei_premiums_self_employed_line_148
    title: "Employment insurance premiums payable on self-employment and other eligible earnings"
    reference: "42120"
    unit: ca/cad
    required: false
    default: null
    basis: "Employment insurance premiums payable on self-employment and other eligible earnings (complete Schedule 13)"
