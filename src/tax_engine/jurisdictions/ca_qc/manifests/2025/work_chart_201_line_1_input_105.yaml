# Work Chart 201 (TP-1.D.GR-V 2025-12), line 1: TP-1 line 105, read "if positive". An optional input a salary-only caller does
# not give: a request that leaves it out is read as blank, and the line 1 part
# (work_chart_201_line_1.yaml) reads the blank as 0.
form:
  name: ca-qc/work_chart_201
inputs:
  - name: ca-qc/tp1_line_105
    reference: "105"
    unit: ca/cad
    required: false
    default: null
    basis: 'Eligible work income: lines 101, 107 and, if positive, 105.'
