# 5005-R (2025) line 103 input a salary-only caller does not give.
# Line 103 and line 31600: "Disability amount for self (if you were under 18 years of age, use Federal Worksheet; if not, claim $10,138)" (page 6). A salary-only filer has no such amount, so it is an
# optional input left blank; the sum or difference that reads it takes a blank as 0.
form:
  name: ca-qc/t1_tax_and_credits
inputs:
  - name: ca-qc/disability_amount_self_line_103
    title: "Disability amount for self"
    reference: "31600"
    unit: ca/cad
    required: false
    default: null
    basis: "Disability amount for self (if you were under 18 years of age, use Federal Worksheet; if not, claim $10,138)"
