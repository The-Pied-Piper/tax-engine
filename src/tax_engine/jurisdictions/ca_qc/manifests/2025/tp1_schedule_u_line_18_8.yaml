# Schedule U (Revenu Quebec TP-1.D.U-V, 2025-12), Part B, line 18.8 "Additional maximum pensionable earnings. See the
# instructions for Part B." The instructions for line 18.8 say "enter $81,200" when none of the
# situations of Table 1 applied to the filer, as for a take-home filer. The printed $81,200 is the
# `ca-qc/schedule_u_line_18_8_additional_maximum_pensionable_earnings` dataset figure, claimed whole.
form:
  name: ca-qc/tp1_schedule_u
capabilities:
  - name: core/credit_amount
    title: "Additional maximum pensionable earnings"
    reference: "18.8"
    unit: ca/cad
    params:
      amount: ca-qc/schedule_u_line_18_8_additional_maximum_pensionable_earnings
    produces:
      output: ca-qc/schedule_u_additional_maximum_pensionable_earnings_line_18_8
