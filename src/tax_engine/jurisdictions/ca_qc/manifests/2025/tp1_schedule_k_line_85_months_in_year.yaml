# Schedule K (2025) Part C, line 85's printed 12: "Amount from line 84 x Number of months entered in
# box 62 / 12". One core/credit_amount: the months of the year, from the
# `ca-qc/schedule_k_months_in_year_line_85` dataset (a printed constant is a dataset figure, taken as
# printed). It is not a line of the form, so it has no reference and a plain-words title; line 85 reads it.
form:
  name: ca-qc/tp1_schedule_k
capabilities:
  - name: core/credit_amount
    title: "Months in the year"
    unit: core/months
    params:
      amount: ca-qc/schedule_k_months_in_year_line_85
    produces:
      output: ca-qc/schedule_k_months_in_year_line_85
