# TP-1 (2025) line 128, "Dividends from taxable Canadian corporations, taxable amount of dividends": an optional input a salary-only caller does not give. It is a
# line of the TP-1 income form, so this form takes it once; the line 199 part
# (tp1_income_line_199.yaml) adds it to the salary and reads a blank as 0.
form:
  name: ca-qc/tp1_income
inputs:
  - name: ca-qc/tp1_line_128
    reference: "128"
    unit: ca/cad
    required: false
    default: null
    basis: 'Dividends from taxable Canadian corporations, taxable amount of dividends'
