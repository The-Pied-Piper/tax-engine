# Schedule F (2025) lines 41, 42, 43, 43.1, 44, 45, 60 and 62: the lines that line 68 adds ("Add
# lines 41 through 62."; Revenu Quebec TP-1.D.F-V (2025-12), Part A) besides lines 46, 54, 56 and
# 58, which copy TP-1 lines 245, 225, 231 and 234 (`tp1_schedule_f_line_<N>.yaml`). Each of the
# eight comes from a line of the TP-1 return, a schedule or a slip that the take-home does not
# build, so each stays an input, as the form takes it, optional and left blank by a salary-only
# caller. Line 41 keeps its own input and does not copy TP-1 line 246: the printed Schedule F line
# excludes certain repayments (Old Age Security, scholarships and bursaries, social assistance,
# income replacement indemnities, WEPP payments) that line 246 includes, so it can be smaller. They
# are declared here, with the step that consumes them (line 68, `tp1_schedule_f_line_68.yaml`),
# which reads a blank as 0.
form:
  name: ca-qc/tp1_schedule_f
inputs:
  - name: ca-qc/tp1_schedule_f_line_41
    title: "Amounts you repaid in 2025 because you received an overpayment (line 246)"
    reference: "41"
    unit: ca/cad
    required: false
    default: null
    basis: "Amounts you repaid in 2025 because you received an overpayment (line 246)"
  - name: ca-qc/tp1_schedule_f_line_42
    title: "Deduction for a repayment of wage loss replacement benefits (line 207, point 12)"
    reference: "42"
    unit: ca/cad
    required: false
    default: null
    basis: "Deduction for a repayment of wage loss replacement benefits (line 207, point 12)"
  - name: ca-qc/tp1_schedule_f_line_43
    title: "Amount from line 26 of Schedule R"
    reference: "43"
    unit: ca/cad
    required: false
    default: null
    basis: "Amount from line 26 of Schedule R"
  - name: ca-qc/tp1_schedule_f_line_43_1
    title: "Total of lines 101, 103 and 115 of Schedule U or, if you completed form LE-35-V, total of lines 112, 113 and 116 of that form"
    reference: "43.1"
    unit: ca/cad
    required: false
    default: null
    basis: "Total of lines 101, 103 and 115 of Schedule U or, if you completed form LE-35-V, total of lines 112, 113 and 116 of that form"
  - name: ca-qc/tp1_schedule_f_line_44
    title: "Employment Insurance benefits to be repaid in your federal income tax return (line 250, point 3)"
    reference: "44"
    unit: ca/cad
    required: false
    default: null
    basis: "Employment Insurance benefits to be repaid in your federal income tax return (line 250, point 3)"
  - name: ca-qc/tp1_schedule_f_line_45
    title: "Deductions claimed on line 250 (points 4, 5, 6, 11, 13, 14 and 15)"
    reference: "45"
    unit: ca/cad
    required: false
    default: null
    basis: "Deductions claimed on line 250 (points 4, 5, 6, 11, 13, 14 and 15)"
  - name: ca-qc/tp1_schedule_f_line_60
    title: "Deduction claimed on line 293, unless it was for the amount on line 16, 20, 25 or 28 above"
    reference: "60"
    unit: ca/cad
    required: false
    default: null
    basis: "Deduction claimed on line 293, unless it was for the amount on line 16, 20, 25 or 28 above"
  - name: ca-qc/tp1_schedule_f_line_62
    title: "Deductions claimed on line 297, except those claimed for the amount on line 12 or 26 above"
    reference: "62"
    unit: ca/cad
    required: false
    default: null
    basis: "Deductions claimed on line 297, except those claimed for the amount on line 12 or 26 above"
