# Schedule P (TP-1.D.P-V, 2025-12) Part E, section 2, column 1 "Work premium", line 83: "Multiply line
# 82 by 10%." The printed 10% is held in the rate dataset `ca-qc/work_premium_reduction_rate`, so it
# has no step. Line 82 is `ca-qc/schedule_p_family_income_over_threshold_line_82`
# (schedule_p_line_82.yaml). The product is rounded half-up to the cent by the rate dataset. The form
# prints no label for the line, so the step is untitled.
form:
  name: ca-qc/schedule_p
capabilities:
  - name: core/apply_rate
    reference: "83"
    unit: ca/cad
    params:
      rate: ca-qc/work_premium_reduction_rate
    consumes:
      base: ca-qc/schedule_p_family_income_over_threshold_line_82
    produces:
      output: ca-qc/schedule_p_work_premium_reduction_line_83
