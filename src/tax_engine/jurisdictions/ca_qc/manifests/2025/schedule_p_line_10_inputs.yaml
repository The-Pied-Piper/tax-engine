# Schedule P (TP-1.D.P-V, 2025-12) line 10: "Amount from line 101 of your return, plus the amount
# from line 105 if it is positive, minus the amount from box 211 of your RL-1 slip, if applicable".
# TP-1 line 105 and RL-1 box 211 are inputs a salary-only caller does not give: each is read as
# blank, and the line 10 part (schedule_p_line_10.yaml) reads a blank as 0. Line 101 is the salary
# and comes from the TP-1 income form, so it is not an input here.
form:
  name: ca-qc/schedule_p
inputs:
  - name: ca-qc/tp1_line_105
    reference: "105"
    unit: ca/cad
    required: false
    default: null
    basis: 'plus the amount from line 105 if it is positive'
  - name: ca-qc/rl1_box_211
    reference: "211"
    unit: ca/cad
    required: false
    default: null
    basis: 'minus the amount from box 211 of your RL-1 slip, if applicable'
