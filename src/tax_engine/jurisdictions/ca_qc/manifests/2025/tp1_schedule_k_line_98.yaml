# Schedule K (2025) Part C, line 98: "Add lines 90 and 97. Carry the result to line 447 of your
# return. Premium payable under the Québec prescription drug insurance plan." One step: core/sum,
# rounded half-up to the cent (`ca-qc/cent_rounding`). Line 97 is an optional input, read as 0 when
# the caller leaves it out. The step is titled as the form prints it. The form exports the line for
# TP-1 line 447 (the TP-1 totals ticket).
form:
  name: ca-qc/tp1_schedule_k
capabilities:
  - name: core/sum
    title: "Premium payable under the Québec prescription drug insurance plan"
    reference: "98"
    unit: ca/cad
    params:
      rounding: ca-qc/cent_rounding
    consumes:
      parts:
        - ca-qc/schedule_k_premium_line_90
        - ca-qc/schedule_k_spouse_premium_line_97
    blank:
      ca-qc/schedule_k_spouse_premium_line_97: "0"
    produces:
      output: ca-qc/schedule_k_premium_payable_line_98
