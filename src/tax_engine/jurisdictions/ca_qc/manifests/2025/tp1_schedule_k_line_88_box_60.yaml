# Schedule K (2025) Part C, line 88, the row "Number of months entered in box 60 x $62.00". One
# step: core/multiply, the months of box 60 times the printed $62.00
# (`tp1_schedule_k_line_88_box_60_amount.yaml`), rounded half-up to the cent (`ca-qc/cent_rounding`).
# Box 60 is a plain figure of months (owner decision, 19 Nov 2026: the boxes stay amounts and
# core/multiply replaces core/per_unit_amount). The row has no line number and the form prints no
# label for it, so the step has no reference and a plain-words title; line 88 adds the two rows.
form:
  name: ca-qc/tp1_schedule_k
capabilities:
  - name: core/multiply
    title: "Premium for the months from January to June"
    unit: ca/cad
    params:
      rounding: ca-qc/cent_rounding
    consumes:
      multiplicand: ca-qc/schedule_k_months_january_to_june_box_60
      multiplier: ca-qc/schedule_k_monthly_amount_box_60
    produces:
      output: ca-qc/schedule_k_amount_for_months_box_60
