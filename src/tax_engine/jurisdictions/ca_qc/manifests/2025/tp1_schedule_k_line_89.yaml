# Schedule K (2025) Part C, line 89: "Subtract line 88 from line 87." One step: core/subtract,
# rounded half-up to the cent (`ca-qc/cent_rounding`). The form prints no label for the line, so the
# step is untitled.
form:
  name: ca-qc/tp1_schedule_k
capabilities:
  - name: core/subtract
    reference: "89"
    unit: ca/cad
    params:
      rounding: ca-qc/cent_rounding
    consumes:
      amount: ca-qc/schedule_k_maximum_premium_line_87
      less: ca-qc/schedule_k_months_premium_line_88
    produces:
      output: ca-qc/schedule_k_premium_remaining_line_89
