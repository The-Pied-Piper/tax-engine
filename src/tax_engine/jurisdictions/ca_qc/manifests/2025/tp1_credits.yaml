# Revenu Quebec TP-1.D-V (2025-12), page 4, "Non-refundable tax credits": lines 350 to 399. This part
# names the form; each printed line's capability is a part of its own with the same `form.name`.
# Lines 350, 358, 359 and 361 are the second part of the form, `ca-qc/tp1_credits_lines_350_to_361`, which line 377 reads. Line 391 reads TP-752.PC-V. Lines 388, 397.1 and the lines 390, 392, 395, 396, 398 and 398.1 are optional inputs, read as 0 when left out; lines 367 and 376 are not built. Export: line 399, the non-refundable tax credits that TP-1 line 406 reads.
form:
  name: ca-qc/tp1_credits
  title: "Income Tax Return"
  required: true
  exports:
    - ca-qc/tp1_non_refundable_tax_credits_line_399
capabilities: []
