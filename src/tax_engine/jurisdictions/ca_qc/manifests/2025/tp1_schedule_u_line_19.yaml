# Schedule U (Revenu Quebec TP-1.D.U-V, 2025-12), Part B, line 19: "Subtract line 18.9 from line 18.8. If the result is
# negative, enter 0." Line 18.9 is "Amount from line 14.1", a copy of `ca-qc/schedule_u_maximum_
# pensionable_earnings_line_14_1` with no step of its own. The step is `core/subtract_not_below_zero`,
# rounded to the cent by `ca-qc/cent_rounding`. The form prints no label for the line, so the step is
# untitled.
form:
  name: ca-qc/tp1_schedule_u
capabilities:
  - name: core/subtract_not_below_zero
    reference: "19"
    unit: ca/cad
    params:
      rounding: ca-qc/cent_rounding
    consumes:
      amount: ca-qc/schedule_u_additional_maximum_pensionable_earnings_line_18_8
      less: ca-qc/schedule_u_maximum_pensionable_earnings_line_14_1
    produces:
      output: ca-qc/schedule_u_line_19
