# TP-1 (2025) line 130, "Interest and other investment income": an optional input a salary-only caller does not give. It is a
# line of the TP-1 income form, so this form takes it once; the line 199 part
# (tp1_income_line_199.yaml) adds it to the salary and reads a blank as 0.
form:
  name: ca-qc/tp1_income
inputs:
  - name: ca-qc/tp1_line_130
    reference: "130"
    unit: ca/cad
    required: false
    default: null
    basis: 'Interest and other investment income'
