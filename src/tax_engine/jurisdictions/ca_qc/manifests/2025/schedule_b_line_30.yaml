# Schedule B (TP-1.D.B-V, 2025-12) Part B line 30: "Add lines 20 through 28." The take-home builds
# line 20 only (lines 21, 22, 23, 27 and 28 are the age, retirement-income and spouse-related
# amounts, left out of scope), so one part is summed; a single part is still a sum, so the step is
# built, as AB428 line 25 does. Rounded half-up to the cent through ca-qc/cent_rounding. The form
# prints no label for the line, so the step is untitled.
form:
  name: ca-qc/schedule_b
capabilities:
  - name: core/sum
    reference: "30"
    unit: ca/cad
    params:
      rounding: ca-qc/cent_rounding
    consumes:
      parts: [ca-qc/schedule_b_line_20]
    produces:
      output: ca-qc/schedule_b_line_30
