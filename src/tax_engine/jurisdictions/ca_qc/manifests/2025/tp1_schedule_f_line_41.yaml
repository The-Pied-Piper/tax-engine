# Schedule F (2025) line 41: "Amounts you repaid in 2025 because you received an overpayment (line 246)", a copy of TP-1 line 246.
# Line 246 is an input of the TP-1 net income form only, which takes it once and exports it; this line
# reads that export as a record list of one, so the one step is `core/record_total` (as line 22
# reads line 114). A blank line 246 is read as 0.
form:
  name: ca-qc/tp1_schedule_f
capabilities:
  - name: core/record_total
    title: "Amounts you repaid in 2025 because you received an overpayment"
    reference: "41"
    unit: ca/cad
    consumes:
      records: ca-qc/tp1_net_income.tp1_line_246
    blank:
      records:
        ca-qc/tp1_line_246: "0"
    produces:
      output: ca-qc/tp1_schedule_f_line_41
