# 5005-R (2025), the T1 return for Quebec residents, Steps 2 to 4. This part names the form and its
# exports; each line's capability goes in a part of its own with the same `form.name`. Exports:
#   - Net income (`ca-qc/net_income`, line 57 and line 23600) starts Step 4.
#   - Taxable income (`ca-qc/taxable_income`, line 70 and line 26000) ends Step 4.
#   - The social benefits repayment (`ca/social_benefits_repayment`, line 56 and line 23500, an input),
#     which Step 6 line 149 copies.
#   - Line 23600 before its floor (`ca-qc/net_income_signed`, line 55 less line 56, not floored) is
#     read by the shared Schedule 6 line 7, which reads it from the neutral name below, as the form's
#     "if negative, show in brackets" wording asks.
#   - Lines 10100 and 10400 are not here: they are the `ca-qc/t1_employment_income` form's, which line 21 and
#     the shared forms that read them import.
#   - Lines 11700, 12500, 21300 and 23200 (UCCB income, RDSP income, UCCB repayment, RDSP income repayment)
#     are the same lines as the federal T1's, with the same inputs. The shared Schedule 6 line 11 reads them
#     through the neutral names below. They are not added into line 33 here.
# Lines 33 (line 15000), 48 (line 22215), 54 (line 23300) and 55 (line 23400) are read inside the
# form and are not exported.
form:
  name: ca-qc/t1_taxable_income
  title: "T1 Income Tax and Benefit Return"
  required: true
  exports:
    - ca-qc/net_income
    - ca-qc/net_income_signed
    - ca-qc/taxable_income
    - ca/social_benefits_repayment
    - ca/uccb_income_line_11700
    - ca/rdsp_income_line_12500
    - ca/uccb_repayment_line_21300
    - ca/rdsp_income_repayment_line_23200
  supplies:
    ca/t1_taxable_income.net_income_signed: ca-qc/net_income_signed
    ca/t1_taxable_income.uccb_income_line_11700: ca/uccb_income_line_11700
    ca/t1_taxable_income.rdsp_income_line_12500: ca/rdsp_income_line_12500
    ca/t1_taxable_income.uccb_repayment_line_21300: ca/uccb_repayment_line_21300
    ca/t1_taxable_income.rdsp_income_repayment_line_23200: ca/rdsp_income_repayment_line_23200
capabilities: []
