# Schedule P (TP-1.D.P-V, 2025-12) Part E, section 2 "Individual without a spouse on December 31,
# 2025", column 1 "Work premium", line 70: the printed figure 2,400 (printed with a minus sign). It is
# a dataset figure, so step 1 claims it whole through core/credit_amount; line 72 subtracts it. The
# form prints no label for the line, so the step is untitled.
form:
  name: ca-qc/schedule_p
capabilities:
  - name: core/credit_amount
    reference: "70"
    unit: ca/cad
    params:
      amount: ca-qc/work_premium_exempt_amount
    produces:
      output: ca-qc/schedule_p_work_premium_exempt_amount_line_70
