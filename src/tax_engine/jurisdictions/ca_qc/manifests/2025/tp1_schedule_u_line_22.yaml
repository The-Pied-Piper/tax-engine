# Schedule U (Revenu Quebec TP-1.D.U-V, 2025-12), Part B, line 22: "Amount from line 17.5 or line 21, whichever is less."
# One `core/lesser_of` step over line 17.5 (`ca-qc/schedule_u_line_17_5`) and line 21
# (`ca-qc/schedule_u_line_21`). The form prints no label for the line, so the step is untitled.
form:
  name: ca-qc/tp1_schedule_u
capabilities:
  - name: core/lesser_of
    reference: "22"
    unit: ca/cad
    consumes:
      amounts:
        - ca-qc/schedule_u_line_17_5
        - ca-qc/schedule_u_line_21
    produces:
      output: ca-qc/schedule_u_line_22
