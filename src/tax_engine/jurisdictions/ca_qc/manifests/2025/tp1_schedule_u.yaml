# Revenu Quebec TP-1.D.U-V (2025-12), Schedule U, Part B "Deduction for QPP contributions on
# employment income": lines 10 to 23. This part names the form and its exports; each printed
# line's capability is a part of its own with the same `form.name`. The form is one form, so its
# lines read each other directly. Lines 10, 12, 17, 17.4 and 18.5 are copies of TP-1 lines 98, 98.1,
# 98, 98.2 and 98.1, and lines 14.2, 17.1, 18.6, 18.9 and 22.1 are copies of lines 13, 14.4, 14.1,
# 14.1 and 16, so they have no step. The title is the heading the schedule prints, "Québec Pension Plan
# (QPP) Contribution and Deduction". Exports: the figures later Schedule U lines and the TP-1 read.
form:
  name: ca-qc/tp1_schedule_u
  title: "Schedule U: Québec Pension Plan (QPP) Contribution and Deduction"
  required: true
  exports:
    - ca-qc/schedule_u_line_11
    - ca-qc/schedule_u_line_14
    - ca-qc/schedule_u_line_14_4
    - ca-qc/schedule_u_line_16
    - ca-qc/schedule_u_line_17_5
    - ca-qc/schedule_u_line_23
capabilities: []
