# Revenu Quebec TP-1.D.U-V (2025-12), Schedule U, Part B "Deduction for QPP contributions on
# employment income": lines 10 to 16. This part names the form and its exports; each printed line's
# capability is a part of its own with the same `form.name`. The form is one form, so its lines read
# each other directly. Lines 10 and 12 are copies of TP-1 lines 98 and 98.1 and line 14.2 is a copy
# of line 13, so they have no step. The form prints no title for the schedule here, so the form has
# none. Exports: the figures later Schedule U lines read.
form:
  name: ca-qc/tp1_schedule_u
  required: true
  exports:
    - ca-qc/schedule_u_line_11
    - ca-qc/schedule_u_line_14
    - ca-qc/schedule_u_line_14_4
capabilities: []
