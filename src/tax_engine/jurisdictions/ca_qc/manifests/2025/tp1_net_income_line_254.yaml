# TP-1 (2025) line 254: "Add lines 201 through 207, 214 through 231, and 234 through 252. Total
# deductions". One core/sum in form line order, rounded half-up to the cent (`ca-qc/cent_rounding`).
# Lines 201 and 248 are steps; the other lines are optional inputs, read as 0 when blank
# (`tp1_net_income_line_254_inputs.yaml`). The sum is signed (the printed lines set no floor).
form:
  name: ca-qc/tp1_net_income
capabilities:
  - name: core/sum
    title: "Total deductions"
    reference: "254"
    unit: ca/cad
    params:
      rounding: ca-qc/cent_rounding
    consumes:
      parts:
        - ca-qc/tp1_deduction_for_workers_line_201
        - ca-qc/tp1_line_205
        - ca-qc/tp1_line_207
        - ca-qc/tp1_line_214
        - ca-qc/tp1_line_215
        - ca-qc/tp1_line_225
        - ca-qc/tp1_line_228
        - ca-qc/tp1_line_231
        - ca-qc/tp1_line_234
        - ca-qc/tp1_line_236
        - ca-qc/tp1_line_241
        - ca-qc/tp1_line_245
        - ca-qc/tp1_line_246
        - ca-qc/tp1_qpp_deduction_line_248
        - ca-qc/tp1_line_250
        - ca-qc/tp1_line_252
    blank:
      ca-qc/tp1_line_205: "0"
      ca-qc/tp1_line_207: "0"
      ca-qc/tp1_line_214: "0"
      ca-qc/tp1_line_215: "0"
      ca-qc/tp1_line_225: "0"
      ca-qc/tp1_line_228: "0"
      ca-qc/tp1_line_231: "0"
      ca-qc/tp1_line_234: "0"
      ca-qc/tp1_line_236: "0"
      ca-qc/tp1_line_241: "0"
      ca-qc/tp1_line_245: "0"
      ca-qc/tp1_line_246: "0"
      ca-qc/tp1_line_250: "0"
      ca-qc/tp1_line_252: "0"
    produces:
      output: ca-qc/tp1_total_deductions_line_254
