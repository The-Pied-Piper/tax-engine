# 5005-R (2025) line 54 and line 23300. The form prints: "Line 54 and line 23300: Add lines 35 to 53. ="
# (page 4). A salary-only filer has one deduction, line 48 (line 22215); lines 35 to 47 and 49 to 53
# are blank and not built. One step: core/sum over line 48 alone, as the federal line 84 and line 98
# steps are built even with one part.
form:
  name: ca-qc/t1_taxable_income
capabilities:
  - name: core/sum
    reference: "23300"
    unit: ca/cad
    params:
      rounding: ca-qc/cent_rounding
    consumes:
      parts: [ca-qc/t1_line_48]
    produces:
      output: ca-qc/t1_line_54
