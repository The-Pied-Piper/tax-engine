# 5005-R (2025) line 120 input a salary-only caller does not give.
# Line 120 and line 34900: "Donations and gifts (complete Schedule 9)" (page 6). A salary-only filer has no such amount, so it is an
# optional input left blank; the sum or difference that reads it takes a blank as 0.
form:
  name: ca-qc/t1_tax_and_credits
inputs:
  - name: ca-qc/donations_and_gifts_line_120
    title: "Donations and gifts"
    reference: "34900"
    unit: ca/cad
    required: false
    default: null
    basis: "Donations and gifts (complete Schedule 9)"
