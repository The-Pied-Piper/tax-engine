# 5005-R (2025) line 115 input a salary-only caller does not give.
# Line 115 and line 33199: "Allowable amount of medical expenses for other dependants (use Federal Worksheet)" (page 6). A salary-only filer has no such amount, so it is an
# optional input left blank; the sum or difference that reads it takes a blank as 0.
form:
  name: ca-qc/t1_tax_and_credits
inputs:
  - name: ca-qc/medical_expenses_other_dependants_line_115
    title: "Allowable amount of medical expenses for other dependants"
    reference: "33199"
    unit: ca/cad
    required: false
    default: null
    basis: "Allowable amount of medical expenses for other dependants (use Federal Worksheet)"
