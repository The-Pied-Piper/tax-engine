# 5005-R (2025) line 144 input a salary-only caller does not give.
# Line 144 and line 41500: "Advanced Canada workers benefit (ACWB) (complete Schedule 6)" (page 7). A salary-only filer has no such amount, so it is an
# optional input left blank; the sum or difference that reads it takes a blank as 0.
form:
  name: ca-qc/t1_tax_and_credits
inputs:
  - name: ca-qc/advanced_canada_workers_benefit_line_144
    title: "Advanced Canada workers benefit (ACWB)"
    reference: "41500"
    unit: ca/cad
    required: false
    default: null
    basis: "Advanced Canada workers benefit (ACWB) (complete Schedule 6)"
