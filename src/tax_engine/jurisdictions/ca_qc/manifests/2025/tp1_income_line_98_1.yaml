# Revenu Quebec TP-1.D-V (2025-12), page 2, line 98.1, 'Pensionable salary or wages (QPP). RL-1
# slip, box G'.
# The line is an input of the form, copied from the RL-1 slip. A take-home caller gives only the
# salary, so `ca-qc/tp1_pensionable_salary_given_line_98_1` is optional.
# A request that gives it has that figure as line 98.1, unchanged. A request that leaves it out
# has line 98.1 computed as the Schedule 8 line 2 earnings (the salary up to the additional maximum
# pensionable earnings, prorated by the months of line A, $81,200 for a full year), half-up to the
# cent, from the `ca-qc/tp1_line_98_1_pensionable_salary` dataset, as T2204 line 4 does. A filer
# with no QPP months has line 2 of 0, so line 98.1 is 0. Schedule 8 is its own form, so line 2
# arrives as that form's export, a record list of one amount; the first step is `core/record_total`
# over it, as Schedule U line 10 reads line 98.
form:
  name: ca-qc/tp1_income
capabilities:
  - name: core/record_total
    title: "Pensionable earnings"
    unit: ca/cad
    consumes:
      records: ca/schedule_8.cpp_part_3_line_2
    produces:
      output: ca-qc/tp1_pensionable_earnings_for_line_98_1
  - name: ca/given_or_contribution_tier
    title: "Pensionable salary or wages (QPP)"
    reference: "98.1"
    unit: ca/cad
    params:
      tier: ca-qc/tp1_line_98_1_pensionable_salary
    consumes:
      given: ca-qc/tp1_pensionable_salary_given_line_98_1
      earnings: ca-qc/tp1_pensionable_earnings_for_line_98_1
    blank:
      given: compute
    produces:
      output: ca-qc/tp1_pensionable_salary_line_98_1
