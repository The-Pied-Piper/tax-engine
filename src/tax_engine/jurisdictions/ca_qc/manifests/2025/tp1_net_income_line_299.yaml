# TP-1 (2025) line 299: "Subtract line 298 from line 279. If the result is negative, enter 0.
# Taxable income". One step: core/subtract_not_below_zero, so a deduction above line 279 gives 0, as
# the form says, rounded half-up to the cent (`ca-qc/cent_rounding`). Line 298 is a step
# (`tp1_net_income_line_298.yaml`). The figure is exported for Work Chart 401.
form:
  name: ca-qc/tp1_net_income
capabilities:
  - name: core/subtract_not_below_zero
    title: "Taxable income"
    reference: "299"
    unit: ca/cad
    params:
      rounding: ca-qc/cent_rounding
    consumes:
      amount: ca-qc/tp1_line_279
      less: ca-qc/tp1_total_deductions_line_298
    produces:
      output: ca-qc/tp1_taxable_income_line_299
