# Schedule K (2025) Part C, line 83: "Add lines 81 and 82 (maximum $766)." One step: core/sum of the
# two lines, rounded half-up to the cent (`ca-qc/cent_rounding`). The printed maximum is applied by
# line 84, which caps this figure at $766 (owner ruling, 19 Nov 2026: the maximum is one cap, not a
# ranged dataset). The form prints no label for the line, so the step is untitled.
form:
  name: ca-qc/tp1_schedule_k
capabilities:
  - name: core/sum
    reference: "83"
    unit: ca/cad
    params:
      rounding: ca-qc/cent_rounding
    consumes:
      parts:
        - ca-qc/schedule_k_premium_on_excess_line_81
        - ca-qc/schedule_k_column_constant_line_82
    produces:
      output: ca-qc/schedule_k_column_premium_line_83
