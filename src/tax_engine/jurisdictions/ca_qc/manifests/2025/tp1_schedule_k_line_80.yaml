# Schedule K (2025) Part C, line 80: the row "x 80 | 7.84% | 11.76%", the printed rate of the column
# that line 48 falls in (line 77 is a copy of line 48 and has no step of its own). The form prints
# no label for the line, so the step is untitled.
form:
  name: ca-qc/tp1_schedule_k
capabilities:
  - name: core/bracket_column_rate
    reference: "80"
    params:
      schedule: ca-qc/schedule_k_brackets
    consumes:
      base: ca-qc/schedule_k_premium_income_line_48
    produces:
      output: ca-qc/schedule_k_column_rate_line_80
