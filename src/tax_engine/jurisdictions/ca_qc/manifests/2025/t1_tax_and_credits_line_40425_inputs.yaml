# 5005-R (2025) line 127 input a salary-only caller does not give.
# Line 127 and line 40425: "Federal dividend tax credit (use Federal Worksheet)" (page 7). A salary-only filer has no such amount, so it is an
# optional input left blank; the sum or difference that reads it takes a blank as 0.
form:
  name: ca-qc/t1_tax_and_credits
inputs:
  - name: ca-qc/federal_dividend_tax_credit_line_127
    title: "Federal dividend tax credit"
    reference: "40425"
    unit: ca/cad
    required: false
    default: null
    basis: "Federal dividend tax credit (use Federal Worksheet)"
