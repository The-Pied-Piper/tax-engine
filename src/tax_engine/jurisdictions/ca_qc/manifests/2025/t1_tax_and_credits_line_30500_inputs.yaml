# 5005-R (2025) line 84 input a salary-only caller does not give.
# Line 84 and line 30500: "Canada caregiver amount for infirm children under 18 years of age (see Schedule 5)" (page 5). A salary-only filer has no such amount, so it is an
# optional input left blank; the sum that adds it reads a blank as 0.
form:
  name: ca-qc/t1_tax_and_credits
inputs:
  - name: ca-qc/caregiver_amount_infirm_children_line_84
    title: "Canada caregiver amount for infirm children under 18 years of age"
    reference: "30500"
    unit: ca/cad
    required: false
    default: null
    basis: "Canada caregiver amount for infirm children under 18 years of age (see Schedule 5)"
