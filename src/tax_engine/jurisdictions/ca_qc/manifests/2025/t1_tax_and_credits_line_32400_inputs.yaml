# 5005-R (2025) line 108 input a salary-only caller does not give.
# Line 108 and line 32400: "Tuition amount transferred from a child or grandchild" (page 6). A salary-only filer has no such amount, so it is an
# optional input left blank; the sum or difference that reads it takes a blank as 0.
form:
  name: ca-qc/t1_tax_and_credits
inputs:
  - name: ca-qc/tuition_amount_transferred_line_108
    title: "Tuition amount transferred from a child or grandchild"
    reference: "32400"
    unit: ca/cad
    required: false
    default: null
    basis: "Tuition amount transferred from a child or grandchild"
