# Schedule F (2025) line 28: "Social assistance payments and similar financial assistance (line 147)", a copy of TP-1 line 147.
# Line 147 is an input of the TP-1 income form only, which takes it once and exports it; this line
# reads that export as a record list of one, so the one step is `core/record_total` (as line 14
# reads line 105). A blank line 147 is read as 0.
form:
  name: ca-qc/tp1_schedule_f
capabilities:
  - name: core/record_total
    title: "Social assistance payments and similar financial assistance"
    reference: "28"
    unit: ca/cad
    consumes:
      records: ca-qc/tp1_income.tp1_line_147
    blank:
      records:
        ca-qc/tp1_line_147: "0"
    produces:
      output: ca-qc/tp1_schedule_f_line_28
