# TP-1 (2025) lines 451.2, 451.3, 452 to 455, 458 to 460, 462 and 463: the lines that line 465 adds
# besides line 456 ("Add lines 451.2 through 463. Income tax paid and other credits = 465", page 5):
# Quebec income tax withheld at source after line 451.1, withholding transferred by the spouse, the
# QPP or CPP overpayment, income tax paid in instalments, the transferable portion of the tax
# withheld for another province, the childcare credit, the home-support
# services credit for seniors, the QST rebate for employees and partners, the tax shield, other
# credits and the senior assistance credit. The take-home gives none of them (tax withheld, line
# 451, is left out by ruling), so each is an optional input left blank, read as 0 by line 465.
# Line 451.2 has no title: the form prints only the instruction "Subtract line 451.1 from line 451." there
# (the named line is 451). Line 457, the QPIP overpayment, is a step (`tp1_totals_line_457.yaml`). Line 461 is the code that line 462 specifies, not an amount, and has no input.
form:
  name: ca-qc/tp1_totals
inputs:
  - name: ca-qc/tp1_line_451_2
    reference: "451.2"
    unit: ca/cad
    required: false
    default: null
    basis: "Subtract line 451.1 from line 451."
  - name: ca-qc/tp1_line_451_3
    title: "Québec income tax withholding transferred by your spouse"
    reference: "451.3"
    unit: ca/cad
    required: false
    default: null
    basis: "Québec income tax withholding transferred by your spouse"
  - name: ca-qc/tp1_line_452
    title: "QPP or CPP overpayment"
    reference: "452"
    unit: ca/cad
    required: false
    default: null
    basis: "QPP or CPP overpayment"
  - name: ca-qc/tp1_line_453
    title: "Income tax paid in instalments"
    reference: "453"
    unit: ca/cad
    required: false
    default: null
    basis: "Income tax paid in instalments"
  - name: ca-qc/tp1_line_454
    title: "Transferable portion of the income tax withheld for another province"
    reference: "454"
    unit: ca/cad
    required: false
    default: null
    basis: "Transferable portion of the income tax withheld for another province"
  - name: ca-qc/tp1_line_455
    title: "Tax credit for childcare expenses"
    reference: "455"
    unit: ca/cad
    required: false
    default: null
    basis: "Tax credit for childcare expenses. Complete Schedule C."
  - name: ca-qc/tp1_line_458
    title: "Tax credit for home-support services for seniors"
    reference: "458"
    unit: ca/cad
    required: false
    default: null
    basis: "Tax credit for home-support services for seniors. Complete Schedule J."
  - name: ca-qc/tp1_line_459
    title: "QST rebate for employees and partners"
    reference: "459"
    unit: ca/cad
    required: false
    default: null
    basis: "QST rebate for employees and partners"
  - name: ca-qc/tp1_line_460
    title: "Tax shield"
    reference: "460"
    unit: ca/cad
    required: false
    default: null
    basis: "Tax shield"
  - name: ca-qc/tp1_line_462
    title: "Other credits"
    reference: "462"
    unit: ca/cad
    required: false
    default: null
    basis: "Other credits. Specify:"
  - name: ca-qc/tp1_line_463
    title: "Senior assistance tax credit"
    reference: "463"
    unit: ca/cad
    required: false
    default: null
    basis: "Senior assistance tax credit"
