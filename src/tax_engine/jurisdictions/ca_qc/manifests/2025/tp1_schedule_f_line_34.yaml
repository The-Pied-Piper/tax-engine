# Schedule F (2025) line 34: "Add lines 20, 22 and 25 through 33." (Revenu Quebec TP-1.D.F-V
# (2025-12), Part A). One core/sum over the printed lines 20, 22, 25, 26, 28, 29, 30, 31 and 33,
# rounded half-up to the cent. Each blank line is read as 0. No floor is printed, so the sum is
# signed, as line 25 is. Line 36 reads it. The form prints no label for the line, so the step is
# untitled.
form:
  name: ca-qc/tp1_schedule_f
capabilities:
  - name: core/sum
    reference: "34"
    unit: ca/cad
    params:
      rounding: ca-qc/cent_rounding
    consumes:
      parts:
        - ca-qc/tp1_schedule_f_line_20
        - ca-qc/tp1_schedule_f_line_22
        - ca-qc/tp1_schedule_f_line_25
        - ca-qc/tp1_schedule_f_line_26
        - ca-qc/tp1_schedule_f_line_28
        - ca-qc/tp1_schedule_f_line_29
        - ca-qc/tp1_schedule_f_line_30
        - ca-qc/tp1_schedule_f_line_31
        - ca-qc/tp1_schedule_f_line_33
    blank:
      ca-qc/tp1_schedule_f_line_20: "0"
      ca-qc/tp1_schedule_f_line_22: "0"
      ca-qc/tp1_schedule_f_line_26: "0"
      ca-qc/tp1_schedule_f_line_28: "0"
      ca-qc/tp1_schedule_f_line_29: "0"
      ca-qc/tp1_schedule_f_line_30: "0"
      ca-qc/tp1_schedule_f_line_31: "0"
      ca-qc/tp1_schedule_f_line_33: "0"
    produces:
      output: ca-qc/tp1_schedule_f_lines_20_to_33_total_line_34
