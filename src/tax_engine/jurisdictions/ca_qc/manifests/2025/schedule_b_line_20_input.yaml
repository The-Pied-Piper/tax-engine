# Schedule B (2025) line 20's input, which a salary-only caller may leave out.
# Part B, line 20: "If, throughout 2025, you maintained and ordinarily lived in a dwelling in which
# you lived alone or only with one or more individuals under the age of 18, or with one or more of
# your children, grandchildren or great-grandchildren 18 or older who were full-time students
# pursuing vocational training at the secondary level or post-secondary studies, enter $2,128"
# (Revenu Quebec TP-1.D.B-V (2025-12)). The answer is a count, 1 for yes and 0 for no. A caller who
# gives no answer gets the default 0, not alone (owner ruling, 19 Nov 2026).
form:
  name: ca-qc/schedule_b
inputs:
  - name: ca-qc/schedule_b_lived_alone_line_20
    title: "You maintained and ordinarily lived in a dwelling in which you lived alone or only with one or more individuals under the age of 18, or with one or more of your children, grandchildren or great-grandchildren 18 or older who were full-time students pursuing vocational training at the secondary level or post-secondary studies"
    reference: "20"
    required: false
    default: "0"
    basis: "Throughout 2025, you maintained and ordinarily lived in a dwelling in which you lived alone or only with one or more individuals under the age of 18, or with one or more of your children, grandchildren or great-grandchildren 18 or older who were full-time students pursuing vocational training at the secondary level or post-secondary studies"
