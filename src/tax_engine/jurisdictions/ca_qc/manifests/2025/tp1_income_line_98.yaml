# Revenu Quebec TP-1.D-V (2025-12), page 2, line 98, 'QPP contribution. RL-1 slip, box B.A'.
# The line is an input of the form, copied from the RL-1 slip. A take-home caller gives only the
# salary, so `ca-qc/tp1_qpp_contribution_given_line_98` is optional.
# A request that gives it has that figure as line 98, unchanged. A request that leaves it out
# has line 98 computed as Schedule 8 line 11 (5.4%, 2026: 5.3%, of line 7, at most $3,661.20) plus
# line 12 (1% of line 7, at most $678.00), each half-up to the cent as the form's own lines are, so
# the figure agrees with the Schedule 8 lines the take-home deductions read. A filer with no QPP
# months (under 18 all year, or 73 or older all year) has a line 7 of 0, so line 98 is 0. Schedule 8
# is its own form, so lines 11 and 12 arrive as that form's exports, record lists of one amount; the
# first two steps are `core/record_total` over them, as Schedule U line 10 reads line 98.
form:
  name: ca-qc/tp1_income
capabilities:
  - name: core/record_total
    title: "Required base contributions on QPP pensionable earnings"
    unit: ca/cad
    consumes:
      records: ca/schedule_8.cpp_part_3_line_11
    produces:
      output: ca-qc/tp1_base_qpp_for_line_98
  - name: core/record_total
    title: "Required first additional contributions on QPP pensionable earnings"
    unit: ca/cad
    consumes:
      records: ca/schedule_8.cpp_part_3_line_12
    produces:
      output: ca-qc/tp1_first_additional_qpp_for_line_98
  - name: core/sum
    title: "Base and first additional contributions added up"
    unit: ca/cad
    params:
      rounding: ca-qc/cent_rounding
    consumes:
      parts:
        - ca-qc/tp1_base_qpp_for_line_98
        - ca-qc/tp1_first_additional_qpp_for_line_98
    produces:
      output: ca-qc/tp1_qpp_computed_line_98
  - name: ca-qc/given_or_fallback
    title: "QPP contribution"
    reference: "98"
    unit: ca/cad
    consumes:
      given: ca-qc/tp1_qpp_contribution_given_line_98
      fallback: ca-qc/tp1_qpp_computed_line_98
    blank:
      given: compute
    produces:
      output: ca-qc/tp1_qpp_contribution_line_98
