# 5005-R (2025) line 111 input a salary-only caller does not give.
# Line 111 and line 33099: "Medical expenses for self, spouse or common-law partner and your dependent children under 18 years of age" (page 6). A salary-only filer has no such amount, so it is an
# optional input left blank; the sum or difference that reads it takes a blank as 0.
form:
  name: ca-qc/t1_tax_and_credits
inputs:
  - name: ca-qc/medical_expenses_line_111
    title: "Medical expenses for self, spouse or common-law partner and your dependent children under 18 years of age"
    reference: "33099"
    unit: ca/cad
    required: false
    default: null
    basis: "Medical expenses for self, spouse or common-law partner and your dependent children under 18 years of age"
