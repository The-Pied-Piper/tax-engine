# Schedule U (Revenu Quebec TP-1.D.U-V, 2025-12), Part B, line 18.5: "Pensionable salary or wages
# (QPP) (line 98.1 of your return)", a copy of TP-1 line 98.1. TP-1 income is its own form, so line
# 98.1 arrives as that form's export, a record list of one amount; the one step is
# `core/record_total` over it, as line 10 does. The step carries the printed label as its title.
form:
  name: ca-qc/tp1_schedule_u
capabilities:
  - name: core/record_total
    title: "Pensionable salary or wages (QPP)"
    reference: "18.5"
    unit: ca/cad
    consumes:
      records: ca-qc/tp1_income.tp1_pensionable_salary_line_98_1
    produces:
      output: ca-qc/schedule_u_line_18_5
