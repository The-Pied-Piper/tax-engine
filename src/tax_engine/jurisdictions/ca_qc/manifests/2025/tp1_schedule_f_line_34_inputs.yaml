# Schedule F (2025) lines 20, 22, 23, 24, 26, 28, 29, 30, 31 and 33: the lines that line 34 adds
# ("Add lines 20, 22 and 25 through 33."; Revenu Quebec TP-1.D.F-V (2025-12), Part A). Each comes
# from a line of the TP-1 return (or its guide) that the take-home does not build, so each stays an
# input, as the form takes it, optional and left blank by a salary-only caller. Lines 23 and 24 are
# the two figures that line 25 subtracts. They are declared here, with the steps that consume them
# (line 25, `tp1_schedule_f_line_25.yaml`, and line 34, `tp1_schedule_f_line_34.yaml`), which read a
# blank as 0.
form:
  name: ca-qc/tp1_schedule_f
inputs:
  - name: ca-qc/tp1_schedule_f_line_20
    title: "Amounts allocated under a profit-sharing plan (line 107, point 3)"
    reference: "20"
    unit: ca/cad
    required: false
    default: null
    basis: "Amounts allocated under a profit-sharing plan (line 107, point 3)"
  - name: ca-qc/tp1_schedule_f_line_22
