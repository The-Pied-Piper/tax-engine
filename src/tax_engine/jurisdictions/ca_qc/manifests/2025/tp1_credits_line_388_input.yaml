# TP-1 (2025) line 388: "Add lines 378 through 385. = 388" (page 4, Non-refundable tax credits).
# Lines 378 to 385 are blank for a salary-only filer, so the printed sum that collects them is one
# optional input read as 0 (the owner's "Optional lines" decision of 19 Nov 2026); the skipped lines
# have no step. A blank is read as 0 by line 389.
form:
  name: ca-qc/tp1_credits
inputs:
  - name: ca-qc/tp1_line_388
    reference: "388"
    unit: ca/cad
    required: false
    default: null
    basis: "Add lines 378 through 385."
