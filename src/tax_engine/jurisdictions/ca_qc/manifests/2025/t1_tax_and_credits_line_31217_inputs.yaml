# 5005-R (2025) line 90 input a salary-only caller does not give.
# Line 90 and line 31217: "on self-employment and other eligible earnings (complete Schedule 13)" (page 6). A salary-only filer has no such amount, so it is an
# optional input left blank; the sum that adds it reads a blank as 0.
form:
  name: ca-qc/t1_tax_and_credits
inputs:
  - name: ca-qc/ei_premiums_self_employment_line_90
    title: "Employment insurance premiums on self-employment and other eligible earnings"
    reference: "31217"
    unit: ca/cad
    required: false
    default: null
    basis: "on self-employment and other eligible earnings (complete Schedule 13)"
