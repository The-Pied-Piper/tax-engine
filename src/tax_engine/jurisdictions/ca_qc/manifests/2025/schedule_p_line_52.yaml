# Schedule P (TP-1.D.P-V, 2025-12) Part C "Family income" line 52: "Amount from line 275 of your
# return". Line 275 is the net income on the TP-1 net income form, which exports it; another form
# reads an export only as a record list (`ca-qc/tp1_net_income.tp1_net_income_line_275`), so
# core/record_total totals it, as line 10 reads the TP-1 income form. The form prints no label for
# the line, so the step is untitled. Line 54 adds the spouse's line 53, left out, so line 54 is this line and readers take it directly.
form:
  name: ca-qc/schedule_p
capabilities:
  - name: core/record_total
    reference: "52"
    unit: ca/cad
    consumes:
      records: ca-qc/tp1_net_income.tp1_net_income_line_275
    produces:
      output: ca-qc/schedule_p_net_income_line_52
