# Schedule K (2025) Part C, line 79: "Subtract line 78 from line 77." Line 77 is a copy of line 48
# and has no step of its own. Rounded half-up to the cent (`ca-qc/cent_rounding`). The form prints no
# label for the line, so the step is untitled.
form:
  name: ca-qc/tp1_schedule_k
capabilities:
  - name: core/subtract_not_below_zero
    reference: "79"
    unit: ca/cad
    params:
      rounding: ca-qc/cent_rounding
    consumes:
      amount: ca-qc/schedule_k_premium_income_line_48
      less: ca-qc/schedule_k_column_lower_bound_line_78
    produces:
      output: ca-qc/schedule_k_income_over_lower_bound_line_79
