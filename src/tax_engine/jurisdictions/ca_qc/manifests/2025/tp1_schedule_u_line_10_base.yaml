# Schedule U (Revenu Quebec TP-1.D.U-V, 2025-12), Part B, line 10 reads "line 98 of your return", the
# QPP contribution. TP-1 income is its own form, so line 98 arrives as that form's export, a record
# list of one amount; this step is `core/record_total` over it, and the line 10 part
# (`tp1_schedule_u_line_10.yaml`) caps it at the printed maximum. It prints no line of its own, so it
# has no reference and no title.
form:
  name: ca-qc/tp1_schedule_u
capabilities:
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-qc/tp1_income.tp1_qpp_contribution_line_98
    produces:
      output: ca-qc/schedule_u_line_98_for_line_10
