# Revenu Quebec TP-1.D-V (2025-12), page 2, line 98.2, 'Additional contribution to the QPP. RL-1,
# box B.B'.
# The line is an input of the form, copied from the RL-1 slip. A take-home caller gives only the
# salary, so `ca-qc/tp1_additional_qpp_contribution_given_line_98_2` is optional.
# A request that gives it has that figure as line 98.2, unchanged. A request that leaves it out
# has line 98.2 computed as 4% of Schedule 8 line 4 (the salary above the maximum pensionable
# earnings, up to the additional maximum, both prorated by the months of line A), at most $396.00,
# half-up to the cent, from the `ca-qc/tp1_line_98_2_additional_qpp_contribution` dataset, as T2204
# line 4 does. A filer with no QPP months has line 4 of 0, so line 98.2 is 0. Schedule 8 is its own
# form, so line 4 arrives as that form's export, a record list of one amount; the first step is
# `core/record_total` over it, as Schedule U line 10 reads line 98.
form:
  name: ca-qc/tp1_income
capabilities:
  - name: core/record_total
    title: "QPP earnings"
    unit: ca/cad
    consumes:
      records: ca/schedule_8.cpp_part_3_line_4
    produces:
      output: ca-qc/tp1_qpp_earnings_for_line_98_2
  - name: ca/given_or_contribution_tier
    title: "Additional contribution to the QPP"
    reference: "98.2"
    unit: ca/cad
    params:
      tier: ca-qc/tp1_line_98_2_additional_qpp_contribution
    consumes:
      given: ca-qc/tp1_additional_qpp_contribution_given_line_98_2
      earnings: ca-qc/tp1_qpp_earnings_for_line_98_2
    blank:
      given: compute
    produces:
      output: ca-qc/tp1_additional_qpp_contribution_line_98_2
