# Revenu Quebec TP-1.D-V (2025-12), page 2, line 98.2, 'Additional contribution to the QPP. RL-1,
# box B.B'.
# The line is an input of the form, copied from the RL-1 slip. A take-home caller gives only the
# salary, so `ca-qc/tp1_additional_qpp_contribution_given_line_98_2` is optional.
# A request that gives it has that figure as line 98.2, unchanged. A request that leaves it out
# has line 98.2 computed from line 101, the salary: 4% from $71,300 to $81,200, at most $396.00,
# half-up to the
# cent, from the `ca-qc/tp1_line_98_2_additional_qpp_contribution` dataset, as T2204 line 4 does.
form:
  name: ca-qc/tp1_income
capabilities:
  - name: ca/given_or_contribution_tier
    title: "Additional contribution to the QPP"
    reference: "98.2"
    unit: ca/cad
    params:
      tier: ca-qc/tp1_line_98_2_additional_qpp_contribution
    consumes:
      given: ca-qc/tp1_additional_qpp_contribution_given_line_98_2
      earnings: ca-qc/tp1_employment_income_line_101
    blank:
      given: compute
    produces:
      output: ca-qc/tp1_additional_qpp_contribution_line_98_2
