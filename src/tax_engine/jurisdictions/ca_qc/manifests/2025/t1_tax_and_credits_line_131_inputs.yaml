# 5005-R (2025) line 131 input a salary-only caller does not give.
# Line 131: "Federal surtax on income earned outside Canada (complete Form T2203)" (page 7). A salary-only filer has no such amount, so it is an
# optional input left blank; the sum or difference that reads it takes a blank as 0.
form:
  name: ca-qc/t1_tax_and_credits
inputs:
  - name: ca-qc/federal_surtax_outside_canada_line_131
    title: "Federal surtax on income earned outside Canada"
    reference: "131"
    unit: ca/cad
    required: false
    default: null
    basis: "Federal surtax on income earned outside Canada (complete Form T2203)"
