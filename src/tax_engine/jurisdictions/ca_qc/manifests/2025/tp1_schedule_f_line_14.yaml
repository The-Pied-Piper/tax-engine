# Schedule F (2025) line 14: "Correction of employment income (line 105)", a copy of TP-1 line 105.
# Line 105 is an input of the TP-1 income form only, which takes it once and exports it; this line
# reads that export as a record list of one, so the one step is `core/record_total` (as line 12 reads
# line 101). A blank line 105 is read as 0.
form:
  name: ca-qc/tp1_schedule_f
capabilities:
  - name: core/record_total
    title: "Correction of employment income"
    reference: "14"
    unit: ca/cad
    consumes:
      records: ca-qc/tp1_income.tp1_line_105
    blank:
      records:
        ca-qc/tp1_line_105: "0"
    produces:
      output: ca-qc/tp1_schedule_f_employment_income_correction_line_14
