# Schedule K (2025) Part C, line 88: "Number of months entered in box 60 x $62.00; Number of months
# entered in box 61 x $63.83. Add the results." One step: core/sum of the two rows, rounded half-up to
# the cent (`ca-qc/cent_rounding`). The form prints no label for the line, so the step is untitled.
form:
  name: ca-qc/tp1_schedule_k
capabilities:
  - name: core/sum
    reference: "88"
    unit: ca/cad
    params:
      rounding: ca-qc/cent_rounding
    consumes:
      parts:
        - ca-qc/schedule_k_amount_for_months_box_60
        - ca-qc/schedule_k_amount_for_months_box_61
    produces:
      output: ca-qc/schedule_k_months_premium_line_88
