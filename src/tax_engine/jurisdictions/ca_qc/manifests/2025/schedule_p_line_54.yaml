# Schedule P (TP-1.D.P-V, 2025-12) Part C line 54: "Add lines 52 and 53. Family income". Line 52 is
# the net income of the TP-1 return (schedule_p_line_52.yaml) and line 53 is the spouse's, an optional
# input of the TP-1 net income form, read by its own part (`schedule_p_line_53.yaml`), a blank as 0.
# One core/sum, rounded half-up to the cent (`ca-qc/cent_rounding`). "Family income" is
# the name the form prints for the line.
form:
  name: ca-qc/schedule_p
capabilities:
  - name: core/sum
    title: "Family income"
    reference: "54"
    unit: ca/cad
    params:
      rounding: ca-qc/cent_rounding
    consumes:
      parts:
        - ca-qc/schedule_p_net_income_line_52
        - ca-qc/schedule_p_spouse_net_income_line_53
    produces:
      output: ca-qc/schedule_p_family_income_line_54
