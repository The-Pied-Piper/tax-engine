# 5005-R (2025) line 93 input a salary-only caller does not give.
# Line 93 and line 31215: "31210 on self-employment income (maximum $484.12)" (page 6). A salary-only filer has no such amount, so it is an
# optional input left blank; the sum that adds it reads a blank as 0.
form:
  name: ca-qc/t1_tax_and_credits
inputs:
  - name: ca-qc/ppip_premiums_payable_self_employment_line_93
    title: "PPIP premiums payable on self-employment income"
    reference: "31215"
    unit: ca/cad
    required: false
    default: null
    basis: "31210 on self-employment income (maximum $484.12)"
