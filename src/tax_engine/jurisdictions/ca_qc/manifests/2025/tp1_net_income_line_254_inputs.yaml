  - name: ca-qc/tp1_line_236
    title: "Deduction for residents of designated remote areas"
    reference: "236"
    unit: ca/cad
    required: false
    default: null
    basis: "Deduction for residents of designated remote areas. Complete form TP-350.1-V."
  - name: ca-qc/tp1_line_241
    title: "Deduction for exploration and development expenses"
    reference: "241"
