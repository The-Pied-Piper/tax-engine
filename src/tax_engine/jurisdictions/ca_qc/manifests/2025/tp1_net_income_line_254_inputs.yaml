# TP-1 (2025) page 3, "Net income": the lines that line 254 adds besides lines 201 and 248 ("Add
# lines 201 through 207, 214 through 231, and 234 through 252. Total deductions = 254"): lines 205,
# 207, 214, 215, 225, 228, 231, 234, 236, 241, 245, 246, 250 and 252. Each is an optional input, left
# blank by a salary-only caller and read as 0 by line 254 (`tp1_net_income_line_254.yaml`). The boxes
# printed beside them that no sum adds are not taken: 206, 224 and 249 ("Specify"), 212 (part of line
# 214), 233 (the total losses, of which line 234 is the allowable part) and 248.1 ("Specify"). No sign
# is refused: the form prints none for these lines.
form:
  name: ca-qc/tp1_net_income
inputs:
  - name: ca-qc/tp1_line_205
    title: "Registered pension plan (RPP) deduction, RL-1 slip, box D"
    reference: "205"
    unit: ca/cad
    required: false
    default: null
    basis: "Registered pension plan (RPP) deduction, RL-1 slip, box D"
  - name: ca-qc/tp1_line_207
    title: "Employment expenses and deductions"
    reference: "207"
    unit: ca/cad
    required: false
    default: null
    basis: "Employment expenses and deductions"
  - name: ca-qc/tp1_line_214
    title: "RRSP or PRPP/VRSP deduction, HBP or LLP"
    reference: "214"
    unit: ca/cad
    required: false
    default: null
    basis: "RRSP or PRPP/VRSP deduction, HBP or LLP"
  - name: ca-qc/tp1_line_215
    title: "FHSA deduction"
    reference: "215"
    unit: ca/cad
    required: false
    default: null
    basis: "FHSA deduction"
  - name: ca-qc/tp1_line_225
    title: "Support payments made (deductible amount)"
    reference: "225"
    unit: ca/cad
    required: false
    default: null
    basis: "Support payments made (deductible amount)"
  - name: ca-qc/tp1_line_228
    title: "Moving expenses"
    reference: "228"
