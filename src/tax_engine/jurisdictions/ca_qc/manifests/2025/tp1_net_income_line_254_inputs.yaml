    basis: "Deduction for retirement income transferred to your spouse on December 31. Complete Schedule Q."
  - name: ca-qc/tp1_line_246
    title: "Deduction for a repayment of amounts overpaid to you"
    reference: "246"
    unit: ca/cad
    required: false
    default: null
    basis: "Deduction for a repayment of amounts overpaid to you"
  - name: ca-qc/tp1_line_250
    title: "Other deductions"
    reference: "250"
    unit: ca/cad
    required: false
    default: null
    basis: "Other deductions"
  - name: ca-qc/tp1_line_252
