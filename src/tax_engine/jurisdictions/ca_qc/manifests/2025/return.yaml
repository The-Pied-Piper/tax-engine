# The Quebec take-home return summary: the refund or balance owing, the total payable and the
# solidarity credit, from the two Quebec returns (the federal 5005-R and Revenu Quebec's TP-1).
# No printed line adds the two returns, so the summary is the engine's own step, as T1 line 167 is
# in the other provinces; its steps print no line of their own and carry no title or reference.
# Each form's export is read only as a record list, so every figure comes in through
# core/record_total (as `ca_nl` reads `ca/t1_tax_and_credits.refund_or_balance_owing`), and every
# step that computes is unit ca/cad and rounds half-up to the cent with `ca-qc/cent_rounding`.
#
# Refund or balance owing (the default output, `ca/refund_or_balance_owing`): positive is owing,
# negative is a refund, as T1 line 167 in the other provinces. 5005-R line 172 is the federal
# figure and TP-1 line 470 (450 less 468) is the Quebec one, added with no floor. Line 468 collects
# the credits typed on lines 451.2 to 466 and the work premium (456) and QPIP overpayment (457), so
# the summary follows what the caller types there, as the federal half does through line 172. The
# engine has no input for tax withheld (line 451, left out by ruling) or for line 451.1; line 451.2
# (451 less 451.1) is an optional input that line 468 includes.
#
# Total payable (`ca-qc/total_payable`; `ca/total_payable` is the federal kind the shared forms
# declare): 5005-R line 43500 plus TP-1 line 450. The refundable Quebec abatement (line 44000) is a
# credit paid on filing, separate from the tax, so it is not taken off.
#
# The solidarity credit (`ca-qc/solidarity_credit`) is the yearly amount of the payment period July
# 2026 to June 2027; it is its own output, added to neither of the two figures above.
#
# The average tax rate (`ca-qc/average_tax_rate`, no form prints it, so its steps have no title or
# line): the total payable above, the CPP (Schedule 8 lines 25 and 28, at the Quebec rate), the EI
# premium (T2204 line 16) and the QPIP premium (the `ppip_premium` form's export) added by core/sum
# into `ca/return_total_deductions` and divided by the salary, rounded once by
# `ca/take_home_average_rate_rounding`. The marginal tax rate is left for a later ticket.
capabilities:
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-qc/t1_tax_and_credits.refund_or_balance_owing_line_172
    produces:
      output: ca-qc/federal_refund_or_balance_owing_return
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-qc/tp1_totals.tp1_income_tax_and_contributions_line_450
    produces:
      output: ca-qc/tp1_income_tax_and_contributions_return
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-qc/tp1_totals.tp1_line_470
    produces:
      output: ca-qc/tp1_income_tax_less_credits_return
  - name: core/sum
    unit: ca/cad
    params:
      rounding: ca-qc/cent_rounding
    consumes:
      parts:
        - ca-qc/federal_refund_or_balance_owing_return
        - ca-qc/tp1_income_tax_less_credits_return
    produces:
      output: ca/refund_or_balance_owing
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-qc/t1_tax_and_credits.total_payable_line_151
    produces:
      output: ca-qc/federal_total_payable_return
  - name: core/sum
    unit: ca/cad
    params:
      rounding: ca-qc/cent_rounding
    consumes:
      parts:
        - ca-qc/federal_total_payable_return
        - ca-qc/tp1_income_tax_and_contributions_return
    produces:
      output: ca-qc/total_payable
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca/t1_employment_income.employment_income_line_10100
    produces:
      output: ca/return_employment_income
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca/schedule_8.schedule_8_cpp_base_contributions_on_return
    produces:
      output: ca/return_cpp_base_contributions
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca/schedule_8.schedule_8_cpp_enhanced_contributions_on_return
    produces:
      output: ca/return_cpp_enhanced_contributions
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca/t2204.t2204_line_16
    produces:
      output: ca/return_ei_premium
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-qc/ppip_premium.ppip_premiums_paid
    produces:
      output: ca-qc/return_qpip_premiums
  - name: core/sum
    unit: ca/cad
    params:
      rounding: ca-qc/cent_rounding
    consumes:
      parts:
        - ca-qc/total_payable
        - ca/return_cpp_base_contributions
        - ca/return_cpp_enhanced_contributions
        - ca/return_ei_premium
        - ca-qc/return_qpip_premiums
    produces:
      output: ca/return_total_deductions
  - name: core/divide
    unit: core/percent
    params:
      rounding: ca/take_home_average_rate_rounding
    consumes:
      dividend: ca/return_total_deductions
      divisor: ca/return_employment_income
    produces:
      output: ca-qc/average_tax_rate
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-qc/solidarity_credit.solidarity_credit_after_reduction
    produces:
      output: ca-qc/solidarity_credit
