# Schedule F (2025) line 23: "Dividends from taxable Canadian corporations: Taxable amount (line 128)", a copy of TP-1 line 128.
# Line 128 is an input of the TP-1 income form only, which takes it once and exports it; this line
# reads that export as a record list of one, so the one step is `core/record_total` (as line 14
# reads line 105). A blank line 128 is read as 0.
form:
  name: ca-qc/tp1_schedule_f
capabilities:
  - name: core/record_total
    title: "Dividends from taxable Canadian corporations, taxable amount"
    reference: "23"
    unit: ca/cad
    consumes:
      records: ca-qc/tp1_income.tp1_line_128
    blank:
      records:
        ca-qc/tp1_line_128: "0"
    produces:
      output: ca-qc/tp1_schedule_f_line_23
