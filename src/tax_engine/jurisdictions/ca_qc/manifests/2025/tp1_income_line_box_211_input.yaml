# RL-1 slip, box 211 (the figure Work Chart 201 line 1 and Schedule P line 10 take off): an optional
# input a salary-only caller does not give. It is a slip figure of the TP-1 income form, which takes
# the RL-1 slip, so this form takes it once and exports it; Work Chart 201 and Schedule P read the
# export (`ca-qc/tp1_income.rl1_slip_box_211`) and read a blank as 0.
form:
  name: ca-qc/tp1_income
inputs:
  - name: ca-qc/rl1_slip_box_211
    reference: "box 211"
    unit: ca/cad
    required: false
    default: null
    basis: 'Minus the amount from box 211 of your RL-1 slip.'
