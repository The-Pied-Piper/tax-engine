# Quebec 2025 take-home manifest: the return's identity and the federal forms it imports. The caller
# gives the gross salary and nothing else. Quebec's own forms are parts beside this one, so a line
# ticket adds only its own part file; the federal forms are imported by name below, their parts in
# the `ca` package (`ca/forms/<name>/`).
#
# Quebec has two returns: the federal T1 for Quebec residents (CRA 5005-R, whose line numbers shift
# by one after line 49) and Revenu Quebec's TP-1. Both are built as Quebec's own form parts, so
# `ca/t1_taxable_income` and `ca/t1_tax_and_credits` are not imported. Schedules 8 and 6 and the EI
# form (T2204) are the shared federal forms; each gets its Quebec `datasets` swap from its own
# ticket (Schedule 8's is in place below).
#
# The `outputs` list is set by the Quebec return summary ticket (`return.yaml`). Quebec is listed in
# `registrations.JURISDICTIONS`: every listed jurisdiction is composed by
# `tests/application/services/test_every_resolvable_year.py`, and this manifest is complete (the
# 2026 datasets are provisional).
jurisdiction: CA-QC
version: 1
valid_from_tax_year: 2025
# The title is the engine's own wording for the default form, not a printed form heading.
title: Return summary
outputs:
  - ca/refund_or_balance_owing
  - ca-qc/total_payable
  - ca-qc/solidarity_credit
capabilities: []
# Where the take-home answer reads its figures (the caller gives the salary and nothing else).
# Quebec has two returns, so the income tax is `ca-qc/total_payable`: 5005-R line 43500 plus TP-1
# line 450 (Quebec income tax and contributions, which include the health services fund and the
# prescription drug insurance premium). The refundable Quebec abatement (line 44000) is a credit paid
# on filing, so it is not taken off. The pension
# plan figures are Schedule 8's, read at the Quebec rate; EI is T2204 at the Quebec rate; the QPIP
# premium is 5005-R line 91. The average and marginal income tax rates are not declared: this
# manifest does not compute them yet (see `return.yaml`).
take_home:
  salary: ca/employment_income
  income_tax: {form: ca-qc/return, kind: ca-qc/total_payable}
  deductions:
    qpp_base: {form: ca/schedule_8, kind: ca/schedule_8_cpp_base_contributions_on_return}
    qpp_enhanced: {form: ca/schedule_8, kind: ca/cpp_part_3_line_12}
    qpp2: {form: ca/schedule_8, kind: ca/cpp_part_3_line_22}
    ei: {form: ca/t2204, kind: ca/t2204_line_16}
    qpip: {form: ca-qc/ppip_premium, kind: ca-qc/ppip_premiums_paid}
imports:
  # Quebec prints its own Schedule 8 (5005-S8): the shared form reads the Quebec line 11 dataset
  # (5.4%, maximum $3,661.20) instead of the federal one; every other figure is the same.
  - form: ca/schedule_8
    datasets:
      ca/cpp_line_11_base_contribution: ca-qc/qpp_line_11_base_contribution
  # Quebec prints its own Schedule 6 (5005-S6): the shared form reads the Quebec figures of lines 17,
  # 19, 21, 24 and 26 (no eligible spouse or dependant) instead of the federal ones.
  - form: ca/schedule_6
    datasets:
      ca/cwb_base_amount: ca-qc/cwb_base_amount
      ca/cwb_rate: ca-qc/cwb_rate
      ca/cwb_maximum: ca-qc/cwb_maximum
      ca/cwb_reduction_threshold: ca-qc/cwb_reduction_threshold
      ca/cwb_reduction_rate: ca-qc/cwb_reduction_rate
  # Quebec's EI rate is 1.31% (T2204 line 11, 5005-S10 line 19): the shared T2204 reads the Quebec dataset.
  - form: ca/t2204
    datasets:
      ca/ei_premium: ca-qc/ei_premium
