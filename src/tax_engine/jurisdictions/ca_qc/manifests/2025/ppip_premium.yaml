# PPIP premium (2025), 5005-R line 91 and line 31205 (Schedule 10, Part B). It is a part of the
# 5005-R return, and split forms share one title, so it carries the return's title. This part names
# the form and its export; line parts carry capabilities. The export, line 91
# (`ca-qc/ppip_premiums_paid`), is read by 5005-R line 91 and by TP-1
# line 97, the same figure.
form:
  name: ca-qc/ppip_premium
  title: "T1 Income Tax and Benefit Return"
  required: true
  exports:
    - ca-qc/ppip_premiums_paid
capabilities: []
