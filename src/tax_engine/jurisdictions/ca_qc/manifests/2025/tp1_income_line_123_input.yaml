# TP-1 (2025) line 123, "Retirement income transferred by your spouse": an optional input a salary-only caller does not give. It is a
# line of the TP-1 income form, so this form takes it once; the line 199 part
# (tp1_income_line_199.yaml) adds it to the salary and reads a blank as 0.
form:
  name: ca-qc/tp1_income
inputs:
  - name: ca-qc/tp1_line_123
    reference: "123"
    unit: ca/cad
    required: false
    default: null
    basis: 'Retirement income transferred by your spouse'
