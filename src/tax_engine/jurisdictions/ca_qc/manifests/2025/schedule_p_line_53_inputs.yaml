# Schedule P (TP-1.D.P-V, 2025-12) Part C line 53: "Amount from line 275 of your spouse's return
# (spouse on December 31, 2025)".
# An input a salary-only caller does not give: the take-home is a single filer's, so the spouse's
# return is left out. A blank is read as 0 by line 54, which adds it.
form:
  name: ca-qc/schedule_p
inputs:
  - name: ca-qc/schedule_p_spouse_net_income_line_53
    reference: "53"
    unit: ca/cad
    required: false
    default: null
    basis: "Amount from line 275 of your spouse's return (spouse on December 31, 2025)"
