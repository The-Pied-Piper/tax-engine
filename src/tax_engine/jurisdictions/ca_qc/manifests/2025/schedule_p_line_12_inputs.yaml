# Schedule P (TP-1.D.P-V, 2025-12) Part A line 12: "Amount from line 107 of the return".
# Line 12 is a copy of TP-1 line 107, an optional input of the return that a salary-only caller
# does not give. A blank is read as 0 by line 18, which adds it; the copy has no step of its own.
# The input is named for the TP-1 line it copies.
form:
  name: ca-qc/schedule_p
inputs:
  - name: ca-qc/tp1_line_107
    reference: "12"
    unit: ca/cad
    required: false
    default: null
    basis: 'Amount from line 107 of the return'
