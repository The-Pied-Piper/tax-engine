# Schedule K (2025) line 37: "Amount from line 275 of your spouse's return (spouse on December 31,
# 2025)" (Revenu Quebec TP-1.D.K-V (2025-12), Part A). The spouse's return is not one of ours, so the
# amount is an input; a single filer has no spouse and a salary-only caller does not give it. The
# line 40 part (tp1_schedule_k_line_40.yaml) reads the blank as 0.
form:
  name: ca-qc/tp1_schedule_k
inputs:
  - name: ca-qc/schedule_k_spouse_net_income_line_37
    reference: "37"
    unit: ca/cad
    required: false
    default: null
    basis: "Amount from line 275 of your spouse's return (spouse on December 31, 2025)"
