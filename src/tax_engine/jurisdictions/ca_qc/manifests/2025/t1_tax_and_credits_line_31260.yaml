# 5005-R (2025) line 96 and line 31260, Canada employment amount: "Enter whichever is less: $1,471 or line
# 1 plus line 2." (page 6). Line 1 is line 10100 (employment income, the salary) and line 2 is line
# 10400 (other employment income, an optional input read as 0). As the federal line 31260 is built,
# the form's two operations are two steps; the printed $1,471 is the shared dataset
# `ca/canada_employment_amount`. Both lines belong to the T1 taxable income form and are read as its
# exports (a record list each, totalled by core/record_total), the neutral names the Quebec T1 supplies.
form:
  name: ca-qc/t1_tax_and_credits
capabilities:
  - name: core/record_total
    title: "Employment income from line 10100"
    unit: ca/cad
    consumes:
      records: ca/t1_taxable_income.employment_income_line_10100
    produces:
      output: ca/canada_employment_amount_line_1
  - name: core/record_total
    title: "Other employment income from line 10400"
    unit: ca/cad
    consumes:
      records: ca/t1_taxable_income.other_employment_income_line_10400
    produces:
      output: ca/canada_employment_amount_line_2
  # "line 1 plus line 2". The form prints no rounding, so the sum is carried exactly.
  - name: core/sum
    title: "Employment income plus other employment income, before the limit"
    unit: ca/cad
    params:
      rounding: ca-qc/exact_rounding
    consumes:
      parts: [ca/canada_employment_amount_line_1, ca/canada_employment_amount_line_2]
    produces:
      output: ca-qc/canada_employment_amount_income
  # "whichever is less: $1,471 or" that sum.
  - name: core/capped_amount
    title: "Canada employment amount"
    reference: "31260"
    unit: ca/cad
    params:
      cap: ca/canada_employment_amount
    consumes:
      base: ca-qc/canada_employment_amount_income
    produces:
      output: ca-qc/canada_employment_amount
