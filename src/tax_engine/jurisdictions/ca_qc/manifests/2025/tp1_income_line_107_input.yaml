# TP-1 (2025) line 107: an optional input a salary-only caller does not give. It is a line of the
# TP-1 income form, so this form takes it once and exports it; Work Chart 201 line 1 and Schedule P
# line 18 read the export (`ca-qc/tp1_income.tp1_line_107`) and read a blank as 0.
form:
  name: ca-qc/tp1_income
inputs:
  - name: ca-qc/tp1_line_107
    title: "Other employment income"
    reference: "107"
    unit: ca/cad
    required: false
    default: null
    basis: "Other employment income. Specify: 106 + 107"
