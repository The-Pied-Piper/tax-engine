# 5005-R (2025) line 33 and line 15000, total income. The form prints: "Line 33 and line 15000: Line 28
# plus line 32 =" (page 3). Line 32 is a step (`ca-qc/t1_line_32`, line
# 14700). One step: core/sum in form line order. Line 34 ("Enter the amount from line 33 of the
# previous page.") is a copy and has no step.
form:
  name: ca-qc/t1_taxable_income
capabilities:
  - name: core/sum
    reference: "15000"
    unit: ca/cad
    params:
      rounding: ca-qc/cent_rounding
    consumes:
      parts: [ca-qc/t1_line_28, ca-qc/t1_line_32]
    produces:
      output: ca-qc/total_income
