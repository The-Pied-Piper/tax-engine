# Schedule B (TP-1.D.B-V, 2025-12) Part B line 22: "If you were born before January 1, 1961, enter $3,906." Three steps, as ca-ns/ns428 line 98 builds a claim for a filer aged 65 or older:
# 1. core/first_record_count reads the "aged 65 or older" flag of the T1 identification form (`ca-qc/t1_birth_year.age_65_or_older`, worked out once from the year of birth, 1960 or earlier for 2025 and 1961 or earlier for 2026; blank passes on).
# 2. core/credit_amount produces the printed 3,906.00 from its dataset.
# 3. core/times_count of that by the flag: the amount when born before January 1, 1961, 0.00 otherwise (a blank flag is read as 0).
# The "not entitled" test of Part A (no spouse and line 18 more than $64,699) is not a step here: line 32 subtracts 18.75% of line 18 from line 30, and above $64,699 that is more than $12,131, more than line 20 and line 22 together can add ($2,128 plus $3,906), so line 32 is 0 either way.
# Steps 1 and 2 are not lines of the form, so they have no reference. The form prints no label for the line, so its step is untitled.
form:
  name: ca-qc/schedule_b
capabilities:
  - name: core/first_record_count
    title: "Aged 65 or older"
    consumes:
      records: ca-qc/t1_birth_year.age_65_or_older
    blank:
      records:
        ca/age_65_or_older: pass_on
    produces:
      output: ca-qc/schedule_b_age_65_or_older_line_22
  - name: core/credit_amount
    title: "Age amount claim"
    unit: ca/cad
    params:
      amount: ca-qc/schedule_b_age_amount_line_22
    produces:
      output: ca-qc/schedule_b_age_amount_line_22
  - name: core/times_count
    reference: "22"
    unit: ca/cad
    params:
      rounding: ca-qc/cent_rounding
    consumes:
      amount: ca-qc/schedule_b_age_amount_line_22
      count: ca-qc/schedule_b_age_65_or_older_line_22
    blank:
      count: "0"
    produces:
      output: ca-qc/schedule_b_line_22
