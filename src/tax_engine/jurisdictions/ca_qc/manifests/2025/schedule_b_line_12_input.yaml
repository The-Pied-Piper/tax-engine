# Schedule B (TP-1.D.B-V, 2025-12) Part A line 12: "Amount from line 275 of your spouse's return
# (spouse on December 31, 2025)". A spouse line, which the take-home leaves out (owner ruling,
# 19 Nov 2026), kept as an optional input so line 14 stays a printed sum (owner decision on the
# ticket, 19 Nov 2026). A salary-only caller leaves it out: a request that omits it is read as
# blank, and the line 14 part reads the blank as 0.
form:
  name: ca-qc/schedule_b
inputs:
  - name: ca-qc/schedule_b_line_12
    title: "Amount from line 275 of your spouse's return"
    reference: "12"
    unit: ca/cad
    required: false
    default: null
    basis: "Amount from line 275 of your spouse's return (spouse on December 31, 2025)"
