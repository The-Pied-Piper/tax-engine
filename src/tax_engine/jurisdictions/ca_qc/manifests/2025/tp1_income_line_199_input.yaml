# TP-1 (2025) lines 105 to 164, the income lines that line 199 adds to line 101: an input a
# salary-only caller does not give. The caller gives the sum of those lines, or leaves it out, and
# the line 199 part (tp1_income_line_199.yaml) reads the blank as 0, as the T1 line 25700 part does.
form:
  name: ca-qc/tp1_income
inputs:
  - name: ca-qc/tp1_other_income_lines_105_to_164
    reference: "105 to 164"
    unit: ca/cad
    required: false
    default: null
    basis: 'Add lines 101 and 105 through 164.'
