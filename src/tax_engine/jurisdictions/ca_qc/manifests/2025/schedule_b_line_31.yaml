# Schedule B (TP-1.D.B-V, 2025-12) Part B line 31: "Amount from line 18 x 18.75%". One step,
# core/apply_rate over line 18 with the printed rate as a dataset figure
# (`ca-qc/schedule_b_line_31_rate`, 18.75%); the dataset's rounding rule rounds the product
# half-up to the cent. The form prints no label for the line, so the step is untitled.
form:
  name: ca-qc/schedule_b
capabilities:
  - name: core/apply_rate
    reference: "31"
    unit: ca/cad
    params:
      rate: ca-qc/schedule_b_line_31_rate
    consumes:
      base: ca-qc/schedule_b_line_18
    produces:
      output: ca-qc/schedule_b_line_31
