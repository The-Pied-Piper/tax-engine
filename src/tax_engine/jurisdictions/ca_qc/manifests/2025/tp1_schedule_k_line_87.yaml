# Schedule K (2025) Part C, line 87: "Maximum premium for 2025 ... 87 755 00". The printed 755.00 is
# a dataset figure (`ca-qc/schedule_k_line_87_maximum`), claimed whole through core/credit_amount as
# Schedule P line 56 and TP-1 line 350 are. The form prints no label for the line beyond its own
# words, so the step is untitled.
form:
  name: ca-qc/tp1_schedule_k
capabilities:
  - name: core/credit_amount
    reference: "87"
    unit: ca/cad
    params:
      amount: ca-qc/schedule_k_line_87_maximum
    produces:
      output: ca-qc/schedule_k_maximum_premium_line_87
