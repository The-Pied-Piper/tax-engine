# Revenu Quebec TP-1.D.P-V (2025-12), Schedule P (Tax Credits Respecting the Work Premium), Part A
# "Work income", column "You": lines 10 to 29, Part C "Family income": line 52 (lines 53 and 54 are the spouse's and the sum with it, left out: a single filer's family income is line 52), Part D
# "Supplement to the work premium": lines 56 to 60, and Part E, section 2, column 1 "Work premium":
# lines 64 to 84 and 87, and Part F "Tax credits respecting the work premium": line 90 (lines 88
# and 89 are copies of lines 60 and 87 and have no step). This part names the form; each line's
# capability is a part of its own with the same `form.name`. The spouse column (lines 30 to 49) and
# the adapted work premium (column 2) are left out, as the take-home is a single filer's. The export is line 90, which TP-1 line 456 reads;
# the other lines are read inside the form.
form:
  name: ca-qc/schedule_p
  title: "Schedule P: Tax Credits Respecting the Work Premium"
  required: true
  exports:
    - ca-qc/schedule_p_tax_credits_line_90
capabilities: []
