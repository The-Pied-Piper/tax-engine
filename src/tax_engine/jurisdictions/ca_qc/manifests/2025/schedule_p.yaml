# Revenu Quebec TP-1.D.P-V (2025-12), Schedule P (Tax Credits Respecting the Work Premium), Part A
# "Work income", column "You": lines 10 to 29, and Part E, section 2, column 1 "Work premium": lines 64
# to 76. This part names the form; each line's capability is a part of its own with the same
# `form.name`. The spouse column (lines 30 to 49) and the adapted work premium (column 2) are left
# out, as the take-home is a single filer's. The export is the work premium before the reduction of
# line 76, which line 84 reads; the work income of line 29 is read inside the form by line 68.
form:
  name: ca-qc/schedule_p
  title: "Schedule P: Tax Credits Respecting the Work Premium"
  required: true
  exports:
    - ca-qc/schedule_p_work_premium_before_reduction_line_76
capabilities: []
