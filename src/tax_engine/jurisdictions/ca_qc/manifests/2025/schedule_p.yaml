# Revenu Quebec TP-1.D.P-V (2025-12), Schedule P (Tax Credits Respecting the Work Premium), Part A
# "Work income", column "You": lines 10 to 29. This part names the form; each line's capability is a
# part of its own with the same `form.name`. The spouse column (lines 30 to 49) is left out, as the
# take-home is a single filer's. The export is the work income of line 29, which Part E reads.
form:
  name: ca-qc/schedule_p
  title: "Schedule P: Tax Credits Respecting the Work Premium"
  required: true
  exports:
    - ca-qc/schedule_p_work_income_line_29
capabilities: []
