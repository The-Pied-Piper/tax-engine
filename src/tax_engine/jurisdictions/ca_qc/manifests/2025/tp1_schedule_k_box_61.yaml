# Schedule K (2025) box 61, "Number of months checked from July to December" (Revenu Quebec TP-1.D.K-V
# (2025-12), Part B, section 1): the months of the half in which line 50 applied, from the
# `ca-qc/schedule_k_months_box_61` dataset by the checked answer to line 50 through
# ca/amount_by_count. The months are a figure in months, not dollars. Mirrors Schedule 8 line B
# (`ca/forms/schedule_8/schedule_8_line_b.yaml`).
form:
  name: ca-qc/tp1_schedule_k
capabilities:
  - name: ca/amount_by_count
    title: "Number of months checked from July to December"
    reference: "61"
    unit: core/months
    params:
      table: ca-qc/schedule_k_months_box_61
    consumes:
      count: ca-qc/schedule_k_group_plan_covered_checked_line_50
    produces:
      output: ca-qc/schedule_k_months_july_to_december_box_61
