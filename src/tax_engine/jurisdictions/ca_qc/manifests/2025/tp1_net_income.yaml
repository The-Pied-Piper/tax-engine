# Revenu Quebec TP-1.D-V (2025-12), page 3, "Net income": lines 199 to 275. This part names the
# form; each printed line's capability is a part of its own with the same `form.name`. Line 199 is
# read from the TP-1 income form, line 201 from Work Chart 201 and line 248 from Schedule U, each as
# the other form's export (a record list of one amount). Lines 254 and 298 are steps; the printed lines
# they add (other than 201 and 248) are optional inputs, and so is line 260, each read as 0 when
# left out. The title is the printed page heading. Lines 276 and 278 are optional inputs, read as 0
# (page 3, "Taxable income"). Exports: line 275, the net income that the schedules read, line 299,
# the taxable income that Work Chart 401 reads, and the optional non-negative inputs lines 225, 231,
# 234, 245 and 246, which Schedule F lines 54, 56, 58, 46 and 41 read.
form:
  name: ca-qc/tp1_net_income
  title: "Income Tax Return"
  required: true
  exports:
    - ca-qc/tp1_net_income_line_275
    - ca-qc/tp1_taxable_income_line_299
    - ca-qc/tp1_line_225
    - ca-qc/tp1_line_231
    - ca-qc/tp1_line_234
    - ca-qc/tp1_line_245
    - ca-qc/tp1_line_246
capabilities: []
