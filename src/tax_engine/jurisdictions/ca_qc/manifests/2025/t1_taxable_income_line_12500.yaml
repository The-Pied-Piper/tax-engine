# T1 (5006-R, 2025) line 12500: "Line 12 and line 12500: Registered disability savings plan (RDSP) income (box 131 of the T4A slip)" (5006-R page 3). The optional input
# (`ca/rdsp_income`, blank when the filer has none) is read by this step, which is the one line the T1
# prints for it, and the blank reads as 0. The form exports the line (`ca/rdsp_income_line_12500`) for the forms
# that print it again as part of a total (Schedule 6 line 11, BC479 line 4, MB479 line 4, NL428 line 91). It is not added
# into line 15000 here: the take-home T1 builds employment income only.
form:
  name: ca-qc/t1_taxable_income
capabilities:
  - name: core/sum
    title: "Registered disability savings plan (RDSP) income"
    reference: "12500"
    unit: ca/cad
    params:
      rounding: ca/cent_rounding
    consumes:
      parts: [ca/rdsp_income]
    blank:
      ca/rdsp_income: "0"
    produces:
      output: ca/rdsp_income_line_12500
