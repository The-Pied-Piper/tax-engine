# TP-752.PC-V (2026-10), line 39 "x 7% Multiply line 38 by 7%. = 39". The printed 7% is the `ca-qc/tp752_pc_line_39_rate` dataset, so the line is one core/apply_rate, rounded half-up to the cent by the dataset's rule.
form:
  name: ca-qc/tp752_pc
capabilities:
  - name: core/apply_rate
    reference: "39"
    unit: ca/cad
    params:
      rate: ca-qc/tp752_pc_line_39_rate
    consumes:
      base: ca-qc/tp752_pc_line_38
    produces:
      output: ca-qc/tp752_pc_line_39
