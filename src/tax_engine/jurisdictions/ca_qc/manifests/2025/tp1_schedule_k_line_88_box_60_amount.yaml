# Schedule K (2025) Part C, line 88, the printed $62.00 of the row "Number of months entered in box
# 60 x $62.00". One core/credit_amount: the amount for each month, from
# `ca-qc/schedule_k_monthly_amount_box_60` (a printed rate is a dataset figure, taken as printed).
# It is not a line of the form, so it has no reference and no title; the box 60 row reads it.
form:
  name: ca-qc/tp1_schedule_k
capabilities:
  - name: core/credit_amount
    unit: ca/cad
    params:
      amount: ca-qc/schedule_k_monthly_amount_box_60
    produces:
      output: ca-qc/schedule_k_monthly_amount_box_60
