# TP-1 (2025) line 248, "Deduction for QPP and CPP contributions and QPIP premiums": Schedule U
# line 23 ("Carry the result to line 248 of your return"), a copy. An employee's QPIP premium has no
# deduction on this line (the owner's Employee QPIP ruling, 19 Nov 2026), so the figure is Schedule U
# line 23 alone. Schedule U is its own form, so its line 23 arrives as that form's export, a record
# list of one amount; the one step is core/record_total over it, as line 201 reads Work Chart 201.
# Rounding is none: core/record_total never rounds. The figure is signed, as line 23 is.
form:
  name: ca-qc/tp1_net_income
capabilities:
  - name: core/record_total
    title: "Deduction for QPP and CPP contributions and QPIP premiums"
    reference: "248"
    unit: ca/cad
    consumes:
      records: ca-qc/tp1_schedule_u.schedule_u_line_23
    produces:
      output: ca-qc/tp1_qpp_deduction_line_248
