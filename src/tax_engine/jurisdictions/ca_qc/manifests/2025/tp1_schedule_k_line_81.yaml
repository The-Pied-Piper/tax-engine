# Schedule K (2025) Part C, line 81: "Multiply line 79 by line 80." Line 79 times the column's rate,
# rounded half-up to the cent (`ca-qc/cent_rounding`). The form prints no label for the line, so the
# step is untitled.
form:
  name: ca-qc/tp1_schedule_k
capabilities:
  - name: core/multiply_by_rate
    reference: "81"
    unit: ca/cad
    params:
      rounding: ca-qc/cent_rounding
    consumes:
      base: ca-qc/schedule_k_income_over_lower_bound_line_79
      rate: ca-qc/schedule_k_column_rate_line_80
    produces:
      output: ca-qc/schedule_k_premium_on_excess_line_81
