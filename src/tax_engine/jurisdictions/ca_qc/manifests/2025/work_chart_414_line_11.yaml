# Work Chart 414 (TP-1.D.GR-V 2025-12), line 11: line 3 "x 75% = 11". Line 3 times the printed 75%
# (`ca-qc/work_chart_414_line_11_rate`), rounded half-up to the cent by the dataset.
form:
  name: ca-qc/work_chart_414
capabilities:
  - name: core/apply_rate
    reference: "11"
    unit: ca/cad
    params:
      rate: ca-qc/work_chart_414_line_11_rate
    consumes:
      base: ca-qc/work_chart_414_remainder_line_3
    produces:
      output: ca-qc/work_chart_414_line_11
