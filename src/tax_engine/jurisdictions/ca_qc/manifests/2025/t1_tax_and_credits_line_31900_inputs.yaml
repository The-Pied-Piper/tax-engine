# 5005-R (2025) line 106 input a salary-only caller does not give.
# Line 106 and line 31900: "Interest paid on your student loans (go to canada.ca/taxes-students)" (page 6). A salary-only filer has no such amount, so it is an
# optional input left blank; the sum or difference that reads it takes a blank as 0.
form:
  name: ca-qc/t1_tax_and_credits
inputs:
  - name: ca-qc/student_loan_interest_line_106
    title: "Interest paid on your student loans"
    reference: "31900"
    unit: ca/cad
    required: false
    default: null
    basis: "Interest paid on your student loans (go to canada.ca/taxes-students)"
