# Schedule U (Revenu Quebec TP-1.D.U-V, 2025-12), Part B, line 14.4: "Amount from line 14 or line
# 14.3, whichever is less." One `core/lesser_of` step over line 14 (`ca-qc/schedule_u_line_14`) and
# line 14.3 (`ca-qc/schedule_u_line_14_3`). The form prints no label for the line, so the step is
# untitled.
form:
  name: ca-qc/tp1_schedule_u
capabilities:
  - name: core/lesser_of
    reference: "14.4"
    unit: ca/cad
    consumes:
      amounts:
        - ca-qc/schedule_u_line_14
        - ca-qc/schedule_u_line_14_3
    produces:
      output: ca-qc/schedule_u_line_14_4
