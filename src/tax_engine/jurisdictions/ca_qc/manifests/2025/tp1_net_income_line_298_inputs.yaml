# TP-1 (2025) page 3, "Taxable income": the lines that line 298 adds ("Add lines 287 through 297.
# Total deductions = 298"): lines 287, 289, 290, 291, 292, 293, 295 and 297. Each is an optional
# input, left blank by a salary-only caller and read as 0 by line 298
# (`tp1_net_income_line_298.yaml`). The "Specify" boxes 286, 289.1 and 296 are text, not amounts, so
# they are not taken. No sign is refused: the form prints none for these lines.
form:
  name: ca-qc/tp1_net_income
inputs:
  - name: ca-qc/tp1_line_287
    reference: "287"
    unit: ca/cad
    required: false
    default: null
    basis: "Deductions for strategic investments"
  - name: ca-qc/tp1_line_289
    reference: "289"
    unit: ca/cad
    required: false
    default: null
    basis: "Non-capital losses from other years"
  - name: ca-qc/tp1_line_290
    reference: "290"
    unit: ca/cad
    required: false
    default: null
    basis: "Net capital losses from other years"
  - name: ca-qc/tp1_line_291
    reference: "291"
    unit: ca/cad
    required: false
    default: null
    basis: "Capital gains deduction for a qualifying business transfer"
  - name: ca-qc/tp1_line_292
    reference: "292"
    unit: ca/cad
    required: false
    default: null
    basis: "Capital gains deduction"
  - name: ca-qc/tp1_line_293
    reference: "293"
    unit: ca/cad
    required: false
    default: null
    basis: "Deduction for income situated on a reserve"
  - name: ca-qc/tp1_line_295
    reference: "295"
    unit: ca/cad
    required: false
    default: null
    basis: "Deductions for certain income"
  - name: ca-qc/tp1_line_297
    reference: "297"
    unit: ca/cad
    required: false
    default: null
    basis: "Miscellaneous deductions"
