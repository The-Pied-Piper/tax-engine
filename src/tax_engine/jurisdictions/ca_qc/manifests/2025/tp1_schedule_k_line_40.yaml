# Schedule K (2025) line 40: "Add lines 36 and 37." (Revenu Quebec TP-1.D.K-V (2025-12), Part A).
# One step: core/sum, rounded half-up to the cent (`ca-qc/cent_rounding`). Line 37 is an optional
# input, read as 0 when the caller leaves it out. The form prints no label for the line, so the step
# is untitled.
form:
  name: ca-qc/tp1_schedule_k
capabilities:
  - name: core/sum
    reference: "40"
    unit: ca/cad
    params:
      rounding: ca-qc/cent_rounding
    consumes:
      parts:
        - ca-qc/schedule_k_net_income_line_36
        - ca-qc/schedule_k_spouse_net_income_line_37
    blank:
      ca-qc/schedule_k_spouse_net_income_line_37: "0"
    produces:
      output: ca-qc/schedule_k_income_line_40
