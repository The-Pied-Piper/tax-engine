# 5005-R (2025) line 164 input a salary-only caller does not give.
# Line 164 and line 45400: "Refund of investment tax credit (complete Form T2038(IND))" (page 8). A salary-only filer has no such amount, so it is an
# optional input left blank; the sum that reads it takes a blank as 0.
form:
  name: ca-qc/t1_tax_and_credits
inputs:
  - name: ca-qc/investment_tax_credit_refund_line_164
    title: "Refund of investment tax credit"
    reference: "45400"
    unit: ca/cad
    required: false
    default: null
    basis: "Refund of investment tax credit (complete Form T2038(IND))"
