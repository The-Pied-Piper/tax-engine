# Schedule U (Revenu Quebec TP-1.D.U-V, 2025-12), Part B, line 21: "Multiply line 20 by 4%." The printed 4% is the
# `ca-qc/schedule_u_line_21_rate` dataset figure; the product is rounded half-up to the cent. The form
# prints no label for the line, so the step is untitled.
form:
  name: ca-qc/tp1_schedule_u
capabilities:
  - name: core/apply_rate
    reference: "21"
    unit: ca/cad
    params:
      rate: ca-qc/schedule_u_line_21_rate
    consumes:
      base: ca-qc/schedule_u_line_20
    produces:
      output: ca-qc/schedule_u_line_21
