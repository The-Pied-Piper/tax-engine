# Schedule U (Revenu Quebec TP-1.D.U-V, 2025-12), Part B, line 17.4: "Additional contribution to the
# QPP (line 98.2 of your return)", a copy of TP-1 line 98.2. TP-1 income is its own form, so line
# 98.2 arrives as that form's export, a record list of one amount; the one step is
# `core/record_total` over it, as line 10 does. The step carries the printed label as its title.
form:
  name: ca-qc/tp1_schedule_u
capabilities:
  - name: core/record_total
    reference: "17.4"
    title: "Additional contribution to the QPP"
    unit: ca/cad
    consumes:
      records: ca-qc/tp1_income.tp1_additional_qpp_contribution_line_98_2
    produces:
      output: ca-qc/schedule_u_line_17_4
