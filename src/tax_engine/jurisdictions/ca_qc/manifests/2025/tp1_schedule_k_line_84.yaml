# Schedule K (2025) Part C, line 84: "Amount from line 83 of column A or B, as applicable", with the
# printed maximum of $766 ("maximum $766" on line 83; "is more than $14,669, enter $766 on line 84").
# One step: core/capped_amount, the lesser of line 83 and the maximum
# (`ca-qc/schedule_k_line_83_maximum`, 766.00), as the owner ruled on 19 Nov 2026. Above a line 48
# of $14,669 the form skips the table and enters $766; the capped column B figure is $766 there too,
# so the one step covers both. The form prints no label for the line, so the step is untitled.
# Export: Part D (line 85 onward) reads this line.
form:
  name: ca-qc/tp1_schedule_k
capabilities:
  - name: core/capped_amount
    reference: "84"
    unit: ca/cad
    params:
      cap: ca-qc/schedule_k_line_83_maximum
    consumes:
      base: ca-qc/schedule_k_column_premium_line_83
    produces:
      output: ca-qc/schedule_k_premium_line_84
