# 5005-R line 91: "Line 91 and line 31205: Provincial parental insurance plan (PPIP) premiums paid
# (box 55 of all T4 slips) (maximum $484.12)". The take-home caller has no T4, so a blank
# `ca-qc/ppip_premiums_given` is computed: 0.494% of the employment income to the $98,000 maximum,
# at most $484.12, half-up to the cent, from the `ca-qc/ppip_premium` dataset. A given figure is
# produced unchanged, but is first checked against the printed maximum (`ca-qc/ppip_premium_maximum`,
# 484.12): a figure above it is refused, not capped, as the form says line 91 cannot exceed it. The
# check is its own untitled step, as NL428 line 82's is. Mirrors T2204 line 4
# (`ca/forms/t2204/t2204_line_4.yaml`).
# Guide 5000-G (2025), line 31205: "If your PPIP insurable earnings are less than $2,000, do not claim
# any PPIP premiums on line 31205. Instead, claim this amount as an overpayment on your Revenu Québec
# Income Tax Return." The premium above is the figure before that test. The test reads the employment
# income (line 10100), the earnings the T4 box 55 premium is paid on (self-employment earnings have
# their own line, 31215), and is its two complements, as TP-1 line 457's is
# (`tp1_totals_line_457.yaml`), which already carries the whole of TP-1 line 97 to line 457 in that
# case; so line 91 and line 31205 are 0 and the premium is claimed once, as the overpayment. The last
# step carries line 91.
form:
  name: ca-qc/ppip_premium
capabilities:
  - name: core/record_total
    title: "Employment income, T1 line 10100"
    unit: ca/cad
    consumes:
      records: ca-qc/t1_employment_income.employment_income_line_10100
    produces:
      output: ca-qc/ppip_premium_employment_income
  - name: core/credit_amount
    title: "Most you can enter on line 91"
    unit: ca/cad
    params:
      amount: ca-qc/ppip_premium_maximum
    produces:
      output: ca-qc/ppip_premium_maximum
  - name: core/at_most
    unit: ca/cad
    consumes:
      amount: ca-qc/ppip_premiums_given
      bound: ca-qc/ppip_premium_maximum
    blank:
      amount: pass_on
    produces:
      output: ca-qc/ppip_premiums_given_checked
  - name: ca/given_or_contribution_tier
    title: "PPIP premiums paid before the earnings test"
    unit: ca/cad
    params:
      tier: ca-qc/ppip_premium
    consumes:
      given: ca-qc/ppip_premiums_given_checked
      earnings: ca-qc/ppip_premium_employment_income
    blank:
      given: compute
    produces:
      output: ca-qc/ppip_premiums_before_earnings_test
  - name: ca/count_by_conditions
    title: "The PPIP insurable earnings are less than $2,000"
    params:
      conditions: ca-qc/ppip_premium_line_91_conditions
    consumes:
      counts: []
      amounts:
        - ca-qc/ppip_premium_employment_income
    produces:
      output: ca-qc/ppip_premium_under_threshold_count
  - name: core/credit_amount
    title: "PPIP premiums claimed when the earnings are under $2,000"
    unit: ca/cad
    params:
      amount: ca-qc/ppip_premium_zero
    produces:
      output: ca-qc/ppip_premium_zero
  - name: core/choose_by_count
    title: "Provincial parental insurance plan (PPIP) premiums paid"
    reference: "91"
    unit: ca/cad
    consumes:
      count: ca-qc/ppip_premium_under_threshold_count
      when_none: ca-qc/ppip_premiums_before_earnings_test
      when_any: ca-qc/ppip_premium_zero
    produces:
      output: ca-qc/ppip_premiums_paid
