# Schedule P (TP-1.D.P-V, 2025-12) Part D line 57: "Total number of months in box V of your RL-5
# slip".
# An input a salary-only caller does not give (it matters only to former recipients of last-resort
# financial assistance or of the Aim for Employment Program): the number of months, as the form
# takes it. A blank is read as 0 by line 59, which takes the lesser of lines 57 and 58.
form:
  name: ca-qc/schedule_p
inputs:
  - name: ca-qc/schedule_p_rl5_months_line_57
    title: "Total number of months in box V of your RL-5 slip"
    reference: "57"
    required: false
    default: null
    basis: "Total number of months in box V of your RL-5 slip"
