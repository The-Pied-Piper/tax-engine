# Schedule F (2025) line 12: "Employment income (line 101)", a copy of TP-1 line 101. The amount
# arrives from the TP-1 income form as a record list of one, so the one step is `core/record_total`
# (as ON428 line 19 reads Schedule 8).
form:
  name: ca-qc/tp1_schedule_f
capabilities:
  - name: core/record_total
    title: "Employment income"
    reference: "12"
    unit: ca/cad
    consumes:
      records: ca-qc/tp1_income.employment_income
    produces:
      output: ca-qc/tp1_schedule_f_employment_income_line_12
