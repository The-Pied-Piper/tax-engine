# Provisional: taken from the 2025 form text named in sources; to be confirmed against the 2026 form text when CRA publishes it.
# Derivation: carried forward unchanged from the 2025 file; the 2026 form is not yet published.
# British Columbia tax reduction slope, 2026 tax year (Form BC428 line 77, "Applicable rate 3.56%"):
# a two-band chart the return summary reads line 78 "Line 76 multiplied by the percentage from line
# 77" through (core/amount_by_band_rate). A base of 0.00 gives 0 and a base of one cent or more
# gives the printed 3.56%, so the slope of the tax reduction counts in the marginal tax rate only
# where line 78 is above zero. The rate is the same figure as `ca-bc/tax_reduction_rate`, which
# rounds half-up to the cent (a rate of 0.0356 would read 0.04), so this chart carries it with no
# rounding. A base exactly at a row's `over` is in the lower band, so the second row starts above
# 0.005: no cent amount is in the first band but 0.00, and 0.01 is in the second.
family: ca-bc/reduction_slope
tax_year: 2026
kind: amount_by_band
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5010-c/5010-c-25e.txt
rounding: none
rows:
  - {over: "0", amount: "0"}
  - {over: "0.005", minus: "0", rate: "0.0356", plus: "0"}
