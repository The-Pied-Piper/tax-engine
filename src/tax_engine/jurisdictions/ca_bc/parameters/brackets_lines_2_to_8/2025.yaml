# British Columbia 2025 brackets, Form BC428 (British Columbia Tax, 5010-c-25e) Part A, lines 2 to 8,
# columns 1 to 4. Column headings: "Column 1: Line 1 is $49,279 or less"; "Column 2: Line 1 is more
# than $49,279 but not more than $98,560"; "Column 3: Line 1 is more than $98,560 but not more than
# $113,158"; "Column 4: Line 1 is more than $113,158 but not more than $137,407". In every column:
# line 3 the column's lower bound (0.00, 49,279.00, 98,560.00, 113,158.00); line 5 "Rate" (5.06%,
# 7.70%, 10.50%, 12.29%); line 7 the printed constant (0.00, 2,493.52, 6,288.15, 7,820.94). Lines 3, 5
# and 7 are the printed figures; lines 2, 4, 6 and 8 are computed.
# Each bracket's `tax_at_start` is the line 7 constant of its column, taken as printed: the
# constants are not recomputed from the rates, and not rounded.
# This dataset has no rounding rule, as the form states none. The take-home build rounds line 6
# half-up to the cent in its own part (ca-bc/cent_rounding).
# `up_to`: the table covers line 1 of 137,407.00 or less. Above it lines 9 to 15 apply and this
# line is blank.
family: ca-bc/brackets_lines_2_to_8
tax_year: 2025
kind: brackets
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5010-c/5010-c-25e.txt
rounding: none
up_to: "137407.00"
brackets:
  - {from: "0.00", rate: "0.0506", tax_at_start: "0.00"}
  - {from: "49279.00", rate: "0.077", tax_at_start: "2493.52"}
  - {from: "98560.00", rate: "0.105", tax_at_start: "6288.15"}
  - {from: "113158.00", rate: "0.1229", tax_at_start: "7820.94"}
