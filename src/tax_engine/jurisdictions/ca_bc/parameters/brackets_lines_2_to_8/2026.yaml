# Provisional: taken from T4127 (Jul 2026); to be confirmed against the 2026 form text when CRA publishes it.
# Derivation: thresholds are T4127 Table 8.1 (BC indexes at its own 2.2%, not the federal factor) and the rates are as printed there, the first rate rising from 5.06% to 5.60% for 2026 on (the July edition only; the January edition still shows 5.06%). tax_at_start is derived, not printed: the cumulative tax on the earlier brackets at those rates, rounded half-up to the cent (reproduces the 2025 printed constants).
# British Columbia income tax brackets, 2026 tax year, Form BC428 (CRA 5010-c) Part A, lines 2 to 8,
# from T4127 (Jul 2026), Table 8.1. The 2026 BC428 is not yet published, so these figures are not
# yet confirmed against it.
# Thresholds 50,363 / 100,728 / 115,648 / 140,430 / 190,405 / 265,545 across both line sets.
# `up_to`: the table covers line 1 of 140,430.00 or less. Above it lines 9 to 15 apply and this
# line is blank. The split between the two files moves from 137,407 (2025) to 140,430, which is
# this file's `up_to` and the first lower bound of the lines 9 to 15 file.
family: ca-bc/brackets_lines_2_to_8
tax_year: 2026
kind: brackets
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pub/t4127-jul/t4127-07-26e.pdf
rounding: none
up_to: "140430.00"
brackets:
  - {from: "0.00", rate: "0.056", tax_at_start: "0.00"}
  - {from: "50363.00", rate: "0.077", tax_at_start: "2820.33"}
  - {from: "100728.00", rate: "0.105", tax_at_start: "6698.43"}
  - {from: "115648.00", rate: "0.1229", tax_at_start: "8265.03"}
