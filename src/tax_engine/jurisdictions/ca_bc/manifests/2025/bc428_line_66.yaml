# Form BC428 (British Columbia Tax and Credits, 2025, 5010-c-25e) line 66 (ca-bc/bc428): "Line 66
# and line 61540: Amount from line 40427 of your return ^ multiplied by 34.9% = ^". The 34.9% is a
# printed rate, held in the `ca-bc/minimum_tax_rate` dataset, so line 66 is one calculation: 34.9%
# of the amount, rounded half-up to the cent. The amount (box A) is the T1's line 40427: the T1 owns
# the input and exports the line (`ca/minimum_tax_carryover_line_40427`), so the first step totals
# that export (a form reads another form's export only as a record list) and the second applies the
# rate.
form:
  name: ca-bc/bc428
capabilities:
  - name: core/record_total
    title: "Amount from line 40427 of your return"
    reference: "66 box A"
    unit: ca/cad
    consumes:
      records: ca/t1_lines_copied_by_provinces.minimum_tax_carryover_line_40427
    produces:
      output: ca-bc/bc428_minimum_tax_carryover_amount
  - name: core/apply_rate
    title: "British Columbia minimum tax carryover"
    reference: "66 box B"
    unit: ca/cad
    params:
      rate: ca-bc/minimum_tax_rate
    consumes:
      base: ca-bc/bc428_minimum_tax_carryover_amount
    produces:
      output: ca-bc/bc428_minimum_tax_carryover_line_66
