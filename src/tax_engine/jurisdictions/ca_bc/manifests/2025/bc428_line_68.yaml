# Form BC428 (CRA 5010-C) line 68 "Line 68: Line 63 minus line 67 (if negative, enter "0") = ^". One
# core/subtract_not_below_zero step: the tax with split income (line 63,
# `ca-bc/bc428_tax_with_split_income_line_63`) less the total (line 67, `ca-bc/bc428_total_line_67`),
# not below 0. Both lines are always computed, so there is no blank rule. The form prints no title
# for the line, so the step has none.
form:
  name: ca-bc/bc428
capabilities:
  - name: core/subtract_not_below_zero
    reference: "68"
    unit: ca/cad
    params:
      rounding: ca-bc/cent_rounding
    consumes:
      amount: ca-bc/bc428_tax_with_split_income_line_63
      less: ca-bc/bc428_total_line_67
    produces:
      output: ca-bc/bc428_tax_after_credits_line_68
