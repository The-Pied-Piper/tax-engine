# Form BC428 line 74: "Enter your net income from line 23600 of your return." The form names no
# label for the line, so the step has no title. The amount arrives as a record list from the T1
# (net income, line 23600 after its floor), so the one step is core/record_total over those records.
form:
  name: ca-bc/bc428
capabilities:
  - name: core/record_total
    reference: "74"
    unit: ca/cad
    consumes:
      records: ca/t1_taxable_income.net_income
    produces:
      output: ca-bc/bc428_net_income_line_74
