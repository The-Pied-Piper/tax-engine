# British Columbia 2025 take-home manifest: the return's identity and its exports (the refund or balance
# owing, the average income tax rate and the marginal tax rate). The caller gives
# the gross salary and nothing else (salary.yaml). British Columbia's own forms are in parts
# beside this one, so a line ticket adds only its own part file; the federal forms are imported by
# name below, their parts in the `ca` package (`ca/forms/<name>/`).
#
# British Columbia builds two forms: `ca-bc/bc428` (all of BC428, lines 1 to 91, one form), which
# supplies `ca/provincial_tax.amount` for T1 line 42800, and `ca-bc/bc479` (BC479), which supplies
# the provincial credits figure for T1 line 47900.
#
# The default form's first export is T1 line 167, refund or balance owing (positive is owing, negative
# is a refund). British Columbia uses the standard federal CPP and EI (no QPP), so Schedule 8 and
# T2204 are imported unchanged. It has no Schedule 6 edition of its own, so the federal Schedule 6
# is imported unchanged.
#
# British Columbia is not yet listed in `registrations.JURISDICTIONS`: the startup check builds
# every listed manifest, and this one is partial until the BC428 and BC479 forms exist (T1 needs
# `ca/provincial_tax.amount`, which no British Columbia form supplies yet). Its input is in
# salary.yaml, not here. The end-to-end ticket lists it.
jurisdiction: CA-BC
version: 1
valid_from_tax_year: 2025
# The title is the engine's own wording for the default form, not a printed form heading.
title: Return summary
outputs:
  - ca/refund_or_balance_owing
  - ca-bc/average_income_tax_rate
  - ca-bc/marginal_tax_rate
capabilities: []
imports:
  - ca/t1_taxable_income
  - ca/t1_tax_and_credits
  - ca/schedule_6
  - ca/schedule_8
  - ca/t2204
