# BC479 (2025) line 20's printed maximum. Form BC479 (CRA 5010-TC): "Line 20: Add lines 17 and 18.
# (maximum $120,000)". One core/credit_amount step supplies the maximum from the
# `ca-bc/venture_capital_credit_line_20_maximum` dataset; it is not a line of the form, so it has no
# reference, and its title is plain words, not printed wording.
form:
  name: ca-bc/bc479
capabilities:
  - name: core/credit_amount
    title: "Most you can claim on line 20"
    unit: ca/cad
    params:
      amount: ca-bc/venture_capital_credit_line_20_maximum
    produces:
      output: ca-bc/bc479_venture_capital_credit_line_20_maximum
