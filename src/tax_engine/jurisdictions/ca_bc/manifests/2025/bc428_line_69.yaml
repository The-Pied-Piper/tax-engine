# Form BC428 (British Columbia Tax and Credits, 2025, 5010-c-25e) line 69 (ca-bc/bc428): "British
# Columbia additional tax for minimum tax purposes: Line 69: Amount from line 14 of Part 7 of Form
# T691 ^ multiplied by 34.9% = ^". The 34.9% is a printed rate, held in the `ca-bc/minimum_tax_rate`
# dataset, so line 69 is one calculation: 34.9% of the amount, rounded half-up to the cent. The
# amount (box A) is the T691's Part 7 line 14, which the T691 form computes and exports
# (`ca/t691_additional_taxes_for_minimum_tax_carryover_line_14`), so the first step totals that
# export (a form reads another form's export only as a record list) and the second applies the rate.
# This is line 14 (line 1 minus line 13, not below 0), not line 1 minus line 2, which AB428, MB428
# and SK428 print. The form does not name the boxes; "box A" and "box B" are the owner's naming.
form:
  name: ca-bc/bc428
capabilities:
  - name: core/record_total
    title: "Amount from line 14 of Part 7 of Form T691"
    reference: "69 box A"
    unit: ca/cad
    consumes:
      records: ca/t691.t691_additional_taxes_for_minimum_tax_carryover_line_14
    produces:
      output: ca-bc/bc428_additional_minimum_tax_amount_line_69
  - name: core/apply_rate
    title: "British Columbia additional tax for minimum tax purposes"
    reference: "69 box B"
    unit: ca/cad
    params:
      rate: ca-bc/minimum_tax_rate
    consumes:
      base: ca-bc/bc428_additional_minimum_tax_amount_line_69
    produces:
      output: ca-bc/bc428_additional_minimum_tax_line_69
