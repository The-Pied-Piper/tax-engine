# BC479 (2025) inputs a salary-only caller does not give.
# Line 2: "Total of the universal child care benefit (UCCB) repayment (line 21300 of the return) and
# the registered disability savings plan (RDSP) income repayment (included on line 23200 of the
# return)" (5010-tc), column 1 (you). A salary-only caller has no such repayment, so a request that
# leaves the line out is read as blank.
form:
  name: ca-bc/bc479
inputs:
  - name: ca-bc/bc479_uccb_rdsp_repayments_line_2
    title: "Total of the universal child care benefit (UCCB) repayment (line 21300 of the return) and the registered disability savings plan (RDSP) income repayment (included on line 23200 of the return)"
    reference: "2"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 2: Total of the universal child care benefit (UCCB) repayment (line 21300 of the return) and the registered disability savings plan (RDSP) income repayment (included on line 23200 of the return)'
