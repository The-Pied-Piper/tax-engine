# Form BC428 (CRA 5010-C) line 80 "Line 80: Line 72 minus line 79 (if negative, enter "0") = ^". One
# core/subtract_not_below_zero step: the tax after the foreign tax credit (line 72,
# `ca-bc/bc428_tax_after_foreign_credit_line_72`) less the British Columbia tax reduction (line 79,
# `ca-bc/bc428_british_columbia_tax_reduction_line_79`), not below 0. The form prints no title for
# the line, so the step has none.
form:
  name: ca-bc/bc428
capabilities:
  - name: core/subtract_not_below_zero
    reference: "80"
    unit: ca/cad
    params:
      rounding: ca-bc/cent_rounding
    consumes:
      amount: ca-bc/bc428_tax_after_foreign_credit_line_72
      less: ca-bc/bc428_british_columbia_tax_reduction_line_79
    produces:
      output: ca-bc/bc428_tax_after_reduction_line_80
