# Form BC428 (British Columbia Tax, 2025, 5010-c-25e) Part A, line 3. Each of the four columns
# prints "Line 3:" with its lower bound: 0.00, 49,279.00, 98,560.00 and 113,158.00, under "Column 1:
# Line 1 is $49,279 or less", "Column 2: Line 1 is more than $49,279 but not more than $98,560",
# "Column 3: Line 1 is more than $98,560 but not more than $113,158" and "Column 4: Line 1 is more
# than $113,158 but not more than $137,407". Line 3 is the printed lower bound of the column that
# line 1 falls in. Above 137,407 the table does not apply (lines 9 to 15 do), so line 3 is blank.
#
# Line 2 is a copy of line 1 and has no step of its own: line 3 reads line 1 directly.
form:
  name: ca-bc/bc428
capabilities:
  - name: core/bracket_column_lower_bound
    reference: "3"
    unit: ca/cad
    params:
      schedule: ca-bc/brackets_lines_2_to_8
    consumes:
      base: ca-bc/bc428_taxable_income_line_1
    produces:
      output: ca-bc/bc428_bracket_lower_bound_line_3
