# Form BC428 (British Columbia Tax, 2025, 5010-c-25e) Part C, line 61 "Line 61: British Columbia
# tax on taxable income from line 8 or 15 ^". Under line 8 the form says "If you completed lines 2
# to 8 for a column above, enter the amount from line 8 on line 61 and continue on line 16", and
# under line 15 "If you completed lines 9 to 15 for a column above, enter the amount from line 15
# on line 61 and continue on line 16". A taxable income is in one table only, so the other line is
# blank; this step reads both lines and gives the one that has a figure.
form:
  name: ca-bc/bc428
capabilities:
  - name: ca-bc/tax_on_taxable_income
    title: "British Columbia tax on taxable income from line 8 or 15"
    reference: "61"
    unit: ca/cad
    consumes:
      line_8: ca-bc/bc428_tax_on_taxable_income_line_8
      line_15: ca-bc/bc428_tax_on_taxable_income_line_15
    blank:
      line_8: compute
      line_15: compute
    produces:
      output: ca-bc/bc428_british_columbia_tax_on_taxable_income_line_61
