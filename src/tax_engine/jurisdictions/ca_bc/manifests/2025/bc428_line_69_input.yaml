# BC428 (2025) inputs a salary-only caller does not give.
# Line 69: "British Columbia additional tax for minimum tax purposes: Line 69: Amount from line 14 of
# Part 7 of Form T691 multiplied by 34.9% =" (Form BC428 5010-c). A caller with no minimum tax to
# report leaves the line out, so a request that leaves it out is read as 0, not blank, because the
# next step multiplies it by the printed rate with core/apply_rate and needs a base. The 34.9%
# multiply is a separate step.
inputs:
  - name: ca-bc/bc428_additional_minimum_tax_amount_line_69
    title: "Amount from line 14 of Part 7 of Form T691"
    reference: "69"
    unit: ca/cad
    required: false
    default: "0"
    basis: 'Line 69: Amount from line 14 of Part 7 of Form T691'
