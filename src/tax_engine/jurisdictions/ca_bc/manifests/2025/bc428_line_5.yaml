# Form BC428 (British Columbia Tax, 2025, 5010-c-25e) Part A, line 5. Each of the four columns
# prints "Line 5:" with its rate: "Line 5: Rate 5.06%", "Line 5: Rate 7.7%", "Line 5: Rate 10.5%" and
# "Line 5: Rate 12.29%", under "Column 1: Line 1 is $49,279 or less", "Column 2: Line 1 is more than
# $49,279 but not more than $98,560", "Column 3: Line 1 is more than $98,560 but not more than
# $113,158" and "Column 4: Line 1 is more than $113,158 but not more than $137,407". Line 5 is the
# printed rate of the column that line 1 falls in. Above 137,407 the table does not apply (lines 9
# to 15 do), so line 5 is blank. Line 1 is read from its producing part (bc428_line_1.yaml), so
# this part does not produce it again.
form:
  name: ca-bc/bc428
capabilities:
  - name: core/bracket_column_rate
    title: "Rate"
    reference: "5"
    params:
      schedule: ca-bc/brackets_lines_2_to_8
    consumes:
      base: ca-bc/bc428_taxable_income_line_1
    produces:
      output: ca-bc/bc428_bracket_rate_line_5
