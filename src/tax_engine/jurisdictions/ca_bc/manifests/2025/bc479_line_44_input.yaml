# BC479 (2025) line 44's input, which a salary-only caller does not give.
# Form text: "Line 44 and line 60576: Line 38 minus line 43 (if negative, enter "0")" (5010-tc), under
# the heading "British Columbia renter's tax credit". The rent table, line 37 and lines 38 to 43 are
# not built, so a salary-only caller has no rent and a request that leaves the line out is read as
# blank; the step that consumes it reads that blank as 0. The printed $400 maximum (line 38) is not
# enforced here.
inputs:
  - name: ca-bc/bc479_renters_credit_line_44
    title: "British Columbia renter's tax credit"
    reference: "44"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 44 and line 60576: Line 38 minus line 43 (if negative, enter "0") (maximum $400)'
