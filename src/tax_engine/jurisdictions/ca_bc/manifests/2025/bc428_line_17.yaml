# Form BC428 (CRA 5010-C, .txt) line 17 and line 58080: "Age amount (if you were born in 1960 or earlier) (use Worksheet BC428) (maximum $5,799)". Built as ca-ns/ns428 line 10, ca-nl/nl428_credits line 17 and ca-pe/pe428 line 10 are: a core/first_record_count step that reads the T1's year of birth (`ca/t1_lines_copied_by_provinces.birth_year`, entered once on the T1; blank passes on), a ca/count_by_conditions step that works out 1 or 0 from that year (a blank year passes on blank, read as 0 by the steps below; not a line of the form), a core/times_count step of worksheet line 7 by that count (blank read as 0), and a core/at_most step that checks the printed maximum (worksheet line 1) and is line 17. An amount above the maximum is refused, not capped. Worksheet lines 1 to 7 are in the two parts beside this one.
form:
  name: ca-bc/bc428
capabilities:
- name: core/first_record_count
  title: Year of birth
  consumes:
    records: ca/t1_lines_copied_by_provinces.birth_year
  blank:
    records:
      ca/birth_year: pass_on
  produces:
    output: ca-bc/bc428_birth_year
- name: ca/count_by_conditions
  title: Born in 1960 or earlier
  params:
    conditions: ca-bc/born_in_1960_or_earlier_conditions
  consumes:
    counts:
    - ca-bc/bc428_birth_year
    amounts: []
  blank:
    counts: pass_on
  produces:
    output: ca/born_in_1960_or_earlier_checked
- name: core/times_count
  title: Age amount before the printed maximum
  unit: ca/cad
  params:
    rounding: ca-bc/cent_rounding
  consumes:
    amount: ca-bc/worksheet_bc428_age_amount_line_7
    count: ca/born_in_1960_or_earlier_checked
  produces:
    output: ca-bc/bc428_age_amount_claimed_line_17
  blank:
    count: '0'
- name: core/at_most
  title: Age amount
  reference: '17'
  unit: ca/cad
  consumes:
    amount: ca-bc/bc428_age_amount_claimed_line_17
    bound: ca-bc/worksheet_bc428_age_amount_maximum_line_1
  blank:
    amount: pass_on
  produces:
    output: ca-bc/bc428_age_amount_line_17
