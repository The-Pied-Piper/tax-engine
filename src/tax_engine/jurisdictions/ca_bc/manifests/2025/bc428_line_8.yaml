# Form BC428 (British Columbia Tax, 2025, 5010-c-25e) Part A, line 8. Each of the four columns
# prints "Line 8: Line 6 plus line 7 British Columbia tax on taxable income = ^", under "Column 1:
# Line 1 is $49,279 or less", "Column 2: Line 1 is more than $49,279 but not more than $98,560",
# "Column 3: Line 1 is more than $98,560 but not more than $113,158" and "Column 4: Line 1 is more
# than $113,158 but not more than $137,407". It sums line 6 (`ca-bc/bc428_bracket_tax_line_6`) and
# line 7 (`ca-bc/bc428_bracket_tax_at_start_line_7`). Line 8 is blank when lines 6 and 7 are blank.
form:
  name: ca-bc/bc428
capabilities:
  - name: core/sum
    title: "British Columbia tax on taxable income"
    reference: "8"
    unit: ca/cad
    params:
      rounding: ca-bc/cent_rounding
    consumes:
      parts:
        [ca-bc/bc428_bracket_tax_line_6, ca-bc/bc428_bracket_tax_at_start_line_7]
    blank:
      ca-bc/bc428_bracket_tax_line_6: pass_on
      ca-bc/bc428_bracket_tax_at_start_line_7: pass_on
    produces:
      output: ca-bc/bc428_tax_on_taxable_income_line_8
