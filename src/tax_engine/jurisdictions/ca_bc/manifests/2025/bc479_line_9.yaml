# Form BC479 (2025, CRA 5010-TC) line 9. "Line 9 and line 60330: Basic sales tax credit Claim $75".
# The form prints no age condition; the BC guide 5010-PC (Form BC479, Sales tax credit) does: "You can claim this credit if, on
# December 31, 2025, you were a resident of British Columbia and you met any of the following conditions: You were 19 years of
# age or older / You had a spouse or common-law partner / You were a parent of a child". The engine models a filer with no
# spouse or child, so a filer under 19 gets 0.00. Built as MB479 line 8 is:
# 1. core/first_record_count: the T1's "aged 19 or older" flag (`ca/t1_lines_copied_by_provinces.age_19_or_older`, worked out once
#    from the year of birth; blank passes on and is read as 1 by step 3, so a request that leaves the year out claims the credit;
#    not a line of the form).
# 2. core/credit_amount: the printed $75, the `ca-bc/sales_tax_credit_basic` dataset; not a line of the form.
# 3. core/times_count: that claim times the flag is line 9: 75.00 when 19 or older, 0.00 when under 19.
form:
  name: ca-bc/bc479
capabilities:
  - name: core/first_record_count
    title: Aged 19 or older at the end of the year
    consumes:
      records: ca/t1_lines_copied_by_provinces.age_19_or_older
    blank:
      records:
        ca/age_19_or_older: pass_on
    produces:
      output: ca-bc/bc479_age_19_or_older
  - name: core/credit_amount
    title: "Basic sales tax credit claim"
    unit: ca/cad
    params:
      amount: ca-bc/sales_tax_credit_basic
    produces:
      output: ca-bc/bc479_basic_sales_tax_credit_claim_line_9
  - name: core/times_count
    title: "Basic sales tax credit"
    reference: "9"
    unit: ca/cad
    params:
      rounding: ca-bc/cent_rounding
    consumes:
      amount: ca-bc/bc479_basic_sales_tax_credit_claim_line_9
      count: ca-bc/bc479_age_19_or_older
    blank:
      count: "1"
    produces:
      output: ca-bc/bc479_basic_sales_tax_credit_line_9
