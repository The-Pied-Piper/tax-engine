# Form BC479 (2025) line 14, the printed maximum. Form BC479 (CRA 5010-TC): "Line 14: Enter your home
# renovation expenses from line 5 of your Schedule BC(S12). (maximum $10,000)". The $10,000 is a
# figure of the form, not an input, so core/credit_amount supplies it from the
# `ca-bc/home_renovation_expenses_maximum` dataset. It is not a line of the form, so it has no title
# and no reference; the line number is carried by the final step for the line, the multiply step in
# bc479_line_14.yaml, not by this step or by bc479_line_14_check.yaml.
form:
  name: ca-bc/bc479
capabilities:
  - name: core/credit_amount
    unit: ca/cad
    params:
      amount: ca-bc/home_renovation_expenses_maximum
    produces:
      output: ca-bc/bc479_home_renovation_expenses_maximum
