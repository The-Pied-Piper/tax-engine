# Form BC479 (2025, CRA 5010-TC) line 11. Line 11: "Line 9 plus line 10 = ^".
#
# The form prints no title after the line number, so the step has none. Line 9
# (`ca-bc/bc479_basic_sales_tax_credit_line_9`) is the basic sales tax credit. Line 10
# (`ca-bc/bc479_spouse_additional_credit_line_10`) is an optional input that a salary-only caller
# leaves out; the step reads it as blank, then as 0, by the blank rule below.
form:
  name: ca-bc/bc479
capabilities:
  - name: core/sum
    reference: "11"
    unit: ca/cad
    params:
      rounding: ca-bc/cent_rounding
    consumes:
      parts:
        [
          ca-bc/bc479_basic_sales_tax_credit_line_9,
          ca-bc/bc479_spouse_additional_credit_line_10,
        ]
    blank:
      ca-bc/bc479_spouse_additional_credit_line_10: "0"
    produces:
      output: ca-bc/bc479_credit_before_reduction_line_11
