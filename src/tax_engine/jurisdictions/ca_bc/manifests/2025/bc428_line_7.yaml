# Form BC428 (British Columbia Tax, 2025, 5010-c-25e) Part A, line 7. Each of the four columns
# prints "Line 7:" with the tax at the column's start: 0.00, 2,493.52, 6,288.15 and 7,820.94, under
# "Column 1: Line 1 is $49,279 or less", "Column 2: Line 1 is more than $49,279 but not more than
# $98,560", "Column 3: Line 1 is more than $98,560 but not more than $113,158" and "Column 4: Line 1
# is more than $113,158 but not more than $137,407". Line 7 is the printed tax at the start of the
# column that line 1 falls in: the amount of that column, not a figure computed from its rates.
# Above 137,407 the table does not apply (lines 9 to 15 do), so line 7 is blank.
#
# Line 2 is a copy of line 1 and has no step of its own: line 7 reads line 1 directly.
form:
  name: ca-bc/bc428
capabilities:
  - name: core/bracket_column_tax_at_start
    reference: "7"
    unit: ca/cad
    params:
      schedule: ca-bc/brackets_lines_2_to_8
    consumes:
      base: ca-bc/bc428_taxable_income_line_1
    produces:
      output: ca-bc/bc428_bracket_tax_at_start_line_7
