# BC479 (2025) inputs a salary-only caller does not give.
# Line 25: "Add lines 20, 21, and 23. (maximum $300,000)" (5010-tc). A single filer has no venture
# capital certificates, so a request that leaves the line out is read as blank; the step that
# consumes it reads that blank as 0. The printed maximum is stated, not enforced.
form:
  name: ca-bc/bc479
inputs:
  - name: ca-bc/bc479_venture_capital_credit_line_25
    reference: "25"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 25: Add lines 20, 21, and 23. (maximum $300,000)'
