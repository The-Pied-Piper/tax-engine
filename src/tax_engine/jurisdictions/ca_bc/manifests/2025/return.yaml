# The British Columbia take-home return: T1 line 167 "Refund or balance owing" (positive is owing,
# negative is a refund). The T1 form exports it, and another form's export is read only as a record
# list, so the first step is core/record_total over the T1 export, totalling the one amount into the
# return's own `ca/refund_or_balance_owing`.
#
# The return's second output is the average tax rate on the take-home basis. The federal form
# `ca/take_home_average_rate` works it out once for every province (income tax, CPP and EI over the
# salary), and the return reads its export `ca/average_tax_rate` with one core/record_total.
#
# The third output is the marginal tax rate on the take-home basis: the change in T1 line 43500
# plus CPP (Schedule 8 lines 25, 12 and 22) plus EI (T2204 line 16) per further dollar of salary,
# for a salary-only filer with no paid credits. It is calculated with the rates of the forms, not by
# running the return twice: a sum of the rates that apply at the salary, one capability per line,
# every figure exact (`ca-bc/exact_rounding` rounds nothing). No form prints any of these figures,
# so the steps below have no title and no line reference, and only line 167 carries a line
# reference.
#
# The federal half is the federal form `ca/take_home_marginal_rates` (imported by the manifest,
# after the T1 forms), which works from the salary alone. This return reads its four exports, each
# totalled by core/record_total into its own figure: the net income rate (the part of a further
# dollar left in the net income and the taxable income: 1 less the CPP first additional and second
# additional rates), the credit-earning contribution rate (the CPP base rate plus the EI rate), the
# federal marginal rate (the federal tax on a further dollar after its credits, counted only where
# the basic federal tax is above zero) and the contribution rate (the CPP base, first additional,
# second additional and EI rates). The rest is British Columbia's own.
#
# Credits on the contributions. The CPP base contribution (T1 line 30800) and the EI premium (line
# 31200) earn the British Columbia non-refundable credit rate (BC428 line 55, the `ca-bc/credit_rate`
# dataset), so the credit-earning contribution rate times it is the British Columbia tax a further
# dollar of contributions takes off. The rate is the dataset's as it is: its cent rounding is for
# the credit boxes.
#
# British Columbia. The bracket rate is printed on BC428 line 5 (table 1, lines 2 to 8, taxable
# income up to 137,407) or on line 12 (table 2, lines 9 to 15, above it); the other is blank. BC428
# exports both, each is totalled into the return's own kind with a blank read as 0, and core/sum
# adds them into the British Columbia bracket rate. It is multiplied by the net income rate (the
# part of a further dollar left in the taxable income) and the credit on the contributions comes
# off.
#
# The tax reduction (BC428 lines 73 to 79, T4127 section S for British Columbia: CRA payroll
# deductions formulas, January 2025 edition) is 562.00 at a net income up to 25,020, falls by 3.56%
# of the excess over 25,020, and is zero from 40,807. Between those two figures it makes the tax
# rise 3.56 points faster than the bracket rate alone, per dollar of net income (the reduction
# raises the marginal rate, it does not lower it). BC428 line 79 is totalled and gated (the
# reduction is above zero, so the range ends at a net income of 40,807); BC428 line 78 "Line 76
# multiplied by the percentage from line 77" is read through the `ca-bc/reduction_slope` dataset
# (the printed 3.56% where line 78 is above zero, so the range starts above a net income of
# 25,020, and 0 where it is not); the two multiply into the phase-out rate, which is then taken
# times the net income rate, since line 76 follows the net income, not the salary; core/sum adds
# that to the rate after the credits.
#
# `ca-bc/reduction_slope` is a dataset of its own, apart from `ca-bc/tax_reduction_rate` (BC428
# line 77 itself, the same 3.56%): that one rounds half-up to the cent, as it feeds a dollars-and-
# cents box, and a rate of 0.0356 would read 0.04. The slope reads line 78, which is rounded to the
# cent, so it starts at the first cent of line 78, which is within cents of the printed net income
# of 25,020.
#
# The age amount (BC428 line 17, Worksheet BC428 "Line 58080 - Age amount") is one of the British
# Columbia credits and falls by the printed 15% (`ca-bc/age_rate`) of the net income over its
# threshold (worksheet line 4), until it is 0, so a filer born in 1960 or earlier pays more
# British Columbia tax on a further dollar in that range: the fall of the credit times the British
# Columbia credit rate. BC428's exports line 4 and the age amount claimed (line 17 before the
# printed maximum check) are totalled; each is gated through `ca-bc/marginal_rate_gate` (the net
# income is over the threshold, an age amount is still claimed: 0 for a filer under 65 or with no
# birth year); the printed rate times both gates, times the net income rate (line 2 follows the
# net income), times the British Columbia credit rate is the extra rate, which core/sum adds to the
# rate with the reduction, so the British Columbia gate on line 80 governs it like the other
# credits.
#
# The whole British Columbia rate counts only where BC428 line 80 "Line 72 minus line 79 (if
# negative, enter "0")" is above zero, through the `ca-bc/marginal_rate_gate` dataset (0 where that
# tax is 0.00 and 1 from one cent): where the credits and the reduction take all the tax a further
# dollar adds none. Line 80 is read, not line 91: lines 81 and later (logging tax credit,
# political contributions, ESOP and EVCC, mining credit) come back only when filing and are not
# payroll terms. British Columbia has no surtax and no health premium.
#
# The last step adds the federal marginal rate, the British Columbia marginal rate and the
# contribution rate with core/sum into `ca-bc/marginal_tax_rate`; it is rounded half-up to
# 0.0001 like the average rate, is not printed on the form and has no title or line.
capabilities:
  - name: core/record_total
    title: "Refund or balance owing"
    reference: "167"
    unit: ca/cad
    consumes:
      records: ca/t1_tax_and_credits.refund_or_balance_owing
    produces:
      output: ca/refund_or_balance_owing
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca/take_home_average_rate.average_tax_rate
    produces:
      output: ca-bc/average_tax_rate
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca/take_home_marginal_rates.marginal_net_income_rate
    produces:
      output: ca-bc/marginal_net_income_rate
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca/take_home_marginal_rates.marginal_credit_contribution_rate
    produces:
      output: ca-bc/marginal_credit_contribution_rate
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca/take_home_marginal_rates.marginal_federal_rate
    produces:
      output: ca-bc/marginal_federal_rate
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca/take_home_marginal_rates.marginal_contribution_rate
    produces:
      output: ca-bc/marginal_contribution_rate
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca-bc/bc428.bc428_bracket_rate_line_5
    blank:
      records:
        ca-bc/bc428_bracket_rate_line_5: "0"
    produces:
      output: ca-bc/british_columbia_bracket_rate_line_5_return
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca-bc/bc428.bc428_bracket_rate_line_12
    blank:
      records:
        ca-bc/bc428_bracket_rate_line_12: "0"
    produces:
      output: ca-bc/british_columbia_bracket_rate_line_12_return
  - name: core/sum
    unit: core/percent
    params:
      rounding: ca-bc/exact_rounding
    consumes:
      parts:
        - ca-bc/british_columbia_bracket_rate_line_5_return
        - ca-bc/british_columbia_bracket_rate_line_12_return
    produces:
      output: ca-bc/british_columbia_bracket_rate_return
  - name: core/rate_figure
    unit: core/percent
    params:
      rate: ca-bc/credit_rate
    produces:
      output: ca-bc/marginal_british_columbia_credit_rate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-bc/exact_rounding
    consumes:
      base: ca-bc/marginal_credit_contribution_rate
      rate: ca-bc/marginal_british_columbia_credit_rate
    produces:
      output: ca-bc/marginal_british_columbia_contribution_credit_rate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-bc/exact_rounding
    consumes:
      base: ca-bc/british_columbia_bracket_rate_return
      rate: ca-bc/marginal_net_income_rate
    produces:
      output: ca-bc/marginal_british_columbia_bracket_rate
  - name: core/subtract
    unit: core/percent
    params:
      rounding: ca-bc/exact_rounding
    consumes:
      amount: ca-bc/marginal_british_columbia_bracket_rate
      less: ca-bc/marginal_british_columbia_contribution_credit_rate
    produces:
      output: ca-bc/marginal_british_columbia_rate_after_credits
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-bc/bc428.worksheet_bc428_age_amount_line_4
    produces:
      output: ca-bc/british_columbia_age_income_over_threshold_return
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-bc/bc428.bc428_age_amount_claimed_line_17
    produces:
      output: ca-bc/british_columbia_age_amount_claimed_return
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-bc/marginal_rate_gate
    consumes:
      base: ca-bc/british_columbia_age_income_over_threshold_return
    produces:
      output: ca-bc/british_columbia_age_threshold_gate
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-bc/marginal_rate_gate
    consumes:
      base: ca-bc/british_columbia_age_amount_claimed_return
    produces:
      output: ca-bc/british_columbia_age_amount_gate
  - name: core/rate_figure
    unit: core/percent
    params:
      rate: ca-bc/age_rate
    produces:
      output: ca-bc/marginal_british_columbia_age_rate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-bc/exact_rounding
    consumes:
      base: ca-bc/marginal_british_columbia_age_rate
      rate: ca-bc/british_columbia_age_threshold_gate
    produces:
      output: ca-bc/marginal_british_columbia_age_reduction_rate_over_threshold
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-bc/exact_rounding
    consumes:
      base: ca-bc/marginal_british_columbia_age_reduction_rate_over_threshold
      rate: ca-bc/british_columbia_age_amount_gate
    produces:
      output: ca-bc/marginal_british_columbia_age_reduction_rate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-bc/exact_rounding
    consumes:
      base: ca-bc/marginal_british_columbia_age_reduction_rate
      rate: ca-bc/marginal_net_income_rate
    produces:
      output: ca-bc/marginal_british_columbia_age_phase_down_net_income_rate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-bc/exact_rounding
    consumes:
      base: ca-bc/marginal_british_columbia_age_phase_down_net_income_rate
      rate: ca-bc/marginal_british_columbia_credit_rate
    produces:
      output: ca-bc/marginal_british_columbia_age_credit_rate
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-bc/bc428.bc428_british_columbia_tax_reduction_line_79
    produces:
      output: ca-bc/british_columbia_tax_reduction_return
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-bc/marginal_rate_gate
    consumes:
      base: ca-bc/british_columbia_tax_reduction_return
    produces:
      output: ca-bc/british_columbia_reduction_gate
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-bc/bc428.bc428_reduction_clawback_line_78
    produces:
      output: ca-bc/british_columbia_reduction_clawback_return
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-bc/reduction_slope
    consumes:
      base: ca-bc/british_columbia_reduction_clawback_return
    produces:
      output: ca-bc/british_columbia_reduction_slope
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-bc/exact_rounding
    consumes:
      base: ca-bc/british_columbia_reduction_gate
      rate: ca-bc/british_columbia_reduction_slope
    produces:
      output: ca-bc/british_columbia_reduction_phase_out_rate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-bc/exact_rounding
    consumes:
      base: ca-bc/british_columbia_reduction_phase_out_rate
      rate: ca-bc/marginal_net_income_rate
    produces:
      output: ca-bc/marginal_british_columbia_reduction_rate
  - name: core/sum
    unit: core/percent
    params:
      rounding: ca-bc/exact_rounding
    consumes:
      parts:
        - ca-bc/marginal_british_columbia_rate_after_credits
        - ca-bc/marginal_british_columbia_reduction_rate
        - ca-bc/marginal_british_columbia_age_credit_rate
    produces:
      output: ca-bc/british_columbia_bracket_rate_with_reduction
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-bc/bc428.bc428_tax_after_reduction_line_80
    produces:
      output: ca-bc/british_columbia_tax_after_reduction_return
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-bc/marginal_rate_gate
    consumes:
      base: ca-bc/british_columbia_tax_after_reduction_return
    produces:
      output: ca-bc/british_columbia_rate_gate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-bc/exact_rounding
    consumes:
      base: ca-bc/british_columbia_rate_gate
      rate: ca-bc/british_columbia_bracket_rate_with_reduction
    produces:
      output: ca-bc/british_columbia_marginal_rate
  - name: core/sum
    unit: core/percent
    params:
      rounding: ca/take_home_average_rate_rounding
    consumes:
      parts:
        - ca-bc/marginal_federal_rate
        - ca-bc/british_columbia_marginal_rate
        - ca-bc/marginal_contribution_rate
    produces:
      output: ca-bc/marginal_tax_rate
