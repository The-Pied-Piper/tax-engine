# The British Columbia take-home return: T1 line 167 "Refund or balance owing" (positive is owing,
# negative is a refund). The T1 form exports it, and another form's export is read only as a record
# list, so the first step is core/record_total over the T1 export, totalling the one amount into the
# return's own `ca/refund_or_balance_owing`.
#
# The return's second output is the average income tax rate, which no form prints (so its step has
# no title or reference): T1 line 43500 "Total payable" (for the take-home filer, line 143 plus
# line 147's British Columbia tax: the federal and the British Columbia income tax) divided by the
# salary, T1 line 10100 (`ca/return_employment_income`, read from the T1 line 10100 export). T1 exports line 43500, so a core/record_total
# step reads it into the return's own `ca/total_payable`, then core/divide divides it by the
# salary, rounding once with `ca-bc/rate_rounding` (half-up to 0.0001); a salary of 0 gives 0.
#
# The third output is the marginal rate, the income tax rate on a further dollar of salary, built
# as the Alberta and Ontario returns build it, with Ontario's tax reduction chain (CRA payroll
# deductions formulas T4127, January 2025 edition, British Columbia: T2 = T4 + V1 + V2 - S - (P x
# LCP); British Columbia has no V1 or V2, and factor S is the tax reduction payroll applies, the
# printed BC428 line 79). The federal part is read as in the Alberta return: the T1 form exports
# line 73's bracket column rate and line 42900 "Basic federal tax", each totalled into the return's
# own kind, and core/amount_by_band_rate reads line 42900 through the `ca-bc/marginal_rate_gate`
# dataset (0 where the tax is 0.00, 1 from one cent) so that the rate counts only where its own
# tax is above zero; the gate multiplies the rate into `ca/federal_marginal_rate`, exact
# (`ca-bc/exact_rounding`).
#
# The British Columbia bracket rate is printed on BC428 line 5 (table 1, lines 2 to 8, taxable
# income up to 137,407) or on line 12 (table 2, lines 9 to 15, above it); the other is blank. BC428
# exports both, each is totalled into the return's own kind with a blank read as 0, and core/sum
# adds them into the British Columbia bracket rate.
#
# The British Columbia gate reads BC428 line 80 "Line 72 minus line 79 (if negative, enter "0")":
# the British Columbia tax after the credits and the tax reduction that payroll applies, before
# line 81 (logging tax credit), lines 83 and 84 (political contributions), line 88 (ESOP and EVCC)
# and line 90 (mining credit), which only come back when filing and are not payroll terms. It is
# the counterpart of ON428 line 81 and AB428 line 68. Gated through `ca-bc/marginal_rate_gate`, it
# multiplies the bracket rate (with the reduction, below) into `ca-bc/british_columbia_marginal_rate`.
#
# The tax reduction (BC428 lines 73 to 79, T4127 section S for British Columbia) is 562.00 at a net
# income up to 25,020, falls by 3.56% of the excess over 25,020, and is zero from 40,807. Between
# those two figures it makes the tax rise 3.56 points faster than the bracket rate alone (the
# reduction raises the marginal rate, it does not lower it): in that range the British Columbia
# rate is the bracket rate (5.06%) plus 3.56%. The chain is Ontario's: BC428 line 79 is totalled and
# gated (the reduction is above zero, so the range ends at a net income of 40,807); BC428 line 78
# "Line 76 multiplied by the percentage from line 77" is read through the `ca-bc/reduction_slope`
# dataset (the printed 3.56% where line 78 is above zero, so the range starts above a net income of
# 25,020, and 0 where it is not); the two multiply into `ca-bc/british_columbia_reduction_phase_out_rate`,
# exact; and core/sum adds that to the bracket rate into
# `ca-bc/british_columbia_bracket_rate_with_reduction`, before the line 80 gate multiplies it, so a
# reduction that has taken the whole of the tax (line 80 is 0.00) adds nothing. Ontario's clawback
# is the bracket rate itself, so its slope is a multiple of that rate; British Columbia's is the
# printed 3.56% of line 77, so the slope is that rate.
#
# `ca-bc/reduction_slope` is a dataset of its own, apart from `ca-bc/tax_reduction_rate` (BC428
# line 77 itself, the same 3.56%): that one rounds half-up to the cent, as it feeds a dollars-and-
# cents box, and a rate of 0.0356 would read 0.04. The slope reads line 78, which is rounded to the
# cent, so it starts at the first cent of line 78, which is within cents of the printed net income
# of 25,020.
#
# The last step adds the federal and the British Columbia marginal rate with core/sum into
# `ca-bc/marginal_tax_rate`; it is exact too, is not printed on the form and has no title or line.
#
# Only line 167 carries a line reference: the steps below read figures for the rates and are
# engine-internal, so they carry none. Known limit: the rate ignores the tax effect of CPP and EI.
capabilities:
  - name: core/record_total
    title: "Refund or balance owing"
    reference: "167"
    unit: ca/cad
    consumes:
      records: ca/t1_tax_and_credits.refund_or_balance_owing
    produces:
      output: ca/refund_or_balance_owing
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca/t1_tax_and_credits.total_payable
    produces:
      output: ca/total_payable
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca/t1_employment_income.employment_income_line_10100
    produces:
      output: ca/return_employment_income
  - name: core/divide
    unit: core/percent
    params:
      rounding: ca-bc/rate_rounding
    consumes:
      dividend: ca/total_payable
      divisor: ca/return_employment_income
    produces:
      output: ca-bc/average_income_tax_rate
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca/t1_tax_and_credits.federal_bracket_column_rate_line_73
    produces:
      output: ca/federal_bracket_rate_return
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca/t1_tax_and_credits.federal_tax_after_credits
    produces:
      output: ca/federal_tax_after_credits_return
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-bc/marginal_rate_gate
    consumes:
      base: ca/federal_tax_after_credits_return
    produces:
      output: ca/federal_rate_gate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-bc/exact_rounding
    consumes:
      base: ca/federal_rate_gate
      rate: ca/federal_bracket_rate_return
    produces:
      output: ca/federal_marginal_rate
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca-bc/bc428.bc428_bracket_rate_line_5
    blank:
      records:
        ca-bc/bc428_bracket_rate_line_5: "0"
    produces:
      output: ca-bc/british_columbia_bracket_rate_line_5_return
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca-bc/bc428.bc428_bracket_rate_line_12
    blank:
      records:
        ca-bc/bc428_bracket_rate_line_12: "0"
    produces:
      output: ca-bc/british_columbia_bracket_rate_line_12_return
  - name: core/sum
    unit: core/percent
    params:
      rounding: ca-bc/exact_rounding
    consumes:
      parts:
        - ca-bc/british_columbia_bracket_rate_line_5_return
        - ca-bc/british_columbia_bracket_rate_line_12_return
    produces:
      output: ca-bc/british_columbia_bracket_rate_return
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-bc/bc428.bc428_tax_after_reduction_line_80
    produces:
      output: ca-bc/british_columbia_tax_after_reduction_return
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-bc/marginal_rate_gate
    consumes:
      base: ca-bc/british_columbia_tax_after_reduction_return
    produces:
      output: ca-bc/british_columbia_rate_gate
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-bc/bc428.bc428_british_columbia_tax_reduction_line_79
    produces:
      output: ca-bc/british_columbia_tax_reduction_return
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-bc/marginal_rate_gate
    consumes:
      base: ca-bc/british_columbia_tax_reduction_return
    produces:
      output: ca-bc/british_columbia_reduction_gate
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-bc/bc428.bc428_reduction_clawback_line_78
    produces:
      output: ca-bc/british_columbia_reduction_clawback_return
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-bc/reduction_slope
    consumes:
      base: ca-bc/british_columbia_reduction_clawback_return
    produces:
      output: ca-bc/british_columbia_reduction_slope
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-bc/exact_rounding
    consumes:
      base: ca-bc/british_columbia_reduction_gate
      rate: ca-bc/british_columbia_reduction_slope
    produces:
      output: ca-bc/british_columbia_reduction_phase_out_rate
  - name: core/sum
    unit: core/percent
    params:
      rounding: ca-bc/exact_rounding
    consumes:
      parts:
        - ca-bc/british_columbia_bracket_rate_return
        - ca-bc/british_columbia_reduction_phase_out_rate
    produces:
      output: ca-bc/british_columbia_bracket_rate_with_reduction
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-bc/exact_rounding
    consumes:
      base: ca-bc/british_columbia_rate_gate
      rate: ca-bc/british_columbia_bracket_rate_with_reduction
    produces:
      output: ca-bc/british_columbia_marginal_rate
  - name: core/sum
    unit: core/percent
    params:
      rounding: ca-bc/exact_rounding
    consumes:
      parts:
        - ca/federal_marginal_rate
        - ca-bc/british_columbia_marginal_rate
    produces:
      output: ca-bc/marginal_tax_rate
