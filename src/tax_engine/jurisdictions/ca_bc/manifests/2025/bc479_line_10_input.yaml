# BC479 (2025) inputs a salary-only caller does not give.
# Line 10: "Additional credit for your spouse or common-law partner" (5010-tc). A single filer claims
# no spouse or common-law partner credit, so a request that leaves the line out is read as blank; the
# step that consumes it reads that blank as 0.
inputs:
  - name: ca-bc/bc479_spouse_additional_credit_line_10
    title: "Additional credit for your spouse or common-law partner"
    reference: "10"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 10: Additional credit for your spouse or common-law partner'
