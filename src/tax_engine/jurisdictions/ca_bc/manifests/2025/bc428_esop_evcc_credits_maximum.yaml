# BC428 (2025) line 88's printed maximum. Form BC428 (CRA 5010-C): "Line 88: Line 86 plus line 87
# (maximum $2,000)". One core/credit_amount step supplies the maximum from the
# `ca-bc/esop_evcc_credits_maximum` dataset; it is not a line of the form, so it has no reference, and
# its title is plain words, not printed wording, because the sentence of line 88 names it.
form:
  name: ca-bc/bc428
capabilities:
  - name: core/credit_amount
    title: "Most you can claim for ESOP and EVCC credits"
    unit: ca/cad
    params:
      amount: ca-bc/esop_evcc_credits_maximum
    produces:
      output: ca-bc/bc428_esop_evcc_credits_maximum
