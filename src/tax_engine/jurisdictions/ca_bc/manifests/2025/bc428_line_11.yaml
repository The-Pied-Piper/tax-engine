# Form BC428 (British Columbia Tax, 2025, 5010-c-25e) Part A, line 11: Line 9 minus line 10 (cannot
# be negative). Line 9 is a copy of line 1 and has no step of its own, so the step reads line 1
# directly: line 11 is line 1 minus line 10, not below zero. Line 10 is blank when line 1 is
# $137,407 or less, so a blank line 10 is passed on and line 11 is blank there.
form:
  name: ca-bc/bc428
capabilities:
  - name: core/subtract_not_below_zero
    reference: "11"
    unit: ca/cad
    params:
      rounding: ca-bc/cent_rounding
    consumes:
      amount: ca-bc/bc428_taxable_income_line_1
      less: ca-bc/bc428_bracket_lower_bound_line_10
    blank:
      less: pass_on
    produces:
      output: ca-bc/bc428_taxable_income_over_lower_bound_line_11
