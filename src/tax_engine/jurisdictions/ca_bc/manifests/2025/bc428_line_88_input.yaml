# BC428 (2025) inputs a salary-only caller does not give.
# Line 88: "Line 88: Line 86 plus line 87 (maximum $2,000)" (5010-c). Lines 86 and 87 (the ESOP and
# EVCC certificate numbers and amounts) are not built, and the $2,000 maximum is stated in the
# basis and not enforced. A salary-only caller has none, so a request that leaves the line out is
# read as blank; the step that consumes it (line 89) reads that blank as 0.
inputs:
  - name: ca-bc/bc428_esop_evcc_credits_line_88
    title: "Total ESOP and EVCC credits"
    reference: "88"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 88: Line 86 plus line 87 (maximum $2,000)'
