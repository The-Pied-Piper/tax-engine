# BC428 (2025) line 25, the sum of lines 16, 17, 20, 23 and 24. Form BC428 (CRA 5010-c-25e): "Line
# 25: Add lines 16, 17, 20, 23 and 24." The take-home filer claims no age, spouse, eligible
# dependant or caregiver amounts (lines 17, 20, 23 and 24), so only line 16 (basic personal
# amount, ca-bc/basic_personal_amount) is summed; a single part is still a sum, so the step is built.
form:
  name: ca-bc/bc428
capabilities:
  - name: core/sum
    reference: "25"
    unit: ca/cad
    params:
      rounding: ca-bc/cent_rounding
    consumes:
      parts: [ca-bc/basic_personal_amount]
    produces:
      output: ca-bc/bc428_subtotal_line_25
