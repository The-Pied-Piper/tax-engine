# Form BC428 (British Columbia Tax, 2025, 5010-c-25e) Part A, line 12. Each of the columns 1 to 3 of
# lines 9 to 15 prints "Line 12:" with its rate: "Line 12: Rate 14.7%", "Line 12: Rate 16.8%" and
# "Line 12: Rate 20.5%". Column 1 is "Line 1 is more than $137,407 but not more than $186,306", column
# 2 "more than $186,306 but not more than $259,829" and column 3 "more than $259,829". Line 12 is the
# printed rate of the column that line 1 falls in, and a line 1 exactly at a column's upper bound
# falls in the lower column. It is blank when line 1 is $137,407 or less (outside the table). Line 1
# is read from its producing part (bc428_line_1.yaml), so this part does not produce it again.
form:
  name: ca-bc/bc428
capabilities:
  - name: core/bracket_column_rate
    title: "Rate"
    reference: "12"
    params:
      schedule: ca-bc/brackets_lines_9_to_15
    consumes:
      base: ca-bc/bc428_taxable_income_line_1
    produces:
      output: ca-bc/bc428_bracket_rate_line_12
