# BC428 (2025) inputs a salary-only caller does not give.
# Line 53: "Line 53 and line 58769: Line 51 plus line 52". A salary-only caller has no medical
# expenses, so a request that leaves the line out is read as blank, and the step that reads this
# line reads that blank as 0.
inputs:
  - name: ca-bc/bc428_medical_expenses_line_53
    reference: "53"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 53 and line 58769: Line 51 plus line 52'
