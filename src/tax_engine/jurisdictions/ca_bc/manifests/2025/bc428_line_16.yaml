# BC428 (2025) line 16, the basic personal amount. Form BC428 (CRA 5010-c-25e): "Line 16 and line
# 58040: Basic personal amount Claim $12,932". The $12,932 is the `ca-bc/basic_personal_amount`
# dataset, claimed whole through core/credit_amount, so it is the same at every salary.
form:
  name: ca-bc/bc428
capabilities:
  - name: core/credit_amount
    title: "Basic personal amount"
    reference: "16"
    unit: ca/cad
    params:
      amount: ca-bc/basic_personal_amount
    produces:
      output: ca-bc/basic_personal_amount
