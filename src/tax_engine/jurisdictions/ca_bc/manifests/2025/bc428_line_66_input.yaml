# BC428 (2025) inputs a salary-only caller does not give.
# Line 66: "Line 66 and line 61540: Amount from line 40427 of your return" (5010-c). A salary-only
# caller has no minimum tax carryover, so a request that leaves the line out is read as 0, not
# blank, as Alberta's line 64 input is (the multiply step cannot take a blank).
form:
  name: ca-bc/bc428
inputs:
  - name: ca-bc/bc428_minimum_tax_carryover_amount
    title: "Amount from line 40427 of your return"
    reference: "66"
    unit: ca/cad
    required: false
    default: "0"
    basis: 'Line 66 and line 61540: Amount from line 40427 of your return'
