# Largest total eligible amount for the joint election, 2025 tax year (Form T2048): Part 2 line 1
# "Total eligible amount for the joint election (maximum of $10 million per election)", the $10
# million as the form prints it (no .txt published; confirmed from the PDF). It borrows the credit
# kind because the figure is used whole, as the basic personal amount is.
# The form states no rounding rule, so the figure rounds half-up to the cent, the owner's
# decision, the repo convention.
family: ca/qbt_election_eligible_amount_maximum
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2048/t2048-25e.pdf
rounding: {increment: "0.01", mode: half_up}
amount: "10000000"
