# Condition under which the count of a filer entered as both under 18 and born in 1960 or earlier is
# refused, 2025 tax year: a filer born in 1960 or earlier is 65 or older (Form ON428 line 10), while
# Worksheet ON428 line 58440 is for a filer "under 18 years of age on December 31, 2025", so a count
# of 1 (`ca/under_18_and_born_in_1960_or_earlier`) is an input error, not an age amount claimed
# beside the amount for a filer under 18. The forms print no refusal; it is the guard of this check.
# The count is 1 when it applies and 0 otherwise. A count, not a dollars-and-cents box, so there is
# no rounding.
family: ca/under_18_and_born_in_1960_or_earlier_refused
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-c/5006-c-25e.txt
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-d/5006-d-25e.txt
rounding: none
count_when_any_applies: "1"
conditions:
  - text: >-
      under 18 years of age on December 31, 2025 and born in 1960 or earlier are both entered, but
      a filer born in 1960 or earlier is 65 or older
    parts:
      - tests:
          - {reads: count, position: "1", relation: equal_to, than: "1"}
