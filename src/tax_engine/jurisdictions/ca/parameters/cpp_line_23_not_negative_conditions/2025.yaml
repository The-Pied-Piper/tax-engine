# Entry condition of Schedule 8 Part 3b line 44, 2025 tax year (form 5000-S8, page 6): "If line 23
# is positive or "0", enter the amount from line 22 on line 44 and line 47, and continue at line 48.
# If not, enter the amount from line 21 and continue at line 45." The count is 1 when line 23 (line
# 21 minus line 22, "if negative, show in brackets") is more than 0 or equal to 0, and 0 when it is
# negative. Not a dollars-and-cents box, so no rounding.
family: ca/cpp_line_23_not_negative_conditions
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s8/5000-s8-25e.txt
rounding: none
count_when_any_applies: "1"
conditions:
  - text: >-
      line 23 is positive or "0"
    parts:
      - tests:
          - {reads: amount, position: "1", relation: more_than, than: "0"}
          - {reads: amount, position: "1", relation: equal_to, than: "0"}
