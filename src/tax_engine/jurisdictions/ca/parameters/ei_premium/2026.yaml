# Provisional: taken from T4127 (Jan 2026); to be confirmed against the 2026 form text when CRA publishes it.
# EI premium on employment income, 2026 tax year. CRA T4127, 122nd Edition (effective
# January 1, 2026), Table 8.7 "Employment Insurance 2026 rates and amounts", row "Canada
# except QC": Maximum Annual Insurable Earnings 68,900.00; Employee Contribution Rate 0.0163;
# Maximum Annual Employee Premium 1,123.07. The maximum is taken as printed. Same tier as 2025:
# the rate on the earnings from 0 to the maximum insurable earnings, with no exemption.
# Premiums are in dollars and cents, and 1.63% of 68,900 is exactly the printed $1,123.07,
# so the tier rounds half-up to the cent.
family: ca/ei_premium
