# Provisional: taken from the 2025 form text named in sources; to be confirmed against the 2026 form text when CRA publishes it.
# Derivation: carried forward unchanged from the 2025 file; the gate is a rule, not an indexed dollar amount.
# Marginal rate gate, 2026 tax year. Not a CRA figure and not printed on any form: the rows are a
# switch the take-home marginal rate steps use so that a rate counts only where the figure it is
# gated on is above zero. A base of 0.00 gives the rate 0 and a base of one cent or more gives the
# rate 1, whatever the figure is (a tax, the salary, the room left under a maximum). The form is
# listed as a source only because a gated figure, line 42900, is on it; the rows are not from it.
# A base exactly at a row's `over` is in the lower band, so the second row starts above 0.005: no
# cent amount is in the first band but 0.00, and 0.01 is in the second.
family: ca/marginal_rate_gate
tax_year: 2026
kind: amount_by_band
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-r/5006-r-25e.txt
rounding: none
rows:
  - {over: "0", amount: "0"}
  - {over: "0.005", minus: "0", rate: "1", plus: "0"}
