# Gross farming expenses needed for the return of fuel charge proceeds to farmers tax credit, 2025
# tax year (Form T2043 Part 1 Note 1): "If your total gross farming expenses for all businesses
# are $25,000 or more, you are eligible to claim the credit." (confirmed from the PDF; no .txt
# published). The figure is a dollars-and-cents amount, so it rounds half-up to the cent, the
# owner's decision, as the form states no rounding rule.
family: ca/fuel_charge_expense_threshold
tax_year: 2025
kind: amount
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2043/t2043-25e.pdf
rounding: {increment: "0.01", mode: half_up}
amount: "25000"
