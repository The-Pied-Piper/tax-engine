# Maximum of the secondary earner exemption, 2025 tax year (Schedule 6, form 5000-S6), Part B line 14
# "Secondary earner exemption": "... amount from line 5 or line 12. (maximum $16,386)". It is a plain
# amount, not a credit: the cap the line 14 amount is held to.
# Line 14 is a dollars-and-cents box, so the capped figure rounds half-up to the cent, the owner's
# decision, as the form states no rounding rule.
