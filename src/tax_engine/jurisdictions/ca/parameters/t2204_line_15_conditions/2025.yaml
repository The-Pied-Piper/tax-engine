# Condition of the line 45000 entry on Form T2204 line 15, 2025 tax year: "If this amount is more
# than $1, enter it on line 45000 of your return." The count is 1 when line 15 is more than $1 and
# 0 otherwise. The form says "more than $1", so exactly $1.00 gives 0. The result is a count, not a
# dollars-and-cents box, so there is no rounding.
family: ca/t2204_line_15_conditions
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2204/t2204-25e.pdf
rounding: none
count_when_any_applies: "1"
conditions:
  - text: >-
      this amount is more than $1
    parts:
      - tests:
          - {reads: amount, position: "1", relation: more_than, than: "1"}
