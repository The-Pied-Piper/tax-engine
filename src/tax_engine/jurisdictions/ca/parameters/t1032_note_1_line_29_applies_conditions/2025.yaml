# Form T1032 E (25), Step 4 Part A, page 3, "Line 29: Line 27 multiplied by line 28 =" with line 28 "Amount
# from line 24" (line 22): the ratio of line 8 to line 17 matters only when there is an amount to
# multiply, so it is 1 when the amount from line 22 (the one amount the caller gives) is above 0 and 0
# otherwise. The result is a count, not a dollars-and-cents box, so there is no rounding.
family: ca/t1032_note_1_line_29_applies_conditions
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t1032/t1032-25e.pdf
rounding: none
count_when_any_applies: "1"
conditions:
  - text: the amount from line 22 is above 0
    parts:
      - tests:
          - {reads: amount, position: "1", relation: more_than, than: "0"}
