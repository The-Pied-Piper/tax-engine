# Provisional: taken from the 2025 form text named in sources; to be confirmed against the 2026 form text when CRA publishes it.
# Derivation: carried forward unchanged from the 2025 file; the 2026 form is not yet published.
# Federal exact rounding, 2026 tax year: the rule for a federal form line the engine only carries
# through, or sums its lines, with no rounding rule printed for it:
# T1 line 10100 (employment income) and line 10400 (other
# employment income), which the T1 prints no rounding rule for (5006-r-25e.txt, "Line 1 and line 10100",
# "Line 2 and line 10400"). The form prints no rounding rule for them, so the figure is carried as it
# is (the project's rule: round only where the form says to). The cent rule of `ca/cent_rounding`
# does not apply to them. The same holds for the sums and products the forms print with no rounding
# rule: T1 line 31260 "line 1 plus line 2" (5006-r-25e.txt), Schedule 6 line 1 (5000-s6-25e.txt) and
# T2204 line 1 (t2204-25e.pdf, note (1)).
family: ca/exact_rounding
tax_year: 2026
kind: rounding_only
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-r/5006-r-25e.txt
rounding: none
