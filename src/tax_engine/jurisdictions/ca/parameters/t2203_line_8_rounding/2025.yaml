# Rounding of line 8 of Part 2 of Form T2203, 2025 tax year: "Line 6 multiplied by the percentage
# from line 7". The form prints no rounding rule; line 8 is a dollars-and-cents line, so the product
# rounds half-up to the cent, the owner's decision. The dataset holds no rate: the percentage is the
# caller's, as printed in column 5 of line 52220 (25 for 25%).
family: ca/t2203_line_8_rounding
tax_year: 2025
kind: rounding_only
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2203/t2203-25e.pdf
rounding: {increment: "0.01", mode: half_up}
