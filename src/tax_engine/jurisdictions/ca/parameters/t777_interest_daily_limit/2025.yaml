# Daily interest limit of a passenger vehicle, Guide T4044 (2025) "Available interest expense for
# passenger vehicles or zero-emission passenger vehicles chart" line B: "$10 multiplied by the number
# of days for which interest was paid". It is a per-unit amount, applied to the count of days.
# The Guide's "What's new" also says the maximum allowable interest deduction "remains at $350 per month
# for new automobile loans", which the chart does not print; the chart's $10 a day is taken as printed.
# Line B is a dollars-and-cents box, so the amount rounds half-up to the cent, the owner's decision,
# as the guide states no rounding rule.
family: ca/t777_interest_daily_limit
tax_year: 2025
kind: amount
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t4044/t4044-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "10.00"
