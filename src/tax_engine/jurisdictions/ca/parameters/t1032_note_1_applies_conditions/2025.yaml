# Form T1032 E (25), Step 4 Part B, page 3: "If all of the following conditions apply, calculate line 33
# according to the instructions in note 1:" the amount on line 32 is less than $2,000; the receiving
# spouse or common-law partner was under age 65 on December 31, 2025; the transferring spouse or
# common-law partner was age 65 or older and received any of the amounts in a) to e) in the year. The
# count is 1 when all of them hold and 0 otherwise. The caller's counts are read in the order: the
# receiving spouse was under 65, the transferring spouse was 65 or older. The caller's amounts are
# read in the order: line 32, the $2,000, the amounts a) to e) the transferring spouse received.
# "Received any" is an amount above 0. The result is a count, not a dollars-and-cents box, so there is
# no rounding.
family: ca/t1032_note_1_applies_conditions
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t1032/t1032-25e.pdf
rounding: none
count_when_any_applies: "1"
conditions:
  - text: >-
      the amount on line 32 is less than $2,000, the receiving spouse or common-law partner was under
      age 65 on December 31, 2025, and the transferring spouse or common-law partner was age 65 or
      older and received any of the amounts in a) to e) in the year
    parts:
      - tests:
          - {reads: amount, position: "2", relation: more_than, against: "1"}
      - tests:
          - {reads: count, position: "1", relation: more_than, than: "0"}
      - tests:
          - {reads: count, position: "2", relation: more_than, than: "0"}
      - tests:
          - {reads: amount, position: "3", relation: more_than, than: "0"}
