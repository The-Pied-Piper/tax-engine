# Take-home marginal rate, EI rate on the take-home basis, 2025 tax year (Form T2204, Employee Overpayment of
# Employment Insurance Premiums, 2025 text). The take-home EI is line 16 "Enter whichever amount is the least: line 7,
# line 9 or line 12", entered on line 31200 of the return. Line 7 is "Amount from line 3 – $2,000 = (if negative, enter
# "0")", line 3 is "Line 1 plus line 2 (maximum $65,700)" and line 12 is the line 10 amount, "Amount from line 1 × 1.64%
# = (maximum $1,077.48)". So line 16 is 0 up to a salary of $2,000, rises 1 for 1 with line 7 (a 100% band) until line 12 is
# the least, then follows line 12: 1.64% of the salary up to the maximum insurable earnings of $65,700, and
# nothing above. The 100% band ends where line 7 equals line 12, at $2,000 / (1 - 0.0164) = $2033.3469 (the form's own arithmetic; note (3)'s \"less than $2,033\" concerns self-employment earnings on line 2 and is not the band edge). The base is the salary (T1 line 10100); no rounding.
