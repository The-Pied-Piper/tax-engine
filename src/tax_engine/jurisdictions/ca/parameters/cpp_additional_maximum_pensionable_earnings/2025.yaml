# Additional maximum pensionable earnings, 2025 tax year (T1-2025 Schedule 8, form 5000-S8).
# Part 2: "Box A: Enter the number of months that CPP applied in 2025." and the "Monthly
# proration for 2025" table, "Enter the corresponding amounts from the monthly proration
# table above using the number of months from line A.": line D "Your additional maximum
# pensionable earnings for 2025 (maximum $81,200)".
# The rows are the table's column "Additional maximum pensionable earnings", one for each
# number of months from 1 to 12, as printed. Part 4 line 4 is "Enter whichever is less:
# amount from line D of Part 2 or line 3." The table has no row for 0 months, so a count
# without a row is refused.
# The figures are in dollars and cents, so each rounds half-up to the cent, which changes
# none of them.
