# Provisional: taken from T4127 (Jan 2026); to be confirmed against the 2026 form text when CRA publishes it.
# Derivation: annual figure x n/12, rounded half-up to the cent; reproduces the 2025 rows.
# Additional maximum pensionable earnings, 2026 tax year. The 2026 Schedule 8 (form 5000-S8) is
# not published yet. T4127 (122nd Edition) gives the 2026 additional maximum pensionable earnings
# of $85,000, and the Schedule 8 "Monthly proration" column is that figure times the number of
# months from line A (Part 2), rounded half-up to the cent.
# The rows are one for each number of months from 1 to 12. Part 4 line 4 is "Enter whichever is
# less: amount from line D of Part 2 or line 3." The table has no row for 0 months, so a count
# without a row is refused.
# The figures are in dollars and cents, so each rounds half-up to the cent, which changes none
# of them.
family: ca/cpp_additional_maximum_pensionable_earnings
tax_year: 2026
kind: amount_by_count
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pub/t4127-jan/t4127-01-26e.pdf
rounding: {increment: "0.01", mode: half_up}
amounts:
  "1": "7083.33"
  "2": "14166.67"
  "3": "21250.00"
  "4": "28333.33"
  "5": "35416.67"
  "6": "42500.00"
  "7": "49583.33"
  "8": "56666.67"
