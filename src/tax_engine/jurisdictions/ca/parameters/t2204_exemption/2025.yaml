# Exemption of Form T2204 line 7, 2025 tax year (Form T2204, 2025 edition): "Amount from line 3 –
# $2,000 = (if negative, enter "0")". The $2,000 is claimed whole and is taken from line 3, which is
# not below zero, so the exemption is the printed figure and the line 7 subtraction is in the form.
# A dollars-and-cents figure, so it rounds half-up to the cent, which changes nothing.
family: ca/t2204_exemption
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2204/t2204-25e.pdf
rounding: {increment: "0.01", mode: half_up}
amount: "2000.00"
