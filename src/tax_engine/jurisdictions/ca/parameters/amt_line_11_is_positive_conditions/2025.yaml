# Condition for T1 line 41700 through Part 5 of the alternative minimum tax, 2025 tax year (Form
# T691 Part 5 line 11): "If line 11 is positive, complete parts 6 and 7." The one condition, "line
# 11 is positive", reads line 11's amount: a count of 1 when it is more than 0, and 0 otherwise. A
# negative line 11 is not positive, as line 11 is never below zero (the form says "if negative,
# enter "0""). The result is a count, not a dollars-and-cents box, so there is no rounding.
family: ca/amt_line_11_is_positive_conditions
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t691/t691-25e.pdf
rounding: none
count_when_any_applies: "1"
conditions:
  - text: line 11 is positive
    parts:
      - tests:
          - {reads: amount, position: "1", relation: more_than, than: "0"}
