# Maximum amount subject to second additional contributions, 2025 tax year (T1-2025 Schedule
# 8, form 5000-S8). Part 2: "Box A: Enter the number of months that CPP applied in 2025."
# and the "Monthly proration for 2025" table, "Enter the corresponding amounts from the
# monthly proration table above using the number of months from line A.": line C "Your
# maximum amount subject to second additional contributions for 2025 (maximum $9,900)".
# The rows are the table's column "Maximum amount subject to second additional
# contributions", one for each number of months from 1 to 12, as printed. Part 4 line 12
# takes its $9,900 limit from its own dataset, so Schedule 8 does not read line C. Form RC381 Part 2 line D reads the same column. The table has no
# row for 0 months, so a count without a row is refused.
# The figures are in dollars and cents, so each rounds half-up to the cent, which changes
# none of them.
family: ca/cpp_second_additional_earnings_maximum
tax_year: 2025
kind: amount_by_count
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s8/5000-s8-25e.txt
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/rc381/rc381-25e.pdf
rounding: {increment: "0.01", mode: half_up}
amounts:
  "1": "825.00"
  "2": "1650.00"
  "3": "2475.00"
  "4": "3300.00"
  "5": "4125.00"
  "6": "4950.00"
  "7": "5775.00"
  "8": "6600.00"
  "9": "7425.00"
  "10": "8250.00"
  "11": "9075.00"
  "12": "9900.00"
