# Provisional: taken from T4127 (Jan 2026); to be confirmed against the 2026 form text when CRA publishes it.
# Derivation: annual figure x n/12, rounded half-up to the cent; reproduces the 2025 rows.
# Maximum amount subject to second additional contributions, 2026 tax year. The 2026 Schedule 8
# (form 5000-S8) is not published yet. T4127 (122nd Edition) gives the second additional
# pensionable earnings band of $10,400 (the band between the two ceilings), and the Schedule 8
# "Monthly proration" column is that figure times the number of months from line A (Part 2),
# rounded half-up to the cent.
# The rows are one for each number of months from 1 to 12. Part 4 line 12 takes its limit from
# its own dataset; line C is read at Part 6 line 34, and Form RC381 Part 2 line D reads the same
# column. The table has no row for 0 months, so a count without a row is refused.
# The figures are in dollars and cents, so each rounds half-up to the cent, which changes none
# of them.
family: ca/cpp_second_additional_earnings_maximum
tax_year: 2026
kind: amount_by_count
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pub/t4127-jan/t4127-01-26e.pdf
rounding: {increment: "0.01", mode: half_up}
amounts:
  "1": "866.67"
  "2": "1733.33"
  "3": "2600.00"
  "4": "3466.67"
  "5": "4333.33"
  "6": "5200.00"
  "7": "6066.67"
  "8": "6933.33"
  "9": "7800.00"
  "10": "8666.67"
  "11": "9533.33"
  "12": "10400.00"
