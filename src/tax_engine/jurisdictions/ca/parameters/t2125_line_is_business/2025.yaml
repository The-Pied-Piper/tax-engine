# Form T2125 (2025), Part 5 line 9946 "Your net income (loss)" is reported on the applicable line of
# the return "as indicated below": business income on line 13500. The statement's line code is the
# number of that choice (1 business, 2 professional, 3 commission; the form names no codes, a listed
# check). The count is 1 when the code is 1 and 0 otherwise; a code outside 1 to 3 never reaches it,
# `ca/t2125_line_code_refused` refuses it first.
# A count, not a dollars-and-cents box, so there is no rounding. Confirmed from the PDF; no .txt
# published.
family: ca/t2125_line_is_business
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2125/t2125-25e.pdf
rounding: none
count_when_any_applies: "1"
conditions:
  - text: "business income on line 13500"
    parts:
      - tests:
          - {reads: count, position: "1", relation: equal_to, than: "1"}
