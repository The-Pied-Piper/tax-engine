# Gifts of publicly listed securities acquired under a security option plan, 2025 tax year (Form T691
# Part 1 line 31): "× 40% =", the product subtracted on line 32. The 40% is the printed percentage of
# the form, a rate of 0.4, and the product is a dollars-and-cents line, so it rounds half-up to the
# cent, the owner's decision, as the form states no rounding rule.
family: ca/security_option_gifts_rate
tax_year: 2025
kind: rate
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t691/t691-25e.pdf
rounding: {increment: "0.01", mode: half_up}
rate: "0.4"
