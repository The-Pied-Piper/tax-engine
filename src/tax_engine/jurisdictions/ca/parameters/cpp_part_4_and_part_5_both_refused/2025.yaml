# Condition under which the count of Schedule 8 Part 4 and Part 5 both completed is refused, 2025 tax
# year: the form's two parts are alternatives, Part 4 for "only self-employment income" and Part 5 for
# "both: employment income (complete Part 3 first)" and self-employment income, so a count of 1
# (`ca/cpp_part_4_and_part_5_both`) is an input error, not a second set of contributions added to the
# first. The schedule prints no refusal; it is the guard of this check. The count is 1 when it applies
# and 0 otherwise. A count, not a dollars-and-cents box, so there is no rounding.
family: ca/cpp_part_4_and_part_5_both_refused
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s8/5000-s8-25e.txt
rounding: none
count_when_any_applies: "1"
conditions:
  - text: >-
      Part 4 and Part 5 of Schedule 8 are both completed, but Part 4 is for self-employment income
      only and Part 5 for employment income as well
    parts:
      - tests:
          - {reads: count, position: "1", relation: equal_to, than: "1"}
