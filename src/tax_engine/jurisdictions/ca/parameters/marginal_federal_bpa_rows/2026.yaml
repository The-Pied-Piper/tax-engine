# Provisional: taken from T4127 (Jan 2026); to be confirmed against the 2026 form text when CRA publishes it.
# Derivation: the 2025 form's layout with the income threshold $181,440 and the upper end $258,482 (threshold plus range $77,042) of the Federal Basic Personal Amount (BPAF) formula in T4127 (Jan 2026).
# Take-home marginal rate, federal basic personal amount band, 2026 tax year. T4127 (Jan 2026), Federal Basic
# Personal Amount (BPAF) Formula: "Where NI* <= $181,440, BPAF = $16,452. Where $181,440 < NI* < $258,482, BPAF** =
# $16,452 - (NI* - $181,440) x ($1,623 / $77,042). Where NI* >= $258,482, BPAF = $14,829." Not a rate: the rows are a
# switch, read through `core/amount_by_band_rate`: 1 for net income above $181,440 and up to $258,482, where the
# basic personal amount falls with net income, and 0 outside it. No rounding.
family: ca/marginal_federal_bpa_rows
tax_year: 2026
kind: amount_by_band
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pub/t4127-jan/t4127-01-26e.pdf
rounding: none
rows:
  - {over: "0", amount: "0"}
  - {over: "181440", minus: "181440", rate: "1", plus: "0"}
  - {over: "258482", amount: "0"}
