# Medical expenses rate on the net income, 2025 tax year (T1-2025, form 5006-R): line 108
# "Amount from line 23600" "multiplied by 3%". It is the share of the net income that
# line 110 takes off the filer's own medical expenses (line 107).
# Line 108 is a dollars-and-cents box, so the product rounds half-up to the cent, the
# owner's decision, as the form states no rounding rule.
family: ca/medical_net_income_rate
tax_year: 2025
kind: rate
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-r/5006-r-25e.txt
rounding: {increment: "0.01", mode: half_up}
rate: "0.03"
