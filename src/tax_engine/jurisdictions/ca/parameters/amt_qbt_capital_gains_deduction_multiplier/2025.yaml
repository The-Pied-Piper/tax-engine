# Multiplier of the capital gains deduction on a qualifying business transfer, 2025 tax year (Form
# T691 Part 1 line 89): "Amount from line 25395 of your return" "× 2 =". The 2 is above one, which
# the rate kind refuses, so it is a fraction, 2/1, kept as given.
# Line 89 is a dollars-and-cents box, so the product rounds half-up to the cent, the owner's
# decision, as the form states no rounding rule.
family: ca/amt_qbt_capital_gains_deduction_multiplier
tax_year: 2025
kind: fraction
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t691/t691-25e.pdf
rounding: {increment: "0.01", mode: half_up}
numerator: "2"
denominator: "1"
