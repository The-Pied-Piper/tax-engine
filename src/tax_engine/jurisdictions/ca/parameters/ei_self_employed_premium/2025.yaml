# EI premium on self-employment and other eligible earnings, 2025 tax year (T1-2025 Schedule
# 13, form 5000-S13). "Residents of a province or territory other than Quebec: Line 9:
# Amount from line 8 multiplied by 1.64% (maximum $1,077.48)". Line 8 "Enter whichever is
# less: amount from line 4 or line 7." is already net of the insurable earnings on T4 slips
# (line 7 "Line 5 minus line 6 (if negative, enter "0")"), so the tier starts at 0 and ends
# at the maximum insurable earnings of $65,700 (line 5). CRA "EI premium rates and
# maximums", 2025 federal row, gives the same rate, ceiling and maximum premium.
# "Enter the amount from line 9 or line 10, whichever applies, on line 31217 and line 42120
# of your return." Both are dollars-and-cents boxes, so the tier rounds half-up to the cent.
family: ca/ei_self_employed_premium
tax_year: 2025
kind: contribution_tier
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s13/5000-s13-25e.txt
  - https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/payroll/payroll-deductions-contributions/employment-insurance-ei/ei-premium-rates-maximums.html
rounding: {increment: "0.01", mode: half_up}
rate: "0.0164"
lower: "0"
upper: "65700"
maximum: "1077.48"
