# Maximum for the Canada caregiver amount for other infirm dependants, 2025 tax year
# (Schedule 5, form 5000-S5): "Line 30450 - Canada caregiver amount for other infirm
# dependants age 18 or older", line 3 "Line 1 minus line 2 (if negative, enter "0")
# (maximum $8,601)". It is a plain cap on each dependant's allowable amount.
# Line 3 is a dollars-and-cents box, so each dependant's allowable amount rounds half-up to
# the cent, the half-up rule, as the form states no rounding rule.
family: ca/caregiver_maximum_amount
tax_year: 2025
kind: amount
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s5/5000-s5-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "8601"
