# Base amount for the disability amount for self, 2025 tax year (Federal Worksheet, form
# 5000-D1): "Line 31600 - Disability amount for self", line 1 "Base amount 10,138.00". It is the
# amount claimed by a filer 18 or older, and line 7 of the worksheet adds the supplement for a
# filer under 18.
# Line 1 is a dollars-and-cents box, so the amount rounds half-up to the cent, the owner's
# decision, as the form states no rounding rule.
family: ca/disability_self_base_amount
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-d1/5000-d1-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "10138.00"
