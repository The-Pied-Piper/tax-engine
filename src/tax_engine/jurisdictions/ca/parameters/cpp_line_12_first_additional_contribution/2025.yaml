# Schedule 8 Part 3 line 12, required first additional CPP contributions, 2025 tax year (T1-2025
# Schedule 8, form 5000-S8). Line 12 is "amount from line 7 multiplied by 1% (maximum $678.00)",
# and line 7 is "Line 5 minus line 6 (if negative, enter "0") (maximum $67,800)", the earnings
# subject to base and first additional contributions. So the tier is 1% of the earnings from 0 to
# the $67,800 maximum, and the printed maximum is $678.00.
# Line 18 is "Amount from line 12", line 26 "Amount from line 18", and line 28 "Line 26 plus line 27
# Enter this amount (in dollars and cents) on line 22215 of your return.", so the tier rounds
# half-up to the cent.
family: ca/cpp_line_12_first_additional_contribution
tax_year: 2025
kind: contribution_tier
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s8/5000-s8-25e.txt
rounding: {increment: "0.01", mode: half_up}
rate: "0.01"
lower: "0"
upper: "67800"
maximum: "678.00"
