# Form RC381 (2025), Part 4 line 76 "Amount from line 56 ÷ 4% =": the second additional
# contributions of line 56 divided by the employee's second additional rate, the earnings they
# were paid on. Line 76 is a dollars-and-cents box, so the quotient rounds half-up to the cent,
# the owner's decision, as the form states no rounding rule.
family: ca/rc381_second_additional_rate
tax_year: 2025
kind: rate
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/rc381/rc381-25e.pdf
rounding: {increment: "0.01", mode: half_up}
rate: "0.04"
