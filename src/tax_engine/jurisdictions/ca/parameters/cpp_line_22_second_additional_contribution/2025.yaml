# Schedule 8 (form 5000-S8, 2025) Part 3 line 22: "amount from line 4 multiplied by 4% (maximum
# $396.00)", the required second additional CPP contributions. Line 4 is already the earnings above
# line B, so the band starts at 0; the upper bound is the $9,900 printed on Part 2 line C ("maximum
# $9,900"), which line 4 (at most 81,200 - 71,300) never exceeds. The figure is in dollars and
# cents, so it rounds half-up to the cent.
family: ca/cpp_line_22_second_additional_contribution
tax_year: 2025
kind: contribution_tier
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s8/5000-s8-25e.txt
rounding: {increment: "0.01", mode: half_up}
rate: "0.04"
lower: "0"
upper: "9900"
maximum: "396.00"
