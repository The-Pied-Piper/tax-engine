# Net capital loss adjustment factor for carry-forward losses, row "After 2000 and before 2025",
# 2025 tax year (Form T1436, Capital Gains Worksheet, "Line 25300 - Net capital loss of other years
# (if you have pre-1986 capital loss balance)", "Chart A - Adjustment calculation for carry-forward
# losses"): column (F) "Adjustment factor (for carry-forward losses)", which column (G) "Net capital
# loss balance available to carry forward (column E multiplied by column F)" multiplies by.
# The form prints 1, the fraction 1/1.
# Column (G) is a dollars-and-cents box, so the product rounds half-up to the cent, the owner's
# decision, as the form states no rounding rule.
family: ca/net_capital_loss_carry_forward_factor_2001_to_2024
tax_year: 2025
kind: fraction
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t1436/t1436-25e.pdf
rounding: {increment: "0.01", mode: half_up}
numerator: "1"
denominator: "1"
