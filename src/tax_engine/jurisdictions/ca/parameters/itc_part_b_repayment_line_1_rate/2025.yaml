# ITC rate, 2025 tax year: Form T2038(IND) Part B, line 67184 "× 0.20 =" amount 1, the repayment for
# 2014 and prior years. The product is the caller's repayment of assistance for 2014 and prior
# years times the rate the form prints.
# The form's line is a dollars-and-cents box, so the product rounds half-up to the cent, the
# owner's decision, as the form states no rounding rule.
family: ca/itc_part_b_repayment_line_1_rate
tax_year: 2025
kind: rate
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2038-ind/t2038-ind-25e.pdf
rounding: {increment: "0.01", mode: half_up}
rate: "0.20"
