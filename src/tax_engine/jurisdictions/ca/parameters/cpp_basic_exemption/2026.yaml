# Provisional: taken from T4127 (Jan 2026); to be confirmed against the 2026 form text when CRA publishes it.
# Derivation: calculated: annual figure x n/12, rounded half-up to the cent; reproduces the 2025 rows.
# Maximum basic exemption, 2026 tax year. The 2026 Schedule 8 (form 5000-S8) is not published
# yet. T4127 (122nd Edition, Table 6.1 and Table 8.3) gives the annual basic exemption of $3,500, and the
# Schedule 8 "Monthly proration" column is that figure times the number of months from line A
# (Part 2), rounded half-up to the cent.
# The rows are one for each number of months from 1 to 12. Part 4 line 8 is "Amount from line E
# of Part 2". The table has no row for 0 months, so a count without a row is refused.
# The figures are in dollars and cents, so each rounds half-up to the cent, which changes none
# of them.
family: ca/cpp_basic_exemption
tax_year: 2026
kind: amount_by_count
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pub/t4127-jan/t4127-01-26e.pdf
rounding: {increment: "0.01", mode: half_up}
amounts:
  "1": "291.67"
  "2": "583.33"
  "3": "875.00"
  "4": "1166.67"
  "5": "1458.33"
  "6": "1750.00"
  "7": "2041.67"
  "8": "2333.33"
  "9": "2625.00"
  "10": "2916.67"
  "11": "3208.33"
  "12": "3500.00"
