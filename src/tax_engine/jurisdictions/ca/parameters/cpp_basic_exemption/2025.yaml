# Maximum basic exemption, 2025 tax year (T1-2025 Schedule 8, form 5000-S8). Part 2: "Box A:
# Enter the number of months that CPP applied in 2025." and the "Monthly proration for 2025"
# table, "Enter the corresponding amounts from the monthly proration table above using the
# number of months from line A.": line E "Your maximum basic exemption for 2025 (maximum
# $3,500)".
# The rows are the table's column "Maximum basic exemption", one for each number of months
# from 1 to 12, as printed. Part 4 line 8 is "Amount from line E of Part 2". The table has
# no row for 0 months, so a count without a row is refused.
# The figures are in dollars and cents, so each rounds half-up to the cent, which changes
# none of them.
family: ca/cpp_basic_exemption
tax_year: 2025
kind: amount_by_count
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s8/5000-s8-25e.txt
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/rc381/rc381-25e.pdf
rounding: {increment: "0.01", mode: half_up}
amounts:
