# Entry condition of Schedule 8 Part 3 line 36 (printed on the second page of Part 3, numbered 37
# in the instructions), 2025 tax year (form 5000-S8, page 6): "If line 19 is positive or "0",
# enter the amount from line 18 at line 37 and line 43, and continue at line 44. If not, enter the
# amount from line 17 and continue at line 38." The count is 1 when line 19 (line 17 minus line 18,
# "if negative, show in brackets") is more than 0 or equal to 0, and 0 when it is negative. Not a
# dollars-and-cents box, so no rounding.
family: ca/cpp_line_19_not_negative_conditions
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s8/5000-s8-25e.txt
rounding: none
count_when_any_applies: "1"
conditions:
  - text: >-
      line 19 is positive or "0"
    parts:
      - tests:
          - {reads: amount, position: "1", relation: more_than, than: "0"}
          - {reads: amount, position: "1", relation: equal_to, than: "0"}
