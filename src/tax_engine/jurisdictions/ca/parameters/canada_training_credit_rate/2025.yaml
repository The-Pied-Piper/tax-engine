# Canada training credit rate, 2025 tax year (T1-2025, form 5000-S11): line 2 "Amount from
# line 1 multiplied by 50% =", the most the Canada training credit can be (line 4 takes the
# lesser of this and the limit on the notice of assessment).
# Line 2 is a dollars-and-cents box, so the product rounds half-up to the cent, the owner's
# decision, as the form states no rounding rule.
family: ca/canada_training_credit_rate
tax_year: 2025
kind: rate
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s11/5000-s11-25e.txt
rounding: {increment: "0.01", mode: half_up}
rate: "0.5"
