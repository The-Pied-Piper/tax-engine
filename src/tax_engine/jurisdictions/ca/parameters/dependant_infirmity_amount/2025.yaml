# Canada caregiver amount for an eligible dependant 18 or older, supplement to the
# dependant amount, 2025 tax year (Schedule 5, form 5000-S5): "Line 30400 - Amount for an
# eligible dependant", line 2 and line 51100 "If you are eligible for the Canada caregiver
# amount for your dependant (other than your infirm child under 18 years of age), enter
# $2,687 (Note 2) (see line 30425 below)". It is a per-unit amount, once if eligible.
# Line 2 is a dollars-and-cents box, so the amount rounds half-up to the cent, the
# owner's decision, as the form states no rounding rule.
family: ca/dependant_infirmity_amount
