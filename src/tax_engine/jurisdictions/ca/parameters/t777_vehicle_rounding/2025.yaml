# Rounding of the employment-use portion of the motor vehicle expenses, Form T777 (2025) line 30 "Line
# 20 multiplied by line 29. Employment-use portion" (line 3 chart, page 2): a dollars-and-cents box,
# so the product of line 29 and the employment-use share of line 20 rounds half-up to the cent once.
# The form states no rounding rule; the owner's decision.
family: ca/t777_vehicle_rounding
tax_year: 2025
kind: rounding_only
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t777/t777-25e.pdf
rounding: {increment: "0.01", mode: half_up}
