# Provisional: taken from T4127 (Jan 2026); to be confirmed against the 2026 form text when CRA publishes it.
# Derivation: the 2025 form's layout (Schedule 8, form 5000-S8) with the 2026 maximum pensionable earnings $74,600.00 and additional maximum pensionable earnings $85,000.00 of T4127 (Jan 2026) Tables 8.3 ($74,600) and 8.6 ($85,000); the basic exemption $3,500 and the rates are those of the 2025 form.
# Take-home marginal rate, CPP first additional contribution rate, 2026 tax year, Schedule 8 (form 5000-S8, 2025 text; the 2026 maxima from T4127): Part 3 line 12 "amount
# from line 7 multiplied by 1%", on the same earnings as line 11: above the maximum basic exemption ($3,500) and up
# to the maximum pensionable earnings ($74,600). So a further dollar of salary adds 1% of a dollar there and nothing
# outside it. The same 1% is what T1 line 22215 "Deduction for CPP or QPP enhanced contributions on employment
# income" (Schedule 8 line 28) takes off the income. The base is the salary (T1 line 10100); no rounding.
