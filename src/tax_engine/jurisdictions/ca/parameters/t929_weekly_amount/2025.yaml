# Disability supports deduction, weekly amount of school attendance, 2025 tax year (Form T929,
# Disability Supports Deduction, 2024 edition, the latest CRA publishes; no 2025 edition is
# published, so the 2024 figure is used for 2025): Step 2 line 9 "Line 8 multiplied by $375",
# line 8 being "Enter the number of weeks in the year that you attended the institution or
# secondary school". It is a per-unit amount, the weeks attended times $375, one part of the
# amount on line 12 of the form.
# Line 9 is a dollars-and-cents box, so the product rounds half-up to the cent, the owner's
# decision, as the form states no rounding rule.
family: ca/t929_weekly_amount
tax_year: 2025
kind: amount
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t929/t929-24e.pdf
rounding: {increment: "0.01", mode: half_up}
amount: "375"
