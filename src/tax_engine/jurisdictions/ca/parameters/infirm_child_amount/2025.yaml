# Canada caregiver amount per infirm child, 2025 tax year (T1-2025, form 5000-R): line
# 83 (line 30500) "Canada caregiver amount for infirm children under 18 years of age
# (see Schedule 5) Number of children you are claiming this amount for Line 30499"
# "multiplied by $2,687". It is a per-unit amount, one part of the total of the credit
# amounts (line 33500), which the credit rate is applied to once.
# Line 30500 is a dollars-and-cents box, so the product rounds half-up to the cent, the
# owner's decision, as the form states no rounding rule.
