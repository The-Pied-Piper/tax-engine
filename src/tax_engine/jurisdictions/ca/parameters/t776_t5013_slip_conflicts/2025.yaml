# Conditions of Form T776 (2025), the T5013 slip answer conflicting with the partner answer and with
# the other figures of the statement, 2025 tax year. Guide T4036 (confirmed 2026-10-27 from the PDF;
# no .txt published): "If you determine that you are a member of a partnership and you received a
# T5013 slip, fill in only the following fields on Form T776: enter your nine-digit partnership
# business number; enter your rental property ownership percentage ...; enter the amount from box
# 110 (or 107 if it is a limited partnership) of your T5013 slip on amount 7"; you may adjust amount
# 7 for the GST/HST rebate for partners (line 9974) and the deductible expenses you had as a partner
# (line 9943); and, on line 9936: "Do not use the amount from line 9936 if you are a member of a
# partnership that has to file Form T5013 SUM, Summary of Partnership Income. Your CCA amount is
# already included in box 110 of your T5013 slip." A partner who received no slip fills in all of
# the parts. So the answer "I received a T5013 slip" needs the partner answer yes, and with it every
# other figure of the statement must be 0: the CCA claim of Area A (amount ii), the gross rents and
# other income (lines 8141 and 8230), each of the expense lines of Part 4, the recapture (line 9947)
# and terminal loss (line 9948) of Area A, and the land additions and dispositions of Area F (lines
# 9923 and 9924), and the entries of the rows of Area A that are not a claim: the opening UCC
# (column 2), the additions (columns 3, 4, 11 and 12) and the remaining personal part (Note 9),
# which stay entries of the form with a claim of 0, and the additions of Area B (line 9925) and
# Area C (line 9927). The personal and short-term portions of
# an expense are checked not to exceed it, so they are 0 when it is. A condition applies when every
# one of its parts holds; a part holds when any of its tests holds. The counts are the checked
# answers (position 1 the partner answer of line 7, position 2 the T5013 slip answer); the amounts
# are the CCA claim of amount ii (position 1), the gross rents (2), the other income (3), the
# expense lines in line order (4 to 16), the recapture (17), the terminal loss (18), the land
# additions (19), the land dispositions (20), the opening UCC total (21), the additions total (22)
# the remaining personal part total (23), the total equipment additions (24) and the total building
# additions (25). The count is 1 when the slip answer is 1 and the
# partner answer is 0, or when the slip answer is 1 and any of the amounts is not 0, else 0. The
# form prints no such rule; the refusal of the count is the guard of this check
# (`ca/t776_t5013_slip_conflict_refused`). The count is a count, not a dollars-and-cents box, so
# there is no rounding.
family: ca/t776_t5013_slip_conflicts
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t4036/t4036-25e.pdf
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t776/t776-25e.txt
rounding: none
count_when_any_applies: "1"
conditions:
  - text: the T5013 slip answer is yes with the partner answer no
    parts:
      - tests:
          - {reads: count, position: "2", relation: equal_to, than: "1"}
      - tests:
          - {reads: count, position: "1", relation: equal_to, than: "0"}
  - text: a CCA claim (amount ii of Area A) is entered with the T5013 slip answer yes
    parts:
      - tests:
          - {reads: count, position: "2", relation: equal_to, than: "1"}
      - tests:
          - {reads: amount, position: "1", relation: not_equal_to, than: "0"}
  - text: >-
      a figure of the gross rents or other income (lines 8141, 8230) is entered with the T5013
      slip answer yes
    parts:
      - tests:
          - {reads: count, position: "2", relation: equal_to, than: "1"}
      - tests:
          - {reads: amount, position: "2", relation: not_equal_to, than: "0"}
          - {reads: amount, position: "3", relation: not_equal_to, than: "0"}
  - text: >-
      an expense (a line of Part 4, lines 8521 to 9270) is entered with the T5013 slip answer yes
    parts:
      - tests:
          - {reads: count, position: "2", relation: equal_to, than: "1"}
      - tests:
          - {reads: amount, position: "4", relation: not_equal_to, than: "0"}
          - {reads: amount, position: "5", relation: not_equal_to, than: "0"}
          - {reads: amount, position: "6", relation: not_equal_to, than: "0"}
          - {reads: amount, position: "7", relation: not_equal_to, than: "0"}
          - {reads: amount, position: "8", relation: not_equal_to, than: "0"}
          - {reads: amount, position: "9", relation: not_equal_to, than: "0"}
          - {reads: amount, position: "10", relation: not_equal_to, than: "0"}
          - {reads: amount, position: "11", relation: not_equal_to, than: "0"}
          - {reads: amount, position: "12", relation: not_equal_to, than: "0"}
          - {reads: amount, position: "13", relation: not_equal_to, than: "0"}
          - {reads: amount, position: "14", relation: not_equal_to, than: "0"}
          - {reads: amount, position: "15", relation: not_equal_to, than: "0"}
          - {reads: amount, position: "16", relation: not_equal_to, than: "0"}
  - text: >-
      a recapture or terminal loss (lines 9947, 9948) is entered with the T5013 slip answer yes
    parts:
      - tests:
          - {reads: count, position: "2", relation: equal_to, than: "1"}
      - tests:
          - {reads: amount, position: "17", relation: not_equal_to, than: "0"}
          - {reads: amount, position: "18", relation: not_equal_to, than: "0"}
  - text: >-
      a land addition or disposition (lines 9923, 9924) is entered with the T5013 slip answer yes
    parts:
      - tests:
          - {reads: count, position: "2", relation: equal_to, than: "1"}
      - tests:
          - {reads: amount, position: "19", relation: not_equal_to, than: "0"}
          - {reads: amount, position: "20", relation: not_equal_to, than: "0"}
  - text: >-
      an opening UCC, an addition or a remaining personal part of a row of Area A (columns 2, 3, 4,
      11 and 12, Note 9) is entered with the T5013 slip answer yes
    parts:
      - tests:
          - {reads: count, position: "2", relation: equal_to, than: "1"}
      - tests:
          - {reads: amount, position: "21", relation: not_equal_to, than: "0"}
          - {reads: amount, position: "22", relation: not_equal_to, than: "0"}
          - {reads: amount, position: "23", relation: not_equal_to, than: "0"}
  - text: >-
      an equipment addition of Area B or a building addition of Area C (lines 9925, 9927) is
      entered with the T5013 slip answer yes
    parts:
      - tests:
          - {reads: count, position: "2", relation: equal_to, than: "1"}
      - tests:
          - {reads: amount, position: "24", relation: not_equal_to, than: "0"}
          - {reads: amount, position: "25", relation: not_equal_to, than: "0"}
