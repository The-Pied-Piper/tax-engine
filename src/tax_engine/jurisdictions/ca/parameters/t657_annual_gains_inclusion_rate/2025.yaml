# Form T657 Step 1 line 4 "Inclusion rate × 1/2", then line 5 "Line 3 multiplied by the inclusion
# rate on line 4 (if negative, enter "0")". The form prints no rounding rule, so the repo convention
# applies: the figure rounds half-up to the cent.
family: ca/t657_annual_gains_inclusion_rate
tax_year: 2025
kind: fraction
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t657/t657-25e.pdf
rounding: {increment: "0.01", mode: half_up}
numerator: "1"
denominator: "2"
