# Form T1032 E (25), Step 2, page 2: "Line 20: Maximum rate 50%", by which line 21 "Line 19 multiplied
# by line 20 Maximum split-pension amount =" multiplies line 19. The printed 50% is the rate, 0.5.
# Line 21 is a dollars-and-cents box, so the product rounds half-up to the cent, the owner's
# decision, as the form states no rounding rule.
family: ca/t1032_maximum_split_rate
tax_year: 2025
kind: rate
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t1032/t1032-25e.txt
rounding: {increment: "0.01", mode: half_up}
rate: "0.5"
