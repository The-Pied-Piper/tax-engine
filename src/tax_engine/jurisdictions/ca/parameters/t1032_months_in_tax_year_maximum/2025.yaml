# Form T1032 E (25), Step 2, page 2, "Line 18: Number of months married or living common-law": "Divided by Number of months in the tax year (12)
# (Note 1) multiplied by Amount from line 17". The 12 is the most the denominator can be. Note 1
# replaces it with the number of months up to and including the month of death for a deceased
# transferring spouse, and the entered months are checked against this maximum. The figure is a
# count of months, claimed whole, so it borrows the credit kind, as the other printed maxima do.
family: ca/t1032_months_in_tax_year_maximum
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t1032/t1032-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "12"
