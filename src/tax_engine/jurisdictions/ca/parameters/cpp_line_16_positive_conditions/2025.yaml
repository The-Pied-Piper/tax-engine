# Entry condition of Schedule 8 Part 3b line 39, 2025 tax year (form 5000-S8, page 6): "If line
# 16 is positive, enter whichever is less: Line 39: amount from line 16 or line 38. If not, enter
# "0"." The count is 1 when line 16 (line 14 minus line 15, "if negative, show in brackets") is
# more than 0, and 0 otherwise. Not a dollars-and-cents box, so no rounding.
family: ca/cpp_line_16_positive_conditions
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s8/5000-s8-25e.txt
rounding: none
count_when_any_applies: "1"
conditions:
  - text: >-
      line 16 is positive
    parts:
      - tests:
          - {reads: amount, position: "1", relation: more_than, than: "0"}
