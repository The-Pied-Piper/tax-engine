# RESP AIPs additional tax rate, Part B, 2025 tax year (Form T1172): line 12 "Rate of the
# additional tax on AIPs × 20%" and line 13 "Additional tax on AIPs: line 11 multiplied by line
# 12." The form prints the rate once in each part, so each part has its own dataset.
# Line 13 is a dollars-and-cents box, so the product rounds half-up to the cent, the owner's
# decision, as the form states no rounding rule.
family: ca/resp_aips_part_b_rate
tax_year: 2025
kind: rate
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t1172/t1172-25e.pdf
rounding: {increment: "0.01", mode: half_up}
rate: "0.20"
