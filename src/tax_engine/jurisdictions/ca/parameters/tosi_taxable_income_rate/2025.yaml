# TOSI-adjusted taxable income rate, 2025 tax year (Form T1206 Part 2, line 8A): "TOSI-adjusted
# taxable income Amount from line 8 ÷ 14.5% =", line 8 being the federal tax on split income. The
# same 14.5% is printed on Schedule 11 line 11, but the form's own line gets a dataset of its own.
# Line 8A is a dollars-and-cents box, so the quotient rounds half-up to the cent, the owner's
# decision, as the form states no rounding rule.
family: ca/tosi_taxable_income_rate
tax_year: 2025
kind: rate
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t1206/t1206-25e.pdf
rounding: {increment: "0.01", mode: half_up}
rate: "0.145"
