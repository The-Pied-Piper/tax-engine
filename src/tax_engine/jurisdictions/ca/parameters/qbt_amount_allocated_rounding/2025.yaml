# Form T2048 (2025), Part 2 line 3 "Line 1 multiplied by the percentage from line 2" (line 1 "Total
# eligible amount for the joint election (maximum of $10 million per election)", line 2 "Percentage
# allocated to you"). The form prints no figure and no rounding rule, so the repo convention
# applies: the product rounds half-up to the cent, once.
family: ca/qbt_amount_allocated_rounding
tax_year: 2025
kind: rounding_only
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2048/t2048-25e.pdf
rounding: {increment: "0.01", mode: half_up}
