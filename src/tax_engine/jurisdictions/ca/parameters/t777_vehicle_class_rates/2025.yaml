# Capital cost allowance class rates of Form T777 Part A, the vehicle classes 10, 54 and 55, 2025 tax
# year (line 25, Capital cost allowance (see Part A and Part B on pages 4 and 5)). T777 pages 4 and 5,
# Part A: the printed rates are Class 10 30%, Class 54 30% and Class 55 40%. Note (8): "For ZEVs and
# AIIPs (under proposed changes, acquired before 2025) that became available for use in 2025, the
# relevant factors are 1 1/2 (Class 54) and 7/8 (Class 55) and 0 for the remaining AIIPs." Note (9):
# "Under proposed changes, for ZEVs and RIIPs acquired after 2024 that became available for use in
# 2025, the relevant factors are 2 1/3 (Class 54), 1 1/2 (Class 55), and 1/2 (Class 8 and 10)." Note
# (12): "Recapture and terminal loss rules do not apply." is printed for Part B, not for Part A: the
# recapture_and_terminal_loss setting below is the shared table's (applies), read from the same classes of
# `ca/cca_class_rates`, which Form T2125 Area A reads, so a Class 54 or 55 row gives the same CCA on either
# form. Class 10 includes all vehicles that meet the definition of a motor vehicle, except a passenger
# vehicle in Class 10.1 (Part B). Classes 8 and 10.1 are not listed here. The rounding is the owner's
# decision, as the form states no rounding rule.
family: ca/t777_vehicle_class_rates
tax_year: 2025
kind: class_rates
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t777/t777-25e.pdf
rounding: {increment: "0.01", mode: half_up}
full_year_days: "365"
longest_fiscal_period_days: "366"
classes:
  "10":
    rate: "0.30"
    half_year_rule: applies
    recapture_and_terminal_loss: applies
    half_year_rule_on_sale: does_not_apply
    aiip_factor: {numerator: "0", denominator: "1"}
    riip_factor: {numerator: "1", denominator: "2"}
  "54":
    rate: "0.30"
    half_year_rule: applies
    recapture_and_terminal_loss: applies
    half_year_rule_on_sale: does_not_apply
    aiip_factor: {numerator: "3", denominator: "2"}
    riip_factor: {numerator: "7", denominator: "3"}
  "55":
    rate: "0.40"
    half_year_rule: applies
    recapture_and_terminal_loss: applies
    half_year_rule_on_sale: does_not_apply
    aiip_factor: {numerator: "7", denominator: "8"}
    riip_factor: {numerator: "3", denominator: "2"}
