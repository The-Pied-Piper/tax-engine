# Entry condition of Schedule 8 Part 3b line 32, 2025 tax year (form 5000-S8, page 6): "If line 16
# is negative and line 19 is positive, enter whichever is less: Line 32: amount from line 19 or
# line 31. If not, enter "0"." The count is 1 when line 16 is negative (the count of line 16 not
# negative is 0) and line 19 is more than 0; 0 otherwise. Not a dollars-and-cents box, so no rounding.
family: ca/cpp_line_16_negative_line_19_positive_conditions
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s8/5000-s8-25e.txt
rounding: none
count_when_any_applies: "1"
conditions:
  - text: >-
      line 16 is negative and line 19 is positive
    parts:
      - tests:
          - {reads: count, position: "1", relation: equal_to, than: "0"}
      - tests:
          - {reads: amount, position: "1", relation: more_than, than: "0"}
