# Capital gains deductions adjustment factor, row "From 1990 to 1999" (C), 2025 tax year (Form
# T1436, Capital Gains Worksheet, "Calculating your pre-1986 capital loss balance available for
# 2025, if any", "Capital gains deductions you claimed:"): the amount is multiplied by 0.6667.
# The form prints 0.6667, 2/3 rounded for print; the exact fraction keeps the calculation exact
# (as Chart A's factor for the same period does).
# The cell is a dollars-and-cents box, so the product rounds half-up to the cent, the owner's
# decision, as the form states no rounding rule.
family: ca/pre_1986_deductions_factor_1990_to_1999
tax_year: 2025
kind: fraction
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t1436/t1436-25e.pdf
rounding: {increment: "0.01", mode: half_up}
numerator: "2"
denominator: "3"
