# Condition under which the count of a filer entered as both under 18 and 18 or older is refused,
# 2025 tax year: under 18 on December 31, 2025 (Worksheet ON428 line 58440) and 18 years of age or
# older at the end of 2025 exclude each other, so a count of 1
# (`ca/under_18_and_aged_18_or_older`) is an input error, not two ages at once. The forms print no
# refusal; it is the guard of this check. The count is 1 when it applies and 0 otherwise. A count,
# not a dollars-and-cents box, so there is no rounding.
family: ca/under_18_and_aged_18_or_older_refused
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-d/5006-d-25e.txt
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-g/5000-g-25e.txt
rounding: none
count_when_any_applies: "1"
conditions:
  - text: >-
      under 18 years of age on December 31, 2025 and 18 years of age or older at the end of 2025
      are both entered, but a filer cannot be both
    parts:
      - tests:
          - {reads: count, position: "1", relation: equal_to, than: "1"}
