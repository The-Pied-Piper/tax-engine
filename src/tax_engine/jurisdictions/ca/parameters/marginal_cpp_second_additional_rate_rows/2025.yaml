# Take-home marginal rate, CPP second additional contribution rate, 2025 tax year, Schedule 8 (form 5000-S8): Part 3 line 22 "amount
# from line 4 multiplied by 4%", where line 4 is "Line 2 minus line 3" (line 3 is "Amount from line B of Part 2"): the
# earnings above the maximum pensionable earnings ($71,300) and up to line D of Part 2, the additional maximum
# pensionable earnings ($81,200). So a further dollar of salary adds 4% of a dollar there and nothing outside it. The same
# 4% is what T1 line 22215 (Schedule 8 line 28) takes off the income. The base is the salary (T1 line 10100); no
# rounding.
