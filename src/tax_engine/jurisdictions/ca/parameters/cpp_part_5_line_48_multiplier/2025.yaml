# Schedule 8 Part 5 line 48 "Amount from line 24 of Part 3 (if positive) multiplied by 2 =" (form
# 5000-S8, 2025): 2 is more than 1, so it is a fraction, 2/1, kept as given, not a rate.
# Line 48 is a dollars-and-cents box, so the product rounds half-up to the cent, the owner's
# decision, as the form states no rounding rule.
family: ca/cpp_part_5_line_48_multiplier
tax_year: 2025
kind: fraction
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s8/5000-s8-25e.txt
rounding: {increment: "0.01", mode: half_up}
numerator: "2"
denominator: "1"
