# Business investment loss inclusion rate, 2025 tax year (Form T1436, Capital Gains
# Worksheet): "Line 21700 - Allowable business investment loss", line 19 "Inclusion rate
# for 2025" 50%, from which line 20 "Line 18 multiplied by the percentage on line 19" takes
# line 18 "Line 16 minus line 17". Line 19 is printed as a percentage, so the rate is the
# fraction one half. Line 20 is a dollars-and-cents box, so the product rounds half-up to
# the cent, the owner's decision, as the form states no rounding rule.
family: ca/business_investment_loss_inclusion_rate
tax_year: 2025
kind: rate
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t1436/t1436-25e.pdf
rounding: {increment: "0.01", mode: half_up}
rate: "0.5"
