# Maximum CPP pensionable earnings per T4 slip, 2025 tax year (T1-2025 Schedule 8, form
# 5000-S8). Part 3 line 1: "Total CPP pensionable earnings from box 26 of all of your T4
# slips (if box 26 is blank, enter the amount from box 14) (maximum $81,200 per slip)".
# The figure is taken as printed. It is the bound line 1 caps the earnings at, so it is an
# amount for the capped_amount capability: earnings above it are produced as this figure.
# Dollars and cents, so half-up to the cent.
family: ca/cpp_pensionable_earnings_per_slip_maximum
tax_year: 2025
kind: amount
title: "maximum per slip"
unit: ca/cad
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s8/5000-s8-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "81200"
