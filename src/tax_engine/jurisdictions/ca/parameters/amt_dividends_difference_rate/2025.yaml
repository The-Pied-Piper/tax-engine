# Rate of amount C, the difference of amount A and amount B, 2025 tax year (Form T691 Part 1
# line 85): "Amount A minus Amount B = C × 27.5362% =". The 27.5362% is the printed percentage of
# the form, a rate of 0.275362, and the product is a dollars-and-cents line, so it rounds
# half-up to the cent, the owner's decision, as the form states no rounding rule.
family: ca/amt_dividends_difference_rate
tax_year: 2025
kind: rate
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t691/t691-25e.pdf
rounding: {increment: "0.01", mode: half_up}
rate: "0.275362"
