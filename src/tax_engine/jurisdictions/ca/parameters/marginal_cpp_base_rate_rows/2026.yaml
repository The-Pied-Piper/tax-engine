# Provisional: taken from T4127 (Jan 2026); to be confirmed against the 2026 form text when CRA publishes it.
# Derivation: the 2025 form's layout (Schedule 8, form 5000-S8) with the 2026 maximum pensionable earnings $74,600.00 and additional maximum pensionable earnings $85,000.00 of T4127 (Jan 2026) Tables 8.3 ($74,600) and 8.6 ($85,000); the basic exemption $3,500 and the rates are those of the 2025 form.
# Take-home marginal rate, CPP base contribution rate, 2026 tax year, Schedule 8 (form 5000-S8, 2025 text; the 2026 maxima from T4127): Part 3 line 11 "amount from line 7
# multiplied by 4.95%", where line 7 is "Line 5 minus line 6" and line 6 is "Amount from line E of Part 2" (the
# maximum basic exemption, $3,500; line B of Part 2 is the maximum pensionable earnings, $74,600). So a further dollar
# of salary adds 4.95% of a dollar of CPP base contribution above $3,500 and up to $74,600, and nothing outside it.
# The base is the salary (T1 line 10100) and the rate is the band's `rate`; a band with no `rate` gives 0. No
# rounding.
family: ca/marginal_cpp_base_rate_rows
tax_year: 2026
kind: amount_by_band
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pub/t4127-jan/t4127-01-26e.pdf
rounding: none
rows:
  - {over: "0", amount: "0"}
  - {over: "3500", minus: "3500", rate: "0.0495", plus: "0"}
  - {over: "74600", amount: "0"}
