# Net capital loss adjustment factor for carry-forward losses, row "In 1988 and 1989", 2025 tax year
# (Form T1436, Capital Gains Worksheet, "Line 25300 - Net capital loss of other years (if you have
# pre-1986 capital loss balance)", "Chart A - Adjustment calculation for carry-forward losses"):
# column (F) "Adjustment factor (for carry-forward losses)", which column (G) "Net capital loss
# balance available to carry forward (column E multiplied by column F)" multiplies by.
# The form prints 1.33, 4/3 rounded for print; the exact fraction keeps the chart exact (3/4 times
# 4/3 is 1, where 0.75 times 1.33 is 0.9975).
# Column (G) is a dollars-and-cents box, so the product rounds half-up to the cent, the owner's
# decision, as the form states no rounding rule.
family: ca/net_capital_loss_carry_forward_factor_1988_and_1989
tax_year: 2025
kind: fraction
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t1436/t1436-25e.pdf
rounding: {increment: "0.01", mode: half_up}
numerator: "4"
denominator: "3"
