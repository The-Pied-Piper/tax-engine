# Condition under which the count of Schedule 8 Part 4 completed with employment earnings is refused,
# 2025 tax year: Part 4 is for "Contributions on self-employment income and other earnings only (no
# employment income)", and the employment income of Part 3 line 1 is taken by Part 5 ("Complete this
# part if you are reporting both: employment income (complete Part 3 first)"), so a count of 1
# (`ca/cpp_part_4_with_employment_earnings`) is an input error, not a second set of contributions. The
# schedule prints no refusal; it is the guard of this check. The count is 1 when it applies and 0
# otherwise. A count, not a dollars-and-cents box, so there is no rounding.
family: ca/cpp_part_4_with_employment_earnings_refused
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s8/5000-s8-25e.txt
rounding: none
count_when_any_applies: "1"
conditions:
  - text: >-
      Part 4 is completed, but Part 4 is for self-employment income and other earnings only (no
      employment income); use Part 5 when you also have employment income
    parts:
      - tests:
          - {reads: count, position: "1", relation: equal_to, than: "1"}
