# Entry condition of Schedule 8 Part 5 lines 34 to 42 (form 5000-S8, 2025): "If the amount from
# line 33 is more than line 17, complete lines 34 to 42. If not, enter "0" on line 42 and
# continue at line 43." So the count is 1 when line 33 is more than line 17 and 0 when it is
# not. The caller's amounts are read in the order line 33, then line 17.
# The result is a count, not a dollars-and-cents box, so there is no rounding.
family: ca/cpp_part_5_line_33_more_than_line_17_conditions
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s8/5000-s8-25e.txt
rounding: none
count_when_any_applies: "1"
conditions:
  - text: >-
      the amount from line 33 is more than line 17
    parts:
      - tests:
          - {reads: amount, position: "1", relation: more_than, against: "2"}
