# Take-home average rate rounding, 2025 tax year: the rule for the take-home average rate, total
# deductions (income tax, CPP, CPP2, EI) over the salary. The exact quotient is rounded once,
# half-up to 0.0001, so a rate as a fraction such as 0.1598 prints as 15.98%. No form prints this
# figure or a precision for it, so half-up to four places is the project's choice (the rule the
# provinces' own average-rate steps used). A figure that needs a different rule gets a dataset of
# its own. The take-home marginal rate steps of every province use the same rule.
family: ca/take_home_average_rate_rounding
tax_year: 2025
kind: rounding_only
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-c/5006-c-25e.txt
rounding: {increment: "0.0001", mode: half_up}
