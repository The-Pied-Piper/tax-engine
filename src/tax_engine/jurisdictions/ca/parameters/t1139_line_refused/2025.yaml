# Condition under which the line of a business on Form T1139 is refused, 2025 tax year: Part 4
# "Report amount G as self-employment income on your return" (and Part 5 for amount L) lists five
# lines (1 business income on line 13500, 2 professional income on line 13700, 3 commission income
# on line 13900, 4 farming income on line 14100, 5 fishing income on line 14300; the form names no
# codes, a listed check). A number that is none of them names no line, so the net income of the
# business would go to none of them. The one condition has a part for each listed number, "not
# equal to" it: every part holds, so the condition applies, only when the number is none of 1 to 5.
# The result is a count, not a dollars-and-cents box, so there is no rounding. Confirmed from the
# PDF; no .txt published.
family: ca/t1139_line_refused
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t1139/t1139-25e.pdf
rounding: none
count_when_any_applies: "1"
conditions:
  - text: the line number of the business is not 1, 2, 3, 4 or 5
    parts:
      - tests:
          - {reads: count, position: "1", relation: not_equal_to, than: "1"}
      - tests:
          - {reads: count, position: "1", relation: not_equal_to, than: "2"}
      - tests:
          - {reads: count, position: "1", relation: not_equal_to, than: "3"}
      - tests:
          - {reads: count, position: "1", relation: not_equal_to, than: "4"}
      - tests:
          - {reads: count, position: "1", relation: not_equal_to, than: "5"}
