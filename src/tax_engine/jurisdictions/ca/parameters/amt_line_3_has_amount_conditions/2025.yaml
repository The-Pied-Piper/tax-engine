# Condition for line 4 of Part 3 of the alternative minimum tax, 2025 tax year (Form T691 Part 3
# line 4): "If you have an amount on line 3, enter that amount. If not, and you are a non-resident
# or deemed resident, enter the amount from line 2. Otherwise, enter "0"." The one condition,
# "you have an amount on line 3", reads line 3's amount: a count of 1 when it is not 0, and 0
# otherwise. A negative line 3 is an amount, as the form prints no floor on line 3. The result is a
# count, not a dollars-and-cents box, so there is no rounding.
family: ca/amt_line_3_has_amount_conditions
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t691/t691-25e.pdf
rounding: none
count_when_any_applies: "1"
conditions:
  - text: you have an amount on line 3
    parts:
      - tests:
          - {reads: amount, position: "1", relation: not_equal_to, than: "0"}
