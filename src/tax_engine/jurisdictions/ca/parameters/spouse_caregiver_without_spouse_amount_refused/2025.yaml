# Condition under which the count of the Canada caregiver amount for the spouse claimed without the
# spouse amount is refused, 2025 tax year: Schedule 5 line 30425 applies "if you can claim an amount
# for your spouse or common-law partner on line 30300 of your return", so a count of 1
# (`ca/spouse_caregiver_without_spouse_amount`) is an input error, not an amount added to nothing.
# The schedule prints no refusal; it is the guard of this check. The count is 1 when it applies and
# 0 otherwise. A count, not a dollars-and-cents box, so there is no rounding.
family: ca/spouse_caregiver_without_spouse_amount_refused
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s5/5000-s5-25e.txt
rounding: none
count_when_any_applies: "1"
conditions:
  - text: >-
      line 51090 is entered (the Canada caregiver amount for the spouse) but line 30300 is nil, and
      line 30425 applies only if you can claim an amount for your spouse or common-law partner on
      line 30300 of your return
    parts:
      - tests:
          - {reads: count, position: "1", relation: equal_to, than: "1"}
