# Medical expenses threshold ceiling, 2025 tax year (T1-2025, form 5006-R): line 109 "Enter
# whichever is less: $2,834 or the amount from line 108." It is a plain cap on the share of
# the net income that line 110 takes off the filer's own medical expenses.
# Line 109 is a dollars-and-cents box, so the lesser rounds half-up to the cent, the
# owner's decision, as the form states no rounding rule.
family: ca/medical_threshold_ceiling
tax_year: 2025
kind: amount
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-r/5006-r-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "2834"
