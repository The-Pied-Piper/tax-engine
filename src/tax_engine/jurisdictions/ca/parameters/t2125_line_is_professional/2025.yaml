# Form T2125 (2025), Part 5 line 9946 "Your net income (loss)" is reported on the applicable line of
# the return "as indicated below": professional income on line 13700. The statement's line code is
# the number of that choice (1 business, 2 professional, 3 commission; the form names no codes, a
# listed check). The count is 1 when the code is 2 and 0 otherwise, so a code outside 1 to 3 flags
# no line. A count, not a dollars-and-cents box, so there is no rounding. Confirmed from the PDF; no
# .txt published.
family: ca/t2125_line_is_professional
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2125/t2125-25e.pdf
rounding: none
count_when_any_applies: "1"
conditions:
  - text: "professional income on line 13700"
    parts:
      - tests:
          - {reads: count, position: "1", relation: equal_to, than: "2"}
