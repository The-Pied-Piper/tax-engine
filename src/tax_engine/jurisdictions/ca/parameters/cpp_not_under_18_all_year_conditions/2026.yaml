# Provisional: moved on by one year from 2025; to be confirmed against the 2026 form text when CRA publishes it.
# Derivation: the same age tests applied to 2026 (not yet 18 for all of 2026 is born in 2009 or later; 70 or older for all of 2026 is born in 1955 or earlier); the 2026 Schedule 8 is not yet published, so it is unconfirmed.
# Schedule 8 Part 2 line A, 2026: a filer born after 2008 was not yet 18 in any month of 2026; born in 2008 turned 18 in 2026 and stays typed in. The year is more than 2008, the count is 0, else 1.
family: ca/cpp_not_under_18_all_year_conditions
tax_year: 2026
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s8/5000-s8-25e.txt
rounding: none
count_when_any_applies: "0"
conditions:
  - text: You were born after 2008
    parts:
      - tests:
          - {reads: count, position: "1", relation: more_than, than: "2008"}
