# Schedule 8 (5000-S8) Part 2 line A, 2025: a filer born after 2007 was not yet 18 in any month of 2025 (condition a) covers a filer who turned 18 in 2025, born in 2007, and stays typed in), so no CPP months. The filer gives a birth year; in the form wording turned round because conditions only test "more than": the year is more than 2007, the count is 0 (no months), else 1. Not a printed sentence: the form prints no line for a filer under 18 all year.
family: ca/cpp_not_under_18_all_year_conditions
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s8/5000-s8-25e.txt
rounding: none
count_when_any_applies: "0"
conditions:
  - text: You were born after 2007
    parts:
      - tests:
          - {reads: count, position: "1", relation: more_than, than: "2007"}
