# Canada caregiver amount for a spouse, base amount, 2025 tax year (Schedule 5, form
# 5000-S5): "Line 30425 - Canada caregiver amount for spouse or common-law partner, or
# eligible dependant age 18 or older", line 1 "Base amount 28,798.00", from which line 3
# "Line 1 minus line 2 (if negative, enter "0") (maximum $8,601)" takes line 2 "Net income
# for this person from line 23600 of their return". It borrows the credit kind because it
# is claimed whole, as the basic reduction is.
# Line 1 is a dollars-and-cents box, so the amount rounds half-up to the cent, the
# owner's decision, as the form states no rounding rule.
family: ca/spouse_caregiver_base
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s5/5000-s5-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "28798.00"
