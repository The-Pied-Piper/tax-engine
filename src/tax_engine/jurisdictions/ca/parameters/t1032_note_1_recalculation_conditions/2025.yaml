# Form T1032 E (25), Step 4 Part B, page 3, Note 1: "If the result is $4,000 or more, enter on line 33
# the amount from line 30. If the result is less than $4,000, use that result as the amount for line
# 17 to recalculate lines 18 to 31." The count is 1 when Note 1 applies (the count the caller gives,
# read first) and the result is less than $4,000, and 0 otherwise. The caller's amounts are read in
# the order: the $4,000, the result. The result is a count, not a dollars-and-cents box, so there is
# no rounding.
family: ca/t1032_note_1_recalculation_conditions
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t1032/t1032-25e.pdf
rounding: none
count_when_any_applies: "1"
conditions:
  - text: Note 1 applies and the result is less than $4,000
    parts:
      - tests:
          - {reads: count, position: "1", relation: more_than, than: "0"}
      - tests:
          - {reads: amount, position: "1", relation: more_than, against: "2"}
