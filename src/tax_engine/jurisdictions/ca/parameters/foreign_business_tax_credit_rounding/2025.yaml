# Rounding of the federal business foreign tax credit, 2025 tax year (Form T2209): line 4 "Business
# income tax paid to a foreign country (5) for the year", line 5 "Net foreign business income (7)
# 43900" "x Basic federal tax (8) =" over "Net income (3)" and line 11 "Enter whichever is less:
# the amount from line 4, 7 or 10. Federal business foreign tax credit". The form prints no figure
# and no rounding rule; line 5 is a dollars-and-cents box, so its quotient rounds half-up to the
# cent, the owner's decision.
family: ca/foreign_business_tax_credit_rounding
tax_year: 2025
kind: rounding_only
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2209/t2209-25e.pdf
rounding: {increment: "0.01", mode: half_up}
