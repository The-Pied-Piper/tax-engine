# Provisional: taken from T4127 (Jan 2026); to be confirmed against the 2026 form text when CRA publishes it.
# Derivation: annual figure x n/12, rounded half-up to the cent; reproduces the 2025 rows.
# Maximum pensionable earnings, 2026 tax year. The 2026 Schedule 8 (form 5000-S8) is not
# published yet. T4127 (122nd Edition) gives the 2026 maximum pensionable earnings of $74,600,
# and the Schedule 8 "Monthly proration" column is that figure times the number of months from
# line A (Part 2), rounded half-up to the cent.
# The rows are one for each number of months from 1 to 12. Part 4 line 5 is "Amount from line B
# of Part 2". The table has no row for 0 months, so a count without a row is refused.
# The figures are in dollars and cents, so each rounds half-up to the cent, which changes none
# of them.
family: ca/cpp_maximum_pensionable_earnings
tax_year: 2026
kind: amount_by_count
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pub/t4127-jan/t4127-01-26e.pdf
rounding: {increment: "0.01", mode: half_up}
amounts:
  "1": "6216.67"
  "2": "12433.33"
  "3": "18650.00"
  "4": "24866.67"
  "5": "31083.33"
  "6": "37300.00"
  "7": "43516.67"
  "8": "49733.33"
  "9": "55950.00"
