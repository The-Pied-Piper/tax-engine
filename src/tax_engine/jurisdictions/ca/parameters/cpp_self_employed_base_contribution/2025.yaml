# Base CPP contribution on self-employment income, 2025 tax year (T1-2025 Schedule 8, form
# 5000-S8). Part 4 line 9 "Line 7 minus line 8 (if negative, enter "0") (maximum $67,800)";
# line 10 "amount from line 9 multiplied by 9.9% (maximum $6,712.20)". The earnings of line
# 9 are already net of the basic exemption and the maximum pensionable earnings (lines 3 to
# 9), so the tier starts at 0 and ends at line 9's printed maximum of $67,800. A
# self-employed person pays both halves, so 9.9% is twice the employee's 4.95%; the CRA rate
# page's 2025 row gives the employee rate.
# Line 14 "Line 10 plus line 13 Enter this amount (in dollars and cents) on line 42100 of
# your return." and line 15 "amount from line 10 multiplied by 50%" are in dollars and
# cents, so the tier rounds half-up to the cent.
family: ca/cpp_self_employed_base_contribution
tax_year: 2025
kind: contribution_tier
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s8/5000-s8-25e.txt
  - https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/payroll/payroll-deductions-contributions/canada-pension-plan-cpp/cpp-contribution-rates-maximums-exemptions.html
rounding: {increment: "0.01", mode: half_up}
rate: "0.099"
lower: "0"
upper: "67800"
maximum: "6712.20"
