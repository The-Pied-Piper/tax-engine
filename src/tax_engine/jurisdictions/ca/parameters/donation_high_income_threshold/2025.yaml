# Donations high income threshold, 2025 tax year (Schedule 9, form 5000-S9): line 18 "Income
# threshold 253,414.00", the amount that line 19 takes from the taxable income. It borrows
# the credit kind because it is claimed whole, as the basic personal amount is.
# Line 18 is a dollars-and-cents box, so the amount rounds half-up to the cent, the owner's
# decision, as the form states no rounding rule.
family: ca/donation_high_income_threshold
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s9/5000-s9-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "253414.00"
