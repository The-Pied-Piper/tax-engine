# Federal logging tax credit, 2025 tax year: 5000-G (General Income Tax and Benefit Guide 2025),
# "Federal logging tax credit": "To calculate your credit for each province where you operated, use
# the lower of the following amounts for each province you had a logging operation in: 66.6667% of
# the logging tax that you paid to that province for the year". The guide prints the percentage as
# 66.6667%, so the rate is 0.666667 of the logging tax paid to the province. The product rounds
# half-up to the cent, as every dollars-and-cents box on the forms does: the guide states no
# rounding rule, so that is the owner's decision.
family: ca/logging_tax_rate
tax_year: 2025
kind: rate
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pub/5000-g/5000-g-25e.txt
rounding: {increment: "0.01", mode: half_up}
rate: "0.666667"
