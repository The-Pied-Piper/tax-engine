# Aged 19 or older on 31 December 2025, the age test of the refundable credits that only a filer 19 or older can claim without a spouse, a common-law partner or a child (BC guide 5010-PC, Form BC479, Sales tax credit: "You can claim this credit if, on December 31, 2025, you were a resident of British Columbia and you met any of the following conditions: You were 19 years of age or older / You had a spouse or common-law partner / You were a parent of a child"; Manitoba guide 5007-PC, Form MB479, Personal tax credit: "If you were under 19 years of age at the end of the year, you can only claim this credit if one of the following applies to you: You had a spouse or common-law partner / You were a parent / You can claim the Manitoba homeowners affordability tax credit on your 2025 return"). The filer gives a birth year; one condition, in the guides' wording turned round because the conditions only test "more than": the birth year is more than 2006 (under 19 on 31 December 2025), in which case the count is 0, else 1. The result is a count, not a dollars-and-cents box, so there is no rounding.
family: ca/age_19_or_older_conditions
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pub/5010-pc/5010-pc-25e.txt
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pub/5007-pc/5007-pc-25e.txt
rounding: none
count_when_any_applies: "0"
conditions:
  - text: You were born after 2006
    parts:
      - tests:
          - {reads: count, position: "1", relation: more_than, than: "2006"}
