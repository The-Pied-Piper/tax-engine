# The $1,000 of the apprentice mechanic tools formula, Guide T4044 (2025) "Deduction for tools for an
# eligible apprentice mechanic": "B = the lesser of: [...] 2. the greater of: - $1,000 + the Canada
# employment amount claimed on line 31260 of your income tax and benefit return (maximum $1,471)". It
# is the printed $1,000, entered whole as one step of the worksheet through core/credit_amount, so it
# is the `credit` kind. It is a dollars-and-cents figure, so the amount rounds half-up to the cent,
# the owner's decision, as the guide states no rounding rule.
family: ca/t777_apprentice_mechanic_tools_base
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t4044/t4044-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "1000"
