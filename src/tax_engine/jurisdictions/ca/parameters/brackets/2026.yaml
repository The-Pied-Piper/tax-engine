# Provisional: taken from T4127 (Jan 2026); to be confirmed against the 2026 form text when CRA publishes it.
# Derivation: thresholds and rates as printed in T4127 Table 8.1; tax_at_start calculated as the cumulative tax on the earlier brackets, rounded half-up to the cent (reproduces the 2025 printed constants).
# Federal income tax brackets, 2026 tax year, from T4127 (Jan 2026), Table 8.1.
# The lowest rate is a full-year 14% in 2026.
# T4127 Table 8.1 also prints different whole-dollar K/KP constants; those are not the
# form's line 75 constants, which are not yet published.
# The 2026 T1 is not yet published, so these figures are not yet confirmed against it.
# Each bracket's `tax_at_start` is the cumulative tax on the earlier brackets, rounded
# half-up to the cent.
