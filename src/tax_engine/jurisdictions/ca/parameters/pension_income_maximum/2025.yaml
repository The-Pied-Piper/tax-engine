# Pension income maximum, 2025 tax year (Federal Worksheet, form 5000-D1): the last line of the
# pension chart, "Enter on line 31400 of your return whichever amount is less: line 8 or $2,000."
# (T1 line 97, "Pension income amount (use Federal Worksheet) (maximum $2,000)").
# It is a dollars-and-cents box, so the amount rounds half-up to the cent, the owner's
# decision, as the form states no rounding rule.
family: ca/pension_income_maximum
tax_year: 2025
kind: amount
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-d1/5000-d1-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "2000"
