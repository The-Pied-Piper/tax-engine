# Aged 65 or older on 31 December 2025, the test of every federal and provincial age amount that prints "if you were born in 1960 or earlier" (T1 line 78, line 30100, and the provincial forms, e.g. NS428 lines 10 and 98; guide 5000-G: "You can claim this amount if you were 65 years of age or older on December 31, 2025"). The filer gives a birth year; one condition, in the form's wording turned round because the conditions only test "more than": the birth year is more than 1960, in which case the count is 0, else 1. The result is a count, not a dollars-and-cents box, so there is no rounding.
family: ca/age_65_or_older_conditions
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-r/5006-r-25e.txt
rounding: none
count_when_any_applies: "0"
conditions:
  - text: You were born after 1960
    parts:
      - tests:
          - {reads: count, position: "1", relation: more_than, than: "1960"}
