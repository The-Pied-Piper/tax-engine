# Provisional: moved on from 2025; to be confirmed against the 2026 form text when CRA publishes it.
# Derivation: the cutoff is age 65 on 31 December of the tax year, so the 2025 year 1960 moves to 1961 for 2026 (a filer born in 1961 turns 65 in 2026); the 2026 Federal Worksheet 5000-D1 is not yet published, so it is unconfirmed.
# Aged 65 or older on 31 December 2026, the test of every federal and provincial age amount whose 2025 wording ("born in 1960 or earlier", 65 or older on 31 December) is moved forward one year; the 2026 text is not yet published (T1 line 78, line 30100, and the provincial forms, e.g. NS428 lines 10 and 98). The filer gives a birth year; one condition, in the form's wording turned round because the conditions only test "more than": the birth year is more than 1961, in which case the count is 0, else 1. The result is a count, not a dollars-and-cents box, so there is no rounding.
family: ca/age_65_or_older_conditions
tax_year: 2026
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-r/5006-r-25e.txt
rounding: none
count_when_any_applies: "0"
conditions:
  - text: You were born after 1961
    parts:
      - tests:
          - {reads: count, position: "1", relation: more_than, than: "1961"}
