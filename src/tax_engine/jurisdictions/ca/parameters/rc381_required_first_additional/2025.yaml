# Form RC381 (2025), Part 3 line 23
# "Required first additional contributions on CPP pensionable earnings:
# amount from line 18 x 1% = (maximum $678.00)"
# Part 3 line 43 "Required first additional contributions on QPP pensionable earnings:
# amount from line 38 x 1% = (maximum $678.00)" prints the same figures, so it reads this dataset.
# The band starts at 0 because the earnings on lines 18 and 38 are already net of the basic exemption.
# The form prints no rounding rule; the line is a dollars-and-cents amount, so the product
# rounds half-up to the cent, the owner's decision.
family: ca/rc381_required_first_additional
tax_year: 2025
kind: contribution_tier
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/rc381/rc381-25e.pdf
rounding: {increment: "0.01", mode: half_up}
rate: "0.01"
lower: "0"
upper: "67800"
maximum: "678.00"
