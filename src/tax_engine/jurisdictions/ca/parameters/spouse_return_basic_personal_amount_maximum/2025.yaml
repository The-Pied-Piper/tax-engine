# Largest spouse's basic personal amount, 2025 tax year (T1 line 77 and line 30000, "Basic personal
# amount: Line 77 and line 30000: ... (maximum $16,129)"), the most Schedule 2 line 8 "Amount from
# line 30000 of their return." can carry. It borrows the credit kind because the figure is claimed
# whole, as the basic personal amount is.
# The T1 states no rounding rule, so the figure rounds half-up to the cent, the owner's decision,
# the repo convention.
family: ca/spouse_return_basic_personal_amount_maximum
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-r/5006-r-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "16129"
