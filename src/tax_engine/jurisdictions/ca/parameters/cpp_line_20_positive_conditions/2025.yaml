# Entry condition of Schedule 8 Part 3b line 46, 2025 tax year (form 5000-S8, page 6): "If line 20
# is positive, enter whichever is less: Line 46: amount from line 20 or line 45. If not, enter
# "0"." The count is 1 when line 20 (line 16 plus line 19, "if negative, show in brackets") is more
# than 0, and 0 otherwise. Not a dollars-and-cents box, so no rounding.
family: ca/cpp_line_20_positive_conditions
tax_year: 2025
kind: conditions
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s8/5000-s8-25e.txt
rounding: none
count_when_any_applies: "1"
conditions:
  - text: >-
      line 20 is positive
    parts:
      - tests:
          - {reads: amount, position: "1", relation: more_than, than: "0"}
