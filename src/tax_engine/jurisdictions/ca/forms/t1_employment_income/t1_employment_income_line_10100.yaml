# T1 (5006-R, 2025) line 10100, employment income: "Line 1 and line 10100: Employment income"
# (5006-R page 3). The salary is the form's input (`ca/employment_income`); this step is the line the
# T1 prints for it, so the advanced view lists line 10100 once, here. Line 15000 reads this step.
form:
  name: ca/t1_employment_income
capabilities:
  - name: core/sum
    title: "Employment income"
    reference: "10100"
    unit: ca/cad
    params:
      rounding: ca/exact_rounding
    consumes:
      parts: [ca/employment_income]
    produces:
      output: ca/employment_income_line_10100
