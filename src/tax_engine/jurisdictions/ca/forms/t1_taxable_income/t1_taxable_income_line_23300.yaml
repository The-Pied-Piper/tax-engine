# T1 (2025) line 23300: "Line 53 and line 23300: Add lines 35 to 52." (5006-R page 4). The line is a
# sum, a calculation. A salary-only filer has one deduction, line 22215, which Schedule 8 line 28
# exports; this form reads it as the other form's export (`ca/schedule_8.<export>`, a record list of
# one amount), so the one step is core/record_total over those records, not core/sum.
form:
  name: ca/t1_taxable_income
capabilities:
  - name: core/record_total
    reference: "23300"
    unit: ca/cad
    consumes:
      records: ca/schedule_8.schedule_8_cpp_enhanced_contributions_on_return
    produces:
      output: ca/deductions_from_total_income
