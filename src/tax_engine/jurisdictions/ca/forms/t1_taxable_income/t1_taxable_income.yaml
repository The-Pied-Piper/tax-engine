# T1 General 2025 (form 5006-R), taxable income, lines 10100 to 26000. This part names
# the form and its exports; each line's capability goes in a part of its own with the same `form.name`.
# Exports: what the take-home forms read from this one.
#   - Line 23600 before its floor (`ca/net_income_signed`, net income from line 23400 less line 23500,
#     signed, `core/subtract`) is read by Schedule 6 line 7 and the provincial credit forms, which print the amount
#     as the form has it ("if negative, show in brackets").
#   - Lines 10100 and 10400 are not here: they are the `ca/t1_employment_income` form's, which every form that
#     reads them imports (line 15000 here, Schedule 6 line 1, line 31260 and ON428-A lines 1 and 2).
#   - Line 23600 (net income, `ca/net_income`, floored at "0") is read by T1 line 77 (line 30000).
#   - Lines 11700, 12500, 21300 and 23200 (the UCCB income, the RDSP income, the UCCB repayment and the RDSP
#     income repayment included on line 23200) are inputs of this form, each read as 0 when blank. Schedule 6
#     line 11, BC479 lines 2 and 4, MB479 lines 2 and 4 and NL428 lines 89 and 91 print them again as totals and
#     read them from here (`ca/uccb_income_line_11700`, `ca/rdsp_income_line_12500`, `ca/uccb_repayment_line_21300`,
#     `ca/rdsp_income_repayment_line_23200`), never asking for them a second time. They are not added into line
#     15000 or line 23300: the take-home T1 builds employment income only.
#   - Line 26000 (taxable income, `ca/taxable_income`) is read by T1 line 70 and the provincial tax form.
# Lines 15000 and 23300 are read inside the form by line 23400 and are not exported.
form:
  name: ca/t1_taxable_income
  title: "T1 Income Tax and Benefit Return"
  required: true
  exports:
    - ca/net_income
    - ca/net_income_signed
    - ca/taxable_income
    - ca/uccb_income_line_11700
    - ca/rdsp_income_line_12500
    - ca/uccb_repayment_line_21300
    - ca/rdsp_income_repayment_line_23200
capabilities: []
