# T1 (5006-R, 2025) line 11700 input a salary-only caller does not give.
# "Line 7 and line 11700: Universal child care benefit (UCCB) (see the RC62 slip)" (5006-R page 3). A salary-only caller has none, so a request that leaves the line out is
# read as blank, and the line 11700 step reads that blank as 0. This form owns the input: Schedule 6,
# BC479, MB479 and NL428 import line 11700 from this form's export and never ask for it themselves.
form:
  name: ca/t1_taxable_income
inputs:
  - name: ca/uccb_income
    title: "Universal child care benefit (UCCB)"
    reference: "11700"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 7 and line 11700: Universal child care benefit (UCCB) (see the RC62 slip)'
