# T1 General 2025 (form 5006-R), Step 5 line 126 / line 42900 "Line 121 minus line
# 125 (if negative, enter "0") Basic federal tax" (CRA 5006-R-25E). Line 121 is `ca/federal_tax_with_split_income` (line 40400)
# and line 125 is `ca/credits_against_basic_federal_tax`. The result is not below zero, and the
# difference is rounded once, half-up to the cent, through the shared `ca/cent_rounding` dataset,
# producing `ca/federal_tax_after_credits`.
form:
  name: ca/t1_tax_and_credits
capabilities:
  - name: core/subtract_not_below_zero
    title: "Basic federal tax"
    reference: "42900"
    unit: ca/cad
    params:
      rounding: ca/cent_rounding
    consumes:
      amount: ca/federal_tax_with_split_income
      less: ca/credits_against_basic_federal_tax
    produces:
      output: ca/federal_tax_after_credits
