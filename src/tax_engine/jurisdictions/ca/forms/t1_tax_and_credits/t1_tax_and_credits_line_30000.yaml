# T1 General 2025 (form 5006-R), Step 5 Part A line 30000 "Basic personal amount",
# "If the amount on line 23600 is $177,882 or less, enter $16,129. If the amount on line 23600 is
# $253,414 or more, enter $14,538. Otherwise, use the Federal Worksheet to calculate the amount to
# enter. (maximum $16,129)" (CRA 5006-R-25E, cra-docs/docs/cra-forms-2025/5006-r-25e.txt, line 77 and line
# 30000). The amount is calculated on Federal Worksheet 5000-D1 (CRA 5000-D1-25E), lines 1 to 11.
# Line 3, "Amount from line 23600 of your return", is a copy of T1 line 23600, so it is a step: another
# form's export is read only as a record list (`ca/t1_taxable_income.net_income`), and
# core/record_total totals the one amount into line 3. Lines 1, 2 and 4 to 11 are inside one
# ca/tapered_amount step with the dataset `ca/basic_personal_amount` (base 14,538, supplement 1,591,
# threshold 177,882, range 75,532): the taper is the worksheet's own arithmetic, and it rounds once,
# half-up to the cent, so the printed lines 5 to 10 are not rounded on the way.
form:
  name: ca/t1_tax_and_credits
capabilities:
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca/t1_taxable_income.net_income
    produces:
      output: ca/basic_personal_amount_net_income_line_3
  - name: ca/tapered_amount
    title: "Basic personal amount"
    reference: "30000"
    unit: ca/cad
    params:
      taper: ca/basic_personal_amount
    consumes:
      base: ca/basic_personal_amount_net_income_line_3
    produces:
      output: ca/basic_personal_amount
