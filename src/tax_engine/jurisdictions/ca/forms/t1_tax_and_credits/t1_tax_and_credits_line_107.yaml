# T1 General 2025 (form 5006-R), Step 5 Part B line 107 "Line 107 and line 33099: Medical expenses
# for self, spouse or common-law partner and your dependent children under 18 years of age"
# (CRA 5006-R-25E). The figure is a copy of line 33099, which the T1 lines copied by provinces form
# owns as an optional input and exports as a record list, so this is a core/record_total over that
# list. The export is 0 when the filer gives none. Line 110 reads it.
form:
  name: ca/t1_tax_and_credits
capabilities:
  - name: core/record_total
    title: "Medical expenses for self, spouse or common-law partner and your dependent children under 18 years of age"
    reference: "33099"
    unit: ca/cad
    consumes:
      records: ca/t1_lines_copied_by_provinces.medical_expenses_line_33099
    produces:
      output: ca/medical_expenses_line_107
