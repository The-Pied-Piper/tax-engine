# T1 General 2025 (form 5006-R), Step 5 line 130 "Line 130: Line 128 minus line 129 ="
# (CRA 5006-R-25E). Line 128 is `ca/federal_tax_with_surtax`; line
# 129 is line 40500, the federal foreign tax credit (`ca/federal_foreign_tax_credit`, Form T2209), an
# optional input that the part's own inputs file declares with blank fallback 0. The line prints no
# "(if negative, enter 0)", so there is no floor: core/subtract takes line 129 off line 128 and the
# difference is rounded half-up to the cent through the shared `ca/cent_rounding` dataset, producing
# `ca/federal_tax_less_foreign_tax_credit`, a signed figure.
form:
  name: ca/t1_tax_and_credits
capabilities:
  - name: core/subtract
    reference: "130"
    unit: ca/cad
    params:
      rounding: ca/cent_rounding
    consumes:
      amount: ca/federal_tax_with_surtax
      less: ca/federal_foreign_tax_credit
    produces:
      output: ca/federal_tax_less_foreign_tax_credit
