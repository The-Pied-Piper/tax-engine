# T1 General 2025 (form 5006-R), tax and credits, from Step 5 Part A onward. This
# part names the form and its exports; each line's capability goes in a part of its own with the
# same `form.name`.
# Exports: what the take-home return reads from this form.
#   - Line 167 (`ca/refund_or_balance_owing`, "Refund or balance owing") is the figure the take-home
#     return reads; positive is a balance owing, negative a refund.
#   - Line 43500 (`ca/total_payable`, "Total payable") is, for the take-home filer, line 143 plus
#     line 147 (the federal and the Ontario income tax); the return summary reads it for the average
#     income tax rate.
# Line 76 (`ca/federal_tax_on_taxable_income_line_76`, "Line 74 plus line 75 Federal tax on
# taxable income") is read inside the form by line 40400 only, and line 70 by line 76, so neither
# is exported.
form:
  name: ca/t1_tax_and_credits
  title: "T1 Income Tax and Benefit Return, Steps 5 and 6: Federal tax, and refund or balance owing"
  required: true
  exports:
    - ca/refund_or_balance_owing
    - ca/total_payable
capabilities: []
