# T1 General 2025 (form 5006-R), Step 5 line 128 "Line 126 plus line 127 ="
# (CRA 5006-R-25E, docs/cra-forms-2025/5006-r-25e.txt). Line 126 is line 42900
# (`ca/federal_tax_after_credits`). Line 127, the federal surtax on income earned outside Canada
# (Form T2203), is zero for the salary-only filer, who has no income allocated outside Canada, so it
# is left out and not wired. The sum is built even with its one part present: core/sum adds
# line 126 and rounds the total once, half-up to the cent, through the shared `ca/cent_rounding`
# dataset, producing `ca/federal_tax_with_surtax`.
form:
  name: ca/t1_tax_and_credits
capabilities:
  - name: core/sum
    reference: "128"
    unit: ca/cad
    params:
      rounding: ca/cent_rounding
    consumes:
      parts:
        - ca/federal_tax_after_credits
    produces:
      output: ca/federal_tax_with_surtax
