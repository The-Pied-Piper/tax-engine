# T1 General 2025 (form 5006-R) line 78 and line 30100: "Age amount (if you were born in 1960 or earlier) (use Federal Worksheet) (maximum $9,028)". Built as Form NS428 line 10 is (Umar, 27 Nov 2026): a core/first_record_count step that reads the T1's year of birth (`ca/t1_lines_copied_by_provinces.birth_year`, blank passes on), a ca/count_by_conditions step that works out 1 or 0 from that year (a blank year passes on blank, read as 0 by the steps below; not a line of the form), a core/times_count step of worksheet line 7 by that count (blank read as 0), and a core/at_most step that checks the printed maximum (worksheet line 1) and is line 78. An amount above the maximum is refused, not capped. Worksheet lines 1 to 7 are in the two parts beside this one. The guide 5000-G says "65 years of age or older on December 31, 2025", the form "born in 1960 or earlier": the same filers.
form:
  name: ca/t1_tax_and_credits
capabilities:
  - name: core/first_record_count
    title: Year of birth
    consumes:
      records: ca/t1_lines_copied_by_provinces.birth_year
    blank:
      records:
        ca/birth_year: pass_on
    produces:
      output: ca/t1_birth_year
  - name: ca/count_by_conditions
    title: Born in 1960 or earlier
    params:
      conditions: ca/born_in_1960_or_earlier_conditions
    consumes:
      counts:
        - ca/t1_birth_year
      amounts: []
    blank:
      counts: pass_on
    produces:
      output: ca/born_in_1960_or_earlier_checked
  - name: core/times_count
    title: Age amount before the printed maximum
    unit: ca/cad
    params:
      rounding: ca/cent_rounding
    consumes:
      amount: ca/age_amount_before_count
      count: ca/born_in_1960_or_earlier_checked
    produces:
      output: ca/age_amount_claimed
    blank:
      count: "0"
  - name: core/at_most
    title: Age amount
    reference: "78"
    unit: ca/cad
    consumes:
      amount: ca/age_amount_claimed
      bound: ca/age_maximum
    blank:
      amount: pass_on
    produces:
      output: ca/age_amount
