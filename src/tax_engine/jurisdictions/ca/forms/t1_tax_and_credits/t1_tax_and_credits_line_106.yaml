# T1 General 2025 (form 5006-R), Step 5 Part B line 106 "Add lines 101 to 105."
# (CRA 5006-R-25E). Line 101 is `ca/credit_amounts_subtotal`.
# Line 102 (line 31900, interest paid on your student loans) is a pure copy of line 31900, so it is a
# core/record_total over the record list the T1 lines copied by provinces form exports (the form that
# owns line 31900 as an input and reads it as 0 when blank). Lines 103 to 105 (tuition, tuition
# transferred, amounts transferred from a spouse) are not built and are left out. The sum is built
# in line order: core/sum adds lines 101 and 102 and rounds the total once, half-up to the cent,
# through the shared `ca/cent_rounding` dataset, producing `ca/credit_amounts_line_106`.
form:
  name: ca/t1_tax_and_credits
capabilities:
  - name: core/record_total
    title: "Interest paid on your student loans"
    reference: "31900"
    unit: ca/cad
    consumes:
      records: ca/t1_lines_copied_by_provinces.student_loan_interest_line_31900
    produces:
      output: ca/student_loan_interest_line_102
  - name: core/sum
    reference: "106"
    unit: ca/cad
    params:
      rounding: ca/cent_rounding
    consumes:
      parts:
        - ca/credit_amounts_subtotal
        - ca/student_loan_interest_line_102
    produces:
      output: ca/credit_amounts_line_106
