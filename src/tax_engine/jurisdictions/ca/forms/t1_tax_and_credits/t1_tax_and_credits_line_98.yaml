# T1 General 2025 (form 5006-R), Step 5 Part B line 98 "Add lines 85, 96, and 97."
# (CRA 5006-R-25E, docs/cra-forms-2025/5006-r-25e.txt). Line 85 "Enter the amount from line 84 of
# the previous page" is a pure copy of line 84 (`ca/credit_amounts_line_84`), so it is not a step
# of its own and line 84 is read directly. Line 96 is `ca/credits_subtotal_line_96`. Line 97, the
# pension income amount, is 0 for the take-home filer and is left out. The sum is built even with
# its parts present: core/sum adds lines 84 and 96 and rounds the total once, half-up to the cent,
# through the shared `ca/cent_rounding` dataset, producing `ca/credit_amounts_line_98`.
form:
  name: ca/t1_tax_and_credits
capabilities:
  - name: core/sum
    reference: "98"
    unit: ca/cad
    params:
      rounding: ca/cent_rounding
    consumes:
      parts:
        - ca/credit_amounts_line_84
        - ca/credits_subtotal_line_96
    produces:
      output: ca/credit_amounts_line_98
