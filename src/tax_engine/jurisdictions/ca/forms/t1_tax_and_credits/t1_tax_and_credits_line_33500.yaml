# T1 General 2025 (form 5006-R), Step 5 line 113 / line 33500 "Line 106 plus line 112."
# (CRA 5006-R-25E). Line 106 is `ca/credit_amounts_line_106` and line 112 (line 33200, medical
# expenses: line 110 plus line 111) is `ca/medical_claim`. core/sum adds them in line order and
# rounds the total once, half-up to the cent, through the shared `ca/cent_rounding` dataset,
# producing `ca/non_refundable_credit_amounts`.
form:
  name: ca/t1_tax_and_credits
capabilities:
  - name: core/sum
    reference: "33500"
    unit: ca/cad
    params:
      rounding: ca/cent_rounding
    consumes:
      parts:
        - ca/credit_amounts_line_106
        - ca/medical_claim
    produces:
      output: ca/non_refundable_credit_amounts
