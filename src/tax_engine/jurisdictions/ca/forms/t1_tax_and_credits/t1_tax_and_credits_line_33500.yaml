# T1 General 2025 (form 5006-R), Step 5 line 113 / line 33500 "Line 106 plus line 112."
# (CRA 5006-R-25E, docs/cra-forms-2025/5006-r-25e.txt). Line 106 is `ca/credit_amounts_line_106`.
# Line 112 (line 33200, medical expenses: line 110 plus line 111) needs medical expense inputs the
# take-home filer never has and is left out. The sum is built even with its one part present:
# core/sum adds line 106 and rounds the total once, half-up to the cent, through the shared
# `ca/cent_rounding` dataset, producing `ca/non_refundable_credit_amounts`.
form:
  name: ca/t1_tax_and_credits
capabilities:
  - name: core/sum
    reference: "33500"
    params:
      rounding: ca/cent_rounding
    consumes:
      parts:
        - ca/credit_amounts_line_106
    produces:
      output: ca/non_refundable_credit_amounts
