# T1 (5006-R, 2025) line 23200 input a salary-only caller does not give.
# "Line 52 and line 23200: Other deductions (specify)" (5006-R page 3). A salary-only caller has none, so a request that leaves the line out is
# read as blank, and the line 23200 step reads that blank as 0. This form owns the input: Schedule 6,
# BC479, MB479 and NL428 import line 23200 from this form's export and never ask for it themselves.
form:
  name: ca/t1_uccb_rdsp
inputs:
  - name: ca/rdsp_income_repayment
    title: "Registered disability savings plan (RDSP) income repayment (included on line 23200)"
    reference: "23200"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 52 and line 23200: Other deductions (specify)'
