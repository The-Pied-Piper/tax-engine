# T691 (T691 E (25), 2025) Part 7 lines 1 and 2: AB428 line 67, MB428 line 66 and SK428 line 68 print
# "Form T691: line 1 minus line 2 of Part 7". Line 1 is "Minimum amount from line 103 of Part 1" and
# line 2 is "Basic federal tax from line 7 of Part 2". The form prints no floor on the difference, so
# the kind is signed and a negative result stands. Each blank input reads as 0. The form exports the
# figure (`ca/t691_line_1_minus_line_2_of_part_7`) for those provincial forms.
form:
  name: ca/t691
capabilities:
  - name: core/subtract
    title: "Line 1 minus line 2 of Part 7"
    reference: "1 minus 2"
    unit: ca/cad
    params:
      rounding: ca/cent_rounding
    consumes:
      amount: ca/t691_minimum_amount
      less: ca/t691_basic_federal_tax
    blank:
      amount: "0"
      less: "0"
    produces:
      output: ca/t691_line_1_minus_line_2_of_part_7
