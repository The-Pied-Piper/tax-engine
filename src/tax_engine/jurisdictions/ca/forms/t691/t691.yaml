# Form T691 (T691 E (25), Alternative Minimum Tax), the parts the provincial forms read: two figures
# of Part 7, "Additional taxes paid for minimum tax carryover", and line 11 of Part 5, "Obligation to
# pay alternative minimum tax". The rest of the form is built by
# other forms of this engine. Lines 1 to 13 of Part 7 are not built, so lines 1, 2 and 13 are typed
# inputs (the minimum amount, the basic federal tax and the line 8 plus line 12 figure) that stand
# in for them; the form owns them, so the provincial forms import its exports and never ask again.
# Each typed line has a core/sum part that reads blank as 0 and rounds to the cent; the computed
# lines read those. A negative line 1 is refused, as its kind is non-negative; lines 2 and 13 are
# signed, as the form prints no floor on them. The difference of lines 1 and 2 is non-negative: the
# form prints no floor, but Part 7 is completed only when minimum tax is payable (Part 5: "If line
# 11 is positive, complete parts 6 and 7"), so that is the form's intent.
# Part 5 line 11 is also typed ("Line 7 minus line 10"; lines 1 to 10 of Part 5 are not built).
# Exports, each read as a record list, in this order:
#   - "Line 1 minus line 2 of Part 7" (`ca/t691_line_1_minus_line_2_of_part_7`, not below 0: the
#     form's intent, no floor is printed): AB428 line 67, MB428 line 66 and SK428 line 68, which
#     print "Form T691: line 1 minus line 2 of Part 7".
#   - Line 14 (`ca/t691_additional_taxes_for_minimum_tax_carryover_line_14`, line 1 minus line 13,
#     not below 0): BC428 line 69 and NL428 line 71, which print "Amount from line 14 of Part 7 of
#     Form T691". Each province reads the figure its own form prints; they are different figures.
#   - Part 5 line 11 (`ca/t691_part_5_line_11_amount`, not below 0): Worksheet ON428 line 1 (the
#     Ontario additional tax for minimum tax purposes, ON428 line 72), which prints "Amount from
#     line 11 of Part 5 of your Form T691".
form:
  name: ca/t691
  title: "Alternative Minimum Tax"
  required: true
  exports:
    - ca/t691_line_1_minus_line_2_of_part_7
    - ca/t691_additional_taxes_for_minimum_tax_carryover_line_14
    - ca/t691_part_5_line_11_amount
capabilities: []
