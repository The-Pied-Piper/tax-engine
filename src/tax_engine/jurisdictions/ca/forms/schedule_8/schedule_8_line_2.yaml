# Schedule 8 (CPP) Part 3, line 2, T1-2025 form 5000-S8:
# "Line 2: Enter whichever is less: amount from line D of Part 2 or line 1."
# Line D is the additional maximum pensionable earnings; line 1 is the T4 pensionable earnings
# outside Quebec. The lesser of the two is the output.
form:
  name: ca/schedule_8
capabilities:
  - name: core/lesser_of
    reference: "2"
    unit: ca/cad
    consumes:
      amounts:
        - ca/cpp_additional_maximum_pensionable_earnings
        - ca/t4_cpp_pensionable_earnings_outside_quebec
    produces:
      output: ca/cpp_part_3_line_2
