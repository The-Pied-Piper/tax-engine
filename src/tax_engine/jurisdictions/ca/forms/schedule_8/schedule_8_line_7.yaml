# Form Schedule 8, Canada Pension Plan Contributions and Overpayment (ca/schedule_8), Part 3
# line 7. The form's declaration and exports are a part of the manifest's own, not this one.
form:
  name: ca/schedule_8
capabilities:
  # Line 6 is "Amount from line E of Part 2", a copy, so line 7 reads line E (the maximum basic
  # exemption) itself. "Line 5 minus line 6 (if negative, enter "0")":
  - name: core/subtract_not_below_zero
    unit: ca/cad
    params:
      rounding: ca/cent_rounding
    consumes:
      amount: ca/cpp_part_3_line_5
      less: ca/cpp_basic_exemption
    produces:
      output: ca/cpp_part_3_line_7_difference
  # "(maximum $67,800)": the difference, at most the printed maximum.
  - name: core/capped_amount
    title: "Earnings subject to base and first additional contributions"
    reference: "7"
    unit: ca/cad
    params:
      cap: ca/cpp_line_7_maximum
    consumes:
      base: ca/cpp_part_3_line_7_difference
    produces:
      output: ca/cpp_part_3_line_7
