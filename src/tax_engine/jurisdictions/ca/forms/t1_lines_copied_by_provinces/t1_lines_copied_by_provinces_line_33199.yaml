# T1 (5006-R, 2025) line 33199: "Line 111 and line 33199: Allowable amount of medical expenses for
# other dependants (use Federal Worksheet)". The optional input (`ca/other_dependants_medical_expenses`, blank when the
# filer has none) is read by this step, which is the one line the T1 prints for it, and the blank
# reads as 0. The form exports the line (`ca/other_dependants_medical_expenses_line_33199`) for the form that prints it
# again (SK428 line 49). It is not added into the federal sums here: the T1 reads it as line 111 into
# line 112.
form:
  name: ca/t1_lines_copied_by_provinces
capabilities:
  - name: core/sum
    title: "Allowable amount of medical expenses for other dependants (use Federal Worksheet)"
    reference: "33199"
    unit: ca/cad
    params:
      rounding: ca/cent_rounding
    consumes:
      parts: [ca/other_dependants_medical_expenses]
    blank:
      ca/other_dependants_medical_expenses: "0"
    produces:
      output: ca/other_dependants_medical_expenses_line_33199
