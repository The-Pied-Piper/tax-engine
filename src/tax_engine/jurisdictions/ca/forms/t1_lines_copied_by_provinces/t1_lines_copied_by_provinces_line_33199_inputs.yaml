# T1 (5006-R, 2025) line 33199 input a salary-only caller does not give. "Line 111 and line 33199:
# Allowable amount of medical expenses for other dependants (use Federal Worksheet)". The Federal
# Worksheet that works the amount out is not built, so this form takes its result as one optional
# input, as the form prints it. A salary-only caller has none, so a request that leaves the line out
# is read as blank, and the line 33199 step reads that blank as 0. This form owns the input: SK428
# line 49 imports line 33199 from this form's export and never asks for it itself. AB428 line 50,
# BC428 line 52 and ON428 line 42 use a provincial worksheet, are not copies of it, and keep their
# own inputs.
form:
  name: ca/t1_lines_copied_by_provinces
inputs:
  - name: ca/other_dependants_medical_expenses
    title: "Allowable amount of medical expenses for other dependants (use Federal Worksheet)"
    reference: "33199"
    unit: ca/cad
    required: false
    default: null
    basis: "Line 111 and line 33199: Allowable amount of medical expenses for other dependants (use Federal Worksheet)"
