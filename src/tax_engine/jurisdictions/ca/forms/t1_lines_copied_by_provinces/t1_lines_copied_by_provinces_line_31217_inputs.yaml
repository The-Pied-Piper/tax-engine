# T1 (5006-R, 2025) line 31217 input a salary-only caller does not give. "Line 89 and line 31217: on
# self-employment and other eligible earnings (complete Schedule 13)" (5006-R page 6). A salary-
# only caller has none, so a request that leaves the line out is read as blank, and this step
# reads that blank as 0. This form owns the input: T1 line 89 and NL428 line 30 import line 31217
# from this form's export and never ask for it themselves.
form:
  name: ca/t1_lines_copied_by_provinces
inputs:
  - name: ca/ei_premiums_on_self_employment
    title: "Employment insurance premiums on self-employment and other eligible earnings"
    reference: "31217"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 89 and line 31217: on self-employment and other eligible earnings (complete Schedule 13)'
