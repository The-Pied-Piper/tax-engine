# T1 General 2025 (form 5006-R): the lines a provincial form copies as "amount from line N of your
# return" that no other T1 form of this engine builds: line 31000 (line 87, base CPP or QPP
# contributions on self-employment income and other earnings), line 31900 (line 102, student loan
# interest), line 33099 (line 107, medical expenses), line 40427 (line 124, minimum tax
# carryover), line 12000 (line 9, amount of dividends, eligible and other than eligible) and line
# 12010 (amount of dividends, other than eligible). They are the T1's inputs, so the provincial
# forms import them and never ask again.
# The form is split from `ca/t1_tax_and_credits`, which reads the provincial forms' results: a
# provincial form that read an export of that form would make a cycle. It carries the same printed
# title as the T1 forms it is split from, so the front end can reintegrate them.
# Exports: each line, read by the provincial forms as a record list.
#   - Line 31000 (`ca/self_employment_cpp_qpp_contributions_line_31000`): NL428 line 28.
#   - Line 31900 (`ca/student_loan_interest_line_31900`): NL428 line 43.
#   - Line 33099 (`ca/medical_expenses_line_33099`): NL428 line 48.
#   - Line 40427 (`ca/minimum_tax_carryover_line_40427`): AB428 line 64, BC428 line 66, MB428 line
#     63, NL428 line 68 and SK428 line 65.
#   - Line 12000 (`ca/taxable_dividends_line_12000`) and line 12010
#     (`ca/taxable_dividends_other_than_eligible_line_12010`): the dividend tax credit worksheets,
#     "Amount from line 12000 of your return" and "Amount from line 12010 of your return", AB428
#     line 63, BC428 line 65, MB428 line 62, ON428 line 57 and SK428 line 64.
# Each is an optional input read as 0 when blank. `ca/t1_tax_and_credits` reads the first four as
# record lists and adds them into the federal sums: line 87 into line 96, line 102 into line 106, line 107 into line
# 110 (medical expenses) and line 124 into line 125; the two dividend lines are read only by the
# provincial worksheets.
form:
  name: ca/t1_lines_copied_by_provinces
  title: "T1 Income Tax and Benefit Return"
  required: true
  exports:
    - ca/self_employment_cpp_qpp_contributions_line_31000
    - ca/student_loan_interest_line_31900
    - ca/medical_expenses_line_33099
    - ca/minimum_tax_carryover_line_40427
    - ca/taxable_dividends_line_12000
    - ca/taxable_dividends_other_than_eligible_line_12010
capabilities: []
