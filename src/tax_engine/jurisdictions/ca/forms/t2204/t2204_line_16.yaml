# T2204 (2025) line 16, "Enter whichever amount is the least: line 7, line 9 or line 12."
# Line 7 is the amount from line 3 less $2,000. Lines 9 and 12 are pure copies of lines 4 and 10
# as this form is modelled, so this step reads lines 4 and 10 directly: line 4 is the total
# premiums deducted (`ca/t2204_premiums_deducted`) and line 10 is the residents' EI premium
# capped at its maximum (`ca/t2204_line_10`). The lesser of the three is the output.
form:
  name: ca/t2204
capabilities:
  - name: core/lesser_of
    title: "Non-refundable tax credit for employment insurance premiums through employment"
    reference: "16"
    unit: ca/cad
    consumes:
      amounts:
        - ca/t2204_line_7
        - ca/t2204_premiums_deducted
        - ca/t2204_line_10
    produces:
      output: ca/t2204_line_16
