# T2204 (2025) line 14: "Enter whichever is more: amount from line 8 or line 13." The greater of two
# lines, a calculation, so step 1 takes it through core/greater_of.
#
# Step 1 compares line 8 and line 13, both produced by their own tickets, in the form's order: a
# tie gives line 8, and the answer is whichever line is larger, not their sum or their difference.
form:
  name: ca/t2204
capabilities:
  - name: core/greater_of
    reference: "14"
    unit: ca/cad
    consumes:
      amounts:
        - ca/t2204_line_8
        - ca/t2204_line_13
    produces:
      output: ca/t2204_line_14
