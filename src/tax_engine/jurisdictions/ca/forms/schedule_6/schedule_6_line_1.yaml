# Schedule 6 (5000-S6, 2025) line 1, employment income and other employment income (column 1 "You").
# The form prints: "Line 1: Employment income and other employment income from line 10100 and line
# 10400 of the return" and "Column 1 You".
#
# Line 1 is a sum of T1 line 10100 and T1 line 10400, in line order. The T1 form exports both lines
# (`ca/employment_income_line_10100`, `ca/other_employment_income_line_10400`) and another form reads
# an export only as a record list, so each is totalled by core/record_total first, as line 7 reads
# line 23600.
form:
  name: ca/schedule_6
capabilities:
  - name: core/record_total
    title: "Amount from line 10100 of the return"
    unit: ca/cad
    consumes:
      records: ca/t1_taxable_income.employment_income_line_10100
    produces:
      output: ca/cwb_employment_income_line_10100
  - name: core/record_total
    title: "Amount from line 10400 of the return"
    unit: ca/cad
    consumes:
      records: ca/t1_taxable_income.other_employment_income_line_10400
    produces:
      output: ca/cwb_other_employment_income_line_10400
  - name: core/sum
    title: "Employment income and other employment income from line 10100 and line 10400 of the return"
    reference: "1"
    unit: ca/cad
    params:
      rounding: ca/cent_rounding
    consumes:
      parts: [ca/cwb_employment_income_line_10100, ca/cwb_other_employment_income_line_10400]
    produces:
      output: ca/cwb_employment_income
