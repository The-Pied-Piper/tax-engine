# Schedule 6 (5000-S6, 2025) line 5, working income (column 1 "You"). The form prints: "Line 5: Add
# lines 1 to 4. Enter the result, even if it is "0". Working income" and "Column 1 You"
#
# Line 5 is a sum of lines 1 to 4. Lines 2 (scholarships), 3 (self-employment) and 4 (tax-exempt
# working income on a reserve) are out of scope for the take-home calculator, so the sum has one
# part: line 1 (`ca/cwb_employment_income`, from schedule_6_line_1.yaml).
form:
  name: ca/schedule_6
capabilities:
  - name: core/sum
    title: "Working income"
    reference: "5"
    unit: ca/cad
    params:
      rounding: ca/cent_rounding
    consumes:
      parts: [ca/cwb_employment_income]
    produces:
      output: ca/working_income
