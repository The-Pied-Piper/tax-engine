# Schedule 6 (5000-S6, 2025, CRA 5000-S6-25E) line 14's input, the secondary earner exemption, which
# a salary-only caller does not give. Line 14: "If your working income (line 5) is less than your
# eligible spouse's working income, enter whichever is less from column 1: amount from line 5 or
# line 12. If your working income (line 5) is equal to or more than your eligible spouse's working
# income, enter whichever is less from column 2: amount from line 5 or line 12. (maximum $16,386)"
# (cra-docs/docs/cra-forms-2025/5000-s6-25e.txt, lines 229-234). A request that leaves the line out is read as
# blank, and the line 15 part reads that blank as 0 by the blank rule of core/subtract.
form:
  name: ca/schedule_6
inputs:
  - name: ca/cwb_secondary_earner_exemption
    title: "Secondary earner exemption"
    reference: "14"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 14: If your working income (line 5) is less than your eligible spouse''s working income, enter whichever is less from column 1: amount from line 5 or line 12. If your working income (line 5) is equal to or more than your eligible spouse''s working income, enter whichever is less from column 2: amount from line 5 or line 12. (maximum $16,386)'
