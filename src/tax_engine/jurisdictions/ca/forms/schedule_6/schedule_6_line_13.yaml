# Schedule 6 (5000-S6, 2025) line 13, family net income. The form prints: "Line 13: Add the amounts
# from line 12 in columns 1 and 2. If you had an eligible spouse, continue at line 14; if not,
# continue at line 15."
#
# Line 13 is a sum of line 12 over the two columns. Column 2 (eligible spouse) is out of scope for
# the take-home calculator, so the sum has one part: line 12 column 1
# (`ca/cwb_net_income_less_uccb_rdsp_line_12`, from schedule_6_line_12.yaml).
form:
  name: ca/schedule_6
capabilities:
  - name: core/sum
    reference: "13"
    unit: ca/cad
    params:
      rounding: ca/cent_rounding
    consumes:
      parts: [ca/cwb_net_income_less_uccb_rdsp_line_12]
    produces:
      output: ca/cwb_family_net_income_line_13
