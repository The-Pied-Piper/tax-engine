# T1 (5006-R, 2025) line 33199 input a salary-only caller does not give.
# "Line 111 and line 33199: Allowable amount of medical expenses for other dependants (use Federal Worksheet)" (5006-R). A salary-only caller has none, so a request that leaves the line out is read as blank,
# and the line 33199 step reads that blank as 0. This form owns the input: the provincial forms that print
# the line again import this form's export and never ask for it themselves.
form:
  name: ca/t1_medical_expenses
inputs:
  - name: ca/other_dependants_medical_expenses
    title: "Allowable amount of medical expenses for other dependants"
    reference: "33199"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 111 and line 33199: Allowable amount of medical expenses for other dependants (use Federal Worksheet)'
