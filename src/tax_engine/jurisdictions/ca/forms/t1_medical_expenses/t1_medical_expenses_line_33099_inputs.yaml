# T1 (5006-R, 2025) line 33099 input a salary-only caller does not give.
# "Line 107 and line 33099: Medical expenses for self, spouse or common-law partner and your dependent children under 18 years of age" (5006-R). A salary-only caller has none, so a request that leaves the line out is read as blank,
# and the line 33099 step reads that blank as 0. This form owns the input: the provincial forms that print
# the line again import this form's export and never ask for it themselves.
form:
  name: ca/t1_medical_expenses
inputs:
  - name: ca/medical_expenses
    title: "Medical expenses for self, spouse or common-law partner and your dependent children under 18 years of age"
    reference: "33099"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 107 and line 33099: Medical expenses for self, spouse or common-law partner and your dependent children under 18 years of age'
