# Form PE428 (CRA 5002-C) line 22 and line 58300: "Amount from line 31200 of your return". A copy of
# T1 line 31200, which is T2204 line 16, the EI premiums credit amount. The amount arrives as a
# record list from T2204, so the one step is core/record_total over those records (same as
# ca-nl/nl428_credits line 29, nl428_credits_line_29.yaml, and ca-sk/sk428_credits line 24).
form:
  name: ca-pe/pe428
capabilities:
  - name: core/record_total
    title: "Employment insurance premiums"
    reference: "22"
    unit: ca/cad
    consumes:
      records: ca/t2204.t2204_line_16
    produces:
      output: ca-pe/pe428_ei_premiums_line_22
