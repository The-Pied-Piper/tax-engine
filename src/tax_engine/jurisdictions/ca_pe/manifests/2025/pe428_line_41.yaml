# Form PE428 (CRA 5002-C) line 41: "Line 41: Amount from line 23600 of your return". It is the T1
# net income (line 23600, floored), which reaches this form only as a record list
# (`ca/t1_taxable_income.net_income`), so the step is a core/record_total over it, as
# ca-nl/nl428_credits line 49 does. The form prints no label for the line, so the step has no
# title.
form:
  name: ca-pe/pe428
capabilities:
  - name: core/record_total
    reference: "41"
    unit: ca/cad
    consumes:
      records: ca/t1_taxable_income.net_income
    produces:
      output: ca-pe/pe428_net_income_line_41
