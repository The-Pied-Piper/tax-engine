# Form PE428 (CRA 5002-C) line 48: "Line 48 and line 58800: Line 39 plus line 47 =". Line 39 is
# the credits subtotal (pe428_line_39.yaml) and line 47 the allowable medical expenses
# (pe428_line_47.yaml). Neither is blank, so the step has no blank rule. The form names no label
# for the line, so the step has no title.
form:
  name: ca-pe/pe428
capabilities:
  - name: core/sum
    reference: "48"
    unit: ca/cad
    params:
      rounding: ca-pe/cent_rounding
    consumes:
      parts:
        - ca-pe/pe428_credits_subtotal_line_39
        - ca-pe/pe428_medical_expenses_allowable_line_47
    produces:
      output: ca-pe/pe428_credits_total_line_48
