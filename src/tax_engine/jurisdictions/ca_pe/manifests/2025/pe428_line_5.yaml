# Form PE428 (Prince Edward Island Tax, CRA 5002-C) Part A, line 5. Each of the five columns prints
# "Line 5:" with its rate: 9.5%, 13.47%, 16.6%, 17.62% and 19%. Line 5 is the printed rate of the column that
# line 1 falls in, and a line 1 exactly at a column's upper bound falls in the lower column. Line 1
# is read from its producing part (pe428_line_1.yaml), so this part does not produce it again.
form:
  name: ca-pe/pe428
capabilities:
  - name: core/bracket_column_rate
    title: "Rate"
    reference: "5"
    params:
      schedule: ca-pe/brackets
    consumes:
      base: ca-pe/pe428_taxable_income_line_1
    produces:
      output: ca-pe/pe428_bracket_rate_line_5
