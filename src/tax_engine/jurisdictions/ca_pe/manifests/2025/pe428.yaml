# Form PE428 Prince Edward Island Tax 2025 (CRA 5002-C), lines 1 to 97, one form: Part A (lines 1 to 8), Part B (lines 9 to 54, the
# credits), Part C (lines 55 to 67, the tax after credits) and the lines after them, which read each
# other directly. This part names the form and its exports; line parts carry capabilities. Line 55
# is a copy of line 8 and line 58 a copy of line 54, so they have no step: the lines after them read
# lines 8 and 54 directly; line 74 is a copy of line 67 and line 82 a copy of line 73, which is
# line 72 (column 2, the spouse, is not modelled), so the lines after them read those directly.
# Exports: line 84 (`ca-pe/pe428_income_over_base_amount_line_84`) and line 87
# (`ca-pe/pe428_low_income_tax_reduction_line_87`), which tell the return summary's marginal rate
# whether the low-income tax reduction is being phased out, and line 97
# (`ca-pe/pe428_prince_edward_island_tax_line_97`), the Prince Edward Island tax that line 97 says
# to enter on line 42800 of the return, which the form supplies as `ca/provincial_tax.amount`, the
# name the federal T1 reads.
# The title is the printed heading: "Form PE428" and, under it, "Prince Edward Island Tax and Credits".
form:
  name: ca-pe/pe428
  title: "Form PE428: Prince Edward Island Tax and Credits"
  required: true
  exports:
    - ca-pe/pe428_income_over_base_amount_line_84
    - ca-pe/pe428_low_income_tax_reduction_line_87
    - ca-pe/pe428_prince_edward_island_tax_line_97
  supplies:
    ca/provincial_tax.amount: ca-pe/pe428_prince_edward_island_tax_line_97
capabilities: []
