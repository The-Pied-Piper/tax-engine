# Form PE428 (CRA 5002-C) line 19: "Line 19: Add lines 9, 10, 13, and 16 to 18. = ^". Line 9 is always
# a figure (the basic personal amount). Lines 10, 13, 16, 17 and 18 are optional inputs a salary-only
# caller leaves blank, so the sum reads each blank as 0, as ca-nl/nl428_credits line 25
# (nl428_credits_line_25.yaml) does. The form prints no label for line 19, so the step has no title.
form:
  name: ca-pe/pe428_credits
capabilities:
  - name: core/sum
    reference: "19"
    unit: ca/cad
    params:
      rounding: ca-pe/cent_rounding
    consumes:
      parts:
        - ca-pe/basic_personal_amount
        - ca-pe/pe428_age_amount_line_10
        - ca-pe/pe428_spouse_or_common_law_partner_amount_line_13
        - ca-pe/pe428_eligible_dependant_amount_line_16
        - ca-pe/pe428_infirm_dependants_amount_line_17
        - ca-pe/pe428_young_children_amount_line_18
    blank:
      ca-pe/pe428_age_amount_line_10: "0"
      ca-pe/pe428_spouse_or_common_law_partner_amount_line_13: "0"
      ca-pe/pe428_eligible_dependant_amount_line_16: "0"
      ca-pe/pe428_infirm_dependants_amount_line_17: "0"
      ca-pe/pe428_young_children_amount_line_18: "0"
    produces:
      output: ca-pe/pe428_credits_subtotal_line_19
