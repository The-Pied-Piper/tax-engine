# Form PE428 (CRA 5002-C) line 21 and line 58280: "Amount from line 31000 of your return". A copy of
# T1 line 31000, which the T1 owns and exports
# (`ca/self_employment_cpp_qpp_contributions_line_31000`), so the one step is core/record_total over
# that export (a form reads another form's export only as a record list), as line 20 does. A
# salary-only caller has no such amount, so the total is 0 (same as ca-nl/nl428_credits line 28,
# nl428_credits_line_28.yaml).
form:
  name: ca-pe/pe428
capabilities:
  - name: core/record_total
    title: "Amount from line 31000 of your return"
    reference: "21"
    unit: ca/cad
    consumes:
      records: ca/t1_lines_copied_by_provinces.self_employment_cpp_qpp_contributions_line_31000
    produces:
      output: ca-pe/pe428_qpp_contributions_line_21
