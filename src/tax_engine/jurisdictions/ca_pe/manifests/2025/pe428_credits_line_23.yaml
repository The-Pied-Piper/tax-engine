# Form PE428 (CRA 5002-C) line 23 and line 58305: "Amount from line 31217 of your return". A copy of
# T1 line 31217, which the T1 lines copied by provinces form owns and exports
# (`ca/ei_premiums_on_self_employment_line_31217`), so the one step is core/record_total over that
# export (a form reads another form's export only as a record list), as line 21 does. A salary-only
# caller has no such amount, so the total is 0 (same as ca-nl/nl428_credits line 30,
# nl428_credits_line_30.yaml).
form:
  name: ca-pe/pe428_credits
capabilities:
  - name: core/record_total
    title: "Amount from line 31217 of your return"
    reference: "23"
    unit: ca/cad
    consumes:
      records: ca/t1_lines_copied_by_provinces.ei_premiums_on_self_employment_line_31217
    produces:
      output: ca-pe/pe428_ei_premiums_line_23
