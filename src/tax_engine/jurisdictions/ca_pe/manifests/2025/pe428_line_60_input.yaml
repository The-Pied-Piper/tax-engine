# PE428 (2025) line 60's input, which a salary-only caller does not give.
# Line 60: "Line 60 and line 61520: Prince Edward Island dividend tax credit (use Worksheet PE428)"
# (Form PE428, CRA 5002-C). The Worksheet PE428 behind this line exists only to compute a credit a
# salary-only caller leaves empty, so it is not built and the line is taken as one optional input. A
# request that leaves the line out is read as blank; the step that reads line 60 (line 62) reads
# that blank as 0.
form:
  name: ca-pe/pe428
inputs:
  - name: ca-pe/pe428_dividend_tax_credit_line_60
    title: "Prince Edward Island dividend tax credit"
    reference: "60"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 60 and line 61520: Prince Edward Island dividend tax credit (use Worksheet PE428)'
