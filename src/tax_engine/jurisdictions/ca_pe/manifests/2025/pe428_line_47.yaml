# Form PE428 (CRA 5002-C) line 47: "Line 47 and line 58769: Line 45 plus line 46 =". Line 45 is
# the medical expenses over the limit (pe428_line_45.yaml) and line 46 the allowable amount of
# medical expenses for other dependants, an optional input (pe428_line_46_input.yaml) that a
# salary-only filer leaves blank, read as 0. The form names no label for the line, so the step has
# no title.
form:
  name: ca-pe/pe428
capabilities:
  - name: core/sum
    reference: "47"
    unit: ca/cad
    params:
      rounding: ca-pe/cent_rounding
    consumes:
      parts:
        - ca-pe/pe428_medical_expenses_over_limit_line_45
        - ca-pe/pe428_allowable_medical_expenses_for_other_dependants_line_46
    blank:
      ca-pe/pe428_allowable_medical_expenses_for_other_dependants_line_46: "0"
    produces:
      output: ca-pe/pe428_medical_expenses_allowable_line_47
