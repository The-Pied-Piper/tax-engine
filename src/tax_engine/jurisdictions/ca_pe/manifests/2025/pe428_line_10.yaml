# Form PE428 (CRA 5002-C) line 10 and line 58080: "Age amount (if you were born in 1960 or earlier) (use Worksheet PE428) (maximum $6,510)". Built as ca-ns/ns428 line 10 is:
# 1. ca/count_by_conditions: 1 or 0 worked out from the year of birth (a blank year passes on blank, read as 0 by step 3; shared with line 76; not a line of the form).
# 2. core/credit_amount: the printed maximum from the `ca-pe/age_amount_maximum` dataset, which is also Worksheet PE428 line 1 "Maximum amount 6,510.00"; not a line of the form, so no title and no reference.
# 3. core/times_count: worksheet line 7 (pe428_line_10_worksheet_lines_4_to_7.yaml) times that count (blank read as 0).
# 4. core/at_most: line 10, step 3 checked against the printed maximum. An amount above the maximum is refused, not capped.
form:
  name: ca-pe/pe428
capabilities:
  - name: core/first_record_count
    title: Year of birth
    consumes:
      records: ca/t1_lines_copied_by_provinces.birth_year
    blank:
      records:
        ca/birth_year: pass_on
    produces:
      output: ca-pe/pe428_birth_year
  - name: ca/count_by_conditions
    title: Born in 1960 or earlier
    params:
      conditions: ca-pe/born_in_1960_or_earlier_conditions
    consumes:
      counts:
        - ca-pe/pe428_birth_year
      amounts: []
    blank:
      counts: pass_on
    produces:
      output: ca/born_in_1960_or_earlier_checked
  - name: core/credit_amount
    unit: ca/cad
    params:
      amount: ca-pe/age_amount_maximum
    produces:
      output: ca-pe/pe428_age_amount_maximum
  - name: core/times_count
    title: Age amount before the printed maximum
    unit: ca/cad
    params:
      rounding: ca-pe/cent_rounding
    consumes:
      amount: ca-pe/worksheet_pe428_age_amount_line_7
      count: ca/born_in_1960_or_earlier_checked
    produces:
      output: ca-pe/pe428_age_amount_claimed_line_10
    blank:
      count: "0"
  - name: core/at_most
    title: "Age amount"
    reference: "10"
    unit: ca/cad
    consumes:
      amount: ca-pe/pe428_age_amount_claimed_line_10
      bound: ca-pe/pe428_age_amount_maximum
    blank:
      amount: pass_on
    produces:
      output: ca-pe/pe428_age_amount_line_10
