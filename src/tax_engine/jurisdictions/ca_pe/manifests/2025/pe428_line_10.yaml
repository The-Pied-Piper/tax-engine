# Form PE428 (CRA 5002-C) line 10 and line 58080: "Age amount (if you were born in 1960 or earlier) (use Worksheet PE428) (maximum $6,510)". Built as ca-ns/ns428 line 10 is:
# 1. core/first_record_count: the T1's "aged 65 or older" flag (`ca/t1_lines_copied_by_provinces.age_65_or_older`, worked out once from the year of birth; a blank passes on blank, read as 0 by step 3; shared with line 76; not a line of the form).
# 2. core/credit_amount: the printed maximum from the `ca-pe/age_amount_maximum` dataset, which is also Worksheet PE428 line 1 "Maximum amount 6,510.00"; not a line of the form, so a plain-words title and no reference.
# 3. core/times_count: worksheet line 7 (pe428_line_10_worksheet_lines_4_to_7.yaml) times that count (blank read as 0).
# 4. core/at_most: line 10, step 3 checked against the printed maximum. An amount above the maximum is refused, not capped.
form:
  name: ca-pe/pe428
capabilities:
  - name: core/first_record_count
    title: Aged 65 or older at the end of the year
    consumes:
      records: ca/t1_lines_copied_by_provinces.age_65_or_older
    blank:
      records:
        ca/age_65_or_older: pass_on
    produces:
      output: ca-pe/pe428_age_65_or_older
  - name: core/credit_amount
    title: Age amount maximum
    unit: ca/cad
    params:
      amount: ca-pe/age_amount_maximum
    produces:
      output: ca-pe/pe428_age_amount_maximum
  - name: core/times_count
    title: Age amount before the printed maximum
    unit: ca/cad
    params:
      rounding: ca-pe/cent_rounding
    consumes:
      amount: ca-pe/worksheet_pe428_age_amount_line_7
      count: ca-pe/pe428_age_65_or_older
    produces:
      output: ca-pe/pe428_age_amount_claimed_line_10
    blank:
      count: "0"
  - name: core/at_most
    title: "Age amount"
    reference: "10"
    unit: ca/cad
    consumes:
      amount: ca-pe/pe428_age_amount_claimed_line_10
      bound: ca-pe/pe428_age_amount_maximum
    blank:
      amount: pass_on
    produces:
      output: ca-pe/pe428_age_amount_line_10
