# PE428 (2025) line 94's input, which a salary-only caller does not give. Line 94 and line 63500:
# Equity tax credit from Certificate PE-ETC (Form PE428, CRA 5002-C). A request that leaves the
# line out is read as blank; the sum of line 96 reads the blank as 0.
form:
  name: ca-pe/pe428
inputs:
  - name: ca-pe/pe428_equity_tax_credit_line_94
    reference: "94"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 94 and line 63500: Equity tax credit from Certificate PE-ETC'
