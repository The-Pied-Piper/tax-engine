# PE428 (2025) input a salary-only caller does not give.
# Line 13: "Line 11 minus line 12 (if negative, enter "0") (maximum $12,443)" (Form PE428, CRA
# 5002-C). Lines 11 and 12 (the base amount and the spouse's or partner's net income) feed this
# line on the paper form. A single salary-only filer has no spouse or partner, so the line is
# taken as one optional input, the claim itself. A request that leaves the line out is read as
# blank. Line 13 (pe428_line_13.yaml) checks it against the printed maximum and passes a blank on.
form:
  name: ca-pe/pe428
inputs:
  - name: ca-pe/pe428_spouse_or_common_law_partner_amount_claimed_line_13
    title: "Spouse or common-law partner amount"
    reference: "13"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 13 and line 58120: Line 11 minus line 12 (if negative, enter "0") (maximum $12,443)'
