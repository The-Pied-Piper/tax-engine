# Form PE428 (CRA 5002-C) line 71, column 1 (you), under the heading "UCCB income:": "Line 71:
# Amount from line 11700 of the return". The amount is a T1 line, so this form does not ask for it:
# the T1 taxable income form owns the input and exports line 11700 (`ca/t1_taxable_income`).
# Another form reads an export only as a record list, so the one step is core/record_total over
# those records (as NL428 line 91 reads line 11700). A salary-only caller has no UCCB income, so
# it is 0. Column 2 is not modelled: the take-home is a single filer's.
form:
  name: ca-pe/pe428
capabilities:
  - name: core/record_total
    title: "Amount from line 11700 of the return"
    reference: "71 (column 1)"
    unit: ca/cad
    consumes:
      records: ca/t1_taxable_income.uccb_income_line_11700
    produces:
      output: ca-pe/pe428_uccb_income_line_71
