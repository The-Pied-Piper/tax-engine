# Form PE428 (CRA 5002-C) line 45: "Line 45: Line 40 minus line 44 (if negative, enter "0") =".
# Line 40 is the medical expenses from line 33099 of the return (pe428_line_40.yaml) and line 44
# the lesser of the printed ceiling and 3% of net income (pe428_line_44.yaml). Line 45 is one
# core/subtract_not_below_zero step, rounded half-up to the cent. A return with no medical
# expenses has a line 40 of 0, so line 45 is 0.00. The form names no label for the line, so the
# step has no title.
form:
  name: ca-pe/pe428
capabilities:
  - name: core/subtract_not_below_zero
    reference: "45"
    unit: ca/cad
    params:
      rounding: ca-pe/cent_rounding
    consumes:
      amount: ca-pe/pe428_medical_expenses_line_40
      less: ca-pe/pe428_medical_expenses_limited_amount_line_44
    produces:
      output: ca-pe/pe428_medical_expenses_over_limit_line_45
