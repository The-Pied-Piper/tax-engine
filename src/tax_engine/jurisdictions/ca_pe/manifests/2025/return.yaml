# The Prince Edward Island take-home return: T1 line 167 "Refund or balance owing" (positive is
# owing, negative is a refund). The T1 form exports it, and another form's export is read only as a
# record list, so the step is core/record_total over the T1 export, totalling the one amount into
# the return's own `ca/refund_or_balance_owing`. The provincial tax reaches line 167 through T1
# line 42800, which PE428 line 97 supplies (`ca/provincial_tax.amount`); T1 line 47900
# "Provincial or territorial credits" has no Prince Edward Island source for a salary-only filer
# (no PE479 is built, and PE428 line 98, the volunteer credit, comes after T1 line 43500 and is
# not counted): the T1 form reads it as optional and passes it on blank, so it adds nothing to
# line 167, as in the Newfoundland and Labrador and Saskatchewan returns.
#
# The return's second output is the average tax rate on the take-home basis. The federal form
# `ca/take_home_average_rate` works it out once for every province (income tax, CPP and EI over the
# salary), and the return reads its export `ca/average_tax_rate` with one core/record_total.
#
# The marginal rate is the rate on the take-home basis: the change in T1 line 43500 plus the CPP,
# CPP2 and EI per further dollar of salary, with no credit paid on filing. The federal half is the
# shared federal form `ca/take_home_marginal_rates` (imported by the manifest), whose four exports
# are each totalled by core/record_total into this return's own figure: the net income rate, the
# credit-earning contribution rate, the federal marginal rate and the contribution rate. This return
# adds only Prince Edward Island's own part.
#
# The Prince Edward Island bracket rate is printed on PE428 line 5 (the rate of the one of five
# columns that the taxable income falls in; the form prints all five in one table). PE428 exports
# it and the return totals it into its own kind. Times the net income rate (T1 line 22215 takes
# the enhanced CPP off the income) it is the bracket rate on a further dollar of salary. The CPP
# base and EI contributions earn the PE428 credit (`ca-pe/credit_rate`, read as it is by
# core/rate_figure), which takes that rate times the credit-earning contribution rate off the tax.
#
# The low-income tax reduction (PE428 lines 66 to 88) is in the rate, because it changes line 97
# and so T1 line 43500: while PE428 line 84 (the income over the base amount) and line 87 (the
# reduction) are both above zero, a further dollar of net income takes 5%
# (`ca-pe/low_income_reduction_rate`, PE428 line 85 "Applicable rate 5%") off the reduction. The
# two gates are multiplied, the rate follows, and it is multiplied by the net income rate. Where
# the tax after credits (line 74, the figure of line 67) is no more than the reduction, line 88 and
# so line 97 are 0 and the whole provincial part is gated out by the line 97 gate below.
#
# The whole provincial part is counted only while PE428 line 97 "Line 93 minus line 96 (if
# negative, enter "0")", the tax that goes to T1 line 42800 (equal to line 88 for a salary-only
# filer, who has no equity tax credit on line 96), is above zero, through the
# `ca-pe/marginal_rate_gate` dataset (0 where the amount is 0.00, 1 from one cent). Prince Edward
# Island has no surtax and no health premium. The rate is the one of a salary-only filer, as the
# take-home calculator takes only the salary and, for the age amount, the year of birth: the other
# optional inputs (the medical expenses and the like) are left blank there, so their slopes are not
# built.
#
# The age amount (PE428 line 10, Worksheet PE428 "Line 58080 - Age amount") falls by the worksheet's
# line 5 rate (`ca-pe/age_rate`, 15%) of each dollar of net income over its line 3 threshold, until
# it is 0, and each dollar of that fall is tax at the credit rate. The term is counted only where
# worksheet line 4 is above zero and the age amount claimed (line 10 before the printed maximum
# check, 0 for a filer under 65 or with no year of birth) is above zero, through the two gates of
# the `ca-pe/marginal_rate_gate` dataset; the 15% times the gates is multiplied by the net income
# rate and then by the credit rate (`ca-pe/marginal_prince_edward_island_credit_rate`), as the CPP
# and EI credit is. It is added to the province's other credit-type terms (its position in the sum
# is immaterial because a sum commutes) and stops when the claimed amount reaches 0.00 (the dollar
# that reaches 0.00 is not counted).
#
# The last step adds the federal marginal rate, the Prince Edward Island marginal rate and the
# contribution rate (CPP base, enhanced and second additional, and EI) with core/sum into
# `ca-pe/marginal_tax_rate`. Every step but line 167 is engine-internal, exact
# (`ca-pe/exact_rounding`; the marginal rate step alone is rounded half-up to 0.0001 like the
# average rate), printed on no form, and carries no title or line.
capabilities:
  - name: core/record_total
    title: "Refund or balance owing"
    reference: "167"
    unit: ca/cad
    consumes:
      records: ca/t1_tax_and_credits.refund_or_balance_owing
    produces:
      output: ca/refund_or_balance_owing
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca/take_home_average_rate.average_tax_rate
    produces:
      output: ca-pe/average_tax_rate
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca/take_home_marginal_rates.marginal_net_income_rate
    produces:
      output: ca-pe/marginal_net_income_rate
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca/take_home_marginal_rates.marginal_credit_contribution_rate
    produces:
      output: ca-pe/marginal_credit_contribution_rate
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca/take_home_marginal_rates.marginal_federal_rate
    produces:
      output: ca-pe/marginal_federal_rate
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca/take_home_marginal_rates.marginal_contribution_rate
    produces:
      output: ca-pe/marginal_contribution_rate
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca-pe/pe428.pe428_bracket_rate_line_5
    produces:
      output: ca-pe/prince_edward_island_bracket_rate_return
  - name: core/rate_figure
    unit: core/percent
    params:
      rate: ca-pe/credit_rate
    produces:
      output: ca-pe/marginal_prince_edward_island_credit_rate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-pe/exact_rounding
    consumes:
      base: ca-pe/marginal_credit_contribution_rate
      rate: ca-pe/marginal_prince_edward_island_credit_rate
    produces:
      output: ca-pe/marginal_prince_edward_island_contribution_credit_rate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-pe/exact_rounding
    consumes:
      base: ca-pe/prince_edward_island_bracket_rate_return
      rate: ca-pe/marginal_net_income_rate
    produces:
      output: ca-pe/marginal_prince_edward_island_bracket_rate
  - name: core/subtract
    unit: core/percent
    params:
      rounding: ca-pe/exact_rounding
    consumes:
      amount: ca-pe/marginal_prince_edward_island_bracket_rate
      less: ca-pe/marginal_prince_edward_island_contribution_credit_rate
    produces:
      output: ca-pe/marginal_prince_edward_island_rate_after_credits
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-pe/pe428.worksheet_pe428_age_amount_line_4
    produces:
      output: ca-pe/marginal_age_income_over_threshold
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-pe/pe428.pe428_age_amount_claimed_line_10
    produces:
      output: ca-pe/marginal_age_amount_claimed
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-pe/marginal_rate_gate
    consumes:
      base: ca-pe/marginal_age_income_over_threshold
    produces:
      output: ca-pe/marginal_age_threshold_gate
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-pe/marginal_rate_gate
    consumes:
      base: ca-pe/marginal_age_amount_claimed
    produces:
      output: ca-pe/marginal_age_amount_gate
  - name: core/rate_figure
    unit: core/percent
    params:
      rate: ca-pe/age_rate
    produces:
      output: ca-pe/marginal_age_rate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-pe/exact_rounding
    consumes:
      base: ca-pe/marginal_age_rate
      rate: ca-pe/marginal_age_threshold_gate
    produces:
      output: ca-pe/marginal_age_reduction_rate_over_threshold
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-pe/exact_rounding
    consumes:
      base: ca-pe/marginal_age_reduction_rate_over_threshold
      rate: ca-pe/marginal_age_amount_gate
    produces:
      output: ca-pe/marginal_age_reduction_rate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-pe/exact_rounding
    consumes:
      base: ca-pe/marginal_age_reduction_rate
      rate: ca-pe/marginal_net_income_rate
    produces:
      output: ca-pe/marginal_age_phase_down_net_income_rate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-pe/exact_rounding
    consumes:
      base: ca-pe/marginal_age_phase_down_net_income_rate
      rate: ca-pe/marginal_prince_edward_island_credit_rate
    produces:
      output: ca-pe/marginal_prince_edward_island_age_credit_rate
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-pe/pe428.pe428_income_over_base_amount_line_84
    produces:
      output: ca-pe/income_over_base_amount_return
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-pe/pe428.pe428_low_income_tax_reduction_line_87
    produces:
      output: ca-pe/low_income_tax_reduction_return
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-pe/marginal_rate_gate
    consumes:
      base: ca-pe/income_over_base_amount_return
    produces:
      output: ca-pe/income_over_base_amount_gate
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-pe/marginal_rate_gate
    consumes:
      base: ca-pe/low_income_tax_reduction_return
    produces:
      output: ca-pe/low_income_tax_reduction_gate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-pe/exact_rounding
    consumes:
      base: ca-pe/income_over_base_amount_gate
      rate: ca-pe/low_income_tax_reduction_gate
    produces:
      output: ca-pe/low_income_reduction_phase_out_gate
  - name: core/rate_figure
    unit: core/percent
    params:
      rate: ca-pe/low_income_reduction_rate
    produces:
      output: ca-pe/low_income_reduction_rate_figure
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-pe/exact_rounding
    consumes:
      base: ca-pe/low_income_reduction_phase_out_gate
      rate: ca-pe/low_income_reduction_rate_figure
    produces:
      output: ca-pe/marginal_low_income_reduction_rate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-pe/exact_rounding
    consumes:
      base: ca-pe/marginal_low_income_reduction_rate
      rate: ca-pe/marginal_net_income_rate
    produces:
      output: ca-pe/marginal_low_income_phase_out_rate
  - name: core/sum
    unit: core/percent
    params:
      rounding: ca-pe/exact_rounding
    consumes:
      parts:
        - ca-pe/marginal_prince_edward_island_rate_after_credits
        - ca-pe/marginal_prince_edward_island_age_credit_rate
        - ca-pe/marginal_low_income_phase_out_rate
    produces:
      output: ca-pe/marginal_prince_edward_island_rate_with_reduction
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-pe/pe428.pe428_prince_edward_island_tax_line_97
    produces:
      output: ca-pe/prince_edward_island_tax_return
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-pe/marginal_rate_gate
    consumes:
      base: ca-pe/prince_edward_island_tax_return
    produces:
      output: ca-pe/prince_edward_island_rate_gate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-pe/exact_rounding
    consumes:
      base: ca-pe/prince_edward_island_rate_gate
      rate: ca-pe/marginal_prince_edward_island_rate_with_reduction
    produces:
      output: ca-pe/prince_edward_island_marginal_rate
  - name: core/sum
    unit: core/percent
    params:
      rounding: ca/take_home_average_rate_rounding
    consumes:
      parts:
        - ca-pe/marginal_federal_rate
        - ca-pe/prince_edward_island_marginal_rate
        - ca-pe/marginal_contribution_rate
    produces:
      output: ca-pe/marginal_tax_rate
