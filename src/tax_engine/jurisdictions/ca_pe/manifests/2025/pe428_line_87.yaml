# Form PE428 (CRA 5002-C) line 87: "Line 87: Line 81 minus line 86 (if negative, enter "0") Prince
# Edward Island low-income tax reduction =". One core/subtract_not_below_zero step over line 81
# (`ca-pe/pe428_low_income_reductions_total_line_81`) and line 86
# (`ca-pe/pe428_reduction_phase_out_line_86`), not below 0, rounded half-up to the cent by the
# dataset's rule. The form's instruction under line 67 to enter "0" on line 87 when an amount is
# claimed on line 66 does not apply: line 66 is not taken (a single filer has none), so line 87 is
# always calculated.
# The output is exported for the return summary's marginal rate.
form:
  name: ca-pe/pe428
capabilities:
  - name: core/subtract_not_below_zero
    title: "Prince Edward Island low-income tax reduction"
    reference: "87"
    unit: ca/cad
    params:
      rounding: ca-pe/cent_rounding
    consumes:
      amount: ca-pe/pe428_low_income_reductions_total_line_81
      less: ca-pe/pe428_reduction_phase_out_line_86
    produces:
      output: ca-pe/pe428_low_income_tax_reduction_line_87
