# PE428 (2025) line 77's input, which a salary-only caller does not give.
# Line 77: "Line 77 and line 63390: Reduction for spouse or common-law partner (if you had a spouse or common-law partner on December 31, 2025) Claim $350" (Form PE428, CRA 5002-C). A salary-only single filer has no such claim, so the line
# is taken as one optional input, never hardcoded to 0. A request that leaves the line out is read
# as blank; the step that reads line 77 (line 81) reads that blank as 0.
form:
  name: ca-pe/pe428
inputs:
  - name: ca-pe/pe428_reduction_for_spouse_or_common_law_partner_line_77
    reference: "77"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 77 and line 63390: Reduction for spouse or common-law partner (if you had a spouse or common-law partner on December 31, 2025) Claim $350'
