# PE428 (2025) line 66's input, which a salary-only caller does not give.
# Line 66: "Line 66 and line 63360: Amount from line 101 of your spouse's or common-law partner's
# Form PE428, if any" (Form PE428, CRA 5002-C). The amount is taken from the spouse or common-law
# partner's own Form PE428, so the line is one optional input, as the form takes it. A salary-only
# single filer has no partner, so a request that leaves the line out is read as blank; the step that
# reads line 66 (line 67) reads that blank as 0. The form prints no label for the line, so the input
# has no title. The spouse's value gets its own ticket.
form:
  name: ca-pe/pe428
inputs:
  - name: ca-pe/pe428_amount_from_spouse_or_partner_form_line_66
    reference: "66"
    unit: ca/cad
    required: false
    default: null
    basis: "Line 66 and line 63360: Amount from line 101 of your spouse's or common-law partner's Form PE428, if any"
