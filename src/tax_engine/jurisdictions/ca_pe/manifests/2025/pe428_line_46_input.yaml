# PE428 (2025) input a salary-only caller does not give.
# Line 46: "Allowable amount of medical expenses for other dependants (use Worksheet PE428)" (Form
# PE428, CRA 5002-C). The Worksheet PE428 section behind this line exists only to compute a claim
# a salary-only filer leaves empty, so that block is not built and the line is taken as one
# optional input. A request that leaves the line out is read as blank.
form:
  name: ca-pe/pe428
inputs:
  - name: ca-pe/pe428_allowable_medical_expenses_for_other_dependants_line_46
    title: "Allowable amount of medical expenses for other dependants (use Worksheet PE428)"
    reference: "46"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 46 and line 58729: Allowable amount of medical expenses for other dependants (use Worksheet PE428)'
