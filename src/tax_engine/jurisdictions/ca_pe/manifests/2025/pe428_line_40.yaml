# Form PE428 (CRA 5002-C) line 40: "Line 40 and line 58689: Amount from line 33099 of your
# return". A copy of T1 line 33099, which the T1 owns and exports
# (`ca/medical_expenses_line_33099`), so the one step is core/record_total over that export (a
# form reads another form's export only as a record list), as ca-nl/nl428_credits line 48 does. A
# salary-only caller has no such amount, so the total is 0.
form:
  name: ca-pe/pe428
capabilities:
  - name: core/record_total
    title: "Amount from line 33099 of your return"
    reference: "40"
    unit: ca/cad
    consumes:
      records: ca/t1_lines_copied_by_provinces.medical_expenses_line_33099
    produces:
      output: ca-pe/pe428_medical_expenses_line_40
