# PE428 (2025) input a salary-only caller does not give.
# Line 32: "Disability amount transferred from a dependant (use Worksheet PE428)" (Form PE428, CRA
# 5002-C). The Worksheet PE428 section behind this line exists only to compute a claim a
# salary-only filer leaves empty, so that block is not built and the line is taken as one optional
# input. A request that leaves the line out is read as blank.
form:
  name: ca-pe/pe428
inputs:
  - name: ca-pe/pe428_disability_amount_transferred_from_a_dependant_line_32
    title: "Disability amount transferred from a dependant (use Worksheet PE428)"
    reference: "32"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 32 and line 58480: Disability amount transferred from a dependant (use Worksheet PE428)'
