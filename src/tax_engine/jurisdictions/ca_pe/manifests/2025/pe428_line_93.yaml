# Form PE428 (CRA 5002-C) line 93: "Line 93: Line 90 minus line 92 (if negative, enter \"0\") =".
# One core/subtract_not_below_zero step: line 90 (`ca-pe/pe428_tax_line_90`) less line 92 (`ca-
# pe/pe428_political_contribution_tax_credit_line_92`), not below 0, rounded half-up to the cent
# by the dataset's rule. Line 92 is an optional input a salary-only caller leaves out, read as
# blank and then as 0 by the blank rule. The form prints no title for the line, so the step has
# none.
form:
  name: ca-pe/pe428
capabilities:
  - name: core/subtract_not_below_zero
    reference: "93"
    unit: ca/cad
    params:
      rounding: ca-pe/cent_rounding
    consumes:
      amount: ca-pe/pe428_tax_line_90
      less: ca-pe/pe428_political_contribution_tax_credit_line_92
    blank:
      less: "0"
    produces:
      output: ca-pe/pe428_tax_line_93
