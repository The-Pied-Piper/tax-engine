# PE428 (2025) line 76's input, which a salary-only caller does not give.
# Line 76: "Line 76 and line 63380: Age reduction for self (if you were born in 1960 or earlier) Claim $250" (Form PE428, CRA 5002-C). A salary-only single filer has no such claim, so the line
# is taken as one optional input, never hardcoded to 0. A request that leaves the line out is read
# as blank; the step that reads line 76 (line 81) reads that blank as 0.
form:
  name: ca-pe/pe428
inputs:
  - name: ca-pe/pe428_age_reduction_for_self_line_76
    reference: "76"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 76 and line 63380: Age reduction for self (if you were born in 1960 or earlier) Claim $250'
