# PE428 (2025) input a salary-only caller does not give.
# Line 18: "Amount for young children (complete the chart at the end of page 2)" (Form PE428, CRA
# 5002-C). The chart at the end of page 2 (line 58229, number of months multiplied by $100) exists
# only to compute a claim a filer with no young children leaves empty, so it is not built and the
# line is taken as one optional input. A request that leaves the line out is read as blank. Line
# 19 (a later part) reads it.
form:
  name: ca-pe/pe428_credits
inputs:
  - name: ca-pe/pe428_young_children_amount_line_18
    title: "Amount for young children (complete the chart at the end of page 2)"
    reference: "18"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 18 and line 58230: Amount for young children (complete the chart at the end of page 2)'
