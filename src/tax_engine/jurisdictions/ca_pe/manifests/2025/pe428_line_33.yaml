# Form PE428 (CRA 5002-C) line 33: "Teacher school supply amount (maximum $500)". No arithmetic is
# printed, so the line is an entry line in two steps, as line 10 (pe428_line_10.yaml) is. The
# first, core/credit_amount, supplies the printed maximum from the
# `ca-pe/teacher_school_supply_amount_maximum` dataset; it is not a line of the form, so it has no
# title and no reference. The second, core/at_most, is line 33: the entered amount
# (pe428_line_33_input.yaml) passed on unchanged. An entry above the printed maximum is refused,
# not capped. A blank entry passes on as blank, and the sum that reads it reads it as 0.
form:
  name: ca-pe/pe428
capabilities:
  - name: core/credit_amount
    unit: ca/cad
    params:
      amount: ca-pe/teacher_school_supply_amount_maximum
    produces:
      output: ca-pe/pe428_teacher_school_supply_amount_maximum
  - name: core/at_most
    title: "Teacher school supply amount (maximum $500)"
    reference: "33"
    unit: ca/cad
    consumes:
      amount: ca-pe/pe428_teacher_school_supply_amount_claimed_line_33
      bound: ca-pe/pe428_teacher_school_supply_amount_maximum
    blank:
      amount: pass_on
    produces:
      output: ca-pe/pe428_teacher_school_supply_amount_line_33
