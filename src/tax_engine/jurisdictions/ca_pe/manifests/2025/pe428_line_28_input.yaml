# PE428 (2025) input a salary-only caller does not give.
# Line 28: "Children's wellness tax credit" (Form PE428, CRA 5002-C). The engine does not compute
# the children's wellness tax credit, so the figure is taken as one optional input the way the
# form takes it, a dollar amount entered on the line. A request that leaves the line out is read
# as blank.
form:
  name: ca-pe/pe428
inputs:
  - name: ca-pe/pe428_childrens_wellness_tax_credit_line_28
    title: "Children's wellness tax credit"
    reference: "28"
    unit: ca/cad
    required: false
    default: null
    basis: "Line 28 and line 58365: Children's wellness tax credit"
