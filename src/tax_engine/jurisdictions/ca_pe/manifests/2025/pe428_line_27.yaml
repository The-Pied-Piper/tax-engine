# Form PE428 (CRA 5002-C) line 27: "Pension income amount (maximum $1,000)". No arithmetic is
# printed, so the line is an entry line in two steps, as line 10 (pe428_line_10.yaml) is. The
# first, core/credit_amount, supplies the printed maximum from the
# `ca-pe/pension_income_amount_maximum` dataset; it is not a line of the form, so it has no title
# and no reference. The second, core/at_most, is line 27: the entered amount
# (pe428_line_27_input.yaml) passed on unchanged. An entry above the printed maximum is refused,
# not capped. A blank entry passes on as blank, and the sum that reads it reads it as 0.
form:
  name: ca-pe/pe428
capabilities:
  - name: core/credit_amount
    unit: ca/cad
    params:
      amount: ca-pe/pension_income_amount_maximum
    produces:
      output: ca-pe/pe428_pension_income_amount_maximum
  - name: core/at_most
    title: "Pension income amount (maximum $1,000)"
    reference: "27"
    unit: ca/cad
    consumes:
      amount: ca-pe/pe428_pension_income_amount_claimed_line_27
      bound: ca-pe/pe428_pension_income_amount_maximum
    blank:
      amount: pass_on
    produces:
      output: ca-pe/pe428_pension_income_amount_line_27
