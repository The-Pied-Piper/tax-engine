# Form PE428 (CRA 5002-C) line 67: "Line 67: Line 65 minus line 66 (if negative, enter "0") Enter
# this amount on line 74. =". Line 65 is `ca-pe/pe428_tax_with_minimum_tax_line_65` and line 66 is
# the optional input `ca-pe/pe428_amount_from_spouse_or_partner_form_line_66`, which a salary-only
# single filer leaves out, read as blank and then as 0 by the blank rule. The form prints no title
# for the line, so the step has none. The output is `ca-pe/pe428_tax_line_67`, which the form
# exports; line 74 reads it.
form:
  name: ca-pe/pe428
capabilities:
  - name: core/subtract_not_below_zero
    reference: "67"
    unit: ca/cad
    params:
      rounding: ca-pe/cent_rounding
    consumes:
      amount: ca-pe/pe428_tax_with_minimum_tax_line_65
      less: ca-pe/pe428_amount_from_spouse_or_partner_form_line_66
    blank:
      less: "0"
    produces:
      output: ca-pe/pe428_tax_line_67
