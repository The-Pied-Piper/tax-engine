# Form PE428 (CRA 5002-C) line 44: "Line 44: Enter whichever is less: $1,678 or the amount on line
# 43." The $1,678 is the printed ceiling, the `ca-pe/medical_expense_dollar_limit` dataset, and
# has no step of its own. Line 44 is the lesser of that ceiling and line 43 (pe428_line_43.yaml),
# one core/capped_amount step, rounded half-up to the cent by the dataset's rule. The form names
# no label for the line, so the step has no title. Line 43 is always a figure, so nothing is
# blank.
form:
  name: ca-pe/pe428
capabilities:
  - name: core/capped_amount
    reference: "44"
    unit: ca/cad
    params:
      cap: ca-pe/medical_expense_dollar_limit
    consumes:
      base: ca-pe/pe428_medical_expenses_rate_amount_line_43
    produces:
      output: ca-pe/pe428_medical_expenses_limited_amount_line_44
