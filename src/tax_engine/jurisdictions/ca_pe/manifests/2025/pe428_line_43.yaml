# Form PE428 (CRA 5002-C) line 43: "Line 42: Applicable rate 3%" and "Line 43: Line 41 multiplied
# by the percentage from line 42 =". Line 42 is the printed 3%, the `ca-pe/medical_expense_rate`
# dataset, and has no step of its own. Line 43 applies that rate to line 41 (pe428_line_41.yaml),
# rounded half-up to the cent by the dataset's rule. The form names no label for the line, so the
# step has no title.
form:
  name: ca-pe/pe428
capabilities:
  - name: core/apply_rate
    reference: "43"
    unit: ca/cad
    params:
      rate: ca-pe/medical_expense_rate
    consumes:
      base: ca-pe/pe428_net_income_line_41
    produces:
      output: ca-pe/pe428_medical_expenses_rate_amount_line_43
