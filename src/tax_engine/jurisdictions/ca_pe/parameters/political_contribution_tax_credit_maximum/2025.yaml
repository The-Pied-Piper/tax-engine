# Form PE428 line 92: political contribution tax credit, maximum, 2025 (CRA 5002-C). Line 92 prints
# "Prince Edward Island political contribution tax credit (use Worksheet PE428) (maximum $500)", a
# figure with no cents, so the amount rounds half-up to the cent, the project's choice, as the form
# states no rounding rule. It is claimed whole: the credit kind, as ca-ns/labour_sponsored_credit_maximum is.
family: ca-pe/political_contribution_tax_credit_maximum
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5002-c/5002-c-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "500"
