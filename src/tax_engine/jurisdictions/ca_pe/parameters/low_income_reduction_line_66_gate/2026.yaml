# Provisional: taken from the 2025 form text named in sources; to be confirmed against the 2026 form text when CRA publishes it.
# Derivation: carried forward unchanged from the 2025 file; the 2026 form is not yet published.
# Line 66 gate, 2026 tax year (Form PE428 line 66, and the instruction under line 67: "If you are
# claiming an amount on line 66, enter "0" on line 87 and continue on line 88."). Not a CRA figure
# and not printed on any form: the rows are a switch that gives 1 where line 66 is 0.00, so line 87
# stands, and 0 where an amount is claimed on line 66, so line 87 is "0" as the form prints. A base
# of 0.00 gives 1 and a base of one cent or more gives 0.
# A base exactly at a row's `over` is in the lower band, so the second row starts above 0.005: no
# cent amount is in the first band but 0.00, and 0.01 is in the second.
family: ca-pe/low_income_reduction_line_66_gate
tax_year: 2026
kind: amount_by_band
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5002-c/5002-c-25e.txt
rounding: none
rows:
  - {over: "0", amount: "1"}
  - {over: "0.005", amount: "0"}
