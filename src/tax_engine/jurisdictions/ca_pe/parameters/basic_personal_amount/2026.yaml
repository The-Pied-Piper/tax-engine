# Provisional: taken from T4127 (Jan 2026); to be confirmed against the 2026 form text when CRA publishes it.
# Derivation: figure as printed in T4127 (Jan 2026) Prince Edward Island change notice (the Government of Prince Edward Island announced on April 10, 2025 an increase of the basic personal amount from 14,650 to 15,000 effective January 1, 2026) and in T4127 (Jul 2026) as the total claim amount when Form TD1PE is not filed (15,000); no rounding applied here.
# Prince Edward Island basic personal amount, 2026 tax year (Form PE428 line 9 and line 58040). Not
# income-tested. The credit rate that turns it into tax relief is its own dataset.
# Line 58040 is a dollars-and-cents box, so the amount rounds half-up to the cent, the
# project's choice, as the form states no rounding rule.
# The 2026 PE428 text is not yet published, so the figure is not yet confirmed against it.
family: ca-pe/basic_personal_amount
tax_year: 2026
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pub/t4127-jan/t4127-01-26e.pdf
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pub/t4127-jul/t4127-jul-26e.pdf
rounding: {increment: "0.01", mode: half_up}
amount: "15000"
