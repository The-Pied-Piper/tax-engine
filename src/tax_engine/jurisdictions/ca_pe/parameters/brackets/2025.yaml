# Prince Edward Island 2025 brackets, Form PE428 (CRA 5002-C) Part A, lines 2 to 8, columns 1 to 5.
# Column headings: "Column 1: Line 1 is $33,328 or less"; "Column 2: Line 1 is more than $33,328 but
# not more than $64,656"; "Column 3: Line 1 is more than $64,656 but not more than $105,000";
# "Column 4: Line 1 is more than $105,000 but not more than $140,000"; "Column 5: Line 1 is more
# than $140,000". In every column: line 3 the column's lower bound (0.00, 33,328.00, 64,656.00,
# 105,000.00, 140,000.00); line 5 the rate (9.5%, 13.47%, 16.6%, 17.62%, 19%); line 7 the printed
# constant (0.00, 3,166.16, 7,386.04, 14,083.15, 20,250.15). Lines 3, 5 and 7 are the printed
# figures; lines 2, 4, 6 and 8 are computed.
# Each bracket's `tax_at_start` is the line 7 constant of its column, taken as printed: the
# constants are not recomputed from the rates, and not rounded.
# This dataset has no rounding rule, as the form states none. The take-home build rounds line 6
# half-up to the cent in its own part (ca-pe/cent_rounding).
# There is no `up_to`: column 5 is unbounded ("more than $140,000"), and the form prints one set
# of five columns, so every line 1 falls in a column.
family: ca-pe/brackets
tax_year: 2025
kind: brackets
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5002-c/5002-c-25e.txt
rounding: none
brackets:
  - {from: "0.00", rate: "0.095", tax_at_start: "0.00"}
  - {from: "33328.00", rate: "0.1347", tax_at_start: "3166.16"}
  - {from: "64656.00", rate: "0.166", tax_at_start: "7386.04"}
  - {from: "105000.00", rate: "0.1762", tax_at_start: "14083.15"}
  - {from: "140000.00", rate: "0.19", tax_at_start: "20250.15"}
