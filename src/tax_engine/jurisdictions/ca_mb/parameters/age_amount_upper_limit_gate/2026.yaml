# Provisional: taken from the 2025 form text named in sources; to be confirmed against the 2026 form text when CRA publishes it.
# Derivation: carried forward unchanged from the 2025 file; the 2026 form is not yet published.
# Manitoba age amount upper limit gate, 2026 (Worksheet MB428 "Line 58080 - Age amount": "$52,602 or more, enter 0").
# Not a CRA figure and not printed on any form: the rows are a switch that gives 0 where the base is
# 0.00 and 1 where it is one cent or more. The base is the printed limit minus net income (worksheet
# line 2), not below 0, so the gate is 1 exactly when net income is less than the limit. A base
# exactly at a row's `over` is in the lower band, so the second row starts above 0.005.
family: ca-mb/age_amount_upper_limit_gate
tax_year: 2026
kind: amount_by_band
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5007-d/5007-d-25e.txt
rounding: none
rows:
  - {over: "0", amount: "0"}
  - {over: "0.005", amount: "1"}
