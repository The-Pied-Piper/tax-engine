# Provisional: taken from the 2025 form text named in sources; to be confirmed against the 2026 form text when CRA publishes it.
# Derivation: carried forward unchanged from the 2025 file; the 2026 form is not yet published.
# Age amount reduction rate, 2026 (Worksheet MB428, CRA 5007-D): "Line 58080 - Age amount (if you were born in 1960 or earlier)", line 5 "Applicable rate 15%". The worksheet's "$27,749 or less, enter $3,728" follows from the arithmetic; its "$52,602 or more, enter 0" does not (3,728 less 15% of (52,602 - 27,749) is 0.05), so it is built as a gate (`ca-mb/age_amount_upper_limit`, `ca-mb/age_amount_upper_limit_gate`). Line 6 is a dollars-and-cents box, so the product rounds half-up to the cent, the project's choice.
family: ca-mb/age_rate
tax_year: 2026
kind: rate
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5007-d/5007-d-25e.txt
rounding: {increment: "0.01", mode: half_up}
rate: "0.15"
