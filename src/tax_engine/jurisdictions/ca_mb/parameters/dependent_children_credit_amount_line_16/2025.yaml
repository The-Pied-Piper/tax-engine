# Manitoba MB479 line 16 amount for each unit, 2025 tax year (Form MB479, CRA 5007-TC): "Number of
# dependent children multiplied by $26 =". The printed $26 is the amount for each of the dependent
# children counted in the box above it, claimed whole, so it takes the credit kind. Line 16 is a
# dollars-and-cents box, so the amount rounds half-up to the cent, the project's choice, as the
# form states no rounding rule.
family: ca-mb/dependent_children_credit_amount_line_16
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5007-tc/5007-tc-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "26"
