# Provisional: taken from the 2025 form text named in sources; to be confirmed against the 2026 form text when CRA publishes it.
# Derivation: carried forward unchanged from the 2025 file; the 2026 form is not yet published.
# Manitoba MB479 line 14 amount for each unit, 2026 tax year (Form MB479, CRA 5007-TC): "Number of
# disability claims multiplied by $113 =". The printed $113 is the amount for each of the
# disability claims counted in the box above it, claimed whole, so it takes the credit kind. Line
# 14 is a dollars-and-cents box, so the amount rounds half-up to the cent, the project's choice,
# as the form states no rounding rule.
family: ca-mb/disability_credit_amount_line_14
tax_year: 2026
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5007-tc/5007-tc-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "113"
