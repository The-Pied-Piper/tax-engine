# Manitoba basic personal amount slope, 2025 tax year (Form MB428 line 52, "Manitoba non-refundable
# tax credits rate 10.8%"; Worksheet MB428 line 8 "Line 6 multiplied by line 7"): a two-band chart
# the return summary reads line 8 through (core/amount_by_band_rate). A base of 0.00 gives 0 and a
# base of one cent or more gives the printed 10.8%, so the credit that the basic personal amount's
# fall takes away counts in the marginal tax rate only where line 8 is above zero. The rate is the
# same figure as `ca-mb/credit_rate`, which rounds half-up to the cent (a rate of 0.108 would read
# 0.11), so this chart carries it with no rounding. A base exactly at a row's `over` is in the lower
# band, so the second row starts above 0.005: no cent amount is in the first band but 0.00, and 0.01
# is in the second.
family: ca-mb/reduction_slope
tax_year: 2025
kind: amount_by_band
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5007-c/5007-c-25e.txt
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5007-d/5007-d-25e.txt
rounding: none
rows:
  - {over: "0", amount: "0"}
  - {over: "0.005", minus: "0", rate: "0.108", plus: "0"}
