# Form MB428 (CRA 5007-c) line 47: "Line 47: Enter whichever is less: $1,728 or the amount from line
# 46." The $1,728 is the printed ceiling, the `ca-mb/medical_expense_dollar_limit` dataset, and has
# no step of its own. Line 47 is the lesser of that ceiling and line 46
# (`ca-mb/mb428_medical_expenses_rate_amount_line_46`), one core/capped_amount step, rounded
# half-up to the cent by the dataset's rule. The form prints no label for the line, so the step has
# no title. Line 46 is always a figure, so nothing is blank.
form:
  name: ca-mb/mb428_credits
capabilities:
  - name: core/capped_amount
    reference: "47"
    unit: ca/cad
    params:
      cap: ca-mb/medical_expense_dollar_limit
    consumes:
      base: ca-mb/mb428_medical_expenses_rate_amount_line_46
    produces:
      output: ca-mb/mb428_medical_expenses_limited_amount_line_47
