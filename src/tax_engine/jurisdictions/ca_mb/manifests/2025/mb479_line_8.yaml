# Form MB479 (CRA 5007-TC) line 8: "Age credit for self (if you were born in 1960 or earlier) Claim $113". A core/first_record_count step reads the T1's "aged 65 or older" flag (`ca/t1_lines_copied_by_provinces.age_65_or_older`, worked out once on the T1 from the year of birth; blank passes on and is read as 0 by the step below; not a line of the form), a core/credit_amount step gives the printed claim $113 (`ca-mb/age_credit_amount_line_8`), and a core/times_count step of the claim by the count is line 8: $113.00 when born in 1960 or earlier, 0.00 otherwise, never blank. It replaces the typed-in amount of the same identifier. Line 17 adds it.
form:
  name: ca-mb/mb479
capabilities:
- name: core/first_record_count
  title: Aged 65 or older at the end of the year
  consumes:
    records: ca/t1_lines_copied_by_provinces.age_65_or_older
  blank:
    records:
      ca/age_65_or_older: pass_on
  produces:
    output: ca-mb/mb479_age_65_or_older
- name: core/credit_amount
  title: Age credit for self claim
  unit: ca/cad
  params:
    amount: ca-mb/age_credit_amount_line_8
  produces:
    output: ca-mb/mb479_age_credit_claim_line_8
- name: core/times_count
  title: Age credit for self
  reference: '8'
  unit: ca/cad
  params:
    rounding: ca-mb/cent_rounding
  consumes:
    amount: ca-mb/mb479_age_credit_claim_line_8
    count: ca-mb/mb479_age_65_or_older
  blank:
    count: '0'
  produces:
    output: ca-mb/mb479_age_credit_line_8
