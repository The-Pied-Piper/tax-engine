# Form MB428 (CRA 5007-C) line 61 (ca-mb/mb428). "Line 61: Manitoba non-refundable tax credits from
# line 57 ^". Line 61 is a copy of line 57, which sits on the other form `ca-mb/mb428_credits` (lines
# 1 to 57), so the one step is core/record_total over that form's line 57 export, read as a record
# list.
form:
  name: ca-mb/mb428
capabilities:
  - name: core/record_total
    title: "Manitoba non-refundable tax credits"
    reference: "61"
    unit: ca/cad
    consumes:
      records: ca-mb/mb428_credits.mb428_non_refundable_credits_line_57
    produces:
      output: ca-mb/mb428_non_refundable_credits_line_61
