# MB428 (2025) line 77's input, which a salary-only caller does not give.
# Line 77: "Line 77 and line 60850: Manitoba small business venture capital tax credit for individuals
# (complete Form T1256-1) (maximum $120,000)" (Form MB428, CRA 5007-c).
# Form T1256-1 is not built, so a request that leaves the line out is read as blank; line 77
# (mb428_line_77.yaml) passes that blank on.
inputs:
  - name: ca-mb/mb428_venture_capital_credit
    title: "Manitoba small business venture capital tax credit for individuals"
    reference: "77"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 77 and line 60850: Manitoba small business venture capital tax credit for individuals (complete Form T1256-1) (maximum $120,000)'
