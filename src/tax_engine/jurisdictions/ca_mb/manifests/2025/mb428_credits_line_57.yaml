# Form MB428 (CRA 5007-c) line 57 (ca-mb/mb428_credits): "Line 57 and line 61500: Line 53 plus line 56
# Enter this amount on line 61. Manitoba non-refundable tax credits". It sums line 53
# (`ca-mb/mb428_credits_at_rate_line_53`) and the line 56 input (`ca-mb/mb428_donations_credit_line_56`).
# Lines 54 and 55 are not built: line 56 is an input that a salary-only caller leaves out, read as blank
# and then as 0 by the blank rule below. Line 57 is the output
# `ca-mb/mb428_non_refundable_credits_line_57`, which the form exports for line 61.
form:
  name: ca-mb/mb428_credits
capabilities:
  - name: core/sum
    title: "Manitoba non-refundable tax credits"
    reference: "57"
    unit: ca/cad
    params:
      rounding: ca-mb/cent_rounding
    consumes:
      parts: [ca-mb/mb428_credits_at_rate_line_53, ca-mb/mb428_donations_credit_line_56]
    blank:
      ca-mb/mb428_donations_credit_line_56: "0"
    produces:
      output: ca-mb/mb428_non_refundable_credits_line_57
