# MB479 (2025) line 77's input, which a salary-only caller does not give.
# Line 77 and line 61490: "Enter your Manitoba employee share purchase tax credit from line 6 of
# Form T1256-2. (maximum $27,000)" (Form MB479, CRA 5007-TC), which the form prints with no label. A
# salary-only caller has no such credit, so a request that leaves the line out is read as blank; the
# line 77 step (mb479_line_77.yaml) passes that blank on.
inputs:
  - name: ca-mb/mb479_employee_share_purchase_credit_line_77
    reference: "77"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 77 and line 61490: Enter your Manitoba employee share purchase tax credit from line 6 of Form T1256-2. (maximum $27,000)'
