# Form MB428 (CRA 5007-c) line 50: "Line 50 and line 58769: Line 48 plus line 49 =". Line 48 is the
# medical expenses over the limit (mb428_credits_line_48.yaml) and line 49 the allowable amount of
# medical expenses for other dependants (mb428_credits_line_49.yaml), 0.00 for a salary-only caller.
# Line 50 adds them with core/sum, in line order, and line 51 reads it.
form:
  name: ca-mb/mb428_credits
capabilities:
  - name: core/sum
    title: "Medical expenses"
    reference: "50"
    unit: ca/cad
    params:
      rounding: ca-mb/cent_rounding
    consumes:
      parts:
        - ca-mb/mb428_medical_expenses_over_limit_line_48
        - ca-mb/mb428_other_dependants_medical_expenses_line_49
    produces:
      output: ca-mb/mb428_medical_expenses_line_50
