# MB428 (2025) line 63's input, which a salary-only caller does not give.
# Line 63: "Line 63 and line 61540: Amount from line 40427 of your return" (Form MB428, CRA 5007-c).
# The amount from line 40427 is not built, so a request that leaves the line out is read as blank;
# the step that reads line 63 reads that blank as 0.
inputs:
  - name: ca-mb/mb428_minimum_tax_carryover_line_63
    title: "Amount from line 40427 of your return"
    reference: "63 (line 40427)"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 63 and line 61540: Amount from line 40427 of your return'
