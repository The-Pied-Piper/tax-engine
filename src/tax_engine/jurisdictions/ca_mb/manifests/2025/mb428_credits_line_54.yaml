# Form MB428 (CRA 5007-c) line 54 (ca-mb/mb428_credits): "Line 54: Amount from line 13 of your federal
# Schedule 9 multiplied by 10.8% =". The 10.8% is a printed rate, held in the
# `ca-mb/donations_credit_rate_line_54` dataset, so the step is one calculation: 10.8% of the Schedule 9
# amount, rounded half-up to the cent. The amount (box A) is read from the Schedule 9 export: the first step totals it (a form reads
# another form's export only as a record list). The line has two boxes: the amount
# (box A, the first step) and the multiplied result (box B, this step). The form does not name them; "box
# A" and "box B" are the owner's naming, as on ON428 line 47.
form:
  name: ca-mb/mb428_credits
capabilities:
  - name: core/record_total
    title: "Amount from line 13 of your federal Schedule 9"
    reference: "54 box A"
    unit: ca/cad
    consumes:
      records: ca/schedule_9.donations_and_gifts_line_13
    produces:
      output: ca-mb/mb428_donations_amount_line_54
  - name: core/apply_rate
    reference: "54 box B"
    unit: ca/cad
    params:
      rate: ca-mb/donations_credit_rate_line_54
    consumes:
      base: ca-mb/mb428_donations_amount_line_54
    blank:
      base: "0"
    produces:
      output: ca-mb/mb428_donations_credit_at_rate_line_54
