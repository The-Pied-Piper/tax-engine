# MB428 (2025) line 62's input, which a salary-only caller does not give.
# Line 62: "Line 62 and line 61520: Manitoba dividend tax credit (use Worksheet MB428)" (Form MB428,
# CRA 5007-c). The dividend tax credit section of Worksheet MB428 is not built, so a request that
# leaves the line out is read as blank; the step that reads line 62 reads that blank as 0.
inputs:
  - name: ca-mb/mb428_dividend_tax_credit_line_62
    title: "Manitoba dividend tax credit"
    reference: "62"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 62 and line 61520: Manitoba dividend tax credit (use Worksheet MB428)'
