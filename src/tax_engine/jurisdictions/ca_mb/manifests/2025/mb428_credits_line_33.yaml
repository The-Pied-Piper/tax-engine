# Form MB428 (CRA 5007-c) line 33: "Line 33: Add lines 30 to 32. = ^". Line 30 is a copy of line 29, so
# it gets no step of its own and core/sum consumes line 29 directly. Line 31, the pension income
# amount, is the entry checked against its printed maximum (mb428_credits_line_31.yaml), read as 0
# when blank. Line 32, the caregiver amount (Worksheet MB428), is not built.
form:
  name: ca-mb/mb428_credits
capabilities:
  - name: core/sum
    reference: "33"
    unit: ca/cad
    params:
      rounding: ca-mb/cent_rounding
    consumes:
      parts:
        - ca-mb/mb428_credits_subtotal_line_29
        - ca-mb/mb428_pension_income_amount_line_31
    blank:
      ca-mb/mb428_pension_income_amount_line_31: "0"
    produces:
      output: ca-mb/mb428_credits_subtotal_line_33
