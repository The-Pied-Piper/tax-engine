# MB428 (2025) line 59's input, which a salary-only caller does not give.
# Line 59: "Line 59 and line 61510: Manitoba tax on split income (complete Form T1206)" (Form MB428,
# CRA 5007-c).
# Form T1206 is not built, so a request that leaves the line out is read as blank; the step that
# reads line 59 (line 60) reads that blank as 0.
inputs:
  - name: ca-mb/mb428_tax_on_split_income_line_59
    title: "Manitoba tax on split income"
    reference: "59"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 59 and line 61510: Manitoba tax on split income (complete Form T1206)'
