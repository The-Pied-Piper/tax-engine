# Form MB428 (CRA 5007-c) line 76: "Line 76: Line 74 minus line 75 (if negative, enter "0") = ^".
# One core/subtract_not_below_zero step: the Manitoba tax (line 74, `ca-mb/mb428_tax_line_74`) less
# the community enterprise development tax credit (line 75,
# `ca-mb/mb428_community_enterprise_development_tax_credit_line_75`), not below 0. Line 75 is an
# optional input that a salary-only caller leaves blank, read as blank and then as 0 by the blank
# rule. The form prints no title for the line, so the step has none. The output is
# `ca-mb/mb428_tax_line_76`, which is not exported yet.
form:
  name: ca-mb/mb428
capabilities:
  - name: core/subtract_not_below_zero
    reference: "76"
    unit: ca/cad
    params:
      rounding: ca-mb/cent_rounding
    consumes:
      amount: ca-mb/mb428_tax_line_74
      less: ca-mb/mb428_community_enterprise_development_tax_credit_line_75
    blank:
      less: "0"
    produces:
      output: ca-mb/mb428_tax_line_76
