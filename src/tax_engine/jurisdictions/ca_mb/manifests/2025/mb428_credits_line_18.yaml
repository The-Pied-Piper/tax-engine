# Form MB428 (CRA 5007-C) line 18: "Line 18: Add lines 9, 10, 13, 16, and 17." The take-home filer
# claims no age, spouse, eligible dependant or infirm dependant amounts (lines 10, 13, 16 and 17),
# so only line 9 (basic personal amount, ca-mb/mb428_basic_personal_amount_line_9) is summed; a
# single part is still a sum, so the step is built.
form:
  name: ca-mb/mb428_credits
capabilities:
  - name: core/sum
    reference: "18"
    unit: ca/cad
    params:
      rounding: ca-mb/cent_rounding
    consumes:
      parts: [ca-mb/mb428_basic_personal_amount_line_9]
    produces:
      output: ca-mb/mb428_credits_subtotal_line_18
