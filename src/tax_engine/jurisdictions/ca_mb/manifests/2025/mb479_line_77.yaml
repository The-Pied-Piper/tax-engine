# MB479 (2025) line 77, the employee share purchase tax credit. Form MB479 (CRA 5007-TC): "Line 77
# and line 61490: Enter your Manitoba employee share purchase tax credit from line 6 of Form
# T1256-2. (maximum $27,000)". No arithmetic is printed, so line 77 is an entry line in two steps.
# The first, core/credit_amount, supplies the printed maximum from the
# `ca-mb/employee_share_purchase_credit_maximum` dataset; it is not a line of the form, so it has no
# title and no reference. The second, core/at_most, is line 77: the entered amount
# (mb479_line_77_input.yaml) passed on unchanged. The form prints no label, so the step has no
# title. An entry above the printed maximum is refused, not capped. A blank entry passes on as
# blank.
form:
  name: ca-mb/mb479
capabilities:
  - name: core/credit_amount
    unit: ca/cad
    params:
      amount: ca-mb/employee_share_purchase_credit_maximum
    produces:
      output: ca-mb/mb479_employee_share_purchase_credit_maximum
  - name: core/at_most
    reference: "77"
    unit: ca/cad
    consumes:
      amount: ca-mb/mb479_employee_share_purchase_credit_line_77
      bound: ca-mb/mb479_employee_share_purchase_credit_maximum
    blank:
      amount: pass_on
    produces:
      output: ca-mb/mb479_employee_share_purchase_credit_checked_line_77
