# MB428 (2025) line 31, the pension income amount. Form MB428 (CRA 5007-c): "Line 31 and line 58360:
# Pension income amount (maximum $1,000)". No arithmetic is printed, so line 31 is an entry line in
# two steps. The first, core/credit_amount, supplies the printed maximum from the
# `ca-mb/pension_income_amount_maximum` dataset; it is not a line of the form, so it has no
# reference, and its title is plain words, not printed wording, because the sentence of line 31
# names it. The second, core/at_most, is line 31: the entered amount
# (mb428_credits_line_31_input.yaml) passed on unchanged. An entry above the printed maximum is
# refused, not capped. A blank entry passes on as blank.
form:
  name: ca-mb/mb428_credits
capabilities:
  - name: core/credit_amount
    title: "Most you can claim for pension income"
    unit: ca/cad
    params:
      amount: ca-mb/pension_income_amount_maximum
    produces:
      output: ca-mb/mb428_pension_income_amount_maximum
  - name: core/at_most
    title: "Pension income amount"
    reference: "31"
    unit: ca/cad
    consumes:
      amount: ca-mb/mb428_pension_income_amount
      bound: ca-mb/mb428_pension_income_amount_maximum
    blank:
      amount: pass_on
    produces:
      output: ca-mb/mb428_pension_income_amount_line_31
