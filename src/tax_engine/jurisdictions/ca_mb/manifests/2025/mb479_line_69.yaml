# Form MB479 (CRA 5007-TC) line 69: "Line 69: Line 67 plus line 68 = ^". It sums the line 67 optional
# input (`ca-mb/mb479_green_energy_purchaser_credit_line_67`) and line 68
# (`ca-mb/mb479_geothermal_heat_pump_credit_line_68`). A caller who leaves line 67 blank has it read
# as 0 by the blank rule. The form prints no maximum for line 69, and the step is untitled. The
# output is `ca-mb/mb479_green_energy_credits_line_69`, which is not exported yet.
form:
  name: ca-mb/mb479
capabilities:
  - name: core/sum
    reference: "69"
    unit: ca/cad
    params:
      rounding: ca-mb/cent_rounding
    consumes:
      parts: [ca-mb/mb479_green_energy_purchaser_credit_line_67, ca-mb/mb479_geothermal_heat_pump_credit_line_68]
    blank:
      ca-mb/mb479_green_energy_purchaser_credit_line_67: "0"
    produces:
      output: ca-mb/mb479_green_energy_credits_line_69
