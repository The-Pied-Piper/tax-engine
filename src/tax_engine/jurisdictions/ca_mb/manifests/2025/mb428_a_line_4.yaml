# Schedule MB428-A (CRA 5007-A) line 4: "Age amount for self if you were born in 1960 or earlier Claim $2,065". Built as ca-mb/mb479 line 8 and ca-ns/ns428 line 98 are: a core/first_record_count step that reads the T1's "aged 65 or older" flag (`ca/t1_lines_copied_by_provinces.age_65_or_older`, worked out once on the T1 from the year of birth; blank passes on and is read as 0 by the step below; not a line of the form; this form's own step, as the form's lines are not read by another form), a core/credit_amount step for the printed claim $2,065 (`ca-mb/family_tax_benefit_age_amount_line_4`), and a core/times_count step of the claim by the count, which is line 4: $2,065.00 when born in 1960 or earlier, 0.00 otherwise.
form:
  name: ca-mb/mb428_a
capabilities:
- name: core/first_record_count
  title: Aged 65 or older at the end of the year
  consumes:
    records: ca/t1_lines_copied_by_provinces.age_65_or_older
  blank:
    records:
      ca/age_65_or_older: pass_on
  produces:
    output: ca-mb/mb428_a_age_65_or_older
- name: core/credit_amount
  title: Age amount for self claim
  unit: ca/cad
  params:
    amount: ca-mb/family_tax_benefit_age_amount_line_4
  produces:
    output: ca-mb/mb428_a_age_amount_claim_line_4
- name: core/times_count
  title: Age amount for self
  reference: '4'
  unit: ca/cad
  params:
    rounding: ca-mb/cent_rounding
  consumes:
    amount: ca-mb/mb428_a_age_amount_claim_line_4
    count: ca-mb/mb428_a_age_65_or_older
  blank:
    count: '0'
  produces:
    output: ca-mb/mb428_a_age_amount_line_4
