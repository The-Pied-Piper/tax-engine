# MB479 (2025) line 14's input, the number of disability claims. Form MB479 (CRA 5007-TC): "Number
# of disability claims Line 60950 multiplied by $113 =". The line has two boxes: the number (box
# A, the input here) and the multiplied result (box B, the step in mb479_line_14.yaml). The form
# does not name them; "box A" and "box B" are the owner's naming, as on ON428 line 47. A
# salary-only caller has none, so a request that leaves the line out is read as 0 (the input's own
# default), and the step multiplies it.
inputs:
  - name: ca-mb/mb479_disability_claims_number_line_14
    title: "Number of disability claims"
    reference: "14 box A"
    unit: ca/cad
    required: false
    default: "0"
    basis: 'Line 14: Number of disability claims'
