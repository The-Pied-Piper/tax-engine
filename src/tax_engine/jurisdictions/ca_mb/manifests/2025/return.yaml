# The Manitoba take-home return: T1 line 167 "Refund or balance owing" (positive is owing, negative
# is a refund). The T1 form exports it, and another form's export is read only as a record list, so
# the first step is core/record_total over the T1 export, totalling the one amount into the return's
# own `ca/refund_or_balance_owing`.
#
# The return's second output is the average tax rate on the take-home basis. The federal form
# `ca/take_home_average_rate` works it out once for every province (income tax, CPP and EI over the
# salary), and the return reads its export `ca/average_tax_rate` with one core/record_total.
#
# The third output is the marginal tax rate on the take-home basis: the change in T1 line 43500
# plus CPP (Schedule 8 lines 25, 12 and 22) plus EI (T2204 line 16) per further dollar of salary,
# for a salary-only filer with no paid credits. It is calculated with the rates of the forms, not by
# running the return twice: a sum of the rates that apply at the salary, one capability per line,
# every figure exact (`ca-mb/exact_rounding` rounds nothing). No form prints any of these figures,
# so the steps below have no title and no line reference, and only line 167 carries a line
# reference.
#
# The federal half is the federal form `ca/take_home_marginal_rates` (imported by the manifest,
# after the T1 forms), which works from the salary alone. This return reads its four exports, each
# totalled by core/record_total into its own figure: the net income rate (the part of a further
# dollar left in the net income and the taxable income), the credit-earning contribution rate (the
# CPP base rate plus the EI rate), the federal marginal rate and the contribution rate (the CPP
# base, first additional, second additional and EI rates). The rest is Manitoba's own.
#
# Manitoba. The bracket rate is printed on MB428 line 5 "Line 5: Rate" (10.8% to a taxable income of
# 47,000, 12.75% to 100,000, 17.4% above). The form has one table of three columns and fills one,
# so the line is never blank: MB428 credits exports it and a core/record_total step reads it into
# the return's own kind, with no sum of two lines. It is multiplied by the net income rate, as a
# further dollar of salary adds that part to the taxable income.
#
# The basic personal amount phase-out (Worksheet MB428, "Line 58040 - Basic personal amount", which
# MB428 line 9 reads) is a figure of 15,780.00 up to a net income of 200,000.00, which falls by
# 15,780 / 200,000 for each further dollar and is 0 from 400,000. The credit is the credit rate of
# MB428 line 52 (10.8%) of that amount, so between those two figures the Manitoba rate rises by
# 15,780 / 200,000 x 10.8% = 0.0085212 exactly for each dollar of net income: the amount's fall
# raises the tax. It is built from the printed worksheet lines, in steps. Worksheet MB428 exports
# line 5 (the income threshold, 200,000.00), line 7 (the base amount, 15,780.00), line 8 ("Line 6
# multiplied by line 7") and line 9 ("Line 1 minus line 8 (if negative, enter "0")"), each totalled
# into the return's own kind. Line 8 is read through the `ca-mb/reduction_slope` dataset (the
# printed MB428 line 52 rate of 0.108 where line 8 is above zero, so the range starts above a net
# income of 200,000, and 0 where it is not); the ratio of line 7 over line 5 (0.0789) times that
# slope is the credit rate of the amount's fall; line 9 is read through `ca-mb/marginal_rate_gate`
# (above zero until a net income of 400,000, so the range ends there); the two multiply into
# `ca-mb/manitoba_phase_out_rate`, exact. Net income is what the rate falls on, so that rate is
# multiplied by the net income rate, and core/sum adds it to the bracket rate into
# `ca-mb/manitoba_bracket_rate_with_phase_out`.
#
# The family tax benefit (Schedule MB428-A, MB428 line 41) is a credit amount that falls as net
# income rises: line 12 is line 10 (basic amount 2,065.00) less line 11 (9% of the net income),
# not below 0, so a further dollar of net income takes away 9% of a dollar of the credit amount,
# and each dollar of it is tax at the credit rate of MB428 line 52. It counts only where line 12
# is above 0 (`ca-mb/marginal_rate_gate`, up to a net income of 22,944.38): the 9% of the family
# tax benefit rate (`ca-mb/family_tax_benefit_rate`, as it is) times the gate times the credit rate
# times the net income rate is the extra Manitoba tax, which core/sum adds to the bracket rate
# beside the basic personal amount's.
#
# `ca-mb/reduction_slope` is a dataset of its own, apart from `ca-mb/credit_rate` (MB428 line 52
# itself, the same 10.8%): that one rounds half-up to the cent, as it feeds a dollars-and-cents
# box, and a rate of 0.108 would read 0.11. The slope reads line 8, which is rounded to the cent,
# so it starts at the first cent of line 8, which is within cents of the printed net income of
# 200,000.
#
# Credits on the contributions. The CPP base contribution (T1 line 30800, MB428 line 19) and the EI
# premium (line 31200, MB428 line 21) earn the Manitoba non-refundable credit rate (MB428 line 52,
# the `ca-mb/credit_rate` dataset), so the credit-earning contribution rate times it is the
# Manitoba tax a further dollar of contributions takes off. The rate is the dataset's as it is: its
# cent rounding is for the credit boxes. It comes off the bracket rate with the phase-out.
#
# The whole Manitoba rate counts only where the Manitoba tax after the credits (MB428 line 65 "Line
# 60 minus line 64 (if negative, enter "0")") is above zero, through the `ca-mb/marginal_rate_gate`
# dataset (0 where that tax is 0.00 and 1 from one cent), counted before line 66 (minimum tax
# additional) and lines 69, 71, 73, 75, 77, 79 and 81, which only come back when filing. A phase-out
# that has taken the whole of the tax (line 65 is 0.00) adds nothing.
#
# The last step adds the federal marginal rate, the Manitoba marginal rate and the contribution
# rate (the four contribution rates) with core/sum into `ca-mb/marginal_tax_rate`; it is exact too,
# is not printed on the form and has no title or line. Manitoba has no surtax or health premium.
# Limits: the credits that depend on net income and are claimed only by a filer who gives more
# than a salary (the age amount, Worksheet MB428 line 58080, and the medical expense rate of 3% of
# net income, MB428 line 45) are not steps, as a salary-only filer claims neither; the rate would be
# wrong for a filer who claims either.
capabilities:
  - name: core/record_total
    title: "Refund or balance owing"
    reference: "167"
    unit: ca/cad
    consumes:
      records: ca/t1_tax_and_credits.refund_or_balance_owing
    produces:
      output: ca/refund_or_balance_owing
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca/take_home_average_rate.average_tax_rate
    produces:
      output: ca-mb/average_tax_rate
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca/take_home_marginal_rates.marginal_net_income_rate
    produces:
      output: ca-mb/marginal_net_income_rate
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca/take_home_marginal_rates.marginal_credit_contribution_rate
    produces:
      output: ca-mb/marginal_credit_contribution_rate
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca/take_home_marginal_rates.marginal_federal_rate
    produces:
      output: ca-mb/marginal_federal_rate
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca/take_home_marginal_rates.marginal_contribution_rate
    produces:
      output: ca-mb/marginal_contribution_rate
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca-mb/mb428_credits.mb428_bracket_rate_line_5
    produces:
      output: ca-mb/manitoba_bracket_rate_return
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-mb/mb428.mb428_tax_after_credits_line_65
    produces:
      output: ca-mb/manitoba_tax_after_credits_return
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-mb/marginal_rate_gate
    consumes:
      base: ca-mb/manitoba_tax_after_credits_return
    produces:
      output: ca-mb/manitoba_rate_gate
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-mb/worksheet_mb428.worksheet_mb428_line_8
    produces:
      output: ca-mb/manitoba_phase_out_amount_return
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-mb/worksheet_mb428.worksheet_mb428_basic_personal_amount_line_9
    produces:
      output: ca-mb/manitoba_basic_personal_amount_return
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-mb/worksheet_mb428.worksheet_mb428_line_7
    produces:
      output: ca-mb/manitoba_base_amount_return
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-mb/worksheet_mb428.worksheet_mb428_line_5
    produces:
      output: ca-mb/manitoba_income_threshold_return
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-mb/marginal_rate_gate
    consumes:
      base: ca-mb/manitoba_basic_personal_amount_return
    produces:
      output: ca-mb/manitoba_basic_personal_amount_gate
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-mb/reduction_slope
    consumes:
      base: ca-mb/manitoba_phase_out_amount_return
    produces:
      output: ca-mb/manitoba_reduction_slope
  - name: core/divide
    unit: core/percent
    params:
      rounding: ca-mb/exact_rounding
    consumes:
      dividend: ca-mb/manitoba_base_amount_return
      divisor: ca-mb/manitoba_income_threshold_return
    produces:
      output: ca-mb/manitoba_phase_out_ratio
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-mb/exact_rounding
    consumes:
      base: ca-mb/manitoba_phase_out_ratio
      rate: ca-mb/manitoba_reduction_slope
    produces:
      output: ca-mb/manitoba_phase_out_credit_rate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-mb/exact_rounding
    consumes:
      base: ca-mb/manitoba_basic_personal_amount_gate
      rate: ca-mb/manitoba_phase_out_credit_rate
    produces:
      output: ca-mb/manitoba_phase_out_rate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-mb/exact_rounding
    consumes:
      base: ca-mb/manitoba_phase_out_rate
      rate: ca-mb/marginal_net_income_rate
    produces:
      output: ca-mb/marginal_manitoba_phase_out_rate
  - name: core/rate_figure
    unit: core/percent
    params:
      rate: ca-mb/credit_rate
    produces:
      output: ca-mb/marginal_manitoba_credit_rate
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-mb/mb428_a.mb428_a_family_tax_benefit_line_12
    produces:
      output: ca-mb/family_tax_benefit_return
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-mb/marginal_rate_gate
    consumes:
      base: ca-mb/family_tax_benefit_return
    produces:
      output: ca-mb/family_tax_benefit_gate
  - name: core/rate_figure
    unit: core/percent
    params:
      rate: ca-mb/family_tax_benefit_rate
    produces:
      output: ca-mb/marginal_family_tax_benefit_rate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-mb/exact_rounding
    consumes:
      base: ca-mb/family_tax_benefit_gate
      rate: ca-mb/marginal_family_tax_benefit_rate
    produces:
      output: ca-mb/marginal_family_tax_benefit_fall
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-mb/exact_rounding
    consumes:
      base: ca-mb/marginal_family_tax_benefit_fall
      rate: ca-mb/marginal_manitoba_credit_rate
    produces:
      output: ca-mb/marginal_family_tax_benefit_credit_rate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-mb/exact_rounding
    consumes:
      base: ca-mb/marginal_family_tax_benefit_credit_rate
      rate: ca-mb/marginal_net_income_rate
    produces:
      output: ca-mb/marginal_manitoba_family_tax_benefit_rate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-mb/exact_rounding
    consumes:
      base: ca-mb/manitoba_bracket_rate_return
      rate: ca-mb/marginal_net_income_rate
    produces:
      output: ca-mb/marginal_manitoba_bracket_rate
  - name: core/sum
    unit: core/percent
    params:
      rounding: ca-mb/exact_rounding
    consumes:
      parts:
        - ca-mb/marginal_manitoba_bracket_rate
        - ca-mb/marginal_manitoba_phase_out_rate
        - ca-mb/marginal_manitoba_family_tax_benefit_rate
    produces:
      output: ca-mb/manitoba_bracket_rate_with_phase_out
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-mb/exact_rounding
    consumes:
      base: ca-mb/marginal_credit_contribution_rate
      rate: ca-mb/marginal_manitoba_credit_rate
    produces:
      output: ca-mb/marginal_manitoba_contribution_credit_rate
  - name: core/subtract
    unit: core/percent
    params:
      rounding: ca-mb/exact_rounding
    consumes:
      amount: ca-mb/manitoba_bracket_rate_with_phase_out
      less: ca-mb/marginal_manitoba_contribution_credit_rate
    produces:
      output: ca-mb/marginal_manitoba_rate_after_credits
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-mb/exact_rounding
    consumes:
      base: ca-mb/marginal_manitoba_rate_after_credits
      rate: ca-mb/manitoba_rate_gate
    produces:
      output: ca-mb/manitoba_marginal_rate
  - name: core/sum
    unit: core/percent
    params:
      rounding: ca-mb/exact_rounding
    consumes:
      parts:
        - ca-mb/marginal_federal_rate
        - ca-mb/manitoba_marginal_rate
        - ca-mb/marginal_contribution_rate
    produces:
      output: ca-mb/marginal_tax_rate
