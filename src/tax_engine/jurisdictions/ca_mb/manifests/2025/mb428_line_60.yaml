# Form MB428 (CRA 5007-c) line 60: "Line 60: Line 58 plus line 59 = ^". It sums line 58
# (`ca-mb/mb428_manitoba_tax_on_taxable_income_line_58`) and the line 59 optional input
# (`ca-mb/mb428_tax_on_split_income_line_59`). A salary-only caller leaves line 59 blank, and the
# blank rule reads it as 0. The output is `ca-mb/mb428_tax_before_credits_line_60`, which is not
# exported yet.
form:
  name: ca-mb/mb428
capabilities:
  - name: core/sum
    reference: "60"
    unit: ca/cad
    params:
      rounding: ca-mb/cent_rounding
    consumes:
      parts: [ca-mb/mb428_manitoba_tax_on_taxable_income_line_58, ca-mb/mb428_tax_on_split_income_line_59]
    blank:
      ca-mb/mb428_tax_on_split_income_line_59: "0"
    produces:
      output: ca-mb/mb428_tax_before_credits_line_60
