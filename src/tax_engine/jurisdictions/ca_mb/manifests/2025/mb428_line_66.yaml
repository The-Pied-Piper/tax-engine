# Form MB428 (Manitoba Tax, 2025, CRA 5007-C) line 66 (ca-mb/mb428). "Manitoba additional tax for
# minimum tax purposes:" / "Line 66: Form T691: line 1 minus line 2 of Part 7 multiplied by 50% =
# ^". The 50% is a printed rate, held in the `ca-mb/minimum_tax_rate` dataset, so line 66 is one
# calculation: 50% of the amount, rounded half-up to the cent. The amount is what the form prints,
# line 1 minus line 2 of Part 7, which the T691 form computes and exports
# (`ca/t691_line_1_minus_line_2_of_part_7`), so the first step totals that export (a form reads
# another form's export only as a record list) and the second applies the rate. The form prints no
# The export is not negative (see the T691 form).
form:
  name: ca-mb/mb428
capabilities:
  - name: core/record_total
    title: "Form T691: line 1 minus line 2 of Part 7"
    reference: "66 (Form T691)"
    unit: ca/cad
    consumes:
      records: ca/t691.t691_line_1_minus_line_2_of_part_7
    produces:
      output: ca-mb/mb428_t691_amount_line_66
  - name: core/apply_rate
    title: "Manitoba additional tax for minimum tax purposes"
    reference: "66"
    unit: ca/cad
    params:
      rate: ca-mb/minimum_tax_rate
    consumes:
      base: ca-mb/mb428_t691_amount_line_66
    produces:
      output: ca-mb/mb428_additional_tax_minimum_tax_line_66
