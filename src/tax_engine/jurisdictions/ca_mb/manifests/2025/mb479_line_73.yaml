# MB479 (2025) line 73, the cultural industries printing tax credit. Form MB479 (CRA 5007-TC): "Line
# 73 and line 61480: Cultural industries printing tax credit (maximum $1,100,000)". No arithmetic is
# printed, so line 73 is an entry line in two steps. The first, core/credit_amount, supplies the
# printed maximum from the `ca-mb/cultural_industries_printing_credit_maximum` dataset; it is not a
# line of the form, so it has no title and no reference. The second, core/at_most, is line 73: the
# entered amount (mb479_line_73_input.yaml) passed on unchanged under the printed title. An entry
# above the printed maximum is refused, not capped. A blank entry passes on as blank.
form:
  name: ca-mb/mb479
capabilities:
  - name: core/credit_amount
    unit: ca/cad
    params:
      amount: ca-mb/cultural_industries_printing_credit_maximum
    produces:
      output: ca-mb/mb479_cultural_industries_printing_credit_maximum
  - name: core/at_most
    title: "Cultural industries printing tax credit"
    reference: "73"
    unit: ca/cad
    consumes:
      amount: ca-mb/mb479_cultural_industries_printing_credit_line_73
      bound: ca-mb/mb479_cultural_industries_printing_credit_maximum
    blank:
      amount: pass_on
    produces:
      output: ca-mb/mb479_cultural_industries_printing_credit_checked_line_73
