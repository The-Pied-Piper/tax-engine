# Schedule MB428-A (CRA 5007-A) 2025, line 10, the sum of lines 1 to 9. Schedule MB428-A: "Line 10:
# Add lines 1 to 9. = ^". Lines 2 to 9 are a block that exists only for blank optional inputs and
# is skipped, so only line 1 (the basic amount, ca-mb/mb428_a_basic_amount_line_1) is summed; a
# single part is still a sum, so the step is built.
form:
  name: ca-mb/mb428_a
capabilities:
  - name: core/sum
    reference: "10"
    unit: ca/cad
    params:
      rounding: ca-mb/cent_rounding
    consumes:
      parts: [ca-mb/mb428_a_basic_amount_line_1]
    produces:
      output: ca-mb/mb428_a_line_10
