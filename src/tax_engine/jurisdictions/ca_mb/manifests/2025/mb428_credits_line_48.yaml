# Form MB428 (CRA 5007-c) line 48: "Line 48: Line 43 minus line 47 (if negative, enter "0") =". Line
# 43 is the amount from T1 line 33099 (mb428_credits_line_43.yaml) and line 47 the lesser
# of the printed ceiling and line 46 (mb428_credits_line_47.yaml). Line 48 is one
# core/subtract_not_below_zero step, rounded half-up to the cent. A request that leaves line 43 blank
# has no medical expenses, so a blank line 43 is read as 0 and line 48 is 0.00. The form prints no
# label for the line, so the step has no title.
form:
  name: ca-mb/mb428_credits
capabilities:
  - name: core/subtract_not_below_zero
    reference: "48"
    unit: ca/cad
    params:
      rounding: ca-mb/cent_rounding
    consumes:
      amount: ca-mb/mb428_medical_expenses_line_43
      less: ca-mb/mb428_medical_expenses_limited_amount_line_47
    blank:
      amount: "0"
    produces:
      output: ca-mb/mb428_medical_expenses_over_limit_line_48
