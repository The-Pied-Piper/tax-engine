# Form MB479 (2025), line 7, the basic credit.
# Form MB479 (CRA 5007-TC): "Line 7: Basic credit 195.00". The form prints no age condition; the Manitoba guide 5007-PC
# (Form MB479, Personal tax credit) does: "If you were under 19 years of age at the end of the year, you can only claim this
# credit if one of the following applies to you: You had a spouse or common-law partner / You were a parent / You can claim
# the Manitoba homeowners affordability tax credit on your 2025 return". The engine models a filer with no spouse, child or
# property, so none of those applies and a filer under 19 gets 0.00. Built as line 8 is:
# 1. core/first_record_count: the T1's "aged 19 or older" flag (`ca/t1_lines_copied_by_provinces.age_19_or_older`, worked out once
#    from the year of birth; blank passes on and is read as 1 by step 3, so a request that leaves the year out claims the credit;
#    not a line of the form).
# 2. core/credit_amount: the printed 195.00, the `ca-mb/personal_tax_credit_basic` dataset; not a line of the form.
# 3. core/times_count: that claim times the flag is line 7: 195.00 when 19 or older, 0.00 when under 19.
form:
  name: ca-mb/mb479
capabilities:
  - name: core/first_record_count
    title: Aged 19 or older at the end of the year
    consumes:
      records: ca/t1_lines_copied_by_provinces.age_19_or_older
    blank:
      records:
        ca/age_19_or_older: pass_on
    produces:
      output: ca-mb/mb479_age_19_or_older
  - name: core/credit_amount
    title: "Basic credit claim"
    unit: ca/cad
    params:
      amount: ca-mb/personal_tax_credit_basic
    produces:
      output: ca-mb/mb479_basic_credit_claim_line_7
  - name: core/times_count
    title: "Basic credit"
    reference: "7"
    unit: ca/cad
    params:
      rounding: ca-mb/cent_rounding
    consumes:
      amount: ca-mb/mb479_basic_credit_claim_line_7
      count: ca-mb/mb479_age_19_or_older
    blank:
      count: "1"
    produces:
      output: ca-mb/mb479_basic_credit_line_7
