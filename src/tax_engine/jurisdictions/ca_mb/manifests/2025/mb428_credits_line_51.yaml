# Form MB428 (CRA 5007-c) line 51: "Line 51 and line 58800: Line 42 plus line 50 = ^". It sums the
# credits subtotal (line 42, `ca-mb/mb428_credits_subtotal_line_42`) and the medical expense amount
# (line 50, `ca-mb/mb428_medical_expenses_line_50`). Lines 43 to 49, the medical expense working,
# are not built: line 50 is an optional input that a salary-only caller leaves out, read as blank
# and then as 0 by the blank rule below. Line 51 is the output `ca-mb/mb428_credits_total_line_51`,
# which is not exported yet.
form:
  name: ca-mb/mb428_credits
capabilities:
  - name: core/sum
    reference: "51"
    unit: ca/cad
    params:
      rounding: ca-mb/cent_rounding
    consumes:
      parts: [ca-mb/mb428_credits_subtotal_line_42, ca-mb/mb428_medical_expenses_line_50]
    blank:
      ca-mb/mb428_medical_expenses_line_50: "0"
    produces:
      output: ca-mb/mb428_credits_total_line_51
