# Form MB479 (2025, CRA 5007-TC) line 16: "Number of dependent children Line 60999 multiplied by
# $26 =". One core/multiply: the number in box A (`ca-mb/mb479_dependent_children_number_line_16`,
# optional input, 0 when left out by its own default) times the printed $26
# (mb479_line_16_amount.yaml), rounded half-up to the cent through ca-mb/cent_rounding. The step
# is box B, the line's output, which line 17 adds. The form names the boxes nothing; "box A" and
# "box B" are the owner's naming.
form:
  name: ca-mb/mb479
capabilities:
  - name: core/multiply
    reference: "16 box B"
    unit: ca/cad
    params:
      rounding: ca-mb/cent_rounding
    consumes:
      multiplicand: ca-mb/mb479_dependent_children_number_line_16
      multiplier: ca-mb/dependent_children_credit_amount_line_16
    produces:
      output: ca-mb/mb479_dependent_children_credit_line_16
