# MB428 (2025) line 66's input, which a salary-only caller does not give.
# Line 66: "Line 66: Form T691: line 1 minus line 2 of Part 7" (Form MB428, CRA 5007-c). Form T691 is
# not built and a salary-only caller has no Form T691 amount, so a request that leaves the line out
# is read as blank; the step that reads line 66 reads that blank as 0.
inputs:
  - name: ca-mb/mb428_t691_amount_line_66
    title: "Form T691: line 1 minus line 2 of Part 7"
    reference: "66 (Form T691)"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 66: Form T691: line 1 minus line 2 of Part 7'
