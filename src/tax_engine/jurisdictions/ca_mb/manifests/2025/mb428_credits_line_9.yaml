# Form MB428 (CRA 5007-C) line 9 "Line 9 and line 58040: Basic personal amount (use Worksheet MB428)".
# Worksheet MB428 (CRA 5007-D) line 9 says to enter its amount on line 58040 of Form MB428, so the one
# step is core/record_total over the worksheet's line 9 export (same as ca-ab/ab428 line 74,
# ab428_line_74.yaml, and mb428_credits_line_19.yaml). Form text read from CRA 5007-C.
form:
  name: ca-mb/mb428_credits
capabilities:
  - name: core/record_total
    title: "Basic personal amount"
    reference: "9"
    unit: ca/cad
    consumes:
      records: ca-mb/worksheet_mb428.worksheet_mb428_basic_personal_amount_line_9
    produces:
      output: ca-mb/mb428_basic_personal_amount_line_9
