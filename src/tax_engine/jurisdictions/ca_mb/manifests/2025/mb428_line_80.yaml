# Form MB428 (CRA 5007-c) line 80: "Line 80: Line 78 minus line 79 (if negative, enter "0") = ^".
# One core/subtract_not_below_zero step: the Manitoba tax (line 78, `ca-mb/mb428_tax_line_78`) less
# the Manitoba employee share purchase tax credit (line 79,
# `ca-mb/mb428_employee_share_purchase_tax_credit_line_79`), not below 0. Line 79 is an optional
# input that a salary-only caller leaves blank, read as blank and then as 0 by the blank rule. The
# form prints no title for the line, so the step has none. The output is
# `ca-mb/mb428_tax_line_80`, which is not exported yet.
form:
  name: ca-mb/mb428
capabilities:
  - name: core/subtract_not_below_zero
    reference: "80"
    unit: ca/cad
    params:
      rounding: ca-mb/cent_rounding
    consumes:
      amount: ca-mb/mb428_tax_line_78
      less: ca-mb/mb428_employee_share_purchase_tax_credit_line_79
    blank:
      less: "0"
    produces:
      output: ca-mb/mb428_tax_line_80
