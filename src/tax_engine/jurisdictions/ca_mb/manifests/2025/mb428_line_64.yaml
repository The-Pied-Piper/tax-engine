# Form MB428 (CRA 5007-c) line 64: "Line 64: Add lines 61 to 63. = ^". The form prints no label and
# no maximum. It sums line 61 (`ca-mb/mb428_non_refundable_credits_line_61`), line 62, the computed
# dividend tax credit worksheet (`ca-mb/mb428_dividend_tax_credit_line_62`, 0.00 for a caller who
# gives no dividends), and line 63 (`ca-mb/mb428_minimum_tax_carryover_line_63`). Every addend is
# always computed, so there is no blank rule. The output is
# `ca-mb/mb428_credits_total_line_64`, which is not exported yet.
form:
  name: ca-mb/mb428
capabilities:
  - name: core/sum
    reference: "64"
    unit: ca/cad
    params:
      rounding: ca-mb/cent_rounding
    consumes:
      parts: [ca-mb/mb428_non_refundable_credits_line_61, ca-mb/mb428_dividend_tax_credit_line_62, ca-mb/mb428_minimum_tax_carryover_line_63]
    produces:
      output: ca-mb/mb428_credits_total_line_64
