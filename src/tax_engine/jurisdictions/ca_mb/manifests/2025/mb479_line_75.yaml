# MB479 (2025) line 75, the community enterprise development tax credit. Form MB479 (CRA 5007-TC):
# "Line 75 and line 61484: Enter your Manitoba community enterprise development tax credit from line
# 4 of Form T1256. (maximum $27,000)". No arithmetic is printed, so line 75 is an entry line in two
# steps. The first, core/credit_amount, supplies the printed maximum from the
# `ca-mb/community_enterprise_development_tax_credit_maximum` dataset; it is not a line of the form,
# so it has no title and no reference. The second, core/at_most, is line 75: the entered amount
# (mb479_line_75_input.yaml) passed on unchanged. The form prints no label, so the step has no
# title. An entry above the printed maximum is refused, not capped. A blank entry passes on as
# blank.
form:
  name: ca-mb/mb479
capabilities:
  - name: core/credit_amount
    unit: ca/cad
    params:
      amount: ca-mb/community_enterprise_development_tax_credit_maximum
    produces:
      output: ca-mb/mb479_community_enterprise_development_tax_credit_maximum
  - name: core/at_most
    reference: "75"
    unit: ca/cad
    consumes:
      amount: ca-mb/mb479_community_enterprise_development_tax_credit_line_75
      bound: ca-mb/mb479_community_enterprise_development_tax_credit_maximum
    blank:
      amount: pass_on
    produces:
      output: ca-mb/mb479_community_enterprise_development_tax_credit_checked_line_75
