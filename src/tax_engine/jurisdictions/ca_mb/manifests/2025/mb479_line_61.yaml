# Form MB479 (Manitoba Credits, 2025, CRA 5007-TC) line 61 (ca-mb/mb479). "Fertility treatment tax
# credit: Line 61: Eligible medical expenses for fertility treatments Line 61268 ^ multiplied by
# 40% (maximum $16,000) = ^". The 40% is a printed rate, held in the
# `ca-mb/fertility_treatment_credit_rate` dataset, and the $16,000 is a printed maximum, held in
# the `ca-mb/fertility_treatment_credit_maximum` dataset. The maximum is printed between
# "multiplied by 40%" and "=", so it bounds the line's result: the expenses multiplied by 40%,
# then at most the maximum. The expenses are an optional input (read as 0 when left out),
# declared by their own part.
form:
  name: ca-mb/mb479
capabilities:
  # Line 61, first operation: "multiplied by 40%", to the cent.
  - name: core/apply_rate
    unit: ca/cad
    params:
      rate: ca-mb/fertility_treatment_credit_rate
    consumes:
      base: ca-mb/mb479_fertility_treatment_expenses_line_61
    blank:
      base: "0"
    produces:
      output: ca-mb/mb479_fertility_treatment_credit_before_maximum_line_61
  # Line 61, second operation: "(maximum $16,000)", at most the printed maximum.
  - name: core/capped_amount
    title: "Fertility treatment tax credit"
    reference: "61"
    unit: ca/cad
    params:
      cap: ca-mb/fertility_treatment_credit_maximum
    consumes:
      base: ca-mb/mb479_fertility_treatment_credit_before_maximum_line_61
    produces:
      output: ca-mb/mb479_fertility_treatment_credit_line_61
