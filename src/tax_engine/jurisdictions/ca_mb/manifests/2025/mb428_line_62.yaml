# MB428 (2025) line 62 "Manitoba dividend tax credit", from the printed Worksheet MB428 (5007-D,
# "Line 61520 - Manitoba dividend tax credit") in six steps: "Line A: Amount from line 12000 of your
# return", "Line 1: Amount from line 12010 of your return Line B multiplied by 0.7835% =", "Line 2:
# Amount A minus amount B Line C = multiplied by 8% =" and the sum of line 1 and line 2, which is
# line 62 of the form. The two amounts are the T1's lines 12000 and 12010: the T1 owns the inputs and
# exports the lines, so the first two steps total those exports (a form reads another form's export
# only as a record list). Each printed rate is held in its own dataset and each product rounds
# half-up to the cent. A caller who gives neither line has a credit of 0.00.
form:
  name: ca-mb/mb428
capabilities:
  - name: core/record_total
    title: "Amount from line 12000 of your return"
    reference: "62 worksheet line A"
    unit: ca/cad
    consumes:
      records: ca/t1_lines_copied_by_provinces.taxable_dividends_line_12000
    produces:
      output: ca-mb/mb428_dividend_tax_credit_worksheet_line_a
  - name: core/record_total
    title: "Amount from line 12010 of your return"
    reference: "62 worksheet line B"
    unit: ca/cad
    consumes:
      records: ca/t1_lines_copied_by_provinces.taxable_dividends_other_than_eligible_line_12010
    produces:
      output: ca-mb/mb428_dividend_tax_credit_worksheet_line_b
  - name: core/apply_rate
    reference: "62 worksheet line 1"
    unit: ca/cad
    params:
      rate: ca-mb/dividend_tax_credit_worksheet_rate_line_1
    consumes:
      base: ca-mb/mb428_dividend_tax_credit_worksheet_line_b
    produces:
      output: ca-mb/mb428_dividend_tax_credit_worksheet_line_1
  - name: core/subtract
    title: "Amount A minus amount B"
    reference: "62 worksheet line C"
    unit: ca/cad
    params:
      rounding: ca-mb/cent_rounding
    consumes:
      amount: ca-mb/mb428_dividend_tax_credit_worksheet_line_a
      less: ca-mb/mb428_dividend_tax_credit_worksheet_line_b
    produces:
      output: ca-mb/mb428_dividend_tax_credit_worksheet_line_c
  - name: core/apply_rate
    reference: "62 worksheet line 2"
    unit: ca/cad
    params:
      rate: ca-mb/dividend_tax_credit_worksheet_rate_line_2
    consumes:
      base: ca-mb/mb428_dividend_tax_credit_worksheet_line_c
    produces:
      output: ca-mb/mb428_dividend_tax_credit_worksheet_line_2
  - name: core/sum
    title: "Manitoba dividend tax credit"
    reference: "62"
    unit: ca/cad
    params:
      rounding: ca-mb/cent_rounding
    consumes:
      parts: [ca-mb/mb428_dividend_tax_credit_worksheet_line_1, ca-mb/mb428_dividend_tax_credit_worksheet_line_2]
    produces:
      output: ca-mb/mb428_dividend_tax_credit_line_62
