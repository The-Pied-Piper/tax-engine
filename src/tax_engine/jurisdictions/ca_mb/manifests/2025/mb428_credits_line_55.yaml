# Form MB428 (CRA 5007-c) line 55 (ca-mb/mb428_credits): "Line 55: Amount from line 14 of your federal
# Schedule 9 multiplied by 17.4% =". The 17.4% is a printed rate, held in the
# `ca-mb/donations_credit_rate_line_55` dataset, so the step is one calculation: 17.4% of the Schedule 9
# amount, rounded half-up to the cent. The amount is an optional input
# (mb428_credits_line_55_inputs.yaml), read as 0 when left out. The line has two boxes: the amount
# (box A, the input) and the multiplied result (box B, this step). The form does not name them; "box
# A" and "box B" are the owner's naming, as on ON428 line 47.
form:
  name: ca-mb/mb428_credits
capabilities:
  - name: core/apply_rate
    reference: "55 box B"
    unit: ca/cad
    params:
      rate: ca-mb/donations_credit_rate_line_55
    consumes:
      base: ca-mb/mb428_donations_amount_line_55
    blank:
      base: "0"
    produces:
      output: ca-mb/mb428_donations_credit_at_rate_line_55
