# Form MB428 (Manitoba Tax and Credits, 2025, CRA 5007-C) line 63 (ca-mb/mb428). "Manitoba minimum
# tax carryover:" / "Line 63 and line 61540: Amount from line 40427 of your return ^ multiplied by
# 50% = ^". The 50% is a printed rate, held in the `ca-mb/minimum_tax_rate` dataset, so line 63 is
# one calculation: 50% of the amount, rounded half-up to the cent. The amount is an optional input
# (read as 0 when left out), declared by its own part.
form:
  name: ca-mb/mb428
capabilities:
  - name: core/apply_rate
    title: "Manitoba minimum tax carryover"
    reference: "63"
    unit: ca/cad
    params:
      rate: ca-mb/minimum_tax_rate
    consumes:
      base: ca-mb/mb428_minimum_tax_carryover_line_63
    blank:
      base: "0"
    produces:
      output: ca-mb/mb428_minimum_tax_carryover_credit_line_63
