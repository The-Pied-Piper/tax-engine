# Form MB428 (CRA 5007-c) lines 45 and 46 (ca-mb/mb428_credits): "Line 45: Applicable rate 3%" and
# "Line 46: Line 44 multiplied by the percentage from line 45 =". Line 45 is a printed rate, held in
# the `ca-mb/medical_expense_rate` dataset and with no step of its own. Line 46 applies it to line 44
# (`ca-mb/mb428_net_income_line_44`), rounded half-up to the cent by the dataset's rule. The form
# prints no label for the line, so the step has no title.
form:
  name: ca-mb/mb428_credits
capabilities:
  - name: core/apply_rate
    reference: "46"
    unit: ca/cad
    params:
      rate: ca-mb/medical_expense_rate
    consumes:
      base: ca-mb/mb428_net_income_line_44
    produces:
      output: ca-mb/mb428_medical_expenses_rate_amount_line_46
