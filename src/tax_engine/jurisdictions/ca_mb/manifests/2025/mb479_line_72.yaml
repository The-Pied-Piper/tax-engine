# Form MB479 (CRA 5007-TC) line 72: "Line 72: Line 70 plus line 71 = ^". The step sums line 70
# (`ca-mb/mb479_credits_line_70`) and the line 71 optional input
# (`ca-mb/mb479_book_publishing_credit_line_71`). A caller who leaves line 71 blank has it read as 0
# by the blank rule. The form prints no label and no maximum for line 72, and the step is untitled.
# The output is `ca-mb/mb479_credits_line_72`.
form:
  name: ca-mb/mb479
capabilities:
  - name: core/sum
    reference: "72"
    unit: ca/cad
    params:
      rounding: ca-mb/cent_rounding
    consumes:
      parts: [ca-mb/mb479_credits_line_70, ca-mb/mb479_book_publishing_credit_line_71]
    blank:
      ca-mb/mb479_book_publishing_credit_line_71: "0"
    produces:
      output: ca-mb/mb479_credits_line_72
