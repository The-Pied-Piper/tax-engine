# Manitoba 2025 take-home manifest: the return's identity and its exports (the refund or balance
# owing, the average income tax rate and the marginal tax rate). The caller gives the gross salary
# and nothing else (the T1 employment income form's line 10100 input). Manitoba's own forms are in
# parts beside this one, so a line ticket adds only its own part file; the federal forms are
# imported by name below, their parts in the `ca` package (`ca/forms/<name>/`).
#
# Manitoba builds seven forms, split so that no form reads another in a loop: `ca-mb/mb428_credits`
# (MB428 lines 1 to 57), `ca-mb/worksheet_mb428` (the basic personal amount section of Worksheet
# MB428), `ca-mb/worksheet_mb428_other_dependants` (its section "Line 58729", lines 1 to 3, one
# instance for each dependant) and `ca-mb/worksheet_mb428_other_dependants_total` (that section's
# line 4), `ca-mb/mb428` (MB428 lines 58 to 82), which supplies `ca/provincial_tax.amount` for T1
# line 42800, `ca-mb/mb428_a` (Schedule MB428-A) and `ca-mb/mb479` (MB479), which supplies
# `ca/provincial_credits.amount` for T1 line 47900.
#
# The default form's export is T1 line 167, refund or balance owing (positive is owing, negative
# is a refund). Manitoba uses the standard federal CPP and EI (no QPP), so Schedule 8 and T2204 are
# imported unchanged. CRA publishes no Manitoba edition of Schedule 6, so the federal Schedule 6 is
# imported unchanged.
#
# Manitoba is listed in `registrations.JURISDICTIONS`: the all-years test composes every listed
# manifest for every year, and this one is complete, MB428 line 82 supplying
# `ca/provincial_tax.amount` for T1 and MB479 line 81 supplying
# `ca/provincial_credits.amount`.
jurisdiction: CA-MB
version: 1
valid_from_tax_year: 2025
# The title is the engine's own wording for the default form, not a printed form heading.
title: Return summary
outputs:
  - ca/refund_or_balance_owing
  - ca-mb/average_tax_rate
  - ca-mb/marginal_tax_rate
capabilities: []
# Where the take-home answer reads its figures (the caller gives the salary and nothing else): the
# income tax is T1 line 43500, CPP and EI come from their own forms, and the rates are this return's.
take_home:
  salary: ca/employment_income
  income_tax: {form: ca/t1_tax_and_credits, kind: ca/total_payable}
  deductions:
    cpp_base: {form: ca/schedule_8, kind: ca/schedule_8_cpp_base_contributions_on_return}
    cpp_enhanced: {form: ca/schedule_8, kind: ca/cpp_part_3_line_12}
    cpp2: {form: ca/schedule_8, kind: ca/cpp_part_3_line_22}
    ei: {form: ca/t2204, kind: ca/t2204_line_16}
  average_tax_rate: {form: ca-mb/return, kind: ca-mb/average_tax_rate}
  marginal_tax_rate: {form: ca-mb/return, kind: ca-mb/marginal_tax_rate}
imports:
  - ca/t1_employment_income
  - ca/t1_taxable_income
  - ca/t1_tax_and_credits
  - ca/t1_lines_copied_by_provinces
  - ca/schedule_6
  - ca/schedule_8
  - ca/schedule_9
  - ca/t2204
  - ca/take_home_average_rate
  - ca/t691
