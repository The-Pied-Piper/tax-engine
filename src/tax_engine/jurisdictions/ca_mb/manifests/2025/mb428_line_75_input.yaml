# MB428 (2025) line 75's input, which a salary-only caller does not give.
# Line 75: "Line 75 and line 60830: Manitoba community enterprise development tax credit (complete Form T1256)"
# (Form MB428, CRA 5007-c). Form T1256 is not built, so a request that leaves the line out is read as
# blank; the step that reads line 75 reads that blank as 0.
inputs:
  - name: ca-mb/mb428_community_enterprise_development_tax_credit_line_75
    title: "Manitoba community enterprise development tax credit"
    reference: "75"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 75 and line 60830: Manitoba community enterprise development tax credit (complete Form T1256)'
