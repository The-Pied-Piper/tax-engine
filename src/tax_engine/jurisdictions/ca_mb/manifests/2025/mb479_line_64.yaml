# Form MB479 (CRA 5007-TC) line 64: "Line 64: Line 62 plus line 63 = ^". The step sums line 62
# (`ca-mb/mb479_credits_line_62`) and the line 63 optional input
# (`ca-mb/mb479_paid_work_experience_credit_line_63`). A caller who leaves line 63 blank has it read
# as 0 by the blank rule. The form prints no label and no maximum for line 64, and the step is
# untitled. The output is `ca-mb/mb479_credits_line_64`.
form:
  name: ca-mb/mb479
capabilities:
  - name: core/sum
    reference: "64"
    unit: ca/cad
    params:
      rounding: ca-mb/cent_rounding
    consumes:
      parts: [ca-mb/mb479_credits_line_62, ca-mb/mb479_paid_work_experience_credit_line_63]
    blank:
      ca-mb/mb479_paid_work_experience_credit_line_63: "0"
    produces:
      output: ca-mb/mb479_credits_line_64
