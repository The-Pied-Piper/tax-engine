# Form MB428 (CRA 5007-c) line 72: "Line 72: Line 70 minus line 71 (if negative, enter "0") = ^".
# One core/subtract_not_below_zero step: the Manitoba tax (line 70, `ca-mb/mb428_tax_line_70`) less
# the labour-sponsored funds tax credit (line 71,
# `ca-mb/mb428_labour_sponsored_funds_credit_line_71`), not below 0. Line 71 is an optional input
# that a salary-only caller leaves blank, read as blank and then as 0 by the blank rule. The form
# prints no title for the line, so the step has none. The output is `ca-mb/mb428_tax_line_72`,
# which is not exported yet.
form:
  name: ca-mb/mb428
capabilities:
  - name: core/subtract_not_below_zero
    reference: "72"
    unit: ca/cad
    params:
      rounding: ca-mb/cent_rounding
    consumes:
      amount: ca-mb/mb428_tax_line_70
      less: ca-mb/mb428_labour_sponsored_funds_credit_line_71
    blank:
      less: "0"
    produces:
      output: ca-mb/mb428_tax_line_72
