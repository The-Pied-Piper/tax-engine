# Ontario LIFT family income threshold, 2025 tax year (Schedule ON428-A, form 5006-A),
# Part B: line 36 "Family income threshold 65,0000.00", from which line 37 "Line 35 minus
# line 36 (if negative, enter "0")" takes line 35 "Line 33 plus line 34 Adjusted family
# net income". The form's text prints "65,0000.00", a typo; the threshold is 65,000.00.
# It borrows the credit kind because it is a printed amount taken whole.
# Line 36 is a dollars-and-cents box, so the amount rounds half-up to the cent, the
# owner's decision, as the form states no rounding rule.
family: ca-on/lift_family_income_threshold
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-a/5006-a-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "65000.00"
