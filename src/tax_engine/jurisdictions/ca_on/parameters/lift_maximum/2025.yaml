# Ontario LIFT credit maximum, 2025 tax year (Schedule ON428-A, form 5006-A): line 5
# "Line 3 multiplied by the percentage from line 4 (maximum $875)" and Part A line 14
# "Amount from line 5 above (maximum $875)". One cap serves both lines.
# Lines 5 and 14 are dollars-and-cents boxes, so the capped amount rounds half-up to the
# cent, the owner's decision, as the form states no rounding rule.
family: ca-on/lift_maximum
tax_year: 2025
kind: amount
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-a/5006-a-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "875"
