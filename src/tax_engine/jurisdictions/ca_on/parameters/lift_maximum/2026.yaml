# Provisional: indexed from the 2025 form text by T4127's Ontario index rate; to be confirmed against the 2026 form text when CRA publishes it.
# Derivation: the 2025 maximum of 875 indexed by Ontario's 1.9% index rate from T4127 Table 8.2, rounded to
# the nearest dollar: 875 x 1.019 = 891.625, giving 892. This is the least certain figure in the ca-on set:
# LIFT is not mentioned in T4127, so the value is unconfirmed until the 2026 form text is published.
# Ontario LIFT credit maximum, 2026 tax year (Schedule ON428-A, form 5006-A): line 5 "Line 3 multiplied by
# the percentage from line 4 (maximum $892)" and Part A line 14 "Amount from line 5 above (maximum $892)".
# One cap serves both lines. Lines 5 and 14 are dollars-and-cents boxes, so the capped amount rounds
# half-up to the cent, the project's choice, as the form states no rounding rule.
family: ca-on/lift_maximum
tax_year: 2026
kind: amount
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pub/t4127-jan/t4127-01-26e.pdf
rounding: {increment: "0.01", mode: half_up}
amount: "892"
