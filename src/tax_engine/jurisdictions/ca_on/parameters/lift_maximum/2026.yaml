# Provisional: taken from the 2025 form text named in sources; to be confirmed against the 2026 form text when CRA publishes it.
# Derivation: carried forward unchanged from the 2025 file; LIFT is not indexed, so the 2025 figure is kept rather than raised by 1.9%.
# Ontario's LIFT figures have been the same since the 2022 enhancement (maximum 875, reduction from 32,500) while other Ontario
# credit amounts were indexed (https://www.ontario.ca/page/low-income-individuals-and-families-tax-credit), and the fall 2025
# budget lists LIFT with fixed figures and not among the 2025 indexed amounts
# (https://www.budget.ontario.ca/2025/fallstatement/provisions.html). T4127 does not mention LIFT.
# Ontario LIFT credit maximum, 2026 tax year (Schedule ON428-A, form 5006-A): line 5 "Line 3 multiplied by
# the percentage from line 4 (maximum $875)" and Part A line 14 "Amount from line 5 above (maximum $875)".
# One cap serves both lines. Lines 5 and 14 are dollars-and-cents boxes, so the capped amount rounds
# half-up to the cent, the project's choice, as the form states no rounding rule.
family: ca-on/lift_maximum
tax_year: 2026
kind: amount
title: "maximum"
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-a/5006-a-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "875"
