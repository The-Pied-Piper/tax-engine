# Ontario marginal rate, EI rate on the take-home basis, 2025 tax year (Form T2204, Employee Overpayment of
# Employment Insurance Premiums, 2025 text). The take-home EI is line 16 "Enter whichever amount is the least: line 7,
# line 9 or line 12", entered on line 31200 of the return. Line 7 is "Amount from line 3 – $2,000 = (if negative, enter
# "0")", line 3 is "Line 1 plus line 2 (maximum $65,700)" and line 12 is the line 10 amount, "Amount from line 1 × 1.64%
# = (maximum $1,077.48)". So line 16 is 0 up to a salary of $2,000, rises 1 for 1 with line 7 (a 100% band) until line 12 is
# the least, then follows line 12: 1.64% of the salary up to the maximum insurable earnings of $65,700, and
# nothing above. Note (3) prints "less than $2,033", the salary where line 7 and line 12 meet to the dollar (line 7
# equals line 12 at $2,000 / (1 - 0.0164), about $2,033.3), so the 100% band ends at the printed $2,033 (the
# form's cents are not modelled: between $2,033 and $2,033.35 the rate is off by the band's width times the
# difference). The base is the salary (T1 line 10100); no rounding.
family: ca-on/marginal_ei_rate_rows
tax_year: 2025
kind: amount_by_band
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2204/t2204-25e.pdf
rounding: none
rows:
  - {over: "0", amount: "0"}
  - {over: "2000", minus: "2000", rate: "1", plus: "0"}
  - {over: "2033", minus: "2033", rate: "0.0164", plus: "0"}
  - {over: "65700", amount: "0"}
