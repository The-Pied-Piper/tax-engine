# Provisional: taken from T4127 (Jan 2026); to be confirmed against the 2026 form text when CRA publishes it.
# Derivation: the rate of `ca-on/credit_rate` for 2026, unrounded.
# Ontario marginal rate, Ontario credit rate, 2026 tax year (Form ON428 line 45 "Ontario non-refundable tax credit
# rate 5.05%", the lowest rate V in T4127 Table 8.1 (Ontario)): the rate at which the CPP base contribution (line 19, from line 30800 of the return) and the
# EI premium (line 21, from line 31200) lower the Ontario tax. `ca-on/credit_rate` holds the same rate and rounds its
# product to the cent, a rule that would round a marginal rate away, so this dataset rounds nothing.
family: ca-on/marginal_ontario_credit_rate
tax_year: 2026
kind: rate
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pub/t4127-jan/t4127-01-26e.pdf
rounding: none
rate: "0.0505"
