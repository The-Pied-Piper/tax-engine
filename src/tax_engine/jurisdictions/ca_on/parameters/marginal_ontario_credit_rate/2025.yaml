# Ontario marginal rate, Ontario credit rate, 2025 tax year (Form ON428 line 45 "Ontario non-refundable tax credit
# rate 5.05%"): the rate at which the CPP base contribution (line 19, from line 30800 of the return) and the
# EI premium (line 21, from line 31200) lower the Ontario tax. `ca-on/credit_rate` holds the same rate and rounds its
# product to the cent, a rule that would round a marginal rate away, so this dataset rounds nothing.
family: ca-on/marginal_ontario_credit_rate
tax_year: 2025
kind: rate
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-c/5006-c-25e.txt
rounding: none
rate: "0.0505"
