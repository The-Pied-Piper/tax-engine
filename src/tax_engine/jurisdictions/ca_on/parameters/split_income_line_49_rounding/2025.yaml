# Rounding of the Ontario foreign tax credit on split income, 2025 tax year (Form T1206 Part 3
# line 49): "Part of the amount from line 68370 on page 8 that is non-business income" over "Part
# of the amount from line 68380 on page 8 that is non-business income", "× Amount from line number
# of your Form 428 shown in column 7 in Chart C on page 5". The form prints no figure and no
# rounding rule; line 49 is a dollars-and-cents box, so the product over the quotient rounds
# half-up to the cent once, as the owner decided for the other foreign tax credit lines. Line 47
# and ON428 line 82 take amounts already in cents.
family: ca-on/split_income_line_49_rounding
tax_year: 2025
kind: rounding_only
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t1206/t1206-25e.pdf
rounding: {increment: "0.01", mode: half_up}
