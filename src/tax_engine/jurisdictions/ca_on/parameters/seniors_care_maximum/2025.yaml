# Ontario seniors care at home tax credit maximum, 2025 tax year (Form ON479, form 5006-TC): line
# 5 "Line 3 multiplied by the percentage from line 4 (maximum $1,500) =". The maximum is printed
# after the percentage, so it caps the result.
# Line 5 is a dollars-and-cents box, so the capped amount rounds half-up to the cent, the owner's
# decision, as the form states no rounding rule.
family: ca-on/seniors_care_maximum
tax_year: 2025
kind: amount
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-tc/5006-tc-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "1500"
