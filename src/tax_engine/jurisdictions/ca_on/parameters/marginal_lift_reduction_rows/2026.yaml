# Provisional: carried forward from the 2025 form; T4127 (Jan 2026) does not mention LIFT.
# Derivation: carried forward unchanged from the 2025 file; LIFT is not indexed (see `ca-on/lift_maximum` for 2026).
# Ontario marginal rate, LIFT reduction rate, 2026 tax year (Schedule ON428-A, form 5006-A), Part A: line 19 "Line 17
# multiplied by the percentage from line 18", with line 18 "Applicable rate 5%", is taken off line 14 "Amount from
# line 5 above (maximum $875)". The base is line 19. While the reduction is above 0.00 and not over the credit's
# maximum $875 (line 20 is then above 0), a further dollar of net income takes 5% of a dollar off the credit; over
# $875 the credit is 0 and the rate is 0. No rounding. The first band ends at 0.005 so that no cent amount but
# 0.00 is in it.
family: ca-on/marginal_lift_reduction_rows
tax_year: 2026
kind: amount_by_band
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-a/5006-a-25e.txt
rounding: none
rows:
  - {over: "0", amount: "0"}
  - {over: "0.005", minus: "0.005", rate: "0.05", plus: "0"}
  - {over: "875", amount: "0"}
