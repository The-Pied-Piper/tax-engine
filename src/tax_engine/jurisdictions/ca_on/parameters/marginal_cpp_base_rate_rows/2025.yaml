# Ontario marginal rate, CPP base contribution rate, 2025 tax year, Schedule 8 (form 5000-S8): Part 3 line 11 "amount from line 7
# multiplied by 4.95%", where line 7 is "Line 5 minus line 6" and line 6 is "Amount from line E of Part 2" (the
# maximum basic exemption, $3,500; line B of Part 2 is the maximum pensionable earnings, $71,300). So a further dollar
# of salary adds 4.95% of a dollar of CPP base contribution above $3,500 and up to $71,300, and nothing outside it.
# The base is the salary (T1 line 10100) and the rate is the band's `rate`, as the health premium slope is
# (`ca-on/health_premium_rows`); a band with no `rate` gives 0. No rounding.
family: ca-on/marginal_cpp_base_rate_rows
tax_year: 2025
kind: amount_by_band
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s8/5000-s8-25e.txt
rounding: none
rows:
  - {over: "0", amount: "0"}
  - {over: "3500", minus: "3500", rate: "0.0495", plus: "0"}
  - {over: "71300", amount: "0"}
