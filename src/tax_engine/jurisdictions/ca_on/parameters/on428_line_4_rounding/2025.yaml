# Form ON428 (Ontario Tax, 2025, 5006-c-25e) line 4: the taxable income over the column's lower
# bound, line 2 minus line 3. The line is a dollars-and-cents box, so the difference rounds
# half-up to the cent. The form states no rounding rule, so this is the owner's decision.
family: ca-on/on428_line_4_rounding
tax_year: 2025
kind: rounding_only
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-c/5006-c-25e.txt
rounding: {increment: "0.01", mode: half_up}
