# Largest pension income amount transferred from a spouse, 2025 tax year (Schedule ON(S2), form
# 5006-S2): line 2 and line 59050 "Enter the amount from line 58360 of their Form ON428.
# (maximum $1,762)", the maximum printed on the spouse's Form ON428 line 58360 as well (form 5006-C
# line 27, "Pension income amount (maximum $1,762)"). An amount above it is an input error, not
# capped. It borrows the credit kind because it is claimed whole, as the age maximum is.
# It is a dollars-and-cents box, so the amount rounds half-up to the cent, the owner's decision,
# as the form states no rounding rule.
family: ca-on/spouse_return_ontario_pension_income_amount_maximum
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-s2/5006-s2-25e.txt
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-c/5006-c-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "1762.00"
