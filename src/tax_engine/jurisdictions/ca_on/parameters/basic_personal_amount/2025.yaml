# Ontario basic personal amount, 2025 tax year (Form ON428 line 58040). Not
# income-tested. The credit rate that turns it into tax relief is its own
# dataset, ca-on/credit_rate.
# Line 58040 is a dollars-and-cents box, so the amount rounds half-up to the cent, the
# owner's decision, as the form states no rounding rule.
family: ca-on/basic_personal_amount
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-c/5006-c-25e.pdf
  - https://www.canada.ca/en/revenue-agency/services/forms-publications/payroll/payroll-deductions-t4127-payroll-deductions-formulas/t4127-jul-121st-edition-effective-july-1-2025/t4127-jul-payroll-deductions-formulas.html
rounding: {increment: "0.01", mode: half_up}
amount: "12747"
