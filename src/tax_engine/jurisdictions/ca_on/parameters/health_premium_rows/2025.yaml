# Ontario health premium rows, 2025 tax year (Form ON428, form 5006-C): line 89 "Ontario health
# premium (complete the chart below)", on the chart's line 1 "Enter your taxable income from line
# 26000 of your return". The chart is read row by row as printed: a row is either a flat amount
# (`amount`), or a sloped figure (`minus`, `rate` and `plus`: (income minus `minus`) x `rate` plus
# `plus`), and each row starts above its `over`. The chart's "$20,000 or less" row is the first row,
# from 0. The rows are not tiers with maxima: each row is the chart's own figure, never a
# difference of plateaus.
# Line 89 is a dollars-and-cents box, so the premium rounds half-up to the cent, the owner's
# decision, as the chart states no rounding rule.
family: ca-on/health_premium_rows
tax_year: 2025
kind: amount_by_band
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-c/5006-c-25e.txt
rounding: {increment: "0.01", mode: half_up}
rows:
  - {over: "0", amount: "0"}
  - {over: "20000", minus: "20000", rate: "0.06", plus: "0"}
  - {over: "25000", amount: "300"}
  - {over: "36000", minus: "36000", rate: "0.06", plus: "300"}
  - {over: "38500", amount: "450"}
  - {over: "48000", minus: "48000", rate: "0.25", plus: "450"}
  - {over: "48600", amount: "600"}
  - {over: "72000", minus: "72000", rate: "0.25", plus: "600"}
  - {over: "72600", amount: "750"}
  - {over: "200000", minus: "200000", rate: "0.25", plus: "750"}
  - {over: "200600", amount: "900"}
