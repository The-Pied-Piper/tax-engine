# Ontario tax reduction, basic reduction, 2025 tax year (Form ON428, form 5006-C):
# line 74 "Basic reduction 294.00", the first part of line 77 "Add lines 74 to 76.".
# It borrows the credit kind because it is claimed whole, as the basic personal
# amount is.
# Line 74 is a dollars-and-cents box, so the amount rounds half-up to the cent, the
# owner's decision, as the form states no rounding rule.
family: ca-on/tax_reduction_basic
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-c/5006-c-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "294.00"
