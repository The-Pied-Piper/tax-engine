# Ontario medical expenses threshold ceiling, 2025 tax year (Form ON428, form 5006-C):
# line 40 "Enter whichever is less: $2,885 or the amount on line 39." It is a plain cap on
# the share of the net income that line 41 takes off the filer's own medical expenses.
# Line 40 is a dollars-and-cents box, so the lesser rounds half-up to the cent, the
# owner's decision, as the form states no rounding rule.
family: ca-on/medical_threshold_ceiling
tax_year: 2025
kind: amount
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-c/5006-c-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "2885"
