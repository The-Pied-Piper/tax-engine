# Ontario LIFT credit rate, 2025 tax year (Schedule ON428-A, form 5006-A): line 4
# "Applicable rate 5.05%", applied by line 5 "Line 3 multiplied by the percentage from
# line 4 (maximum $875)" to line 3 "Line 1 plus line 2", line 1 "Amount from line 10100
# of your return".
# Line 5 is a dollars-and-cents box, so the product rounds half-up to the cent, the
# owner's decision, as the form states no rounding rule.
family: ca-on/lift_rate
tax_year: 2025
kind: rate
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-a/5006-a-25e.txt
rounding: {increment: "0.01", mode: half_up}
rate: "0.0505"
