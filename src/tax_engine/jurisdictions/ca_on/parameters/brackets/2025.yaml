# Ontario income tax brackets, 2025 tax year (Form ON428, form 5006-C, Part A "Ontario
# tax on taxable income", lines 1-8).
# Line 1 "Enter your taxable income from line 26000 of your return." Column headings:
# "Line 1 is $52,886 or less"; "Line 1 is more than $52,886 but not more than
# $105,775"; "... more than $105,775 but not more than $150,000"; "... more than
# $150,000 but not more than $220,000"; "Line 1 is more than $220,000". In every
# column: line 2 "Amount from line 1"; line 3 the column's lower bound (0.00,
# 52,886.00, 105,775.00, 150,000.00, 220,000.00); line 4 "Line 2 minus line 3 (cannot
# be negative)"; line 5 "Rate" (5.05%, 9.15%, 11.16%, 12.16%, 13.16%); line 6 "Line 4
# multiplied by the percentage from line 5"; line 7 the printed constant (0.00,
# 2,670.74, 7,510.09, 12,445.60, 20,957.60); line 8 "Line 6 plus line 7 Ontario tax on
# taxable income".
# The form prints each line 7 constant in dollars and cents, and each is the exact tax
# on the brackets below at the line 5 rates rounded half-up to the cent (7,510.09 for
# the exact 7,510.0865), so the tax at each bracket's start rounds half-up to the cent.
# Line 8 is a dollars-and-cents box, so the column's tax rounds half-up to the cent, the
# owner's decision, as the form states no rounding rule; line 6 is not rounded on its
# own, line 4 takes amounts already in cents, and line 7 is already in cents.
family: ca-on/brackets
tax_year: 2025
kind: brackets
sources:
  - https://www.canada.ca/en/revenue-agency/services/tax/individuals/tax-rates-brackets/last-year.html
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-c/5006-c-25e.txt
  - https://data.ontario.ca/en/dataset/personal-income-tax-rates-and-credits/resource/60f84727-7e12-4fd4-ba06-30955d31b2ae
rounding: {increment: "0.01", mode: half_up}
tax_at_start_rounding: {increment: "0.01", mode: half_up}
brackets:
  - {from: "0", rate: "0.0505"}
  - {from: "52886", rate: "0.0915"}
  - {from: "105775", rate: "0.1116"}
  - {from: "150000", rate: "0.1216"}
  - {from: "220000", rate: "0.1316"}
