# Maximum amount for the Ontario disability amount for self, 2025 tax year (Worksheet ON428,
# form 5006-D): "Line 58440 - Disability amount for self", line 2 "Maximum amount 6,007.00". Line 6
# of the worksheet is this maximum less the care expenses over the threshold.
# Line 2 is a dollars-and-cents box, so the amount rounds half-up to the cent, the owner's
# decision, as the form states no rounding rule.
family: ca-on/disability_self_supplement_maximum
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-d/5006-d-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "6007.00"
