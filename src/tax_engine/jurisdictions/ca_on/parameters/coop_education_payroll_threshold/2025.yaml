# Ontario co-operative education tax credit payroll threshold, 2025 tax year (Worksheet ON479
# (form 5006-D1), "Line 20 - Ontario co-operative education tax credit"): line 5 "400,000.00",
# taken off line 4, the total salaries and wages paid in the 2024 taxation year. Every figure sits
# in a dollars-and-cents box, so the dataset carries the half-up cent rule, the owner's decision,
# as the form states no rounding rule.
family: ca-on/coop_education_payroll_threshold
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-d1/5006-d1-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "400000.00"
