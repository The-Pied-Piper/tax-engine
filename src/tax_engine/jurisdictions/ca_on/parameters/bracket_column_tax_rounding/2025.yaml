# Ontario bracket column tax rounding, 2025 tax year (Form ON428, form 5006-C): line 6 "Line 4
# multiplied by the percentage from line 5 =". Line 6 is a dollars-and-cents box, so the product
# rounds half-up to the cent. The form states no rounding rule, so this is the owner's decision.
# `ca-on/brackets` has no rounding rule: line 7 is in whole cents, so line 8 is already in cents.
family: ca-on/bracket_column_tax_rounding
tax_year: 2025
kind: rounding_only
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-c/5006-c-25e.txt
rounding: {increment: "0.01", mode: half_up}
