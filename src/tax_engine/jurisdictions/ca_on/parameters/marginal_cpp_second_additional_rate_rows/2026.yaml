# Provisional: taken from T4127 (Jan 2026); to be confirmed against the 2026 form text when CRA publishes it.
# Derivation: the 2025 form's layout (Schedule 8, form 5000-S8) with the 2026 maximum pensionable earnings $74,600.00 and additional maximum pensionable earnings $85,000.00 of T4127 (Jan 2026) Table 8.3; the basic exemption $3,500 and the rates are those of the 2025 form.
# Ontario marginal rate, CPP second additional contribution rate, 2026 tax year, Schedule 8 (form 5000-S8, 2025 text; the 2026 maxima from T4127): Part 3 line 22 "amount
# from line 4 multiplied by 4%", where line 4 is "Line 2 minus line 3" (line 3 is "Amount from line B of Part 2"): the
# earnings above the maximum pensionable earnings ($74,600) and up to line D of Part 2, the additional maximum
# pensionable earnings ($85,000). So a further dollar of salary adds 4% of a dollar there and nothing outside it. The same
# 4% is what T1 line 22215 (Schedule 8 line 28) takes off the income. The base is the salary (T1 line 10100); no
# rounding.
