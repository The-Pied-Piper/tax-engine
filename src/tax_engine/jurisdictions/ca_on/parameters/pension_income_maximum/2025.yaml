# Ontario pension income amount maximum, 2025 tax year (Form ON428, form 5006-C), line 27 and
# line 58360 "Pension income amount (maximum $1,762)": the maximum is printed on the line, so it
# caps the amount on the federal line 31400 that the Ontario amount is the lesser of.
# It is a dollars-and-cents box, so the amount rounds half-up to the cent, the owner's
# decision, as the form states no rounding rule.
family: ca-on/pension_income_maximum
tax_year: 2025
kind: amount
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-c/5006-c-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "1762"
