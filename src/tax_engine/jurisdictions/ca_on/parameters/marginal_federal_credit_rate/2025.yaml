# Ontario marginal rate, federal credit rate, 2025 tax year (T1 form 5006-R line 114 "Federal non-refundable tax
# credit rate 14.5%"): the rate at which the CPP base contribution (line 30800) and the EI premium (line 31200) lower
# the federal tax, and at which the phase-down of the basic personal amount raises it. `ca/credit_rate` holds the same
# rate and rounds its product to the cent, a rule that would round a marginal rate away, so this dataset rounds
# nothing.
family: ca-on/marginal_federal_credit_rate
tax_year: 2025
kind: rate
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-r/5006-r-25e.txt
rounding: none
rate: "0.145"
