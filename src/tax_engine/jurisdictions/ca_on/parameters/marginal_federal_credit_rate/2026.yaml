# Provisional: taken from T4127 (Jan 2026); to be confirmed against the 2026 form text when CRA publishes it.
# Derivation: the rate of `ca/credit_rate` for 2026, unrounded.
# Ontario marginal rate, federal credit rate, 2026 tax year: 14%, T4127 (122nd edition, effective January 1, 2026):
# "For 2026 and subsequent tax years, the lowest federal tax bracket will be 14%." The rate at which the CPP base
# contribution and the EI premium lower the federal tax, and at which the phase-down of the basic personal amount
# raises it. `ca/credit_rate` holds the same rate and rounds its product to the cent, a rule that would round a
# marginal rate away, so this dataset rounds nothing.
family: ca-on/marginal_federal_credit_rate
tax_year: 2026
kind: rate
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pub/t4127-jan/t4127-01-26e.pdf
rounding: none
rate: "0.14"
