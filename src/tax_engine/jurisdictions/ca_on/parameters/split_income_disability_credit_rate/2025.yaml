# Ontario disability tax credit rate on split income, 2025 tax year (Form T1206 Part 3, line 38):
# line 36 "Line 34 plus line 35" "Tax rate that applies to your province or territory from column 3
# in Chart C on page 5" (line 37, Ontario's low tax rate 5.05%), "Amount from line 36 multiplied by
# the tax rate you entered on line 37", under "Provincial or territorial disability tax credit
# (DTC)". It is T1206's own dataset beside the Ontario credit rate of Form ON428. Line 38 is a
# dollars-and-cents box, so the product rounds half-up to the cent, the owner's decision, as the
# form states no rounding rule.
family: ca-on/split_income_disability_credit_rate
tax_year: 2025
kind: rate
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t1206/t1206-25e.pdf
rounding: {increment: "0.01", mode: half_up}
