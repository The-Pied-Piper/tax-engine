# Maximum for the Ontario disability amount transferred from a dependant, 2025 tax year
# (Worksheet ON428, form 5006-D): "Line 58480 - Disability amount transferred from a
# dependant", line 7 "Line 1 plus line 6 (maximum $16,305)". It is a plain cap on the base
# plus the amount for a dependant under 18.
# Line 12 is a dollars-and-cents box, so each dependant's allowable amount rounds half-up to
# the cent, as the form states no rounding rule.
family: ca-on/disability_transfer_maximum
tax_year: 2025
kind: amount
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-d/5006-d-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "16305"
