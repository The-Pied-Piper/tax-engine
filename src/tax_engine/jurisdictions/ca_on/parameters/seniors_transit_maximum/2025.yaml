# Ontario seniors' public transit tax credit maximum, 2025 tax year (Form ON479, form 5006-TC):
# line 14 "Amount paid in the year for eligible seniors' use of Ontario public transit services
# (maximum $3,000) Line 63100 multiplied by 15% =". The maximum is printed before the
# percentage, so it bounds the amount paid.
# Line 14 is a dollars-and-cents box, so the amount rounds half-up to the cent, the
# owner's decision, as the form states no rounding rule.
family: ca-on/seniors_transit_maximum
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-tc/5006-tc-25e.txt
rounding: {increment: "0.01", mode: half_up}
amount: "3000"
