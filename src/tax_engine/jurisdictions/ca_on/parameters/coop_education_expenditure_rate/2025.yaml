# "Amount of eligible expenditures (Note 1) incurred in 2025 Line A multiplied by 25% =". Line 1
# is left exact by the capability that reads it; the rule is the dataset's, as the form states no
# rounding rule.
family: ca-on/coop_education_expenditure_rate
tax_year: 2025
kind: rate
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-d1/5006-d1-25e.txt
rounding: {increment: "0.01", mode: half_up}
rate: "0.25"
