# Schedule 6 (Canada workers benefit, 5000-S6) 2025. This part names the form and its exports; each
# line's capability goes in a part of its own with the same `form.name`. The engine refuses a form
# that no part gives exports, so the list holds the lines built so far: line 1
# (`ca/cwb_employment_income`), line 5 (`ca/working_income`), line 6
# (`ca/cwb_family_working_income`), line 7 (`ca/cwb_net_income_line_7`), line 10
# (`ca/cwb_family_net_income_line_10`, "Add lines 7 to 9.", the sum of line 7 alone for the
# take-home filer), line 12 (`ca/cwb_family_net_income_line_12`, "Line 10 minus line 11"), line 13
# (`ca/cwb_family_net_income_line_13`, "Add the amounts from line 12", column 1 alone), line 15
# (`ca/adjusted_family_net_income`, "Line 13 minus line 14", line 14 blank as 0), line 17
# (`ca/cwb_base_amount`), line 18 (`ca/cwb_working_income_over_base_amount`, "Line 16 minus line
# 17", floored at zero), line 20 (`ca/cwb_working_income_rate_line_20`, line 18 times the 27% of
# line 19), line 22 (`ca/cwb_basic_benefit_line_22`, "Enter whichever is less: amount from line
# 20 or line 21", the lesser of lines 20 and 21), line 25 (`ca/cwb_net_income_over_base_amount`,
# "Line 23 minus line 24", floored at zero) and line 27 (`ca/cwb_reduction_line_27`, line 25 times
# the 15% of line 26). The export that matters is line 28, the figure T1 line 45300 reads; it will
# replace this list.
form:
  name: ca/schedule_6
  required: true
  exports:
    - ca/cwb_employment_income
    - ca/working_income
    - ca/cwb_family_working_income
    - ca/cwb_net_income_line_7
    - ca/cwb_family_net_income_line_10
    - ca/cwb_family_net_income_line_12
    - ca/cwb_family_net_income_line_13
    - ca/adjusted_family_net_income
    - ca/cwb_base_amount
    - ca/cwb_working_income_over_base_amount
    - ca/cwb_working_income_rate_line_20
    - ca/cwb_maximum
    - ca/cwb_basic_benefit_line_22
    - ca/cwb_reduction_threshold
    - ca/cwb_net_income_over_base_amount
    - ca/cwb_reduction_line_27
capabilities: []
