# ON428 (2025) line 31: "Line 31: Add lines 28 to 30." (CRA 5006-c-25e). Lines 29 and 30 are the
# disability amounts, left out here, so the line is one core/sum over line 28 alone
# (`ca-on/on428_credits_with_pension_line_28`), a starting input. The sum of one part reads it back
# unchanged, the trace recording the step.
form:
  name: ca-on/on428
capabilities:
  - name: core/sum
    reference: "31"
    params:
      rounding: ca-on/cent_rounding
    consumes:
      parts: [ca-on/on428_credits_with_pension_line_28]
    produces:
      output: ca-on/on428_credits_with_disability_line_31
