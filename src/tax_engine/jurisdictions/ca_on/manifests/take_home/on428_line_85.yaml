# Form ON428 (Ontario Tax, 2025, 5006-c-25e) line 85, "Line 85 and line 62140: Low-income individuals
# and families tax (LIFT) credit (complete Schedule ON428-A)". The LIFT credit is computed on
# Schedule ON428-A, which arrives as a record list (`ca-on/on428_a.lift_credit_single`, the export
# `ca-on/lift_credit_single` of Part A line 20), so the one step is core/record_total over those
# records (same as on428_line_21.yaml and on428_line_19.yaml). The output is the line 85 kind,
# `ca-on/on428_lift_credit_line_85`, which line 86 reads.
form:
  name: ca-on/on428
capabilities:
  - name: core/record_total
    title: "Low-income individuals and families tax (LIFT) credit"
    consumes:
      records: ca-on/on428_a.lift_credit_single
    produces:
      output: ca-on/on428_lift_credit_line_85
