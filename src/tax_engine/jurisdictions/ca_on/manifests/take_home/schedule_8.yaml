# Schedule 8 (CPP contributions), form 5000-S8, Part 3. This part names the form and its exports;
# each line's capability goes in a part of its own with the same `form.name`.
# Exports: the base contributions for T1 line 30800 and ON428 line 58240, and the deduction for
# the enhanced contributions for T1 line 22215. The form prints them on Part 3a lines 25 and 28
# when line 24 is positive and on Part 3b lines 36 and 48 when it is "0"; for a salary-only
# caller line 24 is "0", so the form's own route is Part 3b. Both routes give the same figures, and
# the project builds the Part 3a lines (25 and 28, Umar 6 Nov 2026) and not Part 3b.
form:
  name: ca/schedule_8
  required: true
  exports:
    - ca/schedule_8_cpp_base_contributions_on_return
    - ca/schedule_8_cpp_enhanced_contributions_on_return
capabilities: []
