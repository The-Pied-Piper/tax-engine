# T1 (5006-R, 2025) Step 5 Part B line 96, "Line 96: Add lines 86 to 95." (CRA 5006-R-25E). The
# take-home filer has three of the lines 86 to 95: line 86 (base CPP through employment, a copy of
# Schedule 8 line 25), line 88 (EI premiums through employment, a copy of T2204 line 16) and line 92
# (the Canada employment amount, line 31260, the t1_tax_and_credits_line_31260 part). The other lines
# are 0 for this filer and are left out.
# Lines 86 and 88 are pure copies, so each is a core/record_total over the record list its form
# exports (the engine reads another form's export only as a record list). Line 96 is a core/sum,
# rounded once, half-up to the cent, through the shared ca/cent_rounding dataset.
form:
  name: ca/t1_tax_and_credits
capabilities:
  - name: core/record_total
    title: "Base CPP or QPP contributions through employment income"
    reference: "30800"
    consumes:
      records: ca/schedule_8.schedule_8_cpp_base_contributions_on_return
    produces:
      output: ca/cpp_base_contributions_line_86
  - name: core/record_total
    title: "Employment insurance premiums through employment"
    reference: "31200"
    consumes:
      records: ca/t2204.t2204_line_16
    produces:
      output: ca/ei_premiums_line_88
  - name: core/sum
    reference: "96"
    params:
      rounding: ca/cent_rounding
    consumes:
      parts:
        - ca/cpp_base_contributions_line_86
        - ca/ei_premiums_line_88
        - ca/canada_employment_amount
    produces:
      output: ca/credits_subtotal_line_96
