# T1 General 2025, Ontario edition (form 5006-R), line 167 "Refund or balance owing" (CRA 5006-R-25E,
# docs/cra-forms-2025/5006-r-25e.txt): "Line 167: Line 149 minus line 166. If the amount is negative,
# enter it on line 48400 below. If the amount is positive, enter it on line 48500 below." Line 149 is
# a copy of line 148 / 43500 (`ca/total_payable`) and line 166 is line 48200 (`ca/total_credits`), so
# the step reads those two lines directly. The form prints no floor: core/subtract gives a negative
# figure (a refund) as is and a positive one (a balance owing) as is, rounded to the cent through the
# shared ca/cent_rounding dataset, producing the signed `ca/refund_or_balance_owing`. The 48400 /
# 48500 split only routes the sign and is left out.
form:
  name: ca/t1_tax_and_credits
capabilities:
  - name: core/subtract
    title: "Refund or balance owing"
    reference: "167"
    params:
      rounding: ca/cent_rounding
    consumes:
      amount: ca/total_payable
      less: ca/total_credits
    produces:
      output: ca/refund_or_balance_owing
