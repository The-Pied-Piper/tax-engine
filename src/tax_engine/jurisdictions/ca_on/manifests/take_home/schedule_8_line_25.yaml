# Form Schedule 8, Canada Pension Plan Contributions and Overpayment (ca/schedule_8), Part 3a
# line 25. The form's declaration and exports are a part of the manifest's own, not this one.
form:
  name: ca/schedule_8
capabilities:
  # Line 25 is "Enter the amount from line 15. Enter this amount (in dollars and cents) on line
  # 30800 of your return and line 58240 of your Form 428." Line 15 is "Amount from line 11". No
  # capability copies an amount, so a one-part sum carries line 11 on (a sum is built even with
  # one part).
  # Route: the form prints line 25 only when line 24 is positive. A salary-only caller has no T4,
  # so actual equals required, line 24 is "0" and the form's own route is Part 3b, where line 36
  # (line 30 = line 15, plus lines 32 and 35, both 0) goes to line 30800 and line 58240. Same
  # figure; the project builds the Part 3a line and not Part 3b (Umar, 6 Nov 2026 21:34Z,
  # "agreed. stick with short for now").
  - name: core/sum
    consumes:
      parts:
        - ca/cpp_part_3_line_11
    produces:
      output: ca/schedule_8_cpp_base_contributions_on_return
