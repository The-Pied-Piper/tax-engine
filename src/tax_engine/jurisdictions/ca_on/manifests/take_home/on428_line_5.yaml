# Form ON428 (Ontario Tax, 2025, 5006-c-25e) Part A, line 5. Each of the five columns prints "Line 5:"
# with its rate: "Line 5: Rate 5.05%", "Line 5: Rate 9.15%", "Line 5: Rate 11.16%", "Line 5: Rate 12.16%"
# and "Line 5: Rate 13.16%". Line 5 is the printed rate of the column that line 1 falls in, and a
# line 1 exactly at a column's upper bound falls in the lower column. Line 1 is read from its
# producing part (on428_line_3.yaml), so this part does not produce it again.
form:
  name: ca-on/on428
capabilities:
  - name: core/bracket_column_rate
    params:
      schedule: ca-on/brackets
    consumes:
      base: ca-on/on428_taxable_income_line_1
    produces:
      output: ca-on/on428_bracket_column_rate_line_5
