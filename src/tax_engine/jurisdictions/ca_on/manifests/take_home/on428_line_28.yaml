# Form ON428 (Ontario Tax, 2025, 5006-c-25e) line 28 (ca-on/on428), "Line 28: Line 26 plus line 27 =".
# Line 26 is "Amount from line 25 of the previous page", a copy of line 25, so line 28 reads line 25
# directly. Line 27 is "Line 27 and line 58360: Pension income amount (maximum $1,762)", an optional
# input read as 0 when the filer has none (on428_line_27_inputs.yaml). Line 28 is their sum in line
# order.
form:
  name: ca-on/on428
capabilities:
  - name: core/sum
    title: "Ontario credits with the pension income amount"
    params:
      rounding: ca-on/cent_rounding
    consumes:
      parts: [ca-on/on428_credits_subtotal_line_25, ca-on/on428_pension_income_amount]
    produces:
      output: ca-on/on428_credits_with_pension_line_28
