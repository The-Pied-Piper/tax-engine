# Schedule 6 (5000-S6, 2025) line 27, the reduction amount. The form prints:
# "Line 26: Rate 15%" and "Line 27: Line 25 multiplied by the percentage from line 26"
# (docs/cra-forms-2025/5000-s6-25e.txt, lines 306-308).
#
# Line 26 is the printed 15%, held in the rate dataset `ca/cwb_reduction_rate` (from
# cwb_reduction_rate/2025.yaml), so it has no step. Line 25 is `ca/cwb_net_income_over_base_amount`
# (from schedule_6_line_25.yaml). The product is rounded half-up to the cent by the rate dataset.
form:
  name: ca/schedule_6
capabilities:
  - name: core/apply_rate
    params:
      rate: ca/cwb_reduction_rate
    consumes:
      base: ca/cwb_net_income_over_base_amount
    produces:
      output: ca/cwb_reduction_line_27
