# T1 General 2025, Ontario edition (form 5006-R), taxable income, lines 10100 to 26000. This part names
# the form and its exports; each line's capability goes in a part of its own with the same `form.name`.
# Exports: what the return reads from the form. Line 23400 (net income before adjustments,
# `ca/net_income_before_adjustments`) is exported for the return to read.
form:
  name: ca/t1_taxable_income
  required: true
  exports:
    - ca/net_income_before_adjustments
capabilities: []
