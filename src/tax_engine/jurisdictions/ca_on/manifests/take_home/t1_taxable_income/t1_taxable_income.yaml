# T1 General 2025, Ontario edition (form 5006-R), taxable income, lines 10100 to 26000. This part names
# the form and its exports; each line's capability goes in a part of its own with the same `form.name`.
# Exports: what the return reads from the form. Line 15000 (total income, `ca/total_income`), line
# 23300 (total deductions from total income, `ca/deductions_from_total_income`), line 23600 (net
# income, `ca/net_income`) and line 26000 (taxable income, `ca/taxable_income`) are exported for the
# return to read.
form:
  name: ca/t1_taxable_income
  required: true
  exports:
    - ca/total_income
    - ca/deductions_from_total_income
    - ca/net_income
    - ca/taxable_income
capabilities: []
