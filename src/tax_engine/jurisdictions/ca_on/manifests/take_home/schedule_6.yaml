# Schedule 6 (Canada workers benefit, 5000-S6) 2025. This part names the form, and the form's
# export is the figure T1 line 45300 reads: line 28 (`ca/cwb_benefit_line_28`, "Line 22 minus line
# 27", floored at zero). Each line's capability goes in a part of its own with the same `form.name`.
# Earlier lines' kinds are read inside the form by later lines and are not exported.
form:
  name: ca/schedule_6
  required: true
  exports:
    - ca/cwb_benefit_line_28
capabilities: []
