# T1 General 2025, Ontario edition (form 5006-R), Step 5 Part B line 101 "Add lines 98 to 100."
# (CRA 5006-R-25E, docs/cra-forms-2025/5006-r-25e.txt). Line 98 is `ca/credit_amounts_line_98`.
# Line 99 (the disability amount for self) and line 100 (the disability amount transferred from a
# dependant, line 31800) are 0 for the take-home filer and are left out. The sum is built even with
# its one part present: core/sum adds line 98 and rounds the total once, half-up to the cent,
# through the shared `ca/cent_rounding` dataset, producing `ca/credit_amounts_subtotal`.
form:
  name: ca/t1_tax_and_credits
capabilities:
  - name: core/sum
    title: "Credit amounts subtotal"
    params:
      rounding: ca/cent_rounding
    consumes:
      parts:
        - ca/credit_amounts_line_98
    produces:
      output: ca/credit_amounts_subtotal
