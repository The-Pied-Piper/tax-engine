# T2204 (2025) line 13: "Line 9 minus line 12 (if negative, enter "0") = 13". For an Ontario resident,
# line 9 is a copy of line 4 (ca/t2204_premiums_deducted) and line 12 is a copy of line 10
# (ca/t2204_line_10), so this part has no steps for lines 9 and 12: it reads those two amounts
# directly as its inputs.
#
# Step 1 subtracts line 12 (the line 10 amount) from line 9 (the line 4 amount), and keeps the
# result at or above 0: a difference under 0 gives "0", as the form says.
form:
  name: ca/t2204
capabilities:
  - name: core/subtract_not_below_zero
    reference: "13"
    params:
      rounding: ca/cent_rounding
    consumes:
      amount: ca/t2204_premiums_deducted
      less: ca/t2204_line_10
    produces:
      output: ca/t2204_line_13
