# T1 General 2025, Ontario edition (form 5006-R), tax and credits, from Step 5 Part A onward. This
# part names the form and its exports; each line's capability goes in a part of its own with the
# same `form.name`.
# Exports: what the take-home forms read from this one.
#   - Line 76 (`ca/federal_basic_tax`, "Line 74 plus line 75 Federal tax on taxable income") is read
#     by the later lines of the return that use the federal tax on taxable income.
# Line 70 is read inside the form by line 76 and is not exported.
form:
  name: ca/t1_tax_and_credits
  required: true
  exports:
    - ca/federal_basic_tax
capabilities: []
