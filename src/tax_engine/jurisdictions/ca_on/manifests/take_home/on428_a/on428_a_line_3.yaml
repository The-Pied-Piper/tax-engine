# ON428-A (5006-a-25e) "Line 1: Amount from line 10100 of your return / Line 2: Amount from line
# 10400 of your return / Line 3: Line 1 plus line 2". Line 1 is the salary input (employment income,
# T1 line 10100); line 2 is the optional T1 line 10400 input (other employment income), which reads as
# 0 when the filer has none, as in T1 line 15000. Line 3 is their sum in line order.
form:
  name: ca-on/on428_a
capabilities:
  - name: core/sum
    consumes:
      parts: [ca/employment_income, ca/other_employment_income]
    produces:
      output: ca-on/lift_employment_income
