# T1 General 2025, Ontario edition (form 5006-R), Step 5 Part B line 84 "Add lines 77 to 83. ="
# (CRA 5006-R-25E, docs/cra-forms-2025/5006-r-25e.txt). Line 77 is the basic personal amount,
# line 30000 (`ca/basic_personal_amount`), read directly as a part. Lines 78 to 83 are 0 for a
# single salary-only filer under 65, so they are left out. The sum is built even with one part:
# core/sum adds line 77 alone and rounds the total once, half-up to the cent, through the shared
# `ca/cent_rounding` dataset, producing `ca/credit_amounts_line_84`. Line 85 "Enter the amount from
# line 84 of the previous page" is a pure copy, so it is not a step.
form:
  name: ca/t1_tax_and_credits
capabilities:
  - name: core/sum
    title: "Credit amounts through line 84"
    params:
      rounding: ca/cent_rounding
    consumes:
      parts:
        - ca/basic_personal_amount
    produces:
      output: ca/credit_amounts_line_84
