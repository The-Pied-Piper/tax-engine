# Form ON428 (Ontario Tax, 2025, 5006-c-25e) line 66 (ca-on/on428): "(Line 65 minus $5,710)
# multiplied by 20% (if negative, enter "0") =". Line 65 is the surtax base,
# `ca-on/on428_surtax_base_line_65`, read from its source part, not copied. Line 66 is one
# calculation: 20% of line 65 above $5,710, never below 0, rounded half-up to the cent. The
# threshold and rate are held in the `ca-on/surtax_line_66` dataset.
form:
  name: ca-on/on428
capabilities:
  - name: core/tiered_surcharge
    title: "Surtax 20% tier"
    params:
      tiers: ca-on/surtax_line_66
    consumes:
      base: ca-on/on428_surtax_base_line_65
    produces:
      output: ca-on/on428_surtax_20_percent_tier_line_66
