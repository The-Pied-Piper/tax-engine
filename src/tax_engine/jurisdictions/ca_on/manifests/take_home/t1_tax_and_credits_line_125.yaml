# T1 General 2025, Ontario edition (form 5006-R), Step 5 line 125 "Add lines 122 to 124."
# (CRA 5006-R-25E, docs/cra-forms-2025/5006-r-25e.txt). Line 122 is "Amount from line 35000"
# (`ca/non_refundable_tax_credits`), a pure copy that gets no step of its own. Line 123 (line 40425,
# the federal dividend tax credit) and line 124 (line 40427, the minimum tax carryover) are 0 for
# the take-home filer and are left out: there are no dividends and no minimum tax paid in an earlier
# year. The sum is built even with its one part present: core/sum adds line 122 and rounds the total
# once, half-up to the cent, through the shared `ca/cent_rounding` dataset, producing
# `ca/credits_against_basic_federal_tax`.
form:
  name: ca/t1_tax_and_credits
capabilities:
  - name: core/sum
    title: "Credits against the basic federal tax"
    params:
      rounding: ca/cent_rounding
    consumes:
      parts:
        - ca/non_refundable_tax_credits
    produces:
      output: ca/credits_against_basic_federal_tax
