# Form ON428 (2025, CRA 5006-c-25e) line 25, "Line 25: Line 18 plus line 24 =": the credits
# subtotal. It sums the personal amounts subtotal (line 18,
# `ca-on/on428_personal_amounts_subtotal_line_18`) and the CPP and EI credit amounts (line 24,
# `ca-on/on428_cpp_ei_credit_amounts_line_24`), both read from the part that computes them.
# Line 25 is the output `ca-on/on428_credits_subtotal_line_25`.
form:
  name: ca-on/on428
capabilities:
  - name: core/sum
    title: "Credits subtotal"
    reference: "25"
    params:
      rounding: ca-on/cent_rounding
    consumes:
      parts:
        [ca-on/on428_personal_amounts_subtotal_line_18, ca-on/on428_cpp_ei_credit_amounts_line_24]
    produces:
      output: ca-on/on428_credits_subtotal_line_25
