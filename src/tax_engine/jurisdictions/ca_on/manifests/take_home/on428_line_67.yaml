# Form ON428 (Ontario Tax, 2025, 5006-c-25e) line 67 (ca-on/on428): "Line 67: (Line 65 minus $7,307)
# multiplied by 36% (if negative, enter "0") =". Line 65 is the surtax base, read from its own
# part, `ca-on/on428_surtax_base_line_65`. The $7,307 threshold and the 36% rate are held in the
# `ca-on/surtax_line_67` dataset, so line 67 is one tiered surcharge: line 65 minus 7,307, times
# 36%, rounded half-up to the cent, and 0 when line 65 is under the threshold.
form:
  name: ca-on/on428
capabilities:
  - name: core/tiered_surcharge
    title: "36% surtax tier"
    params:
      tiers: ca-on/surtax_line_67
    consumes:
      base: ca-on/on428_surtax_base_line_65
    produces:
      output: ca-on/on428_surtax_36_percent_tier_line_67
