# ON428 (2025) line 9, the basic personal amount. Form ON428 (CRA 5006-c-25e): "Line 9 and line
# 58040: Basic personal amount Claim $12,747". The $12,747 is the `ca-on/basic_personal_amount`
# dataset, claimed whole through core/credit_amount, so it is the same at every salary.
form:
  name: ca-on/on428
capabilities:
  - name: core/credit_amount
    params:
      amount: ca-on/basic_personal_amount
    produces:
      output: ca-on/basic_personal_amount
