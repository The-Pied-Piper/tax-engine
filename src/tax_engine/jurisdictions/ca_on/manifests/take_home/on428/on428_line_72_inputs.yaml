# ON428 (2025) inputs a salary-only caller does not give.
# Line 72: "Line 72: If you entered an amount on line 11 of Part 5 of Form T691, use Worksheet ON428 to
# calculate your additional tax for minimum tax purposes". A caller with no minimum tax leaves the line
# out, so a request that leaves it out is read as blank, and the line 73 and line 80 parts read that
# blank as 0.
inputs:
  - name: ca-on/on428_additional_tax_for_minimum_tax_line_72
    required: false
    default: null
    basis: 'Line 72: If you entered an amount on line 11 of Part 5 of Form T691, use Worksheet ON428 to calculate your additional tax for minimum tax purposes'
