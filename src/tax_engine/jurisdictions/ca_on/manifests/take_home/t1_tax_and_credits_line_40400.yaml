# T1 General 2025, Ontario edition (form 5006-R), Step 5 Part C line 121 (line 40400), "Line 121 and
# line 40400: Line 119 plus line 120" (CRA 5006-R-25E, docs/cra-forms-2025/5006-r-25e.txt). Line 119
# is "Enter the amount from line 76.", a pure copy of line 76, so line 76 (`ca/federal_basic_tax`) is
# read directly as a part and is not a step. Line 120 is "Federal tax on split income (TOSI)
# (complete Form T1206)", which is 0 for a salary-only filer, so it is left out. The sum is built
# even with one part: core/sum adds line 76 alone and rounds the total once, half-up to the cent,
# through the shared `ca/cent_rounding` dataset, producing `ca/federal_tax_with_split_income`.
form:
  name: ca/t1_tax_and_credits
capabilities:
  - name: core/sum
    params:
      rounding: ca/cent_rounding
    consumes:
      parts:
        - ca/federal_basic_tax
    produces:
      output: ca/federal_tax_with_split_income
