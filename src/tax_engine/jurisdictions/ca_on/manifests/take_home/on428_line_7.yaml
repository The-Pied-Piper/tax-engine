# Form ON428 (Ontario Tax, 2025, 5006-c-25e) Part A, line 7. Each of the five columns prints
# "Line 7:" with the tax at the column's start: 0.00, 2,670.74, 7,510.09, 12,445.60 and 20,957.60.
# The form's Transcriber's Note says: "Use the amount from column 1 if the amount on line 1 is
# $52,886 or less. Use the amount from column 2 if the amount on line 1 is more than $52,886 but not
# more than $105,775." (columns 3 to 5 follow the same wording up to "more than $220,000"). Line 7
# is the printed tax at the start of the column that line 1 falls in: the amount of that column,
# not a figure computed from its rates.
#
# Line 1, "Enter your taxable income from line 26000 of your return.", is produced by
# on428_line_3.yaml (`ca-on/on428_taxable_income_line_1`), which reads the T1 taxable income; this
# part reads that line 1 and does not copy its records. The amount is taken from the schedule's
# printed `tax_at_start` (`ca-on/brackets`), so it is not rounded again.
form:
  name: ca-on/on428
capabilities:
  - name: core/bracket_column_tax_at_start
    reference: "7"
    params:
      schedule: ca-on/brackets
    consumes:
      base: ca-on/on428_taxable_income_line_1
    produces:
      output: ca-on/on428_tax_at_column_start_line_7
