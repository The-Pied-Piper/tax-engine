# Schedule 6 (5000-S6, 2025) line 1, employment income and other employment income (column 1 "You").
# The form prints: "Line 1: Employment income and other employment income from line 10100 and line
# 10400 of the return" and "Column 1 You" (docs/cra-forms-2025/5000-s6-25e.txt, lines 130-133).
#
# Line 1 is a sum of T1 line 10100 (`ca/employment_income`, the salary input) and T1 line 10400
# (`ca/other_employment_income`, the optional input). Line 10400 reads as 0 when the filer has none,
# as in T1 line 15000. Line 1 is their sum in line order.
form:
  name: ca/schedule_6
capabilities:
  - name: core/sum
    params:
      rounding: ca/cent_rounding
    consumes:
      parts: [ca/employment_income, ca/other_employment_income]
    produces:
      output: ca/cwb_employment_income
