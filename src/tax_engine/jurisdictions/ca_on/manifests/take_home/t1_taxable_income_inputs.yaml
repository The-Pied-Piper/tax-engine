# T1 (2025) inputs a salary-only caller does not give.
inputs:
  # T1 line 23500: "Line 55 and line 23500: If not, enter "0" on line 23500." A salary-only filer has
  # nothing on lines 11900, 11300 or 14600, so the Federal Worksheet chart does not apply and the
  # form fixes line 23500 at 0. A request that leaves the line out reads it as "0".
  - name: ca/social_benefits_repayment
    required: false
    default: "0"
    basis: 'Line 55 and line 23500: If not, enter "0" on line 23500.'
  # T1 line 25700: "Line 68 and line 25700: Add lines 58 to 67." A salary-only filer has none of lines
  # 24400 to 25600, so a request that leaves the line out is read as 0 by the line 26000 step.
  - name: ca/deductions_from_net_income
    required: false
    default: "0"
    basis: "Line 68 and line 25700: Add lines 58 to 67."
