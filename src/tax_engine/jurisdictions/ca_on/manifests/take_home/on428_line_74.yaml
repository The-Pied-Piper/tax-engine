# ON428 (2025) line 74, the basic reduction. Form ON428 (CRA 5006-c-25e): "Line 74: Basic reduction
# 294.00". The $294.00 is the `ca-on/tax_reduction_basic` dataset, claimed whole through
# core/credit_amount, so it is the same at every salary. Line 74 reads nothing.
form:
  name: ca-on/on428
capabilities:
  - name: core/credit_amount
    params:
      amount: ca-on/tax_reduction_basic
    produces:
      output: ca-on/on428_basic_reduction_line_74
