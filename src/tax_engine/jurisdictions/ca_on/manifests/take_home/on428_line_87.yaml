# Form ON428 (Ontario Tax, 2025, 5006-c-25e) line 87 (ca-on/on428): "Line 87 and line 62150: Enter
# the amount of qualifying donations that have also been claimed as a charitable donation.
# multiplied by 25% =". The 25% is a printed rate, held in the `ca-on/farmers_food_donation_rate`
# dataset, so line 87 is one calculation: 25% of the qualifying donations, rounded half-up to the
# cent. The donations are an optional input (read as 0 when left out), not read from another part.
form:
  name: ca-on/on428
capabilities:
  - name: core/apply_rate
    title: "Farmers' food donation credit"
    params:
      rate: ca-on/farmers_food_donation_rate
    consumes:
      base: ca-on/on428_qualifying_food_donations_line_87
    produces:
      output: ca-on/on428_farmers_food_donation_credit_line_87
