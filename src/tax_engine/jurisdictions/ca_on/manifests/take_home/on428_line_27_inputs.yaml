# ON428 (2025) line 27 input a salary-only caller does not give.
# Line 27 and line 58360: "Line 27 and line 58360: Pension income amount (maximum $1,762)" (5006-c-25e).
# A salary-only caller has no pension income, so a request that leaves the line out is read as 0,
# not blank.
inputs:
  - name: ca-on/on428_pension_income_amount
    required: false
    default: "0"
    basis: 'Line 27 and line 58360: Pension income amount (maximum $1,762)'
