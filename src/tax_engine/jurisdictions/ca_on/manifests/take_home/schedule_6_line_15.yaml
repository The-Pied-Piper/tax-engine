# Schedule 6 (5000-S6, 2025) line 15, adjusted family net income. The form prints: "Line 15: Line 13
# minus line 14 Enter this amount on line 23 and line 35. Adjusted family net income"
# (docs/cra-forms-2025/5000-s6-25e.txt, lines 235-236).
#
# Line 15 subtracts line 14 from line 13 (`ca/cwb_family_net_income_line_13`, from
# schedule_6_line_13.yaml). Line 14 (`ca/cwb_secondary_earner_exemption`) is an optional input
# (schedule_6_line_14_inputs.yaml) that a salary-only caller leaves out: it is read as blank, and
# the blank fallback is 0, so line 15 is then line 13 alone.
#
# The form prints no floor on line 15, so core/subtract gives a negative figure as is, rounded to
# the cent by the ca/cent_rounding dataset. The result is the signed `ca/adjusted_family_net_income`.
form:
  name: ca/schedule_6
capabilities:
  - name: core/subtract
    params:
      rounding: ca/cent_rounding
    consumes:
      amount: ca/cwb_family_net_income_line_13
      less: ca/cwb_secondary_earner_exemption
    blank:
      less: "0"
    produces:
      output: ca/adjusted_family_net_income
