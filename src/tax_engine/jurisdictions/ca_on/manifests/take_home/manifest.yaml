# Ontario 2025 take-home manifest: the return's identity and its one export. The caller gives the
# gross salary and nothing else (salary.yaml); each form's lines are in parts of their own beside
# this one, so a line ticket adds only its own part file.
#
# The default form's export is T1 line 167, refund or balance owing (positive is owing, negative is
# a refund). The CPP and EI figures the calculator also needs are exported by their own forms
# (schedule_8.yaml and t2204.yaml); the calculator reads them from their forms.
jurisdiction: CA-ON
version: 1
valid_from_tax_year: 2025
# The title is the engine's own wording for the default form, not a printed form heading.
title: Return summary
outputs:
  - ca/refund_or_balance_owing
capabilities: []
