# Form ON428 (Ontario Tax, 2025, 5006-c-25e) line 4, "Line 4: Line 2 minus line 3 (cannot be
# negative) =": the taxable income over the column's lower bound. Line 2 is a copy of line 1 (the
# T1 taxable income) and has no step of its own, so line 4 reads line 1 directly. Line 3 is the
# printed lower bound of the column that line 1 falls in. The result is not below zero.
form:
  name: ca-on/on428
capabilities:
  - name: core/subtract_not_below_zero
    title: "Taxable income over the lower bound"
    reference: "4"
    params:
      rounding: ca-on/cent_rounding
    consumes:
      amount: ca-on/on428_taxable_income_line_1
      less: ca-on/on428_bracket_lower_bound_line_3
    produces:
      output: ca-on/on428_taxable_income_over_lower_bound_line_4
