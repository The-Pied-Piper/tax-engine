capabilities:
  # Form T2205 (2025) reads no figure of the return, so the filer's age ("65 or older at the end of the
  # year", ca/born_in_1960_or_earlier_checked) is read here, not in the form. The three exports the return
  # reports are totalled (the form's one record), then sent to T1 line 12900, line 11500 or line 13000.
  # Line 11 "If part of this amount relates to withdrawals from an RRSP ... you must report it on line
  # 12900 of your own income tax and benefit return": the RRSP part of line 11.
  - name: core/record_total
    consumes:
      records: ca/t2205.t2205_line_11_rrsp_part
    produces:
      output: ca/t2205_on_line_12900
  # Line 11 "If part of this amount relates to withdrawals from an SPP": the SPP part of line 11.
  - name: core/record_total
    consumes:
      records: ca/t2205.t2205_line_11_spp_part_checked
    produces:
      output: ca/t2205_spp_part_total
  # Line 22 "Line 20 minus line 21.": signed.
  - name: core/record_total
    consumes:
      records: ca/t2205.t2205_line_22
    produces:
      output: ca/t2205_line_22_total
  # Line 11 "If part of this amount relates to withdrawals from an SPP, you must report it on line 11500 of
  # your own income tax and benefit return if you are 65 or older at the end of the year": the SPP part
  # times the 0 or 1 answer of being born in 1960 or earlier.
  - name: core/times_count
    consumes:
      amount: ca/t2205_spp_part_total
      count: ca/born_in_1960_or_earlier_checked
    produces:
      output: ca/t2205_spp_part_on_line_11500
  # "or on line 13000 otherwise": the rest of the SPP part.
  - name: core/subtract
    consumes:
      amount: ca/t2205_spp_part_total
      less: ca/t2205_spp_part_on_line_11500
    produces:
      output: ca/t2205_spp_part_on_line_13000
  # Line 22 "If you were 65 or older at the end of the year you indicated above, report this amount on line
  # 11500 of your own income tax and benefit return for that year."
  - name: core/times_count
    consumes:
      amount: ca/t2205_line_22_total
      count: ca/born_in_1960_or_earlier_checked
    produces:
      output: ca/t2205_line_22_on_line_11500
  # Line 22 "Otherwise, report it on line 13000.": the rest of line 22.
  - name: core/subtract
    consumes:
      amount: ca/t2205_line_22_total
      less: ca/t2205_line_22_on_line_11500
    produces:
      output: ca/t2205_line_22_on_line_13000
  # The T2205 amount on T1 line 11500 (added to ca/other_pensions_and_superannuation in total income).
  - name: core/sum
    consumes:
      parts:
        - ca/t2205_spp_part_on_line_11500
        - ca/t2205_line_22_on_line_11500
    produces:
      output: ca/t2205_on_line_11500
  # The T2205 amount on T1 line 13000 (added to ca/other_income in total income).
  - name: core/sum
    consumes:
      parts:
        - ca/t2205_spp_part_on_line_13000
        - ca/t2205_line_22_on_line_13000
    produces:
      output: ca/t2205_on_line_13000
