  # rounded half-up to the cent.
  - name: core/apply_rate
    params:
      rate: ca/fuel_charge_payment_rate
    consumes:
      base: ca/farm_chart_b_row_11_pe
    produces:
      output: ca/farm_chart_c_amount_pe
  # Form T2043 Chart C "Eligible farming expenses in NL from row 11 of Chart B. Add amount 13 at
  # amount 4G" × NL payment rate 0.229% (Newfoundland and Labrador): row 11 of NL at the payment
  # rate, rounded half-up to the cent.
  - name: core/apply_rate
    params:
      rate: ca/fuel_charge_payment_rate
    consumes:
      base: ca/farm_chart_b_row_11_nl
    produces:
