# Form T776 (ca/t776), amount 7 of a partner: see 03e_t776.yaml for the form's selections and
# exports. T776 line 7 "Partners: your share of amount 6, or the amount from your T5013 slip,
# Statement of Partnership Income"; Guide T4036: a partner who received a T5013 slip "enter[s] the
# amount from box 110 (or 107 if it is a limited partnership) of your T5013 slip on amount 7", and
# "If you are in a partnership and you do not receive a T5013 slip ... fill in all of the parts in
# Form T776 that apply to you" and, "Amount 7 - Partnerships: If you are a member of a
# partnership, enter your share of amount 6". The share is amount 6 times the "Your percentage of
# the partnership %" of Part 1, a caller input as the form prints it (50 for 50%).
form:
  name: ca/t776
capabilities:
  # The amount 7 typed, checked against the partner and slip answers: a typed amount 7 from a
  # partner with no slip is refused. The checked count is the form's export, read by nothing on the
  # return.
  - name: ca/count_by_conditions
    params:
      conditions: ca/t776_partner_amount_7_conflicts
    consumes:
      counts:
        - ca/rental_partner_checked
        - ca/rental_partner_t5013_slip_checked
      amounts:
        - ca/rental_partner_share
    produces:
      output: ca/rental_partner_amount_7_conflict
  - name: ca/count_refused_by_conditions
    params:
      conditions: ca/t776_partner_amount_7_conflict_refused
    consumes:
      count: ca/rental_partner_amount_7_conflict
    produces:
      output: ca/rental_partner_amount_7_conflict_checked
  # T776 Part 1 "Your percentage of the partnership %" prints no bound; a share of the partnership
  # is at most the whole, 100, so the percentage is refused above it, not capped. The 100 is the
  # Area G figure (`ca/rental_epop_percentage_maximum`, produced in 03e_t776.yaml) reused for a box
  # that prints none: a sanity refusal, not a printed rule.
  - name: core/at_most
    consumes:
      amount: ca/rental_partner_percentage
      bound: ca/rental_epop_percentage_maximum
    produces:
      output: ca/rental_partner_percentage_checked
  # T776 "Line 7: Partners: your share of amount 6": amount 6 ("Line 6: Net income (loss) (amount 5
  # minus line 9936)") times "Your percentage of the partnership %", for a partner who received no
  # T5013 slip.
  - name: ca/apply_percentage
    params:
      rounding: ca/rental_partner_share_rounding
    consumes:
      amount: ca/rental_net_income_after_cca
      percentage: ca/rental_partner_percentage_checked
    produces:
      output: ca/rental_partner_share_of_amount_6
  # T776 "Line 7: Partners: your share of amount 6, or the amount from your T5013 slip": the slip's
  # amount (the typed figure) for a partner who received a slip (a count of 1), else the share of
  # amount 6.
  - name: core/choose_by_count
    consumes:
      count: ca/rental_partner_t5013_slip_checked
      when_none: ca/rental_partner_share_of_amount_6
      when_any: ca/rental_partner_share
    produces:
      output: ca/rental_partner_amount_7
