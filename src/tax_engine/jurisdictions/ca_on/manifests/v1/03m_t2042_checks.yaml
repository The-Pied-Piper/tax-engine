# Form T2042 (ca/t2042), the checks of the statement: see 03c_t2042.yaml for the form's selections
# and exports. They run once for each statement, with the steps of 03c_t2042.yaml.
form:
  name: ca/t2042
capabilities:
  # T2042 Part 5 "Your share of amount 4C or the amount from your T5013 slip, Statement of Partnership Income"
  # (5A): the answer to a yes or no question, a count of 1 or 0, checked before the step that reads
  # it. A count of 2 or more is refused, not capped.
  - name: ca/yes_or_no_count
    consumes:
      count: ca/farm_partner
    produces:
      output: ca/farm_partner_checked
