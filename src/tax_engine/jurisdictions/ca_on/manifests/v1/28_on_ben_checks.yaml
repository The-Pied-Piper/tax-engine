# Form ON-BEN line 61080 "If, on December 31, 2025, you and your spouse or common-law partner
# occupied separate principal residences for medical reasons ... tick this box": a tick box,
# checked to be 0 or 1, then checked against the spouse or common-law partner on December 31, 2025.
# The line cannot be ticked with no spouse or common-law partner: the T1's "Marital status on
# December 31, 2025" Box 1 Married or Box 2 Living common-law is the fact it is checked against
# (Part 17's checked count). An amount above its bound is refused, not capped.
capabilities:
  # Form ON-BEN line 61080 "...tick this box": the answer to a yes or no question, a count of 1 or
  # 0, checked before the step that reads it. A count of 2 or more is refused, not capped.
  - name: ca/yes_or_no_count
    consumes:
      count: ca-on/separate_residences_for_medical_reasons
    produces:
      output: ca-on/separate_residences_for_medical_reasons_checked
  # Form ON-BEN line 61080 is ticked only with a spouse or common-law partner on December 31, 2025:
  # the spouse count (the total of the form ca/spouse_on_december_31, 0 or 1) is at least the
  # checked tick, so a tick of 1 with no spouse is an input error. A tick of 0 passes either way.
  - name: ca/count_at_least
    consumes:
      count: ca/spouse_or_common_law_partner_on_december_31_total
      minimum: ca-on/separate_residences_for_medical_reasons_checked
    produces:
      output: ca-on/spouse_for_separate_residences_checked
