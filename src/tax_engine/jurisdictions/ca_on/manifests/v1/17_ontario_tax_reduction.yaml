capabilities:
  # ON428 line 74 "Basic reduction 294.00": the dataset becomes an artifact of the same
  # name, the first part of line 77.
  - name: core/credit_amount
    params:
      amount: ca-on/tax_reduction_basic
    produces:
      output: ca-on/tax_reduction_basic
  # ON428 line 75 (line 60969) "Number of dependent children multiplied by $544" and line
  # 76 (line 60970) "Number of dependants multiplied by $544", before the rule that "only the
  # individual with the higher net income can claim the amounts on lines 75 and 76".
  - name: core/per_unit_amount
    params:
      amount: ca-on/tax_reduction_per_dependant
    consumes:
      count: ca-on/dependent_children
    produces:
      output: ca-on/tax_reduction_for_children_before_spouse_rule
  - name: core/per_unit_amount
    params:
      amount: ca-on/tax_reduction_per_dependant
    consumes:
      count: ca-on/dependants
    produces:
      output: ca-on/tax_reduction_for_dependants_before_spouse_rule
  # ON428 "If you had a spouse or common-law partner on December 31, 2025, only the individual
  # with the higher net income can claim the amounts on lines 75 and 76": the answer is entered
  # once, in the form ca/spouse_on_december_31 (Schedule ON428-A reads it too), checked to be 0 or
  # 1 there; this step takes the first value of the form's export, a record list of one record.
  - name: core/first_record_count
    consumes:
      records: ca/spouse_on_december_31.spouse_or_common_law_partner_on_december_31_checked
    produces:
      output: ca/spouse_or_common_law_partner_on_december_31_total
  # ON428 "only the individual with the higher net income can claim the amounts on lines 75 and
  # 76" at a tie of net income: the answer to a yes or no question, a count of 1 or 0, checked
  # before the step that reads it. A count of 2 or more is refused, not capped.
  - name: ca/yes_or_no_count
    consumes:
      count: ca-on/claims_tax_reduction_amounts_at_equal_net_income
    produces:
      output: ca-on/claims_tax_reduction_amounts_at_equal_net_income_checked
  # ON428 "Enter "0" on line 80 if any of the following applies to you" "You were not a resident
  # of Canada at the beginning of the year": the answer to a yes or no question, a count of 1 or
  # 0, checked before the step that reads it. A count of 2 or more is refused, not capped.
  - name: ca/yes_or_no_count
    consumes:
      count: ca-on/not_resident_of_canada_at_start_of_year
    produces:
      output: ca-on/not_resident_of_canada_at_start_of_year_checked
  # ON428 "Enter "0" on line 80 if any of the following applies to you" "You were not a resident
  # of Ontario on December 31, 2025": the answer to a yes or no question, a count of 1 or 0,
  # checked before the step that reads it. A count of 2 or more is refused, not capped.
  - name: ca/yes_or_no_count
    consumes:
      count: ca-on/not_resident_of_ontario_at_year_end
    produces:
      output: ca-on/not_resident_of_ontario_at_year_end_checked
  # ON428 "Enter "0" on line 80 if any of the following applies to you" "You were bankrupt at any
  # time in 2025": the answer to a yes or no question, a count of 1 or 0, checked before the step
  # that reads it. A count of 2 or more is refused, not capped.
  - name: ca/yes_or_no_count
    consumes:
      count: ca-on/bankrupt_in_year
    produces:
      output: ca-on/bankrupt_in_year_checked
  # ON428 "Enter "0" on line 80 if any of the following applies to you" "Your return is filed for
  # you by a trustee in bankruptcy": the answer to a yes or no question, a count of 1 or 0,
  # checked before the step that reads it. A count of 2 or more is refused, not capped.
  - name: ca/yes_or_no_count
    consumes:
      count: ca-on/return_filed_by_trustee_in_bankruptcy
    produces:
      output: ca-on/return_filed_by_trustee_in_bankruptcy_checked
  # ON428 "Enter "0" on line 80 if any of the following applies to you" "You are choosing not to
  # claim an Ontario tax reduction": the answer to a yes or no question, a count of 1 or 0,
  # checked before the step that reads it. A count of 2 or more is refused, not capped.
  - name: ca/yes_or_no_count
    consumes:
      count: ca-on/not_claiming_ontario_tax_reduction
    produces:
      output: ca-on/not_claiming_ontario_tax_reduction_checked
  # ON428 "If you had a spouse or common-law partner on December 31, 2025, only the
  # individual with the higher net income can claim the amounts on lines 75 and 76.": 1 when
  # there was no spouse or common-law partner (the T1's "Marital status on December 31, 2025"
  # Box 1 Married and Box 2 Living common-law), when the net income (line 23600) is more than
  # the spouse's (ON428 line 12 "Your spouse's or common-law partner's net income from line
  # 23600 of their return"), or when the two are equal and the caller says this return claims.
  - name: ca/count_by_conditions
    params:
      conditions: ca-on/tax_reduction_spouse_rule
    consumes:
      counts:
        - ca/spouse_or_common_law_partner_on_december_31_total
        - ca-on/claims_tax_reduction_amounts_at_equal_net_income_checked
      amounts:
        - ca/net_income
        - ca/spouse_net_income
    produces:
      output: ca-on/tax_reduction_amounts_claimable
  # ON428 line 75 and line 76, each once if this return claims them, else 0.
  - name: core/times_count
    consumes:
      amount: ca-on/tax_reduction_for_children_before_spouse_rule
      count: ca-on/tax_reduction_amounts_claimable
    produces:
      output: ca-on/tax_reduction_for_children
  - name: core/times_count
    consumes:
      amount: ca-on/tax_reduction_for_dependants_before_spouse_rule
      count: ca-on/tax_reduction_amounts_claimable
    produces:
      output: ca-on/tax_reduction_for_dependants
  # ON428 line 77 "Add lines 74 to 76.", in line order.
  - name: core/sum
    consumes:
      parts:
        - ca-on/tax_reduction_basic
        - ca-on/tax_reduction_for_children
        - ca-on/tax_reduction_for_dependants
    produces:
      output: ca-on/tax_reduction_amounts
  # ON428 line 73 "Line 71 plus line 72 =": line 71 is the Ontario tax after the dividend
  # credit and line 72 the additional tax for minimum tax purposes (Worksheet ON428).
  - name: core/sum
    consumes:
      parts:
        - ca-on/ontario_tax_after_dividend_credit
        - ca-on/ontario_minimum_tax
    produces:
      output: ca-on/ontario_tax_before_reduction
  # ON428 line 78 "Amount from line 77 above multiplied by 2", line 79 "Amount from line
  # 73 above" and line 80 "Line 78 minus line 79 (if negative, enter "0") Ontario tax
  # reduction", before the conditions on which the form enters "0" on line 80.
  - name: core/multiple_over
    params:
      factor: ca-on/tax_reduction_factor
    consumes:
      amount: ca-on/tax_reduction_amounts
      less: ca-on/ontario_tax_before_reduction
    produces:
      output: ca-on/ontario_tax_reduction_before_conditions
  # ON428 "Enter "0" on line 80 if any of the following applies to you:" the six printed
  # conditions in the form's order: "You were not a resident of Canada at the beginning of the
  # year", "You were not a resident of Ontario on December 31, 2025", "There is an amount on
  # line 72", "You were bankrupt at any time in 2025", "Your return is filed for you by a
  # trustee in bankruptcy" and "You are choosing not to claim an Ontario tax reduction": 0 when
  # any applies, else 1.
  - name: ca/count_by_conditions
    params:
      conditions: ca-on/tax_reduction_conditions
    consumes:
      counts:
        - ca-on/not_resident_of_canada_at_start_of_year_checked
        - ca-on/not_resident_of_ontario_at_year_end_checked
        - ca-on/bankrupt_in_year_checked
        - ca-on/return_filed_by_trustee_in_bankruptcy_checked
        - ca-on/not_claiming_ontario_tax_reduction_checked
      amounts:
        - ca-on/ontario_minimum_tax
    produces:
      output: ca-on/tax_reduction_claimable
  # ON428 line 80 "Ontario tax reduction": line 78 minus line 79 once if none of the six
  # conditions applies, else "0".
  - name: core/times_count
    consumes:
      amount: ca-on/ontario_tax_reduction_before_conditions
      count: ca-on/tax_reduction_claimable
    produces:
      output: ca-on/ontario_tax_reduction
  # ON428 line 81 "Line 73 minus line 80 (if negative, enter "0")".
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca-on/ontario_tax_before_reduction
      less: ca-on/ontario_tax_reduction
    produces:
      output: ca-on/ontario_tax_after_reduction
  # Form T2036 note (4): "If you were a resident of Ontario, calculate this amount by entering
  # "0" on lines 70 and 72 of Form ON428 and continue the calculation. The result from line 81
  # is your provincial or territorial tax otherwise payable." ON428 line 71 "Line 69 minus line
  # 70 (if negative, enter "0")" with "0" on line 70: line 69 over one part.
  - name: core/sum
    consumes:
      parts:
        - ca-on/ontario_tax_with_surtax
    produces:
      output: ca-on/tax_otherwise_payable_line_71
  # ON428 line 73 "Line 71 plus line 72 =" with "0" on line 72: line 71 over one part, for the
  # tax otherwise payable.
  - name: core/sum
    consumes:
      parts:
        - ca-on/tax_otherwise_payable_line_71
    produces:
      output: ca-on/tax_otherwise_payable_line_73
  # ON428 line 78 "Amount from line 77 above multiplied by 2", line 79 "Amount from line 73
  # above" and line 80 "Line 78 minus line 79 (if negative, enter "0") Ontario tax reduction",
  # for the tax otherwise payable: lines 74 to 77 are those above and line 79 is its line 73,
  # before the conditions on which the form enters "0" on line 80.
  - name: core/multiple_over
    params:
      factor: ca-on/tax_reduction_factor
    consumes:
      amount: ca-on/tax_reduction_amounts
      less: ca-on/tax_otherwise_payable_line_73
    produces:
      output: ca-on/tax_otherwise_payable_reduction_before_conditions
  # ON428 "Enter "0" on line 80 if any of the following applies to you:" for the tax otherwise
  # payable, whose line 72 is "0": the printed conditions other than "There is an amount on line
  # 72", in the form's order, "You were not a resident of Canada at the beginning of the year",
  # "You were not a resident of Ontario on December 31, 2025", "You were bankrupt at any time in
  # 2025", "Your return is filed for you by a trustee in bankruptcy" and "You are choosing not
  # to claim an Ontario tax reduction": 0 when any applies, else 1.
  - name: ca/count_by_conditions
    params:
      conditions: ca-on/tax_reduction_conditions_without_line_72
    consumes:
      counts:
        - ca-on/not_resident_of_canada_at_start_of_year_checked
        - ca-on/not_resident_of_ontario_at_year_end_checked
        - ca-on/bankrupt_in_year_checked
        - ca-on/return_filed_by_trustee_in_bankruptcy_checked
        - ca-on/not_claiming_ontario_tax_reduction_checked
      amounts: []
    produces:
      output: ca-on/tax_otherwise_payable_reduction_claimable
  # ON428 line 80 "Ontario tax reduction" for the tax otherwise payable: line 78 minus line 79
  # once if none of the five conditions applies, else "0".
  - name: core/times_count
    consumes:
      amount: ca-on/tax_otherwise_payable_reduction_before_conditions
      count: ca-on/tax_otherwise_payable_reduction_claimable
    produces:
      output: ca-on/tax_otherwise_payable_reduction
  # ON428 line 81 "Line 73 minus line 80 (if negative, enter "0")" with "0" on lines 70 and 72:
  # the provincial tax otherwise payable of Form T2036 note (4).
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca-on/tax_otherwise_payable_line_73
      less: ca-on/tax_otherwise_payable_reduction
    produces:
      output: ca-on/tax_otherwise_payable
  # Form T2036, Provincial or Territorial Foreign Tax Credit: line 1 "Enter the amount from
  # line 1 of Form T2209.", line 2 "Enter the amount from line 3 of Form T2209, unless you have
  # to pay minimum tax.(1)", line 3 "Line 1 minus line 2", line 4 "Net foreign non-business
  # income (2)" "× Provincial or territorial tax otherwise payable (4)" over "Net income (3)"
  # and line 5 "Enter whichever amount is less: line 3 or line 4." "Provincial or territorial
  # foreign tax credit", for each sheet of Form T2209 (a separate form for each country when
  # "the total of the non-business income taxes that you paid to all foreign countries was more
  # than $200"): "Enter the total from line 5 (for each country if applicable)" on ON428 line
  # 82, before the limit below. Line 2 note (1), when "you have to pay minimum tax" (Form T691
  # Part 5 line 11 positive) and "you were a resident of Ontario at the end of the year": "If the
  # total non-business income taxes you paid to all foreign countries is $200 or less", line 1 of
  # this form divided by "the sum of line 1 of this form and the amount on line 8 of Part 4 of
  # Form T691", times "the special foreign tax credit on line 11 of Part 4 of Form T691"; "If the
  # total non-business income taxes you paid to all foreign countries is more than $200", for
  # each country line 1 of that country divided by "the total foreign taxes paid for 2025 (to get
  # this total, add the amount on line 7 of Part 4 of Form T691, Alternative Minimum Tax, divided
  # by 66.6666% and the amount on line 8 of Part 4 of Form T691)", times the same line 11.
  - name: ca-on/provincial_foreign_tax_credit
    params:
      rounding: ca-on/provincial_foreign_tax_credit_rounding
      threshold: ca-on/provincial_foreign_tax_credit_separate_sheet_threshold
      rate: ca/amt_special_foreign_tax_credit_rate
    consumes:
      minimum_tax_applies: ca/amt_part_5_line_11_is_positive
      sheets: ca/foreign_tax_credit_sheets
      net_income: ca/foreign_tax_credit_net_income
      provincial_tax: ca-on/tax_otherwise_payable
      non_business_tax_paid: ca/amt_foreign_non_business_tax_two_thirds
      business_tax_paid: ca/amt_foreign_business_tax_paid
      special_foreign_tax_credit: ca/amt_special_foreign_tax_credit
    produces:
      total: ca-on/provincial_foreign_tax_credit_before_limit
  # ON428 line 82 "Provincial foreign tax credit (complete Form T2036)": Form T2036 line 5 "The
  # amount on line 5 should not be more than the amount entered on the line for provincial or
  # territorial tax otherwise payable." (note (4), ON428 line 81 with "0" on lines 70 and 72).
  - name: core/lesser_of
    consumes:
      amounts:
        - ca-on/provincial_foreign_tax_credit_before_limit
        - ca-on/tax_otherwise_payable
    produces:
      output: ca-on/provincial_foreign_tax_credit
  # ON428 line 83 "Line 81 minus line 82 (if negative, enter "0")".
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca-on/ontario_tax_after_reduction
      less: ca-on/provincial_foreign_tax_credit
    produces:
      output: ca-on/ontario_tax_after_foreign_tax_credit
