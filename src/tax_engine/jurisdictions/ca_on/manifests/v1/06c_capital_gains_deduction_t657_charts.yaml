capabilities:
  # Chart 2024 Period 1 amount A: "Maximum capital gains deduction for QFFP and/or QSBCS disposed of
  # in 2024 for Period 1" 508,418.00, a dataset.
  - name: core/credit_amount
    params:
      amount: ca/chart_2024_period_1_amount_a
    produces:
      output: ca/chart_2024_period_1_amount_a
  # Chart 2024 Period 1 "Amount A minus amount B" C (B "Enter the last amount that you calculated for
  # "Total amount of capital gains included in 2025 income eligible for the capital gains deduction" from
  # 2016 to 2023: Chart 2023's total carried, or "0" if no chart is completed. The form prints no
  # floor, so the result stays signed.
  - name: core/subtract
    consumes:
      amount: ca/chart_2024_period_1_amount_a
      less: ca/chart_2023_total_carried
    # B: "If you did not complete charts for 2016 to 2023, enter "0"." A blank B reads 0.
    blank:
      less: "0"
    produces:
      output: ca/chart_2024_period_1_amount_c
  # Chart 2024 Period 1 "Capital gains deduction available for dispositions of QFFP and/or QSBCS:
  # amount C minus amount D (if negative, enter "0")" E (D "Capital gains deductions from previous
  # years from line 19 of Chart 2").
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/chart_2024_period_1_amount_c
      less: ca/chart_2_line_19
    produces:
      output: ca/chart_2024_period_1_amount_e
  # Chart 2024 Period 1 "Add amounts F to H (if negative, enter "0")": F "Amount from line 6 of Form
  # T2017 (do not include reserves from dispositions of QFFP in any year or period other than Period
  # 1 of 2024)", G "Amount from line 12 of Form T2017 (do not include reserves from dispositions of
  # QSBCS in any year or period other than Period 1 of 2024)", H "Amount included in box 30 of a 2025
  # T3 slip and the footnote area indicates it is a reserve from property disposed of in Period 1 of
  # 2024."
  - name: core/sum_not_below_zero
    consumes:
      parts:
        - ca/t657_chart_2024_period_1_amount_f
        - ca/t657_chart_2024_period_1_amount_g
        - ca/t657_chart_2024_period_1_amount_h
    produces:
      output: ca/chart_2024_period_1_amounts_f_to_h
  # Chart 2024 Period 1 "= × 1/2 = I" (the amounts F to H, times the 1/2 printed on the form).
  - name: core/apply_fraction
    params:
      fraction: ca/t657_chart_2024_period_1_i_fraction
    consumes:
      base: ca/chart_2024_period_1_amounts_f_to_h
    produces:
      output: ca/chart_2024_period_1_amount_i
  # Chart 2024 Period 1 "Amount I minus amount J" K (J "Portion of the amount from line 17216 of Form
  # T2048 in respect of a reserve for a property disposed of in Period 1 of 2024"). The form prints no
  # floor, so the result stays signed.
  - name: core/subtract
    consumes:
      amount: ca/chart_2024_period_1_amount_i
      less: ca/t657_chart_2024_period_1_amount_j
    # A blank on either side blanks the result.
    blank:
      amount: pass_on
      less: pass_on
    produces:
      output: ca/chart_2024_period_1_amount_k
  # Chart 2024 Period 1 "Enter whichever is less: amount E or amount K." L.
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/chart_2024_period_1_amount_e
        - ca/chart_2024_period_1_amount_k
    produces:
      output: ca/chart_2024_period_1_amount_l
  # Chart 2024 Period 1 "Amount L plus amount M" N (M "Enter amount B from above.", Chart 2023's total
  # carried).
  - name: core/sum
    consumes:
      parts:
        - ca/chart_2024_period_1_amount_l
        - ca/chart_2023_total_carried
    produces:
      output: ca/chart_2024_period_1_amount_n
  # Chart 2024 Period 1 "Enter whichever is less: line 21 of Step 1, line 19 of Step 2 or amount N
  # above." O, the maximum for line 25400 when no later reserve or disposition is reported.
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/annual_gains_limit_2025
        - ca/cumulative_gains_limit_2025
        - ca/chart_2024_period_1_amount_n
    produces:
      output: ca/chart_2024_period_1_amount_o
  # Chart 2024 Period 2 amount A: "Maximum capital gains deduction for QFFP and/or QSBCS disposed of
  # in 2024 for Period 2" 625,000.00, a dataset.
  - name: core/credit_amount
    params:
      amount: ca/chart_2024_period_2_amount_a
    produces:
      output: ca/chart_2024_period_2_amount_a
  # Chart 2024 Period 2 "Amount A minus amount B" C (B "Enter the last amount that you calculated for
  # "Total amount of capital gains included in 2025 income eligible for the capital gains deduction" from
  # 2016 to 2024." is Period 1's amount N, the total carried into Period 2). The form prints no floor,
  # so the result stays signed.
  - name: core/subtract
    consumes:
      amount: ca/chart_2024_period_2_amount_a
      less: ca/chart_2024_period_1_amount_n
    # B: "If you did not complete charts for 2016 to 2024, enter "0"." A blank B reads 0.
    blank:
      less: "0"
    produces:
      output: ca/chart_2024_period_2_amount_c
  # Chart 2024 Period 2 "Capital gains deduction available for dispositions of QFFP and/or QSBCS:
  # amount C minus amount D (if negative, enter "0")" E (D "Capital gains deductions from previous
  # years from line 19 of Chart 2").
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/chart_2024_period_2_amount_c
      less: ca/chart_2_line_19
    produces:
      output: ca/chart_2024_period_2_amount_e
  # Chart 2024 Period 2 "Add amounts F to H (if negative, enter "0")": F, G and H as Period 1's, for a
  # disposition in Period 2 of 2024 ("Amount from line 6 of Form T2017 (do not include reserves from
  # dispositions of QFFP in any year or period other than Period 2 of 2024)").
  - name: core/sum_not_below_zero
    consumes:
      parts:
        - ca/t657_chart_2024_period_2_amount_f
        - ca/t657_chart_2024_period_2_amount_g
        - ca/t657_chart_2024_period_2_amount_h
    produces:
      output: ca/chart_2024_period_2_amounts_f_to_h
  # Chart 2024 Period 2 "= × 1/2 = I".
  - name: core/apply_fraction
    params:
      fraction: ca/t657_chart_2024_period_2_i_fraction
    consumes:
      base: ca/chart_2024_period_2_amounts_f_to_h
    produces:
      output: ca/chart_2024_period_2_amount_i
  # Chart 2024 Period 2 "Amount I minus amount J" K (J "Portion of the amount from line 17216 of Form
  # T2048 in respect of a reserve for a property disposed of in Period 2 of 2024"). The form prints no
  # floor, so the result stays signed.
  - name: core/subtract
    consumes:
      amount: ca/chart_2024_period_2_amount_i
      less: ca/t657_chart_2024_period_2_amount_j
    # A blank on either side blanks the result.
    blank:
      amount: pass_on
      less: pass_on
    produces:
      output: ca/chart_2024_period_2_amount_k
  # Chart 2024 Period 2 "Enter whichever is less: amount E or amount K." L.
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/chart_2024_period_2_amount_e
        - ca/chart_2024_period_2_amount_k
    produces:
      output: ca/chart_2024_period_2_amount_l
  # Chart 2024 Period 2 "Amount L plus amount M" N (M "Enter amount B from above.", Period 1's N).
  - name: core/sum
    consumes:
      parts:
        - ca/chart_2024_period_2_amount_l
        - ca/chart_2024_period_1_amount_n
    produces:
      output: ca/chart_2024_period_2_amount_n
  # Chart 2024 Period 2 "Enter whichever is less: line 21 of Step 1, line 19 of Step 2, or amount N
  # above." O, the maximum for line 25400 when no other disposition is reported.
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/annual_gains_limit_2025
        - ca/cumulative_gains_limit_2025
        - ca/chart_2024_period_2_amount_n
    produces:
      output: ca/chart_2024_period_2_amount_o
