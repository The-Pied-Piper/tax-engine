    produces:
      output: ca/chart_2023_part_2_amount_a
  # Chart 2023 Part 2 "Amount A minus amount B" C (B "Enter amount M from Part 1 of Chart 2023.").
  # The form prints no floor, so the result stays signed.
  - name: core/subtract
    consumes:
      amount: ca/chart_2023_part_2_amount_a
      less: ca/chart_2023_part_1_amount_m
    produces:
      output: ca/chart_2023_part_2_amount_c
  # Chart 2023 Part 2 "Capital gains deduction available for QFFP disposed of in 2023 included in
  # your 2025 income: amount C minus amount D (if negative, enter "0")" E (D as in Part 1).
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/chart_2023_part_2_amount_c
      less: ca/chart_2023_amount_d
    produces:
      output: ca/chart_2023_part_2_amount_e
  # Chart 2023 Part 2 "Amount from line 6 of Form T2017 (do not include reserves from dispositions
  # of QFFP in any year other than 2023)" × 1/2 = F (Part 1's F input).
  - name: core/apply_fraction
    params:
      fraction: ca/t657_chart_2023_part_2_f_fraction
    consumes:
      base: ca/t657_chart_2023_amount_f
    produces:
      output: ca/chart_2023_part_2_amount_f
  # Chart 2023 Part 2 "Amount included in box 30 of a 2025 T3 slip and the footnote area indicates
  # the QFFP was disposed of in 2023" × 1/2 = G.
  - name: core/apply_fraction
    params:
      fraction: ca/t657_chart_2023_part_2_g_fraction
    consumes:
      base: ca/t657_chart_2023_part_2_amount_g
    produces:
      output: ca/chart_2023_part_2_amount_g
  # Chart 2023 Part 2 "Amount F plus amount G" H.
  - name: core/sum
    consumes:
      parts:
        - ca/chart_2023_part_2_amount_f
        - ca/chart_2023_part_2_amount_g
    produces:
      output: ca/chart_2023_part_2_amount_h
  # Chart 2023 Part 2 "Enter whichever is less: amount E or amount H." I.
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/chart_2023_part_2_amount_e
        - ca/chart_2023_part_2_amount_h
    produces:
      output: ca/chart_2023_part_2_amount_i
  # Chart 2023 Part 2 "Amount I plus amount J" K (J "Enter amount B from above.", Part 1 amount M).
  - name: core/sum
    consumes:
      parts:
        - ca/chart_2023_part_2_amount_i
        - ca/chart_2023_part_1_amount_m
    produces:
      output: ca/chart_2023_part_2_amount_k
  # Chart 2023 Part 2 "Enter whichever is less: amount H or amount K." L.
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/chart_2023_part_2_amount_h
        - ca/chart_2023_part_2_amount_k
    produces:
      output: ca/chart_2023_part_2_amount_l
  # Chart 2023 Part 2 "Enter whichever is less: line 21 of Step 1, line 19 of Step 2 or amount L
  # above." M, the maximum for line 25400 if no other disposition is reported.
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/annual_gains_limit_2025
        - ca/cumulative_gains_limit_2025
        - ca/chart_2023_part_2_amount_l
    produces:
      output: ca/chart_2023_part_2_amount_m
  # Chart 2023 Part 2 is completed only when the filer reports a QFFP reserve, wants the additional
  # deduction and amount E of Part 1 is no more than the three amounts the form names (the
  # `t657_chart_2023_part_2_conditions` dataset: 1 when none of its conditions applies, else 0).
  - name: ca/count_by_conditions
    params:
      conditions: ca/t657_chart_2023_part_2_conditions
    consumes:
      counts:
        - ca/t657_chart_2023_claims_additional_deduction
      amounts:
        - ca/chart_2023_part_1_amount_e
        - ca/annual_gains_limit_2025
        - ca/cumulative_gains_limit_2025
        - ca/chart_2023_part_1_amount_m
    produces:
      output: ca/chart_2023_part_2_applies
  # The total carried forward: Part 2's amount L when Part 2 is completed, else Part 1's amount M
  # (the form: "Enter the last amount that you calculated" for the charts that follow).
  - name: core/choose_by_count
    consumes:
      count: ca/chart_2023_part_2_applies
      when_none: ca/chart_2023_part_1_amount_m
      when_any: ca/chart_2023_part_2_amount_l
    # Part 2 left blank reads as not completed (0): Part 1 is the last amount calculated. A blank
    # amount in either part still refuses: passing it on would blank the total even when the other
    # part is the one chosen.
    blank:
      count: "0"
    produces:
      output: ca/chart_2023_total_carried
