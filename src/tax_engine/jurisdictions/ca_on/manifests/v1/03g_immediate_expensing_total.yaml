# The immediate expensing total: one limit for the person across the statements of Forms T776,
# T2125, T2042 and T2121. Area A endnote 5 of each form: "The total immediate expensing amount for
# the tax year (total of column 9) is limited to the lesser of: the immediate expensing limit,
# which is equal to one of the following, whichever is applicable: $1.5 million, if you are not
# associated with any other eligible person or partnership (EPOP) in the tax year; amount iii of
# Area G, if you are associated with one or more EPOPs in the tax year; zero, if you are associated
# with one or more EPOPs and an agreement ... was not filed with the minister in a prescribed form;
# any amount allocated by the minister under subsection 1104(3.4) of the Regulations". Guides T4002
# and T4036: "The deduction is limited to $1.5 million per tax year". The forms print the limit for
# each statement and are silent on a person who files several statements; the Guides' "per tax
# year" is the only statement of the rule across statements. The steps read the claim and the limit
# each of the four forms exports, one record for each statement. The claim is the caller's column 9
# and stays an input: the check refuses a total above the limit and never picks the claim. The
# person's limit is read from the statements that claim something, so each form's claim list is
# read beside its limit list. The limits compared are those before the days scaling by each
# statement's fiscal period, so statements of periods of different lengths share one limit.
capabilities:
  # T776 line i "Total immediate expensing claim for the year: Total of column 9", over the
  # statements of the form.
  - name: core/record_total
    consumes:
      records: ca/t776.rental_immediate_expensing_claim
    produces:
      output: ca/rental_immediate_expensing_claims_total
  # T2125 Area A "Total immediate expensing claim for the year: Total of column 9", over the
  # statements of the form.
  - name: core/record_total
    consumes:
      records: ca/t2125.business_immediate_expensing_claim
    produces:
      output: ca/business_immediate_expensing_claims_total
  # T2042 Area A "Total immediate expensing claim for the year: Total of column 9", over the
  # statements of the form.
  - name: core/record_total
    consumes:
      records: ca/t2042.farm_immediate_expensing_claim
    produces:
      output: ca/farm_immediate_expensing_claims_total
  # T2121 Area A "Total immediate expensing claim for the year: Total of column 9", over the
  # statements of the form.
  - name: core/record_total
    consumes:
      records: ca/t2121.fish_immediate_expensing_claim
    produces:
      output: ca/fish_immediate_expensing_claims_total
  # The four forms' totals added: the person's total of column 9 for the tax year.
  - name: core/sum
    consumes:
      parts:
        - ca/rental_immediate_expensing_claims_total
        - ca/business_immediate_expensing_claims_total
        - ca/farm_immediate_expensing_claims_total
        - ca/fish_immediate_expensing_claims_total
    produces:
      output: ca/immediate_expensing_claims_total
  # The person's one limit, before the days scaling of each statement's fiscal period (each form
  # still refuses its own claim above its scaled limit): the common limit of the statements that
  # claim above 0, taken in the
  # order rental, business, farm, fish; statements whose limits disagree are refused. The limit is
  # 0 when no statement claims.
  - name: ca/immediate_expensing_agreed_limit
    consumes:
      rental_claims: ca/t776.rental_immediate_expensing_claim
      rental_limits: ca/t776.rental_immediate_expensing_limit_unprorated
      business_claims: ca/t2125.business_immediate_expensing_claim
      business_limits: ca/t2125.business_immediate_expensing_limit_unprorated
      farm_claims: ca/t2042.farm_immediate_expensing_claim
      farm_limits: ca/t2042.farm_immediate_expensing_limit_unprorated
      fish_claims: ca/t2121.fish_immediate_expensing_claim
      fish_limits: ca/t2121.fish_immediate_expensing_limit_unprorated
    produces:
      output: ca/immediate_expensing_agreed_limit
  # "The deduction is limited to $1.5 million per tax year": the total of column 9 of every
  # statement is refused when above the person's limit, not capped.
  - name: core/at_most
    consumes:
      amount: ca/immediate_expensing_claims_total
      bound: ca/immediate_expensing_agreed_limit
    produces:
      output: ca/immediate_expensing_total_claim
