# Form T657 (2025), the amounts the charts take "from line 6 / line 12 of Form T2017" for one year or
# period of disposition: each is Form T2017 line 6 "Line 1 minus line 5" (QFFP, lines 2 to 4) or line 12
# "Line 7 minus line 11" (QSBCS, lines 8 to 10) for only the dispositions the chart names ("do not include
# reserves from dispositions of QFFP in any year other than 2016"), the total, over those dispositions of the
# Form T2017 row forms, of each one's 2024 reserve less its 2025 reserve (`ca/t2017_row_change`). A
# disposition's year is 2025 less its years after the disposition; Period 1 and Period 2 of 2024 and the
# T5013 slip are the yes or no answers of its record. The dispositions each chart takes are the dataset
# `ca/t657_chart_NNNN_dispositions` (in the form's words), a count of each record of the lists read.
capabilities:
  # Chart 2016 Part 1 amount D "Amount from line 6 of Form T2017 (do not include reserves from
  # dispositions of QFFP in any year other than 2016)".
  - name: ca/t2017_reserve_total_for_period
    params:
      conditions: ca/t657_chart_2016_dispositions
    consumes:
      rows:
        - ca/t2017_line_2_reserve_rows
        - ca/t2017_line_3_reserve_rows
        - ca/t2017_line_4_reserve_rows
      amounts:
        - ca/t2017_line_2_reserve.t2017_row_change
        - ca/t2017_line_3_reserve.t2017_row_change
        - ca/t2017_line_4_reserve.t2017_row_change
    produces:
      total: ca/t657_chart_2016_amount_d
