# ON428 (2025) line 87's input, the qualifying food donations a salary-only caller does not give.
# Line 87 and line 62150: "Enter the amount of qualifying donations that have also been claimed as a
# charitable donation" (5006-c-25e). The 25% is computed by the line 87 part, not taken from the
# caller. A salary-only caller has no such donations, so a request that leaves the input out is read
# as 0, not blank.
# Box A of line 87 (the owner's naming); the 25% result is box B, in the line 87 part.
inputs:
  - name: ca-on/on428_qualifying_food_donations_line_87
    reference: "87 box A"
    unit: ca/cad
    required: false
    default: "0"
    basis: 'Line 87 and line 62150: Enter the amount of qualifying donations that have also been claimed as a charitable donation'
