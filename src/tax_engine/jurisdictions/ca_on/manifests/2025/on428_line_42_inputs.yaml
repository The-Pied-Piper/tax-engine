# ON428 (2025) line 42's input. Form ON428 (CRA 5006-c-25e): "Line 42 and line 58729: Allowable
# amount of medical expenses for other dependants (use Worksheet ON428)". The worksheet exists only
# to compute a claim a salary-only caller leaves empty, so the line is taken as one optional input,
# the way the form takes it. A request that leaves the line out is read as blank; the line 43
# step reads that blank as 0.
form:
  name: ca-on/on428
inputs:
  - name: ca-on/on428_other_dependants_medical_expenses_line_42
    title: "Allowable amount of medical expenses for other dependants (use Worksheet ON428)"
    reference: "42"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 42 and line 58729: Allowable amount of medical expenses for other dependants (use Worksheet ON428)'
