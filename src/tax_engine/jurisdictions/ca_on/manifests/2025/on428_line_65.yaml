# Form ON428 (Ontario Tax, 2025, 5006-c-25e) line 65 (ca-on/on428): "Line 65: Line 63 minus line 64
# (if negative, enter "0") =". Line 63 is a copy of line 61 and line 64 is a copy of line 54, so
# line 65 is line 61 less line 54, floored at 0. Line 54 is an optional input that a salary-only
# caller leaves out, read as blank and then as 0 by the blank rule below. Line 65 is the output
# `ca-on/on428_surtax_base_line_65`.
form:
  name: ca-on/on428
capabilities:
  - name: core/subtract_not_below_zero
    reference: "65"
    params:
      rounding: ca-on/cent_rounding
    consumes:
      amount: ca-on/on428_tax_after_minimum_tax_carryover_line_61
      less: ca-on/on428_tax_on_split_income_line_54
    blank:
      less: "0"
    produces:
      output: ca-on/on428_surtax_base_line_65
