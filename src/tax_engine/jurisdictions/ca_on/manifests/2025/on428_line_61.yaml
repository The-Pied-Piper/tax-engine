# Form ON428 (Ontario Tax, 2025, 5006-c-25e) line 61, "Line 61: Line 55 minus line 60 (if negative,
# enter "0") =": the Ontario tax after the minimum tax carryover. Line 55 is read from its source
# part, and line 60 is an optional input that a salary-only caller leaves out, read as blank and
# then as 0 by the blank rule of core/subtract_not_below_zero.
form:
  name: ca-on/on428
capabilities:
  - name: core/subtract_not_below_zero
    reference: "61"
    unit: ca/cad
    params:
      rounding: ca-on/cent_rounding
    consumes:
      amount: ca-on/on428_tax_with_split_income_line_55
      less: ca-on/on428_minimum_tax_carryover_line_60
    blank:
      less: "0"
    produces:
      output: ca-on/on428_tax_after_minimum_tax_carryover_line_61
