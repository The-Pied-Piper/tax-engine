# The Ontario take-home return's one output, T1 line 167 (refund or balance owing; positive is owing,
# negative is a refund). The T1 form exports it, another form's export is read only as a record list,
# so core/record_total totals the one amount into the return's own `ca/refund_or_balance_owing`.
capabilities:
  - name: core/record_total
    title: "Refund or balance owing"
    reference: "167"
    unit: ca/cad
    consumes:
      records: ca/t1_tax_and_credits.refund_or_balance_owing
    produces:
      output: ca/refund_or_balance_owing
# The Return summary's health premium slope: the rate of the ON428 line 89 chart row that the T1
# taxable income falls in, 0 for a flat row. The taxable income is totalled into the return's own
# kind, and the slope is read from the `ca-on/health_premium_rows` dataset. Neither is exported.
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca/t1_taxable_income.taxable_income
    produces:
      output: ca-on/return_taxable_income
  - name: core/amount_by_band_rate
    params:
      table: ca-on/health_premium_rows
    consumes:
      base: ca-on/return_taxable_income
    produces:
      output: ca-on/return_health_premium_slope
