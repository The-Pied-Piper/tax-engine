# The Ontario take-home return: T1 line 167 (refund or balance owing; positive is owing,
# negative is a refund). The T1 form exports it, another form's export is read only as a record
# list, so core/record_total totals the one amount into the return's own `ca/refund_or_balance_owing`.
#
# The second output is the marginal tax rate on the take-home basis: the change in T1 line 43500
# plus CPP (Schedule 8 lines 25, 12 and 22) plus EI (T2204 line 16) per further dollar of salary,
# for a salary-only filer with no paid credits. It is calculated with the rates of the forms, not by
# running the return twice: a sum of the rates that apply at the salary, one capability per line,
# every figure exact (`ca-on/exact_rounding` rounds nothing). No form prints any of these figures,
# so the steps below have no title and no line reference, and only line 167 carries a line
# reference.
#
# The federal half is the federal form `ca/take_home_marginal_rates` (imported by the manifest,
# after the T1 forms), which works from the salary alone. This return reads its four exports, each
# totalled by core/record_total into its own figure: the net income rate (`ca-on/marginal_net_income_
# rate`, the part of a further dollar left in the net income and the taxable income: 1 less the CPP
# first additional and second additional rates), the credit-earning contribution rate
# (`ca-on/marginal_credit_contribution_rate`, the CPP base rate plus the EI rate), the federal
# marginal rate (`ca-on/marginal_federal_rate`, the federal tax on a further dollar after its
# credits, counted only where the basic federal tax is above zero) and the contribution rate
# (`ca-on/marginal_contribution_rate`, the CPP base, first additional, second additional and EI
# rates). The rest is Ontario's own.
#
# Credits on the contributions. The CPP base contribution (T1 line 30800) and the EI premium (line
# 31200) earn the Ontario non-refundable credit rate (ON428 lines 19, 21 and 45, `ca-on/marginal_
# ontario_credit_rate`), so the credit-earning contribution rate times it is the Ontario tax a
# further dollar of contributions takes off. The dataset is exact: the cent rounding of
# `ca-on/credit_rate` is for the credit boxes.
#
# Ontario. The bracket rate (ON428 line 5 "Line 5: Rate", read from the ON428 export into
# `ca-on/ontario_bracket_rate_return`) times the net income rate, less the Ontario credit on the
# contributions, times the surtax factor (ON428 lines 66 and 67: `ca-on/surtax_factor` gives 1 plus
# the rate of each tier line 65 is over, line 65 read into `ca-on/ontario_surtax_base`). The Ontario
# tax reduction (ON428 lines 74 to 81, line 80 read into `ca-on/ontario_tax_reduction_return`) is
# phased out as income rises: while line 80 and line 81 are above 0, line 81 is 2 x line 73 - 588, so
# the tax rate counts twice: the reduction gate (`ca-on/ontario_reduction_gate`) times the rate with
# the surtax is the phase-out rate, which the sum adds. The surtax is charged before the LIFT credit
# (line 85) comes off at line 86, so the LIFT phase-out is added after the surtax and the reduction:
# the credit of Schedule ON428-A falls by the line 18 rate (5%, the `ca-on/marginal_lift_reduction_rows`
# band of the line 19 reduction, read into `ca-on/return_lift_reduction`) for each dollar of net
# income while the reduction is above 0 and the credit is not used up, which is more tax. The whole
# Ontario rate counts only where the Ontario tax after the LIFT credit (ON428 line 86, read into
# `ca-on/ontario_tax_after_lift_return`) is above zero, through the `ca-on/marginal_rate_gate`
# dataset (0 where that tax is 0.00 and 1 from one cent): where the LIFT credit takes all the tax a
# further dollar adds none. The credit's phase-in (line 4 "Applicable rate 5.05%" of the
# salary, to the line 5 maximum of $875, reached at $17,326.73) is not a step: for a salary-only filer the Ontario tax before the LIFT
# credit is 0 wherever the credit is below its $875 maximum (checked over the whole range in both
# years by the extra-run test), so the credit then absorbs all the tax and the gate is 0.
#
# Health premium. The rate of the ON428 line 89 chart row that the taxable income (T1 line 26000)
# falls in is read from `ca-on/health_premium_rows`: 0 for a flat row, 6% or 25% on a ramp; it is
# tax on taxable income, so it is multiplied by the net income rate.
#
# The last step adds the federal marginal rate, the Ontario marginal rate, the health premium rate
# and the contribution rate (the four contribution rates) with core/sum into
# `ca-on/marginal_tax_rate`; it is exact, is not printed on the form and has no title or line.
# Narrow bands (the Ontario health premium rows, the EI band near $2,000, the Ontario tax reduction)
# are slopes with a real rate inside each band, so the rate is exact there; the extra-run test steps
# a smaller amount near them.
capabilities:
  - name: core/record_total
    title: "Refund or balance owing"
    reference: "167"
    unit: ca/cad
    consumes:
      records: ca/t1_tax_and_credits.refund_or_balance_owing
    produces:
      output: ca/refund_or_balance_owing
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-on/on428.on428_surtax_base_line_65
    produces:
      output: ca-on/ontario_surtax_base
  - name: ca-on/surtax_factor
    params:
      line_66: ca-on/surtax_line_66
      line_67: ca-on/surtax_line_67
    consumes:
      base: ca-on/ontario_surtax_base
    produces:
      output: ca-on/ontario_surtax_factor
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca-on/on428.on428_bracket_column_rate_line_5
    produces:
      output: ca-on/ontario_bracket_rate_return
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca/t1_taxable_income.taxable_income
    produces:
      output: ca-on/return_taxable_income
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-on/health_premium_rows
    consumes:
      base: ca-on/return_taxable_income
    produces:
      output: ca-on/return_health_premium_slope
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca/take_home_marginal_rates.marginal_net_income_rate
    produces:
      output: ca-on/marginal_net_income_rate
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca/take_home_marginal_rates.marginal_credit_contribution_rate
    produces:
      output: ca-on/marginal_credit_contribution_rate
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca/take_home_marginal_rates.marginal_federal_rate
    produces:
      output: ca-on/marginal_federal_rate
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca/take_home_marginal_rates.marginal_contribution_rate
    produces:
      output: ca-on/marginal_contribution_rate
  - name: core/apply_rate
    unit: core/percent
    params:
      rate: ca-on/marginal_ontario_credit_rate
    consumes:
      base: ca-on/marginal_credit_contribution_rate
    produces:
      output: ca-on/marginal_ontario_contribution_credit_rate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-on/exact_rounding
    consumes:
      base: ca-on/ontario_bracket_rate_return
      rate: ca-on/marginal_net_income_rate
    produces:
      output: ca-on/marginal_ontario_bracket_rate
  - name: core/subtract
    unit: core/percent
    params:
      rounding: ca-on/exact_rounding
    consumes:
      amount: ca-on/marginal_ontario_bracket_rate
      less: ca-on/marginal_ontario_contribution_credit_rate
    produces:
      output: ca-on/marginal_ontario_rate_after_credits
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-on/exact_rounding
    consumes:
      base: ca-on/ontario_surtax_factor
      rate: ca-on/marginal_ontario_rate_after_credits
    produces:
      output: ca-on/marginal_ontario_rate_with_surtax
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-on/on428.on428_ontario_tax_reduction_line_80
    produces:
      output: ca-on/ontario_tax_reduction_return
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-on/marginal_rate_gate
    consumes:
      base: ca-on/ontario_tax_reduction_return
    produces:
      output: ca-on/ontario_reduction_gate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-on/exact_rounding
    consumes:
      base: ca-on/ontario_reduction_gate
      rate: ca-on/marginal_ontario_rate_with_surtax
    produces:
      output: ca-on/ontario_reduction_phase_out_rate
  - name: core/sum
    unit: core/percent
    params:
      rounding: ca-on/exact_rounding
    consumes:
      parts:
        - ca-on/marginal_ontario_rate_with_surtax
        - ca-on/ontario_reduction_phase_out_rate
    produces:
      output: ca-on/marginal_ontario_rate_with_reduction
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-on/on428_a.lift_reduction
    produces:
      output: ca-on/return_lift_reduction
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-on/marginal_lift_reduction_rows
    consumes:
      base: ca-on/return_lift_reduction
    produces:
      output: ca-on/marginal_lift_reduction_rate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-on/exact_rounding
    consumes:
      base: ca-on/marginal_lift_reduction_rate
      rate: ca-on/marginal_net_income_rate
    produces:
      output: ca-on/marginal_lift_phase_out_rate
  - name: core/sum
    unit: core/percent
    params:
      rounding: ca-on/exact_rounding
    consumes:
      parts:
        - ca-on/marginal_ontario_rate_with_reduction
        - ca-on/marginal_lift_phase_out_rate
    produces:
      output: ca-on/marginal_ontario_rate_after_lift
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-on/on428.on428_tax_after_lift_credit_line_86
    produces:
      output: ca-on/ontario_tax_after_lift_return
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-on/marginal_rate_gate
    consumes:
      base: ca-on/ontario_tax_after_lift_return
    produces:
      output: ca-on/ontario_rate_gate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-on/exact_rounding
    consumes:
      base: ca-on/marginal_ontario_rate_after_lift
      rate: ca-on/ontario_rate_gate
    produces:
      output: ca-on/ontario_marginal_rate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-on/exact_rounding
    consumes:
      base: ca-on/return_health_premium_slope
      rate: ca-on/marginal_net_income_rate
    produces:
      output: ca-on/marginal_health_premium_rate
  - name: core/sum
    unit: core/percent
    params:
      rounding: ca-on/exact_rounding
    consumes:
      parts:
        - ca-on/marginal_federal_rate
        - ca-on/ontario_marginal_rate
        - ca-on/marginal_health_premium_rate
        - ca-on/marginal_contribution_rate
    produces:
      output: ca-on/marginal_tax_rate
