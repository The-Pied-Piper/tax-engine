# The Ontario take-home return: T1 line 167 (refund or balance owing; positive is owing,
# negative is a refund). The T1 form exports it, another form's export is read only as a record list,
# so core/record_total totals the one amount into the return's own `ca/refund_or_balance_owing`.
#
# The return's second output is the average income tax rate, which no form prints (so its step has
# no title or reference): T1 line 43500 "Total payable" (for the take-home filer, line 143 plus
# line 147: the federal and the Ontario income tax) divided by the salary, T1 line 10100
# (`ca/employment_income`). T1 exports line 43500, so a core/record_total step reads it into the
# return's own `ca/total_payable`, then core/divide divides it by the salary, rounding once with
# `ca-on/rate_rounding` (half-up to 0.0001); a salary of 0 gives 0.
#
# Only line 167 carries a line reference: the steps below read figures for the rates and are
# engine-internal, so they carry none.
#
# The return also reads ON428 line 65, the surtax base (`ca-on/on428_surtax_base_line_65`), the same
# way (ON428 exports it), into its own `ca-on/ontario_surtax_base`. The next step gives the Ontario
# surtax factor: ON428 line 66 "(Line 65 minus $5,710) multiplied by 20%" and line 67 "(Line 65
# minus $7,307) multiplied by 36%" charge a rate on line 65 above each threshold, so the factor is 1
# plus the rate of each tier line 65 is over. The thresholds and rates are in the
# `ca-on/surtax_line_66` and `ca-on/surtax_line_67` datasets. The factor is a plain figure with no
# unit and not printed on the form, so it has no title. The next step reads ON428 line 5, the
# bracket column rate (`ca-on/on428_bracket_column_rate_line_5`, "Line 5: Rate"), the same way (ON428
# exports it), into its own `ca-on/ontario_bracket_rate_return`; it has no title of its own.
# The health premium slope is the rate of the ON428 line 89 chart row that the T1 taxable income
# falls in, 0 for a flat row. The taxable income is totalled into the return's own kind, and the
# slope is read from the `ca-on/health_premium_rows` dataset. The federal bracket rate is read the
# same way as the Ontario one: the T1 form exports line 73's bracket column rate
# (`ca/federal_bracket_column_rate_line_73`, "Line 73: Rate"), and a step totals the one fraction
# into its own `ca/federal_bracket_rate_return`, with no title or line of its own.
# The step after those multiplies the bracket rate by the surtax factor (lines 5, 66 and 67) into
# the Ontario bracket marginal rate. It is an exact product, a rate with no printed rounding rule,
# so the `ca-on/exact_rounding` dataset rounds nothing. It has no title.
# Each bracket rate counts only where its own tax is above zero. The T1 form exports line 42000
# "Net federal tax" (`ca/net_federal_tax`) and ON428 exports line 81, the Ontario tax after the
# personal credits and the Ontario tax reduction (`ca-on/on428_tax_after_tax_reduction_line_81`);
# the CRA payroll deductions formulas (T4127, January 2025 edition) apply both, so the Ontario part
# counts when that tax is positive. The LIFT credit is return-only and not stated in T4127, so it
# is not applied here, and line 90 adds the health premium, so it is not the base. Each tax is
# totalled into the return's own kind, and core/amount_by_band_rate reads it through the
# `ca-on/marginal_rate_gate` dataset (0 where the tax is 0.00, 1 from one cent) into a gate. The
# federal gate multiplies the federal bracket rate into `ca/federal_marginal_rate` and the Ontario
# gate multiplies the Ontario bracket marginal rate into `ca-on/ontario_marginal_rate`, both exact
# (`ca-on/exact_rounding`) and with no title or line. The last step adds the federal marginal rate,
# the Ontario marginal rate and the health premium slope with core/sum into
# `ca-on/marginal_tax_rate`, the income tax rate on a further dollar of salary; it is exact too, is
# not printed on the form and has no title or line.
# Known limit: the rate is the bracket rate gated on each tax being above zero. It still ignores
# the LIFT credit phase-out and the tax effect of CPP and EI.
capabilities:
  - name: core/record_total
    title: "Refund or balance owing"
    reference: "167"
    unit: ca/cad
    consumes:
      records: ca/t1_tax_and_credits.refund_or_balance_owing
    produces:
      output: ca/refund_or_balance_owing
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca/t1_tax_and_credits.total_payable
    produces:
      output: ca/total_payable
  - name: core/divide
    unit: core/percent
    params:
      rounding: ca-on/rate_rounding
    consumes:
      dividend: ca/total_payable
      divisor: ca/employment_income
    produces:
      output: ca-on/average_income_tax_rate
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-on/on428.on428_surtax_base_line_65
    produces:
      output: ca-on/ontario_surtax_base
  - name: ca-on/surtax_factor
    params:
      line_66: ca-on/surtax_line_66
      line_67: ca-on/surtax_line_67
    consumes:
      base: ca-on/ontario_surtax_base
    produces:
      output: ca-on/ontario_surtax_factor
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca-on/on428.on428_bracket_column_rate_line_5
    produces:
      output: ca-on/ontario_bracket_rate_return
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca/t1_taxable_income.taxable_income
    produces:
      output: ca-on/return_taxable_income
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-on/health_premium_rows
    consumes:
      base: ca-on/return_taxable_income
    produces:
      output: ca-on/return_health_premium_slope
  - name: core/record_total
    unit: core/percent
    consumes:
      records: ca/t1_tax_and_credits.federal_bracket_column_rate_line_73
    produces:
      output: ca/federal_bracket_rate_return
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca/t1_tax_and_credits.net_federal_tax
    produces:
      output: ca/net_federal_tax_return
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-on/marginal_rate_gate
    consumes:
      base: ca/net_federal_tax_return
    produces:
      output: ca/federal_rate_gate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-on/exact_rounding
    consumes:
      base: ca/federal_rate_gate
      rate: ca/federal_bracket_rate_return
    produces:
      output: ca/federal_marginal_rate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-on/exact_rounding
    consumes:
      base: ca-on/ontario_surtax_factor
      rate: ca-on/ontario_bracket_rate_return
    produces:
      output: ca-on/ontario_bracket_marginal_rate
  - name: core/record_total
    unit: ca/cad
    consumes:
      records: ca-on/on428.on428_tax_after_tax_reduction_line_81
    produces:
      output: ca-on/ontario_tax_after_reduction_return
  - name: core/amount_by_band_rate
    unit: core/percent
    params:
      table: ca-on/marginal_rate_gate
    consumes:
      base: ca-on/ontario_tax_after_reduction_return
    produces:
      output: ca-on/ontario_rate_gate
  - name: core/multiply_by_rate
    unit: core/percent
    params:
      rounding: ca-on/exact_rounding
    consumes:
      base: ca-on/ontario_rate_gate
      rate: ca-on/ontario_bracket_marginal_rate
    produces:
      output: ca-on/ontario_marginal_rate
  - name: core/sum
    unit: core/percent
    params:
      rounding: ca-on/exact_rounding
    consumes:
      parts:
        - ca/federal_marginal_rate
        - ca-on/ontario_marginal_rate
        - ca-on/return_health_premium_slope
    produces:
      output: ca-on/marginal_tax_rate
