# ON428 (2025) line 47's input, the amount from the federal Schedule 9. Form ON428 (CRA 5006-c-25e):
# "Line 47: Amount from line 13 of your federal Schedule 9 multiplied by 5.05% =". The line has two
# boxes: the amount (box A, the input here) and the multiplied result (box B, the step in
# on428_line_47.yaml). The engine does not compute Schedule 9, so the amount is taken as one optional
# input, the way the form takes it. A request that leaves the line out is read as blank; the step
# that multiplies it reads that blank as 0.
form:
  name: ca-on/on428
inputs:
  - name: ca-on/on428_donations_amount_line_47
    title: "Amount from line 13 of your federal Schedule 9"
    reference: "47 box A"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 47: Amount from line 13 of your federal Schedule 9'
