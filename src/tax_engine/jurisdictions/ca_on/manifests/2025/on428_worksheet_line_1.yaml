# Worksheet ON428 (2025, CRA 5006-d-25e), "Line 72 - Ontario additional tax for minimum tax purposes",
# line 1 (ca-on/on428), "Ontario basic additional tax: Line 1: Amount from line 11 of Part 5 of your
# Form T691 multiplied by 24.63% =". The amount is the T691's Part 5 line 11: the T691 owns the input
# and exports the line (`ca/t691_part_5_line_11_amount`), so the first step totals that export (a
# form reads another form's export only as a record list) and the second applies the rate. The 24.63%
# is the printed rate the form already holds for line 59 (`ca-on/minimum_tax_rate`). The line has two
# boxes: the amount (box A, the first step) and the multiplied result (box B, the second); the form
# does not name them, "box A" and "box B" are the owner's naming, as on line 59.
form:
  name: ca-on/on428
capabilities:
  - name: core/record_total
    title: "Amount from line 11 of Part 5 of your Form T691"
    reference: "72 worksheet line 1 box A"
    unit: ca/cad
    consumes:
      records: ca/t691.t691_part_5_line_11_amount
    produces:
      output: ca-on/on428_worksheet_t691_amount_line_1
  - name: core/apply_rate
    title: "Ontario basic additional tax"
    reference: "72 worksheet line 1 box B"
    unit: ca/cad
    params:
      rate: ca-on/minimum_tax_rate
    consumes:
      base: ca-on/on428_worksheet_t691_amount_line_1
    produces:
      output: ca-on/on428_worksheet_basic_additional_tax_line_1
