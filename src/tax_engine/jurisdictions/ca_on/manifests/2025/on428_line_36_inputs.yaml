# ON428 (2025) line 36's inputs. Form ON428 (CRA 5006-c-25e): "Line 36 and line 58689: See line 58689 at
# canada.ca/on-tax-info for maximum allowable amounts for attendant care, an adapted van, and moving
# expenses." The engine does not compute medical expenses, so the figure is taken as one optional
# input, the way the form takes it. CRA 5006-PC (section "Line 58689") gives the Ontario attendant
# care maximum only "if the amount you claimed for medical expenses on your return includes an
# amount for attendant care expenses that was limited to $10,000 ($20,000 in the year of death)",
# so four optional inputs follow: the attendant care expenses paid, a 0/1 answer that the federal
# claim was limited (attendant care only: the van and the move have printed federal limits and need no answer), and a 0/1 year of death, which has its own figures. The van and the
# move each take one optional amount, as the text prints a maximum for each. A request that leaves an input
# out is read as blank; the line 36 steps (on428_line_36.yaml) read that blank as 0, each category input through a
# core/sum step of its own, so no capped step reads a blank.
form:
  name: ca-on/on428
inputs:
  - name: ca-on/on428_medical_expenses_line_36
    title: "Maximum allowable amounts for attendant care, an adapted van, and moving expenses"
    reference: "36"
    unit: ca/cad
    required: false
    default: null
    basis: 'Line 36 and line 58689: See line 58689 at canada.ca/on-tax-info for maximum allowable amounts for attendant care, an adapted van, and moving expenses'
  - name: ca-on/on428_attendant_care_expenses_line_36
    unit: ca/cad
    required: false
    default: null
    basis: 'If the amount you claimed for medical expenses on your return includes an amount for attendant care expenses that was limited to $10,000 ($20,000 in the year of death), the maximum Ontario claim for attendant care expenses is $17,627 ($35,253 in the year of death)'
  - name: ca-on/on428_attendant_care_federal_limit_applied_line_36
    required: false
    default: null
    basis: 'If the amount you claimed for medical expenses on your return includes an amount for attendant care expenses that was limited to $10,000 ($20,000 in the year of death), the maximum Ontario claim for attendant care expenses is $17,627 ($35,253 in the year of death)'
  - name: ca-on/on428_adapted_van_expenses_line_36
    unit: ca/cad
    required: false
    default: null
    basis: 'The maximum Ontario claim for the cost of a van adapted for transporting a patient who requires the use of a wheelchair is $8,813'
  - name: ca-on/on428_patient_move_expenses_line_36
    unit: ca/cad
    required: false
    default: null
    basis: 'The maximum Ontario claim for moving expenses for a patient''s move to a more accessible dwelling is $3,525'
  - name: ca-on/on428_year_of_death_line_36
    required: false
    default: null
    basis: 'the maximum Ontario claim for attendant care expenses is $17,627 ($35,253 in the year of death)'
