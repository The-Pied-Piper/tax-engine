# Worksheet ON428 (2025, CRA 5006-d-25e), "Line 72 - Ontario additional tax for minimum tax purposes",
# line 4 (ca-on/on428): "(Line 3 Minus $5,710) multiplied by 20% (if negative, enter "0") =".
# Line 3 is `ca-on/on428_worksheet_surtax_base_line_3`. The worksheet prints the same threshold and rate
# as ON428 line 66, so it reads the same dataset (`ca-on/surtax_line_66`): one tiered surcharge,
# 20% of line 3 above $5,710, never below 0, rounded half-up to the cent. The worksheet's "If the
# amount on line 3 is more than $5,710, complete lines 4 to 9" needs no step: at or below $5,710 the
# tier gives 0, and lines 6 and 8 follow as 0.
form:
  name: ca-on/on428
capabilities:
  - name: core/tiered_surcharge
    reference: "72 worksheet line 4"
    unit: ca/cad
    params:
      tiers: ca-on/surtax_line_66
    consumes:
      base: ca-on/on428_worksheet_surtax_base_line_3
    produces:
      output: ca-on/on428_worksheet_surtax_20_percent_tier_line_4
