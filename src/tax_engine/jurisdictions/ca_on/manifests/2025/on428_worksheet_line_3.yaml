# Worksheet ON428 (2025, CRA 5006-d-25e), "Line 72 - Ontario additional tax for minimum tax purposes",
# lines 2 and 3 (ca-on/on428): "Line 2: Amount from line 65 of your Form ON428" and "Line 3: Line 1
# plus line 2 =". Line 2 is a copy of line 65, read from its source part
# (`ca-on/on428_surtax_base_line_65`), as line 65 reads line 61 for its line 63. Line 3 is line 1
# (`ca-on/on428_worksheet_basic_additional_tax_line_1`) plus that figure.
form:
  name: ca-on/on428
capabilities:
  - name: core/sum
    title: "Line 1 plus line 2"
    reference: "72 worksheet line 3"
    unit: ca/cad
    params:
      rounding: ca-on/cent_rounding
    consumes:
      parts:
        - ca-on/on428_worksheet_basic_additional_tax_line_1
        - ca-on/on428_surtax_base_line_65
    produces:
      output: ca-on/on428_worksheet_surtax_base_line_3
