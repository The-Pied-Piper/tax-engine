# Form ON428 (Ontario Tax, 2025, 5006-c-25e) line 72 (ca-on/on428), "Line 72: If you entered an amount
# on line 11 of Part 5 of Form T691, use Worksheet ON428 to calculate your additional tax for minimum
# tax purposes." and Worksheet ON428 (5006-d-25e) line 9, "Line 9: Line 1 plus line 8 Enter this amount
# on line 72 of your Form ON428.": the basic additional tax
# (`ca-on/on428_worksheet_basic_additional_tax_line_1`) plus the surtax on it
# (`ca-on/on428_worksheet_surtax_on_additional_tax_line_8`). The worksheet's "If the amount on line 3
# is not more than $5,710, enter the amount from line 1 on line 72" needs no step: line 8 is then 0.
# A filer with no T691 Part 5 line 11 has line 1 of 0 and line 8 of 0, so line 72 is 0. The output is
# `ca-on/on428_additional_tax_for_minimum_tax_line_72`, read by lines 73 and 80.
form:
  name: ca-on/on428
capabilities:
  - name: core/sum
    title: "Ontario additional tax for minimum tax purposes"
    reference: "72"
    unit: ca/cad
    params:
      rounding: ca-on/cent_rounding
    consumes:
      parts:
        - ca-on/on428_worksheet_basic_additional_tax_line_1
        - ca-on/on428_worksheet_surtax_on_additional_tax_line_8
    produces:
      output: ca-on/on428_additional_tax_for_minimum_tax_line_72
