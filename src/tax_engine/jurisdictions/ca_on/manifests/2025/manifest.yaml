# Ontario 2025 take-home manifest: the return's identity and its exports. The caller gives the
# gross salary and nothing else (salary.yaml). Ontario's own forms are in parts beside this one, so a
# line ticket adds only its own part file; the federal forms are imported by name below, their parts
# in the `ca` package (`ca/forms/<name>/`).
#
# The default form's exports are T1 line 167, refund or balance owing (positive is owing, negative
# is a refund), the federal marginal rate (the T1 line 73 bracket rate), the Ontario surtax factor
# (ON428 lines 66 and 67), the ON428 line 5 bracket rate and the health premium slope, which the
# marginal rate reads. The CPP and EI figures the calculator also needs are exported by their own forms (Schedule 8 and T2204,
# both imported); the calculator reads them from their forms.
jurisdiction: CA-ON
version: 1
valid_from_tax_year: 2025
# The title is the engine's own wording for the default form, not a printed form heading.
title: Return summary
outputs:
  - ca/refund_or_balance_owing
  - ca/federal_marginal_rate
  - ca-on/ontario_surtax_factor
  - ca-on/ontario_bracket_rate_return
  - ca-on/return_health_premium_slope
capabilities: []
imports:
  - ca/t1_taxable_income
  - ca/t1_tax_and_credits
  - ca/schedule_6
  - ca/schedule_8
  - ca/t2204
