# ON428 (2025) line 36 after the printed maximums. Form ON428 (CRA 5006-c-25e): "Line 36 and line
# 58689: See line 58689 at canada.ca/on-tax-info for maximum allowable amounts for attendant care, an
# adapted van, and moving expenses." CRA 5006-PC (section "Line 58689"): "the maximum Ontario claim
# for attendant care expenses is $17,627 ($35,253 in the year of death)", "The maximum Ontario claim
# for the cost of a van adapted for transporting a patient who requires the use of a wheelchair is
# $8,813" and "The maximum Ontario claim for moving expenses for a patient's move to a more
# accessible dwelling is $3,525".
#
# The filer's claim is the input of on428_line_36_inputs.yaml, and three optional inputs say how much
# of it is attendant care, the van and the move; a blank is read as 0 before the cap. Steps 1 and 2
# cap the attendant care at each printed maximum, step 3 checks the year of death answer (a blank
# read as 0, refused above 1) and step 4 chooses the figure. Steps 5 and 6 cap the van and the move.
# Steps 7 to 9 take each category less its allowed figure, the excess the maximum removes, step 10
# adds the three, and step 11 takes the claim less that sum. A result below 0 (a category larger than
# the claim) is refused, never floored. Only step 11 is the line, so only it has the reference "36";
# step 10 has a title alone, because the sentence of line 36 names it; the others are not lines of
# the form. Line 41 reads step 11.
form:
  name: ca-on/on428
capabilities:
  - name: core/capped_amount
    unit: ca/cad
    params:
      cap: ca-on/medical_expense_attendant_care_maximum
    consumes:
      base: ca-on/on428_attendant_care_expenses_line_36
    blank:
      base: "0"
    produces:
      output: ca-on/on428_attendant_care_at_ordinary_maximum_line_36
  - name: core/capped_amount
    unit: ca/cad
    params:
      cap: ca-on/medical_expense_attendant_care_death_maximum
    consumes:
      base: ca-on/on428_attendant_care_expenses_line_36
    blank:
      base: "0"
    produces:
      output: ca-on/on428_attendant_care_at_death_maximum_line_36
  - name: ca/yes_or_no_count
    consumes:
      count: ca-on/on428_year_of_death_line_36
    blank:
      count: "0"
    produces:
      output: ca-on/on428_year_of_death_checked_line_36
  - name: core/choose_by_count
    unit: ca/cad
    consumes:
      count: ca-on/on428_year_of_death_checked_line_36
      when_none: ca-on/on428_attendant_care_at_ordinary_maximum_line_36
      when_any: ca-on/on428_attendant_care_at_death_maximum_line_36
    produces:
      output: ca-on/on428_attendant_care_allowed_line_36
  - name: core/capped_amount
    unit: ca/cad
    params:
      cap: ca-on/medical_expense_adapted_van_maximum
    consumes:
      base: ca-on/on428_adapted_van_expenses_line_36
    blank:
      base: "0"
    produces:
      output: ca-on/on428_adapted_van_allowed_line_36
  - name: core/capped_amount
    unit: ca/cad
    params:
      cap: ca-on/medical_expense_patient_move_maximum
    consumes:
      base: ca-on/on428_patient_move_expenses_line_36
    blank:
      base: "0"
    produces:
      output: ca-on/on428_patient_move_allowed_line_36
  - name: core/subtract
    unit: ca/cad
    params:
      rounding: ca-on/cent_rounding
    consumes:
      amount: ca-on/on428_attendant_care_expenses_line_36
      less: ca-on/on428_attendant_care_allowed_line_36
    blank:
      amount: "0"
    produces:
      output: ca-on/on428_attendant_care_excess_line_36
  - name: core/subtract
    unit: ca/cad
    params:
      rounding: ca-on/cent_rounding
    consumes:
      amount: ca-on/on428_adapted_van_expenses_line_36
      less: ca-on/on428_adapted_van_allowed_line_36
    blank:
      amount: "0"
    produces:
      output: ca-on/on428_adapted_van_excess_line_36
  - name: core/subtract
    unit: ca/cad
    params:
      rounding: ca-on/cent_rounding
    consumes:
      amount: ca-on/on428_patient_move_expenses_line_36
      less: ca-on/on428_patient_move_allowed_line_36
    blank:
      amount: "0"
    produces:
      output: ca-on/on428_patient_move_excess_line_36
  - name: core/sum
    title: "Amount over the maximums for attendant care, an adapted van, and moving expenses"
    unit: ca/cad
    params:
      rounding: ca-on/cent_rounding
    consumes:
      parts:
        - ca-on/on428_attendant_care_excess_line_36
        - ca-on/on428_adapted_van_excess_line_36
        - ca-on/on428_patient_move_excess_line_36
    produces:
      output: ca-on/on428_medical_expenses_excess_line_36
  - name: core/subtract
    title: "Maximum allowable amounts for attendant care, an adapted van, and moving expenses"
    reference: "36"
    unit: ca/cad
    params:
      rounding: ca-on/cent_rounding
    consumes:
      amount: ca-on/on428_medical_expenses_line_36
      less: ca-on/on428_medical_expenses_excess_line_36
    blank:
      amount: "0"
    produces:
      output: ca-on/on428_medical_expenses_allowed_line_36
