# Form ON428 (Ontario Tax, 2025, 5006-c-25e) line 47 (ca-on/on428): "Line 47: Amount from line 13 of your
# federal Schedule 9 multiplied by 5.05% =". The 5.05% is a printed rate, held in the
# `ca-on/donations_credit_rate_line_47` dataset, so the step is one calculation: 5.05% of the Schedule 9
# amount, rounded half-up to the cent. The amount (box A) is read from the Schedule 9 export: the first step totals it (a form reads
# another form's export only as a record list). The line has two boxes: the amount (box A, the first step) and the multiplied
# result (box B, this step). The form does not name them; "box A" and "box B" are the owner's naming,
# as on line 87.
form:
  name: ca-on/on428
capabilities:
  - name: core/record_total
    title: "Amount from line 13 of your federal Schedule 9"
    reference: "47 box A"
    unit: ca/cad
    consumes:
      records: ca/schedule_9.donations_and_gifts_line_13
    produces:
      output: ca-on/on428_donations_amount_line_47
  - name: core/apply_rate
    reference: "47 box B"
    unit: ca/cad
    params:
      rate: ca-on/donations_credit_rate_line_47
    consumes:
      base: ca-on/on428_donations_amount_line_47
    blank:
      base: "0"
    produces:
      output: ca-on/on428_donations_credit_at_rate_line_47
