# NS428 (2025) input a salary-only caller does not give: the filer's year of birth.
# Line 10 "Age amount (if you were born in 1960 or earlier)" and line 98 "Age tax credit (if you were born in 1960 or earlier and your taxable income is less than $24,000)" (Form NS428, CRA 5003-C, PDF).
# The engine takes the year of birth (Umar, 27 Nov 2026) and works out "born in 1960 or earlier" itself (ns428_line_10.yaml). The year is a shared fact, the federal count `ca/birth_year`, entered once. A request that leaves it out is read as blank, and the lines that depend on it are 0.00.
form:
  name: ca-ns/ns428
inputs:
  - name: ca/birth_year
    title: "Year of birth"
    reference: "10"
    required: false
    default: null
    basis: 'Line 10 and line 98: if you were born in 1960 or earlier'
