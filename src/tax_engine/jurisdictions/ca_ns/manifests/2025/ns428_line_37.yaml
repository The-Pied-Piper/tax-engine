# Form NS428 (CRA 5003-C) line 37: "Add lines 32 to 36." Lines 34, 35 and 36 (tuition and
# education amounts, amounts transferred from a child or grandchild, amounts transferred from a
# spouse) are blank claims outside the salary-only scope and are not built: the one step adds line
# 32 and line 33 (the student loan interest, ns428_line_33.yaml) with core/sum. The form prints no
# label for line 37.
form:
  name: ca-ns/ns428
capabilities:
  - name: core/sum
    reference: "37"
    unit: ca/cad
    params:
      rounding: ca-ns/cent_rounding
    consumes:
      parts:
        - ca-ns/ns428_credits_subtotal_line_32
        - ca-ns/ns428_student_loan_interest_line_33
    produces:
      output: ca-ns/ns428_credits_subtotal_line_37
