# NS428 (2025) line 39 (Form NS428, CRA 5003-C): "Line 39: Amount from line 23600 of your return".
# It is the T1 net income (line 23600, floored), which reaches this form only as a record list
# (`ca/t1_taxable_income.net_income`), so its step is a core/record_total over it, as ca-sk/sk428_credits
# line 44 is. The form prints no label for the line, so the step has no title.
form:
  name: ca-ns/ns428
capabilities:
  - name: core/record_total
    reference: "39"
    unit: ca/cad
    consumes:
      records: ca/t1_taxable_income.net_income
    produces:
      output: ca-ns/ns428_net_income_line_39
