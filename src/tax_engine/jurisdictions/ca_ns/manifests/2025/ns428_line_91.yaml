# Form NS428 (Nova Scotia Tax, CRA 5003-C) line 91 "Line 89 minus line 90 (if negative, enter "0")". One core/subtract_not_below_zero step: line 89
# (`ca-ns/ns428_tax_line_89`) less line 90 (`ca-ns/ns428_labour_sponsored_credit_line_90`), not below 0, rounded half-up to the cent by the dataset's
# rule. Line 90 is always a figure (0.00 when blank), so nothing is blank. The form prints no title for the line, so the step has none. The output is
# `ca-ns/ns428_tax_line_91`.
form:
  name: ca-ns/ns428
capabilities:
  - name: core/subtract_not_below_zero
    reference: "91"
    unit: ca/cad
    params:
      rounding: ca-ns/cent_rounding
    consumes:
      amount: ca-ns/ns428_tax_line_89
      less: ca-ns/ns428_labour_sponsored_credit_line_90
    produces:
      output: ca-ns/ns428_tax_line_91
