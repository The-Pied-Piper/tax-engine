# Form NS428 (Nova Scotia Tax, CRA 5003-C) Part A, line 6, "Line 6: Line 4 multiplied by the
# percentage from line 5 =": the tax on the taxable income over the column's lower bound. Line 6 is
# line 4 times the printed rate of the column from line 5, rounded half-up to the cent by the
# dataset's rounding rule (the form states no rounding rule).
form:
  name: ca-ns/ns428
capabilities:
  - name: core/multiply_by_rate
    reference: "6"
    unit: ca/cad
    params:
      rounding: ca-ns/cent_rounding
    consumes:
      base: ca-ns/ns428_taxable_income_over_lower_bound_line_4
      rate: ca-ns/ns428_bracket_rate_line_5
    produces:
      output: ca-ns/ns428_tax_on_excess_line_6
