# Form NS428 (CRA 5003-C) line 45 and line 58769: "Line 43 plus line 44 =". Line 44 (the allowable
# amount of medical expenses for other dependants, Worksheet NS428) is a blank claim outside the
# salary-only scope and is not built: the one step is a core/sum over line 43 alone, as
# ca-sk/sk428_credits line 38 is. The form prints no label for line 45.
form:
  name: ca-ns/ns428
capabilities:
  - name: core/sum
    reference: "45"
    unit: ca/cad
    params:
      rounding: ca-ns/cent_rounding
    consumes:
      parts:
        - ca-ns/ns428_medical_expenses_over_limit_line_43
    produces:
      output: ca-ns/ns428_medical_expenses_line_45
