# Form NS428 (Nova Scotia Tax, CRA 5003-C) line 95 "Line 93 minus line 94 (if negative, enter "0")". One core/subtract_not_below_zero step: line 93
# (`ca-ns/ns428_tax_line_93`) less line 94 (`ca-ns/ns428_innovation_equity_tax_credit_line_94`), not below 0, rounded half-up to the cent by the dataset's
# rule. Line 94 is an optional input read as 0 when blank. The form prints no title for the line, so the step has none. The output is
# `ca-ns/ns428_tax_line_95`.
form:
  name: ca-ns/ns428
capabilities:
  - name: core/subtract_not_below_zero
    reference: "95"
    unit: ca/cad
    params:
      rounding: ca-ns/cent_rounding
    consumes:
      amount: ca-ns/ns428_tax_line_93
      less: ca-ns/ns428_innovation_equity_tax_credit_line_94
    blank:
      less: "0"
    produces:
      output: ca-ns/ns428_tax_line_95
