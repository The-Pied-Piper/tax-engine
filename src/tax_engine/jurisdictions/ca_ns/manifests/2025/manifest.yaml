# Nova Scotia 2025 take-home manifest: the return's identity and its exports (the refund or balance
# owing, the average income tax rate and the marginal tax rate). The caller gives the gross salary
# and nothing else. Nova Scotia's own form is in parts beside this one, so a line ticket adds only
# its own part file; the federal forms are imported by name below, their parts in the `ca` package
# (`ca/forms/<name>/`).
#
# Nova Scotia builds one form, NS428 (5003-C): `ca-ns/ns428`, whose line 99 supplies
# `ca/provincial_tax.amount` for T1 line 42800. Worksheet NS428 (5003-D), Form NS479 (5003-TC) and
# Schedules NS(S2) and NS(S11) are not built: for a salary-only filer they are blank or zero. The
# dividend tax credit, line 57, is one optional input.
#
# Stated assumptions, carried once here and not built as inputs: the filer was born in 1961 or
# later, so the age amount (NS428 line 10) and the age tax credit (line 98) are not built, and a
# filer born 1960 or earlier would get a lower tax than shown; the filer is a Nova Scotia resident
# on 31 December, 19 or older, and not confined to prison for more than six months (the guide's
# eligibility for the low-income tax reduction, lines 65 to 85).
#
# The default form's export is T1 line 167, refund or balance owing (positive is owing, negative
# is a refund). Nova Scotia uses the standard federal CPP and EI (no QPP), so Schedule 8 and T2204
# are imported unchanged. CRA publishes no Nova Scotia edition of the T1 or of Schedule 6 (the 5003-R
# and 5003-S6 text files were not found: 404 when tried), so the federal T1 and Schedule 6 are
# imported unchanged.
#
# Nova Scotia is listed in `registrations.JURISDICTIONS`: every listed jurisdiction is composed by
# `tests/application/services/test_every_resolvable_year.py`, and this manifest is complete, NS428
# line 99 supplying `ca/provincial_tax.amount` for T1. The return's rates are in `return.yaml`.
jurisdiction: CA-NS
version: 1
valid_from_tax_year: 2025
# The title is the engine's own wording for the default form, not a printed form heading.
title: Return summary
outputs:
  - ca/refund_or_balance_owing
  - ca-ns/average_tax_rate
  - ca-ns/marginal_tax_rate
capabilities: []
# Where the take-home answer reads its figures (the caller gives the salary and nothing else): the
# income tax is T1 line 43500, CPP and EI come from their own forms, and the rates are this return's.
take_home:
  salary: ca/employment_income
  income_tax: {form: ca/t1_tax_and_credits, kind: ca/total_payable}
  deductions:
    cpp_base: {form: ca/schedule_8, kind: ca/schedule_8_cpp_base_contributions_on_return}
    cpp_enhanced: {form: ca/schedule_8, kind: ca/cpp_part_3_line_12}
    cpp2: {form: ca/schedule_8, kind: ca/cpp_part_3_line_22}
    ei: {form: ca/t2204, kind: ca/t2204_line_16}
  average_tax_rate: {form: ca-ns/return, kind: ca-ns/average_tax_rate}
  marginal_tax_rate: {form: ca-ns/return, kind: ca-ns/marginal_tax_rate}
imports:
  - ca/t1_employment_income
  - ca/t1_taxable_income
  - ca/t1_tax_and_credits
  - ca/t1_lines_copied_by_provinces
  - ca/schedule_6
  - ca/schedule_8
  - ca/schedule_9
  - ca/t2204
  - ca/take_home_average_rate
  - ca/t691
  - ca/take_home_marginal_rates
