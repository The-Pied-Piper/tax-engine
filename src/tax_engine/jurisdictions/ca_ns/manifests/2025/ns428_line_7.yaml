# Form NS428 (Nova Scotia Tax, CRA 5003-C) Part A, line 7. Each of the five columns prints
# "Line 7: <figure>" (0.00, 2,681.57, 7,242.51, 13,055.01 and 23,339.23) under its column heading
# (the five columns of line 1 are listed in ns428_line_3.yaml). The step takes the figure of the
# column that line 1 falls in, as printed, and does not compute it from the rates. The form prints
# no title for line 7.
#
# Line 2 is a copy of line 1 and has no step of its own: line 7 reads line 1 directly.
form:
  name: ca-ns/ns428
capabilities:
  - name: core/bracket_column_tax_at_start
    reference: "7"
    unit: ca/cad
    params:
      schedule: ca-ns/brackets
    consumes:
      base: ca-ns/ns428_taxable_income_line_1
    produces:
      output: ca-ns/ns428_bracket_tax_at_start_line_7
