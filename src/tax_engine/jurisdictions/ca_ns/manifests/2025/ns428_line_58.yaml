# Form NS428 (Nova Scotia Tax, 2025, CRA 5003-C) line 58 (line 61540). "Nova Scotia minimum tax
# carryover:" / "Line 58: Amount from line 40427 of your return multiplied by 57.5% =".
# The 57.5% is a printed rate, held in the `ca-ns/minimum_tax_rate` dataset, so the line is one
# calculation: 57.5% of the amount, rounded half-up to the cent. The amount is the T1's line 40427:
# the T1 owns the input and exports the line (`ca/minimum_tax_carryover_line_40427`), so the first
# step totals that export (a form reads another form's export only as a record list) and the second
# applies the rate.
form:
  name: ca-ns/ns428
capabilities:
  - name: core/record_total
    title: "Amount from line 40427 of your return"
    reference: "58 box A"
    unit: ca/cad
    consumes:
      records: ca/t1_lines_copied_by_provinces.minimum_tax_carryover_line_40427
    produces:
      output: ca-ns/ns428_minimum_tax_carryover_amount_line_58
  - name: core/apply_rate
    title: "Nova Scotia minimum tax carryover"
    reference: "58 box B"
    unit: ca/cad
    params:
      rate: ca-ns/minimum_tax_rate
    consumes:
      base: ca-ns/ns428_minimum_tax_carryover_amount_line_58
    produces:
      output: ca-ns/ns428_minimum_tax_carryover_line_58
