# Form NS428 (CRA 5003-C) line 24: "Amount from line 31217 of your return". A copy of T1 line 31217,
# which the T1 lines copied by provinces form owns and exports (`ca/ei_premiums_on_self_employment_line_31217`), so the one step is core/record_total over that
# export (a form reads another form's export only as a record list), as
# ca-nl/nl428_credits line 30 does. A salary-only caller has no such amount, so the total is 0.
form:
  name: ca-ns/ns428
capabilities:
  - name: core/record_total
    title: "Amount from line 31217 of your return"
    reference: "24"
    unit: ca/cad
    consumes:
      records: ca/t1_lines_copied_by_provinces.ei_premiums_on_self_employment_line_31217
    produces:
      output: ca-ns/ns428_ei_premiums_line_24
