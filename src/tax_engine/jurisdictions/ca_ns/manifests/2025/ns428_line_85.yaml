# Form NS428 (Nova Scotia Tax, CRA 5003-C) line 85 "Line 77 minus line 84 (if negative, enter
# "0")". One core/subtract_not_below_zero step: line 77 (a copy of line 64, the tax after the
# foreign tax credit, `ca-ns/ns428_tax_after_credits_line_64`) less the low-income tax reduction of
# line 84, not below 0, rounded half-up to the cent by the dataset's rule. Both are always present,
# so the step has no blank rule. The form prints no title for the line, so the step has none. The
# output is `ca-ns/ns428_tax_line_85`, which a later line of the form reads.
form:
  name: ca-ns/ns428
capabilities:
  - name: core/subtract_not_below_zero
    reference: "85"
    unit: ca/cad
    params:
      rounding: ca-ns/cent_rounding
    consumes:
      amount: ca-ns/ns428_tax_after_credits_line_64
      less: ca-ns/ns428_low_income_reduction_line_84
    produces:
      output: ca-ns/ns428_tax_line_85
