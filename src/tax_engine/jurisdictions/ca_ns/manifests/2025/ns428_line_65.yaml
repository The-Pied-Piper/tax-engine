# Form NS428 (Nova Scotia Tax, CRA 5003-C) line 65, column 1 (you): "Net income from line 23600 of
# the return". It is the T1 net income (line 23600, floored), which reaches this form only as a
# record list (`ca/t1_taxable_income.net_income`), so its step is a core/record_total over it, as
# line 39 is. The form prints no brackets rule for this line, so the floored figure is the one read.
# Column 2 (your spouse or common-law partner) is not modelled yet (#1999).
form:
  name: ca-ns/ns428
capabilities:
  - name: core/record_total
    title: "Net income from line 23600 of the return"
    reference: "65 (column 1)"
    unit: ca/cad
    consumes:
      records: ca/t1_taxable_income.net_income
    produces:
      output: ca-ns/ns428_net_income_line_65
