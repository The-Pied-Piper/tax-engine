# Form NS428 (Nova Scotia Tax, CRA 5003-C) line 65, column 1 (you): "Net income from line 23600 of
# the return (or the amount you would have entered if the instructions on line 23600 said "if
# negative, show in brackets")". The T1 form exports the net income before its floor
# (`ca/t1_taxable_income.net_income_signed`), and another form reads an export only as a record
# list, so the one step is core/record_total over those records, as NL428 line 88 is. The result
# is signed, because the form asks for a negative net income shown in brackets. Column 2 (your
# spouse or common-law partner) is not modelled yet (deferred).
form:
  name: ca-ns/ns428
capabilities:
  - name: core/record_total
    title: "Net income from line 23600 of the return"
    reference: "65 (column 1)"
    unit: ca/cad
    consumes:
      records: ca/t1_taxable_income.net_income_signed
    produces:
      output: ca-ns/ns428_net_income_line_65
