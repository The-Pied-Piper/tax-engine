# NS428 (2025) line 90. Form NS428 (CRA 5003-C): "Labour-sponsored venture capital tax credit: Cost of shares from Form NSLSV ... multiplied by 20% (maximum $2,000)". The credit is the entered amount
# (ns428_line_90_input.yaml) times the printed rate (the `ca-ns/labour_sponsored_credit_rate` dataset), at most the printed
# maximum (the `ca-ns/labour_sponsored_credit_maximum` dataset). Three steps, the last of which is line 90. The
# first, core/credit_amount, supplies the printed maximum; it is not a line of the form, so it has
# no reference, and its title is plain words, not printed wording, because the sentence of line 90
# names it. The second, core/apply_rate, multiplies the amount by the rate, read as
# 0 when the line is left blank; it is engine-internal, so it has no reference. The third,
# core/at_most, is line 90: that product passed on unchanged. A product above the printed maximum
# is refused, not capped.
form:
  name: ca-ns/ns428
capabilities:
  - name: core/credit_amount
    title: "Most you can claim for labour-sponsored venture capital credits"
    unit: ca/cad
    params:
      amount: ca-ns/labour_sponsored_credit_maximum
    produces:
      output: ca-ns/ns428_labour_sponsored_credit_maximum
  - name: core/apply_rate
    title: "Cost of shares at 20%"
    unit: ca/cad
    params:
      rate: ca-ns/labour_sponsored_credit_rate
    consumes:
      base: ca-ns/ns428_labour_sponsored_shares_cost_line_90
    blank:
      base: "0"
    produces:
      output: ca-ns/ns428_labour_sponsored_credit_at_rate_line_90
  - name: core/at_most
    title: "Labour-sponsored venture capital tax credit"
    reference: "90"
    unit: ca/cad
    consumes:
      amount: ca-ns/ns428_labour_sponsored_credit_at_rate_line_90
      bound: ca-ns/ns428_labour_sponsored_credit_maximum
    produces:
      output: ca-ns/ns428_labour_sponsored_credit_line_90
