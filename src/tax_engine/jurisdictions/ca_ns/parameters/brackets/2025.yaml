# Nova Scotia 2025 brackets, Form NS428 (CRA 5003-C) Part A, lines 2 to 8, columns 1 to 5. Column
# headings: "Column 1: Line 1 is $30,507 or less"; "Column 2: Line 1 is more than $30,507 but not
# more than $61,015"; "Column 3: Line 1 is more than $61,015 but not more than $95,883"; "Column 4:
# Line 1 is more than $95,883 but not more than $154,650"; "Column 5: Line 1 is more than
# $154,650". In every column: line 3 the column's lower bound (0.00, 30,507.00, 61,015.00,
# 95,883.00, 154,650.00); line 5 the rate (8.79%, 14.95%, 16.67%, 17.5%, 21%); line 7 the printed
# constant (0.00, 2,681.57, 7,242.51, 13,055.01, 23,339.23). Lines 3, 5 and 7 are the printed
# figures; lines 2, 4, 6 and 8 are computed.
# Each bracket's `tax_at_start` is the line 7 constant of its column, taken as printed: the
# constants are not recomputed from the rates, and not rounded.
# This dataset has no rounding rule, as the form states none. The take-home build rounds line 6
# half-up to the cent in its own part (ca-ns/cent_rounding).
# There is no `up_to`: column 5 is unbounded ("more than $154,650"), and the form prints one set
# of five columns, so every line 1 falls in a column.
family: ca-ns/brackets
tax_year: 2025
kind: brackets
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5003-c/5003-c-25e.txt
rounding: none
brackets:
  - {from: "0.00", rate: "0.0879", tax_at_start: "0.00"}
  - {from: "30507.00", rate: "0.1495", tax_at_start: "2681.57"}
  - {from: "61015.00", rate: "0.1667", tax_at_start: "7242.51"}
  - {from: "95883.00", rate: "0.175", tax_at_start: "13055.01"}
  - {from: "154650.00", rate: "0.21", tax_at_start: "23339.23"}
