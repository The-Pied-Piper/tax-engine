name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Block private document paths
        # This repository is public. Fail if any tracked file, or any tracked
        # file's path, names the private document repository or the CRA form
        # folders. Each pattern has one letter in brackets so that this step
        # does not match itself. The committed blobs are scanned, and a scan that
        # errors fails the step too.
        run: |
          pattern='cra-do[c]s|docs/cra-form[s]|cra-forms-2[0]'
          found=0
          matches=$(mktemp)
          if git grep --cached -n -i -E -e "$pattern" > "$matches"; then
            found=1
            tr '\r' ' ' < "$matches"
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              echo "git grep failed with status $status" >&2
              exit "$status"
            fi
          fi
          paths=$(git ls-files) || exit 1
          if printf '%s\n' "$paths" | grep -i -E -e "$pattern"; then
            found=1
          fi
          if [ "$found" -ne 0 ]; then
            echo "Private document paths must not appear in this public repository (matches above: file:line:text, or a file path)." >&2
            exit 1
          fi

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.13.6"

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --python 3.12 --extra dev --locked

      - name: Lint
        run: uv run --locked --extra dev ruff check .

      - name: Check formatting
        run: uv run --locked --extra dev ruff format --check .

      - name: Type check
        run: uv run --locked --extra dev mypy src tests

      - name: Check import layers
        run: uv run --locked --extra dev lint-imports

      - name: Test
        run: uv run --locked --extra dev python -m pytest
