# Return GG: the three income lines of the Canada workers benefit's working income (Schedule 6
# lines 1 to 3) together: other employment income (T1 line 10400), taxable scholarships (T1 line
# 13010) and a T2125 profit (line 13500), with no employment income. Each one alone gives a CWB of
# 0 under the working income of the old reading; together they make working income of 8,000.00.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  Return GG: a 2025 Ontario resident in Canada throughout 2025, aged 18 or older, with no spouse
  and no dependants. Three income lines, chosen figures, and nothing else: other employment income
  of $3,000.00 (T1 line 10400, Schedule 6 line 1), taxable scholarships, fellowships, bursaries and
  artists' project grants of $2,000.00 (T1 line 13010, Schedule 6 line 2) and one Form T2125
  statement with a net profit of $3,000.00 (gross sales of $3,000.00 and no expenses, so line
  9369, line 9946 and T1 line 13500 are 3,000.00; Schedule 6 line 3, the net self-employment income
  of the statement). Employment income (T1 line 10100) is 0, with no CPP or EI deducted at source,
  and the self-employment CPP is not computed (Schedule 8 Part 5 is not completed, a chosen 0).
  Total income (line 15000) is 3,000.00 + 2,000.00 + 3,000.00 = 8,000.00, with no deductions, so
  net income (line 23600) and the adjusted family net income (Schedule 6 line 15) are 8,000.00.
  Schedule 6 Part A: line 1 is 0 + 3,000.00 = 3,000.00; line 2 is 2,000.00; line 3 is 3,000.00; line
  5 is 3,000.00 + 2,000.00 + 3,000.00 = 8,000.00, the working income, and line 6 (family working
  income, no eligible spouse) is also 8,000.00. Line 18 is 8,000.00 - 3,000.00 = 5,000.00 and line
  20 is 27% of it, 1,350.00, under the maximum of 1,633 (line 21, no eligible dependant), so line 22
  is 1,350.00. Line 25 is 8,000.00 - 26,855.00, below zero, so 0 and line 27 is 0, so line 28 and
  T1 line 45300 are 1,350.00 (the eligible dependant count is 0, so the line with no dependant is
  the one entered). The old reading counted none of the three, so it gave a CWB of 0; this return
  carries all three. Schedule 6 line 2 is 2,000.00 and line 3 is the
  statement's 3,000.00, neither under a loss.
  The other expected lines are not pinned here: the Ontario lines and the federal tax lines are
  the engine's, and the tests of this return check the CWB chain.
sources:
  - >-
    CRA, Schedule 6 (5000-S6) 2025, Part A, from the copy on PR #499 (docs/cra-forms-2025/5000-s6-25e.txt,
    not yet on main; https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s6/5000-s6-25e.txt):
    "Line 1: Employment income and other employment income from line 10100 and line 10400 of the
    return"; "Line 2: Taxable scholarships, fellowships, bursaries, and artists' project grants from
    line 13010 of the return"; "Line 3: Total self-employment income from lines 13500, 13700, 13900,
    14100, and 14300 of the return (excluding losses) (Note 2)"; "Line 5: Add lines 1 to 4. Enter the
    result, even if it is "0". Working income".
  - >-
    CRA, Form T2125 (2025), Statement of Business or Professional Activities (docs/cra-forms-2025/t2125-25e.pdf),
    as quoted in Return BB: "Gross sales, commissions, or fees (include GST/HST collected or collectible)"
    (3A) and the net income of line 9946 "report the net income amount ... business income on line 13500".
