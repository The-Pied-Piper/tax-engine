# Return FO: an Ontario resident with employment income of 250,000 who is not subject to
# alternative minimum tax in 2025 and applies a minimum tax carryover from earlier years. It
# computes Form T691 (alternative minimum tax) Parts 1 to 8 line by line, Part 8 being the
# carryover claim against the 2025 tax (the maximum, the amount applied, the balance and the
# amount for 2026), Form T2038(IND) (investment tax credit) Parts A to E with the claim limited
# by amount I (the minimum tax does not apply), a refund of the credit, and Form ON428 lines
# 56 to 61 (the Ontario carryover credit). Amounts are quoted decimal strings, never floats; counts
# are quoted digit strings. The figures are chosen (no CRA example exists) and worked out by hand
# from the form text, as the description shows.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single filer, an Ontario resident for all of 2025, with no spouse or common-law partner and no
  dependant, aged 18 or older at the end of 2025 and resident in Canada throughout 2025, with
  employment income (T4 box 14) of 250,000.00, Canada Pension Plan contributions at the 2025
  maximums (4,034.10 base and first additional, 396.00 second additional) and employment
  insurance premiums at the maximum 1,077.48 on 65,700.00. All figures are chosen. There is no
  other income and no capital gain, so total income (line 15000) is 250,000.00. The enhanced CPP
  contributions (line 22215) are 1% x 67,800.00 = 678.00 plus 396.00 = 1,074.00, so net income
  (line 23600) and taxable income (line 26000) are 250,000.00 - 1,074.00 = 248,926.00. Federal tax on
  taxable income (5006-R Part A, column 4) is 29% x (248,926.00 - 177,882.00) + 36,495.57 =
  20,602.76 + 36,495.57 = 57,098.33. The basic personal amount (Federal Worksheet, net income between
  177,882.00 and 253,414.00) is 14,538.00 + (1,591.00 - 71,044.00 / 75,532.00 x 1,591.00) =
  14,538.00 + 94.53 = 14,632.53. The credit amounts are that, the base CPP contributions 3,356.10
  (4.95% x 67,800.00), 1,077.48 and the Canada employment amount 1,471.00, 20,537.11 x 14.5% =
  2,977.88095, rounded half-up to 2,977.88 (lines 33800 and 35000).
  The filer has a minimum tax carryover from earlier years of 12,000.00 (Part 8 line 1) and an
  unapplied 2018 carryover of 3,000.00, and claims 8,000.00 against 2025 tax (T1 line 40427, a
  chosen amount not above line 12 of Part 8). Basic federal tax (line 42900) is 57,098.33 - 2,977.88 -
  8,000.00 = 46,120.45.
  Form T691 Part 1: line 1 is 248,926.00. Rental and leasing property: the filer claimed 7,000.00 of
  capital cost allowance and carrying charges (line 5) on income before them of 2,000.00 (line 6),
  so line 7 is 5,000.00 and line 12 is 253,926.00. With no capital gains, security options,
  limited partnership or other losses of other years, lines 27, 33, 34 and 44 are 253,926.00. Line 58
  is the enhanced CPP deduction of 1,074.00, so line 63 and line 78 are 1,074.00, line 80 is 50%
  of it, 537.00, and line 82 is 253,926.00 + 537.00 = 254,463.00. With no dividends, lifetime capital
  gains exemption or qualifying business transfer deduction, line 93 is 254,463.00 and line 95 is
  254,463.00 - 177,882.00 = 76,581.00. Line 97 is 20.5% x 76,581.00 = 15,699.105, rounded half-up to
  15,699.11. Line 98 is 50% x 2,977.88 = 1,488.94, there is no donation, logging or section 119
  credit, so line 102 is 1,488.94 and the minimum amount (line 103) is 15,699.11 - 1,488.94 =
  14,210.17.
  Part 2: line 5 is 57,098.33 - 2,977.88 = 54,120.45, line 6 is the carryover applied, 8,000.00, and
  line 7 is 46,120.45. Part 3: line 2 is 48% x 46,120.45 = 22,137.816, rounded half-up to 22,137.82;
  with no Form T2203 percentage and a resident of Canada, lines 3 and 4 are 0. Line 6 is 46,120.45, line
  7 (the foreign tax credit) and line 8 are 0, so line 10 is 46,120.45. The federal political
  contribution tax credit for contributions of 1,275.00 is the maximum 650.00, the labour-sponsored
  funds credit for a net cost of 2,000.00 is 15% x 2,000.00 = 300.00, and the investment tax credit
  on Part 3 line 12 is the whole claim of 10,000.00 (a chosen claim not above amount I), so line 14
  is 10,950.00 and line 15 is 46,120.45 - 10,950.00 = 35,170.45.
  Part 4 has no foreign income or tax. Part 5: line 3 is 14,210.17, line 6 is 35,170.45 and line 7
  is 0.00, so line 11 is 0.00 and the filer is not subject to alternative minimum tax. Part 6 (not
  used) gives 14,210.17 on line 14. Part 7: line 7 is 10,950.00, line 8 is 46,120.45 - 10,950.00 =
  35,170.45 and line 14 is 14,210.17 less 35,170.45, 0.00. Part 8: line 4 is 54,120.45 (line 2 plus the
  recapture of 0.00), line 8 is 10,950.00 (no tax on split income, no logging credit, line 41600 of
  10,950.00), line 9 is 43,170.45, line 10 is 14,210.17 and line 11, the maximum that can be applied in
  2025, is 28,960.28. Line 12, the lesser of line 1 (12,000.00) and line 11, is 12,000.00 as the
  maximum claim; the filer applies 8,000.00. Line 13 is 12,000.00 - 8,000.00 = 4,000.00, line 14 is 0.00,
  line 15 is 4,000.00 and line 17, less the unapplied 2018 carryover of 3,000.00, is 1,000.00 for 2026.
  Form T2038(IND): the filer has SR&ED expenditures of 40,000.00 (x 0.15 = 6,000.00) and qualified
  property of 30,000.00 (x 0.10 = 3,000.00), so amount A is 9,000.00, and flow-through critical mineral
  mining expenditures of 20,000.00 (x 0.30 = 6,000.00), so amount F is 6,000.00. Part D: amount 1 (the
  opening balance) is 15,000.00, amount 4 is 15,000.00, amount 5 is 30,000.00 and, less 2,000.00
  allocated to graduated rate estate beneficiaries, amount G is 28,000.00. Amount 9 is the federal tax
  (line 40600, 46,120.45) less the political credit, 45,470.45, and amount H is that less the
  labour-sponsored credit, 45,170.45, so amount I is the lesser of G and H, 28,000.00. The line 7 amount
  of Form T691 Part 5 is 0.00, so the filer continues at amount 15 and claims 10,000.00 (at most I, the
  claim limit; T1 line 41200); amount J (H + the foreign tax credit 0.00 - the minimum amount 14,210.17 =
  30,960.28) and amount K (the lesser of G and J, 28,000.00) are worked out but not used. Part E: amount
  3 is 28,000.00 - 15,000.00 = 13,000.00 and amount 6 is I less the opening balance, 13,000.00, so amount
  L, the credit available for carryback, is 0.00 and no carryback is requested. Amount 9 is 9,000.00 -
  2,000.00 = 7,000.00, amount 12 is 10,000.00 - 15,000.00 = -5,000.00, amount 14 is -5,000.00, amount 16
  is 0.00 (amount 14 less F, floored at 0) and amount N is 7,000.00; the filer designates 5,000.00 as a
  refund, which is 5,000.00 x 0.40 = 2,000.00 (T1 line 45400).
  Form ON428: the Ontario tax on taxable income (Part A, column 5) is 13.16% x (248,926.00 -
  220,000.00) + 20,957.60 = 3,806.6616, rounded half-up to 3,806.66, plus 20,957.60 = 24,764.26; the
  credits are 5.05% x (12,747.00 + 3,356.10 + 1,077.48) = 867.61929, rounded half-up to 867.62, so line 53
  (and lines 56 and 58, with no Ontario dividend tax credit) is 23,896.64. Line 59 is 24.63% x 8,000.00 =
  1,970.40, line 60 is the lesser of line 58 and line 59, 1,970.40, and line 61 is 23,896.64 - 1,970.40 =
  21,926.24. Worksheet ON428, with no minimum tax payable, has line 1 of 0.00, line 3 (line 2, the amount
  of ON428 line 65, 21,926.24) of 21,926.24, line 4 of 20% x (21,926.24 - 5,710.00) = 3,243.248, rounded
  half-up to 3,243.25 and line 5 of 36% x (21,926.24 - 7,307.00) = 5,262.9264, rounded half-up to 5,262.93,
  so line 6 is 8,506.18, which is also ON428 line 68 (line 7), and lines 8 and 9 are 0.00.
  The rest of Form ON428: line 62 is 21,926.24, line 69 is 21,926.24 + 8,506.18 = 30,432.42 and, with
  no dividend credit and no minimum tax (line 72 is 0.00), lines 71 and 73 are 30,432.42. The Ontario
  tax reduction (line 78, 2 x 294.00 = 588.00, less line 79) is 0.00, there is no provincial foreign tax
  credit, so lines 81 and 83 are 30,432.42. The LIFT credit (Schedule ON428-A Part A) is 5.05% x
  250,000.00 = 12,625.00, at most 875.00, less 5% x (248,926.00 - 32,500.00) = 10,821.30: 0.00, so lines
  86 and 88 are 30,432.42. The Ontario health premium (taxable income above 200,600.00) is 900.00, so the
  Ontario tax (line 90, T1 line 42800) is 31,332.42. Net federal tax (T1 line 42000) is line 41700,
  46,120.45 - 10,950.00 = 35,170.45, and the total payable (line 148) is 35,170.45 + 31,332.42 =
  66,502.87. The only credit among lines 150 to 165 is the refund of investment tax credit (line
  45400, 2,000.00): no tax was deducted, and there is no CPP or EI overpayment, medical expense
  supplement, Canada workers benefit (working income far above its limit) or provincial credit. The
  balance owing (line 167) is 66,502.87 - 2,000.00 = 64,502.87.
