# Return AL: a single 2025 Ontario resident, aged 20 (a chosen figure) and resident in
# Canada throughout 2025, with no employment income, whose only income is $10,000 of
# dividends other than eligible dividends from a private corporation controlled by a
# relative, all of it split income subject to the tax on split income (Form T1206). The
# dividends are received with no information slip (a chosen figure), so they are grossed
# up by the Federal Worksheet's line 15 "Applicable rate 115%" to 11,500.00, the amount on
# lines 12000 and 12010 of the T1 and in total income (line 15000). T1206 Part 1 takes
# lines 1 and 2 as 11,500 (the filer's classification under the form's pages 1 to 4, the
# caller's), line 3 as 0, and line 4 is 11,500; it joins T1 line 23200 as a part of the
# deductions (line 23300), so net income before adjustments (line 23400), net income (line
# 23600) and taxable income (line 26000) are 0.00 and the federal basic tax is 0.00. The
# TOSI-adjusted net income (line 6) is line 4 plus line 5, 11,500 + 0.00 = 11,500.00,
# which stands in for the net income in the basic personal amount (line 30000, 16,129.00
# as 11,500.00 is at or below 177,882), the age amount (line 30100), the adjusted family
# net income of Schedule 6 (line 7) and column 1 line 1 of the refundable medical expense
# supplement (line 45200). T1206 Part 2: line 8 is 33% of line 4, 3,795.00 (T1 lines
# 40424, 120 and 121); line 10 adds line 9 (line 41500, 0), line 14 is 14.5% of the
# disability amounts of lines 31600 and 31800 (a chosen 0 each), 0.00, so line 15 is
# 3,795.00; line 16 is the 11,500 of Part 1 line 1 and line 17 the 11,500 of line 2, so
# line 18 is 0.00, line 19 is 9.0301% x 11,500 = 1,038.4615, rounded half-up to the cent,
# 1,038.46, line 20 is 15.0198% of 0.00, 0.00 and line 21 is 1,038.46; line 22 is 3,795.00
# - 1,038.46 = 2,756.54 and line 24 the same (line 23, the foreign tax credit, is 0.00:
# no income from foreign sources). Line 29 is the federal tax less credits of the T1 (line 41700, 417.83) plus
# line 41500 (0), and line 30 is the greater of line 24 and line 29, 2,756.54, which, with
# the special taxes (line 41800, 0), is the net federal tax (line 42000). T1206 Part 3 is
# the Ontario side: line 33 (ON428 line 54, line 61510) is 20.53% x 11,500 = 2,360.95;
# lines 34 and 35 (the disability amounts of ON428 lines 58440 and 58480, a chosen 0 each)
# make line 36 0.00 and line 38 0.00, so line 39 is 2,360.95; line 42 is 10% of the 0.00 of
# line 18, and line 45 is 2.9863% of the 11,500 of line 2 = 343.4245, rounded half-up to
# the cent, 343.42, so line 46 is 343.42 and line 47 is 2,360.95 - 343.42 = 2,017.53,
# which is line 50 (line 49 is 0.00, no income from foreign sources). Line 51 is ON428 line 88, and line 52 the more
# of lines 50 and 51, 2,017.53, which is the Ontario tax before the health premium. The
# chart of line 23500
# does not apply (no old age security, EI benefits or net federal supplements), so line 23500 is 0 and
# line 23600 equals line 23400. T1206 line 33C is 2,360.95 / 5.05% = 46,751.49 (a declared
# output: nothing reads it). T1206 line 8A is 3,795.00 / 14.5% = 26,172.41, added to the taxable income
# on line 11 of Schedule 11. Amounts are quoted decimal strings, never
# floats; counts are quoted digit strings. A line or input this return leaves out
# is blank, 0, and is checked to compute to 0; intermediate lines that are listed are checked
# too.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025, resident in Canada throughout 2025, aged 20, a
  chosen figure (18 or older at the end of 2025, born in 1961 or later, so the age amount is
  not claimed), with no spouse or common-law partner and no dependants, with no employment
  income and dividends of $10,000.00 from a private corporation controlled by a relative,
  dividends other than eligible dividends received with no information slip (chosen
  figures), all of them split income. The grossed-up amount (Federal Worksheet line 16) is
  $10,000 x 115% = $11,500.00, on lines 12000 and 12010, so the taxable dividends and the
  total income (line 15000) are $11,500.00 and the taxable dividends other than eligible are
  $11,500.00. T1206 Part 1 lines 1 (68330), 2 (68340) and 4 (68360) are $11,500, a chosen
  classification, and line 3 is $0; line 4 is part of line 23200, so total deductions (line
  23300) are $11,500.00, the net income before adjustments (line 23400) is $11,500.00 -
  $11,500.00 = $0.00 and so are net income (line 23600) and taxable income (line 26000). The
  TOSI-adjusted net income (T1206 line 6) is $11,500 + $0.00 = $11,500.00. The CPP
  contributions and EI premiums are $0.00 with no employment income, as are the Canada
  employment amount and the working income. The basic personal amount (line 30000) is
  $16,129.00: $11,500.00 is $177,882 or less. The non-refundable credit amounts are that
  alone, $16,129.00; at 14.5% (line 33800) they are $2,338.705, rounded half-up to the cent:
  $2,338.71 (line 35000). The federal dividend tax credit (line 40425, Federal Worksheet)
  counts the dividends with no slip: line A is $11,500.00 and line B (line 12010) is
  $11,500.00, so line 6 is $11,500.00 x 9.0301% = $1,038.4615, rounded half-up to the cent:
  $1,038.46, line C is $11,500.00 - $11,500.00 = $0.00, line 7 is $0.00 x 15.0198% = $0.00,
  and line 40425 is $1,038.46 (no slip, so line 5 is $0). Line 125 is $2,338.71 + $1,038.46
  = $3,377.17. The federal tax on split income (T1206 line 8, T1 line 40424) is 33% x
  $11,500 = $3,795.00, so line 121 is the federal basic tax of $0.00 plus it, $3,795.00, and
  the basic federal tax (line 126, line 42900) is $3,795.00 - $3,377.17 = $417.83, as are
  lines 132 and 134 (no investment tax credit recapture, no logging tax credit) and the
  federal tax less credits (line 139, line 41700, with credits against the federal tax of
  $0.00). T1206 Part 2: line 7 is the $11,500; line 8 is $3,795.00; line 9 (line 41500) is
  $0, line 10 is $3,795.00; lines 11 (line 31600) and 12 (line 31800) are $0 (chosen: not
  disabled), line 13 is $0, line 14 is 14.5% x $0 = $0.00 and line 15 is $3,795.00 - $0.00 =
  $3,795.00; line 16 is $11,500 and line 17 is $11,500, line 18 is $0.00, line 19 is $11,500
  x 9.0301% = $1,038.4615, rounded half-up to the cent: $1,038.46, line 20 is $0.00 x
  15.0198% = $0.00 and line 21 is $1,038.46; line 22 is $3,795.00 - $1,038.46 = $2,756.54;
  line 8A is line 8 divided by 14.5%: $3,795.00 / 0.145 = $26,172.4137, rounded half-up to
  the cent: $26,172.41, which Schedule 11 adds to the amount on its line 11 (the taxable
  income of $0.00, at or below $57,375): $0.00 + $26,172.41 = $26,172.41, and line 13 is
  that less the credit amounts of line 101 (the basic personal amount, $16,129.00) =
  $10,043.41, line 14 (unused tuition from 2024, $0) is $0 and line 15 is $10,043.41;
  line 24 is line 22, $2,756.54 (line 23 is $0.00, no income from foreign sources); line 25 (line 40600) is $417.83,
  line 26 (line 41600) is $0.00, line 27 is $417.83, line 28 (line 41500) is $0 and line 29
  is $417.83; line 30 is the greater of $2,756.54 and $417.83: $2,756.54, and line 42000 is
  line 30 plus line 41800 ($0.00): $2,756.54, so the floor of line 24 applies here, because
  the dividend tax credit and the basic personal amount reduce the T1 tax below it. The
  Ontario side: the basic personal amount is $12,747 alone, at 5.05% (ON428 line 58840)
  $643.7235, rounded half-up to the cent: $643.72, off the Ontario basic tax of $0.00, so
  the Ontario tax on taxable income less the credits (ON428 line 53) is $0. The Ontario tax
  on split income (T1206 Part 3 line 33, ON428 line 54, line 61510) is 20.53% x the total
  split income of $11,500.00 = $2,360.95; the Ontario disability amounts of lines 34 and 35
  (ON428 lines 58440 and 58480) are a chosen $0 each, so line 36 and line 38 (5.05% of it)
  are $0.00 and line 39 is $2,360.95 - $0.00 = $2,360.95; line 42 is 10% of the $0.00 of
  line 18, $0.00, and line 45 is 2.9863% x the $11,500 of line 2 = $343.4245, rounded
  half-up to the cent: $343.42, so line 46 is $343.42 and line 47 is $2,360.95 - $343.42 =
  $2,017.53, as is line 50 (line 49 is $0.00, no income from foreign sources). Line 33C is line 33A (line 33, $2,360.95)
  divided by the 5.05% of line 33B (Chart C column 3): $2,360.95 / 0.0505 = $46,751.4851,
  rounded half-up to the cent: $46,751.49, a declared output that nothing on the return
  reads. The Ontario tax with the tax on split
  income (ON428 line 55) is $0.00 + $2,360.95 = $2,360.95. The surtax base (line 65) is
  line 63 (that $2,360.95) less line 64, the tax on split income (line 54, $2,360.95), not
  below zero: $0.00, so the surtax (lines 66 to 68) is $0.00 and the Ontario tax with
  surtax (line 69) is $2,360.95. The Ontario dividend tax credit (Worksheet ON428, line
  61520) reads the whole lines 12000 and 12010, $11,500.00 each: line 1 is $11,500.00 x
  2.9863% = $343.4245, rounded half-up to the cent: $343.42, line C is $0.00 and line 2 is
  $0.00, so line 61520 is $343.42, which comes off the Ontario tax with surtax, not below
  zero: $2,360.95 - $343.42 = $2,017.53. The Ontario tax reduction amounts (line 77) are
  the basic reduction of $294.00; twice them, $588.00, less $2,017.53 (line 79) is below
  zero, so the reduction (line 80) is $0.00 and the Ontario tax after it (line 81) is
  $2,017.53. The LIFT credit (ON428 line 85) is 5.05% of the employment income of $0,
  $0.00, and the qualifying donations for line 87 are a chosen $0.00, so lines 86 and 88
  are $2,017.53. T1206 line 51 is that line 88, and line 52 is the more of line 50
  ($2,017.53) and line 51 ($2,017.53): $2,017.53. The Ontario health premium (line 89) is
  read from its chart on the taxable income plus the total split income (T1206 line 4),
  $0.00 + $11,500.00 = $11,500.00, which is at or below $20,000: $0.00, so the Ontario tax
  (line 90) is line 52 plus it, $2,017.53. On the T1, the net
  federal tax (line 42000) is $2,756.54 and the total payable (line 43500) is $2,756.54 +
  $2,017.53 = $4,774.07. The refundable medical expense supplement (line 45200) is $0: the
  working income is $0 (employment income less lines 20700, 21200, 22900 and 23100 and the
  net self-employment income, each a chosen $0), under the $4,390 the worksheet asks for,
  and there is no amount on line 21500 or line 33200; its column 1 line 1 is the
  TOSI-adjusted net income, so lines 3, 5 and 6 are $11,500.00, under the $33,294.00 of line
  7 (line 8 is $0). The Canada workers benefit (line 45300, Schedule 6) is $0 with a working
  income of $0, and the adjusted family net income (line 15) is the TOSI-adjusted net
  income, $11,500.00, under $26,855. The income tax deducted (line 43700) is a chosen $0:
  the corporation withholds nothing from the dividends. The total credits (line 48200) are
  $0, and the refund or balance owing (line 167) is the total payable less them, $4,774.07 -
  $0 = $4,774.07: positive, so a balance owing, and the refund (line 48400) and the net
  refund (line 46600) are $0. Every amount computed from a rate, fraction, amount or chart
  on the forms is rounded half-up to the cent, each line being a dollars-and-cents box; here
  that changes the federal non-refundable tax credits, the federal and Ontario dividend tax
  credits, the Ontario non-refundable tax credits and the lines that follow from them. The
  lines that only add, subtract, compare or choose take amounts already in cents, so the
  refund or balance owing is in cents too. No capital gain, unused or new RRSP contribution,
  union dues, child care expenses, medical expenses, donations, political contributions,
  flow-through shares or work placements (each a chosen $0 or empty), so the other credits
  and the Ontario credits are $0.00. The age amount (line 30100), the spouse or common-law
  partner amount (line 30300) and the Canada caregiver amount for a spouse or common-law
  partner (line 30425) are each $0: the filer is taken as born in 1961 or later, claims no
  spouse amount (count 0) and has no spouse eligible for the Canada caregiver amount (line
  51090, count 0), and the spouse's net income entered is $0 (to be confirmed).
