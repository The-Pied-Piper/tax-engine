  - >-
    The figures that depend on income, with the forms quoted in Return AP: T1 (form
    5000-R) line 77 (line 30000) is $16,129 for net income of $177,882 or less, so the
    federal credit amounts (line 33500) are 16,129.00 and line 33800 is 16,129.00 x
    14.5% = 2,338.705, rounded half-up to the cent: 2,338.71 (line 35000, no Schedule 9
    amounts). Part A "Federal tax on taxable income": taxable income of 30,000.00 is in
    column 1 "Line 26000 is $57,375 or less": line 74 is 30,000.00 x 14.5% = 4,350.00,
    so the federal tax is 4,350.00 and, less 2,338.71, the federal tax after credits is
    2,011.29. The medical share, 3% of net income, is 900.00 and the threshold, the
    lesser of that and $2,834, is 900.00, above the medical expenses of 0. ON428 Part A:
    30,000.00 x 5.05% = 1,515.00; the Ontario credit amounts are the basic personal
    amount 12,747.00, and 12,747.00 x 5.05% = 643.7235, rounded half-up to the cent:
    643.72, so the Ontario tax after credits is 1,515.00 - 643.72 = 871.28. The basic
    reduction is 294.00, twice it, 588.00, less the tax of 871.28 is negative, so the
    Ontario tax reduction is 0 and the tax after it 871.28. Schedule ON428-A: the LIFT
    credit is 5.05% of employment income, 0, less 5% of the net income over $32,500,
    30,000.00 is not over it, so 0. The Ontario health premium chart, taxable income
    30,000.00, is in "Row 3: Taxable Income more than $25,000 but not more than
    $36,000": "Ontario health premium: $300", so the Ontario tax (line 42800) is 871.28
    + 300.00 = 1,171.28. Schedule 6: the working income is the employment income of 0,
    so the Canada workers benefit is 0 whatever the reduction (15% of the adjusted
    family net income, 30,000.00, over $26,855, 471.75 for a filer with no eligible
    spouse or dependant, 0.00 with one, over $30,639). T1 line 148 (line 43500) is the
    net federal tax 2,011.29 plus the Ontario tax 1,171.28 = 3,182.57, with no CPP or EI
    payable, no tax deducted and no credits (line 150 and the lines to 166 being 0), so
    line 167, the refund or balance owing, is 3,182.57 - 0.00 = 3,182.57, a balance
    owing. These lines add and subtract amounts already in cents. The other credits and
    lines (the age, spouse, dependant and caregiver amounts, the Ontario credits and the
    refundable credits) are 0 for the same chosen counts and amounts as Return AP.
