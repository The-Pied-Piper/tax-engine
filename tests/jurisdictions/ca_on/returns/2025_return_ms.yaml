# Return MS: Return BB (one Form T2125 business statement, net income 30,000.00 on T1 line 13500)
# for a filer who already elected a fiscal period that does not end on December 31 and files Form
# T1139. The business's net income for the fiscal period ending in 2025 is Return BB's 30,000.00
# (amount A); 275 of the 365 days of the period came after it, so formula B gives additional
# business income of 30,000.00 x 275 / 365 = 22,602.74 (amount D); last year's Form T1139 showed
# the same 22,602.74 (amount F), so amount G, the net income to report on line 13500, is
# 30,000.00 + 22,602.74 - 22,602.74 = 30,000.00 and every figure of the return is Return BB's.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  Return MS: Return BB with Form T1139 (amounts A, B, D, E, F and G below), the fiscal period of
  the business not ending on December 31. A single Ontario resident for all of 2025 whose only
  activity is a business, reported on one Form T2125: gross sales of $50,000 (amount 3A), expenses of $16,000 on seven
  lines and capital cost allowance of $2,000 on Class 8 (Area A, line 9936), so line
  8299 and T1 line 13499 are $50,000.00, line 9369 is $32,000.00, and, after $2,000 of
  business-use-of-home expenses, line 9946 and T1 line 13500 are $30,000.00. A chosen
  set of figures. The motor vehicle expenses (line 9281, $2,500) are Charts A to C for one
  leased passenger vehicle used half for business (see the sources). The net self-employment
  income (T1 line 27, "Add lines 22 to 26") is
  30,000 + 0 + 0 + 0 + 0 = $30,000; line 28 is line 21 (0) plus line 27 and total income
  (line 15000) adds line 27 to the other income lines, which are all 0, so total income
  is $30,000.00. The CPP months (Schedule 8 box A) are the 12 of a full year, Schedule 8
  Part 4 is not completed (count 0) and there is no agreement with the Canada Employment
  Insurance Commission (count 0), so the CPP contributions payable (line 42100), the
  base CPP contributions (line 31000) and the deduction (line 22200) on self-employment
  income, and the EI premiums on it (lines 31217 and 42120), are $0 and change no total.
sources:
  - >-
    CRA, Form T1139 (2025), "Reconciliation of 2025 Business Income for Tax Purposes"
    (docs/cra-forms-2025/t1139-25e.pdf), Part 2: "Net income (loss) for your fiscal period ending in
    2025 (if applicable)" (A); "Number of days in 2025 that you carried on the business after your
    fiscal period ending in 2025 up to December 31, 2025" (2E); "Number of days that you carried on
    the business in your fiscal period ending in 2025" (2F); "Amount 2E divided by amount 2F" (2G);
    "Amount 2D multiplied by amount 2G" (B); Part 4: "Additional business income: Enter either
    amount B, C, or 3H based on the formula you used above" (D); "Subtotal: Amount A plus amount D"
    (E); "Last year's additional business income: Enter amount D from last year's Form T1139" (F);
    "Net income (loss) of the business: Amount E minus amount F (report this amount on the
    appropriate line of your income tax and benefit return)" (G); "Report amount G as
    self-employment income on your return: For business income, enter it at line 13500". Amount A is
    "the amount found on line 9946" of Return BB's Form T2125, 30,000.00 (the statement the form
    names by its position, 1). Return BB has no capital gains deduction (amounts 2A and 2B are 0),
    so amount 2C is the lesser of 0 and 0, 0, and amount 2D is 30,000.00 - 0 = 30,000.00. Days:
    2E = 275, 2F = 365, so amount 2G is 275 / 365 and amount B is 30,000.00 x 275 / 365 =
    22,602.739..., rounded half up to the cent once: 22,602.74. Amount D is amount B (amount C and
    amount 3H are 0, the formulas not used), so D = 22,602.74, amount E is 30,000.00 + 22,602.74 =
    52,602.74, amount F is the 22,602.74 of last year's form (an entered figure), and amount G is
    52,602.74 - 22,602.74 = 30,000.00, which replaces the 30,000.00 of line 9946 on line 13500.
  - >-
    CRA, Form T2125 (2025), Statement of Business or Professional Activities
    (docs/cra-forms-2025/t2125-25e.pdf, a PDF quote accepted 2026-10-19;
    https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2125/t2125-25e.pdf), Part
    3A: "Gross sales, commissions, or fees (include GST/HST collected or collectible)"
    (3A); "GST/HST, provincial sales tax, returns, allowances, discounts, and GST/HST
    adjustments (included in amount 3A)" (3B); "Subtotal: Amount 3A minus amount 3B"
    (3C); "Subtotal: Amount 3D minus amount 3E" (3F); "Adjusted gross sales: Amount 3C
    plus amount 3F (enter on line 8000 of Part 3C)" (3G). Part 3C: "Reserves deducted
    last year" (8290); "Other income (specify)" (8230); "Subtotal: Line 8290 plus line
    8230" (3O); "Gross business or professional income: Line 8000 plus amount 3O"
    (8299); "Report the gross business or professional income from line 8299 on the
    applicable line of your income tax and benefit return as indicated below: business
    income on line 13499". Part 3D: "Gross business income (line 8299 of Part 3C)" (3P);
    "Subtotal: Add amounts 3Q to 3U." (3V); "Cost of goods sold: Amount 3V minus line
    8500" (8518); "Gross profit (or loss): Amount 3P minus line 8518." (8519). Part 4:
    "Gross business or professional income (line 8299 of Part 3C) or Gross profit (line
    8519 of Part 3D)." (4A); the expenses (enter only the business part) 4B
    "Advertising", 4E "Insurance", 4H "Office expenses", 4J "Professional fees (includes
    legal and accounting fees)", 4L "Rent", 4Q "Utilities" and 4T "Motor vehicle
    expenses (not including CCA) (amount 16 of Chart A)"; "Capital cost allowance (CCA).
    Enter amount ii of Area A minus any personal part and any CCA for
    business-use-of-home expenses" (9936, 4U); "Other expenses (specify)" (9270, 4V);
    "Total expenses: Total of amounts 4B to 4V" (9368); "Net income (loss) before
    adjustments: Amount 4A minus line 9368" (9369). Part 5: "Your share of line 9369 or
    the amount from your T5013 slip, Statement of Partnership Income." (5A); "Canadian
    journalism labour tax credit allocated to you in the year (box 236 of your T5013
    slip)" (5B); "GST/HST rebate for partners received in the year" (9974); "Total:
    Amount 5A plus amount 5B plus line 9974" (5C); "Other amounts deductible from your
    share of net partnership income (loss) (amount 6F)" (9943); "Net income (loss) after
    adjustments: Amount 5C minus line 9943" (5D); "Business-use-of-home expenses (amount
    7P)" (9945); "Your net income (loss): Amount 5D minus line 9945" (9946); "Report the
    net income amount from line 9946 on the applicable line of your income tax and
    benefit return as indicated below: business income on line 13500". Part 6: "Total
    other amounts deductible from your share of the net partnership income (loss): Add
    amounts 6A to 6E (enter this on line 9943 of Part 5)." (6F). Part 7: "Heat" (7A),
    "Electricity" (7B), "Insurance" (7C), "Maintenance" (7D), "Property taxes" (7F),
    "Subtotal: Add amounts 7A to 7G." (7H), "Personal-use part of the
    business-use-of-home expenses" (7I), "Subtotal: Amount 7H minus amount 7I" (7J),
    "Subtotal: Add amounts 7J to 7L." (7M), "Net income (loss) after adjustments (amount
    5D) (if negative, enter "0")." (7N), "Business-use-of-home expenses available to
    carry forward: Amount 7M minus amount 7N (if negative, enter "0")" (7O) and
    "Allowable claim: Amount 7M or 7N above, whichever is less (enter your share of this
    amount on line 9945 of Part 5)" (7P). Area A, "Calculation of capital cost allowance
    (CCA) claim": "Column 2: Undepreciated capital cost (UCC) at the start of the year",
    "Column 7: UCC after additions and dispositions", "Column 19: Base amount for CCA",
    "Column 20: CCA rate %", "Column 21: CCA for the year", "Column 22: UCC at the end
    of the year" and "Total CCA claim for the year: Total of column 21 (enter on line
    9936 of Part 4 amount ii minus any personal part and any CCA for
    business-use-of-home expenses)" (amount ii); endnote 3: "If you have a negative
    amount in column 7, add it to income as a recapture in Part 3C on line 8230. If no
    property is left in the class and there is a positive amount in this column, deduct
    the amount from income as a terminal loss in Part 4 on line 9270.". The sales are a
    chosen $50,000 and the adjustments (3B), the quick method amounts (3D, and 3E which
    the caller enters), the reserves, the other income, the cost of goods sold lines and
    every other expense line are a chosen $0: amount 3C is 50,000 - 0 = 50,000, 3F is 0
    - 0 = 0, 3G, and so line 8000, is 50,000 + 0 = 50,000. With no recapture line 8230
    is 0 + 0 = 0, amount 3O is 0 + 0 = 0 and line 8299, and so T1 line 13499, is 50,000
    + 0 = 50,000. Amount 3P is 50,000; amount 3V is 0 + 0 + 0 + 0 + 0 = 0, line 8518 is
    0 - 0 = 0 and line 8519, and so amount 4A, is 50,000 - 0 = 50,000. The seven expense
    lines are chosen figures: advertising (line 8521) 1,500, insurance (line 8690)
    1,200, office expenses (line 8810) 800, professional fees (line 8860) 2,500, rent
    (line 8910) 6,000, utilities (line 9220) 1,500 and motor vehicle expenses (line
    9281) 2,500, the Chart A total below; the 19 expense lines (4B to 4T), in line order, add
    to 1,500 + 0 + 0 +
    1,200 + 0 + 0 + 800 + 0 + 2,500 + 0 + 6,000 + 0 + 0 + 0 + 0 + 1,500 + 0 + 0 + 2,500
    = 16,000. Area A has one class (below): amount ii is 2,000; the personal part of CCA
    and the CCA for business-use-of-home expenses (amount 7K) are a chosen $0 each, so
    line 9936 is 2,000 - 0 - 0 = 2,000; there is no recapture or terminal loss, so line
    9270 is 0 + 0 = 0. Line 9368, in line order, is 16,000 + 2,000 + 0 = 18,000 and line
    9369 is 50,000 - 18,000 = 32,000. There is no partnership (a count of 0): amount 5A
    is line 9369, 32,000, amounts 5B and 9974 are 0 and amount 5C is 32,000 + 0 + 0 =
    32,000; amounts 6A to 6E are 0, so amount 6F and line 9943 are 0 and amount 5D is
    32,000 - 0 = 32,000. Part 7, a chosen set: heat (7A) 600, electricity (7B) 500,
    insurance (7C) 300, maintenance (7D) 200 and property taxes (7F) 400, mortgage
    interest (7E) and other expenses (7G) 0: amount 7H is 600 + 500 + 300 + 200 + 0 +
    400 + 0 = 2,000; amount 7I is a chosen 0, so amount 7J is 2,000 - 0 = 2,000; amount
    7K is 0 and amount 7L (carried forward from the previous year) a chosen 0, so amount
    7M is 2,000 + 0 + 0 = 2,000. Amount 7N is amount 5D, 32,000 (not negative); amount
    7O is 2,000 - 32,000, negative, so 0; amount 7P is the lesser of 2,000 and 32,000,
    2,000, which is line 9945. Line 9946 is 32,000 - 2,000 = 30,000, T1 line 22 and line
    13500. Area A, Class 8 (a chosen figure, "Class 8 (20%)" in Guide T4002): column 2
    is a chosen 10,000, there are no additions, dispositions, AIIPs or RIIPs (a chosen 0
    each), so column 7 is 10,000 + 0 - 0 = 10,000, column 18 is 0 (one half of 0) and
    column 19 is 10,000 (DIEPs, columns 4, 6, 8 and 9, are not modelled, so columns 9,
    15 and 17 are 0); the maximum, column 19 multiplied by the rate of 20%, is 2,000.00
    and the claim is a chosen 2,000, the maximum; column 22 is 10,000 - 2,000 = 8,000,
    no property left being a chosen 0. The columns the form computes (15, 17, 18 and the
    maximum) are dollars-and-cents boxes, rounded half-up to the cent, which changes
    none of them; the lines of Parts 3 to 7 add and subtract amounts already in cents.
    Charts A to C, one leased passenger vehicle: amounts 1 (business kilometres) and 2 (total
    kilometres) are chosen figures of 5,000 and 10,000; amount 3 (fuel and oil) 1,000, amount 5
    (insurance) 600, amount 7 (maintenance and repairs) 200 and amount 10 (other expenses) 653 are
    chosen figures; amounts 6, 9, 11, 14 and 15 are a chosen 0. Chart B: amount 17 (total interest
    payable) is a chosen 400 and the number of days is a chosen 183, so line 18 is 350 ÷ 30 × 183
    = 2,135.00 and amount 19, the lesser of 400 and 2,135.00, is 400. Chart C: amount 20 (total
    lease charges) is a chosen 2,550, amount 21 (payments before the year) a chosen 0, amount 22
    (days leased) a chosen 183, amount 23 (manufacturer's list price) a chosen 60,000 and the GST
    or HST rate a chosen 13%: 44,706 + 13% = 50,517.78, 1,100 + 13% = 1,243.00 and 38,000 + 13%
    = 42,940.00; amount 23 or 44,706 plus tax, whichever is more, is 60,000.00; amount 24 is
    60,000.00 × 85% = 51,000.00; amount 25 is 1,243.00 × 183 ÷ 30 = 7,582.30; amount 26 is
    7,582.30 - 0 = 7,582.30; amount 27 is 42,940.00 × 2,550 ÷ 51,000.00 = 2,147.00; and amount 28,
    the lesser of 26 and 27, is 2,147.00. Chart A: amount 12 is 1,000 + 400 + 600 + 200 + 2,147
    + 0 + 0 + 653 + 0 = 5,000.00 (amount 4 is amount 19 and amount 8 is amount 28); amount 13 is
    5,000 × 5,000 ÷ 10,000 = 2,500.00; and line 9281 (amount 16) is 2,500 + 0 + 0 = 2,500.00. No
    line is rounded, as every product and quotient here is exact to the cent.
    Not modelled: Part 2 (the Internet business activities), Part 8 (the other
    partners), Part 9 (the equity) and Areas B to G.
