# Return DS: an infirm eligible dependant 18 or older, Schedule 5 line 30400 and line 30425. The
# filer has employment income and no child; the dependant is their parent, who has a mental or
# physical infirmity, with net income of 20,000. The amount for an eligible dependant (line 30400)
# is the basic personal amount plus $2,687 less the dependant's net income, so it is 0 here; the
# Canada caregiver amount for that dependant (line 30425) is the $28,798 base less the net income,
# at most $8,601, less the amount claimed on line 30400 (0). ON428 has no infirmity line, so the
# Ontario side is the Ontario amount for an eligible dependant (line 58160) with net income 20,000.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  Return DS: a 2025 Ontario resident who is employed at 60,000.00 (a chosen figure, T4 box 14)
  and supports one eligible dependant who is 18 or older and dependent on the filer because of a
  mental or physical infirmity (a chosen figure: a parent, so no child care expenses, no child
  for the Ontario tax reduction and no amount for infirm children on line 30500). The
  dependant's net income from line 23600 of their return is 20,000.00 (a chosen figure). The
  return has no RRSP contribution, no other income and no deduction but the enhanced CPP
  contribution, so net income is taxable income. The CPP contributions are 4.95% x (60,000 -
  3,500) = 2,796.75 base (line 31000) and 1% x 56,500 = 565.00 first additional, 3,361.75 in
  all, and there is no second additional contribution (60,000 is under the 71,300 ceiling);
  Schedule 8 (the one instance, `ca/schedule_8_instances`) gives those figures as lines 57 and 69.
  The EI premiums are 1.64% x 60,000 = 984.00 (line 31200). The first additional contribution
  of 565.00 is the deduction on line 22200, so total income of 60,000.00 less 565.00 is net
  income and taxable income, 59,435.00 (line 23600 and line 26000). The federal tax is 14.5%
  (the 2025 first bracket rate) of 57,375.00, 8,319.38 (8,319.375 rounded half-up to the
  cent), plus 20.5% of 59,435.00 - 57,375.00 = 2,060.00, 422.30, so 8,741.68. Line 30000, the
  basic personal amount, is 16,129.00 (taxable income is under 177,882). Line 30400, the amount
  for an eligible dependant, is line 3 (16,129.00 + 2,687.00 = 18,816.00, the basic personal
  amount plus the infirmity supplement) less the dependant's 20,000.00, -1,184.00, negative, so 0
  on line 5. Line 30425, the Canada caregiver amount for the infirm
  dependant: 28,798.00 - 20,000.00 = 8,798.00, at most 8,601.00, less the 0 claimed on line
  30400, so 8,601.00. The Canada employment amount (line 31260) is 1,471.00. The credit amounts
  subtotal (line 101) is 16,129.00 + 0 + 8,601.00 + 1,471.00 + 2,796.75 + 984.00 = 29,981.75,
  and the total of the credit amounts (line 33500) is the same, as the other lines it adds
  (the spouse amount, the caregiver amount for infirm children, and so on) are 0. At 14.5%, 29,981.75 x 14.5% = 4,347.35375, 4,347.35 (half-up), so the
  federal tax after credits is 8,741.68 - 4,347.35 = 4,394.33 (line 41700). No alternative
  minimum tax applies (the taxable income is under the basic exemption of 177,882). The Ontario
  tax: 5.05% of 52,886.00 = 2,670.74, plus 9.15% of 59,435.00 - 52,886.00 = 6,549.00 = 599.23, so
  3,269.97. The Ontario credit amounts are the basic personal amount 12,747.00 (ON428 line
  58040), the CPP and EI amounts of 2,796.75 and 984.00 (ON428 lines 58240 and 58280), and the
  eligible dependant amount, 11,905.00 - 20,000.00 = 0 (line 58160); 16,527.75 x 5.05% = 834.65,
  so line 73 is 3,269.97 - 834.65 = 2,435.32. The Ontario tax reduction is 294.00 (line 78)
  less line 73 (line 79), negative, so 0 (line 80). The health premium on taxable income of
  59,435.00, in the 48,600 to 72,000 row, is 600.00, so the Ontario tax is 2,435.32 + 600.00 =
  3,035.32. Total payable is 4,394.33 + 3,035.32 = 7,429.65. Income tax deducted is 8,000.00, so
  the refund is 8,000.00 - 7,429.65 = 570.35: the refund (a negative balance owing) is -570.35
  and the Ontario net refund is 570.35.
sources:
  - >-
    CRA, "T1-2025 Schedule 5 Amounts for Spouse and Dependants" (form 5000-S5), "Line 30400 -
    Amount for an eligible dependant": "Claim this amount if, at any time in the year, you
    supported an eligible dependant and their net income from line 23600 of their return ...
    was less than your basic personal amount (plus $2,687 if the eligible dependant was
    dependent on you because of a mental or physical infirmity)." Its "Line 1: Basic personal
    amount from line 30000 of your return", "Does this dependant have a mental or physical
    infirmity? Yes or No", and "If you are eligible for the Canada caregiver amount for your
    dependant (other than your infirm child under 18 years of age), enter $2,687 (Note 2) (see
    line 30425 below)." with "Note 2: If the dependant is your (or your spouse's or
    common-law partner's) infirm child under 18 years of age, you must claim the Canada
    caregiver amount on line 30500 instead of line 51100."; "Line 3: Line 1 plus line 2 ="; "Line
    4 and line 51106: Dependant's net income from line 23600 of their return"; "Line 5: Line 3
    minus line 4 (if negative, enter "0") Enter this amount on line 30400 of your return.".
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s5/5000-s5-25e.txt
  - >-
    CRA, Schedule 5, "Line 30425 - Canada caregiver amount for spouse or common-law partner, or
    eligible dependant age 18 or older": "You may be able to claim this amount if ... for an
    eligible dependant 18 years of age or older on line 30400 of your return."; "Complete this
    calculation only if you entered $2,687 on line 51090 or line 51100 of this schedule for a
    person whose net income is between $8,624 and $28,798."; "Line 1: Base amount 28,798.00";
    "Line 2: Net income for this person from line 23600 of their return"; "Line 3: Line 1 minus
    line 2 (if negative, enter "0") (maximum $8,601)"; "Line 4: Amount claimed on line 30300 or
    line 30400 of your return, if applicable"; "Line 5: Line 3 minus line 4 (if negative, enter
    "0") Enter this amount on line 30425 of your return.".
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pub/5000-g/5000-g-25e.txt
  - >-
    CRA, Form ON428 (form 5006-C), "Line 9 and line 58040: Basic personal amount Claim $12,747";
    "Line 16 and line 58160: Line 14 minus line 15 (if negative, enter "0") (maximum $10,823)";
    "Line 79: Amount from line 73 above"; "Line 80: Line 78 minus line 79 (if negative, enter
    "0") Ontario tax reduction"; the health premium chart's row "Taxable Income more than $48,600
    but not more than $72,000", "Ontario health premium: $600".
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-c/5006-c-25e.txt
  - >-
    The federal and Ontario rates and brackets of 2025 (14.5% and 20.5%, 5.05% and 9.15%),
    the CPP and EI rates (4.95% base, 1% first additional, 1.64% EI), the basic personal amount
    of 16,129.00, the Canada employment amount of 1,471.00 and the Ontario amounts above are as
    Return F's sources give them.
