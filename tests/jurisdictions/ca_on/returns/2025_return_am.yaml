# Return AM: Maya, a single 2025 Ontario resident with employment income of $60,000 and a
# full Schedule 3 (Capital Gains or Losses) Part 3 and Part 4: dispositions of shares, real
# estate, crypto-assets, personal-use property and listed personal property, each a row with
# the proceeds, the adjusted cost base and the outlays, a loss on one share row and one
# crypto-asset row netting against the gains of their lines, a personal-use property loss
# counting 0 ("Total gain only"), a listed personal property loss offsetting that property's
# gain and the unapplied listed personal property losses taking its net gain to 0, a capital
# gains deferral, slip and T3 capital gains or losses, a business investment loss reduction
# and a reserve, to the total capital gains or losses (line 21, 19700) and the taxable
# capital gains (T1 line 12700) of 50% of it. The other lines are blank.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025, resident in Canada throughout 2025, aged 18 or
  older at the end of 2025 (a chosen figure), with employment income (T1 line 10100) of
  $60,000 (a chosen figure) and the dispositions below, every figure a chosen figure. Line 4
  (shares), column 5 = column 2 minus columns 3 and 4: 12,000 - 8,000 - 100 = 3,900 and
  3,000 - 4,000 - 50 = -1,050, total 2,850. Line 5 (real estate): 90,000 - 60,000 - 2,000 =
  28,000. Line 7 (crypto-assets): 5,000 - 7,000 - 0 = -2,000. Lines 1, 2, 3, 6 and 8 have no
  rows, so 0. Line 9 and line 15800 (personal-use property, "Total gain only"): 3,000 - 1,500
  - 0 = 1,500 and 1,200 - 2,000 - 0 = -800, which counts 0, so 1,500. Line 10 and line 15900
  (listed personal property, "Net gain only"): 4,000 - 1,000 - 0 = 3,000 and 1,000 - 2,500 -
  0 = -1,500, rows total 1,500, less the unapplied listed personal property losses of 2,000,
  not below 0: 0. Line 11 = 0 + 0 + 0 + 2,850 + 28,000 + 0 - 2,000 + 0 + 1,500 + 0 = 30,350,
  and line 12 is the same figure. Line 13 and line 16100 (capital gains deferral) is 1,000,
  so line 14 = 30,350 - 1,000 = 29,350. Line 15 and line 17400 (T5, T5013 and T4PS slips) is
  600 and line 16 and line 17600 (T3 slips) is -200, so line 17 = 29,350 + 600 - 200 =
  29,750. Line 18 and line 17800 is the business investment loss reduction already computed:
  the total amounts from line 254 of the returns for 2001 to 2024 are a chosen 2,000, which
  Form T1436 line 6 prints "x 2" as 4,000, so line 6 is 4,000 and line 7 is 4,000; the business
  investment loss in 2025 is 10,000, so it is the lesser, 4,000; line 19 and line 19100 =
  29,750 - 4,000 = 25,750. Line 20 and line 19200 (reserves) is -750, so line 21 and line
  19700 = 25,750 - 750 = 25,000, and line 22 is the same figure. Line 24 = 25,000 x 50% =
  12,500.00, positive, so line 12700 (taxable capital gains) is 12,500.00. Total income (line
  15000) = 60,000 + 12,500.00 = 72,500.00. The income tax deducted is a chosen 12,000. The
  net income, taxable income, total payable and refund or balance owing are the engine's
  figures (to be confirmed against CRA's calculator). Not triggered: the lines of Schedule 3
  Part 5 beyond line 24 (line 25, 19890, is blank here; Return AR enters it), the net capital
  loss carry-forward (T1436) and every other credit and deduction not named here.
sources:
  - >-
    CRA, "T1-2025 Schedule 3 Capital Gains or Losses" (form 5000-S3, confirmed 2026-10-19),
    Part 3: "For each Gain or loss enter as many lines as necessary."; "(Column 2): Proceeds
    of disposition", "(Column 3): Adjusted cost base", "(Column 4): Outlays and expenses",
    "(Column 5): Gain or loss (column 2 minus columns 3 and 4)"; "Line 9 and line 15800: Total
    gain only (add all the amounts under column 5)"; "Line 11: Add lines 1 to 10. Total gains
    or losses of qualified properties and other properties ="; lines 1 to 8 "Total gain or loss
    (add all the amounts under column 5)"; line 10 / 15900 "Net gain only". Part 4: "Line 12:
    Amount from line 11 of the previous page"; "Line 13 and line 16100: Capital gains
    deferral from qualifying dispositions of eligible small business corporation shares
    included on line 4"; "Line 14: Line 12 minus line 13 ="; "Line 15 and line 17400: Capital
    gains or losses from your T5, T5013, and T4PS slips"; "Line 16 and line 17600: Capital
    gains or losses from your T3 slips"; "Line 17: Add lines 14 to 16. ="; "Line 18 and line
    17800: Capital loss from a reduction in your business investment loss"; "Line 19 and line
    19100: Total gains or losses before reserves: line 17 minus line 18 ="; "Line 20 and line
    19200: Reserves to be included in (or deducted from) income from Form T2017"; "Line 21 and
    line 19700: Line 19 plus line 20 Total capital gains or losses ="; "Report all negative
    amounts (losses) using brackets."; line 24 "Line 22 multiplied by the percentage from line
    23" (50%); line 26 (line 19900) "If positive, enter the result on line 12700 of your
    return."
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s3/5000-s3-25e.txt
  - >-
    CRA, Guide T4037 (Capital Gains), p.22, personal-use property: "if you have a capital
    loss, you usually cannot deduct that loss ... you cannot use the loss to decrease capital
    gains on other personal-use property"; p.23, listed personal property: the unapplied
    losses are "from 2018 and later years". The engine applies the Guide's $1,000
    minimum to personal-use property; the rows are chosen at $1,000 or more on both sides of
    the gains, so the minimum changes none of them.
