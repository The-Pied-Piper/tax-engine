  credit, deduction and overpayment for CPP contributions through employment income, self-employment
  income and other earnings). Line 84 = line 70 x 9.9% = 67,750.00 x 0.099 = 6,707.25 (not above
  $6,712.20). Line 85 = line 70 x 2% = 1,355.00 (not above $1,356.00). Line 86 = line 83 x 8% = 0.00
  x 8% = 0.00. Line 87 = line 85 plus line 86 = 1,355.00. Line 88 = line 84 plus line 87 = 6,707.25
  plus 1,355.00 = 8,062.25. Line 89 = line 69 of Part 3 (if positive) x 2 = 0.00, as line 69 of Part
