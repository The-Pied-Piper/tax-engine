# Return GB: Gabe, a single 2025 Ontario resident with two T4 slips, one for Ontario employment
# (box 26 of $3,000.00, box 16 and box 16A of $0.00) and one for Quebec employment (box 26 of
# $400.00, box 17 and box 17A of $0.00), and an election (Form CPT20) to pay additional CPP
# contributions on $67,850 of employment earnings not shown on a T4 slip (chosen figures): the
# worked example of Form RC381 with Part 4 completed on the branch where line 3 of Part 3 is below
# the basic exemption, so that Part 4 lines 65, 68 and 69 are completed. The return carries one
# Form RC381 and no Schedule 8 (the exclusive group ca/cpp_calculation). Part 2 gives 12 months for
# lines A and B, Part 3 gives line 61 of 0.00 and line 69 of 0.00 (the "0" branch, Part 3b), and
# the CPT20 election continues at Part 4, whose line 70 (67,750.00) is above zero, so Part 4
# supplies the T1 lines: line 30800 $0.00, line 22215 $0.00, line 44800 $0.00, line 42100
# $8,062.25, line 31000 $3,353.63 and line 22200 $4,708.63. Amounts are quoted decimal strings,
# never floats; counts are quoted digit strings. Every output the CA-ON manifest declares must
# appear under `expected`, or be left out to be 0 (or no records). The other lines are blank.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  Gabe, a single Ontario resident for all of 2025, resident in Canada throughout 2025, and aged 18
  or older at the end of 2025 (a chosen figure). His employment income (T1 line 10100) is $3,400 (a
  chosen figure) on two T4 slips: an Ontario T4 with box 26 of $3,000.00, box 16 of $0.00 and box
  16A of $0.00, and a Quebec T4 with box 26 of $400.00, box 17 of $0.00 and box 17A of $0.00 (chosen
  figures). Each slip's earnings are under the $3,500 basic exemption, so no CPP or QPP
  contributions were deducted. The EI premium deducted is $55.76 (a chosen figure). He also elects
  on Form CPT20 to pay additional CPP contributions on $67,850 of employment earnings not shown on a
  T4 slip (a chosen figure; the cpt20_earnings input). The CPT20 earnings are only the election's
  base: they are not added to total income. He has no self-employment income and no net partnership
  income. Income tax deducted is $3,400.00 (a chosen figure, equal to his total income). QPP months are 12 (line B), and the
  Quebec T4 is the QPP pensionable earnings on line 2 of Part 3. Form RC381 is completed in place of
  Schedule 8 (the rc381_instances input). The eligibility line of Form RC381, "Find out if this form
  is for you", is met: "You earned employment income in the province of Quebec in 2025 and you were
  a resident of a province or territory other than Quebec on December 31, 2025" (quoted in the
  sources), since Gabe earned employment income in Quebec and was an Ontario resident on December
  31, 2025. The figures of the form are worked out by hand below; the tax figures on the return are
  the engine's (see the end). This return reaches Part 4 lines
  65, 68 and 69. Lines 63 to 69 of Part 4 are completed only "If line 3 of Part 3 is less than line
  58" (line 58 is the basic exemption, 3,500.00). Line 3 of Part 3 (total pensionable earnings) is
  3,400.00, so line 65 (line 63, 3,500.00, less line 64, 3,400.00) is 100.00; line 68 (line 66,
  67,850.00, less line 67, 67,800.00) is 50.00; line 69 (line 65 less line 68) is 50.00; and line 70
  (line 62, 67,800.00, less line 69) is 67,750.00. Why a separate return: Part 4 lines 65, 68 and 69 need line 3 of Part 3 under 3,500.00, while Part 4
  lines 54 and 55 and Part 3 lines 90 and 91 (Return FZ) need line 68 of Part 3 to be negative,
  which needs earnings above 71,300.00 (line 55 also needs line 61 positive). Line 68 of Part 3 is
  line 64 less line 67, and line 67 holds the required second additional contributions (line 26 =
  line 15 x 4%, line 46 = line 35 x 4%). Lines 12 to 15 are completed only when line 3 of Part 3 is
  more than line C of Part 2 (71,300.00), and lines 32 to 35 only when it is more than line G
  (71,300.00); below those amounts the required second additional contributions are nil, so a
  negative line 68 needs earnings above 71,300.00. Line 3 cannot be both under 3,500.00 and above
  71,300.00, so no one return reaches both. Likewise Part 3 line 77 (Return FZ: line 53 negative and
  line 60 positive) and Part 3 line 84 (Return GA: line 60 negative and line 53 positive) exclude
  each other. Part 2: line A (CPP months) and line B (QPP months) are 12 (chosen figures; "Enter
  "12" on lines A and B below unless any of the following conditions apply:"), so lines C to F (CPP)
  and G to J (QPP) are the 12-month row of the table: 71,300.00, 9,900.00, 81,200.00 and 3,500.00
  (lines C, D, E and F; G, H, I and J the same amounts). Part 3, lines 1 to 69. Line 1 (50339), the
  CPP pensionable earnings of the Ontario T4 slip (box 26), is 3,000.00. Line 2 (50329), the QPP
  pensionable earnings of the Quebec T4 slip (box 26), is 400.00. Line 3 (total pensionable
  earnings) = 3,000.00 plus 400.00 = 3,400.00. Line 4 = line 1 = 3,000.00; line 5 = line 3 =
  3,400.00. Line 6 = 3,000.00 divided by 3,400.00 = 0.88235294..., calculated to the fifth decimal
  place without rounding: 0.88235. Line 7 = line E (81,200.00) x 0.88235 = 71,646.82; line 8 = line
  C (71,300.00) x 0.88235 = 62,911.56; line 9 = line F (3,500.00) x 0.88235 = 3,088.225, 3,088.23
  rounded half up; line 10 = line D (9,900.00) x 0.88235 = 8,735.265, 8,735.27 rounded half up. Line
  11 is the lesser of line 1 (3,000.00) and line 7 (71,646.82): 3,000.00. Line 3 (3,400.00) is not
  more than line C (71,300.00), so lines 12 to 15 are not completed: "If not, enter the amount from
  line 11 on line 16 and continue at line 17." Line 15 is computed as 0.00 (not used). Line 16 =
  line 11 = 3,000.00. Line 17 = line 9 = 3,088.23. Line 18 = 3,000.00 less 3,088.23 = -88.23,
  negative, so "0": 0.00. Line 19 (50340), the total of box 16 of the Ontario T4 slip, is 0.00; line
  20 = 0.00 x 83.1933% = 0.00; line 21 = 0.00 less 0.00 = 0.00. Line 22 = 0.00 x 4.95% = 0.00; line
  23 = 0.00 x 1% = 0.00; line 24 = 0.00 plus 0.00 = 0.00. Line 25 (50341), the total of box 16A, is
  0.00; line 26 = line 15 (not used, 0.00) x 4% = 0.00. QPP side: line 27 = line I (81,200.00) less
  line 7 (71,646.82) = 9,553.18; line 28 = line G (71,300.00) less line 8 (62,911.56) = 8,388.44;
  line 29 = line J (3,500.00) less line 9 (3,088.23) = 411.77; line 30 = line H (9,900.00) less line
  10 (8,735.27) = 1,164.73. Line 31 is the lesser of line 2 (400.00) and line 27 (9,553.18): 400.00.
  Line 3 (3,400.00) is not more than line G (71,300.00), so lines 32 to 35 are not completed: "enter
  the amount from line 31 on line 36 and continue at line 37": line 36 = 400.00. Line 37 = line 29 =
  411.77; line 38 = 400.00 less 411.77 = -11.77, negative, so "0": 0.00. Line 39 (50330), the total
  of box 17 of the T4 slips, is 0.00; line 40 = 0.00 x 84.375% = 0.00; line 41 = 0.00 less 0.00 =
  0.00; line 42 = 0.00 x 5.4% = 0.00; line 43 = 0.00 x 1% = 0.00; line 44 = 0.00 plus 0.00 = 0.00.
  Line 45 (50331), the total of box 17A, is 0.00; line 46 = line 35 (not used, 0.00) x 4% = 0.00.
  Totals: line 47 = line 20 = 0.00; line 48 = line 40 = 0.00; line 49 = 0.00 plus 0.00 = 0.00. Line
  50 = line 22 = 0.00; line 51 = line 42 = 0.00; line 52 = 0.00 plus 0.00 = 0.00. Line 53 = line 49
  minus line 52 = 0.00 (not negative). Line 54 = line 21 = 0.00; line 55 = line 41 = 0.00; line 56 =
  0.00 plus 0.00 = 0.00. Line 57 = line 23 = 0.00; line 58 = line 43 = 0.00; line 59 = 0.00 plus
  0.00 = 0.00. Line 60 = line 56 minus line 59 = 0.00. Line 61 = line 53 plus line 60 = 0.00. Line
  62 = line 25 = 0.00; line 63 = line 45 = 0.00; line 64 = 0.00 plus 0.00 = 0.00. Line 65 = line 26
  = 0.00; line 66 = line 46 = 0.00; line 67 = 0.00 plus 0.00 = 0.00. Line 68 = line 64 minus line 67
  = 0.00. Line 69 = line 61 plus line 68 = 0.00. Line 69 is "0", so the Part 3b branch applies (Part
  3a, for a positive line 69, is not used). Because the CPT20 election continues at Part 4, the
  form's rule "continue at Part 4" applies. Part 3b (line 69 is "0"). Line 53 is 0.00, which is not
  negative, so line 52 (0.00) is entered at line 75 and line 81 and the form continues at line 82:
  line 75 = 0.00; lines 76 to 78 are not completed (line 53 is not negative, so line 77 is "0");
  line 79 = line 75 plus line 77 = 0.00; line 80 = 0.00, since line 68 is 0.00 and is not positive;
  line 81 = line 79 plus line 80 = 0.00, the base contributions through employment income (line
  30800 of the return on the Part 3b path). Line 60 is 0.00, which is not negative, so line 59
  (0.00) is entered at line 82 and line 88 and the form continues at line 89. Lines 83 to 87 are not
  completed; line 88 = 0.00. Line 68 is "0", not negative, so line 67 (0.00) is entered at line 89
  and line 92, and lines 90 and 91 are not completed. Line 92 = line 89 plus line 91 = 0.00. Line 93
  = line 88 plus line 92 = 0.00, the deduction for enhanced contributions through employment income
  (line 22215 of the return on the Part 3b path). Part 4 (the self-employment income and other
  earnings: the CPT20 election). Line 1 (line 12200 plus line 27 of the return, the pensionable net
  self-employment earnings) is 0.00. Line 2 (50373, employment earnings not shown on a T4 slip that
  you elect to pay additional CPP contributions on, the CPT20 earnings) is 67,850.00. Line 3 (50399,
  on a T4 slip) is 0.00. Line 4 = 0.00 plus 67,850.00 plus 0.00 = 67,850.00. Line 5 is the amount
  from line 19 of Part 3, 0.00. Line 61 of Part 3 is "0": "do not complete lines 6 to 24. Enter the
  amount from line 5 on line 26 and continue at line 27." So line 26 = 0.00 and line 27 = 0.00 x
  16.80672 = 0.00. Line 61 of Part 3 is "0", so lines 29 to 39 are not completed: "complete line 28
  and enter the amount on line 40 and continue at line 41." Line 28 (the total actual base and first
  additional QPP contributions from line 39 of Part 3) is 0.00, and line 40 = 0.00. Line 41 = 0.00 x
  15.625 = 0.00; line 42 = line 27 plus line 41 = 0.00. Line 43 = line 25 of Part 3 (box 16A) =
  0.00. Line 68 of Part 3 is "0", not positive, so "enter "0" on line 46 and continue at line 47":
  line 46 = 0.00; line 47 = line 43 minus line 46 = 0.00. Line 48 = line 45 of Part 3 (box 17A) =
  0.00; line 68 of Part 3 is not positive, so line 51 is "0" and line 52 = line 48 minus line 51 =
  0.00; line 53 = line 47 plus line 52 = 0.00. Line 55 is "0" (line 61 of Part 3 is not positive)
  and line 56 = line 53 plus line 55 = 0.00. Line 57 = line C of Part 2 = 71,300.00; line 58 = line
  F of Part 2 = 3,500.00; line 59 = 71,300.00 less 3,500.00 = 67,800.00 (maximum $67,800). Line 60 =
  line 42 = 0.00; line 61 = line 59 minus line 60 = 67,800.00. Line 62 is the lesser of line 4
  (67,850.00) and line 61 (67,800.00): 67,800.00. Line 3 of Part 3 (3,400.00) is less than line 58
  (3,500.00), so lines 63 to 69 are completed: line 63 = line 58 = 3,500.00; line 64 = line 3 of
  Part 3 = 3,400.00; line 65 = line 63 minus line 64 = 100.00 (not negative); line 66 = line 4 =
  67,850.00; line 67 = line 59 = 67,800.00; line 68 = line 66 minus line 67 = 50.00; line 69 = line
  65 minus line 68 = 50.00. Line 70 = line 62 minus line 69 = 67,800.00 less 50.00 = 67,750.00, the
  self-employment income and other earnings subject to base and first additional contributions. Line
  71 = line 4 = 67,850.00; line 72 = line 11 of Part 3 = 3,000.00; line 73 = line 31 of Part 3 =
  400.00; line 74 = 67,850.00 plus 3,000.00 plus 400.00 = 71,250.00. Line 74 is not more than line
  57 (71,300.00), so lines 75 to 83 are not completed and line 83 is "0" (continue at line 84). The
  engine also computes lines 75 to 82, computed, not used: line 75 = line D of Part 2 = 9,900.00;
  line 76 = line 56 divided by 4% = 0.00; line 77 = 9,900.00 less 0.00 = 9,900.00; line 78 = line 4
