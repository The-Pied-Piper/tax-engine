# Return FL: the Ontario tax reduction for dependants, a tie of net income with the spouse, and the
# LIFT credit with UCCB and RDSP income, each one non-zero, with the hand derivation of every line
# in the description. ON428 prints no example, so every figure is a chosen figure, worked out by
# hand from the form text.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  An Ontario resident for all of 2025 (Ontario residency is chosen: the form names no province of
  residence), resident in Canada throughout 2025, aged 18 or older at the end of 2025, with a
  spouse or common-law partner on December 31, 2025 (chosen), and two dependants with a mental
  or physical impairment (ON428 line 76, a chosen count) and no dependent child (line 75).
  Employment income (line 10100) is a chosen 31,500.00; the universal child care benefit (line
  11700) is a chosen 1,200.00 and RDSP income (line 12500) a chosen 500.00, so total income is
  31,500 + 1,200 + 500 = 33,200.00. CPP contributions by Schedule 8: base 4.95% x (31,500 -
  3,500) = 1,386.00, first additional 1% x 28,000 = 280.00 (deducted on line 22215); the T4 box
  total is 1,666.00; EI premiums 1.64% x 31,500 = 516.60. Net income (line 23600) is 33,200 -
  280.00 = 32,920.00, and taxable income the same. The spouse's net income (ON428 line 12 and
  Schedule ON428-A line 21) is the same chosen 32,920.00, so the two are equal and the filer
  chooses to claim the amounts on lines 75 and 76 (a chosen input of 1); the spouse's UCCB (line
  11700) is a chosen 800.00 and RDSP income (line 12500) a chosen 300.00.
  Ontario tax (ON428): 5.05% x 32,920 = 1,662.46. The credit
  amounts are the basic personal amount 12,747.00, the CPP base contributions 1,386.00 and the EI
  premiums 516.60, 14,649.60 in all, at 5.05% = 739.80 (14,649.60 x 5.05% = 739.8048). Tax after
  credits is 1,662.46 - 739.80 = 922.66; the surtax is not triggered (below 5,710) and there is
  no dividend credit, so the Ontario tax after the dividend credit (line 71) is 922.66 and, with
  no additional tax for minimum tax purposes, line 73 is 922.66.
  Ontario tax reduction (lines 74 to 80): line 74 basic reduction 294.00; line 75 0 x 544 = 0.00;
  line 76 2 x 544 = 1,088.00 (only the individual with the higher net income can claim lines 75
  and 76; the form does not say who claims when the net incomes are equal, so the filer's claim is an input, chosen as 1, and the amounts count once); line 77 = 294.00 +
  0.00 + 1,088.00 = 1,382.00; line 78 = 1,382.00 x 2 = 2,764.00; line 79 = 922.66; line 80 =
  2,764.00 - 922.66 = 1,841.34. None of the six conditions that make line 80 zero applies (the tests of this return set each of five alone; the sixth, an amount on line 72, is set by another return), so the
  reduction is 1,841.34, and line 81 = 922.66 - 1,841.34 is negative, entered as 0.
  LIFT (Schedule ON428-A): line 3 = 31,500 + 0 = 31,500.00; line 5 = 5.05% x 31,500 = 1,590.75,
  at most 875, so 875.00 (line 14 and line 29). Line 6 net income 32,920.00; line 7 and line 8 0;
  line 9 = 32,920.00. Line 10 (UCCB) 1,200.00, line 11 (RDSP income) 500.00, line 12 = 1,700.00.
  Line 13 = 32,920.00 - 1,700.00 = 31,220.00, below the 32,500 threshold of Part A. Part B (a
  spouse at year end): line 21 32,920.00, lines 22 and 23 0, line 24 = 32,920.00; line 25 800.00,
  line 26 300.00, line 27 = 1,100.00; line 28 = 32,920.00 - 1,100.00 = 31,820.00. Line 30 =
  31,220.00; line 32 = 0 (below 32,500); line 35 = 31,220.00 + 31,820.00 = 63,040.00, below the
  65,000 of line 36, so line 37 = 0; line 38 = 0; line 40 = 0.00; line 41 = 875.00 - 0.00 =
  875.00, the credit with a spouse, which is the LIFT credit (line 85). Without the UCCB and RDSP
  income taken off on lines 12 and 27, the family income would be 32,920 + 32,920 = 65,840, 840
  over 65,000, and the credit 875 - 5% x 840 = 833.00. ON428 line 86 = 0 - 875.00 is negative,
  entered as 0.
  Canada workers benefit (Schedule 6, with the eligible spouse, line 38101, 1): the filer's
  working income (line 5, column 1) is the employment income 31,500.00 and the spouse's (column 2,
  line 5) is 32,920.00, the spouse's net income, a chosen figure. Line 6, the family working income,
  is 64,420.00; line 18 is 64,420 - 3,000 = 61,420 and line 20 is 27% of it, 16,583.40, so line 22
  is the lesser of that and the eligible spouse's 2,813, which is 2,813.00. Part B, column 1: line
  10 is 32,920.00, line 11 (the UCCB 1,200.00 and RDSP income 500.00) is 1,700.00 and line 12 is
  31,220.00. Column 2: line 10 is the spouse's 32,920.00 (line 9 nothing), line 11 (the spouse's UCCB
  800.00 and RDSP income 300.00) is 1,100.00 and line 12 is 31,820.00. Line 13 is 31,220.00 +
  31,820.00 = 63,040.00. Line 14: the filer's working income, 31,500.00, is less than the spouse's,
  32,920.00, so column 1 counts: the less of line 5 and line 12, 31,220.00, above the $16,386
  maximum, so 16,386.00. Line 15 is 63,040.00 - 16,386.00 = 46,654.00. Line 23 is 46,654.00, so
  line 25 is 46,654.00 - 30,639 = 16,015.00, line 27 is 15% of it, 2,402.25, and line 28 is
  2,813.00 - 2,402.25 = 410.75, the benefit (line 45300). The total credits (line 48200) are the
  income tax deducted, 3,000.00, plus 410.75, 3,410.75; the total payable is 2,245.52, so the refund
  is 2,245.52 - 3,410.75 = -1,165.23, a refund (line 48400).
  The lines the return does not reach are not triggered: no dividend, no foreign tax credit, no
  minimum tax. The spouse amount is 0 because the spouse's net income is above the amount. The
  refund and the Ontario health premium are the engine's, not hand figures. The caps
  ca/cpp_second_additional_earnings_maximum and ca/other_payments_limit_income are the engine's too.
sources:
  - >-
    CRA, Form ON428 2025, "Ontario tax reduction": "Enter "0" on line 80 if any of the following
    applies to you:" and the six conditions; "Line 74: Basic reduction 294.00"; "If you had a spouse
    or common-law partner on December 31, 2025, only the individual with the higher net income can
    claim the amounts on lines 75 and 76."; "Line 76 and line 60970: Number of dependants"
    "multiplied by $544"; "Line 77: Add lines 74 to 76."; "Line 78: Amount from line 77 above"
    "multiplied by 2"; "Line 79: Amount from line 73 above"; "Line 80: Line 78 minus line 79 (if
    negative, enter "0") Ontario tax reduction"; "Line 81: Line 73 minus line 80 (if negative, enter
    "0")" (docs/cra-forms-2025/5006-c-25e.txt)
  - >-
    CRA, Schedule ON428-A 2025, lines 1 to 41 (docs/cra-forms-2025/5006-a-25e.txt): "Line 5: Line 3
    multiplied by the percentage from line 4 (maximum $875)", "Line 10: Amount from line 11700 of your
    return", "Line 11: Amount of RDSP income included on line 12500 of your return", "Line 13: Line 9
    minus line 12 (if negative, enter "0") Your adjusted net income", "Line 28: Line 24 minus line
    27 (if negative, enter "0") Your spouse's or common-law partner's adjusted net income", "Line
    36: Family income threshold", "Line 41: Line 29 minus line 40 (if negative, enter "0")"
  - >-
    CRA, T1 guide 2025, Schedule 8 (CPP) and Form T2204 (EI) as in Return Y
    (docs/cra-forms-2025/5000-g-25e.txt)
