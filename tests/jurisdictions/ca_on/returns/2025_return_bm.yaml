# Return BM: a filer with a qualified property, an SR&ED claim, flow-through mining expenditures
# (mineral and critical mineral exploration), two apprentices (one over the 20000 cap) and a repayment of
# SR&ED assistance, computed on Form T2038(IND) (investment tax credit) Parts A, B and D. Part C
# (recapture) has no entries and computes to zero. Part D has no opening balance, no graduated rate
# estate allocation and no claim, and the filer has no income, so line 41200 is zero; the claim with
# income (up to the limit, refused above it, and line 138 with it) is in the end-to-end tests. Part E
# (line 45400) is not part of this return. The caller's lines are chosen figures, entered as the form
# takes them; each amount is computed from them.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single filer, a 2025 Ontario resident, with the investment tax credit of Form T2038(IND)
  Parts A, B and D and no other income, deduction or credit. Every caller's line below is a chosen
  figure. Part A amount 1 is the SR&ED expenditures on line 67120, a chosen figure of 40000.00,
  times 0.15 = 6000.00. Amount 2 is the agricultural SR&ED contributions on line 67130, a chosen
  figure of 10000.00, times 0.15 = 1500.00. Amount 3 is the partnership allocation on line 67135,
  a chosen figure of 2000.00, read as it is. Amount 4 is the qualified property on line 67140, a
  chosen figure of 10000.00, times 0.10 = 1000.00. Amount A, "Total current-year refundable
  credits (add amounts 1 to 4)", is 6000.00 plus 1500.00 plus 2000.00 plus 1000.00 = 10500.00.
  Part B amount B is the flow-through mining expenditures on line 67170, a chosen figure of
  20000.00, times 0.15 = 3000.00. Amount C is the flow-through critical mineral expenditures on
  line 67175, a chosen figure of 5000.00, times 0.30 = 1500.00. Table 1 has two apprentices, each
  with a chosen figure of eligible salary and wages: the first of 25000.00, whose column 3 is the
  lesser of 25000.00 and 20000.00, so 20000.00; the second of 15000.00, whose column 3 is the lesser
  of 15000.00 and 20000.00, so 15000.00. The total of column 3 is 20000.00 plus 15000.00 =
  35000.00. Line 67180 adds the T3 box 40 amount, a chosen figure of 5000.00, so line 67180 is
  35000.00 plus 5000.00 = 40000.00, and amount D is 40000.00 times 0.10 = 4000.00. Line 67184, the
  repayment of assistance that reduced SR&ED expenditures in 2014 and prior years, is a chosen
  figure of 1000.00, times 0.20 = 200.00 (amount 1). Line 67185, the same for 2015 and subsequent
  years, is a chosen figure of 2000.00, times 0.15 = 300.00 (amount 2). Amount E, "Total repayment
  of assistance for SR&ED (add amounts 1 and 2)", is 200.00 plus 300.00 = 500.00. Amount F, "Total
  current-year non-refundable tax credits (add amounts B, C, D and E)", is 3000.00 plus 1500.00
  plus 4000.00 plus 500.00 = 9000.00. Part D, with no opening balance (amount 1) and no graduated
  rate estate allocation (amount 6), has amount 2 the amount A of 10500.00 and amount 3 the amount F
  of 9000.00, so amount 4, "Subtotal (add amounts 2 and 3)", is 19500.00, and amount 5, "Amount 1
  plus amount 4", is 19500.00; amount G, "Total available investment tax credit (amount 5 minus
  amount 6)", is 19500.00. The filer has no income, so amount 7, the federal tax of line 40600, is
  0.00, amount 8 (line 41000) and amount 10 (line 41400) are 0.00, so amount 9 and amount H are
  0.00, and I, "Enter the lesser of amount G or H", is 0.00. Amount 11 is H, 0.00; amount 12 (line
  40500) is 0.00, so amount 13 is 0.00; amount 14, the minimum amount from line 103 of Form T691, is
  0.00, so amount J is 0.00 and K is 0.00. Form T691 Part 5 line 7 is 0.00, so the condition "greater
  than 0" does not apply and the claim is limited by I, 0.00. No claim is entered, so amount 15 is
  0.00, which line 41200 takes, and line 138 (41600), "Add lines 135 to 137.", is 0.00. The filer has
  no income, so the rest of the return computes to zero except the printed constants of Form
  RC381 Part 2 (lines G to J), the CPP second additional earnings maximum of 9900.00, and Form
  T691 Part 8 line 17, "Total minimum
  tax carryover available for 2026", which is 2338.71 as the form prints it (no floor) for a
  filer with no income; each is stated in the expected values.
sources:
  - >-
    CRA, Form T2038(IND) (25E), docs/cra-forms-2025/t2038-ind-25e.pdf (confirmed from the PDF; no
    .txt published): "ITC for qualified expenditures for SR&ED (amount from line 559 of Form T661
    plus applicable amount from box 40* of your T3 slip, minus amounts from lines 67130 and
    67135)" "× 0.15 ="; "80% of total contributions made to agricultural organizations for SR&ED"
    "× 0.15 ="; "ITC allocated from a partnership for SR&ED (see boxes 186, 187, and 189 of your
    T5013 slips)"; "ITC for total investments in qualified property (include applicable amount
    from box 40* of your T3 slip)" "× 0.10 ="; "Total current-year refundable credits (add amounts
    1 to 4)"; "Enter amount A at amount 2 in Part D"; "Mineral exploration tax credit (METC)" "×
    0.15 ="; "Critical mineral exploration tax credit (CMETC)" "× 0.30 ="; "The lesser of eligible
    salary and wages** payable in the year or $20,000."; "Total apprenticeship job creation tax
    credit (Total of amounts in column 3 plus applicable amount from box 40* of your T3 slip)"
    "× 0.10 ="; "The credit is 10% of the total of the amounts in Table 1, column 3."; "Repayment of
    assistance that reduced qualified SR&ED expenditures incurred in 2014 and prior years (amount
    from line 560 of Form T661)" "× 0.20 ="; "Repayment of assistance that reduced qualified SR&ED
    expenditures incurred in 2015 and subsequent years (amount from line 560 of Form T661)" "×
    0.15 ="; "Total repayment of assistance for SR&ED (add amounts 1 and 2)"; "Total current-year
    non-refundable tax credits (add amounts B, C, D and E)"; "Enter amount F at amount 3 in Part
    D".
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2038-ind/t2038-ind-25e.pdf
