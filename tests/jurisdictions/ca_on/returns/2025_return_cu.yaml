# Return CU: Return BY's single sole proprietor, a 2025 Ontario resident whose only activity is
# a fishing business, one Form T2121 (Statement of Fishing Activities), whose first fiscal
# period is short: the business started on September 23, 2025, so the fiscal period is from
# September 23 to December 31, 2025, 100 days (Guide T4002, "You were asking?": "Since your
# fiscal period is less than 365 days, you have to prorate your CCA claim ... base your CCA claim
# on the number of days in your fiscal period compared to 365 days"). The caller enters the 100
# days; the CCA maximum of each class is prorated by 100 / 365. Income of a chosen $40,958.90
# (fish products, amount 3A), expenses of $25,000 on two lines (salt, bait and ice $10,000 and
# fishing gear $15,000) and capital cost allowance of $958.90 (line 9936), so line 9368 is
# $25,958.90 and line 9369 is $15,000.00, Return BY's line 9946. Area A has one class, Class 8
# (20%), with additions (column 3) of $35,000.00 and nothing else: column 7 and column 13 are
# $35,000.00, the half-year rule makes column 18 $17,500.00 and column 19 $17,500.00. The maximum
# of a full year is $17,500.00 x 20% = $3,500.00 and, for 100 days, $3,500.00 x 100 / 365 =
# $350,000 / 365 = $958.9041..., rounded half-up to the cent, $958.90. Column 21 is that, claimed
# in full, so column 22 is $35,000.00 - $958.90 - $5,000.00 (the remaining personal part of the property's cost, endnote 9) = $29,041.10. There is no immediate expensing, no
# recapture and no terminal loss. Line 9946 and T1 line 14300 are $15,000.00, so every figure that
# depends on income is Return BY's. Amounts are quoted decimal strings, never floats; counts are
# quoted digit strings. Every output the CA-ON manifest declares must appear under `expected`, or
# be left out to be 0 (or no records). The farming lines (Form T2042) are not triggered and are
# not listed here.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  Class 8 has a remaining personal part of $5,000.00 (endnote 9 of the T2121: a property used for both
  personal and business use, whose business use changed from year to year, was disposed of), which
  is subtracted from column 22.
  A single Ontario resident for all of 2025 whose only activity is a fishing business that
  started on September 23, 2025, reported on one Form T2121 for a first fiscal period of 100 days
  (September 23 to December 31, 2025; the caller enters the 100): fish products of $40,958.90
  (amount 3A, a chosen figure, so that line 9946 is Return BY's $15,000.00), so line 8299 and T1 line
  14299 are $40,958.90; expenses of $25,000 on two lines (salt, bait and ice, line 9138, $10,000,
  and fishing gear, line 9136, $15,000), so amount 4Q is $25,000.00, and capital cost allowance
  of $958.90 on Class 8 (Area A, line 9936), so line 9368 is $25,958.90 and line 9369 is
  $15,000.00; with no partner and no business-use-of-home amounts, line 9946 and T1 line 14300
  are $15,000.00. The motor vehicle expenses (line 9281) are Charts A to C for a leased passenger
  vehicle used for no fishing (business kilometres 0), so line 9281 is $0 and changes no total.
  Area A has one class, Class 8, bought in the year: additions (column 3) $35,000.00, so column 7
  is $35,000.00; by the half-year rule column 18 is $17,500.00 and column 19 is $17,500.00, so the
  maximum of a full year is $17,500.00 x 20% = $3,500.00. The fiscal period is 100 days, less
  than 365, so the maximum is prorated: $3,500.00 x 100 / 365 = $958.90, claimed in full; the UCC
  at the end of the year (column 22) is $35,000.00 - $958.90 - $5,000.00 (the remaining personal part of the property's cost, endnote 9) = $29,041.10. A chosen set of
  figures. The net self-employment income (T1 line 27, "Add lines 22 to 26") is 0 + 0 + 0 + 0 +
  15,000 = $15,000; line 28 is line 21 (0) plus line 27 and total income (line 15000) adds line
  27 to the other income lines, which are all 0, so total income is $15,000.00. The farming
  income (Form T2042, T1 line 25) is not triggered and is 0. Every figure from line 27 on is the
  same as Return BY's, whose net fishing income is the same $15,000. The CPP months (Schedule 8
  box A) are the 12 of a full year, Schedule 8 Part 4 is not completed (count 0) and there is no
  agreement with the Canada Employment Insurance Commission (count 0), so the CPP contributions
  payable (line 42100), the base CPP contributions (line 31000) and the deduction (line 22200) on
  self-employment income, and the EI premiums on it (lines 31217 and 42120), are $0 and change
  no total.
sources:
  - >-
    CRA, Form T2121 (2025), Statement of Fishing Activities (docs/cra-forms-2025/t2121-25e.pdf,
    confirmed 2026-10-19 from the PDF; https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2121/t2121-25e.pdf),
    Part 3: "Gross income: Total of amounts 3A to 3F and line 9600 (enter this amount on line
    14299 of your income tax and benefit return)" (8299); Part 4: "Gross income (line 8299 of
    Part 3)" (4A); "Subtotal: Add amounts 4B to 4P." (4Q); "Capital cost allowance (CCA). Enter
    amount ii of Area A minus any personal part and any CCA for business-use-of-home expenses."
    (9936); "Total expenses: Amount 4Q plus line 9936" (9368); "Net income (loss) before adjustments:
    Amount 4A minus line 9368." (9369); "Your cost (amount 4 minus amount 5)" (8963, amount 4O).
    Part 5: "Your share of line 9369 or the amount from your T5013 slip, Statement of Partnership
    Income" (5A); "Total: Amount 5A plus line 9974" (5B); "Net income (loss) after adjustments:
    Amount 5B minus line 9943" (5C); "Your net income (loss): Amount 5C minus line 9945 (enter this
    amount on line 14300 of your income tax and benefit return)" (9946). Part 6: "Total other
    amounts deductible from your share of the net partnership income (loss): Add amounts 6A to 6E
    (enter this amount on line 9943 of Part 5)." (6F). Part 7: "Subtotal: Add amounts 7A to 7G."
    (7H); "Subtotal: Amount 7H minus amount 7I" (7J); "Subtotal: Add amounts 7J to 7L." (7M);
    "Net income (loss) after adjustments (amount 5C) (if negative, enter "0")." (7N); "Business-use-
    of-home expenses available to carry forward: Amount 7M minus amount 7N (if negative, enter
    "0")" (7O); "Allowable claim: Amount 7M or 7N above, whichever is less (enter your share of this
    amount on line 9945 of Part 5)" (7P). Area A endnote 3: "If you have a negative amount in column
    7, add it to income as a recapture in Part 3 on line 9600. If no property is left in the class
    and there is a positive amount in this column, deduct the amount from income as a terminal loss
    in Part 4 on line 9270." The income lines (Part 3), the expense lines (Part 4) and the caller's
    amounts are the chosen figures in the description; the lines not listed are not entered and are
    0. Not modelled: Part 1 (identification), Part 2 (the Internet business activities), Part 8 (the
    other partners), Part 9 (the equity), Areas B to F (Charts A to C and Area G are modelled, see
    the sources below). Area A has one class (see the sources below): amount ii is 958.90; the
    personal part of CCA and the CCA for business-use-of-home expenses (amount 7K) are a chosen $0
    each, so line 9936 is 958.90 - 0 - 0 = 958.90; there is no recapture or terminal loss, so
    line 9600 is 0 + 0 = 0 and line 9270 is 0 + 0 = 0. The income line is a chosen figure: fish
    products (amount 3A) 40,958.90, so line 8299, and so amount 4A, is 40,958.90; the expenses (4Q)
    are 10,000 + 15,000 = 25,000, line 9368 is 25,000 + 958.90 = 25,958.90 and line 9369 is
    40,958.90 - 25,958.90 = 15,000.00; amounts 5A, 5B and 5C are 15,000.00 (no partner), amount 7N
    is 15,000.00 and line 9946 is 15,000.00 - 0 = 15,000.00.
  - >-
    CRA, Form T2121 (2025), Statement of Fishing Activities (docs/cra-forms-2025/t2121-25e.pdf,
    confirmed from the PDF with pdftotext; https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2121/t2121-25e.pdf),
    Area A (page 4), "Calculation of capital cost allowance (CCA) claim": "Column 2: Undepreciated
    capital cost (UCC) at the start of the year", "Column 3: Cost of additions in the year (see
    Areas B and C below)", "Column 7: UCC after additions and dispositions (col. 2 plus col. 3
    minus col. 5)", "Column 13: Remaining UCC after immediate expensing (col. 7 minus col. 9)",
    "Column 18: Adjustment for current-year additions subject to the half-year rule. 1/2
    multiplied by (col. 10 minus col. 11 minus col. 12 minus col. 5). If negative, enter "0"",
    "Column 19: Base amount for CCA (col. 13 plus col. 15 plus col. 17 minus col. 18)", "Column
    20: CCA rate %", "Column 21: CCA for the year (col. 19 multiplied by col. 20, or a lower
    amount, plus col. 9)", "Column 22: UCC at the end of the year (col. 7 minus col. 21)" and
    "Total CCA claim for the year: Total of column 21 (enter on line 9936 of Part 4 amount ii
    minus any personal part and any CCA for business-use-of-home expenses)" (amount ii). Class 8
    (a chosen figure, 20% in docs/cra-forms-2025/t4002-25e.pdf): column 2 is a chosen 0, column
    3 a chosen 35,000, columns 4, 5, 6 and 9 a chosen 0 (no DIEP), so column 7 is 0 + 35,000 - 0
    = 35,000; columns 11 and 12 are a chosen 0, so columns 14, 15, 16 and 17 are 0; column 10
    is 35,000 - 0 = 35,000; column 13 is 35,000 - 0 = 35,000; column 18 is one half x (35,000 - 0
    - 0 - 0) = 17,500.00; column 19 is 35,000 + 0 + 0 - 17,500.00 = 17,500.00. The maximum of a
    full year is column 19 x column 20 = 17,500.00 x 20% = 3,500.00; for a fiscal period of 100
    days it is prorated (see the next source): 3,500.00 x 100 / 365 = 350,000 / 365 =
    958.9041..., rounded half-up to the cent, 958.90. Column 21 is that, a chosen claim, the
    most; column 22 is 35,000 - 958.90 - 5,000.00 (the remaining personal part of the property's cost, endnote 9) = 29,041.10, no property left being a chosen 0. A claim
    above 958.90 is refused.
  - >-
    CRA, Guide T4002 (2025), Self-employed Business, Professional, Commission, Farming, and
    Fishing Income (docs/cra-forms-2025/t4002-25e.pdf, confirmed from the PDF with pdftotext;
    https://www.canada.ca/content/dam/cra-arc/formspubs/pub/t4002/t4002-25e.pdf), "You were
    asking?": "Q. How do I calculate my CCA claim if I start a business and my first fiscal
    period is from June 1, 2025, to December 31, 2025? A. Since your fiscal period is less than
    365 days, you have to prorate your CCA claim. Calculate your CCA using the rules discussed in
    this chapter. However, base your CCA claim on the number of days in your fiscal period
    compared to 365 days. In this case, your fiscal period is 214 days. Suppose you calculate
    your CCA to be $3,500. The amount of CCA you can claim is $2,052 ($3,500 x 214 / 365)." The
    365 is the `full_year_days` of the `ca/cca_class_rates` dataset. This business started on
    September 23, 2025, so its first fiscal period, September 23 to December 31, 2025, is 8 + 31
    + 30 + 31 = 100 days, and the caller enters the 100. Days entered above 365 are refused,
    and none entered (0) is a full year.
  - >-
    https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2121/t2121-25e.pdf
  - >-
    CRA, Form T2121 (2025), Charts A to C (docs/cra-forms-2025/t2121-25e.pdf, the PDF text): Chart A
    "Total motor vehicle expenses: Add amounts 3 to 11." (12); "Business use part: amount 1 ÷ amount 2
    × amount 12 = 13" (13); "Business parking fees" (14); "Supplementary business insurance" (15);
    "Allowable motor vehicle expenses: Add amounts 13 to 15 (enter this total on line 9281 of Part 4)"
    (16). Chart B: "Total interest payable (accrual method) or paid (cash method) in the fiscal period" (17);
    "($350*** ÷ 30) × the number of days in the fiscal period for which interest was payable (accrual
    method) or paid (cash method)" (18); "Available interest expense: Amount 17 or 18, whichever is
    less (include this in amount 4 of Chart A above)" (19). Chart C: "Total lease charges incurred in
    your current fiscal period for the vehicle." (20); "Total lease payments deducted before your
    current fiscal period for the vehicle" (21); "Total number of days the vehicle was leased in your
    current and previous fiscal periods" (22); "Manufacturer's list price" (23); "Use a GST rate of 5%
    or HST rate applicable to your province."; "Amount 23 or ($44,706 + GST and PST, or $44,706 + HST),
    whichever is more" and "× 85%" (24); "[($1,100 + GST and PST, or $1,100 + HST) × amount 22] ÷ 30"
    (25); "Amount 25: amount 21" (26); "[($38,000 + GST and PST, or $38,000 + HST) × amount 20] ÷ amount
    24" (27); "Eligible leasing cost: Amount 26 or 27, whichever is less (enter in amount 8 of Chart A
    above)" (28). The charts are the figures of Return BB's leased vehicle with business kilometres 0
    (amount 1), a chosen figure, so amount 13 and line 9281 are 0 and the other lines are the same.
  - >-
    CRA, Form T2121 (2025), Charts A to C: the chosen figures are amount 2 (total kilometres) 10,000;
    amount 3 (fuel and oil) 1,000, amount 5 (insurance) 600, amount 7 (maintenance and repairs) 200
    and amount 10 (other expenses) 653; amounts 6, 9, 11, 14 and 15 are 0; amount 17 (total interest
    payable) 400 and the number of days 100, within the 100 days of the fiscal period,
    so line 18 is 350 ÷ 30 × 100 = 1,166.67 and amount 19 is
    the lesser, 400.00; amount 20 (total lease charges) 2,550, amount 21 (payments before the year) 0,
    amount 22 (days leased) 183, amount 23 (manufacturer's list price) 60,000 and the GST or HST rate
    13%: 44,706 + 13% = 50,517.78, 1,100 + 13% = 1,243.00 and 38,000 + 13% = 42,940.00; amount 23 or
    44,706 plus tax, whichever is more, is 60,000.00; amount 24 is 60,000.00 × 85% = 51,000.00; amount
    25 is 1,243.00 × 183 ÷ 30 = 7,582.30; amount 26 is 7,582.30 - 0 = 7,582.30; amount 27 is 42,940.00
    × 2,550 ÷ 51,000.00 = 2,147.00; and amount 28 is the lesser, 2,147.00. Chart A: amount 12 is 1,000
    + 400 + 600 + 200 + 2,147 + 653 = 5,000.00; amount 13 is 0 × 5,000 ÷ 10,000 = 0.00; and line 9281
    (amount 16) is 0.00 + 0 + 0 = 0.00. Every product and quotient here is exact to the cent, so no
    line is rounded; line 9281 is $0, so the fishing expenses do not change.
  - >-
    CRA, "T1-2025 Ontario edition" return (form 5006-R, docs/cra-forms-2025/5006-r-25e.txt,
    confirmed 2026-10-19), "Step 2 - Total income": "Line 26: Fishing income"; "Line 14300: Net";
    "Line 27: Add lines 22 to 26. Net self-employment income =". Line 14300 (line 26) is T2121
    line 9946, $15,000; lines 22 to 25 (business, professional, commission and farming income) are
    $0, a chosen figure, so line 27 is 0 + 0 + 0 + 0 + 15,000 = 15,000. Line 28 is line 21 (the sum
    of lines 1 to 20, every one a chosen $0) plus line 27, and total income (line 15000) is the sum
    of the income lines in line order, line 27 coming after line 20: $15,000.00. Total deductions
    are 0 (no CPP deduction, RRSP, union dues or child care expenses), so net income before
    adjustments (line 23400) is 15,000.00 and taxable income (line 26000) is 15,000.00.
  - >-
    https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-r/5006-r-25e.txt
  - >-
    The figures that depend on income, with the forms quoted in Return BC: T1 (form 5000-R) line
    77 (line 30000) is $16,129 for net income of $177,882 or less, so the federal credit amounts
    (line 33500) are 16,129.00 and line 33800 is 16,129.00 x 14.5% = 2,338.705, rounded half-up
    to the cent: 2,338.71 (line 35000, no Schedule 9 amounts). Part A "Federal tax on taxable
    income": taxable income of 15,000.00 is in column 1 "Line 26000 is $57,375 or less": line 74
    is 15,000.00 x 14.5% = 2,175.00. The non-refundable credits (2,338.71) are more than that
    tax, so the federal tax after credits is 0. The medical share, 3% of net income, is 450.00
    and the threshold, the lesser of that and $2,834, is 450.00, above the medical expenses of
    0. ON428 Part A: 15,000.00 x 5.05% = 757.50; the Ontario credit amounts are the basic
    personal amount 12,747.00, and 12,747.00 x 5.05% = 643.7235, rounded half-up to the cent:
    643.72, so the Ontario tax after credits is 757.50 - 643.72 = 113.78. The basic reduction is
    294.00, twice it, 588.00, less the tax of 113.78 is 474.22, which is more than the tax, so
    the tax after the reduction is 0. Schedule ON428-A: the LIFT credit is 5.05% of employment
    income, 0, less 5% of the net income over $32,500, 15,000.00 is not over it, so 0. The
    Ontario health premium chart, taxable income 15,000.00, is in "Row 1: Taxable Income of
    $20,000 or less": "Ontario health premium: $0", so the Ontario tax (line 42800) is 0.
    Schedule 6: the working income is the employment income of 0, so the Canada workers benefit
    is 0. T1 line 148 (line 43500) is the net federal tax 0 plus the Ontario tax 0 = 0.00, with
    no CPP or EI payable, no tax deducted and no credits, so line 167, the refund or balance
    owing, is 0.00, neither a refund nor a balance owing. These lines add and subtract amounts
    already in cents. The other credits and lines (the age, spouse, dependant and caregiver
    amounts, the Ontario credits and the refundable credits) are 0 for the same chosen counts
    and amounts as Return BC.
