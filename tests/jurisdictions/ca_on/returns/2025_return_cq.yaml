# Return CQ: a single Ontario resident for all of 2025 whose only income is rental income from one
# building bought on July 1, 2025, the first year of its rental activities (Form T776 Parts 3 and 4
# and Area A). Its fiscal period is from July 1 to December 31, 2025, 184 days (T776 Part 1, "Fiscal
# period from Date (Year/Month/Day) to (Year/12/31)": July 31 + August 31 + September 30 + October 31
# + November 30 + December 31 = 184); the caller enters the 184 days, and the CCA maximum of the class
# is prorated by 184 / 365 (Guide T4036, Area A "Column 23": "In your first year of rental
# activities, you may have to prorate your CCA claim."; Guide T4002, "You were asking?": "base your
# CCA claim on the number of days in your fiscal period compared to 365 days"). Gross rents for all
# units are a chosen $12,000 (one unit, line 8141), and expenses are a chosen $975.34 (insurance
# $600.00 and property taxes $375.34, line 8690 and line 9180), so line 8299 is $12,000.00 and line 1
# is $975.34 - $0 - $0 = $975.34 and line 9369 is $12,000.00 - $975.34 = $11,024.66. Area A has one
# class, Class 1 (4%), the building: additions (column 3) of $300,000.00, nothing at the start, no
# dispositions, so column 7 is $300,000.00; the half-year rule takes one half of the additions,
# $150,000.00 (column 18), so column 19 is $150,000.00 and the maximum of a full year is $150,000.00
# x 4% = $6,000.00; for 184 days it is $6,000.00 x 184 / 365 = $1,104,000 / 365 = $3,024.6575...,
# rounded half-up to the cent, $3,024.66, which is claimed in full (column 23), so column 24 is
# $300,000.00 - $3,024.66 = $296,975.34. There is no immediate expensing (no designated immediate
# expensing property), no short-term rental, no co-owner, no partner and no associated EPOP (Area G:
# the associated count is 0, the percentage 0 and the total 0, so the immediate expensing limit is
# the printed $1,500,000 prorated for the 184 days: $1,500,000 x 184 / 365 = $276,000,000 / 365 =
# $756,164.3835..., rounded half-up to the cent, $756,164.38), no recapture and no terminal loss.
# Line ii, and so line 9936, is $3,024.66, within amount 5 ($11,024.66), so line 9946, and so T1 line 12600, is $11,024.66 -
# $3,024.66 = $8,000.00. That is Return BS's line 9946 exactly, so every figure that depends on
# income is Return BS's, recomputed from the form arithmetic: $8,000.00 is the whole of total income
# (line 15000), the federal tax is $1,160.00 and the Ontario tax $404.00, both less than the
# non-refundable credits ($2,338.71 and $643.72), so there is no tax and the refund or balance owing
# is $0. Amounts are quoted decimal strings, never floats; counts are quoted digit strings. Every
# output the CA-ON manifest declares must appear under `expected`, or be left out to be 0 (or no
# records).
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025 whose only income is rental income from one
  building bought on July 1, 2025, reported on Form T776 for a fiscal period of 184 days (July 1
  to December 31, 2025; the caller enters the 184). Gross rents of $12,000 (line 8141) and
  expenses of $975.34 (insurance $600.00 and property taxes $375.34), so line 12599 is
  $12,000.00 and line 12600 is $8,000.00 (after the CCA below). Area A has one class: Class 1
  (4%), a building with additions of $300,000 in the year, whose maximum of $6,000.00 is
  prorated by 184 / 365 to $3,024.66, claimed in full, so the UCC at the end of the year
  (column 24) is $296,975.34. There is no immediate expensing, no Area G association and no
  short-term rental, so Chart B has no rows and column 22 is $0. The net income of $8,000.00 is
  the same as Return BS's, so the income-dependent lines of the return are Return BS's: total
  income, net income, taxable income, the federal and Ontario tax, which are $0 after the
  non-refundable credits. The CPP months (Schedule 8 box A) are the 12 of a full year, Schedule 8
  Part 4 is not completed (count 0) and there is no agreement with the Canada Employment
  Insurance Commission (count 0), so the CPP contributions, the EI premiums and the deduction on
  self-employment income are $0.
sources:
  - >-
    CRA, Form T776 (2025), Statement of Real Estate Rentals (docs/cra-forms-2025/t776-25e.txt,
    confirmed 2026-10-19), Part 1: "Fiscal period from Date (Year/Month/Day) to (Year/12/31)".
    Parts 3 and 4 and Area A (line 8141, line 9936, line 9946 and column 24) as in Return BS.
  - >-
    CRA, Guide T4036 (2025), Area A "Column 23 – CCA claim for the year" (text via pdftotext
    from docs/cra-forms-2025/t4036-25e.pdf): "In your first year of rental activities, you may
    have to prorate your CCA claim." The Guide gives no formula and no example.
  - >-
    CRA, Guide T4002 (2025), "You were asking?" (docs/cra-forms-2025/t4002-25e.pdf): "Since your
    fiscal period is less than 365 days, you have to prorate your CCA claim. ... base your CCA
    claim on the number of days in your fiscal period compared to 365 days. In this case, your
    fiscal period is 214 days. Suppose you calculate your CCA to be $3,500. The amount of CCA you
    can claim is $2,052 ($3,500 × 214 ÷ 365)." The Guide's example is a business; the rule is
    applied to the rental by analogy, as Guide T4036 gives no formula for a rental.
  - >-
    The tax lines, the CPP and EI lines and the credits are Return BS's, which cite the T1 and
    Ontario sources; they depend only on the net income, which is $8,000.00 here as there.

