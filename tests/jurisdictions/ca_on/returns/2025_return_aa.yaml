# Return AA: a 2025 Ontario resident with a spouse or common-law partner at the end of the
# year (the one shared spouse input is 1), whose employment income, a chosen $25,217.17 so that
# net income is exactly $25,000.00, is below the EI maximum insurable earnings ($65,700) and the CPP first
# earnings ceiling ($71,300), so the CPP contributions and EI premiums are the rates'
# arithmetic, not the printed maximums, and there is no second additional CPP contribution.
# 5.05% of the employment income is above the LIFT credit's $875 maximum, and with a spouse
# or common-law partner at the end of the year Part B of Schedule ON428-A applies: the
# adjusted family net income, the filer's $25,000.00 and the spouse's chosen $50,000, is
# above the $65,000 family threshold and the filer's own adjusted net income is below the
# $32,500 individual threshold, so the credit is $875 less 5% of the $10,000.00 by which the
# family income exceeds $65,000, $375.00, less than the Ontario tax after the reduction,
# which it brings down but not to zero. 27% of the working income over $3,000 is above the
# Canada workers benefit's $1,633 maximum. The filer has an eligible spouse (Schedule 6 line
# 38101, the answer 1), whose working income of $50,000 is column 2 of Schedule 6 Part A: the
# family working income is $75,217.17, the secondary earner exemption (line 14) is the $16,386
# maximum, the adjusted family net income is $58,614.00, above the $30,639 of line 24, so the
# Canada workers benefit is $0, and the total credits and refund follow from it. Computed from the Federal
# Worksheet's line 9, the eight sources of line 12100 added, and its line 11, that less
# the part reported in previous years, to the interest and other investment income (T1 line
# 12100); lines 14400, 14500 and 14600 added to line 14700;
# and, in line order, employment income (line 10100), the other employment income, the
# pension and benefit lines, the taxable dividends, the investment lines, the taxable
# capital gains, the taxable support payments, the RRSP, FHSA, other and scholarship income
# and line 14700 to total income (line 15000); from employment income, by Schedule 8's three
# contribution tiers, to the base, first additional and second additional CPP contributions,
# the last two together the enhanced CPP contributions; from employment income, up to the EI
# maximum insurable earnings, to the EI premiums; from the unused RRSP contributions from
# earlier years and the RRSP contributions, their sum, to the contributions available to
# deduct (Schedule 7 line 10), from those and the deduction limit, the lesser of them, to
# the most that may be deducted (Schedule 7 line 17), from the amount deducted (line 18), at
# most that, to the RRSP deduction (line 20), and from the contributions available to deduct
# less the RRSP deduction to the unused contributions carried forward (line 23); from the
# numbers of eligible children (T778 Part B lines 1 to 3), $8,000, $11,000 and $5,000 for
# each, summed to the basic limit (line 4), from employment income, the earned income (line
# 6), to two-thirds of it, and from those and the child care expenses paid (line 5), the
# least of them, to the child care expenses deduction (lines 7 and 9, T1 line 21400), here,
# with no eligible child and no expenses paid, zero; less the child care expenses deduction
# and the enhanced CPP contributions to net income, less the (empty) deductions from net
# income to taxable income; from net income, by the Federal Worksheet, to the federal basic
# personal amount; from it less the dependant's net income, not below zero, for each
# eligible dependant, to the amount for an eligible dependant (T1 line 30400), and from the
# ON428 base less the dependant's net income, not below zero, at most its maximum, for each
# eligible dependant, to the Ontario amount (ON428 line 58160); from the number of infirm
# children, $2,687 for each, to the amount for infirm children (line 30500), here, with no
# eligible dependant and no infirm child, all three zero; and through each form's total of
# non-refundable credit amounts (its basic personal amount, its amount for an eligible
# dependant, the base CPP contributions and the EI premiums, and on the T1 alone the amount
# for infirm children and the Canada employment amount), credited once at the form's credit
# rate to the form's non-refundable tax credits (T1 line 35000, ON428 line 61500), taken off
# its basic tax, not below zero, to the tax after credits, and on ON428 the surtax on the
# Ontario tax after credits, added to it to the Ontario tax with surtax, less the Ontario
# dividend tax credit (Worksheet ON428's line 61520, from lines 12000 and 12010, ON428 lines
# 56 to 58, 70 and 71), not below zero, to the Ontario tax after the dividend credit; and,
# with no dependent children or dependants, the Ontario tax reduction amounts (the basic
# reduction alone), twice them less the Ontario tax after the dividend credit, not below
# zero, to the Ontario tax reduction, taken off the Ontario tax after the dividend credit,
# not below zero, to the Ontario tax after the reduction; from employment income, by
# Schedule ON428-A, 5.05% of it at most $875 (lines 5, 14 and 29); from net income before
# adjustments, plus the UCCB and RDSP income repayments, less the UCCB and RDSP income, not
# below zero, to the adjusted net income (line 13), and from the spouse's net income,
# repayments and income (lines 21 to 27, the same five spouse figures the Federal Worksheet
# for line 45200 uses, entered once) in the same way to the spouse's adjusted net income
# (line 28); for a single filer, 5% of the adjusted net income over $32,500, not below zero,
# taken off the $875, not below zero (lines 15 to 20); with a spouse, the greater of the
# adjusted net income over $32,500 (line 32) and the adjusted family net income over $65,000
# (line 37), 5% of it (line 40), taken off the $875, not below zero (line 41); and, by the
# number of spouses or common-law partners at the end of the year, line 20 when it is 0 and
# line 41 otherwise, to the LIFT credit (ON428 line 85), taken off the Ontario tax after the
# reduction, not below zero, to the Ontario tax after the LIFT credit (line 86), less 25% of
# the qualifying donations (line 87), not below zero, to the Ontario tax after the food
# credit (line 88); and from taxable income, by the health premium chart's tiers, each
# capped at the next plateau, to the Ontario health premium, added to the Ontario tax after
# the food credit to the Ontario tax; from the working income of both spouses, by Schedule 6,
# 27% of the family working income over $3,000 at most $1,633, less 15% of the adjusted family net
# income over $26,855, not below zero, for a filer with no eligible spouse and no
# eligible dependant, and the same at most $2,813 and over $30,639 for a filer with one
# (line 38101 is 1 here: its column 2 and the secondary earner exemption of line 14 are in), and
# from those, by the family status of lines 21 and 24 (an eligible spouse or an eligible
# dependant, Schedule 6 line 38100 and line 38101), the first when there is neither and the
# second otherwise, to
# the Canada workers benefit (T1 line 45300); and on the T1, the federal tax after credits,
# carried to the net federal tax, plus the Ontario tax to the total payable, less the total
# credits, here the chosen income tax deducted plus the Canada workers benefit, to the
# refund or balance owing, negative for a refund and positive for a balance owing. There is
# no capital gain, unused or new RRSP contribution or union dues. Not yet computed, so not
# in this file: any deduction from net income and capital losses (the social benefits repayment, line 23500, is 0, as the chart does not apply). Line 82 (the provincial foreign tax credit) is not triggered by this return, and
# the qualifying donations for line 87 (the community food program donation tax credit for
# farmers) are a chosen $0, so line 87 is $0 and line 88 is line 86. Schedule 9's inputs are
# all a chosen $0, so lines 116 (34900) and 117 (34990) are $0 and line 35000 is line 33800.
# Nor are Schedule 5 line 2, T1 lines 30425 and 30450, the Ontario caregiver amount (ON428
# line 58185), Form T778 line 8 and Parts C and D, and Schedule 6's disability supplement
# (Step 3) and advance payments (Step 4); with no Schedule 6 eligible dependant (line
# 38100), the Schedule 6 amounts for a filer with no eligible spouse and no eligible
# dependant are the ones chosen (to be confirmed), though the benefit would be 0 with an
# eligible spouse, whose net income would raise the adjusted family net income to
# $75,000.00. The age amount (line 30100), the spouse or common-law partner amount (line
# 30300) and the Canada caregiver amount for a spouse or common-law partner (line 30425) are
# not triggered by this return, so each is 0 and its part of the T1's total of credit
# amounts is 0: the filer is taken as born in 1961 or later, with a spouse or common-law
# partner whose net income of $50,000 (a chosen figure, to be confirmed) is above the basic
# personal amount, so the counts of filers born in 1960 or earlier, of spouse amounts
# claimed and of spouses eligible for the Canada caregiver amount (line 51090) are 0 and the
# spouse's net income is entered as 50,000. They are computed all the same, in the order of
# the form's lines, from net income less the $45,522 income threshold, not below zero, at
# 15%, taken off $9,028, not below zero (line 30100), from the basic personal amount, the
# $2,687 for a spouse eligible for the Canada caregiver amount and the spouse's net income,
# not below zero (line 30300), and from $28,798 less the spouse's net income, at most
# $8,601, less the line 30300 amount, not below zero (line 30425), each claimed for its
# count. Amounts are quoted decimal strings, never floats; counts are quoted digit strings.
# Every output the CA-ON manifest declares must appear under `expected`; intermediate lines
# may be listed and are then checked too. ON428's age amount (line 58080, from Worksheet
# ON428) and spouse or common-law partner amount (lines 11 to 13, line 58120) are not
# triggered either, for the same counts of 0, so each is 0 and its part of ON428's total of
# credit amounts is 0. They are computed all the same, in the order of the forms' lines,
# from net income less the $46,330 income threshold, not below zero, at 15%, taken off
# $6,223, not below zero (line 58080), and from $11,905.00 less the spouse's net income, not
# below zero, at most $10,823 (line 58120), each claimed for its count. Ontario political
# contributions (ON479 line 15, line 63100) are a chosen $0, so Worksheet ON479's line 16 is
# $0 (column 1 applies).
# Form ON-BEN (lines 61020 to 61230) is not applied for (a chosen 0 for each tick box and a
# chosen $0 for each Part A amount), so its ten lines are carried as entered, all 0.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  An Ontario resident for all of 2025, over 19, with a spouse or common-law partner at the
  end of the year and no dependants, with 2025 employment income (T1 line 10100) of
  $25,217.17, a chosen figure that makes net income exactly $25,000.00, and no other income:
  no capital gain, so taxable capital gains (line 12700) of $0 and total income (line 15000)
  of $25,217.17. The CPP contributions are computed from employment income, which is entered as the
  T4 box 26 pensionable earnings (the slip's box 26 being blank, the form's "enter the amount from
  box 14"). The EI premiums are
  computed from employment income, taken as the insurable earnings. Employment income is
  below the EI maximum insurable earnings ($65,700) and the CPP first earnings ceiling
  ($71,300), so EI premiums (line 31200, ON428 line 58300) are 1.64% x 25,217.17 =
  413.555588, rounded half-up to the cent: $413.56, base CPP contributions (Schedule 8 line
  11, T1 line 30800, ON428 line 58240) are 4.95% x (25,217.17 - 3,500) = 4.95% x 21,717.17 =
  1,074.999915, rounded half-up to the cent: $1,075.00, and enhanced CPP contributions (line
  22215) are the first additional (Schedule 8 line 12) 1% x 21,717.17 = 217.1717, rounded
  half-up to the cent: $217.17 with no second additional contribution (line 22, $0). No
  unused or new RRSP contributions, so the most that may be deducted (Schedule 7 line 17) is
  $0, the lesser of the contributions available to deduct (Schedule 7 line 10) of $0 (the
  unused contributions from earlier years of $0, Schedule 7 line 1, plus the contributions
  of $0, Schedule 7 line 4) and a chosen deduction limit of $4,500 (Schedule 7 line 11); the
  amount deducted (line 18) is that $0, so the RRSP deduction (line 20800) is $0 and the
  unused contributions carried forward (line 23) are $0; no union dues (line 21200) and no
  child care expenses deduction (line 21400, Form T778, $0 with no eligible child and no
  child care expenses paid, to be confirmed), so total deductions (line 23300) are the
  enhanced CPP contributions of $217.17 and net income (line 23600) is $25,000.00. There are
  no deductions from net income (lines 24400 to 25600), so their total (line 25700) is $0
  and taxable income (line 26000), derived as net income less that total, is $25,000.00,
  inside the lowest federal and Ontario brackets. The non-refundable credit amounts are the
  basic personal amount (federal line 30000 $16,129, since net income is $177,882 or less;
  Ontario ON428 line 58040 $12,747), the base CPP contributions and the EI premiums, and on
  the T1 alone the Canada employment amount (line 31260) of $1,471, the lesser of $1,471 and
  employment income (ON428 has no such line): line 33500 of $19,088.56 and ON428 line 58800
  of $14,235.56. Each total includes $0 for an eligible dependant (line 30400, ON428 line
  58160) and, on the T1, $0 for infirm children (line 30500), as there is no eligible
  dependant and no infirm child; Schedule 5 and ON428 lines 14 to 16 are computed as for one
  eligible dependant with no net income, 16,129 federally and 11,905.00 at most $10,823 for
  Ontario, and claimed for none. The rate is applied once to each total: 14.5% federally
  (line 33800) and 5.05% for Ontario (ON428 line 58840). Each product, rounded half-up to
  the cent, is its form's non-refundable tax credits: the total federal non-refundable tax
  credits (line 35000) of $2,767.84 and the Ontario non-refundable tax credits (ON428 line
  61500) of $718.90, each taken off its form's basic tax, not below zero. The Ontario surtax
  (ON428 line 68) is 20% of the Ontario tax after credits over $5,710 plus 36% of it over
  $7,307: $0, as the Ontario tax after credits is below $5,710, so the Ontario tax with
  surtax (ON428 line 69) is that same $543.60. With no dividends, Worksheet ON428's lines A
  and B (lines 12000 and 12010) are $0, so the Ontario dividend tax credit (ON428 line 57,
  line 61520) and line 70 are $0, and the Ontario tax after the dividend credit (ON428 line
  71, which is line 73) is that same $543.60. With no dependent children and no dependants
  (ON428 lines 75 and 76), the Ontario tax reduction amounts (line 77) are the basic
  reduction of $294.00 (line 74); twice them, $588.00 (line 78), less the Ontario tax after
  the dividend credit of $543.60 (line 79, from line 73, which is line 71 as line 72 is not
  triggered) is $44.40, the Ontario tax reduction (line 80), and the Ontario tax after the
  reduction (line 81) is $543.60 - $44.40 = $499.20. The LIFT credit (ON428 line 85,
  Schedule ON428-A): a spouse or common-law partner at the end of the year (the count is 1)
  means Part B applies. Line 5 is 5.05% of employment income, 25,217.17 x 5.05% = 1,273.467,
  rounded half-up to the cent: $1,273.47, at most $875 (lines 14 and 29). Lines 7, 8, 10 and
  11 (the UCCB and RDSP repayments and income) are not triggered, so line 9 is line 6, the
  net income of $25,000.00, and line 13, the adjusted net income, is $25,000.00 - $0 =
  $25,000.00. The spouse's net income (line 21) is a chosen $50,000 and their lines 22, 23,
  25 and 26 a chosen $0 (all to be confirmed), the same five spouse figures the Federal
  Worksheet for line 45200 takes as its column 2 and entered once, so line 28, their
  adjusted net income, is $50,000. Line 32 is $25,000.00 - $32,500.00, negative, so $0; line
  35, the adjusted family net income, is $25,000.00 + $50,000 = $75,000.00; line 37 is
  $75,000.00 - $65,000.00 = $10,000.00; line 38 is the greater of $0 and $10,000.00,
  $10,000.00; line 40 is 5% of it, $500.00; and line 41 is $875 - $500.00 = $375.00, the
  LIFT credit, where Part A (line 20) would have given the whole $875. It is less than the
  Ontario tax after the reduction, so the Ontario tax after it (ON428 line 86) is $499.20 - $375.00 = $124.20. With chosen
  qualifying donations of $0, the community food program donation tax credit for farmers
  (ON428 line 87) is 25% x $0 = $0 and the Ontario tax after it (line 88) is that same
  $124.20. The Ontario health premium (ON428 line 89) is read from its chart on taxable
  income: $25,000.00 is more than $20,000 but not more than $25,000, so the premium is
  (25,000.00 - 20,000) x 6% = $300.00, and the Ontario tax (ON428 line 90) is the Ontario
  tax after the food credit plus the premium, $124.20 + $300 = $424.20. On the T1, the net
  federal tax (line 42000) is the federal tax after credits, $857.16, and the total payable
  (line 43500) is it plus the Ontario tax (line 42800), $1,281.36. The Canada workers
  benefit (line 45300, Schedule 6) is 27% of the family working income, the working income
  of both spouses, $75,217.17, over $3,000, 72,217.17 x 27% = 19,498.6359, at most $2,813
  (the eligible spouse's line 21 maximum), less 15% of the adjusted family net income,
  $58,614.00, over $30,639, 27,975.00 x 15% = 4,196.25: 2,813.00 - 4,196.25 is negative, so
  $0. The eligible spouse is a chosen answer (line 38101, 1) and the spouse's working income is a
  chosen $50,000, to be confirmed against the spouse's own return. The income
  tax deducted (line 43700) is a chosen $2,500, so the total credits (line 48200) are it
  plus the benefit, $2,500.00 + $0 = $2,500.00, and the refund or balance owing (line 167) is
  the total payable less the total credits, $1,281.36 - $2,500.00 = -$1,218.64: negative, so a
  refund (line 48400). The Canada
  caregiver amount for dependants (T1 lines 30450 and 31800 and ON428 line 58185) is not
  triggered by this return, with no dependant on any list, so each is 0 (to be confirmed).
  Every amount computed from a rate, fraction, amount or chart on the forms is rounded half-up to
  the cent, each line being a dollars-and-cents box; here that changes the base CPP
  contributions, the first additional CPP contributions, the EI premiums, the child care
  earned income limit, both forms' non-refundable tax credits and the LIFT credit before its
  maximum, and the lines that follow from them. The lines that only add, subtract, compare
  or choose take amounts already in cents, so the refund or balance owing is in cents too.
  The other Step 2 income lines are 0: no other employment income, pension or benefit income
  (lines 10400 to 11900), the Federal Worksheet's lines 1 to 8 and line 10 being 0 so that
  its line 9, its line 11 and the interest and other investment income (line 12100) are 0,
  no partnership or RDSP income (lines 12200 and 12500), no taxable support payments, RRSP,
  FHSA, other or scholarship income (lines 12800 to 13010) and no workers' compensation,
  social assistance or net federal supplements, so line 14700 is 0 + 0 + 0 = 0. The age
  amount (line 30100), the spouse or common-law partner amount (line 30300) and the Canada
  caregiver amount for a spouse or common-law partner (line 30425) are each $0: the filer is
  taken as born in 1961 or later (the count of filers born in 1960 or earlier, line 78, is
  0), claims no spouse amount (count 0) and has no spouse eligible for the Canada caregiver
  amount (line 51090, count 0), and the spouse's net income entered is $50,000 (a chosen
  figure, the same as Schedule ON428-A line 21, to be confirmed). They are computed all the
  same (net income of $25,000.00 is at or below $45,522, so the Federal Worksheet's line 4
  and line 6 are $0.00 and its line 7 is $9,028.00; Schedule 5 line 30300 is $16,129.00 less
  the spouse's $50,000, negative, so $0, and line 30425 $28,798.00 less $50,000, negative,
  so $0) and claimed for 0, so the totals of credit amounts are those without them. ON428's
  age amount (line 58080, Worksheet ON428) and spouse or common-law partner amount (lines 11
  to 13, line 58120) are each $0, for the same counts. They are computed all the same (the
  worksheet's line 4 is the net income over $46,330, $0.00, line 6 is 15% of it, $0.00, and
  line 7 is $6,223.00; ON428 line 13 is the $11,905.00 base less the spouse's net income of
  $50,000, negative, so $0) and claimed for 0, so ON428's total of credit amounts is as
  without them.
  No self-employment income: the net business, professional, commission, farming and fishing
  income (T1 lines 13500, 13700, 13900, 14100 and 14300) are $0, so their sum (line 27) is
  $0, and it is a $0 term of total income (line 15000). The CPP months (Schedule
  8 box A) are the 12 of a full year, Schedule 8 Part 4 is not completed (count 0) and there
  is no agreement with the Canada Employment Insurance Commission (count 0), so the CPP
  contributions payable (line 42100), the base CPP contributions (line 31000) and the
  deduction (line 22200) on self-employment income, and the EI premiums on it (lines 31217
  and 42120), are $0 and change no total.
