# Return LZ: Guide T4002's Meadow example for a leased passenger vehicle, Chart C of the Form T2125, pinned
# to the cent (a CRA example). Meadow leased a passenger car from July 1, 2025 for business income, with a
# December 31 fiscal year-end (a full fiscal period, 0 days entered), a PST of 8% and a GST of 5% (the
# 13% sales tax rate): monthly payment $500, lease payments for 2025 $3,000, manufacturer's list price
# $33,000, 184 days leased, nothing deducted before 2025. The Guide prints no gross sales, kilometres or
# other expense for her, so those are chosen: gross sales $40,000 (line 8299), and the car used only for
# business (10,000 of 10,000 kilometres, so Chart A amount 13 is the whole of amount 12, which is only
# the lease charges of Chart A amount 8).
#
# Chart C beside the Guide's printed figures (Guide T4002 (2025) printed page 55, "Example"; the Guide
# rounds each line to a whole dollar, the engine keeps cents, as Umar ruled on 26 Oct 2026 in #528):
#   line 20 lease charges $3,000 (Guide $3,000); line 21 $0 (Guide $0); line 22 184 days (Guide 184);
#   line 23 list price $33,000 (Guide $33,000);
#   line 24 = the greater of $33,000 and ($44,706 + $5,811.78 of tax at 13%) = $50,517.78, x 85% =
#     $42,940.11 (Guide $42,940, from tax of $5,812);
#   line 25 = ($1,100 + $143) x 184 / 30 = $7,623.73 (Guide $7,624);
#   line 26 = line 25 - line 21 = $7,623.73 (Guide: amount 6, $7,624);
#   line 27 = ($38,000 + $4,940) x $3,000 / $42,940.11 = $2,999.99 (Guide $3,000: the Guide's line 7
#     is "($42,940 x $3,000) / $42,940" with the line 24 it rounded to the dollar);
#   line 28 = the lesser of line 26 and line 27 = $2,999.99 (Guide: "her allowable claim is $3,000").
# The one cent difference is the Guide's whole-dollar illustration, not an instruction of the form.
# So Chart A amount 8 is $2,999.99, line 9281 is $2,999.99, the total expenses (line 9368) are
# $2,999.99 and the net business income (line 9946, T1 line 13500) is $37,000.01; the other expected
# lines are the engine's, computed from those.
#
# Schedule 8 Part 4 is completed (ca/cpp_part_4_completed 1), as in Return LT; the CPP-dependent lines of
# the return are the engine's, not CRA's.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025 whose only income is the net business income of one sole proprietorship
  reported on one Form T2125 for a full fiscal period (0 days entered): chosen gross sales of $40,000
  (line 8299) and Guide T4002's Meadow example, one passenger car leased for 184 days (list price $33,000, lease
  charges $3,000, a sales tax rate of 13%) used only for business, so Chart C's eligible leasing cost
  is $2,999.99 where the Guide, rounding each line to the dollar, prints $3,000, the allowable motor vehicle
  expenses (line 9281) and the total expenses (line 9368) are $2,999.99 and the net business income
  (line 9946, T1 line 13500) is $37,000.01. No capital cost allowance is claimed.
sources:
  - >-
    CRA, Guide T4002 (2025), Self-employed Business, Professional, Commission, Farming, and Fishing Income
    (docs/cra-forms-2025/t4002-25e.pdf, confirmed from the PDF with pdftotext -layout), printed page 55,
    "Leasing costs for a passenger vehicle", Example: "On July 1, 2025, Meadow started leasing a car that is a
    passenger vehicle."; "($42,940 × $3,000) ÷ $42,940 $ 3,000 7"; "Meadow's eligible leasing cost is either amount 6
    or 7, whichever amount is less. In this case, her allowable claim is $3,000."
  - >-
    CRA, Form T2125 (2025), Statement of Business or Professional Activities (docs/cra-forms-2025/t2125-25e.pdf,
    confirmed from the PDF with pdftotext -layout), Chart C "Eligible leasing cost for passenger vehicles" lines
    20 to 28, "Eligible leasing cost: Amount 26 or 27, whichever is less (enter in amount 8 of Chart A above)"; Chart A
    "Allowable motor vehicle expenses: Add amounts 13 to 15 (enter this total on line 9281 of Part 4)".
