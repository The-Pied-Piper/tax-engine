# Return EU: a 2025 Ontario resident with QSBCS, QFFP and QFFP foreclosure dispositions in 2025 (gains of
# $300,000, $200,000 and $100,000, Schedule 3 lines 10700, 11000 and 12400) and $600,000 of ordinary
# share gains, and Form T657 worked through Charts 2016 to 2025 with the additional deduction
# of Part 2 completed for 2017, 2018, 2020, 2021, 2022 and 2023, T3 box 30 amounts on Charts 2021 to 2023, Chart
# 2024 Periods 1 and 2 and Chart 2025 Parts 1 and 2 with every amount filled in. Line 25400 is the
# claimed 400,000.00, below the Chart 2025 Part 2 maximum of 543,500.01. The worked derivation is in
# the description; Return ET takes Step 1, Step 2, Chart 1, Chart 2 and Charts 2016 to 2020 further.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025, resident in Canada throughout 2025, aged 18 or older at
  the end of 2025, with other income (T1 line 13000) of $10,000 (a chosen figure) and four
  dispositions in 2025, all chosen figures: qualified small business corporation shares (QSBCS) for
  proceeds $400,000 less adjusted cost base $100,000 (gain 300,000.00, Schedule 3 line 10700);
  qualified farm or fishing property (QFFP) for $250,000 less $50,000 (gain 200,000.00, line 11000);
  a QFFP foreclosure for $120,000 less $20,000 (gain 100,000.00, line 12400); and ordinary shares
  for $800,000 less $200,000 (gain 600,000.00, line 13200 and not qualifying), outlays nil. The gain
  is 1,200,000.00, less the 2,000 reserve claimed in 2025 (Form T2017 line 12, below), 1,198,000.00,
  and the taxable capital gain 599,000.00 (inclusion rate 50%); net income (line 23600) is
  599,000.00 + 10,000.00 = 609,000.00. No net capital losses are claimed. Every figure
  below is derived by hand from Form T657 (2025 edition) before the engine is run; Return ET is the
  companion that takes the same form through Chart 1, Chart 2 and the 2016 to 2020 charts.
  Form T657 reads the reserves of earlier years and of 2025 from the rows of Form T2017 (lines 2 and
  8), so each is a row of a disposition in that year; the T2017 amounts, T3 box 30 amounts, the
  amounts left out of Chart 2025 Part 2 and the (x-1) calculations are chosen figures, each
  independent of the others. Form T2017 lines 1 and 7 (the 2024 reserves, a line 66844 and 67055
  figure of the 2024 form) are the filer's own figures and are not reconciled with the rows'
  previous-year claims here (line 1 is 600,000 while the rows of lines 2 to 4 carry more).
  Step 1: line 1 is 300,000.00 + 200,000.00 + 100,000.00 = 600,000.00 (lines 10700, 11000 and 12400,
  not the ordinary shares); line 2 (Form T2017 line 13) is 598,000 (line 6, 600,000, plus line 12,
  -2,000, the 2025 reserve of 2,000 on a QSBCS disposition), so line 3 is 1,198,000.00; line 5 is
  599,000.00; line 6 (Form T2048 line 17216) is 0; line 7 is 599,000.00. Line 8 (Schedule 3 line
  19900, 600,000.00 less the -2,000 of line 19200) is 599,000.00; lines 9 and 11 are 0; lines 10 and
  12 are 599,000.00; line 13 is 599,000.00. Lines 14 to 20 are 0; line 21, the annual gains limit,
  is 599,000.00.
  Chart 2: only line 18 (2001 to 2024 deductions) is filed, 60,000; lines 1 to 14 are 0 and IR is
  blank (line 14 is 0), so line 15 to line 17 are 0 and line 19 is 60,000.00. Step 2: line 8 is
  150,000 (2002 to 2024) + 599,000.00 = 749,000.00, so line 9 is 749,000.00; line 17 is 60,000 and
  the other lines are 0, so line 18 is 60,000.00 and line 19, the cumulative gains limit, is
  689,000.00.
  Chart 2016 reports nothing: B is Chart 2 line 19, 60,000.00, so C is 412,088.00 - 60,000.00 =
  352,088.00; D, E, F, G and H are 0, the additional deduction is not claimed and the total carried
  is G, 0.
  Chart 2017 uses the (2017-1) calculation: D is the entered 412,858. A is 417,858.00, B is 0, so C is
  417,858.00 and E is 5,000.00. F (line 6, QFFP) is 300,000 and G (line 12) is 0: H is 150,000.00 and
  I, the lesser of E and H, is 5,000.00; K is 5,000.00 and L is 5,000.00. The additional deduction is
  claimed and E (5,000.00) is equal to or less than 599,000.00, 689,000.00 and K (5,000.00), so Part
  2 is completed: A is 500,000.00; B (Part 1's K) is 5,000.00, so C is 495,000.00; D is 412,858, so E
  is 82,142.00, the additional $82,142 the form prints; F (line 6 x 1/2) is 150,000.00; G is the
  lesser of E and F: 82,142.00; H is 5,000.00 and I is 87,142.00; J is the lesser of F and I:
  87,142.00; K is 87,142.00. The total carried is Part 2's J, 87,142.00.
  Chart 2018 uses the (2018-1) calculation: D is the entered 326,984. A is 424,126.00; B is 87,142.00,
  so C is 336,984.00 and E is 10,000.00. F (line 6) is 300,000 and G is 0: H is 150,000.00 and I is
  10,000.00; K is 97,142.00 and L is 97,142.00. The additional deduction is claimed and E is equal to
  or less than 599,000.00, 689,000.00 and K, so Part 2 is completed: A is 500,000.00; B (Part 1's K)
  is 97,142.00 and C is 402,858.00; D is 326,984, so E is 75,874.00, the additional $75,874 the form
  prints; F is 150,000.00 (line 6 x 1/2); G is 75,874.00; H is 97,142.00 and I is 173,016.00; J is
  the lesser of F and I: 150,000.00; K is 150,000.00. The total carried is Part 2's J, 150,000.00.
  Chart 2019 reports nothing and takes Chart 2 line 19 (60,000.00) as D: A is 433,456.00, B is
  150,000.00, C is 283,456.00 and E is 223,456.00; K is B, 150,000.00, and so is the total carried.
  Chart 2020 uses the (2020-1) calculation: D is the entered 281,692. A is 441,692.00; B is 150,000.00,
  so C is 291,692.00 and E is 10,000.00. F (line 6) is 200,000 and G is 0: H is 100,000.00 and I is
  10,000.00; K is 160,000.00 and L is 160,000.00. The additional deduction is claimed and E is equal
  to or less than all three amounts, so Part 2 is completed: A is 500,000.00; B (Part 1's K) is
  160,000.00 and C is 340,000.00; D is 281,692, so E is 58,308.00, the additional $58,308 the form
  prints; F is 100,000.00 (line 6 x 1/2); G is 58,308.00; H is 160,000.00 and I is 218,308.00; J is
  the lesser of F and I: 100,000.00; K is 100,000.00. The total carried is Part 2's J, 100,000.00.
  Chart 2021 uses the (2021-1) calculation: D is the entered 336,109. A is 446,109.00; B is
  100,000.00, so C is 346,109.00 and E is 10,000.00. F (line 6, QFFP) is 500,000 and G (line 12,
  QSBCS) is 40,000: 540,000.00 x 1/2 is H, 270,000.00; the box 30 amount of a 2025 T3 slip for a
  2021 disposition is 100,000, so I is 50,000.00 and J (H plus I) is 320,000.00. K is the lesser of E
  and J: 10,000.00; L (amount B) is 100,000.00 and M is 110,000.00; N is 110,000.00. The additional
  deduction is claimed and E is equal to or less than 599,000.00, 689,000.00 and M, so Part 2 is
  completed: A is 500,000.00; B (Part 1's M) is 110,000.00, so C is 390,000.00; D is 336,109, so E is
  53,891.00, the additional $53,891 the form prints; F (line 6 x 1/2) is 250,000.00; G (the box 30
  amount for the QFFP disposed of in 2021, 100,000, x 1/2) is 50,000.00; H is 300,000.00; I is the
  lesser of E and H: 53,891.00; J (amount B) is 110,000.00 and K is 163,891.00; L is the lesser of H
  and K: 163,891.00; M is 163,891.00. The total carried is Part 2's L, 163,891.00.
  Chart 2022 uses the (2022-1) calculation: D is the entered 282,924. A is 456,815.00; B is
  163,891.00, so C is 292,924.00 and E is 10,000.00. F (line 6) is 300,000 and G (line 12) is
  20,000: H is 160,000.00; the T3 box 30 amount is 8,000, so I is 4,000.00 and J is 164,000.00. K is
  the lesser of E and J: 10,000.00; M is 173,891.00. The additional deduction is claimed and Part 2
  is completed: A is 500,000.00; B is 173,891.00 and C is 326,109.00; D is 282,924, so E is
  43,185.00, the additional $43,185 the form prints; F is 150,000.00 (300,000 x 1/2); G (the box 30
  amount for the QFFP, 140,000, x 1/2) is 70,000.00; H is 220,000.00; I is the lesser of E and H:
  43,185.00; K (I plus B) is 217,076.00; L is the lesser of H and K: 217,076.00; M is 217,076.00. The
  total carried is Part 2's L, 217,076.00.
  Chart 2023 uses the (2023-1) calculation: D is the entered 258,519. A is 485,595.00; B is
  217,076.00, so C is 268,519.00 and E is 10,000.00. F (line 6) is 300,000 and G (line 12) is 30,000:
  H is 165,000.00; the T3 box 30 amount is 20,000, so I is 10,000.00 and J is 175,000.00. K is the
  lesser of E and J: 10,000.00; M is 227,076.00 and N is 227,076.00. The additional deduction is
  claimed and Part 2 is completed: A is 500,000.00; B is 227,076.00 and C is 272,924.00; D is
  258,519, so E is 14,405.00, the additional $14,405 the form prints; F is 150,000.00 (300,000 x 1/2);
  G (the box 30 amount for the QFFP, 100,000, x 1/2) is 50,000.00; H is 200,000.00; I is the lesser
  of E and H: 14,405.00; K (I plus B) is 241,481.00; L is the lesser of H and K: 200,000.00; M is
  200,000.00. The total carried is Part 2's L, 200,000.00.
  Chart 2024 Period 1 (A 508,418.00): B is 200,000.00, so C is 308,418.00 and E is 248,418.00 (D is
  Chart 2 line 19). Form T2017 gives F (line 6) 30,000.01 and G (line 12) 0: the reserves of
  dispositions in Period 1 of 2024 reported on a T5013 slip by a partnership whose year began before
  June 25, 2024 are Chart 2025 Part 1's, not this chart's (Guide T4037); H (T3 box 30) is 20,000: F
  to H add to 50,000.01 and I is 50,000.01 x 1/2 = 25,000.005, rounded half up to the cent:
  25,000.01. J (the T2048 line 17216 portion) is 5,000, so K is 20,000.01; L is the lesser of E and
  K: 20,000.01; M (amount B) is 200,000.00 and N is 220,000.01; O is 220,000.01. Period 2 (A
  625,000.00): B is Period 1's N, 220,000.01, so C is 404,999.99 and E is 344,999.99. F is 0, G is
  50,000 and H is 10,000: 60,000.00, I is 30,000.00; J is 4,000, so K is 26,000.00; L is 26,000.00,
  N is 246,000.01 and O is 246,000.01.
  Chart 2025 Part 1 (A 522,145.00): B is Period 2's N, 246,000.01, so C is 276,144.99 and E is
  216,144.99. The T3 or T5013 amounts are F 50,000 (box 57 or 153), G 20,000 (box 55 or 154), H
  15,000 (box 155) and the Form T2017 amounts I 8,000 (line 6) and J 6,000 (line 12), the reserves
  of Period 1 dispositions reported on a slip by a partnership whose year began before June 25,
  2024: F to J add to 99,000.00 and K is 49,500.00. L (the T2048 line 17216 portion) is 4,000, so M
  is 45,500.00 and N, the lesser of E and M, is 45,500.00; O (amount B) is 246,000.01 and P is
  291,500.01; Q is 291,500.01.
  Chart 2025 Part 2 (A 625,000.00): B is Part 1's P, 291,500.01, so C is 333,499.99 and E is
  273,499.99. F is line 10700 less the 50,000 not to include, 250,000; G is line 11000 less 20,000,
  180,000; H is line 12400 less 10,000, 90,000. I (Form T2017 line 6, 2025 reserves) is 0 and J
  (line 12) is -2,000, the 2,000 reserved on the QSBCS disposed of in 2025: F to J add to 518,000.00
  and K is 259,000.00. L is 7,000, so M is 252,000.00 and N is the lesser of E (273,499.99) and M:
  252,000.00. O (amount B) is 291,500.01, so P is 543,500.01 and Q is the lesser of 599,000.00,
  689,000.00 and P: 543,500.01, the maximum for line 25400.
  The filer claims 400,000 (a chosen figure, less than the maximum), so line 25400 is 400,000.00 and
  line 25700 is 400,000.00. Line 26000, the taxable income, is 609,000.00 - 400,000.00 =
  209,000.00. The other lines are blank and are the engine's figures (to be confirmed against CRA's
  calculator).
