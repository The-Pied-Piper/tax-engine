# Return LD: Guide T4002's Jennifer (the example for personal use of property, printed page 88), a
# single Ontario resident whose only income is the net business income of one business reported on one
# Form T2125 for a full fiscal period (0 days entered). Jennifer bought a car in 2025 for $20,000 that
# she uses for both personal and business use (12,000 business kilometres of 18,000 total); the car is
# Class 10, and "she calculates a CCA claim of $3,000", of which her business part is 12,000 / 18,000 x
# $3,000 = $2,000, entered on line 9936.
#
# CRA's printed figures are the $3,000 claim, the personal part ($1,000, the claim less the $2,000) and
# the $2,000 on line 9936. The guide prints no sales figure: the gross sales of $20,000 (line 8299) are
# a chosen one, so the other expected lines are the engine's, computed from those.
#
# Column 12: a property acquired after 2024 that becomes available for use in 2025 is a RIIP
# (Guide "Column 12", "Reaccelerated investment incentive property"), so the car's $20,000 is entered
# in column 12 and the form's maximum is $9,000 (column 17 $20,000 x 1/2, column 19 $30,000, x 30%).
# The guide's $3,000 is the half-year rule's maximum ($20,000 x 50% x 30%) and the guide does not say
# which column 12 it assumes; this return takes the claim as printed, below the form's maximum.
#
# Schedule 8 Part 4 ("Complete this part if you are reporting only self-employment income") is completed
# (ca/cpp_part_4_completed 1), as the form directs for a return whose only income is self-employment;
# the CPP-dependent lines of the return are the engine's, not CRA's.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025 whose only income is the net business income of one sole
  proprietorship reported on one Form T2125 for a full fiscal period (0 days entered): chosen gross sales
  of $20,000 (line 8299) and Guide T4002's Jennifer, a Class 10 car bought in 2025 for $20,000 (Area A
  column 3 and column 12 $20,000) with a CCA claim of $3,000 of which $1,000 is personal use, so
  $2,000 is claimed on line 9936 and the UCC at the end of the year is $17,000.
sources:
  - >-
    CRA, Guide T4002 (2025), Self-employed Business, Professional, Commission, Farming, and Fishing Income
    (docs/cra-forms-2025/t4002-25e.pdf, confirmed from the PDF with pdftotext -layout), printed page 88,
    "Personal use of property", Example: "Jennifer owns a business. She bought a car in 2025 that she uses
    for both personal and business use. The car cost $20,000, including all charges and taxes. Therefore,
    she includes the car in Class 10. Her business use this year was 12,000 kilometres of the total 18,000
    kilometres driven. ... she calculates a CCA claim of $3,000. ... 12,000 (business kilometres) ÷ 18,000
    (total kilometres) × $3,000 = $2,000. Jennifer enters $2,000 on line 9936."
  - >-
    CRA, Guide T4002 (2025), "Column 12 - Cost of remaining additions from column 10 that are RIIPs or
    ZEVs acquired after 2024" and "Column 17", and Form T2125 (2025) Area A (docs/cra-forms-2025/
    t2125-25e.pdf, columns 12, 17, 18, 19 and 21).
