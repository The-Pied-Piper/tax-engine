# Return GT: a self-employed filer whose only activity is one Form T2042 (farming) statement of a
# sole proprietor with one Area A row (Class 6, capital cost allowance $3,000) of which a personal
# part ($400) comes off line 9936 and a business-use-of-home part (amount 7K, $600) is entered
# on Part 7, with home expenses of $10,500 less a personal-use part of $1,500. Gross income
# $102,850.00, expenses $18,000.00 (4B $16,000.00 + line 9936 $2,000.00), net income $84,850.00,
# the home claim (line 9945) $9,600.00, so net farming income (line 9946) is $75,250.00 and the
# T1 and tax figures are the ones of Return EY, a balance owing of $14,468.38. Each figure is
# worked by hand from the form lines (see the description). Amounts are quoted decimal strings,
# never floats; counts are quoted digit strings.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025, resident in Canada throughout 2025, aged 18 or older at
  the end of 2025, with 12 months of CPP (Schedule 8 box A), Schedule 8 Part 4 not completed and no
  agreement for EI, as Return EY; every figure is a chosen one. One T2042 statement, no partner.
  Part 3: wheat 9371 82,850 and cattle 9471 20,000, so line 9659 and amount 4A are 102,850. Part 4:
  fertilizers and lime 9662 6,000 and seeds and plants 9664 10,000, so amount 4B is 16,000. Area A,
  one row, Class 6 (10%, Guide T4002): undepreciated capital cost at the start 30,000, no
  additions, no disposals, CCA claimed 3,000 (the maximum is 10% of 30,000 = 3,000), so amount ii
  of Area A is 3,000. Line 9936 is amount ii minus any personal part and any CCA for
  business-use-of-home expenses: the personal part (a chosen 400) gives 3,000 - 400 = 2,600, and
  amount 7K (a chosen 600, business part only) gives 2,600 - 600 = 2,000. Line 9898 = 16,000 +
  2,000 = 18,000; line 9899 = 102,850 - 18,000 = 84,850; there are no inventory adjustments, so 4C =
  84,850; 5A = 84,850 (no partner); lines 9951 and 9974 are 0, so 5B = 84,850; line 9943 is 0, so
  5C = 84,850. Part 7: heat 2,000, electricity 1,500, insurance 400, maintenance 800, mortgage
  interest 3,000, property taxes 2,200 and other expenses 600, so amount 7H = 10,500; amount 7I,
  the personal-use part, is 1,500, so 7J = 10,500 - 1,500 = 9,000; amount 7K is 600 and the
  amount carried forward (7L) is 0, so 7M = 9,000 + 600 + 0 = 9,600; amount 7N is 5C, 84,850; 7O =
  9,600 - 84,850 is below 0, so 0 is carried forward; 7P, the lesser of 9,600 and 84,850, is
  9,600, which is line 9945. Line 9946 = 84,850 - 9,600 = 75,250. T1 line 14100 is 75,250.00 and the
  federal and Ontario figures are Return EY's (federal tax after credits 9,645.05, Ontario tax
  after credits 4,073.33, health premium 750, total payable 14,468.38, a balance owing).
sources:
  - >-
    CRA, Form T2042 (2025), Statement of Farming Activities (docs/cra-forms-2025/t2042-25e.pdf;
    https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2042/t2042-25e.pdf). Part 3: the
    income lines 9371 to 9605 and "Other income (specify)" (9600), "Gross income: Total of the
    income lines (enter this amount on line 14099 of your income tax and benefit return)" (9659).
    Part 4: "Gross income (line 9659 of Part 3)" (4A), the expense lines 9661 to 9820 and 9790,
    "Subtotal of expenses" (4B), "Capital cost allowance (CCA). Enter amount ii of Area A minus any
    personal part and any CCA for business-use-of-home expenses" (9936), "Total farm expenses:
    Amount 4B plus line 9936" (9898), "Net income (loss) before inventory adjustments: Amount 4A
    minus line 9898" (9899), "Optional inventory adjustment included in the current year" (9941),
    "Mandatory inventory adjustment included in the current year" (9942), "Net income (loss) after
    inventory adjustments: Total of lines 9899, 9941, and 9942" (4C). Part 5: "Your share of amount
    4C or the amount from your T5013 slip" (5A), "Return of fuel charge proceeds to farmers tax
    credit allocated to you in the year (amount 5C of Form T2043)" (9951), "Total: Amount 5A plus
    line 9951 plus line 9974" (5B), "Net income (loss) after adjustments: Amount 5B minus line 9943"
    (5C), "Your net income (loss): Amount 5C minus line 9945" (9946). Part 7: "Subtotal: Add
    amounts 7A to 7G." (7H), "Subtotal: Amount 7H minus amount 7I" (7J), "Capital cost allowance
    (business part only), which means amount ii of Area A minus any portion of capital cost
    allowance that is for personal use or entered on line 9936 of Part 4" (7K), "Subtotal: Add
    amounts 7J to 7L." (7M), "Allowable claim: Amount 7M or 7N above, whichever is less (enter your
    share of this amount on line 9945 of Part 5)" (7P).
  - >-
    CRA, Guide T4002 (2025), "Class 6 (10%)" (docs/cra-forms-2025/t4002-25e.pdf): the rate of the
    class is 10%; the maximum claim of 3,000 (10% of the 30,000 undepreciated capital cost) is this
    return's own calculation.

