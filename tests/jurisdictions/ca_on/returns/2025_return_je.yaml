# Return JE: the credit a partnership allocates to a farmer is on two forms, Form T2042 line 9951
# of the business's statement and Form T2043 line 67079 (Ontario), and line 9951 totalled over the
# statements may not be above amount 5C (T2043 note 2). Two Alberta farming businesses as in
# Return EW, but the credit is 500.00 from one Ontario partnership, entered once on the first
# statement's line 9951 and once as T2043 line 67079, so the total of line 9951 is 500.00, as is
# amount 5C. The other seven provincial credits and the second statement's line 9951 are 0.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  Return JE: a 2025 Ontario resident in Canada throughout 2025, aged 18 or older, with no
  employment income and no other income (every line not named here is 0). Two farming
  businesses, each reported on one Form T2042 (a chosen set), both with their permanent
  establishments in Alberta (designated province code 4). Each farm has seeds and plants of
  12,500 (a chosen figure), so its total farm expenses are 12,500.00, and its Chart A amount 8
  is 12,500.00 (365 of 365 days in 2024), 25,000.00 in all, exactly the 25,000 of Form T2043
  Part 1 Note 1, so Part 2's 2D is 25,000.00 x 0.229% = 57.25 and amount 5A is 57.25. A
  partnership has allocated a fuel charge credit of 500.00 (a chosen figure; box 237 of its
  T5013 slip) to the first business: Form T2042 line 9951 "Return of fuel charge proceeds to
  farmers tax credit allocated to you in the year" is 500.00 on the first statement and 0 on the
  second, and Form T2043 line 67079 "Credit allocated from a partnership for ON" is 500.00, the
  other seven lines are 0, so amount 5C is 500.00. Form T2043 note 2 says "you must include the
  portion of the credit allocated to each business on line 9951 of Form T2042 for that business
  when you calculate your net farming income", so line 9951 of the first statement is part of its
  Form T2042 partnership total (amount 5B) and the total of line 9951 over the statements, 500.00,
  is not above amount 5C, and the engine refuses a total above amount 5C (it may be below: T2043
  note 2 puts the credit of AgriStability and AgriInvest filers on other forms' line 9951). The first farm's
  wheat income is 22,000.00 and the second's 22,500.00 (chosen figures), so the first nets
  22,000.00 + 500.00 - 12,500.00 = 10,000.00 and the second 22,500.00 - 12,500.00 = 10,000.00; the
  two net farming incomes total 20,000.00, and the T1 and tax figures are Return EW's: federal tax
  after credits 561.29, Ontario tax after the Ontario tax reduction 144.56 (total 705.85), and the
  Canada workers benefit 1,633.00 (27% of the 17,000.00 over 3,000.00, capped, the adjusted family
  net income of 20,000.00 being under 26,855.00). Amount 5D, line 47556, is 5A 57.25 + 5B 0.00 (Form T2043 Part 4 is not in this return) + 5C
  500.00 = 557.25, a refundable credit, so the total credits are 557.25 + 1,633.00 = 2,190.25 and
  the refund is 2,190.25 - 705.85 = 1,484.40, so the balance owing is 0.00. The Ontario health
  premium is 0.00 at this income.
sources:
  - >-
    CRA, Form T2043 (2025), Return of Fuel Charge Proceeds to Farmers Tax Credit
    (docs/cra-forms-2025/t2043-25e.pdf, a PDF quote confirmed 2026-10-25;
    https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2043/t2043-25e.pdf), page 1:
    "Fill in parts 1, 2 and 5 if you have: one farming business with one or more permanent
    establishments in only one designated province; multiple farming businesses, each of
    which has one or more permanent establishments in the same designated province; multiple
    farming businesses, where, for example, one business has one or more permanent
    establishments in only one designated province and another business has one or more
    permanent establishments in a different designated province".
  - >-
    CRA, Form T2043 (2025), Part 1, line 67061 "Total gross farming expenses for all of your
    businesses: Add amount 6 of every Chart A." Note 1: "If your total gross farming
    expenses for all businesses are $25,000 or more, you are eligible to claim the credit."
  - >-
    CRA, Form T2043 (2025), Chart A: amount 1 "Total farming expenses (line 9898 of Form
    T2042)"; amount 6 "Gross farming expenses: Amount 1 minus amount 5"; amount 7 "Total
    number of days in the fiscal period that fall within the 2024 calendar year divided by
    the total number of days in the fiscal period (if the fiscal period starts and ends in
    2025, enter "0")"; amount 8 "Amount 6 multiplied by amount 7."
  - >-
    CRA, Form T2043 (2025), Part 2: "Add all farming expenses in AB from amount 8 of Chart
    A" (67066) "× AB payment rate 0.229% =" (2D); "Total: Add amounts 2A to 2H (enter this
    total at amount 5A)" (2I).
  - >-
    CRA, Form T2043 (2025), Part 5: "Enter amount 2I" (5A); "Enter amount 4I" (5B); "Credit
    allocated from a partnership for ON (amount from box 237 of each T5013 slip or from each
    letter)" (67079), and the same for MB (67080), SK (67081), AB (67082), NS (67103), PE
    (67104), NL (67105) and NB (67106); "Total credit allocated from partnerships: Add lines
    67079 to 67082 and lines 67103 to 67106" (5C); "Total credit for all businesses: Amount
    5A plus amount 5B plus amount 5C (enter this amount on line 47556 of your income tax and
    benefit return)" (5D).
  - >-
    CRA, Form T2043 (2025), Part 5 note 2: "The credit allocated to an individual who is a member
    of a partnership is considered assistance. Therefore, you must include the portion of the
    credit allocated to each business on line 9951 of Form T2042 for that business when you
    calculate your net farming income in the tax year the credit is claimed." CRA, Form T2042
    (2025), Part 5 line 9951 "Return of fuel charge proceeds to farmers tax credit allocated to
    you in the year (amount 5C of Form T2043, Return of Fuel Charge Proceeds to Farmers Tax
    Credit)" (docs/cra-forms-2025/t2043-25e.pdf and t2042-25e.pdf, PDF quotes; CRA publishes no
    .txt).
