      ca/cwb_disability_supplement_before_reduction: "843.00"
      ca/cwb_disability_reduction: "0.00"
      ca/cwb_disability_supplement: "843.00"
      ca/canada_workers_benefit_line_41: "0.00"
      ca/canada_workers_benefit_line_42: "843.00"
      ca/canada_workers_benefit_before_conditions: "843.00"
      ca/cwb_claimed: "843.00"
      ca/canada_workers_benefit: "843.00"
      ca-on/net_refund: "743.00"
      ca/refund_or_balance_owing: "-743.00"
