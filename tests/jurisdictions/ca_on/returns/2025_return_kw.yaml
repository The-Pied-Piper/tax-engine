# Return KW: Guide T4002's James (line 9945 business-use-of-home expenses, printed page 67), a single
# Ontario resident whose only income is the net business income of one business reported on one Form
# T2125 for a full fiscal period (0 days entered). James runs a daycare from his home weekdays from
# 7 am to 5 pm (10 of 24 hours) in an area of 35 of the house's 100 square metres; the annual
# household expenses are $5,800. The guide: (10 / 24) x (35 / 100) x $5,800 = $845.83, and as the
# business operates five days a week $845.83 x 5 / 7 = $604.16, "James can deduct $604.16 for his
# household expenses".
#
# CRA's printed figure is the $604.16 deductible (Part 7 amount 7M and its allowable claim, line 9945).
# The form has no hours, area or days boxes: Part 7 takes the expenses (7A to 7G) and the "personal-use
# part of the business-use-of-home expenses" (7I) as dollars, so the filer works the guide's fractions
# out of the form and enters the personal part: $5,800 - $604.16 = $5,195.84 (the exact product is
# $604.1666..., which the guide prints truncated). The $5,800 is entered on "Other expenses" (7G), the
# guide not naming a line. The guide prints no sales figure: the gross sales of $20,000 (line 8299)
# are a chosen one, well above the claim, so the net business income (line 9946 before the claim,
# T1 line 13500 after it) is $19,395.84, the engine's figure from those.
#
# Schedule 8 Part 4 ("Complete this part if you are reporting only self-employment income") is completed (ca/cpp_part_4_completed 1), as the form directs for a return whose only income is self-employment, so lines 42100, 22200 and 31000 are computed; the CPP-dependent lines of the return are the engine's, not CRA's.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025 whose only income is the net business income of one sole proprietorship
  reported on one Form T2125 for a full fiscal period (0 days entered): chosen gross sales of $20,000
  (line 8299) and, in Part 7, the annual household expenses of Guide T4002's James, $5,800 on other expenses
  (7G), of which $5,195.84 is the personal-use part (7I), so the subtotal (7J) is $604.16, the business-use-of-home
  claim (line 9945) is $604.16 and the net business income (line 9946 less the claim, T1 line 13500) is
  $19,395.84.
sources:
  - >-
    CRA, Guide T4002 (2025), Self-employed Business, Professional, Commission, Farming, and Fishing Income
    (docs/cra-forms-2025/t4002-25e.pdf, confirmed from the PDF with pdftotext -layout), printed page 67,
    "Line 9945 – Business-use-of-home expenses", the example of James: "James runs a business, for example
    a daycare, from his home weekdays from 7 am to 5 pm (10 hours out of a 24-hour day). The business
    uses an area of 35 square metres. The house is 100 square metres, and the annual household expenses
    are $5,800."; "(10 ÷ 24 hours) × (35 ÷ 100 metres) × $5,800 expenses = $845.83"; "$845.83 × 5 ÷ 7
    days = $604.16"; "James can deduct $604.16 for his household expenses."; "The amount you can deduct
    for business-use-of-home expenses cannot be more than your net income from the business before you
    deduct these expenses."
  - >-
    CRA, Form T2125 (2025), Statement of Business or Professional Activities (docs/cra-forms-2025/t2125-25e.pdf,
    confirmed from the PDF with pdftotext -layout), Part 7 "Calculating business-use-of-home expenses":
    "Other expenses (specify):", "Subtotal: Add amounts 7A to 7G.", "Personal-use part of the business-use-of-home
    expenses", "Subtotal: Amount 7H minus amount 7I" and "Allowable claim: Amount 7M or 7N above, whichever
    is less (enter your share of this amount on line 9945 of Part 5)".
