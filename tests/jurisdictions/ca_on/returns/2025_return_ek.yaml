# Return EK: CRA Guide T4037 (Capital Gains, 2025), the machinery example (page 20, under "Recapture of CCA and terminal losses"), situation C: machinery
# bought in 2022 for $10,000 with $6,000 of UCC at the start of 2025, sold in 2025 for $12,000. A
# recapture of CCA of $4,000 is income and the capital gain is $2,000 (taxable $1,000). Situations A
# and B are not built (a terminal loss and a recapture of $2,000 each with no capital gain; the
# engine's capital side of a sale below the capital cost is a known gap in the engine). Amounts are quoted
# decimal strings, never floats; counts are quoted digit strings. A line that is not listed under
# `expected` computes to 0 (or no records).
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025, resident in Canada throughout 2025, aged 18 or older at
  the end of 2025 and with 12 months of CPP (Schedule 8 box A), all chosen figures, with no
  employment income and no other income. Guide T4037's machinery example, situation C: "In 2022,
  you bought a piece of machinery at a cost of $10,000 for your business. It is the only property
  in its class at the beginning of 2025. The class has a UCC of $6,000." It was sold in 2025 for
  $12,000, with no other property bought in that class. The guide's machinery is a business
  property (Form T2125); this return models the depreciable property on a Form T776 statement,
  because the same Area A arithmetic applies to the CCA part, and that is a modelling choice. The
  statement has one Area A row, Class 8 (a chosen class: the guide does not name it, and machinery
  is usually Class 8), UCC at the start $6,000.00 (the guide's figure, the $10,000 cost less
  $4,000 of CCA for 2022 to 2024), no additions and column 5 proceeds of $10,000.00 with no
  property left in the class. The $10,000.00 is the lesser of the capital cost ($10,000) and the
  proceeds ($12,000), the filer's figure, chosen by the filer and not computed. Column 7 is
  $6,000.00 - $10,000.00 = ($4,000.00), a negative amount, so a recapture of CCA of $4,000.00
  goes to line 9947, as the guide says: $6,000 - lesser of $10,000 and $12,000 = ($4,000). The
  statement has no rents or expenses (a chosen simplification), so no CCA is claimed and the Class
  8 closing UCC is $0.00, net rental income (T1 line 12600) is $4,000.00. Schedule 3 Part 3 has
  one real estate, depreciable property and other properties row: proceeds $12,000, adjusted cost
  base $10,000 (the capital cost), outlays $0, a gain of $2,000 (proceeds of disposition $12,000
  minus capital cost $10,000 = capital gain $2,000), so line 13800 is $2,000 and the taxable
  capital gain (T1 line 12700, one half) is $1,000.00. Total income (line 15000) is $4,000.00 +
  $1,000.00 = $5,000.00, which is the net income before adjustments, net income and taxable income,
  with no deductions. The alternative minimum tax carryover available for 2026, $1,613.71, and
  the second additional CPP earnings maximum, $9,900.00, are existing behaviour of the engine for
  this income, not new to this file.
sources:
  - >-
    CRA, Guide T4037, Capital Gains (2025), the machinery example on page 20 (under "Real estate" /
    "Recapture of CCA and terminal losses"): "In 2022, you bought a piece of machinery at a cost
    of $10,000 for your business. It is the only property in its class at the beginning of 2025.
    The class has a UCC of $6,000. You sold the piece of machinery in 2025 and did not buy any
    other property in that class." Situation C: proceeds of disposition 12,000 minus capital cost
    10,000 = capital gain 2,000; capital cost 10,000 minus CCA 2022 - 2024 4,000 = UCC at the
    beginning of 2025 6,000; minus whichever is less, the capital cost of $10,000 or the proceeds
    of disposition, 10,000; terminal loss (or recapture of CCA) (4,000). "In situation C, you have
    a capital gain of $2,000. You also have a recapture of CCA of $4,000 that you must include in
    your business income." (docs/cra-forms-2025/t4037-25e.pdf, text extracted with pdftotext)
  - >-
    CRA, Form T776 (2025), Statement of Real Estate Rentals (docs/cra-forms-2025/t776-25e.txt), Area
    A: "Column 5: Proceeds of dispositions in the year (see Areas D and E below)"; Note 3: "If you
    have a negative amount in column 7, add it to income as a recapture under "Recaptured capital
    cost allowance" on line 9947."
  - >-
    CRA, Schedule 3 Capital Gains or Losses (2025) (docs/cra-forms-2025/5000-s3-25e.txt), Part 3
    "Real estate, depreciable property, and other properties": "(Column 5): Gain or loss (column 2
    minus columns 3 and 4)"; "Line 13599: Total proceeds of disposition"; "Line 5 and line 13800:
    Total gain or loss". T1 (docs/cra-forms-2025/5006-r-25e.txt): "Line 14 and line 12700: Taxable
    capital gains (complete Schedule 3)".
