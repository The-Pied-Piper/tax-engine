# Return EB: a single filer, a 2025 Ontario resident, whose only income is rental income from
# three short-term rentals, reproducing the "Example" of Guide T4036 (docs/cra-forms-2025/
# t4036-25e.pdf, pages 18 and 19), "Kevin", with the Form T776 Chart A figures the guide
# prints: the total short-term rental expense portion of $4,300 on line 9365, the Chart A rows
# of 750, 1,500 and 0, and line 9366 of $2,250. The guide gives no rents, so the gross rents
# are chosen figures. Rental 1 is one unit with 84 days, 30 of them non-compliant; rental 2 is
# one of two units in its property, 35 days, all non-compliant; rental 3 is one unit with 14
# days and none non-compliant. The chosen rents are short-term rents of 3,000, 1,500 and 1,400
# (line 8140 is 5,900), and gross rents for all units of 3,000, 7,500 (the 1,500 short-term
# rent and a chosen 6,000 long-term rent of the property's other unit) and 1,400, so line 8141
# is 11,900 and line 8299 (T1 line 12599) is 11,900 + a chosen 0 = 11,900.00. The expenses are
# chosen figures: insurance (line 8690) 4,300, all of it the short-term portion, and repairs and
# maintenance (line 8960) 1,000, no personal or short-term portion. Amount A (line A) is 5,300,
# line 9949 is 0 and line 9365 is 4,300, so line 9366 is 2,250.00 and line 1 is
# 5,300 - 0 - 2,250.00 = 3,050.00; line 9369 is 11,900 - 3,050.00 = 8,850.00. There is no
# co-owner and no partnership, and no capital cost allowance, so the net income (line 9946,
# T1 line 12600) is 8,850.00, the whole of total income (line 15000). With no employment income
# there are no CPP contributions or EI premiums; the basic personal amount of the federal and
# Ontario credits is more than the income, so there is no federal or Ontario tax and the refund
# or balance owing is $0. Amounts are quoted decimal strings, never floats; counts are quoted
# digit strings. Every output the CA-ON manifest declares must appear under `expected`.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025 whose only income is rental income from three
  short-term rentals, as in the "Example" of Guide T4036 (Kevin): the Chart A figures of the
  guide, the total short-term portion of 4,300 (line 9365) and the non-compliant amount of 2,250
  (line 9366), with chosen rents and a chosen insurance and repairs, so line 12599 is 11,900.00
  and line 12600 is 8,850.00. The rents, insurance and repairs are chosen; the Chart A figures are the guide's.
  No self-employment income: the net business, professional, commission, farming and fishing
  income (T1 lines 13500, 13700, 13900, 14100 and 14300) are $0, so their sum (line 27) is
  $0, and it is a $0 term of total income (line 15000). The CPP months (Schedule
  8 box A) are the 12 of a full year, Schedule 8 Part 4 is not completed (count 0) and there
  is no agreement with the Canada Employment Insurance Commission (count 0), so the CPP
  contributions payable (line 42100), the base CPP contributions (line 31000) and the
  deduction (line 22200) on self-employment income, and the EI premiums on it (lines 31217
  and 42120), are $0 and change no total.
sources:
  - >-
    CRA, Guide T4036 (2025), Rental Income (docs/cra-forms-2025/t4036-25e.pdf, page 18), "Short-term
    rental portion of total expenses": "enter the part of each expense related to residential
    properties that were short-term rentals at any time during the year under "Short-term rental
    portion of total expenses""; "add up the amounts in that column and enter the result on line
    9365"; "fill in "Chart A - Non-compliant amount of expenses for short-term rentals" on Form
    T776"; "enter amount B from Chart A on line 9366, "Non-compliant amount for short-term
    rentals"". Page 18, "Example": "In 2025, Kevin had three short-term rentals: rental 1, which
    he rented for a period of 60 days and another period of 24 days, for a total of 84 days in
    the tax year; rental 2, which he rented for a total of 35 days in the tax year; rental 3,
    which he rented for a total of 14 days in the tax year". "Rental 2 is one of two units within
    one residential property. The other unit in that residential property is a long-term rental
    and is therefore excluded from Chart A. Both rental 1 and rental 3 are residential properties
    with only one unit each." Page 19: "Kevin determines that rental 1 was a non-compliant
    short-term rental for 30 days, rental 2 was a non-compliant short-term rental during the entire
    rental period, and rental 3 was a compliant short-term rental the entire rental period.";
    "Kevin has a total short-term rental expense portion of $4,300, which he enters on line 9365.";
    the Chart A rows (column 3, column 4, column 5, column 6): rental 1 2,100, 30, 84, 750; rental
    2 1,500, 35, 35, 1,500; rental 3 700, 0, 14, 0; "To calculate the non-compliant amount at
    column 6, Kevin multiplies the amount from column 3 by the amount in column 4, divided by the
    amount in column 5."; "Kevin then adds the amounts from column 6 and enters the total, $2,250,
    on line 9366, "Non-compliant amount for short-term rentals," in Part 4 of Form T776." The guide
    gives no rents, expenses or gross rents: those are chosen figures here.
  - >-
    CRA, Form T776 (2025), Statement of Real Estate Rentals
    (docs/cra-forms-2025/t776-25e.txt, confirmed 2026-10-19), Part 3: "Line 8140: Total of your
    gross rents for short-term rentals in the year you receive them (add amounts under "Gross rents
    for short-term rentals")"; "Line 8141: Total of all your gross rents in the year you receive
    them (add lines under "Gross rents for all units")."; "Line 8230: Other income (for example,
    premiums and leases, sharecropping)"; "Line 8299: Total gross rental income: Enter this amount
    on your income tax and benefit return on line 12599 (line 8141 plus line 8230)". Part 4: "Line
    A: Total expenses (add amounts listed under "Total expenses")"; "Line 9949: Total for personal
    portion (add amounts listed under "Personal portion of total expenses")"; "Line 9365: Total for
    short-term rental portion (add amounts listed under "Short-term rental portion of total
    expenses")"; "Line 9366: Non-compliant amount for short-term rentals (amount B from Chart A)";
    "Line 1: Deductible expenses (amount A minus line 9949 minus line 9366)"; "Line 9369: Net income
    (loss) before adjustments (total gross rental income from line 8299 minus deductible expenses
    from amount 1)"; "Line 2: Co-owners: calculate your share of net income from line 9369. Enter
    your result on amount 2"; "Line 9945: Other expenses of the co-owner: other deductible expenses
    you have as a co-owner which you did not deduct elsewhere"; "Line 3: Subtotal (amount 2 minus
    line 9945)"; "Line 9947: Recaptured capital cost allowance (co-owners: enter your share of the
    amount)"; "Line 4: Subtotal (amount 3 plus line 9947)"; "Line 9948: Terminal loss (co-owners:
    enter your share of the amount)"; "Line 5: Subtotal (amount 4 minus line 9948)"; "Line 9936:
    Total CCA claim for the year (amount ii from Area A minus any personal part of CCA, and any CCA
    for business-use-of-home expenses)"; "Line 6: Net income (loss) (amount 5 minus line 9936)";
    "Line 7: Partners: your share of amount 6, or the amount from your T5013 slip, Statement of
    Partnership Income"; "Line 9974: Partners: GST/HST rebate for partners received in the year";
    "Line 9943: Partners: other expenses of the partner"; "Line 9946: Your net income (loss): For
    sole proprietors or co-owners, enter the result from amount 6. For partnerships, enter the
    result from amount 7 plus line 9974 minus line 9943. Enter this amount on line 12600 of your
    income tax and benefit return". Chart A, the form's column 3 "Related portion of the total from
    line 9365 of Part 4", column 4 "Number of days the residential property was a non compliant
    short-term rental", column 5 "Number of days the residential property was a short-term rental",
    and column 6 are the rows of the example above. The Part 3 wording does not say whether a
    short-term rent is also in "Gross rents for all units"; this return takes each property's
    all-units rent as including its short-term rent (a chosen reading, the same as the engine's
    line 8141), so line 8141 is the total of all rents. The properties are three rows: rental 1 one
    unit with 3,000 short-term and 3,000 all-units rent; rental 2 two units with 1,500 short-term
    and 7,500 all-units rent (its 1,500 short-term rent and a chosen 6,000 for the other unit,
    which is long-term); rental 3 one unit with 1,400 short-term and 1,400 all-units rent. So
    line 8140 is 3,000 + 1,500 + 1,400 = 5,900.00, line 8141 is 3,000 + 7,500 + 1,400 = 11,900.00,
    and line 8230 is a chosen 0, so line 8299, and T1 line 12599, is 11,900.00 + 0 = 11,900.00.
    The expenses are chosen figures, insurance (line 8690) 4,300 with a short-term portion of
    4,300 (the total of line 9365, so the Chart A column 3 rows, 2,100 + 1,500 + 700, are 4,300),
    and repairs and maintenance (line 8960) 1,000 with no personal or short-term portion, every
    other expense line 0: amount A is 0 + 4,300 + 0 + 0 + 0 + 0 + 1,000 + 0 + 0 + 0 + 0 + 0 + 0 =
    5,300.00 (line A), line 9949 is 0 and line 9365 is 4,300.00. Line 9366 is the sum of the three
    Chart A rows, each rounded half-up to the cent: row 1, 2,100 x 30 / 84 = 750.00; row 2, 1,500 x
    35 / 35 = 1,500.00; row 3, 700 x 0 / 14 = 0.00; so amount B is 750.00 + 1,500.00 + 0.00 =
    2,250.00, the line 9366. Line 1 is 5,300.00 - 0 - 2,250.00 = 3,050.00; line 9369 is 11,900.00
    - 3,050.00 = 8,850.00. There is no co-owner (a count of 0), so amount 2 is line 9369, 8,850.00,
    and line 2 is not triggered; lines 9945, 9947 and 9948 are a chosen 0, so amount 3 is
    8,850.00 - 0 = 8,850.00, amount 4 is 8,850.00 + 0 = 8,850.00 and amount 5 is 8,850.00 - 0 =
    8,850.00; line 9936 is a chosen 0 (no capital cost allowance claimed), so amount 6 is
    8,850.00 - 0 = 8,850.00. There is no partnership (a count of 0): lines 7, 9974 and 9943 are not
    triggered (0 + 0 - 0 = 0), so line 9946, and so T1 line 12600, is amount 6, 8,850.00. Not yet
    computed, so not in this file: Chart B (the non-compliant amount of capital cost allowance),
    Area A and the capital cost allowance of line 9936, which is an input here. The rental lines
    add and subtract amounts already in cents.
