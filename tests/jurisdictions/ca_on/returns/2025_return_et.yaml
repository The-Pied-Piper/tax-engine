# Return ET: a 2025 Ontario resident with one QSBCS disposition in 2025 (a gain of $700,000, Schedule 3
# line 10700) and Form T657 worked through Step 1, Step 2, Chart 1 (three year rows), Chart 2 (every
# line) and the prior-year charts 2016 to 2020, with the additional deduction of Part 2 completed for
# 2016 and 2019 and refused for 2018 (amount E more than amount K). Charts 2021 to 2025 carry the
# 259,456.00 total. Line 25400 is the annual gains limit, 280,000.00. The worked derivation is in the
# description; Return EU takes Charts 2017, 2018 and 2020 to 2025 further.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025, resident in Canada throughout 2025, aged 18 or older at
  the end of 2025, with partnership gains at full inclusion (Schedule 3 line 25, 19890) of $10,000, a
  chosen figure, and one disposition
  of qualified small business corporation shares (QSBCS) in 2025 after June 24, 2024: proceeds
  $900,000, adjusted cost base $200,000 and outlays nil, all chosen figures, so the gain is 700,000.00
  (Schedule 3 line 10700, column 5 = column 2 minus columns 3 and 4); line 24 is 350,000.00 (the
  inclusion rate on line 23 being 50%) and line 26 (19900) is 350,000.00 + 10,000.00 = 360,000.00,
  the taxable capital gains. Net capital losses of
  other years: 40,000 are available and 30,000 are claimed (chosen figures), so line 25300 is
  30,000.00. Net income (line 23600) is 360,000.00. Every figure below is
  derived by hand from Form T657 (2025 edition) before the engine is run; Return EU is the
  companion that takes the same form through the 2017, 2018 and 2020 to 2023 charts and Chart 2025.
  Form T657 reads the reserves of earlier years and of 2025 from the rows of Form T2017 (a row of
  line 2 for a QFFP, of line 8 for QSBCS shares, one for each year of disposition); the T2017 amounts,
  earlier-year deductions and the (x-1) calculations are chosen figures. Form T2017 lines 1 and 7 (the
  2024 reserves) are the filer's own figures and are not reconciled with the rows' previous-year
  claims here (line 1 is 0).
  Step 1: line 1 is 700,000.00 (line 10700 only); line 2 (Form T2017 line 13) is -100,000 (a loss,
  shown in brackets), so line 3 is 600,000.00; line 4 is 1/2, so line 5 is 300,000.00; line 6 (Form
  T2048 line 17216) is 0; line 7 is 300,000.00. Line 8 (Schedule 3 line 19900) is 360,000.00; line 9
  is 0; line 10 is 360,000.00; line 11 is 0; line 12 is 360,000.00. Line 13 is the lesser of line 7
  and line 12: 300,000.00. Line 14 (line 25300) is 30,000.00 and line 15 (line 14 of Chart A of Form
  T936) is 10,000.00, so line 16 is 20,000.00; lines 17, 18 and 19 are 0; line 20 is 20,000.00; line 21,
  the annual gains limit, is 300,000.00 - 20,000.00 = 280,000.00.
  Chart 1 (three rows, columns A to D chosen): row 1 has A 10,000, B 2,000, C 8,000 and D 3,000, so E
  is 5,000 (C - D), F is 7,000 (B + E) and G is 3,000 (A - F). Row 2 has A 20,000, B 0, C 4,000 and D
  6,000, so C - D is -2,000 and E is entered as "0", F is 0 and G is 20,000. Row 3 has A 5,000, B
  6,000, C 1,000 and D 0, so E is 1,000, F is 7,000 and A - F is -2,000, so G is entered as "0". The
  column G total, Step 2 line 14, is 3,000 + 20,000 + 0 = 23,000.
  Chart 2: line 1 is 3,000; line 2 is 8,000.02, so line 3 is 11,000.02; line 4 is line 2 x 1/4 =
  2,000.005, rounded half up to the cent: 2,000.01; line 5 is 9,000.01. Line 6 is 3,000, so line 7 is
  12,000.01; line 8 is 3,000 x 1/3 = 1,000.00; line 9 is 11,000.01. Line 10 is 6,000, so line 11 is
  17,000.01; line 12 is 6,000 x 1/3 = 2,000.00; line 13 is 15,000.01. Line 14 is 13,000, so line 15
  is 28,000.01; with IR 0.6 (the 2000 inclusion rate, a chosen figure) line 16 is 13,000 x [1 - 1/(2
  x 0.6)] = 13,000 - 13,000/1.2 = 13,000 - 10,833.33 = 2,166.67 (the quotient rounded half up to the
  cent once); line 17 is 28,000.01 - 2,166.67 = 25,833.34; line 18 is 20,000; line 19 is 45,833.34.
  Step 2: lines 1 to 7 are 12,000, 6,000, 3,000, 4,000, 8,000, 5,000 and 7,000; line 8 is 100,000
  (2002 to 2024) + 300,000.00 (Step 1 line 13) = 400,000.00; line 9 is 445,000.00. Line 10 is 2,000;
  line 11 is 30,000 and line 12 is 5,000, so line 13 is 25,000; line 14 is 23,000 (Chart 1); line 15
  is 20,000.00 (Step 1 line 20); line 16 is 15,000; line 17 is 53,000.02 (the Chart 2 lines 1, 2, 6,
  10, 14 and 18 as filed); line 18 is 2,000 + 25,000 + 23,000 + 20,000 + 15,000 + 53,000.02 =
  138,000.02; line 19, the cumulative gains limit, is 445,000.00 - 138,000.02 = 306,999.98.
  Chart 2016 uses the (2016-1) calculation, so amount B is the entered 392,088 (a chosen figure, not
  Chart 2 line 19). Part 1: A is 412,088.00, C is 20,000; D (Form T2017 line 6, QFFP) is 300,000 and
  E (line 12) is 0, so D + E is 300,000 and F is 150,000.00; G is the lesser of C and F: 20,000.00; H
  is the lesser of 280,000.00, 306,999.98 and G: 20,000.00. The additional deduction is claimed and C
  (20,000) is equal to or less than 280,000.00, 306,999.98 and G (20,000), so Part 2 is completed: A
  is 500,000.00; B (Part 1's G) is 20,000, so C is 480,000; D (Part 1's amount B) is 392,088, so E is
  87,912, the additional $87,912 the form prints; F (line 6 x 1/2) is 150,000.00; G is the lesser of
  E and F: 87,912; H (Part 1's G) is 20,000, so I is 107,912; J is the lesser of F and I: 107,912; K
  is the lesser of 280,000.00, 306,999.98 and J: 107,912. The total carried is Part 2's J, 107,912.
  Chart 2017 takes Chart 2 line 19 as amount D. A is 417,858.00; B is 107,912, so C is 309,946; D is
  45,833.34, so E is 264,112.66. F (line 6) is 0 and G (line 12) is 100,000, so H is 50,000.00 and I,
  the lesser of E and H, is 50,000.00; J is 107,912 and K is 157,912.00; L is the lesser of
  280,000.00, 306,999.98 and K: 157,912.00. The additional deduction is not claimed, so Part 2 (its
  lines are worked from B 157,912.00 and J 0.00) does not apply and the total carried is K,
  157,912.00.
  Chart 2018 uses the (2018-1) calculation: D is the entered 60,000. A is 424,126.00; B is 157,912.00,
  so C is 266,214.00 and E is 206,214.00. F (line 6) is 30,000 and G (line 12) is 20,000: 50,000.00,
  H is 25,000.00, I is 25,000.00 and K is 182,912.00; L is 182,912.00. The additional deduction is
  claimed, but E (206,214.00) is more than K (182,912.00), so Part 2 is not completed (its J would be
  15,000.00) and the total carried is K, 182,912.00.
  Chart 2019 uses the (2019-1) calculation: D is the entered 240,544. A is 433,456.00; B is
  182,912.00, so C is 250,544.00 and E is 10,000.00. F (line 6) is 550,000 and G (line 12) is 0:
  F + G is 550,000.00, H is 275,000.00 and I, the lesser of E and H, is 10,000.00; K is
  192,912.00 and L is 192,912.00. The additional deduction is claimed and E (10,000.00) is equal to
  or less than 280,000.00, 306,999.98 and K (192,912.00), so Part 2 is completed: A is 500,000.00; B
  (Part 1's K) is 192,912.00, so C is 307,088.00; D is 240,544, so E is 66,544.00, the additional
  $66,544 the form prints; F (line 6 x 1/2) is 275,000.00; G is the lesser of E and F: 66,544.00; H
  is 192,912.00 and I is 259,456.00; J is the lesser of F and I: 259,456.00; K is the lesser of
  280,000.00, 306,999.98 and J: 259,456.00. The total carried is Part 2's J, 259,456.00.
  Chart 2020 takes Chart 2 line 19 as amount D: A is 441,692.00; B is 259,456.00, so C is 182,236.00;
  D is 45,833.34 and E is 136,402.66. F (line 6) is 0 and G (line 12) is 0, so F plus G is 0:
  H is 0 and I is 0; K is 259,456.00 and L is 259,456.00. The
  additional deduction is not claimed; the total carried is 259,456.00.
  Charts 2021, 2022 and 2023 report nothing and carry 259,456.00 as amount B (D is Chart 2 line 19,
  45,833.34): Chart 2021 has A 446,109.00, C 186,653.00 and E 140,819.66; Chart 2022 has A
  456,815.00, C 197,359.00 and E 151,525.66; Chart 2023 has A 485,595.00, C 226,139.00 and E
  180,305.66; in each K is 0, M (K + B) is 259,456.00 and N is the lesser of 280,000.00, 306,999.98
  and M: 259,456.00; the total carried is M, 259,456.00. Chart 2024 Period 1 (A 508,418.00) has C
  248,962.00 and E 203,128.66, nothing reported, so L is 0, N is 259,456.00 and O is 259,456.00;
  Period 2 (A 625,000.00) has B 259,456.00, C 365,544.00 and E 319,710.66, N 259,456.00 and O
  259,456.00. Chart 2025 Part 1 (A 522,145.00) has C 262,689.00 and E 216,855.66; amounts F to J are
  0, so K, M and N are 0 and P is 259,456.00; Q is 259,456.00. Chart 2025 Part 2 (A 625,000.00): B
  (Part 1's P) is 259,456.00, C is 365,544.00 and E is 319,710.66; F (line 10700 less the amounts not
  to include, none) is 700,000; G and H are 0; I (Form T2017 line 6, the 2025 reserve) is -100,000,
  the 100,000 reserved on the QFFP disposed of in 2025; F to J add to 600,000.00 and K is 300,000.00;
  L is 0, so M is 300,000.00; N is the lesser of E (319,710.66) and M: 300,000.00; O (amount B) is
  259,456.00 and P is 559,456.00; Q is the lesser of 280,000.00, 306,999.98 and P (559,456.00):
  280,000.00, the annual gains limit, the maximum for line 25400.
  The filer claims all of it (a chosen figure), 280,000, so line 25400 is 280,000.00 and line 25700
  is 30,000.00 (line 25300) + 280,000.00 = 310,000.00. Line 26000, the taxable income, is
  360,000.00 - 310,000.00 = 50,000.00. The other lines are blank and are the engine's figures (to be
  confirmed against CRA's calculator).
  The 10,000 is partnership gains at full inclusion (Schedule 3 line 25), so the net income is
  360,000.00 and Schedule 3 line 19900 is 360,000.00; the alternative minimum tax carryover and the
  refund or balance owing are the engine's figures on that income.
  Form T936 (the source of Step 1 line 15 and Step 2 line 16, which are not entered): Chart A line 1
  is 360,000.00; line 2 is 0 (no Form T2048); line 3 is 360,000.00; lines 4, 5 and 6 are 700,000,
  0 and 0, so line 7 is 700,000.00; no amount is reported on line 19200 of Schedule 3, so line 8 is
  0; line 9 is 700,000.00; line 11 is 350,000.00; line 12 is 0; line 13 is 350,000.00 and line 14 is
  360,000.00 - 350,000.00 = 10,000.00, Step 1 line 15. There is no T3 slip, so lines 15 to 19 are 0
  and line 20 is 10,000.00. Part 1: lines 1 to 6 are 0 and line 7 is the lesser of 10,000.00 and
  line 25300 (30,000.00): 10,000.00, so A is 10,000.00. Part 2: lines 8 to 12 are 0 and line 13 is
  10,000.00, so B is 10,000.00. Part 3: line 14 is 10,000.00; line 15 (entered) is 20,000, so line
  16 is 30,000.00; line 17 is 0 (no Form T2048), so line 18 is 30,000.00; line 19 is 10,000.00 and
  line 20 (entered) is 5,000, so line 21 is 15,000.00; line C is 30,000.00 - 15,000.00 =
  15,000.00, Step 2 line 16.
