    (line 21).
  - >-
    CRA, Form T657, 2025 edition (same PDF), Step 2 lines 1 to 19 ("Add lines 1 to 8. Cumulative
    eligible taxable capital gains" line 9; "Add lines 10 and 13 to 17." line 18; "Line 9 minus
    line 18 (if negative, enter "0") ... Cumulative gains limit for 2025" line 19), Chart 1
    ("Column E (C – D) (If negative, enter "0")", "Column F (B + E)", "Column G (A – F) (If
    negative, enter "0")", "Add the amounts in column G and enter the result on line 14 of Step 2")
    and Chart 2 lines 1 to 19 ("Amount from line 2 × 1/4" line 4; "Amount from line 6 × 1/3" line 8;
    "Amount from line 10 × 1/3" line 12; "Amount from line 14 × [ 1 – ( 2 × IR )]" line 16, with
    footnote (2) "Your "IR" is your inclusion rate for 2000").
  - >-
    CRA, Form T657, 2025 edition (same PDF), Charts 2016 to 2020 Part 1 and Part 2: "Maximum
    capital gains deduction for QFFP and/or QSBCS disposed of in 2016 412,088.00 A" (417,858.00,
    424,126.00, 433,456.00 and 441,692.00 for 2017 to 2020) and "Maximum capital gains deduction
    for QFFP disposed of in 2016 500,000.00 A" (Part 2); "(2016-1) If you claimed a capital gains
    deduction for other eligible capital gains from 2016 to 2024, complete the following
    calculation instead ... Enter the result at amount B." (amount D for 2017 to 2020); "amount F
    plus amount G (if negative, enter "0") = × 1/2 = H"; "Enter whichever is less: amount E or
    amount H." I; "Amount I plus amount J" K; Part 2 "Enter whichever is less: amount F or amount
    I." J, and the entry conditions "Amount E in Part 1 is equal to or less than all of the
    following amounts: your annual gains limit for 2025 from line 21 in Step 1, your cumulative
    gains limit for 2025 from line 19 in Step 2, the total amount of capital gains included in
    your 2025 income that is eligible for the capital gains deduction from amount K in Part 1";
    the notes "For 2016, there is an additional $87,912", "For 2017 ... $82,142", "For 2019 ...
    $66,544", "For 2020 ... $58,308", "For 2021 ... $53,891" and "For 2022 ... $43,185".
  - >-
    CRA, Form T657, 2025 edition (same PDF), Charts 2021 to 2023 Part 1 and Part 2 (A 446,109.00,
    456,815.00 and 485,595.00): "Amount included in box 30 of a 2025 T3 slip and the footnote area
    indicates the property was disposed of in 2021 × 1/2 = + I"; "Amount H plus amount I = J";
    "Enter whichever is less: amount E or amount J." K; "Amount K plus amount L" M; Part 2 "Amount
    included in box 30 of a 2025 T3 slip and the footnote area indicates the QFFP was disposed of
    in 2021 × 1/2 = + G"; "Amount F plus amount G = H"; "Enter whichever is less: amount H or
    amount K." L.
  - >-
    CRA, Form T657, 2025 edition (same PDF), Chart 2024 Period 1 (A 508,418.00) and Period 2 (A
    625,000.00): "Add amounts F to H (if negative, enter "0")" × 1/2 = I; "Portion of the amount
    from line 17216 of Form T2048 in respect of a reserve for a property disposed of in Period 1
    of 2024" J; "Amount I minus amount J" K; "Enter whichever is less: amount E or amount K." L;
    "Amount L plus amount M" N. Chart 2025 Part 1 (A 522,145.00) and Part 2 (A 625,000.00): "Add
    amounts F to J (if negative, enter "0")" × 1/2 = K; "Amount K minus amount L" M; "Enter
    whichever is less: amount E or amount M." N; "Amount N plus amount O" P; "Enter whichever is
    less: line 21 of Step 1, line 19 of Step 2 or amount P above." Q; Part 2 F "Amount from line
    10700 of Schedule 3 (do not include ...)", G line 11000, H line 12400, I and J "Amount from
    line 6 of Form T2017" and "Amount from line 12 of Form T2017".
  - >-
    CRA, T1 General 2025, Ontario edition (form 5006-r), "Step 4 - Taxable income" (confirmed
    2026-10-19): "Line 65 and line 25400: Capital gains deduction (complete Form T657)"; "Line 68
    and line 25700: Add lines 58 to 67."; "Line 69 and line 26000: Line 57 minus line 68 (if
    negative, enter "0") Taxable income".
