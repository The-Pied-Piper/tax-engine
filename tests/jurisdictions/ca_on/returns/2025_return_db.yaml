# Return DB: Return BY's single sole proprietor, a 2025 Ontario resident whose only activity is
# a fishing business, one Form T2121 (Statement of Fishing Activities), with a Class 10.1
# passenger vehicle bought and sold in 2025 whose cost is above the prescribed amount, so that
# the proceeds of disposition (Area A column 5) and the proceeds of dispositions of DIEP (column
# 6) are adjusted by the prescribed amount as a proportion of the actual cost of the vehicle
# (Area A endnote 2). The vehicle cost $50,000 before the HST of 13%, $56,500.00 in all (the
# actual cost, no government assistance); its capital cost is limited to the prescribed amount
# for 2025, $38,000 + 13% = $42,940.00 (columns 3 and 4), and it was sold at arm's length for
# $40,000 (column 5, all of it a DIEP's, column 6), so the factor is $42,940.00 / $56,500.00 =
# 0.76 and the proceeds become $40,000 x 0.76 = $30,400.00 in both columns. Column 7 is $0 +
# $42,940 - $30,400.00 = $12,540.00 and column 8 is $42,940 - $30,400.00 = $12,540.00, so the
# immediate expensing amount (column 9) can be the whole $12,540 (it would be refused above the
# unadjusted column 8, $2,940). No property is left in the class, so the maximum is $0 and
# column 21 is $0 + $12,540 = $12,540.00, which is claimed, with a column 22 of $0 and no
# terminal loss. The fishing business is Return BY's with the fish products raised by $3,390 to
# a chosen $52,540, so that line 9369 stays Return BY's $15,000.00: income of $52,540 (fish
# products, amount 3A) and expenses of $37,540 (salt, bait and ice, line 9138, $10,000, fishing
# gear, line 9136, $15,000, and line 9936 of $12,540.00), so line 9368 is $37,540.00. The
# business is associated with one other EPOP under a filed agreement (Return BY's Area G), so
# the immediate expensing limit is $600,000.00 and line i, $12,540, is within the least of
# endnote 5's three amounts ($600,000.00, the UCC of DIEPs in column 8, $12,540.00, and the
# income before CCA, $27,540.00). Every figure that depends on income is Return BY's. Amounts
# are quoted decimal strings, never floats; counts are quoted digit strings. Every output the
# CA-ON manifest declares must appear under `expected`, or be left out to be 0 (or no records).
# The farming lines (Form T2042) are not triggered and are not listed here.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025 whose only activity is a fishing business, reported
  on one Form T2121: fish products of $52,540 (amount 3A, a chosen figure $3,390 above Return
  BY's so that line 9946 is Return BY's $15,000.00), so line 8299 and T1 line 14299 are
  $52,540.00; expenses of $25,000 on two lines (salt, bait and ice, line 9138, $10,000, and
  fishing gear, line 9136, $15,000) and capital cost allowance of $12,540.00 on Class 10.1
  (Area A, line 9936), so line 9368 is $37,540.00 and line 9369 is $15,000.00; and, with no
  partner and no business-use-of-home expenses, line 9946 and T1 line 14300 are $15,000.00.
  Area A has one class, Class 10.1, one passenger vehicle designated for immediate expensing,
  bought in 2025 for $50,000 plus the HST of 13% ($56,500.00, no government assistance) and
  sold in 2025 for $40,000: its capital cost is limited to the prescribed amount for 2025 with
  tax, $42,940.00 (columns 3 and 4), and because its actual cost is more than that, the
  proceeds of $40,000 (columns 5 and 6) are adjusted by $42,940.00 / $56,500.00 = 0.76 to
  $30,400.00. Column 7 and column 8 are $12,540.00; the immediate expensing amount (column 9)
  is the whole $12,540, so column 21 is $12,540.00, claimed, and the UCC at the end of the year
  is $0. Line i is $12,540, and line ii and line 9936 are $12,540.00. The business is associated
  with one other EPOP under a filed agreement that assigns it 40% of a total of 100%, so the
  immediate expensing limit is $600,000.00; the income before CCA (endnote 5) is $27,540.00,
  line 9369 plus line 9936, a chosen reading (see the sources). The net self-employment income
  (T1 line 27, "Add lines 22 to 26") is 0 + 0 + 0 + 0 + 15,000 = $15,000; total income (line
  15000) is $15,000.00. The CPP months (Schedule 8 box A) are the 12 of a full year, Schedule 8
  Part 4 is not completed (count 0) and there is no agreement with the Canada Employment
  Insurance Commission (count 0), so the CPP contributions payable (line 42100), the base CPP
  contributions (line 31000) and the deduction (line 22200) on self-employment income, and the
  EI premiums on it (lines 31217 and 42120), are $0 and change no total.
sources:
  - >-
    CRA, Form T2121 (2025), Statement of Fishing Activities (docs/cra-forms-2025/t2121-25e.pdf,
    confirmed from the PDF with pdftotext), Area A endnote 2: "The proceeds of disposition of a
    zero-emission passenger vehicle (ZEPV) that has been included in Class 54, or a passenger
    vehicle bought after April 18, 2021, that has been included in Class 10.1, and whose cost is
    more than the prescribed amount will be adjusted based on a factor equal to its prescribed
    amount as a proportion of the actual cost of the vehicle. For dispositions after July 29,
    2019, you will have to adjust the actual cost of the vehicle for any payments or repayments of
    government assistance that you may have received or repaid for the vehicle. If the passenger
    vehicle in Class 10.1 is not designated for immediate expensing treatment, this special rule
    does not apply." Guide T4002 (docs/cra-forms-2025/t4002-25e.pdf, confirmed from the PDF),
    "Class 10.1 (30%)": "The capital cost limits of a Class 10.1 passenger vehicle are the
    following prescribed amounts: $30,000 for vehicles acquired before 2022, plus the GST/HST or
    PST; ... $38,000 for vehicles acquired in 2025, plus the GST/HST or PST".
  - >-
    CRA, Form T2121 (2025), Area A, as the Area A columns of Return BY (docs/cra-forms-2025/
    t2121-25e.pdf): "Column 3: Cost of additions in the year", "Column 4: Cost of additions from
    column 3 that are DIEPs (property must be available for use before 2025)", "Column 5:
    Proceeds of dispositions in the year", "Column 6: Proceeds of dispositions of DIEP (enter
    amount from col. 5 that relates to DIEP from col. 4)", "Column 7: UCC after additions and
    dispositions (col. 2 plus col. 3 minus col. 5)", "Column 8: UCC of DIEP (col. 4 minus col.
    6)", "Column 9: Immediate expensing amount for DIEPs", "Column 10: Cost of remaining additions
    after immediate expensing (col. 3 minus col. 9)", "Column 13: Remaining UCC after immediate
    expensing (col. 7 minus col. 9)", "Column 18: Adjustment for current-year additions subject to
    the half-year rule. 1/2 multiplied by (col. 10 minus col. 11 minus col. 12 minus col. 5). If
    negative, enter "0"", "Column 21: CCA for the year (col. 19 multiplied by col. 20, or a lower
    amount, plus col. 9)" and "Column 22: UCC at the end of the year (col. 7 minus col. 21)";
    endnote 3 (the terminal loss in Part 4 on line 9270 when no property is left in the class).
    Class 10.1 (a chosen vehicle, "Class 10.1 (30%)" in Guide T4002): the actual cost is 50,000 +
    6,500 = 56,500.00 (the cost entered, with no government assistance, a chosen 0); it was
    acquired in 2025, so its prescribed amount is 38,000 + 4,940 = 42,940.00; column 2 is a chosen
    0, column 3 is the capital cost, limited to the prescribed amount with tax, 42,940 (a chosen
    reading, to be confirmed), column 4 is 42,940 (the vehicle is a DIEP) and columns 5 and 6 are
    the chosen price of 40,000 as entered. The actual cost, 56,500.00, is more than 42,940.00, so
    the proceeds are adjusted by the factor 42,940.00 / 56,500.00 = 0.76: column 5 is 40,000 x
    0.76 = 30,400.00 and column 6 is the same 30,400.00. Column 7 is 0 + 42,940 - 30,400.00 =
    12,540.00; column 8 is 42,940 - 30,400.00 = 12,540.00, not more than column 7; column 9 is a
    chosen 12,540, not more than column 8; column 10 is 42,940 - 12,540 = 30,400.00; column 13 is
    12,540 - 12,540 = 0; column 18 is one half x (30,400.00 - 0 - 0 - 30,400.00) = 0; column 19 is
    0; no property is left in the class (a chosen 1), so the maximum is 0 and column 21 is 0 +
    12,540 = 12,540.00, the claim, claimed in full; column 22 is 12,540 - 12,540.00 = 0.00. The
    terminal loss (endnote 3, column 7 less column 9, a reading of the endnote, to be confirmed)
    is 12,540.00 - 12,540 = 0 and the recapture is 0.
  - >-
    CRA, Form T2121 (2025), Area G and endnote 5 (docs/cra-forms-2025/t2121-25e.pdf): the business
    is associated with one other EPOP under a filed agreement, the percentage assigned to the
    business is a chosen 40 and the total of column 3 a chosen 100, so amount iii is 1,500,000 x
    40% = 600,000.00 and the immediate expensing limit is 600,000.00 (as in Return BY). The three
    amounts of endnote 5 are 600,000.00, the UCC of DIEPs in column 8, 12,540.00, and the income
    before CCA, 27,540.00 (line 9369 of 15,000.00 plus line 9936 of 12,540.00); the lesser is
    12,540.00. Line i, the total of column 9, is 12,540, within the lesser, so it is claimed in
    full.
  - >-
    CRA, "T1-2025 Ontario edition" return (form 5006-R, docs/cra-forms-2025/5006-r-25e.txt,
    confirmed 2026-10-19), "Step 2 - Total income": "Line 26: Fishing income"; "Line 14300: Net";
    "Line 27: Add lines 22 to 26. Net self-employment income ="; "Line 33 and line 15000: Line 28
    plus line 32 Total income". Line 14300 (line 26) is T2121 line 9946, $15,000; lines 22 to 25
    are $0, a chosen figure, so line 27 is 0 + 0 + 0 + 0 + 15,000 = 15,000, and total income is
    $15,000.00. The figures that depend on income are Return BY's, as its net income is the same.
