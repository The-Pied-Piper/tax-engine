    0 + 0 + 30,000 + 0 = 30,000.00. Total deductions are 0 (no CPP deduction, RRSP,
    union dues or child care expenses), so net income before adjustments (line 23400) is
    30,000.00 - 0 = 30,000.00; net income (line 23600) is that, not below zero (line
    23500 is 0, the chart not applying), 30,000.00, and taxable income (line 26000) is 30,000.00 - 0
    = 30,000.00.
