# Return DH: Return BT's single sole proprietor, a 2025 Ontario resident whose only activity
# is a business, one Form T2125 (Statement of Business or Professional Activities), with a
# Class 54 row (zero-emission vehicles) of the capital cost allowance table that sells two
# zero-emission passenger vehicles in 2025, each scaled on its own by the prescribed amount
# as a proportion of the actual cost of the vehicle (Area A endnote 2) and summed into the
# proceeds of dispositions (column 5). Car A was acquired in 2024 for $65,000 and sold at arm's
# length for $30,000: its cost is more than the prescribed amount for 2024, $61,000 (plus the
# sales tax, a chosen 0%), so its proceeds become $30,000 x ($61,000 / $65,000) = $28,153.85
# to the cent (Guide T4036's example prints $28,154, to the dollar). Car B was acquired in 2022
# for $50,000 and sold for $20,000: its cost is not more than the prescribed amount for 2022,
# $59,000, so its proceeds stay $20,000. Column 5 is $28,153.85 + $20,000 = $48,153.85 and
# column 7 is $100,000 + $0 - $48,153.85 = $51,846.15, with property left in the class, so the
# maximum CCA is 30% of column 19, $15,553.845, and the filer claims a chosen $15,000.00
# (column 21), which leaves a UCC of $36,846.15 at the end of the year. The business is Return
# BT's with no Charts A to C and the gross sales raised to a chosen $60,500, so that line 9946
# stays Return BB's $30,000.00 after the CCA of $15,000.00: expenses of $13,500 on six lines,
# line 9936 of $15,000.00, so line 9368 is $13,500 + $15,000.00 = $28,500.00 and line 9369 is
# $60,500 - $28,500.00 = $32,000.00. Every figure that depends on income is Return BB's. Amounts
# are quoted decimal strings, never floats; counts are quoted digit strings. Every output the
# CA-ON manifest declares must appear under `expected`, or be left out to be 0 (or no records).
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025 whose only activity is a business, reported on
  one Form T2125: gross sales of $60,500 (amount 3A, a chosen figure, $10,500 above Return
  BB's so that line 9946 is Return BB's $30,000.00), expenses of $13,500 on six lines and
  capital cost allowance of $15,000.00 on Class 54 (Area A, line 9936), so line 8299 and T1
  line 13499 are $60,500.00, line 9369 is $32,000.00, and, after $2,000 of
  business-use-of-home expenses, line 9946 and T1 line 13500 are $30,000.00. A chosen set of
  figures; there are no Charts A to C. Area A has one class, Class 54, with a UCC of
  $100,000 at the start of the year (a chosen figure) and no additions, that sells two
  zero-emission passenger vehicles at arm's length: car A, acquired in 2024 for $65,000 and
  sold for $30,000, whose proceeds are scaled by the prescribed amount for 2024, $61,000
  (the sales tax rate is a chosen 0%), over its actual cost, $61,000 / $65,000, to
  $28,153.85; and car B, acquired in 2022 for $50,000 and sold for $20,000, whose cost is
  below the prescribed amount for 2022, $59,000, so its proceeds stay $20,000. Column 5 is
  $48,153.85 and column 7 is $51,846.15; the filer claims a chosen $15,000.00 (column 21) of
  the maximum $15,553.845, and the UCC at the end of the year (column 22) is $36,846.15. No
  property is DIEP: line i is $0, and the immediate expensing limit is $1,500,000; the
  income before CCA (endnote 5) is $47,000.00, line 9369 plus line 9936, a chosen reading
  (see the sources). The net self-employment income (T1 line 27, "Add lines 22 to 26") is
  30,000 + 0 + 0 + 0 + 0 = $30,000; line 28 is line 21 (0) plus line 27 and total income
  (line 15000) adds line 27 to the other income lines, which are all 0, so total income is
  $30,000.00. The CPP months (Schedule 8 box A) are the 12 of a full year, Schedule 8 Part 4
  is not completed (count 0) and there is no agreement with the Canada Employment Insurance
  Commission (count 0), so the CPP contributions payable (line 42100), the base CPP
  contributions (line 31000) and the deduction (line 22200) on self-employment income, and
  the EI premiums on it (lines 31217 and 42120), are $0 and change no total.
sources:
  - >-
    CRA, Form T2125 (2025), Statement of Business or Professional Activities
    (docs/cra-forms-2025/t2125-25e.pdf, a PDF quote accepted 2026-10-19;
    https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2125/t2125-25e.pdf), Part 3A:
    "Gross sales, commissions, or fees (include GST/HST collected or collectible)" (3A);
    "GST/HST, provincial sales tax, returns, allowances, discounts, and GST/HST adjustments
    (included in amount 3A)" (3B); "Subtotal: Amount 3A minus amount 3B" (3C); "Subtotal:
    Amount 3D minus amount 3E" (3F); "Adjusted gross sales: Amount 3C plus amount 3F (enter
    on line 8000 of Part 3C)" (3G). Part 3C: "Reserves deducted last year" (8290); "Other
    income (specify)" (8230); "Subtotal: Line 8290 plus line 8230" (3O); "Gross business or
    professional income: Line 8000 plus amount 3O" (8299); "Report the gross business or
    professional income from line 8299 on the applicable line of your income tax and benefit
    return as indicated below: business income on line 13499". Part 3D: "Gross business
    income (line 8299 of Part 3C)" (3P); "Subtotal: Add amounts 3Q to 3U." (3V); "Cost of
    goods sold: Amount 3V minus line 8500" (8518); "Gross profit (or loss): Amount 3P minus
    line 8518." (8519). Part 4: "Gross business or professional income (line 8299 of Part
    3C) or Gross profit (line 8519 of Part 3D)." (4A); the expenses (enter only the business
    part) 4B "Advertising", 4E "Insurance", 4H "Office expenses", 4J "Professional fees
    (includes legal and accounting fees)", 4L "Rent", 4Q "Utilities" and 4T "Motor vehicle
    expenses (not including CCA) (amount 16 of Chart A)"; "Capital cost allowance (CCA).
    Enter amount ii of Area A minus any personal part and any CCA for business-use-of-home
    expenses" (9936, 4U); "Other expenses (specify)" (9270, 4V); "Total expenses: Total of
    amounts 4B to 4V" (9368); "Net income (loss) before adjustments: Amount 4A minus line
    9368" (9369). Part 5: "Your share of line 9369 or the amount from your T5013 slip,
    Statement of Partnership Income." (5A); "Canadian journalism labour tax credit allocated
    to you in the year (box 236 of your T5013 slip)" (5B); "GST/HST rebate for partners
    received in the year" (9974); "Total: Amount 5A plus amount 5B plus line 9974" (5C);
    "Other amounts deductible from your share of net partnership income (loss) (amount 6F)"
    (9943); "Net income (loss) after adjustments: Amount 5C minus line 9943" (5D);
    "Business-use-of-home expenses (amount 7P)" (9945); "Your net income (loss): Amount 5D
    minus line 9945" (9946); "Report the net income amount from line 9946 on the applicable
    line of your income tax and benefit return as indicated below: business income on line
    13500". Part 6: "Total other amounts deductible from your share of the net partnership
    income (loss): Add amounts 6A to 6E (enter this on line 9943 of Part 5)." (6F). Part 7:
    "Heat" (7A), "Electricity" (7B), "Insurance" (7C), "Maintenance" (7D), "Property taxes"
    (7F), "Subtotal: Add amounts 7A to 7G." (7H), "Personal-use part of the
    business-use-of-home expenses" (7I), "Subtotal: Amount 7H minus amount 7I" (7J),
    "Subtotal: Add amounts 7J to 7L." (7M), "Net income (loss) after adjustments (amount 5D)
    (if negative, enter "0")." (7N), "Business-use-of-home expenses available to carry
    forward: Amount 7M minus amount 7N (if negative, enter "0")" (7O) and "Allowable claim:
    Amount 7M or 7N above, whichever is less (enter your share of this amount on line 9945
    of Part 5)" (7P). Area A, "Calculation of capital cost allowance (CCA) claim": "Column
    2: Undepreciated capital cost (UCC) at the start of the year", "Column 3: Cost of
    additions in the year (see Areas B and C below)", "Column 4: Cost of additions from
    column 3 that are DIEPs (property must be available for use before 2025)", "Column 5:
    Proceeds of dispositions in the year (see Areas D and E below)", "Column 6: Proceeds of
    dispositions of DIEP (enter amount from col. 5 that relates to DIEP from col. 4)",
    "Column 7: UCC after additions and dispositions (col. 2 plus col. 3 minus col. 5)",
    "Column 8: UCC of DIEP (col. 4 minus col. 6)", "Column 9: Immediate expensing amount for
    DIEPs", "Column 10: Cost of remaining additions after immediate expensing (col. 3 minus
    col. 9)", "Column 13: Remaining UCC after immediate expensing (col. 7 minus col. 9)",
    "Column 18: Adjustment for current-year additions subject to the half-year rule. 1/2
    multiplied by (col. 10 minus col. 11 minus col. 12 minus col. 5). If negative, enter
    "0"", "Column 19: Base amount for CCA (col. 13 plus col. 15 plus col. 17 minus col.
    18)", "Column 20: CCA rate %", "Column 21: CCA for the year (col. 19 multiplied by col.
    20, or a lower amount, plus col. 9)", "Column 22: UCC at the end of the year (col. 7
    minus col. 21)", "Total CCA claim for the year: Total of column 21 (enter on line 9936
    of Part 4 amount ii minus any personal part and any CCA for business-use-of-home
    expenses)" (amount ii) and "Total immediate expensing claim for the year: Total of
    column 9" (line i); endnote 3: "If you have a negative amount in column 7, add it to
    income as a recapture in Part 3C on line 8230. If no property is left in the class and
    there is a positive amount in this column, deduct the amount from income as a terminal
    loss in Part 4 on line 9270."; endnote 4: "The amount you enter in column 8 must not be
    more than the amount from column 7. If the amount from column 7 is negative, enter
    "0."".
    Endnote 2: "The proceeds of disposition of a zero-emission passenger vehicle (ZEPV) that
    has been included in Class 54, or a passenger vehicle bought after April 18, 2021, that
    has been included in Class 10.1, and whose cost is more than the prescribed amount will
    be adjusted based on a factor equal to its prescribed amount as a proportion of the
    actual cost of the vehicle. For dispositions after July 29, 2019, you will have to
    adjust the actual cost of the vehicle for any payments or repayments of government
    assistance that you may have received or repaid for the vehicle. If the passenger
    vehicle in Class 10.1 is not designated for immediate expensing treatment, this special
    rule does not apply." Guide T4036 (Rental Income, 2025,
    docs/cra-forms-2025/t4036-25e.pdf, confirmed from the PDF; the Guide T4002 prints the
    same), "Class 54 (30%)": "There is a limit of $61,000 (plus federal and provincial sales
    taxes) on the capital cost for each zero-emission passenger vehicle in Class 54. Class
    54 may include both zero-emission passenger vehicles that do and do not exceed the
    prescribed threshold. However, unlike Class 10.1, Class 54 does not establish a separate
    class for each vehicle whose cost exceeds the threshold." and "If a zero-emission
    passenger vehicle is disposed of to a person or partnership with whom you deal at arm's
    length, and its cost exceeds the prescribed amount ($55,000 for vehicles acquired after
    March 18, 2019, and before January 1, 2022; $59,000 for vehicles acquired after December
    31, 2021, and before January 1, 2023; or $61,000 for vehicles acquired after December
    31, 2022), the proceeds of disposition will be adjusted based on a factor equal to the
    prescribed amount as a proportion of the actual cost of the vehicle." Its example:
    "Proceeds of disposition $30,000" and "$30,000 × ($61,000 ÷ $65,000) = $28,154" (to the
    dollar; the dataset rounds half-up to the cent, as it states no rounding rule, so the
    figure here is $28,153.85). The sales are a chosen $60,500 (Return BB's $50,000 plus
    $10,500, so that line 9946 is Return BB's) and the adjustments (3B), the quick method
    amounts, the reserves, the other income, the cost of goods sold lines and every other
    expense line are a chosen $0: amount 3C is 60,500 - 0 = 60,500, 3F is 0 - 0 = 0, 3G, and
    so line 8000, is 60,500 + 0 = 60,500. With no recapture (column 7 is positive) line 8230
    is 0 + 0 = 0, amount 3O is 0 + 0 = 0 and line 8299, and so T1 line 13499, is 60,500 + 0
    = 60,500. Amount 3P is 60,500; amount 3V is 0, line 8518 is 0 and line 8519, and so
    amount 4A, is 60,500 - 0 = 60,500. The six expense lines are Return BT's: advertising
    (line 8521) 1,500, insurance (line 8690) 1,200, office expenses (line 8810) 800,
    professional fees (line 8860) 2,500, rent (line 8910) 6,000 and utilities (line 9220)
    1,500, 13,500 in all, and no motor vehicle expenses (no vehicles in Charts A to C, a
    chosen 0, so line 9281 is 0). Area A has one class (below): amount ii is 15,000.00; the
    personal part of CCA and the CCA for business-use-of-home expenses (amount 7K) are a
    chosen $0 each, so line 9936 is 15,000.00 - 0 - 0 = 15,000.00; no property is left to
    give a terminal loss (a chosen 0 for the question of endnote 3), so line 9270 is 0 + 0 =
    0. Line 9368, in line order, is 13,500 + 15,000.00 + 0 = 28,500.00 and line 9369 is
    60,500 - 28,500.00 = 32,000.00. There is no partnership (a count of 0): amount 5A is
    line 9369, 32,000.00, amounts 5B and 9974 are 0 and amount 5C is 32,000.00; amounts 6A
    to 6E are 0, so amount 5D is 32,000.00. Part 7 is Return BT's: amount 7H is 600 + 500 +
    300 + 200 + 0 + 400 + 0 = 2,000, amount 7M is 2,000, amount 7N is 32,000.00, amount 7P
    is the lesser of 2,000 and 32,000.00, 2,000, which is line 9945. Line 9946 is 32,000.00
    - 2,000 = 30,000.00, T1 line 22 and line 13500. Area A, Class 54 (a chosen row): column
    2 is a chosen 100,000; column 3 and column 4 are a chosen 0 (no additions, no DIEP); the
    two cars sold are listed on the row, each with the year it was acquired, its cost, the
    government assistance for it (a chosen 0) and its proceeds (a chosen 0 of them a
    DIEP's); the row's own column 5 and 6 are a chosen 0 (the sale prices are listed per car).
    The sales tax rate of the Guide's "plus federal and provincial sales taxes" is a chosen
    0%, so the prescribed amount with tax is the printed amount: car A, acquired in 2024
    ("after December 31, 2022"), 61,000; car B, acquired in 2022 ("after December 31, 2021,
    and before January 1, 2023"), 59,000. Car A: the actual cost 65,000 - 0 = 65,000 is more
    than 61,000, so the factor is 61,000 / 65,000 and the proceeds are 30,000 x 61,000 /
    65,000 = 28,153.846..., rounded half-up to the cent once: 28,153.85. Car B: the actual
    cost 50,000 is not more than 59,000, so the proceeds stay 20,000. Column 5 is
    28,153.85 + 20,000 = 48,153.85 and column 6 is 0. Column 7 is 100,000 + 0 - 48,153.85 =
    51,846.15; column 8 is 0 - 0 = 0, column 9 is a chosen 0, column 10 is 0 - 0 = 0,
    columns 11 and 12 are a chosen 0, column 13 is 51,846.15 - 0 = 51,846.15, column 18 is
    one half x (0 - 0 - 0 - 48,153.85), not below 0, 0, and columns 14 to 17 are 0, so
    column 19 is 51,846.15 + 0 - 0 = 51,846.15. Property remains in the class (a chosen 0
    for no property left); the rate of Class 54 is 30%, so the most of column 21 is
    51,846.15 x 30% = 15,553.845 and the claim is a chosen 15,000.00 ("or a lower amount"),
    plus column 9, 0: column 21 is 15,000.00. Column 22 is 51,846.15 - 15,000.00 =
    36,846.15. The class has a positive column 7 and property left, so there is no recapture
    and no terminal loss. Not modelled: Part 2 (the Internet business activities), Part 8
    (the other partners), Part 9 (the equity) and Areas B to F.
