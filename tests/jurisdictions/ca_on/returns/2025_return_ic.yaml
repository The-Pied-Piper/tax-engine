# Return IC: a 2025 Ontario resident with one qualified small business corporation share (QSBCS)
# disposition in 2025 (a gain of $350,000, Schedule 3 line 10700), a loss of $100,000 on other
# shares (Schedule 3 line 13200) and a $40,000 capital gain on a T3 slip (Schedule 3 line 17600).
# Form T657 Step 1 line 9 (line 17600 of Schedule 3, halved) is therefore $20,000: it takes the T3
# gain out of line 10, so line 12 is $125,000.00 and line 13 is $125,000.00, not the $175,000.00 of
# line 7, and the annual gains limit (line 21) is $105,000.00. Returns BF and BH leave line 17600 at 0. The worked derivation is in the
# description.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025, resident in Canada throughout 2025, aged 18 or older
  at the end of 2025, with other income (T1 line 13000) of $10,000, a chosen figure. One disposition
  of qualified small business corporation shares (QSBCS) in 2025 after June 24, 2024: proceeds
  $500,000, adjusted cost base $150,000, outlays nil, so the gain is 350,000.00 (Schedule 3 line
  10700, column 5 = column 2 minus columns 3 and 4); all chosen figures. One disposition of other
  shares: proceeds $20,000, adjusted cost base $120,000, outlays nil, a loss of 100,000.00
  (Schedule 3 line 13200, chosen figures). A T3 slip gain of $40,000 (a chosen figure, Schedule 3
  line 16 and line 17600, "Capital gains or losses from your T3 slips"); it is not a gain on
  qualified farm or fishing property or qualified small business corporation shares (no box 55 or
  57), so it is not in Chart 2025. Schedule 3: line 19700
  is 350,000.00 - 100,000.00 + 40,000.00 = 290,000.00 and line 21 is the same, so line 24 is
  290,000.00 x 50% = 145,000.00, and line 26 (line 19900) is 145,000.00, the taxable capital gains
  on line 12700 (no partnership gains at full inclusion). Net capital losses of other years:
  20,000 are available (Form T1436 line 3 or 5, a chosen figure) and 20,000 are claimed (line 6
  of Form T1436, a chosen figure), so line 25300 is 20,000.00. Net income (line 23600) is 10,000.00 + 145,000.00 =
  155,000.00. Form T657 Step 1: line 1 is the lines 10700, 11000 and 12400 of Schedule 3,
  350,000.00 + 0 + 0 = 350,000.00 (the loss on other shares and the T3 gain are not in line 1);
  line 2 (Form T2017 line 13) is 0; line 3 is 350,000.00; line 4 is 1/2, so line 5 is 175,000.00;
  line 6 (Form T2048 line 17216) is 0; line 7 is 175,000.00. Line 8 (line 19900 of Schedule 3) is
  145,000.00. Line 9 is line 17600, 40,000.00, x 1/2 = 20,000.00. Line 10 is 145,000.00 -
  20,000.00 = 125,000.00; line 11 (Form T2048 line 17215) is 0; line 12 is 125,000.00. Line 13 is
  the lesser of line 7 (175,000.00) and line 12 (125,000.00): 125,000.00. Without line 9, line 12
  would be 145,000.00 and line 13 would be 145,000.00 less than 175,000.00, so line 9 changes line
  13 from 145,000.00 to 125,000.00. Line 14 is 20,000.00 (line 25300); line 15 (Form T936 Chart
  A line 14) is 0; line 16 is 20,000.00; line 17 (line 21700) is 0; line 18 (Form T2048 line
  17217) is 0; line 19 is 0; line 20 is 20,000.00; line 21 is 125,000.00 - 20,000.00 = 105,000.00,
  the annual gains limit for 2025. Step 2: line 8 is 100,000 (eligible taxable capital gains for
  2002 to 2024, a chosen figure) + 125,000.00 (Step 1 line 13) = 225,000.00; line 9 is 225,000.00
  (lines 1 to 7 are 0); lines 10 to 14 are 0; line 15 is 20,000.00 (Step 1 line 20); lines 16 and
  17 are 0; line 18 is 20,000.00; line 19 is 225,000.00 - 20,000.00 = 205,000.00, the cumulative
  gains limit for 2025. Chart 2 is all zeros. Chart 2025 Part 1 (Period 1 of 2024): no slip
  amounts, so amounts F to J are 0 and N, P and Q are 0. Part 2: amount A is 625,000.00; B is 0
  (Part 1's P); C is 625,000.00; D is 0 (Chart 2 line 19); E is 625,000.00; F is line 10700,
  350,000.00 (the loss and the T3 gain are not in F to J); G, H, I and J are 0; K is 350,000.00 x
  1/2 = 175,000.00; L is 0; M is 175,000.00; N is the lesser of E and M, 175,000.00; O is B, 0; P
  is 175,000.00; Q is the lesser of line 21 of Step 1 (105,000.00), line 19 of Step 2
  (205,000.00) and P (175,000.00): 105,000.00, the maximum for line 25400. The filer claims all
  of it, 105,000, a chosen figure, so line 25400 is 105,000.00 and line 25700 is 20,000.00 (line
  25300) + 105,000.00 (line 25400) = 125,000.00. Line 26000 is 155,000.00 - 125,000.00 =
  30,000.00, the taxable income. Federal tax, checked by hand: 30,000.00 x 14.5% = 4,350.00 less
  the basic personal amount credit 16,129.00 x 14.5% = 2,338.71 is 2,011.29, the basic federal tax
  (net income 155,000.00 is below the 177,882 where the basic personal amount starts to reduce).
  Ontario tax, checked by hand: 30,000.00 x 5.05% = 1,515.00 less the Ontario basic personal
  amount credit 12,747.00 x 5.05% = 643.72 is 871.28 (below the surtax threshold). The Ontario
  health premium for taxable income of 30,000.00 is 300.00, so the balance owing is 2,011.29 +
  871.28 + 300.00 = 3,182.57 (no tax was deducted at source). The other lines are blank, and the
  alternative minimum tax lines (no minimum tax is payable) are the engine's figures (to be
  confirmed against CRA's calculator).
sources:
  - >-
    CRA, Form T657, Calculation of Capital Gains Deduction, 2025 edition (confirmed 2026-10-19
    from the PDF; no .txt is published), Step 1: line 1 "Total of lines 10700, 11000, and 12400 of
    Schedule 3 (if negative, show in brackets)"; line 4 "Inclusion rate × 1/2"; line 5 "Line 3
    multiplied by the inclusion rate on line 4 (if negative, enter "0")"; line 7 "Line 5 minus
    line 6"; line 8 "Total taxable capital gains (or net capital losses) from line 19900 of
    Schedule 3 (if negative, show in brackets)"; line 9 "Amount from line 17600 of Schedule 3 (if
    negative, enter "0") × 1/2"; line 10 "Line 8 minus line 9"; line 12 "Line 10 minus line 11";
    line 13 "Enter whichever is less: amount from line 7 or line 12."; line 20 "Line 16 plus line
    19 Total losses for annual gains limit"; line 21 "Line 13 minus line 20 (if negative, enter
    "0") Annual gains limit for 2025".
  - >-
    CRA, Form T657, Step 2 lines 8, 9, 15, 18 and 19: line 8 "2002 to 2025 eligible taxable capital
    gains ... line 13 in Step 1 of Form T657 for 2025"; line 9 "Add lines 1 to 8. Cumulative
    eligible taxable capital gains"; line 15 "Amount from line 20 in Step 1"; line 18 "Add lines 10
    and 13 to 17."; line 19 "Line 9 minus line 18 (if negative, enter "0") ... Cumulative gains
    limit for 2025".
  - >-
    CRA, Form T657, Chart 2025 Part 2, amounts A to Q: "Maximum capital gains deduction for QFFP
    and/or QSBCS disposed of in 2025 or disposed of after June 24, 2024 and reported in 2025
    625,000.00 A"; F "Amount from line 10700 of Schedule 3 (do not include capital gains
    reported in box 30 of a T3 slip relating to a disposition of QSBCS unless ...)"; K "Add
    amounts F to J (if negative, enter "0") = × 1/2 = K"; N "Enter whichever is less: amount E or
    amount M."; Q "Enter whichever is less: line 21 of Step 1, line 19 of Step 2 or amount P
    above. This is the maximum amount you can claim on line 25400 of your 2025 return."
  - >-
    CRA, T1 General 2025, Ontario edition (form 5006-r), "Step 4 - Taxable income" (confirmed
    2026-10-19): "Line 65 and line 25400: Capital gains deduction (complete Form T657)"; "Line 68
    and line 25700: Add lines 58 to 67."; "Line 69 and line 26000: Line 57 minus line 68 (if
    negative, enter "0") Taxable income".
  - >-
    CRA, T1 General 2025, Ontario edition (form 5006-c), Ontario Health Premium table: taxable
    income above 25,000 up to 36,000 gives 300 (docs/cra-forms-2025/5006-c-25e.txt).
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t657/t657-25e.pdf
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-r/5006-r-25e.txt
