# Return KI: Form T1032, "Joint Election to Split Pension Income", Note 1 and the page 1 conditions,
# for a transferring spouse who died in May 2025 and was married or living common-law for the 3
# months of March to May. The transferring spouse's final return carries a registered pension of
# $30,000 (line 11500, all eligible pension income, a chosen figure) and elects to split $5,000 of it
# with the receiving spouse on line 21000. Every T1032 line below is worked out by hand from the form
# text (docs/cra-forms-2025/t1032-25e.txt); the end-to-end module checks them.
#
# Page 1: both conditions are met (not living separate and apart for 90 days or more including
# December 31, 2025, and both residents of Canada on December 31, 2025 or the date of death), so
# line 21 below is the maximum that can be elected.
# Step 2: Line 1 = 30,000.00, line 3 = 30,000.00 (no box 128), line 8 = 0.00 (no RCA), line 16 = 0.00
#   (no veterans benefits), line 17 = 30,000.00 + 0.00 + 0.00 = 30,000.00.
# Line 18: the marital status changed in the year (count 1). Months married 3, divided by the
#   number of months in the tax year: Note 1 says that when the transferring spouse is deceased the
#   "12" is replaced with the number of months up to and including the month of death, so May is
#   "5" (the transferring spouse died: count 1). 30,000.00 x 3 / 5 = 18,000.00.
# Line 19 = line 18, 18,000.00. Line 21 = 18,000.00 x 50% = 9,000.00.
# Step 3: Line 22: the amount jointly elected, $5,000.00 (the return's line 21000), not more than
#   line 21.
# Step 4 Part A: Line 24 = 5,000.00. Line 25 = line 8, 0.00. Line 26 = line 17, 30,000.00. Line 27
#   = 0.00 / 30,000.00 = 0. Line 29 = 0 x 5,000.00 = 0.00. Line 30 = 5,000.00 - 0.00 = 5,000.00.
#   Line 31 = 30,000.00 - 5,000.00 = 25,000.00; line 31400 is the lesser of $2,000 and 25,000.00,
#   so 2,000.00.
# Part B: line 32 = 0.00 (receiving spouse has no pension); line 33 = line 30, 5,000.00 (the
#   transferring spouse received none of the Note 1 payments); line 34 = 0.00 + 5,000.00 =
#   5,000.00; line 31400 of the receiving spouse is the lesser of $2,000 and 5,000.00, so 2,000.00.
# Step 5: line 35 is a chosen $3,000.00, line 36 = 3,000.00 x 5,000.00 / 30,000.00 = 500.00,
#   line 37 = 3,000.00, line 39 = 3,000.00 - 500.00 = 2,500.00, line 42 = 3,000.00 + 500.00 =
#   3,500.00. Total income is 30,000.00, net income 30,000.00 - 5,000.00 = 25,000.00.
# `expected` lists the T1032 lines worked above and the return's own total income, net income and
# taxable income, with line 43700 (2,500.00, line 39) and some guard and loader-required lines: those
# follow from the engine's other forms, are not derived here and are not part of the T1032 example.
# Amounts are quoted decimal strings, never floats; counts are quoted digit strings.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A 2025 Ontario resident who died in May 2025 (the transferring spouse of a joint election to
  split pension income), 18 or older, with a spouse or common-law partner on December 31, 2025
  and pension income (line 11500) of 30000, all eligible pension income. The marital status
  changed in the year: 3 months married or living common-law, divided by the 5 months up to and
  including the month of death (Note 1), so line 18 is 30000.00 x 3 / 5 = 18000.00, line 21 is
  9000.00 and the 5000 elected on line 21000 is allowed. Both conditions of page 1 are met.
  Every other figure is blank.
sources:
  - >-
    CRA, Form T1032 E (25), page 1: "You must meet all of the following conditions: You and your
    spouse or common-law partner were not living separate and apart from each other, because of a
    breakdown in your marriage or common-law relationship, for a continuous period of 90 days or
    more which includes December 31, 2025" and "You and your spouse or common-law partner were
    residents of Canada on December 31, 2025 (or on the date of death)".
  - >-
    CRA, Form T1032 E (25), page 2, Note 1: "If the transferring spouse or common-law partner is
    deceased, replace the "12" with the number of months up to and including the month of death.
    For example, if the month of death is May, the number of months in the tax year would be "5"."
  - >-
    CRA, Form T1032 E (25), Joint Election to Split Pension Income, page 2 (Step 2), "Line 1 and
    line 68020: Enter the amount of eligible pension income that was calculated on line 8 of the
    transferring spouse's or common-law partner's Federal Worksheet for line 31400."; "Line 5:
    131,483.45"; "Line 13: 131,483.45"; "Line 18: Number of months married or living common-law
    ... Divided by Number of months in the tax year (12) ..."; "Line 20: Maximum rate 50%"; "Line
    21: Line 19 multiplied by line 20 Maximum split-pension amount ="; and "Line 22: ... The
    split-pension amount cannot be more than the amount from line 21."
  - >-
    CRA, Form T1032 E (25), page 3 (Step 4): "Enter on line 31400 of the transferring spouse's or
    common-law partner's return, whichever is less: $2,000 or the amount from line 31." and "Enter
    on line 31400 of the receiving spouse's or common-law partner's return, whichever is less:
    $2,000 or the amount from line 34."
  - >-
    CRA, Form T1032 E (25), page 4 (Step 5): "Line 36: Amount from line 35 multiplied by Amount
    from line 22 divided by Amount from line 17"; "Line 39: Line 37 minus line 38 Enter the result
    on line 43700 of the transferring spouse's or common-law partner's return."
