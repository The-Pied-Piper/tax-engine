# Return GS: a self-employed filer whose only activity is one Form T2042 (farming) statement of a
# sole proprietor that fills in every income line and every expense line of Parts 3 and 4 that no
# earlier return sets (29 income lines and 14 expense lines, among others), the current year's
# optional and mandatory inventory adjustments (lines 9941 and 9942) and line 9951 of Part 5. Gross income
# $122,250.00, expenses $51,800.00, net farming income $75,250.00, all of total income, so the T1
# and tax figures are the ones of Return EY (net self-employment income $75,250.00), a balance
# owing of $14,468.38 before the refundable fuel charge credit of $800.00, $13,668.38 with it. Each
# figure is worked by hand from the form lines (see the description); the engine agrees on every
# listed line. Lines 9941, 9942 and 9951 are entered as the plain inputs they are today; line 9951
# is the same fact as Form T2043 amount 5C, so the Ontario partnership credit of 800.00 on Form
# T2043 line 67079 is entered too (line 9951 may not be above amount 5C). The designated province
# is 0, so no Form T2043 Part 2 credit is computed. Amounts are quoted decimal strings, never
# floats; counts are quoted digit strings.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025, resident in Canada throughout 2025, aged 18 or older at
  the end of 2025, with 12 months of CPP (Schedule 8 box A), Schedule 8 Part 4 not completed and no
  agreement for EI, as Return EY; every figure is a chosen one. One T2042 statement, no partner, no
  Area A rows, no vehicle. Part 3 by the form's lines, in order: Grains and oilseeds: wheat 9371
  24,950, oats 9372 1,100, barley 9373 1,200, mixed grains 9374 1,300, corn 9375 1,400, canola 9376
  1,500, flaxseed 9377 1,600, soybeans 9378 1,700 and 9370 1,800, 36,550. Other crops: fruit 9421
  2,100, potatoes 9422 2,200, vegetables 9423 2,300, tobacco 9424 2,400, other crops 9420 2,000, greenhouse and nursery 9425 2,500, forage crops or seeds
  9426 2,600, 16,100. Livestock: cattle 9471 3,100, swine
  9472 3,200, poultry 9473 3,300, sheep and lambs 9474 3,400 and 9470 3,000, 16,000; milk and cream
  9476 4,100, eggs 9477 4,200, other commodities 9520 4,300, 12,600. Program payments: dairy
  subsidies 9541 5,100, crop insurance 9542 5,200, other 9540 5,000, 15,300. Rebates 9570 6,100,
  custom work 9601 6,200, insurance proceeds 9604 6,300, patronage dividends 9605 6,400 and other
  income 9600 700 (no recapture), 25,700. Line 9659 = 36,550 + 16,100 + 16,000 + 12,600 + 15,300 +
  25,700 = 122,250, and amount 4A is the same. Part 4: containers and twine 9661 100, fertilizers
  and lime 9662 6,000, pesticides 9663 700, seeds and plants 9664 8,000, feed 9711 900, livestock
  purchased 9712 1,000, veterinary fees 9713 1,100 (17,800); machinery repairs 9760 1,200,
  gasoline 9764 1,300, building repairs 9795 1,400, clearing 9796 1,500, crop insurance premiums
  9797 1,600, custom work 9798 1,700, electricity 9799 1,800, heating fuel 9802 1,900, insurance
  program overpayment recapture 9803 2,000, insurance 9804 2,100 (16,500); interest 9805 2,200,
  office 9808 2,300, professional fees 9809 2,400, property taxes 9810 2,500, rent 9811 2,600,
  salaries 9814 2,700, small tools 9820 2,800 (17,500). Lines 9819, 9937, 9938 and 9790 are 0. Amount
  4B = 17,800 + 16,500 + 17,500 = 51,800; line 9936 is 0 (no Area A row); line 9898 = 51,800; line
  9899 = 122,250 - 51,800 = 70,450. Line 9941 1,500 and line 9942 2,500: 4C = 70,450 + 1,500 + 2,500
  = 74,450. Part 5: 5A is 4C (no partner) 74,450; line 9951 is 800; line 9974 is 0; 5B = 74,450 +
  800 = 75,250; line 9943 is 0, so 5C = 75,250; no home expenses, so line 9945 is 0 and line 9946 =
  75,250. T1 line 14100 is 75,250.00, net self-employment income, total income, net income and
  taxable income are the same, so the federal and Ontario figures are Return EY's (federal tax
  11,983.76 less the basic personal credit 2,338.71 is 9,645.05; Ontario tax 4,717.05 less 643.72
  is 4,073.33; health premium 750; total payable 14,468.38, as no tax was deducted). Line 9951 of
  800 is the credit allocated from a partnership, so Form T2043 line 67079 (Ontario) is 800.00 as
  well and amount 5C and 5D are 800.00, which is line 47556, a refundable credit: the refund or
  balance owing is 14,468.38 - 800.00 = 13,668.38, a balance owing.
sources:
  - >-
    CRA, Form T2042 (2025), Statement of Farming Activities (docs/cra-forms-2025/t2042-25e.pdf;
    https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2042/t2042-25e.pdf). Part 3: the
    income lines 9371 to 9605 and "Other income (specify)" (9600), "Gross income: Total of the
    income lines (enter this amount on line 14099 of your income tax and benefit return)" (9659).
    Part 4: "Gross income (line 9659 of Part 3)" (4A), the expense lines 9661 to 9820 and 9790,
    "Subtotal of expenses" (4B), "Capital cost allowance (CCA). Enter amount ii of Area A minus any
    personal part and any CCA for business-use-of-home expenses" (9936), "Total farm expenses:
    Amount 4B plus line 9936" (9898), "Net income (loss) before inventory adjustments: Amount 4A
    minus line 9898" (9899), "Optional inventory adjustment included in the current year" (9941),
    "Mandatory inventory adjustment included in the current year" (9942), "Net income (loss) after
    inventory adjustments: Total of lines 9899, 9941, and 9942" (4C). Part 5: "Your share of amount
    4C or the amount from your T5013 slip" (5A), "Return of fuel charge proceeds to farmers tax
    credit allocated to you in the year (amount 5C of Form T2043)" (9951), "Total: Amount 5A plus
    line 9951 plus line 9974" (5B), "Net income (loss) after adjustments: Amount 5B minus line 9943"
    (5C), "Your net income (loss): Amount 5C minus line 9945" (9946).
