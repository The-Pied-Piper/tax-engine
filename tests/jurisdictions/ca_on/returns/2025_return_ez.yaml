    following conditions apply:"; Part 3, "Line 1 and line 50339: Total CPP pensionable earnings
    from box 26 of all of your T4 slips (if box 26 is blank, enter the amount from box 14) (maximum
    $81,200 per slip)"; "Line 2: Enter whichever is less: amount from line D of Part 2 or line 1.";
    "Line 3: Amount from line B of Part 2"; "Line 4: Line 2 minus line 3 (if negative, enter "0") =";
    "Line 5: Line 2 minus line 4 (if negative, enter "0") ="; "Line 6: Amount from line E of Part 2"; "Line 7: Line 5
    minus line 6 (if negative, enter "0") (maximum $67,800) ="; "Line 8 and line 50340: Total actual
    base and first additional contributions on CPP pensionable earnings from box 16 of all of your
    T4 slips"; "Line 9: amount from line 8 multiplied by 83.1933% ="; "Line 10: Line 8 minus line 9
    ="; "Line 11: amount from line 7 multiplied by 4.95% (maximum $3,356.10) ="; "Line 12: amount
    from line 7 multiplied by 1% (maximum $678.00) ="; "Line 13: Line 11 plus line 12 ="; "Line 14:
