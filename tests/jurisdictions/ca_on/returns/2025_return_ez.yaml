    your return. amount from line 43 multiplied by 50% ="; "Line 88: Add lines 80, 81, 83, 84, and 87.
    Enter this amount (in dollar and cents) on line 22200 of your return. ="
    (docs/cra-forms-2025/5000-s8-25e.txt, Part 5, lines 1 to 88; the lines not quoted follow the same
    form text.)
  - >-
    CRA, Schedule 8 (2025), Part 3 (page 5): "If you are self-employed or electing to pay additional
    CPP contributions on other earnings, continue at Part 5." and "If, after completing Part 5, you
    calculate that the amounts on lines 30 and 42 of Part 5 are "0", follow the instructions below."
