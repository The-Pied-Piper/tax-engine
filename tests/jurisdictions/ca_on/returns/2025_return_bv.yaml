    68: Line 66 plus line 67"; "Line 69: Line 62 plus line 68"; "Line 71: Line 69 minus line
    70 (if negative, enter "0")"; "Line 72: If you entered an amount on line 11 of Part 5 of
    Form T691, use Worksheet ON428 to calculate your additional tax for minimum tax
    purposes."; "Line 73: Line 71 plus line 72"; "Line 80: Line 78 minus line 79 (if
    negative, enter "0") Ontario tax reduction"; "Line 81: Line 73 minus line 80 (if
    negative, enter "0")"; "Line 82: Provincial foreign tax credit (complete Form T2036)".
    Line 6 is 4,049.28, line 46 is 643.7235, rounded half-up to 643.72, and lines 66 and 67
