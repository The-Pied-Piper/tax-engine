# Return KV: Guide T4002's Heather (motor vehicle expenses of a passenger vehicle, printed page 55), a
# single Ontario resident whose only income is the net business income of one business reported on one
# Form T2125 for a full fiscal period (0 days entered). On January 1, 2025 Heather bought a new
# passenger vehicle that she uses for both personal and business use, and paid interest of $2,200 on
# the loan in her 2025 fiscal period. Her records: business kilometres 20,000, total kilometres 25,000,
# gasoline and oil $2,000, repairs and maintenance $1,000, insurance $1,900, interest $2,200, licence
# and registration $60; total vehicle expenses $7,160. Her available interest is the lesser of $2,200
# and $4,258 ($350 / 30 x 365 days): $2,200. The guide: 20,000 / 25,000 x $7,160 = $5,728, "Heather
# can deduct $5,728 as motor vehicle expenses for her 2025 fiscal period".
#
# CRA's printed figures are the $5,728 (line 9281) and the $2,200 of available interest (Chart B amount
# 19). The guide prints its limit as $4,258; the form's Chart B line 18 is a dollars-and-cents box and
# the engine's is $4,258.33, which is above $2,200 either way, so the interest is the same. The guide
# prints no sales figure: the gross sales of $20,000 (line 8299) are a chosen one, so the net business
# income (line 9946, T1 line 13500) is $14,272.00, the engine's figure from those. The 365 days of
# Chart B are the guide's own ("x 365 days").
#
# Schedule 8 Part 4 ("Complete this part if you are reporting only self-employment income") is completed (ca/cpp_part_4_completed 1), as the form directs for a return whose only income is self-employment, so lines 42100, 22200 and 31000 are computed; the CPP-dependent lines of the return are the engine's, not CRA's.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025 whose only income is the net business income of one sole proprietorship
  reported on one Form T2125 for a full fiscal period (0 days entered): chosen gross sales of $20,000
  (line 8299) and one passenger vehicle bought on January 1, 2025, Guide T4002's Heather (business kilometres
  20,000 of 25,000 total, gasoline and oil $2,000, repairs and maintenance $1,000, insurance $1,900, interest
  $2,200 over 365 days in Chart B, licence and registration $60), so the available interest is $2,200,
  the allowable motor vehicle expenses (line 9281) are $5,728.00, the total expenses (line 9368) are $5,728.00
  and the net business income (line 9946, T1 line 13500) is $14,272.00. No capital cost allowance is claimed.
sources:
  - >-
    CRA, Guide T4002 (2025), Self-employed Business, Professional, Commission, Farming, and Fishing Income
    (docs/cra-forms-2025/t4002-25e.pdf, confirmed from the PDF with pdftotext -layout), printed page 55,
    the example of Heather: "On January 1, 2025, she bought a new passenger vehicle that she uses for
    both personal and business use."; "the interest she paid in her 2025 fiscal period was $2,200"; "Heather’s
    available interest is the lesser of the following amounts: $2,200 (the total interest she paid in
    her 2025 fiscal period) $4,258 ($350 ÷ 30 × 365 days)"; "Business kilometres 20,000 km", "Total kilometres
    25,000 km", "Gasoline and oil $ 2,000", "Repairs and maintenance $ 1,000", "Insurance $ 1,900", "Interest
    (on loan to buy vehicle) $ 2,200", "Licence and registration $ 60", "Total vehicle expenses $ 7,160";
    "20,000 (business kilometres) ÷ 25,000 (total kilometres) × $7,160 = $5,728"; "Heather can deduct
    $5,728 as motor vehicle expenses for her 2025 fiscal period."
  - >-
    CRA, Form T2125 (2025), Statement of Business or Professional Activities (docs/cra-forms-2025/t2125-25e.pdf,
    confirmed from the PDF with pdftotext -layout), Chart A "Allowable motor vehicle expenses: Add amounts
    13 to 15 (enter this total on line 9281 of Part 4)"; Chart B "($350*** ÷ 30) × the number of days
    in the fiscal period for which interest was payable (accrual method) or paid (cash method)" and "Available
    interest expense: Amount 17 or 18, whichever is less (include this in amount 4 of Chart A above)".
