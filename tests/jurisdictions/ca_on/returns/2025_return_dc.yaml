# Return DC: Return BS's single filer, a 2025 Ontario resident whose only income is rental income
# from two units of one property (T1 line 13, Form T776 Parts 3 and 4), without Chart B, with the
# capital cost allowance of Area A on three classes: Class 1 and Class 8 as in Return BS, and a
# Class 10.1 passenger vehicle bought and sold in 2025 whose cost is above the prescribed amount, so
# that its proceeds of disposition (Area A column 5) and the proceeds of dispositions of DIEP
# (column 6) are adjusted by the prescribed amount as a proportion of the actual cost of the vehicle
# (Area A Note 2). The vehicle cost $50,000 before the HST of 13%, $56,500.00 in all (the actual
# cost, no government assistance); its capital cost is limited to the prescribed amount for 2025,
# $38,000 + 13% = $42,940.00 (columns 3 and 4), and it was sold at arm's length for $40,000 (column
# 5, all of it a DIEP's, column 6), so the factor is $42,940.00 / $56,500.00 = 0.76 and the proceeds
# become $40,000 x 0.76 = $30,400.00 in both columns. Column 7 is $0 + $42,940 - $30,400.00 =
# $12,540.00 and column 8 is $42,940 - $30,400.00 = $12,540.00, so the immediate expensing amount
# (column 9) can be the whole $12,540. No property is left in the class, so the maximum is $0 and
# column 23 is $0 + $12,540 = $12,540.00, claimed, with a column 24 of $0 and no terminal loss. The
# rent is Return BS's $24,000 raised by the vehicle's $12,540 to a chosen $36,540 (line 8141), so the
# income before CCA (amount 5) is $36,540 - $12,000 = $24,540.00 and the net rental income is
# Return BS's $8,000.00 (line 12600), so every T1 figure is Return BS's.
# Amounts are quoted decimal strings, never floats; counts are quoted digit strings. Every output
# the CA-ON manifest declares must appear under `expected`, or be left out to be 0 (or no records).
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025 whose only income is rental income from two units of
  one property, reported on Form T776 (Statement of Rental Activities): gross rents of $36,540
  (line 8141, a chosen figure), expenses of $12,000 (insurance, interest, repairs and property
  taxes) and so an income before CCA (amount 5) of $24,540.00. Area A has three classes: Class 1
  ($400.00 claimed, the maximum of its $10,000 UCC), Class 8 ($3,600.00 claimed, with a $3,000
  immediate expensing amount on its DIEP additions, as in Return BS) and Class 10.1, one passenger
  vehicle designated for immediate expensing, bought in 2025 for $50,000 plus the HST of 13%
  ($56,500.00, no government assistance) and sold in 2025 for $40,000: its capital cost is limited
  to the prescribed amount for 2025 with tax, $42,940.00 (columns 3 and 4), and because its actual
  cost is more than that, the proceeds of $40,000 (columns 5 and 6) are adjusted by
  $42,940.00 / $56,500.00 = 0.76 to $30,400.00. Column 7 and column 8 are $12,540.00; the immediate
  expensing amount (column 9) is the whole $12,540, so column 23 is $12,540.00, claimed, and the
  UCC at the end of the year is $0. Line i is $3,000 + $12,540 = $15,540, within the least of Note
  5's three amounts ($600,000.00, the UCC of DIEPs in column 8, $17,540, and the income before CCA,
  $24,540.00). Line ii, and so line 9936, is $400.00 + $3,600.00 + $12,540.00 = $16,540.00, within
  amount 5, so amount 6 and line 9946, and so T1 line 12600, are $24,540.00 - $16,540.00 =
  $8,000.00, which is the whole of total income (line 15000), as in Return BS. The filer is
  associated with one other EPOP under a filed agreement that assigns the filer 40% of a total of
  100%, so the immediate expensing limit is $600,000.00, as in Return BS. The tax figures are
  Return BS's, since the net income is the same.
sources:
  - >-
    CRA, Form T776 (2025), Statement of Rental Activities (docs/cra-forms-2025/t776-25e.pdf,
    confirmed from the PDF with pdftotext): "Line 8141: Gross rents" (24000 in Return BS, 36540
    here, a chosen figure); "Amount 5: Income before CCA" is gross rents less the expenses, 36540 -
    12000 = 24540.00; "Line ii: Total CCA claim for the year *: Total of column 23" (16540.00);
    "Amount 6: Amount 5 less line ii" (8000.00), the net rental income on T1 line 12600. The lines
    not listed are not entered and are 0.
  - >-
    CRA, Form T776 (2025), Area A Note 2 (docs/cra-forms-2025/t776-25e.pdf, confirmed from the
    PDF with pdftotext): "The proceeds of disposition of a zero-emission passenger vehicle (ZEPV)
    that has been included in Class 54, or a passenger vehicle bought after April 18, 2021, that has
    been included in Class 10.1, and whose cost is more than the prescribed amount will be adjusted
    based on a factor equal to its prescribed amount as a proportion of the actual cost of the
    vehicle. For dispositions after July 29, 2019, you will have to adjust the actual cost of the
    vehicle for any payments or repayments of government assistance that you may have received or
    repaid for the vehicle. If the passenger vehicle in Class 10.1 is not designated for immediate
    expensing treatment, this special rule does not apply." Guide T4036 (docs/cra-forms-2025/t4036-
    25e.pdf, confirmed from the PDF), "Class 10.1 (30%)": "$38,000 for vehicles acquired in 2025,
    plus the GST/HST or PST".
  - >-
    CRA, Form T776 (2025), Area A and Notes 3 and 5 (docs/cra-forms-2025/t776-25e.pdf): the Class
    10.1 vehicle is a chosen row with column 2 0, column 3 and column 4 42940 (the capital cost
    limited to the prescribed amount with tax, 38000 + 4940), columns 5 and 6 of 40000 as entered
    (adjusted to 30400.00 by the factor 42940.00 / 56500.00 = 0.76), column 7 0 + 42940 - 30400.00
    = 12540.00, column 8 42940 - 30400.00 = 12540.00, not more than column 7, column 9 a chosen
    12540, not more than column 8, column 13 12540 - 12540 = 0, column 18 one half x (30400.00 -
    30400.00) = 0, no property left in the class (a chosen 1), so the maximum is 0 and column 23 is
    12540.00, claimed, and column 24 is 12540 - 12540.00 = 0.00; the terminal loss (Note 3, column
    7 less column 9) and the recapture are 0. Class 1 and Class 8 are as in Return BS: column 23 of
    400.00 and 3600.00, so column 24 is 9600.00 and 3400.00. Note 5: the EPOP limit is 1500000 x 40%
    = 600000.00 (as in Return BS), and the three amounts are 600000.00, the UCC of DIEPs in column 8
    (5000 + 12540 = 17540) and the income before CCA, 24540.00; the least is 17540, and line i,
    15540, is within it.
  - >-
    CRA, "T1-2025 Ontario edition" return (form 5006-R, docs/cra-forms-2025/5006-r-25e.txt,
    confirmed 2026-10-19): line 12600 is T776 amount 6, $8,000.00, so the total income and net
    income are $8,000.00, and the federal tax, Ontario tax and the total payable are as in Return BS.
