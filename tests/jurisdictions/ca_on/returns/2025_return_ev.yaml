# Return EV: the six designated provinces of Form T2043 Part 2 other than Ontario and
# Manitoba (Saskatchewan, Alberta, Nova Scotia, Prince Edward Island, Newfoundland and
# Labrador, New Brunswick), Parts 1, 2 and 5 with Chart A, for six farming businesses, each
# on its own Form T2042 statement for a fiscal period of 365 days, one in each province.
# Each statement has no inventory adjustment, no non-arm's length expense and no partner.
# Its wheat income is its seeds and plants expense plus 10,000, so each farm nets 10,000 and
# the six together net 60,000. The net income keeps the credit below the regular federal and
# Ontario tax, so the credit reduces a balance owing.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  Return EV: a 2025 Ontario resident in Canada throughout 2025, aged 18 or older, with no
  employment income and no other income (every line not named here is 0). Six farming
  businesses, each reported on one Form T2042 (a chosen set), one in each of the six
  designated provinces other than Ontario and Manitoba, entered with the province code of
  Form T2043 Part 2 (3 for Saskatchewan, 4 for Alberta, 5 for Nova Scotia, 6 for Prince
  Edward Island, 7 for Newfoundland and Labrador, 8 for New Brunswick). Each fiscal period
  is 365 days (entered as 365), and each statement has no inventory adjustment, no non-arm's
  length expense and no partner. Each statement's wheat income (a chosen figure) is its
  seeds and plants expense (also a chosen figure) plus 10,000, so each net farming income is
  10,000.00 and the six total 60,000.00. Chart A of each statement: amount 5 is 0.00, so
  amount 6 (gross farming expenses) is the seeds and plants expense: 40,000.00 (SK),
  50,000.00 (AB), 30,000.00 (NS), 25,000.00 (PE), 36,500.00 (NL) and 10,950.00 (NB). Amount
  7 is the days in 2024 over the 365 days of the period (a chosen figure: 365, 73, 292, 146,
  100 and 219 days in 2024), and amount 8 is amount 6 times amount 7, rounded once:
  40,000.00 (SK), 10,000.00 (AB), 24,000.00 (NS), 10,000.00 (PE), 10,000.00 (NL) and
  6,570.00 (NB). Part 1 line 67061 is the total of amount 6, 192,450.00, which is 25,000 or
  more, so the businesses are eligible. Part 2 at the 0.229% payment rate (0.00229): SK's
  40,000.00 is 91.60 (2C); AB's 10,000.00 is 22.90 (2D); NS's 24,000.00 is 54.96 (2E); PE's
  10,000.00 is 22.90 (2F); NL's 10,000.00 is 22.90 (2G); NB's 6,570.00 is 15.0453, which
  rounds half-up to 15.05 (2H); ON and MB (2A and 2B) are 0.00; so 2I is 230.31. Part 5: 5A
  is 2I, 230.31, because line 67061 reaches the threshold; 5B is 0.00 (Part 4 is not in this
  return); no partnership credit is allocated (lines 67079 to 67082 and 67103 to 67106 are
  0, so 5C is 0.00); and 5D, the total credit for all businesses that is line 47556, is
  230.31. The credit is not refunded here: the 2025 federal tax after credits (6,518.80) and
  Ontario tax (2,677.95) plus the 600.00 health premium exceed the 230.31 and no tax was
  withheld, so the refund is 0.00 and the balance owing is 9,566.44.
sources:
  - >-
    CRA, Form T2043 (2025), Return of Fuel Charge Proceeds to Farmers Tax Credit
    (docs/cra-forms-2025/t2043-25e.pdf, a PDF quote confirmed 2026-10-25;
    https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2043/t2043-25e.pdf), page 1:
    "Fill in parts 1, 2 and 5 if you have: one farming business with one or more permanent
    establishments in only one designated province; multiple farming businesses, each of
    which has one or more permanent establishments in the same designated province; multiple
    farming businesses, where, for example, one business has one or more permanent
    establishments in only one designated province and another business has one or more
    permanent establishments in a different designated province".
  - >-
    CRA, Form T2043 (2025), Part 1, line 67061 "Total gross farming expenses for all of your
    businesses: Add amount 6 of every Chart A." Note 1: "If your total gross farming
    expenses for all businesses are $25,000 or more, you are eligible to claim the credit."
  - >-
    CRA, Form T2043 (2025), Chart A: amount 1 "Total farming expenses (line 9898 of Form
    T2042)"; amount 6 "Gross farming expenses: Amount 1 minus amount 5"; amount 7 "Total
    number of days in the fiscal period that fall within the 2024 calendar year divided by
    the total number of days in the fiscal period (if the fiscal period starts and ends in
    2025, enter "0")"; amount 8 "Amount 6 multiplied by amount 7."
  - >-
    CRA, Form T2043 (2025), Part 2: "Add all farming expenses in SK from amount 8 of Chart
    A" (67065) "× SK payment rate 0.229% =" (2C), and the same for AB (67066, 2D), NS
    (67091, 2E), PE (67092, 2F), NL (67093, 2G) and NB (67094, 2H); "Total: Add amounts 2A
    to 2H (enter this total at amount 5A)" (2I).
  - >-
    CRA, Form T2043 (2025), Part 5: "Enter amount 2I" (5A); "Enter amount 4I" (5B); "Total
    credit allocated from partnerships: Add lines 67079 to 67082 and lines 67103 to 67106"
    (5C); "Total credit for all businesses: Amount 5A plus amount 5B plus amount 5C (enter
    this amount on line 47556 of your income tax and benefit return)" (5D).
