# Return MJ: Guide T4044, Part B column 3, the cost of a passenger vehicle that changed use and of one
# bought from a non-arm's-length person. Amounts are quoted decimal strings.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  Return MJ: Guide T4044 (2025), Part B "Column 3 - Cost of additions in the year", for two Class 10.1
  vehicles, on the salaried employee of Return LH (employment income $50,000, other expenses of
  $6,000, interest of $500 on line 26, all kilometres driven for employment). Vehicle 1 was owned for
  personal use and started being used for employment in 2025 ("a change in use"): "the amount you
  will enter in column 3 is the fair market value of the property at the time you start using the
  property for employment"; a car bought in 2018 for $45,000 that is worth $40,000 in 2025 has
  $40,000 in column 3. It is Class 10.1 whether the 2018 purchase sets the class (after December 31,
  2000 and before January 1, 2022, it cost more than $30,000) or the $40,000 value in 2025 does
  (more than $38,000); the Guide does not say which applies. Vehicle 2 was bought in 2025 for
  $40,000 before tax from a relative: "the capital cost is
  the least of the following three amounts": the fair market value when acquired ($35,000), "$38,000
  plus the GST and PST or HST that you would have paid on $38,000" (at the 13% HST of Ontario,
  $38,000 + $4,940 = $42,940) and the seller's cost just before ($30,000), so column 3 is $30,000.
  The Guide gives no claim for them: the claims are a chosen $500 for vehicle 1 and $1,000 for vehicle
  2 (each within 30% of its column 5), so the CCA is $1,500, as in Return LH, and every other line is
  the same as Return LH: line 25 is 1,500, line 3 is 1,500 + 500 = 2,000, line 15 is 8,000.00 and T777
  line 17 and T1 line 22900 are 8,000.00. Not pinned: the Guide's "in most cases" for a change in
  use, because the Guide names no other case.
sources:
  - >-
    CRA, Guide T4044 (2025), Employment Expenses (docs/cra-forms-2025/t4044-25e.txt;
    https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t4044/t4044-25e.txt), "Part B - Class
    10.1 property", "Column 3 - Cost of additions in the year": "If you owned a passenger vehicle for
    personal use and then started using it for employment in 2025, there is a change in use. In most
    cases when this happens, the amount you will enter in column 3 is the fair market value of the
    property at the time you start using the property for employment." and "There is a limit on the
    capital cost of a Class 10.1 vehicle you buy from a person with whom you have a non-arm's length
    relationship. [...] In this case, the capital cost is the least of the following three amounts:
    - the fair market value of the vehicle when you acquired it - $38,000 plus the GST and PST or HST
    that you would have paid on $38,000 if you had acquired the vehicle in 2025 - the seller's cost
    of the vehicle just before you acquired it."
  - >-
    CRA, Form T777 (2025), Statement of Employment Expenses (docs/cra-forms-2025/t777-25e.pdf, the
    only published copy; https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t777/t777-25e.pdf):
    "Add lines 1 to 14. = 15"; "Line 15 plus line 16. Enter this amount on line 22900 of your return.
    Total expenses = 17".
