# Return BY: Return BD's single sole proprietor, a 2025 Ontario resident whose only activity is
# a fishing business, one Form T2121 (Statement of Fishing Activities), with the capital cost
# allowance of Area A on one class that has a designated immediate expensing property (DIEP)
# with an immediate expensing amount (Area A columns 4, 8 and 9, line i, and Area G). The
# fishing business is Return BD's with the fish products raised by $9,150 to a chosen $49,150,
# so that line 9946 stays Return BD's $15,000.00: income of $49,150 (fish products, amount 3A)
# and expenses of $25,000 on two lines (salt, bait and ice, line 9138, $10,000, and fishing gear,
# line 9136, $15,000). Area A has one class, Class 7, with a UCC of $20,000 at the start and
# additions (column 3) of $8,000, all DIEPs (column 4 $8,000), so column 7 is $28,000 and
# column 8 is $8,000; the immediate expensing amount (column 9) is a chosen $6,000, so column 10
# is $2,000, column 13 is $22,000, column 18 is one half of $2,000 = $1,000.00 and column 19 is
# $21,000.00; the maximum is $21,000.00 x 15% = $3,150.00 and column 21 is $3,150.00 + $6,000 =
# $9,150.00, which is claimed, so column 22 is $28,000 - $9,150.00 = $18,850.00. Line i, the
# total immediate expensing claim, is $6,000, at most the least of endnote 5's three amounts:
# the immediate expensing limit ($600,000.00, the fishing business being associated with one
# other EPOP under a filed agreement that assigns it 40% of a total of 100%: $1.5 million x 40%),
# the UCC of DIEPs ($8,000, the total of column 8) and the income from the fishing business
# before CCA ($24,150.00, line 9369 plus line 9936). Line ii, and so line 9936, is $9,150.00, so
# line 9368 is $25,000 + $9,150.00 = $34,150.00 and line 9369 is $49,150 - $34,150.00 =
# $15,000.00, which with no partner and no business-use-of-home expenses is the whole of line
# 9946 and T1 line 14300, and of total income (line 15000). Every figure that depends on income is
# Return BD's. Amounts are quoted decimal strings, never floats; counts are quoted digit strings.
# Every output the CA-ON manifest declares must appear under `expected`, or be left out to be 0
# (or no records). The farming lines (Form T2042) are not triggered and are not listed here.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025 whose only activity is a fishing business,
  reported on one Form T2121: fish products of $49,150 (amount 3A, a chosen figure $9,150
  above Return BD's so that line 9946 is Return BD's $15,000.00), so line 8299 and T1 line
  14299 are $49,150.00; expenses of $25,000 on two lines (salt, bait and ice, line 9138,
  $10,000, and fishing gear, line 9136, $15,000), so amount 4Q is $25,000.00, and capital
  cost allowance of $9,150.00 on Class 7 (Area A, line 9936), so line 9368 is $34,150.00 and
  line 9369 is $15,000.00; with no partner and no business-use-of-home amounts, line 9946 and T1
  line 14300 are $15,000.00. The motor vehicle expenses (line 9281) are Charts A to C for a leased
  passenger vehicle used for no fishing (business kilometres 0), so line 9281 is $0 and changes
  no total. Area A has one class, Class 7 (UCC at the start $20,000, additions $8,000, all DIEPs,
  an immediate expensing amount of $6,000), whose column 21 is $3,150.00 + $6,000 = $9,150.00,
  claimed in full: line i is $6,000, line ii and line 9936 are $9,150.00, and the UCC at the end
  of the year is $18,850.00. Area G: the fishing business is associated with one other EPOP under
  an agreement that was filed, the percentage assigned to it is 40 and the total of column 3 is
  100, so the immediate expensing limit allocated to the fishing business (amount iii) is
  $1,500,000 x 40% = $600,000.00 and no amount is allocated by the minister. The income before
  CCA (endnote 5) is $24,150.00, line 9369 plus line 9936, a chosen reading (see the sources). A
  chosen set of figures. The net self-employment income (T1 line 27, "Add lines 22 to 26") is 0 +
  0 + 0 + 0 + 15,000 = $15,000; line 28 is line 21 (0) plus line 27 and total income (line 15000)
  adds line 27 to the other income lines, which are all 0, so total income is $15,000.00. The
  farming income (Form T2042, T1 line 25) is not triggered and is 0. Every figure from line 27 on
  is the same as Return BD's, whose net fishing income is the same $15,000. The CPP months
  (Schedule 8 box A) are the 12 of a full year, Schedule 8 Part 4 is not completed (count 0) and
  there is no agreement with the Canada Employment Insurance Commission (count 0), so the CPP
  contributions payable (line 42100), the base CPP contributions (line 31000) and the deduction
  (line 22200) on self-employment income, and the EI premiums on it (lines 31217 and 42120), are
  $0 and change no total.
sources:
  - >-
    CRA, Form T2121 (2025), Statement of Fishing Activities (docs/cra-forms-2025/t2121-25e.pdf,
    confirmed 2026-10-19 from the PDF; https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2121/t2121-25e.pdf),
    Part 3: "Gross income: Total of amounts 3A to 3F and line 9600 (enter this amount on line
    14299 of your income tax and benefit return)" (8299); Part 4: "Gross income (line 8299 of
    Part 3)" (4A); "Subtotal: Add amounts 4B to 4P." (4Q); "Capital cost allowance (CCA). Enter
    amount ii of Area A minus any personal part and any CCA for business-use-of-home expenses."
    (9936); "Total expenses: Amount 4Q plus line 9936" (9368); "Net income (loss) before adjustments:
    Amount 4A minus line 9368." (9369); "Your cost (amount 4 minus amount 5)" (8963, amount 4O).
    Part 5: "Your share of line 9369 or the amount from your T5013 slip, Statement of Partnership
    Income" (5A); "Total: Amount 5A plus line 9974" (5B); "Net income (loss) after adjustments:
    Amount 5B minus line 9943" (5C); "Your net income (loss): Amount 5C minus line 9945 (enter this
    amount on line 14300 of your income tax and benefit return)" (9946). Part 6: "Total other
    amounts deductible from your share of the net partnership income (loss): Add amounts 6A to 6E
    (enter this amount on line 9943 of Part 5)." (6F). Part 7: "Subtotal: Add amounts 7A to 7G."
    (7H); "Subtotal: Amount 7H minus amount 7I" (7J); "Subtotal: Add amounts 7J to 7L." (7M);
    "Net income (loss) after adjustments (amount 5C) (if negative, enter "0")." (7N); "Business-use-
    of-home expenses available to carry forward: Amount 7M minus amount 7N (if negative, enter
    "0")" (7O); "Allowable claim: Amount 7M or 7N above, whichever is less (enter your share of this
    amount on line 9945 of Part 5)" (7P). Area A endnote 3: "If you have a negative amount in column
    7, add it to income as a recapture in Part 3 on line 9600. If no property is left in the class
    and there is a positive amount in this column, deduct the amount from income as a terminal loss
    in Part 4 on line 9270." The income lines (Part 3), the expense lines (Part 4) and the caller's
    amounts are the chosen figures in the description; the lines not listed are not entered and are
    0. Not modelled: Part 1 (identification), Part 2 (the Internet business activities), Part 8 (the
    other partners), Part 9 (the equity), Areas B to F (Charts A to C and Area G are modelled, see
    the sources below). Area A has one class (see the sources below): amount ii is 9,150.00; the
    personal part of CCA and the CCA for business-use-of-home expenses (amount 7K) are a chosen $0
    each, so line 9936 is 9,150.00 - 0 - 0 = 9,150.00; there is no recapture or terminal loss, so
    line 9600 is 0 + 0 = 0 and line 9270 is 0 + 0 = 0. The income line is a chosen figure: fish
    products (amount 3A) 49,150, so line 8299, and so amount 4A, is 49,150; the expenses (4Q) are
    10,000 + 15,000 = 25,000, line 9368 is 25,000 + 9,150.00 = 34,150.00 and line 9369 is 49,150 -
    34,150.00 = 15,000.00; amounts 5A, 5B and 5C are 15,000.00 (no partner), amount 7N is
    15,000.00 and line 9946 is 15,000.00 - 0 = 15,000.00.
  - >-
    CRA, Form T2121 (2025), Statement of Fishing Activities (docs/cra-forms-2025/t2121-25e.pdf,
    confirmed from the PDF with pdftotext; https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2121/t2121-25e.pdf),
    Area A (page 4), "Calculation of capital cost allowance (CCA) claim": "Column 2: Undepreciated
    capital cost (UCC) at the start of the year", "Column 3: Cost of additions in the year (see
    Areas B and C below)", "Column 4: Cost of additions from column 3 that are DIEPs (property
    must be available for use before 2025)", "Column 5: Proceeds of dispositions in the year (see
    Areas D and E below)", "Column 6: Proceeds of dispositions of DIEP (enter amount from col. 5
    that relates to DIEP from col. 4)", "Column 7: UCC after additions and dispositions (col. 2
    plus col. 3 minus col. 5)", "Column 8: UCC of DIEP (col. 4 minus col. 6)", "Column 9:
    Immediate expensing amount for DIEPs", "Column 10: Cost of remaining additions after
    immediate expensing (col. 3 minus col. 9)", "Column 13: Remaining UCC after immediate
    expensing (col. 7 minus col. 9)", "Column 18: Adjustment for current-year additions subject
    to the half-year rule. 1/2 multiplied by (col. 10 minus col. 11 minus col. 12 minus col. 5).
    If negative, enter "0"", "Column 19: Base amount for CCA (col. 13 plus col. 15 plus col. 17
    minus col. 18)", "Column 20: CCA rate %", "Column 21: CCA for the year (col. 19 multiplied by
    col. 20, or a lower amount, plus col. 9)", "Column 22: UCC at the end of the year (col. 7
    minus col. 21)", "Total immediate expensing claim for the year: Total of column 9" (line i)
    and "Total CCA claim for the year: Total of column 21 (enter on line 9936 of Part 4 amount ii
    minus any personal part and any CCA for business-use-of-home expenses)" (amount ii); endnote
    4 (page 7): "The amount you enter in column 8 must not be more than the amount from column 7.
    If the amount from column 7 is negative, enter "0."". Class 7 (a chosen figure, 15% in
    docs/cra-forms-2025/t4002-25e.pdf): column 2 is a chosen 20,000, column 3 a chosen 8,000,
    column 4 a chosen 8,000 (all the additions are DIEPs) and columns 5 and 6 a chosen 0, so
    column 7 is 20,000 + 8,000 - 0 = 28,000; column 8 is 8,000 - 0 = 8,000, not more than column
    7; column 9 is a chosen 6,000, not more than column 8 (Guide T4002: "Enter the immediate
    expensing amount you choose to apply to each class."); column 10 is 8,000 - 6,000 = 2,000;
    columns 11 and 12 are a chosen 0, so column 14 is 0 - 2,000 + 0 + 0, negative, 0, and columns
    15, 16 and 17 are 0; column 13 is 28,000 - 6,000 = 22,000; column 18 is one half x (2,000 - 0
    - 0 - 0) = 1,000.00; column 19 is 22,000 + 0 + 0 - 1,000.00 = 21,000.00; column 21 is
    21,000.00 x 15% = 3,150.00, plus column 9, 6,000: 9,150.00, a chosen claim, the most; column
    22 is 28,000 - 9,150.00 = 18,850.00, no property left being a chosen 0. A claim below column 9
    or above column 21 is refused. The columns the form computes (15, 17, 18 and the maximum) are
    dollars-and-cents boxes, rounded half-up to the cent, which changes none of them.
  - >-
    CRA, Form T2121 (2025), Statement of Fishing Activities (docs/cra-forms-2025/t2121-25e.pdf,
    confirmed from the PDF with pdftotext;
    https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2121/t2121-25e.pdf), Area A endnote 5
    (page 7) "The immediate expensing applies to DIEPs included in column 8. The total immediate
    expensing amount for the tax year (total of column 9) is limited to the lesser of: - the
    immediate expensing limit, which is equal to one of the following, whichever is applicable: --
    $1.5 million, if you are not associated with any other eligible person or partnership (EPOP) in
    the tax year -- amount iii of Area G, if you are associated with one or more EPOPs in the tax
    year -- zero, if you are associated with one or more EPOPs and an agreement that assigns a
    percentage to one or more of the associated EPOPs was not filed with the minister in a
    prescribed form -- any amount allocated by the minister under subsection 1104(3.4) of the
    Regulations - the UCC of DIEPs in column 8 - the amount of income, if any, earned from the
    source of income that is a business (before any CCA deductions) in which the relevant DIEP is
    used for the tax year For more information, see Guide T4002."; Area G (page 6) "Are you
    associated in the fiscal period with one or more EPOPs that you have entered into an agreement
    with under subsection 1104(3.3) of the Regulations? Yes or No"; "Enter the percentage assigned
    to each associated EPOP (including your business) as determined in the agreement. This
    percentage will be used to allocate the immediate expensing limit. The total of all percentages
    assigned under the agreement should not be more than 100%. If the total is more than 100%, then
    the associated group has an immediate expensing limit of zero."; "3: Percentage assigned under
    the agreement"; "Total of percentage assigned: Total of column 3"; "Immediate expensing limit
    allocated to your business: Multiply $1.5 million by the percentage assigned to your business in
    column 3**" (amount iii); "** If the total of column 3 is more than 100%, enter "0."". Guide
    T4002 (docs/cra-forms-2025/t4002-25e.pdf, confirmed from the PDF), Area G: "Enter the result at
    amount iv of Form T2042 or at amount iii of Form T2121 or T2125."; Column 9: "Enter the
    immediate expensing amount you choose to apply to each class. The total immediate expensing
    amount must be equal to or less than the least of the following amounts: $1.5 million, if you
    are not associated with any other EPOP in the year; the UCC of the DIEP before any CCA
    deductions in the year; the amount of income, if any, before any CCA deductions, earned from the
    source of income that is a business or property for which the relevant DIEP is used for the tax
    year". The fishing business is associated with one other EPOP (the count of associated, a chosen
    1) and an agreement was filed (a chosen 1); the percentage assigned to it is a chosen 40 and the
    total of column 3 is a chosen 100 (the other EPOP's being 60), not more than 100%, so amount iii
    is 1,500,000 x 40% = 600,000.00 (100 less 100 is 0, not negative, so the footnote "**" does not
    apply), times the 1 agreement filed: 600,000.00. No amount is allocated by the minister (a
    chosen 0, and the amount a chosen 0), so the immediate expensing limit is 600,000.00. The income
    before CCA is a chosen reading of "the amount of income, if any, earned from the source of
    income that is a business (before any CCA deductions)": the form names no line for it (looked in
    Part 4 and endnote 5), and Guide T4002 2025, page 61, "Line 9899 or 9369 - Net income (loss)
    before adjustments", names line 9369 for Form T2121 (confirmed from the PDF). Line 9369, "Net
    income (loss) before adjustments: Amount 4A minus line 9368", is after line 9936 (the recapture
    on line 9600 is in gross income and the terminal loss on line 9270 an expense); adding back line
    9936, the CCA that line 9369 deducted, not below zero: 15,000.00 + 9,150.00 = 24,150.00, which
    is the gross income 49,150 less the other expenses 25,000. The three amounts of endnote 5 are
    600,000.00, the UCC of DIEPs in column 8, 8,000, and the income before CCA, 24,150.00; the
    lesser is 8,000. Line i, the total of column 9 (a chosen 6,000 for Class 7), is 6,000, within
    the lesser, 8,000, and a total above the limit or above the income is refused. Amount iii is a
    dollars-and-cents box, so it rounds half-up to the cent, which changes nothing here.
  - >-
    https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2121/t2121-25e.pdf
  - >-
    CRA, Form T2121 (2025), Charts A to C (docs/cra-forms-2025/t2121-25e.pdf, the PDF text): Chart A
    "Total motor vehicle expenses: Add amounts 3 to 11." (12); "Business use part: amount 1 ÷ amount 2
    × amount 12 = 13" (13); "Business parking fees" (14); "Supplementary business insurance" (15);
    "Allowable motor vehicle expenses: Add amounts 13 to 15 (enter this total on line 9281 of Part 4)"
    (16). Chart B: "Total interest payable (accrual method) or paid (cash method) in the fiscal period" (17);
    "($350*** ÷ 30) × the number of days in the fiscal period for which interest was payable (accrual
    method) or paid (cash method)" (18); "Available interest expense: Amount 17 or 18, whichever is
    less (include this in amount 4 of Chart A above)" (19). Chart C: "Total lease charges incurred in
    your current fiscal period for the vehicle." (20); "Total lease payments deducted before your
    current fiscal period for the vehicle" (21); "Total number of days the vehicle was leased in your
    current and previous fiscal periods" (22); "Manufacturer's list price" (23); "Use a GST rate of 5%
    or HST rate applicable to your province."; "Amount 23 or ($44,706 + GST and PST, or $44,706 + HST),
    whichever is more" and "× 85%" (24); "[($1,100 + GST and PST, or $1,100 + HST) × amount 22] ÷ 30"
    (25); "Amount 25: amount 21" (26); "[($38,000 + GST and PST, or $38,000 + HST) × amount 20] ÷ amount
    24" (27); "Eligible leasing cost: Amount 26 or 27, whichever is less (enter in amount 8 of Chart A
    above)" (28). The charts are the figures of Return BB's leased vehicle with business kilometres 0
    (amount 1), a chosen figure, so amount 13 and line 9281 are 0 and the other lines are the same.
  - >-
    CRA, Form T2121 (2025), Charts A to C: the chosen figures are amount 2 (total kilometres) 10,000;
    amount 3 (fuel and oil) 1,000, amount 5 (insurance) 600, amount 7 (maintenance and repairs) 200
    and amount 10 (other expenses) 653; amounts 6, 9, 11, 14 and 15 are 0; amount 17 (total interest
    payable) 400 and the number of days 183, so line 18 is 350 ÷ 30 × 183 = 2,135.00 and amount 19 is
    the lesser, 400.00; amount 20 (total lease charges) 2,550, amount 21 (payments before the year) 0,
    amount 22 (days leased) 183, amount 23 (manufacturer's list price) 60,000 and the GST or HST rate
    13%: 44,706 + 13% = 50,517.78, 1,100 + 13% = 1,243.00 and 38,000 + 13% = 42,940.00; amount 23 or
    44,706 plus tax, whichever is more, is 60,000.00; amount 24 is 60,000.00 × 85% = 51,000.00; amount
    25 is 1,243.00 × 183 ÷ 30 = 7,582.30; amount 26 is 7,582.30 - 0 = 7,582.30; amount 27 is 42,940.00
    × 2,550 ÷ 51,000.00 = 2,147.00; and amount 28 is the lesser, 2,147.00. Chart A: amount 12 is 1,000
    + 400 + 600 + 200 + 2,147 + 653 = 5,000.00; amount 13 is 0 × 5,000 ÷ 10,000 = 0.00; and line 9281
    (amount 16) is 0.00 + 0 + 0 = 0.00. Every product and quotient here is exact to the cent, so no
    line is rounded; line 9281 is $0, so the fishing expenses do not change.
  - >-
    CRA, "T1-2025 Ontario edition" return (form 5006-R, docs/cra-forms-2025/5006-r-25e.txt,
    confirmed 2026-10-19), "Step 2 - Total income": "Line 26: Fishing income"; "Line 14300: Net";
    "Line 27: Add lines 22 to 26. Net self-employment income =". Line 14300 (line 26) is T2121
    line 9946, $15,000; lines 22 to 25 (business, professional, commission and farming income) are
    $0, a chosen figure, so line 27 is 0 + 0 + 0 + 0 + 15,000 = 15,000. Line 28 is line 21 (the sum
    of lines 1 to 20, every one a chosen $0) plus line 27, and total income (line 15000) is the sum
    of the income lines in line order, line 27 coming after line 20: $15,000.00. Total deductions
    are 0 (no CPP deduction, RRSP, union dues or child care expenses), so net income before
    adjustments (line 23400) is 15,000.00 and taxable income (line 26000) is 15,000.00.
  - >-
    https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-r/5006-r-25e.txt
  - >-
    The figures that depend on income, with the forms quoted in Return BC: T1 (form 5000-R) line
    77 (line 30000) is $16,129 for net income of $177,882 or less, so the federal credit amounts
    (line 33500) are 16,129.00 and line 33800 is 16,129.00 x 14.5% = 2,338.705, rounded half-up
    to the cent: 2,338.71 (line 35000, no Schedule 9 amounts). Part A "Federal tax on taxable
    income": taxable income of 15,000.00 is in column 1 "Line 26000 is $57,375 or less": line 74
    is 15,000.00 x 14.5% = 2,175.00. The non-refundable credits (2,338.71) are more than that
    tax, so the federal tax after credits is 0. The medical share, 3% of net income, is 450.00
    and the threshold, the lesser of that and $2,834, is 450.00, above the medical expenses of
    0. ON428 Part A: 15,000.00 x 5.05% = 757.50; the Ontario credit amounts are the basic
    personal amount 12,747.00, and 12,747.00 x 5.05% = 643.7235, rounded half-up to the cent:
    643.72, so the Ontario tax after credits is 757.50 - 643.72 = 113.78. The basic reduction is
    294.00, twice it, 588.00, less the tax of 113.78 is 474.22, which is more than the tax, so
    the tax after the reduction is 0. Schedule ON428-A: the LIFT credit is 5.05% of employment
    income, 0, less 5% of the net income over $32,500, 15,000.00 is not over it, so 0. The
    Ontario health premium chart, taxable income 15,000.00, is in "Row 1: Taxable Income of
    $20,000 or less": "Ontario health premium: $0", so the Ontario tax (line 42800) is 0.
    Schedule 6: the working income is the employment income of 0, so the Canada workers benefit
    is 0. T1 line 148 (line 43500) is the net federal tax 0 plus the Ontario tax 0 = 0.00, with
    no CPP or EI payable, no tax deducted and no credits, so line 167, the refund or balance
    owing, is 0.00, neither a refund nor a balance owing. These lines add and subtract amounts
    already in cents. The other credits and lines (the age, spouse, dependant and caregiver
    amounts, the Ontario credits and the refundable credits) are 0 for the same chosen counts
    and amounts as Return BC.
