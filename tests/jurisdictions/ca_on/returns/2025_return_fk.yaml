# Return FK: the clergy residence deduction with an employer-provided residence and other
# accommodation claims (Form T1223 Part C), the EI premiums on self-employment and other eligible
# earnings with earnings from a controlled corporation and tax-exempt self-employment income
# (Schedule 13), the federal refundable First Nations abatement in the limit of the foreign tax
# credit (Form T2209), and the Schedule 2 amounts transferred from a spouse whose taxable income is
# above 57,375 (line 7 from their line 76). No CRA example exists for these lines, so every figure
# is a chosen figure, worked out by hand from the form text.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A 2025 Ontario resident (chosen: the form names no province of residence), resident in Canada
  throughout 2025, aged 18 or older at the end of 2025. The filer is a member of the clergy with
  church employment income of 45,000.00 (chosen), a corporation they control (more than 40% of its
  voting shares) that pays them T4 earnings of 4,000.00 (chosen), so the T4 slips show 49,000.00 in
  box 14 (line 10100), the church's residence benefit of 6,000.00 (T4 box 30, reported on line
  10400, chosen) and a net partnership income of 10,000.00 (line 12200, a limited partner, chosen).
  The T4 box 24 EI insurable earnings are 45,000.00 (the corporation's earnings are EI-exempt, box
  28). Total income is 49,000 + 6,000 + 10,000 = 65,000.00. The CPP base contributions on the T4
  earnings are 4.95% x (49,000 - 3,500) = 2,252.25 and the first additional 1% x 45,500 = 455.00
  (the T4 total 2,707.25); the EI premiums on the church earnings are 1.64% x 45,000 = 738.00.
  The Schedule 8 Part 4 contributions on the partnership income are not completed (lines 22200 and
  31000 are not claimed), a chosen simplification.
  Form T1223 Part C. The residence was provided by the employer (A) for part of the year (the
  6,000.00 benefit, within the 6,000 of line 10400) and rented by the filer (B) for 8 months. Line
  1, income from qualifying employment, is the church earnings and benefit, 45,000 + 6,000 =
  51,000.00 (chosen). Line 2 is 51,000 x 1/3 = 17,000.00. Line 3 is 8 months and line 4 is 8 x
  1,000 = 8,000.00 (at most 10,000). Line 5 is the more of line 2 and line 4: 17,000.00. Line 6,
  the rent and eligible utilities, is 14,000 (chosen) and line 7, the amounts claimed by any person
  for the accommodation, is 2,000 (chosen), so line 8 is 14,000 - 2,000 = 12,000.00. Line 9 is the
  lesser of line 5 and line 8: 12,000.00, and line 10 the lesser of line 1 (51,000) and line 9:
  12,000.00. Part C (C), (A) and (B) added: 6,000 + 12,000 = 18,000.00, which is not more than
  line 1, so line 23100 is 18,000.00.
  Total deductions from total income (line 23300) are 18,000.00 + 455.00 (the enhanced CPP
  contributions) = 18,455.00, so net income and taxable income are 65,000 - 18,455 = 46,545.00.
  Schedule 13. Line 1, read as line 12200 plus line 27 (the text file prints "line 1 1 plus line
  27"), less the net income of T4 slips that carry EI premiums (none),, is 10,000.00. Line 2 and line
  54493, the box 14 earnings from the corporation the filer controls, is 4,000 and line 3 and
  line 54494, the tax-exempt self-employment income earned on a reserve by a person registered
  under the Indian Act, is 2,000 (both chosen), so line 4 is 10,000 + 4,000 + 2,000 = 16,000.00.
  Line 5 is 65,700.00, line 6 and line 54780 is 45,000 (box 24), line 7 is 65,700 - 45,000 =
  20,700.00 and line 8 is the lesser of line 4 (16,000.00) and line 7 (20,700.00): 16,000.00. The
  filer has an agreement to pay EI premiums on self-employment and other eligible earnings (chosen,
  as Return AX), so line 9 is 16,000 x 1.64% = 262.40 (at most 1,077.48).
  Federal tax on 46,545.00 (T1 lines 70 to 76, column 1) is 46,545 x 14.5% = 6,749.025, rounded
  half-up to the cent: 6,749.03. The federal credit amounts are 16,129.00 (basic personal amount) +
  2,252.25 (CPP base) + 738.00 (EI) + 262.40 (EI on self-employment, line 31217) + 1,471.00
  (Canada employment amount) = 20,852.65 and line 33800 is 14.5% of it = 3,023.63425, rounded
  half-up to the cent: 3,023.63. The federal tax after credits is 6,749.03 - 3,023.63 = 3,725.40.
  Schedule 2. The spouse's line 30100 is 2,356.30 (the age amount of 9,028 less 15% x (90,000 -
  45,522) = 6,671.70), line 31400 is 2,000 and the other lines are 0 (all chosen figures from
  another person's return), so line 6 is 2,356.30 + 2,000 = 4,356.30. Their taxable income (their
  line 26000) of 90,000 is above 57,375, so line 7 is their line 76, 12,300 (chosen), divided by
  14.5% = 84,827.586..., rounded half-up to the cent: 84,827.59. Line 8 (their line 30000) is
  16,129, lines 9 and 10 are 0, so line 11 is 16,129.00 and line 12 is 84,827.59 - 16,129.00 =
  68,698.59; line 13 is 4,356.30 - 68,698.59, not below zero: 0.00, so line 32600 is 0 and the
  filer was not separated for 90 days or more (the count is 1).
  Foreign tax credit (Form T2209). The filer has 3,000.00 of net foreign non-business income, part
  of the partnership's 10,000 (chosen), on which 600.00 of foreign tax was paid (chosen). The
  federal refundable First Nations abatement (line 44100) is 500.00 (chosen). Basic federal tax
  (T2209 note (4)) is line 42900, 3,725.40, less the abatement: 3,725.40 - 500.00 = 3,225.40. Line
  2 is 3,000 x 3,225.40 / 46,545.00 = 207.8890..., rounded half-up to the cent: 207.89, and line 3
  is the lesser of line 1 (600) and line 2: 207.89, so the federal foreign tax credit is 207.89 and
  the federal tax less it is 3,725.40 - 207.89 = 3,517.51.
  Form T691 Part 4 reads the same record, with no T691 figure entered: line 2 is 3,000.00 (the net
  foreign non-business income), line 7 is 600 x 66.6666% = 399.9996, rounded to 400.00, and line 8 is
  0. Line 4 is 3,000.00 (no business income, no capital gains claim) and line 6 is 3,000 x 20.5% =
  615.00, so line 10 is the lesser of 615.00 and line 9 (400.00), 400.00, and line 11 is the greater
  of the federal foreign tax credit, 207.89, and line 10: 400.00. Part 7 line 11 is 400.00 - 207.89
  = 192.11, and line 12 is 192.11 x 400.00 / 600.00 = 128.0733, rounded to 128.07, so line 13 is
  3,725.40 + 128.07 = 3,853.47. The minimum tax is not payable (Part 5 line 11 is 0), so the
  special credit does not reduce the tax.
  Ontario. The tax on 46,545.00 is 46,545 x 5.05% = 2,350.5225, rounded half-up to the cent:
  2,350.52. The Ontario credit amounts are 12,747 + 2,252.25 + 738.00 + 262.40 = 15,999.65, times
  5.05% = 807.982325, rounded half-up to the cent: 807.98, leaving 2,350.52 - 807.98 = 1,542.54.
  The Ontario foreign tax credit is 1,542.54 x 3,000 / 46,545.00 = 99.4233..., rounded half-up to
  the cent: 99.42 (less than the 600 - 207.89 = 392.11 of foreign tax not yet credited), which
  leaves 1,443.12. The LIFT credit is 875 less 5% x (46,545 - 32,500) = 702.25, that is 172.75,
  which leaves 1,270.37; the health premium on a taxable income of 46,545.00 (more than 38,500
  but not more than 48,000) is 450, so the Ontario tax is 1,270.37 + 450 = 1,720.37.
  The total payable is 3,517.51 + 1,720.37 + 262.40 (EI premiums payable on self-employment, line
  42120) = 5,500.28. The income tax deducted is a chosen 6,000.00, so the refund (line 48400) is
  6,000.00 - 5,500.28 = 499.72.
  The spouse of Schedule 2 is a separate chosen scenario: the filer is treated as having no spouse at
  the end of the year for the LIFT credit (Schedule ON428-A Part A, single), the spouse's figures
  serving only Schedule 2, a chosen simplification as in Return AT.
  Every line below the "Engine only" comment, other than unchanged carries of the figures above, is the
  engine's and not a hand figure; the groups are: the Ontario CARE
  credit rate, the Canada workers benefit lines, the Schedule 8 Part 4 and Part 5 lines for the
  partnership income, the alternative minimum tax lines, the T778 earned income lines (no child
  care) and the lines that carry a dataset's printed figure unchanged.
sources:
  - >-
    CRA, Form T1223 2025, Part C (confirmed from the PDF; no .txt published): "(A) ... If the
    residence you occupied was provided by your employer (you did not rent or own the residence),
    the value of this benefit ... is shown as a taxable benefit in box 30 of your T4 slip. Claim
    this amount as a deduction on line 23100 of your return and do not complete (B) below."; "(B)
    If you owned or rented the residence that you occupied, complete the following:"; "Income from
    qualifying employment from all eligible employers"; "Amount from line 1 multiplied by 1/3";
    "Number of months in qualifying employment"; "Line 3 multiplied by $1,000 (maximum $10,000)";
    "Enter whichever is more: line 2 or line 4."; "All amounts claimed by you, or any person, for
    the accommodation"; "Line 6 minus line 7"; "Enter whichever is less: Line 5 or line 8.";
    "Enter whichever is less: Line 1 or line 9. Enter this amount on line 23100 of your return.";
    "(C) If the residence that you occupied was provided by your employer (A) for part of the year
    and was owned or rented by you (B) for a different part of the year, add amounts (A) and (B)
    and claim the total amount on line 23100 of your return. The amount claimed for the clergy
    residence deduction cannot be more than the income from qualifying employment on line 1."
    (docs/cra-forms-2025/t1223-25e.pdf)
  - >-
    CRA, Schedule 13 2025: "Line 2 and line 54493: If you are not eligible to participate in the EI
    program as an employee of a corporation because you control more than 40% of the voting shares
    of that corporation, enter the amount from box 14 of all your T4 slips from that corporation.";
    "Line 3 and line 54494: If you are registered or entitled to be registered under the Indian Act
    and you earned tax-exempt self-employment income on a reserve in Canada, enter your total
    tax-exempt self-employment income."; "Line 4: Add lines 1 to 3. Net self-employment income =";
    "Line 5: Maximum insurable earnings 65,700.00"; "Line 6 and line 54780: Total EI insurable
    earnings (amount from box 24 of all your T4 slips; ...)"; "Line 7: Line 5 minus line 6 (if
    negative, enter "0") ="; "Line 8: Enter whichever is less: amount from line 4 or line 7.";
    "Line 9: Amount from line 8 multiplied by 1.64% (maximum $1,077.48) =" (docs/cra-forms-2025/
    5000-s13-25e.txt)
  - >-
    CRA, Form T2209 2025, note (4) "Basic federal tax": "Line 42900 of your return plus any:"
    "federal dividend tax credit (line 40425 of your return)" ... "minus any:" "federal refundable
    First Nations abatement (line 44100 of your return)" (docs/cra-forms-2025/t2209-25e.pdf, text
    layer read with pdftotext). Line 44100 itself is not modelled in the engine; here the abatement only lowers the basic
    federal tax in the credit's limit.
  - >-
    CRA, Schedule 2 (5000-S2, 2025): "Line 1 and line 35200: Enter the amount from line 30100 of
    their return."; "Line 3 and line 35500: Enter the amount from line 31400 of their return.
    (maximum $2,000)"; "Line 6: Add lines 1 to 5. ="; "Line 7: Enter the amount from line 26000
    of their return on line 7 if it is $57,375 or less. If it is more than $57,375, enter the
    result of the following calculation: amount from line 76 of their return divided by 14.5% =";
    "Line 8: Amount from line 30000 of their return"; "Line 11: Add lines 8 to 10. ="; "Line 12 and
    line 36100: Line 7 minus line 11 (if negative, enter "0") ="; "Line 13: Line 6 minus line 12
    (if negative, enter "0") Enter this amount on line 32600 of your return." (docs/cra-forms-2025/
    5000-s2-25e.txt)
  - >-
    CRA, T1 General 2025 (5006-R) lines 70 to 76 (federal tax on taxable income, column 1: "Line
    73: Rate 14.5%"), lines 101 to 118, and Form ON428 2025 (5006-C), the Ontario tax columns,
    credits, LIFT credit (Schedule ON428-A) and the health premium chart (row 5: more than 38,500
    but not more than 48,000, $450) (docs/cra-forms-2025/5006-r-25e.txt, 5006-c-25e.txt,
    5006-a-25e.txt)
  - >-
    CRA, Form T2036 2025 (confirmed from the PDF; no .txt published): "Enter the amount from line 1
    of Form T2209."; "Enter the amount from line 3 of Form T2209, unless you have to pay minimum
    tax."; "Line 1 minus line 2"; net foreign non-business income over net income times the
    provincial or territorial tax otherwise payable (line 4); "Enter whichever amount is less: line
    3 or line 4." (docs/cra-forms-2025/t2036-25e.pdf)
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s13/5000-s13-25e.txt
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s2/5000-s2-25e.txt
