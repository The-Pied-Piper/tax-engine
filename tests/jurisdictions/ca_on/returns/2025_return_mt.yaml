# Return MT: Form T1212 "Statement of Deferred Security Options Benefits" as its own form: line 1 (opening
# balance) is 12,000.00 and line 2 (benefits that can no longer be deferred) is 2,000.00, which is part of the
# employment income of line 10100. Line 3 is 10,000.00 and the security options deduction of line 24900 is
# 50% of line 2, 1,000.00. The same return with no T1212 amounts has no deduction (pinned in
# `end_to_end/test_return_mt.py`).
jurisdiction: CA-ON
tax_year: 2025
description: >-
  Return MT: a single 2025 Ontario resident in Canada throughout 2025, aged 19 or older at the end
  of 2025, with no spouse and no dependants (chosen figures, as in Return GG). Employment income
  (T1 line 10100, T4 box 14, taxable) is 3,000.00 and includes the 2,000.00 of deferred security
  options benefits that can no longer be deferred (Form T1212 line 2, "Enter this amount on line 10100
  of your return"); there is no other income, no CPP or EI deducted above the exemption (pensionable
  earnings of 3,000.00 are under the basic exemption; the EI premium is 1.64% x 3,000.00 = 49.20).
  Form T1212: line 1 (opening balance, from the previous year's notice of assessment) is 12,000.00;
  line 2 is 2,000.00; line 3 (line 1 minus line 2) is 10,000.00, the closing balance. Footnote (1):
  "To claim your security options deduction on this amount, enter 50% of the amount from line 2 on
  line 24900 of your return": 50% x 2,000.00 = 1,000.00, so T1 line 24900 is 1,000.00. Net income
  (line 23600) is 3,000.00, and the deduction of line 24900 lowers taxable income to
  3,000.00 - 1,000.00 = 2,000.00. The other lines of the return are blank.
sources:
  - >-
    CRA, Form T1212 (2025), "Opening balance of deferred security options benefits" (line 1);
    "Benefits that can no longer be deferred. Enter this amount on line 10100 of your return"
    (line 2); "Closing balance of deferred security options benefits: line 1 minus line 2" (line 3);
    "(1) To claim your security options deduction on this amount, enter 50% of the amount from line 2
    on line 24900 of your return" (docs/cra-forms-2025/t1212-25e.pdf)
inputs:
  ca/aged_18_or_older_at_end_of_2025: "1"
  ca/aged_19_or_older_at_end_of_2025: "1"
  ca/resident_in_canada_throughout_2025: "1"
  ca/cpp_months: "12"
  ca/qpp_months: "12"
  ca/employment_income: "3000"
  ca/t4_cpp_slip_count: "1"
  ca/t4_cpp_pensionable_earnings_outside_quebec: "3000"
  ca/cpp_t4_base_and_first_additional_contributions: "0"
  ca/cpp_t4_second_additional_contributions: "0"
  # T4 box 18 and the required premium, Form T2204 line 16 (1.64% of 3,000.00).
  ca/t2204_insurable_earnings: "3000"
  ca/t2204_premiums_deducted: "49.20"
  # Form T1212 (2025), the amounts the filer enters on line 1 and line 2.
  ca/t1212_line_1_opening_balance: "12000"
  ca/t1212_line_2_benefits_no_longer_deferred: "2000"
expected:
  ca-on/return:
    - ca/total_income: "3000.00"
      ca/security_options_deductions: "1000.00"
      ca/net_income: "3000.00"
      ca/taxable_income: "2000.00"
      ca/tosi_adjusted_net_income: "3000.00"
      ca/net_income_before_adjustments: "3000.00"
      ca/other_payments_limit_income: "3000.00"
      ca/cpp_second_additional_earnings_maximum: "9900.00"
      ca/t4_cpp_pensionable_earnings_slip_checked: "3000"
  ca/t1212:
    - ca/t1212_line_3_closing_balance: "10000.00"
      ca/t1212_line_24900_amount: "1000.00"
