  ca/t4_cpp_pensionable_earnings_outside_quebec: "4000"
  ca/t2204_insurable_earnings: "4000"
  ca/t2204_premiums_deducted: "65.60"
  ca/cpp_months: "12"
  ca/qpp_months: "12"
  ca/schedule_8_instances:
    - {}
  ca/cpp_t4_base_and_first_additional_contributions: "29.75"
  ca/cpp_t4_second_additional_contributions: "0.00"
  ca/resident_in_canada_throughout_2025: "1"
  ca/aged_18_or_older_at_end_of_2025: "1"
  ca/t777_office_supplies: "75"
  ca/t777_other_expenses: "180"
  ca/t777_work_space_electricity_heat_water_internet: "3700"
  ca/t777_work_space_maintenance: "60"
  ca/t777_work_space_other_expenses: "7500"
  ca/t777_work_space_employment_use_amount: "2300"
expected:
