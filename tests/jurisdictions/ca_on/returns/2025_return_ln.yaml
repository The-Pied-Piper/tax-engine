    - ca/t777_line_15: "255.00"
      ca/t777_work_space_total_amount: "2300"
      ca/t777_work_space_employment_income: "4000"
      ca/t777_work_space_employment_offsets: "255.00"
      ca/t777_work_space_income_limit: "3745.00"
      ca/t777_work_space_expenses: "11260"
      ca/t777_work_space_carried_forward_out: "0"
      ca/t777_line_16: "2300"
      ca/t777_line_17: "2555.00"
  ca-on/return:
