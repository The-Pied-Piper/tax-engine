    the number of days 153, within the 153 days of the fiscal period,
    so line 18 is 350 ÷ 30 × 153 = 1,785.00 and amount 19, the
    lesser of 400 and 1,785.00, is 400. Chart C: amount 20 (total lease charges) is a chosen 2,550,
    amount 21 (payments before the year) a chosen 0, amount 22 (days leased) a chosen 183, amount 23
    (manufacturer's list price) a chosen 60,000 and the GST or HST rate a chosen 13%: 44,706 + 13% =
    50,517.78, 1,100 + 13% = 1,243.00 and 38,000 + 13% = 42,940.00; amount 23 or 44,706 plus tax,
