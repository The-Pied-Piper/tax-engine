# Return CV: Return BT's single sole proprietor, a 2025 Ontario resident whose only activity is
# a business, one Form T2125 (Statement of Business or Professional Activities), with a fiscal
# period shorter than 365 days (153 days, August 1 to December 31, 2025) and a designated immediate
# expensing property (DIEP) expensed at exactly the immediate expensing limit, which Income Tax
# Regulations 1104(3.5)(b) prorate for a year of less than 51 weeks (Guide T4002 says shorter than 365
# days). The business is not associated with any other EPOP, so the
# limit before proration is the printed $1.5 million; for 153 days it is $1,500,000 x 153 / 365 =
# $229,500,000 / 365 = $628,767.1232..., rounded half-up to the cent, $628,767.12. Area A has one
# class, Class 8, with no UCC at the start and additions (column 3) of $700,000, all DIEPs (column
# 4 $700,000), so column 7 is $700,000 and column 8 is $700,000; the immediate expensing amount
# (column 9) is a chosen $628,767.12, the whole limit, so column 10 is $71,232.88, column 13 is
# $71,232.88, column 18 is one half of $71,232.88 = $35,616.44 and column 19 is $35,616.44. The
# claim (column 21) is a chosen $628,767.12, which is column 9 and none of the allowance on the
# rest, so column 22 is $700,000 - $628,767.12 = $71,232.88. Line i, the total immediate expensing
# claim, is $628,767.12, at most the least of endnote 5's three amounts: the prorated limit
# ($628,767.12), the UCC of DIEPs ($700,000, the total of column 8) and the income from the
# business before CCA ($660,767.12, line 9369 plus line 9936). Line ii, and so line 9936, is
# $628,767.12. The gross sales are a chosen $676,767.12, so that line 9946 stays Return BB's
# $30,000.00: expenses of $16,000 on seven lines (the motor vehicle line, $2,500, from Charts A to
# C), so line 9368 is $16,000 + $628,767.12 = $644,767.12 and line 9369 is $676,767.12 -
# $644,767.12 = $32,000.00; business-use-of-home expenses of $2,000 (line 9945) give line 9946, and
# so T1 line 13500, of $32,000.00 - $2,000 = $30,000.00, which is the whole of total income
# (line 15000). Every figure that depends on income is Return BB's. Amounts are quoted decimal
# strings, never floats; counts are quoted digit strings. Every output the CA-ON manifest declares
# must appear under `expected`, or be left out to be 0 (or no records).
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025 whose only activity is a business, reported on
  one Form T2125 for a fiscal period of 153 days (August 1 to December 31, 2025): gross sales of
  $676,767.12 (amount 3A, a chosen figure, so that line 9946 is Return BB's $30,000.00),
  expenses of $16,000 on seven lines and capital cost allowance of $628,767.12 on Class 8 (Area
  A, line 9936), so line 8299 and T1 line 13499 are $676,767.12, line 9369 is $32,000.00,
  and, after $2,000 of business-use-of-home expenses, line 9946 and T1 line 13500 are
  $30,000.00. A chosen set of figures. The motor vehicle expenses (line 9281, $2,500) are Charts
  A to C for one leased passenger vehicle used half for business (see the sources). Area A has
  one class, Class 8 (UCC at the start $0, additions $700,000, all DIEPs, an immediate expensing
  amount of $628,767.12), whose column 21 is the chosen claim $628,767.12, the least it can be
  as it includes column 9: line i is $628,767.12, line ii and line 9936 are $628,767.12, and
  the UCC at the end of the year is $71,232.88. Area G is not answered: the business is not
  associated with any other EPOP (the count of associated is 0), so the immediate expensing
  limit before proration is the printed $1,500,000. The fiscal period is 153 days, less than 357
  (51 weeks of 7 days), so the limit is prorated (Income Tax Regulations 1104(3.5)(b)):
  $1,500,000 x 153 / 365 = $229,500,000 / 365 = $628,767.1232..., rounded half-up to the cent,
  $628,767.12, and no amount is allocated by the minister. The income before CCA (endnote 5) is $660,767.12, line 9369 plus line 9936, a
  chosen reading (see the sources). The net self-employment income (T1 line 27, "Add lines 22
  to 26") is 30,000 + 0 + 0 + 0 + 0 = $30,000; line 28 is line 21 (0) plus line 27 and total
  income (line 15000) adds line 27 to the other income lines, which are all 0, so total income
  is $30,000.00. The CPP months (Schedule 8 box A) are the 12 of a full year, Schedule 8 Part 4
  is not completed (count 0) and there is no agreement with the Canada Employment Insurance
  Commission (count 0), so the CPP contributions payable (line 42100), the base CPP
  contributions (line 31000) and the deduction (line 22200) on self-employment income, and the
  EI premiums on it (lines 31217 and 42120), are $0 and change no total.
sources:
  - >-
    Income Tax Regulations, C.R.C., c. 945, subsection 1104(3.5), paragraph (b),
    https://laws-lois.justice.gc.ca/eng/regulations/C.R.C.,_c._945/section-1104.html: "where an
    eligible person or partnership has a taxation year that is less than 51 weeks, its immediate
    expensing limit for the year is that proportion of its immediate expensing limit for the year
    determined without reference to this paragraph that the number of days in the year is of 365".
