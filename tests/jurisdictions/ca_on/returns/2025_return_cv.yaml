    676,767.12 - 0 = 676,767.12, 3F is 0 - 0 = 0, 3G, and so line 8000, is 676,767.12 + 0 =
    676,767.12. With no recapture line 8230 is 0 + 0 = 0, amount 3O is 0 + 0 = 0 and line 8299, and
    so T1 line 13499, is 676,767.12 + 0 = 676,767.12. Amount 3P is 676,767.12; amount 3V is 0 + 0 +
    0 + 0 + 0 = 0, line 8518 is 0 - 0 = 0 and line 8519, and so amount 4A, is 676,767.12 - 0 =
    676,767.12. The seven expense lines are chosen figures: advertising (line 8521) 1,500, insurance
    (line 8690) 1,200, office expenses (line 8810) 800, professional fees (line 8860) 2,500, rent
