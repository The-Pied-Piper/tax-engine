    32,000.00. There is no partnership (a count of 0): amount 5A is line 9369, 32,000.00, amounts 5B
    and 9974 are 0 and amount 5C is 32,000.00 + 0 + 0 = 32,000.00; amounts 6A to 6E are 0, so amount
