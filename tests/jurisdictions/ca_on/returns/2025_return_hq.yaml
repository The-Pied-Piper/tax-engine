# Return HQ: a single Ontario resident whose only income is the net business income of one sole
# proprietorship, reported on one Form T2125 (Statement of Business or Professional Activities) for
# a full fiscal period (0 days entered). Gross sales are a chosen $40,000 and rent (line 8910) is
# $12,000, so total expenses (line 9368) are $12,000 and the net business income (line 9946, T1
# line 13500) is $28,000. No capital cost allowance is claimed and no land is entered.
#
# The statement also enters the three amounts of Part 9 "Details of equity": line 9931 "Total
# business liabilities" of $18,400.50, line 9932 "Drawings in the current year" of $24,000 and line
# 9933 "Capital contributions in the current year" of $5,000. Nothing earlier on the form computes
# them, so each is an input taken as entered (`ca/business_liabilities`, `ca/business_drawings` and
# `ca/business_capital_contributions`), carried to the form's printed line and read by nothing on
# the return: they change no income line. The amounts are chosen for this return, not taken from a
# guide example.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025 whose only income is the net business income of one
  sole proprietorship, reported on one Form T2125 (Statement of Business or Professional
  Activities) for a full fiscal period (0 days entered): gross sales of $40,000 (line 8299), rent
  of $12,000 (line 8910), so total expenses (line 9368) are $12,000 and the net business income
  (line 9946, T1 line 13500) is $28,000. No capital cost allowance is claimed. Part 9 "Details of
  equity" enters line 9931 "Total business liabilities" as $18,400.50, line 9932 "Drawings in the
  current year" as $24,000 and line 9933 "Capital contributions in the current year" as $5,000,
  each an input taken as entered and carried unread (`ca/business_liabilities`,
  `ca/business_drawings` and `ca/business_capital_contributions`), so the three amounts change no
  income line and the net business income is $28,000 with or without them.
sources:
  - >-
    CRA, Form T2125 (2025), Statement of Business or Professional Activities
    (docs/cra-forms-2025/t2125-25e.pdf, confirmed from the PDF with pdftotext -layout, around
    lines 283 to 287 of its text): "Part 9 – Details of equity"; "Total business liabilities";
    "Drawings in the current year"; "Capital contributions in the current year". The amounts of
    the return are chosen for the test and are not quoted from the form.
