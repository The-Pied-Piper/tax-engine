# Return CP: Return BS's single filer, a 2025 Ontario resident whose only income is rental income
# from two units of one property (T1 line 13, Form T776 Parts 3 and 4), with the capital cost
# allowance of Area A on three Class 1 buildings bought in the year, to show the CCA rate chosen
# by election (Guide T4036 2025, "Class 1 (4%)"). The rental income is chosen figures: gross rents
# for all units $24,000 (line 8141) and expenses of $4,100, so the net income before the capital
# cost allowance (amount 5) is $19,900. All three rows have no UCC at the start (column 2),
# additions (column 3) and no dispositions, DIEP, AIIP or RIIP, so for each column 7 is its
# additions, column 18 is one half of them and column 19 is the other half. Row 1, a new
# purpose-built residential rental (election 1, a rate of 10%): additions $200,000.00, column 18
# $100,000.00, column 19 $100,000.00, maximum $100,000.00 x 10% = $10,000.00, claimed. Row 2, a
# non-residential building put in a separate class (election 2, a rate of 6%): additions
# $50,000.00, column 18 $25,000.00, column 19 $25,000.00, maximum $25,000.00 x 6% = $1,500.00,
# claimed. Row 3, a building with no election (the class's 4%): additions $20,000.00, column 18
# $10,000.00, column 19 $10,000.00, maximum $10,000.00 x 4% = $400.00, claimed. Line ii, and so
# line 9936, is $10,000.00 + $1,500.00 + $400.00 = $11,900.00, within amount 5, so amount 6 and
# line 9946, and so T1 line 12600, are $19,900 - $11,900.00 = $8,000.00, which is the whole of
# total income (line 15000). Every figure that depends on income is Return BS's, whose net rental
# income is also $8,000.00. The closing UCCs (column 24) are $190,000.00, $48,500.00 and
# $19,600.00. T4036 calls the 10% rate a proposal ("Under proposed changes"); it is adopted as the
# guide states it. Amounts are quoted decimal strings, never floats; counts are quoted digit
# strings. Every output the CA-ON manifest declares must appear under `expected`, or be left out
# to be 0 (or no records).
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025 whose only income is rental income: two units of
  one property with gross rents of $24,000 (T776 line 8141) and expenses of $4,100, so line
  12599 is $24,000.00 and line 12600 is $8,000.00. A chosen set of figures. There are no
  short-term rentals, so Chart B has no rows and column 22 is $0. Area A has three rows of
  class 1 (4%), each with additions in the year and no UCC at the start: a new purpose-built
  residential rental of $200,000.00 (election 1, 10%), a non-residential building put in a
  separate class of $50,000.00 (election 2, 6%) and a building of $20,000.00 with no election
  (4%). The maximums are $100,000.00 x 10% = $10,000.00, $25,000.00 x 6% = $1,500.00 and
  $10,000.00 x 4% = $400.00, claimed in full: line ii and line 9936 are $11,900.00. The UCCs
  at the end of the year are $190,000.00, $48,500.00 and $19,600.00. The filer is not
  associated with any other EPOP and claims no immediate expensing. No self-employment income:
  the net business, professional, commission, farming and fishing income (T1 lines 13500,
  13700, 13900, 14100 and 14300) are $0, so their sum (line 27) is $0, and it is a $0 term of
  total income (line 15000). The CPP months (Schedule 8 box A) are the 12 of a full year,
  Schedule 8 Part 4 is not completed (count 0) and there is no agreement with the Canada
  Employment Insurance Commission (count 0), so the CPP contributions payable (line 42100),
  the base CPP contributions (line 31000) and the deduction (line 22200) on self-employment
  income, and the EI premiums on it (lines 31217 and 42120), are $0 and change no total.
sources:
