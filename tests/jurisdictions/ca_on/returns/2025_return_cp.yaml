    year (column 19 multiplied by column 20, or a lower amount, plus column 9)"; "Column 22:
    Non-compliant amount of CCA (see Chart B below)"; "Column 23: CCA claim for the year
    (column 21minus column 22)"; "Column 24: UCC at the end of the year (column 7 minus
    column 23) (Note 9)"; "Line ii: Total CCA claim for the year *: Total of column 23";
    "Line 9936: Total CCA claim for the year (amount ii from Area A minus any personal part
    Class 1, three rows (chosen figures; "Class 1 (4%)" in Guide T4036,
    docs/cra-forms-2025/t4036-25e.pdf, a PDF quote accepted 2026-10-19): "Under proposed
    changes, new buildings or parts of a building that are built for use as a purpose-built
    residential rental (see definition on page 8) may now be eligible for an accelerated CCA
    rate of 10%."; "The CCA rate for eligible non-residential buildings acquired by a
    taxpayer after March 18, 2007, and used in Canada to manufacture or process goods for
    sale or lease includes an additional allowance of 6% for a total rate of 10%. The CCA
    rate for other eligible non-residential buildings includes an additional allowance of 2%
    for a total rate of 6%."; "To be eligible for one of the additional allowances, you must
    elect to put a building in a separate class. [...] If you do not file an election to put
    it in a separate class, the 4% rate will apply."; "Property eligible for this measure
    continues to benefit from the accelerated investment incentive (AII) if acquired before
    2025, or benefits from the reaccelerated investment incentive (RII) if acquired after
    2024." The guide calls the 10% rate a proposal; it is adopted as the guide states it
    (check whether it has been enacted). Whether a building qualifies, and which election is
    made, is the caller's input per row (ca/cca_rate_election: 0 none, 1 a purpose-built
    residential rental at 10%, 2 a separate class at 6%, 3 a separate class at 10%); the
    rates come from the class-rates dataset. Each row has column 2 a chosen 0, column 5 a
    chosen 0, no DIEPs, AIIPs or RIIPs (a chosen 0 each), column 9 a chosen 0, column 14 0 -
    column 10 + 0 + 0, negative, so 0, columns 15, 16 and 17 0, column 22 0 (Chart B has no
    rows). Row 1: column 3 a chosen 200,000.00, so column 7 is 0 + 200,000.00 - 0 =
    200,000.00, column 10 and column 13 are 200,000.00 and 200,000.00, column 18 is one half
    x (200,000.00 - 0 - 0 - 0) = 100,000.00, column 19 is 200,000.00 + 0 + 0 - 100,000.00 =
    100,000.00, column 21 is 100,000.00 x 10% = 10,000.00 (election 1), plus column 9, 0,
    and column 23, a chosen figure, is the most, 10,000.00; column 24 is 200,000.00 -
    10,000.00 = 190,000.00. Row 2: column 3 a chosen 50,000.00, so column 7 is 50,000.00,
    column 18 is one half x 50,000.00 = 25,000.00, column 19 is 50,000.00 - 25,000.00 =
    25,000.00, column 21 is 25,000.00 x 6% = 1,500.00 (election 2), column 23 a chosen
    1,500.00 and column 24 is 50,000.00 - 1,500.00 = 48,500.00. Row 3: column 3 a chosen
    20,000.00, so column 7 is 20,000.00, column 18 is 10,000.00, column 19 is 10,000.00,
    column 21 is 10,000.00 x 4% = 400.00 (no election: the class's 4%), column 23 a chosen
    400.00 and column 24 is 20,000.00 - 400.00 = 19,600.00. Line ii, the total of column 23,
    is 10,000.00 + 1,500.00 + 400.00 = 11,900.00; the personal part of CCA and the CCA for
    business-use-of-home expenses (line 9936) are a chosen 0 each, so line 9936 is 11,900.00
    - 0 - 0 = 11,900.00, at most amount 5, 19,900. The remaining personal part (Note 9) is a
    chosen 0 for each row. Columns 15, 17 and 18 and the maximum are dollars-and-cents
    boxes, rounded half-up to the cent.
