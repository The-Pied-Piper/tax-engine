    rental income: Enter this amount on your income tax and benefit return on line 12599
    (line 8141 plus line 8230)". Part 4: "Line A: Total expenses (add amounts listed under
    "Total expenses")"; "Line 9949: Total for personal portion (add amounts listed under
    "Personal portion of total expenses")"; "Line 9365: Total for short-term rental portion
    (add amounts listed under "Short-term rental portion of total expenses")"; "Line 9366:
    Non-compliant amount for short-term rentals (amount B from Chart A)"; "Line 1:
    Deductible expenses (amount A minus line 9949 minus line 9366)"; "Line 9369: Net income
    (loss) before adjustments (total gross rental income from line 8299 minus deductible
    expenses from amount 1)"; "Line 2: Co-owners: calculate your share of net income from
    line 9369. Enter your result on amount 2"; "Line 9945: Other expenses of the co-owner:
    other deductible expenses you have as a co-owner which you did not deduct elsewhere";
    "Line 3: Subtotal (amount 2 minus line 9945)"; "Line 9947: Recaptured capital cost
    allowance (co-owners: enter your share of the amount)"; "Line 4: Subtotal (amount 3 plus
    line 9947)"; "Line 9948: Terminal loss (co-owners: enter your share of the amount)";
    "Line 5: Subtotal (amount 4 minus line 9948)"; "Line 9936: Total CCA claim for the year
    (amount ii from Area A minus any personal part of CCA, and any CCA for business-use-of
    home expenses)"; "Line 6: Net income (loss) (amount 5 minus line 9936)"; "Line 7:
    Partners: your share of amount 6, or the amount from your T5013 slip, Statement of
    Partnership Income"; "Line 9974: Partners: GST/HST rebate for partners received in the
    year"; "Line 9943: Partners: other expenses of the partner"; "Line 9946: Your net income
    (loss): For sole proprietors or co-owners, enter the result from amount 6. For
    partnerships, enter the result from amount 7 plus line 9974 minus line 9943. Enter this
    amount on line 12600 of your income tax and benefit return". The property has two units
    and one row in the rental properties: its gross rents for all units are a chosen 24,000
    and for short-term rentals a chosen 0, so line 8140 is 0 and line 8141 is 24,000; line
    8230 is a chosen 0, so line 8299, and so T1 line 12599, is 24,000 + 0 = 24,000.
    The expenses are chosen figures, insurance (line 8690) 1,200, repairs and maintenance
    (line 8960) 800 and property taxes (line 9180) 2,100, every other expense line 0 and
    every personal portion and short-term portion 0: amount A, in line order, is 0 + 1,200 +
    0 + 0 + 0 + 0 + 800 + 0 + 2,100 + 0 + 0 + 0 + 0 = 4,100; lines 9949 and 9365 are 0.
    There is no row in Chart A, so line B, and so line 9366, is 0 (each row would be rounded
    half-up to the cent). Line 1 is 4,100 - 0 - 0 = 4,100; line 9369 is 24,000 - 4,100 =
    19,900. There is no co-owner (a count of 0), so amount 2 is line 9369, 19,900, and line
    2 is not triggered; lines 9945, 9947 and 9948 are a chosen 0, so amount 3 is 19,900 - 0
    = 19,900, amount 4 is 19,900 + 0 = 19,900 and amount 5 is 19,900 - 0 = 19,900; line 9936
    is 11,900.00 (Area A, in the source below, with no personal part of CCA and no CCA for
    business-use-of-home expenses, a chosen 0 each), which is at most amount 5, 19,900
    (Guide T4036: "You cannot use CCA to create or increase a rental loss"), so amount 6 is
    19,900 - 11,900.00 = 8,000.00. There is no partnership (a count of 0): lines 7, 9974 and
    9943 are not triggered (0 + 0 - 0 = 0), so line 9946, and so T1 line 12600, is amount 6,
    8,000.00. The rental lines add and subtract amounts already in cents.
