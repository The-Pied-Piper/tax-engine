# Return FT: Return DT's condominium sold within 365 days, with all nine life events of line 17906
# ticked. Any one ticked box means the housing unit is not a flipped property, so the flag is 0, and
# each of the nine checked tick boxes is 1. The flag and the ten checked answers are what this file
# checks.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  Return DT's filer: a single Ontario resident for all of 2025, aged 35, a chosen figure (18 or
  older at the end of 2025), resident in Canada throughout 2025, with no spouse or common-law
  partner and no dependants, and no income of any kind, every figure a chosen $0. She disposed of
  a condominium in Canada in 2025, a chosen figure, that was not considered inventory and that she
  owned for 200 consecutive days before its disposition, a chosen figure, so fewer than 365 days.
  Line 17905 of Schedule 3 Part 1 is "Yes", a count of 1, so the answer checked is 1. Line 17906
  asks whether the disposition was due to, or in anticipation of, any of the nine listed life
  events, "Tick the boxes that apply, if any". Every box is ticked here, a chosen figure that
  reaches every box (a taxpayer in this position would rarely tick all nine; the form puts no
  limit on how many boxes are ticked, and a former spouse or a spouse's circumstances can still
  bear on a filer who now has none), so each of the nine boxes is a count of 1 and each checked
  count is 1. The form says "If any of the life events above apply to you, the housing unit is not
  considered a flipped property", so the housing unit is not a flipped property and the flag is 0:
  the form's conditions are the "no" answer to line 17905 and the nine boxes, and with line 17905
  "Yes" the nine conditions of the boxes all apply, so the count is 0. The disposition is then
  included in income as a taxable capital gain, reported on Part 2 or Part 3 of the schedule, as
  the form directs; the proceeds, the adjusted cost base and the gain are not entered here and are
  not checked. Her other return figures are chosen $0, so the return's own lines are nil and are
  not checked in this file, except the two that a return with no income still computes, as in
  Return DT: with Schedule 8 box A at 12 months (a chosen figure) the second additional maximum
  amount is $9,900.00, and the alternative minimum tax carryover available for 2026 is $2,338.71.
sources:
  - >-
    CRA, Schedule 3 Capital Gains or Losses (2025), Part 1 "Flipped property", page 1, "Line
    17905: Did you dispose of a housing unit, or a right to acquire a housing unit, located in
    Canada (including a rental property) that was not considered inventory and was owned for
    less than 365 consecutive days before the disposition? Yes or No"; page 2, "Was the
    disposition due to, or in anticipation of, any of the following life events? (Tick the
    boxes that apply, if any.)" "Line 17906:" boxes 1 to 9; and "If any of the life events above
    apply to you, the housing unit is not considered a flipped property. The disposition of this
    property is included in income as a taxable capital gain." (docs/cra-forms-2025/5000-s3-25e.txt)
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s3/5000-s3-25e.txt
inputs:
  ca/resident_in_canada_throughout_2025: "1"
  ca/aged_18_or_older_at_end_of_2025: "1"
  ca/cpp_months: "12"
  ca/flipped_property_disposed: "1"
  ca/flipped_property_life_event_1: "1"
  ca/flipped_property_life_event_2: "1"
  ca/flipped_property_life_event_3: "1"
  ca/flipped_property_life_event_4: "1"
  ca/flipped_property_life_event_5: "1"
  ca/flipped_property_life_event_6: "1"
  ca/flipped_property_life_event_7: "1"
  ca/flipped_property_life_event_8: "1"
  ca/flipped_property_life_event_9: "1"
expected:
  ca-on/return:
    - ca/cpp_second_additional_earnings_maximum: "9900.00"
      ca/amt_carryover_available_for_2026: "0.00"
  ca/schedule_3:
    - ca/flipped_property_disposed_checked: "1"
      ca/flipped_property_life_event_1_checked: "1"
      ca/flipped_property_life_event_2_checked: "1"
      ca/flipped_property_life_event_3_checked: "1"
      ca/flipped_property_life_event_4_checked: "1"
      ca/flipped_property_life_event_5_checked: "1"
      ca/flipped_property_life_event_6_checked: "1"
      ca/flipped_property_life_event_7_checked: "1"
      ca/flipped_property_life_event_8_checked: "1"
      ca/flipped_property_life_event_9_checked: "1"
      ca/flipped_property: "0"
