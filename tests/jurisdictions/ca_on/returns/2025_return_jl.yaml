# Return JL: Guide T4002 "Applying your restricted farm losses from years before 2025" (Form T1
# line 25200). An Ontario resident with employment income of $30,000 and one Form T2042 (farming)
# statement with wheat sales of $5,000 and no expenses, so net farming income (T1 line 14100) is
# $5,000. She has $8,000 of restricted farm losses from 2023 and claims the $5,000 she can apply
# against her net farming income on line 25200; the other $3,000 carries on and is not an input.
# Amounts are quoted decimal strings, never floats; counts are quoted digit strings.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025, as Return IQ (Schedule 8 Part 4 and Part 5 not
  completed, so no CPP is due on the farm income) with a net farm profit and no farming
  loss restriction (the answer is 0). Employment income 30,000; one T2042 statement with wheat
  sales 5,000 (line 9946 = 5,000, T1 line 14100 = 5,000). Restricted farm losses of other years
  claimed 5,000: "you can only apply them up to the amount of your net farming income", so the
  most she can claim is 5,000 of her 8,000 and 5,000 is claimed. Total income is 30,000 + 5,000 =
  35,000.00 and net income is 35,000.00 - 265.00 (enhanced CPP contributions, as Return IQ) =
  34,735.00. T1 line 25200 is the 5,000 claimed (no non-capital losses of other years) and taxable
  income is 34,735.00 - 5,000.00 = 29,735.00.
sources:
  - >-
    CRA, Guide T4002 (2025), "Restricted farm losses (partly deductible)" (docs/cra-forms-2025/
    t4002-25e.pdf; confirmed from the PDF, no .txt published): "If you have net farming income in
    2025, you may be able to apply restricted farm losses you had in any year from 2006 to 2024 on
    your 2025 income tax return... Also, you can only apply them up to the amount of your net
    farming income in 2025. You have to apply the loss from the earliest year before you apply the
    losses from other years. Claim this amount on line 25200."

