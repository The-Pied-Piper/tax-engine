expected:
  # Hand derivation of the tax figures below from net income 34,735.00 and taxable income 29,735.00
  # (checked against the engine's trace, step by step):
  #   Federal: 29,735 x 14.5% = 4,311.58, less the non-refundable credits as Return IQ (2,813.54)
  #     = 1,498.04.
  #   Ontario: 29,735 x 5.05% = 1,501.62, less the non-refundable credits as Return IQ (734.81) =
  #     766.81, which is `ca-on/ontario_tax_less_dividend_credit`. No tax reduction (2 x 294 is
  #     below it); the LIFT credit is 875.00 - 5% x (34,735 - 32,500) = 763.25, leaving 3.56.
  #   Ontario Health Premium: 6% x (29,735 - 20,000) = 584.10 on taxable income, at most 300.00
  #     in that step.
  #   Total payable: 1,498.04 + 3.56 + 300.00 = 1,801.60.
  #   Canada Workers Benefit: 1,633.00 - 15% x (34,735 - 26,855) = 451.00, a refundable credit.
  #   Balance owing: 1,801.60 - 451.00 = 1,350.60, so `ca/refund_or_balance_owing` is 1,350.60.
  ca-on/return:
    - ca/farming_income: "5000.00"
      ca/t4_cpp_pensionable_earnings_slip_checked: "30000.00"
      ca/net_farming_income: "5000.00"
      ca/net_farming_income_not_below_zero: "5000.00"
      ca/restricted_farm_losses_of_other_years_checked: "5000.00"
      ca/non_capital_losses_on_line_25200: "5000.00"
      ca/deductions_from_net_income: "5000.00"
      ca/total_income: "35000.00"
      ca/net_income: "34735.00"
      ca/taxable_income: "29735.00"
      ca/refund_or_balance_owing: "1350.60"
      ca/other_payments_limit_income: "34735.00"
      ca/net_income_before_adjustments: "34735.00"
      ca/cpp_second_additional_earnings_maximum: "9900.00"
      ca-on/ontario_tax_less_dividend_credit: "766.81"
