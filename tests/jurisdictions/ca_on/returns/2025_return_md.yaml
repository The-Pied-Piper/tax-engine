# Return MD: Return BE with a line 13000 of $5,000 instead of $2,000, of which $2,000 is income from
# the recovery of exploration and development expenses. Form T2048 Chart A line 15 takes 50% of
# only the $2,000 recovery, $1,000.00 (Return BE's figure), not 50% of all $5,000 ($2,500.00). The
# other $3,000 (for example a retiring allowance) is in the net income and the tax lines. Every
# figure is a chosen figure; the tax lines are the engine's figures.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025, resident in Canada throughout 2025, aged 18 or
  older at the end of 2025, with employment income (T1 line 10100) of $60,000, interest
  (line 12100) of $4,000, other income (line 13000) of $5,000, of which $2,000 is income from the
  recovery of exploration and development expenses, and capital gains reported on
  Schedule 3 of $200,000, of which $100,000 is taxable (line 12700): the T1 and Schedule 3 lines
  are the engine's figures and the net income (line 23600) is 153,435.00 (to be confirmed
  against CRA's calculator). Net capital losses of other years of 40,000 are available and
  30,000 is claimed (line 25300). A business investment loss of 8,000 is 4,000.00 allowable
  (line 21700). Carrying charges of 5,000 (line 22100) and exploration and development
  expenses of 6,000 (line 22400) are chosen figures. Form T2048, for one QBT: Part 2: line 1
  (the joint election's eligible amount) 600,000, a chosen figure, and line 2 (the percentage
  allocated to the filer) 50%, a chosen figure, so line 3 is 300,000.00; line 4 is 50%, so line
  5 is 150,000.00; line 6 (earlier years' claims for this disposition) is 20,000, a chosen
  figure, so line 7 is 130,000.00. Part 3: line 8 is 100,000.00 (line 12700); line 9 (the
  QBT's gains on Schedule 3) 180,000 and line 10 (the 2024 reserve) 20,000 are chosen figures,
  so line 11 and line 12 are 200,000.00; line 13 (the 2025 reserve) 40,000 is a chosen
  figure, so line 14 is 160,000.00; line 15 is 50%, so line 16 is 80,000.00; line 17 is the
  lesser of line 8 (100,000.00) and line 16: 80,000.00; line 18 is 30,000 (line 25300), line
  19 is 100,000.00 and line 20 is 80,000.00, so line 21 is 20,000.00 and line 22 is 30,000 -
  20,000.00 = 10,000.00; line 23 is 4,000.00 (line 21700). The filer has investment expenses
  in 2025 (a chosen answer), so line 24 is line 20 of Chart A. Chart A: line 1 is 5,000
  (line 22100); line 2, the net rental loss (line 12600), is 0; line 3, the limited or
  non-active partnership losses (line 12200), is 2,000, a chosen figure; line 4 (line 25100)
  is 0; line 5 is 50% of the 6,000 of line 22400, 3,000.00; line 6, other investment expenses,
  is 1,000, a chosen figure; line 7 is 30,000 (line 18 of Part 3) and line 8 is 10,000.00
  (line 22 of Part 3), so line 9 is 20,000.00; line 10 is 5,000 + 0 + 2,000 + 0 + 3,000.00 +
  1,000 + 20,000.00 = 31,000.00. Line 11 is the dividends (line 12000, 0.00) and the interest
  (line 12100, 4,000), 4,000.00; line 12 (net rental income) and line 13 (net partnership
  income) are 0; line 14, other property income, is 500, a chosen figure; line 15 is 50% of
  the 2,000 recovery part of line 13000, 1,000.00, not 50% of all 5,000; line 16 is 100,000.00
  and line 17 is 80,000.00, so line 18 is 20,000.00; line 19 is 4,000.00 + 0 + 0 + 500 + 1,000.00 + 20,000.00 = 25,500.00;
  line 20 is 31,000.00 - 25,500.00 = 5,500.00. Back in Part 3: line 24 is 5,500.00; line 25 is
  10,000.00 + 4,000.00 + 5,500.00 = 19,500.00; line 26 is 80,000.00 - 19,500.00 = 60,500.00;
  the lesser of line 7 (130,000.00) and line 26 is 60,500.00, line 26 limiting, and the filer
  claims all of it, 60,500, a chosen figure, so line 27 and line 25395 are 60,500. Part 4:
  line 28 is the lesser of line 7 and line 17, 80,000.00; line 29 is 60,500, so line 30 is
  19,500.00; line 31 is 60,500, so line 32 is 80,000.00; line 33 is 4,000.00 and line 34 is
  5,500.00, so line 35 is 9,500.00; line 36 is the lesser of line 30 (19,500.00) and line 35:
  9,500.00; line 37 is 9,500.00 and line 38 is 9,500.00, so line 39 is 1, and line 40 is
  4,000.00, so line 41 is 4,000.00; line 42 is 9,500.00 - 4,000.00 = 5,500.00. Part 5: the
  election is for a QBT (a chosen answer), so B (total 17212) is line 7, 130,000.00, and A
  (total 17211) is 0.00; C (total 17213) is line 16, 80,000.00; D (total 17215) is line 31
  and line 36, 60,500.00 + 9,500.00 = 70,000.00; the gains are from qualified small business
  corporation shares (a chosen answer), so E (total 17216) is 70,000.00; F (total 17217) is
  line 41, 4,000.00; G (total 17218) is line 42, 5,500.00. Line 25700 adds line 25300 (30,000)
  and line 25395 (60,500), 90,500.00, so the taxable income (line 26000) is 153,435.00 -
  90,500.00 = 62,935.00. The other lines are the engine's figures (to be confirmed against
  CRA's calculator).
sources:
  - >-
    CRA, Form T2048, "Capital Gains Deduction for Qualifying Business Transfers or Qualifying
    Cooperative Conversions", 2025 edition (confirmed 2026-10-19 from the PDF; no .txt is
    published), Part 2: line 1 "Total eligible amount for the joint election (maximum of $10
    million per election)"; line 2 "Percentage allocated to you"; line 3 "Line 1 multiplied
    by the percentage from line 2"; line 4 "Inclusion rate 50%"; line 5 "Line 3 multiplied by
    the percentage from line 4"; line 6 "Capital gains deduction claimed in prior years at line
    25395 of your return for this disposition, if any"; line 7 "Capital gains deduction
    available from your election: line 5 minus line 6".
  - >-
    CRA, Form T2048, Part 3: line 8 "Taxable capital gains from line 12700 of your return";
    line 9 "Capital gains for the QBT or QCC that occurred in the current year reported on
    Schedule 3"; line 10 "Amount of 2024 reserve claimed for the QBT or QCC, if any"; line 11
    "Line 9 plus line 10"; line 13 "Amount of 2025 reserve claimed for the QBT or QCC, if any";
    line 14 "Total capital gains for the QBT or QCC: line 12 minus line 13"; line 15 "Inclusion
    rate 50%"; line 16 "Taxable capital gains for the QBT or QCC only: line 14 multiplied by
    the inclusion rate on line 15"; line 17 "Enter whichever is less: amount from line 8 or
    line 16."; line 18 "Net capital losses of other years (line 25300 of your return)"; line
    21 "Line 19 minus line 20 (if negative enter "0")"; line 22 "Line 18 minus line 21 (if
    negative enter "0")"; line 23 "Allowable business investment loss (ABIL) for the year (line
    21700 of your return)"; line 24 "Net investment loss for the year: If you have investment
    expenses in 2025, complete Chart A on page 4 and enter the amount from line 20 of Chart A.
    Otherwise, enter "0"."; line 25 "Add lines 22, 23, and 24"; line 26 "Line 17 minus line
    25"; line 27 "Enter whichever is less: amount from line 7 or line 26. Enter all or part of
    the amount you want to claim on line 25395 of your return."
  - >-
    CRA, Form T2048, Part 4: line 28 "Enter whichever is less: amount from line 7 or line 17.";
    line 30 "Line 28 minus line 29" Reduction amount; line 31 "Amount claimed on line 25395 of
    your return for this QBT or QCC"; line 32 "Line 30 plus line 31"; line 35 "Line 33 plus
    line 34"; line 36 "Enter whichever is less: amount from line 30 or line 35."; line 39
    "Line 37 divided by line 38"; line 41 "Line 39 multiplied by line 40" ABIL reduction; line
    42 "Line 36 minus line 41" Net investment loss reduction. Part 5: A "Amount from line 7 if
    the election is for a QCC" Total 17211; B "Amount from line 7 if the election is for a
    QBT" Total 17212; C "Amount from line 16" Total 17213; D "Amount from lines 31 and 36"
    Total 17215; E "Amounts from line 31 and 36 if gains are from a qualified small business
    corporation shares (QSBCS) or qualified farm or fishing property (QFFP)" Total 17216; F
    "Amount from line 41" Total 17217; G "Amount from line 42" Total 17218.
  - >-
    CRA, Form T2048, Chart A - Net investment loss of the year: line 1 "Carrying charges and
    interest expenses (line 22100)"; line 2 "Net rental losses (line 12600)"; line 3 "Limited
    or non-active partnership losses (line 12200) other than allowable capital losses"; line 4
    "Limited partnership losses of other years after 1985 (line 25100)"; line 5 "50% of
    exploration and development expenses (line 22400)"; line 6 "Any other investment expenses
    claimed in 2025 to earn property income"; line 9 "Line 7 minus line 8 (if negative enter
    "0")"; line 10 "Investment expenses: add lines 1 to 6, and line 9"; line 11 "Investment
    income (lines 12000 and 12100)"; line 12 "Net rental income, including recaptured capital
    cost allowance (line 12600)"; line 13 "Net income from limited or non-active partnership
    (line 12200) other than taxable capital gains"; line 14 "Any other property income reported
    in 2025"; line 15 "50% of income from the recovery of exploration and development expenses
    (line 13000)"; line 18 "Line 16 minus line 17"; line 19 "Investment income: add lines 11
    to 15, and line 18"; line 20 "Line 10 minus line 19 (if negative enter "0")" Net investment
    losses for the year.
  - >-
    CRA, T1 General 2025, Ontario edition (form 5006-r), "Step 4 - Taxable income" (confirmed
    2026-10-19): "Line 64 and line 25395: Capital gains deduction for qualifying business
    transfers or qualifying cooperative conversions (complete Form T2048)"; "Line 68 and line
    25700: Add lines 58 to 67."; "Line 69 and line 26000: Line 57 minus line 68 (if negative,
    enter "0") Taxable income".
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2048/t2048-25e.pdf
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-r/5006-r-25e.txt
