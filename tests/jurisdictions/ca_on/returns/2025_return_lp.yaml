# Return LP: Guide T4044, Chapter 11 commissioned salesperson example, the full T777. Amounts are
# quoted decimal strings.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  Return LP: Guide T4044 (2025), "Chapter 11 - Employee goods and services tax/harmonized sales tax
  (GST/HST)", Example: a commissioned salesperson in Ontario who completes the whole T777 (Part B
  vehicle page too): line 4 food 1,559.68 times 50% = 779.84; line 7 office supplies 178.25; line 8
  cell phone 623.13; the vehicle chart for a 2020 Dodge with 22,500 of 30,000 kilometres driven for
  employment (line 20 0.75000), fuel 3,230.55, maintenance and repairs 467.67, insurance 1,200.00,
  licence and registration 260.00, capital cost allowance 8,644.50 (Part B, Class 10.1, UCC at the
  start 28,815.00, 30%), interest 1,850.19 and other expenses 84.50. The Guide prints line 29
  15,737.41, line 30 11,803.06, line 32 and line 3 11,803.06, line 15 13,384.28 and line 17
  13,384.28, which is the total for T1 line 22900. Not pinned: the Guide's GST/HST rebate (Form
  GST370), which is a separate form. The employment income is a chosen $60,000 (the example gives
  the taxable allowance but no income); the vehicle was bought on December 31, 2024 for $37,000.01
  (the Guide's Part B "Date acquired" 2024-12-31, entered as the year 2024. The Guide's "Cost of
  vehicle" 37,000.00 is not "more than $37,000", the printed Class 10.1 condition for 2024, so the
  Guide's own example looks stale and the least cost that meets the condition is entered; only that
  condition reads the two, no line of the form does).
  The Dodge is a passenger vehicle (Class 10.1), so the Guide's interest chart applies: its days are a
  chosen 365 (the Guide gives none), so line B is $3,650, above the $1,850.19 paid, and line 26 is the
  $1,850.19. Every other line is the engine's figure.
sources:
  - >-
    CRA, Guide T4044 (2025), Employment Expenses (docs/cra-forms-2025/t4044-25e.txt;
    https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t4044/t4044-25e.txt), Chapter 11,
    Example: "You are a commissioned salesperson who negotiates contracts for your employer in
    Ontario which has an HST rate of 13%." The T777: "Line 29: Add lines 21 to 28. = 15,737.41";
    "Line 30: Line 20 multiplied by line 29 Employment-se portion = 11,803.06"; "Line 15: Add lines
    1 to 14. = 13,384.28"; "Line 17 ... Total expenses = 13,384.28". Part B: "Column 2 ... 28,815.00
    ... Column 6 CCA Rate: 30% ... Column 7 CCA for the year ... 8,644.50".
  - >-
    CRA, Form T777 (2025), Statement of Employment Expenses (docs/cra-forms-2025/t777-25e.pdf, the
    only published copy; https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t777/t777-25e.pdf):
    lines 3, 4, 7, 8, 15, 17 and the line 3 chart (lines 18 to 32); Part B Class 10.1.
