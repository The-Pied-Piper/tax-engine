# Return DI: Dana, a 2025 Ontario student with a disability who attended a designated
# educational institution for 20 weeks, with the disability supports deduction (T1 line
# 21500) computed on Form T929 from the expenses she paid, $12,000.00, and no reimbursement.
# Her earned income is $2,000.00, below the line 3 expenses, so line 12 is the lesser of
# line 3 and line 11, and the student rule (line 9, 20 weeks at $375) limits line 10. Every
# figure is derived in the description; the figures checked are the form's lines and the
# return's lines from total income to taxable income, and the tax lines are not checked in
# this file.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025, aged 26, a chosen figure (18 or older at the
  end of 2025), resident in Canada throughout 2025, with no spouse or common-law partner and
  no dependants. She attended a designated educational institution for 20 weeks in 2025, a
  chosen figure (Form T929 line 8). Her employment income (T1 line 10100) is $2,000.00 and
  her other income (line 13000) is $18,000.00, both chosen figures, so total income (line
  15000) is $2,000.00 + $18,000.00 = $20,000.00. No other income, no self-employment income
  (T2125, T2042 and T2121 are not filed, so their net income is $0), no professional or
  commission income, and no scholarship income (each a chosen $0). The disability supports
  she paid are a chosen $12,000.00 (Form T929 line 1, column 2), with nothing reimbursed or
  paid by assistance (line 2, a chosen $0.00), so line 3 is $12,000.00 - $0.00 = $12,000.00.
  Form T929 Step 2 then gives: line 4, earned income, is her employment income of $2,000.00
  plus $0 for each other item, $2,000.00. Line 5, her net income, is the amount line 23600
  would be with no claim: total income of $20,000.00, less deductions from total income
  (line 23300) of $0, because her employment income of $2,000.00 is below the $3,500 basic
  exemption, so her base, first additional and second additional CPP contributions are $0,
  and she has no RRSP, union dues or child care deductions. So line 5 is $20,000.00 (line
  23400 $20,000.00 less line 23500 $0), and the claim does not reduce it. Line 6 is line 4,
  $2,000.00, and line 7 is $20,000.00 - $2,000.00 = $18,000.00. Line 8, the weeks attended,
  is 20, and line 9 is 20 x $375 = $7,500.00 (rounded half-up to the cent, which changes
  nothing). Line 10 is the lesser of line 7, $18,000.00, and line 9, $7,500.00, and the
  maximum of $15,000 does not apply, so $7,500.00. Line 11 is line 4 plus line 10: $2,000.00
  + $7,500.00 = $9,500.00. Line 12 is the lesser of line 3, $12,000.00, and line 11,
  $9,500.00: $9,500.00, the disability supports deduction. That is line 21500 of the T1 (the
  form's line 12 on line 21500), so the deductions from total income (line 23300) are
  $9,500.00 with no other deduction, the net income before adjustments (line 23400) is
  $20,000.00 - $9,500.00 = $10,500.00, and the net income (line 23600) is $10,500.00, less
  social benefits repayment (line 23500) of $0. Taxable income (line 26000) is $10,500.00
  with no deduction from net income. The employment income is taken with no CPP, EI or tax
  input, so the contribution, premium and tax lines are not checked here; they do not change
  the deduction, which depends only on the form's figures and the total income. No medical
  expenses, no other dependants and no capital gains (each a chosen $0). The CPP lines, with
  Schedule 8 box A at 12 months (a chosen figure, a full year of CPP): the second additional
  maximum amount (Schedule 8 Part 2 line C, "maximum amount subject to second additional
  contributions for 2025 (maximum $9,900)") is $9,900.00 for 12 months, so the return
  carries $9,900.00 on the line; no second additional contribution is payable on $2,000.00
  of earnings. The other payments limit income (Federal Worksheet "Line 25000 - Other
  payments deduction" line 9, "Line 5 plus line 8") is line 5, the net income of $10,500.00
  less the UCCB and RDSP income repayments of $0 (line 8, a chosen $0), so $10,500.00, below
  the $93,454 limit. The alternative minimum tax (T691): the Part 1 adjustments add back the
  disability supports deduction of $9,500.00 (at the 50% applicable rate, $4,750.00), so the
  adjusted taxable income is $10,500.00 + $4,750.00 = $15,250.00, under the $177,882 basic
  exemption, so the minimum amount is $0. Part 2 line 5 is the tax payable before the
  minimum tax carryover, $1,522.50 (the federal tax of Part 2 line 1, line 40400) less the
  non-refundable tax credits of $2,552.00 (line 4), which is $1,522.50 - $2,552.00 =
  -$1,029.50. Part 2 line 7, the basic federal tax, is line 5 less the carryover applied of
  $0, so it is also -$1,029.50: those lines are not floored at zero. Part 7 line 14, the
  additional tax for the carryover, is line 1 (the minimum amount, $0) minus line 13 (line 8
  plus line 12, which here is the -$1,029.50 of Part 2 line 7 with no investment tax credit
  recapture, foreign tax or logging credit): $0 - (-$1,029.50) = $1,029.50. That is positive,
  so the "if negative, enter 0" floor does not apply, and line 14 is $1,029.50. Part 8 line 13
  is the balance of the carryover from earlier years, $0 less $0; line 15 is line 13 plus line
  14, $0 + $1,029.50 = $1,029.50; with no unapplied 2018 carryover (line 16, $0), the total
  carryover available for 2026 (line 17) is $1,029.50. The engine carries that figure as
  amt_carryover_available_for_2026. This is existing AMT behaviour, not new to this claim: the
  claim lowers the regular federal tax below the credits, and the alternative minimum tax reads
  that figure unfloored.
sources:
  - >-
    CRA, Form T929 Disability Supports Deduction, 2024 edition, the latest CRA publishes (no
    2025 edition; docs/cra-forms-2025/t929-24e.pdf), "Use this form to calculate the amount
    to enter on line 21500 of your tax return."; Step 1 line 3, "Subtract line 2 from line
    1. This amount is your net disability supports expenses"; Step 2 line 4 "Enter your
    earned income"; line 5 "Enter your net income"; line 6 "Enter your earned income from
    line 4"; line 7 "Line 5 minus line 6 (if negative, enter "0")"; line 8 "Enter the number
    of weeks in the year that you attended the institution or secondary school"; line 9
    "Line 8 multiplied by $375"; line 10 "Enter the amount from line 7 or line 9, whichever
    is less. (maximum $15,000)"; line 11 "Add lines 4 and 10"; line 12 "Enter the amount
    from line 3 or line 11, whichever is less", and "Enter the amount from line 12 on line
    21500 of your tax return."
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t929/t929-24e.pdf
  - >-
    CRA, General Income Tax and Benefit Guide 2025 (docs/cra-forms-2025/5000-g-25e.txt),
    "Line 21500 - Disability supports deduction"; "Line 23600 - Net income"; "Line 26000 -
    Taxable income", the lines of the T1 that the figures above are entered on.
