# Return HK: Guide T4002's chapter 3 example (D'Arcy), a single Ontario resident whose only income
# is the net business income of one business bought a building in 2025, reported on one Form T2125
# (Statement of Business or Professional Activities), with a full fiscal period (0 days entered, a
# full year), Area A with one row, Class 1 (the building, 4%), with no UCC at the start of the year
# (D'Arcy did not own property before) and the half-year rule applying to the addition, and with
# the land of the purchase on Area F, lines 9923 and 9924. The total cost of the building is
# $75,000 + $75,000 / $90,000 x $5,000 = $75,000 + $4,166.67 = $79,166.67 (column 3, the building
# additions of Area C, which the guide's example enters; a filer's input, as the form leaves the
# split of the fees to the filer). The land is $15,000 + $833.33 = $15,833.33, entered on line 9923
# of Area F (Guide T4002: "$15,833.33 ($15,000 + $833.33) on line 9923 of Area F as the capital
# cost of the land"); line 9924 is $0. Nothing earlier on the form computes either land line, so
# both are inputs taken as entered (`ca/business_land_additions` and `ca/business_land_dispositions`)
# and carried to the form's printed lines, read by nothing on the return.
#
# The guide's example has income of $6,000 and expenses of $4,900. Here the income (gross sales,
# line 8299) is a chosen $6,483.33, so that the expenses (rent, line 8910, $4,900) and the CCA
# claimed (line 9936) are met and the net business income (line 9946) is $0.00: the claim is the
# full maximum of Class 1, as the guide's example says D'Arcy "wants to deduct as much CCA as he
# can" (the guide's figures give a net of -$483.33 at $6,000 of income; the chosen income only
# makes the net $0.00).
# Column 7 is $79,166.67; column 18 is 50% of it, $39,583.34 (the half-year rule); column 19 is
# $79,166.67 - $39,583.34 = $39,583.33; the maximum is $39,583.33 x 4% = $1,583.33, which is the
# claim (column 21 and line 9936). Column 22 is the UCC carried to the next year: $79,166.67 -
# $1,583.33 = $77,583.34. Total expenses (line 9368) are $4,900 + $1,583.33 = $6,483.33, and line
# 9369 is $6,483.33 - $6,483.33 = $0.00, which is line 9946 and T1 line 13500. The gross business
# income (T1 line 13499) is line 8299, $6,483.33. The immediate expensing limit is the whole
# $1,500,000 (0 days entered: a full year, and no associated business), with no immediate
# expensing claimed. With net business income of $0.00 the T1 lines are Return EC's, with the
# gross business income (line 13499) of $6,483.33 in place of the rental lines.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025 whose only income is the net business income of one
  sole proprietorship, reported on one Form T2125 (Statement of Business or Professional
  Activities) for a full fiscal period (0 days entered): gross sales of a chosen $6,483.33 (line
  8299, T1 line 13499), rent of $4,900 (line 8910) and capital cost allowance of $1,583.33 on
  Class 1 (Area A, line 9936), so total expenses (line 9368) are $6,483.33, line 9369 is $0.00 and
  line 9946 and T1 line 13500 are $0.00. Area A has one class, Class 1 (4%), bought in the year:
  the capital cost of the building of $79,166.67 (column 3, the building additions of Area C: $75,000
  building value plus $4,166.67 of the $5,000 of legal fees and land transfer taxes, the filer's
  split), with no UCC at the start of the year, no proceeds and no immediate expensing. The
  half-year rule gives column 18 $39,583.34 and column 19 $39,583.33, so the maximum is $39,583.33
  x 4% = $1,583.33, claimed in full; the UCC at the end of the year (column 22) is $79,166.67 -
  $1,583.33 = $77,583.34. The land on Area F is $15,833.33 on line 9923 (the input
  `ca/business_land_additions`, taken as entered and carried unread) and $0.00 on line 9924 (the
  input `ca/business_land_dispositions`). The business is not associated with any other EPOP, so
  the immediate expensing limit is the whole $1,500,000 (Area G), and no immediate expensing is
  claimed. With a net income of $0.00 there is no net self-employment income, no CPP or EI on it,
  and the other return lines are Return EC's.
sources:
  - >-
    CRA, Guide T4002 (2025), Self-employed Business, Professional, Commission, Farming, and Fishing
    Income, chapter 3 (docs/cra-forms-2025/t4002-25e.pdf, confirmed from the PDF with pdftotext
    -layout, around line 5461 of its text), "The following example summarizes this chapter on CCA.
    Example: During the current tax year, D'Arcy bought a building to use for his business. The
    total cost was $95,000"; the table "Building value $75,000", "Land value $15,000", "Total
    purchase price $90,000", "Legal fees $3,000", "Land transfer taxes $2,000", "Total fees $5,000";
    "($75,000 ÷ $90,000) × $5,000 = $4,166.67"; "Capital cost of the building $79,166.67";
    "D'Arcy enters $79,166.67 in column 3 of Area C and $15,833.33 ($15,000 + $833.33) on line 9923
    of Area F as the capital cost of the land."; "D'Arcy did not own property before the current
    year. Therefore, he has no UCC to enter in column 2 of Area A."; "D'Arcy acquired his property
    during the current year. Therefore, he is subject to the half-year rule"; "D'Arcy wants to
    deduct as much CCA as he can."
  - >-
    CRA, Form T2125 (2025), Statement of Business or Professional Activities
    (docs/cra-forms-2025/t2125-25e.pdf, read with pdftotext -layout): Area C "Building additions in
    the year"; Area F "Land additions and dispositions in the year": "Line 9923: Total cost of all
    land additions in the year" and "Line 9924: Total proceeds from all land dispositions in the
    year", with the note "You cannot claim capital cost allowance on land. For more information,
    see Chapter 3 of Guide T4002."; Part 4 "Rent" (line 8910, an input of $4,900); line 9936 "Total
    CCA claim for the year (enter on line 9936 of Part 4 amount ii)"; line 9946 "Net income (loss)";
    line 8299 "Gross business or professional income"; line 9369 "Net income (loss) before
    adjustments: Amount 4A minus line 9368".
  - >-
    CRA, "T1-2025 Ontario edition" return (form 5006-R, docs/cra-forms-2025/5006-r-25e.txt,
    confirmed 2026-10-19): T1 line 13500 is line 9946, $0.00, so the total income and net income
    are $0.00 and the tax payable is $0.00.
