# Return ES: the FHSA chain of Schedule 15 with the maximum participation period ENDED: Step 2 is not
# completed, line 40 is the printed 0, and every comparison in Step 3 takes its other branch. The
# excess designated withdrawals floor at 0. No CRA example exists for Schedule 15, so every figure is
# a chosen figure, worked out by hand from the form text.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  An Ontario resident for all of 2025 (Ontario residency is chosen: the form names no province of
  residence), resident in Canada throughout 2025, aged 18 or older at the end of 2025 (chosen
  figures). Her only income is a chosen $50,000.00 of other income (line 13000), with no FHSA
  income (lines 12905 and 12906), so total income is 50,000.00. Every figure of Schedule 15 is a
  chosen figure: no CRA example exists, so the figures are chosen and the arithmetic is shown line by
  line here. Her maximum participation period (MPP) ended in a prior year, so the form says "Enter
  "0" on line 40 and continue at Step 3": line 40, and so line 41, is the printed 0. Lines 3, 12 and
  23 of Step 2 still feed Step 3 (lines 53, 55 and 49), and the engine also computes the rest of the
  Step 2 arithmetic as the step-2 result (line 40 before the MPP is applied, 1,500.00), shown below
  for the trace; the form does not print those lines in that case. Each comparison of Step 3 takes
  its other branch: line 33 is the lesser of line 29 and line 32, and line 32 is the lesser; line 51
  is the lesser of line 45 and line 50, and line 50 is the lesser. Schedule 15, page 2 to page 4, in
  order:
  Line 3: 5,000 - 800 = 4,200.00. Line 5: 4,200 + 700 = 4,900.00. Line 9: 3,000 - 2,800 = 200.00.
  Line 10 is the amount from line 2 (800.00). Line 11: 200 + 800 = 1,000.00. Line 12: 400 - 1,000 =
  -600, which is negative, so it is entered as 0.00 (the excess designated withdrawals are floored).
  Line 13: 4,900 - 0 = 4,900.00. Line 14: 8,000.00 (printed). Line 16: 8,000 + 2,000 = 10,000.00.
  Line 19: 20,000 + 1,000 = 21,000.00. Line 22: 2,000 + 500 = 2,500.00. Line 23: 21,000 - 2,500 =
  18,500.00 (no floor printed). Line 24 is the amount from line 23, 18,500.00. Line 25 is the amount
  from line 17, 20,000.00, and line 26 the amount from line 20, 2,000.00. Line 27: 20,000 - 2,000 =
  18,000.00. Line 29: 18,000 - 3,000 = 15,000.00 (positive, so not floored). Line 30: 8,000.00
  (printed). Line 32: 8,000 + 500 = 8,500.00. Line 33: the lesser of line 29 (15,000.00) and line 32
  (8,500.00) is 8,500.00, the other branch. Line 35: 8,500 + 1,500 = 10,000.00. Line 36: 18,500 -
  10,000 = 8,500.00 (no floor printed). Line 37 is the amount from line 16, 10,000.00, and line 38 the
  amount from line 36, 8,500.00. Line 39: 10,000 - 8,500 = 1,500.00. Line 40 (the Step 2 result, not
  printed): the lesser of line 13 (4,900.00) and line 39 (1,500.00) is 1,500.00. Because the MPP
  ended, line 40, and so line 41, is the printed 0.00: the annual FHSA limit for 2025 is 0.00. Line 41
  is 0.00. Line 42 is a chosen 24,000.00 (the total annual limits for 2024 and prior years). Line 43:
  0 + 24,000 = 24,000.00. Line 44 is a chosen 10,000.00 (the total FHSA deductions for 2024 and prior
  years). Line 45: 24,000 - 10,000 = 14,000.00 (no floor printed). Line 46: the lifetime FHSA limit,
  40,000.00 (printed). Line 47 is line 44, 10,000.00. Line 48: 40,000 - 10,000 = 30,000.00. Line 49 is
  line 24, 18,500.00. Line 50: 30,000 - 18,500 = 11,500.00 (positive, so not floored). Line 51: the
  lesser of line 45 (14,000.00) and line 50 (11,500.00) is 11,500.00, the maximum FHSA deduction for
  2025, the second branch. Line 52 is a chosen 2,800.00 (the unused FHSA contributions brought
  forward). Line 53 is the amount from line 3, 4,200.00. Line 54: 2,800 + 4,200 = 7,000.00. Line 55 is
  the amount from line 12, 0.00. Line 56: 7,000 - 0 = 7,000.00 (no floor printed). Line 57: the FHSA
  contributions deducted for 2025 is a chosen 6,000.00, which is no more than line 51 (11,500.00), so
  it is accepted and enters line 20805 of the return. Line 58: 7,000 - 6,000 = 1,000.00, the unused FHSA
  contributions carried forward. The FHSA deduction is 6,000.00. Net income is 50,000 - 6,000 =
  44,000.00, and taxable income is 44,000.00, as no other deduction applies. The tax lines are the
  engine's figures, not form figures: the Ontario tax less the dividend credit (1,578.28), the net
  income before adjustments and the other payments limit income (both 44,000.00), the second
  additional CPP maximum (9,900.00, a full year of CPP at a chosen 12 months), the RC381 part 2 lines
  g to j, and the refund (6,069.57).
sources:
  - >-
    CRA, Schedule 15 2025, Step 2 and Step 3 lines: "Line 3: Line 1 minus line 2", "Line 5: Line 3
    plus line 4", "Line 12: Line 6 minus line 11 (if negative, enter "0")", "Line 13: Line 5 minus
    line 12 (if negative, enter "0")", "Line 23: Line 19 minus line 22 Net RRSP-to-FHSA transfer
    amount", "Line 27: Net RRSP-to-FHSA transfer amount for 2024 and prior years: Line 25 minus line
    26", "Line 29: Line 27 minus line 28 (if negative, enter "0")", "Line 33: Enter whichever is less:
    amount from line 29 or line 32", "Line 40: Enter whichever is less: amount from line 13 of the
    previous page or line 39. Annual FHSA limit for 2025", "Line 46: Lifetime FHSA limit 40,000.00",
    "Line 51: Enter whichever is less: amount from line 45 or line 50. Maximum FHSA deduction available
    for 2025", and "Line 57: Enter the FHSA contributions you are deducting for 2025 (cannot be more
    than the amount on line 51 of the previous page). Enter this amount on line 20805 of your return.
    FHSA deduction for 2025" (docs/cra-forms-2025/5000-s15-25e.txt)
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s15/5000-s15-25e.txt
  - >-
    CRA, Schedule 15 2025, Step 2: "If your maximum participation period (MPP) ended in a prior year,
    do not complete this step. Your 2025 annual FHSA limit is "0". Enter "0" on line 40 and continue
    at Step 3." (docs/cra-forms-2025/5000-s15-25e.txt)
  - >-
    CRA, T1 2025 Ontario edition, "Line 37 and line 20805: FHSA deduction (complete Schedule 15 and
    attach receipts)" (docs/cra-forms-2025/5006-r-25e.txt)
