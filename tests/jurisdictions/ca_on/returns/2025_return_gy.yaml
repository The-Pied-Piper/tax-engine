# Return GY: a self-employed filer (a single sole proprietor, a 2025 Ontario resident) whose only
# activity is a fishing business, one Form T2121 (Statement of Fishing Activities) that enters the
# five lines no other worked return sets: Part 3 amounts 3B (other marine products, $3,000), 3C
# (grants, credits, and rebates, $1,200) and 3E (compensation for loss of fishing income or
# property, $800), and the two capital cost allowance lines taken out of Area A's claim, the
# personal part ($600) and the business-use-of-home amount (7K, $900). Gross income (line 8299,
# T1 line 14299) is 40,000 + 3,000 + 1,200 + 800 = $45,000.00; the expenses are those of Return BD
# ($25,000, amount 4Q); one Class 8 row claims $4,000 of CCA (amount ii), so line 9936 is
# 4,000 - 600 - 900 = $2,500.00; line 9369 is 45,000 - 27,500 = $17,500.00; the business-use-of-home
# amount 7K of $900 is the whole of amount 7M and is allowed in full (7N is $17,500), so line 9945
# is $900.00 and the net fishing income (line 9946, T1 line 14300) is $16,600.00, all of total
# income (line 15000). Amounts are quoted decimal strings, never floats; counts are quoted digit
# strings. Every output the CA-ON manifest declares must appear under `expected`, or be left out
# to be 0 (or no records). The farming lines (Form T2042) are not triggered and are not listed here.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025 whose only activity is a fishing business, reported on
  one Form T2121. Part 3: fish products $40,000 (amount 3A), other marine products $3,000 (3B),
  grants, credits, and rebates $1,200 (3C), compensation for loss of fishing income or property
  $800 (3E); subsidies (3D), sharesperson income (3F) and other income (line 9600) are 0 and Area A
  has no recapture, so line 8299 is 40,000 + 3,000 + 1,200 + 0 + 800 + 0 + 0 + 0 = $45,000.00, which
  is T1 line 14299 and amount 4A. Part 4: the expenses are salt, bait and ice (line 9138) $10,000
  and fishing gear (line 9136) $15,000, so amount 4Q is $25,000; Area A has one Class 8 row with
  undepreciated capital cost at the start of the year of $20,000, no additions and no
  dispositions, so the base amount for CCA (column 19) is $20,000, the rate 20% gives $4,000
  and the claim (column 21) is $4,000, chosen to be the full amount, so amount ii is $4,000.00.
  The personal part of it is $600 and the CCA for business-use-of-home expenses (amount 7K) is
  $900, both within their bounds, so line 9936, "amount ii of Area A minus any personal part
  and any CCA for business-use-of-home expenses", is 4,000 - 600 - 900 = $2,500.00, and line
  9368, "amount 4Q plus line 9936", is 25,000 + 2,500 = $27,500.00. Line 9369, "amount 4A minus
  line 9368", is 45,000 - 27,500 = $17,500.00. With no partner, amount 5A is line 9369, 5B and
  5C are $17,500.00 (no line 9974 or amounts 6A to 6E). Part 7: amounts 7A to 7G are 0, so 7H, 7I
  and 7J are 0; amount 7K is $900, amount 7L (carried forward) is 0, so amount 7M is $900.00;
  amount 7N is amount 5C, $17,500.00, so amount 7O is 0 and amount 7P, the lesser of 7M and 7N,
  is $900.00, which is line 9945. Line 9946 is amount 5C minus line 9945, 17,500 - 900 =
  $16,600.00, T1 line 26 and line 14300; with no business, professional, commission or farming
  income the net self-employment income (T1 line 27) is $16,600 and total income (line 15000) is
  $16,600.00, so net income and taxable income are $16,600.00 (no deductions). The Class 8
  row's UCC at the end of the year (column 22, column 7 minus column 21) is 20,000 - 4,000 =
  $16,000. No motor vehicle is
  entered, so line 9281 is $0. The CPP months (Schedule 8 box A) are the 12 of a full year and
  Schedule 8 Part 4 is not completed, so no CPP contributions or EI premiums are payable on the
  self-employment income. Federal basic tax is 16,600.00 x 14.5% = 2,407.00; the credit amounts
  are the basic personal amount 16,129.00 (net income under 177,882), which at 14.5% is
  2,338.705, rounded half-up to the cent: 2,338.71, so the federal tax after credits is
  2,407.00 - 2,338.71 = 68.29. Ontario basic tax is 16,600.00 x 5.05% = 838.30; the credit
  amounts are 12,747.00, x 5.05% = 643.7235, rounded half-up to the cent: 643.72, so the Ontario
  tax after credits is 838.30 - 643.72 = 194.58, and the basic reduction (294.00, twice it
  588.00, less the tax 194.58, is 393.42) is more than the tax, so the Ontario tax is 0. The
  Canada workers benefit (line 45300) is the lesser of 27% of (16,600 - 3,000) = 3,672.00 and
  1,633.00, 1,633.00, with no reduction under 26,855.00, so the refund is 1,633.00 - 68.29 =
  $1,564.71.
sources:
  - >-
    CRA, Form T2121 (2025), Statement of Fishing Activities (docs/cra-forms-2025/t2121-25e.pdf,
    confirmed 2026-10-19 from the PDF; https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2121/t2121-25e.pdf),
    Part 3 "Income": "Fish products" (3A); "Other marine products" (3B); "Grants, credits, and
    rebates." (3C); "Subsidies" (3D); "Compensation for loss of fishing income or property" (3E);
    "Sharesperson income (specify name of fishing boat and captain below)" (3F); "Other income
    (specify):" (9600); "Gross income: Total of amounts 3A to 3F and line 9600 (enter this amount
    on line 14299 of your income tax and benefit return)" (8299). Part 4: "Gross income (line 8299
    of Part 3)" (4A); "Subtotal: Add amounts 4B to 4P." (4Q); "Capital cost allowance (CCA). Enter
    amount ii of Area A minus any personal part and any CCA for business-use-of-home expenses."
    (9936); "Total expenses: Amount 4Q plus line 9936" (9368); "Net income (loss) before
    adjustments: Amount 4A minus line 9368." (9369). Area A, columns 19 to 21: "Base amount for
    CCA", "CCA rate %" and "CCA for the year (col. 19 multiplied by col. 20, or a lower amount,
    plus col. 9)"; "Total CCA claim for the year: Total of column 21 (enter on line 9936 of Part 4
    amount ii minus any personal part and any CCA for business-use-of-home expenses)" (ii). Part 5:
    "Your share of line 9369 or the amount from your T5013 slip, Statement of Partnership Income"
    (5A); "Total: Amount 5A plus line 9974" (5B); "Net income (loss) after adjustments: Amount
    5B minus line 9943" (5C); "Business-use-of-home expenses (amount 7P)" (9945); "Your net income
    (loss): Amount 5C minus line 9945 (enter this amount on line 14300 of your income tax and
    benefit return)" (9946). Part 7: "Subtotal: Add amounts 7A to 7G." (7H); "Personal-use part of
    the business-use-of-home expenses" (7I); "Subtotal: Amount 7H minus amount 7I" (7J); "Capital
    cost allowance (business part only), which means amount ii of Area A minus any portion of
    capital cost allowance that is for personal use or entered on line 9936 of Part 4" (7K);
    "Amount carried forward from previous year" (7L); "Subtotal: Add amounts 7J to 7L." (7M); "Net
    income (loss) after adjustments (amount 5C) (if negative, enter "0")." (7N); "Business-use-of-
    home expenses available to carry forward: Amount 7M minus amount 7N (if negative, enter "0")"
    (7O); "Allowable claim: Amount 7M or 7N above, whichever is less (enter your share of this
    amount on line 9945 of Part 5)" (7P). The figures are chosen: amounts 3A, 3B, 3C and 3E, the
    Class 8 row (UCC $20,000, claim $4,000), the personal part $600 and amount 7K $900 (the
    two are within the bounds of the claim: 600 is not above amount ii, 4,000, and 900 is not
    above amount ii less the personal part, 3,400); the lines not listed are not entered and are
    0. Not modelled: Part 1 (identification), Part 2 (the Internet business activities), Part 8
    (the other partners), Part 9 (the equity), Areas B to G (no motor vehicle is entered).
  - >-
    https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2121/t2121-25e.pdf
  - >-
    CRA, "T1-2025 Ontario edition" return (form 5006-R, docs/cra-forms-2025/5006-r-25e.txt,
    confirmed 2026-10-19), "Step 2 - Total income": "Line 26: Fishing income"; "Line 14300: Net";
    "Line 27: Add lines 22 to 26. Net self-employment income =". Line 14300 (line 26) is T2121
    line 9946, $16,600; lines 22 to 25 are $0, so line 27 is 16,600 and total income (line 15000)
    is $16,600.00, with total deductions 0, so net income (line 23400) and taxable income (line
    26000) are $16,600.00.
  - >-
    https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-r/5006-r-25e.txt
  - >-
    The figures that depend on income, with the forms quoted in Return BC and Return BD: T1 (form
    5000-R) line 30000 is $16,129 for net income of $177,882 or less; Part A "Federal tax on
    taxable income": taxable income of 16,600.00 is in column 1 "Line 26000 is $57,375 or less":
    line 74 is 16,600.00 x 14.5% = 2,407.00; the non-refundable credits are 16,129.00 x 14.5%
    = 2,338.705, rounded half-up to the cent: 2,338.71, so the federal tax after credits is 68.29.
    The medical share, 3% of net income, is 498.00 and the threshold, the lesser of that and $2,834,
    is 498.00, above the medical expenses of 0. ON428 Part A: 16,600.00 x 5.05% = 838.30; the
    Ontario credit amounts are the basic personal amount 12,747.00, and 12,747.00 x 5.05% =
    643.7235, rounded half-up to the cent: 643.72, so the Ontario tax after credits is 838.30 -
    643.72 = 194.58. The basic reduction is 294.00, twice it, 588.00, less the tax of 194.58 is
    393.42, which is more than the tax, so the tax after the reduction is 0. Schedule ON428-A:
    the LIFT credit is 5.05% of employment income, 0, so 0. The Ontario health premium chart,
    taxable income 16,600.00, is in "Row 1: Taxable Income of $20,000 or less": "Ontario health
    premium: $0", so the Ontario tax (line 42800) is 0. Schedule 6 (Return BD): the working income
    is the self-employment profit of 16,600.00, 27% of the 13,600.00 over $3,000 is 3,672.00,
    capped at 1,633.00, with no reduction under $26,855.00, so the Canada workers benefit is
    1,633.00. T1 line 148 (line 43500) is the net federal tax 68.29 plus the Ontario tax 0 = 68.29,
    with no CPP or EI payable, no tax deducted and no other credits, so line 167 is 68.29 less the
    refundable 1,633.00, a refund of 1,564.71. The CPP on self-employment earnings is not payable
    as in Return BD: Schedule 8 Part 4 is not completed. The other credits and lines are 0 for the
    same chosen counts and amounts as Return BC.
