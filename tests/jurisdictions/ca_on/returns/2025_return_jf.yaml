# Return JF: a 2025 Ontario resident whose business loses money, so total income is below zero. The
# filer has $30,000 of other income (line 13000), one Form T2125 statement with no sales and $40,000
# of office expenses (a net loss of $40,000, line 13500), $5,000 of income tax deducted (line 43700)
# and $500 of union dues (line 21200). Total income (line 15000) is 30,000.00 - 40,000.00 =
# -10,000.00. The union dues and the tax deducted have no bound on the form, so both are taken as
# entered; the tax deducted of 5,000.00 is added to the total credits. Nothing else is entered.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A 2025 Ontario resident (residency and age 18 or older at the end of 2025 are chosen: 1) with
  other income of 30,000.00 and one Form T2125 statement of business income from a sole
  proprietorship (line code 1) with no gross sales and office expenses of 40,000.00, so its net
  loss (line 9946) is -40,000.00 and the business income on line 13500 is -40,000.00. Total income
  is 30,000.00 - 40,000.00 = -10,000.00. The union dues of 500.00 (line 21200) are the only
  deduction, so the net income before adjustments (line 23400) is -10,500.00, shown in brackets,
  and net income (line 23600) and taxable income are 0.00 once floored. The union dues of
  500.00 and the income tax deducted of 5,000.00 (line 43700) are accepted as typed (the form
  prints no limit on either). With taxable income of 0.00 there is no federal or Ontario tax, and
  the Canada workers benefit, the LIFT credit and the Ontario tax reduction are 0.00 (no employment
  income). The total
  credits (line 48200) are the income tax deducted of 5,000.00 alone, and total payable is 0.00, so
  the refund (line 48400) is 5,000.00. The AMT carryover to 2026 is 0.00
  (`ca/amt_carryover_available_for_2026`, an engine line: with no minimum tax owing, Part 7 is
  skipped), and the cap `ca/cpp_second_additional_earnings_maximum` (9,900.00) is the engine's,
  not a hand figure.
sources:
  - >-
    CRA, Form 5006-R 2025, "Line 33 and line 15000: Line 28 plus line 32 Total income" and "Line 56
    and line 23600: Line 54 minus line 55 (if negative, enter "0")" (docs/cra-forms-2025/
    5006-r-25e.txt). The form prints no limit on lines 43700 and 21200; both are taken as typed.
