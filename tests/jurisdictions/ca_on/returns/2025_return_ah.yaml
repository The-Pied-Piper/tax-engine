# Return AH: Lina, a single 2025 Ontario resident, 30, resident in Canada throughout 2025,
# whose employment income is exactly $4,390, the working income the refundable medical
# expense supplement (T1 line 45200) asks "must be $4,390 or more", and whose medical
# expenses give a medical claim (line 33200) of $6,000.00, so 25% of it, $1,500.00, is under
# the $1,504 maximum, and her adjusted family net income, $20,000.00, is under the
# $33,294.00 income threshold, so the supplement is the whole $1,500.00. The employment
# income is below the EI maximum insurable earnings ($65,700) and the CPP first earnings
# ceiling ($71,300), so the CPP contributions and EI premiums are the rates' arithmetic, not
# the printed maximums, and there is no second additional CPP contribution. 5.05% of the
# employment income is below the LIFT credit's $875 maximum and net income is below its
# $32,500 threshold, so the credit is that 5.05%, unreduced. 27% of the working income over
# $3,000 is below the Canada workers benefit's $1,633 maximum and the adjusted family net
# income is below its $26,855 threshold, so the benefit is that 27%, unreduced. Computed
# from the Federal Worksheet's line 9, the eight sources of line 12100 added, and its line
# 11, that less the part reported in previous years, to the interest and other investment
# income (T1 line 12100); lines 14400, 14500 and 14600 added to line 14700; and, in line
# order, employment income (line 10100), the other employment income, the pension and
# benefit lines, the taxable dividends, the investment lines, the taxable capital gains, the
# taxable support payments, the RRSP, FHSA, other and scholarship income and line 14700 to
# total income (line 15000); from employment income, by Schedule 8's three contribution
# tiers, to the base, first additional and second additional CPP contributions, the last two
# together the enhanced CPP contributions; from employment income, up to the EI maximum
# insurable earnings, to the EI premiums; from the unused RRSP contributions from earlier
# years and the RRSP contributions, their sum, to the contributions available to deduct
# (Schedule 7 line 10), from those and the deduction limit, the lesser of them, to the most
# that may be deducted (Schedule 7 line 17), from the amount deducted (line 18), at most
# that, to the RRSP deduction (line 20), and from the contributions available to deduct less
# the RRSP deduction to the unused contributions carried forward (line 23); from the numbers
# of eligible children (T778 Part B lines 1 to 3), $8,000, $11,000 and $5,000 for each,
# summed to the basic limit (line 4), from employment income, the earned income (line 6), to
# two-thirds of it, and from those and the child care expenses paid (line 5), the least of
# them, to the child care expenses deduction (lines 7 and 9, T1 line 21400), here, with no
# eligible child and no expenses paid, zero; less the child care expenses deduction and the
# enhanced CPP contributions to net income, less the (empty) deductions from net income to
# taxable income; from net income, by the Federal Worksheet, to the federal basic personal
# amount; from it less the dependant's net income, not below zero, for each eligible
# dependant, to the amount for an eligible dependant (T1 line 30400), and from the ON428
# base less the dependant's net income, not below zero, at most its maximum, for each
# eligible dependant, to the Ontario amount (ON428 line 58160); from the number of infirm
# children, $2,687 for each, to the amount for infirm children (line 30500), here, with no
# eligible dependant and no infirm child, all three zero; and through each form's total of
# non-refundable credit amounts (its basic personal amount, its amount for an eligible
# dependant, the base CPP contributions and the EI premiums, and on the T1 alone the amount
# for infirm children and the Canada employment amount), credited once at the form's credit
# rate to the form's non-refundable tax credits (T1 line 35000, ON428 line 61500), taken off
# its basic tax, not below zero, to the tax after credits, and on ON428 the surtax on the
# Ontario tax after credits, added to it to the Ontario tax with surtax, less the Ontario
# dividend tax credit (Worksheet ON428's line 61520, from lines 12000 and 12010, ON428 lines
# 56 to 58, 70 and 71), not below zero, to the Ontario tax after the dividend credit; and,
# with no dependent children or dependants, the Ontario tax reduction amounts (the basic
# reduction alone), twice them less the Ontario tax after the dividend credit, not below
# zero, to the Ontario tax reduction, taken off the Ontario tax after the dividend credit,
# not below zero, to the Ontario tax after the reduction; from employment income, by
# Schedule ON428-A, 5.05% of it at most $875, less 5% of net income over $32,500, not below
# zero, to the LIFT credit (ON428 line 85), taken off the Ontario tax after the reduction,
# not below zero, to the Ontario tax after the LIFT credit (line 86), less 25% of the
# qualifying donations (line 87), not below zero, to the Ontario tax after the food credit
# (line 88); and from taxable income, by the health premium chart's tiers, each capped at
# the next plateau, to the Ontario health premium, added to the Ontario tax after the food
# credit to the Ontario tax; from employment income, by Schedule 6, 27% of the working
# income over $3,000 at most $1,633, less 15% of the adjusted family net income, here net
# income, over $26,855, not below zero, for a filer with no eligible spouse and no eligible
# dependant, and the same at most $2,813 and over $30,639 for a filer with one, and from
# those, by the number of Schedule 6 eligible dependants (line 38100), the first when it is
# zero and the second otherwise, to the Canada workers benefit (T1 line 45300); and on the
# T1, the federal tax after credits, carried to the net federal tax, plus the Ontario tax to
# the total payable, less the total credits, here the chosen income tax deducted plus the
# refundable medical expense supplement (line 45200) plus the Canada workers benefit, to the
# refund or balance owing, negative for a refund and positive for a balance owing. There is
# no capital gain, unused or new RRSP contribution or union dues. Not yet computed, so not
# in this file: any deduction from net income and capital losses (the social benefits repayment, line 23500, is 0, as the chart does not apply). Line 82 (the provincial foreign tax credit) is not triggered by this return, and
# the qualifying donations for line 87 (the community food program donation tax credit for
# farmers) are a chosen $0, so line 87 is $0 and line 88 is line 86. Schedule 9's inputs are
# all a chosen $0, so lines 116 (34900) and 117 (34990) are $0 and line 35000 is line 33800.
# Nor are Schedule 5 line 2, T1 lines 30425 and 30450, the Ontario caregiver amount (ON428
# line 58185), Form T778 line 8 and Parts C and D, and Schedule 6's disability supplement
# (Step 3) and advance payments (Step 4); with no Schedule 6 eligible dependant (line
# 38100), the Schedule 6 amounts for a filer with no eligible spouse and no eligible
# dependant are the ones chosen. The age amount (line 30100), the spouse or common-law
# partner amount (line 30300) and the Canada caregiver amount for a spouse or common-law
# partner (line 30425) are not triggered by this return, so each is 0 and its part of the
# T1's total of credit amounts is 0: the filer is taken as born in 1961 or later, with no
# spouse or common-law partner (to be confirmed), so the counts of filers born in 1960 or
# earlier, of spouse amounts claimed and of spouses eligible for the Canada caregiver amount
# (line 51090) are 0 and the spouse's net income is entered as 0. They are computed all the
# same, in the order of the form's lines, from net income less the $45,522 income threshold,
# not below zero, at 15%, taken off $9,028, not below zero (line 30100), from the basic
# personal amount, the $2,687 for a spouse eligible for the Canada caregiver amount and the
# spouse's net income, not below zero (line 30300), and from $28,798 less the spouse's net
# income, at most $8,601, less the line 30300 amount, not below zero (line 30425), each
# claimed for its count. Amounts are quoted decimal strings, never floats; counts are quoted
# digit strings. Every output the CA-ON manifest declares must appear under `expected`;
# intermediate lines may be listed and are then checked too. ON428's age amount (line 58080,
# from Worksheet ON428) and spouse or common-law partner amount (lines 11 to 13, line 58120)
# are not triggered either, for the same counts of 0, so each is 0 and its part of ON428's
# total of credit amounts is 0. They are computed all the same, in the order of the forms'
# lines, from net income less the $46,330 income threshold, not below zero, at 15%, taken
# off $6,223, not below zero (line 58080), and from $11,905.00 less the spouse's net income,
# not below zero, at most $10,823 (line 58120), each claimed for its count. Ontario
# political contributions (ON479 line 15, line 63100) are a chosen $0, so Worksheet ON479's
# line 16 is $0 (column 1 applies). Federal political contributions (T1 line 135 and line
# 40900) are a chosen $0, so the Federal Worksheet's line 41000 is $0 (column 1 applies).
# The refundable medical expense supplement (T1 line 154 and line 45200, Federal Worksheet
# "Line 45200 - Refundable medical expense supplement") is computed one worksheet line per
# step: the working income (lines 10100 and 10400 less the wage-loss replacement plan
# amounts and less lines 20700, 21200, 22900 and 23100, not below zero, plus the net
# self-employment income of lines 13500, 13700, 13900, 14100 and 14300), the net income and
# repayments and UCCB and RDSP income of the two columns (lines 1 to 5, the spouse's column
# being a caller input), line 6 their sum, line 7 the printed $33,294.00, line 8 line 6 less
# it, line 11 the sum of lines 9 (line 21500) and 10 (line 33200), line 13 25% of it, line
# 14 the lesser of that and $1,504, line 15 5% of line 8 and line 16 line 14 less line 15;
# line 16 is then passed through only when the working income is $4,390 or more, and through
# the residence and age counts. Lines 22900 and 23100, the five self-employment lines, the
# wage-loss replacement plan amounts and the whole of the spouse's column are a chosen $0 (the
# self-employment lines and lines 22900 and 23100 are not yet computed from their own forms).
# Line 21500 is computed from Form T929, and this return carries no copy of that form, so the
# line is 0. The counts of residence in Canada throughout 2025 and of 18
# years of age or older at the end of 2025 are both 1.
# The Ontario seniors care at home tax credit (ON479 line 13, line 63095) is not claimed (a
# chosen count of 0): its line 3 is the 6,000.00 of line 58769, line 5 is 25% of it,
# 1,500.00, line 8 is the 20,000.00 of family net income, under the 35,000.00 base, so line
# 12 is 0.00 and line 13 is 1,500.00, but the credit claimed is $0.
# Form ON-BEN (lines 61020 to 61230) is not applied for (a chosen 0 for each tick box and a
# chosen $0 for each Part A amount), so its ten lines are carried as entered, all 0.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025, resident in Canada throughout 2025, aged 30, a
  chosen figure (18 or older at the end of 2025), with no spouse or common-law partner and
  no dependants, with 2025 employment income (T1 line 10100) of $4,390.00 and other income
  (line 13000) of $15,618.90, a chosen figure, and a chosen $6,600 of medical expenses (line
  33099). No capital gain, so taxable capital gains (line 12700) of $0 and total income
  (line 15000) of $4,390 + $15,618.90 = $20,008.90. The CPP contributions are computed from
  employment income, which is entered as the T4 box 26 pensionable earnings (the slip's box 26 being
  blank, the form's "enter the amount from box 14"). The EI premiums are computed from employment income, taken as the insurable
  earnings. Employment income is below the EI maximum insurable earnings ($65,700) and the
  CPP first earnings ceiling ($71,300), so EI premiums (line 31200, ON428 line 58300) are
  1.64% x 4,390 = 71.996, rounded half-up to the cent: $72.00, base CPP contributions
  (Schedule 8 line 11, T1 line 30800, ON428 line 58240) are 4.95% x (4,390 - 3,500) =
  44.055, rounded half-up to the cent: $44.06, and enhanced CPP contributions (line 22215)
  are the first additional (Schedule 8 line 12) 1% x 890 = $8.90 with no second additional
  contribution (line 22, $0). No unused or new RRSP contributions, no union dues (line
  21200) and no child care expenses deduction (line 21400), so total deductions (line 23300)
  are the enhanced CPP contributions of $8.90, the net income before adjustments (line
  23400) is $20,008.90 - $8.90 = $20,000.00 and net income (line 23600) is $20,000.00. There
  are no deductions from net income, so taxable income (line 26000) is $20,000.00, inside
  the lowest federal and Ontario brackets. The medical claim: 3% of net income (line 108 of
  the T1, ON428 line 39) is $600.00, below the $2,834 and $2,885 maximums (lines 109 and
  40), and $6,600 less it is $6,000.00 (line 110, ON428 line 41); there are no other
  dependants (line 33199, ON428 line 58729), so the claim (line 33200, ON428 line 58769) is
  $6,000.00. The non-refundable credit amounts are the basic personal amount (federal line
  30000 $16,129, since net income is $177,882 or less; Ontario ON428 line 58040 $12,747),
  the base CPP contributions, the EI premiums and the medical claim, and on the T1 alone the
  Canada employment amount (line 31260) of $1,471, the lesser of $1,471 and employment
  income of $4,390 (ON428 has no such line): line 33500 of $16,129 + $44.06 + $72.00 +
  $1,471 + $6,000.00 = $23,716.06 and ON428 line 58800 of $12,747 + $44.06 + $72.00 +
  $6,000.00 = $18,863.06. Each total includes $0 for an eligible dependant (line 30400,
  ON428 line 58160) and, on the T1, $0 for infirm children (line 30500), as there is no
  eligible dependant and no infirm child (to be confirmed). The rate is applied once to each
  total: 14.5% federally (line 33800) and 5.05% for Ontario (ON428 line 58840). Each
  product, rounded half-up to the cent, is its form's non-refundable tax credits: $3,438.83
  federally (line 35000) and $952.58 for Ontario (ON428 line 61500), each taken off its
  form's basic tax, not below zero: the federal basic tax is 14.5% x $20,000.00 = $2,900.00,
  so the federal tax after credits is $0, and the Ontario basic tax is 5.05% x $20,000.00 =
  $1,010.00, so the Ontario tax after credits (ON428 line 52) is $1,010.00 - $952.58 =
  $57.42. The Ontario surtax (ON428 line 68) is $0, as that tax is below $5,710, so the
  Ontario tax with surtax (line 69) is $57.42. With no dependent children and no dependants,
  the Ontario tax reduction amounts (line 77) are the basic reduction of $294.00 (line 74);
  twice them, $588.00 (line 78), less the Ontario tax with surtax of $57.42 (line 79) is
  $530.58, so the Ontario tax reduction (line 80) is $530.58 and the Ontario tax after the
  reduction (line 81) is $0. The LIFT credit (ON428 line 85, Schedule ON428-A) is 5.05% of
  employment income, $221.70, at most $875, less 5% of net income over $32,500, nothing:
  $221.70, and the Ontario tax after it (line 86) is $0, not below zero. With chosen
  qualifying donations of $0, the community food program donation tax credit for farmers
  (line 87) is $0 and the Ontario tax after it (line 88) is $0. The Ontario health premium
  (ON428 line 89) is read from its chart on taxable income: $20,000.00 is not more than
  $20,000, so the premium is $0 and the Ontario tax (line 90) is $0. On the T1, the net
  federal tax (line 42000) is $0 and the total payable (line 43500) is $0. The refundable
  medical expense supplement (line 45200, Federal Worksheet) is $1,500.00: the filer was
  resident in Canada throughout 2025 and 18 or older at the end of 2025 (counts of 1, chosen
  facts); the working income is the employment income of $4,390 less the registered pension
  plan deduction, union dues, other employment expenses and clergy residence deduction (each
  $0), with no wage-loss replacement plan amounts and no net self-employment income (each a
  chosen $0), so $4,390, which is "$4,390 or more"; the adjusted family net income (line 6)
  is the net income before adjustments of $20,000.00 (column 1 lines 3 and 5, with the
  repayments and the UCCB and RDSP income $0) and the spouse's column $0, so line 8 is
  $20,000.00 - $33,294.00, negative, so $0; line 9 (line 21500, computed on Form T929, which
  this return does not carry, so $0) and line 10
  (line 33200, $6,000.00) give line 11 of $6,000.00, line 13 is 25% of it, $1,500.00, line
  14 is the lesser of that and $1,504: $1,500.00, line 15 is 5% of $0, $0.00, and line 16 is
  $1,500.00 - $0.00 = $1,500.00. The Canada workers benefit (line 45300, Schedule 6) is 27%
  of the working income, the employment income, over $3,000, $1,390, $375.30, at most
  $1,633, less 15% of the adjusted family net income, the net income, over $26,855, nothing
  as $20,000.00 is below it: $375.30 (with an eligible dependant the same, at most $2,813,
  less nothing over $30,639). The income tax deducted (line 43700) is a chosen $500, so the
  total credits (line 48200) are it plus the supplement plus the benefit plus the provincial
  credits (line 47900, $0 with no fertility treatment expenses, no seniors' transit amount
  paid and no political contributions), $500 + $1,500.00 + $375.30 = $2,375.30, and the
  refund or balance owing (line 167) is the total payable less the total credits, $0 -
  $2,375.30 = -$2,375.30: negative, so a refund (line 48400) of $2,375.30, and with no
  donation to the Ontario opportunities fund (line 46500, $0) the net refund (line 46600) is
  $2,375.30 too. Every amount computed from a rate, fraction, amount or chart on the forms
  is rounded half-up to the cent, each line being a dollars-and-cents box; here that changes
  the EI premiums, the base CPP contributions, both forms' non-refundable tax credits and
  the lines that follow from them. The lines that only add, subtract, compare or choose take
  amounts already in cents, so the refund or balance owing is in cents too. The age amount
  (line 30100), the spouse or common-law partner amount (line 30300) and the Canada
  caregiver amount for a spouse or common-law partner (line 30425) are each $0: the filer is
  taken as born in 1961 or later, claims no spouse amount (count 0) and has no spouse
  eligible for the Canada caregiver amount (line 51090, count 0), and the spouse's net
  income entered is $0 (to be confirmed).
  No self-employment income: the net business, professional, commission, farming and fishing
  income (T1 lines 13500, 13700, 13900, 14100 and 14300) are $0, so their sum (line 27) is
  $0, and it is a $0 term of total income (line 15000). The CPP months (Schedule
  8 box A) are the 12 of a full year, Schedule 8 Part 4 is not completed (count 0) and there
  is no agreement with the Canada Employment Insurance Commission (count 0), so the CPP
  contributions payable (line 42100), the base CPP contributions (line 31000) and the
  deduction (line 22200) on self-employment income, and the EI premiums on it (lines 31217
  and 42120), are $0 and change no total.
