# Return AU: Uma, a single 2025 Ontario resident with employment income of $60,000 and
# Schedule 3 (Capital Gains or Losses) Part 3 dispositions of shares, real estate,
# crypto-assets and other foreclosures, showing the "Total proceeds of disposition" of each
# line (column 2 added over its rows), including a row that is a loss and still adds its
# proceeds, and lines with no rows, which total 0. The proceeds totals feed no later line:
# the capital gains are the column 5 totals. The other lines are blank.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025, resident in Canada throughout 2025, aged 18 or
  older at the end of 2025 (a chosen figure), with employment income (T1 line 10100) of
  $60,000 (a chosen figure) and the dispositions below, every figure a chosen figure. Line 4
  (shares), column 2 added: 12,000 + 3,000 = 15,000 (line 13199); column 5 = column 2 minus
  columns 3 and 4: 12,000 - 8,000 - 100 = 3,900 and 3,000 - 4,000 - 50 = -1,050, total 2,850
  (line 13200). The second row is a loss and its proceeds of 3,000 are still added. Line 5
  (real estate): proceeds 90,000 (line 13599); 90,000 - 60,000 - 2,000 = 28,000 (line 13800).
  Line 7 (crypto-assets): proceeds 5,000 (line 15200); 5,000 - 7,000 - 0 = -2,000 (line
  15301). Line 8 (other foreclosures): proceeds 1,000 (line 15499); 1,000 - 1,500 - 0 = -500
  (line 15500). Lines 1, 2, 3 and 6 have no rows, so their proceeds totals (10699, 10999,
  12399 and 15199) are 0. Line 11 = 2,850 + 28,000 - 2,000 - 500 = 28,350, which is line 21
  (19700) and line 22, and line 24 = 28,350 x 50% = 14,175.00, positive, so line 12700
  (taxable capital gains) is 14,175.00. Total income (line 15000) = 60,000 + 14,175.00 =
  74,175.00. The income tax deducted is a chosen 14,000. The net income, taxable income,
  total payable and refund or balance owing are the engine's figures (to be confirmed against
  CRA's calculator). Not triggered: the lines of Schedule 3 Part 4 other than line 12, line 25
  (19890) and every other credit and deduction not named here.
sources:
  - >-
    CRA, "T1-2025 Schedule 3 Capital Gains or Losses" (form 5000-S3, confirmed 2026-10-19),
    Part 3: "For each Gain or loss enter as many lines as necessary."; "(Column 2): Proceeds
    of disposition", "(Column 3): Adjusted cost base", "(Column 4): Outlays and expenses",
    "(Column 5): Gain or loss (column 2 minus columns 3 and 4)"; lines 1 to 8 (10699, 10999,
    12399, 13199, 13599, 15199, 15200, 15499) "Total proceeds of disposition (add all the
    amounts under column 2)"; lines 1 to 8 (10700, 11000, 12400, 13200, 13800, 15300, 15301,
    15500) "Total gain or loss (add all the amounts under column 5)"; "Line 11: Add lines 1 to
    10. Total gains or losses of qualified properties and other properties =". Part 5: "Line
    24: Line 22 multiplied by the percentage from line 23 =" (50%); line 26 (line 19900) "If
    positive, enter the result on line 12700 of your return."
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s3/5000-s3-25e.txt
