# Return LX: a leased farm truck on a Form T2042 and a leased fishing truck on a Form T2121, neither a
# passenger vehicle, whose lease charges are above what Chart C would allow a passenger vehicle (chosen
# figures, not a CRA example: Guide T4002 and the T2042 and T2121 print no dollar example for a leased
# vehicle; derived by hand from the printed lines below). A single Ontario resident whose only income
# is the net farming income of one T2042 (sole proprietor, full fiscal period) and the net fishing
# income of one T2121 (sole proprietor, full fiscal period).
#
# T2042: wheat $50,000 (line 9600 total, gross income $50,000). Chart A, one truck leased for the whole
# 365 days with passenger vehicle answered no: kilometres 16,000 of 20,000 total; amount 3 fuel and oil
# 2,000; amount 5 insurance 1,200; amount 6 licence and registration 150; amount 7 maintenance and
# repairs 450; amount 8 leasing 20,000 (Chart C is not used, on the reading of the Guide below, for a vehicle that is not a passenger
# vehicle); amount 12 = 23,800; amount 13 = 16,000 / 20,000 x 23,800 = 19,040.00; amount 16 (line 9819) =
# 19,040.00. Total farm expenses 19,040.00, net income 30,960.00 (line 14100 of the T1).
#
# T2121: fish products $40,000 (gross income $40,000). Chart A, one truck leased for 365 days, not a
# passenger vehicle: kilometres 9,000 of 12,000; amount 3 1,600; amount 5 800; amount 6 100; amount 7
# 500; amount 8 leasing 18,000; amount 12 = 21,000; amount 13 = 9,000 / 12,000 x 21,000 = 15,750.00;
# amount 16 (line 9281) = 15,750.00. Total expenses 15,750.00, net income 24,250.00 (line 14300 of
# the T1).
#
# Chart C is headed "Eligible leasing cost for passenger vehicles" on each form, and Guide T4002 (printed
# page 55) says "When you use a passenger vehicle to earn farming or fishing income, there is a limit on
# the amount of the leasing costs you can deduct. To calculate your eligible leasing costs, fill in
# 'Chart C'". No printed sentence says in so many words that a vehicle that is not a passenger vehicle
# skips Chart C: that is read from the heading and the Guide by negation (Amount 8 of Chart A prints only
# "Leasing (use Chart C below)"), so these two trucks enter the whole lease charge in amount 8 on that
# reading. The trucks are chosen as pick-up trucks used to transport goods (a motor vehicle, not a
# passenger vehicle, in the Guide's vehicle definitions chart) and are not zero-emission vehicles. (For a
# passenger vehicle with a list price of
# $60,000 and a 13% sales tax rate Chart C would give, on the T2042, the lesser of line 26,
# ($1,100 + $143) x 365 / 30 = $15,123.17, and line 27, ($38,000 + $4,940) x $20,000 / $51,000 =
# $16,839.22, so $15,123.17; on the T2121 the lesser of $15,123.17 and ($38,000 + $4,940) x $18,000 /
# $51,000 = $15,155.29, so $15,123.17.) The lines under `expected` are the forms' lines derived by
# hand above and the totals that add them; the other figures of the return are the engine's, not
# CRA's. Schedule 8 Part 4 is not completed (as Return EY), so no CPP is computed.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025 whose only income is the net farming income of one sole-proprietor
  Form T2042 (wheat $50,000) and the net fishing income of one sole-proprietor Form T2121 (fish products
  $40,000), each for a full fiscal period (0 days entered), each with one truck leased for 365 days that is not
  a passenger vehicle in Chart A (T2042: 16,000 of 20,000 kilometres, fuel and oil 2,000, insurance 1,200,
  licence and registration 150, maintenance and repairs 450, lease charges 20,000; T2121: 9,000 of 12,000
  kilometres, fuel and oil 1,600, insurance 800, licence and registration 100, maintenance and repairs 500,
  lease charges 18,000, with no Chart C limit), so the allowable motor vehicle expenses are $19,040.00 (line
  9819) and $15,750.00 (line 9281), the net farming income is $30,960.00, the net fishing income is $24,250.00
  and the total income is $55,210.00. No capital cost allowance is claimed.
sources:
  - >-
    CRA, Form T2042 (2025), Statement of Farming Activities (docs/cra-forms-2025/t2042-25e.pdf, confirmed from the
    PDF with pdftotext -layout), Chart A "Motor vehicle expenses": "Leasing (use Chart C below)", "Business use
    part: amount 1 ÷ amount 2 × amount 12" and "Allowable motor vehicle expenses: Add amounts 13 to 15 (enter this
    total on line 9819 of Part 4)"; Chart C "Eligible leasing cost for passenger vehicles".
  - >-
    CRA, Form T2121 (2025), Statement of Fishing Activities (docs/cra-forms-2025/t2121-25e.pdf, confirmed from the
    PDF with pdftotext -layout), Chart A "Motor vehicle expenses": "Leasing (use Chart C below)", "Business use
    part: amount 1 ÷ amount 2 × amount 12" and "Allowable motor vehicle expenses: Add amounts 13 to 15 (enter this
    total on line 9281 of Part 4)"; Chart C "Eligible leasing cost for passenger vehicles".
  - >-
    CRA, Guide T4002 (2025), Self-employed Business, Professional, Commission, Farming, and Fishing Income
    (docs/cra-forms-2025/t4002-25e.pdf), printed page 55: "You can deduct costs you incur to lease a passenger
    vehicle you use to earn income."; printed page 55: "When you use a passenger vehicle to earn farming or
    fishing income, there is a limit on the amount of the leasing costs you can deduct."; printed page 53: "If
    you ... lease a passenger vehicle ... there may be a limit on the amounts you can deduct for ... leasing
    costs."
