# Return KY: Guide T4002's Rick (farm losses, printed page 94), a single Ontario resident whose main
# source of income is his farming business, reported on one Form T2042 for a full fiscal period (0 days
# entered). His farm loss before adjustments is $50,000; he adds back the optional inventory
# adjustment (OIA) of $15,000, giving a farm loss after adjustments of $35,000 ($50,000 - $15,000);
# with other income of $2,000 his farm loss for 2025 is $33,000. Farming is his main source of income,
# so the answer to "farming was neither your main source of income nor ..." is no (0) and the loss is
# not restricted.
#
# CRA's printed figures are the $50,000 loss before adjustments (T2042 line 9899, amount 4A), the
# $35,000 after adjustments (amount 4C, "Total of lines 9899, 9941, and 9942") and the $33,000 for 2025
# (the loss left once the other income is added: T1 total income, negative, here -$33,000.00). The loss
# is entered as fertilizers and lime (line 9662) of $50,000, the guide not naming a line; the OIA is
# line 9941; the other income is T1 line 13000 "Other income". The guide's "farm loss for 2025" is the
# loss before it is carried back or forward (T1 line 25200 non-capital losses is not modelled here).
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025 whose main source of income is farming, reported on one Form
  T2042 for a full fiscal period (0 days entered): fertilizers and lime of $50,000 and no farm income,
  so the net farm loss before adjustments (line 9899) is -$50,000; the optional inventory adjustment (line
  9941) is $15,000, so the loss after inventory adjustments (amount 4C) and the farming income on the
  return are -$35,000; the other income is $2,000 (T1 line 13000), so the total income is -$33,000.00,
  Guide T4002's Rick's farm loss for 2025.
sources:
  - >-
    CRA, Guide T4002 (2025), Self-employed Business, Professional, Commission, Farming, and Fishing Income
    (docs/cra-forms-2025/t4002-25e.pdf, confirmed from the PDF with pdftotext -layout), printed pages
    94 and 95, "Farm losses", the example of Rick: "Rick’s farming business, which is his main source
    of income, has a December 31 fiscal year-end. His farm loss before adjustments is $50,000. He wants
    to reduce his loss by the optional inventory adjustment (OIA)."; "Net farm loss before adjustments
    $ 50,000", "Optional inventory adjustment $ 15,000", "Other income $ 2,000"; "Farm loss before adjustments
    ($ 50,000)", "Add optional inventory adjustment $ 15,000", "Farm loss after adjustments ($ 35,000)",
    "Add other income $ 2,000", "Farm loss for 2025 ($ 33,000)".
  - >-
    CRA, Form T2042 (2025), Statement of Farming Activities (docs/cra-forms-2025/t2042-25e.pdf, confirmed
    from the PDF with pdftotext -layout), Part 5: line 9899 "Net income (loss) before adjustments", line
    9941 "Optional inventory adjustment included in the current year" and amount 4C "Net income (loss)
    after inventory adjustments: Total of lines 9899, 9941, and 9942".
