# Return MQ: Guide T4044, Part A column 3, the cost of a Class 10 vehicle that changed use (the Guide's
# own example: bought in 2018, worth $11,000 when it started being used for employment). Amounts are
# quoted decimal strings.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  Return MQ: Guide T4044 (2025), Part A "Column 3 - Cost of additions in the year", for one Class 10
  vehicle, on the salaried employee of Return MJ (employment income $50,000, other expenses of $6,000,
  all kilometres driven for employment). The car was owned for personal use, bought in 2018 for
  $19,000, and started being used for employment in 2025 ("a change in use"): "the amount you will
  enter in this column is the fair market value of the property at the time you start using the
  property for employment"; it is worth $11,000 then, so column 3 is $11,000, as the Guide's example
  gives. The Part A row holds the change in use answer and that fair market value; Part A prints no
  year or cost of the vehicle, so those are 0. The Guide gives the Class 10 maximum CCA rate as 30%;
  the claim is a chosen $1,650, which is 30% of half of the $11,000 of additions in the year (the
  half-year rule), the most the form allows, so line 25 is 1,650, line 3 is 1,650.00 and line 15 is
  7,650.00 (other expenses of $6,000 plus line 3), and T777 line 17 and T1 line 22900 are 7,650.00.
  Not pinned: the 2018 purchase price, which Part A does not use. Every other line is the engine's
  figure.
sources:
  - >-
    CRA, Guide T4044 (2025), Employment Expenses (docs/cra-forms-2025/t4044-25e.txt;
    https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t4044/t4044-25e.txt), "Part A - Classes 8,
    10, 54, and 55 property", "Column 3 - Cost of additions in the year": "If you owned property for personal use
    and then started using it for employment in 2025, there is a change in use. In most cases when
    this happens, the amount you will enter in this column is the fair market value of the property at
    the time you start using the property for employment." and "For example, you bought a car in 2018
    for $19,000. In 2025, you started using it for employment. By checking car dealerships and the
    newspapers, you determine its fair market value is $11,000. Therefore, you enter $11,000 in column
    3." The Class 10 rate: "The maximum CCA rate for this class is 30%."
  - >-
    CRA, Form T777 (2025), Statement of Employment Expenses (docs/cra-forms-2025/t777-25e.pdf, the
    only published copy; https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t777/t777-25e.pdf):
    "Add lines 1 to 14. = 15"; "Line 15 plus line 16. Enter this amount on line 22900 of your return.
    Total expenses = 17".
