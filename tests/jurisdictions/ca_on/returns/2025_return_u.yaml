# Return U: a self-employed filer, a 2025 Ontario resident, with no dependants, no
# employment income and net business income (T1 line 13500) of $50,000, on which the CPP
# contributions (Schedule 8 Part 4) and, through an agreement with the Canada Employment
# Insurance Commission, the EI premiums (Schedule 13) are paid as a self-employed person.
# The net self-employment income (line 27) is all of total income (line 15000), $50,000.00.
# Computed from the CPP months (Schedule 8 box A) of 12, by the monthly proration table, to
# the maximum pensionable earnings, the maximum amount subject to second additional
# contributions, the additional maximum pensionable earnings and the maximum basic
# exemption; from the net business, professional, commission, farming and fishing income,
# summed, to the net self-employment income (line 27); from it and the net partnership
# income (line 12200), the pensionable net self-employment earnings (Part 4 line 1), from
# those and the earnings elected on Form CPT20, not below zero, the CPP pensionable earnings
# (line 3), the lesser of those and the additional maximum, line 4, less the maximum
# pensionable earnings, not below zero, the earnings subject to second additional
# contributions (line 6), line 4 less line 6, not below zero, line 7, and that less the
# basic exemption, not below zero, the earnings subject to base and first additional
# contributions (line 9); from those, by Schedule 8's rates of 9.9%, 2% and 8%, each at most
# its maximum, to the base (line 10), first additional (line 11) and second additional (line
# 12) contributions, the last two summed to line 13, and line 10 and line 13 summed to the
# contributions payable (line 14); from line 10 at 50% to the base CPP contributions (line
# 15), and that with line 13 to the deduction (line 17); each of lines 14, 15 and 17 counted
# once, for the one Part 4 completed, to the CPP contributions payable (line 42100), the
# base CPP contributions (line 31000) and the deduction (line 22200) on self-employment
# income; from the net partnership income and the net self-employment income, not below
# zero, plus the earnings of a controlled corporation and the exempt self-employment income,
# to the net self-employment income of Schedule 13 (line 4); from the maximum insurable
# earnings (line 5) less the insurable earnings (line 6), not below zero, line 7, and line
# 4, the lesser of them to the earnings subject to premium (line 8), and from those, at
# 1.64%, at most $1,077.48, to the premiums (line 9), counted once, for the one agreement,
# to the EI premiums on self-employment (line 31217) and the EI premiums payable on it (line
# 42120). The deduction joins the deductions from total income (line 23300), lowering net
# income (line 23600) and so every line from it on; the base CPP contributions and EI
# premiums on self-employment income join the credit amounts of the T1 (line 33500); the
# contributions payable and the premiums payable join the net federal tax and the Ontario
# tax in the total payable (line 43500). There is no capital gain, employment income, unused
# or new RRSP contribution, union dues, child care expense or dependant. Not yet computed,
# so not in this file: the net self-employment income in total income (T1 lines 28 and
# 15000), Part 5 of Schedule 8 (employment income and self-employment income together), the
# net partnership income's own inputs, any deduction from net income, the social benefits
# repayment and capital losses. The deductions other than line 22200, the donations and
# gifts (Schedule 9, the top-up tax credit, ON428 lines 47 to 49) and the other T1 lines
# this return does not reach are chosen $0 inputs, computed all the same. Schedule 8 Part 4
# is completed (count 1) and the agreement with the Commission is in place (count 1). Line
# 82 (the provincial foreign tax credit) is not triggered by this return, and the qualifying
# donations for line 87 (the community food program donation tax credit for farmers) are a
# chosen $0, so line 87 is $0 and line 88 is line 86. The filer's self-employment and
# agreement with the Commission are to be confirmed. Amounts are quoted decimal strings,
# never floats; counts are quoted digit strings. Every output the CA-ON manifest declares
# must appear under `expected`; intermediate lines may be listed and are then checked too.
# Ontario political contributions (ON479 line 15, line 63100) are a chosen $0, so Worksheet
# ON479's line 16 is $0 (column 1 applies).
jurisdiction: CA-ON
tax_year: 2025
description: >-
  An Ontario resident for all of 2025, with no spouse or common-law partner at any time in
  2025 and no dependant, whose only income is self-employment income: net business income
  (T1 line 13500) of $50,000, entered as a T2125 with gross sales (amount 3A) of $50,000 and
  no adjustments, other income, cost of goods sold, expenses, partnership amounts or
  business-use-of-home expenses, so T2125 line 9946 is 50,000 - 0 = $50,000, with no
  professional, commission, farming or fishing income, so the net self-employment income
  (line 27, "Add lines 22 to 26") is 50,000 + 0 + 0 + 0 + 0 = $50,000. Line 28 is line 21
  (all 0) plus line 27, and total income (line 15000) adds line 27 to the other income
  lines, so it is $50,000.00; there is no employment income, capital gain, dividend or other
  income, so taxable capital gains (line 12700) are $0. The CPP months (Schedule 8 box A)
  are the 12 of a full year, the row "Number of months: 12" of the monthly proration table:
  the maximum pensionable earnings (line B) $71,300.00, the maximum amount subject to second
  additional contributions (line C) $9,900.00, the additional maximum pensionable earnings
  (line D) $81,200.00 and the maximum basic exemption (line E) $3,500.00. Schedule 8 Part 4
  is completed (count 1): the net partnership income (line 12200) is $0, so the pensionable
  net self-employment earnings (line 1) are 0 + 50,000 = $50,000; with no earnings elected
  on Form CPT20 (line 2, $0), the CPP pensionable earnings (line 3) are $50,000; line 4, the
  lesser of $81,200.00 and $50,000, is $50,000; line 5 is $71,300.00; line 6 is 50,000 -
  71,300.00, negative, so $0, and line 7 is 50,000 - 0 = $50,000; line 8 is $3,500.00, so
  line 9 is 50,000 - 3,500.00 = $46,500.00. The required base contributions (line 10) are
  46,500.00 x 9.9% = $4,603.50 (below the $6,712.20 maximum), the first additional (line 11)
  46,500.00 x 2% = $930.00 (below $1,356.00) and the second additional (line 12) 0 x 8% = $0
  (below $792.00); line 13 is 930.00 + 0 = $930.00 and the CPP contributions payable (line
  14, and line 42100) are 4,603.50 + 930.00 = $5,533.50. The base CPP contributions on
  self-employment income (line 15, and line 31000) are 4,603.50 x 50% = 2,301.75, half-up to
  the cent: $2,301.75; line 16 is $930.00 and the deduction (line 17, and line 22200) is
  2,301.75 + 930.00 = $3,231.75. Schedule 13 is completed through an agreement with the
  Canada Employment Insurance Commission (count 1): line 1 is 0 + 50,000 = $50,000, lines 2
  and 3 (the earnings of a controlled corporation and the tax-exempt self-employment income)
  are $0, so line 4, the net self-employment income, is $50,000; line 5 is $65,700.00, line
  6 (the total EI insurable earnings from T4 slips) is $0 and line 7 is 65,700.00 - 0 =
  $65,700.00; line 8, the lesser of $50,000 and $65,700.00, is $50,000; line 9 is 50,000 x
  1.64% = $820.00 (below the $1,077.48 maximum), the EI premiums on self-employment (lines
  31217 and 42120). With no employment income the CPP contributions (Schedule 8 line 11 and
  following) and the EI premiums (line 31200) through employment are $0. The RRSP lines are
  all $0, with a chosen deduction limit of $0, and there are no union dues and no child care
  expenses (T1 line 21400, $0). There is no RPP deduction (line 20700), FHSA deduction (line
  20805, the FHSA inputs being $0), elected split-pension deduction (line 21000), UCCB
  repayment (line 21300), business investment loss (line 21700, the T1436 inputs being $0),
  deductible support payments (line 22000), carrying charges, interest expenses or other
  expenses (line 22100, the Federal Worksheet's lines 1 to 3 being $0), exploration and
  development expenses (line 22400) or other deductions (line 23200): each $0. Total
  deductions (line 23300) are the deduction on self-employment income alone, $3,231.75, so
  the net income before adjustments (line 23400) is 50,000.00 - 3,231.75 = $46,768.25, and
  net income (line 23600) is that same $46,768.25 (it is not below zero and line 23500 is 0,
  the chart not applying); the unused FHSA contributions carried forward are $0. There are no
  deductions from net income (lines 24400 to 25600), so taxable income (line 26000) is
  $46,768.25, in the lowest federal bracket and the first Ontario bracket. The
  non-refundable credit amounts are the basic personal amount (federal line 30000 $16,129,
  since net income is $177,882 or less; Ontario ON428 line 58040 $12,747), the base CPP
  contributions on self-employment income (line 31000) of $2,301.75 and the EI premiums on
  it (line 31217) of $820.00, and no amount for an eligible dependant or for infirm
  children, no Canada employment amount (no employment income) and no base CPP contributions
  or EI premiums through employment: line 33500 of 16,129 + 2,301.75 + 820.00 = $19,250.75
  federally, and ON428 line 58800 of 12,747 + 2,301.75 + 820.00 = $15,868.75 (ON428 lines
  58280 and 58305 copy lines 31000 and 31217; the age amount, line 58080, and the spouse or
  common-law partner amount, line 58120, being $0). The rate is applied once to each total:
  14.5% federally (line 33800) is 19,250.75 x 14.5% = 2,791.35875, half-up to the cent:
  $2,791.36, the credit amounts at the credit rate (line 115), and 5.05% for Ontario (ON428
  line 58840) is 15,868.75 x 5.05% = 801.371875, half-up to the cent: $801.37. The return
  makes no donations and no gifts (Schedule 9 lines 1 to 4, 11 and the gift charts, each a
  chosen $0, to be confirmed): the total eligible amount of charitable donations (line 5) is
  $0; the limit on it (line 9) is the lesser of the net income, $46,768.25, and line 8,
  which is 75% of the net income (line 6), $27,576.19, plus 25% of $0 (line 7), $0.00:
  $27,576.19; so the donations claimed (line 10) are $0 and line 12 is $0. Line 13 is the
  lesser of $0 and $200: $0; line 14 and line 16 are $0; the taxable income of $46,768.25 is
  less than the income threshold of $253,414.00 (line 18), so line 19 is $0 and lines 20, 21
  and 22 are $0.00; the allowable donations (line 23, T1 line 34900) are $0.00. The top-up
  tax credit (Federal Worksheet, T1 line 34990): line 1 is the $2,791.36 of line 33800 and
  line 2 the $0.00 of Schedule 9 line 22, so line 3 is $2,791.36, less $8,319.38 (line 4) is
  negative, so line 5 is $0 and line 7, 3.45% of it, is $0.00; the credit is $0. The federal
  non-refundable tax credits (T1 line 35000) are the credit amounts at the credit rate (line
  115) plus the donations and gifts (line 116) plus the top-up tax credit (line 117):
  $2,791.36 + $0.00 + $0.00 = $2,791.36. On ON428 the same Schedule 9 lines give the
  donations and gifts credit: lines 47 and 48 are 5.05% of the $0 of Schedule 9 line 13 and
  11.16% of the $0 of line 14, $0.00 each, and line 49 (line 58969) is $0.00, so the Ontario
  non-refundable tax credits (line 50, line 61500) are line 46 plus line 49, $801.37 + $0.00
  = $801.37. The federal tax on taxable income is 46,768.25 x 14.5% = 6,781.39625, half-up
  to the cent: $6,781.40, and the Ontario tax on taxable income is 46,768.25 x 5.05% =
  2,361.796625, half-up to the cent: $2,361.80; each taken off its non-refundable tax
  credits, not below zero: $3,990.04 and 2,361.80 - 801.37 = $1,560.43. The Ontario surtax
  (ON428 line 68) is $0, as the Ontario tax after credits is below $5,710, so the Ontario
  tax with surtax (line 69) is $1,560.43. With no dividends, Worksheet ON428's lines A and B
  are $0, so the Ontario dividend tax credit (line 57, line 61520) and line 70 are $0, and
  line 71 (which is line 73) is $1,560.43. With no dependent children and no dependants
  (ON428 lines 75 and 76), the Ontario tax reduction amounts (line 77) are the basic
  reduction of $294.00 (line 74); twice them, $588.00 (line 78), less the Ontario tax after
  the dividend credit ($1,560.43) is negative, so the Ontario tax reduction (line 80) is $0
  and the Ontario tax after the reduction (line 81) is $1,560.43. The LIFT credit (ON428
  line 85, Schedule ON428-A) is 5.05% of employment income, $0, at most $875, less 5% of net
  income over $32,500, $713.41: negative, so $0, and the Ontario tax after it (line 86) is
  $1,560.43. With chosen qualifying donations of $0, the community food program donation tax
  credit for farmers (ON428 line 87) is 25% x $0 = $0 and line 88 is $1,560.43. The Ontario
  health premium (ON428 line 89) is read from its chart on taxable income: $46,768.25 is
  more than $38,500 but not more than $48,000 (row 5), so the premium is $450, and the
  Ontario tax (line 90) is $1,560.43 + $450.00 = $2,010.43. On the T1, the net federal tax
  (line 42000) is the federal tax after credits, $3,990.04, and the total payable (line
  43500) is it plus the CPP contributions payable on self-employment income (line 42100,
  $5,533.50), the EI premiums payable on it (line 42120, $820.00) and the Ontario tax (line
  42800), 3,990.04 + 5,533.50 + 820.00 + 2,010.43 = $12,353.97. The Canada workers benefit
  (line 45300, Schedule 6) is $0: the working income is the self-employment profit of 50,000.00
  (Schedule 6 line 3; the employment, other employment and scholarship income are 0), so 27% of
  the 47,000.00 over $3,000 is above the $1,633 maximum, which is the amount before the
  reduction, and the reduction of 2,986.99 (line 27, below) is more than that, so 0. The income
  tax deducted (line 43700) is a
  chosen $0, so the total credits (line 48200) are $0 + $0 + $0 = $0 and the refund or
  balance owing (line 167) is the total payable less the total credits, $12,353.97 - $0 =
  $12,353.97: positive, so a balance owing (line 48500). Every amount computed from a rate,
  fraction, amount or chart on the forms is rounded half-up to the cent, each line being a
  dollars-and-cents box; here that changes the federal tax on taxable income, the Ontario
  tax on taxable income, both forms' non-refundable tax credits, the health premium and the
  lines that follow from them. The lines that only add, subtract, compare or choose take
  amounts already in cents, so the balance owing is in cents too. The age amount (line
  30100), the spouse or common-law partner amount (line 30300) and the Canada caregiver
  amount for a spouse or common-law partner (line 30425) are each $0: the filer is taken as
  born in 1961 or later (the count of filers born in 1960 or earlier, line 78, is 0), claims
  no spouse amount (count 0) and has no spouse eligible for the Canada caregiver amount
  (line 51090, count 0), and the spouse's net income entered is $0 (to be confirmed). They
  are computed all the same (the federal age amount before the count is 9,028.00 less 15% of
  the net income over 45,522.00, 1,246.25 x 15% = 186.9375, rounded half-up to the cent:
  186.94, so 8,841.06) and claimed for 0, so the totals of credit amounts are those without
  them. ON428's age amount (line 58080, Worksheet ON428) and spouse or common-law partner
  amount (lines 11 to 13, line 58120) are each $0, for the same counts. They are computed
  all the same (the worksheet's line 4 is the net income over $46,330, $0.00, line 6 is 15%
  of it, $0.00, and line 7 is $6,223.00; ON428 line 13 is the $11,905.00 base less the
  spouse's net income of $0, at most $10,823.00) and claimed for 0, so ON428's total of
  credit amounts is as without them.
