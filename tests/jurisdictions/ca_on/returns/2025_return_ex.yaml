# Return EX: a 2025 Ontario resident with two Form T2125 statements and two Form T776 statements that
# reach the branches no earlier return does: a business with the GST/HST quick method, reserves,
# other income, a recapture and a terminal loss of capital cost allowance, a cost of goods sold, a
# minister's allocation of the immediate expensing limit and a business-use-of-home claim; a
# professional partnership with other amounts deductible and a business-use-of-home claim above the
# income that limits it (an amount carried forward); a rental property with a personal portion and a
# terminal loss; and a rental partnership. Net business income $48,528.00, net rental income
# $25,900.00, total income $74,428.00, a balance owing of $13,824.65 (the total payable of $14,224.65
# less the journalism labour tax credit of $400 on line 162, the amount 5B of statement 2).
# Every figure is derived from the form lines by a calculation of its own (not the engine's) and the engine agrees on every
# listed line; Return EY takes the same branches through the Form T2042 and Form T2121 statements.
# Amounts are quoted decimal strings, never floats; counts are quoted digit strings. A line that is
# not listed under `expected` computes to 0 where the form is the return's, and is not checked where
# it is not.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025, resident in Canada throughout 2025, aged 18 or older
  at the end of 2025, with 12 months of CPP (Schedule 8 box A), Schedule 8 Part 4 not completed and
  no agreement for EI (as Return BB), so no CPP contributions or EI premiums are computed; every
  figure is a chosen one (the meals and entertainment entered are the allowable part). The second
  additional CPP earnings maximum on the return, 9,900.00, is 81,200.00 - 71,300.00 and the immediate
  expensing limit without a minister's allocation is the $1.5 million of Area A endnote 5. Four statements.
  T2125 statement 1, a business (line code 1) of a sole proprietor. Part 3A: amount 3A (gross sales
  with HST) 113,000 less amount 3B (the HST in it) 13,000 is amount 3C 100,000. Quick method: amount
  3D (HST collected on eligible sales) 13,000 less amount 3E (HST remitted, (100,000 + 13,000) x
  4.4% = 4,972.00, a chosen rate entered as the form takes it) 4,972 is amount 3F 8,028, so amount
  3G, line 8000, is 100,000 + 8,028 = 108,028. Area A (the classes below): the recapture of Class 8
  and the terminal loss of Class 10 are worked after the CCA claim. Part 3C: line 8290 (reserves
  deducted last year) 2,000; line 8230 is the other income 500 plus the recapture 4,000 (endnote 3),
  4,500; amount 3O is 2,000 + 4,500 = 6,500 and line 8299 is 108,028 + 6,500 = 114,528 (T1 line
  13499). Part 3D: amount 3P 114,528; amounts 3Q to 3U 8,000 + 30,000 + 6,000 + 4,000 + 1,000 =
  amount 3V 49,000; line 8500 (closing inventory) 9,000; line 8518 (cost of goods sold) 49,000 -
  9,000 = 40,000; line 8519 (gross profit) 114,528 - 40,000 = 74,528 (amount 4A). Area A, per class
  (the rates are Guide T4002's: Class 8 20%, Class 10 30%, Class 14.1 5%, Class 50 55%). Class 8:
  column 2 3,000, column 5 7,000, so column 7 is 3,000 + 0 - 7,000 = (4,000), negative: a
  recapture of 4,000, no claim and 0 at the end of the year. Class 10: column 2 3,500, column 5
  1,000, column 7 2,500, positive with no property left in the class: a terminal loss of 2,500
  (line 9270), no claim and 0 at the end of the year. Class 14.1: column 2 20,000, column 7
  20,000, column 18 0, column 19 20,000; the maximum is 20,000 x 5% = 1,000.00 and 1,000 is
  claimed; column 22 is 19,000. Class 50: column 2 5,000, column 3 2,000, column 7 7,000; column
  18 is one half of 2,000, 1,000.00; column 19 is 7,000 - 1,000 = 6,000.00; the maximum is 6,000 x
  55% = 3,300.00 and 3,300 is claimed; column 22 is 7,000 - 3,300 = 3,700. Amount ii is 1,000 +
  3,300 = 4,300, and with a personal part and a business-use-of-home CCA of a chosen 0 each, line
  9936 is 4,300. Part 4: advertising 1,500, meals and entertainment 900, insurance 1,200, office
  expenses 800, professional fees 2,500, rent 6,000 and utilities 1,500 (14,400); line 9270 is
  the other expenses 300 plus the terminal loss 2,500, 2,800; line 9936 is 4,300; line 9368 is
  14,400 + 4,300 + 2,800 = 21,500 and line 9369 is 74,528 - 21,500 = 53,028. Part 5: no partner
  (count 0), so amount 5A is 53,028, amounts 5B, 9974 and 6A to 6E are 0 and amount 5D is 53,028.
  Part 7: amounts 7A to 7G 900 + 700 + 300 + 400 + 1,800 + 1,200 + 200 = 5,500 (7H); amount 7I
  1,500, so 7J is 4,000; amount 7K 0 and 7L (carried forward from the previous year) 500, so 7M
  is 4,500; amount 7N is 53,028; 7O is 0 and 7P is the lesser of 4,500 and 53,028, 4,500 (line
  9945). Line 9946 is 53,028 - 4,500 = 48,528 (T1 line 13500). Area G: the minister allocated a
  chosen 1,100,000 (count 1), so the immediate expensing limit is that and not 1,500,000; no
  class has DIEP additions, so nothing is expensed immediately.
  T2125 statement 2, a professional partnership (line code 2): no gross income and no expenses of
  its own (the partner enters the amount from the T5013 slip). Part 5: amount 5A is the T5013 slip
  amount 18,000 (count 1); amount 5B (journalism labour tax credit) 400 and line 9974 (GST/HST
  rebate for partners) 350; amount 5C is 18,000 + 400 + 350 = 18,750. Part 6: amounts 6A to 6E 600 +
  450 + 300 + 200 + 100 = 1,650 (amount 6F, line 9943); amount 5D is 18,750 - 1,650 = 17,100. Part
  7: amounts 7A to 7G 3,000 + 2,500 + 600 + 1,200 + 4,000 + 3,000 + 700 = 15,000 (7H); amount 7I
  2,000, so 7J is 13,000; amount 7L 5,000, so 7M is 18,000; amount 7N is 17,100; amount 7O (the
  amount carried forward) is 18,000 - 17,100 = 900; amount 7P is the lesser of 18,000 and
  17,100, 17,100 (line 9945). Line 9946 is 17,100 - 17,100 = 0 (T1 line 13700).
  T776 statement 1, a sole owner's rental: three units with gross rents of 36,000 (line 8141, none
  short-term) and other income (line 8230) 600, so line 8299 is 36,600. Expenses: advertising 400,
  insurance 1,800, interest and bank charges 5,000, office expenses 200, professional fees 700,
  repairs and maintenance 1,500, property taxes 3,200 and utilities 2,400, amount A 15,200. The
  personal portion (line 9949) is 300 of the insurance, 400 of the property taxes and 600 of the
  utilities, 1,300. Amount 1 is 15,200 - 1,300 - 0 = 13,900 (no short-term portion) and line 9369
  is 36,600 - 13,900 = 22,700. No co-owner (count 0): amount 2 is 22,700, line 9945 is 0, amount
  3 is 22,700; line 9947 (recapture) is 0 and amount 4 is 22,700. Area A (the rates are Guide
  T4036's: Class 1 4%, Class 8 20%): Class 1, column 2 100,000, column 7 100,000, maximum 100,000 x
  4% = 4,000.00, claim 4,000, column 22 96,000; Class 8, column 2 2,400, column 5 1,500, column 7
  900, positive with no property left in the class: a terminal loss (line 9948) of 900, no claim,
  0 at the end of the year. Amount 5 is 22,700 - 900 = 21,800. Line 9936 is 4,000 (a chosen 0 of
  personal part and business-use-of-home CCA), which is less than the 21,800 that limits it, so
  amount 6, line 9946, is 21,800 - 4,000 = 17,800 (T1 line 12600). The minister allocated a chosen
  800,000 (count 1), the immediate expensing limit.
  T776 statement 2, a rental partnership: no rents or expenses of its own; amount 7 is the T5013
  slip amount 9,000 (count 1), line 9974 250 and line 9943 1,150, so line 9946 is 9,000 + 250 -
  1,150 = 8,100 (T1 line 12600). The two statements add to 17,800 + 8,100 = 25,900.
  T1 (5006-R): line 13499 is 114,528 (statement 1 line 8299; statement 2 has no gross); lines 13500
  and 13700 are 48,528 and 0, so line 27 is 48,528 + 0 + 0 + 0 + 0 = 48,528; line 12600 is
  25,900. Total income (line 15000) is 48,528 + 25,900 = 74,428.00, which is net income and
  taxable income, there being no deduction. Federal tax (Part A, column 2): line 72 is 74,428.00 -
  57,375.00 = 17,053.00, times 20.5% is 3,495.865, rounded half-up to the cent 3,495.87, plus
  8,319.38 is 11,815.25. The basic personal amount is 16,129.00 (net income is at or below
  177,882) and 16,129.00 x 14.5% = 2,338.705, rounded half-up 2,338.71; the federal tax after
  credits is 11,815.25 - 2,338.71 = 9,476.54. Ontario (ON428 Part A, column 2): 74,428.00 -
  52,886.00 = 21,542.00 x 9.15% = 1,971.093, rounded 1,971.09, plus 2,670.74 is 4,641.83; the
  basic personal amount 12,747.00 x 5.05% = 643.7235, rounded 643.72; the Ontario tax after
  credits is 3,998.11, below the first surtax threshold of 5,710 (no surtax); twice the basic
  reduction, 588.00, less 3,998.11 is below 0, so there is no tax reduction; there is no
  employment income, so no LIFT credit. The Ontario health premium (row 9, more than 72,600 and not more
  than 200,000) is 750, so the Ontario tax (line 42800) is 3,998.11 + 750 = 4,748.11. The total
  payable is 9,476.54 + 4,748.11 = 14,224.65. Line 162 (47555) is the journalism labour tax credit
  of $400, the amount 5B of T2125 statement 2, a credit against it, so the balance owing (line
  48500) is 14,224.65 - 400.00 = 13,824.65.
sources:
  - >-
    CRA, Form T2125 (2025), Statement of Business or Professional Activities
    (docs/cra-forms-2025/t2125-25e.pdf, a PDF quote accepted 2026-10-19;
    https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2125/t2125-25e.pdf). Part 3A: "Gross
    sales, commissions, or fees (include GST/HST collected or collectible)", "GST/HST, provincial
    sales tax, returns, allowances, discounts, and GST/HST adjustments (included in amount 3A)",
    "Subtotal: Amount 3A minus amount 3B", "GST/HST collected or collectible on sales, commissions,
    and fees eligible for the quick method", "Subtotal: Amount 3D minus amount 3E", "Adjusted gross
    sales: Amount 3C plus amount 3F (enter on line 8000 of Part 3C)". Part 3C: "Reserves deducted
    last year", "Other income (specify)", "Subtotal: Line 8290 plus line 8230", "Gross business or
    professional income: Line 8000 plus amount 3O". Part 3D: "Subtotal: Add amounts 3Q to 3U.",
    "Cost of goods sold: Amount 3V minus line 8500", "Gross profit (or loss): Amount 3P minus line
    8518". Part 4: "Total expenses: Total of amounts 4B to 4V", "Net income (loss) before
    adjustments: Amount 4A minus line 9368". Part 5: "Total: Amount 5A plus amount 5B plus line
    9974", "Net income (loss) after adjustments: Amount 5C minus line 9943", "Your net income
    (loss): Amount 5D minus line 9945". Part 6: "Total other amounts deductible from your share of
    the net partnership income (loss): Add amounts 6A to 6E". Part 7: "Subtotal: Add amounts 7A to
    7G.", "Subtotal: Amount 7H minus amount 7I", "Subtotal: Add amounts 7J to 7L.",
    "Business-use-of-home expenses available to carry forward: Amount 7M minus amount 7N (if
    negative, enter "0")", "Allowable claim: Amount 7M or 7N above, whichever is less (enter your
    share of this amount on line 9945 of Part 5)".
  - >-
    CRA, Form T2125 (2025), Area A endnote 3 (same file): "If you have a negative amount in column
    7, add it to income as a recapture in Part 3C on line 8230. If no property is left in the class
    and there is a positive amount in this column, deduct the amount from income as a terminal loss
    in Part 4 on line 9270. Recapture and terminal loss do not apply to a Class 10.1 property unless
    it is a DIEP." Endnote 5: "the immediate expensing limit, which is equal to one of the
    following, whichever is applicable: $1.5 million, if you are not associated with any other
    eligible person or partnership (EPOP) in the tax year ... any amount allocated by the minister
    under subsection 1104(3.4) of the Regulations".
  - >-
    CRA, Form T776 (2025), Statement of Real Estate Rentals (docs/cra-forms-2025/t776-25e.txt;
    https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t776/t776-25e.txt): "Line 8230: Other
    income (for example, premiums and leases, sharecropping)"; "Line 8299: Total gross rental income
    ... (line 8141 plus line 8230)"; "Line 9949: Total for personal portion"; "Line 1: Deductible
    expenses (amount A minus line 9949 minus line 9366)"; "Line 9369: Net income (loss) before
    adjustments (total gross rental income from line 8299 minus deductible expenses from amount 1)";
    "Line 4: Subtotal (amount 3 plus line 9947)"; "Line 9948: Terminal loss"; "Line 5: Subtotal
    (amount 4 minus line 9948)"; "Line 6: Net income (loss) (amount 5 minus line 9936)"; "Line 7:
    Partners: your share of amount 6, or the amount from your T5013 slip, Statement of Partnership
    Income"; "Line 9974: Partners: GST/HST rebate for partners received in the year"; "Line 9943:
    Partners: other expenses of the partner"; "Line 9946: Your net income (loss): For sole
    proprietors or co-owners, enter the result from amount 6. For partnerships, enter the result
    from amount 7 plus line 9974 minus line 9943. Enter this amount on line 12600 of your income tax
    and benefit return". Note 3: "If you have a negative amount in column 7, add it to income as a
    recapture under "Recaptured capital cost allowance" on line 9947. If no property is left in the
    class and there is a positive amount in this column, deduct the amount from your income as a
    terminal loss under "Terminal loss" on line 9948."; Note 5: "any amount allocated by the
    minister under subsection 1104(3.4) of the Regulations".
  - >-
    CRA, Guide T4002, Self-employed Business, Professional, Commission, Farming, and Fishing Income
    (2025; docs/cra-forms-2025/t4002-25e.pdf), the class headings and rates: "Class 8 (20%)", "Class
    10 (30%)", "Class 14.1 (5%)" and "Class 50 (55%)": "Include in Class 50 with a CCA rate of 55%
    property acquired after March 18, 2007, that is general-purpose electronic data processing
    equipment and systems software for that equipment". "Column 18 – Adjustment for current-year
    additions subject to the half-year rule": the net first-year additions are halved. CRA, Guide
    T4036, Rental Income (2025; docs/cra-forms-2025/t4036-25e.pdf), "Class 1 (4%)" and "Class 8
    (20%)".
  - >-
    CRA, "T1-2025 Ontario edition" return (form 5006-R, docs/cra-forms-2025/5006-r-25e.txt,
    confirmed 2026-10-19), Part A "Federal tax on taxable income", Column 2 "Line 26000 is more than
    $57,375 but not more than $114,750": "Line 70: Amount from line 26000"; "Line 71: 57,375.00";
    "Line 72: Line 70 minus line 71 (cannot be negative)"; "Line 73: Rate 20.5%"; "Line 74: Line 72
    multiplied by the percentage from line 73"; "Line 75: 8,319.38"; "Line 76: Line 74 plus line 75
    Federal tax on taxable income". Column 1 "Rate 14.5%" gives the rate of the non-refundable
    credits (Return BB).
  - >-
    CRA, Form 5006-C (Ontario Form ON428, 2025; docs/cra-forms-2025/5006-c-25e.txt), Part A "Ontario
    tax on taxable income": column "Line 1 is more than $52,886 but not more than $105,775", "Line
    5: Rate 9.15%", "Line 7: 2,670.74", "Line 8: Line 6 plus line 7 Ontario tax on taxable income";
    "Complete lines 66 to 68 if the amount on line 65 is more than $5,710. If the amount is less
    than $5,710, enter "0" on line 68"; "Line 74: Basic reduction 294.00", "Line 78: Amount from
    line 77 above multiplied by 2", "Line 80: Line 78 minus line 79 (if negative, enter "0") Ontario
    tax reduction"; and "Line 89 - Ontario health premium", "Row 9: Taxable Income more than $72,600
    but not more than $200,000 Ontario health premium: $750".
