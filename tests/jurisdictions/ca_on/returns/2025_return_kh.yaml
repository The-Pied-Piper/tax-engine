# Return KH: Form T1032 line 31 and the transferring spouse's line 31400 when Note 1 recalculates
# lines 18 to 31, for a transferring spouse who is 66 and has RRIF payments among a pension of
# $3,500.00, with the spouse (the receiving spouse) under 65 and with no pension of their own. Every
# T1032 line is worked out by hand from the form text (docs/cra-forms-2025/t1032-25e.txt). The
# figures are chosen.
#
# This is the transferring spouse's return (the answer is 1). Line 1 (eligible pension income) is
# $3,500.00, which is line 11500 of this return, of which $300.00 are RRIF payments (Note 1 a));
# line 2 (box 128) $0.00; line 4 (box 17 of the T4A-RCA slips) $200.00 from a life annuity of a
# retirement compensation arrangement (the count is 1: this spouse is 66). The receiving spouse's
# line 32 is $0.00. Tax deducted: $500.00 in all (line 37), $400.00 of it on the pension (line 35).
# The elected split-pension amount is $1,600.00 on line 21000 of this return, and line 11600 is 0.
#
# Step 2, the maximum split-pension amount:
# Line 1: 3,500.00. Line 2: 0.00. Line 3 = 3,500.00 - 0.00 = 3,500.00.
# Line 4: 200.00. Line 5: 131,483.45. Line 6: line 3, 3,500.00.
# Line 7 = 131,483.45 - 3,500.00 = 127,983.45. Line 8 = the lesser of line 4 (200.00) and line 7
#   (127,983.45) = 200.00.
# Line 9: line 2, 0.00. Line 10: line 3, 3,500.00. Line 11: line 8, 200.00. Line 12 = 3,500.00 +
#   200.00 = 3,700.00. Line 13: 131,483.45. Line 14: line 12, 3,700.00. Line 15 = 131,483.45 -
#   3,700.00 = 127,783.45. Line 16 = the lesser of line 9 (0.00) and line 15 = 0.00.
# Line 17 = 3,500.00 + 200.00 + 0.00 = 3,700.00. The marital status did not change, so line 19 is
#   line 17, 3,700.00 (line 18, for the record: 12 / 12 x 3,700.00 = 3,700.00).
# Line 20: 50%. Line 21 = 3,700.00 x 50% = 1,850.00.
# Step 3: line 22 = 1,600.00 (line 21000 of this return), not more than line 21 (1,850.00), and
#   not more than the recalculated line 21 below (3,200.00 x 50% = 1,600.00).
#
# Step 4, Part A (this return's pension income amount):
# Line 23: 3,500.00. Line 24: 1,600.00. Line 25: line 8, 200.00. Line 26: line 17, 3,700.00.
#   Line 27 = 200.00 / 3,700.00. Line 28: 1,600.00. Line 29 = (200.00 / 3,700.00) x 1,600.00 =
#   86.486..., 86.49 to the cent. Line 30 = 1,600.00 - 86.49 = 1,513.51. Line 31 = 3,500.00 -
#   1,513.51 = 1,986.49.
# Part B, the conditions above line 33: line 32 (0.00) is less than $2,000; the receiving spouse
#   was under age 65 on December 31, 2025; the transferring spouse (this return) was age 65 or older
#   and received RRIF payments (Note 1 a)) of 300.00 in the year. So Note 1 is followed:
#   Subtract from line 1 the RRIF payments: 3,500.00 - 300.00 = 3,200.00 (they were not received as
#   a consequence of a death). The result, 3,200.00, is less than $4,000, so it is used as the
#   amount for line 17 to recalculate lines 18 to 31:
#   Line 17 = 3,200.00. Line 21 = 3,200.00 x 50% = 1,600.00; line 22 = 1,600.00, not more than it.
#   Line 26 (line 17) = 3,200.00. Line 27 = 200.00 / 3,200.00. Line 29 = (200.00 / 3,200.00) x
#   1,600.00 = 100.00. Line 30 = 1,600.00 - 100.00 = 1,500.00. Line 31 = line 23 less line 30 =
#   3,500.00 - 1,500.00 = 2,000.00.
#   Line 33 is the lesser of line 22 (1,600.00) and line 30 (1,500.00) = 1,500.00. Line 34 = 0.00 +
#   1,500.00 = 1,500.00 (the receiving spouse's line 31400 is the lesser of $2,000 and 1,500.00).
#   Enter on line 31400 of the transferring spouse's return, the lesser of $2,000 and the
#   recalculated line 31 (2,000.00) = 2,000.00.
#
# Step 5, the income tax deducted:
# Line 35: 400.00. Line 36 = line 35 x line 22 / line 17 = 400.00 x 1,600.00 / 3,700.00 =
#   172.972..., 172.97. Line 37: 500.00. Line 38: line 36, 172.97. Line 39 = 500.00 - 172.97 =
#   327.03 (line 43700 of this return).
#
# This return's lines: total income (line 15000) is the 3,500.00 of line 11500 and the 200.00 of the
# RCA annuity, 3,700.00; the elected 1,600.00 is deducted on line 21000, so net income is 2,100.00
# and taxable income 2,100.00. Line 31400 (the pension income amount) is the form's 2,000.00. The
# other lines `expected` lists follow from the engine's other forms, are not derived here and are
# not part of the T1032 worked example.
# Amounts are quoted decimal strings, never floats; counts are quoted digit strings.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  An Ontario resident for all of 2025 who is 18 or older at the end of 2025, with a spouse or
  common-law partner on December 31, 2025 (a chosen count of 1), the transferring spouse of a joint
  election to split pension income, aged 66, whose spouse is under age 65. Line 11500 is 3500.00
  (RRIF payments of 300.00 among them) and an RCA life annuity (line 4) is 200.00. The elected
  split-pension amount is 1600.00 on line 21000. Form T1032: line 17 is 3700.00, line 21 is 1850.00;
  the conditions above line 33 all apply, so Note 1 is followed: line 1 less the RRIF payments is
  3200.00, less than 4000.00, so lines 18 to 31 are recalculated with 3200.00 as line 17: line 29 is
  200.00 / 3200.00 x 1600.00 = 100.00, line 30 is 1500.00 and line 31 is 3500.00 - 1500.00 =
  2000.00, so line 31400 is the lesser of 2000.00 and 2000.00, 2000.00. Total income is 3700.00 and
  net income 2100.00. Every other figure is blank.
sources:
  - >-
    CRA, Form T1032 E (25), Joint Election to Split Pension Income, page 3, "Note 1: ... If the
    result is less than $4,000, use that result as the amount for line 17 to recalculate lines 18
    to 31. Enter on line 33 whichever is less: the amount from line 22 or line 30."
  - >-
    CRA, Form T1032 E (25), page 3: "Line 31: Line 23 minus line 30 =" and "Enter on line 31400
    of the transferring spouse's or common-law partner's return, whichever is less: $2,000 or the
    amount from line 31."
  - >-
    CRA, Form T1032 E (25), page 4: "Line 36: Amount from line 35 multiplied by Amount from line
    22 divided by Amount from line 17"; "Line 39: Line 37 minus line 38".
