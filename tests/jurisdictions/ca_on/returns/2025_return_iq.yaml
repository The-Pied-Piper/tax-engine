# Return IQ: Guide T4002's Sharon (restricted farm loss, "Restricted farm losses (partly
# deductible)", pp. 95-96). An Ontario resident with employment income of $30,000 and one Form
# T2042 (farming) statement with a net farm loss of $9,200 on line 9946, farming being neither her
# main source of income nor her main source of income in addition to a subordinate one (the
# return's answer is 1). She deducts the lesser of A $9,200 and B $2,500 + 50% x ($9,200 -
# $2,500) = $5,850, so T1 line 14100 is -$5,850.00 and her restricted farm loss is $3,350.00.
# Amounts are quoted decimal strings, never floats; counts are quoted digit strings.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025, resident in Canada throughout 2025, aged 18 or older at
  the end of 2025, with 12 months of CPP (Schedule 8 box A), Schedule 8 Part 4 not completed and no
  agreement for EI, as Return B; every figure is a chosen one. Employment income 30,000 with the
  CPP and EI inputs of Return B (enhanced CPP contributions 1% x (30,000 - 3,500) = 265.00). One
  T2042 statement, no partner, no Area A row and no business-use-of-home claim. Part 4: fertilizers
  and lime 9662 of 9,200 and no income, so lines 9898 and 9899 are 9,200 and -9,200, and line 9946
  is -9,200 (net farm loss A). The answer to "farming was neither your main source of income nor
  your main source of income in addition to some other subordinate source of income" is yes (1).
  The net farm loss is 9,200, which is less than 32,500, so the amount deductible from other income
  is the lesser of A 9,200 and B = 2,500 + 50% x (9,200 - 2,500) = 2,500 + 3,350 = 5,850: 5,850.
  The restricted farm loss is 9,200 - 5,850 = 3,350. The deductible amount, as a loss, is T1 line
  14100: -5,850.00. Total income is 30,000 - 5,850 = 24,150.00 and net income is 24,150.00 - 265.00
  (enhanced CPP contributions) = 23,885.00. The carry-forward of the restricted farm loss (T1 line
  25200) is not modelled.
sources:
  - >-
    CRA, Guide T4002 (2025), "Restricted farm losses (partly deductible)", pages 95 and 96
    (docs/cra-forms-2025/t4002-25e.pdf; confirmed from the PDF, no .txt published): "For tax years
    that end after March 20, 2013, the annual maximum deduction used in the calculation for
    restricted farm losses is $17,500. When your net farm loss is $32,500 or more, you can deduct
    $17,500 from your other income. The rest of your net farm loss is your restricted farm loss.
    When your net farm loss is less than $32,500, the amount you can deduct from your other income
    is the lesser of: A) your net farm loss for the year B) $2,500 plus 50% × (your net farm loss
    minus $2,500) The amount remaining is your restricted farm loss."; the example of Sharon: "In
    2025, she had employment income and a net farm loss of $9,200, which she calculated on line
    9946 of Form T2042."; "Therefore, B = ($2,500 + $3,350) = $5,850."; "she enters $5,850 on line
    14100 of her income tax return and deducts this amount from her other income in 2025. Her
    restricted farm loss is the amount that remains, which is $3,350 ($9,200 minus $5,850)."
  - >-
    CRA, Form T2042 (2025), Statement of Farming Activities (docs/cra-forms-2025/t2042-25e.pdf):
    "Your net income (loss): Amount 5C minus line 9945 (enter this amount on line 14100 of your
    income tax and benefit return)" (9946).

