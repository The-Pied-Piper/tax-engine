expected:
  # Hand derivation of the tax figures below from net income 23,885.00 (checked against the
  # engine's trace, step by step):
  #   Federal: 23,885 x 14.5% = 3,463.33, less the non-refundable credits on 19,403.75 (credit
  #     amounts at 15%, 2,813.54) = 649.79 federal tax.
  #   Ontario: 23,885 x 5.05% = 1,206.19, less the non-refundable credits on 14,550.75 (734.81) =
  #     471.38, which is `ca-on/ontario_tax_less_dividend_credit` (tax before the reduction).
  #     The trace then takes the Ontario tax reduction 2 x 294 - 471.38 = 116.62 off it (354.76),
  #     and the LIFT credit 875.00 (5.05% x 30,000 = 1,515, at most 875, no reduction below
  #     32,500 of income) off that: 354.76 - 875.00 is below 0, so the Ontario tax after the
  #     credits is 0.00. The 471.38 is therefore not payable as such; what Ontario adds to the
  #     total payable is the Ontario Health Premium alone.
  #   Ontario Health Premium: 6% x (23,885 - 20,000) = 233.10 (the 36,000 and higher steps do not
  #     apply).
  #   Total payable: 649.79 + 233.10 = 882.89.
  #   Canada Workers Benefit: 1,633.00 (single, no reduction at this income), a refundable credit.
  #   Refund: 1,633.00 - 882.89 = 750.11, so `ca/refund_or_balance_owing` is -750.11.
  ca-on/return:
    # Net farming income (T1 lines 14100 and 13900 as income) is a non-negative kind, a loss counts
    # 0; the loss of -5,850.00 is in the total income and in ca/farming_income below.
    - ca/net_farming_income: "0.00"
      ca/t4_cpp_pensionable_earnings_slip_checked: "30000.00"
      ca/total_income: "24150.00"
      ca/net_income: "23885.00"
      ca/net_income_before_adjustments: "23885.00"
      ca/other_payments_limit_income: "23885.00"
      ca/cpp_second_additional_earnings_maximum: "9900.00"
      ca-on/ontario_tax_less_dividend_credit: "471.38"
      ca/refund_or_balance_owing: "-750.11"
      ca-on/net_refund: "750.11"
  ca/t2042:
    # Line 9946 of the one statement, before any restriction.
    - ca/farming_income: "-9200.00"
  # The restricted farm loss, worked once on the net of the statements' line 9946.
  ca/farm_loss:
    - ca/farm_net_income_line_9946: "-9200.00"
      ca/farm_not_main_source_of_income_checked: "1"
      ca/farm_net_loss: "9200.00"
      ca/farm_restricted_loss_base_amount: "2500"
      ca/farm_restricted_loss_full_threshold: "32500"
      ca/farm_restricted_loss_annual_maximum: "17500"
      ca/farm_restricted_loss_percentage: "50"
      ca/farm_net_loss_less_base_amount: "6700.00"
      ca/farm_restricted_loss_half_of_excess: "3350.00"
      ca/farm_restricted_loss_amount_b: "5850.00"
      ca/farm_restricted_loss_lesser_of_a_and_b: "5850.00"
      ca/farm_net_loss_less_full_threshold: "-23300.00"
      ca/farm_loss_deductible: "5850.00"
      ca/farm_restricted_loss: "3350.00"
      ca/farm_restricted_loss_added_back: "3350.00"
      ca/farming_income: "-5850.00"
