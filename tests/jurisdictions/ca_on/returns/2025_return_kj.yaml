# Return KJ: Form T1032 line 33 and Note 1 with eligible veterans benefits (item e), taken from the
# box 128 amount of line 2, and only part of the payments received as a consequence of a death.
# Every T1032 line is worked out by hand from the form text (docs/cra-forms-2025/t1032-25e.txt, with
# Note 1 read from the CRA PDF of the form, page 3, because the .txt garbles its second bullet). The
# figures are chosen.
#
# This is the receiving spouse's return (the answer is 0), under 65 on December 31, 2025 (not born
# in 1960 or earlier). The transferring spouse is 66. The transferring spouse's figures are the
# form's inputs: line 1 (eligible pension income) $8,000.00; line 2 (box 128, eligible veterans
# benefits, Note 1 e)) $2,000.00; line 4 (box 17 of the T4A-RCA slips) $1,000.00 from an RCA life
# annuity (the count is 1: the transferring spouse is 66); RRIF payments (Note 1 a)) $3,000.00, of
# which $500.00 were received as a consequence of the death of a spouse in the year; line 35 (tax
# deducted on the pension) $800.00. Line 32 is $0.00. The elected split-pension amount is $2,000.00
# on line 11600 of this return, and line 21000 is 0.
#
# Step 2: Line 1: 8,000.00. Line 2: 2,000.00. Line 3 = 6,000.00. Line 4: 1,000.00. Line 5:
#   131,483.45. Line 6: 6,000.00. Line 7 = 125,483.45. Line 8 = the lesser of line 4 (1,000.00) and
#   line 7 = 1,000.00. Line 9: 2,000.00. Line 10: 6,000.00. Line 11: 1,000.00. Line 12 = 7,000.00.
#   Line 13: 131,483.45. Line 14: 7,000.00. Line 15 = 124,483.45. Line 16 = the lesser of line 9
#   (2,000.00) and line 15 = 2,000.00. Line 17 = 6,000.00 + 1,000.00 + 2,000.00 = 9,000.00. Line 19 =
#   line 17 (marital status did not change). Line 20: 50%. Line 21 = 4,500.00.
# Step 3: line 22 = 2,000.00, not more than line 21.
#
# Step 4, Part A: Line 23: 8,000.00. Line 24: 2,000.00. Line 25: line 8, 1,000.00. Line 26: line 17,
#   9,000.00. Line 27 = 1,000.00 / 9,000.00. Line 28: 2,000.00. Line 29 = 2,000.00 x 1,000.00 /
#   9,000.00 = 222.22. Line 30 = 2,000.00 - 222.22 = 1,777.78. Line 31 = 8,000.00 - 1,777.78 =
#   6,222.22. Line 31400 of the transferring spouse is the lesser of $2,000 and 6,222.22 = 2,000.00.
# Part B: line 32 = 0.00. The conditions above line 33 all apply: line 32 is less than $2,000, the
#   receiving spouse was under 65, and the transferring spouse was 65 or older and received amounts
#   a) to e): RRIF payments of 3,000.00 and eligible veterans benefits of 2,000.00 (the box 128
#   amount already entered on line 2, not entered again), 5,000.00 in all. So line 33 follows Note 1:
#   Subtract from line 1 the amounts a) to e) received, except the 500.00 received as a consequence
#   of the death of a spouse: 5,000.00 - 500.00 = 4,500.00; 8,000.00 - 4,500.00 = 3,500.00. The
#   result, 3,500.00, is less than $4,000, so it is the amount for line 17 to recalculate lines 18 to
#   31: Line 17 = 3,500.00. Line 22 = 2,000.00. Line 29 = 2,000.00 x 1,000.00 / 3,500.00 = 571.43.
#   Line 30 = 2,000.00 - 571.43 = 1,428.57. Line 33 is the lesser of line 22 (2,000.00) and line 30
#   = 1,428.57. (Had none of the death payments been left in, the result would be 3,000.00 and line
#   33 1,333.33; had all been left in, 8,000.00 and 1,777.78.)
#   Line 34 = 0.00 + 1,428.57 = 1,428.57. Enter on line 31400 of the receiving spouse's return the
#   lesser of $2,000 and 1,428.57 = 1,428.57.
#
# Step 5: Line 35: 800.00. Line 36 = line 35 x line 22 / line 17 = 800.00 x 2,000.00 / 9,000.00 =
#   177.78 (line 17 of Step 2, which Note 1 does not change for this line). Line 40: 0.00. Line
#   42 = 0.00 + 177.78 = 177.78, entered on line 43700 of this return.
#
# This return's lines: total income (line 15000) is the 2,000.00 of line 11600, net income 2,000.00
# and taxable income 2,000.00. Line 31400 is the form's 1,428.57. The other lines `expected` lists
# follow from the engine's other forms, are not derived here and are not part of the T1032 worked
# example. Amounts are quoted decimal strings, never floats; counts are quoted digit strings.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  An Ontario resident for all of 2025 who is 18 or older at the end of 2025, with a spouse or
  common-law partner on December 31, 2025, the receiving spouse of a joint election to split
  pension income, under age 65 on December 31, 2025. The transferring spouse is 66, with eligible
  pension income of 8000.00 (line 1) that includes eligible veterans benefits of 2000.00 (box 128,
  line 2), RRIF payments of 3000.00 of which 500.00 were received as a consequence of a death, and
  an RCA life annuity of 1000.00 (line 4). The elected split-pension amount is 2000.00 on line
  11600. Form T1032: line 17 is 9000.00 and line 21 is 4500.00; Note 1 applies: line 1 less the
  amounts a) to e) not received on a death is 3500.00, less than 4000.00, so lines 18 to 31 are
  recalculated with 3500.00 as line 17: line 29 is 571.43, line 30 is 1428.57 and line 33 is the
  lesser of line 22 (2000.00) and line 30, 1428.57. The tax deducted: line 36 is 800.00 x 2000.00 /
  9000.00 = 177.78. Total income is 2000.00. Every other figure is blank.
sources:
  - >-
    CRA, Form T1032 E (25), Joint Election to Split Pension Income, page 3 (Step 4 Part B): "If all
    of the following conditions apply, calculate line 33 according to the instructions in note 1:
    the amount on line 32 is less than $2,000 ... the receiving spouse or common-law partner was
    under age 65 on December 31, 2025 ... the transferring spouse or common-law partner was age 65
    or older and received any of the following amounts in the year: a) registered retirement income
    fund (RRIF), registered retirement savings plan (RRSP), or other annuity payments ..."
  - >-
    CRA, Form T1032 E (25), page 3, "Note 1: If all the above conditions apply, calculate the
    amount to enter on line 33 as follows: Subtract from line 1 any of the above amounts noted in
    a) through e) received by the transferring spouse or common-law partner in the year. ... If the
    result is $4,000 or more, enter on line 33 the amount from line 30. If the result is less than
    $4,000, use that result as the amount for line 17 to recalculate lines 18 to 31. Enter on line
    33 whichever is less: the amount from line 22 or line 30." (confirmed 2026-10-27 from the PDF;
    the .txt garbles the second bullet)
  - >-
    CRA, Form T1032 E (25), page 3: "Line 34: Line 32 plus line 33" and "Enter on line 31400 of the
    receiving spouse's or common-law partner's return, whichever is less: $2,000 or the amount from
    line 34."
