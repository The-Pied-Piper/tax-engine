# Return S: a 2025 Ontario resident with employment income of $50,000 who lived in a
# prescribed northern zone (Zone A) for 200 days and in a prescribed intermediate zone (Zone
# B) for 165 days, claims the basic and the additional residency amount for her 200 days in
# Zone A (as the only person in her household claiming the basic residency amount), and for
# Zone B the basic residency amount less $100.00 of non-taxable board and lodging benefits
# at a special work site; she took two trips from Zone A for which she uses her taxable
# travel benefit, and her spouse two from Zone B for which she allocates his $1,200 standard
# amount. Employment income is below the EI maximum insurable earnings ($65,700) and the CPP
# first earnings ceiling ($71,300), so the CPP contributions and EI premiums are the rates'
# arithmetic and there is no second additional CPP contribution. Computed from the income
# lines to total income, $50,000; from employment income, by Schedule 8's three contribution
# tiers, to the base, first additional and second additional CPP contributions, the last two
# together the enhanced CPP contributions, $465.00, the only deduction from total income, so
# net income is $49,535.00; from employment income, up to the EI maximum insurable earnings,
# to the EI premiums; Form T2222 Steps 2 to 4, from the days lived in each zone, the work
# site benefits, the trips and the standard amount allocated, to the northern residents
# deductions (T1 line 66 and line 25500), $7,357.50, which line 25700 adds with no other
# deduction from net income (the Federal Worksheet's Line 25000 - Other payments deduction
# is not required, with no amount on line 14700 or line 14600), so taxable income (line
# 26000) is $42,177.50; from net income, by the Federal Worksheet, to the federal basic
# personal amount, and through each form's credits, tax, surtax and reductions, the LIFT
# credit, the health premium, the Canada workers benefit (zero) and the chosen income tax
# deducted of $5,000, to the net federal tax, the total payable and the refund or balance
# owing, a refund of $133.57 (line 48400), none of it donated to the Ontario opportunities
# fund (line 46500), so the net refund (line 46600) is $133.57. There is no capital gain, unused or new RRSP contribution, union dues,
# child care expense, dependant, child, workers' compensation or social assistance, and no
# Ontario credits (Form ON479). The qualifying donations for the community food program
# donation tax credit for farmers (ON428 line 87) are a chosen $0, as are the Ontario political
# contributions (ON479 line 15, line 63100), the Step 6 slip, receipt and form amounts (lines
# 45600, 45700, 46800, 47555 and 47600) and the opportunities fund donation. Not yet computed, so not
# in this file: lines 25395 and 25400 of Step 4 and capital losses (the social benefits repayment, line 23500, is 0, as the chart does not apply). Amounts are quoted decimal strings, never floats; counts are quoted digit
# strings; a record list is a list of mappings. Every output the CA-ON manifest declares
# must appear under `expected`; intermediate lines may be listed and are then checked too.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  An Ontario resident for all of 2025, who is the filer and not a dependant, with a spouse or common-law partner who takes two of
  the trips below (named only as Individual 2 on Chart A; the spouse files separately and
  claims none of the lines of this return), no dependant and no child,
  with 2025 employment income (T1 line 10100) of $50,000, a chosen figure, and no other
  income, so total income (line 15000) is $50,000.00. Employment income is below the EI
  maximum insurable earnings ($65,700) and the CPP first earnings ceiling ($71,300): EI
  premiums (line 31200) are 1.64% x 50,000 = $820.00, base CPP contributions (Schedule 8
  line 11) 4.95% x (50,000 - 3,500) = $2,301.75, and enhanced CPP contributions (line 22215)
  the first additional (line 12) 1% x 46,500 = $465.00, with no second additional
  contribution. No RRSP, union dues or child care expenses deduction, so net income (line
  23600) is 50,000.00 - 465.00 = $49,535.00. Form T2222 Step 1 lists two places of
  residence, "Zone A" for 200 days and "Zone B" for 165 days (365 days: she moved from a
  place in a prescribed northern zone to a place in a prescribed intermediate zone). The
  six-month residency test is the caller's to apply, as on the form: both stays are at least
  six consecutive months. Step 2, Zone A: line 1 is 200 days x $11.00 = $2,200.00; line 2,
  the days she qualifies for the additional residency amount (she maintained and lived in a
  dwelling there and is "the only person in the household claiming the basic residency
  amount for a particular period and dwelling"), is 200 days x $11.00 = $2,200.00; line 3 is
  2,200.00 + 2,200.00 = $4,400.00; line 4 (box 31 of the T4 slip or box 124 of the T4A slip,
  special work site) is $0, so line 5 is 4,400.00 - 0 = $4,400.00. Zone B: line 6 is 165
  days x $5.50 = $907.50; line 7, no days qualifying for the additional residency amount
  (the dwelling is shared and her spouse claims the basic residency amount for it too), is 0
  x $5.50 = $0.00; line 8 is 907.50 + 0.00 = $907.50; line 9, the non-taxable benefits for
  board and lodging at a special work site within 30 kilometres of a population centre of at
  least 40,000 individuals, is a chosen $100.00, so line 10 is 907.50 - 100.00 = $807.50.
  Line 11 is 4,400.00 + 807.50 = $5,207.50. Line 12 is net income $49,535.00 x 20% =
  $9,907.00. Line 13, whichever is less of line 11 and line 12, is $5,207.50. Step 3, Chart
  A (row A, her as Individual 1 and her spouse as Individual 2): she uses her taxable travel
  benefit for her own two trips, so none of her $1,200 standard amount is allocated, row C
  $0; for her spouse's two trips she allocates $1,200 of his $1,200 standard amount, row C
  $1,200 ("This total cannot be more than $1,200."). Chart B, "the lowest amount from column 3, 4, or 5 in the
  column for the prescribed zone(s) you resided in at the time of the trip": her trip 1
  (column 3 the taxable travel benefit $1,500, column 4 the expenses $1,300, column 5 the
  lowest return airfare $750) is $750 in Zone A; her trip 2 ($1,500, $800, $900) is $800 in
  Zone A; her spouse's trip 1 (the part of his standard amount allocated, $400, expenses
  $400, airfare $600) is $400 in Zone B and trip 2 ($800, $850, $900) is $800 in Zone B
  (these are the amounts of Example 4 on page 4 of the form). Amount A (line 14) is 750 +
  800 = $1,550; box B is 400 + 800 = $1,200, and line 15 is 1,200 x 50% = $600.00; line 16,
  the travel deduction, is 1,550 + 600.00 = $2,150.00. Step 4: line 17 is the amount of line
  13, $5,207.50, line 18 that of line 16, $2,150.00, and line 19, and so line 25500 on the
  return, is 5,207.50 + 2,150.00 = $7,357.50. No unused or new RRSP contributions, so the
  most that may be deducted (Schedule 7 line 17) is $0, the lesser of the contributions
  available to deduct (Schedule 7 line 10) of $0 and a chosen deduction limit of $7,200
  (Schedule 7 line 11); the amount deducted (line 18) is that $0, so the RRSP deduction
  (line 20800) is $0 and the unused contributions carried forward (line 23) are $0; no union
  dues (line 21200) and no child care expenses deduction (line 21400, Form T778, $0 with no
  eligible child and no child care expenses paid, to be confirmed: line 7 is the least of 0,
  0 and the two-thirds of the earned income of 50,000, 33,333.33). The T1 Step 4 lines other
  than line 25500 are 0: line 24400 (no box 43 amount), line 24900 (no security options
  deduction, boxes 39, 41, 91 and 92), line 25000 (no other payments deduction: no amount on
  line 14700, as there is no workers' compensation, social assistance or net federal
  supplement, and none on line 14600; the Federal Worksheet's line 1 is 49,535.00, lines 2
  to 4 and 6 to 8 are 0, line 5 is 49,535.00 and line 9 is 49,535.00, not more than
  $93,454), line 25100 (no limited partnership losses), line 25200 (no non-capital losses of
  other years), line 25300 (no net capital loss claimed, so 0) and line 25600 (no additional
  deductions). Line 25700 is 0 + 0 + 0 + 0 + 0 + 0 + 7,357.50 + 0 = $7,357.50 and taxable income (line 26000) is 49,535.00 - 7,357.50 =
  $42,177.50, inside the lowest federal and Ontario brackets. The non-refundable credit
  amounts are the basic personal amount (federal line 30000 $16,129, as net income is
  $177,882 or less; Ontario ON428 line 58040 $12,747), the base CPP contributions and the EI
  premiums, and on the T1 the Canada employment amount (line 31260) of $1,471, the lesser of
  $1,471 and employment income: line 33500 of 16,129 + 2,301.75 + 820.00 + 1,471 =
  $20,721.75 federally and ON428 line 58800 of 12,747 + 2,301.75 + 820.00 = $15,868.75 for
  Ontario. Each total includes $0 for an eligible dependant (line 30400, ON428 line 58160)
  and, on the T1, $0 for infirm children (line 30500), as there is no eligible dependant and
  no infirm child (to be confirmed). The rate is applied once to each total, 14.5% federally
  (line 33800) and 5.05% for Ontario (ON428 line 58840), and each product, rounded half-up
  to the cent, is its form's non-refundable tax credits: $3,004.65 (line 35000) and $801.37
  (ON428 line 61500). The federal tax on taxable income (14.5% of 42,177.50, column 1) is
  $6,115.74 and the federal tax after credits (line 42000) is 6,115.74 - 3,004.65 =
  $3,111.09. The Ontario tax on taxable income (5.05% of 42,177.50, column 1) is $2,129.96
  and the Ontario tax after credits 2,129.96 - 801.37 = $1,328.59. The Ontario surtax (ON428
  line 68) is $0, as the Ontario tax after credits is below $5,710, so the Ontario tax with
  surtax (line 69) is that same $1,328.59. With no dependent children and no dependants
  (lines 75 and 76) the Ontario tax reduction amounts (line 77) are the basic reduction of
  $294.00 (line 74); twice them, $588.00 (line 78), less the Ontario tax with surtax (line
  79) is negative, so the Ontario tax reduction (line 80) is $0 and the Ontario tax after
  the reduction (line 81) is $1,328.59. The LIFT credit (ON428 line 85, Schedule ON428-A) is
  5.05% of employment income, $2,525, at most $875, less 5% of net income over $32,500, 5% x
  17,035.00 = $851.75: $23.25, and the Ontario tax after it (ON428 line 86) is 1,328.59 -
  23.25 = $1,305.34. With chosen qualifying donations of $0, the community food program
  donation tax credit for farmers (line 87) is 25% x $0 = $0 and the Ontario tax after it
  (line 88) is that same $1,305.34. The Ontario health premium (ON428 line 89) is read from
  its chart on taxable income: $42,177.50 is more than $38,500 but not more than $48,000, so
  the premium is the first tier's $300 (the cap) plus the second tier's (42,177.50 - 36,000)
  x 6% = $370.65 capped at $150, plus nothing from the later tiers, $450, and the Ontario
  tax (line 90) is 1,305.34 + 450 = $1,755.34. On the T1, the net federal tax (line 42000)
  is the federal tax after credits, $3,111.09, and the total payable (line 43500) is it plus
  the Ontario tax (line 42800), 3,111.09 + 1,755.34 = $4,866.43. The Canada workers benefit
  (line 45300, Schedule 6) is 27% of the working income, the employment income, over $3,000,
  27% x 47,000 = $12,690, at most $1,633, less 15% of the adjusted family net income, the
  net income, over $26,855, 15% x 22,680.00 = $3,402.00; the reduction is more than the
  $1,633, so the benefit is $0. With an eligible spouse or dependant it would be at most
  $2,813 less 15% over $30,639, 15% x 18,896.00 = $2,834.40, still more, so $0 as well. The
  income tax deducted (line 43700) is a chosen $5,000, so the total credits (line 48200) are
  it plus the benefit plus the provincial credits (line 47900, the Ontario credits of Form
  ON479 line 21, $0 with no fertility treatment expenses and no seniors' transit amount
  paid), $5,000, and the refund or balance owing (line 167) is the total payable less the
  total credits, 4,866.43 - 5,000.00 = -$133.57: negative, so a refund (line 48400). Every
  amount computed from a rate, fraction, amount or chart on the forms is rounded half-up to
  the cent, each line being a dollars-and-cents box; the other lines add, subtract, compare
  or choose amounts already in cents.
  No self-employment income: the net business, professional, commission, farming and fishing
  income (T1 lines 13500, 13700, 13900, 14100 and 14300) are $0, so their sum (line 27) is
  $0, and it is a $0 term of total income (line 15000). The CPP months (Schedule
  8 box A) are the 12 of a full year, Schedule 8 Part 4 is not completed (count 0) and there
  is no agreement with the Canada Employment Insurance Commission (count 0), so the CPP
  contributions payable (line 42100), the base CPP contributions (line 31000) and the
  deduction (line 22200) on self-employment income, and the EI premiums on it (lines 31217
  and 42120), are $0 and change no total.
