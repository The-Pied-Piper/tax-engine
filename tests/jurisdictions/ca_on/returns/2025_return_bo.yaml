  line 86 = 665.00 + 0, line 88 = 665.00, line 89 = line 67 = 0, line 92 = 0 and line 93 =
  665.00 + 0 = 665.00; lines 76 to 78, 80, 83 to 85, 87, 90 and 91 are 0. Part 4 (lines 1 to
  27): line 1 (line 12200 plus line 27 of the return) is 0; line 2 (50373) is 10,000 and line 3
  (50399) is 2,500; line 4 = 0 + 10,000 + 2,500 = 12,500. Line 5 is the amount from line 19 of
  Part 3, 1,785.00. Line 61 of Part 3 is 157.25, positive: complete lines 6 to 13 only, and
  continue at line 25. Line 6 (the amount from line 47, Part 3's line 20: 1,485.00) less line 7
