  is 2,500.00. Line 61 of Part 3 is positive: complete lines 28 to 32 only, and continue at line
  40. Line 29 (the amount from line 61 of Part 3) is 157.25 and line 30 (the amount from line
  12) is 89.25, so line 31 = 157.25 less 89.25 = 68.00 and line 32 = line 28 less line 31 =
  2,500.00 less 68.00 = 2,432.00. Lines 33 to 39 are not completed: line 33 = 0 (line 61 is not
  negative), line 34 = 0, line 35 = 0, line 35A = 0, line 36 = 0 (line 68 of Part 3 is 0), line
  38 = 0 and line 39 = 0. Line 40 = 2,432.00 + 0 + 0 = 2,432.00 and line 41 = 2,432.00 x 15.625 =
  38,000.00;
  line 42 = line 27 plus line 41 = 28,500.00 + 38,000.00 = 66,500.00. There are no second
  additional contributions (boxes 16A and 17A are blank) and line 68 of Part 3 is 0, not
  positive, so lines 44 to 46 and 49 to 51 are not completed and lines 46 and 51 are "0": line
  43 = 0, line 47 = 0 less 0 = 0, line 48 = 0, line 52 = 0 less 0 = 0, line 53 = 0 + 0 = 0; line
  54 = 0 and line 55 = 0 (line 68 is not negative); line 56 = 0 + 0 = 0. Part 4 (lines 57 to 91):
  line 57 (the amount from line C of Part 2) is 71,300.00 and line 58 (the amount from line F) is
  3,500.00, so line 59 = 71,300.00 less 3,500.00 = 67,800.00. Line 60 (the amount from line 42) is
  66,500.00 and line 61 = 67,800.00 less 66,500.00 = 1,300.00; line 62 is the lesser of line 4
  (12,500) and line 61: 1,300.00. Line 3 of Part 3 (70,000.00) is not less than line 58, so lines
  63 to 69 are not completed and line 69 is "0" (line 65, 3,500.00 less 70,000.00, is entered as
  "0"; line 68, 12,500 less 67,800.00, is "0" too). Line 70 = 1,300.00 less 0 = 1,300.00. Line 74
  = 12,500 + 30,000.00 (line 11 of Part 3) + 40,000.00 (line 31 of Part 3) = 82,500.00 is more
  than line 57 (71,300.00), so lines 75 to 83 are completed: line 75 (line D) is 9,900.00, line
