    the amount on the taxpayer's latest notice of assessment, which nothing on this return
    determines. Line 5 is line 1 plus line 4, 0 + 0 = 0, and so is line 6; with no HBP or
    LLP repayments (line 9), line 10 is 0 - 0 = 0. With no employer PRPP contributions (line
    12), line 13 is 0 - 0 = 0; line 14 is 0; with no transfers (line 15), line 16 is 0 - 0 =
