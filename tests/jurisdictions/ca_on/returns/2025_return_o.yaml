# Return O: a 2025 Ontario resident with no employment income and other pensions and
# superannuation of $60,000 (line 11500, the only income), who deducts a registered pension
# plan (RPP) amount of $3,000 (line 20700), an allowable business investment loss of
# $5,000.00 (line 21700, Form T1436: a business investment loss of $10,000 with no capital
# gains deduction claimed in earlier years), support payments of $6,000 (line 22000, the
# deductible part) and carrying charges and interest expenses of $500 (line 22100, the
# Federal Worksheet: carrying charges of $300 and interest expenses of $200). Computed from
# the income line to total income, $60,000; the Federal Worksheet's line 22100 from its
# lines 1 to 3; Form T1436's lines 7, 14, 15, 17, 18 and 20 from its starting lines (all 0
# but the business investment loss); Schedule 15's Steps 2 and 3 on starting figures that
# are all 0, so no FHSA deduction (line 20805, $0) and no unused FHSA contributions (line
# 58, $0); the deductions, in line order, to total deductions (line 23300), $14,500.00; and
# line 23400, $60,000 - $14,500.00 = $45,500.00, which is net income (line 23600) and
# taxable income (line 26000) as there is no social benefits repayment and no deduction from
# net income. From net income, by the Federal Worksheet, to the federal basic personal
# amount, and through each form's credits, tax, surtax and reductions, the health premium
# and the chosen income tax deducted of $6,000, to the net federal tax, the total payable
# and the refund or balance owing, a refund. There is no capital gain, unused or new
# RRSP contribution, union dues, child care expense or dependant, no CPP contributions or EI
# premiums, and no Ontario credits (Form ON479). The qualifying donations for the community
# food program donation tax credit for farmers (ON428 line 87) are a chosen $0. Schedule 9's
# inputs are all a chosen $0, so lines 116 (34900) and 117 (34990) are $0 and line 35000 is
# line 33800. Not yet computed, so not in this file: lines 21500, 21900, 22200, 22900 and 23100 of Step 3 and lines 25300, 25395, 25400 and 25500 of Step 4 (the social benefits repayment, line 23500, is 0, as the chart does not apply). Line 20810 (PRPP employer contributions) is not modelled: no line of
# lines 35 to 52 reads it. Amounts are
# quoted decimal strings, never floats; counts are quoted digit strings. Every output the
# CA-ON manifest declares must appear under `expected`; intermediate lines may be listed and
# are then checked too. The age amount (line 30100) and spouse amount (line 30300) and
# ON428's age amount (line 58080, from Worksheet ON428) and spouse or common-law partner
# amount (lines 11 to 13, line 58120) are not triggered either, for counts of 0, so each is
# 0 and its part of the totals of credit amounts is 0. They are computed all the same, in
# the order of the forms' lines, from net income less the income threshold, not below zero,
# at 15%, taken off the maximum, not below zero, and from the base less the spouse's net
# income, not below zero, at most the maximum, each claimed for its count.
# Ontario political contributions (ON479 line 15, line 63100) are a chosen $0, so Worksheet
# ON479's line 16 is $0 (column 1 applies).
# Federal political contributions (T1 line 135 and line 40900) are a chosen $0, so the Federal
# Worksheet's line 41000 is $0 (column 1 applies).
# The Ontario seniors care at home tax credit (ON479 line 13, line 63095) is not claimed (a
# chosen count of 0), so ON479 line 13 is $0.
# The refundable medical expense supplement (T1 line 154 and line 45200, Federal Worksheet)
# takes chosen inputs: the counts of residence in Canada throughout 2025 and of age 18 or
# older at the end of 2025 are 1 and its other new amounts (line 21500, lines 22900 and
# 23100, the net self-employment lines, the wage-loss replacement plan amounts and the
# spouse's column) are $0. The working income is $0 (employment income less lines 20700,
# 21200, 22900 and 23100; under the $4,390 the line asks for); line 6, the adjusted family
# net income, is the net income, $45,500.00 (column 1 alone, as the spouse's column is 0 and line 23500 is 0, the chart not applying); line 8 is line 6 less 33,294.00, $12,206.00; and line 16 and
# the supplement are $0, because line 9 (line 21500, a chosen $0) and line 10 (line 33200,
# $0 with no medical expenses) are 0.
# Form ON-BEN (lines 61020 to 61230) is not applied for (a chosen 0 for each tick box and a
# chosen $0 for each Part A amount), so its ten lines are carried as entered, all 0.
# Rental income (T1 line 13, Form T776 Parts 3 and 4) is a chosen $0: no rental properties
# and no Chart A rows, and every expense box and co-owner and partner figure $0, so T1 lines
# 12599 and 12600 are $0.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  An Ontario resident for all of 2025, with no spouse or common-law partner at any time in
  2025, no dependant and no child, with no employment income (T1 line 10100) and other
  pensions and superannuation (line 11500) of $60,000, a chosen figure and the only income:
  no other employment income (line 10400), no capital gain (so taxable capital gains, line
  12700, of $0), no dividends, interest or investment income, no support payments received
  (line 12800) and no benefits on lines 14400 to 14600, so line 14700 is $0. Total income
  (line 15000) is the sum of the income lines, $60,000. With no employment income there are
  no CPP contributions (Schedule 8: base 0, first and second additional 0, so the enhanced
  contributions, line 22215, are 0) and no EI premiums (line 31200: 0). No unused or new
  RRSP contributions, so the most that may be deducted (Schedule 7 line 17) is $0, the
  lesser of the contributions available to deduct (line 10) of $0 and a chosen deduction
  limit of $0 (line 11); the amount deducted (line 18) is $0, so the RRSP deduction (line
  20800) is $0 and the unused contributions carried forward (line 23) are $0. Step 3: the
  RPP deduction (line 20700, box 032 of the T4A slip) is a chosen $3,000. The FHSA deduction
  (line 20805, Schedule 15 line 57) is $0: every starting figure of Schedule 15 is $0 and
  the filer deducts $0 (the maximum participation period count being 0), so line 13 is $0,
  line 14 is the printed 8,000.00, line 16 is 8,000.00 + 0, line 39 is 8,000.00 - 0 and line
  40 the lesser of 0 and 8,000.00, $0; line 43 is $0, line 45 is $0, line 46 is the printed
  40,000.00, line 50 is 40,000.00 and line 51 the lesser of 0 and 40,000.00, $0, so line 57,
  at most line 51, is $0 and line 58 is $0. The split-pension deduction (line 21000) is $0,
  as are union dues (line 21200), the UCCB repayment (line 21300) and the child care
  expenses (line 21400, Form T778: the limits and the earned income all $0). The business
  investment loss is a chosen $10,000 (Form T1436 line 16, line 21699), with no capital
  gains deduction claimed in earlier years: lines 1 to 6 are $0, so line 7 is $0; lines 8 to
  13 are $0, so line 14 is $0; line 15 is $0 - $0 = $0. Line 17 is the lesser of line 15 and
  line 16, $0; line 18 is $10,000 - $0 = $10,000; line 19 is the printed 50%; line 20, and
  so line 21700, is $10,000 x 50% = $5,000.00. The deductible support payments (line 22000)
  are a chosen $6,000, which line 21999 (the total paid, $6,000) bounds. The Federal Worksheet's
  line 22100 is the total carrying charges (line 1, a chosen $300), the total interest
  expenses (line 2, a chosen $200) and the total other expenses (line 3, $0): line 4 is $500
  (the lines add amounts already in cents). Exploration and development expenses (line
  22400) and the other deductions (line 23200) are $0. Total deductions (line 23300) are the
  sum, in line order, of the RPP deduction $3,000 + the RRSP deduction $0 + the FHSA
  deduction $0 + the split-pension deduction $0 + union dues $0 + the UCCB repayment $0 +
  the child care expenses $0 + the allowable business investment loss $5,000.00 + the
  support payments $6,000 + the carrying charges and interest $500 + the enhanced CPP
  contributions $0 + exploration and development $0 + other deductions $0 = $14,500.00. Net
  income before adjustments (line 23400) is $60,000 - $14,500.00 = $45,500.00, and net
  income (line 23600) is the same, as line 23500 (social benefits repayment) is 0 (the chart does not apply)
  and $45,500.00 is not negative. No amount was entered on line 14600, so the other payments
  deduction (line 25000) is line 14700, $0; there is no other deduction from net income, so
  line 25700 is $0 and taxable income (line 26000) is $45,500.00, in the lowest federal and
  first Ontario brackets. The non-refundable credit amounts are the basic personal amount
  (federal line 30000 $16,129, since net income is $177,882 or less; Ontario ON428 line
  58040 $12,747) and the pension income amount (line 31400) of $2,000.00 (see below), which for Ontario (ON428 line 27, line 58360) is the lesser of $1,762 and it,
  $1,762.00, and nothing else (no adoption expenses or student loan interest): no base
  CPP contributions or EI premiums, a Canada
  employment amount (line 31260) of $0, an age amount (line 30100) of $0 (the filer is born
  in 1961 or later, a chosen figure, so the count of filers born in 1960 or earlier is 0),
  no spouse amount (line 30300), no Canada caregiver amount for a spouse (line 30425), no
  eligible dependant (lines 30400 and 58160) and no infirm children (line 30500): line 33500
  of $18,129.00 and ON428 line 58800 of $14,509.00. Schedule 9's inputs are all a chosen $0,
  so the donations and gifts credit (line 34900), the top-up tax credit (line 34990) and
  ON428's donations and gifts credit (line 58969) are $0. At 14.5% federally (line 33800)
  and 5.05% for Ontario (ON428 line 58840), each product rounded half-up to the cent is its
  form's non-refundable tax credits: federal $2,628.71 (line 35000, 14.5% of $18,129.00 is
  $2,628.705, a tie, up) and Ontario $732.70 (ON428 line 61500, 5.05% of $14,509.00 is
  $732.7045), each taken off its form's basic tax ($6,597.50 federally, 14.5% of $45,500.00;
  $2,297.75 for Ontario, 5.05% of $45,500.00), not below zero: $3,968.79 and $1,565.05. The
  Ontario surtax (ON428 line 68) is $0, as the Ontario tax after credits is below $5,710, so
  the Ontario tax with surtax (line 69) is that same $1,565.05. With no dividends, Worksheet
  ON428's lines A and B (lines 12000 and 12010) are $0, so the Ontario dividend tax credit
  (ON428 line 57, line 61520) and line 70 are $0, and the Ontario tax after the dividend
  credit (ON428 line 71, which is line 73) is that same $1,565.05. With no dependent child
  and no dependant, the Ontario tax reduction amounts (line 77) are the basic reduction of
  $294.00 (line 74), twice them, $588.00 (line 78), which is less than the Ontario tax after
  the dividend credit (line 79), so the Ontario tax reduction (line 80) is $0 and the
  Ontario tax after the reduction (line 81) is $1,565.05. The LIFT credit (ON428 line 85,
  Schedule ON428-A) is 5.05% of employment income, $0, at most $875, less 5% of net income
  over $32,500, $650.00, not below zero: $0, so the Ontario tax after it (line 86) is that
  same $1,565.05. With chosen qualifying donations of $0, the community food program
  donation tax credit for farmers (ON428 line 87) is 25% x $0 = $0 and the Ontario tax after
  it (line 88) is that same $1,565.05. The Ontario health premium (ON428 line 89) is read
  from its chart on taxable income: $45,500.00 is more than $38,500 but not more than
  $48,000, so the premium is $450, and the Ontario tax (ON428 line 90) is the Ontario tax
  after the food credit plus the premium, $1,565.05 + $450 = $2,015.05. On the T1, the net
  federal tax (line 42000) is the federal tax after credits, $3,968.79, and the total
  payable (line 43500) is it plus the Ontario tax (line 42800), $5,983.84. The Canada
  workers benefit (line 45300, Schedule 6) is $0: the working income, the employment income,
  is $0, so 27% of it over $3,000 is $0 and so is the benefit before the reduction, whether
  the lesser of that and $1,633 (no eligible dependant) or $2,813 applies; less 15% of the
  adjusted family net income, the net income, over $26,855 (no eligible dependant) or
  $30,639 (an eligible dependant), $2,796.75 or $2,229.15, not below zero: $0. The income
  tax deducted (line 43700) is a chosen $6,000, so the total credits (line 48200) are it
  plus the benefit, $6,000, and the refund or balance owing (line 167) is the total payable
  less the total credits, $5,983.84 - $6,000 = -$16.16: negative, so a refund of $16.16 (line
  48400). Every amount computed from a rate, fraction, amount or chart on the forms is
  rounded half-up to the cent, each line being a dollars-and-cents box; here that changes
  Form T1436 line 20, the federal tax on taxable income, the Ontario tax on taxable income
  and both forms' non-refundable tax credits, and the lines that follow from them. The lines
  that only add, subtract, compare or choose take amounts already in cents, so the refund or
  balance owing is in cents too. The age amount (line 30100), the spouse or common-law
  partner amount (line 30300) and the Canada caregiver amount for a spouse or common-law
  partner (line 30425) are each $0: the filer is born in 1961 or later (a chosen figure; the
  count of filers born in 1960 or earlier, line 78, is 0), claims no spouse amount (count 0)
  and has no spouse eligible for the Canada caregiver amount (line 51090, count 0), and the
  spouse's net income entered is $0 (to be confirmed). They are computed all the same (the
  Federal Worksheet's line 4 is the net income over $45,522, $0.00, line 6 is 15% of it,
  $0.00, and line 7 is $9,028.00; Schedule 5 line 30300 is $16,129.00 and line 30425
  $8,601.00) and claimed for 0, so the totals of credit amounts are those without them.
  ON428's age amount (line 58080, Worksheet ON428) and spouse or common-law partner amount
  (lines 11 to 13, line 58120) are each $0, for the same counts. They are computed all the
  same (the worksheet's line 4 is the net income over $46,330, $0.00, line 6 is 15% of it,
  $0.00, and line 7 is $6,223.00; ON428 line 13 is the $11,905.00 base less the spouse's net
  income of $0, at most $10,823.00) and claimed for 0, so ON428's total of credit amounts is
  as without them.
  No self-employment income: the net business, professional, commission, farming and fishing
  income (T1 lines 13500, 13700, 13900, 14100 and 14300) are $0, so their sum (line 27) is
  $0, and it is a $0 term of total income (line 15000). The CPP months (Schedule
  8 box A) are the 12 of a full year, Schedule 8 Part 4 is not completed (count 0) and there
  is no agreement with the Canada Employment Insurance Commission (count 0), so the CPP
  contributions payable (line 42100), the base CPP contributions (line 31000) and the
  deduction (line 22200) on self-employment income, and the EI premiums on it (lines 31217
  and 42120), are $0 and change no total.
