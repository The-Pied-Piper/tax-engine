# Return BA: Return AF's filer with a capital gain of $20,000 and net capital losses of other years
# that include a balance from before May 23, 1985. Computed as Return AF, and in addition: from the
# balance of unapplied net capital losses before May 23, 1985 (Form T1436 line 1) and the capital
# gains deductions claimed (amounts A to E, the 1988 and 1989 amount at 3/4, the 1990 to 1999
# amount at 2/3 and the 2000 amount at 1/(IR x 2) for the 2000 inclusion rate IR), to the total
# capital gains deductions after adjustment (line 2) and the pre-1986 capital loss balance
# available for 2025 (line 3); from that balance, as column A of the row "Before May 23, 1985" of
# Chart A (factor 1), to its column C, summed with the other rows' to line 4; from the amount
# claimed (line 7), at most line 6, and line 4, to line 8; from the lesser of line 3, line 8 and
# $2,000 to line 9; from lines 7 and 9, summed, to line 10 (T1 line 25300) and line 13; and from
# line 13, applied to the oldest row first, to columns D, E and G of every row. Every other line
# is Return AF's.
# The facts are Guide T4037's Example 2 (confirmed from the PDF). The guide's own prose results
# ($6,000 applied from before May 23, 1985, and $2,000 carried forward) are not reproduced: the
# form's lines 1 to 3 reduce that balance by the capital gains deductions, so only the total
# applied, 12,000 on lines 10 and 13, agrees with the guide. Its chart is an image and is not quoted.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  Return AF's filer: an Ontario resident with 2025 employment income (T1 line 10100) of $48,000
  and income tax deducted of $4,800, with one capital gain of $20,000 (Schedule 3 line 21; one
  share row, proceeds 20,000, adjusted cost base 0 and outlays 0, a chosen figure), of which 50%
  is taxable: taxable capital gains (line 12700) are 20,000 x 50% = 10,000.00 and total income
  (line 15000) is 48,000 + 10,000.00 = 58,000.00. The CPP contributions, EI premiums, RRSP
  lines, child care expenses deduction and the other lines that depend on employment income
  alone are Return AF's: base CPP contributions $2,202.75, enhanced CPP contributions $445.00,
  EI premiums $787.20, no other deduction from total income, so net income (line 23600) is
  58,000.00 - 445.00 = 57,555.00. The only deduction from net income is the net capital losses
  of other years (T1 line 25300), 12,000, worked out below, so taxable income (line 26000) is
  57,555.00 - 12,000 = 45,555.00. Net capital losses of other years (Form T1436 "Line 25300 -
  Net capital loss of other years (if you have pre-1986 capital loss balance)"). The filer has
  unapplied net capital losses of $6,000 from before May 23, 1985 (line 1), claimed a capital
  gains deduction of $500 before 1988 (amount A; Guide T4037's $500 claimed in 1986), none in
  1988 and 1989 (B), from 1990 to 1999 (C) or from 2001 to 2024 (E), and $300 in 2000 (amount D;
  Guide T4037's $300 claimed in 2000), when the inclusion rate was 2/3 (66.6666%, entered as
  0.666666): D is 300 x 1/(0.666666 x 2) = 300 x 1/1.333332 = 225.000225..., 225.00. Line 2 is
  500 + 0.00 + 0.00 + 225.00 + 0 = 725.00 and line 3, "Pre-1986 capital loss balance available
  for 2025: line 1 minus line 2", is 6,000 - 725.00 = 5,275.00. The unapplied
  net capital losses of the other periods (Chart A column A, figures from Guide
  T4037's Example 2) are 4,000 from 1988 and 6,000 from 1990, in the periods "In
  1988 and 1989" and "After 1989 and before 2000", and none from "After May 22, 1985, and before
  1988" or "After 2000 and before 2025". Column A of the row "Before May 23, 1985" is line 3,
  5,275.00, and that of the row "In 2000" is 0. Column B, the adjustment factor for the
  inclusion rate, is 1, 1, 3/4 (printed 0.75), 2/3 (printed 0.6667), 1/(IR x 2) and 1, so column
  C is 5,275.00 x 1 = 5,275.00, 0.00, 4,000 x 3/4 = 3,000.00, 6,000 x 2/3 = 4,000.00, 0.00 and
  0.00. Line 4, "Total of column C from Chart A", is 5,275.00 + 0.00 + 3,000.00 + 4,000.00 +
  0.00 + 0.00 = 12,275.00; line 5, the taxable capital gains,
  is 10,000.00; line 6, the lesser of line 4 and line 5, is 10,000.00; line 7, the amount of
  losses to claim, is a chosen 10,000, not above line 6. Line 8, "Balance of unapplied adjusted
  net capital losses of other years not used to reduce taxable capital gains: line 4 minus line
  7", is 12,275.00 - 10,000 = 2,275.00. Line 9, "Enter whichever is less: amount from line 3,
  line 8, or $2,000.", is the least of 5,275.00, 2,275.00 and 2,000.00: 2,000.00. Line 10, "Line 7
  plus line 9", the deduction in 2025, is 10,000 + 2,000.00 = 12,000.00, entered on line 25300;
  lines 11 and 12 copy lines 7 and 9, and line 13, "Line 11 plus line 12", is 12,000.00. Line 13 is
  applied to the oldest row first (Guide T4037: "You have to apply your older losses first."):
  column D is the lesser of column C and what is left of line 13, so 5,275.00 for "Before May
  23, 1985" (6,725.00 left), 0.00 for "After May 22, 1985, and before 1988" (6,725.00 left),
  3,000.00 for "In 1988 and 1989" (3,725.00 left), 3,725.00 for "After 1989 and before 2000" (0.00
  left), 0.00 for "In 2000" and 0.00 for "After 2000 and before 2025"; their total, 12,000.00,
  equals line 13 (note (4)). Column E, column C less column D, is 0.00, 0.00, 0.00, 275.00, 0.00
  and 0.00 and column G, column E multiplied by column F (1, 1, 4/3, 3/2, 2 x IR and 1), is
  0.00, 0.00, 0.00, 275.00 x 3/2 = 412.50, 0.00 and 0.00, the balance available to carry
  forward to 2026. The Canada workers
  benefit is $0, as 15% of the adjusted family net income, the net income, over $26,855 is
  4,605.00, more than the $1,633 maximum. The federal tax is 14.5% of the taxable income,
  45,555.00 x 14.5% = 6,605.475, 6,605.48, less the non-refundable tax credits of $2,985.54
  (the same as Return AF's: 20,589.95 x 14.5%), 3,619.94. The Ontario tax before credits is
  45,555.00 x 5.05% = 2,300.53, less the non-refundable tax credits of $794.72, 1,505.81, with no
  surtax and no Ontario tax reduction (twice the $294.00 basic reduction, $588.00, is less than
  it); the LIFT credit is $0, as 5% of net income over $32,500, $1,252.75, is more than the $875
  maximum; the Ontario health premium, on taxable income of $45,555.00 (more than $38,500 but
  not more than $48,000), is $450, so the Ontario tax is 1,505.81 + 450 = 1,955.81 and the total
  payable is 3,619.94 + 1,955.81 = 5,575.75, against total credits of $4,800.00 (the tax
  deducted, as the Canada workers benefit is $0): 775.75 owing. Every other line is as in Return
  AF, with no refundable medical expense supplement, no rental income and none of the other
  credits and deductions Return AF leaves out.
sources:
  - >-
    CRA, Form T1436 "Capital Gains Worksheet" 2025 (docs/cra-forms-2025/t1436-25e.pdf; confirmed
    from the PDF; no .txt published), "Line 25300 - Net capital loss of other years (if you have
    pre-1986 capital loss balance)", "Calculating your pre-1986 capital loss balance available
    for 2025, if any": "Complete lines 1 to 3 only if you have a balance of unapplied net capital
    losses from before May 23, 1985. Otherwise, enter "0" on line 3 and continue at line 4."
    Line 1 "Balance of unapplied net capital losses you had before May 23, 1985"; "Capital gains
    deductions you claimed:" "Before 1988" (A), "In 1988 and 1989" "x 0.75" (B), "From 1990 to
    1999" "x 0.6667" (C), "In 2000" "x 1/(IR x 2)" (D), "From 2001 to 2024" (E); "Total capital
    gains deductions after adjustment: add amounts A to E." (line 2); "Pre-1986 capital loss
    balance available for 2025: line 1 minus line 2" (line 3). The form prints 0.75 and 0.6667
    for 3/4 and 2/3 rounded for print; the datasets hold the exact fractions, rounded half-up to
    the cent (the owner's decision, as the form states no rounding rule). The row D is the amount
    divided by 2 x IR, where IR is the 2000 inclusion rate that Chart A's row "In 2000" reads.
  - >-
    The same page, "Applying net capital losses of other years to 2025": "Total unapplied
    adjusted net capital losses of other years: Total of column C from Chart A" (line 4);
    "Taxable capital gains from line 12700 of your 2025 return" (line 5); "Enter whichever is
    less: amount from line 4 or line 5." (line 6); "Enter the amount of losses you want to
    claim (3)." (line 7); "If you completed lines 1 to 3, complete lines 8 to 13 and columns D
    to G of Chart A to calculate the net balance of unapplied capital losses available to carry
    forward to future years." "Balance of unapplied adjusted net capital losses of other years
    not used to reduce taxable capital gains: line 4 minus line 7" (line 8); "Enter whichever
    is less: amount from line 3, line 8, or $2,000." (line 9); "Line 7 plus line 9" "Deduction in
    2025 for net capital losses of other years" (line 10); "Enter the amount from line 10 on line
    25300 of your 2025 return and continue at line 11"; "Amount from line 7" (line 11); "Amount
    from line 9" (line 12); "Line 11 plus line 12" "Total adjusted net capital losses of other
    years applied in 2025" (line 13). Note (3): "You can apply all or part of the amount from
    line 6 against your taxable capital gains in 2025."
  - >-
    The next page, "Chart A - Adjustment calculation for carry-forward losses", columns (A)
    "Amount of your unapplied net capital losses", (B) "Adjustment factor (for the inclusion
    rate)", (C) "Adjusted gross capital losses (column A multiplied by column B)", (D) "Total
    adjusted net capital losses applied against taxable capital gains in 2025", (E) "Remaining
    adjusted net capital losses (column C minus column D)", (F) "Adjustment factor (for
    carry-forward losses)", (G) "Net capital loss balance available to carry forward (column E
    multiplied by column F)"; rows and factors (column B, column F): "Before May 23, 1985" 1, 1;
    "After May 22, 1985, and before 1988" 1, 1; "In 1988 and 1989" 0.75, 1.33; "After 1989 and
    before 2000" 0.6667, 1.5; "In 2000" 1/(IR x 2), 2 x IR; "After 2000 and before 2025" 1, 1.
    Note (4): "The total for column D must equal the amount from line 13."
  - >-
    CRA, Guide T4037 "Capital Gains" 2025 (PDF; confirmed from the PDF; no .txt published),
    Example 2: "You have unapplied net capital losses of $6,000 you incurred before May 23, 1985.
    You claimed a capital gains deduction of $500 in 1986 and of $300 in 2000 (your inclusion rate
    in 2000 was 2/3 or 66.6666%). You also have the following unapplied net capital losses: $4,000 from 1988 and $6,000 from 1990. You
    reported a taxable capital gain of $10,000 on line 12700 of your 2025 Income Tax and Benefit
    Return." and "You have to apply your older losses first." This return uses those facts
    including the deduction claimed in 2000.
