# Return AW: a single employee, a 2025 Ontario resident, with employment income of $50,000,
# the dividends of Return K (a T5 slip and dividends with no information slip) and $15,000
# of foreign investment income: foreign dividends of two countries, a chosen $10,000 from
# the United States on which a chosen $1,500 of tax was paid and a chosen $5,000 from the
# United Kingdom on which a chosen $100 was paid, and foreign business income of the same
# two countries: a chosen $6,000 from the United States on which a chosen $400 of tax was
# paid, with a chosen $50 of unused credits, and a chosen $3,000 from the United Kingdom on
# which a chosen $60 was paid. The total foreign tax, $2,060, is more than $200, so Form
# T2209 is worked for each country on its own: with a net income (note 3) of $66,990.00 and
# a basic federal tax (note 4) of $7,285.81 the United States' line 2 is $10,000 x 7,285.81
# / 66,990.00 = $1,087.60, below its $1,500, and the United Kingdom's is $543.80, above its
# $100, so line 3 is $1,087.60 + $100.00 = $1,187.60. The business lines, with a basic
# federal tax (note 8) of $7,285.81: line 4 is $450 and $60, line 5 is $652.56 and $326.28,
# lines 7 and 8 follow, line 10 is $6,198.21 and $7,185.81, and line 11 is the least of
# lines 4, 7 and 10, $450 and $60, $510 in all. Line 13, and so T1 line 129 (line 40500), is
# $510 + $1,187.60 = $1,697.60, below the $6,966.62 of line 42900; T1 line 130 is $6,966.62
# - $1,697.60 = $5,269.02, which line 132 carries to the net federal tax. Form T2036 is
# worked on the same two sheets for Ontario, on the non-business figures only: with a
# provincial tax otherwise payable (ON428 line 81 with "0" on lines 70 and 72) of $3,159.89
# the United States' line 3 is $1,500 - $1,087.60 = $412.40, below its line 4 of $471.70,
# and the United Kingdom's is $100 - $100 = $0, so the total of line 5, and ON428 line 82,
# is $412.40, which comes off line 81 (ON428 line 83) and leaves an Ontario tax of
# $3,156.35. Amounts are quoted decimal strings, never floats; counts are quoted digit
# strings. A line or input this return leaves out is blank, 0, and is checked to compute to
# 0; intermediate lines that are listed are checked too. The other variants (a total of
# foreign tax at or under $200, a limit by line 42900 and by the tax otherwise payable,
# deductions in net income and a First Nations abatement, and no countries) are pinned in
# `end_to_end/test_return_aw.py`.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single employee, an Ontario resident for all of 2025, with no spouse or common-law
  partner at any time in 2025 and no dependant, with employment income (T1 line 10100) of a
  chosen $50,000, the dividends of Return K and foreign investment income. The dividends are
  those of Return K, chosen figures: a T5 slip showing, in box 11 (the taxable amount of
  dividends other than eligible dividends) $200, in boxes 11 and 25 (the taxable amount of
  all its dividends) $500 and in boxes 12 and 26 (the dividend tax credit) $60.00, and, with
  no information slip, actual eligible dividends received of $1,000 and actual dividends
  other than eligible dividends received of $500. The Federal Worksheet for lines 12000 and
  12010 gives, as for Return K, line 13 = 1,000 x 138% = 1,380.00, line 16 = 500 x 115% =
  575.00, line 17 = 1,380.00 + 575.00 = 1,955.00, line 12010 = 200 + 575.00 = 775.00 and
  line 12000 = 500 + 1,955.00 = 2,455.00. The foreign investment income is a chosen $15,000
  in Canadian dollars: the dividends of the United States, $10,000, and of the United
  Kingdom, $5,000. The Federal Worksheet for line 12100 has it on line 6 "Income from
  foreign sources, including foreign dividends, in Canadian dollars"; the other lines are 0,
  so line 9 "Add lines 1 to 8." is 15,000, line 10 (reported in previous years) is 0 and
  line 11, and so line 12100, is 15,000 - 0 = 15,000. It is not a dividend from a taxable
  Canadian corporation, so it has no gross-up and no dividend tax credit.
  Total income (line 15000) is the sum of the income lines in line order: 50,000 + 2,455.00
  (line 12000) + 15,000 (line 12100) = 67,455.00. The CPP contributions are computed from
  employment income by Schedule 8's tiers, as for Return K: base 4.95% x (50,000 - 3,500) =
  2,301.75, first additional 1% x 46,500 = 465.00 and no second additional below the 71,300
  ceiling, so the enhanced contributions (line 22215) are 465.00; the EI premiums (line
  31200) are 1.64% x 50,000 = 820.00. With no RRSP deduction, union dues or child care
  expenses, total deductions (line 23300) are 465.00 and net income (line 23600) is
  67,455.00 - 465.00 = 66,990.00, as is taxable income (line 26000), there being no
  deduction from net income. The federal tax on taxable income (T1 Step 5, Part A) is in the
  column "Line 26000 is more than $57,375 but not more than $114,750": line 71 is 57,375.00,
  line 72 is 66,990.00 - 57,375.00 = 9,615.00, line 74 is 9,615.00 x 20.5% = 1,971.075, line
  75 is 8,319.38 and line 76 is 1,971.075 + 8,319.38 = 10,290.455, rounded half-up to the
  cent: 10,290.46. The credit amounts are as for Return K: line 33500 = 16,129 + 0 + 0 +
  2,301.75 + 820.00 + 1,471 = 20,721.75 (the basic personal amount is 16,129 as net income
  is 177,882 or less) and line 33800 = 20,721.75 x 14.5% = 3,004.65375, rounded half-up to
  the cent: 3,004.65, which is line 35000. The federal dividend tax credit (line 40425) is
  Return K's, 60.00 + 51.92 + 207.27 = 319.19, the foreign income having none. Line 125 is
  3,004.65 + 319.19 = 3,323.84 and line 126 (line 42900), the basic federal tax, is
  10,290.46 - 3,323.84 = 6,966.62. The age amount (T1 line 30100, Federal Worksheet) is
  computed all the same and claimed for 0 filers born in 1960 or earlier: line 4 is
  66,990.00 - 45,522.00 = 21,468.00, line 6 is 21,468.00 x 15% = 3,220.20 and line 7 is
  9,028.00 - 3,220.20 = 5,807.80. The Ontario amounts are Return K's, claimed for the same
  counts of 0; Worksheet ON428's line 4 is 66,990.00 - 46,330.00 = 20,660.00, line 6 is
  20,660.00 x 15% = 3,099.00 and line 7 is 6,223.00 - 3,099.00 = 3,124.00.
  Form T2209, "Federal non-business foreign tax credit". Net income (note 3) is the amount
  of line 23600 (line 23400, 66,990.00, less line 23500, 0, the social benefits repayment,
  without the floor at 0) plus line 68360 of Form T1206, the total split income, 0, less the
  deductions the note lists, which this return has none
  of: lines 24400, 24900, 25000, 25300, 25395 and 25400 and the part of line 25600 that is
  exempt income are each 0, so they add to 0 and net income is 66,990.00 - 0 = 66,990.00.
  Basic federal tax (note 4) is "Line 42900 of your return plus any" "federal dividend tax
  credit (line 40425 of your return)" "minus any" "federal refundable First Nations
  abatement (line 44100 of your return)": 6,966.62 + 319.19 = 7,285.81, less a line 44100 of
  0, 7,285.81 (the federal surtax on income allocated outside Canada and the refundable
  Quebec abatement are not triggered on an Ontario return). The form's total foreign tax,
  non-business and business, is 1,500 + 100 + 400 + 60 = 2,060 (see the business lines
  below), "more than $200", with more than one country, so "the applicable calculation shown
  on this form" is worked "for each country on a separate sheet" and the total entered. The
  non-business lines are worked first. United States: line 1 (43100) is 1,500; line 2 is
  line 43300, 10,000, at most the net income of 66,990.00 (note 2), x 7,285.81 / 66,990.00 =
  72,858,100 / 66,990.00 = 1,087.5966..., rounded half-up to the cent: 1,087.60; line 3 is
  "whichever is less: the amount from line 1 or line 2": 1,087.60. United Kingdom: line 1 is
  100; line 2 is 5,000 x 7,285.81 / 66,990.00 = 36,429,050 / 66,990.00 = 543.7983...,
  rounded: 543.80; line 3 is 100. The total of line 3 is 1,087.60 + 100 = 1,187.60. Pooled
  it would be 15,000 x 7,285.81 / 66,990.00 = 1,631.3949..., rounded: 1,631.39, and
  lesser(1,600, 1,631.39) = 1,600, which the form does not allow (the form's test of the
  total tax paid is the one above, 2,060, so the choice of separate sheets is not changed by
  the pooled comparison). Business lines of the same sheets, "Federal business foreign tax
  credit". The business figures are chosen: the United States paid 400 of business income
  tax for the year (note 5) and carries 50 of unused business foreign tax credits (note 6)
  on 6,000 of net foreign business income (note 7, below the net income of 66,990.00, so not
  capped), with 0 of federal surtax on income allocated to "Other (Outside Canada)" (line
  6); the United Kingdom paid 60 of business income tax, with 0 unused credits, on 3,000 of
  net foreign business income and 0 of line 6. The form's total foreign tax is therefore 1,500 + 100 +
  400 + 60 = 2,060 (the unused credits are not tax paid for the year), "more than $200", so
  both countries stay on their own sheets. Basic federal tax for these lines is note (8),
  "Line 42900 of your return plus any federal dividend tax credit (line 40425 of your
  return).", 6,966.62 + 319.19 = 7,285.81, which is the same figure as note (4) here as the
  First Nations abatement is 0. United States: line 4 is 400 + 50 = 450; line 5 is 6,000 x
  7,285.81 / 66,990.00 = 43,714,860.00 / 66,990.00 = 652.5579..., rounded half-up to the
  cent: 652.56; line 6 is 0; line 7 is 652.56 + 0 = 652.56; line 8 is 7,285.81 + 0 =
  7,285.81; line 9 is the line 3 of 1,087.60; line 10 is 7,285.81 - 1,087.60 = 6,198.21;
  line 11 is "whichever is less: the amount from line 4, 7 or 10": the least of 450, 652.56
  and 6,198.21, 450. United Kingdom: line 4 is 60 + 0 = 60; line 5 is 3,000 x 7,285.81 /
  66,990.00 = 21,857,430.00 / 66,990.00 = 326.2789..., rounded: 326.28; line 6 is 0; line 7
  is 326.28; line 8 is 7,285.81; line 9 is 100; line 10 is 7,285.81 - 100 = 7,185.81; line
  11 is the least of 60, 326.28 and 7,185.81, 60. The totals over the two sheets are line 4:
  450 + 60 = 510; line 5: 652.56 + 326.28 = 978.84; line 7: 978.84; line 8: 7,285.81 x 2 =
  14,571.62; line 10: 6,198.21 + 7,185.81 = 13,384.02; line 11: 450 + 60 = 510. Line 12 is
  "the amount from line 3", the total of 1,187.60, and line 13, "Add lines 11 and 12.",
  "Federal foreign tax credit", is 510 + 1,187.60 = 1,697.60. "The amount on line 13 should
  not be more than the total of the amount on line 42900 of your return, plus any federal
  surtax on income earned outside of Canada": 1,697.60 is less than 6,966.62 (the surtax,
  T1 line 127, is not wired and not triggered), so T1 line 129 (line 40500) is 1,697.60.
  T1 line 130 "Line 128 minus line 129 =", line 128 "Line 126 plus line 127 =" being line
  126 as line 127 is 0: 6,966.62 - 1,697.60 = 5,269.02. Line 132 "Line 130 plus line 131 ="
  is 5,269.02 + 0.00 (no recapture) = 5,269.02, as are lines 134 and 139 (no logging tax
  credit, no credits against federal tax). With no split income Form T1206's line 24 is 0,
  so its line 29 is 5,269.02 + 0 (line 41500, 0) and line 30, the more of the two, is
  5,269.02, which with the special taxes (line 41800) of 0 is the net federal tax (line
  42000), 5,269.02. Form T2036 reads the non-business figures only and is unchanged by the
  business lines. The alternative minimum tax lines that read the federal foreign tax credit
  follow it: the special foreign tax credit (Form T691 Part 4 line 11) is the more of the
  federal foreign tax credit, 1,697.60, and its line 10, 1,526.67 (lines 2, 7 and 8 are the
  totals over the two country records, 15,000, 1,600 and 460), so 1,697.60, and the regular net
  federal tax payable (Part 3 line 15) is 6,966.62 - 1,697.60 = 5,269.02.
  Ontario (Form ON428): the column "Line 1 is more than $52,886 but not more than $105,775":
  line 4 is 66,990.00 - 52,886.00 = 14,104.00, line 6 is 14,104.00 x 9.15% = 1,290.516, line
  7 is 2,670.74 and line 8 is 1,290.516 + 2,670.74 = 3,961.256, rounded half-up to the cent:
  3,961.26. The credit amounts are Return K's, 15,868.75 at 5.05%: 801.37 (ON428 line
  61500), so line 53 is 3,961.26 - 801.37 = 3,159.89, below 5,710 and 7,307, so the surtax
  is 0 and line 69 is 3,159.89. The Ontario dividend tax credit (Worksheet ON428) is Return
  K's, 191.14, so line 71, and line 73, are 3,159.89 - 191.14 = 2,968.75. The Ontario tax
  reduction amounts, 294.00, twice, 588.00, are less than line 79, so the reduction is 0 and
  line 81 is 2,968.75. Form T2036, "Provincial or Territorial Foreign Tax Credit", is worked
  on the same sheets of Form T2209 as the federal credit ("do the calculation on a separate
  form for each country in Canadian dollars"), with the net income of note (3), 66,990.00,
  and the tax otherwise payable of note (4): "If you were a resident of Ontario, calculate
  this amount by entering "0" on lines 70 and 72 of Form ON428 and continue the calculation.
  The result from line 81 is your provincial or territorial tax otherwise payable." With "0"
  on line 70 line 71 is line 69, 3,159.89 - 0 = 3,159.89, and with "0" on line 72 line 73 is
  3,159.89 + 0 = 3,159.89; the reduction amounts, 588.00 twice, are less than line 79, so
  line 80 is 0 and line 81 is 3,159.89 - 0 = 3,159.89. United States: line 1 is 1,500; line
  2 is the T2209 line 3, 1,087.60; line 3 is 1,500 - 1,087.60 = 412.40; line 4 is net
  foreign non-business income 10,000 x 3,159.89 / 66,990.00 = 31,598,900 / 66,990.00 =
  471.6957..., rounded half-up to the cent: 471.70; line 5 is "whichever amount is less:
  line 3 or line 4": 412.40. United Kingdom: line 1 is 100; line 2 is 100; line 3 is 0; line
  4 is 5,000 x 3,159.89 / 66,990.00 = 15,799,450 / 66,990.00 = 235.8478..., rounded: 235.85;
  line 5 is 0. "Enter the total from line 5 (for each country if applicable)" on ON428 line
  82: 412.40 + 0 = 412.40, which "should not be more than the amount entered on the line for
  provincial or territorial tax otherwise payable", 3,159.89, so line 82 is 412.40. Line 83
  "Line 81 minus line 82 (if negative, enter "0")" is 2,968.75 - 412.40 = 2,556.35, which
  line 84 carries. The LIFT credit is 5.05% x 50,000 = 2,525.00, at most 875, less 5% of
  net income over 32,500: line 17 = 66,990.00 - 32,500.00 = 34,490.00 and line 19 =
  34,490.00 x 5% = 1,724.50, so line 20 is 875 - 1,724.50, negative: 0, and lines 86 and 88
  (the community food program donation tax credit for farmers of 25% of a chosen $0 is 0)
  are 2,556.35. The health premium (line 89) for taxable income of 66,990.00, "Row 6:
  Taxable Income more than $48,000 but not more than $72,000", is 600, so the Ontario tax
  (line 90) is 2,556.35 + 600 = 3,156.35. The net federal tax (line 42000) is 5,269.02 and
  the total payable (line 43500) is 5,269.02 + 3,156.35 = 8,425.37. The income tax deducted
  (line 43700) is a chosen $9,000. The Canada workers benefit (Schedule 6) is 0: the working
  income is 50,000, so the benefit before the reduction is 1,633, less 15% of the adjusted
  family net income, 66,990.00, over 26,855, 15% x 40,135.00 = 6,020.25 (or 15% x 36,351.00
  = 5,452.65 over 30,639 with an eligible dependant, of whom there are 0), not below zero:
  0. The total credits (line 48200) are 9,000 and the refund or balance owing (line 167) is
  8,425.37 - 9,000 = -574.63, negative, so a refund (line 48400) of 574.63 and no balance
  owing, and, with the opportunities fund donation of 0, a net refund of 574.63. The other
  computed lines follow from the net income and are each claimed for a
  count of 0 or not triggered: the Ontario CARE credit rate for a family adjusted income of
  66,990.00 (Schedule ON479-A line 7, the row "more than $63,600 but not more than $67,200")
  is 47%, applied to a child care expenses deduction of 0; the seniors care at home credit
  (ON479) has a family net income of 66,990.00, which is 66,990.00 - 35,000.00 = 31,990.00
  over the base and a reduction of 5% x 31,990.00 = 1,599.50; the refundable medical expense
  supplement (Federal Worksheet for line 45200) has an adjusted family net income of
  66,990.00 and a line 8 of 66,990.00 - 33,294.00 = 33,696.00 and is 0 for want of an amount
  on line 21500 and line 33200. Every amount computed from a rate, fraction, amount or chart
  on the forms is rounded half-up to the cent, each line being a dollars-and-cents box; the
  lines that only add, subtract, compare or choose take amounts already in cents. Not
  triggered: the minimum tax variant of Form T2036 line 2 (note (1); no minimum tax is
  payable here, see Return BV), the Quebec multiplication of line 4 by 55% (note (5), an
  Ontario resident), the federal surtax on income allocated outside Canada (T1 line 127, and line 6 of Form
  T2209, 0 on both sheets) and every other credit and deduction not named here.
sources:
  - >-
    CRA, Form T2209 2025, Federal Foreign Tax Credits (docs/cra-forms-2025/t2209-25e.pdf,
    confirmed 2026-10-19 from the PDF; no .txt published): "If you paid tax to more than one
    foreign country, and the total foreign taxes paid to all foreign countries was more than
    $200, do the applicable calculation shown on this form for non-business and business
    taxes paid to each country on a separate sheet in Canadian dollars. Enter the total
    amount on this form."; "In most cases, the foreign tax credit amount you can claim for
    each foreign country is whichever is less:" "the foreign income tax you actually paid"
    "the tax otherwise payable in Canada on your net income from that country";
    "Non-business income tax paid to a foreign country (1) 43100" (line 1); "Net foreign
    non-business income (2) 43300" "× Basic federal tax (4) =" over "Net income (3)" (line
    2); "Enter whichever is less: the amount from line 1 or line 2." "Federal non-business
    foreign tax credit" (line 3); "The amount on line 3 should not be more than the total of
    the amount on line 42900 of your return plus any federal surtax on income earned outside
    of Canada."; "Business income tax paid to a foreign country (5) for the year, plus any
    unused foreign tax credits for that country for the 10 years (6) before, and the 3 years
    after this year" (line 4, 43400); "Net foreign business income (7)" "43900" "× Basic
    federal tax (8)" over "Net income (3)" (line 5); "Federal surtax on income allocated to
    "Other (Outside Canada)":" "Amount from line 10 of Part 2 of Form T2203, Provincial and
    Territorial Taxes for Multiple Jurisdictions, or 48% of the amount from line 42900 of
    your return. Enter the amount that applies to the country or countries you identified at
    the top of this page." (line 6); "Add lines 5 and 6." (line 7); "Add basic federal tax
    (8) and the amount from line 6." (line 8); "Enter the amount from line 3, if any." (line
    9); "Line 8 minus line 9" (line 10); "Enter whichever is less: the amount from line 4, 7
    or 10." "Federal business foreign tax credit" (line 11); "Enter the amount from line 3,
    if any." (line 12); "Add lines 11 and 12." "Federal foreign tax credit" (line 13);
    "Enter the amount from line 13 on line 40500 of your return."; note (2): "If your net
    foreign non-business income is more than your net income, use your net income in the
    calculation."; note (5): "Total of business income or profits tax you paid to a country
    or a political subdivision of a country for the year."; note (6): "Unused business
    foreign tax credits can be carried forward 10 years and carried back 3 years."; note
    (7): "Net amount by which the business income you earned in a foreign country is more
    than the business losses you incurred in that country." "If your net foreign business
    income is more than your net income, use your net income in the calculation."; note (8),
    basic federal tax: "Line 42900 of your return plus any federal dividend tax credit (line
    40425 of your return)."; note (3), net income: "Amount from line 23600 of your return
    (or the amount you would have entered if the instructions said "if negative, show in
    brackets") plus the amount on line 68360 of Form T1206, Total split income, minus any:"
    the amounts deductible on lines 24400, 24900, 25000, 25300, 25395 and 25400 and "amounts
    deductible as net employment income from a prescribed international organization, as
    foreign income exempt under a tax treaty, or as adult basic education tuition assistance
    (included on line 25600 of your return)"; note (4), basic federal tax: "Line 42900 of
    your return plus any:" "federal dividend tax credit (line 40425 of your return)" "minus
    any:" "federal refundable First Nations abatement (line 44100 of your return)". The
    countries are the chosen United States (line 1 of 1,500, line 2 of 10,000, business tax
    paid of 400, unused credits of 50, net foreign business income of 6,000, line 6 of 0)
    and United Kingdom (100 and 5,000, business tax paid of 60, unused credits of 0,
    business income of 3,000, line 6 of 0); line 44100 and the six deductions of note (3)
    are 0. Lines 1 and 3 take amounts already in cents; lines 2 and 5 are dollars-and-cents
    boxes, rounded half-up to the cent.
