    rental income: Enter this amount on your income tax and benefit return on line 12599
    (line 8141 plus line 8230)". Part 4: "Line A: Total expenses (add amounts listed under
    "Total expenses")"; "Line 9949: Total for personal portion (add amounts listed under
    "Personal portion of total expenses")"; "Line 9365: Total for short-term rental portion
    (add amounts listed under "Short-term rental portion of total expenses")"; "Line 9366:
    Non-compliant amount for short-term rentals (amount B from Chart A)"; "Line 1:
    Deductible expenses (amount A minus line 9949 minus line 9366)"; "Line 9369: Net income
    (loss) before adjustments (total gross rental income from line 8299 minus deductible
    expenses from amount 1)"; "Line 2: Co-owners: calculate your share of net income from
    line 9369. Enter your result on amount 2"; "Line 9945: Other expenses of the co-owner:
    other deductible expenses you have as a co-owner which you did not deduct elsewhere";
    "Line 3: Subtotal (amount 2 minus line 9945)"; "Line 9947: Recaptured capital cost
    allowance (co-owners: enter your share of the amount)"; "Line 4: Subtotal (amount 3 plus
    line 9947)"; "Line 9948: Terminal loss (co-owners: enter your share of the amount)";
    "Line 5: Subtotal (amount 4 minus line 9948)"; "Line 9936: Total CCA claim for the year
    (amount ii from Area A minus any personal part of CCA, and any CCA for business-use-of
    home expenses)"; "Line 6: Net income (loss) (amount 5 minus line 9936)"; "Line 7:
    Partners: your share of amount 6, or the amount from your T5013 slip, Statement of
    Partnership Income"; "Line 9974: Partners: GST/HST rebate for partners received in the
    year"; "Line 9943: Partners: other expenses of the partner"; "Line 9946: Your net income
    (loss): For sole proprietors or co-owners, enter the result from amount 6. For
    partnerships, enter the result from amount 7 plus line 9974 minus line 9943. Enter this
    amount on line 12600 of your income tax and benefit return". The property has two units
    and one row in the rental properties: its gross rents for all units are a chosen 24,000
    and for short-term rentals a chosen 0, so line 8140 is 0 and line 8141 is 24,000; line
    8230 is a chosen 0, so line 8299, and so T1 line 12599, is 24,000 + 0 = 24,000. The
    expenses are chosen figures, insurance (line 8690) 1,200, interest and bank charges
    (line 8710) 6,000, repairs and maintenance (line 8960) 1,300 and property taxes (line
    9180) 3,500, every other expense line 0 and every personal portion and short-term
    portion 0: amount A, in line order, is 0 + 1,200 + 6,000 + 0 + 0 + 0 + 1,300 + 0 + 3,500
    + 0 + 0 + 0 + 0 = 12,000; lines 9949 and 9365 are 0. There is no row in Chart A, so line
    B, and so line 9366, is 0 (each row would be rounded half-up to the cent). Line 1 is
    12,000 - 0 - 0 = 12,000; line 9369 is 24,000 - 12,000 = 12,000. There is no co-owner (a
    count of 0), so amount 2 is line 9369, 12,000, and line 2 and the co-owner's shares of
    lines 9947 and 9948 and of amount ii are not triggered; line 9945 is a chosen 0, so
    amount 3 is 12,000 - 0 = 12,000. Area A has two classes (below). Neither has a negative
    column 7, so line 9947 is 0 and amount 4 is 12,000 + 0 = 12,000; neither has a positive
    column 7 with no property left (the no-property-left count is a chosen 0 for each), so
    line 9948 is 0 and amount 5 is 12,000 - 0 = 12,000. Line ii, the total of column 23, is
    8,000 + 1,200 = 9,200; the personal part of CCA and the CCA for business-use-of-home
    expenses are a chosen 0 each, so line 9936 is 9,200 - 0 - 0 = 9,200, which is at most
    the limit over all the statements, here this statement's amount 5, 12,000 (Guide T4036:
    "You cannot use CCA to create or increase a rental loss"), so it is allowed; amount 6 is
    12,000 - 9,200 = 2,800. There is no partnership (a count of 0): lines 7, 9974 and 9943
    are not triggered (0 + 0 - 0 = 0), so line 9946, and so T1 line 12600, is amount 6,
    2,800. Area A, "Calculation of capital cost allowance
    (CCA) claim", with the columns "Column 2: Undepreciated capital cost (UCC) at the start
    of the year", "Column 3: Cost of additions in the year (see Areas B and C below)",
    "Column 7: UCC after additions and dispositions (column 2 plus column 3 minus column 5)
    (Note 3)", "Column 10: Cost of remaining additions after immediate expensing (column 3
    minus column 9)", "Column 13: Remaining UCC after immediate expensing (column 7 minus
    column 9)", "Column 18: Adjustment for current-year additions subject to the half-year
    rule. one half multiplied by (column 10 minus column 11 minus column 12 minus column 5).
    If negative, enter "0"", "Column 19: Base amount for CCA (column 13 plus column 15 plus
    column 17 minus column 18)", "Column 20: CCA rate %", "Column 21: Available CCA for the
    year (column 19 multiplied by column 20, or a lower amount, plus column 9)", "Column 23:
    CCA claim for the year (column 21minus column 22)", "Column 24: UCC at the end of the
    year (column 7 minus column 23) (Note 9)" and "Line ii: Total CCA claim for the year *:
    Total of column 23". Class 1, the rental building (a chosen figure, "Class 1 (4%)" in
    Guide T4036): column 2 is a chosen 200,000, there are no additions, dispositions,
    AIIPs or RIIPs (a chosen 0 each), so column 7 is 200,000 + 0 - 0 = 200,000, columns 10
    and 18 are 0 (one half of 0), column 13 and column 19 are 200,000 (DIEPs, columns 4, 6,
    8 and 9, are not modelled, so columns 9, 15 and 17 are 0); the maximum, column 19
    multiplied by the rate of 4%, is 8,000.00 and the claim (column 23) is a chosen 8,000,
    the maximum; column 24 is 200,000 - 8,000 = 192,000. Class 8, the furniture (a chosen
    figure, "Class 8 (20%)"): column 2 is a chosen 5,000 and column 3 a chosen 2,000, so
    column 7 is 5,000 + 2,000 - 0 = 7,000 and column 10 is 2,000; the half-year rule gives
    column 18 as one half of (2,000 - 0 - 0 - 0) = 1,000.00, so column 19 is 7,000 + 0 + 0 -
    1,000 = 6,000.00 and the maximum is 6,000.00 x 20% = 1,200.00, all of which is claimed
    (column 23, a chosen 1,200); column 24 is 7,000 - 1,200 = 5,800. Columns 15, 17 and 18
    and the maximum are dollars-and-cents boxes, rounded half-up to the cent, which changes
    none of them. Not yet computed, so not in this file: line 9367 and Chart B (the
    non-compliant amount of capital cost allowance, column 22: until it is wired the maximum
    is column 21). The rental lines add and subtract
    amounts already in cents.
