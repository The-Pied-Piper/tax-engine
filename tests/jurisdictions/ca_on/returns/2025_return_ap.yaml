# Return AP: Return AD's landlord (a single filer, a 2025 Ontario resident, whose only income
# is rental income from two units of one property, T1 line 13, Form T776 Parts 3 and 4) with
# the capital cost allowance of T776 Area A added: two classes, Class 1 (the building) and
# Class 8 (the furniture). Gross rents, the expenses and everything else are Return AD's: the
# total gross rental income (line 8299, T1 line 12599) is $24,000.00, the expenses allowed
# (line 1) are $12,000.00, and amounts 2 to 5 are $12,000.00 (no co-owner, no recapture and
# no terminal loss). The Class 1 building has a chosen opening UCC of $200,000 and no
# additions, so its maximum is $200,000 x 4% = $8,000.00 and $8,000 is claimed; the Class 8
# furniture has a chosen opening UCC of $5,000 and chosen additions of $2,000, so the
# half-year rule takes off one half of the additions, $1,000.00, column 19 is $6,000.00 and
# the maximum is $6,000.00 x 20% = $1,200.00, all of which is claimed. Line ii is $9,200.00
# and so is line 9936 (no personal part of CCA and no CCA for business-use-of-home expenses,
# a chosen $0 each), which is within amount 5 ($12,000.00), so amount 6 and line 9946, and
# so T1 line 12600, are $12,000.00 - $9,200.00 = $2,800.00, which is the whole of total
# income (line 15000). The UCC at the end of the year (column 24) is $192,000 for Class 1
# and $5,800 for Class 8. With no employment income there are no CPP contributions or EI
# premiums; net income and taxable income are $2,800.00, the federal tax on it is $2,800.00
# x 14.5% = $406.00 and the Ontario tax on it is $2,800.00 x 5.05% = $141.40, both less than
# the non-refundable credits ($2,338.71 and $643.72), so there is no federal or Ontario tax
# and the refund or balance owing is $0. Every figure that depends on income is Return AD's
# recomputed from the form arithmetic, $2,800.00 for $12,000.00. Amounts are quoted decimal
# strings, never floats; counts are quoted digit strings. Every output the CA-ON manifest
# declares must appear under `expected`, or be left out to be 0 (or no records).
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025 whose only income is rental income: two units
  of one property with gross rents of $24,000 (T776 line 8141), expenses of $12,000 and
  capital cost allowance of $9,200 on two classes (T776 Area A, line 9936), so line 12599
  is $24,000.00 and line 12600 is $2,800.00. A chosen set of figures.
  No self-employment income: the net business, professional, commission, farming and fishing
  income (T1 lines 13500, 13700, 13900, 14100 and 14300) are $0, so their sum (line 27) is
  $0, and it is a $0 term of total income (line 15000). The CPP months (Schedule
  8 box A) are the 12 of a full year, Schedule 8 Part 4 is not completed (count 0) and there
  is no agreement with the Canada Employment Insurance Commission (count 0), so the CPP
  contributions payable (line 42100), the base CPP contributions (line 31000) and the
  deduction (line 22200) on self-employment income, and the EI premiums on it (lines 31217
  and 42120), are $0 and change no total.
sources:
  - >-
    CRA, Form T776 (2025), Statement of Real Estate Rentals
