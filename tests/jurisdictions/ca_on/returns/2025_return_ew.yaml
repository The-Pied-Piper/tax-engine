# Return EW: Form T2043 Part 2 for two Alberta farming businesses, each on its own Form
# T2042 statement for a fiscal period of 365 days, 365 of them in 2024, which together reach
# the 25,000 gate of Part 1 Note 1 exactly, and Part 5 with all eight partnership credits
# (ON, MB, SK, AB, NS, PE, NL, NB), which are not gated. Each statement has no inventory
# adjustment, no non-arm's length expense and no partner. Each statement's wheat income is
# its expense plus 10,000 less its line 9951, so each farm nets 10,000 and the two together net
# 20,000. The partnership credits are the Part 5 inputs; the statements are the farms, and their
# line 9951 (200.00 and 199.96) total amount 5C (399.96), as Form T2043 note 2 requires.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  Return EW: a 2025 Ontario resident in Canada throughout 2025, aged 18 or older, with no
  employment income and no other income (every line not named here is 0). Two farming
  businesses, each reported on one Form T2042 (a chosen set), both with their permanent
  establishments in Alberta (designated province code 4). Each farm has wheat income of
  22,500 (a chosen figure) and seeds and plants of 12,500 (a chosen figure), so its total
  farm expenses are 12,500.00 and its net farming income is 10,000.00; the two net farming
  incomes total 20,000.00. Each fiscal period is 365 days (entered as 365), all 365 of them
  in 2024 (a chosen figure: the days in 2024). Chart A of each statement: amount 5 is 0.00,
  so amount 6 (gross farming expenses) is 12,500.00; amount 7 is 365 divided by 365, which
  is 1, and amount 8 is 12,500.00 for each farm, so 25,000.00 in all. Part 1 line 67061 is
  the total of amount 6, 25,000.00, which is exactly the 25,000 of Note 1, so the businesses
  are eligible (the threshold is reached, not passed). Part 2: Alberta's 25,000.00 at the
  0.229% payment rate (0.00229) is 57.25 (2D); the other seven provinces are 0.00, so 2I is
  57.25. Part 5: 5A is 2I, 57.25, because line 67061 reaches the threshold; 5B is 0.00 (Part
  4 is not in this return); the eight partnership credits are allocated, one for each
  province, of 11.11 (ON, line 67079), 22.22 (MB, line 67080), 33.33 (SK, line 67081), 44.44
  (AB, line 67082), 55.55 (NS, line 67103), 66.66 (PE, line 67104), 77.77 (NL, line 67105)
  and 88.88 (NB, line 67106), which total 399.96 (5C), not gated by the threshold; and 5D,
  the total credit for all businesses that is line 47556, is 457.21. The credit is not
  refunded here: the 2025 federal tax after credits (561.29) and the Ontario tax after the
  Ontario tax reduction (144.56) total 705.85, which exceeds the 457.21, and no tax was
  withheld. The Canada workers benefit (line 45300) is refundable and is 1,633.00: the working
  income is the self-employment profit of 20,000.00 (Schedule 6 line 3), 27% of the 17,000.00 over
  3,000.00 is 4,590.00, capped at 1,633.00, and the adjusted family net income of 20,000.00 is
  under 26,855.00. With it the total credits are 2,090.21 and the refund is 2,090.21 - 705.85 =
  1,384.36, so the balance owing is 0.00. The Ontario health premium is 0.00 at this income.
sources:
  - >-
    CRA, Form T2043 (2025), Return of Fuel Charge Proceeds to Farmers Tax Credit
    (docs/cra-forms-2025/t2043-25e.pdf, a PDF quote confirmed 2026-10-25;
    https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2043/t2043-25e.pdf), page 1:
    "Fill in parts 1, 2 and 5 if you have: one farming business with one or more permanent
    establishments in only one designated province; multiple farming businesses, each of
    which has one or more permanent establishments in the same designated province; multiple
    farming businesses, where, for example, one business has one or more permanent
    establishments in only one designated province and another business has one or more
    permanent establishments in a different designated province".
  - >-
    CRA, Form T2043 (2025), Part 1, line 67061 "Total gross farming expenses for all of your
    businesses: Add amount 6 of every Chart A." Note 1: "If your total gross farming
    expenses for all businesses are $25,000 or more, you are eligible to claim the credit."
  - >-
    CRA, Form T2043 (2025), Chart A: amount 1 "Total farming expenses (line 9898 of Form
    T2042)"; amount 6 "Gross farming expenses: Amount 1 minus amount 5"; amount 7 "Total
    number of days in the fiscal period that fall within the 2024 calendar year divided by
    the total number of days in the fiscal period (if the fiscal period starts and ends in
    2025, enter "0")"; amount 8 "Amount 6 multiplied by amount 7."
  - >-
    CRA, Form T2043 (2025), Part 2: "Add all farming expenses in AB from amount 8 of Chart
    A" (67066) "× AB payment rate 0.229% =" (2D); "Total: Add amounts 2A to 2H (enter this
    total at amount 5A)" (2I).
  - >-
    CRA, Form T2043 (2025), Part 5: "Enter amount 2I" (5A); "Enter amount 4I" (5B); "Credit
    allocated from a partnership for ON (amount from box 237 of each T5013 slip or from each
    letter)" (67079), and the same for MB (67080), SK (67081), AB (67082), NS (67103), PE
    (67104), NL (67105) and NB (67106); "Total credit allocated from partnerships: Add lines
    67079 to 67082 and lines 67103 to 67106" (5C); "Total credit for all businesses: Amount
    5A plus amount 5B plus amount 5C (enter this amount on line 47556 of your income tax and
    benefit return)" (5D).
