  ca/employment_income: "45000"
  ca/t4_cpp_pensionable_earnings_outside_quebec: "45000"
  ca/t2204_insurable_earnings: "45000"
  ca/t2204_premiums_deducted: "738.00"
  ca/cpp_months: "12"
  ca/qpp_months: "12"
  ca/schedule_8_instances:
    - {}
  ca/cpp_t4_base_and_first_additional_contributions: "2469.25"
  ca/cpp_t4_second_additional_contributions: "0.00"
  ca/resident_in_canada_throughout_2025: "1"
  ca/aged_18_or_older_at_end_of_2025: "1"
  ca/t777_eligible_tools_cost: "2500"
  ca/t777_were_a_tradesperson_in_2025: "1"
  ca/t777_tradesperson_tools_certified_on_t2200_question_12: "1"
  ca/t777_tradesperson_employment_income: "45000"
  ca/t777_tradespersons_tools: "1000"
expected:
  ca/t777:
    - ca/t777_tools_formula_b: "1029"
      ca/t777_tradespersons_tools_maximum_deduction: "1000.00"
      ca/t777_line_9: "1000"
      ca/t777_line_15: "1000.00"
      ca/t777_line_17: "1000.00"
  ca-on/return:
    - ca/total_income: "45000.00"
      ca/other_employment_expenses: "1000.00"
      # The electrician answers nothing to the apprentice mechanic conditions (0 by default), so
      # (A minus B) of 29 is not available and nothing is carried forward.
      ca/t777_apprentice_mechanic_tools_carried_forward_out: "0.00"
      ca-on/ontario_tax_less_dividend_credit: "1416.31"
      ca/cpp_second_additional_earnings_maximum: "9900.00"
      ca/net_income_before_adjustments: "43585.00"
      ca/other_payments_limit_income: "43585.00"
      ca/refund_or_balance_owing: "4908.51"
      ca/t4_cpp_pensionable_earnings_slip_checked: "45000"
