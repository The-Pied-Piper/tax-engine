# Return LJ: Guide T4044, Tradesperson's tools example (electrician). Amounts are quoted decimal
# strings.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  Return LJ: Guide T4044 (2025), "Tradesperson's tools deduction", Example: an electrician who paid
  $2,500 for tools and earned $45,000 of employment income in 2025. The Guide's maximum deduction is
  the lesser of $1,000 and ($2,500 minus $1,471) = $1,029, so the claim is $1,000 "on line 22900".
  The worksheet computes it: A is the lesser of the $2,500 cost and the $45,000 income, so
  2,500; A minus $1,471 is 1,029 (the Guide's $1,029); the lesser of $1,000 and 1,029 is the
  maximum deduction of 1,000.00. The claim of $1,000 is the filer's entry on line 9, which is
  refused above the maximum, so line 9, lines 15 and 17 are 1,000 and T1 line 22900 is 1,000.00.
  The electrician answers yes to "If you were a tradesperson in 2025" and to the employer's T2200
  certification, and is not an apprentice mechanic, so no apprentice mechanic amount is carried
  forward. Every other line is the engine's figure.
sources:
  - >-
    CRA, Guide T4044 (2025), Employment Expenses (docs/cra-forms-2025/t4044-25e.txt;
    https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t4044/t4044-25e.txt), "Deduction for
    tools", Example: "You paid $2,500 for the tools you needed, and you earned $45,000 in employment
    income in 2025 as an electrician." "Your maximum deduction for 2025 is the lesser of $1,000 and
    $1,029 ($2,500 minus $1,471). You claim a deduction of $1,000 on line 22900 of your 2025 income
    tax and benefit return."
  - >-
    CRA, Form T777 (2025), Statement of Employment Expenses (docs/cra-forms-2025/t777-25e.pdf, the
    only published copy; https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t777/t777-25e.pdf):
    line 9 "Tradesperson's tools expenses (maximum $1,000)".
