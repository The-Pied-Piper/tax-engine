# Return AY: Return Y's single parent with one child, to which 10,000 of dividends other than
# eligible dividends from a private corporation controlled by a relative, received with no slip,
# are added; 11,500.00 grossed up, all of it split income (Form T1206). Schedule ON479-A line 1
# of the Ontario childcare access and relief from expenses (CARE) tax credit is the TOSI-adjusted
# net income of Form T1206 Part 1 line 6, so the split income is part of the family adjusted
# income. The other lines are blank.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025, resident in Canada throughout 2025, aged 18 or
  older at the end of 2025, a parent of one child born in 2015, an eligible child for the child
  care expenses deduction, with employment income (T1 line 10100) of $60,000 and child care
  expenses of $6,000 paid in 2025 (every figure a chosen figure), as in Return Y, and 10,000 of
  dividends other than eligible dividends received with no slip from a private corporation
  controlled by a relative, which are split income. The grossed-up dividends are 11,500.00, so
  the split income is a chosen classification: all 11,500 is both T1206 line 1 and the part of
  it included on line 2, so line 4 (total split income, line 23200) is 11,500 and the total income (line 15000)
  is 60,000 + 11,500.00 = 71,500.00. The child care expenses deduction (line 21400) is 5,000
  as in Return Y, and the net income before adjustments (line 23400) is 54,435.00, as in
  Return Y, as line 23200 takes the split income out again. T1206 line 5 is 54,435.00 and
  line 6 is 11,500 + 54,435.00 = 65,935.00. Schedule ON479-A column 1: line 1 is 65,935.00
  (the TOSI-adjusted net income, not the net income before adjustments of 54,435.00); line 2
  is 5,000; line 4 is 65,935.00 + 5,000 = 70,935.00. A supporting person's adjusted income of
  30,000 (column 2 line 4) is a chosen figure; line 5 is 100,935.00. Line 7: 100,935.00 is in
  the table row "more than $99,600 but not more than $103,200: 27%", so the rate is 27%; line
  6 is 5,000 and line 8 is 5,000 x 27% = 1,350.00. Return Y, with no split income, has a
  family adjusted income of 89,435.00, a rate of 33% and a credit of 1,650.00. The other
  lines are the engine's figures (to be confirmed against CRA's calculator). T1206 line 33C
  is the Ontario tax on split income, 20.53% x 11,500 = 2,360.95, divided by 5.05% =
  46,751.49 (a declared output).
sources:
  - >-
    CRA, "T1206 Tax on split income" (confirmed 2026-10-19), Part 1: line 4 "Total split
    income: line 1 plus line 3 Enter this amount on line 23200 of your return."; line 5 "Net
    income from line 23600 of your tax return (or the amount you would have entered if the
    instructions on line 23600 read "if negative, show in brackets")"; line 6 "TOSI-adjusted
    net income: line 4 plus line 5 If negative, enter the result in brackets"; the note: "Use
    the TOSI-adjusted net income from line 6 of this form in place of your net income from
    line 23600 to calculate the provincial and territorial amounts you can claim, if
    applicable, for the following amounts: (If the TOSI-adjusted net income at line 6 is
    negative, use the negative value when it is part of an adjusted net income calculation,
    otherwise use zero.)" including "the childcare access and relief from expenses tax credit
    for Ontario (use line 6 of this form at column 1 of line 1 of Schedule ON479-A)".
  - >-
    CRA, Schedule ON479-A (form 5006-TCA), "Ontario Childcare Access and Relief from
    Expenses (CARE) Tax Credit", "Family adjusted income calculation for the tax credit":
    line 1 "Net income from line 23600 of the return (or the amount you would have entered
    if the instructions on line 23600 said "if negative, show in brackets")"; line 2
    "Child care expenses deduction from line 21400 of the return"; line 4 "Add lines 1 to 3
    (if negative, enter "0"). Adjusted income"; line 5 "Add the amounts from line 4 of
    columns 1 and 2. Family adjusted income"; line 6 "Enter your child care expenses
    deduction from line 21400 of your return."; line 7 "If your family adjusted income on
    line 5 is "0", enter 75%. If not, enter the tax credit rate that applies to your family
    adjusted income from the table below."; line 8 "Line 6 multiplied by the percentage
    from line 7 Enter this amount on line 63050 of your Form ON479." Line 3 "Social benefits
    repayment from line 23500 of the return" is left out here.
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-tca/5006-tca-25e.txt
