# Return IR: Return BD with the fishing boat used mainly for personal use. A single sole proprietor
# (a 2025 Ontario resident) whose only activity is a fishing business, one Form T2121 (Statement of
# Fishing Activities): fish products of $4,000 (amount 3A), so the gross income (line 8299, T1 line
# 14299) is $4,000.00; expenses of $25,000 on two lines (salt, bait and ice, line 9138, $10,000, and
# fishing gear, line 9136, $15,000), so amount 4Q and line 9368 are $25,000.00; no capital cost
# allowance, no repairs, no partner and no business-use-of-home amounts. The filer answers 1 to
# "the fishing boat was used mainly for personal use". Guide T4002 (page 51): "However, the amount
# you deduct cannot be more than your income from the catch." The income from the catch is the gross
# income of Part 3 (line 8299, $4,000.00), so the amount deducted is the lesser of $25,000.00 and
# $4,000.00, $4,000.00, and the net income before adjustments (line 9369) is 4,000.00 - 4,000.00 =
# $0.00 (without the answer it would be 4,000.00 - 25,000.00 = -$21,000.00). So the net fishing
# income (line 9946, T1 line 14300), the net self-employment income (T1 line 27), total income
# (line 15000), net income and taxable income are all $0.00. With no income the federal and Ontario
# basic tax are 0, the non-refundable credits are the amounts of Return BD (the credit amounts do
# not depend on the net income, 16,129.00 federal and 12,747.00 Ontario, so 2,338.71 and 643.72),
# the Ontario tax reduction is twice the basic reduction less the Ontario tax of 0: 588.00 - 0 =
# 588.00 (Return BD: 588.00 - 113.78 = 474.22), the working income of the Canada workers benefit
# (Schedule 6 line 3) is the self-employment profit, $0.00, so the benefit and the refund are 0, and the CPP
# line 49 and Schedule 8 Part 5 line 30 (the net self-employment earnings of 0.00 less the $3,500
# exemption, not below 0) are 0.00 where Return BD has 1,368.50 and 11,500.00. The
# minimum tax (Form T691) basic federal tax is the tax of 0 less the credits of 2,338.71, the same
# arithmetic as Return BD (2,175.00 less 2,338.71 = -163.71): -2,338.71, and the carryover for 2026
# is 2,338.71. Amounts are quoted decimal strings, never floats; counts are quoted digit strings.
# Every output the CA-ON manifest declares must appear under `expected`, or be left out to be 0 (or
# no records). The farming lines (Form T2042) are not triggered and are not listed here.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025 whose only activity is a fishing business, reported on
  one Form T2121, Return BD's with fish products of $4,000 (amount 3A) in place of $40,000 and the
  answer 1 to the fishing boat used mainly for personal use: line 8299 and T1 line 14299 are
  $4,000.00; expenses of $25,000 (salt, bait and ice, line 9138, $10,000, and fishing gear, line
  9136, $15,000) make amount 4Q and line 9368 $25,000.00. By Guide T4002 the amount deducted
  cannot be more than the income from the catch, the gross income of Part 3, $4,000.00, so it is
  the lesser of $25,000.00 and $4,000.00, $4,000.00, and line 9369 is 4,000.00 - 4,000.00 =
  $0.00, not a loss of $21,000.00. With no capital cost allowance, no repairs, no partner and no
  business-use-of-home amounts, line 9946 and T1 line 14300 are $0.00, the net self-employment
  income (T1 line 27) is $0.00 and so are total income (line 15000), net income and taxable
  income. The motor vehicle expenses (line 9281) are Charts A to C for a leased passenger vehicle
  used for no fishing (business kilometres 0), so line 9281 is $0 and changes no total. A chosen
  set of figures. The farming income (Form T2042, T1 line 25) is not triggered and is 0. The CPP
  months (Schedule 8 box A) are the 12 of a full year, Schedule 8 Part 4 is not completed (count
  0) and there is no agreement with the Canada Employment Insurance Commission (count 0), so the
  CPP contributions payable (line 42100), the base CPP contributions (line 31000) and the
  deduction (line 22200) on self-employment income, and the EI premiums on it (lines 31217 and
  42120), are $0 and change no total.
sources:
  - >-
    CRA, Guide T4002 2025, Self-employed business, professional, commission, farming, and fishing
    income (https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t4002/t4002-25e.pdf, page 51,
    confirmed 2026-10-25 from the PDF; CRA publishes no .txt), "Use of a fishing boat mainly for
    personal use": "You may have used a fishing boat mainly for personal use, but sometimes caught
    a small amount of fish to sell. In this case, you can deduct expenses and CCA. However, the
    amount you deduct cannot be more than your income from the catch." Form T2121 prints no line for
    the limit; the figures here are hand-derived from that one sentence, the income from the catch
    being the gross income of Part 3 (line 8299, amount 4A) and the expenses and CCA being line 9368
    (Part 4 "Total expenses: Amount 4Q plus line 9936").
  - >-
    CRA, Form T2121 (2025), Statement of Fishing Activities (docs/cra-forms-2025/t2121-25e.pdf,
    confirmed 2026-10-19 from the PDF; https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2121/t2121-25e.pdf),
    Part 3: "Gross income: Total of amounts 3A to 3F and line 9600 (enter this amount on line
    14299 of your income tax and benefit return)" (8299); Part 4: "Gross income (line 8299 of
    Part 3)" (4A); "Subtotal: Add amounts 4B to 4P." (4Q); "Total expenses: Amount 4Q plus line
    9936" (9368); "Net income (loss) before adjustments: Amount 4A minus line 9368." (9369); Part
    5: "Your net income (loss): Amount 5C minus line 9945 (enter this amount on line 14300 of your
    income tax and benefit return)" (9946).
  - >-
    CRA, Form T2121 (2025), Charts A to C (docs/cra-forms-2025/t2121-25e.pdf, the PDF text): Chart A
    "Total motor vehicle expenses: Add amounts 3 to 11." (12); "Business use part: amount 1 ÷ amount 2
    × amount 12 = 13" (13); "Business parking fees" (14); "Supplementary business insurance" (15);
    "Allowable motor vehicle expenses: Add amounts 13 to 15 (enter this total on line 9281 of Part 4)"
    (16). Chart B: "Total interest payable (accrual method) or paid (cash method) in the fiscal period" (17);
    "($350*** ÷ 30) × the number of days in the fiscal period for which interest was payable (accrual
    method) or paid (cash method)" (18); "Available interest expense: Amount 17 or 18, whichever is
    less (include this in amount 4 of Chart A above)" (19). Chart C: "Total lease charges incurred in
    your current fiscal period for the vehicle." (20); "Total lease payments deducted before your
    current fiscal period for the vehicle" (21); "Total number of days the vehicle was leased in your
    current and previous fiscal periods" (22); "Manufacturer's list price" (23); "Use a GST rate of 5%
    or HST rate applicable to your province."; "Amount 23 or ($44,706 + GST and PST, or $44,706 + HST),
    whichever is more" and "× 85%" (24); "[($1,100 + GST and PST, or $1,100 + HST) × amount 22] ÷ 30"
    (25); "Amount 25: amount 21" (26); "[($38,000 + GST and PST, or $38,000 + HST) × amount 20] ÷ amount
    24" (27); "Eligible leasing cost: Amount 26 or 27, whichever is less (enter in amount 8 of Chart A
    above)" (28). The charts are the figures of Return BB's leased vehicle with business kilometres 0
    (amount 1), a chosen figure, so amount 13 and line 9281 are 0 and the other lines are the same.
  - >-
    CRA, Form T2121 (2025), Charts A to C: the chosen figures are amount 2 (total kilometres) 10,000;
    amount 3 (fuel and oil) 1,000, amount 5 (insurance) 600, amount 7 (maintenance and repairs) 200
    and amount 10 (other expenses) 653; amounts 6, 9, 11, 14 and 15 are 0; amount 17 (total interest
    payable) 400 and the number of days 183, so line 18 is 350 ÷ 30 × 183 = 2,135.00 and amount 19 is
    the lesser, 400.00; amount 20 (total lease charges) 2,550, amount 21 (payments before the year) 0,
    amount 22 (days leased) 183, amount 23 (manufacturer's list price) 60,000 and the GST or HST rate
    13%: 44,706 + 13% = 50,517.78, 1,100 + 13% = 1,243.00 and 38,000 + 13% = 42,940.00; amount 23 or
    44,706 plus tax, whichever is more, is 60,000.00; amount 24 is 60,000.00 × 85% = 51,000.00; amount
    25 is 1,243.00 × 183 ÷ 30 = 7,582.30; amount 26 is 7,582.30 - 0 = 7,582.30; amount 27 is 42,940.00
    × 2,550 ÷ 51,000.00 = 2,147.00; and amount 28 is the lesser, 2,147.00. Chart A: amount 12 is 1,000
    + 400 + 600 + 200 + 2,147 + 653 = 5,000.00; amount 13 is 0 × 5,000 ÷ 10,000 = 0.00; and line 9281
    (amount 16) is 0.00 + 0 + 0 = 0.00. Every product and quotient here is exact to the cent, so no
    line is rounded; line 9281 is $0, so the fishing expenses do not change.
  - >-
    The figures that depend on the net income, with the forms quoted in Return BD (the same
    lines, taxes and credits, here on a net income of 0.00): the federal tax on taxable income and
    the Ontario basic tax are 0.00 x 14.5% and 0.00 x 5.05%, 0; the credit amounts are the basic
    personal amounts, which do not depend on the net income at or below $177,882 (16,129.00 and
    12,747.00), so the non-refundable tax credits are 2,338.71 and 643.72, more than the tax of 0;
    the medical threshold, the lesser of 3% of net income (0.00) and $2,834, is 0.00; the Ontario
    tax reduction is twice the basic reduction, 588.00, less the Ontario tax of 0, 588.00, which is
    more than the tax, so the tax after the reduction is 0. Schedule 6: the working income is the
    self-employment profit of 0.00, so the Canada workers benefit is 0 and so is the refund.
