# Return HE: two farming businesses, one in Ontario and one in Manitoba, each on its own Form T2042
# statement with its own designated province and no Chart B, so Part 2 (Chart A) only. Box 67062
# ("multiple farming businesses with one or more permanent establishments in multiple provinces or
# territories") is 1 here: the two statements are present in two places, Ontario and Manitoba.
# Figures are by hand from the form text (see the description).
jurisdiction: CA-ON
tax_year: 2025
description: >-
  Return HE: a 2025 Ontario resident in Canada throughout 2025, aged 18 or older, with no
  employment income and no other income (every line not named here is 0). Two farming
  businesses, each reported on one Form T2042 (a chosen set).
  Statement 1 is a farm in Ontario (a chosen set): wheat income (line 9659) of 50,000.00 and seeds
  and plants of 36,500.00, so the total farm expenses (line 9898) are 36,500.00 and its net farming
  income (line 9946) is 13,500.00. Its designated province code is 1 (Ontario). It uses no Chart B.
  Statement 2 is a farm in Manitoba (a chosen set): wheat income of 40,000.00 and seeds and plants
  of 18,250.00, so line 9898 is 18,250.00 and its net farming income is 21,750.00. Its designated
  province code is 2 (Manitoba). It uses no Chart B.
  Each fiscal period runs from July 1, 2024 to June 30, 2025, which is 365 days (entered as 365),
  of which 184 fall in 2024 (a chosen figure: the days in 2024).
  Chart A of each statement: amount 5 is 0.00, so amount 6, the gross farming expenses, is
  36,500.00 for statement 1 and 18,250.00 for statement 2. Amount 7 is 184 divided by 365, and
  amount 8 is amount 6 multiplied by amount 7: 36,500 times 184/365 is 18,400.00 for statement 1
  (Ontario), and 18,250 times 184/365 is 9,200.00 for statement 2 (Manitoba). The other designated
  provinces are 0 (chosen figures: no other designated province is entered).
  Part 1 line 67061 is the total of amount 6, 54,750.00, which is 25,000 or more, so the businesses
  are eligible. Part 2: 2A is Ontario's amount 8 of 18,400.00 at 0.229% (line 67063), which is
  42.136, rounded half-up to 42.14; 2B is Manitoba's 9,200.00 at 0.229% (line 67064), which is
  21.068, rounded half-up to 21.07; 2I, which is amount 5A, is 63.21. Parts 3 and 4 are 0: no
  statement uses Chart B, so there are no rows 1 to 5 and no Chart C. Part 5: 5A is 63.21, 5B is
  0.00 (amount 4I), 5C is 0.00 (no partnership credit), and 5D, the total credit for all businesses
  that is line 47556, is 63.21.
  Box 67062 is 1: the statements are present in two places (statement 1 in Ontario, statement 2 in
  Manitoba) and there are 2 statements, so the box is ticked. Per statement, the presence amounts
  are 1 for the place the statement is in and 0 for the others; the nine totals are 1 for Ontario,
  1 for Manitoba and 0 for the other seven places.
  The tax lines of the return (net income 35,250.00, the federal and Ontario tax, the refund and
  the balance owing) are the engine's figures, not hand-worked, and are listed under
  `ca-on/return` so that the lines the return form exports are pinned; the hand-worked figures
  above are the ones this worked example is for.
sources:
  - >-
    CRA, Form T2043 (2025), Return of Fuel Charge Proceeds to Farmers Tax Credit
    (docs/cra-forms-2025/t2043-25e.pdf, a PDF text read; no .txt is published;
    https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2043/t2043-25e.pdf), page 1: "Tick this
    box if you have multiple farming businesses with one or more permanent establishments in
    multiple provinces or territories." (box 67062), and "Fill in Part 2 for your farming businesses
    that have one or more permanent establishments that operate in only one of the designated
    provinces."
  - >-
    CRA, Form T2043 (2025), Part 1, Note 1: "If your total gross farming expenses for all businesses
    are $25,000 or more, you are eligible to claim the credit." Line 67061 "See note 1"; "Add amount
    6 to line 67061 of Part 1."
  - >-
    CRA, Form T2043 (2025), Chart A: "Total farming expenses (line 9898 of Form T2042)" (amount 1);
    "Subtotal: Add amounts 2 to 4." (amount 5); "Gross farming expenses: Amount 1 minus amount 5"
    (amount 6); "Total number of days in the fiscal period that fall within the 2024 calendar year
    divided by the total number of days in the fiscal period (if the fiscal period starts and ends
    in 2025, enter "0")" (amount 7); "Amount 6 multiplied by amount 7." (amount 8).
  - >-
    CRA, Form T2043 (2025), Part 2: "Add all farming expenses in ON from amount 8 of Chart A."
    "67063" "× ON payment rate 0.229% = 2A"; "Add all farming expenses in MB from amount 8 of
    Chart A." "67064" "× MB payment rate 0.229% = 2B"; "Total: Add amounts 2A to 2H (enter this total
    at amount 5A)" (2I).
  - >-
    CRA, Form T2043 (2025), Part 5: "Enter amount 2I" (5A); "Enter amount 4I" (5B); "Total credit for
    all businesses: Amount 5A plus amount 5B plus amount 5C (enter this amount on line 47556 of your
    income tax and benefit return)." (5D).
