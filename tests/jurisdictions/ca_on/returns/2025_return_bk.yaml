# Return BK: a single filer, a 2025 Ontario resident, whose only income is farming income from
# two farming businesses, each reported on its own Form T2042 statement (T1 line 25). The first
# statement has wheat (line 9371) of a chosen $12,000.00 and no expenses, so its net income
# (line 9946) is $12,000.00; the second has fertilizers and lime (line 9662) of a chosen
# $2,000.00 and no income, so its net income (line 9946) is -$2,000.00, a loss. T1 line 14100
# "Net" is the sum of the statements' lines 9946: $12,000.00 + (-$2,000.00) = $10,000.00,
# which is the net self-employment income (line 27) and the whole of total income (line
# 15000). With no employment income, Schedule 8 Part 4 not completed and no agreement for EI,
# there are no CPP contributions or EI premiums; net income and taxable income are
# $10,000.00, the federal tax on it is $10,000.00 x 14.5% = $1,450.00 and the Ontario tax on it
# is $10,000.00 x 5.05% = $505.00, both less than the non-refundable credits ($2,338.71 and
# $643.72), so there is no federal or Ontario tax. The Canada workers benefit (line 45300) is
# $1,633.00: the working income is the $12,000.00 profit (the $2,000.00 loss is excluded, Schedule 6
# line 3, Note 2), 27% of the $9,000.00 over $3,000 is $2,430.00, capped at $1,633.00, and the
# adjusted family net income of $10,000.00 is under $26,855.00, so the refund is $1,633.00. Every
# figure that depends on income is Return BI's, whose total income is also $10,000.00. Amounts are quoted
# decimal strings, never floats; counts are quoted digit strings. Every output the CA-ON
# manifest declares must appear under `expected`, or be left out to be 0 (or no records; for a
# form's export, one blank record for each statement).
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025 whose only income is farming income from two
  farming businesses, each on its own T2042 statement: net incomes (line 9946) of $12,000 and
  -$2,000, so line 14100 is $10,000.00. A chosen set of figures.
  The net farming income (T1 line 25, line 14100) is $10,000.00 and there is no business,
  professional, commission or fishing income (T1 lines 13500, 13700, 13900 and 14300, all $0),
  so their sum (line 27) is 0 + 0 + 0 + 10,000 + 0 = $10,000.00, which is all of total income
  (line 15000): line 28 is line 21 (0) plus line 27. The CPP months (Schedule
  8 box A) are the 12 of a full year, Schedule 8 Part 4 is not completed (count 0) and there
  is no agreement with the Canada Employment Insurance Commission (count 0), so the CPP
  contributions payable (line 42100), the base CPP contributions (line 31000) and the
  deduction (line 22200) on self-employment income, and the EI premiums on it (lines 31217
  and 42120), are $0 and change no total.
