    business, each completed on its own. Part 3: "Wheat" (9371); "Gross income: Total of the
    income lines (enter this amount on line 14099 of your income tax and benefit return)"
    (9659). Part 4: "Gross income (line 9659 of Part 3)." (4A); "Fertilizers and lime" (9662); "Subtotal of expenses" (4B); "Capital cost allowance (CCA). Enter amount
    ii of Area A minus any personal part and any CCA for business-use-of-home expenses." (9936);
    "Total farm expenses: Amount 4B plus line 9936" (9898); "Net income (loss) before inventory
    adjustments: Amount 4A minus line 9898" (9899); "Optional inventory adjustment included
    in the current year" (9941); "Mandatory inventory adjustment included in the current year"
    (9942); "Net income (loss) after inventory adjustments: Total of lines 9899, 9941, and
    9942" (4C). Part 5: "Your share of amount 4C or the amount from your T5013 slip,
    Statement of Partnership Income" (5A); "Return of fuel charge proceeds to farmers tax
    credit allocated to you in the year" (9951); "GST/HST rebate for partners received in the
    year" (9974); "Total: Amount 5A plus line 9951 plus line 9974" (5B); "Other amounts
    deductible from your share of net partnership income (loss) (amount 6F)" (9943); "Net
    income (loss) after adjustments: Amount 5B minus line 9943" (5C); "Business-use-of-home
    expenses (amount 7P)" (9945); "Your net income (loss): Amount 5C minus line 9945 (enter
    this amount on line 14100 of your income tax and benefit return)" (9946). Part 7: "Net
    income (loss) after adjustments (amount 5C) (if negative, enter "0")." (7N); "Allowable
    claim: Amount 7M or 7N above, whichever is less" (7P). Statement 1, a chosen set of
    figures: wheat (line 9371) 12,000 and every other amount 0 (the other income lines, the
    expense lines, the inventory adjustments, Area A, Charts A to C, the partner figures and
    Part 7): line 9659, and so amount 4A, is 12,000 + 0 = 12,000; the expense lines, line 9936
    and line 9790 are 0, so amount 4B and line 9898 are 0 and line 9899 is 12,000 - 0 =
    12,000; lines 9941 and 9942 are 0, so amount 4C is 12,000 + 0 + 0 = 12,000. There is no
    partnership (a count of 0): amount 5A is amount 4C, 12,000, lines 9951 and 9974 are 0 and
    amount 5B is 12,000 + 0 + 0 = 12,000; amount 6F and line 9943 are 0 and amount 5C is
    12,000 - 0 = 12,000. Part 7 is all 0: amount 7M is 0; amount 7N is amount 5C, 12,000;
    amount 7O is 0 - 12,000, negative, so 0; amount 7P is the lesser of 0 and 12,000, 0, which
    is line 9945. Line 9946 is 12,000 - 0 = 12,000. Statement 2, a chosen set of figures: no
    income, so line 9659, and so amount 4A, is 0; fertilizers and lime (line 9662) 2,000 and
    every other expense line 0, so amount 4B is 2,000 and line 9936 is 0, line 9898 is 2,000 +
    0 = 2,000 and line 9899 is 0 - 2,000 = -2,000; with lines 9941 and 9942 0, amount 4C is
    -2,000 + 0 + 0 = -2,000. There is no partnership: amount 5A is -2,000, amount 5B is -2,000
    + 0 + 0 = -2,000 and amount 5C is -2,000 - 0 = -2,000. Amount 7N is amount 5C, or 0 when it
    is negative: 0; with Part 7 all 0 amount 7M is 0, amount 7O is 0 - 0 = 0 and amount 7P is
    the lesser of 0 and 0, 0, which is line 9945. Line 9946 is -2,000 - 0 = -2,000. Neither
    statement has an Area A class, so the UCC at the end of the year (column 22) of each is an
    empty list and amount 7O of each is 0.
