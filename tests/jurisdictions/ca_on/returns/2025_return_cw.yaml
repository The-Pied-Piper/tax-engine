# Return CW: one filer, one immediate expensing limit across three forms. A 2025 Ontario resident
# with a rental (one Form T776), a shop (one Form T2125) and a farm (one Form T2042), each
# statement writing off a designated immediate expensing property (DIEP) in full: $600,000 on
# the rental, $500,000 on the shop and $400,000 on the farm. Each statement is under the $1.5
# million limit by itself; together they are $1,500,000.00, exactly the limit, so the return
# passes (the same filer with $1,500,000.01 or more is refused, see test_return_cw.py). No one
# is associated with another eligible person or partnership (EPOP), so every statement's limit is
# $1,500,000.00 and the person's one limit is that. Amounts are quoted decimal strings, never
# floats; counts are quoted digit strings. Every output the CA-ON manifest declares must appear
# under `expected`, or be left out to be 0 (or no records).
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025 with three activities, each reported on one
  statement and each a chosen set of figures: a rental (Form T776) with gross rents of $700,000
  (one property, one unit, line 8141), a shop (Form T2125) with gross sales of $600,000 (amount
  3A) and a farm (Form T2042) with wheat sales of $500,000 (amount 3A); there are no other
  income or expense lines. Each statement has one Area A class, Class 8 (20%), bought in the
  year: additions (column 3) and DIEP additions (column 4) equal, with all of them expensed at
  once (column 9): $600,000 on the rental, $500,000 on the shop and $400,000 on the farm. Column
  7 is the additions, column 13 (column 7 minus column 9) is 0, column 10 is column 3 minus
  column 4, 0, so the half-year rule's column 18 and the base for CCA (column 19) are 0 and the
  CCA of the class (column 21) is the column 9 amount alone, claimed in full: line 9936 is
  $600,000 on the rental, $500,000 on the shop and $400,000 on the farm, and the UCC at the end
  of the year (column 22) is 0. Each claim is at most the income before CCA of its source
  ($700,000, $600,000 and $500,000), the UCC of its DIEPs (column 8) and the statement's limit.
  Nobody is associated with another EPOP, so each statement's limit is the $1.5 million of
  endnote 5, $1,500,000.00. Net income before adjustments is $100,000 on each statement
  ($700,000 - $600,000, $600,000 - $500,000 and $500,000 - $400,000), so T1 line 12600 (net
  rental income) is $100,000, line 13500 (business income) is $100,000 and line 14100 (farming
  income) is $100,000, and the net self-employment income is $200,000.00 (business plus farm) and total income is $300,000.00.
  The return adds the three claims, $600,000 + $500,000 + $400,000 + $0 (no fishing statement)
  = $1,500,000, and the person's one limit is the common limit of the statements that claim
  above 0, $1,500,000.00; the total is not more than the limit, so it passes. The CPP months
  (Schedule 8 box A) are the 12 of a full year, Schedule 8 Part 4 is not completed (count 0)
  and there is no agreement with the Canada Employment Insurance Commission (count 0); the CPP
  and EI lines depend on figures this return does not enter and are the engine's own.
sources:
  - >-
    CRA, Form T776 (2025), Statement of Real Estate Rentals (docs/cra-forms-2025/t776-25e.txt),
    Area A, Column 9 Note 5: "The total immediate expensing amount for the tax year (total of
    column 9) is limited to the lesser of: - the immediate expensing limit, which is equal to
    one of the following, whichever is applicable: -- $1.5 million, if you are not associated
    with any other eligible person or partnership (EPOP) in the tax year"; "Line i: Total
    immediate expensing claim for the year: Total of column 9". The same endnote 5 is printed in
    Area A of Form T2125 (docs/cra-forms-2025/t2125-25e.pdf) and Form T2042
    (docs/cra-forms-2025/t2042-25e.pdf), confirmed from the PDFs.
  - >-
    CRA, Guide T4002 (2025), Self-employed Business, Professional, Commission, Farming, and
    Fishing Income (docs/cra-forms-2025/t4002-25e.pdf, confirmed from the PDF with pdftotext;
    https://www.canada.ca/content/dam/cra-arc/formspubs/pub/t4002/t4002-25e.pdf), and Guide
    T4036 (2025), Rental Income (docs/cra-forms-2025/t4036-25e.pdf, confirmed from the PDF):
    "The deduction is limited to $1.5 million per tax year". The forms print the limit for each
    statement and are silent on a person who files several statements; the Guides' "per tax
    year" is the only statement of the rule across statements, and this return applies the rule that the limit is the person's and that the
    total of every statement's column 9 over the forms T776, T2125, T2042 and T2121 may not be
    more than it.
  - >-
    The income, expense and CCA lines of the three statements, the T1 lines they feed and the
    CPP, EI and tax lines that follow are the engine's own, as in Returns BS, BT and BX, whose
    figures were each checked against their forms; the figures of this return are chosen.
