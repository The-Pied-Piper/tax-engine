# Return I: a 2025 Ontario resident whose employment income is below the EI maximum
# insurable earnings ($65,700) and the CPP first earnings ceiling ($71,300), so the CPP
# contributions and EI premiums are the rates' arithmetic, not the printed maximums, and
# there is no second additional CPP contribution. Computed from employment income to total
# income; from employment income, by Schedule 8's three contribution tiers, to the base,
# first additional and second additional CPP contributions, the last two together the
# enhanced CPP contributions; from employment income, up to the EI maximum insurable
# earnings, to the EI premiums; from the unused RRSP contributions from earlier years and
# the RRSP contributions, their sum, to the contributions available to deduct (Schedule 7
# line 10), from those and the deduction limit, the lesser of them, to the most that may be
# deducted (Schedule 7 line 17), from the amount deducted (line 18), at most that, to the
# RRSP deduction (line 20), and from the contributions available to deduct less the RRSP
# deduction to the unused contributions carried forward (line 23); from the numbers of
# eligible children (T778 Part B lines 1 to 3), $8,000, $11,000 and $5,000 for each, summed
# to the basic limit (line 4), from employment income, the earned income (line 6), to
# two-thirds of it, and from those and the child care expenses paid (line 5), the least of
# them, to the child care expenses deduction (lines 7 and 9, T1 line 21400), here, with no
# eligible child and no expenses paid, zero; less the child care expenses deduction and the
# enhanced CPP contributions to net income, less the (empty) deductions from net income to
# taxable income; from net income, by the Federal Worksheet, to the federal basic personal
# amount; from it less the dependant's net income, not below zero, for each eligible
# dependant, to the amount for an eligible dependant (T1 line 30400), and from the ON428
# base less the dependant's net income, not below zero, at most its maximum, for each
# eligible dependant, to the Ontario amount (ON428 line 58160); from the number of infirm
# children, $2,687 for each, to the amount for infirm children (line 30500), here, with no
# eligible dependant and no infirm child, all three zero; and through each form's total of
# non-refundable credit amounts (its basic personal amount, its amount for an eligible
# dependant, the base CPP contributions and the EI premiums, and on the T1 alone the amount
# for infirm children and the Canada employment amount), credited once at the form's credit
# rate to the form's non-refundable tax credits (T1 line 35000, ON428 line 61500), taken off
# its basic tax, not below zero, to the tax after credits, and on ON428 the surtax on the
# Ontario tax after credits, added to it to the Ontario tax with surtax, less the Ontario
# dividend tax credit (Worksheet ON428's line 61520, from lines 12000 and 12010, ON428 lines
# 56 to 58, 70 and 71), not below zero, to the Ontario tax after the dividend credit; and,
# with no dependent children or dependants, the Ontario tax reduction amounts (the basic
# reduction alone), twice them less the Ontario tax after the dividend credit, not below
# zero, to the Ontario tax reduction, taken off the Ontario tax after the dividend credit,
# not below zero, to the Ontario tax after the reduction; from employment income, by
# Schedule ON428-A, 5.05% of it at most $875, less 5% of net income over $32,500, not below
# zero, to the LIFT credit (ON428 line 85), taken off the Ontario tax after the reduction,
# not below zero, to the Ontario tax after the LIFT credit (line 86), less 25% of the
# qualifying donations (line 87), not below zero, to the Ontario tax after the food credit
# (line 88); and from taxable income, by the health premium chart's tiers, each capped at
# the next plateau, to the Ontario health premium, added to the Ontario tax after the food
# credit to the Ontario tax; from employment income, by Schedule 6, 27% of the working
# income over $3,000 at most $1,633, less 15% of the adjusted family net income, here net
# income, over $26,855, not below zero, for a filer with no eligible spouse and no eligible
# dependant, and the same at most $2,813 and over $30,639 for a filer with one, and from
# those, by the number of Schedule 6 eligible dependants (line 38100), the first when it is
# zero and the second otherwise, to the Canada workers benefit (T1 line 45300); and on the
# T1, the federal tax after credits, carried to the net federal tax, plus the Ontario tax to
# the total payable, less the total credits, here the chosen income tax deducted plus the
# Canada workers benefit plus the provincial credits (line 47900), to the refund or balance
# owing, negative for a refund and positive for a balance owing. There is no capital gain,
# unused or new RRSP contribution or union dues. There are no Ontario credits (Form ON479):
# no eligible medical expenses for fertility treatment and no amount paid for seniors' use
# of Ontario public transit services, so lines 1, 14, 18 and 21 and T1 line 47900 are $0 (to
# be confirmed). The ON428 community food program donation tax credit for farmers is
# not claimed: the qualifying donations are a chosen $0, a caller input taken as entered
# (line 87) and refused above the gifts of Schedule 9 line 12. The
# Schedule 9 inputs of this return are $0 (a chosen figure), so its charitable donation
# claim is not entered there, and lines 116 (34900) and 117 (34990) are $0 and line 35000 is
# line 33800. Not yet computed, so not in this file: any deduction from net income and
# capital losses (the social benefits repayment, line 23500, is 0, as the chart does not
# apply). Line 82 (the provincial foreign tax credit)
# is not triggered by this return, nor are Schedule 5 line 2, T1 lines 30425 and 30450, the
# Ontario caregiver amount (ON428 line 58185), Form T778 line 8 and Parts C and D, and
# Schedule 6's disability supplement (Step 3) and advance payments (Step 4); with no
# Schedule 6 eligible dependant (line 38100), the Schedule 6 amounts for a filer with no
# eligible spouse and no eligible dependant are the ones chosen (to be confirmed). Amounts
# are quoted decimal strings, never floats; counts are quoted digit strings. Every output
# the CA-ON manifest declares must appear under `expected`; intermediate lines may be listed
# and are then checked too.
# Ontario political contributions (ON479 line 15, line 63100) are a chosen $0, so Worksheet
# ON479's line 16 is $0 (column 1 applies).
# Federal political contributions (T1 line 135 and line 40900) are a chosen $0, so the Federal
# Worksheet's line 41000 is $0 (column 1 applies).
# The Ontario seniors care at home tax credit (ON479 line 13, line 63095) is not claimed (a
# chosen count of 0), so ON479 line 13 is $0.
# The refundable medical expense supplement (T1 line 154 and line 45200, Federal Worksheet)
# takes chosen inputs: the counts of residence in Canada throughout 2025 and of age 18 or
# older at the end of 2025 are 1 and its other new amounts (line 21500, lines 22900 and
# 23100, the net self-employment lines, the wage-loss replacement plan amounts and the
# spouse's column) are $0. The working income is $48,000 (employment income less lines
# 20700, 21200, 22900 and 23100); line 6, the adjusted family net income, is the net income,
# $47,555.00 (column 1 alone, as the spouse's column is 0 and line 23500 is 0, the chart
# not applying);
# line 8 is line 6 less 33,294.00, $14,261.00; and line 16 and the supplement are $0,
# because line 9 (line 21500, a chosen $0) and line 10 (line 33200, $0 with no medical
# expenses) are 0.
# Form ON-BEN (lines 61020 to 61230) is not applied for (a chosen 0 for each tick box and a
# chosen $0 for each Part A amount), so its ten lines are carried as entered, all 0.
# Rental income (T1 line 13, Form T776 Parts 3 and 4) is a chosen $0: no rental properties
# and no Chart A rows, and every expense box and co-owner and partner figure $0, so T1 lines
# 12599 and 12600 are $0.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  An Ontario resident with 2025 employment income (T1 line 10100) of $48,000 and no other
  income: no capital gain, so taxable capital gains (line 12700) of $0 and total income
  (line 15000) of $48,000. The CPP contributions are computed from employment income, which is
  entered as the T4 box 26 pensionable earnings (the slip's box 26 being blank, the form's "enter
  the amount from box 14"). The EI
  premiums are computed from employment income, taken as the insurable earnings. Employment
  income is below the EI maximum insurable earnings ($65,700) and the CPP first earnings
  ceiling ($71,300), so EI premiums (line 31200, ON428 line 58300) are 1.64% x 48,000 =
  $787.20, base CPP contributions (Schedule 8 line 11, T1 line 30800, ON428 line 58240) are
  4.95% x (48,000 - 3,500) = $2,202.75, and enhanced CPP contributions (line 22215) are the
  first additional (Schedule 8 line 12) 1% x 44,500 = $445.00 with no second additional
  contribution (line 22, $0). No unused or new RRSP contributions, so the most that may be
  deducted (Schedule 7 line 17) is $0, the lesser of the contributions available to deduct
  (Schedule 7 line 10) of $0 (the unused contributions from earlier years of $0, Schedule 7
  line 1, plus the contributions of $0, Schedule 7 line 4) and a chosen deduction limit of
  $8,640 (Schedule 7 line 11); the amount deducted (line 18) is that $0, so the RRSP
  deduction (line 20800) is $0 and the unused contributions carried forward (line 23) are
  $0; no union dues (line 21200) and no child care expenses deduction (line 21400, Form
  T778, $0 with no eligible child and no child care expenses paid, to be confirmed), so
  total deductions (line 23300) are the enhanced CPP contributions of $445.00 and net income
  (line 23600) is $47,555.00. There are no deductions from net income (lines 24400 to
  25600), so their total (line 25700) is $0 and taxable income (line 26000), derived as net
  income less that total, is $47,555.00, inside the lowest federal and Ontario brackets. The
  non-refundable credit amounts are the basic personal amount (federal line 30000 $16,129,
  since net income is $177,882 or less; Ontario ON428 line 58040 $12,747), the base CPP
  contributions and the EI premiums, and on the T1 alone the Canada employment amount (line
  31260) of $1,471, the lesser of $1,471 and employment income (ON428 has no such line):
  line 33500 of $20,589.95 and ON428 line 58800 of $15,736.95. Each total includes $0 for an
  eligible dependant (line 30400, ON428 line 58160) and, on the T1, $0 for infirm children
  (line 30500), as there is no eligible dependant and no infirm child (to be confirmed);
  Schedule 5 and ON428 lines 14 to 16 are computed as for one eligible dependant with no net
  income, 16,129 federally and 11,905.00 at most $10,823 for Ontario, and claimed for none.
  The rate is applied once to each total: 14.5% federally (line 33800) and 5.05% for Ontario
  (ON428 line 58840). Each product, rounded half-up to the cent, is its form's
  non-refundable tax credits: the total federal non-refundable tax credits (line 35000) of
  $2,985.54 and the Ontario non-refundable tax credits (ON428 line 61500) of $794.72, each
  taken off its form's basic tax, not below zero. The Ontario surtax (ON428 line 68) is 20%
  of the Ontario tax after credits over $5,710 plus 36% of it over $7,307: $0, as the
  Ontario tax after credits is below $5,710, so the Ontario tax with surtax (ON428 line 69)
  is that same $1,606.81. With no dividends, Worksheet ON428's lines A and B (lines 12000
  and 12010) are $0, so the Ontario dividend tax credit (ON428 line 57, line 61520) and line
  70 are $0, and the Ontario tax after the dividend credit (ON428 line 71, which is line 73)
  is that same $1,606.81. With no dependent children and no dependants (ON428 lines 75 and
  76), the Ontario tax reduction amounts (line 77) are the basic reduction of $294.00 (line
  74); twice them, $588.00 (line 78), less the Ontario tax after the dividend credit (line
  79, from line 73, which is line 71 as line 72 is not triggered) is negative, so the
  Ontario tax reduction (line 80) is $0 and the Ontario tax after the reduction (line 81) is
  that same $1,606.81. The LIFT credit (ON428 line 85, Schedule ON428-A) is 5.05% of
  employment income, $2,424, at most $875, less 5% of net income over $32,500, $752.75:
  $122.25, and the Ontario tax after it (ON428 line 86) is $1,606.81 - $122.25 = $1,484.56.
  The community food program donation tax credit for farmers (ON428 line 87) is 25% of
  the qualifying donations, a chosen $0 as no gift is claimed on Schedule 9: $0 x 25% =
  $0.00, and the Ontario tax after it (line 88) is $1,484.56 -
  $0.00 = $1,484.56. The Ontario health premium (ON428 line 89) is read from its chart on
  taxable income: $47,555.00 is more than $38,500 but not more than $48,000, so the premium
  is $450, and the Ontario tax (ON428 line 90) is the Ontario tax after the food credit plus
  the premium, $1,484.56 + $450 = $1,934.56. On the T1, the net federal tax (line 42000) is
  the federal tax after credits, $3,909.94, and the total payable (line 43500) is it plus
  the Ontario tax (line 42800), $5,844.50. The Canada workers benefit (line 45300, Schedule
  6) is 27% of the working income, the employment income, over $3,000, $12,150, at most
  $1,633, less 15% of the adjusted family net income, the net income, over $26,855,
  $3,105.00; the reduction is more than the $1,633, so the benefit is $0. With no eligible
  dependant, these are the amounts for a filer with no eligible spouse and no eligible
  dependant; with one, at most $2,813 less 15% over $30,639, $2,537.40, the benefit would be
  $275.60. The income tax deducted (line 43700) is a chosen $4,800, so the total credits
  (line 48200) are it plus the benefit plus the provincial credits (line 47900, the Ontario
  credits of Form ON479 line 21, $0 with no fertility treatment expenses and no seniors'
  transit amount paid), $4,800, and the refund or balance owing (line 167) is the total
  payable less the total credits, $1,044.50: positive, so a balance owing (line 48500). Every
  amount computed from a rate, fraction, amount or chart on the forms is rounded half-up to
  the cent, each line being a dollars-and-cents box; here that changes Form T778 line 6, the
  federal tax on taxable income, the Ontario tax on taxable income and both forms'
  non-refundable tax credits, and the lines that follow from them. The lines that only add,
  subtract, compare or choose take amounts already in cents, so the refund or balance owing
  is in cents too. The age amount (line 30100), the spouse or common-law partner amount
  (line 30300) and the Canada caregiver amount for a spouse or common-law partner (line
  30425) are each $0: the filer is taken as born in 1961 or later (the count of filers born
  in 1960 or earlier, line 78, is 0), claims no spouse amount (count 0) and has no spouse
  eligible for the Canada caregiver amount (line 51090, count 0), and the spouse's net
  income entered is $0 (to be confirmed). They are computed all the same (the Federal
  Worksheet's line 4 is the net income over $45,522, $2,033.00, line 6 is 15% of it,
  $304.95, and line 7 is $8,723.05; Schedule 5 line 30300 is $16,129.00 and line 30425
  $8,601.00) and claimed for 0, so the totals of credit amounts are those without them.
  ON428's age amount (line 58080, Worksheet ON428) and spouse or common-law partner amount
  (lines 11 to 13, line 58120) are each $0, for the same counts. They are computed all the
  same (the worksheet's line 4 is the net income over $46,330, $1,225.00, line 6 is 15% of
  it, $183.75, and line 7 is $6,039.25; ON428 line 13 is the $11,905.00 base less the
  spouse's net income of $0, at most $10,823.00) and claimed for 0, so ON428's total of
  credit amounts is as without them.
  No self-employment income: the net business, professional, commission, farming and fishing
  income (T1 lines 13500, 13700, 13900, 14100 and 14300) are $0, so their sum (line 27) is
  $0, and it is a $0 term of total income (line 15000). The CPP months (Schedule
  8 box A) are the 12 of a full year, Schedule 8 Part 4 is not completed (count 0) and there
  is no agreement with the Canada Employment Insurance Commission (count 0), so the CPP
  contributions payable (line 42100), the base CPP contributions (line 31000) and the
  deduction (line 22200) on self-employment income, and the EI premiums on it (lines 31217
  and 42120), are $0 and change no total.
