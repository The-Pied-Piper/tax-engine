    Employment income of 48,000 is below the $71,300 ceiling: line 1 is 48,000; line 2 is
    the lesser of 81,200 and 48,000, 48,000; line 4 is 48,000 - 71,300, negative, so 0; line
    5 is 48,000 - 0 = 48,000; line 7 is 48,000 - 3,500 = 44,500. So base (line 11) 44,500 x
    4.95% = 2,202.75 (below the 3,356.10 maximum); first additional (line 12) 44,500 x 1% =
    445.00 (below the 678.00 maximum); second additional (line 22) 0 x 4% = 0; line 48, and
    so line 22215, is 445.00 + 0 = 445.00. Not triggered by this return, so not modelled:
    Part 2's monthly proration for fewer than 12 months; a T4 box 26 that differs from box
    14; and contributions deducted on the slip (lines 8 to 10 and 14 to 24) that differ from
