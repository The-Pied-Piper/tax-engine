  - >-
    CRA, "CPP contribution rates, maximums and exemptions", 2025 row: maximum annual
    pensionable earnings $71,300; basic exemption $3,500; employee rate 5.95%. CRA, the 2025
    Schedule 8 (form 5000-S8), Part 3: line 7 "Line 5 minus line 6 (if negative, enter "0")
    (maximum $67,800)"; line 11 "amount from line 7 multiplied by 4.95% (maximum
    $3,356.10)"; line 12 "amount from line 7 multiplied by 1% (maximum $678.00)"; line 22
    "amount from line 4 multiplied by 4% (maximum $396.00)"; line 36 "Enter this amount (in
    dollars and cents) on line 30800 of your return and line 58240 of your Form 428."; line
    48 "Enter this amount (in dollars and cents) on line 22215 of your return." The
    contributions are computed from employment income, taken as the pensionable earnings:
    line 7 is 50,000 - 3,500 = 46,500, line 11 is 46,500 x 4.95% = 2,301.75, line 12 is
    46,500 x 1% = 465.00 and line 22 is 0 x 4% = 0 (earnings are below the $71,300 ceiling),
    each rounded half-up to the cent; line 48, and so line 22215, is 465.00 + 0 = 465.00.
    CRA, "EI premium rates and maximums", 2025 federal row: maximum annual insurable
    earnings $65,700; rate 1.64%; maximum annual employee premium $1,077.48. The premiums
