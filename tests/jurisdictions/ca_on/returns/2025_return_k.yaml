  - >-
    CRA, the 2025 ON428 (form 5006-C): line 10 and line 58080 "Age amount (if you were born
    in 1960 or earlier) (use Worksheet ON428) (maximum $6,223)"; line 11 "Base amount
    11,905.00"; line 12 "Your spouse's or common-law partner's net income from line 23600 of
