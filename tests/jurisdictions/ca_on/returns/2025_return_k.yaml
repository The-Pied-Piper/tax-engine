  - >-
    CRA, the 2025 Federal Worksheet (form 5000-D1, docs/cra-forms-2025/5000-d1-25e.txt,
    confirmed 2026-10-19), "Lines 12000 and 12010 - Taxable amount of dividends from taxable
    Canadian corporations": "Line 1: Box 32 of all T3 slips"; "Line 2: Box 25 of all T4PS
    slips"; "Line 3: Box 11 of all T5 slips"; "Line 4: Box 130 of all T5013 slips"; "Line 5:
    Add lines 1 to 4. Enter this amount on line 12010 of your return."; "Line 6: Boxes 32
    and 50 of all T3 slips"; "Line 7: Boxes 25 and 31 of all T4PS slips"; "Line 8: Boxes 11
    and 25 of all T5 slips"; "Line 9: Boxes 130 and 133 of all T5013 slips"; "Line 10: Add
    lines 6 to 9. Enter this amount on line 12000 of your return."; "Taxable amount of
    dividends if you did not receive an information slip"; "Line 11: Actual amount of
    eligible dividends received"; "Line 12: Applicable rate 138%"; "Line 13: Line 11
    multiplied by the percentage from line 12"; "Line 14: Actual amount of dividends other
    than eligible dividends received"; "Line 15: Applicable rate 115%"; "Line 16: Line 14
    multiplied by the percentage from line 15 Include this amount on line 12010 of your
    return."; "Line 17: Line 13 plus line 16. Include this amount on line 12000 of your
    return.". Lines 3, 8 and the no-slip lines 11 and 14 are chosen figures, 200, 500, 1,000
    and 500: the amounts on the taxpayer's slips and the dividends received, which nothing
    on this return determines; lines 1, 2, 4, 6, 7 and 9 are 0. Line 5 is 0 + 0 + 200 + 0 =
    200; line 10 is 0 + 0 + 500 + 0 = 500; line 13 is 1,000 x 138% = 1,380.00; line 16 is
    500 x 115% = 575.00; line 17 is 1,380.00 + 575.00 = 1,955.00. Line 12010 of the return
    is line 5 plus line 16 (the "Include this amount" of line 16), 200 + 575.00 = 775.00,
    and line 12000 is line 10 plus line 17, 500 + 1,955.00 = 2,455.00. The rates are
    datasets as printed, 138% and 115% (fractions, as they are above one); each product is a
    dollars-and-cents box, rounded half-up to the cent, which changes none of these.
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-d1/5000-d1-25e.txt
  - >-
    CRA, the 2025 Federal Worksheet (form 5000-D1), "Line 40425 - Federal dividend tax
    credit": "Complete the following calculation if you reported dividends from taxable
    Canadian corporations on line 12000 of your return."; "Line 1: Boxes 39 and 51 of all T3
    slips"; "Line 2: Boxes 26 and 32 of all T4PS slips"; "Line 3: Boxes 12 and 26 of all T5
    slips"; "Line 4: Boxes 131 and 134 of all T5013 slips"; "Line 5: Add lines 1 to 4.";
    "Line A: Amount from line 12000 of your return (Note 1)"; "Line 6: Amount from line
    12010 of your return (Note 1) Line B, multiplied by 9.0301%"; "Line 2: Amount A minus
    amount B Line C"; "multiplied by 15.0198%" (printed "Line 2" where line 7 is meant);
    "Line 8: Line 6 plus line 7"; "Line 9: Line 5 plus line 8 Enter this amount on line
    40425 of your return."; "Note 1" "Enter only the amount of dividends that were not shown
    on an information slip." The slip credit, line 3 (boxes 12 and 26 of the T5 slips), is a
    chosen 60.00, the credit shown on the slip, and the other slip lines are 0: line 5 is 0
    + 0 + 60.00 + 0 = 60.00. By Note 1 line A is the no-slip dividends, the Federal
    Worksheet's line 17 of 1,955.00 (not the 2,455.00 of line 12000 of the return, which
    counts the slip too), and line B the no-slip dividends other than eligible, its line 16
    of 575.00 (not the 775.00 of line 12010). Line 6 is 575.00 x 9.0301% = 51.923075,
    rounded half-up to the cent: 51.92; line C is 1,955.00 - 575.00 = 1,380.00; line 7 is
    1,380.00 x 15.0198% = 207.27324, rounded half-up to the cent: 207.27; line 8 is 51.92 +
    207.27 = 259.19; line 9, and so line 40425, is 60.00 + 259.19 = 319.19. The rates are
    datasets as printed, 9.0301% and 15.0198%. Lines 5, 8 and 9 and amount C take amounts
    already in cents.
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-d1/5000-d1-25e.txt
  - >-
