# Return JM: Return FZ with the Ontario employment on TWO T4 slips instead of one, the worked example
# of the count of T4 slips (`ca/t4_cpp_slip_count` 2, `ca/t4_qpp_slip_count` 1). Schedule 8 Part 3
# and Form RC381 Part 3 take one total over all the slips for box 26 and print "maximum $81,200 per
# slip", so box 26 is checked against the count times that maximum. The totals are Return FZ's, so
# every line of the return is Return FZ's; what is new is the count and the checked box 26 below it.
# Return JM, as Return FZ: Zoe, a single 2025 Ontario resident with three T4 slips: two for Ontario
# employment (box 26 of $60,000 in all, box 16 of $3,521.31 and box 16A of $100.00) and one for Quebec employment (box 26
# of $36,000, box 17 of $637.20 and box 17A of $150.00), and an election (Form CPT20) to pay
# additional CPP contributions on $3,000 of employment earnings not shown on a T4 and $2,000 on a
# T4: the worked example of Form RC381 with the CPP over-contributed, the QPP under-contributed and
# the second additional QPP contributions short, so that Part 3 line 53 is negative and line 61
# positive, line 68 is negative and line 69 is negative, and Part 4 is completed (chosen figures).
# The return carries one Form RC381 and no Schedule 8 (the exclusive group ca/cpp_calculation). Part
# 2 gives 12 months (lines A and B). Part 3 gives line 69 of -136.00, negative, so the CPT20 election
# continues at Part 4, and Part 4 is used for the final selection because lines 70 and 83 of Part 4
# are above zero: the T1 lines are line 30800 (also ON428 line 58240) $3,470.51, line 22215 $938.00,
# line 44800 $0.00, line 42100 $272.00, line 31000 (also ON428 line 58280) $0.00 and line 22200
# $272.00. Amounts are quoted decimal strings, never floats; counts are quoted digit strings. Every
# output the CA-ON manifest declares must appear under `expected`, or be left out to be 0 (or no
# records). The other lines are blank.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  Zoe, a single Ontario resident for all of 2025, resident in Canada throughout 2025, aged 18 or
  older at the end of 2025 (a chosen figure), with employment income (T1 line 10100) of $80,000 (a
  chosen figure) on three T4 slips and no other income: two T4 slips for Ontario employment (of $30,000
  each) with box 26 of $60,000 in all, box 16 of $3,521.31 and box 16A of $100.00, and a T4 for Quebec employment with box 26 of
  $36,000, box 17 of $637.20 and box 17A of $150.00 (chosen figures), and an election on Form CPT20
  to pay additional CPP contributions on $3,000 of employment earnings not shown on a T4 slip and
  $2,000 of employment earnings shown on one (chosen figures; no net partnership or self-employment
  income). The CPT20 earnings are only the election's base: they are not added to total income. The
  CPP is over-contributed: box 16 is 1,000.00 more than the 2,521.31 required (line 24 of Part 3).
  The QPP is under-contributed: box 17 is 990.00 less than the 1,627.20 required (line 44 of Part
  3). The second additional contributions are short by 146.00: boxes 16A and 17A total 250.00 against
  the 396.00 required (line 67 of Part 3). Because a T4 slip has Quebec as its province of
  employment, Form RC381 is completed in place of Schedule 8 (the return carries one copy of the
  form and no Schedule 8). The figures of the form are worked out by hand below; the tax figures on
  the return are the engine's (see the end).
  What this return reaches, and why it is a separate return: Part 3
  lines 77 (3.38), 90 (146.00) and 91 (10.00), and Part 4 lines 6 to 12, 29 to 31, 54, 55 and 94
  (3.38), with the Part 4 results taken for the final selection. Line 77 needs line 53 of Part 3 negative and line 60 positive, and line
  84 needs line 60 negative and line 53 positive (line 84 is Return GA's case), so the two cannot
  both be non-zero in one return. This return has line 53 of Part 3 negative (-3.38, the base for
  the CPP and QPP together) and line 60 positive (13.38, the first additional for the CPP and QPP
  together): the two can have opposite signs because the CPP split (83.1933% base) and the QPP split
  (84.375% base) differ, and the first additional surplus leaves line 61 at 10.00. Lines 90 and 91
  need line 68 of Part 3 negative, the second additional QPP shortfall. Part 4 lines 65, 68 and 69 are completed only when line 3 of Part 3 is less than line 58 of
  Part 4 (3,500.00, line F of Part 2, the basic exemption), which is the case of Return GB, not this
  one.
  Part 2: line A (the months that CPP applied) and line B (the months that QPP applied) are 12 and
  12 (chosen figures), so lines C to F (the CPP) and G to J (the QPP) are the table's row for 12
  months: 71,300.00, 9,900.00, 81,200.00 and 3,500.00 for each. Part 3 lines 1 to 69 (the CPP side,
  the QPP side and the totals). Line 1 (50339), the CPP pensionable earnings of the slips outside
  Quebec, is 60,000.00; line 2 (50329), the QPP pensionable earnings of the slips in Quebec, is
  36,000.00; line 3 = 60,000.00 + 36,000.00 = 96,000.00, more than line C (71,300.00), so lines 12
  to 15 are completed. Line 4 = line 1 = 60,000.00; line 5 = line 3 = 96,000.00. Line 6 = 60,000.00
  divided by 96,000.00 = 0.625 exactly, cut to the fifth decimal place: 0.62500. Line 7 = line E
  (81,200.00) x 0.625 = 50,750.00; line 8 = line C (71,300.00) x 0.625 = 44,562.50; line 9 = line F
  (3,500.00) x 0.625 = 2,187.50; line 10 = line D (9,900.00) x 0.625 = 6,187.50. Line 11 is the
  lesser of line 1 (60,000.00) and line 7 (50,750.00): 50,750.00. Line 12 = line 11 = 50,750.00;
  line 13 = line 8 = 44,562.50; line 14 = 50,750.00 less 44,562.50 = 6,187.50; line 15 is the lesser
  of line 10 (6,187.50) and line 14 (6,187.50): 6,187.50. Line 16 = line 11 less line 15 =
  44,562.50. Line 17 = line 9 = 2,187.50. Line 18 = 44,562.50 less 2,187.50 = 42,375.00. Line 19
  (50340), the total of box 16 of the T4 slips, is 3,521.31; line 20 = 3,521.31 x 83.1933% =
  2,929.49; line 21 = 3,521.31 less 2,929.49 = 591.82. Line 22 = 42,375.00 x 4.95% = 2,097.5625,
  2,097.56 (not above 3,356.10); line 23 = 42,375.00 x 1% = 423.75 (not above 678.00); line 24 =
  2,097.56 + 423.75 = 2,521.31, the required base and first additional contributions. Line 25
  (50341, box 16A) is 100.00. Line 26 = line 15 (6,187.50) x 4% = 247.50 (not above 396.00). The QPP
  side: line 27 = line I (81,200.00) less line 7 (50,750.00) = 30,450.00; line 28 = line G
  (71,300.00) less line 8 (44,562.50) = 26,737.50; line 29 = line J (3,500.00) less line 9
  (2,187.50) = 1,312.50; line 30 = line H (9,900.00) less line 10 (6,187.50) = 3,712.50. Line 31 is
  the lesser of line 2 (36,000.00) and line 27 (30,450.00): 30,450.00. Line 3 (96,000.00) is more
  than line G (71,300.00), so lines 32 to 35 are completed: line 32 = line 31 = 30,450.00; line 33 =
  line 28 = 26,737.50; line 34 = 30,450.00 less 26,737.50 = 3,712.50; line 35 is the lesser of line
  30 (3,712.50) and line 34 (3,712.50): 3,712.50. Line 36 = line 31 less line 35 = 26,737.50. Line
  37 = line 29 = 1,312.50. Line 38 = 26,737.50 less 1,312.50 = 25,425.00. Line 39 (50330), the total
  of box 17 of the T4 slips, is 637.20; line 40 = 637.20 x 84.375% = 537.64 (537.6375, rounded half
  up to the cent); line 41 = 637.20 less 537.64 = 99.56. Line 42 = 25,425.00 x 5.4% = 1,372.95 (not
  above 3,661.20); line 43 = 25,425.00 x 1% = 254.25; line 44 = 1,372.95 + 254.25 = 1,627.20. Line
  45 (50331, box 17A) is 150.00. Line 46 = line 35 (3,712.50) x 4% = 148.50 (not above 396.00).
  The totals: line 47 = line 20 = 2,929.49; line 48 = line 40 = 537.64; line 49 = 2,929.49 + 537.64
  = 3,467.13; line 50 = line 22 = 2,097.56; line 51 = line 42 = 1,372.95; line 52 = 2,097.56 +
  1,372.95 = 3,470.51; line 53 = 3,467.13 less 3,470.51 = -3.38 (in brackets). Line 54 = line 21 =
  591.82; line 55 = line 41 = 99.56; line 56 = 591.82 + 99.56 = 691.38; line 57 = line 23 = 423.75;
  line 58 = line 43 = 254.25; line 59 = 423.75 + 254.25 = 678.00; line 60 = 691.38 less 678.00 =
  13.38. Line 61 = line 53 plus line 60 = -3.38 + 13.38 = 10.00, positive. Line 62 = line 25 =
  100.00; line 63 = line 45 = 150.00; line 64 = 100.00 + 150.00 = 250.00. Line 65 = line 26 =
  247.50; line 66 = line 46 = 148.50; line 67 = 247.50 + 148.50 = 396.00. Line 68 = line 64 less
  line 67 = 250.00 less 396.00 = -146.00 (in brackets). Line 69 = line 61 plus line 68 = 10.00 -
  146.00 = -136.00, negative. Line 69 is negative, so the form's negative branch applies: the return
  may pay additional CPP contributions (Form CPT20), and the form continues at Part 4 for that
  election. Part 3a (the positive branch, lines 70 to 74) is not the path. Part 3b is completed as
  the form's branch for a line 69 of "0" or negative (lines 75 to 93, below); Part 4 repeats the
  same steps for the employment income (lines 92 to 98 and 99 to 110), and its results are the ones
  carried to the return (see the final selection).
  Part 3b: line 75 (line 53 is negative) is line 49 = 3,467.13; line 76 = line 53 as a positive
  amount = 3.38; line 77 is the lesser of line 60 (13.38) and line 76 (3.38) = 3.38, as line 53 is
  negative and line 60 is positive; line 78 = 3.38 less 3.38 = 0.00; line 79 = line 75 plus line 77
  = 3,467.13 + 3.38 = 3,470.51; line 80 is "0", as line 68 is negative; line 81 = line 79 plus line
  80 = 3,470.51, the base contributions through employment income (line 30800 of the return on this
  branch). Line 82 (line 60 is positive) = line 59 = 678.00; line 83 is not completed (line 60 is
  positive, so the form continues at line 89) and is 0; line 84 is "0" (line 53 is negative); line
  85 = 0.00 less 0.00 = 0.00; line 86 = line 82 plus line 84 = 678.00; line 87 is "0" (line 68 is
  negative; the printed line 68 minus line 80, -146.00, is not used); line 88 = line 86 plus line 87
  = 678.00. Line 89 (line 68 is negative) = line 64 = 250.00; line 90 (line 68 is negative) = line
  68 as a positive amount = 146.00; line 91 is the lesser of line 61 (10.00) and line 90 (146.00), as
  line 61 is positive: 10.00; line 92 = line 89 plus line 91 = 260.00; line 93 = line 88 plus line
  92 = 678.00 + 260.00 = 938.00, the deduction for enhanced contributions on employment income (line
  22215 of the return on this branch).
  Part 4 (lines 1 to 129; line 61 of Part 3 is positive and line 68 of Part 3 is negative). Line 1
  (line 12200 plus line 27 of the return, the self-employed net earnings) is 0. Line 2 (50373,
  employment earnings not on a T4 slip, the CPT20 earnings) is 3,000.00; line 3 (50399, on a T4
  slip) is 2,000.00; line 4 = 0 + 3,000.00 + 2,000.00 = 5,000.00. Line 5 is the amount from line 19
  of Part 3, 3,521.31. Line 61 of Part 3 is positive, so complete lines 6 to 13 only and continue at
  line 25: line 6 = line 47 of Part 3 = 2,929.49; line 7 = line 50 of Part 3 = 2,097.56; line 8 =
  2,929.49 less 2,097.56 = 831.93; line 9 = line 54 of Part 3 = 591.82; line 10 = line 57 of Part 3
  = 423.75; line 11 = 591.82 less 423.75 = 168.07; line 12 = line 8 plus line 11 = 831.93 + 168.07 =
  1,000.00; line 13 = line 5 less line 12 = 3,521.31 less 1,000.00 = 2,521.31. Lines 14 to 24 are
  not completed on this branch, and neither are lines 33 to 39. The engine computes some of the
  uncompleted lines before the form's gate, and they are computed, not used: line 17 (line 15,
  3,521.31, less line 16, 2,521.31) is 1,000.00; line 20 (line 18, 637.20, less line 19, 1,627.20)
  is -990.00; and line 21 (the printed rule for a positive line 17) is -1,000.00. The sheet shows
  these as 0 because the form does not complete them. Line 25 = line 13 = 2,521.31; line 25A (the
  amount from line 21) is not used on this branch and is 0. Line 26 = line 24 (0) + line 25 + line
  25A = 2,521.31. Line 27 = line 26 x 16.80672 = 42,374.95 (2,521.31 x 16.80672 = 42,374.951, to the
  cent). Lines 28 to 32: line 61 of Part 3 is positive, so complete lines 28 to 32 only: line 28 =
  the total actual base and first additional QPP contributions from line 39 of Part 3 = 637.20; line
  29 = line 61 of Part 3 = 10.00; line 30 = line 12 = 1,000.00; line 31 = 10.00 less 1,000.00 =
  -990.00 (in brackets); line 32 = line 28 less line 31 = 637.20 + 990.00 = 1,627.20. Line 40 = line
  32 + 0 + 0 = 1,627.20. Line 41 = 1,627.20 x 15.625 = 25,425.00. Line 42 = line 27 plus line 41 =
  42,374.95 + 25,425.00 = 67,799.95. Lines 43 to 47: line 43 = line 25 of Part 3 (the total actual
  second additional CPP contributions, box 16A) = 100.00. Line 68 of Part 3 is negative, so enter 0
  on line 46 and continue at line 47: line 46 = 0; line 47 = line 43 less line 46 = 100.00. Lines 48
  to 53: line 48 = line 45 of Part 3 (box 17A) = 150.00. Line 68 of Part 3 is negative, so enter 0
  on line 51 and continue at line 52: line 52 = line 48 less 0 = 150.00; line 53 = line 47 plus line
  52 = 250.00. Lines 54 and 55: line 61 of Part 3 is positive and line 68 of Part 3 is negative, so
  complete both: line 54 = line 68 of Part 3 as a positive amount = 146.00; line 55 = the lesser of
  line 61 of Part 3 (10.00) and line 54 (146.00) = 10.00. Line 56 = line 53 plus line 55 = 260.00.
  Lines 57 to 62: line 57 = line C of Part 2 = 71,300.00; line 58 = line F = 3,500.00; line 59 =
  71,300.00 less 3,500.00 = 67,800.00 (maximum 67,800.00); line 60 = line 42 = 67,799.95; line 61 =
  67,800.00 less 67,799.95 = 0.05; line 62 is the lesser of line 4 (5,000.00) and line 61 (0.05):
  0.05. Lines 63 to 69: line 3 of Part 3 (96,000.00) is not less than line 58 of Part 4 (3,500.00),
  so line 69 is 0 and the form continues at line 70 (lines 63 to 68 are not completed). Line 70 =
  line 62 less line 69 = 0.05 less 0 = 0.05, the self-employment income and other earnings subject
  to base and first additional contributions. Lines 71 to 74: line 71 = line 4 = 5,000.00; line 72 =
  line 11 of Part 3 = 50,750.00; line 73 = line 31 of Part 3 = 30,450.00; line 74 = 86,200.00. Line
  74 is more than line 57 (71,300.00), so complete lines 75 to 83: line 75 = line D of Part 2 =
  9,900.00; line 76 = line 56 divided by 4% = 260.00 / 0.04 = 6,500.00; line 77 = 9,900.00 less
  6,500.00 = 3,400.00; line 78 = line 4 = 5,000.00; line 79 = line 65 (not completed) = 0; line 80 =
  5,000.00; line 81 = line 70 = 0.05; line 82 = 5,000.00 less 0.05 = 4,999.95; line 83 is the lesser
  of line 77 (3,400.00) and line 82 (4,999.95): 3,400.00, the self-employment income subject to
  second additional contributions. Lines 70 and 83 are both above zero, so Part 4 is used for the
  final selection. Lines 84 to 91 (the tax credit, deduction and overpayment for the CPP
  contributions on self-employment income and other earnings): line 84 = line 70 x 9.9% = 0.05 x
  9.9% = 0.00495, 0.00 to the cent; line 85 = line 70 x 2% = 0.001, 0.00; line 86 = line 83 x 8% =
  3,400.00 x 8% = 272.00; line 87 = 0.00 + 272.00 = 272.00; line 88 = line 84 plus line 87 = 272.00;
  line 89 (line 69 of Part 3 if positive, times 2) is 0, as line 69 is negative; line 90 = line 88
  less line 89 = 272.00, positive: the CPP contributions payable on self-employment income and other
  earnings, 272.00, the amount for line 42100 of the return. Line 91 (the overpayment, only for a
  negative line 90) is 0. Lines 92 to 98 (the base contributions through employment income, Part 4
  again): line 53 of Part 3 is negative, so line 92 = line 49 of Part 3 = 3,467.13; line 93 = line
  53 of Part 3 as a positive amount = 3.38; line 94 is the lesser of line 60 of Part 3 (13.38) and
  line 93 (3.38), as line 53 is negative and line 60 is positive: 3.38; line 95 = 3.38 less 3.38 =
  0.00; line 96 = line 92 plus line 94 = 3,470.51; line 97 is 0, as line 68 of Part 3 is negative;
  line 98 = line 96 plus line 97 = 3,470.51, the base CPP contributions through employment income
  (line 30800 of the return). Lines 99 to 110 (the enhanced contributions through employment
  income): line 60 of Part 3 is positive, so line 99 = line 59 of Part 3 = 678.00 and line 105 takes
  it, with lines 100 to 102 are not used (line 53 of Part 3 is negative) and line 104 is 0 (line 68
  of Part 3 is negative); line 103 = 678.00; line 105 = 678.00. Line 106 (line 68 of Part 3 is
  negative) = line 64 of Part 3 = 250.00; line 107 = line 68 of Part 3 as a positive amount = 146.00;
  line 108 is the lesser of line 61 of Part 3 (10.00) and line 107 (146.00) = 10.00; line 109 =
  250.00 + 10.00 = 260.00; line 110 = line 105 plus line 109 = 678.00 + 260.00 = 938.00, the
  deduction for CPP enhanced contributions on employment income (line 22215 of the return). Lines
  111 to 129 (the base and enhanced contributions through self-employment income and other
  earnings): line 111 = line 84 x 50% = 0.00, the amount for line 31000 of the return; line 112 =
  line 85 x 50% = 0.00; line 113 = 0.00; line 114 is 0 (line 69 of Part 3 is negative); line 115 =
  0.00; the amount lettered A (the lesser of lines 113 and 114) is 0.00; line 116 = 0.00; line 117 =
  0.00; line 118 = 0.00; line 119 = line 111 = 0.00; line 120 = line 116 = 0.00; line 121 = 0.00;
  line 122 = line 112 = 0.00; line 123 = line 118 = 0.00; line 124 = 0.00; line 125 = line 86 x 50%
  = 272.00 x 50% = 136.00; line 126 = 136.00; line 127 is not used (line 115 is 0, so line 128 is
  line 126); line 128 = 136.00; line 129 = the sum of lines 121, 122, 124, 125 and 128 = 0.00 + 0.00
  + 0.00 + 136.00 + 136.00 = 272.00, the deduction for CPP enhanced contributions on self-employment
  income and other earnings (line 22200 of the return).
  The final selection (lines 70 and 83 of Part 4 are both above zero, so Part 4's results are used):
  line 30800 = line 98 = 3,470.51; line 22215 = line 110 = 938.00; line 44800 = line 91 = 0.00 (line
  90 is positive, so the overpayment is nil); line 42100 = line 90 = 272.00; line 31000 (also ON428
  line 58280) = line 111 = 0.00; line 22200 = line 129 = 272.00. The Part 3 results of lines 70 to
  74 are not carried to the return on this branch. Total income (line 15000) is 80,000.00; the
  deductions of line 22215 (938.00) and line 22200 (272.00) are 1,210.00, so net income and taxable
  income are 80,000.00 less 1,210.00 = 78,790.00. The EI premiums are the maximum 1,077.48. The
  income tax deducted is a chosen 13,000.00, and the CPP overpayment of line 44800 is 0.00, so the
  total credits are 13,000.00. The federal tax and the Ontario tax are the engine's figures from the
  2025 brackets and credits in the repository, and are not hand-checked: net federal tax 9,498.00;
  Ontario tax less dividend credit 4,167.56 and Ontario tax 4,917.56 (the difference of 750.00 being
  the Ontario health premium for this income), giving a total payable of 14,687.56
  (net federal tax of 9,498.00, line 42100 of 272.00 and Ontario tax of 4,917.56) and a balance
  owing of 1,687.56 (total payable less the 13,000.00 of tax deducted).
  Not triggered: Part 1 (no election or revocation); Part 5 (the filer is not a Quebec resident);
  Part 3a (line 69 is negative, so lines 70 to 74 are not the path); lines 14 to 24 and 33 to 39 of
  Part 4 (not completed on this branch, their computed amounts not used); lines 44 to 46 and 49 to
  51 of Part 4 (line 68 of Part 3 is negative); lines 63 to 69 of Part 4 (line 3 of Part 3 is not
  less than 3,500.00, so line 69 is 0); lines 100 to 102 and 104 of Part 4 (the line 53 and line 68
  conditions); line 89 of Part 4 and line 91 of Part 4 (line 69 of Part 3 is not positive; line 90
  is positive); lines 83, 84, 85, 87 and 80 of Part 3 (the conditions of lines 53, 60 and 68 are not
  met); line 78 of Part 3 (0.00); lines 127 of Part 4 (line 115 is 0); Schedule 8 (not carried, as
  Form RC381 is completed); and every other credit and deduction not named here.
  The only difference from Return FZ: the Ontario employment of $60,000 is on two T4 slips of $30,000
  each (boxes 26 and the totals of boxes 16 and 16A are those of Return FZ), so the count of T4 slips
  with CPP pensionable earnings is 2 and the count with QPP pensionable earnings is 1 (chosen
  figures). The CPP limits are then 2 x $81,200.00 = $162,400.00 for box 26, 2 x ($3,356.10 +
  $678.00) = $8,068.20 for box 16 and 2 x $396.00 = $792.00 for box 16A, and the QPP limits 1 x
  $81,200.00, 1 x ($3,661.20 + $678.00) = $4,339.20 and 1 x $396.00; every total is within them.
sources:
  - >-
    CRA, "Form RC381 (2025), Inter-Provincial Calculation for CPP and QPP Contributions and
