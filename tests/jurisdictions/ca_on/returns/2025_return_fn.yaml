# Return FN: a filer, not resident in Canada throughout 2025 (a deemed resident), with
# employment income with security options, a capital gain, foreign business and investment
# income and amounts on every line of Form T691 (alternative minimum tax) Part 1 that the
# other returns leave at zero, so that the minimum tax binds: Part 5 line 11, "minimum tax
# payable", is positive ($24,998.75) with an investment tax credit (Form T2038(IND)) of which
# the amount claimable is limited by amount K, not amount I. It computes Form T691 Parts 1 to 8
# line by line, with the non-resident surtax (Part 3 line 4, Part 6 line 11), the special foreign
# tax credit above the federal foreign tax credit (Part 7 lines 11 and 12), Form T2038(IND)
# Parts A to E (the claim, a carryback and a refund) and Worksheet ON428. Amounts are quoted
# decimal strings, never floats; counts are quoted digit strings. The figures are chosen (no CRA
# example exists) and worked out by hand from the form text, as the description shows. Left out:
# T691 Part 1 line 59 (PPIP premiums, Quebec only).
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single filer with no spouse or common-law partner and no dependant, aged 18 or older at the
  end of 2025, not resident in Canada throughout 2025 (a chosen 0; a deemed resident of Canada, so
  the count on Form T691 Part 3 line 4 is a chosen 1) and subject to minimum tax (a chosen 1, so
  the surtax of Form T691 Part 3 line 4 is reported on T1 line 132 for a deemed resident, as Form
  T2209 says). All figures are chosen. The filer has employment income (T4 box 14) of 310,000.00 (a
  chosen 300,000.00 and the 10,000.00 of the gifts of publicly listed securities acquired under
  a security option plan, which line 24900 includes), with Canada Pension Plan contributions at the 2025 maximums (4,034.10 base and first additional
  on 71,300.00 less 3,500.00 at 5.95%, 396.00 second additional on 9,900.00 at 4%) and employment
  insurance premiums at the maximum 1,077.48 on 65,700.00. Other income (T1 line 13000) is
  40,000.00, the foreign business income. Foreign investment income (T1 line 12100) is 20,000.00.
  Shares are disposed of for proceeds of 600,000.00 with an adjusted cost base of 100,000.00 and
  no outlays: Schedule 3 line 21 and line 19700 is 500,000.00, and the taxable capital gains
  (half) are 250,000.00. Total income (line 15000) is 310,000.00 + 40,000.00 + 20,000.00 +
  250,000.00 = 620,000.00. Deductions from total income: the enhanced CPP contributions (line
  22215) of 1% x 67,800.00 = 678.00 plus 396.00 = 1,074.00, union dues (line 21200) 1,000.00,
  carrying charges (line 22100) 12,000.00 and other employment expenses (line 22900) 12,000.00,
  which is the total of Form T777 line 17 (the other expenses of T777 line 8 are entered as
  12,000.00). The four come to 26,074.00 and are deducted at line 23300, so net income (line
  23600) is 620,000.00 - 26,074.00 = 593,926.00. Deductions from net income: security options
  (line 24900) 127,000.00, the total of Form T691 lines 28, 29, 31, 35, 36 and 37 (60,000.00 +
  20,000.00 + 10,000.00 + 30,000.00 + 5,000.00 + 2,000.00), limited partnership losses of other years (line 25100) 40,000.00,
  non-capital losses of other years (line 25200) 60,000.00, net capital losses of other years
  (line 25300) 30,000.00 and other deductions (line 25600) 20,000.00, which is the capital gain
  exempt under a tax treaty, in all 277,000.00, so taxable income (line 26000) is 593,926.00 -
  277,000.00 = 316,926.00. Federal tax on taxable income (5006-R Part A, column 5) is 33% x
  (316,926.00 - 253,414.00) + 58,399.85 = 20,958.96 + 58,399.85 = 79,358.81. The credit amounts
  are 14,538.00 (net income above 253,414.00), the base CPP contributions 3,356.10 (4.95% x
  67,800.00; the enhanced 1,074.00 is the deduction), 1,077.48 and the Canada employment amount
  1,471.00, 20,442.58 x 14.5% = 2,964.1741, rounded half-up to 2,964.17 (lines 33800 and 35000).
  Basic federal tax (line 42900) is 79,358.81 - 2,964.17 = 76,394.64. Against the return without
  line 22900 deducted (taxable income 328,926.00, basic federal tax 80,354.64), the 12,000.00
  deduction lowers taxable income by 12,000.00 and the federal tax by 3,960.00 (33% x 12,000.00).
  Form T691 Part 1: line 1 is 316,926.00 and lines 2 to 11 are 0. Line 15 is 500,000.00, lines 17
  (treaty exempt gains, included on line 25600) and 18 (graduated rate estate gains) are 20,000.00
  and 15,000.00, so line 19 is 35,000.00, line 20 is 465,000.00, line 21 (line 12700) is
  250,000.00 and lines 22 and 23 are 215,000.00. Lines 24 and 25 are 30,000.00 and 10,000.00 of
  gifts of publicly listed securities: 20,000.00 x 30% = 6,000.00 on line 26. Line 27 is
  316,926.00 + 215,000.00 + 6,000.00 = 537,926.00. Security options: line 28 is 60,000.00 and line
  29 is 20,000.00, line 30 is 80,000.00, line 31 is 10,000.00 x 40% = 4,000.00, line 32 is
  76,000.00 and line 33 is 537,926.00 + 76,000.00 = 613,926.00. Line 35 is 30,000.00, lines 36 and
  37 are 5,000.00 and 2,000.00, line 38 is 37,000.00. The filer has filed the limited partnership
  election, so line 40 is 25,000.00 of the 40,000.00 on line 25100 and line 39 is 0; line 41 is
  15,000.00 of the 60,000.00 on line 25200 and line 42 is 8,000.00 of the 30,000.00 on line 25300,
  so line 43 is 48,000.00 and line 44 is 613,926.00 + 37,000.00 + 48,000.00 = 698,926.00. Line 47
  is 40,000.00 - 25,000.00 = 15,000.00, line 50 is 60,000.00 - 15,000.00 = 45,000.00, line 51
  (union dues) is 1,000.00 and line 53 is 61,000.00. Line 58 is the enhanced CPP deduction of
  1,074.00, so line 63 is 62,074.00. Lines 64 to 67 are 4,000.00 interest, 1,000.00 life insurance
  premiums, 3,000.00 financing expenses and 2,000.00 investment counsel fees, all included on line
  22100 (12,000.00), so line 68 is 10,000.00. Line 69 is 12,000.00, lines 70 to 75 are 3,000.00,
  2,000.00, 1,500.00, 500.00, 400.00 and 300.00, so line 76 is 7,700.00 and line 77 is 4,300.00.
  Line 78 is 62,074.00 + 10,000.00 + 4,300.00 = 76,374.00, line 80 is 50% of it, 38,187.00, and
  line 82 is 38,187.00 + 698,926.00 = 737,113.00. With no dividends, lifetime capital gains
  exemption or qualifying business transfer deduction, line 93 is 737,113.00 and line 95 is
  737,113.00 - 177,882.00 = 559,231.00. Line 97 is 20.5% x 559,231.00 = 114,642.355, rounded
  half-up to 114,642.36. Line 98 is 50% x 2,964.17 = 1,482.085, rounded half-up to 1,482.09, line
  101 (section 119 former resident credit) is 1,500.00, line 102 is 2,982.09 and the minimum
  amount (line 103) is 114,642.36 - 2,982.09 = 111,660.27.
  Part 2: line 5 is the basic federal tax, 76,394.64, and there is no carryover, so line 7 is
  76,394.64. Part 3: line 2 is 48% x 76,394.64 = 36,669.4272, rounded half-up to 36,669.43; with
  no Form T2203 percentage (0), line 3 has no amount and, as a deemed resident, line 4 is line 2.
  Line 6 is 113,064.07. Form T2209 (net income by note (3) is 593,926.00 - 127,000.00 - 30,000.00
  - 20,000.00 = 416,926.00; basic federal tax by note (4) is line 42900 plus the federal surtax of
  line 132, 76,394.64 + 36,669.43 = 113,064.07, and by note (8) line 42900 alone, 76,394.64): the
  non-business tax of 3,000.00 on net foreign non-business income of 20,000.00 gives line 2 as
  113,064.07 x 20,000.00 / 416,926.00 = 5,423.70, so line 3 is 3,000.00; the business tax of
  20,000.00 (line 4) on 40,000.00 gives line 5 as 7,329.32 (76,394.64 x 40,000.00 / 416,926.00),
  line 7 and line 8 as 7,329.32 and 76,394.64 (line 6 is a chosen 0.00: the filer allocates none
  of the surtax to the country, which the form text leaves to the filer; entering the whole surtax
  there would change the credit), line 10 as 76,394.64 - 3,000.00 = 73,394.64 and line 11 as the
  least of 20,000.00, 7,329.32 and 73,394.64, 7,329.32, so line 13 and the federal foreign tax
  credit (line 40500) are 10,329.32. Part 3 line 10 is 113,064.07 - 10,329.32 = 102,734.75. The
  political contribution tax credit of 400.00 is 75% x 400.00 = 300.00, the labour-sponsored funds
  credit of 5,000.00 is 15% x 5,000.00 = 750.00 (at most 750.00), and the investment tax credit
  claimed on Part 3 line 12 is 20,000.00 (a chosen claim, the whole of amount I), so line 14 is
  21,050.00 and line 15 is 81,684.75.
  Part 4: line 1 is 40,000.00, line 2 is 20,000.00 and line 3 is 50,000.00 (a chosen claim of the
  non-taxable foreign capital gains, at most line 23, 215,000.00), so line 4 is 110,000.00, line 6
  is 20.5% x 110,000.00 = 22,550.00, line 7 is 66.6666% x 3,000.00 = 1,999.998, rounded half-up to
  2,000.00, line 8 is 20,000.00, line 9 is 22,000.00, line 10 is 22,000.00 and the special foreign
  tax credit (line 11) is the more of 10,329.32 and 22,000.00, 22,000.00. Part 5: line 3 is
  111,660.27 - 22,000.00 = 89,660.27, line 6 is 81,684.75 - 36,669.43 = 45,015.32, line 7 is
  89,660.27 - 45,015.32 = 44,644.95, line 10 is 20,000.00 - 353.80 = 19,646.20 (the claim of Part
  D, line 15, is 353.80), and line 11 is 44,644.95 - 19,646.20 = 24,998.75, which is still
  positive, so the minimum tax binds.
  Part 6: line 3 is 76,394.64, line 5 is the more of that and 111,660.27, line 7 is 111,660.27 (no
  tax on split income), line 9 is 48% x 111,660.27 = 53,596.9296, rounded half-up to 53,596.93,
  and as a deemed resident line 11 is that, so line 12 is 89,660.27 + 53,596.93 = 143,257.20 and
  line 14, the federal tax of T1 line 41700, is 143,257.20. Part 7: line 4 is 76,394.64, line 7 is
  the political credit, the claim and the labour-sponsored credit, 300.00 + 353.80 + 750.00 =
  1,403.80, line 8 is 74,990.84, line 11 is 22,000.00 - 10,329.32 = 11,670.68, line 12 is
  11,670.68 x 22,000.00 / 23,000.00 = 11,163.26, line 13 is 86,154.10 and line 14, the additional
  taxes paid for the carryover, is 111,660.27 - 86,154.10 = 25,506.17, which is the balance
  carried to 2026 (Part 8 line 17), there being no earlier carryover.
  Form T2038(IND): the filer has SR&ED expenditures of 60,000.00 (x 0.15 = 9,000.00), an ITC
  allocated by a partnership of 500.00 and qualified property of 20,000.00 (x 0.10 = 2,000.00), so
  amount A is 11,500.00; flow-through mining expenditures of 10,000.00 (x 0.15 = 1,500.00), so
  amount F is 1,500.00. Part D: amount 1 (the opening balance) is 8,000.00, amount 4 is 13,000.00
  and amount 5 is 21,000.00; less 1,000.00 allocated to graduated rate estate beneficiaries,
  amount G is 20,000.00. Amount 9 is the federal tax (line 40600, 102,734.75) less the political
  credit, 102,434.75, and amount H is that less the labour-sponsored credit, 101,684.75, so amount
  I is the lesser of G and H, 20,000.00. The line 7 amount of Form T691 Part 5 is positive, so
  amount 11 is H, amount 13 is H + the foreign tax credit 10,329.32 = 112,014.07, amount J is that
  less the minimum amount 111,660.27, 353.80, and amount K is the lesser of G and J, 353.80. The
  filer claims 353.80 (amount 15, at most K; T1 line 41200). Amount K was 3,754.60 before line
  22900 was deducted and is now 353.80, a fall of 3,400.80: amount 13 (H plus the foreign tax
  credit) falls by 5,860.80, which is the federal tax with surtax (Part 3 line 6) falling by
  3,960.00 of basic tax and 1,900.80 of surtax at 48%, and the minimum amount falls by 2,460.00
  (20.5% x 12,000.00), so amount J falls by 5,860.80 - 2,460.00 = 3,400.80. Part E: amount 3 is
  20,000.00 - 8,000.00 = 12,000.00, amount 6 is K less the opening balance, which is negative, so
  0.00, and amount L is 12,000.00; the filer carries back 500.00, 1,500.00 and 2,000.00 to the
  third, second and first previous years, amount M 4,000.00. Amount 9 is 11,500.00 - 1,000.00 =
  10,500.00, amount 12 is 353.80 - 8,000.00 = -7,646.20, amount 14 is -3,646.20 (amount 12 plus
  amount M), amount 16 is 0.00 (amount 14 less F, floored at 0) and amount N is 10,500.00; the
  filer designates 7,500.00 as a refund, which is 7,500.00 x 0.40 = 3,000.00 (T1 line 45400).
  Worksheet ON428: the Ontario tax on taxable income (ON428 Part A, column 5) is 13.16% x
  (316,926.00 - 220,000.00) + 20,957.60 = 33,713.06; the Ontario credits are 5.05% x (12,747.00 +
  3,356.10 + 1,077.48) = 867.61929, rounded half-up to 867.62, so line 53 (and line 58) is
  32,845.44, with no carryover applied. Line 1 is 24.63% x 24,998.75 = 6,157.19 (6,157.19215,
  rounded half-up); line 2 (ON428 line 65) is 32,845.44; line 3 is 39,002.63; line 4 is 20% x
  (39,002.63 - 5,710.00) = 6,658.53 and line 5 is 36% x (39,002.63 - 7,307.00) = 11,410.43, so
  line 6 is 18,068.96; line 7 (ON428 line 68) is 20% x (32,845.44 - 5,710.00) + 36% x (32,845.44 -
  7,307.00) = 5,427.09 + 9,193.84 = 14,620.93; line 8 is 18,068.96 - 14,620.93 = 3,448.03 and line
  9, the Ontario additional tax for minimum tax purposes (ON428 line 72), is 6,157.19 + 3,448.03 =
  9,605.22.
  The rest of Form ON428: line 69 is 32,845.44 + 14,620.93 = 47,466.37 and line 73 is that plus
  line 72, 9,605.22, 57,071.59. With an amount on line 72 the Ontario tax reduction (line 80) is
  0.00, so line 81 is 57,071.59. Form T2036 (the filer must pay minimum tax, is an Ontario
  resident, and paid more than 200.00 of non-business tax): line 1 is 3,000.00; line 2 is line 1
  divided by the total foreign taxes paid (2,000.00 / 66.6666% + 20,000.00 = 23,000.003) times the
  special foreign tax credit of 22,000.00, 2,869.5646, rounded half-up to 2,869.56; line 3 is
  130.44; line 4 is 20,000.00 / 416,926.00 x 47,466.37 (the Ontario tax otherwise payable, ON428
  line 81 with 0 on lines 70 and 72, here 47,466.37) = 2,276.97, so line 5, the provincial foreign
  tax credit (ON428 line 82), is 130.44. Line 83 is 56,941.15. The LIFT credit (Schedule ON428-A
  Part A) is 5.05% x 310,000.00 = 15,655.00, at most 875.00, less 5% x (593,926.00 - 32,500.00) =
  28,071.30: 0.00, so line 86 and line 88 are 56,941.15. The Ontario health premium (taxable
  income above 200,600.00) is 900.00, so the Ontario tax (line 90, T1 line 42800) is 57,841.15.
  Net federal tax (T1 line 42000, with no advanced Canada workers benefit and no special tax) is
  143,257.20 and the total payable (line 148) is 143,257.20 + 57,841.15 = 201,098.35. The only
  credit among lines 150 to 165 is the refund of investment tax credit (line 45400, 3,000.00): no
  tax was deducted, and there is no CPP or EI overpayment, medical expense supplement, Canada
  workers benefit (working income far above its limit) or provincial credit. The balance owing
  (line 167) is 201,098.35 - 3,000.00 = 198,098.35.
