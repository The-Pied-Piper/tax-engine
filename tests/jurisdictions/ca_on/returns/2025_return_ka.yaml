# Return KA: a partner who received no T5013 slip fills in the whole of Form T776 and takes line 7
# (amount 7) as "your share of amount 6", their percentage of the partnership times amount 6. The
# statement has other income (line 8230) of 2,000.00, advertising (line 8521) of 500.00 and a CCA
# claim (line 9936) of 400.00, so amount 5 is 1,500.00 and amount 6 is 1,100.00. The percentage of
# the partnership is 50, so amount 7 is 550.00. Line 9974 (GST/HST rebate for partners) is 20.00 and
# line 9943 (other expenses of the partner) is 5.00, so line 9946 is 550.00 + 20.00 - 5.00 = 565.00,
# and T1 line 12600 is 565.00. Guide T4036: "If you are in a partnership and you do not receive a
# T5013 slip ... fill in all of the parts in Form T776 that apply to you", and "Amount 7 -
# Partnerships: If you are a member of a partnership, enter your share of amount 6 or the amount
# from box 107 or 110 from your T5013 slip"; Form T776 Part 1 "Your percentage of the partnership %".
# Amounts are quoted decimal strings, never floats; counts are quoted digit strings.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025 whose only income is the share of a rental partnership
  that sent no T5013 slip. The one T776 statement has other income (line 8230) of a chosen
  $2,000.00, advertising (line 8521) of a chosen $500.00 and a CCA claim (line 9936) of a chosen
  $400.00 on Class 1 (below 4% of the UCC), so amount 5 is $1,500.00 and amount 6 is $1,100.00.
  The partner answer is yes, the T5013 slip answer is no and the percentage of the partnership is
  50, so amount 7 is $550.00. Line 9974 is a chosen $20.00 and line 9943 a chosen $5.00, so line
  9946 is $565.00 and T1 line 12600 is $565.00.
sources:
  - >-
    CRA, Guide T4036 (Rental Income, 2025 edition, docs/cra-forms-2025/t4036-25e.pdf, a PDF
    quote accepted 2026-10-19): "If you are in a partnership and you do not receive a T5013 slip,
    or if you are a co-owner, fill in all of the parts in Form T776 that apply to you."; "Amount 7
    - Partnerships: If you are a member of a partnership, enter your share of amount 6 or the
    amount from box 107 or 110 from your T5013 slip."
  - >-
    CRA, Form T776 (2025), Statement of Real Estate Rentals (docs/cra-forms-2025/t776-25e.txt,
    confirmed 2026-10-19). Part 1: "Your percentage of the partnership %"; "Line 6: Net income
    (loss) (amount 5 minus line 9936)"; "Line 7: Partners: your share of amount 6, or the amount
    from your T5013 slip, Statement of Partnership Income"; "Line 9974: Partners: GST/HST rebate
    for partners received in the year"; "Line 9943: Partners: other expenses of the partner";
    "Line 9946: Your net income (loss): For sole proprietors or co-owners, enter the result from
    amount 6. For partnerships, enter the result from amount 7 plus line 9974 minus line 9943.
    Enter this amount on line 12600 of your income tax and benefit return".
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t776/t776-25e.txt
