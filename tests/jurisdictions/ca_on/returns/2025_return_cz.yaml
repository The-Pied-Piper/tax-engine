# Return CZ: Return BT's single sole proprietor, a 2025 Ontario resident whose only activity
# is a business, one Form T2125 (Statement of Business or Professional Activities), with a
# Class 10.1 passenger vehicle bought and sold in 2025 whose cost is above the prescribed
# amount, so that the proceeds of disposition (Area A column 5) and the proceeds of
# dispositions of DIEP (column 6) are adjusted by the prescribed amount as a proportion of the
# actual cost of the vehicle (Area A endnote 2). The vehicle cost $50,000 before the HST of
# 13%, $56,500.00 in all (the actual cost, no government assistance); its capital cost is
# limited to the prescribed amount for 2025, $38,000 + 13% = $42,940.00 (columns 3 and 4), and
# it was sold at arm's length for $40,000 (column 5, all of it a DIEP's, column 6), so the
# factor is $42,940.00 / $56,500.00 = 0.76 and the proceeds become $40,000 x 0.76 =
# $30,400.00 in both columns. Column 7 is $0 + $42,940 - $30,400.00 = $12,540.00 and column 8
# is $42,940 - $30,400.00 = $12,540.00, so the immediate expensing amount (column 9) can be
# the whole $12,540 (it would be refused above the unadjusted column 8, $2,940). No property
# is left in the class, so the maximum is $0 and column 21 is $0 + $12,540 = $12,540.00, which
# is claimed, with a column 22 of $0 and no terminal loss (column 7 less column 9 is $0). The
# business is Return BT's with the gross sales raised to a chosen $60,540, so that line 9946
# stays Return BB's $30,000.00: expenses of $16,000 on seven lines (the motor vehicle line,
# $2,500, from Charts A to C), line 9936 of $12,540.00, so line 9368 is $16,000 + $12,540.00 =
# $28,540.00 and line 9369 is $60,540 - $28,540.00 = $32,000.00. The business is not associated
# with another EPOP, so the immediate expensing limit is $1.5 million and line i, $12,540, is
# within the least of endnote 5's three amounts ($1,500,000, the UCC of DIEPs in column 8,
# $12,540.00, and the income before CCA, $44,540.00). Every figure that depends on income is
# Return BB's. Amounts are quoted decimal strings, never floats; counts are quoted digit
# strings. Every output the CA-ON manifest declares must appear under `expected`, or be left
# out to be 0 (or no records).
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025 whose only activity is a business, reported on
  one Form T2125: gross sales of $60,540 (amount 3A, a chosen figure, $10,540 above Return
  BB's so that line 9946 is Return BB's $30,000.00), expenses of $16,000 on seven lines and
  capital cost allowance of $12,540.00 on Class 10.1 (Area A, line 9936), so line 8299 and T1
  line 13499 are $60,540.00, line 9369 is $32,000.00, and, after $2,000 of
  business-use-of-home expenses, line 9946 and T1 line 13500 are $30,000.00. A chosen set of
  figures. The motor vehicle expenses (line 9281, $2,500) are Charts A to C for one leased
  passenger vehicle used half for business (see the sources). Area A has one class, Class 10.1,
  one passenger vehicle designated for immediate expensing, bought in 2025 for $50,000 plus
  the HST of 13% ($56,500.00, no government assistance) and sold in 2025 for $40,000: its
  capital cost is limited to the prescribed amount for 2025 with tax, $42,940.00 (columns 3
  and 4), and because its actual cost is more than that, the proceeds of $40,000 (columns 5
  and 6) are adjusted by $42,940.00 / $56,500.00 = 0.76 to $30,400.00. Column 7 and column 8
  are $12,540.00; the immediate expensing amount (column 9) is the whole $12,540, so column
  21 is $12,540.00, claimed, and the UCC at the end of the year is $0. Line i is $12,540,
  and line ii and line 9936 are $12,540.00. The business is not associated with another EPOP,
  so the immediate expensing limit is $1,500,000; the income before CCA (endnote 5) is
  $44,540.00, line 9369 plus line 9936, a chosen reading (see the sources). The net
  self-employment income (T1 line 27, "Add lines 22 to 26") is 30,000 + 0 + 0 + 0 + 0 =
  $30,000; line 28 is line 21 (0) plus line 27 and total income (line 15000) adds line 27 to
  the other income lines, which are all 0, so total income is $30,000.00. The CPP months
  (Schedule 8 box A) are the 12 of a full year, Schedule 8 Part 4 is not completed (count 0)
  and there is no agreement with the Canada Employment Insurance Commission (count 0), so the
  CPP contributions payable (line 42100), the base CPP contributions (line 31000) and the
  deduction (line 22200) on self-employment income, and the EI premiums on it (lines 31217
  and 42120), are $0 and change no total.
