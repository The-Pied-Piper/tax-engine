    CRA, Form T2125 (2025), Statement of Business or Professional Activities
    (docs/cra-forms-2025/t2125-25e.pdf, confirmed from the PDF; no .txt published), Area A
    endnote 5 "The immediate expensing applies to DIEPs included in column 8. The total
    immediate expensing amount for the tax year (total of column 9) is limited to the lesser
    of: - the immediate expensing limit, which is equal to one of the following, whichever
    is applicable: -- $1.5 million, if you are not associated with any other eligible person
    or partnership (EPOP) in the tax year -- amount iii of Area G, if you are associated
    with one or more EPOPs in the tax year -- zero, if you are associated with one or more
    EPOPs and an agreement that assigns a percentage to one or more of the associated EPOPs
    was not filed with the minister in a prescribed form -- any amount allocated by the
    minister under subsection 1104(3.4) of the Regulations - the UCC of DIEPs in column 8 -
    the amount of income, if any, earned from the source of income that is a business
    (before any CCA deductions) in which the relevant DIEP is used for the tax year For more
    information, see Guide T4002."; "Total immediate expensing claim for the year: Total of
    column 9" (line i). Area G: "Are you associated in the fiscal period with one or more
    EPOPs that you have entered into an agreement with under subsection 1104(3.3) of the
    Regulations? Yes or No"; "Enter the percentage assigned to each associated EPOP
    (including your business) as determined in the agreement. This percentage will be used
    to allocate the immediate expensing limit. The total of all percentages assigned under
    the agreement should not be more than 100%. If the total is more than 100%, then the
    associated group has an immediate expensing limit of zero."; "Percentage assigned under
    the agreement" (column 3); "Total of percentage assigned: Total of column 3"; "Immediate
    expensing limit allocated to your business: Multiply $1.5 million by the percentage
    assigned to your business in column 3**" (amount iii); "** If the total of column 3 is
    more than 100%, enter "0."". Guide T4002 (docs/cra-forms-2025/t4002-25e.pdf, confirmed
    from the PDF; no .txt published), Area G: "Calculate the immediate expensing limit
    allocated to you by multiplying $1.5 million by the percentage assigned to your business
    in column 3. Enter the result at amount iv of Form T2042 or at amount iii of Form T2121
    or T2125."; "If the total percentage assigned in column 3 exceeds 100%, the immediate
    expensing limit of the associated group is zero."; Column 8: "Enter in column 8 the cost
    of DIEP additions from column 4 minus the proceeds of dispositions of DIEP from column
    6. If the result of column 4 minus column 6 exceeds the amount from column 7, enter in
    column 8 the amount from column 7. If the amount from column 7 is negative, enter "0."";
    Column 9: "Enter the immediate expensing amount you choose to apply to each class. The
    total immediate expensing amount must be equal to or less than the least of the
    following amounts: $1.5 million, if you are not associated with any other EPOP in the
    year; the UCC of the DIEP before any CCA deductions in the year; the amount of income,
    if any, before any CCA deductions, earned from the source of income that is a business
    or property for which the relevant DIEP is used for the tax year". The business is not
    associated with any other EPOP (the count of associated, a chosen 0, and the other Area G
    answers a chosen 0), so the immediate expensing limit is $1.5 million, 1,500,000, and no
    amount is allocated by the minister (a chosen 0). The income before CCA is a chosen
    reading of "the amount of income, if any, earned from the source of income that is a
    business (before any CCA deductions)", to be confirmed: line 9369, the net income before
    adjustments, plus line 9936, the CCA that line 9369 deducted, not below zero: 32,000.00 +
    12,540.00 = 44,540.00. The three amounts of endnote 5 are 1,500,000, the UCC of DIEPs in
    column 8, 12,540.00, and the income before CCA, 44,540.00; the least is 12,540.00. Line i,
    the total of column 9 (a chosen 12,540 for Class 10.1), is 12,540, equal to the least, and
    a total above the limit or above the income is refused.
