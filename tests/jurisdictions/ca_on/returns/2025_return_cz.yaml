    acquired in 2023, plus the GST/HST or PST; $37,000 for vehicles acquired in 2024, plus the
    GST/HST or PST; $38,000 for vehicles acquired in 2025, plus the GST/HST or PST"; "Use the
    GST rate of 5% and the appropriate PST rate for your province or territory. If your
    province is a participating province, use the appropriate HST rate."; "Under the immediate
    expensing rules, if you dispose of a passenger vehicle acquired after April 18, 2021, to a
    person or partnership with whom you deal at arm's length, and its cost exceeds the
    prescribed amount, the proceeds of disposition will be adjusted based on a factor equal to
    the prescribed amount as a proportion of the actual cost of the vehicle." The sales are a
    chosen $60,540 (Return BB's $50,000 plus $10,540, so that line 9946 is Return BB's) and the
