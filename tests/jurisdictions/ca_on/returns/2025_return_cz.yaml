    Endnote 2: "The proceeds of disposition of a zero-emission passenger vehicle (ZEPV) that has
    been included in Class 54, or a passenger vehicle bought after April 18, 2021, that has been
    included in Class 10.1, and whose cost is more than the prescribed amount will be adjusted
    based on a factor equal to its prescribed amount as a proportion of the actual cost of the
