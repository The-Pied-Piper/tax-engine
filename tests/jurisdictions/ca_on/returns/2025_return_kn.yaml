# Return KN: Guide T4037 (2025) "Restricted farm loss" Example (farmland sold for $200,000). The ACB
# entered is the Guide's line B, 160,000; the restricted farm loss row holds the 10,000 of property
# taxes and interest in the loss and the Guide's line C, 5,000, and line D, 5,000, which the
# engine adds to the ACB (the Guide's line E, 170,000), so the capital gain is the 30,000 CRA
# prints. Amounts are quoted decimal strings.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025 whose only income is a capital gain on farmland,
  Guide T4037 (2025), "Restricted farm loss", Example. The farmland sold in 2025 for 200,000 had
  an ACB of 160,000, and the filer has an unapplied restricted farm loss of 20,000 from 2000
  (5,000 of property taxes, 5,000 of interest, 10,000 of other expenses). Only the property
  taxes and interest can be applied: the Guide says to "reduce your capital gain by adding these
  amounts to the adjusted cost base (ACB) of your farmland", so the ACB entered on Schedule 3 is
  160,000 and the row holds the 10,000 of property taxes and interest and the Guide's
  line C, 5,000, and line D, 5,000. The ACB used is 160,000 + 5,000 + 5,000 = 170,000 and the
  capital gain is 200,000 - 170,000 = 30,000, the figure CRA prints (line F). The row is entered
  as real estate; the Guide names no
  type, so that is a chosen entry. Half of the gain is taxable, 15,000.00. Every other line is the
  engine's figure.
sources:
  - >-
    CRA, Guide T4037 (2025), "Restricted farm loss", Example (docs/cra-forms-2025/t4037-25e.pdf,
    read with pdftotext): "You sold your farmland in 2025 for $200,000. The ACB of the property
    was $160,000. You have an unapplied RFL of $20,000 from 2000. This amount includes $5,000
    for property taxes, $5,000 for interest, and $10,000 for other expenses." Proceeds $200,000
    (A), ACB $160,000 (B), plus property taxes $5,000 (C) and interest $5,000 (D), total
    $170,000 (E), capital gain (line A minus line E) $30,000 (F). "Reduce your capital gain by
    adding these amounts to the adjusted cost base (ACB) of your farmland."
inputs:
  ca/t776_statements: []
  ca/cpp_months: "12"
  ca/qpp_months: "12"
  ca/cpp_t4_base_and_first_additional_contributions: "0"
  ca/cpp_t4_second_additional_contributions: "0"
  ca/unapplied_net_capital_losses_2000: "0"
  # The unapplied RFL of 20,000 from 2000 includes 5,000 of property taxes and 5,000 of interest
  # (Guide T4037 p.34 example): the 10,000 that may be applied.
  ca/unapplied_restricted_farm_loss_taxes_and_interest: "10000"
  ca/schedule_8_instances:
    - {}
  ca/real_estate_dispositions:
    - ca/disposition_proceeds: "200000"
      ca/disposition_adjusted_cost_base: "160000"
      ca/disposition_outlays: "0"
      ca/disposition_depreciable_property: "0"
      ca/disposition_farm_loss_taxes_and_interest: "10000"
      ca/disposition_farm_loss_property_taxes: "5000"
      ca/disposition_farm_loss_interest: "5000"
