# Return J: a 2025 Ontario resident aged 66 at the end of the year (born in 1959, so in 1960
# or earlier) with a spouse or common-law partner who is dependent on the filer because of a
# mental or physical infirmity and whose net income is $12,000, with employment income below
# the EI maximum insurable earnings ($65,700) and the CPP first earnings ceiling ($71,300),
# so the CPP contributions and EI premiums are the rates' arithmetic and there is no second
# additional CPP contribution, and a capital gain. Computed from employment income and a
# capital gain, half of it taxable, to total income; from employment income, by Schedule 8's
# three contribution tiers, to the base, first additional and second additional CPP
# contributions, the last two together the enhanced CPP contributions; from employment
# income, up to the EI maximum insurable earnings, to the EI premiums; from the unused RRSP
# contributions from earlier years and the RRSP contributions, their sum, to the
# contributions available to deduct (Schedule 7 line 10), from those and the deduction
# limit, the lesser of them, to the most that may be deducted (Schedule 7 line 17), from the
# amount deducted (line 18), at most that, to the RRSP deduction (line 20), and from the
# contributions available to deduct less the RRSP deduction to the unused contributions
# carried forward (line 23); from the numbers of eligible children (T778 Part B lines 1 to
# 3), $8,000, $11,000 and $5,000 for each, summed to the basic limit (line 4), from
# employment income, the earned income (line 6), to two-thirds of it, and from those and the
# child care expenses paid (line 5), the least of them, to the child care expenses deduction
# (lines 7 and 9, T1 line 21400), here, with no eligible child and no expenses paid, zero;
# less the child care expenses deduction and the enhanced CPP contributions to net income,
# less the (empty) deductions from net income to taxable income; from net income, by the
# Federal Worksheet, to the federal basic personal amount. The age and spouse lines: from
# net income less the $45,522 income threshold, not below zero, at 15%, taken off the
# maximum $9,028, not below zero, claimed once because the filer was born in 1960 or
# earlier, to the age amount (T1 line 30100); from the basic personal amount plus $2,687 for
# a spouse eligible for the Canada caregiver amount (Schedule 5 line 2, line 51090), less
# the spouse's net income, not below zero, claimed once, to the spouse or common-law partner
# amount (line 30300); and from $28,798 less the spouse's net income, not below zero, at
# most $8,601, less the line 30300 amount, not below zero, claimed once because the spouse
# is eligible for the Canada caregiver amount, to the Canada caregiver amount for the spouse
# (line 30425). The amount for an eligible dependant (line 30400) and the amount for infirm
# children (line 30500) are zero, as before. Through the T1's total of non-refundable credit
# amounts (its basic personal amount, the age amount, the spouse amount, the amount for an
# eligible dependant, the Canada caregiver amount for the spouse, the amount for infirm
# children, the base CPP contributions, the EI premiums and the Canada employment amount),
# credited once at the form's credit rate to the T1's non-refundable tax credits (line
# 35000), taken off its basic tax, not below zero, to the federal tax after credits. ON428's
# total of credit amounts is its basic personal amount, its amount for an eligible
# dependant, the base CPP contributions and the EI premiums, credited once at its rate to
# its non-refundable tax credits (line 61500), taken off its basic tax, not below zero, to
# the Ontario tax after credits, and on ON428 the surtax on the Ontario tax after credits,
# added to it to the Ontario tax with surtax, less the Ontario dividend tax credit
# (Worksheet ON428's line 61520, from lines 12000 and 12010, ON428 lines 56 to 58, 70 and
# 71), not below zero, to the Ontario tax after the dividend credit; the Ontario tax
# reduction amounts (the basic reduction alone), twice them less the Ontario tax after the
# dividend credit, not below zero, to the Ontario tax reduction, taken off the Ontario tax
# after the dividend credit, not below zero, to the Ontario tax after the reduction; from
# employment income, by Schedule ON428-A, 5.05% of it at most $875, less 5% of the higher of
# net income over $32,500 (Part B line 32) and the family's adjusted net income over $65,000
# (line 37), not below zero, to the LIFT credit (ON428 line 85), taken off the Ontario tax
# after the reduction, not below zero, to the Ontario tax after the LIFT credit (line 86),
# less 25% of the qualifying donations (line 87), not below zero, to the Ontario tax after
# the food credit (line 88); from taxable income, by the health premium chart's tiers, each
# capped at the next plateau, to the Ontario health premium, added to the Ontario tax after
# the food credit to the Ontario tax; from employment income and net income, by Schedule 6,
# to the working income and the adjusted family net income, from those to the basic amount
# less its reduction, not below zero, for a filer with no eligible spouse and no eligible
# dependant and for a filer with one, and from those, by the number of Schedule 6 eligible
# dependants (line 38100), the first when it is zero and the second otherwise, to the Canada
# workers benefit (T1 line 45300); and on the T1, the federal tax after credits, carried to
# the net federal tax, plus the Ontario tax to the total payable, less the total credits,
# here the chosen income tax deducted plus the Canada workers benefit, to the refund or
# balance owing, negative for a refund and positive for a balance owing. The Ontario age and
# spouse lines: from net income less the $46,330 income threshold of Worksheet ON428, not
# below zero, at 15%, taken off the maximum $6,223, not below zero, claimed once because the
# filer was born in 1960 or earlier, to the age amount (ON428 line 10, line 58080); and from
# the $11,905.00 base less the spouse's net income, not below zero, at most $10,823, claimed
# once, to the spouse or common-law partner amount (ON428 lines 11 to 13, line 58120).
# ON428's total of credit amounts adds them to the basic personal amount, in line order,
# before the amount for an eligible dependant. Not yet computed, so
# not in this file: the Ontario caregiver amount (ON428 line 58185); any deduction from net income and capital losses (the social benefits repayment, line 23500, is 0, as the chart does not apply). Line 82 (the provincial foreign
# tax credit) is not triggered by this return, and the qualifying donations for line 87 (the
# community food program donation tax credit for farmers) are a chosen $0, so line 87 is $0
# and line 88 is line 86.
# Schedule 9's inputs are all a chosen $0, so lines 116 (34900) and 117 (34990) are $0 and
# line 35000 is line 33800. Nor are the amount for an eligible dependant (T1 line 30400),
# T1 line 30450, the Canada caregiver amount for infirm children (line 30500), Form T778
# line 8 and Parts C and D, and Schedule 6's disability supplement (Step 3) and advance
# payments (Step 4); the Ontario tax reduction for dependants (ON428 line 76) is taken as
# not claimed for the infirm spouse (to be confirmed), though it would change the result:
# twice 838.00 is 1,676.00, more than the Ontario tax after the dividend credit of
# 1,437.17, so the reduction would be 238.83. Schedule 6's eligible spouse is not
# modelled: with no Schedule 6 eligible dependant (line 38100) the amounts for a filer
# with no eligible spouse and no eligible dependant are the ones chosen (to be confirmed),
# and the benefit is 0 with an eligible spouse too. Amounts are quoted decimal strings,
# never floats; counts are quoted digit strings. Every output the CA-ON manifest declares
# must appear under `expected`; intermediate lines may be listed and are then checked too.
# Ontario political contributions (ON479 line 15, line 63100) are a chosen $0, so Worksheet
# ON479's line 16 is $0 (column 1 applies).
# Federal political contributions (T1 line 135 and line 40900) are a chosen $0, so the Federal
# Worksheet's line 41000 is $0 (column 1 applies).
# The Ontario seniors care at home tax credit (ON479 line 13, line 63095) is not claimed (a
# chosen count of 0), so ON479 line 13 is $0.
# The refundable medical expense supplement (T1 line 154 and line 45200, Federal Worksheet)
# takes chosen inputs: the counts of residence in Canada throughout 2025 and of age 18 or
# older at the end of 2025 are 1 and its other new amounts (line 21500, lines 22900 and
# 23100, the net self-employment lines, the wage-loss replacement plan amounts and the
# spouse's column) are $0. The working income is $50,000 (employment income less lines
# 20700, 21200, 22900 and 23100); line 6, the adjusted family net income, is the net income,
# $50,000.00 (column 1 alone, as the spouse's column is 0 and line 23500 is 0, the chart not applying);
# line 8 is line 6 less 33,294.00, $16,706.00; and line 16 and the supplement are $0,
# because line 9 (line 21500, a chosen $0) and line 10 (line 33200, $0 with no medical
# expenses) are 0.
# Form ON-BEN (lines 61020 to 61230) is not applied for (a chosen 0 for each tick box and a
# chosen $0 for each Part A amount), so its ten lines are carried as entered, all 0.
# Rental income (T1 line 13, Form T776 Parts 3 and 4) is a chosen $0: no rental properties
# and no Chart A rows, and every expense box and co-owner and partner figure $0, so T1 lines
# 12599 and 12600 are $0.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  An Ontario resident for all of 2025, aged 66 at the end of the year (born in 1959, so in
  1960 or earlier), with a spouse or common-law partner at the end of the year who was
  dependent on the filer because of a mental or physical infirmity and whose net income
  (line 23600 of their return) was $12,000, with 2025 employment income (T1 line 10100) of
  $50,000 and one capital gain of $930 (Schedule 3 line 21), of which 50% is taxable:
  taxable capital gains (line 12700) of $930 x 50% = 465.00 and total income (line 15000) of
  $50,000 + 465.00 = 50,465.00. The capital gain is one row of Schedule 3 Part 3 line 4
  (shares), with proceeds of 930, an adjusted cost base of 0 and outlays of 0, a chosen figure:
  line 4 is 930, so lines 11, 14, 17, 19 and 21 are 930 (no deferral, no slip or T3 capital
  gains, no business investment loss, no reserves). The CPP contributions are computed from
  employment income,
  which is entered as the T4 box 26 pensionable earnings (the slip's box 26 being blank, the form's
  "enter the amount from box 14") (the
  filer is taken as still contributing at 66, to be confirmed). The EI premiums are computed
  from employment income, taken as the insurable earnings. Employment income is below the EI
  maximum insurable earnings ($65,700) and the CPP first earnings ceiling ($71,300), so EI
  premiums (line 31200, ON428 line 58300) are 1.64% x 50,000 = 820.00, base CPP
  contributions (Schedule 8 line 11, T1 line 30800, ON428 line 58240) are 4.95% x (50,000 -
  3,500) = 2,301.75, and enhanced CPP contributions (line 22215) are the first additional
  (Schedule 8 line 12) 1% x 46,500 = 465.00 with no second additional contribution (line 22,
  $0). No unused or new RRSP contributions, so the most that may be deducted (Schedule 7
  line 17) is $0, the lesser of the contributions available to deduct (Schedule 7 line 10)
  of $0 (the unused contributions from earlier years of $0, Schedule 7 line 1, plus the
  contributions of $0, Schedule 7 line 4) and a chosen deduction limit of $9,000 (Schedule 7
  line 11); the amount deducted (line 18) is that $0, so the RRSP deduction (line 20800) is
  $0 and the unused contributions carried forward (line 23) are $0; no union dues (line
  21200) and no child care expenses deduction (line 21400, Form T778, $0 with no eligible
  child and no child care expenses paid, to be confirmed), so total deductions (line 23300)
  are the enhanced CPP contributions of 465.00 and net income (line 23600) is 50,465.00 -
  465.00 = 50,000.00. There are no deductions from net income (lines 24400 to 25600), so
  their total (line 25700) is $0 and taxable income (line 26000), derived as net income less
  that total, is 50,000.00, inside the lowest federal and Ontario brackets. The
  non-refundable credit amounts are the basic personal amount (federal line 30000 $16,129,
  since net income is $177,882 or less; Ontario ON428 line 58040 $12,747); on the T1, the
  age amount (line 30100), from the Federal Worksheet: line 4, the net income of 50,000.00
  less the line 3 income threshold of 45,522.00, is 4,478.00, and line 6, that at the line 5
  rate of 15%, is 671.70; line 1 $9,028.00 less it is line 7, and so line 30100 is 8,356.30,
  claimed once for the filer born in 1960 or earlier; the spouse or common-law partner
  amount (line 30300), from Schedule 5: line 1 $16,129 plus line 2 (line 51090) $2,687, as
  the spouse is eligible for the Canada caregiver amount, line 3 $18,816.00, less the
  spouse's net income (line 4) of $12,000.00, line 5 and so line 30300 $6,816.00, claimed
  once; no amount for an eligible dependant (line 30400, ON428 line 58160), as there is no
  eligible dependant; the Canada caregiver amount for the spouse (line 30425), from Schedule
  5: line 1 $28,798.00 less the spouse's net income (line 2) of $12,000.00 is line 3
  $16,798.00, at most $8,601.00, less line 4, the $6,816.00 claimed on line 30300, line 5
  and so line 30425 $1,785.00, claimed once; no amount for infirm children (line 30500), as
  there is no infirm child; the base CPP contributions and the EI premiums; and on the T1
  alone the Canada employment amount (line 31260) of $1,471, the lesser of $1,471 and
  employment income (ON428 has no such line): line 33500 of 37,679.05 and ON428 line 58800
  of 21,541.25. ON428's age amount (line 58080) is, from Worksheet ON428, line 4, the net
  income of 50,000.00 less the line 3 income threshold of 46,330.00, 3,670.00, and line 6,
  that at the line 5 rate of 15%, 550.50; line 1 $6,223.00 less it is line 7, and so line
  58080 is 5,672.50, claimed once for the filer born in 1960 or earlier. ON428's spouse or
  common-law partner amount (lines 11 to 13) is the line 11 base of $11,905.00 less the
  spouse's net income (line 12) of $12,000.00, negative, so line 13 is 0 (at most $10,823),
  claimed once: line 58120 is 0. ON428's total is 12,747.00 + 5,672.50 + 0 + 0 + 2,301.75 +
  820.00. The rate is applied once to each total: 14.5% federally (line 33800) and
  5.05% for Ontario (ON428 line 58840). Each product, rounded half-up to the cent, is its
  form's non-refundable tax credits: the total federal non-refundable tax credits (line
  35000) of 5,463.46 and the Ontario non-refundable tax credits (ON428 line 61500) of
  1,087.83, each taken off its form's basic tax (7,250.00 federally, 2,525.00 for Ontario),
  not below zero: 1,786.54 and 1,437.17. The Ontario surtax (ON428 line 68) is 20% of the
  Ontario tax after credits over $5,710 plus 36% of it over $7,307: $0, as the Ontario tax
  after credits is below $5,710, so the Ontario tax with surtax (ON428 line 69) is that same
  1,437.17. With no dividends, Worksheet ON428's lines A and B (lines 12000 and 12010) are
  $0, so the Ontario dividend tax credit (ON428 line 57, line 61520) and line 70 are $0, and
  the Ontario tax after the dividend credit (ON428 line 71, which is line 73) is that same
  $1,437.17. With no dependent children and no dependants (ON428 lines 75 and 76), the
  Ontario tax reduction amounts (line 77) are the basic reduction of $294.00 (line 74);
  twice them, $588.00 (line 78), less the Ontario tax after the dividend credit (line 79,
  from line 73, which is line 71 as line 72 is not triggered) is negative, so the Ontario
  tax reduction (line 80) is $0 and the Ontario tax after the reduction (line 81) is that
  same 1,437.17. The LIFT credit (ON428 line 85, Schedule ON428-A) is 5.05% of employment
  income, $2,525, at most $875, less 5% of the higher of net income over $32,500, 17,500.00,
  and the family's adjusted net income over $65,000, nothing as 62,000.00 is below it, so 5%
  x 17,500.00 = 875.00: $875 - 875.00 = $0, and the Ontario tax after it (ON428 line 86) is
  that same 1,437.17. With chosen qualifying donations of $0, the community food program
  donation tax credit for farmers (ON428 line 87) is 25% x $0 = $0 and the Ontario tax after
  it (line 88) is that same 1,437.17. The Ontario health premium (ON428 line 89) is read
  from its chart on taxable income: 50,000.00 is more than $48,600 but not more than
  $72,000, so the premium is $600, and the Ontario tax (ON428 line 90) is the Ontario tax
  after the food credit plus the premium, 2,037.17. On the T1, the net federal tax (line
  42000) is the federal tax after credits, 1,786.54, and the total payable (line 43500) is
  it plus the Ontario tax (line 42800), 3,823.71. The Canada workers benefit (line 45300,
  Schedule 6) is 27% of the working income, the employment income, over $3,000, $12,690, at
  most $1,633, less 15% of the adjusted family net income, the net income, over $26,855,
  3,471.75; the reduction is more than the $1,633, so the benefit is $0. With an eligible
  dependant, at most $2,813 less 15% over $30,639, 2,904.15, the benefit would be $0 too, as
  it would with an eligible spouse, whose net income of $12,000 raises the adjusted family
  net income to 62,000.00. The income tax deducted (line 43700) is a chosen $6,000, so the
  total credits (line 48200) are it plus the benefit, $6,000, and the refund or balance
  owing (line 167) is the total payable less the total credits, -2,176.29: negative, so a
  refund (line 48400). Every amount computed from a rate, fraction, amount or chart on the
  forms is rounded half-up to the cent, each line being a dollars-and-cents box; here that
  changes Form T778 line 6 and both forms' non-refundable tax credits, and the lines that
  follow from them. The lines that only add, subtract, compare or choose take amounts
  already in cents, so the refund or balance owing is in cents too. The other Step 2 income
  lines are 0: no other employment income, pension or benefit income (lines 10400 to 11900),
  no taxable dividends (lines 12000 and 12010), the Federal Worksheet's lines 1 to 8 and
  line 10 being 0 so that its line 9, its line 11 and the interest and other investment
  income (line 12100) are 0, no partnership or RDSP income (lines 12200 and 12500), no
  taxable support payments, RRSP, FHSA, other or scholarship income (lines 12800 to 13010)
  and no workers' compensation, social assistance or net federal supplements, so line 14700
  is 0 + 0 + 0 = 0. There are no eligible medical expenses for fertility treatment and no
  amount paid for seniors' use of Ontario public transit, so the Ontario credits (ON479 line
  21, T1 line 47900) are 0.
  No self-employment income: the net business, professional, commission, farming and fishing
  income (T1 lines 13500, 13700, 13900, 14100 and 14300) are $0, so their sum (line 27) is
  $0, and it is a $0 term of total income (line 15000). The CPP months (Schedule
  8 box A) are the 12 of a full year, Schedule 8 Part 4 is not completed (count 0) and there
  is no agreement with the Canada Employment Insurance Commission (count 0), so the CPP
  contributions payable (line 42100), the base CPP contributions (line 31000) and the
  deduction (line 22200) on self-employment income, and the EI premiums on it (lines 31217
  and 42120), are $0 and change no total.
