    CRA, "T1-2025 Schedule 8 Canada Pension Plan Contributions and Overpayment" (form
    5000-S8). Part 2, 12 months: line B "Your maximum pensionable earnings for 2025 (maximum
    $71,300)"; line D "Your additional maximum pensionable earnings for 2025 (maximum
    $81,200)"; line E "Your maximum basic exemption for 2025 (maximum $3,500)". Part 3: line
    1 (50339) "Total CPP pensionable earnings from box 26 of all of your T4 slips (if box 26
    is blank, enter the amount from box 14) (maximum $81,200 per slip)"; line 2 "Enter
    whichever is less: amount from line D of Part 2 or line 1."; line 3 "Amount from line B
    of Part 2"; line 4 "Line 2 minus line 3 (if negative, enter "0")"; line 5 "Line 2 minus
    line 4 (if negative, enter "0")"; line 6 "Amount from line E of Part 2"; line 7 "Line 5
    minus line 6 (if negative, enter "0") (maximum $67,800)"; line 11 "amount from line 7
    multiplied by 4.95% (maximum $3,356.10)" (base contributions); line 12 "amount from line
    7 multiplied by 1% (maximum $678.00)" (first additional); line 15 "Amount from line 11";
    line 18 "Amount from line 12"; line 22 "amount from line 4 multiplied by 4% (maximum
    $396.00)" (second additional, CPP2). Part 3b, "Amount from line 24 is "0" or negative":
    line 30 "If line 16 is positive or "0", enter the amount from line 15 at line 30 and
    line 36, and continue at line 37. If not, enter the amount from line 14 and continue at
    line 31."; line 32 "... If not, enter "0"."; line 34 "Line 30 plus line 32"; line 35 "If
    line 23 and line 33 are both positive, enter whichever is less. If not, enter "0".";
    line 36 "Line 34 plus line 35. Enter this amount (in dollars and cents) on line 30800 of
    your return and line 58240 of your Form 428."; line 37 (printed "Line 36" on the form,
    the 37 that line 30 refers to) "If line 19 is positive or "0", enter the amount from
    line 18 at line 37 and line 43, and continue at line 44."; line 44 "If line 23 is
    positive or "0", enter the amount from line 22 on line 44 and line 47, and continue at
    line 48."; line 48 "Line 43 plus line 47 Enter this amount (in dollars and cents) on
    line 22215 of your return." Box 26 is entered as the employment income (the form's "if box 26 is
    blank, enter the amount from box 14"), so the contributions are computed from employment income. The contributions deducted on the slip are taken as the
    required ones, so line 24 is 0 and Part 3b applies: with lines 16, 19 and 23 all 0, line
    30 puts line 15 (the line 11 base) at line 36, lines 32 and 35 are 0, so line 36, and
    line 30800, is line 11; line 18 (the line 12 first additional) goes to lines 37 and 43
    and line 22 to lines 44 and 47, so line 48, and line 22215, is line 12 plus line 22.
    Part 3a (line 25 "Enter the amount from line 15. Enter this amount (in dollars and
