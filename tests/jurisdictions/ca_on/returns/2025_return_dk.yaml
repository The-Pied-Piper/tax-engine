# Return DK: Form T1-M, the moving expenses deduction (T1 line 21900), for two moves, each on its own
# copy of the form. The return's income is employment income of 40,000.00 (T4), so each move's
# line 28, at most that income, is within the income lines it is taken from.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  Return DK: a 2025 Ontario filer who moved twice to work and reports employment income of 40,000.00
  on this return (T4 box 14). The net amount earned at the new work location, 40,000.00 for each
  move, is each move's line 28: a chosen figure, at most the employment income of the return, so
  it is not refused. Move 1 (a chosen figure): old home
  100 kilometres from the new work location, new home 10 kilometres from it, so line 3 is 100 minus
  10 = 90, at least 40, so the move counts. Transportation and storage costs 2,000.00 (line 4),
  travel expenses 500.00 (line 5), accommodation, meals, temporary living, lease, incidental costs,
  selling and buying costs all 0.00 (not claimed), no reimbursement (line 25 is 0.00), and line 28
  is 40,000.00 (the net eligible income at the new work location). Line 8 is 500.00 (lines 5 to 7),
  line 15 and line 20 and line 23 are 0.00, line 24 is 2,000.00 plus 500.00 = 2,500.00, line 26 is
  2,500.00 minus 0.00 = 2,500.00, line 27 is 2,500.00, and line 29 is the lesser of 2,500.00 and
  40,000.00, 2,500.00, which is line 21900 of the move. Line 30 is 2,500.00 minus 40,000.00, below
  zero, so 0.00. Move 2 (a chosen figure): old home 200 kilometres, new home 50 kilometres, so line 3
  is 150, at least 40. Transportation and storage costs 1,000.00 (line 4) and nothing else, no
  reimbursement, and line 28 is 40,000.00; line 26 is 1,000.00, line 29 is 1,000.00 and line 30 is
  0.00. Line 21900 is the total of the line 29 amounts of the two moves: 2,500.00 + 1,000.00 =
  3,500.00. Line 23300 "Add lines 35 to 52" takes line 21900 and the enhanced CPP of line 22215,
  365.00 (Schedule 8 on the employment income, one copy), so the deductions are 3,865.00 and line
  23400 "Line 34 minus line 53" is 40,000.00 - 3,865.00 = 36,135.00 (net income before
  adjustments). The alternative minimum tax carryover available for 2026 is 0.00 and the largest
  amount subject to second additional CPP contributions is 9,900.00. The other payments limit
  income (36,135.00), the Ontario tax less the dividend credit (1,056.73) and the refund or balance
  owing (2,761.06) are the engine's figures for the 40,000.00 of employment income, not hand-traced
  here: to be confirmed against the T1 and Form 5006-R lines.
sources:
  - >-
    CRA, Form T1-M, Moving Expenses Deduction (2025, Protected B when completed), page 1: "You must
    complete a separate Form T1-M for each eligible move. Enter the total from line 29 in Part 4 of
    each form on line 21900 of your Income Tax and Benefit Return." and "Complete a separate form
    for each move to calculate your eligible moving expenses deduction."
    https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t1-m/t1-m-25e.pdf
  - >-
    CRA, Form T1-M, Part 2 "Calculation of distance in kilometres": "Line 1 minus line 2" (line 3)
    and "If the amount on line 3 is less than 40 kilometres, you cannot deduct your moving expenses."
    https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t1-m/t1-m-25e.pdf
  - >-
    CRA, Form T1-M, Part 4 "Allowable moving expenses": "Add lines 5 to 7." (line 8), "Add lines 4,
    8, 11, 15, 20 and 23." (line 24), "Line 24 minus line 25 (if negative, enter "0")" (line 26),
    "Amount from line 26 of the previous page" (line 27), "Enter whichever is less: amount from line
    27 or line 28." (line 29, "Enter this amount on line 21900 of your return.") and "Line 27 minus
    line 28 (if negative, enter "0")" (line 30).
    https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t1-m/t1-m-25e.pdf
  - >-
    CRA, T1-2025 Ontario edition (form 5006-R): "Line 44 and line 21900: Moving expenses (complete
    Form T1-M)"; "Line 53 and line 23300: Add lines 35 to 52."
    https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-r/5006-r-25e.txt
