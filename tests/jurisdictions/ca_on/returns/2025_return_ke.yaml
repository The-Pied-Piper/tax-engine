# Return KE: a 2025 Ontario resident with QSBCS and QFFP reserves reported in 2025 (Form T2017) for
# dispositions in 2016, 2019, 2021 and 2024, one of them (2021) with a later-year claim in 2025, and the
# 2025 QSBCS disposition of Return BF (a gain of $350,000, Schedule 3 line 10700).
# Form T657 reads every "Amount from line 6 / line 12 of Form T2017" from the rows of Form T2017, the
# 2024 reserve of each disposition less its 2025 reserve: the 2021 row (a 70,000.00 reserve in 2024, 30,000.00
# claimed in 2025) gives Chart 2021 amount G of 40,000.00, like Return BH's 2021 row that claims nothing.
# Form T2017 lines 1 and 7 agree with the rows (50,000.00 and 170,000.00), so line 13 is 190,000.00: Schedule 3
# line 19200 and T657 Step 1 line 2 take it, the annual gains limit is 250,000.00 and the cumulative gains
# limit 350,000.00. Line 25400 is the chosen 155,000.00, below the 250,000.00 maximum. Every other T657 line
# is blank, as in Return BF. The worked derivation is in the description.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025, resident in Canada throughout 2025, aged 18 or older at
  the end of 2025, with other income (T1 line 13000) of $10,000, a chosen figure, one disposition of
  qualified small business corporation shares (QSBCS) in 2025 after June 24, 2024, proceeds
  $500,000, a chosen figure, adjusted cost base $150,000, a chosen figure, and outlays nil, so the
  gain is 350,000.00 (Schedule 3 line 10700, column 5, "gain or loss" = column 2 minus columns 3 and
  4). Five reserves are reported on Form T2017, each as a row of its line. Four are the previous
  year's claim (a chosen 2024 reserve) with nothing claimed in 2025, so the row's change in the
  reserve (Form T2017 line 6 or line 12 of the row: the 2024 reserve less the 2025 reserve) is that
  reserve: line 12 (QSBCS, line 8 row) of 60,000.00 for a disposition in 2016 (9 years after), which
  Form T657 reads into Chart 2016 Part 1 as amount E; line 6 (QFFP, line 2 row) of 20,000.00 for a
  disposition in 2019 (6 years after), read into Chart 2019 as amount F; line 12 of 40,000.00 for a
  disposition in Period 1 of 2024 (1 year after, answered yes to Period 1 of 2024), read into Chart
  2024 Period 1 as amount G; and line 6 of 30,000.00 for a disposition in Period 2 of 2024 (1 year
  after, answered no to Period 1 of 2024), read into Chart 2024 Period 2 as amount F. The fifth is a
  disposition of QSBCS in 2021 (4 years after; capital gain, proceeds and amount payable after the
  end of the year all 1,000,000, chosen figures) whose reserve in 2024 was 70,000 and of which
  30,000 is claimed in 2025 (a later year, so the claim may be at most the 2024 claim, 70,000, and
  at most the maximum for the year): its 2025 reserve is 30,000.00 and its change, 70,000.00 -
  30,000.00 = 40,000.00, is read into Chart 2021 as amount G. No reserve is reported on a T5013
  slip. The rows' 2024 reserves are also Form T2017's starting figures: line 1 (QFFP) is 20,000.00 +
  30,000.00 = 50,000.00 and line 7 (QSBCS) is 60,000.00 + 70,000.00 + 40,000.00 = 170,000.00 (chosen
  figures that agree with the rows). Form T2017: line 5 (the 2025 reserve for QFFP) is 0, so line 6
  is 50,000.00; line 11 (QSBCS) is 30,000.00, so line 12 is 170,000.00 - 30,000.00 = 140,000.00;
  line 13 is 50,000.00 + 140,000.00 = 190,000.00, the 2024 reserves brought into 2025 less what is
  reserved again. Line 19 is 190,000.00 and lines 22, 25 and 28 are 0, so line 29 and line 31,
  entered on Schedule 3 line 19200, are 190,000.00. Chart 2 line 18 (deductions of earlier years) is
  100,000.00 (a chosen figure), so line 19 is 100,000.00. Schedule 3: the gain of 350,000.00 on line
  10700 plus the reserve of 190,000.00 on line 19200 is 540,000.00 (line 19700); at the inclusion
  rate on line 23 of 50% the taxable capital gains are 270,000.00 (line 24, carried to line 12700,
  and line 26, line 19900). Net capital losses of other years: 20,000 are available (line 6 of Form
  T1436, a chosen figure) and 20,000 are claimed (a chosen figure), so line 25300 is 20,000.00. Net
  income (line 23600) is 270,000.00 + 10,000.00 = 280,000.00. Form T657 Step 1: line 1 is 350,000.00
  (Schedule 3 line 10700 only); line 2 (Form T2017 line 13) is 190,000, so line 3 is 540,000.00;
  line 4 is 1/2, so line 5 is 270,000.00; line 6 (Form T2048 line 17216) is 0; line 7 is 270,000.00;
  line 8 is 270,000.00; line 9 is 0; line 10 is 270,000.00; line 11 is 0; line 12 is 270,000.00;
  line 13 is 270,000.00. Step 1 line 14 is 20,000.00 (line 25300); line 16 is 20,000.00; line 17 is
  0; line 18 is 0; line 19 is 0; line 20 is 20,000.00; line 21 is 270,000.00 - 20,000.00 =
  250,000.00, the annual gains limit for 2025. Step 2: line 8 is 100,000 (a chosen figure) +
  270,000.00 = 370,000.00; line 9 is 370,000.00; line 15 is 20,000.00; line 18 is 20,000.00; line 19
  is 370,000.00 - 20,000.00 = 350,000.00, the cumulative gains limit for 2025. Chart 2016: amount A
  is 412,088.00; B is Chart 2 line 19, 100,000.00 (no (2016-1) calculation), so C is 312,088.00. D
  (line 6) is 0 and E (line 12) is 60,000.00: D plus E is 60,000.00, F is 30,000.00 (x 1/2) and G is
  the lesser of C and F: 30,000.00. H is the lesser of 250,000.00, 350,000.00 and G: 30,000.00 (not
  read). Part 2 (A 500,000.00, B is Part 1's G) has C 470,000.00 and E 370,000.00 (E less D of
  100,000.00). F (line 6 x 1/2) is 0, so G is 0; I is G plus Part 1's G, 30,000.00, and J is 0. No
  additional deduction is claimed, so Part 2 does not apply and the total carried is Part 1's G,
  30,000.00. Charts 2017 and 2018 take the 30,000.00 total. Chart 2017: A 417,858.00, B 30,000.00, C
  387,858.00 and E 287,858.00 (D 100,000.00); F and G are 0, so I is 0 and K is 30,000.00; L is
  30,000.00. Chart 2018: A 424,126.00, C 394,126.00, E 294,126.00, K 30,000.00. Neither has a
  reserve or a Part 2 claim, so each total carried is 30,000.00. Chart 2019: amount A is 433,456.00
  and B is 30,000.00, so C is 403,456.00 and E is 303,456.00. F (line 6) is 20,000.00 and G is 0, so
  F plus G is 20,000.00 and H is 10,000.00; I is the lesser of E and H, 10,000.00; K is I plus B,
  40,000.00, and L is 40,000.00. Part 2: C is 460,000.00 (A less K), E is 360,000.00, F is 10,000.00
  (line 6 x 1/2), G is 10,000.00, I is G plus K, 50,000.00, and J is the lesser of F and I,
  10,000.00. No additional deduction is claimed, so the total carried is Part 1's K, 40,000.00.
  Chart 2020: A 441,692.00, B 40,000.00, C 401,692.00, E 301,692.00; nothing reported, so K is
  40,000.00 and the total carried is 40,000.00. Chart 2021: amount A is 446,109.00; B is Chart
  2020's total, 40,000.00, so C is 406,109.00 and E is 306,109.00 (D 100,000.00). G (line 12) is
  40,000.00, the 2021 row's 2024 reserve of 70,000 less its 2025 reserve of 30,000, and F is 0, so F
  and G add to 40,000.00; the half is H, 20,000.00, so J (H plus I, with I 0) is 20,000.00 and K is
  20,000.00. Amount M is K plus B, 60,000.00, and N is the lesser of 250,000.00, 350,000.00 and M:
  60,000.00. Part 2 (A 500,000.00, B is Part 1's M) has C 440,000.00 and E 340,000.00; no QFFP
  reserve and no additional deduction, so Part 2 does not apply and the total carried is Part 1's M,
  60,000.00. Charts 2022 and 2023 take the 60,000.00 total: Chart 2022 has A 456,815.00, C
  396,815.00 and E 296,815.00, nothing reported, so M is 60,000.00 and the total carried is
  60,000.00. Chart 2023 has A 485,595.00, C 425,595.00 and E 325,595.00; M is 60,000.00 and the
  total carried is 60,000.00. Chart 2024 Period 1: amount A is 508,418.00 (the maximum for Period
  1); B is Chart 2023's total, 60,000.00, so C is 448,418.00 and E is 448,418.00 less D (100,000.00)
  = 348,418.00. F and G (40,000.00, the 2024 reserve) and H add to 40,000.00 and I is 40,000.00 x
  1/2 = 20,000.00. J (the portion of Form T2048 line 17216 for a Period 1 reserve) is 0, so K is
  20,000.00. L is the lesser of E (348,418.00) and K (20,000.00): 20,000.00. Amount M is B,
  60,000.00, so N is 20,000.00 + 60,000.00 = 80,000.00. O is the lesser of 250,000.00, 350,000.00
  and N (80,000.00): 80,000.00. Chart 2024 Period 2: amount A is 625,000.00; B is Period 1's N,
  80,000.00, so C is 545,000.00 and E is 545,000.00 less D (100,000.00) = 445,000.00. F is 30,000.00
  (a chosen figure), G and H are 0; F to H add to 30,000.00 and I is 15,000.00. J is 0, so K is
  15,000.00. L is the lesser of E (445,000.00) and K (15,000.00): 15,000.00. M is B, 80,000.00, so N
  is 15,000.00 + 80,000.00 = 95,000.00. O is the lesser of 250,000.00, 350,000.00 and N (95,000.00):
  95,000.00. Chart 2025 Part 1 (Period 1 of 2024): amount A is 522,145.00; B is Period 2's N,
  95,000.00, so C is 427,145.00 and E is 427,145.00 less D (100,000.00) = 327,145.00. Amounts F to J
  are 0 (no slip amounts and no T2017 reserve reported on a T5013 slip, as the Period 1 reserve is
  on Chart 2024), so K is 0 and M is 0 (L is 0), N is the lesser of E and M, 0. O is B, 95,000.00,
  so P is 0 + 95,000.00 = 95,000.00. Q is the lesser of 250,000.00, 350,000.00 and P (95,000.00):
  95,000.00, which nothing reads. Chart 2025 Part 2: amount A is 625,000.00; B is Part 1's P,
  95,000.00, so C is 530,000.00 and E is 530,000.00 less D (100,000.00) = 430,000.00. F is line
  10700 less the excluded slip amounts (none): 350,000.00; G, H, I and J are 0 (no Form T2017 amount
  is entered on Part 2 for the 2024 reserves, which are charted on Chart 2024). F to J add to
  350,000.00 and K is 175,000.00. L is 0, so M is 175,000.00. N is the lesser of E (430,000.00) and
  M (175,000.00): 175,000.00. O is B, 95,000.00, so P is 175,000.00 + 95,000.00 = 270,000.00. Q is
  the lesser of 250,000.00, 350,000.00 and P (270,000.00): 250,000.00, the maximum for line 25400.
  The filer claims 155,000, a chosen figure less than the maximum, so line 25400 is 155,000.00 and
  line 25700 is 20,000.00 (line 25300) + 155,000.00 (line 25400) = 175,000.00. Line 26000 is
  280,000.00 - 175,000.00 = 105,000.00, the taxable income. The other lines are blank and are the
  engine's figures (to be confirmed against CRA's calculator); the alternative minimum tax lines
  follow from the larger gain.
