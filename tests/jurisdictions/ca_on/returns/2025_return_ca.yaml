jurisdiction: CA-ON
tax_year: 2025
description: >-
  Return CA: Return AL's filer, a single 2025 Ontario resident aged 20 (a chosen figure)
  and resident in Canada throughout 2025, whose $10,000 of dividends other than eligible
  dividends from a private corporation controlled by a relative (no information slip, so
  grossed up by the Federal Worksheet's line 15 "Applicable rate 115%" to $11,500.00) are
  all split income (Form T1206 Part 1 lines 1 and 2, $11,500), now with foreign income:
  $40,000 of other income, all of it split income from foreign sources (T1206 line 3, a
  chosen figure), and $10,000 of foreign investment income that is not split income, each
  paying foreign tax to one country, $15,000 in all (Form T2209 line 1, a chosen figure),
  the whole $50,000 being net foreign non-business income (T2209 line 2). The filer has no
  employment income, so the tax on the foreign split income is the point of the return.
  Total income (line 15000) is $11,500.00 + $40,000.00 + $10,000.00 = $61,500.00; T1206
  line 4 is $11,500 + $40,000 = $51,500, which joins line 23200 as a deduction, so net
  income (line 23600) and taxable income (line 26000) are $61,500.00 - $51,500.00 =
  $10,000.00. T1206 Part 2: line 8 is 33% x $51,500 = $16,995.00 (line 40424); the
  disability amounts (lines 31600 and 31800, a chosen 0 each) give a line 14 of 0.00, so
  line 15 is $16,995.00; line 19 is 9.0301% x $11,500 = $1,038.4615, rounded half-up to
  the cent, $1,038.46, line 18 and line 20 are 0.00, so line 22 is $16,995.00 - $1,038.46
  = $15,956.54. T2209: the net income of note (3) is $10,000.00 plus the split income of
  line 68360, $61,500.00, the basic federal tax of note (4) is $16,106.29 ($18,445.00, the
  tax on taxable income of $1,450.00 plus line 40424, less the non-refundable tax credits
  of $2,338.71, before the dividend tax credit), so line 2 is $50,000 x $16,106.29 /
  $61,500.00 = $13,094.5447, rounded half-up to the cent, $13,094.54, less than the
  $15,000 paid, and the federal foreign tax credit (line 40500) is $13,094.54, within the
  $15,067.83 of line 42900. T1206 line 23 is the part of line 3 from foreign sources over
  the total income from foreign sources (lines 68370 and 68380, $40,000 and $50,000,
  chosen figures) times line 40500: $13,094.54 x $40,000 / $50,000 = $10,475.632, rounded
  half-up to the cent, $10,475.63. Line 24 is $15,956.54 - $10,475.63 = $5,480.91. Line 29
  is the federal tax less credits of the T1 (line 41700, $1,973.29) plus line 41500 (0),
  and line 30 is the more of lines 24 and 29, $5,480.91, which, with the special taxes
  (line 41800, 0), is the net federal tax (line 42000). T1206 Part 3: line 33 (ON428 line
  54, line 61510) is 20.53% x $51,500 = $10,572.95; lines 34 to 38 are 0.00, so line 39 is
  $10,572.95; line 42 is 10% of the 0.00 of line 18 and line 45 is 2.9863% x $11,500 =
  $343.4245, rounded half-up to the cent, $343.42, so line 47 is $10,572.95 - $343.42 =
  $10,229.53. The provincial foreign tax credit (Form T2036 line 5, ON428 line 82) is the
  less of line 3, $15,000 less the federal credit, $1,905.46, and line 4, $50,000 x
  $10,572.95 / $61,500.00 = $8,595.89, so $1,905.46, within the Ontario tax otherwise
  payable of $10,572.95. T1206 line 49 is the non-business part of line 68370 over the
  non-business part of line 68380 ($40,000 and $50,000, chosen figures, all the foreign
  income being non-business) times ON428 line 82: $1,905.46 x $40,000 / $50,000 =
  $1,524.368, rounded half-up to the cent, $1,524.37, and line 50 is $10,229.53 -
  $1,524.37 = $8,705.16. Line 51 is ON428 line 88, $8,324.07 ($10,229.53 less the
  $1,905.46 of line 82), and line 52 is the more of lines 50 and 51, $8,705.16, to which
  the health premium of $600.00 (taxable income of $10,000.00 plus line 68360, $61,500.00,
  above $48,000 and at most $72,000, so the first three tiers at their $300, $150 and $150
  maximums) is added: the Ontario tax, $9,305.16. The total payable is the net federal tax
  plus the Ontario tax, $5,480.91 + $9,305.16 = $14,786.07; with no income tax deducted (a
  chosen $0), no Canada workers benefit and no provincial credits, the balance owing is
  $14,786.07. Not yet computed, so not in this file: line 33C, line 8A and the other lines
  of T1206 that Return AL notes. Amounts are quoted decimal strings, never floats; counts
  are quoted digit strings. A line or input this return leaves out is blank, 0, and is
  checked to compute to 0; intermediate lines that are listed are checked too.
sources:
  - >-
    CRA, Form T1206 "Tax on Split Income" 2025 (docs/cra-forms-2025/t1206-25e.pdf,
    confirmed 2026-10-19 from the PDF; no .txt published), Part 2 "Federal foreign tax
    credit on split income": "Part of the amount on line 3 that is from foreign sources"
    (68370) over "Total income from foreign sources" (68380), "× Amount from line 40500
    of your return" (line 23); "Line 22 minus line 23 (if negative, enter "0")" (line
    24); "Enter whichever is more: the amount from line 24 or line 29." (line 30). Line
    23 is a dollars-and-cents box, so $13,094.54 x $40,000 / $50,000 = $10,475.632
    rounds half-up to the cent (the owner's decision, the form stating no rounding
    rule), $10,475.63; line 24 is $15,956.54 - $10,475.63 = $5,480.91; line 29 is
    $1,973.29 + $0.00; line 30 is $5,480.91.
  - >-
    CRA, Form T1206 2025, Part 3 "Provincial or territorial foreign tax credit on split
    income": "Amount from line 47 on the previous page" (line 48); "Part of the amount
    from line 68370 on page 8 that is non-business income" over "Part of the amount from
    line 68380 on page 8 that is non-business income", "× Amount from line number of
    your Form 428 shown in column 7 in Chart C on page 5" (line 49, Ontario: ON428 line
    82); "Line 48 minus line 49" (line 50); "Amount from the line number of your Form
    428 shown in column 8 of Chart C on page 5" (line 51, Ontario: ON428 line 88);
    "Enter whichever is more: the amount from line 50 or line 51." (line 52). Line 49 is
    $1,905.46 x $40,000 / $50,000 = $1,524.368, $1,524.37 half-up to the cent; line 50
    is $10,229.53 - $1,524.37 = $8,705.16; line 51 is $8,324.07; line 52 is $8,705.16,
    the Ontario tax before the health premium.
  - >-
    CRA, Form T2209 "Federal Foreign Tax Credits" 2025, line 1 "Non-business income tax
    paid to a foreign country" ($15,000), line 2 "Net foreign non-business income" "×
    Basic federal tax" over "Net income" ($50,000 x $16,106.29 / $61,500.00 =
    $13,094.5447, $13,094.54), line 3 "Enter whichever is less: the amount from line 1
    or line 2." ($13,094.54), "Federal foreign tax credit" (line 40500, $13,094.54, not
    more than line 42900, $15,067.83). Form T2036 "Provincial or Territorial Foreign Tax
    Credit" 2025, line 3 "Line 1 minus line 2" ($15,000.00 - $13,094.54 = $1,905.46),
    line 4 "Net foreign non-business income" "× Provincial or territorial tax otherwise
    payable" over "Net income" ($50,000 x $10,572.95 / $61,500.00 = $8,595.8943,
    $8,595.89) and line 5 "Enter whichever amount is less: line 3 or line 4."
    ($1,905.46, entered on ON428 line 82). These two forms are as Return AW takes them.
  - >-
    CRA, T1 General 2025 and Form ON428: line 40424, 40500, 41700, 41800, 42000 and
    42800; ON428 lines 54 (61510), 82, 88, 89 (the health premium chart, $600 for
    taxable income above $48,000 and at most $72,000) and 90 "Line 88 plus line 89 Enter
    this amount on line 42800 of your return. Ontario tax", line 88 being line 52 of
    Form T1206. The Federal Worksheet for line 40425, as in Return AL.
