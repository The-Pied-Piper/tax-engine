# Return IX: Return Y (a single parent with one dependent child, employment income of
# $60,000, an Ontario resident) with a tuition amount transferred from two students, T1 line
# 32400: a total of $10,000, bounded by the number of students (2) at $5,000 each (Form
# 5000-G). The total is within the bound, so it is kept as entered and adds 10,000 to the
# federal non-refundable tax credit amounts, taxed at the 14.5% federal rate. The rest is as
# in Return Y.
jurisdiction: CA-ON
tax_year: 2025
description: >-
    Return IX is Return Y with a tuition amount transferred from two students. The total,
    $10,000 (ca/tuition_transferred_from_child), and the count of students, 2
    (ca/tuition_transfer_students), are chosen figures. Line 32400 takes one total, and the
    guide (Form 5000-G) prints the maximum for each student as $5,000 minus the amount that
    student used to reduce their own tax payable. The student's own use is not an input to
    this return, so the bound is the count times $5,000: 2 x $5,000.00 = $10,000.00
    (ca/tuition_transferred_from_child_maximum, a per-unit amount of the per-student dataset). $10,000 is
    not above $10,000.00, so the transfer is kept as entered (the at-most check,
    ca/tuition_transferred_from_child_checked, 10000). The transfer is a part of the total
    of the credit amounts on the T1 (line 33500), so that total rises from Return Y's
    37509.75 to 37509.75 + 10000 = 47509.75 (ca/non_refundable_credit_amounts). At 14.5%
    (line 35000), 47509.75 x 14.5% = 6888.91, rounded half-up to the cent: the federal non-
    refundable tax credits, Return Y's 5438.91 plus 1450.00. Federal basic tax on the same
    income (ca/federal_basic_tax) is 7893.08, so the federal tax after credits is 7893.08 -
    6888.91 = 1004.17. The CPP and EI amounts are as in Return Y, 4240.69 - 2454.17 =
    1786.52 together, so the total payable is 1004.17 + 1786.52 = 2790.69, Return Y's
    4240.69 less 1450.00. The total credits (line 48200) are as in Return Y: the income tax
    deducted (a chosen $8,000), no benefit, and the Ontario credits (T1 line 47900) of
    $1,650.00, $9,650.00. The refund or balance owing (line 167) is 2790.69 - 9650.00 =
    -6859.31, negative, so a refund of 6859.31 (line 48400). The Ontario tax and its credits
    are as in Return Y, since no Ontario line on this return reads line 32400. The AMT basic
    federal tax and the regular net federal tax are given as 1004.17 here, the same as this
    return's federal tax after credits; the AMT payable stays zero, as in Return Y.
