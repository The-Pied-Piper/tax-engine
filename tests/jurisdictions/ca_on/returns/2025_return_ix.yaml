    is 0 + 0 + 5,000 = 5,000; line 5 is 6,000. The earned income of line 6 is the employment
    income, the only earned income on this return, 60,000, and two-thirds of it is 60,000 x
    2 / 3 = 40,000, rounded half-up to the cent, which changes nothing. Line 7, which takes
    amounts already in cents, is the least of 5,000, 6,000 and 40,000: 5,000. "Claiming
    child care expenses": "If you are the only person supporting the eligible child, claim
    the child care expenses that you incurred while the eligible child was living with you.
    Fill out parts A and B, and Part D if it applies." The taxpayer is taken as the only
    person supporting the child (to be confirmed), so line 8 (the other person with the
