    person paid to have someone look after an eligible child so that you or the other
    person could:" "- earn income from employment"; "These include payments made to any
    of the following:" "- day nursery schools and daycare centres". The child care expenses
    were paid in 2025 to a daycare, with receipts, so that the taxpayer could earn income
    from employment (to be confirmed): 6,000 (line 67950). The form's other conditions
