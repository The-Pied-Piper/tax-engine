# Return JQ (the U.S. Social Security treaty deduction, T1 line 25600, Guide 5000-G): a single 2025
# Ontario resident with employment income of $10,000 and other pensions of $20,000 (line 11500), of
# which $12,000 is U.S. Social Security benefits, received continuously by a resident of Canada since
# before January 1, 1996. Guide 5000-G "Line 25600 - Additional deductions": "you can claim a
# deduction equal to 50% of the U.S. Social Security benefits received in 2025", so the deduction is
# 50% x $12,000 = $6,000.00, not the 15% ($1,800.00) of a later arrival. With no other additional
# deduction, line 25600 is $6,000.00 and so is line 25700 (T1 line 68). Total income is $10,000 +
# $20,000 = $30,000; the enhanced CPP contributions of $65.00 are the only deduction from total
# income, so net income is $29,935.00 and taxable income (line 26000) is $29,935.00 - $6,000.00 =
# $23,935.00. A filer who left line 25600 at $0 because the engine asked for nothing would be taxed on
# $29,935.00. The benefits are part of line 11500, so a figure above the $20,000 is refused.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident with employment income of 10000 and other pensions of 20000 (line
  11500) including 12000 of U.S. Social Security benefits, a resident of Canada receiving them
  continuously since before January 1, 1996 (a chosen answer of 1). Guide 5000-G line 25600: 50%
  of the benefits, 6000.00 (15% would be 1800.00), added to the filer's other additional
  deductions of 0 gives line 25600 of 6000.00, deducted on line 25700 and subtracted from net income
  of 29935.00 (total income 30000 less the enhanced CPP contributions of 65.00) for taxable income
  of 23935.00. The employment income is as in Return JK, with the CPP contributions computed from it
  by Schedule 8's tiers (enhanced contributions 65.00) and the EI premiums of 164.00 from Form T2204
  line 16. No capital gain, no RRSP contributions and no other deduction from total income.
  Every other line follows from those figures by the forms' rules; the lines the treaty deduction
  does not touch are as in the engine's other worked returns.
sources:
  - >-
    CRA Guide 5000-G (2025), "Line 25600 - Additional deductions", "Exempt foreign income", and
    the T1, Federal Worksheet, Schedule 7, Schedule 8, ON428 and EI table arithmetic on the 2025
    figures.
