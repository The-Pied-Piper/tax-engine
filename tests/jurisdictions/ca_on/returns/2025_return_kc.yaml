# Return KC: Form T2048 (2025) Chart A line 13, "Net income from limited or non-active partnership
# (line 12200) other than taxable capital gains". A 2025 Ontario resident with employment income of
# $60,000, a taxable capital gain of $100,000, a $30,000 claim of net capital losses of other years,
# a $8,000 business investment loss, $5,000 of carrying charges, $6,000 of exploration and
# development expenses, $4,000 of interest, $2,000 of other income and one qualifying business
# transfer (as Return BE), and net partnership income (line 12200) of $3,000 that includes
# $1,000 of taxable capital gains. Every figure is a chosen figure; the lines listed under
# `expected` are the lines the carve-out and the 3,000 reach (the tax lines are the engine's
# figures, to be confirmed against CRA's calculator).
jurisdiction: CA-ON
tax_year: 2025
description: >-
  Return KC is Return BE with a line 12200 amount of 3,000 (net income from a limited or non-active
  partnership) that includes taxable capital gains of 1,000, both chosen figures. Form T2048 Chart A
  line 13 reads "Net income from limited or non-active partnership (line 12200) other than taxable
  capital gains": 3,000 less 1,000 = 2,000.00, not the whole 3,000. Chart A line 10 is as in Return
  BE (31,000.00); line 11 is 4,000.00; line 12 is 0; line 13 is 2,000.00; line 14 is 500; line 15 is
  1,000.00; line 18 is 20,000.00; so line 19 is 4,000.00 + 0 + 2,000.00 + 500 + 1,000.00 + 20,000.00
  = 27,500.00 and line 20 is 31,000.00 - 27,500.00 = 3,500.00. Part 3 line 24 is 3,500.00, line 25
  is 10,000.00 + 4,000.00 + 3,500.00 = 17,500.00, line 26 is 80,000.00 - 17,500.00 = 62,500.00; the
  lesser of line 7 (130,000.00) and line 26 is 62,500.00 and the filer claims 60,500. Part 4: line
  33 is 4,000.00 and line 34 is 3,500.00, so line 35 is 7,500.00 and line 36 is the lesser of line 30
  (19,500.00) and line 35: 7,500.00; line 41 is 4,000.00 and line 42 is 7,500.00 - 4,000.00 =
  3,500.00. The shared fact (the 1,000) is entered once and Form T936 Part 2 line 10 reads the same
  amount. The Schedule 8 Part 5 contributions on the partnership income are not completed (the form
  makes Part 5 the filer's choice), so line 22200 is unchanged.
sources:
  - >-
    CRA, Form T2048, "Capital Gains Deduction for Qualifying Business Transfers or Qualifying
    Cooperative Conversions", 2025 edition (docs/cra-forms-2025/t2048-25e.pdf, confirmed from the
    PDF; no .txt is published; https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2048/
    t2048-25e.pdf), Chart A, line 13 "Net income from limited or non-active partnership (line 12200)
    other than taxable capital gains"; line 19 "Investment income: add lines 11 to 15, and line 18";
    line 20 "Line 10 minus line 19 (if negative enter "0")".
  - >-
    CRA, Form T936 (2025), "Calculation of Cumulative Net Investment Loss (CNIL) to December 31,
    2025" (docs/cra-forms-2025/t936-25e.pdf), Part 2 line 10 "Net income from limited or non-active
    partnership (line 12200) other than taxable capital gains".
