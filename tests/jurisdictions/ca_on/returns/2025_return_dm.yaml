# Return DM: T1 line 31400 when the filer elects to split pension income. The same filer as
# Return DG (employment income, a pension, the volunteer firefighters' amount, the home buyers'
# amount, home accessibility expenses, one adoption and student loan interest), who is the
# transferring spouse of a joint election to split the pension with a spouse or common-law
# partner, so line 31400 is the amount of Form T1032 and the elected amount is deducted on line
# 21000. The form ca/t1032 computes it, and every figure below is worked by hand from the form
# text and from Return DG's figures.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  Return DM: Return DG with an election to split pension income. Employment income is $100,000
  (T1 line 10100, a chosen figure) and other pension income is $20,000 (T1 line 11500, a chosen
  figure). The Federal Worksheet for line 31400 gives 2,000.00 (line 8 is 20,000.00, the lesser of
  that and $2,000), as in Return DG. The filer is the transferring spouse (a chosen count of 1) of
  a joint election of $2,000 (a chosen figure), entered on line 21000. Form T1032: line 1 is the
  20,000.00 of line 8 of the worksheet, lines 2 and 4 to 8 are 0 (no box 128, no RCA payment), line
  17 is 20,000.00, line 19 is line 17 (no change of marital status), line 21 is 20,000.00 x 50% =
  10,000.00 and line 22, the 2,000.00 elected, is not more than line 21. Line 29 is 0 (line 8 is 0),
  line 30 is 2,000.00 - 0 = 2,000.00 and line 31 is 20,000.00 - 2,000.00 = 18,000.00, so line
  31400 is the lesser of $2,000 and 18,000.00, 2,000.00, the same as the worksheet, and the federal
  total of credit amounts (line 33500) is Return DG's 68,633.58. At 14.5% that is 9,951.87, the
  top-up tax credit is 56.32 and the non-refundable tax credits are 10,008.19, all as in Return DG.
  The election lowers net income and taxable income by the 2,000.00 deducted on line 21000, from
  118,926.00 to 116,926.00. The federal tax on 116,926.00 is 14.5% x 57,375 + 20.5% x (114,750 -
  57,375) + 26% x (116,926 - 114,750) = 8,319.38 + 11,761.88 + 565.76 = 20,647.01 (Return DG's
  21,167.01 less 26% x 2,000 = 520.00), so the federal tax after credits is 20,647.01 - 10,008.19 =
  10,638.82. The Ontario credit amounts (ON428 line 58800) are as in Return DG, with the pension
  income amount 1,762.00 (line 58360, the lesser of 1,762 and the 2,000.00 on line 31400), so the
  Ontario credit is Return DG's 1,390.90. The Ontario tax on 116,926.00 is Return DG's 8,977.74
  less 11.16% x 2,000 = 223.20, 8,754.54, less 1,390.90 is 7,363.64 on
  ontario_tax_less_dividend_credit. The Ontario surtax is 20% x (7,363.64 - 5,710) + 36% x
  (7,363.64 - 7,307) = 330.73 + 20.39 = 351.12, so ontario_tax is 7,363.64 + 351.12 + 750.00 (the
  Ontario health premium, as in Return DG) = 8,464.76, and the balance owing is 10,638.82 + 8,464.76
  = 19,103.58. No income tax was deducted, so form T1032 lines 37 and 40 are 0, line 39 is 0 and
  T1 line 43700 is 0.
sources:
  - >-
    CRA, Federal Worksheet 2025, Line 31400 (https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-d1/5000-d1-25e.txt,
    confirmed text, docs/cra-forms-2025/5000-d1-25e.txt): "Enter on line 31400 of your return
    whichever amount is less: line 8 or $2,000. However, if you are electing to split your
    eligible pension with your spouse or common-law partner, complete Form T1032, Joint Election
    to Split Pension Income, to calculate the amount to enter on line 31400 of your return
    instead."
