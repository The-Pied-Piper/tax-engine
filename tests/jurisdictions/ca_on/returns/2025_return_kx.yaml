# Return KX: Guide T4002's Cathy (convention expenses for business and professional, printed page 58),
# a single Ontario resident whose only income is the net business income of one business reported on
# one Form T2125 for a full fiscal period (0 days entered). Cathy attended a two-day convention in May
# 2025 that cost her $600 and whose organizer did not say what part was for food and entertainment.
# The guide: her convention expense is "$600 - ($50 x 2) = $500", and "Cathy can also claim the $50
# for meal and entertainment expense for two days at the 50% limit": 50% of 2 x $50 = $50.
#
# CRA's printed figures are the $500 convention expense (entered on line 9270 "Other expenses", where
# the guide lists convention expenses) and the $50 meal and entertainment claim (line 8523, which the
# form takes as the allowable amount: Guide, "the maximum amount you can claim ... is 50%"). The
# total expenses (line 9368) are $550.00. The guide prints no sales figure: the gross sales of $20,000
# (line 8299) are a chosen one, so the net business income (line 9946, T1 line 13500) is $19,450.00,
# the engine's figure from those.
#
# Schedule 8 Part 4 ("Complete this part if you are reporting only self-employment income") is completed (ca/cpp_part_4_completed 1), as the form directs for a return whose only income is self-employment, so lines 42100, 22200 and 31000 are computed; the CPP-dependent lines of the return are the engine's, not CRA's.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025 whose only income is the net business income of one sole proprietorship
  reported on one Form T2125 for a full fiscal period (0 days entered): chosen gross sales of $20,000
  (line 8299), other expenses of $500 (line 9270, Guide T4002's Cathy: the $600 convention fee less $50
  for each of two days) and meals and entertainment of $50 (line 8523, the $50 x 2 days at the 50% limit),
  so the total expenses (line 9368) are $550.00 and the net business income (line 9946, T1 line 13500)
  is $19,450.00.
sources:
  - >-
    CRA, Guide T4002 (2025), Self-employed Business, Professional, Commission, Farming, and Fishing Income
    (docs/cra-forms-2025/t4002-25e.pdf, confirmed from the PDF with pdftotext -layout), printed page 58,
    "Convention expenses for business and professional", the example of Cathy: "Cathy attended a two-day
    convention in May 2025 that cost her $600. The organizer did not indicate what part of the $600 fee
    was for food and entertainment. Her convention expense is $600 minus the two days at $50 each $600
    – ($50 × 2) = $500. Cathy can also claim the $50 for meal and entertainment expense for two days at
    the 50% limit."; the rule: "subtract $50 from the total convention fee for each day the organizer
    provides food, beverages, or entertainment. You can deduct this daily $50 amount as a meal and entertainment
    expense. The 50% limit applies to the daily $50 amount."
  - >-
    CRA, Guide T4002 (2025), Self-employed Business, Professional, Commission, Farming, and Fishing Income
    (docs/cra-forms-2025/t4002-25e.pdf, confirmed from the PDF with pdftotext -layout), printed pages
    56 and 57, "Line 8523 – Meals and entertainment": "The maximum amount you can claim for food, beverages,
    and entertainment expenses is 50% of the lesser of the following amounts: the amount incurred for
    these expenses; an amount that is reasonable in the circumstances"; and "Line 9790 or 9270 – Other
    expenses": "For business and professional expenses, use line 9270 on Form T2125."
