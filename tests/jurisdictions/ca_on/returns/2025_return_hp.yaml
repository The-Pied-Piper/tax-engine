# Return HP: Return CI's rental landlord and Return EE's employee, in one return, each with a Class
# 10.1 passenger vehicle bought in 2025 at exactly the limit with tax: the rental vehicle in Form
# T776 Area A (the check of ca/cca_vehicle_additions_checks) and the employment vehicle in Form T777
# Part B. Each cost of additions is accepted at $42,940.00 ($38,000 plus 13 percent) and is not
# refused. Only the rental income reaches T1 (the T777 schedule is not yet read by T1).
jurisdiction: CA-ON
tax_year: 2025
description: >-
  Return HP: a 2025 Ontario resident all year with two passenger vehicles bought in 2025,
  one used in a rental (Form T776 Area A) and one for employment (Form T777 Part B), and no
  other income. The rental income is Return CI's rental statement with chosen figures: gross
  rents for all units of $24,000.00 (line 8141) and total expenses of $17,559.00 (a chosen
  figure, all in repairs and maintenance, with no personal or short-term portion), so line 1
  is $17,559.00 and the net income before the capital cost allowance (line 9369, amount 5)
  is $6,441.00. Area A has one Class 10.1 row: a vehicle bought in 2025 for $39,000.00
  before tax (its cost, a chosen figure) with additions in column 3 of $42,940.00, the limit
  for 2025 with tax: $38,000 plus 13 percent (the 13 percent is a chosen figure of the GST
  and PST rate). The additions are at the limit, so the check accepts them. Half-year rule:
  42,940.00 x 1/2 x 30% = $6,441.00, claimed in full (column 23 and line 9936), so column 24
  is 42,940.00 - 6,441.00 = $36,499.00. The claim is the whole of the net income before it,
  so line 9946 and T1 line 12600 are $0.00, and total income is $0.00, as in Return HM. Form
  T777 Part B has one Class 10.1 vehicle bought in 2025 (no UCC at the start; its cost before tax,
  39,000.00, is a chosen figure above the 38,000 minimum for 2025, which no line reads), with
  additions in column 3 of $42,940.00 (a chosen figure, the same as the rental vehicle's, at
  the same 13 percent rate): column 5 is 1/2 of the additions, $21,470.00, column 7 is 30%
  of it, $6,441.00, and column 8 is $36,499.00. Line 25 is the Part B total, $6,441.00; Part
  A has no row (not triggered). T1 does not yet read the T777 schedule (line 22900 is a
  later change), so the T1 lines are those of the rental income alone.
sources:
  - >-
    CRA, Guide T4036 2025 (the guide T776 points to), "Class 10.1 (30%)": "The capital cost
    limits of a Class 10.1 passenger vehicle are the following prescribed amounts: ... $38,000 for
    vehicles acquired in 2025, plus the GST/HST or PST."
    (docs/cra-forms-2025/t4036-25e.pdf)
  - >-
    CRA, Guide T4044 2025, Class 10.1 (docs/cra-forms-2025/t4044-25e.txt): "The maximum CCA rate
    for this class is 30%"; "The maximum capital cost of each vehicle that may be included in Class
    10.1 is now $38,000 plus GST and PST, or HST."
  - >-
    CRA, Form T776 (2025), Statement of Real Estate Rentals (docs/cra-forms-2025/t776-25e.txt):
    Part 3, "Line 8141: Total of all your gross rents in the year you receive them (add lines under
    "Gross rents for all units")."; Part 4, "Line 9946: Your net income (loss)", amount 6 on
    line 12600 of the return.
    (https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t776/t776-25e.txt)
  - >-
    CRA, Form T777 (2025), Statement of Employment Expenses, Part B (pages 4 and 5, notes (11) and
    (12)): note (11) "If you owned the vehicle in the previous year and still owned it at the end of
    the current year, enter the amount from column 2 in column 5."; note (12) "Recapture and
    terminal loss rules do not apply."
    (https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t777/t777-25e.pdf)
