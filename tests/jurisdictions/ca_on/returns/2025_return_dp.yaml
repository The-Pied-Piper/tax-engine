# Return DP: the Ontario and Manitoba farm credit of Form T2043 (Return of Fuel Charge Proceeds to
# Farmers Tax Credit), Parts 1, 2 and 5 with Chart A, for two farming businesses in two designated
# provinces, each on its own Form T2042 statement: an Ontario farm and a Manitoba farm, each with
# a fiscal period from July 1, 2024 to June 30, 2025 (365 days, 184 of them in 2024). Each farm
# has no inventory adjustment, no non-arm's length expense and no partner. Its wheat income is
# above its seeds and plants expense, so the Ontario farm nets 60,000 and the Manitoba farm 30,000
# (90,000 in all). The net income keeps the regular federal and Ontario tax above the credits.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  Return DP: a 2025 Ontario resident in Canada throughout 2025, aged 18 or older, with no
  employment income and no other income (every line not named here is 0). Two farming
  businesses, each reported on one Form T2042 (a chosen set): an Ontario farm with wheat income
  of 96,500 (line 9371) and seeds and plants of 36,500 (line 9664), so the total farm expenses
  (line 9898) are 36,500.00 and net farming income (line 9946) is 60,000.00; and a Manitoba farm
  with wheat income of 48,250 and seeds and plants of 18,250, so line 9898 is 18,250.00 and net
  farming income is 30,000.00. The two net farming incomes total 90,000.00 (no other income, so
  the federal and Ontario tax exceed the credits). Each fiscal period runs from July 1, 2024 to
  June 30, 2025, which is 365 days (entered as 365), of which 184 fall in 2024 (a chosen figure:
  the days in 2024).
  Chart A of each statement: amount 5 is 0.00, so amount 6 (gross farming expenses, line 9898
  less amount 5) is 36,500.00 for Ontario and 18,250.00 for Manitoba; amount 7 is 184 divided
  by 365, and amount 8 is 36,500.00 times 184/365, which is 18,400.00 for Ontario and 9,200.00
  for Manitoba. Each statement is entered with its designated province code (1 for Ontario,
  2 for Manitoba), and each statement's non-arm's length expenses are 0. Part 1 line 67061 is
  the total of amount 6, 54,750.00, which is 25,000 or more, so the business is eligible.
  Part 2: Ontario's 18,400.00 at the 0.229% payment rate is 42.136, which rounds half-up to 42.14
  (2A); Manitoba's 9,200.00 at 0.229% is 21.068, which rounds to 21.07 (2B); the other six
  provinces are 0.00; so 2I is 63.21. Part 5: 5A is 2I, 63.21, because line 67061 reaches the
  threshold; 5B is 0.00 (Part 4 is not in this return); no partnership credit is allocated
  (lines 67079 to 67082 and 67103 to 67106 are 0, so 5C is 0.00); and 5D, the total credit for
  all businesses that is line 47556, is 63.21. The credit is not refunded here: the 2025 federal
  tax after credits (12,668.80) and Ontario tax (5,422.95) plus the 750.00 health premium exceed
  the 63.21 and no tax was withheld, so the refund is 0.00 and no alternative minimum tax carryover
  arises (Part 5 line 11 is 0).
sources:
  - >-
    CRA, Form T2043 (2025), Return of Fuel Charge Proceeds to Farmers Tax Credit
    (docs/cra-forms-2025/t2043-25e.pdf, a PDF quote confirmed 2026-10-24;
    https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2043/t2043-25e.pdf), page 1: "Fill
    in parts 1, 2 and 5 if you have: one farming business with one or more permanent
    establishments in only one designated province; multiple farming businesses, each of which
    has one or more permanent establishments in the same designated province; multiple farming
    businesses, where, for example, one business has one or more permanent establishments in
    only one designated province and another business has one or more permanent establishments in
    a different designated province".
  - >-
    CRA, Form T2043 (2025), Part 1, Note 1: "If your total gross farming expenses for all
    businesses are $25,000 or more, you are eligible to claim the credit." Chart A, amount 7:
    "Total number of days in the fiscal period that fall within the 2024 calendar year divided by
    the total number of days in the fiscal period (if the fiscal period starts and ends in 2025,
    enter "0")"; amount 8: "Amount 6 multiplied by amount 7."
  - >-
    CRA, Form T2043 (2025), Part 2: "Add all farming expenses in ON from amount 8 of Chart A."
    "ON 67063 × ON payment rate 0.229% = 2A"; "Total: Add amounts 2A to 2H (enter this total at
    amount 5A)" (2I).
  - >-
    CRA, Form T2043 (2025), Part 5: "Enter amount 2I" (5A); "Total credit for all businesses:
    Amount 5A plus amount 5B plus amount 5C (enter this amount on line 47556 of your income tax
    and benefit return)." (5D).
  - >-
    CRA, Form T2042 (2025), Statement of Farming Activities, line 9898 "Total farm expenses:
    Amount 4B plus line 9936" (the total of Form T2043 Chart A amount 1).
