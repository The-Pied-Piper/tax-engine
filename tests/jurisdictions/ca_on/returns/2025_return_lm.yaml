    - {}
  ca/cpp_t4_base_and_first_additional_contributions: "208.25"
  ca/cpp_t4_second_additional_contributions: "0.00"
  ca/resident_in_canada_throughout_2025: "1"
  ca/aged_18_or_older_at_end_of_2025: "1"
  ca/t777_relocations:
    - ca/t777_relocation_carried_forward: "1500"
      ca/t777_relocation_transportation: "0"
      ca/t777_relocation_meals: "100"
      ca/t777_relocation_lodging: "650"
      ca/t777_relocation_tradesperson_income: "7000"
      ca/t777_relocation_claim: "2250"
