# Return LH: Guide T4044, Employees earning commission income example (video equipment
# salesperson), claimed as a salaried employee. Amounts are quoted decimal strings.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  Return LH: Guide T4044 (2025), "Employees earning commission income", Example: a salesperson for a
  company that sells video equipment with salary of $45,000 and commissions of $5,000 (employment
  income $50,000) and expenses of advertising and promotion $1,000, travelling expenses $6,000,
  capital cost allowance $1,500 and interest on the car loan $500 (total $9,000). The Guide gives
  two claims: as a commission employee, $5,000 plus the CCA of $1,500 and the interest of $500, a
  total claim of $7,000; or as a salaried employee, the travelling expenses of $6,000 plus the CCA
  of $1,500 and the interest of $500, a total claim of $8,000. This return pins the salaried claim
  of $8,000, the larger one. The Guide says travelling expenses (food, lodging and transportation)
  are not motor vehicle expenses and that deductible transportation expenses go on the "Other
  expenses" line of the T777, so the $6,000 of travelling is entered on line 8 (the Guide does not
  say which kind it is). The CCA of $1,500 is the claim on one Part B vehicle (the class, 10.1, and
  a UCC at the start of 10,000 are chosen, as are the date acquired 2024 and the cost 37,000.01, just above the 37,000 Class 10.1 minimum for 2024 of Guide T4044, which no line reads: 30% of it is 3,000, above the claim) and the interest of
  $500 is line 26, both on the vehicle chart with all kilometres driven for employment (10,000 of
  10,000, so line 20 is 1, chosen). The car is a passenger vehicle (Class 10.1), so the Guide's interest
  chart applies: its days are a chosen 365, so line B is $3,650, above the $500 paid, and line 26 is
  the $500 (the Guide gives no days). Line 29 is 1,500 + 500 = 2,000, line 3 is 2,000, line 8 is
  6,000, line 15 is 8,000.00 and T777 line 17 and T1 line 22900 are 8,000.00, the Guide's total
  claim of $8,000. Not pinned: the commission-employee claim of $7,000, because the engine has no
  step that limits the claim to the commissions received (ticket filed). Every other line is the
  engine's figure.
sources:
  - >-
    CRA, Guide T4044 (2025), Employment Expenses (docs/cra-forms-2025/t4044-25e.txt;
    https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t4044/t4044-25e.txt), "Employees earning
    commission income", Example: "Your total expenses of $9,000 are more than your commissions of
    $5,000. Therefore, your claim for expenses is limited to $5,000 plus the CCA of $1,500 and
    interest of $500, for a total claim of $7,000. However, you could choose to claim expenses as a
    salaried employee, in which case you could claim the travelling expenses of $6,000, but not the
    advertising and promotion expenses. Using this method, you can also claim the CCA of $1,500 and
    interest of $500, for a total claim of $8,000."
  - >-
    CRA, Form T777 (2025), Statement of Employment Expenses (docs/cra-forms-2025/t777-25e.pdf, the
    only published copy; https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t777/t777-25e.pdf):
    line 3 "Allowable motor vehicle expenses (see chart for line 3 below)"; "Add lines 1 to 14. =
    15"; "Line 15 plus line 16. Enter this amount on line 22900 of your return. Total expenses =
    17".
