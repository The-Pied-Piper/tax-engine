jurisdiction: CA-ON
tax_year: 2025
description: >-
  Return MA: Return CA's filer, with $1,000,000 more of other income (T1 line 13000, a chosen
  figure, $1,040,000 in all, standing in for the stock option benefit; $40,000 of it is still all the
  split income of Form T1206 line 3, all from foreign sources, line 68370) and a claim of $1,000,000 for the security options deduction (T4 boxes 39 and 91,
  T1 line 24900, a chosen figure), so that minimum tax is payable and the
  line 41700 of the return is the figure of Form T691 Part 6 line 14, not the plain federal tax. It
  pins the reading of Form T1206 Part 2 lines 25 to 27 under minimum tax. The
  regular federal tax (line 40600 less line 41600, the federal tax less credits of the return) is
  $2,016.42. T691 Part 5 line 11 is positive and Part 6 line 12 (line 8 plus line 11, which is 0 for this
  filer) is more than T1206 line 24, $5,330.85, so line 14 and line 41700 are
  $155,940.57, and $153,924.15 of minimum tax is carried forward (T691 Part 7 line 14, the minimum amount of $169,222.68 less the $15,298.53 of line 13).
  T1206 line 27 is that line 41700 (T1206 lines 25 to 27 are printed as the return's line 41700,
  "Line 134 minus line 138 (if negative, enter "0")", and Form T691 Part 6 line 14 says "Enter this
  amount on line 41700 of your return"), so line 29 is $155,940.57 + $0.00 (line 41500), line 30
  is the more of line 24 and line 29, $155,940.57, and the net federal tax (line 42000) is
  $155,940.57. Read literally as $2,016.42 (line 40600 less line 41600), line 29 would be
  $2,016.42, line 30 line 24, $5,330.85, and the net federal tax $5,330.85, $150,609.72 less:
  the minimum tax would disappear for a filer who has tax on split income, which is not what
  Form T691 Part 6 says. The total payable is $155,940.57 + the Ontario tax; the balance owing
  is $220,421.66. Return CA's other lines are as the engine computes them from these inputs and
  are listed below, checked to the cent. Amounts are quoted decimal strings, never floats; counts
  are quoted digit strings. A line or input this return leaves out is blank, 0, and is checked to
  compute to 0.
sources:
  - >-
    CRA, Form T1206 "Tax on Split Income" 2025 (docs/cra-forms-2025/t1206-25e.pdf, page 8, Part 2
    lines 25 to 27, confirmed 2026-10-25 from the PDF; no .txt published): "Amount from line 40600
    of your return" (25), "Amount from line 41600 of your return" (26), "Line 25 minus line 26 (if
    negative, enter "0")" (27), "Amount from line 41500 of your return" (28), "Line 27 plus line
    28" (29), "Enter whichever is more: the amount from line 24 or line 29." (30).
  - >-
    CRA, T1 General 2025 (docs/cra-forms-2025/5006-r-25e.txt line 660), line 139 and line 41700:
    "Line 134 minus line 138 (if negative, enter "0")"; Guide 5000-G (5000-g-25e.txt line 3730):
    "complete Form T691, Alternative Minimum Tax, and enter the result on line 41700 of your
    return"; and Form T691 "Alternative Minimum Tax" 2025 (docs/cra-forms-2025/t691-25e.pdf, page 8, Part 6 line
    14): "Enter whichever is more: amount from line 12 or line 13. Enter this amount on line 41700
    of your return." Line 13 is "Amount from line 24 of Form T1206".
