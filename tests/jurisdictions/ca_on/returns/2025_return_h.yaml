# Return H: a single retiree, a 2025 Ontario resident, with no employment income and income
# only from the Step 2 lines that are not employment or capital gains: Old Age Security
# (OAS) of $8,000, CPP benefits of $9,000, other pensions of $20,000, RRSP income of $5,000,
# workers' compensation of $2,000 and interest and other investment income of $1,400 (the
# Federal Worksheet's T5 slips of $1,200 and bank interest with no slip of $300, less $100
# reported in an earlier year). Computed from the income lines to total income: the Federal
# Worksheet's line 9, the eight sources of line 12100 added, and its line 11, that less the
# part reported in previous years, to the interest and other investment income (T1 line
# 12100); lines 14400, 14500 and 14600 added to line 14700; and, in line order, employment
# income (line 10100), the other employment income, the pension and benefit lines, the
# taxable dividends, the investment lines, the taxable capital gains, the taxable support
# payments, the RRSP, FHSA, other and scholarship income and line 14700 to total income
# (line 15000), $45,400. With no employment income there are no CPP contributions or EI
# premiums, no Canada employment amount, no LIFT credit and no working income, so no Canada
# workers benefit. Net income is below the $177,882 at which the basic personal amount
# starts to fall, so net income is $45,400.00; with no amount entered on line 14600, line
# 25000 (other payments deduction) is line 14700, $2,000, so taxable income is $43,400.00,
# in the lowest federal bracket and the first Ontario bracket; the Ontario health premium is $450 (the row for
# taxable income more than $38,500 but not more than $48,000); the Ontario tax reduction is
# zero, as twice its amounts are below the Ontario tax after the dividend credit. The filer
# receives Old Age Security, which starts at 65, so is taken as born in 1960 or earlier (to
# be confirmed): the age amount (T1 line 30100) is claimed once and, as net income of
# $45,400.00 is at or below the $45,522 income threshold of the Federal Worksheet, it is the
# whole maximum, $9,028.00. ON428 line 58080 (the Ontario age amount, from Worksheet ON428)
# is claimed once as well and, as that net income is at or below the $46,330 income
# threshold of Worksheet ON428, it is the whole maximum, $6,223.00. The spouse or
# common-law partner amount (line 30300), the Canada caregiver amount for a spouse (line
# 30425) and ON428's spouse amount (line 58120) are $0, as there is no spouse. There is no
# capital gain, unused or new RRSP contribution, union dues, child care expense or
# dependant. The pension income amount (line 31400) is computed from the $20,000 of line 11500,
# see the Federal Worksheet below. Not yet computed, so not in this file: the amounts transferred
# and the credits that follow from the pension and benefit lines, the social benefits repayment, and any deduction from net income other than line
# 25000. Line 82 of ON428 is not triggered by this return, and
# the qualifying donations for line 87 (the community food program donation tax credit for
# farmers) are a chosen $0, so line 87 is $0 and line 88 is line 86. Schedule 9's inputs are
# all a chosen $0, so lines 116 (34900) and 117 (34990) are $0 and line 35000 is line 33800.
# Amounts are quoted decimal strings, never floats; counts are quoted digit strings. Every
# output the CA-ON manifest declares must appear under `expected`; intermediate lines may be
# listed and are then checked too.
# Ontario political contributions (ON479 line 15, line 63100) are a chosen $0, so Worksheet
# ON479's line 16 is $0 (column 1 applies).
# Federal political contributions (T1 line 135 and line 40900) are a chosen $0, so the Federal
# Worksheet's line 41000 is $0 (column 1 applies).
# The Ontario seniors care at home tax credit (ON479 line 13, line 63095) is not claimed (a
# chosen count of 0), so ON479 line 13 is $0.
# The refundable medical expense supplement (T1 line 154 and line 45200, Federal Worksheet)
# takes chosen inputs: the counts of residence in Canada throughout 2025 and of age 18 or
# older at the end of 2025 are 1 and its other new amounts (line 21500, lines 22900 and
# 23100, the net self-employment lines, the wage-loss replacement plan amounts and the
# spouse's column) are $0. The working income is $0 (employment income less lines 20700,
# 21200, 22900 and 23100; under the $4,390 the line asks for); line 6, the adjusted family
# net income, is the net income, $45,400.00 (column 1 alone, as the spouse's column is 0 and line 23500 is 0, the chart not applying); line 8 is line 6 less 33,294.00, $12,106.00; and line 16 and
# the supplement are $0, because line 9 (line 21500, a chosen $0) and line 10 (line 33200,
# $0 with no medical expenses) are 0.
# Form ON-BEN (lines 61020 to 61230) is not applied for (a chosen 0 for each tick box and a
# chosen $0 for each Part A amount), so its ten lines are carried as entered, all 0.
# Rental income (T1 line 13, Form T776 Parts 3 and 4) is a chosen $0: no rental properties
# and no Chart A rows, and every expense box and co-owner and partner figure $0, so T1 lines
# 12599 and 12600 are $0.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single retiree, an Ontario resident for all of 2025, with no spouse or common-law
  partner at any time in 2025 and no dependant, with no employment income (T1 line 10100)
  and the following other 2025 income. OAS pension (line 11300, box 18 of the T4A(OAS) slip)
  of $8,000, CPP or QPP benefits (line 11400, box 20 of the T4A(P) slip) of $9,000, other
  pensions and superannuation (line 11500) of $20,000, RRSP income (line 12900, from all
  T4RSP slips) of $5,000 and workers' compensation benefits (line 14400, box 10 of the T5007
  slip) of $2,000, each a chosen figure; no other employment income (line 10400), elected
  split-pension amount (line 11600), UCCB (line 11700), EI benefits (line 11900), net
  partnership income (line 12200), RDSP income (line 12500), capital gain (so taxable
  capital gains, line 12700, of $0), taxable support payments (line 12800), FHSA income
  (lines 12905 and 12906), other income (line 13000), scholarships (line 13010), social
  assistance payments (line 14500) or net federal supplements (line 14600). Interest and
  other investment income (line 12100) is computed by the Federal Worksheet: line 2 (boxes
  13, 14, 15 and 30 of all T5 slips) is a chosen $1,200 and line 7 (interest earned from
  bank accounts and similar investments not reported on any information slip) a chosen $300,
  the rest of lines 1 to 8 being $0, so line 9 is 1,200 + 300 = 1,500; line 10 (income
  included on line 9 and reported in previous years) is a chosen $100; line 11, the amount
  for line 12100, is 1,500 - 100 = 1,400. Lines 14400, 14500 and 14600 add to line 14700:
  2,000 + 0 + 0 = 2,000. Total income (line 15000) is the sum of the income lines in line
  order, line 13 being the net rental income: 0 + 0 + 8,000 + 9,000 + 20,000 + 0 + 0 + 0 + 0
  + 1,400 + 0 + 0 + 0 + 0 + 0 + 5,000 + 0 + 0 + 0 + 0 + 2,000 = 45,400. With no employment
  income there are no CPP contributions (Schedule 8, base
  0, first and second additional 0, so the enhanced contributions, line 22215, are 0) and no
  EI premiums (line 31200: 0). No unused or new RRSP contributions, so the most that may be
  deducted (Schedule 7 line 17) is $0, the lesser of the contributions available to deduct
  (line 10) of $0 and a chosen deduction limit of $0 (line 11); the amount deducted (line
  18) is $0, so the RRSP deduction (line 20800) is $0 and the unused contributions carried
  forward (line 23) are $0; no union dues (line 21200) and no child care expenses (line
  21400), the T778 limits and earned income all being $0. Total deductions (line 23300) are
  $0 and net income (line 23600) is $45,400.00. No amount was entered on line 14600, so the
  other payments deduction (line 25000) is line 14700, $2,000; there is no other deduction
  from net income, so line 25700 is $2,000 and taxable income (line 26000) is $45,400.00 -
  $2,000.00 = $43,400.00. The non-refundable credit amounts are the basic personal amount (federal line 30000 $16,129,
  since net income is $177,882 or less; Ontario ON428 line 58040 $12,747) and, on the T1,
  the age amount (line 30100) of $9,028.00: the Federal Worksheet's line 4, the net income
  of $45,400.00 less the line 3 income threshold of $45,522.00, is negative, so $0.00, line
  6, that at the line 5 rate of 15%, is $0.00, and line 1 $9,028.00 less it is line 7, so
  line 30100 is $9,028.00, claimed once for the filer born in 1960 or earlier (the count is
  1, taken from the OAS received, to be confirmed). There is no spouse amount (line 30300:
  $16,129.00 for 0 spouse amounts claimed), no Canada caregiver amount for a spouse (line
  30425: $8,601.00 for 0 spouses eligible, and the spouse's net income entered is $0), no
  eligible dependant (lines 30400 and 58160: 0), no infirm children (line 30500: 0), no base
  CPP contributions or EI premiums and a Canada employment amount (line 31260) of $0, the
  lesser of $1,471 and employment income: line 33500 of $27,157.00 (the $25,157.00 of the other amounts plus the pension income amount
  of $2,000.00, line 31400) and ON428 line 58800 of
  $20,732.00, which includes the Ontario age amount (line 58080, from Worksheet ON428): line
  4, the net income of $45,400.00 less the line 3 income threshold of $46,330.00, is
  negative, so $0.00, line 6, that at the line 5 rate of 15%, is $0.00, and line 1 $6,223.00
  less it is line 7, so line 58080 is $6,223.00, claimed once for the filer born in 1960 or
  earlier; ON428 line 58120, the spouse or common-law partner amount, is 0 (the line 11 base
  of $11,905.00 less the spouse's net income of $0, at most $10,823.00, for 0 spouse amounts
  claimed); and the Ontario pension income amount (ON428 line 27, line 58360), the lesser of
  $1,762 and the $2,000.00 of line 31400, $1,762.00. There are no adoption expenses (line
  58330) and no student loan interest (line 58520), so each is $0. At 14.5% federally (line 33800) and 5.05% for Ontario (ON428 line 58840), each
  product rounded half-up to the cent is its form's non-refundable tax credits: federal
  $3,937.77 (line 35000) and Ontario $1,046.97 (ON428 line 61500), each taken off its form's
  basic tax ($6,293.00 federally, $2,191.70 for Ontario), not below zero: $2,355.23 and
  $1,144.73. The Ontario surtax (ON428 line 68) is $0, as the Ontario tax after credits is
  below $5,710, so the Ontario tax with surtax (line 69) is that same $1,144.73. With no
  dividends, Worksheet ON428's lines A and B (lines 12000 and 12010) are $0, so the Ontario
  dividend tax credit (ON428 line 57, line 61520) and line 70 are $0, and the Ontario tax
  after the dividend credit (ON428 line 71, which is line 73) is that same $1,144.73. With
  no dependent child and no dependant, the Ontario tax reduction amounts (line 77) are the
  basic reduction of $294.00 (line 74), twice them, $588.00 (line 78), which is less than
  the Ontario tax after the dividend credit (line 79, from line 73, which is line 71 as line
  72 is not triggered), so the Ontario tax reduction (line 80) is $0 and the Ontario tax
  after the reduction (line 81) is $1,144.73. The LIFT credit (ON428 line 85, Schedule
  ON428-A) is 5.05% of employment income, $0, at most $875, less 5% of net income over
  $32,500, $645.00, not below zero: $0, so the Ontario tax after it (line 86) is that same
  $1,144.73. With chosen qualifying donations of $0, the community food program donation tax
  credit for farmers (ON428 line 87) is 25% x $0 = $0 and the Ontario tax after it (line 88)
  is that same $1,144.73. The Ontario health premium (ON428 line 89) is read from its chart
  on taxable income: $43,400.00 is more than $38,500 but not more than $48,000, so the
  premium is $450, and the Ontario tax (ON428 line 90) is the Ontario tax after the food
  credit plus the premium, $1,144.73 + $450 = $1,594.73. On the T1, the net federal tax
  (line 42000) is the federal tax after credits, $2,355.23, and the total payable (line
  43500) is it plus the Ontario tax (line 42800), $3,949.96. The Canada workers benefit
  (line 45300, Schedule 6) is $0: the working income, the employment income, is $0, not more
  than the $3,000 base, so 27% of it over $3,000 is $0 and so is the benefit before the
  reduction, whether the lesser of that and $1,633 (no eligible dependant) or $2,813
  applies; less 15% of the adjusted family net income, the net income, over $26,855 (no
  eligible dependant) or $30,639 (an eligible dependant), $2,781.75 or $2,214.15, not below
  zero: $0. The income tax deducted (line 43700) is a chosen $3,000, so the total credits
  (line 48200) are it plus the benefit, $3,000, and the refund or balance owing (line 167)
  is the total payable less the total credits, $949.96: positive, so a balance owing (line
  48500). Every amount computed from a rate, fraction, amount or chart on the forms is
  rounded half-up to the cent, each line being a dollars-and-cents box; here that changes
  the federal tax on taxable income, the Ontario tax on taxable income and both forms'
  non-refundable tax credits, and the lines that follow from them. The lines that only add,
  subtract, compare or choose take amounts already in cents, so the refund or balance owing
  is in cents too.
  No self-employment income: the net business, professional, commission, farming and fishing
  income (T1 lines 13500, 13700, 13900, 14100 and 14300) are $0, so their sum (line 27) is
  $0, and it is a $0 term of total income (line 15000). The CPP months (Schedule
  8 box A) are the 12 of a full year, Schedule 8 Part 4 is not completed (count 0) and there
  is no agreement with the Canada Employment Insurance Commission (count 0), so the CPP
  contributions payable (line 42100), the base CPP contributions (line 31000) and the
  deduction (line 22200) on self-employment income, and the EI premiums on it (lines 31217
  and 42120), are $0 and change no total.
