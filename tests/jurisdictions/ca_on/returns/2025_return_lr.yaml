# Return LR: a truck that is not a passenger vehicle, whose interest is above what Chart B would allow
# a passenger vehicle (chosen figures, not a CRA example). A single Ontario resident whose only
# income is the net business income of one business reported on one Form T2125 for a full fiscal
# period (0 days entered), with gross sales of $20,000 (line 8299) and one vehicle, a truck that is
# not a passenger vehicle: business kilometres 27,000, total kilometres 30,000, gasoline and oil
# $3,500, repairs and maintenance $500, insurance $1,000, interest on the loan to buy the truck
# $5,000, licence and registration $100; total vehicle expenses $10,100.
#
# Chart B is headed "Available interest expense for passenger vehicles and zero-emission passenger
# vehicles" and the guide says "When you use a passenger vehicle or a zero-emission passenger vehicle
# to earn income, there is a limit on the amount of interest you can deduct" (Guide T4002, printed
# page 54), so a filer using the form by hand should not fill in Chart B for the truck and should enter the
# whole $5,000 in Chart A amount 4. (For a passenger vehicle, Chart B would give the lesser of $5,000
# and $350 / 30 x 365 = $4,258.33.) Chart A: 27,000 / 30,000 x $10,100 = $9,090.00 on line 9281;
# the total expenses (line 9368) are $9,090.00 and the net business income (line 9946, T1 line
# 13500) is $10,910.00; the other expected lines are the engine's, computed from those.
#
# Schedule 8 Part 4 is completed (ca/cpp_part_4_completed 1), as in Return KU; the CPP-dependent
# lines of the return are the engine's, not CRA's.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025 whose only income is the net business income of one sole proprietorship
  reported on one Form T2125 for a full fiscal period (0 days entered): chosen gross sales of $20,000
  (line 8299) and one vehicle in Chart A, a truck that is not a passenger vehicle (business kilometres
  27,000 of 30,000 total, gasoline and oil $3,500, repairs and maintenance $500, insurance $1,000,
  interest $5,000 with no Chart B limit, licence and registration $100), so the allowable motor
  vehicle expenses (line 9281) are $9,090.00, the total expenses (line 9368) are $9,090.00 and the net
  business income (line 9946, T1 line 13500) is $10,910.00. No capital cost allowance is claimed.
sources:
  - >-
    CRA, Guide T4002 (2025), Self-employed Business, Professional, Commission, Farming, and Fishing Income
    (docs/cra-forms-2025/t4002-25e.pdf, confirmed from the PDF with pdftotext -layout), printed page 54:
    "When you use a passenger vehicle or a zero-emission passenger vehicle to earn income, there is a limit
    on the amount of interest you can deduct. To calculate the interest you can deduct, fill in "Chart B
    – Available interest expense for passenger vehicles and zero-emission passenger vehicles" of your form."
  - >-
    CRA, Form T2125 (2025), Statement of Business or Professional Activities (docs/cra-forms-2025/t2125-25e.pdf,
    confirmed from the PDF with pdftotext -layout), Chart A "Motor vehicle expenses": "Interest (use Chart
    B below)", "Business use part: amount 1 ÷ amount 2 × amount 12" and "Allowable motor vehicle expenses:
    Add amounts 13 to 15 (enter this total on line 9281 of Part 4)"; Chart B "Available interest expense for
    passenger vehicles and zero-emission passenger vehicles".
