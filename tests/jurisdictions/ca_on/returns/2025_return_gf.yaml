# Return GF: a single 2025 Ontario resident with employment income of $400,000 and other deductions
# of $500,000 (T1 line 23200), which are the resource expenditures of Form T691 Part 9 line 1 (for
# the alternative minimum tax). Net income before adjustments is negative (line 23400), so net
# income (line 23600) and taxable income (line 26000) are $0, while Form T691 Part 1 line 1 carries
# the signed figure (`ca/taxable_income_signed`) and the minimum tax starts from it.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  Return GF: a single 2025 Ontario resident with employment income of $400,000 and other
  deductions of $500,000 (T1 line 23200, a chosen figure), which are the resource expenditures of
  Form T691 Part 9 line 1 (a chosen figure, for the alternative minimum tax: they are included on
  line 23200 and Part 1 line 14 adds them back in full). The return has no security options: line
  24900 is the total of Form T691 lines 28, 29, 31, 35, 36 and 37, all $0, and a benefit large
  enough to give the minimum tax would have to be part of the income, which would then no longer
  be negative. The T4 CPP and EI
  figures are the maximum contributions and premiums, as $400,000 is above the maximum pensionable
  and insurable earnings: base and first additional $4,034.10, second additional $396.00 and EI
  $1,077.48. Total income is $400,000 and the deductions from total income are $506,074.00, the
  other deductions of $500,000, the child care expenses deduction of $5,000 and the CPP enhanced
  contributions of $1,074.00, so net income before adjustments (line 23400) is -$106,074.00.
  Net income (line 23600, "Line 54 minus line 55 (if negative, enter "0")") is $0, and so is
  taxable income (line 26000, "Line 57 minus line 68 (if negative, enter "0")"). Form T691 Part 1
  line 1, "Taxable income from line 26000 of your return (or the amount you would have entered on
  line 26000 if the instructions for lines 23600 and 26000 said "if negative, show in
  brackets")", is the signed -$106,074.00, and Part 1 line 12, "Add lines 1, 4, 7, and 11.", is
  -$106,074.00 as well, the other lines being $0. Part 1 line 14, "Resource property and
  flow-through shares from line 6 of Part 9", is $500,000 (Part 9 line 1 of $500,000 less lines 2
  to 4, each $0), so line 27 is -$106,074.00 + $500,000 = $393,926.00, line 33 and line 44 are the
  same, line 80 is 50% of the $6,074.00 of line 78 (the child care expenses of $5,000 on line 52
  and the enhanced CPP contributions of $1,074.00 on line 58), $3,037.00, and the adjusted taxable
  income (line 93) is $396,963.00. Line 95 is $396,963.00 less the basic exemption of $177,882.00,
  $219,081.00, line 97 is 20.5% of it, $44,911.61 ($44,911.605, half-up), line 102 is 50% of the
  $5,533.57 of line 33800, $2,766.79 (a tie, half-up), so the minimum amount (line 103) is
  $42,144.82. The basic federal tax is negative, so the regular net federal tax payable is $0 and
  Part 5 line 11 and Part 6 line 14 are $42,144.82, the net federal tax. The Ontario additional
  tax for minimum tax purposes (Worksheet ON428 line 1, 24.63% of $42,144.82) is $10,380.27;
  line 3 is the same and over $7,307, so line 4 is 20% x ($10,380.27 - $5,710) = $934.05, line 5
  is 36% x ($10,380.27 - $7,307) = $1,106.38 and line 6 is $2,040.43; with no Ontario tax (line 7
  is $0) line 8 is $2,040.43 and line 72 is $10,380.27 + $2,040.43 = $12,420.70, which is line 73
  (no tax reduction, as line 72 has an amount). The LIFT credit of $875 leaves $11,545.70, and
  with no health premium on a taxable income of $0 that is the Ontario tax. The total payable is
  $42,144.82 + $11,545.70 = $53,690.52 and the balance owing is that less the $14,163.00 of
  credits, $39,527.52. Every line that is not triggered is $0.
sources:
  - >-
    CRA, "CPP contribution rates, maximums and exemptions", 2025 row: maximum annual
    pensionable earnings $71,300; basic exemption $3,500; employee rate 5.95%; maximum
    annual employee contribution $4,034.10. CRA, "Second additional CPP contribution rates
    and maximums", 2025 row: additional maximum annual pensionable earnings $81,200;
    employee rate 4%; maximum $396. Employment income of 400,000 is above both ceilings, so
    the contributions are the maximums: base 3,356.10 and first additional 678.00 (4,034.10
    together) and second additional 396.00; the enhanced contributions deducted are 678.00 +
    396.00 = 1,074.00.
  - https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/payroll/payroll-deductions-contributions/canada-pension-plan-cpp/cpp-contribution-rates-maximums-exemptions.html
  - https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/payroll/calculating-deductions/making-deductions/second-additional-cpp-contribution-rates-maximums.html
  - >-
    CRA, "EI premium rates and maximums", 2025 federal row: maximum annual insurable
    earnings $65,700; rate 1.64%; maximum annual employee premium $1,077.48. Employment
    income of 400,000 is above the maximum insurable earnings, so the premiums are the
    maximum, 1,077.48.
  - https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/payroll/payroll-deductions-contributions/employment-insurance-ei/ei-premium-rates-maximums.html
  - >-
    CRA, Form T691 "Alternative Minimum Tax" (2025), docs/cra-forms-2025/t691-25e.pdf (no text
    file is published): Part 1 line 1 "Taxable income from line 26000 of your return (or the
    amount you would have entered on line 26000 if the instructions for lines 23600 and 26000
    said "if negative, show in brackets")"; line 12 "Add lines 1, 4, 7, and 11."; line 93 "Line
    83 minus line 92 (if negative, enter "0") Adjusted taxable income".
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t691/t691-25e.pdf
