# Return KG: T1 line 12599 "Gross", the total of Form T776 line 8299 over the statements. A duplex
# owned with a co-owner (the whole property's gross rents of 12,000, not the filer's share) and a
# sole-owner house (gross rents of 5,000 and other income of 200). Amounts are quoted decimal
# strings. Every figure is a chosen figure.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025 whose only income is rental income reported on two
  Form T776 statements. Statement 1 is a duplex owned with a co-owner: Guide T4036 "Line 8299 -
  Total gross rental income" says a co-owner enters "the gross rental income for the entire
  property on line 12599. Do not split the gross income according to your ownership share", so the
  gross rents of 12,000.00 (line 8141, two units) are entered as the whole property, expenses of
  4,000.00 (property taxes, line 9180) are entered as the whole property, line 9369 is 8,000.00
  and the filer's share of it (line 2, an input) is 4,000.00. Statement 2 is a sole-owner house
  with gross rents of 5,000.00 and other income of 200.00 (line 8230), so line 8299 is 5,200.00
  and the net income is 5,200.00. T1 line 12599 is 12,000.00 + 5,200.00 = 17,200.00 (the gross is
  not scaled by the share), and T1 line 12600 and the total income are 4,000.00 + 5,200.00 =
  9,200.00. Every figure is a chosen figure; every line of the return is asserted, the tax lines
  being the engine's figures.
sources:
  - >-
    CRA, Guide T4036 (2025), "Line 8299 - Total gross rental income" (docs/cra-
    forms-2025/t4036-25e.pdf, confirmed from the PDF with pdftotext -layout): "Your gross rental
    income is your total \"Gross rents for all units,\" on Form T776. Enter this amount on line
    12599 of your income tax return. If you are a co-owner of the rental property or a member of
    a partnership that does not need to provide you with a T5013 slip, enter the gross rental
    income for the entire property on line 12599. Do not split the gross income according to
    your ownership share."
  - >-
    CRA, Form T776 (2025), Statement of Real Estate Rentals (docs/cra-forms-2025/t776-25e.txt):
    "Line 8299: Total gross rental income: Enter this amount on your income tax and benefit
    return on line 12599 (line 8141 plus line 8230)"; "Line 2: Co-owners: calculate your share
    of net income from line 9369."; T1 (docs/cra-forms-2025/5006-r-25e.txt): "Line 12599:
    Gross".
