# Return FR: Chris, a 2025 Ontario resident whose only income is self-employment income of $3,000.00
# on five statements (one T2125 for each of business, professional and commission income, one
# T2042 and one T2121), claiming the disability supports deduction (T1 line 21500) on Form T929.
# The five statements are the five net self-employment lines of the form's line 4 (T929 net
# business, professional, commission, farming and fishing income) that no earlier return makes
# non-zero, and the expenses reimbursed (line 2) are non-zero. Every figure is derived in the
# description; the figures checked are the form's lines and the return's lines from total income
# to taxable income, and the tax lines are not checked in this file.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025, aged 26, a chosen figure (18 or older at the end of
  2025), resident in Canada throughout 2025, with no spouse or common-law partner and no
  dependants. Chris has no employment income and no other income. Chris files five statements,
  each a chosen $600.00 of sales with no expense (each statement's other lines are a chosen $0):
  one Form T2125 statement for business income (line code business, reported on T1 line 13500),
  one for professional income (line 13700), one for commission income (line 13900), one Form
  T2042 statement for farming income (wheat, line 9371, $600.00; reported on line 14100) and one
  Form T2121 statement for fishing income (fish products, amount 3A, $1,000.00, less salt, bait
  and ice, $400.00; reported on line 14300). Each statement's net income (line 9946) is its
  income less its expenses: $600.00, $600.00, $600.00, $600.00 and $1,000.00 - $400.00 =
  $600.00. Their sum, the net self-employment income (T1 line 27), is 5 x $600.00 = $3,000.00,
  which is all of total income (line 15000), as line 28 is line 21 ($0) plus line 27. The CPP
  months (Schedule 8 box A) are the 12 of a full year, and the self-employment total of
  $3,000.00 is below the $3,500 basic exemption, so the CPP contributions on it (lines 22200,
  31000 and 42100) are $0, there is no agreement for EI on self-employment income, and the EI
  premiums are $0. The disability supports paid are a chosen $5,000.00 (Form T929 line 1,
  column 2), with $1,000.00 reimbursed (line 2, column 3, a chosen figure), so line 3 is
  $5,000.00 - $1,000.00 = $4,000.00. Chris attended no designated educational institution (line
  8, a chosen 0 weeks). Form T929 Step 2 then gives: line 4, earned income, is the net
  self-employment income of each kind, a loss counting $0 and here each being a gain: $600.00
  of business, $600.00 of professional, $600.00 of commission, $600.00 of farming and $600.00 of
  fishing income, plus $0 for each other item (employment income, scholarships, net research
  grants, earnings supplements, Part II Employment Insurance Act support, income replacement
  support, Wage Earner Protection Program Act amounts and COVID-19 payments), $3,000.00. Line 5,
  the net income, is the amount line 23600 would be with no claim: total income of $3,000.00
  less deductions from total income (line 23300) of $0 (no CPP deduction, as above, and no
  RRSP, union dues or child care deduction), $3,000.00. Line 6 is line 4, $3,000.00, and line 7
  is $3,000.00 - $3,000.00 = $0.00. Line 8 is 0 weeks, so line 9 is 0 x $375 = $0.00. Line 10
  is the lesser of line 7, $0.00, and line 9, $0.00, $0.00. Line 11 is line 4 plus line 10:
  $3,000.00 + $0.00 = $3,000.00. Line 12 is the lesser of line 3, $4,000.00, and line 11,
  $3,000.00: $3,000.00, the disability supports deduction, entered on line 21500 of the T1. So
  the deductions from total income (line 23300) are $3,000.00, the net income before
  adjustments (line 23400) is $3,000.00 - $3,000.00 = $0.00, the net income (line 23600) is
  $0.00 less social benefits repayment (line 23500) of $0, and taxable income (line 26000) is
  $0.00. The CPP second additional maximum amount (Schedule 8 Part 2 line C, maximum $9,900) is
  $9,900.00 for 12 months. The alternative minimum tax (T691): the adjusted taxable income is
  the taxable income, $0.00, plus the disability supports deduction added back at the 50%
  applicable rate, $1,500.00, under the $177,882 basic exemption, so the minimum amount is $0.
  The federal tax of Part 2 line 1 is $0.00 on taxable income of $0.00, and the non-refundable
  tax credits (line 4) are the basic personal amount of $16,129.00 (net income of $0.00 is
  under $177,882) times 14.5%, $2,338.705, rounded half-up to the cent $2,338.71, so Part 2
  line 5 and line 7 are $0.00 - $2,338.71 = -$2,338.71, unfloored. Part 7 line 14 is line 1
  (the minimum amount, $0) minus line 13 (the -$2,338.71 of Part 2 line 7 with no investment tax
  credit recapture, foreign tax or logging credit): $0 - (-$2,338.71) = $2,338.71, positive, so
  the floor does not apply; with no earlier carryover (Part 8 line 13, $0) and no unapplied 2018
  carryover, the total carryover available for 2026 (line 17) is $2,338.71. The gross income
  lines are the sales on the statement of each kind: business $600.00 (T1 line 13499),
  professional $600.00 (line 13699) and commission $600.00 (line 13899).
sources:
  - >-
    CRA, Form T929 Disability Supports Deduction, 2024 edition, the latest CRA publishes (no
    2025 edition; docs/cra-forms-2025/t929-24e.pdf), "Use this form to calculate the amount
    to enter on line 21500 of your tax return."; Step 1 line 3, "Subtract line 2 from line
    1. This amount is your net disability supports expenses"; Step 2 line 4 "Enter your
    earned income", whose definition is the filer's employment income, the taxable part of
    scholarships, "net self-employment income, either alone or as an active partner (not
    including losses)", "net research grants", "any earnings supplement received under a
    project sponsored by a government in Canada to encourage employment", "any financial
    support received under a program sponsored under Part II of the Employment Insurance Act,
    or any similar program", "any financial support received under a program that provides
    income replacement benefits similar to those provided under the Employment Insurance
    Act", "any amounts received under the Wage Earner Protection Program Act in respect of
    wages" and "any federal, provincial or territorial government COVID-19 payments received
    in the year for which you have received a T4A or T4E"; line 5 "Enter your net income";
    line 6 "Enter your earned income from line 4"; line 7 "Line 5 minus line 6 (if negative,
    enter "0")"; line 8 "Enter the number of weeks in the year that you attended the
    institution or secondary school"; line 9 "Line 8 multiplied by $375"; line 10 "Enter the
    amount from line 7 or line 9, whichever is less. (maximum $15,000)"; line 11 "Add lines 4
    and 10"; line 12 "Enter the amount from line 3 or line 11, whichever is less", and "Enter
    the amount from line 12 on line 21500 of your tax return."
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t929/t929-24e.pdf
  - >-
    CRA, Form T2125 Statement of Business or Professional Activities (2025,
    docs/cra-forms-2025/t2125-25e.pdf): line 9946 "Your net income (loss)" is reported on the
    line of the T1 by line code, "business income on line 13500", "professional income on line
    13700" and "commission income on line 13900". CRA, Form T2042 Statement of Farming
    Activities (2025, docs/cra-forms-2025/t2042-25e.pdf): "Wheat" (9371), "Gross income" (9659),
    line 9946 "Your net income (loss) ... (enter this amount on line 14100 of your income tax
    and benefit return)". CRA, Form T2121 Statement of Fishing Activities (2025,
    docs/cra-forms-2025/t2121-25e.pdf): "Fish products" (3A), "Salt, bait, and ice", line 9946
    "Your net income (loss) ... (enter this amount on line 14300 of your income tax and benefit
    return)". The statements follow Returns AX, BK and BL, whose sources quote the lines.
