# Return FH: the Schedule 9 donation and gift lines that no other worked return reaches, with a
# filer whose taxable income is over the Schedule 9 income threshold (the high-income rate), gifts of
# capital property and of depreciable property, and every kind of donation. No CRA example exists
# for Schedule 9 (5000-s9-25e.txt prints none), so every figure is a chosen figure, worked out by
# hand from the form text, with the hand derivation of every line in the description.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  An Ontario resident for all of 2025 (Ontario residency is chosen: the form names no province of
  residence), resident in Canada throughout 2025, aged 18 or older at the end of 2025, with no
  spouse (chosen figures). The filer's income is a chosen $300,000.00 of other income (line
  13000) and nothing else, so total income, net income (line 23600) and taxable income (line
  26000) are all 300,000.00. The donations are above the limit (line 10) and the income over the
  threshold (line 19) is below the donations (line 16), so line 20 is limited by line 19. The gains
  of the donated property are not entered on Schedule 3 and the donations are not deducted
  anywhere else (a chosen simplification: the donation inputs are separate inputs of the engine,
  so the schedule is exercised alone). Donations, line 1 to line 4: charitable donations
  250,000.00, donations to the Government of Canada, a province or a municipality 10,000.00 (line
  2), donations to universities outside Canada 5,000.00 (line 3) and donations to the United
  Nations and registered foreign charities 5,000.00 (line 4), so line 5 is 250,000 + 10,000 +
  5,000 + 5,000 = 270,000.00. Chart for line 33700 (a gift of depreciable property): line 1
  recaptured depreciation 3,000.00, line 2 net proceeds 8,000.00, line 3 capital cost 6,000.00;
  line 4 is the lesser of line 2 and line 3, 6,000.00; line 5 is the lesser of line 1 and line 4,
  3,000.00, which is line B (line 33700). Chart for line 33900 (a gift of capital property): line
  1 taxable capital gains 4,000.00, line 2 capital gains deduction 1,000.00, line 3 is 4,000 -
  1,000 = 3,000.00, which is line C (line 33900). Line 6: net income 300,000.00 (amount A)
  multiplied by 75% = 225,000.00. Line 7: amount B plus amount C, 3,000 + 3,000 = 6,000.00 (line
  D), times 25% = 1,500.00. Line 8: 225,000 + 1,500 = 226,500.00. Line 9: the lesser of amount A
  (300,000.00) and line 8 (226,500.00) = 226,500.00. Line 10: the lesser of line 5 (270,000.00)
  and line 9 (226,500.00) = 226,500.00, so the donations are cut back to the limit. Line 11:
  ecological and cultural gifts 30,000.00, of which 5,000.00 were ecological gifts made after
  February 10, 2014 and before 2016 (line 15). Line 12: 226,500 + 30,000 = 256,500.00. Line 13:
  the lesser of line 12 and $200 = 200.00. Line 14: 256,500 - 200 = 256,300.00. Line 16: 256,300 -
  5,000 = 251,300.00. Line 17: taxable income 300,000.00. Line 18: the income threshold
  253,414.00. Line 19: 300,000 - 253,414 = 46,586.00. Allowable donations: line 20 (line F) is
  the lesser of line 16 (251,300.00) and line 19 (46,586.00) = 46,586.00, times 33% = 15,373.38.
  Line 21: amount E (line 14, 256,300.00) minus amount F (46,586.00) = 209,714.00 (line G), times
  29% = 60,817.06. Line 22: amount H (line 13, 200.00) times 14.5% = 29.00. Line 23 (line 34900):
  15,373.38 + 60,817.06 + 29.00 = 76,219.44. The figures below that come from the rest of the
  return (the federal and Ontario tax, the balance) are the engine's, not hand figures, and are
  labelled engine only in the expected section. The lines this return does not reach are not
  triggered. The minimum tax carryover for 2026 (4,554.22, engine only) is the engine's figure
  and is in question (#664).
sources:
  - >-
    CRA, Schedule 9 2025, lines 1 to 10: "Line 5: Add lines 1 to 4. Total eligible amount of
    charitable donations", "Line 7: Amount B plus amount C Line D = multiplied by 25%", "Line 8:
    Line 6 plus line 7", "Line 9: Enter whichever is less: amount A or line 8. Total charitable
    donations limit", "Line 10 and line 34000: Enter whichever is less: amount from line 5 or line
    9." (docs/cra-forms-2025/5000-s9-25e.txt)
  - >-
    CRA, Schedule 9 2025, lines 11 to 19: "Line 12: Line 10 plus line 11", "Line 13: Enter whichever
    is less: amount from line 12 or $200.", "Line 14: Line 12 minus line 13", "Line 16: Line 14
    minus line 15 (if negative, enter "0")", "Line 18: Income threshold 253,414.00", "Line 19: Line
    17 minus line 18 (if negative, enter "0")" (docs/cra-forms-2025/5000-s9-25e.txt)
  - >-
    CRA, Schedule 9 2025, allowable donations: "Line 20: Enter whichever is less: amount from line
    16 or line 19. Line F multiplied by 33%", "Line 21: Amount E minus amount F Line G multiplied by
    29%", "Line 22: Amount from line 13 of the previous page Line H multiplied by 14.5%", "Line 23:
    Add lines 20 to 22. Enter this amount on line 34900 of your return." (docs/cra-forms-2025/5000-s9-25e.txt)
  - >-
    CRA, Schedule 9 2025, charts: "Line 4: Enter whichever is less: amount from line 2 or line 3.",
    "Line 5: Enter whichever is less: amount from line 1 or line 4. Enter this amount on line 33700
    of the previous page.", "Line 3: Line 1 minus Line 2 Enter this amount on line 33900 on the
    previous page." (docs/cra-forms-2025/5000-s9-25e.txt)
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s9/5000-s9-25e.txt
