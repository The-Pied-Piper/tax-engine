# Return EC: Guide T4036's "Example" (Paul), a single Ontario resident whose only income is the net
# rental income of one new rental house bought in 2025 (T1 line 13, Form T776 Parts 3 and 4), with
# no Chart B, whose Area A has one row, Class 1 (the buildings, 4%), with no UCC at the start of the
# year (Paul did not own rental property before) and the half-year rule applying to the addition.
# The total cost of the house is $95,000: the building value of $75,000 and the land of $15,000
# (purchase price $90,000), with legal fees of $3,000 and land transfer taxes of $2,000 (expenses of
# $5,000). The capital cost of the building is $75,000 + $75,000 / $90,000 x $5,000 = $75,000 +
# $4,166.67 = $79,166.67 (column 3 of Area A; the guide's example says Area C, the building additions), which is a filer's input: the form leaves the split of
# the fees between the building and the land to the filer, and the guide's formula is applied here
# by hand. Rental income is $6,000 (line 8141) and expenses are $4,900 (here all of them on line
# 9180, property taxes), so the income before CCA (amount 5) is $1,100.00. Paul claims the CCA of
# $1,100.00, not the $1,583.33 he would otherwise be entitled to (Area A, $79,166.67 x 50% x 4%),
# because CCA cannot create or increase a rental loss, so amount 6 and T1 line 12600 are 0.00. The
# land, $15,833.33 on line 9923 (Area F), is an input taken as entered (`ca/rental_land_additions`):
# nothing earlier on the form computes it, so it is carried to the form's printed lines and read by
# nothing. The closing UCC of Class 1 is $79,166.67 - $1,100.00 = $78,066.67.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025 whose only income is the net rental income of one
  rental house bought in 2025, reported on Form T776 (Statement of Rental Activities): one property
  with one unit, gross rents of $6,000 (line 8141) and expenses of $4,900 (property taxes, line
  9180), so an income before CCA (amount 5) of $1,100.00. Area A has one row, Class 1 (4%), with a
  UCC of 0 at the start of the year and an addition of $79,166.67, the capital cost of the building
  (the building value of $75,000 plus $4,166.67 of the $5,000 of legal fees and land transfer taxes,
  which is the filer's split), with no proceeds, no DIEP and no immediate expensing. The half-year
  rule applies to the addition, so the CCA the filer would otherwise be allowed is $79,166.67 x 50%
  x 4% = $1,583.33, but the claim (column 23) is $1,100.00, the most the rental can take (amount 5,
  "You cannot use CCA to create or increase a rental loss"), so line ii and line 9936 are $1,100.00,
  amount 6 and line 9946 are $1,100.00 - $1,100.00 = $0.00, and T1 line 12600 and the total income
  are $0.00. The closing UCC of Class 1 is $79,166.67 - $1,100.00 = $78,066.67. The land ($15,833.33,
  line 9923 of Area F, the input `ca/rental_land_additions`) is taken as entered and carried through
  unread, as nothing earlier on the form computes it; the land dispositions (line 9924) are $0.00.
  The filer is not associated with any other EPOP, so the immediate expensing limit is the whole
  $1,500,000.00 (Area G), and no immediate expensing is claimed.
sources:
  - >-
    CRA, Guide T4036 (2025), "Example" (docs/cra-forms-2025/t4036-25e.pdf, confirmed from the PDF
    with pdftotext -layout), for Paul: "During the current tax year, Paul bought a house to use for
    rental purposes. For CCA purposes, the building is classified as Class 1 with a 4% rate. It is
    his only rental property. The total cost was $95,000"; the table "Building value (Class 1)
    $75,000", "Land value $15,000", "Total purchase price $90,000", "Legal fees $3,000", "Land
    transfer taxes $2,000", "Total fees $5,000"; "Paul’s rental income was $6,000 and his rental
    expenses were $4,900. Therefore, his net rental income before deducting CCA was $1,100"; the
    formula "$75,000 ÷ $90,000 × $5,000 = $4,166.67"; the table "Building value (Class 1) $75,000.00,
    Related expenses + $4,166.67, Capital cost of the building = $79,166.67"; "Paul enters $79,166.67
    in column 3 of Area C and $15,833.33 ($15,000 + $833.33) on line 9923 of Area F as the capital
    cost of the land."; "Paul did not own rental property before the current year. Therefore, he has
    no UCC to enter in column 2 of Area A."; "Paul acquired his rental property during the current
    year. Therefore, he is subject to the half-year rule"; "His net rental income before CCA is
    $1,100. Paul cannot claim CCA for more than $1,100 because he cannot use his CCA to create a
    rental loss ... This is the case even though he would otherwise be entitled to claim $1,583.33
    ([$79,166.67 × 50%] × 4%)." Guide T4036, "Limits on CCA" (Chapter 4): "You cannot use CCA to create or increase a rental loss."
  - >-
    CRA, Form T776 (2025), Statement of Rental Activities (docs/cra-forms-2025/t776-25e.txt, read
    with rg): "Line 8141: Total of all your gross rents"; "Line 9180: Property taxes"; "Line 9923:
    Total cost of all land additions in the year" (an input taken as entered, carried unread);
    "Line 9924: Total proceeds from all land dispositions in the year" ($0.00 here); "Line 9936: Total CCA claim
    for the year (amount ii from Area A minus any ...)"; "Line 9946: Your net income (loss)"; line
    12600 of the T1 return. Area A, column 3 (additions), column 19 and column 23 (the claim)
    as in the form and Guide T4036's "Column 18 - Adjustment for current-year additions subject to
    the half-year rule".
  - >-
    CRA, "T1-2025 Ontario edition" return (form 5006-R, docs/cra-forms-2025/5006-r-25e.txt,
    confirmed 2026-10-19): line 12600 is T776 amount 6, $0.00, so the total income and net income
    are $0.00 and the tax payable is $0.00.
