# Return KK: Form T1032 Note 1 when its conditions fail but the amounts a) to e) are above line 1. The
# transferring spouse of KH's return (aged 66, line 1 of 3,500.00, an RCA life annuity of 200.00 on
# line 4, 1,600.00 elected), but the receiving spouse is 65 or older, so the conditions above line 33
# do not all apply and Note 1 is not followed: the amounts a) to e) the caller entered (5,000.00) are
# never subtracted from line 1, so they are not compared with it (3,500.00). Every T1032 line is
# worked out by hand from the form text (docs/cra-forms-2025/t1032-25e.txt). The figures are chosen.
#
# Step 2: line 1 3,500.00; line 3 3,500.00; line 8 200.00; line 17 = 3,500.00 + 200.00 = 3,700.00;
#   line 19 3,700.00; line 21 = 3,700.00 x 50% = 1,850.00; line 22 = 1,600.00.
# Step 4, Part A: line 29 = 200.00 / 3,700.00 x 1,600.00 = 86.49; line 30 = 1,600.00 - 86.49 =
#   1,513.51; line 31 = 3,500.00 - 1,513.51 = 1,986.49, so line 31400 of this return is the lesser of
#   2,000.00 and 1,986.49, 1,986.49.
# Part B: the receiving spouse was not under age 65, so line 33 is line 30, 1,513.51; line 34 =
#   0.00 + 1,513.51 and the receiving spouse's line 31400 is the lesser of 2,000.00 and 1,513.51.
# Step 5: as in KH: line 36 = 400.00 x 1,600.00 / 3,700.00 = 172.97 and line 39 = 500.00 - 172.97 =
#   327.03. Total income is 3,700.00 and net income 2,100.00 (1,600.00 deducted on line 21000).
# Amounts are quoted decimal strings, never floats; counts are quoted digit strings.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  An Ontario resident for all of 2025 who is 18 or older at the end of 2025, with a spouse or
  common-law partner on December 31, 2025 (a chosen count of 1), the transferring spouse of a joint
  election to split pension income, aged 66, whose spouse is 65 or older. Line 11500 is 3500.00 and
  an RCA life annuity (line 4) is 200.00. The elected split-pension amount is 1600.00 on line 21000.
  Form T1032: line 17 is 3700.00, line 21 is 1850.00; the receiving spouse is not under 65, so Note 1
  is not followed and the 5000.00 of amounts a) to e) entered is not subtracted from line 1 or
  compared with it: line 29 is 200.00 / 3700.00 x 1600.00 = 86.49, line 30 is 1513.51 and line 31 is
  3500.00 - 1513.51 = 1986.49, so line 31400 is the lesser of 2000.00 and 1986.49, 1986.49. Total
  income is 3700.00 and net income 2100.00. Every other figure is blank.
sources:
  - >-
    CRA, Form T1032 E (25), Joint Election to Split Pension Income, page 3, "Note 1: ... If the
    result is less than $4,000, use that result as the amount for line 17 to recalculate lines 18
    to 31. Enter on line 33 whichever is less: the amount from line 22 or line 30."
  - >-
    CRA, Form T1032 E (25), page 3: "Line 31: Line 23 minus line 30 =" and "Enter on line 31400
    of the transferring spouse's or common-law partner's return, whichever is less: $2,000 or the
    amount from line 31."
  - >-
    CRA, Form T1032 E (25), page 4: "Line 36: Amount from line 35 multiplied by Amount from line
    22 divided by Amount from line 17"; "Line 39: Line 37 minus line 38".
