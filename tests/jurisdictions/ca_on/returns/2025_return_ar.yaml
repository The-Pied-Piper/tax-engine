# Return AR: Ruth, a single 2025 Ontario resident with employment income of $60,000 who sold
# shares at a gain and also received capital gains from a partnership disposition that is
# subject to the 100% inclusion rate (Schedule 3 line 25, 19890): the share gain is halved on
# line 24, the partnership gains are not, and line 26 adds them. The taxable capital gains
# (T1 line 12700) are line 26, so this return is the one that enters a non-zero line 25. The
# other lines are blank.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025, resident in Canada throughout 2025, aged 18 or
  older at the end of 2025 (a chosen figure), with employment income (T1 line 10100) of
  $60,000 (a chosen figure), a share sale with proceeds of $40,000.00 (a chosen figure), an
  adjusted cost base of $0.00 and outlays of $0.00 (chosen figures), so the gain on Schedule 3
  line 4 (line 13200) is 40,000.00, which is line 21 (19700) and line 22; line 24 is 50% of it,
  20,000.00. Partnership gains at full inclusion of $10,000.00 (a chosen figure) on Schedule 3
  line 25 (19890), which is not multiplied by the inclusion rate: line 26 (19900) = line 24 plus
  line 25 = 20,000.00 + 10,000.00 = 30,000.00, positive, so line 12700 (taxable capital gains)
  is 30,000.00. Total income (line 15000) = 60,000.00 + 30,000.00 = 90,000.00. The enhanced CPP
  contributions of 565.00 (1% of the employment income of 60,000.00 less the 3,500.00 basic
  exemption) are deducted, so net income and taxable income are 89,435.00. The income tax
  deducted is a chosen 22,000.00. The federal tax and the Ontario tax are the engine's figures from the
  2025 brackets and credits in the repository (federal tax 11,791.47, Ontario tax 5,930.32),
  giving a total payable of 17,721.79 and a refund of 4,278.21 (to be confirmed against CRA's
  calculator). Without line 25 the total payable would be 14,756.79. Not triggered: the
  personal-use property and listed personal property rows, the other lines of Schedule 3 and
  every other credit and deduction not named here.
sources:
  - >-
    CRA, "T1-2025 Schedule 3 Capital Gains or Losses" (form 5000-S3, confirmed 2026-10-19),
    Part 3: "Line 4 and line 13200: Total gain or loss (add all the amounts under column 5)";
    Part 5: "Line 22: Amount from line 21 above", "Line 23: Inclusion rate 50%", "Line 24: Line
    22 multiplied by the percentage from line 23 =", "Line 25 and line 19890: Capital gains
    from certain dispositions of an interest in a partnership subject to 100% inclusion rate
    (if negative, enter "0")", "Line 26 and line 19900: Line 24 plus line 25 If positive, enter
    the result on line 12700 of your return. If negative, see "If you have a net capital loss"
    below."
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s3/5000-s3-25e.txt
