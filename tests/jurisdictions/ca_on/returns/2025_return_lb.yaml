# Return LB: Guide T4002's Wade (the example for farmers, printed page 102, intergenerational transfer
# of farm properties to his daughter Vicky), a single Ontario resident who transfers his land (ACB
# $85,000, FMV $100,000) and his combine (FMV $9,000, UCC $7,840). "If Wade transfers the land at a
# price equal to its ACB and the combine at a price equal to its UCC, he postpones any taxable capital
# gain and any recapture of capital cost allowance (CCA)", and his proceeds of disposition are
# $85,000 for the land and $7,840 for the combine.
#
# CRA's printed figures are those two proceeds and the postponed gain and recapture, so on Wade's
# return: Schedule 3's real estate gain $0.00, the Class 8 recapture $0.00 and the terminal loss $0.00
# (the UCC less the proceeds is $0, nothing left to recapture or write off). The combine is Class 8 (the guide lists drawn combines in Class 8 and self-propelled ones in Class 10;
# Class 8 is chosen, it changes no figure) (Area A, column 2 opening UCC $7,840, column 5 proceeds $7,840, no property left). The guide gives
# no farm income: the farm sales of $10,000 (wheat, line 9419) are chosen so the statement is not
# blank, and every other expected line is the engine's.
#
# Schedule 8 Part 4 ("Complete this part if you are reporting only self-employment income") is completed (ca/cpp_part_4_completed 1), as the form directs for a return whose only income is self-employment, so lines 42100, 22200 and 31000 are computed; the CPP-dependent lines of the return are the engine's, not CRA's.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025 with one Form T2042 (wheat sales of $10,000, chosen) whose
  Class 8 row is Guide T4002's Wade's combine transferred to his daughter at its UCC (opening UCC $7,840,
  proceeds $7,840, no property left), and the transfer of his land at its ACB on Schedule 3's real estate
  list (proceeds $85,000, cost $85,000): the real estate gain is $0.00, the capital gain is $0.00 and
  the recapture of CCA and the terminal loss of the farm are both $0.00.
sources:
  - >-
    CRA, Guide T4002 (2025), Self-employed Business, Professional, Commission, Farming, and Fishing Income
    (docs/cra-forms-2025/t4002-25e.pdf, confirmed from the PDF with pdftotext -layout), printed page 102,
    "Example for farmers": "Wade wants to transfer these farm properties to Vicky, his 19-year-old daughter.
    Land ACB $ 85,000 FMV at the time of transfer $ 100,000 Combine FMV $ 9,000 UCC at the time of transfer
    $ 7,840"; "If Wade transfers the land at a price equal to its ACB and the combine at a price equal
    to its UCC, he postpones any taxable capital gain and any recapture of capital cost allowance (CCA).
    Also, if he does this, we consider that Wade’s proceeds of disposition and the amounts Vicky paid
    to acquire the properties are $85,000 for the land and $7,840 for the combine."
