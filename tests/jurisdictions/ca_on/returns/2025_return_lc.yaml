# Return LC: Guide T4002's Wade (the example for fishers, printed page 103, intergenerational transfer
# of fishing properties to his daughter Vicky), a single Ontario resident who transfers his fishing
# boat (ACB $85,000, FMV $100,000) and his fishing licence (FMV $9,000, UCC $7,840). "If Wade transfers
# the fishing boat at a price equal to its ACB and the fishing licence at a price equal to its UCC, he
# postpones any taxable capital gain and any recapture of CCA", and his proceeds of disposition are
# $85,000 for the boat and $7,840 for the licence.
#
# CRA's printed figures are those two proceeds and the postponed gain and recapture, so on Wade's
# return: Schedule 3's real estate list gain $0.00 (the boat is a depreciable row), the Class 14.1
# recapture $0.00 and the terminal loss $0.00 (Area A, column 2 opening UCC $7,840, column 5 proceeds
# $7,840, no property left; the licence is Class 14.1, Guide "Class 14.1"). The guide gives no fishing
# income and the statement is left with no entries, so every other line is zero.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025 with one Form T2121 whose Class 14.1 row is Guide T4002's
  Wade's fishing licence transferred to his daughter at its UCC (opening UCC $7,840, proceeds $7,840,
  no property left), and the transfer of his fishing boat at its ACB as a depreciable row of Schedule
  3's real estate list (proceeds $85,000, cost $85,000): the gain is $0.00 and the recapture of CCA and
  the terminal loss of the fishing business are both $0.00.
sources:
  - >-
    CRA, Guide T4002 (2025), Self-employed Business, Professional, Commission, Farming, and Fishing Income
    (docs/cra-forms-2025/t4002-25e.pdf, confirmed from the PDF with pdftotext -layout), printed page 103,
    "Example for fishers": "Wade wants to transfer these fishing properties to Vicky, his 19-year-old
    daughter. Fishing boat ACB $ 85,000 FMV at the time of transfer $ 100,000 Fishing licence FMV $ 9,000
    UCC at the time of transfer $ 7,840"; "If Wade transfers the fishing boat at a price equal to its
    ACB and the fishing licence at a price equal to its UCC, he postpones any taxable capital gain and
    any recapture of CCA. Also, if he does this, we consider that Wade’s proceeds of disposition and the
    amounts Vicky paid to acquire the properties are $85,000 for the fishing boat and $7,840 for the fishing
    licence."
