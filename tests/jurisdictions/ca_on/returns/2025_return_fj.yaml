# Return FJ: the credit and deduction lines for children and the people a filer supports that no
# other worked return sets: the child care limits for children under 7 and with a disability (Form
# T778), the Canada caregiver amount for infirm children (line 30500, Schedule 5), the search and
# rescue volunteers' amount (line 31240), the home accessibility expenses claimed by others (line
# 31285, Federal Worksheet D1), the spouse's infirm children and disability amounts transferred on
# Schedule 2, and the top-up tax credit (Federal Worksheet D1, line 34990). No CRA example exists
# for these lines, so every figure is a chosen figure, worked out by hand from the form text.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A 2025 Ontario resident (chosen: the form names no province of residence), resident in Canada
  throughout 2025, aged 18 or older at the end of 2025, with employment income of 60,000.00
  (line 10100) and other income of 40,000.00 (line 13000), chosen figures, and income tax deducted
  of 8,000.00 (chosen). The CPP base contributions are 4.95% x (60,000 - 3,500) = 2,796.75 and the
  first additional 1% x 56,500 = 565.00 (the T4 total 3,361.75), the EI premiums 1.64% x 60,000 =
  984.00. Total income is 60,000 + 40,000 = 100,000.00.
  Form T778 (child care expenses, line 21400): the filer has 2 children born in 2019 or later whom
  the disability amount cannot be claimed for (chosen), and 1 child whom the disability amount can
  be claimed for (chosen), with child care expenses paid of 30,000.00 (chosen). Line 1 is 2 x
  8,000 = 16,000.00 (the limit for children under 7), line 2 is 1 x 11,000 = 11,000.00 (the limit
  for children with a disability), line 3 is 0 x 5,000 = 0 and line 4 is 16,000 + 11,000 + 0 =
  27,000.00. Line 5 is the 30,000.00 paid and line 6 is the earned income, the employment income
  of 60,000, times two-thirds = 40,000.00. Line 7 is the least of line 4 (27,000.00), line 5
  (30,000.00) and line 6 (40,000.00): 27,000.00, the allowable deduction (line 21400).
  Total deductions from total income are 27,000.00 + 565.00 (the enhanced CPP contributions, the
  first additional) = 27,565.00, so net income and taxable income are 100,000 - 27,565 =
  72,435.00. The federal tax on it (T1 lines 70 to 76, column 2, since it is above 57,375) is line
  72, 72,435 - 57,375 = 15,060.00, line 74, 15,060 x 20.5% = 3,087.30, and line 75, the printed
  8,319.38, so line 76 is 3,087.30 + 8,319.38 = 11,406.68.
  Federal credit amounts. Line 30500, the Canada caregiver amount for infirm children under 18:
  the filer claims 1 infirm child (chosen, the child with the disability), 1 x 2,687 = 2,687.00.
  Line 31240, the search and rescue volunteers' amount: the 200 hours condition is met (chosen),
  1 x 6,000 = 6,000.00; no volunteer firefighters' amount is claimed ("but not both"), so the
  volunteers' total is 6,000.00. Line 31285, Federal Worksheet D1: line 1, eligible expenses,
  25,000 (chosen); line 2 is the lesser of 25,000 and 20,000 = 20,000.00; line 3, the amount
  claimed by other qualifying individuals living in the same dwelling, 5,000 (chosen); line 4 is
  20,000 - 5,000 = 15,000.00.
  Schedule 2 (amounts transferred from the spouse, all figures from another person's return and
  chosen): the spouse's line 30100 is 0, line 30500 is 2,687 (an infirm child), line 31400 is 0,
  line 31600 (disability amount) is 10,138 and the designated tuition is 0, so line 6 is
  2,687 + 10,138 = 12,825.00. Their taxable income (their line 26000) 15,000 is at or below 57,375,
  so line 7 is 15,000.00; line 8 (their line 30000) is 16,129, line 9 (their line 96) 0 and line 10
  (their line 32300) 0, so line 11 is 16,129.00 and line 12 is 15,000 - 16,129, not below zero:
  0.00. Line 13 is 12,825 - 0 = 12,825.00, and as the filer was not separated for 90 days or more
  including December 31, 2025 (the count is 1), line 32600 is 12,825.00.
  The federal credit amounts up to T1 line 100 (line 101) are 16,129.00 (basic personal amount,
  net income at or below 177,882) + 2,796.75 (CPP base) + 984.00 (EI) + 1,471.00 (Canada
  employment amount) + 2,687.00 + 6,000.00 + 15,000.00 = 45,067.75; with line 32600 the total of
  the credit amounts (line 33500) is 45,067.75 + 12,825.00 = 57,892.75, and line 33800 is 14.5% of
  it = 8,394.44875, rounded half-up to the cent: 8,394.45.
  Top-up tax credit (Federal Worksheet D1, line 34990): line 1 is 8,394.45, line 2 (Schedule 9
  line 22) 0, line 3 is 8,394.45, line 4 is 8,319.38, line 5 is 8,394.45 - 8,319.38 = 75.07,
  line 6 is 3.45% and line 7 is 75.07 x 3.45% = 2.589915, rounded half-up to the cent: 2.59.
  The federal non-refundable tax credits (line 35000) are 8,394.45 + 0 + 2.59 = 8,397.04 and
  the federal tax after credits is 11,406.68 - 8,397.04 = 3,009.64.
  Ontario (ON428): the tax on 72,435.00 is the printed 2,670.74 on the first 52,886 plus 9.15% x
  (72,435 - 52,886) = 1,788.7335, 4,459.4735, rounded half-up to the cent: 4,459.47. The Ontario
  credit amounts are 12,747 (basic personal amount) + 2,796.75 + 984.00 = 16,527.75, times 5.05% =
  834.651375, rounded half-up to the cent: 834.65, which leaves 4,459.47 - 834.65 = 3,624.82. The
  Ontario amounts transferred from the spouse (Schedule ON(S2)) are 0, and the Ontario tax is
  below the surtax threshold. The health premium on a taxable income of 72,435.00 (ON428 chart, row 8:
  more than 72,000 but not more than 72,600, minus 72,000, times 25%, plus 600) is
  (72,435 - 72,000) x 25% + 600 = 708.75, and the LIFT credit is 0 (875 less 5% x (72,435 - 32,500) is below
  zero), so the Ontario tax is 3,624.82 + 708.75 = 4,333.57. The total payable is 3,009.64 +
  4,333.57 = 7,343.21. The total credits (line 48200) are the 8,000.00 of tax deducted plus the
  Ontario CARE credit of 7,830.00, 15,830.00 (the CARE credit is the engine's figure: 29% x
  27,000, labelled engine only below), so the refund is 15,830.00 - 7,343.21 = 8,486.79.
  The spouse of Schedule 2 is a separate chosen scenario: the spouse's infirm child is a different
  child from the filer's, the filer claims the child care (T778 line 8 not triggered), the Ontario CARE
  family income and the Ontario S2 transfer (0) ignore the spouse, a chosen simplification as in
  Return AT.
  Every line below the "Engine only" comment, other than unchanged carries of the figures above, is the
  engine's and not a hand figure; the groups are: the Ontario CARE
  credit and its rate, the alternative minimum tax lines (Form T691 and Schedule 1 of ON428), the
  Canada workers benefit, the refundable medical expense supplement, the other payments worksheet,
  the 2000-2025 net capital loss chart and the lines that carry a dataset's printed figure
  unchanged. Not triggered: the filer's own disability amount, the volunteer firefighters' amount,
  the medical expenses, the donations, the CWB and the Ontario spouse amounts.
sources:
  - >-
    CRA, Schedule 5 2025, "Line 30500 - Canada caregiver amount for infirm children under 18 years
    of age": "You can claim $2,687 for each of your (or your spouse's or common-law partner's)
    children who meet all of the following conditions. The child:" "- was under 18 years of age at
    the end of the year" "- had a mental or physical infirmity and will likely continue to be
    dependent on others for a long and continuous period of indefinite duration"; T1 2025
    (5006-R) line 83 and line 30500 "Number of children you are claiming this amount for Line
    30499" "multiplied by $2,687" (docs/cra-forms-2025/5000-s5-25e.txt, 5006-r-25e.txt)
  - >-
    CRA, T1 guide 2025, "Line 31240 - Search and rescue volunteers' amount": "You can claim $6,000
    for the volunteer firefighters' amount (VFA) or search and rescue volunteers' amount (SRVA),
    but not both, if you meet all of the following conditions:" "- You were a volunteer
    firefighter or a search and rescue volunteer during the year." "- You completed at least 200
    hours of eligible volunteer firefighting services or eligible search and rescue volunteer
    services in the year." (docs/cra-forms-2025/5000-g-25e.txt)
  - >-
    CRA, Federal Worksheet 2025 (5000-D1), "Line 31285 - Home accessibility expenses": "Line 1:
    Total eligible expenses ="; "Line 2: Enter whichever is less: amount from line 1 or $20,000.";
    "Line 3: Enter the amount claimed by other qualifying individuals and eligible individuals
    living in the same eligible dwelling from line 31285 of their return."; "Line 4: Line 2 minus
    line 3 Enter this amount on line 31285 of your return. Home accessibility expenses ="
    (docs/cra-forms-2025/5000-d1-25e.txt). The worksheet prints no "if negative, enter 0" on line
    4; the amount here is not negative.
  - >-
    CRA, Federal Worksheet 2025 (5000-D1), "Line 34990 - Top-up tax credit": "Line 1: Amount from
    line 33800 of your return"; "Line 2: Amount from line 22 of your Schedule 9"; "Line 3: Line 1
    plus line 2 ="; "Line 4: 8,319.38"; "Line 5: Line 3 minus line 4 (if negative, enter "0") =";
    "Line 6: Applicable rate 3.45%"; "Line 7: Line 5 multiplied by the percentage from line 6 Enter
    this amount on line 34990 of your return. =" (docs/cra-forms-2025/5000-d1-25e.txt)
  - >-
    CRA, Schedule 2 (5000-S2, 2025): "Line 2 and line 35300: Enter the amount from line 30500 of
    their return."; "Line 4 and line 35700: Enter the amount from line 31600 of their return.
    (Note 1)"; "Line 6: Add lines 1 to 5. ="; "Line 7: Enter the amount from line 26000 of their
    return on line 7 if it is $57,375 or less. If it is more than $57,375, enter the result of the
    following calculation: amount from line 76 of their return divided by 14.5% ="; "Line 8:
    Amount from line 30000 of their return"; "Line 9: Amount from line 96 of their return"; "Line
    10: Amount from line 32300 of their return"; "Line 11: Add lines 8 to 10. ="; "Line 12 and line
    36100: Line 7 minus line 11 (if negative, enter "0") ="; "Line 13: Line 6 minus line 12 (if
    negative, enter "0") Enter this amount on line 32600 of your return." (docs/cra-forms-2025/
    5000-s2-25e.txt)
  - >-
    CRA, Form T778 2025 (not in docs/cra-forms-2025; the lines are quoted as Return Y and the
    manifest quote them): Part B line 1 "Number of eligible children born in 2019 or later whom
    the disability amount cannot be claimed for" "multiplied by $8,000"; line 2 (line 67960)
    "Number of eligible children born in 2025 or earlier whom the disability amount can be
    claimed for" "multiplied by $11,000"; line 3 "multiplied by $5,000"; line 4 "Add lines 1 to
    3."; line 5 "Enter the amount from line 67950."; line 6 "Enter your earned income."
    "multiplied by two-thirds"; line 7 "Enter whichever amount is the least: line 4, line 5 or
    line 6."; line 9 "Line 7 minus line 8. ... enter this amount on line 21400 of your return.
    Allowable deduction". To be confirmed from the form when it is added to the repository.
  - >-
    CRA, T1 General 2025 (5006-R) and Form ON428 2025 (5006-C), as Returns Y and AT cite them for
    the lines 101 to 118 and ON428 lines of this return (docs/cra-forms-2025/5006-r-25e.txt,
    5006-c-25e.txt)
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s5/5000-s5-25e.txt
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-d1/5000-d1-25e.txt
