# Return FY: Yvonne, a single 2025 Ontario resident with employment income only, on one T4 slip whose
# box 16 is more than the required base and first additional contributions (over-contributed) and
# whose box 16A is 0, and a Form CPT20 election to pay additional CPP contributions on employment
# earnings not shown on a T4. The worked example of Schedule 8 with Part 5 completed and line 24 of
# Part 3 positive: Part 3a is computed for the employment contributions, Part 5 takes the election's
# contributions, and the final selection takes Part 5's results. The T1 lines are line 30800 2,326.50,
# line 22215 470.00, line 42100 545.00, line 31000 396.00, line 22200 352.50 and line 44800 0.
# One Schedule 8 and no Form RC381 (the exclusive group ca/cpp_calculation). Amounts are quoted
# decimal strings, never floats; counts are quoted digit strings. Every output the CA-ON manifest
# declares must appear under `expected`, or be left out to be 0 (or no records). The other lines
# are blank.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  Yvonne, a single Ontario resident for all of 2025, resident in Canada throughout 2025, aged 18 or
  older at the end of 2025 (chosen figures), with employment income (T1 line 10100) of $50,000.00
  (a chosen figure) and no other income. Her T4 slip (Ontario employment, so no Quebec employment
  and no Form RC381) shows box 26 of 50,500.00 (a chosen figure), box 16 of 3,000.00 (a chosen
  figure, more than the 2,796.50 required: over-contributed by 203.50) and box 16A of 0 (a chosen
  figure). She has no self-employment income (lines 12200 and 27 of the return are 0, so line 1 of
  Part 5 is 0) and files Form CPT20 to pay additional CPP contributions on 8,000.00 of employment
  earnings not shown on a T4 (a chosen figure, line 2 of Part 5), so Part 5 is completed (input
  cpp_part_5_completed is 1). The return carries one copy of Schedule 8 and no Form RC381. The EI
  premiums are 820.00 (the input) and the income tax deducted is a chosen 13,000.00. The figures
  are chosen, not a CRA example: CRA prints no Schedule 8 example, so every figure below is worked
  out by hand from the form text.
  This return reaches Part 5 lines 75 and 77, the split of
  line A between the CPP base and the second additional contributions. Line 73 (line 24 of Part 3
  if positive) is 203.50, line 72 is 476.00, line A (the lesser of lines 72 and 73) is 203.50, line
  75 is 203.50 x 83.1933% = 169.30, line 76 is 169.30 and line 77 is 203.50 less 169.30 = 34.20.
  These lines need both a line 72 above 0 (self-employment or other earnings, here the election)
  and a positive line 24 of Part 3 (the employment contributions over-contributed). That is why a
  separate return was needed. Part 5 line 10 equals the required base and first additional
  contributions (line 7 of Part 3 x 5.95%, here 2,796.50) whenever line 20 of Part 3 is positive,
  so there is room for the election's earnings only when the employment earnings are below
  71,300.00. Part 5 lines 14, 15, 66 and 67 and Part 3b lines 45 and 46 need a negative line 23 of
  Part 3, which needs employment earnings above 71,300.00, and then line 21 of Part 5 is 0.01, so
  there is no room for the election's earnings; they are reached in Return FX instead. Lines 32, 39, 53 and 60 are out of scope: they need line 16 and line 19 of Part 3 to be of opposite signs, which the form's fixed 83.1933% split gives only through one-cent rounding differences.
  Part 2: line A (the months that CPP applied) is 12, as no condition a) to h) applies (chosen), so
  lines B to E are the table's row for 12 months: B (maximum pensionable earnings) 71,300.00, C
  (maximum amount subject to second additional contributions) 9,900.00, D (additional maximum
  pensionable earnings) 81,200.00 and E (maximum basic exemption) 3,500.00. Part 3, lines 1 to 24,
  in order: line 1 (50339) is the box 26 total, 50,500.00. Line 2 is the lesser of line D
  (81,200.00) and line 1, so 50,500.00. Line 3 is line B, 71,300.00. Line 4 is 50,500.00 less
  71,300.00, negative, so 0. Line 5 is 50,500.00 less 0 = 50,500.00. Line 6 is line E, 3,500.00.
  Line 7 is 50,500.00 less 3,500.00 = 47,000.00 (below its maximum of 67,800.00). Line 8 (50340) is
  the box 16 total, 3,000.00. Line 9 is 3,000.00 x 83.1933% = 2,495.799, rounded half up to
  2,495.80. Line 10 is 3,000.00 less 2,495.80 = 504.20. Line 11 is 47,000.00 x 4.95% = 2,326.50
  (below its maximum of 3,356.10). Line 12 is 47,000.00 x 1% = 470.00 (below its maximum of 678.00).
  Line 13 is 2,326.50 plus 470.00 = 2,796.50. Line 14 is line 9, 2,495.80. Line 15 is line 11,
  2,326.50. Line 16 is 2,495.80 less 2,326.50 = 169.30 (positive: the base contributions are over).
  Line 17 is line 10, 504.20. Line 18 is line 12, 470.00. Line 19 is 504.20 less 470.00 = 34.20
  (positive: the first additional contributions are over). Line 20 is 169.30 plus 34.20 = 203.50.
  Line 21 (50341) is the box 16A total, 0.00. Line 22 is line 4 (0) x 4% = 0.00 (below its maximum
  of 396.00). Line 23 is 0.00 less 0.00 = 0.00. Line 24 is 203.50 plus 0.00 = 203.50, positive, so
  Part 3a is the Part 3 route for the employment contributions. Part 3a, lines 25 to 29, in order:
  line 25 is line 15, 2,326.50 (entered on line 30800 of the return and on line 58240 of ON428, if
  Part 5 is not completed); line 26 is line 18, 470.00; line 27 is line 22, 0.00; line 28 is 470.00
  plus 0.00 = 470.00 (entered on line 22215 of the return, if Part 5 is not completed); line 29 is
  line 24, 203.50 (entered on line 44800 of the return, if Part 5 is not completed). Part 5 is
  continued, so the Part 3a figures are computed but not carried to the return: the form says "If
  you are self-employed or electing to pay additional CPP contributions on other earnings, continue
  at Part 5." Part 3b (line 24 is positive, so this part is computed but not selected), lines 30 to
  48, in order: line 30 (line 16 is positive) is line 15, 2,326.50. Line 31 (taken only if line 16
  is negative) is 0. Line 32 (taken only if line 16 is negative and line 19 is positive) is 0.
  Line 33 is 0 less 0 = 0. Line 34 is 2,326.50 plus 0 = 2,326.50. Line 35 (line 23 is not positive)
  is 0. Line 36 is 2,326.50 plus 0 = 2,326.50. Line 37 (line 19 is positive) is line 18, 470.00.
  Line 38 (taken only if line 19 is negative) is 0. Line 39 is the lesser of line 16 (169.30) and
  line 38 (0), so 0. Line 40 is 0 less 0 = 0. Line 41 is 470.00 plus 0 = 470.00. Line 42 (line 23 is
  not positive) is 0. Line 43 is 470.00 plus 0 = 470.00. Line 44 (line 23 is "0") is line 22,
  0.00. Line 45 (taken only if line 23 is negative) is 0. Line 46 is the lesser of line 20 (203.50)
  and line 45 (0), so 0. Line 47 is 0.00 plus 0 = 0.00. Line 48 is 470.00 plus 0.00 = 470.00.
  Part 5 (completed, cpp_part_5_completed is 1), the lines the scenario reaches, in order. Line 2 is
  the CPT20 earnings not shown on a T4, 8,000.00 (a chosen figure); line 1 is 0 (no net
  self-employment income); line 3 is 0 (no election on a T4 slip); line 4 is 0 + 8,000.00 + 0 =
  8,000.00. Line 5 is line 8 of Part 3, 3,000.00. Line 6 (line 20 of Part 3 if positive) is 203.50.
  Line 7 is 3,000.00 less 203.50 = 2,796.50. Lines 8 and 9 are not completed (they need line 20 of
  Part 3 negative), so line 9 is 0. Line 10 is 2,796.50 plus 0 = 2,796.50. Line 11 is line 21 of
  Part 3, 0.00. Line 12 (line 23 of Part 3 if positive, else 0) is 0. Line 13 is 0.00 less 0 = 0.00.
  Lines 14 and 15 are not completed (they need line 23 of Part 3 negative), so line 15 is 0. Line 16
  is 0.00 plus 0 = 0.00. Line 17 is line B, 71,300.00. Line 18 is line E, 3,500.00. Line 19 is
  71,300.00 less 3,500.00 = 67,800.00 (its maximum). Line 20 is line 10 (2,796.50) x 16.80672 =
  46,999.99. Line 21 is 67,800.00 less 46,999.99 = 20,800.01. Line 22 is the lesser of line 4
  (8,000.00) and line 21 (20,800.01), so 8,000.00. Lines 23 to 28 are not completed, as line 1 of
  Part 3 (50,500.00) is not less than line 18 (3,500.00), so line 29 is 0 and the form continues at
  line 30. Line 30 is line 22 less line 29 = 8,000.00. Line 31 is line 4, 8,000.00. Line 32 is line 2
  of Part 3, 50,500.00. Line 33 is 8,000.00 plus 50,500.00 = 58,500.00, not more than line 17
  (71,300.00), so lines 34 to 41 are not completed and line 42 is 0. Line 43 is line 30 (8,000.00) x
  9.9% = 792.00 (below its maximum of 6,712.20). Line 44 is line 30 x 2% = 160.00 (below its maximum
  of 1,356.00). Line 45 is line 42 (0) x 8% = 0.00 (below its maximum of 792.00). Line 46 is 160.00
  plus 0.00 = 160.00. Line 47 is 792.00 plus 160.00 = 952.00. Line 48 is line 24 of Part 3 (203.50,
  positive) x 2 = 407.00. Line 49 is 952.00 less 407.00 = 545.00, positive, so it is entered on line
  42100 of the return and line 50 is not taken. Line 50 (the CPP overpayment on line 44800) is taken
  only for a negative line 49, so it is 0. Lines 51 and 57: line 16 of Part 3 is positive, so line
  51 is line 11 of Part 3, 2,326.50. Lines 52 and 53 are not taken (they need line 16 of Part 3
  negative), so line 54 is 0.00 and line 55 is 2,326.50 plus 0 = 2,326.50. Line 56 (line 23 of
  Part 3 is not positive) is 0. Line 57 is 2,326.50 plus 0 = 2,326.50, entered on line 30800 of the
  return. Lines 58 to 69: line 19 of Part 3 is positive, so line 58 is line 12 of Part 3, 470.00.
  Lines 59 to 61 are not taken (they need line 19 of Part 3 negative), so line 60 is 0 and line 62 is
  470.00 plus 0 = 470.00. Line 63 (line 23 of Part 3 is not positive) is 0. Line 64 is 470.00 plus 0 =
  470.00. Line 65 (line 23 of Part 3 is "0") is line 22 of Part 3, 0.00. Line 66 (line 23 of Part 3
  negative) is not taken, so 0. Line 67 is the lesser of line 20 of Part 3 (203.50) and line 66 (0),
  so 0. Line 68 is 0.00 plus 0 = 0.00. Line 69 is 470.00 plus 0.00 = 470.00, entered on line 22215 of
  the return. Lines 70 to 88 (the self-employment and other earnings contributions, the deduction
  and the overpayment on those earnings): line 70 is line 43 (792.00) x 50% = 396.00, entered on
  line 31000 of the return. Line 71 is line 44 (160.00) x 50% = 80.00. Line 72 is 396.00 plus 80.00 =
  476.00. Line 73 is line 24 of Part 3 if positive, 203.50. Line 74 is 476.00 less 203.50 = 272.50.
  Line A is the lesser of line 72 (476.00) and line 73 (203.50), so 203.50. Line 75 is line A (203.50)
  x 83.1933% = 169.30. Line 76 is line 75, 169.30. Line 77 is line A (203.50) less line 76 (169.30) =
  34.20. Line 78 is line 70, 396.00. Line 79 is line 75, 169.30. Line 80 is 396.00 less 169.30 =
  226.70. Line 81 is line 71, 80.00. Line 82 is line 77, 34.20. Line 83 is 80.00 less 34.20 = 45.80.
  Line 84 is line 45 (0.00) x 50% = 0.00. Line 85 is line 84, 0.00. Line 86 (line 74 is positive, so
  it is not used) is not used, and line 85 goes to line 87. Line 87 is 0.00 less 0 = 0.00. Line 88 is
  226.70 plus 80.00 plus 45.80 plus 0.00 plus 0.00 = 352.50, entered on line 22200 of the return.
  The final selection (Part 5 is completed, and line 30 of Part 5 is not 0, so the form does not
  return to Part 3): Part 5's results are used. Line 30800 is line 57 = 2,326.50; line 22215 is line
  69 = 470.00; line 42100 is line 49 = 545.00; line 44800 is line 50 = 0, because line 49 is positive
  and line 50 is not taken (the Part 3a overpayment of line 29, 203.50, is not carried); line 31000 is
  line 70 = 396.00; line 22200 is line 88 = 352.50. Total income (line 15000) is 50,000.00; the
  deductions of line 22215 (470.00) and line 22200 (352.50) are 822.50, so net income and taxable
  income are 50,000.00 less 822.50 = 49,177.50. The EI premiums are 820.00. The income tax deducted
  is a chosen 13,000.00 and the CPP overpayment of line 44800 is 0, so the total credits are
  13,000.00. The federal tax, the Ontario tax and the minimum tax (AMT) lines are the engine's
  figures from the 2025 brackets and credits in the repository (net federal tax 4,065.08, Ontario tax
  2,219.72), giving a total payable of 6,829.80 and a refund of 6,170.20 (to be confirmed against
  CRA's calculator). Not triggered: Part 4 (no self-employment income); Part 5 lines 8 and 9 (line
  20 of Part 3 is positive); lines 14 and 15 (line 23 of Part 3 is not negative); lines 23 to 28
  (line 1 of Part 3 is not less than line 18); lines 34 to 41 (line 33 is not more than line 17);
  line 50 (line 49 is positive, so the CPP overpayment of line 44800 is not taken); lines 52 and 53
  (line 16 of Part 3 is positive); line 59 (line 19 of Part 3 is positive); line 66 (line 23 of
  Part 3 is not negative); Part 3b lines 31 and 32 (line 16 of Part 3 is positive); and every other
  credit and deduction not named here. Not reached by this return: Part 5 lines 14, 15, 66 and 67
  and Part 3b lines 45 and 46 (they need a negative line 23 of Part 3, which needs employment
  earnings above 71,300.00 and leaves no room for the election; Return FX reaches them). Lines 32,
  39, 53 and 60 are out of scope (see above).
