# Return MH: Form T936 "Calculation of Cumulative Net Investment Loss (CNIL) to December 31, 2025"
# as its own form, with every line of Parts 1 to 3 and Chart A non-zero. The form's two exports,
# Chart A line 14 (2,500.00) and Part 3 line C (350.00), are what Form T657 Step 1 line 15 and
# Step 2 line 16 read.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  Return MH: a single 2025 Ontario resident in Canada throughout 2025, aged 18 or older at the end
  of 2025 (chosen figures), with no Form T2048 (so T2048 lines 17215, 17216 and the 2025 part of
  line 17218 are 0) and no capital gains deduction claimed. Form T936 Chart A. Line 1 (line 19900
  of Schedule 3) is the included capital gain 3,850.00 (50% of the capital gain 7,700.00 = shares
  3,000.00 + qualified small business corporation shares 2,000.00 + qualified farm or fishing
  property 1,000.00 + its foreclosure 400.00 + T3 gains 800.00 + the reserve on line 19200 of
  500.00) plus the partnership gains at full inclusion 600.00 = 4,450.00; line 2 = 0.00; line 3 =
  4,450.00 - 0.00 = 4,450.00; lines 4, 5 and 6 = 2,000.00, 1,000.00 and 400.00, so line 7 =
  3,400.00; line 8 (line 19200 of Schedule 3 is reported, 500.00; line 13 of Form T2017) = 500.00;
  line 9 = 3,900.00; line 10 = 50%; line 11 = 3,900.00 x 50% = 1,950.00; line 12 = 0.00; line 13 =
  1,950.00 - 0.00 = 1,950.00; line 14 = 4,450.00 - 1,950.00 = 2,500.00. Lines 15 and 16 (box 21 and
  box 30 of the T3 slips) are 800.00 and 300.00, so line 17 = 500.00; line 18 = 50%; line 19 =
  500.00 x 50% = 250.00; line 20 = 2,500.00 - 250.00 = 2,250.00. Part 1: line 1 (line 22100,
  1,000.00 carrying charges + 200.00 interest) = 1,200.00; line 2 (net rental loss, the T776 net
  rental income being -900.00) = 900.00; line 3 (non-active partnership losses) = 700.00; line 4
  (line 25100) = 300.00; line 5 = 50% x 2,000.00 = 1,000.00; line 6 (68080) = 150.00; line 7 =
  the lesser of line 20 of Chart A, 2,250.00, and line 25300 of the return, 1,800.00 = 1,800.00;
  line A = 1,200 + 900 + 700 + 300 + 1,000 + 150 + 1,800 = 6,050.00. Part 2: line 8 (lines 12000
  and 12100) = 0.00 + 3,000.00 = 3,000.00; line 9 (net rental income, a loss) = 0.00; line 10
  (partnership net income 1,000.00 less its taxable capital gains 400.00) = 600.00; line 11
  (68100) = 250.00; line 12 (68110) = 50% x 800.00 (the recovery of exploration and development
  expenses, all of line 13000) = 400.00; line 13 = 2,250.00; line B
  = 3,000 + 0 + 600 + 250 + 400 + 2,250 = 6,500.00. Part 3: line 14 = 6,050.00; line 15 =
  4,000.00; line 16 = 10,050.00; line 17 (line 17218 of Form T2048 for 2024 to 2025) = 700.00 +
  0.00 = 700.00; line 18 = 10,050.00 - 700.00 = 9,350.00; line 19 = 6,500.00; line 20 = 2,500.00;
  line 21 = 9,000.00; line C = 9,350.00 - 9,000.00 = 350.00. Form T657 Step 1 line 15 is 2,500.00
  and Step 2 line 16 is 350.00. The rest of the return does not change with Form T936: total
  income = 3,000.00 - 900.00 + 800.00 + 1,000.00 + 4,450.00 = 8,350.00; net income = 8,350.00 -
  1,200.00 (line 22100) - 2,000.00 (line 22400) = 5,150.00; taxable income = 5,150.00 - 1,800.00
  (line 25300) - 300.00 (line 25100) = 3,050.00.
sources:
  - >-
    CRA, Form T936 (2025), Chart A: "Enter the amount from line 19900 of Schedule 3, Capital Gains
    or Losses (if negative, show the amount in brackets). If the amount is "0", do not complete
    lines 2 to 17, and enter "0" on line 20." (line 1); "Line 1 minus line 2" (line 3); "Add lines 4
    to 6 (if negative, show in brackets)." (line 7); "If you reported an amount on line 19200 of
    Schedule 3, enter the amount from line 13 of Form T2017" (line 8); "Inclusion rate x 50%" (line
    10); "Line 9 multiplied by the percentage on line 10 (if negative, enter "0")" (line 11); "Line
    3 minus line 13 (if negative, enter "0")" (line 14); "Line 15 minus line 16" (line 17); "Line 14
    minus line 19 (if negative, enter "0") Additional investment income" (line 20)
    (docs/cra-forms-2025/t936-25e.pdf)
  - >-
    CRA, Form T936 (2025), Part 1 "Add lines 1 to 7. Total investment expenses claimed in 2025";
    "50% of exploration and development expenses (line 22400)" (line 5); "Additional investment
    expenses: ... enter whichever is less: line 20 in Chart A or line 25300 of your return."
    (line 7); Part 2 "Net income from limited or non-active partnership (line 12200) other than
    taxable capital gains" (line 10); "50% of income from the recovery of exploration and
    development expenses (line 13000)" (line 12); "Add lines 8 to 13. Total investment income
    reported in 2025" (line B) (docs/cra-forms-2025/t936-25e.pdf)
  - >-
    CRA, Form T936 (2025), Part 3: "Line 14 plus line 15" (line 16); "Cumulative investment
    expenses (line 16 minus line 17)" (line 18); "Cumulative investment income (total of lines 19
    and 20)" (line 21); "Line 18 minus line 21 (if negative, enter "0") CNIL to December 31, 2025"
    (line C); "report the amount from line C on line 16 of Step 2 of Form T657"
    (docs/cra-forms-2025/t936-25e.pdf)
