# Return LO: Guide T4044, Leasing costs example (car leased February 1, 2025), line 27 from the chart.
# Amounts are quoted decimal strings.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  Return LO: Guide T4044 (2025), "Leasing costs", Example: an Ontario resident who began leasing a
  passenger vehicle on February 1, 2025 with monthly payments of $500, lease payments made for 2025
  of $5,500, 335 days leased and a manufacturer's list price of $28,000 (the Guide's chart prints
  $26,000 on line 4; line 5 is the greater either way). The chart "Eligible leasing costs for
  passenger vehicles leased after December 31, 2000" is computed, lines 1 to 8, with the HST rate of
  13%: line 5 is 44,706 + 5,811.78 = 50,517.78, line 6 is 85% of it, 42,940.11, line 7 is (1,100 +
  143.00) x 335 = 416,405.00, divided by 30 = 13,880.17, minus line 2 (0), and line 8 is (38,000 +
  4,940.00) x 5,500 divided by 42,940.11 = 5,499.99. The Guide rounds every line to whole dollars
  (line 6 is printed as $42,940, so line 8 is $5,500); the engine keeps the cents, so the lower of
  lines 7 and 8 is 5,499.99 where the Guide prints $5,500. It is entered on T777 line 27 (a
  passenger vehicle, leased in 2025), with all 10,000 of 10,000 kilometres driven for employment
  (chosen), so line 29 is 5,499.99, line 30 is 5,499.99, line 3 is 5,499.99 and T777 line 17 and T1
  line 22900 are 5,499.99. The employment income is a chosen $60,000. Every other line is the
  engine's figure.
sources:
  - >-
    CRA, Guide T4044 (2025), Employment Expenses (docs/cra-forms-2025/t4044-25e.txt;
    https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t4044/t4044-25e.txt), "Leasing costs",
    Example: "On February 1, 2025, you, a resident of Ontario, began leasing a car that meets the
    definition of a passenger vehicle." "Lease payments made for 2025 $5,500" "You would enter
    $5,500 (the lower of the amounts on line 7 and line 8) on line 27 of Form T777." Chart "Eligible
    leasing costs for passenger vehicles leased after December 31, 2000": "Line 5: 44,706* + GST**
    and PST** or HST**"; "Line 6: Enter the amount from line 4 or line 5, whichever is more.
    multiplied by 85%"; "Line 7: ($1,100*** + GST** and PST** or HST**) multiplied by line 3 =
    divided by 30 = minus line 2"; "Line 8: ($38,000**** + GST** and PST** or HST**) multiplied by
    line 1 = divided by line 6"; "Your eligible leasing cost is the lower of the amounts on line 7
    and line 8"; the footnotes print other amounts for a lease entered into in 2024 or earlier.
  - >-
    CRA, Form T777 (2025), Statement of Employment Expenses (docs/cra-forms-2025/t777-25e.pdf, the
    only published copy; https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t777/t777-25e.pdf):
    line 27 "Leasing costs"; line 29 "Add lines 21 to 28."; line 30 "Line 20 multiplied by line 29.
    Employment-use portion"; line 32 "Line 30 minus line 31 ... Allowable motor vehicle expenses".
