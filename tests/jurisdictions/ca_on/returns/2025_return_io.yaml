# Return IO: a self-employed filer (a single sole proprietor, a 2025 Ontario resident) whose
# only activity is a fishing business, one Form T2121 (Statement of Fishing Activities) with
# Part 3, Part 4, Part 5, Part 6, Part 7 and Area A: fish products of $40,000 (amount 3A),
# so the gross income (line 8299, T1 line 14299) is $40,000.00; expenses of $25,000 on two
# lines (salt, bait and ice, line 9138, $10,000, and fishing gear, line 9136, $15,000) and
# repairs of $1,000 on the fishing boat (amount 1), so the repairs total (amount 4) is
# $1,000.00 and your cost (line 8963, amount 4 minus amount 5) is $1,000.00 minus the
# insurance recovery of $400.00 (amount 5), $600.00; amount 4Q is $25,600.00 and the net
# income before adjustments (line 9369) is $14,400.00; no capital cost allowance, no partner
# and no business-use-of-home amounts; so the net fishing income (line 9946, T1 line 14300)
# is $14,400.00, and the net self-employment income (T1 line 27) is $14,400.00, all of total
# income (line 15000). With no employment income, Schedule 8 Part 4 not completed and no
# agreement for EI, no CPP contributions or EI premiums are payable, so net income and
# taxable income are $14,400.00, the federal tax after credits is 0 and the Ontario tax is
# 0. The Canada workers benefit (line 45300) is $1,633.00: the working income is the
# $14,400.00 of self-employment profit (Schedule 6 line 3), 27% of the $11,400.00 over
# $3,000 is $3,078.00, capped at $1,633.00, with no reduction under $26,855.00, so the
# refund is $1,633.00. Amounts are quoted decimal strings, never floats; counts are quoted
# digit strings. Every output the CA-ON manifest declares must appear under `expected`, or
# be left out to be 0 (or no records). The farming lines (Form T2042) are not triggered and
# are not listed here. The insurance recovery is not above the repairs.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025 whose only activity is a fishing business,
  reported on one Form T2121: fish products of $40,000 (amount 3A), so line 8299 and T1 line
  14299 are $40,000.00; expenses of $25,000 on two lines (salt, bait and ice, line 9138,
  $10,000, and fishing gear, line 9136, $15,000) and repairs of $1,000 on the fishing boat
  (amount 1), so the repairs total (amount 4) is $1,000.00; the insurance recovery (amount
  5) is $400.00, so your cost (line 8963, amount 4 minus amount 5) is $600.00 and amount 4Q
  is $25,600.00; line 9369 is $14,400.00; with no capital cost allowance, no partner and no
  business-use-of-home amounts, line 9946 and T1 line 14300 are $14,400.00. The motor
  vehicle expenses (line 9281) are Charts A to C for a leased passenger vehicle used for no
  fishing (business kilometres 0), so line 9281 is $0 and changes no total. A chosen set of
  figures. The net self-employment income (T1 line 27, "Add lines 22 to 26") is 0 + 0 + 0 +
  0 + 14,400 = $14,400; line 28 is line 21 (0) plus line 27 and total income (line 15000)
  adds line 27 to the other income lines, which are all 0, so total income is $14,400.00.
  The farming income (Form T2042, T1 line 25) is not triggered and is 0. Every figure from
  line 27 on follows from the same $14,400 net. The CPP months (Schedule 8 box A) are the 12
  of a full year, Schedule 8 Part 4 is not completed (count 0) and there is no agreement
  with the Canada Employment Insurance Commission (count 0), so the CPP contributions
  payable (line 42100), the base CPP contributions (line 31000) and the deduction (line
  22200) on self-employment income, and the EI premiums on it (lines 31217 and 42120), are
  $0 and change no total. The Part 5 amount on line 49 is $1,297.10, on the $10,900.00 of
  line 30 (14,400 less the $3,500 basic exemption), so it moves with the income.
sources:
  - >-
    CRA, Form T2121 (2025), Statement of Fishing Activities (docs/cra-forms-2025/t2121-25e.pdf,
    confirmed 2026-10-19 from the PDF; https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2121/t2121-25e.pdf),
    Part 3: "Gross income: Total of amounts 3A to 3F and line 9600 (enter this amount on line
    14299 of your income tax and benefit return)" (8299); Part 4: "Gross income (line 8299 of
    Part 3)" (4A); "Subtotal: Add amounts 4B to 4P." (4Q); "Capital cost allowance (CCA). Enter
    amount ii of Area A minus any personal part and any CCA for business-use-of-home expenses."
    (9936); "Total expenses: Amount 4Q plus line 9936" (9368); "Net income (loss) before adjustments:
    Amount 4A minus line 9368." (9369); "Repairs and maintenance: Fishing boat", "Engine",
    "Electrical equipment", "Total of amounts 1 to 3", "Insurance recovery", "Your cost (amount 4
    minus amount 5)" (8963, amount 4O).
    Part 5: "Your share of line 9369 or the amount from your T5013 slip, Statement of Partnership
    Income" (5A); "Total: Amount 5A plus line 9974" (5B); "Net income (loss) after adjustments:
    Amount 5B minus line 9943" (5C); "Your net income (loss): Amount 5C minus line 9945 (enter this
    amount on line 14300 of your income tax and benefit return)" (9946). Part 6: "Total other
    amounts deductible from your share of the net partnership income (loss): Add amounts 6A to 6E
    (enter this amount on line 9943 of Part 5)." (6F). Part 7: "Subtotal: Add amounts 7A to 7G."
    (7H); "Subtotal: Amount 7H minus amount 7I" (7J); "Subtotal: Add amounts 7J to 7L." (7M);
    "Net income (loss) after adjustments (amount 5C) (if negative, enter "0")." (7N); "Business-use-
    of-home expenses available to carry forward: Amount 7M minus amount 7N (if negative, enter
    "0")" (7O); "Allowable claim: Amount 7M or 7N above, whichever is less (enter your share of this
    amount on line 9945 of Part 5)" (7P). Area A endnote 3: "If you have a negative amount in column
    7, add it to income as a recapture in Part 3 on line 9600. If no property is left in the class
    and there is a positive amount in this column, deduct the amount from income as a terminal loss
    in Part 4 on line 9270." The income lines (Part 3), the expense lines (Part 4) and the caller's
    amounts are the chosen figures in the description; the lines not listed are not entered and are
    0. Not modelled: Part 1 (identification), Part 2 (the Internet business activities), Part 8 (the
    other partners), Part 9 (the equity), Areas B to G (Charts A to C are modelled, see the
    sources below). Area A's amount iii is not modelled.
  - >-
    https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2121/t2121-25e.pdf
  - >-
    CRA, Form T2121 (2025), Charts A to C (docs/cra-forms-2025/t2121-25e.pdf, the PDF text): Chart A
    "Total motor vehicle expenses: Add amounts 3 to 11." (12); "Business use part: amount 1 ÷ amount 2
    × amount 12 = 13" (13); "Business parking fees" (14); "Supplementary business insurance" (15);
    "Allowable motor vehicle expenses: Add amounts 13 to 15 (enter this total on line 9281 of Part 4)"
    (16). Chart B: "Total interest payable (accrual method) or paid (cash method) in the fiscal period" (17);
    "($350*** ÷ 30) × the number of days in the fiscal period for which interest was payable (accrual
    method) or paid (cash method)" (18); "Available interest expense: Amount 17 or 18, whichever is
    less (include this in amount 4 of Chart A above)" (19). Chart C: "Total lease charges incurred in
    your current fiscal period for the vehicle." (20); "Total lease payments deducted before your
    current fiscal period for the vehicle" (21); "Total number of days the vehicle was leased in your
    current and previous fiscal periods" (22); "Manufacturer's list price" (23); "Use a GST rate of 5%
    or HST rate applicable to your province."; "Amount 23 or ($44,706 + GST and PST, or $44,706 + HST),
    whichever is more" and "× 85%" (24); "[($1,100 + GST and PST, or $1,100 + HST) × amount 22] ÷ 30"
    (25); "Amount 25: amount 21" (26); "[($38,000 + GST and PST, or $38,000 + HST) × amount 20] ÷ amount
    24" (27); "Eligible leasing cost: Amount 26 or 27, whichever is less (enter in amount 8 of Chart A
    above)" (28). The charts are the figures of Return BB's leased vehicle with business kilometres 0
    (amount 1), a chosen figure, so amount 13 and line 9281 are 0 and the other lines are the same.
  - >-
    CRA, Form T2121 (2025), Charts A to C: the chosen figures are amount 2 (total kilometres) 10,000;
    amount 3 (fuel and oil) 1,000, amount 5 (insurance) 600, amount 7 (maintenance and repairs) 200
    and amount 10 (other expenses) 653; amounts 6, 9, 11, 14 and 15 are 0; amount 17 (total interest
    payable) 400 and the number of days 183, so line 18 is 350 ÷ 30 × 183 = 2,135.00 and amount 19 is
    the lesser, 400.00; amount 20 (total lease charges) 2,550, amount 21 (payments before the year) 0,
    amount 22 (days leased) 183, amount 23 (manufacturer's list price) 60,000 and the GST or HST rate
    13%: 44,706 + 13% = 50,517.78, 1,100 + 13% = 1,243.00 and 38,000 + 13% = 42,940.00; amount 23 or
    44,706 plus tax, whichever is more, is 60,000.00; amount 24 is 60,000.00 × 85% = 51,000.00; amount
    25 is 1,243.00 × 183 ÷ 30 = 7,582.30; amount 26 is 7,582.30 - 0 = 7,582.30; amount 27 is 42,940.00
    × 2,550 ÷ 51,000.00 = 2,147.00; and amount 28 is the lesser, 2,147.00. Chart A: amount 12 is 1,000
    + 400 + 600 + 200 + 2,147 + 653 = 5,000.00; amount 13 is 0 × 5,000 ÷ 10,000 = 0.00; and line 9281
    (amount 16) is 0.00 + 0 + 0 = 0.00. Every product and quotient here is exact to the cent, so no
    line is rounded; line 9281 is $0, so the fishing expenses do not change.
  - >-
    CRA, "T1-2025 Ontario edition" return (form 5006-R, docs/cra-forms-2025/5006-r-25e.txt,
    confirmed 2026-10-19), "Step 2 - Total income": "Line 26: Fishing income"; "Line 14300: Net";
    "Line 27: Add lines 22 to 26. Net self-employment income =". Line 14300 (line 26) is T2121
    line 9946, $14,400; lines 22 to 25 (business, professional, commission and farming income) are
    $0, a chosen figure, so line 27 is 0 + 0 + 0 + 0 + 14,400 = 14,400. Line 28 is line 21 (the sum
    of lines 1 to 20, every one a chosen $0) plus line 27, and total income (line 15000) is the sum
    of the income lines in line order, line 27 coming after line 20: $14,400.00. Total deductions
    are 0 (no CPP deduction, RRSP, union dues or child care expenses), so net income before
    adjustments (line 23400) is 14,400.00 and taxable income (line 26000) is 14,400.00.
  - >-
    https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-r/5006-r-25e.txt
  - >-
    The figures that depend on income, with the forms quoted in Return BC: T1 (form 5000-R) line
    77 (line 30000) is $16,129 for net income of $177,882 or less, so the federal credit amounts
    (line 33500) are 16,129.00 and line 33800 is 16,129.00 x 14.5% = 2,338.705, rounded half-up
    to the cent: 2,338.71 (line 35000, no Schedule 9 amounts). Part A "Federal tax on taxable
    income": taxable income of 14,400.00 is in column 1 "Line 26000 is $57,375 or less": line 74
    is 14,400.00 x 14.5% = 2,088.00. The non-refundable credits (2,338.71) are more than that
    tax, so the federal tax after credits is 0. The medical share, 3% of net income, is 432.00
    and the threshold, the lesser of that and $2,834, is 432.00, above the medical expenses of
    0. ON428 Part A: 14,400.00 x 5.05% = 727.20; the Ontario credit amounts are the basic
    personal amount 12,747.00, and 12,747.00 x 5.05% = 643.7235, rounded half-up to the cent:
    643.72, so the Ontario tax after credits is 727.20 - 643.72 = 83.48. The basic reduction is
    294.00, twice it, 588.00, less the tax of 83.48 is 504.52, which is more than the tax, so
    the tax after the reduction is 0. Schedule ON428-A: the LIFT credit is 5.05% of employment
    income, 0, less 5% of the net income over $32,500, 14,400.00 is not over it, so 0. The
    Ontario health premium chart, taxable income 14,400.00, is in "Row 1: Taxable Income of
    $20,000 or less": "Ontario health premium: $0", so the Ontario tax (line 42800) is 0.
    Schedule 6: the working income is the self-employment profit of 14,400.00, 27% of the
    11,400.00 over 3,000 is 3,078.00, capped at 1,633.00, so the Canada workers benefit is
    1,633.00. T1 line 148 (line 43500) is the net federal tax 0 plus the Ontario tax 0 = 0.00,
    with no CPP or EI payable and no tax deducted, so line 167, the refund, is 1,633.00. These lines add and subtract amounts
    already in cents. The other credits and lines (the age, spouse, dependant and caregiver
    amounts, the Ontario credits and the refundable credits) are 0 for the same chosen counts
    and amounts as Return BC.
