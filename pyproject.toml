[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tax-engine"
version = "0.1.1"
description = "Open-source personal income tax calculation engine in Python. Every number is a tax-form line, and every result explains itself in a readable trace."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Umar Khan", email = "The-Pied-Piper@users.noreply.github.com" },
]
keywords = [
    "tax",
    "income-tax",
    "tax-calculation",
    "canada",
    "ontario",
    "decimal",
    "explainable",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "import-linter>=2.0",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-PyYAML",
]

[project.urls]
Documentation = "https://github.com/The-Pied-Piper/tax-engine#readme"
Repository = "https://github.com/The-Pied-Piper/tax-engine"
Issues = "https://github.com/The-Pied-Piper/tax-engine/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tax_engine = ["jurisdictions/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.importlinter]
root_package = "tax_engine"

[[tool.importlinter.contracts]]
id = "layers"
name = "Layers point inward"
type = "layers"
layers = [
    "tax_engine.factory",
    "tax_engine.registrations",
    "tax_engine.adapters",
    "tax_engine.application",
    "tax_engine.domain",
]

[[tool.importlinter.contracts]]
id = "jurisdictions"
name = "Jurisdictions never use the application layer, wiring or outbound adapters"
type = "forbidden"
source_modules = ["tax_engine.jurisdictions"]
forbidden_modules = [
    "tax_engine.application",
    "tax_engine.factory",
    "tax_engine.registrations",
    "tax_engine.adapters.outbound",
]
# The one exception: a jurisdiction's parameter parsers extend the parser base class and read
# their dataset through YamlNode.
ignore_imports = [
    "tax_engine.jurisdictions.*.parameter_parsers.** -> tax_engine.adapters.outbound.parameter_parser",
    "tax_engine.jurisdictions.*.parameter_parsers.** -> tax_engine.adapters.outbound.yaml_support",
]

[[tool.importlinter.contracts]]
id = "core"
name = "Core never imports a jurisdiction"
type = "forbidden"
source_modules = [
    "tax_engine.domain",
    "tax_engine.application",
    "tax_engine.adapters",
]
forbidden_modules = ["tax_engine.jurisdictions"]
