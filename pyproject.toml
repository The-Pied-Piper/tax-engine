[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tax-calculator"
version = "0.1.0"
description = "A jurisdiction-agnostic personal income tax computation engine."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.3",
]

[project.urls]
Repository = "https://github.com/The-Pied-Piper/tax_calculator"
Issues = "https://github.com/The-Pied-Piper/tax_calculator/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tax_calculator = ["jurisdictions/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
